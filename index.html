<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲームひろば</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#120818;--win1:#3a1a58;--win2:#160a2c;--line:#e8e8ff;--line2:#b890ff;--gold:#f8d820;--txt:#fff;--dim:#c0b0e8;
--font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);padding:24px 16px}
main{max-width:560px;margin:0 auto}
h1{color:var(--gold);font-weight:normal;text-align:center;font-size:30px;text-shadow:3px 3px 0 #402080;margin:16px 0 24px}
a.game{display:block;text-decoration:none;color:var(--txt);padding:14px 16px;margin:12px 0;border:2px solid var(--line);border-radius:4px;
background:linear-gradient(180deg,var(--win1),var(--win2));box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--line2)}
a.game:hover,a.game:focus-visible{outline:2px solid var(--gold)}
a.game b{font-weight:normal;font-size:20px;color:var(--gold)}
a.game small{display:block;color:var(--dim);font-size:13px;margin-top:4px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>ゲームひろば</h1>
<a class="game" href="crossman/"><b>クロスマン</b><small>時をかける信仰史　キリスト教編 〜聖書をめぐる旅〜</small></a>
</main>
</body>
</html>
