 res:"七福神巡りは、江戸の人々の、正月の楽しみになった。歩いて社寺をまわり、福を授かる。\n5人は、先輩たちに挨拶をして、宝船の絵を一枚、大事に持ち帰った。\nテンジン「ばらばらな者が、同じ船に乗って、長く愛される。…ええ船になろうや。」\n神と仏、日本とインドと中国。出身のちがう神々が一隻の船に乗る姿は、神仏習合の歩みのひとつの姿として語られる。\n（※七福神の顔ぶれが、江戸時代の初めにほぼ定まったという点は、まだ出典で確かめていない。）",
 memo:[{k:"史実",t:"七福神は、七という聖数に合わせて、現世利益を願う町人たちがまとめたと考えられている。室町時代の応永27年（1420年）には、伏見で七福神をかたどった風流行列が行われた記録がある。",s:"目黒区（公式）「七福神」"},
       {k:"伝承",t:"七福神の出身は、日本（恵比寿）、インド（毘沙門天・大黒天・弁財天）、中国（福禄寿・寿老人・布袋）。布袋は、五代後梁の禅僧・契此の姿を写したとされる。インド由来の三柱は、仏教とともに日本に入り、平安時代から福徳の神として信仰された。",s:"目黒区（公式）「七福神」"},
       {k:"史実",x:"未確認",t:"「福禄寿・寿老人は中国の道教系」という説明は、よく語られるが、確かめた公式資料には、「中国」とあるだけで、道教系とは書かれていない。また、「七福神の顔ぶれが江戸時代の初めにほぼ定まった」という点も、公式資料では、まだ確かめていない。",s:"（出典未確認）"},
       {k:"史実",x:"諸説",t:"谷中七福神は、江戸時代中期の宝暦年間（1751〜1764年）に始まり、江戸では最も古い七福神巡礼といわれる。順路は、東覚寺・青雲寺・修性院・長安寺・天王寺・護国院・不忍池辯天堂。一方、目黒区の解説では、七福神巡りは、江戸後半の文化文政のころ、風流人たちが春の行楽を兼ねて巡ったのが始まりとされる。始まりの時期は、資料によって説明が異なる。",s:"台東区（公式観光情報）「谷中七福神詣り」／目黒区（公式）「七福神」"},
       {k:"史実",t:"隅田川七福神は、江戸文化年間に、向島百花園に集う文化人たちによって創案され、初春の行楽として盛んになった。",s:"墨田区（公式）報道資料"},
       {k:"史実",x:"未確認",t:"隅田川七福神の創案に、大田南畝（蜀山人）らがかかわったこと、文政元年（1818年）ごろに始まったこと、三囲神社を含むことは、よく語られるが、確かめた墨田区の資料には、「江戸文化年間」とあるだけで、人名や年は書かれていない。",s:"（出典未確認）"},
       {k:"史実",t:"江戸時代には、初夢を見るために、宝船の絵に歌を書き添えて、枕の下に敷いて寝る習わしがあった。歌は、「なかきよの とおのねふりの みなめさめ なみのりふねの おとのよきかな」で、上から読んでも下から読んでも同じになる回文。宝船の絵を売り歩く商人は、元日の風物詩だった。",s:"目黒区（公式）「七福神」"},
       {k:"史実",t:"目黒・白金の山手七福神は、天保9年（1838年）発刊の『東都歳事記』に、すでに記録がある。",s:"目黒区（公式）「七福神」"},
       {k:"史実",x:"諸説",t:"出身のちがう神々が一隻の宝船に乗る姿を、神仏習合の到達点のひとつと見る説明もある。これは、後世の見方で、当時の人々がそう意識していたかどうかは、わからない。",s:"（出典未確認）"}]},
{key:"ebisu",nw:1,theme:"えびす信仰と、十日戎",per:"江戸時代",arr:"兵庫・西宮。1月の宵、西宮神社の境内は、人、人、人。笹の枝が、あちこちで揺れている。\nテンジン「ここは、えびす宮の総本社や。十日戎は、1月9日が宵えびす、10日が本えびす、11日が残り福。三日間、にぎわうんや。」\nイナリ「えびす…さん。さっきの七福神の、恵比寿さんと、どう違うんや？」\nテンジン「同じ神さんや。『えびす』は、夷、戎、蛭子、恵比寿…と、いろんな字で書かれるんや。」\nミナカタ「ほな、七福神のえびすさんの、本家ってことか！」\nどこからか、「商売繁盛で、笹もってこい！」の声が、響いてきた。",sp:[1500,5600,2000,2200,1900,2100],f:"inari",sc:"m19",era:"江戸時代の十日戎へ",place:"西宮神社・今宮戎神社（兵庫県・大阪府）",mk:"nishinomiya",best:"minakata",bs:"走るんやったら、任せとき！",
 intro:"えびすは、漁と市場の神として古くから信仰され、室町時代に七福神の一柱に加わった。商人たちは、えびすを祀る「えびす講」をつくり、江戸時代には、西宮神社と今宮戎神社の十日戎が、大きなにぎわいを見せた。\n\nジンジャーマンは、十日戎の西宮を訪れた。",
 pol:"十日戎のにぎわいの中で、どうする？",
 ch:[{l:"七福神の恵比寿と、同じ神かどうか確かめる",sc:2,t:"七福神の恵比寿と、えびす宮の「えびす」は、同じ神だ。「えびす」には、夷・戎・蛭子・恵比寿など、いくつもの書き方がある。\n西宮神社では、神話の蛭子（蛭児）大神と同じ神として、えびすを崇敬してきた。"},
     {l:"今宮戎の福笹に、吉兆を付けてもらう",sc:1,t:"今宮戎神社では、笹のお渡し所で笹を受け取り、福娘たちが、授かった御札や吉兆を、笹に結んでくれる。吉兆は、神社では古くから「小宝」と呼ばれる。\nあわびのし、銭叺、小判、米俵、鯛などを、ひとまとめにしたものだ。"},
     {l:"開門を待つ人々の列に並ぶ",sc:1,t:"西宮神社では、1月9日の深夜、すべての門を閉じる「忌籠」のあと、10日の朝、開門を待つ人々が、本殿を目指して走る。\nハチマン「…走るのか。」\nミナカタ「ワシは、全力で行くで！」\n人の波に押されて、5人は、あっという間に、拝殿の前へ運ばれた。"}],
 res:"5人は、笹の枝をひとつずつ授かって、境内のにぎわいを見渡した。\n福男に選ばれるのは、ほんの数人。けれど、福は、奪い合うものではない。手を合わせて、授かるものだ。\nミナカタ「…一番は、取られへんかったけど、ええ笹、もらえたわ。」\nイナリ「走らんでも、福は、ちゃんと来るもんやな。」\nなお、東京の「恵比寿」という地名は、江戸時代ではなく、明治になってヱビスビールの工場と出荷用の駅ができたことに由来する。",
 memo:[{k:"伝承",t:"えびすさまは、大阪湾で見つかった御神像を、鳴尾の漁師が拾い上げて自宅で祀り、御神託によって西宮に遷し祀られたのが起源と伝わる。",s:"西宮神社（公式）「西宮神社について」"},
       {k:"史実",t:"「えびす」の漢字には、夷・蛮・戎・狄などが当てられ、異郷の人をあらわす。西宮神社では、神話上の蛭子（蛭児）大神とえびすさまを、同じ神として崇敬してきた。室町時代には、福の神の代表として、七福神の一神になった。",s:"西宮神社（公式）「西宮神社について」"},
       {k:"史実",x:"未確認",t:"七福神の「恵比寿」の表記は、一般に広く使われるが、西宮神社の公式ページでは確かめていない。",s:"（出典未確認）"},
       {k:"史実",t:"江戸時代、大阪は商業の町として栄え、今宮戎神社も、商業を守る神として篤く崇敬された。十日戎の神事も、このころからにぎわい、延宝3年（1675年）の大阪案内図『葦分舟』にも、その様子が描かれている。大阪では江戸時代から、1月9日を宵戎とし、雑喉場魚市場が大鯛を奉納して、大漁と商売繁盛を祈願するのが吉例とされた。",s:"今宮戎神社（公式）「十日戎」"},
       {k:"史実",t:"今宮戎神社の福笹に付ける「吉兆」は、神社では古くから「小宝」と呼ばれる。あわびのし、銭叺、小判、米俵、鯛などをひとまとめにしたもので、野の幸・山の幸・海の幸を象徴する。笹は十日戎の期間に無料で授与され、福娘などが、御札や小宝を笹に結ぶ。笹にはお祓いをするが、御魂は込められておらず、御魂が込められているのは、神社から授与される御札と小宝だ。",s:"今宮戎神社（公式）「十日戎」「福笹授与について」"},
       {k:"史実",x:"未確認",t:"十日戎の日程（1月9日が宵えびす、10日が本えびす、11日が残り福）と、境内に響く「商売繁盛で笹もってこい」の掛け声は、一般の解説にもとづく。確かめた神社公式のページでは、日程の全体と掛け声を、まだ確かめていない。",s:"（出典未確認：一般の観光解説）"},
       {k:"史実",t:"西宮神社の開門神事は、忌籠（いごもり）の風習により、1月9日の深夜12時に、境内のすべての門が閉じられ、10日の朝に開かれる神事。忌籠の風習は、鎌倉時代の文献にも見られる。",s:"西宮神社（公式）「開門神事の歴史」"},
       {k:"史実",x:"未確認",t:"福男選びが、江戸時代ごろから自然発生的に始まったとする説明は、神社公式の「開門神事の歴史」では確かめられない。公式の説明では、昭和13年（1938年）に、一番乗りが同着になったことなどから、世間が「福男」と称えたのが始まりとされ、昭和15年（1940年）から上位三人を福男として認定するようになった。戦争末期の空襲で中止となり、昭和24年に、南門の新設を機に復活した。",s:"西宮神社（公式）「開門神事の歴史」"},
       {k:"史実",x:"未確認",t:"いま：現在の福男選びの運営方式（参加の受付や抽選など）は、現代の運営の形で、江戸時代の姿ではない。詳しい方式は、まだ公式で確かめていない。",s:"（出典未確認）"},
       {k:"史実",t:"明治時代：1890年（明治23年）に「恵比寿ビール」が誕生し、1901年（明治34年）には、ビールの出荷用に「恵比寿停車場」という荷扱い専用の駅ができた。1906年（明治39年）に旅客駅の「恵比寿駅」が開業し、1928年（昭和3年）に、地名として「恵比寿通」が初めて使われた。東京の恵比寿の地名は、江戸時代ではなく、明治以降に、ヱビスビールにちなんで生まれたものだ。",s:"サッポロビール（公式）「ヱビスブランドヒストリー」"}]},
{key:"okage1830",theme:"おかげ参りの大行列",per:"江戸時代",arr:"伊勢へ続く道は、人、人、人。おかげ参りの大行列だ。\n阿波国の手習いの子どもたちも、そろって旅立ったと記録されている。道ばたでは、旅人に食べ物や宿をふるまう人々の姿も見える。\nアマテ「なんと、にぎやかな…！ これほど多くの人が、伊勢を目指しておるとは。」\nイナリ「アマテ、顔がゆるんでるで。」\nアマテ「ゆ、ゆるんでなどおらぬ。…いや、少しゆるんでおるかもしれぬ。」\nミナカタ「ほら、そこの子ら、迷子になったらあかんで！ ワシの後ろ、ついてきい。」\nテンジン「手習いの子らか。旅も、ええ勉強になるやろな。」\nハチマン「…列が長い。はぐれるな。」\n柄杓を手にした旅人が、笑顔で通りすぎていった。\nアマテ「さあ、皆。伊勢まで、もう少しじゃ。」",sp:[2600, 7700, 3800, 4100, 2600, 2800],f:"amate",sc:"k17",era:"文政13年（1830年）",place:"伊勢（三重県）",mk:"ise",best:"amate",bs:"伊勢参りなら、わらわが先導しよう。",
 intro:"江戸時代、ほぼ60年ごとに、大勢の庶民が伊勢の神宮へ押し寄せた。「おかげ参り」だ。\n1830年3月には、阿波国（徳島）の手習いの子どもたちが、そろって伊勢へ旅立った、と記録される。\n\nジンジャーマンは、この大行列に加わった。",
 pol:"おかげ参りの道中で、どうする？",
 ch:[{l:"柄杓を持って旅する",sc:2,t:"道沿いの町や村では、宿や食事を無償でふるまう「施行」が行われた。\n柄杓を差し出すと、もてなしを受けられたという。"},
     {l:"伊勢講の積立をする",sc:1,t:"庶民は「伊勢講」をつくり、毎月お金を積み立てて、旅の資金とした。\n全員は行けないので、代表をくじで選んで参詣に向かった。"},
     {l:"着の身着のまま旅立つ",sc:1,t:"講に入れない人が、着の身着のままで出かけることもあった。\nお伊勢参りとわかれば、周りの人が何かと世話をしてくれたという。"}],
 res:"おかげ参りは、ほぼ60年ごとに起きた。文政のおかげ参りでは、半年の間に約500万人が伊勢を訪れたといわれる。",
 memo:[{k:"史実",t:"おかげ参りは、ほぼ60年周期で起きた。慶安3年（1650年）、宝永2年（1705年）、明和8年（1771年）、文政13年（1830年）のものが、よく知られる。",s:"『神社のいろは』p.160（神社検定公式テキスト）"},
       {k:"史実",t:"道中では「施行」が行われ、柄杓を差し出すと、宿や食事の提供を受けられた。",s:"生駒市（文化財資料）"},
       {k:"史実",t:"文政のおかげ参りは、1830年3月20日、阿波国徳島の手習いの子ども二、三十人の参宮から始まったと記録される（『御蔭参宮文政神異記』）。",s:"愛知大学の論文"},
       {k:"史実",x:"諸説",t:"宝永のおかげ参りでは2カ月の間に362万人、文政では半年の間に約500万人が参宮したといわれる。",s:"『神社のいろは』p.160（神社検定公式テキスト）"}]},
{key:"inari1834",nw:1,theme:"江戸に広がる稲荷",per:"江戸時代",arr:"江戸。大名屋敷の庭にも、町家の裏庭にも、長屋の路地にも、小さな赤い鳥居が見える。\nイナリ「な、なんやこれ…。ワシの分社、多すぎへんか？」\nテンジン「江戸は、稲荷さんだらけや、言われとるそうや。」\n路地の奥から、眷属の狐たちが、ぞろぞろと現れた。\n眷属の狐「イナリさま、ようこそ！ こちらにも、お社がございます！」\nイナリ「ちょ、ちょっと待ち。挨拶まわりが、終わらへんやん！」\nハチマン「…数えるのは、やめておけ。」",sp:[3000,7720,3810,4110,2610,2810],f:"inari",sc:"m18",era:"天保5年（1834年）ごろ",place:"江戸の町・王子稲荷神社（東京都）",mk:"tokyo",best:"inari",bs:"ワシの出番や。挨拶まわり、気張るで！",
 intro:"伏見稲荷で始まった稲荷信仰は、江戸時代に、爆発的に広がった。大名屋敷や町家に祀る「屋敷稲荷」や、町内の小さな祠まで、江戸の稲荷は、数えきれない数になった。\n\nジンジャーマンは、江戸の町なかと、王子稲荷神社を訪れた。",
 pol:"稲荷だらけの江戸で、どうする？",
 ch:[{l:"屋敷稲荷と、町内の小さな祠をまわる",sc:2,t:"大名屋敷の庭にも、町家の裏庭にも、長屋の路地にも、稲荷が祀られた。\n眷属の狐「イナリさま、こちらにも、どうぞ！」\nイナリ「ちょ、ちょっと待ち…。次の祠で、まだ着いてへんやん！」"},
     {l:"稲荷の番付を、のぞいてみる",sc:1,t:"江戸の有名な稲荷を、人気順に並べた番付が出まわったと伝わる。\nイナリ「…ワシの社は、どのへんに載っとるんや。」\nテンジン「気にしとるやん。」\nイナリ「き、気にしてへんわ！」\nイナリは、番付の端から端まで、じっと目をこらした。"},
     {l:"王子稲荷神社で、大晦日の狐火の話を聞く",sc:2,t:"王子稲荷神社は、古くから関東の稲荷の総司とされる。\n大晦日の夜、稲荷の使いの狐たちが、東日本各地から王子に集まり、近くの榎の下で身支度を整えてから、初詣に向かったと伝わる。この榎は、「装束榎」と呼ばれた。"}],
 res:"伏見稲荷で始まり、全国に広がった稲荷信仰は、江戸で、町のすみずみまでいきわたった。\n神さまの祠が、暮らしのすぐそばにある。それが、江戸の稲荷だった。\nイナリ「…ワシの分社と眷属、みんなに挨拶して、へとへとや。」\nイナリ「せやけど、こんだけ愛されとると思うたら、悪い気は、せえへんな。」\nハチマン「…顔が、ゆるんでいる。」",
 memo:[{k:"史実",t:"徳川家康が江戸に入ったのは、天正18年（1590年）。江戸の町は急速に成長し、上方から商人が移り住んで、稲荷は、農業の神に加えて、商業の神としても信仰された。",s:"稲荷信仰についての解説（神社関連の英文資料）／『神社のいろは』（神社検定公式テキスト）"},
       {k:"史実",t:"多くの家が、庭に小さな祠をつくり、稲荷を屋敷神として祀った（屋敷稲荷）。家の中の小さな祭壇や棚に祀る例もあり、その数は、推測するしかない。",s:"稲荷信仰についての解説（神社関連の英文資料）"},
       {k:"史実",t:"「江戸名物、伊勢屋、稲荷に犬の糞」は、江戸でどこにでも見られるものを並べた、江戸の言い回し。伊勢屋という屋号の店、稲荷の祠、犬の糞が、町のどこにでもあるものの代表として並べられた。稲荷の祠が町じゅうにあったことをあらわす言葉で、稲荷を軽んじる意味ではない。",s:"稲荷信仰についての解説（神社関連の英文資料）"},
       {k:"史実",x:"未確認",t:"天保5年（1834年）の『祠曹雑識』に、江戸の有名な稲荷106社の番付が載ること、裏長屋の小祠まで含めると4,000社以上にのぼったともいわれることは、よく語られるが、原典や神社関連の資料では、まだ確かめていない。",s:"（出典未確認）"},
       {k:"伝承",t:"王子稲荷神社は、古くから「関東稲荷総司」とされ、江戸時代には幕府の祈願所のひとつに定められた。大晦日の夜、稲荷の使いの狐たちが、東日本各地から王子に集まり、近くの榎の下で身支度を整えてから初詣に向かったと伝わり、この榎は「装束榎」と呼ばれた。",s:"nippon.com「王子装束ゑの木大晦日の狐火」（神社公式の説明は、まだ確かめていない）"},
       {k:"史実",t:"歌川広重の『名所江戸百景』第118景「王子装束ゑの木大晦日の狐火」は、狐たちが装束榎の下に集まり、口から狐火を出す場面を描いている。",s:"nippon.com「王子装束ゑの木大晦日の狐火」"},
       {k:"史実",t:"いま：昭和初期の道路拡張で、もとの装束榎は切り倒された。のちに新しい榎が植えられ、横に装束稲荷神社が建てられた。1993年に始まった「王子 狐の行列」は、大晦日から元日にかけて、装束稲荷神社から王子稲荷神社へ向かう。",s:"nippon.com「王子装束ゑの木大晦日の狐火」"},
       {k:"史実",x:"諸説",t:"江戸の稲荷信仰を、伏見稲荷から始まった信仰の「完成形」と見る見方は、このゲームの位置づけで、公式の説明ではない。",s:"（ゲームの位置づけ）"}]},
{key:"shinbutsu1868",theme:"神仏分離と、男山の変化",per:"江戸時代末期（幕末）",arr:"男山の石段を登ると、あちこちで建物を取り壊す音がしていた。\n明治の新政府は、神社と寺を分ける政策を進めている。長く続いた神仏習合の信仰が、大きく変わろうとしているのだ。\nハチマン「……。」\nイナリ「ハチマン？」\nハチマン「…ここには、多くの坊舎があった。僧たちも、八幡神に仕えていた。」\nテンジン「時代が変わるいうことは、何かが失われることでもあるんやな。」\nミナカタ「なんや、胸がきゅっとするわ…。」\nアマテ「失われるものを、しかと見て、覚えておこう。」\n一人の僧が、深く頭を下げて、山を下りていった。ハチマンは、その背中を、いつまでも見送っていた。\nミナカタは、黙って、ハチマンの肩に手を置いた。\nイナリ「…ハチマン。」\nハチマン「…大丈夫だ。行こう。」",sp:[3400, 9500, 4700, 5200, 3100, 3200],f:"hachiman",sc:"k18",era:"慶応4年（1868年）",place:"石清水八幡宮（京都府）",mk:"iwashimizu",best:"hachiman",bs:"…八幡大菩薩と呼ばれた時代の、終わりか。",
 intro:"1868年、明治の新政府は、神社と寺を分ける政策を進めた。\n長く続いた神仏習合の信仰が、大きく変わろうとしている。\n\nジンジャーマンは、男山の石清水八幡宮を訪ねた。",
 pol:"男山で、何を見届ける？",
 ch:[{l:"坊舎の行方を記録する",sc:2,t:"男山には、神仏習合のもとで多くの坊舎があり、「男山四十八坊」と呼ばれた。\n明治の初め、神仏分離政策の影響で撤去された。"},
     {l:"布告の中身を読む",sc:1,t:"慶応4年（1868年）3月、「神仏判然」が命じられた。\n別当や社僧が神社の祭祀に携わることが禁じられ、「大菩薩」や「権現」など、仏教に基づく神号も廃止された。"},
     {l:"各地の様子を聞く",sc:1,t:"地域によっては、政府の通達とは異なり、仏像や堂を打ち壊すなど、過激な廃仏毀釈が行われた。"}],
 res:"神と仏を分ける政策で、長く続いた神仏習合は大きく変わった。一方で政府は、「神仏分離は廃仏毀釈ではない」とも説明している。",
 memo:[{k:"史実",t:"慶応4年（1868年）3月、神仏判然が命じられ、別当・社僧が神社の祭祀に携わることの禁止、大菩薩・権現など仏教に基づく神号の廃止、神社内の仏像・仏塔などの除去が求められた。",s:"『神社のいろは 続』p.149（神社検定公式テキスト）／滋賀県（県政史料室）"},
       {k:"史実",x:"諸説",t:"一部の地域では、通達とは異なり、仏像や堂を打ち壊す過激な廃仏毀釈が行われた。どこまで厳格に実行されたかは、地域ごとの検証が必要とされる。",s:"『神社のいろは 続』p.150（神社検定公式テキスト）／滋賀県（県政史料室）"},
       {k:"史実",t:"石清水八幡宮の男山四十八坊は、明治初年の神仏分離政策の影響で撤去された。",s:"奈良文化財研究所の報告書"},
       {k:"史実",t:"石清水八幡宮の本社10棟などは、平成28年（2016年）2月9日、国宝に指定された。",s:"石清水八幡宮（公式）"}]},
{key:"konpira1868",nw:1,theme:"金毘羅大権現から、金刀比羅宮へ",per:"江戸時代",arr:"香川・象頭山のふもと。江戸時代のこんぴらの町は、参詣の人々でにぎわっている。\nテンジン「ここが、こんぴらさんや。『一生に一度は、こんぴら参り』と言われるほど、人気やったそうや。」\nミナカタ「祭神は、大物主神やろ。大国主の和魂（にぎみたま）、いわば親父の、もうひとつの顔や。」\nミナカタ「親父の和魂なら、ワシに優しいはずや。ええ迎え方、してくれるやろ！」\nイナリ「えらい、期待しとるな。」\nところが、待っていたのは、長い、長い石段だった。\nテンジン「御本宮まで、785段や。」\nミナカタ「…は？」\nハチマン「…黙って登れ。」\nアマテ「無言の試練、というものかのう。」\n石段のわきの建物に、『金毘羅大権現』の文字が見える。\nテンジン「この神さんは、昔は『金毘羅大権現』と呼ばれて、仏教の守り神とも結びついとったんや。」\nイナリ「牛頭天王さんと、同じ流れやな。」\nテンジン「せや。これも神仏習合の、ひとつの形や。」\n時は流れ、明治元年（1868年）。『金毘羅大権現』の看板が、下ろされていく。\n金毘羅大権現「…今日から、この名は使えんのか。そう言われても、急には、なじめんのだが。」\nハチマン「…またか。気持ちは、分かる。」\nアマテ「みな、急な名の変更に、戸惑っておるのじゃな。」\nイナリ「…神さんも、人も、てんやわんやや。」\n石段のわきでは、僧と神職が、どちらも荷物を抱えて、行き交っていた。だれにも、悪気はない。",sp:[3430,9560,4730,5250,3130,3230],f:"minakata",sc:"m13",era:"明治元年（1868年）の神仏分離まで",place:"金刀比羅宮（香川県）",mk:"kotohira",best:"minakata",bs:"親父の和魂のところか…。ちょっと、緊張するわ。",
 intro:"江戸時代、こんぴらさんは「金毘羅大権現」と呼ばれ、人々の参詣でにぎわった。明治元年（1868年）、神仏分離で、その名は改められ、金刀比羅宮となった。\n\n神仏習合の、もうひとつの形を見に、ジンジャーマンは、象頭山のふもとを訪れた。",
 pol:"長い石段の前で、どうする？",
 ch:[{l:"黙って、一段ずつ登る",sc:2,t:"表参道から御本宮までは、全785段。人々は、この石段を、一歩ずつ登ってお参りした。"},
     {l:"金毘羅大権現の名の由来を聞く",sc:2,t:"中世以降、本地垂迹説の影響で、「金毘羅大権現」と呼ばれるようになった。\n神と仏が結びついた、神仏習合の時代の名前だ。"},
     {l:"旭社（金堂）の前で足を止める",sc:1,t:"江戸時代に「金堂」と呼ばれた旭社は、約40年かけて、弘化2年（1845年）に落成した。明治の神仏分離のあと「旭社」と改め、一部を神式に改装した。"}],
 res:"御本宮にたどり着いたミナカタは、讃岐平野と瀬戸内海を見渡した。\nミナカタ「…親父は、いつもここから、海を見とったんか。」\nミナカタは、しばらく、静かだった。\n習合の時代の「金毘羅大権現」も、分離のあとの「金刀比羅宮」も、人々は、海の安全を、ここで祈り続けた。祇園の牛頭天王編と、神道国教化編に続く、もうひとつの習合と分離の物語だ。",
 memo:[{k:"史実",t:"御本宮の御祭神は、大物主神と崇徳天皇。古来、農業・殖産・医薬・海上守護の神として仰がれる。",s:"金刀比羅宮（公式）「ご参拝案内」"},
       {k:"神話",x:"未確認",t:"大物主神は、大国主神の和魂（幸魂・奇魂）とされる。",s:"『日本書紀』神代上（一書）・『古事記』上巻（金刀比羅宮公式での説明は、まだ確かめていない）"},
       {k:"史実",t:"表参道から御本宮までの石段は、全785段。奥社（厳魂神社）までは、表参道から全1,368段。",s:"金刀比羅宮（公式）「ご参拝案内」「奥社」"},
       {k:"史実",t:"中古（中世）以降、本地垂迹説の影響で「金毘羅大権現」と改称した。江戸時代の宝暦3年（1753年）に勅願所とされ、宝暦10年（1760年）に「日本一社」の綸旨を賜った。",s:"金刀比羅宮（公式）「歴史」"},
       {k:"伝承",t:"保元の乱（1156年）のあと、崇徳天皇が讃岐で金毘羅大権現を崇敬し、境内の「古籠所」に参籠したとされる。",s:"金刀比羅宮（公式）「歴史」「奥社」"},
       {k:"史実",t:"永万元年（1165年）、崇徳天皇の神霊を迎え、御本社の相殿に奉斎した。",s:"金刀比羅宮（公式）「歴史」"},
       {k:"史実",x:"未確認",t:"「金毘羅」は、インドのガンジス川にすむワニを神格化した仏教の守護神クンビーラに由来するとされる。もとは真言宗象頭山松尾寺の堂宇の一つとして金毘羅大権現を祀り、別当の金光院が奉斎したという。",s:"（出典未確認：金刀比羅宮公式の説明では、まだ確かめていない）"},
       {k:"史実",t:"明治元年（1868年）、神仏混淆が廃止され、元の琴平神社に戻った。同年7月に宮号を授けられ、「金刀比羅宮」に改称した。「金毘羅大権現」の名は、廃された。",s:"金刀比羅宮（公式）「歴史」"},
       {k:"史実",t:"旭社は、江戸時代には「金堂」と呼ばれ、全国からの寄進で約40年をかけて、弘化2年（1845年）に落成した。神仏分離令のあとに「旭社」と改め、一部を神式に改装した。建物の構造や木彫装飾は、当時の姿を残している。",s:"金刀比羅宮（公式）「旭社」"},
       {k:"史実",x:"未確認",t:"最後の別当だった琴陵宥常は、還俗して金刀比羅宮の初代宮司になったとされる。旭社では、神仏分離で仏壇が取り除かれ、神座に改められたという。細かな点は、まだ確かめていない。",s:"（出典未確認）"},
       {k:"史実",x:"未確認",t:"金刀比羅宮が全国の金刀比羅神社の総本宮であること、江戸時代に「一生に一度は、こんぴら参り」と言われて庶民の参詣でにぎわったことは、よく語られるが、公式の資料では、まだ確かめていない。",s:"（出典未確認）"}]},
{key:"fujiko",nw:1,theme:"富士講と、山そのものへの信仰",per:"江戸時代",arr:"山梨・富士吉田。北口本宮冨士浅間神社の前を、白い衣の人々が、列をつくって歩いていく。\n江戸の町人たちが、講をつくって、富士山に登りにきたのだ。\nテンジン「これが、富士講や。『江戸は広くて八百八町、講は多くて八百八講』と言われるほど、流行ったんや。」\nイナリ「へえ！ ほな、富士山の神さんに、会いに行くんやな！」\nテンジン「…せやけど、山の上で、特定の神さんが待っとるわけやないんや。」\nイナリ「えっ。」\nテンジン「この人らにとって、拝む相手は、神社やなくて、富士山そのものなんや。」\nミナカタ「山そのものが、信仰の相手か…。」\nハチマン「…山に、頭を下げる。」\nアマテ「富士のお山は、ここから、よう見えるのう。」\n神社は、登山道の入口だ。人々は、ここで富士山の神様をお祀りする社に参拝してから、山へ向かう。\n御師の家に泊まった講の人々が、衣装をととのえ、列になって歩きだす。\n列の中に、ひときわ年季の入った講員がいる。\n講員「今日が、わしの、33回目の登拝じゃ。」\nイナリ「33回も！？」\nテンジン「回数を重ねて登る人も、おったんや。」\nミナカタ「回数を数えるんは、御朱印帳みたいやな。」",sp:[3460,9600,4760,5300,3160,3260],f:"amate",sc:"m15",era:"後期に大流行",place:"北口本宮冨士浅間神社・富士山（山梨県）",mk:"fuji",best:"amate",bs:"山そのものを拝む心か。ええのう。見せてもらおう。",
 intro:"江戸時代、江戸の町人たちは、講をつくって、富士山に登った。富士講の人々が拝んだのは、神社ではなく、富士山そのものだった。\n\nジンジャーマンは、富士山の北口を訪れた。",
 pol:"富士山の麓で、何をする？",
 ch:[{l:"講の人々と、いっしょに登る",sc:2,t:"講の人々は、御師の家に泊まって、富士山に登拝した。御師は、宿の世話だけでなく、教えの指導や祈祷など、富士信仰の世話をした。"},
     {l:"33回目の登拝を迎えた講員の話を聞く",sc:2,t:"回数を重ねて登ることは、信仰を積み重ねることでもあった。\n（※「33回登拝」の決まりがあったかどうかは、まだ出典で確かめていない。）"},
     {l:"富士塚に登ってみる",sc:1,t:"富士山を模した築山「富士塚」は、各地に築かれた。遠い富士山を、身近に拝むための場でもあった。江戸にいながら、富士に登ることができた。"}],
 res:"富士講の人々にとって、拝む相手は、富士山そのものだった。神社は、その山への入口。ジンジャーマンは、白い列を見送って、山に向かって、静かに頭を下げた。\nミナカタ「登った回数を数えるのは、旅の記録を重ねるのと、似とるな。」\nこのゲームの御朱印帳や称号も、積み重ねの記録だ。",
 memo:[{k:"史実",t:"富士講は、戦国時代に現れた長谷川角行（藤原角行・1541〜1646年）にはじまるとされ、江戸を中心に大流行した。",s:"北口本宮冨士浅間神社（公式）「富士講」"},
       {k:"伝承",t:"角行は、富士の人穴などで荒行を重ね、祈祷によって庶民を救ったとされる。苦行として、富士登山128回、御中道33回を成し遂げたという。",s:"北口本宮冨士浅間神社（公式）「富士講」"},
       {k:"史実",x:"諸説",t:"江戸では、「江戸は広くて八百八町、講は多くて八百八講。江戸に旗本八万騎、江戸に講中八万人」と言われるほど、富士講が盛んになった。",s:"北口本宮冨士浅間神社（公式）「富士講」"},
       {k:"史実",t:"富士講の人々は、御師の家に泊まって登拝した。御師は、宿舎の提供だけでなく、教えの指導や祈祷、各種の取次など、富士信仰の世話をした。北口（吉田）には、御師の町ができた。",s:"北口本宮冨士浅間神社（公式）「富士講」"},
       {k:"史実",t:"富士講が盛んになると、各地に浅間神社が祀られ、富士塚が築かれるようになった。",s:"北口本宮冨士浅間神社（公式）「富士講」「富士山について」"},
       {k:"史実",t:"富士講の人々にとって、信仰の対象は、神社そのものではなく、富士山そのものだった。北口本宮冨士浅間神社は、登山道の入口にあり、富士山の神様をお祀りする神社として参拝する。",s:"北口本宮冨士浅間神社（公式）「富士山について」"},
       {k:"史実",x:"未確認",t:"「富士山に33回登拝すれば大願成就」とされた、33回を達成した講社の碑が、登山道の入口に数多く建てられている、との説明がある。確かめた公式資料では、「33」は角行の御中道の回数として出てくるだけで、登拝回数の決まりや碑は、まだ確かめていない。",s:"（出典未確認）"}]},
{key:"kokkyoka1868",nw:1,theme:"神道国教化と、神々の改名ドタバタ",per:"明治時代",arr:"祇園の社の前を、看板をかけかえる職人と、仏像を運び出す僧が、行き交っている。\n明治元年（1868年）。新しい政府は、神と仏をはっきり分ける方針を示し、神社と寺を分ける動きが、一気に進んでいる。\nテンジン「これまで、神さんと仏さんは、同じお社や、お寺で、いっしょに祀られるのがふつうやった。それを、きっちり分けることになったんや。」\nイナリ「ほな、お社には、神さんだけ、いうことか？」\nテンジン「せや。祇園社も、名前を変えなあかんらしい。」\n社の前で、牛頭天王が、新しい看板を見上げて、首をかしげていた。\n牛頭天王「…今日から、わが名は『素戔嗚尊』と書く、と聞いたのだが。」\nミナカタ「神さんが、自分の名前で戸惑っとるで！」\nイナリ「ええと…牛頭天王さんと素戔嗚尊さんは、同じ神さんいうことやったな。」\nテンジン「せや。この時代の人は、そう信じとったんや。」\nハチマン「…俺も、昨日まで『大菩薩』と呼ばれていた身だ。気持ちは分かる。」\n坂の下の寺の前でも、僧たちが、荷物をまとめている。だれにも、悪気はない。ただ、変化があまりに急だった。\nアマテ「みな、急な話に、振り回されておるのじゃな。」\nイナリ「…神さんも、人も、てんやわんやや。」",sp:[3500,9650,4800,5350,3200,3300],f:"hachiman",sc:"m11",era:"明治元年（1868年）〜",place:"八坂神社（京都府）",mk:"gion",best:"hachiman",bs:"…名を急に変えられる気持ちは、俺にも分かる。",
 intro:"明治元年（1868年）、新しい政府は、神仏分離の方針を示した。祇園の社は、牛頭天王を祀る「祇園社」から、素戔嗚尊を祀る「八坂神社」になった。\n\nジンジャーマンは、牛頭天王編の続きを見届けに、祇園を再び訪れた。",
 pol:"急な制度変更に、どう向き合う？",
 ch:[{l:"神様の名前の変更を、見届ける",sc:2,t:"祇園社は、社名を八坂神社に改め、祭神は素戔嗚尊とされた。\n神仏分離で、仏像は近くの寺に預けられ、摂末社の仏教的な名前も改められた。"},
     {l:"寺の人たちの荷物を、いっしょに運ぶ",sc:2,t:"神仏分離をきっかけに、各地で廃仏毀釈の運動が起こり、仏教界は大きな打撃を受けた。\n失われたものがあったことも、忘れずに覚えておきたい。"},
     {l:"政府の方針を読む",sc:1,t:"政府は、祭政一致をめざして神祇官を置き、神道を国民の教えの中心にしようとした。\nしかし、その試みは、一枚岩には進まなかった。"}],
 res:"神仏分離で、人々も神々も、急な変化に振り回された。政府は、祭政一致と神道の国教化をめざしたが、その試みは一枚岩には進まず、形を変えながら続いていった。神社の側にも、仏教の側にも、それぞれの事情と、戸惑いがあった。",
 memo:[{k:"史実",t:"明治元年（1868年）、明治政府は、神仏分離の令を出した。",s:"文部科学省『学制百年史』（神仏分離・神祇官）"},
       {k:"史実",t:"神仏分離をきっかけに、全国で廃仏毀釈の運動が起こり、仏教界は大きな打撃を受けた。寺や仏像が失われるなどの混乱があった。",s:"文部科学省『学制百年史』"},
       {k:"史実",x:"未確認",t:"廃仏毀釈による被害は、地域によって大きく異なるといわれる。失われた寺や仏像の具体的な数は、まだ出典で確かめていない。",s:"文部科学省『学制百年史』（被害の数は未確認）"},
       {k:"史実",t:"祇園社は、慶応4年（明治元年・1868年）に、社名を「祇園感神院（祇園社）」から「八坂神社」に改めた。仏像は近隣の寺に預けられ、摂末社の仏教的な名前も改められた。祭神は素戔嗚尊とされた（古くは牛頭天王とも称した）。",s:"八坂神社（公式）「八坂神社の歴史」「八坂神社について」"},
       {k:"史実",t:"明治政府は、祭政一致の方針で神祇官を置き、神道を国民の教えの中心にしようとした。仏教や神道の諸教派の力も借りて、教導職を置いて国民教化を進めたが、一枚岩には進まなかった。",s:"文部科学省『学制百年史』／國學院大學「Encyclopedia of Shinto」"},
       {k:"史実",x:"未確認",t:"明治3年（1870年）の「大教宣布」など、神道にもとづく国民教化の試みが続いた。年代や内容は、まだ出典で確かめていない。",s:"（出典未確認）"}]},
{key:"kumano1889",theme:"十津川の大水害と、熊野本宮の遷座",per:"明治時代",arr:"雨が、やまない。熊野川は、茶色い濁流となって、うなりをあげていた。\n1889年8月、紀伊半島の南部を、集中豪雨が襲った。川のほとりの大斎原に建つ熊野本宮大社にも、水が迫っている。\nミナカタ「水の神さんにゆかりの名にかけて…。この水、なんとかせな！」\nハチマン「…無理をするな。まずは、人と、神々を高い所へ。」\nイナリ「村の人らは、無事なんか？」\nテンジン「十津川のほうは、もっとひどいらしい…。」\nアマテ「皆、手を貸してくれ。急ごう。」\nずぶ濡れの一行の上を、黒い影が横切った。カラスだ。雨の中なのに、まっすぐ高台のほうへ飛んでいく。\nイナリ「…あっちや。あのカラス、道を教えてくれてる！」\nミナカタ「よっしゃ、行くで！ 足元に気いつけや！」",sp:[3600, 9800, 4900, 5500, 3300, 3400],f:"kumanon",sc:"k19",era:"明治22年（1889年）",place:"熊野（和歌山県）",mk:"kumano",best:"minakata",kumano:true,bs:"水と風の神さんの名を持つワシや！ 任しとき！",
 intro:"1889年8月、紀伊半島の南部を、集中豪雨が襲った。\n熊野川のほとり、大斎原に建つ熊野本宮大社に、水が迫る。\n\nジンジャーマンは、熊野へ急いだ。",
 pol:"大水害の熊野で、どうする？",
 ch:[{l:"残った社殿を高台に遷す",sc:2,t:"流出を免れた上四社は、2年後の1891年3月、今の高台に遷された。"},
     {l:"旧社地に神々を祀る",sc:1,t:"流出した中四社・下四社と、境内の摂末社は、旧社地の2基の石祠に祀られている。"},
     {l:"被災した人々を助ける",sc:1,t:"十津川村だけで、死者168人。\n家や土地を失った600戸・約2,500人は、新天地を求めて、北海道へ集団で移り住んだ。"}],
 km:"…本宮の神々を、高台へ。急ぐぞ。",
 res:"かつての本宮は、今の8倍の規模だったという。旧社地の大斎原には、今、高さ約34mの大鳥居が立っている。",
 memo:[{k:"史実",t:"明治22年（1889年）8月の大水害で、熊野本宮大社は、中・下社の社殿が倒壊・流出した。",s:"熊野本宮大社（公式）／国土交通省 近畿地方整備局"},
       {k:"史実",t:"明治24年（1891年）3月、流出を免れた上四社が、今の高台に遷座した。流出した社の神々は、旧社地・大斎原の2基の石祠に祀られている。",s:"国土交通省 近畿地方整備局（熊野川の展示パネル）"},
       {k:"史実",t:"旧社地・大斎原には、高さ約34mの大鳥居が立つ。",s:"熊野本宮観光協会"},
       {k:"史実",t:"平成16年（2004年）7月、熊野三山と熊野古道を含む「紀伊山地の霊場と参詣道」が、世界遺産に登録された。",s:"和歌山県（公式）"}]},
{key:"goshi1906",theme:"神社合祀と、鎮守の森",per:"明治時代",arr:"紀伊の森に、斧の音が響いている。\n神社をまとめて数を減らす「神社合祀」によって、小さな神社が、次々とほかの神社に合わせて祀られ、鎮守の森が切られていくのだ。\nミナカタ「この森、何百年もかけて育ったんやろなあ…。」\nテンジン「南方熊楠さんいう学者さんが、鎮守の森の大切さを訴えてはるんや。」\nイナリ「南方さん…。ミナカタと、同じ読みやな。」\nミナカタ「せや！ なんや、他人とは思われへん。会いに行こ！」\nハチマン「…森を守るには、言葉が要る。力だけでは、足りない。」\nアマテ「うむ。人の心を動かす、まっすぐな言葉が要るのう。」\nかつて祠があった場所には、小さな石だけが残されていた。ミナカタは、その前に、そっとしゃがみこんだ。",sp:[2900, 7900, 4000, 4500, 2650, 2700],f:"kumanon",sc:"k20",era:"明治39年（1906年）〜",place:"紀伊（和歌山県）",mk:"tanabe",best:"minakata",bs:"南方さんと、同じ名前や！ ワシが行く！",
 intro:"明治39年（1906年）から、神社をまとめて数を減らす「神社合祀」が、地域によっては激しく進められた。\n小さな神社は、ほかの神社に合わせて祀られ、鎮守の森が切られていく。\n和歌山の博物学者・南方熊楠は、これに強く反対した。\n\nジンジャーマンは、熊楠のもとを訪ねた。",
 pol:"神社合祀に、どう向き合う？",
 ch:[{l:"熊楠と、反対の声を上げる",sc:2,t:"熊楠は、合祀に反対する意見を書き、鎮守の森の大切さを訴えた。\n民俗学者の柳田國男とも、親交があった。"},
     {l:"合祀のねらいを調べる",sc:1,t:"神社合祀は、内務省が主導した「地方改良運動」とも連動していた。\n合祀した神社を、町や村の中心にしようとする狙いもあったといわれる。"},
     {l:"御神木の前に座り込む",sc:0,t:"御神木の巨木は、次々に切り倒されていった。\n…一人の力では、止められない。"}],
 res:"府県社以下の神社は、約19万社から約13万社に整理され、全国の神社の数は60パーセントほどに減ったという。合祀は、大正9年（1920年）、貴族院で「神社合祀無益」の決議がなされて、終息した。",
 memo:[{k:"史実",t:"明治39年から43年（1906〜1910年）にかけて、地域によっては激しい神社合祀が行われ、府県社以下の神社は、約19万社から約13万社へと整理された。",s:"『神社のいろは 続』p.156（神社検定公式テキスト）"},
       {k:"史実",t:"神社合祀の結果、全国の神社の数は、60パーセントほどに減少した。",s:"『神社のいろは 続』p.157（神社検定公式テキスト）"},
       {k:"史実",t:"博物学者・生物学者の南方熊楠は、神社合祀に反対し、生態系などの面から「鎮守の森」の重要性に注目した先駆者とされる。",s:"『神社のいろは 続』p.156-157（神社検定公式テキスト）"},
       {k:"史実",t:"大正9年（1920年）、貴族院で「神社合祀無益」の決議がなされ、神社合祀は終息した。",s:"南方熊楠記念館（公式）"}]},
{key:"meijijingu1920",nw:1,theme:"人の手でつくる、100年先の森",per:"大正時代",arr:"東京・代々木。大正9年（1920年）、鎮座を前にした境内には、若い木々が、何列にも並んでいた。\nここに、明治天皇と昭憲皇太后をお祀りする神社が、できるのだ。\nテンジン「ここは、もともと、ほとんど木のない原野やったそうや。」\nイナリ「えっ！ ほな、この森は、全部、人が植えたんか？」\nテンジン「せや。全国から、約10万本の木が集まったんや。」\nミナカタ「10万本！ ワシ、数えるの、途中で飽きるわ…。」\nハチマン「…俺が数える。」\nアマテ「木を植える人々のひたむきな心が、神域をつくるのじゃな。」\n林学者の本多静六たちは、はじめは松などを植え、長い年月をかけて、椎や樫などの常緑広葉樹の森へ移っていく計画を立てたのだ。\nイナリ「ほな、最初に植えた木は、いつか役目を終えるんやな。」\nテンジン「せや。人が手を入れんでも、木々が世代交代して育つ森を、めざしたんや。」\nミナカタ「木ぃに、100年かけて任せるんか。粋やなあ。」\nハチマン「…そのとき、ここに立つ者は、もういない。それでも、植えるのか。」\nアマテ「だからこそ、尊いのじゃ。」\n若い苗木が、風にそよいでいた。",sp:[2930,7880,3990,4480,2640,2700],f:"amate",sc:"m12",era:"大正9年（1920年）",place:"明治神宮（東京都）",mk:"tokyo",best:"minakata",bs:"木ぃを植えて、森を育てるんか！ 自然のことやったら、ワシに任せとき！",
 intro:"大正9年（1920年）、東京・代々木に、明治天皇と昭憲皇太后をお祀りする明治神宮が創建された。\n境内の森は、全国から集まった約10万本の木で、人の手によってつくられた。\n\nジンジャーマンは、森づくりの現場を訪ねた。",
 pol:"100年先の森のために、何をする？",
 ch:[{l:"全国からの献木を、植えるのを手伝う",sc:2,t:"全国から、約10万本の木が献木された。造営には、全国から延べ11万人もの青年団が奉仕した。"},
     {l:"森づくりの計画を聞く",sc:2,t:"はじめは赤松・黒松を主役に、檜や杉も混ぜて植え、下には樫・椎・楠を植えた。やがて、樫・椎・楠が森の中心になっていく。およそ100年かけて、人の手を借りずに世代交代する森をめざした。"},
     {l:"もとの土地を歩いてみる",sc:1,t:"このあたりは、代々木御料地と呼ばれた土地で、一面の原野だった。木はほとんどなく、森と呼べるものは、なかったという。"}],
 res:"人の手でつくられた森は、いまでは、人工の森とは思えないほど、豊かな鎮守の杜に育っている。100年先を見すえた、人々の仕事の成果だ。",
 memo:[{k:"史実",t:"明治神宮は、大正9年（1920年）11月1日に創建された。祭神は、明治天皇と昭憲皇太后。",s:"明治神宮（公式）「明治神宮とは」・Q&A"},
       {k:"史実",t:"境内の森は、全国から献木された約10万本を植えて、人の手でつくられた人工林。「永遠の杜」をめざして造成された。造営には、全国から延べ11万人の青年団が奉仕した。",s:"明治神宮（公式）「明治神宮とは」・Q&A"},
       {k:"史実",t:"森づくりには、林学・造園学の専門家が集められ、本多静六、本郷高徳、上原敬二らが中心となった。本多静六は、林苑計画の構想の中心となった林学者で、内苑の参与を務めた。",s:"明治神宮（公式）Q&A／國學院大學（広報記事「100年の森」計画）"},
       {k:"史実",t:"植栽は、はじめは赤松・黒松を主木に、檜・杉などを混ぜ、下に樫・椎・楠を植えた。およそ100年をかけて、樫・椎・楠を中心とする、土地に合った天然林の姿に移っていくよう、段階的に計画された。",s:"國學院大學（広報記事「100年の森」計画）"},
       {k:"史実",t:"鎮座予定地は、代々木御料地と呼ばれた土地で、一面の原野だった。樹木はほとんどなかった。",s:"國學院大學（広報記事「100年の森」計画）"},
       {k:"史実",x:"未確認",t:"もとの土地を「陸軍の練兵場だった荒地」とする説明も見かけるが、確認できた資料では、練兵場として出てくるのは、外苑側の青山練兵場。内苑の土地との関係は、まだ確かめていない。",s:"明治神宮（公式）Q&A／國學院大學（広報記事）"}]},
{key:"honcho1946",theme:"神道指令と、神社本庁の設立",per:"昭和時代",arr:"焼け跡の残る東京に、冷たい風が吹いていた。\n1945年12月、GHQは「神道指令」を出し、神社は国家から切り離されることになった。これから、神社はどう歩んでいけばよいのか。\nテンジン「神社が、国の仕組みから離れる…。大きな曲がり角やな。」\nイナリ「でも、お参りに来る人の気持ちは、変わらへんやろ。」\nミナカタ「せや。祭りの太鼓の音は、どこの町にも残っとるはずや。」\nハチマン「…自分たちの足で、立つということだ。」\nアマテ「全国の神社が、手を取り合えばよい。わらわは、そう思う。」\nテンジン「神社も、新しい道を探す時なんやな。」\n街角の小さな社に、子どもが一人、手を合わせていた。その小さな背中を、ジンジャーマンは、黙って見守った。",sp:[2950, 7830, 3960, 4430, 2620, 2700],f:"amate",sc:"k21",era:"昭和21年（1946年）",place:"東京・代々木（東京都）",mk:"tokyo",best:"amate",bs:"伊勢を本宗と仰ぐ、新しい出発じゃな。わらわが参ろう。",
 intro:"1945年12月15日、連合国軍最高司令官総司令部（GHQ）は、「神道指令」を出した。\n神社は、国家から切り離されることになった。\n\nジンジャーマンは、これからの神社のあり方を見届けに、東京へ向かった。",
 pol:"戦後の神社のために、何をする？",
 ch:[{l:"全国の神社をつなぐ組織づくりを手伝う",sc:2,t:"1946年2月3日、皇典講究所・大日本神祇会・神宮奉斎会の3団体が合同し、宗教法人の神社本庁が設立された。"},
     {l:"神道指令の中身を読む",sc:1,t:"指令の根本の趣旨は、軍国主義や極端な国家主義の根絶、信教の自由の確立、政教分離の徹底、神社神道の国家からの分離にあった。"},
     {l:"神社の届け出を手伝う",sc:1,t:"1946年2月、宗教法人令の改正などにより、神社神道は宗教法人となり、文部省の所管となった。"}],
 res:"神社本庁は、伊勢の神宮を本宗と仰ぎ、全国約8万社の神社を包括している。本部は、東京・代々木にある。",
 memo:[{k:"史実",t:"1945年12月15日、GHQは神道指令を出し、国家神道の廃止と、神社神道の国家からの分離を指示した。",s:"國學院大學「Encyclopedia of Shinto」／文部科学省『学制百年史』"},
       {k:"史実",t:"1946年2月、宗教法人令の改正などにより、神社神道は宗教法人となった。",s:"文部科学省『学制百年史』"},
       {k:"史実",t:"神社本庁は、皇典講究所・大日本神祇会・神宮奉斎会の3団体が合同して設立された。神宮を本宗と仰ぎ、全国約8万の神社を包括する。",s:"『神社のいろは 続』p.160（神社検定公式テキスト）／神社本庁（公式）"},
       {k:"史実",t:"神社本庁の設立は、昭和21年（1946年）2月3日。",s:"神社本庁（公式）"},
       {k:"史実",x:"諸説",t:"この旅の最後に見る「推定神社数」は、島田裕巳『なぜ八幡神社が日本でいちばん多いのか』が紹介する、神社本庁「全国神社祭祀祭礼総合調査」（1990年代）の数。調査の報告そのものは、まだ確かめていない。",s:"島田裕巳『なぜ八幡神社が日本でいちばん多いのか』（幻冬舎新書）"}]},
{key:"sengu2013",theme:"第62回式年遷宮",per:"平成時代",arr:"伊勢の森に、新しい木の香りが満ちている。2013年、第62回の式年遷宮の年だ。\n真新しい社殿が、朝の光に輝いていた。\nアマテ「……。」\nイナリ「アマテ？」\nアマテ「なんでもない。…ただ、こうして皆と、ここに立っておるのが、うれしいのじゃ。」\nテンジン「国生みの淡路から、ここまで。長い旅やったなあ。」\nミナカタ「ワシ、途中で何回、迷子になりかけたやろ。」\nハチマン「…十二回だ。」\nミナカタ「数えとったんかい！」\nテンジン「ほな、メモや。今度は、手もふるえへんで。」\nイナリ「よっしゃ、いよいよ現代に近づいてきたな。みんなで、しっかり見届けよか！」\n仲間たちは、顔を見合わせて、笑った。どこか遠くで、カラスが一声、鳴いた。\nアマテ「…さあ、参ろう。」",sp:[2970, 7817, 3953, 4425, 2616, 2693],f:"amate",sc:"k22",era:"平成25年（2013年）",place:"伊勢（三重県）",mk:"ise",best:"amate",bs:"旅も、いまに近づいてきたのう。",
 intro:"2013年、伊勢の神宮で、第62回の式年遷宮が行われた。\n20年に一度、社殿を新しく造り替え、神様にお遷りいただく、最大の祭典だ。\n\nジンジャーマンは、全員そろって、伊勢に集まった。",
 pol:"遷宮の年に、何をする？",
 ch:[{l:"最初の遷宮から数える",sc:1,t:"第1回の式年遷宮は、持統天皇4年（690年）。\n戦国時代に一時中断したこともあったが、20年に一度、くり返されてきた。"},
     {l:"次の遷宮の準備を見る",sc:2,t:"遷宮は、山口祭に始まり、30ほどの祭典・行事を重ねて、8年あまりをかけて準備される。\n第63回は、令和15年（2033年）秋の予定だ。"},
     {l:"「常若」の意味を考える",sc:2,t:"社殿を新しくすることで、いつも若々しく清らかな姿を保つ。\nこれを「常若（とこわか）」という。"}],
 res:"20年ごとに新しくなることで、伊勢の社は、いつも瑞々しい姿を保っている。ただ、なぜ20年なのかを、はっきり示す資料はないという。",
 memo:[{k:"史実",t:"第62回式年遷宮は、平成25年（2013年）。第63回は、令和15年（2033年）秋の予定。",s:"神宮（公式「式年遷宮」）／『神社のいろは』p.156（神社検定公式テキスト）"},
       {k:"史実",t:"式年遷宮は、山口祭に始まり、約30の祭典・行事を経て行われる。20年に一度という期間は『延喜式』に定められているが、なぜ20年なのかの明確な根拠を示す資料はない。",s:"『神社のいろは』p.156（神社検定公式テキスト）／神宮（公式）"},
       {k:"史実",t:"式年遷宮は、天武天皇の御宿願により、持統天皇4年（690年）に第1回が行われた。",s:"『神社のいろは』p.156（神社検定公式テキスト）"}]},
{key:"reiwa2019",nw:1,theme:"令和の御代替わりと、大嘗祭",per:"令和時代",arr:"東京・皇居。2019年、平成から令和へ、時代が移る年だ。\nテンジン「4月30日に退位礼正殿の儀。翌5月1日に、新しい天皇が即位されて、令和が始まったんや。」\nイナリ「元号が変わると、街の空気も変わるなあ。」\nハチマン「…代替わりには、儀式がいくつもある。順に見ていこう。」\nアマテ「中でも大嘗祭は、新しいお米を、皇祖と天神地祇にお供えして祈る儀式じゃ。稲と祈りは、昔から近いのう。」\nミナカタ「ワシ、儀式の名前が長すぎて、覚えられへん…。」\nテンジン「大丈夫や。日付と順番だけ、押さえとき。」",sp:[2970, 7817, 3953, 4425, 2616, 2693],f:"amate",sc:"m24",era:"平成31年／令和元年（2019年）",place:"皇居（東京都）",mk:"tokyo",best:"amate",bs:"稲と祈りは、昔から、近いのじゃ。",
 intro:"2019年4月30日に退位礼正殿の儀が行われ、翌5月1日に新しい天皇が即位して、元号は「令和」になった。その年の10月22日には即位礼正殿の儀、11月14日から15日にかけて、大嘗祭の中心の儀式である大嘗宮の儀が行われた。\n\nジンジャーマンは、皇居の東御苑を訪れた。",
 pol:"代替わりの儀式を、どう見届ける？",
 ch:[{l:"退位礼正殿の儀を振り返る",sc:1,t:"平成31年（2019年）4月30日、退位礼正殿の儀が行われた。天皇（のちの上皇）は、おことばの中で、翌日から始まる令和の時代が、平和で実り多いものになるよう、皇后とともに願う、と述べられた。"},
     {l:"即位の儀式の日付を、順に並べる",sc:2,t:"令和元年（2019年）5月1日に、剣璽等承継の儀と、即位後朝見の儀。10月22日に、即位礼正殿の儀。同じ日から、饗宴の儀が始まる。11月10日には、祝賀御列の儀。\n宮内庁の「お代替わり関係特集」に、これらの日付が並ぶ。"},
     {l:"大嘗祭の意味を聞く",sc:2,t:"大嘗祭は、稲作を中心とした社会に古くから伝わる、収穫の儀礼に根ざした儀式。天皇が、即位後はじめて、新しい穀物を皇祖と天神地祇にお供えし、感謝して、国家・国民のために祈る。\n令和元年（2019年）11月14日の夕方から夜に悠紀殿供饌の儀、翌15日の暁前に主基殿供饌の儀が行われた。"}],
 res:"平成から令和へ。皇居では、いくつもの儀式を重ねて、新しい時代が始まった。\n時代が変わっても、祈りの形は、受け継がれている。\nテンジン「ところで、令和の元号の由来は…どうやったかな。」\nアマテ「確かめられぬことは、確かめられぬと書く。それが、わらわたちの旅の決まりじゃ。」",
 memo:[{k:"史実",t:"退位礼正殿の儀は、平成31年（2019年）4月30日。おことばでは、翌日から始まる令和の時代が、平和で実り多いものになるよう、皇后とともに願う、と述べられた。",s:"宮内庁「おことば（退位礼正殿の儀）」"},
       {k:"史実",t:"令和元年（2019年）5月1日に、剣璽等承継の儀・即位後朝見の儀。10月22日に、即位礼正殿の儀。饗宴の儀は、10月22日・25日・29日・31日。11月10日に、祝賀御列の儀。",s:"宮内庁「お代替わり関係特集」"},
       {k:"史実",t:"大嘗祭は、稲作農業を中心とした社会に古くから伝承されてきた、収穫儀礼に根ざした儀式。天皇が、即位後はじめて大嘗宮で新穀を皇祖と天神地祇にお供えし、感謝して、国家・国民のために祈る。令和元年11月14日の夕方から夜に悠紀殿供饌の儀、15日の暁前に主基殿供饌の儀。大嘗宮は、皇居東御苑に設けられた。",s:"宮内庁「大嘗祭について」（令和元年10月2日）"},
       {k:"史実",t:"悠紀殿には栃木県、主基殿には京都府で収穫された新穀が供えられた。",s:"宮内庁「大嘗祭について」（令和元年10月2日）"},
       {k:"史実",t:"新元号「令和」は、平成31年（2019年）4月1日に発表され、5月1日から始まった。",s:"國學院大學図書館「改元、その歴史と『令和』改元」展示案内（発表日）／宮内庁（5月1日の儀式の日付）"},
       {k:"史実",x:"未確認",t:"「令和」の出典（『万葉集』の梅花の歌の序文とされる）は、政府の発表文などの公式資料を、今回は読めておらず、確かめていない。",s:"（出典未確認）"},
       {k:"史実",x:"未確認",t:"大嘗宮の建物の造りや材料は、確かめていない。ゲーム内の場面絵は、見立て。",s:"（出典未確認）"}]},
{key:"corona2020",nw:1,mask:1,theme:"新型コロナと、変わらない祈り",per:"令和時代",arr:"2020年。全国の神社の手水舎から、柄杓が消えた。\nジンジャーマンは、全員、マスクをつけている。\nイナリ「…ふがふが。」\nテンジン「イナリ、マスクの中でしゃべったら、何言うとるか、わからへんて。」\nハチマン「…………。」\nアマテ「ハチマン、何か言うてたもれ。マスクで、表情が見えぬのじゃ。」\nミナカタ「ワシ、マスクが耳にかからへん！ ゴムが短いんや！」\nイナリ「ほな、ひもを伸ばしたろか。…参拝のマナーは、マスク、手指の消毒、距離。基本は、手を合わせて祈ることやで。」\nテンジン「その通り。神社本庁の『疫病鎮静の祈り』にも、そう書いてあったな。」",sp:[2970, 7817, 3953, 4425, 2616, 2693],f:"hachiman",sc:"m25",era:"令和2年（2020年）",place:"熊本（肥後国）と、全国の神社",mk:"kumamoto",best:"hachiman",bs:"…静かに、祈る。",
 intro:"令和2年（2020年）、新型コロナウイルス感染症が広がった。神社でも、手水の柄杓や鈴緒を使わないなど、さまざまな感染対策がとられた。\n\nジンジャーマンは、全員マスクをつけて、各地の神社をめぐった。",
 pol:"いつもの参拝が、いつも通りにできない。どうする？",
 ch:[{l:"手水と鈴緒の対応を見る",sc:2,t:"「変わらない祈りのために」事務局がまとめたガイドライン（第4版・令和2年11月5日）では、手水の柄杓や手ぬぐいは撤去するか、柄杓を使わない方法に変える、鈴緒は一時的に使えないようにする、などの対応が示された。"},
     {l:"初詣の分散を考える",sc:2,t:"同じガイドラインは、年始は混雑して距離を取りにくいため、マスクの着用と、大声での会話を控えることを前提とし、開所の時間や時期を延ばして参拝を分散させること、破魔矢などの縁起物を年末から頒布することなどを挙げる。\n授与品は、注文用紙で取りまとめて頒布する方法や、参拝者が自分で取る方法も、例に挙げられた。"},
     {l:"花手水と、アマビエを見に行く",sc:1,t:"柄杓を使わなくなった手水鉢を、花で飾る「花手水」が、各地に広まった、と報じられた。\n肥後国（熊本）の海に現れたという「アマビエ」の絵も、京都大学の資料に伝わる。"}],
 res:"祈りの形は、変わらない。けれど、そのまわりの作法は、状況に合わせて変わった。\n手を合わせて祈る、という基本は、ずっと同じだった。\nイナリ「マスクの中で、笑うとるの、ばれてへんやろな。」\nアマテ「目が笑うておる。ばれておるぞ。」",
 memo:[{k:"史実",t:"神社のガイドライン『神社における新型コロナウイルス対応ガイドライン』は、「変わらない祈りのために」事務局（埼玉県神社庁内）が作成。監修は菅原えりさ氏（東京医療保健大学大学院教授）、協力は神社本庁・日本文化興隆財団。第1版は令和2年（2020年）9月1日、第4版は11月5日。",s:"文化庁 宗教法人審議会資料「神社における新型コロナウイルス対応ガイドライン（第4版）」"},
       {k:"史実",t:"手水は、柄杓・手ぬぐい等を撤去するか、柄杓を使わない方法に変更する。鈴緒は、一時的に使用できないようにする。玉串は、十分に清拭・消毒する。参拝者のマスク着用と手指消毒を徹底する。神職は、参拝者と2m程度の距離があれば、祭典中はマスクを外してよいが、玉串の授受など参拝者に接する場面では着用が必要。",s:"同ガイドライン（第4版）"},
       {k:"史実",t:"初詣は、混雑で距離をとりにくいため、マスク着用と大声での会話の自粛を前提に、開所の時間や時期を延ばして参拝を分散させる。破魔矢などの縁起物は、年末から頒布する例が示された。授与品は、注文用紙で取りまとめる方法と、折敷を使って参拝者が自分で取る方法が例に挙げられた。授与所の職員は、おみくじや御朱印についても手指消毒を行う。",s:"同ガイドライン（第4版）"},
       {k:"史実",t:"神社本庁『疫病鎮静の祈り』では、基本の祈りは「手を合わせ祈る」こと。参拝時は、マスクの着用、距離の確保、体調不良時の参拝の自粛、手指の消毒を呼びかけ、自宅では、お神札をおまつりして、ご先祖さまと神さまへの感謝と日々の平穏を祈ることをすすめる。",s:"神社本庁『疫病鎮静の祈り』（パンフレット）"},
       {k:"史実",t:"疫病は神の働きとされ、流行らせる神を「疫神」と呼び、畏れ祀り、祓うことで流行を防ごうとした。疱瘡（天然痘）は「疱瘡神」として祀られ、村や町から追い出す「疱瘡神送り」も行われた。祇園御霊会は、御霊信仰から生まれ、いまの八坂神社の祇園祭に発展した。",s:"神社本庁『疫病鎮静の祈り』"},
       {k:"伝承",t:"崇神天皇の時代に疫病が流行したとき、天皇が神々に祈り、大物主神の教えに従って、大田田根子を祭主として、三輪山の大物主神を祀ったところ、疫病がやんだ、とされる。茅の輪くぐりは、『備後国風土記』の蘇民将来の逸話に基づくとされる。",s:"神社本庁『疫病鎮静の祈り』（『古事記』『日本書紀』『備後国風土記』による）"},
       {k:"伝承",t:"京都大学附属図書館が所蔵する『新聞文庫・絵』の「肥後国海中の怪（アマビエの図）」の翻刻では、弘化3年（1846年）4月中旬、肥後国の海中に毎夜、光る物が現れ、アマビエと名乗った。当年から6年は豊作だが、疫病も流行するので、早く私の姿を写して人々に見せよ、と告げて海に帰った。役人が写しを江戸に送った、という内容。",s:"京都大学貴重資料デジタルアーカイブ「アマビエ」解説（翻刻）。原図の所蔵は京都大学附属図書館。ゲーム内の絵は、原図とは別に描いたもの"},
       {k:"史実",t:"柄杓を使わなくなった手水鉢を花で飾る「花手水」は、札幌では2020年7月に9社が初めて実施した、と報じられた。柄杓の使用を控えることになり、使われなくなった手水鉢を花で飾って、参拝者に和んでもらう目的で、全国に広まった。コロナの収束を願って「花詣」と名付けられた。",s:"北海道新聞（2023年8月14日付）"},
       {k:"史実",x:"未確認",t:"花手水が、日本で最初に行われたのがどこか、全国に広まった規模は、確かめていない。",s:"（出典未確認）"},
       {k:"史実",x:"未確認",t:"あらかじめ紙に書いて置いておく「書き置き」の御朱印が、コロナ禍で広く見られた、と言われる。上のガイドライン第4版や『疫病鎮静の祈り』には、書き置き御朱印の記述はなく、授与所の御朱印も手指消毒を行う、とあるのみ。実施の時期や数は、確かめていない。",s:"（出典未確認）"},

function resume(){
  const t=S.trip;const a=MK[t.from],b=MK[t.to];
  const dur=Math.min(3600,1400+t.days*120);let last=performance.now();
  clearInterval(ANIM);
  ANIM=setInterval(()=>{
    const now=performance.now();t.p=Math.min(1,t.p+(now-last)/dur);last=now;
    const x=a[0]+(b[0]-a[0])*t.p,y=a[1]+(b[1]-a[1])*t.p;
    const tk=$("#tok");if(tk){tk.style.left=x+"%";tk.style.top=(y-1)+"%"}
    S.days=t.d0+Math.round(t.days*t.p)+t.extra;const dc=$("#dayc");if(dc)dc.textContent="旅 "+S.days+"日目";
    $("#place").textContent="旅 "+S.days+"日目";
    if(t.hap&&!t.hapDone&&t.p>=0.5){clearInterval(ANIM);t.hapDone=true;S.step="hap";render();SE("alert");return}
    if(t.p>=1){clearInterval(ANIM);S.pos=t.to;S.days=t.d0+t.days+t.extra;save();SE("clap");S.step="arrive";render()}

}
function hapChoose(i){
  const c=CH[S.ch],h=S.trip.hap,x=h.ch[i];if(x.battle){S.step="bpick";render();return}
  let g=Object.assign({},x.g),dd=x.d,note="";

  S.trip.hc=i;S.trip.g2=g;S.trip.d2=dd;S.trip.note=note;S.trip.extra=Math.max(-S.trip.days+1,(S.trip.extra||0)+dd);addGoen(g,c.f);save();if(Object.values(g).some(v=>v>0))SE("goen");

function choose(i){
  const c=CH[S.ch];const x=c.ch[i];const bonus=!!c.best&&S.leader===c.best;const kmv=!!c.kumano;
  const first=kmv&&!S.kumanon;if(kmv)S.kumanon=true;
  let st=Math.min(3,x.sc+(bonus?1:0)+(kmv?1:0));
  const bt=(S.bt&&S.bt.ch===c.key&&S.bt.done&&S.bt.after==="ch")?S.bt:null;let bpen=false;
  if(bt&&!bt.win){st=Math.max(0,st-1);S.days+=2;bpen=true}
  const gain=st*10;S.goen[c.f]=(S.goen[c.f]||0)+gain;
  const extra=[];
  if(hasEq("m_enmusubi")){S.goen[c.f]+=5;extra.push("縁結びの御守："+FN[c.f]+"の御縁 +5")}
  if(hasEq("m_fufu")){const lo=FK.slice().sort((a,b)=>S.goen[a]-S.goen[b])[0];S.goen[lo]+=3;extra.push("夫婦円満の御守："+FN[lo]+"の御縁 +3")}
  const kuji=kujiOK(c)&&Math.random()<(["okage1830","sengu2013"].includes(c.key)?0.8:0.45);
  S.cur={st:st,bonus:bonus,km:kmv,first:first,text:x.t,gain:gain,extra:extra,kuji:kuji,eqWas:S.eq.slice(),bpen:bpen,bwin:!!(bt&&bt.win)};S.bt=null;
  S.eq=[];
  S.best[c.key]=Math.max(bestOf(c)==null?0:bestOf(c),st);
  c.memo.forEach((m,j)=>{const key=c.key+"|"+j;if(!S.facts.includes(key))S.facts.push(key)});
  S.cur.shNew=!S.shuin[c.key];if(S.cur.shNew)S.shuin[c.key]={d:today()};
  S.cur.rankUp=checkRank();
  save();S.step="result";render();SE("star",st);SE("goen");
}

 {k:"watatsumi",img:"g_watatsumi",n:"綿津見神（わたつみのかみ）",kind:"神話",ch:["umisachi"],d:"海の神。宮を訪れた火遠理命を迎えて娘と結婚させ、帰るときに、潮の満ち干きを操る塩盈珠・塩乾珠を授けた。",s:"國學院大學 神名データベース「綿津見神」"},
 {k:"shiotsuchi",img:"g_shiotsuchi",n:"塩椎神（しおつちのかみ）",kind:"神話",ch:["umisachi"],d:"嘆く火遠理命に助言し、無間勝間の小船を作って、綿津見神の宮へ導いた神。『日本書紀』では塩土老翁・塩筒老翁と書かれ、青島神社では塩筒大神として祀られる。",s:"國學院大學 神名データベース「塩椎神」／青島神社（公式）"},
 {k:"jimmu",img:"p_jimmu",n:"神武天皇",kind:"伝承",ch:["jimmu","kashihara"],d:"のちに初代の天皇とされる。『古事記』では、九州から大和を目指す途中、熊野で八咫烏に導かれた。邇邇芸命の曾孫とされる。",s:"國學院大學「『古事記』あらすじ」／『神社のいろは』p.66"},
 {k:"yatagarasu",img:"i_crow",n:"八咫烏（やたがらす）",kind:"伝承",ch:["jimmu","kumano_insei","kumano1889"],d:"高木神（高御産巣日神）が天からつかわし、神武天皇の一行を導いたカラス。熊野三山の神使とされる。",s:"熊野本宮大社（公式）／『神社のいろは』p.66"},
 {k:"yamatohime",img:"p_yamatohime",n:"倭姫命（やまとひめのみこと）",kind:"伝承",ch:["yamatohime","takeru"],d:"垂仁天皇の皇女。天照大御神をお祀りする地を求めて諸国を巡り、伊勢でお祀りするようになったとされる。日本武尊に神剣を授けたとも伝わる。",s:"『神社のいろは』p.152・p.167"},
 {k:"takeru",img:"g_takeru",n:"日本武尊（倭建命）",kind:"伝承",ch:["takeru"],g:"takeru",d:"景行天皇の皇子で、もとの名は小碓命。西へ東へ各地を平定したと伝わる英雄。「草薙剣」の名の由来にもかかわる。",s:"國學院大學「『古事記』あらすじ」／『神社のいろは』p.88"},
 {k:"miyazu",img:"p_miyazu",n:"宮簀媛命（みやすひめのみこと）",kind:"伝承",ch:["takeru"],d:"尾張で日本武尊と結婚した。日本武尊が亡くなったのち、その遺志を重んじて、熱田の地に神剣を祀ったとされる。",s:"『神社のいろは』p.88"},
 {k:"jingu",img:"g_jingu",n:"神功皇后",kind:"伝承",ch:["jingu"],g:"jingu",d:"仲哀天皇の后で、応神天皇（八幡神とされる）の母と伝わる。伝説的な要素が強い人物といわれる。",s:"『神社のいろは 続』p.20-21・p.174"},
 {k:"chuai",img:"p_chuai",n:"仲哀天皇",kind:"伝承",ch:["jingu"],d:"神功皇后の夫。筑紫の香椎の地で亡くなったと伝わる。香椎宮に、神功皇后とともに祀られる。",s:"『神社のいろは 続』p.174"},
 {k:"ojin",img:"p_ojin",n:"応神天皇（誉田別尊）",kind:"伝承",ch:["jingu","todaiji749","usa769"],d:"仲哀天皇と神功皇后の子とされる。八幡神は、この応神天皇とされる。",s:"『神社のいろは 続』p.174／『神社のいろは』p.60"},
 {k:"kinmei",img:"p_kinmei",n:"欽明天皇",kind:"史実",ch:["asuka"],d:"第29代の天皇。『日本書紀』は、この天皇の時代に、百済の聖明王が仏像・経典などを献じたと記す。",s:"『神社のいろは 続』p.28"},
 {k:"iname",img:"p_iname",n:"蘇我稲目（そがのいなめ）",kind:"史実",ch:["asuka"],d:"仏教を受け入れることに賛成した。『日本書紀』では「諸国は皆、礼拝している。日本だけが背くべきだろうか」と答えたとされる。",s:"『神社のいろは 続』p.29"},
 {k:"okoshi",img:"p_okoshi",n:"物部尾輿（もののべのおこし）",kind:"史実",ch:["asuka"],d:"中臣鎌子とともに、「今、改めて外国の神を拝めば、国つ神の怒りを受ける」と、仏教の受け入れに反対した。",s:"『神社のいろは 続』p.29"},
 {k:"kamako",img:"p_kamako",n:"中臣鎌子（なかとみのかまこ）",kind:"史実",ch:["asuka"],d:"物部尾輿とともに、仏教の受け入れに反対した。わが国の天皇は、神々を春夏秋冬にお祀りするのをつとめとしてきた、と述べたとされる。",s:"『神社のいろは 続』p.29"},
 {k:"umako",img:"p_umako",n:"蘇我馬子（そがのうまこ）",kind:"史実",ch:["asuka"],d:"崇仏派の蘇我氏の人物。物部守屋を滅ぼし、のちに推古天皇のもとで厩戸皇子（聖徳太子）らとともに政治を進めた。飛鳥寺（法興寺）を創建した。",s:"『神社のいろは 続』p.29-30"},
 {k:"moriya",img:"p_moriya",n:"物部守屋（もののべのもりや）",kind:"史実",ch:["asuka"],d:"排仏派の物部氏の人物。物部氏は軍事を担った有力な氏族で、八尾（大阪府）を拠点としていた。仏教をめぐる争いのなかで、587年に蘇我馬子らと戦って滅んだ。",s:"『神社のいろは 続』p.28-29／八尾市（公式）"},
 {k:"umayado",img:"p_umayado",n:"厩戸皇子（聖徳太子）",kind:"史実",ch:["asuka"],d:"推古天皇のもとで蘇我馬子らと協力し、冠位十二階や十七条憲法を定めた。法隆寺や四天王寺は、聖徳太子の創建といわれる。",s:"『神社のいろは 続』p.30／四天王寺（公式）"},
 {k:"suiko",img:"p_suiko",n:"推古天皇",kind:"史実",ch:["asuka"],d:"第33代の天皇。仏教を受け入れたのちも、聖徳太子と蘇我馬子に命じ、朝廷の役人を率いて神祇を祭らせたと『日本書紀』は記す。",s:"『神社のいろは 続』p.30-31"},
 {k:"yoshimitsu",img:"g_yoshimitsu",n:"本田善光（ほんだよしみつ）",kind:"伝承",ch:["asuka"],d:"信濃の人。『善光寺縁起』では、難波の堀江から仏像を拾い上げて信濃へ持ち帰り、のちの善光寺の名は、その名にちなむという。",s:"善光寺（公式「逸話」）"},
 {k:"irogu",img:"p_irogu",n:"秦伊呂具（はたのいろぐ）",kind:"伝承",ch:["inari711"],d:"深草の長者と伝わる。伏見稲荷大社の社記では、勅命を受けて稲荷大神を祀ったという。『山城国風土記』逸文にも、伊呂具秦公の名が見える。",s:"伏見稲荷大社（公式「沿革」）"},
 {k:"shomu",img:"p_shomu",n:"聖武天皇",kind:"伝承",ch:["todaiji749"],d:"東大寺の鎮守・手向山八幡宮は、聖武天皇が宇佐から八幡神を勧請したと伝わる。",s:"奈良県立図書情報館"},
 {k:"kiyomaro",img:"p_kiyomaro",n:"和気清麻呂（わけのきよまろ）",kind:"史実",ch:["usa769"],d:"神護景雲3年（769年）、宇佐で八幡神のお告げを受けて都に持ち帰り、道鏡が天皇になることを阻んだ。",s:"『神社のいろは 続』p.50-51／『神社のいろは』p.60"},
 {k:"shotoku",img:"p_shotoku",n:"称徳天皇",kind:"史実",ch:["usa769"],d:"僧・道鏡に皇位を譲ろうとしたが、宇佐八幡神のお告げと和気清麻呂によって、果たされなかった。",s:"『神社のいろは 続』p.50-51"},
 {k:"dokyo",img:"p_dokyo",n:"道鏡（どうきょう）",kind:"史実",ch:["usa769"],d:"奈良時代の僧。称徳天皇から皇位を譲られようとしたが、天皇にはならなかった。",s:"『神社のいろは 続』p.50-51"},
 {k:"gyokyo",img:"p_gyokyo",n:"行教（ぎょうきょう）",kind:"伝承",ch:["iwashimizu859"],d:"南都・大安寺の僧。宇佐で八幡大神のお告げを受け、貞観元年（859年）、男山の峯に御神霊を奉安した。",s:"石清水八幡宮（公式）"},
 {k:"gozu",img:"p_gozu",n:"牛頭天王（ごずてんのう）",kind:"伝承",ch:["gozu869","kokkyoka1868"],d:"疫病を鎮める神として、祇園の社（いまの八坂神社）や津島神社（愛知県）などで祀られた。神仏習合の中で、素戔嗚尊と同じ神とされるようになった。八坂神社の説明では、素戔嗚尊は古くは牛頭天王とも称し、薬師如来を本地仏とした。",s:"八坂神社（公式）「八坂神社について」／愛知県公式観光サイト Aichi Now「津島神社」"},
 {k:"somin",img:"p_somin",n:"蘇民将来（そみんしょうらい）",kind:"伝承",ch:["gozu869"],d:"『備後国風土記』逸文に伝わる人物。旅の神・武塔神をもてなし、茅の輪を腰につけて疫病を免れたという。茅の輪くぐりや「蘇民将来之子孫也」の護符の起源とされる。武塔神は、のちに素戔嗚尊・牛頭天王と習合して語られた。",s:"八坂神社（公式）「御祭神」（疫神社）／『神社のいろは』p.70・p.116"},
 {k:"michizane",img:"p_michizane",n:"菅原道真（すがわらのみちざね）",kind:"史実",ch:["dazaifu901","kitano947","dazaifu1591"],d:"右大臣。昌泰4年（901年）に大宰府へ左遷され、延喜3年（903年）に亡くなった。天神さまとして北野天満宮・太宰府天満宮などに祀られ、江戸時代には学問の神として広く信仰された。",s:"太宰府市（公式）／『神社のいろは』p.64"},
 {k:"umasake",img:"p_umasake",n:"味酒安行（うまさけのやすゆき）",kind:"伝承",ch:["dazaifu901"],d:"道真の門弟。亡骸を乗せた牛車が動かなくなった地に、道真を葬ったと伝わる。",s:"太宰府天満宮（公式「御由緒」）"},
 {k:"ayako",img:"p_ayako",n:"多治比文子（たじひのあやこ）",kind:"伝承",ch:["kitano947"],d:"「われを右近の馬場に祀れ」という道真のお告げを受けたと伝えられる。文子天満宮は、北野天満宮の前身とも伝えられる。",s:"京都市下京区役所「文子天満宮」"},
 {k:"uda",img:"p_uda",n:"宇多法皇",kind:"史実",ch:["kumano_insei"],d:"延喜7年（907年）、熊野御幸を行った。熊野御幸は、亀山上皇までで百数十度に及んだ。",s:"『神社のいろは 続』p.88"},
 {k:"gotoba",img:"p_gotoba",n:"後鳥羽上皇",kind:"史実",ch:["kumano_insei"],d:"たびたび熊野へ参詣し、その回数は28度とされる。",s:"『神社のいろは 続』p.88"},
 {k:"tamefusa",img:"p_tamefusa",n:"藤原為房",kind:"史実",ch:["kumano_insei"],d:"永保元年（1081年）、熊野詣の途中で稲荷社に参り、杉の小枝を身につけた例が記録に残る。",s:"伏見稲荷大社（公式「しるしの杉」）"},
 {k:"kiyomori",img:"p_kiyomori",n:"平清盛",kind:"史実",ch:["kumano_insei"],d:"平治元年（1159年）、熊野詣のとき、稲荷社に参って杉の小枝を身につけた例が記録に残る。",s:"伏見稲荷大社（公式「しるしの杉」）"},
 {k:"yoriyoshi",img:"p_yoriyoshi",n:"源頼義",kind:"史実",ch:["kamakura1180"],d:"康平6年（1063年）、源氏の氏神として、石清水八幡宮を鎌倉の由比に勧請した。鶴岡八幡宮の始まり。",s:"『神社のいろは』p.60／鶴岡八幡宮（公式）"},
 {k:"yoritomo",img:"p_yoritomo",n:"源頼朝",kind:"史実",ch:["kamakura1180"],d:"治承4年（1180年）、八幡宮を今の地に遷し、若宮大路を中心線とする鎌倉の町づくりを進めた。",s:"鶴岡八幡宮（公式）／『神社のいろは 続』p.90"},
 {k:"shingen",img:"p_shingen",n:"武田信玄（晴信）",kind:"史実",ch:["shingen"],d:"甲斐の戦国大名。諏訪大社に戦勝を祈り、その旗を立てて出陣した。",s:"『神社のいろは』p.68／諏訪大社（公式）"},
 {k:"hideyoshi",img:"p_hideyoshi",n:"豊臣秀吉",kind:"史実",ch:["hideyoshi1589"],d:"母・大政所の病気平癒を祈り、かなえば一万石を奉加すると記した願文を伏見稲荷大社に納めた。天正17年（1589年）、楼門を寄進した。",s:"伏見稲荷大社（公式「沿革」「楼門」）"},
 {k:"omandokoro",img:"p_omandokoro",n:"大政所（おおまんどころ）",kind:"史実",ch:["hideyoshi1589"],d:"豊臣秀吉の母。秀吉は、その病の回復を伏見稲荷大社に祈った。",s:"伏見稲荷大社（公式「楼門」）"},
 {k:"takakage",img:"p_takakage",n:"小早川隆景",kind:"史実",ch:["dazaifu1591"],d:"太宰府天満宮の今の本殿を建て、天正19年（1591年）に完成させた。",s:"太宰府天満宮（公式「御由緒」）／太宰府市（公式）"},
 {k:"nagamasa",img:"p_nagamasa",n:"黒田長政",kind:"伝承",ch:["dazaifu1591"],d:"太宰府天満宮の参道の池にかかる太鼓橋を寄進したとされる。",s:"太宰府市（公式）"},
 {k:"kumagusu",img:"p_kumagusu",n:"南方熊楠（みなかたくまぐす）",kind:"史実",ch:["goshi1906"],d:"博物学者・生物学者。神社合祀に反対し、生態系などの面から鎮守の森の重要性に注目した先駆者とされる。",s:"『神社のいろは 続』p.156-157"},
 {k:"yanagita",img:"p_yanagita",n:"柳田國男（やなぎたくにお）",kind:"史実",ch:["goshi1906"],d:"民俗学者。南方熊楠と親交があった。",s:"『神社のいろは 続』p.157"},
 {k:"omononushi",img:"p_omononushi",n:"大物主神（おおものぬしのかみ）",kind:"神話",ch:["kunidukuri","miwayama","konpira1868"],d:"金刀比羅宮の御本宮の主祭神。三輪山の大神神社の祭神でもある。大国主神の和魂（幸魂・奇魂）とされる。古来、農業・殖産・医薬・海上守護の神として仰がれる。",s:"金刀比羅宮（公式）「ご参拝案内」／『日本書紀』神代上（一書）／國學院大學 神名データベース「大物主神」／大神神社（公式）「ご由緒」（和魂の点は、『出雲国造神賀詞』による）"},
 {k:"sutoku",img:"p_sutoku",n:"崇徳天皇（すとくてんのう）",kind:"史実",ch:["konpira1868"],d:"【史実】永万元年（1165年）、神霊が金刀比羅宮の御本社の相殿に奉斎された。【伝承】保元の乱（1156年）のあと、讃岐で金毘羅大権現を崇敬し、境内の古籠所に参籠したとされる。",s:"金刀比羅宮（公式）「歴史」"},
 {k:"kotohira",img:"p_kotohira",n:"琴陵宥常（ことおか ひろつね）",kind:"史実",ch:["konpira1868"],d:"金光院の最後の別当で、還俗して金刀比羅宮の初代宮司になったとされる。（出典は、まだ確かめていない。）",s:"（出典未確認）"},
 {k:"kakugyo",img:"p_kakugyo",n:"角行（長谷川角行）（かくぎょう）",kind:"史実",ch:["fujiko"],d:"【史実】戦国時代に現れ、富士講のはじまりとされる人物（1541〜1646年）。【伝承】富士の人穴などで荒行を重ね、祈祷で庶民を救ったとされる。苦行として、富士登山128回、御中道33回を成し遂げたという。",s:"北口本宮冨士浅間神社（公式）「富士講」"},
 {k:"tagori",img:"p_tagori",n:"田心姫神（たごりひめのかみ）",kind:"神話",ch:["munakata"],d:"宗像三女神の一柱。沖ノ島の沖津宮に祀られる。天照大御神と須佐之男命のうけいで生まれたとされる。",s:"宗像大社（公式）「沖津宮」／『古事記』上巻"},
 {k:"tagitsu",img:"p_tagitsu",n:"湍津姫神（たぎつひめのかみ）",kind:"神話",ch:["munakata"],d:"宗像三女神の一柱。大島の中津宮に祀られる。天照大御神と須佐之男命のうけいで生まれたとされる。",s:"『古事記』上巻・『日本書紀』神代上（中津宮の点は、宗像大社公式で確認する必要あり）"},
 {k:"ichiki",img:"p_ichiki",n:"市杵島姫神（いちきしまひめのかみ）",kind:"神話",ch:["munakata"],d:"宗像三女神の一柱。本土の辺津宮に祀られる。天照大御神と須佐之男命のうけいで生まれたとされる。",s:"『古事記』上巻・『日本書紀』神代上（辺津宮の点は、宗像大社公式で確認する必要あり）"},
 {k:"ebisu",img:"p_ebisu",n:"恵比寿・えびす",kind:"伝承",ch:["shichifuku","ebisu"],d:"七福神のうち、日本古来の神とされる唯一の柱。「えびす」の表記には、夷・戎・蛭子・恵比寿などがある。【伝承】大阪湾で見つかった御神像を、鳴尾の漁師が祀り、御神託で西宮に遷されたと伝わる。【神話】西宮神社では、神話上の蛭子（蛭児）大神と同じ神として崇敬してきた。室町時代に七福神の一柱になった。漁と市場、商売の神として信仰される。",s:"西宮神社（公式）「西宮神社について」／目黒区（公式）「七福神」"},
 {k:"daikoku",img:"p_daikoku",n:"大黒天（だいこくてん）",kind:"伝承",ch:["shichifuku"],d:"七福神の一柱。インド由来で、もとは仏法を守る戦闘の神とされ、仏教とともに日本に入り、平安時代から福徳の神として信仰された。",s:"目黒区（公式）「七福神」"},
 {k:"bishamon",img:"p_bishamon",n:"毘沙門天（びしゃもんてん）",kind:"伝承",ch:["shichifuku"],d:"七福神の一柱。インド由来で、仏法を守る戦闘の神とされる。仏教とともに日本に入り、平安時代から福徳の神として信仰された。",s:"目黒区（公式）「七福神」"},
 {k:"benzai",img:"p_benzai",n:"弁財天（べんざいてん）",kind:"伝承",ch:["shichifuku"],d:"七福神の一柱。インド由来で、音楽・弁才（話術）の女神。仏教とともに日本に入り、平安時代から福徳の神として信仰された。谷中七福神では、不忍池辯天堂に祀られる。",s:"目黒区（公式）「七福神」／台東区（公式観光情報）「谷中七福神詣り」"},
 {k:"fukuroku",img:"p_fukuroku",n:"福禄寿（ふくろくじゅ）",kind:"伝承",ch:["shichifuku"],d:"七福神の一柱。中国由来で、延命長寿の神とされる。",s:"目黒区（公式）「七福神」"},
 {k:"jurojin",img:"p_jurojin",n:"寿老人（じゅろうじん）",kind:"伝承",ch:["shichifuku"],d:"七福神の一柱。中国由来で、延命長寿の神とされる。谷中七福神・隅田川七福神でも、巡る社寺に祀られる。",s:"目黒区（公式）「七福神」／墨田区（公式）報道資料"},
 {k:"hotei",img:"p_hotei",n:"布袋（ほてい）",kind:"史実",ch:["shichifuku"],d:"【史実】五代後梁の禅僧・契此（かいし）の姿を写したとされる、七福神の一柱。【伝承】福を授ける、にこやかな姿で語られる。",s:"目黒区（公式）「七福神」"},
 {k:"ouji",img:"p_ouji",n:"王子の狐（眷属）",kind:"伝承",ch:["inari1834"],d:"大晦日の夜、稲荷の使いの狐たちが、東日本各地から王子に集まり、装束榎の下で身支度を整えて初詣に向かったと伝わる。広重の『名所江戸百景』にも描かれた。",s:"nippon.com「王子装束ゑの木大晦日の狐火」（神社公式の説明は、まだ確かめていない）"},
 {k:"enno",img:"p_enno",n:"役行者（役小角）（えんのぎょうじゃ・えんのおづぬ）",kind:"史実",ch:["shugendo"],d:"【史実】7世紀ごろの奈良に生まれた実在の人物とされ、修験道の開祖と仰がれる。『続日本紀』に記事がある（年の表記は未確認）。【伝承】寺伝では、634年に葛城上郡の茅原に生まれ、大峯山上ヶ岳で千日参籠して蔵王権現を感得し、その姿を山桜に刻んだと伝わる。",s:"金峯山寺（公式）「金峯山寺について」／聖護院門跡（公式）「修験道」"},
 {k:"taicho",img:"p_taicho",n:"泰澄（たいちょう）",kind:"伝承",ch:["shugendo"],d:"越前の僧。682年に越前麻生津に生まれ、養老元年（717年）に初めて白山に登拝し、翌年、山頂に奥宮を祀ったとされる。白山信仰の開山の人として伝わる。",s:"白山比咩神社（公式）「白山信仰」"},
 {k:"yamabushi",img:"p_yamabushi",n:"山伏（やまぶし）",kind:"史実",ch:["shugendo"],d:"修験道の行者。野山に伏して、山岳での難行苦行により験力を身につける。修験十六道具などをまとって修行する。役行者を開祖と仰ぐ。",s:"聖護院門跡（公式）「修験道」／高尾山薬王院（公式）「高尾山修験道」"},
 {k:"zao",img:"p_zao",n:"蔵王権現（ざおうごんげん）",kind:"伝承",ch:["shugendo"],d:"金峯山寺の寺伝で、役行者が大峯山上ヶ岳の千日の参籠のすえに感得したとされる、忿怒の相の尊。「権現」は、神仏が姿を変えて現れた仮の姿をいう。",s:"金峯山寺（公式）「金峯山寺について」"},
 {k:"tengu",img:"p_tengu",n:"天狗（高尾山の飯縄大権現の眷属）",kind:"伝承",ch:["shugendo"],d:"高尾山薬王院では、天狗は飯縄大権現の眷属（随身）として、災いを除き運を開く力を持つとされる。深山で修行して験力を得た山伏の姿が、天狗と同一視されることも多いという。",s:"高尾山薬王院（公式）「高尾山と天狗様」"},
 {k:"konohana",img:"p_konohana",n:"木花之佐久夜毘売命（このはなのさくやびめ）",kind:"神話",ch:["konohana"],d:"大山津見神の娘で、邇邇芸命の妃。一夜で身ごもり、疑われると、産屋に火を放って、火の中で火照命・火須勢理命・火遠理命を生み、天孫の子であることを証した。都萬神社（宮崎県西都市）に祀られ、浅間大社（静岡県）の主祭神でもある。",s:"『古事記』上巻（國學院大學 神名データベース）／都萬神社の点は宮崎県観光協会、浅間大社の点は神社公式を未確認"},
 {k:"iwanaga",img:"p_iwanaga",n:"石長比売（いわながひめ）",kind:"神話",ch:["konohana"],d:"大山津見神の娘で、木花之佐久夜毘売の姉。邇邇芸命に返された。父神は、姉を迎えていれば、天神の子孫の命は岩のように変わらなかった、と告げたとされる。",s:"『古事記』上巻（國學院大學 神名データベース「木花之佐久夜毘売」／同大学の解説）"},
 {k:"sukuna",img:"p_sukuna",n:"少名毘古那神（すくなびこなのかみ）",kind:"神話",ch:["kunidukuri","miwayama"],d:"神産巣日神の子。波の上から、天之羅摩舩に乗って現れ、大国主神と並んで国を作り固めたあと、常世国へ渡った。医療・湯治の法を始めたとも伝えられ、酒の神、石の神ともされる。三輪山では、麓に鎮まるとされる。",s:"『古事記』上巻（國學院大學 古事記ビューア）／國學院大學 神名データベース「少名毘古那神」／大神神社（公式）「三輪山」"},
 {k:"kuebiko",img:"p_kuebiko",n:"久延毘古（くえびこ）",kind:"神話",ch:["kunidukuri"],d:"足は動かないが、天下のことを、みな知る神。いまの山田のそほど（案山子）にあたるとされる。少名毘古那神の名を、大国主神に教えた。",s:"『古事記』上巻（國學院大學 古事記ビューア「少名毗古那神との国作り」）"},
 {k:"amabie",img:"p_amabie",n:"アマビエ",kind:"伝承",ch:["corona2020"],d:"肥後国（熊本）の海に現れ、当年から6年は豊作だが疫病も流行するので、私の姿を写して人々に見せよ、と告げたとされる。京都大学附属図書館に、その報せを伝える刷り物（『新聞文庫・絵』合綴「肥後国海中の怪（アマビエの図）」）が所蔵される。2020年に流行した経緯は、確かめていない（未確認）。",s:"京都大学貴重資料デジタルアーカイブ「アマビエ」解説（翻刻）"},
 {k:"otataneko",img:"p_otataneko",n:"大田田根子（おおたたねこ）",kind:"伝承",ch:["corona2020"],d:"崇神天皇の時代に疫病が流行したとき、大物主神の教えに従って祭主とされ、三輪山の大物主神を祀ったところ、疫病がやんだ、と『古事記』『日本書紀』に伝わる。",s:"神社本庁『疫病鎮静の祈り』"},
 {k:"amenominaka",img:"p_amenominaka",n:"天之御中主神（あめのみなかぬしのかみ）",kind:"神話",ch:["tenchi"],d:"天地が初めて成ったとき、高天原に最初に成った神。独神で、身を隠した。『古事記』では冒頭に一度しか現れない。絵の姿は、ゲームの見立て。",s:"『古事記』上巻「天地初発」／國學院大學 神名データベース"},
 {k:"takamimusuhi",img:"p_takamimusuhi",n:"高御産巣日神（たかみむすひのかみ）",kind:"神話",ch:["tenchi"],d:"最初に現れた三柱の一柱。のち、天孫降臨で天孫に天降りを命じる司令神の一柱となり、神武東征では、熊野の高倉下に横刀を授け、八咫烏を遣わしたと語られる。絵の姿は、ゲームの見立て。",s:"國學院大學 神名データベース「高御産巣日神」"},
 {k:"kamumusuhi",img:"p_kamumusuhi",n:"神産巣日神（かみむすひのかみ）",kind:"神話",ch:["tenchi"],d:"最初に現れた三柱の一柱。のちの国づくりの場面で、少名毘古那神を「我が子」と認めた。絵の姿は、ゲームの見立て。",s:"『古事記』上巻「天地初発」「少名毗古那神との国作り」（國學院大學 古事記ビューア）"},
 {k:"tsukuyomi",img:"p_tsukuyomi",n:"月読命（つくよみのみこと）",kind:"神話",ch:["ukei"],d:"伊耶那岐命の禊で生まれた三貴子の一柱。父から、夜之食国を治めるよう命じられた。その範囲については、諸説ある。",s:"『古事記』上巻「三貴子の分治」（國學院大學 古事記ビューア）"},
 {k:"oshihomimi",img:"p_oshihomimi",n:"正勝吾勝々速日天之忍穂耳命",kind:"神話",ch:["ukei"],d:"天照大御神の勾玉から成った、五柱の男神の、最初に挙げられる神。天照大御神は、この男神たちを、自分の子と宣言した。",s:"『古事記』上巻「うけひ」（國學院大學 古事記ビューア）"},
 {k:"nagasune",img:"n_nagasune",n:"長髄彦（ながすねびこ）",kind:"伝承",ch:["kashihara"],d:"神武天皇の大和入りに立ちはだかった人物。戦いが苦戦になったとき、金鵄の光で、敵軍は混乱したと伝わる。饒速日命は、長髄彦に従うよう勧めたが聞き入れられず、息子とともに神武天皇に帰順した。絵の姿は、ゲームの見立て。",s:"橿原神宮（公式）「神武天皇御一代記御絵巻」"},
 {k:"kinshi",img:"i_kinshi",n:"金鵄（きんし）",kind:"伝承",ch:["kashihara"],d:"神武天皇の弓の先にとまり、金色の光を放った鵄（鳶）。いまも橿原神宮の授与品の意匠になっている。『日本書紀』に伝わる話とされる（未確認）。",s:"橿原神宮（公式）「神武天皇御一代記御絵巻」「お札・お守り」"},
 {k:"shirohebi",img:"n_shirohebi",n:"白蛇（巳さん）",kind:"伝承",ch:["miwayama"],d:"大神神社では、蛇を「巳さん」と呼んで、福徳をもたらす霊威として崇める。大物主大神の化身とされる白蛇は、巳の神杉に棲むと伝わり、参拝者は、蛇の好物とされる卵をお供えする。",s:"大神神社（公式）「巳の神杉」「三輪山の神語り」"},
 {k:"honda",img:"p_honda",n:"本多静六（ほんだせいろく）",kind:"史実",ch:["meijijingu1920"],d:"林学者。明治神宮の林苑計画の構想の中心となり、内苑の参与を務めた。ドイツで学んだ生態学の考えにもとづいて、森づくりを進めた。",s:"國學院大學（広報記事「100年の森」計画）／明治神宮（公式）Q&A"},
 {k:"meijitenno",img:"p_meiji",n:"明治天皇（めいじてんのう）",kind:"史実",ch:["meijijingu1920"],d:"第122代天皇。明治神宮の祭神。",s:"明治神宮（公式）「明治神宮とは」"},
 {k:"shoken",img:"p_shoken",n:"昭憲皇太后（しょうけんこうたいごう）",kind:"史実",ch:["meijijingu1920"],d:"明治天皇の皇后。明治神宮の祭神。",s:"明治神宮（公式）「明治神宮とは」"},
 {k:"tenmu",img:"p_tenmu",n:"天武天皇",kind:"史実",ch:["sengu2013"],d:"式年遷宮は、天武天皇の御宿願によって始められたとされる。",s:"『神社のいろは』p.156"},
 {k:"jito",img:"p_jito",n:"持統天皇",kind:"史実",ch:["sengu2013"],d:"持統天皇4年（690年）、第1回の式年遷宮が行われた。",s:"『神社のいろは』p.156"}
];

const ITEMS=[
 {k:"kagami",img:"it_kagami",cat:"shinki",n:"八咫鏡（やたのかがみ）",kind:"神話",ch:["iwato","tenson"],d:"三種の神器の一つ。天石屋戸に隠れた天照大御神の前に差し出された鏡とされる。伊勢の神宮に祀られ、宮中では御分身が賢所に祀られる。",s:"『神社のいろは』p.166-167"},
 {k:"tsurugi",img:"it_tsurugi",cat:"shinki",n:"天叢雲剣（草薙剣）",kind:"神話",ch:["orochi","takeru","tenson"],d:"三種の神器の一つ。須佐之男命が八俣遠呂智の尾から得て、天照大御神に献上した大刀（『古事記』では草那芸之大刀）。日本武尊の火攻めの話から、草薙剣の名がついたといわれる。熱田神宮に祀られる。",s:"『古事記』上巻（國學院大學 古事記ビューア）／『神社のいろは』p.88・p.166"},
 {k:"magatama",img:"it_magatama",cat:"shinki",n:"八尺瓊勾玉（やさかにのまがたま）",kind:"神話",ch:["tenson"],d:"三種の神器の一つ。『神社のいろは』では八坂瓊曲玉（八尺勾玉とも）と書く。剣の御分身と勾玉は「剣璽」として、皇位とともに受け継がれる。",s:"『神社のいろは』p.166-167"},
 {k:"hoko",img:"it_hoko",cat:"shinki",n:"天沼矛（あめのぬぼこ）",kind:"神話",ch:["kuniumi"],d:"国生みのとき、伊邪那岐命と伊邪那美命が海をかき回した矛。矛の先からしたたったしずくが積もって、淤能碁呂島ができた。",s:"神社本庁「国生み」"},
 {k:"chibiki",img:"it_iwa",cat:"shinki",n:"千引石（ちびきのいわ）",kind:"神話",ch:["yomi"],d:"千人がかりでやっと動かせるほどの大岩。伊邪那岐命は、これで黄泉比良坂をふさいだ。『古事記』は、この岩を「道反之大神」と呼ぶ。",s:"『古事記』上巻「黄泉国③」（國學院大學 古事記ビューア）"},
 {k:"momo",img:"it_momo",cat:"shinki",n:"意富加牟豆美の桃",kind:"神話",ch:["yomi"],d:"黄泉比良坂のふもとに生えていた桃の実。伊邪那岐命は三つを投げて追っ手を退け、桃に意富加牟豆美命の名を与えた。",s:"『古事記』上巻「黄泉国②」（國學院大學 古事記ビューア）"},
 {k:"gama",img:"it_gama",cat:"shinki",n:"蒲の穂（がまのほ）",kind:"神話",ch:["usagi"],d:"大穴牟遅神が、傷ついた兎に「水門の水で体を洗い、蒲の穂を敷き散らして、その上を転がりなさい」と教えた。",s:"『古事記』上巻「稲羽の素兎」（國學院大學 古事記ビューア）"},
 {k:"hari",img:"it_hari",cat:"shinki",n:"釣り針",kind:"神話",ch:["umisachi"],d:"火遠理命が兄の火照命から借りて、海でなくした釣り針。綿津見神の宮で見つかり、兄に返された。",s:"國學院大學 神名データベース「火遠理命」"},
 {k:"shiotama",img:"it_tama",cat:"shinki",n:"塩盈珠・塩乾珠（しおみつたま・しおふるたま）",kind:"神話",ch:["umisachi"],d:"綿津見神が火遠理命に授けた、潮の満ち干きを操る二つの珠。火遠理命は、これで兄の火照命を懲らしめた。",s:"國學院大學 神名データベース「綿津見神」「火遠理命」"},
 {k:"goo",img:"it_goo",cat:"shinki",n:"牛王宝印（ごおうほういん）",kind:"伝承",ch:["jimmu","kumano_insei"],d:"熊野三山で知られる、八咫烏をあしらった特別なお札。",s:"『神社のいろは』p.66"},
 {k:"sugi",img:"it_sugi",cat:"shinki",n:"しるしの杉",kind:"史実",ch:["inari711","kumano_insei"],d:"伏見稲荷大社の初午の日に授与され、家々に稲荷神を招くものとして信仰される。熊野詣の行き帰りに稲荷社に参り、杉の小枝を身につけた習わしに由来するとされる。",s:"『神社のいろは』p.62／伏見稲荷大社（公式「しるしの杉」）"},
 {k:"kabuto",img:"it_kabuto",cat:"shinki",n:"諏訪法性兜（すわほっしょうのかぶと）",kind:"伝承",ch:["shingen"],d:"武田信玄が使ったと伝わる兜。浄瑠璃や歌舞伎の『本朝廿四孝』に登場する。",s:"長野県立歴史館（「歴史館たより」）"},
 {k:"ganmon",img:"it_ganmon",cat:"shinki",n:"命乞いの願文",kind:"史実",ch:["hideyoshi1589"],d:"豊臣秀吉が、母・大政所の病気平癒を祈り、かなえば一万石を奉加すると記して伏見稲荷大社に納めた願文。",s:"伏見稲荷大社（公式「楼門」）"},
 {k:"hishaku",img:"it_hishaku",cat:"sanpai",n:"柄杓（ひしゃく）",kind:"史実",ch:["yomi","okage1830"],d:"手水舎で水をくむ道具。作法は、①右手で柄杓を取って左手を清め、②左手に持ち替えて右手を清め、③右手に持ち替え、左の手のひらに水を受けて口をすすぐ（柄杓に直接口をつけない）。最後に左手を流し、柄杓を伏せて置く。手水は、伊邪那岐命の禊を簡略化したものとされる。おかげ参りでは、柄杓を差し出すと施行を受けられた。",s:"『神社のいろは』p.32-33／生駒市（文化財資料）"},
 {k:"chinowa",img:"it_chinowa",cat:"sanpai",n:"茅の輪（ちのわ）",kind:"伝承",ch:[],see:["gozu869"],flag:"chinowa",d:"茅を束ねて輪にしたもの。6月30日の大祓（夏越の祓）などで参道に設けられ、3回くぐって穢れや災いを祓い清める。『備後国風土記』逸文で、武塔神（須佐雄能神）が蘇民将来に、茅の輪を腰につければ疫病を免れると教えた話に由来するといわれる。",s:"『神社のいろは』p.70・p.116"},
 {k:"onusa",img:"it_onusa",cat:"ju",n:"大麻（おおぬさ）・祓具",kind:"史実",ch:["yomi"],

function chOf(k){return CH.find(c=>c.key===k)}
function chDone(k){const c=chOf(k);return !!c&&bestOf(c)!=null}
function metP(p){return p.ch.some(chDone)||(p.g&&S.guests.includes(p.g))}
function ownI(it){return it.ch.some(chDone)||(it.flag&&S[it.flag])}
function mamoriOwned(){return ITEMS.filter(it=>it.mamori&&ownI(it))}
function hasEq(k){return S.eq.includes(k)}
/* 図鑑の画面 */
function chipList(keys){return '<div class="chips">'+keys.map(k=>{const i=CH.findIndex(c=>c.key===k);if(i<0)return "";const ok=unlocked(i);return '<button class="chip" type="button" data-ch="'+i+'"'+(ok?'':' disabled')+'>第'+CH[i].id+'章 '+esc(pshort(CH[i]))+'</button>'}).join("")+'</div>'}
function bindChips(){document.querySelectorAll("#overlay .chip").forEach(b=>{if(!b.disabled)b.onclick=()=>{const i=+b.dataset.ch;SE("ok");$("#overlay").style.display="none";S.ch=i;S.leader=null;S.step="map";render()}})}
function zukan(tab){
  tab=tab||"people";
  const tabs=[["memb","仲間"],["people","人物"],["shinki","神器・神話"],["sanpai","参拝・神事"],["ju","授与品"],["kuji","おみくじ"]];
  let h='<div class="ch-h">図鑑</div><div class="tabs">'+tabs.map(t=>'<button class="tab'+(t[0]===tab?' on':'')+'" type="button" data-tab="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>';
  if(tab==="memb"){h+=membersTab()}
  else if(tab==="people"){
    const got=PPL.filter(metP).length;
    h+='<div class="fact" style="color:var(--dim)">旅で出会った神々と人物。その章をクリアすると登録される。　'+got+'／'+PPL.length+'</div>';
    PPL.forEach(p=>{const ok=metP(p);
      h+='<div class="ev zk" style="align-items:flex-start">'+pimg(p.img,ok?"":"hidg")+'<div>'+(ok?'<b class="sp">'+esc(p.n)+'</b>'+tag(p.kind)+'<br>'+esc(p.d)+'<span class="src">出典：'+esc(p.s)+'</span>'+chipList(p.ch):'<span style="color:var(--dim)">？？？　まだ出会っていない</span>'+chipList(p.ch.slice(0,1)))+'</div></div>'});
    h+='<div class="note">人物の説明は、各章の歴史メモと同じ出典にもとづく。絵と台詞は、ゲームのための創作で、実際の姿を写したものではない。</div>';
  }else if(tab==="kuji"){
    h+=kujiLog();
  }else{
    const list=ITEMS.filter(it=>it.cat===tab);const got=list.filter(ownI).length;
    h+='<div class="fact" style="color:var(--dim)">'+CAT[tab]+'。その章をクリアすると登録される。　'+got+'／'+list.length+'</div>';
    list.forEach(it=>{const ok=ownI(it);
      let body='<b class="sp">'+esc(it.n)+'</b>'+tag(it.kind)+(it.mamori&&hasEq(it.k)?'<span class="tag x">身につけている</span>':'');
      if(it.cat==="ju")body+='<dl class="ju"><dt>実際の由来・使われ方</dt><dd>'+esc(it.use)+'</dd><dt>神社・祭神との関わり</dt><dd>'+esc(it.rel)+'</dd><dt>ご利益として伝えられる種類</dt><dd>'+esc(it.gor)+'</dd><dt>ゲーム内での効果</dt><dd>'+esc(it.eff)+'</dd></dl>';
      else body+='<br>'+esc(it.d);
      body+='<span class="src">出典：'+esc(it.s)+'</span>'+chipList(it.ch)+(it.see?'<div class="note" style="margin-top:6px">関連する章（蘇民将来の伝承）</div>'+chipList(it.see):'');
      h+='<div class="ev zk" style="align-items:flex-start">'+pimg(it.img,"it"+(ok?"":" hidg"))+'<div>'+(ok?body:'<span style="color:var(--dim)">？？？　まだ手に入れていない</span>'+(it.flag?'<br><span class="src">（ある章のイベントで手に入る）</span>':chipList(it.ch.slice(0,1))))+'</div></div>'});
    if(tab==="ju")h+='<div class="note">ご利益は、神社でそのように伝えられ、授与されているものとして書いた。ゲーム内の効果は、ゲームのための設定で、★の評価を直接約束するものではない。</div>';
  }
  h+='<button class="btn gold" id="closeov" type="button" style="margin-top:12px;justify-content:center">もどる</button>';
  overlay(h);$("#closeov").onclick=closeOv;
  document.querySelectorAll("#overlay .tab").forEach(b=>b.onclick=()=>{SE("page");zukan(b.dataset.tab)});bindChips();
}

const ABIL={inari:"御縁の力で回復するとき、回復が多い。",hachiman:"「攻める」が強い。守ったあと、追っ手を押し返す。",tenjin:"道具の効き目が長く続く（追っ手が2回止まる）。",amate:"「守る」と、体力が少し回復する。話し合いが得意。",minakata:"体力が多く、「攻める」がいちばん強い。"};
const CMD={
 run:{l:"走って逃げる",d:"逃げ切りが進む（統）"},def:{l:"守りを固める",d:"受ける力を減らし、少し進む（統）"},item:{l:"道具を使う",d:"かずら・櫛・桃"},sword:{l:"十拳剣を後ろ手に振る",d:"追っ手を払う（武）"},
 open:{l:"道をひらく",d:"避難が進む（武）"},guard:{l:"人々をかばう",d:"受ける力を減らす（統）"},goen:{l:"御縁の力を借りる",d:"御縁10で体力回復"},retreat:{l:"いったん退く",d:"戦いを終える（負け扱い）"},
 atk:{l:"攻める（追い払う）",d:"相手の気勢をくじく（武）"},talk:{l:"話し合う",d:"説得が進む（魅）"},harai:{l:"祓う",d:"穢れを清め、少し回復"}
};
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function startBattle(kind,hero,after){
  const B=BTL[kind],h=HERO[hero];let max=50+Math.round(h.s["統"]/2)+(hero==="minakata"?15:0)+(hasEq("m_byoki")?20:0);
  if(after==="hap")S.leader=hero;
  S.bt={kind:kind,hero:hero,hp:max,max:max,g:0,turn:0,ken:0,stop:0,used:{},log:[B.intro],done:false,win:null,ch:CH[S.ch].key,after:after,guard:0};
  S.step="battle";render();SE("alert");
}
/* 背景（人物なし）に、戦っている仲間を重ねる */
function bScene(){const b=S.bt,B=BTL[b.kind];return '<div class="bscene">'+scene(B.sc).replace('class="scene"','class="scene btl"')+pimg(b.hero,"bhero")+'</div>'}
function bStat(k){return HERO[S.bt.hero].s[k]}
function bAct(cmd,arg){
  const b=S.bt,B=BTL[b.kind];const hero=HERO[b.hero].n;let msg="";let dmgMul=1;b.guard=0;
  if(cmd==="run"){const v=Math.round(bStat("統")*0.22)+rnd(6,12);b.g+=v;msg=hero+"は、伊邪那岐命とともに走った。逃げ切り +"+v;}
  else if(cmd==="def"){const v=Math.round(bStat("統")*0.08)+rnd(2,5);b.g+=v;b.guard=1;msg=hero+"は、守りを固めながら進んだ。逃げ切り +"+v;}
  else if(cmd==="guard"){const v=rnd(3,6);b.g+=v;b.guard=1;msg=hero+"は、人々の前に立ってかばった。避難 +"+v;}
  else if(cmd==="sword"){const v=Math.round(bStat("武")*0.08)+rnd(2,5);b.g+=v;dmgMul=0.5;msg="十拳剣を後ろ手に振りながら走る。追っ手が、ひるんだ。逃げ切り +"+v;SE("hit");}
  else if(cmd==="open"){const v=Math.round(bStat("武")*0.22)+rnd(5,11)+(hasEq("m_hissho")?4:0)+(b.hero==="minakata"?4:0);b.g+=v;msg=hero+"は、倒れた柵や荷車をどけて、道をひらいた。避難 +"+v;SE("hit");}
  else if(cmd==="atk"){const v=Math.round(bStat("武")*0.3)+rnd(4,10)+(hasEq("m_hissho")?5:0)+(b.hero==="hachiman"?5:0);b.g+=v;msg=hero+"が、ぐっと前に出た。山賊の気勢がくじけた。説得 +"+v;SE("hit");}
  else if(cmd==="talk"){const v=Math.round(bStat("魅")*0.3)+rnd(4,10);b.g+=v;msg=hero+"は、落ち着いて話しかけた。山賊の顔が、少しやわらいだ。説得 +"+v;}
  else if(cmd==="goen"){const f=CH[S.ch].f;if((S.goen[f]||0)<10){msg=FN[f]+"の御縁が足りない（10必要）。";}else{S.goen[f]-=10;const v=b.hero==="inari"?30:20;b.hp=Math.min(b.max,b.hp+v);msg=FN[f]+"の御縁を10使って、力を借りた。体力 +"+v;SE("goen")}}
  else if(cmd==="harai"){b.ken=0;b.hp=Math.min(b.max,b.hp+6);msg="大麻を左右左と振って、穢れを祓った。体力 +6";SE("harai")}
  else if(cmd==="item"){
    if(arg==="momo"){b.g=100;msg="坂のふもとの桃の実を三つ取って投げると、追っ手は退いていった！（意富加牟豆美命）";SE("dodge")}
    else{const it=arg==="kazura"?"かずら":"櫛";b.used[arg]=1;b.stop=b.hero==="tenjin"?2:1;msg=arg==="kazura"?"髪飾りのかずらを投げると、山ぶどうが実った。追っ手が、それを食べている！":"櫛の歯を折って投げると、筍が生えた。追っ手が、それを食べている！";SE("dodge")}}
  else if(cmd==="retreat"){b.done=true;b.win=false;b.retreat=true;b.log.push("いったん退いた。");return bEnd()}
  b.g=Math.min(100,b.g);b.turn++;b.log.push(msg);
  if(b.g>=100){b.done=true;b.win=true;return bEnd()}
  // 相手（追っ手・混乱・山賊）の番
  if(b.stop>0){b.stop--;b.log.push("…追っ手は足を止めている。");}
  else{
    let d=rnd(B.dmg[0],B.dmg[1]);if(B.ken)d+=b.ken*2;
    if(b.guard){d=Math.round(d*(0.45-(hasEq("m_anzan")?0.15:0)));if(b.hero==="amate"){b.hp=Math.min(b.max,b.hp+6)}}
    d=Math.max(0,Math.round(d*dmgMul));
    if(Math.random()<0.12+bStat("知")/1000){b.log.push(B.foe(b.g,b.turn)+"。…うまくかわした！");SE("dodge")}
    else{b.hp-=d;b.log.push(B.foe(b.g,b.turn)+"。体力 −"+d+(b.guard&&b.hero==="amate"?"（アマテは守りながら回復した）":""));SE("hit")}
    if(b.guard&&b.hero==="hachiman"&&B.cmds.includes("run")){b.g=Math.min(100,b.g+4);b.log.push("ハチマンが追っ手を押し返した。逃げ切り +4")}
  }
  if(B.ken&&!hasEq("m_chinowa")&&b.ken<3&&b.turn%2===0){b.ken++;b.log.push("黄泉の穢れが、まとわりつく…（穢れ "+b.ken+"）")}
  if(b.hp<=0){b.hp=0;b.done=true;b.win=false;return bEnd()}
  if(b.turn>=B.turns){b.done=true;b.win=false;b.log.push("時間がかかりすぎた。");return bEnd()}
  render();
}

function twStart(el,ms){
  const items=[];
  (function walk(n){Array.from(n.childNodes).forEach(ch=>{
    if(ch.nodeType===3){if(ch.nodeValue.length){items.push({t:ch,s:ch.nodeValue});ch.nodeValue=""}}

function twStep(){

  T.tm=setTimeout(twStep,delay);

function twFollow(el,t){try{if(el.scrollHeight<=el.clientHeight)return;const r=document.createRange();r.selectNodeContents(t);const b=r.getBoundingClientRect(),mb=el.getBoundingClientRect();if(b.bottom>mb.bottom-6)el.scrollTop+=b.bottom-mb.bottom+6}catch(e){}}

function twShow(e){e.classList.remove("twh");if(e.dataset&&e.dataset.se&&!e.dataset.sed){e.dataset.sed="1";SE(e.dataset.se)}}
function twDone(){const T=TW;if(!T)return;clearTimeout(T.tm);T.items.forEach(it=>{if(it.e)twShow(it.e);else it.t.nodeValue=it.s});T.el.classList.remove("twing");T.el.removeAttribute("aria-busy");TW=null}
function twStop(){if(TW){clearTimeout(TW.tm);TW.el.classList.remove("twing");TW.el.removeAttribute("aria-busy");TW=null}}
function twSkip(){if(!TW)return;twDone();TWSW=Date.now()}
/* タップの扱い：表示の途中のタップは「全部表示」だけにして、ボタンの操作（次へ進む）には使わない */
function twHit(e){const T=TW;if(!T)return false;const t=e.target;if(!t||!t.closest)return false;
  if(T.el.id==="msg")return !t.closest("#top,#overlay");return T.el.contains(t)}
document.addEventListener("pointerdown",e=>{if(twHit(e))twSkip()},true);
window.addEventListener("click",e=>{
  if(twHit(e)){twSkip();e.preventDefault();e.stopPropagation();return}
  if(Date.now()-TWSW<350&&e.target&&e.target.closest&&e.target.closest("#cmd,#msg")){e.preventDefault();e.stopPropagation()}
},true);
document.addEventListener("keydown",e=>{if(TW&&TW.el.id==="msg"&&(e.key==="Enter"||e.key===" ")&&!$("#overlay").contains(document.activeElement)){twSkip();e.preventDefault();e.stopPropagation()}},true);

  else if(k==="page"){tn(D,79,t,.05,"triangle",.09);tn(D,86,t+.05,.08,"triangle",.09)}
  else if(k==="star"){const n=arg||0;const notes=[74,79,83,86];for(let i=0;i<=n;i++)tn(D,notes[i],t+i*.11,.12,"square",.05);if(n>=3)tn(D,91,t+.46,.35,"square",.05)}
  else if(k==="goen"){[86,90,93,98].forEach((m,i)=>tn(D,m,t+.5+i*.05,.18,"triangle",.07))}
  else if(k==="clap"){[0,.32].forEach(dt=>{nz(D,t+dt,.11,.16,700);nz(D,t+dt,.05,.08,2500)})}
  else if(k==="suzu"){for(let i=0;i<6;i++)tn(D,i%2?96:100,t+i*.045,.09,"square",.022)}
  else if(k==="alert"){tn(D,74,t,.08,"square",.05);tn(D,75,t+.09,.08,"square",.05);tn(D,74,t+.18,.08,"square",.05);tn(D,70,t+.27,.18,"square",.05)}
  else if(k==="go"){[62,67,69,74].forEach((m,i)=>tn(D,m,t+i*.07,.09,"square",.045))}
  else if(k==="hit"){nz(D,t,.12,.12,0,1200);tn(D,57,t,.1,"square",.05,-12)}
  else if(k==="dodge"){tn(D,79,t,.14,"triangle",.08,12)}
  else if(k==="down"){tn(D,67,t,.12,"square",.045);tn(D,63,t+.12,.12,"square",.045);tn(D,58,t+.24,.25,"square",.045)}
  else if(k==="harai"){nz(D,t,.25,.05,3000);for(let i=0;i<4;i++)tn(D,98,t+.05+i*.06,.08,"square",.018)}
  else if(k==="type"){tn(D,84,t,.018,"square",.011)}
  else if(k==="stamp"){const s=t+(arg||0);kick(D,s,.14);nz(D,s,.07,.05,0,900)}
  else if(k==="fanfare"){const s=t+(arg||0);[[67,0,.1],[67,.11,.1],[67,.22,.1],[72,.33,.32],[71,.7,.12],[72,.83,.12],[76,.96,.5]].forEach(x=>{tn(D,x[0]+7,s+x[1],x[2],"square",.04);tn(D,x[0]-5,s+x[1],x[2],"triangle",.06)})}
}
