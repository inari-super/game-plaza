<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歴史戦隊ジンジャーマン　時をかける信仰史</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05051c; --win1:#1a1a7a; --win2:#0a0a3c; --line:#e8e8ff; --line2:#7a86ff;
  --gold:#f8d820; --red:#f83800; --txt:#ffffff; --dim:#a8b0e8; --warn:#f8a8c0; --crow:#c8c8d8;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05051c;--win1:#1a1a7a;--win2:#0a0a3c;--txt:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05051c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:var(--font)}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:6px;padding:6px}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:2px solid var(--line);border-radius:4px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--line2)}
#top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;gap:8px;line-height:1.3}
#top b{color:var(--gold);font-weight:normal}
#top small{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.sep{font-size:12px;color:var(--gold);padding:6px 6px 2px;border-left:4px solid var(--gold);margin-top:4px}
.band{margin:18px 0 6px;padding:6px 8px;border-left:6px solid var(--gold);background:#0c0c34}
.band b{font-weight:normal;font-size:16px}
.band .none{font-size:12px;color:var(--dim);margin-top:2px}
#msg .who{font-weight:normal}
body[data-fs="s"] #msg,body[data-fs="s"] .twdemo{font-size:13px}
body[data-fs="l"] #msg,body[data-fs="l"] .twdemo{font-size:19px;line-height:1.75}
body[data-fs="l"] #msg .chip.talk{font-size:14px}
#msg,.twdemo{overflow-wrap:anywhere;word-break:normal;line-break:strict}
.fsz{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.fsz .btn{flex:1;min-width:64px;justify-content:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}.tab{font-family:var(--font);font-size:12px;padding:6px 8px;border:1px solid var(--line2);background:#10104a;color:var(--dim);border-radius:3px;cursor:pointer}.tab.on{border-color:var(--gold);color:var(--gold);background:#2a2a88}
.chip.talk{margin-top:8px;font-size:13px;padding:6px 12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip{font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--line2);background:#14145a;color:#dfe3ff;border-radius:10px;cursor:pointer}.chip[disabled]{opacity:.45;cursor:not-allowed}
.ev.zk{font-size:13px;line-height:1.55}.ev img.it{height:32px;width:32px;image-rendering:pixelated}.btn img.it{height:28px;width:28px;image-rendering:pixelated;flex:none}
dl.ju{margin:4px 0;font-size:12px}dl.ju dt{color:var(--gold);margin-top:3px}dl.ju dd{margin:0 0 0 .5em}
.kuji{margin:8px 0;padding:10px;border:2px solid var(--line);background:#fffaf0;color:#201818;text-align:center;white-space:normal}.kuji .kr{font-size:26px;color:#c83028}.kuji .uta{margin:6px 0;font-size:14px;letter-spacing:.05em}
.kset{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.kset span{font-size:12px;padding:2px 6px;border:1px dashed #5a5a80;color:#8c8ca4;border-radius:3px}.kset span.on{border-style:solid;border-color:var(--gold);color:var(--gold)}.kset span{min-width:64px;text-align:center}.kset b{font-weight:normal}
.bt{margin:6px 0;padding:6px 8px;border:1px solid var(--line2);background:rgba(0,0,0,.35);white-space:normal;font-size:13px}.bt .row{display:flex;align-items:center;gap:6px;margin:3px 0}.bscene{position:relative;margin:0 0 8px}.bscene .scene{margin:0}.scene.btl{height:96px;object-fit:cover;object-position:50% 80%}.bscene .bhero{position:absolute;right:7%;bottom:5px;height:46%;image-rendering:pixelated;filter:drop-shadow(1px 1px 0 #000)}.bt .row>span:first-child{width:9.5em;flex:none;display:flex;align-items:center;gap:3px}.bt .row img{height:20px}.bar2{flex:1;height:10px;background:#000;border:1px solid var(--line2)}.bar2 i{display:block;height:100%}.bt .row>span:last-child{width:4.6em;text-align:right;flex:none}
.blog{font-size:13px;line-height:1.6;color:#dfe3ff;white-space:normal;border-left:3px solid var(--line2);padding-left:6px}
.hint{color:var(--gold);font-size:12px;margin-right:4px;flex:none}
.tsnd{display:flex;justify-content:flex-end;gap:6px}
.tsnd .btn{width:auto;min-height:36px;padding:6px 12px;font-size:13px}
.snd{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.snd button{font-family:var(--font);font-size:11px;min-width:30px;height:26px;padding:0 5px;border-radius:3px;border:1px solid #5a5a80;background:#10104a;color:#8c8ca4;opacity:.6;cursor:pointer}
.snd button.on{border-color:var(--gold);color:var(--gold);opacity:1;background:#2a2a88}
#top .r{text-align:right;white-space:nowrap}
#mapwrap{position:relative;border:2px solid var(--line);box-shadow:0 0 0 2px #000;background:#183484;line-height:0;flex:none}
#map{width:100%;height:auto;image-rendering:pixelated;display:block}
.mk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px #000}
.mk.dim{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:#ffb060;border-width:1px}
.mk.on{animation:pulse 1s infinite steps(2,end)}
@keyframes pulse{50%{transform:scale(1.5)}}
.mklabel{position:absolute;transform:translate(-50%,10px);font-size:11px;line-height:1.2;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;white-space:nowrap}
.token{position:absolute;width:20px;transform:translate(-50%,-100%);image-rendering:pixelated;filter:drop-shadow(1px 1px 0 #000)}
#party{display:flex;gap:2px;padding:5px 4px;justify-content:space-between;flex:none}
.pc{flex:1;text-align:center;font-size:clamp(9px,2.7vw,12px);padding:3px 0;border:1px solid transparent;border-radius:3px;line-height:1.1;min-width:0;white-space:nowrap;word-break:keep-all;letter-spacing:-.02em}
.pc img{height:32px;image-rendering:pixelated;display:block;margin:0 auto 2px}.pc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.pc img.big{height:41px}
.pc.sel{border-color:var(--gold);background:rgba(248,216,32,.15)}
.pc.hid img{filter:brightness(0) opacity(.55)}
.pc.km{color:var(--crow)}
#msgwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#msg{padding:10px 12px;font-size:15px;line-height:1.55;overflow-y:auto;flex:1;min-height:90px;white-space:pre-wrap}
#msg .sp{color:var(--gold)}
#msg .stars{color:var(--gold);letter-spacing:2px;font-size:18px}
.ev{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border:1px solid var(--crow);border-radius:3px;background:rgba(0,0,0,.35);white-space:normal}
.ev img{height:44px;image-rendering:pixelated;flex:none}
.memo{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);font-size:13px;color:#dfe3ff;white-space:normal}
.memo ul{padding-left:16px;margin:4px 0}
.memo li{margin:6px 0}
.tag{display:inline-block;font-size:10px;padding:0 4px;border:1px solid var(--line2);color:var(--dim);margin-right:4px;border-radius:2px}
.tag.t{color:var(--warn);border-color:var(--warn)}.tag.m{color:#c8b0ff;border-color:#c8b0ff}.tag.f{color:#98e0a8;border-color:#98e0a8}.tag.x{color:var(--gold);border-color:var(--gold);border-style:dashed}
.src{display:block;font-size:10px;color:var(--dim)}
#cmd{display:flex;flex-direction:column;gap:6px;max-height:50%;overflow-y:auto;padding:2px;flex:none}
#app.lst #cmd{max-height:72%}
#app.lst #msg{min-height:64px}
.btn{font-family:var(--font);font-size:15px;color:var(--txt);text-align:left;padding:10px 12px;min-height:46px;border-radius:4px;border:2px solid var(--line);background:linear-gradient(180deg,#2a2aa8,#12125a);box-shadow:0 0 0 2px #000;cursor:pointer;display:flex;gap:8px;align-items:center;width:100%}
.btn:active,.btn:focus-visible{background:linear-gradient(180deg,#4a4ad8,#2a2a88);outline:2px solid var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn[disabled]{background:#24243a;border-color:#5a5a70;color:#8c8ca4;box-shadow:0 0 0 2px #000;cursor:not-allowed}
.btn[disabled] .no,.btn[disabled] .st{color:#8c8ca4}
.btn.locked span small{color:#7a7a92}
.why{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.nm{white-space:nowrap;word-break:keep-all}
.btn .hp{width:28px;image-rendering:pixelated;flex:none}.btn .hp.big{width:36px}.ev img.big{height:56px}.bar .bn img.big{height:23px}.bt .row img.big{height:26px}.token.big{width:28px}.bscene .bhero.big{height:59%}.ev img.em{height:40px;width:40px}
.btn small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.btn .no{color:var(--gold);flex:none;width:2.2em;text-align:right}
.btn .st{margin-left:auto;color:var(--gold);flex:none;letter-spacing:1px}
.row2{display:flex;gap:6px}
.row2 .btn{justify-content:center}
#overlay{position:fixed;inset:0;background:var(--bg);display:none;z-index:5;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
#overlay .in{max-width:440px;margin:0 auto}
.title{text-align:center;margin-top:6vh}
.title h1{font-weight:normal;color:var(--gold);font-size:30px;line-height:1.25;margin:10px 0;text-shadow:3px 3px 0 #800}
.title .sub{color:#9ad0ff;font-size:14px;margin-bottom:16px}
.title .small{font-size:11px;color:var(--dim);margin-top:16px;line-height:1.7;text-align:left}
.heroes{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;margin:12px 0}
.heroes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.heroes figcaption{font-size:11px;line-height:1.1;white-space:nowrap;word-break:keep-all;color:#dfe3ff}
.heroes img{height:64px;image-rendering:pixelated}.heroes{align-items:flex-end}.heroes img.big{height:82px}
.heroes img.hid{filter:brightness(0) opacity(.6)}
.ch-h{color:var(--gold);margin:14px 0 4px;font-size:15px}
.fact{font-size:13px;margin:6px 0;line-height:1.5}
.prog{height:8px;border:1px solid var(--line);background:#000;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--gold)}
#sound-unused{position:absolute;right:6px;top:6px;z-index:2;font-family:var(--font);font-size:12px;padding:4px 8px;border-radius:3px;border:1px solid var(--line);background:rgba(10,10,60,.85);color:var(--txt);cursor:pointer;line-height:1.2}
body[data-fs="l"] #msg .scene{width:70%;margin-left:auto;margin-right:auto}
.scene{display:block;width:100%;height:auto;image-rendering:pixelated;border:2px solid var(--line);box-shadow:0 0 0 2px #000;margin:0 0 8px}
#app.evm #mapwrap{display:none}
svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bars{margin:6px 0}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;margin:4px 0}
.bar .bn{width:4.6em;display:flex;align-items:center;gap:3px;flex:none}
.bar .bn img{height:18px;image-rendering:pixelated}
.bar .bt{flex:1;height:10px;background:#000;border:1px solid var(--line2)}
.bar .bt i{display:block;height:100%}
.bar .bv{width:6.8em;text-align:right;flex:none;font-size:12px}
.bar .bv em{font-style:normal;color:var(--gold);font-size:10px;margin-left:3px}
.note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:4px}
.tag{margin-left:4px}
.row2 .btn{font-size:13px;padding:9px 4px;min-height:42px}
.ev img.hidg{filter:brightness(0) opacity(.5)}
.ev img{height:44px}

/* PC・横長画面：地図（左）と文章（右）の2段組み */
@media (min-width:760px) and (min-height:520px){
  #app{max-width:900px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "map msg" "party msg";gap:8px;padding:10px}
  #top{grid-area:top;font-size:14px}
  #mapwrap{grid-area:map;align-self:start}
  #app.evm #mapwrap{display:block}
  #party{grid-area:party;align-self:start}
  #msgwrap{grid-area:msg;min-height:0}
  #msg{font-size:16px}
  body[data-fs="s"] #msg{font-size:14px}
  body[data-fs="l"] #msg{font-size:21px}
  .pc{font-size:12px}
  .pc img{height:40px}
  .pc img.big{height:51px}
  #overlay .in{max-width:880px}
  .title{max-width:560px;margin-left:auto;margin-right:auto}
  .scene{max-width:560px}
}
@media (max-width:359px){
  .pc img{height:26px}
  .pc img.big{height:33px}
  .heroes img{height:52px}
}
@media (prefers-reduced-motion:reduce){.mk.on{animation:none}}
/* 第3弾：タイプ表示 */
.twh{display:none!important}
/* 勢力図・収集率の棒が、戦闘の枠（.bt）の余白でつぶれていたのを直す */
.bar .bt{padding:0;margin:0}
button{touch-action:manipulation}
.twing{cursor:pointer}
.twdemo{min-height:4.8em;margin:8px 0;padding:8px 10px;border:2px solid var(--line);background:linear-gradient(180deg,var(--win1),var(--win2));white-space:pre-wrap;font-size:15px;line-height:1.55;cursor:pointer}
.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd .btn{justify-content:center;font-size:14px;min-height:42px}
.snd button.cfg{opacity:1;color:#dfe3ff;border-color:var(--line2)}
/* 御朱印帳（ゲームの創作の意匠） */
.book{touch-action:pan-y;user-select:none;-webkit-user-select:none;max-width:300px;margin:8px auto 0;overflow:hidden}
.pgw.inR{animation:pgR .22s ease-out}.pgw.inL{animation:pgL .22s ease-out}
@keyframes pgR{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}@keyframes pgL{from{transform:translateX(-30%);opacity:0}to{transform:none;opacity:1}}
.spg{position:relative;background:#f4ecd8;background-image:repeating-linear-gradient(0deg,rgba(120,90,40,.04) 0 1px,transparent 1px 5px);color:#1d1a16;border:2px solid #b5a173;box-shadow:0 0 0 2px #000;padding:14px 12px 8px;display:flex;flex-direction:column;margin:2px}
.spg .cols{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:stretch;height:300px;position:relative}
.spg .v{writing-mode:vertical-rl;white-space:nowrap;line-height:1}
.spg .hou{font-size:20px;letter-spacing:.35em;align-self:flex-start}
.spg .mid{position:relative;display:flex;flex-direction:row-reverse;justify-content:center;align-items:center;gap:6px;flex:1}
.spg .snm{font-size:34px;letter-spacing:.12em;position:relative;z-index:1}
.spg .ssub{font-size:12px;letter-spacing:.15em;color:#4a4436;align-self:flex-end;margin-bottom:6px;position:relative;z-index:1}
.spg .dt{font-size:14px;letter-spacing:.14em;align-self:flex-end}
.spg .seal{position:absolute;right:2px;bottom:2px;left:auto;top:auto;width:62px;height:62px;margin:0;transform:rotate(-4deg);border:3px solid #c8322a;box-shadow:0 0 0 2px #f4ecd8,0 0 0 4px #c8322a;color:#c8322a;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;padding:3px;font-size:19px;line-height:1;opacity:.85;z-index:0}
.spg .seal span{display:block}
.spg.chi .hou{color:#3b5a7a}
.spg .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #9c8c66;margin-top:8px;padding-top:5px;font-size:12px;gap:6px}
.spg .pst{color:#b8860b;letter-spacing:1px;font-size:14px}
.spg .foot2{font-size:12px;color:#4a4436;margin-top:3px;line-height:1.4}
.spg.none{background:#2a2a48;background-image:none;border:2px dashed #6a6a90;color:#8c8ca8;opacity:.6}
.spg.none .cols{justify-content:center}.spg .pnone{font-size:18px;letter-spacing:.3em;align-self:center}
.spg.none .foot{border-top-color:#5a5a80}
.pginfo{font-size:12px;color:var(--dim);line-height:1.6;margin:6px 2px 0;min-height:3.2em}
.pgn{text-align:center;font-size:12px;color:var(--dim);margin-top:4px}
.toc{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}
.toc .tc{font-family:var(--font);font-size:11px;height:26px;border:1px dashed #5a5a80;background:#10104a;color:#8c8ca4;border-radius:3px;cursor:pointer;padding:0}
.toc .tc.on{border:1px solid #c8322a;background:#3a1418;color:#ffb0a8}
.toc .tc.cur{outline:2px solid var(--gold);outline-offset:1px}
.miniseal{flex:none;width:40px;height:40px;border:2px solid #e05048;color:#ff8078;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;transform:rotate(-4deg)}
.ev.shu{border-color:#e05048}.ev.rk{border-color:var(--gold);background:rgba(248,216,32,.12)}.ev.rk b{color:var(--gold);font-weight:normal}.ev.rk small{color:#dfe3ff;font-size:12px}
/* 巡礼者ランク */
.trank{margin:4px 0 14px;font-size:14px;color:#dfe3ff}.trank b{color:var(--gold);font-weight:normal;font-size:16px}
.rankbox{margin:6px 0 10px;padding:10px;border:2px solid var(--gold);background:rgba(248,216,32,.08);text-align:center}
.rankbox .rl{font-size:12px;color:var(--dim)}.rankbox .rn{font-size:24px;color:var(--gold);margin:4px 0}.rankbox .rd{font-size:13px}
.fact .ok{color:#98e0a8;margin-right:4px}.fact .ng{color:var(--dim);margin-right:4px}
.bar.rec .bn{width:6.4em}.bar.rec .bv{width:7.6em}
.rlist{display:flex;flex-direction:column;gap:3px;font-size:13px}.rlist div{padding:4px 8px;border:1px dashed #5a5a80;color:#8c8ca4;display:flex;justify-content:space-between;gap:8px}.rlist div.on{border:1px solid var(--gold);color:var(--gold)}.rlist b{font-weight:normal}.rlist small{font-size:11px;color:var(--dim)}
.row2 .btn{font-size:clamp(11px,3.4vw,13px)}
@media (prefers-reduced-motion:reduce){.pgw.inR,.pgw.inL{animation:none}}

</style>
</head>
<body>

{key:"tenchi",theme:"天地のはじまりと、造化三神",per:"神話時代",arr:"天も地も、まだ形を持たない。\n『古事記』の、いちばん最初の頁。ジンジャーマンは、高天原に立っている。\nイナリ「うわっ、足元が、ふわふわしとる！」\nテンジン「国は、まだ若くて、浮いた脂みたいに漂うて、クラゲみたいに揺れとった、と『古事記』は書いとる。」\nハチマン「…脂。クラゲ。」\nアマテ「ここに、いちばん最初に成った神は、天之御中主神。…けれど、すぐに身を隠してしまわれる。」\nミナカタ「えっ、出てきてすぐ、隠れるんか？」\nテンジン「そういう神さんたちなんや。男でも女でもない、『独神』いうてな。」\nイナリ「ほな、俺ら、何を見届けるん？」\nアマテ「…名前だけが、先に現れた神々の物語じゃ。」",sp:[0, 0, 0, 0, 0, 0],f:"amate",sc:"m28",era:"神代",place:"高天原（神話の世界）",mk:"takama",best:"tenjin",bs:"ほな、いちばん最初の頁から、読んでみよか。",
 intro:"『古事記』は、天地が初めて成ったとき、高天原に最初に成った神として、天之御中主神の名を挙げる。次に、高御産巣日神、神産巣日神。三柱とも、独神として成り、身を隠した。\n\nジンジャーマンは、物語のいちばん最初の頁を、のぞきに来た。",
 pol:"名前だけが残る神々を、どう受けとめる？",
 ch:[{l:"最初に成った三柱の神を数える",sc:2,t:"天地が初めて成ったとき、高天原に、天之御中主神が成った。次に、高御産巣日神。次に、神産巣日神。この三柱は、いずれも「独神」として成り、身を隠した。\n神名データベースは、この三柱を「造化三神」と呼ぶ。"},
     {l:"葦の芽のように萌え上がる神を見る",sc:1,t:"国は、まだ若く、浮いた脂のように漂い、クラゲのように揺れていた。その中から、葦の芽のように萌え上がるものによって、宇摩志阿斯訶備比古遅神が成った。続いて、天之常立神が成った。\nここまでの五柱が、「別天神」とされる。"},
     {l:"「成る」ということばに注目する",sc:2,t:"『古事記』は、神が「生まれた」ではなく「成った」と書く。「生む」のような親子の関係や、「作る」のような作る・作られる関係とは違い、支配する・されるの関係を含まない、存在の出現を表すことばだと考えられている。"}],
 res:"世界のはじまりに、まず現れたのは、名前だけの神々だった。\n天之御中主神は、そのあとの物語に、ほとんど登場しない。けれど、高御産巣日神と神産巣日神は、のちに、国づくりや天孫降臨の場面で、ふたたび顔を出す。\nテンジン「ほな、次は、国生みや。ここから先は、動く神さんの話やで。」\nイナリ「ようやく、出番やな！」",
 memo:[{k:"神話",t:"天地が初めて成ったとき、高天原に最初に成った神は、天之御中主神。次に、高御産巣日神と神産巣日神が成った。この三柱は、いずれも独神として成り、身を隠した。",s:"『古事記』上巻「天地初発」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"国が若く、浮いた脂のように漂い、クラゲのように揺れていたとき、葦の芽のように萌え上がるものから、宇摩志阿斯訶備比古遅神が成った。続いて天之常立神が成った。この二柱も独神として成り、身を隠した。ここまでの五柱を「別天神」とする。",s:"『古事記』上巻「天地初発」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"天之御中主神・高御産巣日神・神産巣日神は、「造化三神」と呼ばれる。『古事記』の序文には、「参はしらの神、造化の首と作れり」とある。",s:"國學院大學 神名データベース「天之御中主神」"},
       {k:"神話",x:"諸説",t:"「初発」の訓み（ハジメテオコリシ・ヒラク・アラハル・ハジメなど）や、「別天神」の訓みと意味は、定まっていない。独神は、性別が定まらない神と解する説が有力。",s:"『古事記』上巻「天地初発」注釈（國學院大學 古事記ビューア）"},
       {k:"史実",x:"諸説",t:"天之御中主神は、冒頭に一度しか現れず、具体的な活動は描かれない。歴史上、どの氏族に祀られた形跡も、ほとんど見いだされない。古くから信仰された神というより、記紀の編纂期に近い時期に、観念的に作られた神だとする見方があり、道教の北辰・太一・天皇大帝などの影響が指摘される。確定した説ではない。",s:"國學院大學 神名データベース「天之御中主神」"},
       {k:"史実",x:"諸説",t:"『日本書紀』は、天地開闢の多くの伝で、最初の神を国常立尊や可美葦牙彦舅尊とし、造化三神は補足的に挙げる。記紀ともに、造化三神の伝は、ほかの伝に、あとから付け加えられた部分だと考えられている。",s:"國學院大學 神名データベース「天之御中主神」"},
       {k:"神話",t:"高御産巣日神は、『古事記』で、天孫に天降りを命じる司令神の一柱（天照大御神とともに）。のちに「高木神」とも呼ばれる。神武東征では、熊野の高倉下に横刀を授け、八咫烏を先導役として遣わしたと語られる。",s:"國學院大學 神名データベース「高御産巣日神」"},
       {k:"史実",t:"『延喜式』神名帳には、宮中の御巫が祭る高御産日神のほか、羽束師坐高御産日神社（山城国）、宇奈太理坐高御魂神社・目原坐高御魂神社（大和国）、高御魂神社（対馬国）などが見える。",s:"國學院大學 神名データベース「高御産巣日神」"},
       {k:"伝承",x:"諸説",t:"高天原は、神話上の天上世界。奈良県御所市の高天の台地は、高天原の伝承地の一つとされる。ゲーム内の地図は、その付近を目安として示した見立てで、位置は正確ではない。",s:"國學院大學 古事記ビューア 地名「天安河」解説（高天の台地の記述）。地図の位置は、出典未確認"},
       {k:"史実",x:"未確認",t:"絵の姿は、ゲームの見立て。三柱は独神で、姿や性別は、書かれていない。",s:"（出典未確認）"}]},
{key:"kuniumi",theme:"国生みの神話",per:"神話時代",arr:"天の浮橋の上は、思ったより風が強い。\n伊邪那岐命と伊邪那美命の二柱の神が、天沼矛を手に、下の海を見つめている。国土はまだ固まらず、海に漂っているのだ。\nイナリ「うわっ、下、なんも無いやん！ 足すべらせたら、どこまで落ちるんや。」\nハチマン「…なら、すべらせるな。」\nテンジン「ここから、国生みや。メモ、メモ…。あかん、手がふるえて字にならへん。」\nアマテ「静かに。神さまがたのお仕事じゃ。わらわたちは、見届けに来たのであろう。」\nミナカタ「ワシ、矛を持つの、手伝いましょか？ 力仕事やったら…。」\nアマテ「手伝わずともよい。」\n二柱の神が、ゆっくりと矛を海へおろした。ジンジャーマンは、息をのんで見守った。",sp:[0, 0, 0, 0, 0, 0],f:"amate",sc:"m1",era:"神代",place:"淡路（兵庫県）",mk:"awaji",best:"amate",bs:"天照大御神さまの、父神さまの話じゃ。わらわが参ろう。",gs:["izanagi"],gl:"この矛で、海をかき回そう。",
 intro:"神話のはじまり。天の浮橋に、伊邪那岐命と伊邪那美命の二柱の神が立った。\n下には、まだ固まっていない国土が、海に漂っている。\n\nジンジャーマンは、この国生みに立ち会うことになった。",
 pol:"国生みに、どう立ち会う？",
 ch:[{l:"天沼矛のしずくを見守る",sc:2,t:"二柱の神が天沼矛で海をかき回して引き上げると、矛の先からしたたったしずくが積もって、淤能碁呂島（おのごろじま）ができた。"},
     {l:"生まれた島々を数える",sc:1,t:"二柱の神は、淤能碁呂島に降り立って夫婦となり、はじめに淡路島を、続いて日本の島々を生んだ。"},
     {l:"火の神の誕生を見届ける",sc:1,t:"伊邪那美命は、火の神・火之迦具土神を生んだときに大やけどを負い、亡くなってしまった。"}],
 res:"島々と、多くの神々が生まれた。のちに、伊邪那岐命の禊から、天照大御神・月読命・須佐之男命の「三貴子」が生まれる。",
 memo:[{k:"神話",t:"伊邪那岐命と伊邪那美命が天沼矛で海をかき回すと、矛の先からしたたったしずくが積もって、淤能碁呂島（おのごろじま）となった。二柱は、はじめに淡路島を生んだ。",s:"神社本庁「国生み」／『古事記』上巻（國學院大學 古事記ビューア）"},
       {k:"伝承",t:"伊弉諾神宮（淡路市）は、『日本書紀』に、国生みを終えた伊弉諾尊が「幽宮を淡路の洲に構りて」隠れたとある地とされる。社伝では、今の本殿の位置が、その幽宮の跡と伝える。「一宮さん」とも呼ばれる。",s:"『神社のいろは 続』p.186（神社検定公式テキスト）"},
       {k:"神話",t:"伊邪那岐命が禊をして、左の目を洗うと天照大御神、右の目を洗うと月読命、鼻を洗うと須佐之男命が生まれた（三貴子）。",s:"國學院大學 古事記学センター「『古事記』あらすじ」"},
       {k:"史実",t:"『古事記』は和銅5年（712年）、『日本書紀』は養老4年（720年）にまとめられた。",s:"『神社のいろは 続』p.50-51（神社検定公式テキスト）"}]},
{key:"yomi",per:"神話時代",theme:"黄泉の国の神話",arr:"あたりは、ひんやりと薄暗い。ここは、黄泉の国へと続く坂のふもとだ。\n亡くなった伊邪那美命に会いたい一心で、伊邪那岐命は、黄泉の国まで追ってきたのだ。\nイナリ「…なんや、背中がぞくぞくするわ。」\nミナカタ「ワシもや。…イナリ、手、つないでもええか？」\nイナリ「ええけど、ミナカタの手、汗びっしょりやん。」\nテンジン「ここから先は、生きてる者の国やない。気い引き締めなあかんで。」\nアマテ「伊邪那岐命さまは、ただ、もう一度、奥方さまに会いたいだけなのじゃ…。」\nハチマン「…何が起きても、すぐ動けるようにしておけ。」\n坂の上のほうから、伊邪那岐命の声が聞こえる。「愛しい妻よ、二人で作った国は、まだ作り終えていない。帰ってきてほしい」――。\nその声に答えるように、暗がりの奥で、何かが小さく動いた。",
 sp:[0, 0, 0, 0, 0, 0],f:"amate",sc:"m8",era:"神代",place:"黄泉比良坂（島根県）",mk:"yomi",best:"amate",bs:"天照大御神さまの、父神さまのお話じゃ。わらわが参ろう。",gs:["izanagi"],gl:"…愛しい妻よ。帰ってきてはくれぬか。",
 intro:"国生みのあと、伊邪那美命は、火の神を生んだ傷がもとで亡くなった。\n伊邪那岐命は、妻に会うため、死者の国・黄泉の国へ向かう。",
 pol:"黄泉の国で、どう動く？",
 ch:[{l:"坂のふもとの桃の木へ急ぐ",sc:2,t:"追っ手が迫る。黄泉比良坂のふもとで、伊邪那岐命は桃の実を三つ取って投げつけ、追っ手を退けた。\n伊邪那岐命は、桃の実に「意富加牟豆美命」と名を与えた。"},
     {l:"逃げ道に、かずらや櫛を投げる",sc:1,t:"伊邪那岐命が髪飾りのかずらを投げると山ぶどうが、櫛の歯を折って投げると筍が生えた。\n黄泉醜女たちがそれを食べている間に、一行は先へ逃げた。"},
     {l:"立ち止まって、振り返る",sc:0,t:"振り返るひまはなかった。\n伊邪那岐命は、十拳剣を後ろ手に振りながら、ひたすら坂へと走った。"}],
 res:"伊邪那岐命は、千人がかりで動かすほどの大岩（千引石）で、黄泉比良坂をふさいだ。岩をはさんで、伊邪那美命は「あなたの国の人を一日に千人絞め殺しましょう」と言い、伊邪那岐命は「それなら一日に千五百の産屋を建てよう」と答えた。こうして、一日に千人が死に、千五百人が生まれることになったという。黄泉の穢れをはらうため、伊邪那岐命は、禊へと向かう。",
 memo:[{k:"神話",t:"伊邪那岐命は、亡くなった伊邪那美命に会うため黄泉国へ行ったが、伊邪那美命は、すでに黄泉国のかまどで煮炊きした物を食べていた。「決して私を見ないで」と言われたのに、火をともして見ると、その体には蛆がたかり、八種の雷神が生まれていた。",s:"『古事記』上巻「黄泉国①」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"伊邪那美命は、黄泉の醜女、さらに八種の雷神と千五百の黄泉の兵に後を追わせた。伊邪那岐命は、かずらや櫛を投げ、十拳剣を後ろ手に振って逃げ、黄泉比良坂のふもとの桃の実三つで追っ手を退けた。桃は「意富加牟豆美命」と名づけられた。",s:"『古事記』上巻「黄泉国②」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"伊邪那岐命は、千引石で黄泉比良坂をふさいだ。伊邪那美命が「一日に千人絞め殺しましょう」と言うと、伊邪那岐命は「一日に千五百の産屋を建てよう」と答えた。",s:"『古事記』上巻「黄泉国③」（國學院大學 古事記ビューア）"},
       {k:"伝承",t:"『古事記』は、黄泉比良坂を「今の出雲国の伊賦夜坂」と記す。島根県松江市東出雲町揖屋に、その伝承地があり、黄泉の国の入り口をふさいだ「千引の岩」とされる岩がある。",s:"『古事記』上巻「黄泉国③」・地名「伊賦夜坂」（國學院大學 古事記ビューア）／しまね観光ナビ（島根県観光連盟）"},
       {k:"神話",t:"黄泉の国から戻った伊邪那岐命は、身に着けた物をすべて脱ぎ、水に入って禊をした。これが、参拝の前に手水で手と口をすすぐ作法の起源とされる。",s:"『神社のいろは』p.32（神社検定公式テキスト）"}]},
{key:"ukei",nw:1,theme:"天安河の誓約と、三貴子",per:"神話時代",arr:"天の安の河。川をはさんで、二柱の神が向かい合っている。\n天照大御神は、髪を結い直し、大きな勾玉を身に巻き、背に千本入りの靫を負って、弓を振り立てている。\nイナリ「うわ、天照さま、めっちゃ武装しとる…！」\nアマテ「…あのときは、山も川も鳴り響いて、弟が国を奪いに来たのかと、疑うてしもうたのじゃ。」\nミナカタ「親戚の神さんが、にらみ合うとる…。」\nテンジン「須佐之男命は、母の国へ行く許しをもらいに来ただけや、と言うとる。けど、天照さまは、信じられへん。」\nハチマン「…なら、どうやって証す。」\nテンジン「そこで『うけい』や。お互いの持ち物から神さんを生んで、心の清さを示すんや。」\nイナリ「持ち物から、神さんが生まれるんか！？」\nテンジン「そう書いてある。…見届けよか。」",sp:[0, 0, 0, 0, 0, 0],f:"hachiman",sc:"m29",era:"神代",place:"天安河（宮崎県・高千穂の天安河原は、伝承地の一つ）",mk:"takachiho",best:"hachiman",bs:"…潔白は、示すしかない。",
 intro:"父に追放された須佐之男命は、母の国へ行く許しを乞うため、高天原に上った。天照大御神は、弟が国を奪いに来たのではと疑った。\n\n心に邪心がないことを示すため、二柱は、天の安の河をはさんで「うけひ（誓約）」を行い、子を生んだ。ジンジャーマンは、河のほとりに立った。",
 pol:"疑いと潔白を、どう見届ける？",
 ch:[{l:"三貴子の分治から、さかのぼる",sc:1,t:"伊耶那岐命は、三貴子に、治める国を命じた。天照大御神には高天原、月読命には夜之食国、須佐之男命には海原。\nところが、須佐之男命は、治めるべき国を治めず、髭が胸先に届くまで泣き続けた。母の国（根之堅州国）へ行きたいと答えて、父に追放された。"},
     {l:"天照大御神の武装を見る",sc:2,t:"須佐之男命が上ってくると、山川が鳴り響き、国土が震えた。天照大御神は、髪を結い直して大きな勾玉を身に巻き、千本入りと五百本入りの靫を負い、竹の鞆をつけ、弓を振り立てて、「何のために上ってきたのか」と問いただした。"},
     {l:"持ち物から生まれる神々を見守る",sc:2,t:"須佐之男命の十拳剣を、天照大御神が三つに折り、天の真名井ですすいで噛み砕き、吹き出す息から三柱の女神が成った。天照大御神の勾玉を、須佐之男命が同じようにして、五柱の男神が成った。\n天照大御神は、勾玉から成った男神は自分の子、剣から成った女神は須佐之男命の子、と宣言した。須佐之男命は、女神を生んだことを、自分の勝ちと主張した。"}],
 res:"うけいは、疑いを晴らすための、神話の知恵のような場面だ。生まれた三柱の女神は、のちに、宗像で祀られる。\nこのあと、物語は、天の石屋の場面へ進む。\nアマテ「弟のことを、もう少し、信じてやればよかったのかもしれぬ…。」\nテンジン「そのあとの話は、次の章や。岩屋の戸の前、やな。」",
 memo:[{k:"神話",t:"伊耶那岐命は、三貴子に、天照大御神は高天原、月読命は夜之食国、須佐之男命は海原を治めるよう命じた。須佐之男命は、治めずに泣き続け、悪神の声が満ちて、さまざまな災いが起こった。理由を問われると、母の国である根之堅州国に行きたいからと答え、父に追放された。",s:"『古事記』上巻「三貴子の分治」（國學院大學 古事記ビューア）"},
       {k:"神話",x:"諸説",t:"月読命が治める「夜之食国」の範囲は、昼と夜の分担とみる説や、部分的な統治を示すとする説などがあり、定まっていない。",s:"『古事記』上巻「三貴子の分治」注釈（國學院大學 古事記ビューア）"},
       {k:"神話",t:"須佐之男命が高天原に上ると、山川が鳴り響き、国土が震えた。天照大御神は、国を奪いに来たと疑い、髪を結い直して大きな勾玉を巻き、千本入りと五百本入りの靫、竹の鞆をつけ、弓を振り立てて問いただした。須佐之男命は、邪心はなく、母の国へ行く許しを乞いに来ただけと答え、互いにうけひをして子を生もうと提案した。",s:"『古事記』上巻「須佐之男の昇天」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"うけひでは、天の安の河をはさんで、互いの持ち物（物実）を交換した。須佐之男命の十拳剣から、多紀理毘売命（別名・奥津島比売命）、市寸島比売命（別名・狭依毘売命）、多岐都比売命の三柱の女神が成った。天照大御神の勾玉から、正勝吾勝々速日天之忍穂耳命、天之菩卑能命、天津日子根命、活津日子根命、熊野久須毘命の五柱の男神が成った。",s:"『古事記』上巻「うけひ」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"天照大御神は、男神は自分の物実から成ったので自分の子、女神は須佐之男命の物実から成ったので須佐之男命の子、と宣言した。須佐之男命は、女神を生んだことを、自分の勝ちと主張した。ただし、本文は、男神を生んだことが勝ちだとは、明示していない。",s:"『古事記』上巻「うけひ」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"三女神は、胸形（宗像）の奥津宮・中津宮・辺津宮に祀られる「三前の大神」とされる。天之菩卑命の子の建比良鳥命は、出雲国造など多くの国造らの祖、天津日子根命は、凡河内国造など多くの氏族の祖とされる。",s:"『古事記』上巻「うけひ」（國學院大學 古事記ビューア）"},
       {k:"神話",x:"諸説",t:"『古事記』のうけひは、『日本書紀』と違い、事前の条件を定めずに始まる、と指摘される。天照大御神の男装の描写も、『古事記』独自の要素とされる。",s:"『古事記』上巻「須佐之男の昇天」注釈（國學院大學 古事記ビューア）"},
       {k:"伝承",x:"諸説",t:"天安河は、神話上は高天原を流れる川。実在の川としては、近江の野洲川とする説、大和の飛鳥川・曽我川とする説などがあり、決定的な説はない。宮崎県高千穂町には、「天安河原」とされる洞窟があり、天安河原宮が鎮座する。ゲーム内の地図は、高千穂を使った見立て。",s:"國學院大學 古事記ビューア 地名「天安河」"},
       {k:"史実",x:"未確認",t:"宗像の章では、田心姫神・湍津姫神・市杵島姫神の表記を使った。ここで示した『古事記』の表記（多紀理毘売命・多岐都比売命・市寸島比売命）との対応は、一般に同じ三女神とされるが、このゲームを作るとき、表記ごとの対応を、一次資料で個別には確かめていない。",s:"（出典未確認）"}]},
{key:"iwato",theme:"天岩戸の神話",per:"神話時代",arr:"真っ暗だ。昼のはずなのに、空にも地にも、光がない。\n天照大御神が天石屋戸にこもってしまい、世の中は闇に閉ざされたのだ。手探りで歩くと、あちこちで神々の困った声がする。\nイナリ「アカン、誰かの足ふんだ！ すんません！」\nミナカタ「それ、ワシの足や。気にせんでええ。」\nテンジン「こういう時こそ、知恵の出番や。…わしやないで。天安河原に、知恵の神さんが来てはるらしいんや。」\nハチマン「…神々も、そこに集まっている。行くぞ。」\nいつもは明るいアマテが、ぎゅっと手を握りしめていた。\nアマテ「お日さまがお隠れになると、こんなにも寂しいものなのじゃな…。」\nイナリ「大丈夫や、アマテ。みんなで知恵を出したら、きっと光は戻る。」\nアマテ「…うむ。わらわも、できることをしよう。」\n八百万の神々の相談の輪に、ジンジャーマンも加わった。",sp:[0, 0, 0, 0, 0, 0],f:"amate",sc:"m2",era:"神代",place:"高千穂（宮崎県）",mk:"takachiho",best:"amate",bs:"天照大御神さまが、お隠れに…！ わらわが行かねば！",gs:["susanoo"],gl:"…姉上、すまん。やりすぎた。",
 intro:"高天原で、須佐之男命が乱暴を働いた。\n天照大御神は、天石屋戸（あめのいわやと）にこもってしまい、世の中は闇に閉ざされた。\n\nジンジャーマンは、八百万の神々の相談に加わった。",
 pol:"闇の世界を、どう救う？",
 ch:[{l:"神々と歌い踊って、にぎわう",sc:2,t:"天宇受売命が踊ると、神々はどっと笑い、にぎやかになった。\n天照大御神は不思議に思い、岩戸を少し開けて、外をのぞいた。"},
     {l:"天安河原で、作戦会議",sc:1,t:"困った神々は、天安河原に集まって相談した。\n知恵の神・思金神が、岩戸を開いていただく策を考えた。"},
     {l:"岩戸を力ずくで開ける",sc:0,t:"力だけでは、岩戸は動かない。\nまずは、神々が知恵を出し合うことが必要だった。\n（最後に天照大御神の手を取ったのは、力持ちの天手力男神だったのだが…）"}],
 res:"天手力男神が、天照大御神の手を取って岩屋から引き出した。世界に、ふたたび光が戻った。",
 memo:[{k:"神話",t:"須佐之男命の乱暴を恐れた天照大御神が天石屋戸に隠れ、世界は闇に包まれた。神々は天安河原で相談し、思金神の策で、天宇受売命が踊り、鏡を差し出し、天手力男神が天照大御神を引き出して、光が戻った。",s:"神社本庁「天の岩戸」／『神社のいろは』p.166（神社検定公式テキスト）"},
       {k:"神話",t:"このとき天照大御神の前に差し出された鏡が、のちに三種の神器の一つ、八咫鏡とされる。",s:"『神社のいろは』p.166（神社検定公式テキスト）"},
       {k:"伝承",t:"高千穂町の天岩戸神社の西本宮は、天照大御神が隠れたと伝わる天岩戸（岩屋）を御神体として拝んでいる。",s:"天岩戸神社（公式）"},
       {k:"伝承",t:"近くの天安河原は、八百万の神々が集まって相談した場所と伝わり、思兼神（思金神）と八百萬神を祀る。大きな洞窟「仰慕窟」は、間口約40m・奥行約30m。",s:"天岩戸神社（公式）"}]},
{key:"orochi",theme:"ヤマタノオロチの神話",per:"神話時代",arr:"出雲の山あいを、肥河（ひのかわ）がうねって流れていく。\n高天原を追われた須佐之男命は、上流の鳥髪に降り立った。ジンジャーマンも、そのあとに続く。\nミナカタ「おっ、川上から何か流れてくるで。…箸や！」\nイナリ「箸が流れてくるいうことは、上に誰か住んではるんやな。」\nテンジン「さすがイナリ、ええ推理や。」\nイナリ「ふふん。…で、お昼ごはんの匂いはせえへんか？」\nハチマン「…推理の目的が、変わっている。」\n川をさかのぼると、小さな家の前で、老夫婦が娘を間にはさんで泣いていた。\nアマテ「何かあったのじゃな。まずは、話を聞かせてもらおう。」\nミナカタ「泣いてはる人を、ほっとかれへん。行こ！」\n須佐之男命が、静かにうなずいた。どうやら、ただごとではないらしい。",sp:[0, 0, 0, 0, 0, 0],f:"inari",sc:"m3",era:"神代",place:"出雲（島根県）",mk:"izumo",best:"inari",bs:"スサノオさんは、稲荷の神さん（宇迦之御魂神）の父神や！ 俺が行く！",gs:["susanoo"],gl:"この大蛇は、俺が退治する。",
 intro:"高天原を追われた須佐之男命は、出雲の肥河（ひのかわ）の上流、鳥髪に降り立った。\n川上から、箸が流れてくる。\n\nジンジャーマンは、須佐之男命について、川をさかのぼった。",
 pol:"ヤマタノオロチに、どう立ち向かう？",
 ch:[{l:"泣いている老夫婦の話を聞く",sc:1,t:"老夫婦の足名椎と手名椎には、八人の娘がいた。\n毎年、八つの頭をもつ大蛇・八俣遠呂智（ヤマタノオロチ）が来て、一人ずつ食べてしまい、残るは櫛名田比売だけだという。"},
     {l:"須佐之男命とともに戦う",sc:2,t:"須佐之男命が大蛇を切り、尾を割くと、立派な大刀が出てきた。\n須佐之男命は、それを天照大御神に献上した。草那芸之大刀、のちの草薙剣である。"},
     {l:"大蛇退治の作戦を立てる",sc:1,t:"須佐之男命は、強い酒を用意して、酒船に満たしておくよう、老夫婦に頼んだ。\n大蛇は、その酒を飲んで酔い、眠ってしまった。"}],
 res:"須佐之男命は櫛名田比売と結婚し、出雲の須賀に宮を建てた。そのとき詠んだ「八雲立つ」の歌から、須賀は和歌発祥の地とされる。",
 memo:[{k:"神話",t:"須佐之男命は八俣遠呂智を退治し、その尾から出た大刀を天照大御神に献上した。『古事記』では草那芸之大刀と呼ばれ、草薙剣（天叢雲剣）として、三種の神器の一つとされる。",s:"『古事記』上巻（國學院大學 古事記ビューア）／『神社のいろは』p.166（神社検定公式テキスト）"},
       {k:"伝承",t:"須佐之男命が大蛇退治のあと、初めて宮を作った地とされるのが須我神社（雲南市）で、「日本初之宮」と呼ばれる。",s:"雲南市（公式）"},
       {k:"神話",t:"『古事記』では、稲荷の神・宇迦之御魂神は、須佐之男命と、大山津見神の娘・神大市比売の子とされる。",s:"『古事記』上巻「須賀の宮」（國學院大學 古事記ビューア）"},
       {k:"伝承",t:"須佐之男命が須賀に宮を建てたとき「八雲立つ 出雲八重垣 妻籠めに 八重垣作る その八重垣を」と詠んだといい、須賀は和歌発祥の地とされる。",s:"島根県「しまねの文学碑」（須我神社）"}]},
{key:"usagi",theme:"因幡の白兎の神話",per:"神話時代",arr:"因幡の海に、白い波がきらめいている。\n大穴牟遅神（のちの大国主神）は、兄の八十神たちの大きな荷物を背負い、一行のいちばん後ろを歩いていた。八十神たちは、八上比売に求婚するため、ずんずん先へ行ってしまう。\nミナカタ「その荷物、ワシが半分持ちましょか。」\n大穴牟遅神は、にこりと笑って首をふった。\nイナリ「ええ人やなあ…。兄さんらは、手ぶらで先に行ってしもたのに。」\nテンジン「人の値打ちは、荷物の重さでは決まらへん、いうことやな。」\nハチマン「…待て。岬のほうで、何かが泣いている。」\n気多の岬に、皮をはがされた兎がうずくまっていた。体じゅうが、ひりひりと赤い。\nアマテ「なんと、痛々しい…。」\nミナカタ「こら、ほっとかれへん！」\nジンジャーマンは、急いで兎のもとへ駆け寄った。",sp:[0, 0, 0, 0, 0, 0],f:"minakata",sc:"m4",era:"神代",place:"因幡（鳥取県）",mk:"inaba",best:"minakata",bs:"大国主さんは、うちの神さん（建御名方神）のお父上や！ 任しとき！",gs:["okuninushi","usagi"],gl:"まずは、水門の水で体を洗いなさい。",
 intro:"大国主神（このころの名は大穴牟遅神）の兄弟・八十神たちは、稲羽（因幡）の八上比売に求婚するため、旅に出た。\n大穴牟遅神は、兄たちの荷物を背負って、最後を歩いていた。\n気多の岬で、皮をはがされた兎が泣いている。\n\nジンジャーマンは、その旅に同行していた。",
 pol:"傷ついた兎に、何をしてあげる？",
 ch:[{l:"水門の水で洗い、ガマの穂をすすめる",sc:2,t:"大穴牟遅神は「すぐに水門（河口）へ行き、水で体を洗って、そこの蒲の穂を敷き散らし、その上を転がりなさい」と教えた。\n兎の体は、元どおりになった。"},
     {l:"まず、わけを聞く",sc:1,t:"兎は、淤岐島から渡ろうとして、和邇（わに）をだまして並ばせ、その背を踏んで渡ってきた。\nそれがばれて、皮をはがれたという。"},
     {l:"海の水で洗うようすすめる",sc:0,t:"それは、意地悪な兄たちと同じ答えだ。\n海の水を浴び、風に当たった兎の体は、ますます痛んだ。"}],
 res:"助けられた兎は「八十神は、八上比売を得られない。あなたが得るでしょう」と告げた。この兎を今は「菟神（うさぎがみ）」と呼ぶ、と『古事記』は記す。",
 memo:[{k:"神話",t:"八十神の教えで苦しむ兎に、大穴牟遅神（大国主神）は、水門の水で体を洗い、蒲の穂の上を転がるよう教えて救った。兎は、八上比売を得るのはあなただ、と告げた。",s:"『古事記』上巻「稲羽の素兎」（國學院大學 古事記ビューア）／神社本庁「稲羽の素兎」"},
       {k:"史実",t:"因幡の白兎の神話ゆかりの白兎神社（鳥取市）。境内の樹叢は、国の天然記念物に指定されている。",s:"鳥取市（公式）"},
       {k:"神話",t:"『古事記』は、この兎を「稲羽の素菟（しろうさぎ）」と記し、今は「菟神」と呼ぶ、と結んでいる。",s:"『古事記』上巻「稲羽の素兎」（國學院大學 古事記ビューア）"},
       {k:"神話",t:"諏訪大社の祭神・建御名方神は、大国主神の子とされる。",s:"神社本庁「国譲り」"}]},
{key:"kunidukuri",nw:1,theme:"大国主と少名毘古那神の国づくり",per:"神話時代",arr:"島根・出雲の海辺。大国主神が、波打ち際に、ひとりで立っている。\n沖の波の上から、小さな舟が、こちらへ近づいてくる。\nテンジン「天之羅摩舩や。ガガイモの実に見立てた、小さな船やな。乗っとるのは、えらい小さい神さんや。」\nアマテ「衣は、『ガの皮』と書かれておるそうじゃ。鳥か、虫か、諸説あるらしいのう。」\nイナリ「ガの皮て、どっちのガや？」\nミナカタ「親父、名前を聞いても、答えてもらえんで、困っとるで。」",sp:[0,0,0,0,0,0],f:"tenjin",sc:"m22",era:"神代",place:"出雲（島根県）",mk:"izumo",best:"tenjin",bs:"名前を知っとる神さんを、探したらええんやな。",
 intro:"『古事記』では、出雲の御大の御前で、大国主神の前に、波の上から小さな神が現れる。神産巣日神の子、少名毘古那神だ。二柱の神は、ともに国を作り固めた。\n\nジンジャーマンは、出雲の海辺で、その出会いに立ち会った。",
 pol:"名前のわからない神に、どう向き合う？",
 ch:[{l:"久延毘古に、名前を尋ねる",sc:2,t:"神は名を答えず、従う神々も「知らず」と答えた。たにぐくが、「久延毘古なら、必ず知っておりましょう」と申し出た。\n久延毘古は、足は動かないが、天下のことを、みな知る神。いまの山田のそほど（案山子）にあたるとされる。\n久延毘古は、「神産巣日神の御子、少名毘古那神」と答えた。"},
     {l:"二柱が、国を作り固めるのを見守る",sc:1,t:"神産巣日神は、「これは、まことに我が子。指の間から漏れ落ちた子だ」と認め、大国主神と兄弟になって、国を作り固めるよう命じた。\n二柱の神は、並んで国を作り固めた。\n記紀や風土記では、二柱が、医療や湯治の法を始めたとも伝えられる。"},
     {l:"少名毘古那神が去る場面を見届ける",sc:2,t:"のち、少名毘古那神は、常世国へ渡っていった。\n大国主神は、独りでは国を作れない、と嘆いた。すると、海を光らせて、寄り来る神が現れた。\nその神は、「倭の青垣の東の山の上に、私を祀れ」と告げた。三輪山に鎮まる神、とされる。"}],
 res:"国づくりは、ひとりの神の力ではなく、神々の協力の物語として語られる。\n少名毘古那神は、去っていった。けれど、次の神が、海の彼方から、光とともにやってくる。\nミナカタ「親父を、助けてくれる神さんが、おるんやな。…よかった。」\nテンジン「その神さんが、次に会いに行く、三輪山の神さんや。」",
 memo:[{k:"神話",t:"『古事記』上巻では、大国主神が出雲の御大の御前にいたとき、波の穂から天之羅摩舩に乗り、鵝の皮を内剥ぎに剥いで衣服とした神が現れる。",s:"『古事記』上巻（國學院大學 古事記ビューア「少名毗古那神との国作り」）"},
       {k:"神話",x:"諸説",t:"衣の「鵝」の字は、「蛾（ヒムシ）」の誤字とする説もある。船の「天之羅摩舩」は、ガガイモの実に見立てた船とされる。",s:"『古事記』上巻（國學院大學 古事記ビューア「少名毗古那神との国作り」）"},
       {k:"神話",t:"久延毘古が神の正体を答え、神産巣日神が「我が子」と認めた。大国主神と少名毘古那神は、並んで国を作り固め、のち、少名毘古那神は常世国に渡った。",s:"『古事記』上巻（國學院大學 古事記ビューア）"},
       {k:"神話",t:"『古事記』では、神産巣日神の指令で国作りが始まる点が独特で、『日本書紀』や風土記では、二神が自ら国作りを始めたと伝わる。大国主神と少名毘古那神が共に国作りを行ったことは、記紀・風土記に共通する。",s:"國學院大學 神名データベース「少名毘古那神」"},
       {k:"伝承",t:"大国主神と少名毘古那神が、医療や湯治の法を始めたことは、記紀や風土記で伝えられる。少名毘古那神は、酒の神、石の神ともされる。",s:"國學院大學 神名データベース「少名毘古那神」"},
       {k:"神話",x:"諸説",t:"少名毘古那神は、穀物神としての性格が指摘され、海の彼方からの来訪神と考えられている。ただし、登場の場面では、常世国から来たとは書かれていない、という指摘もある。",s:"國學院大學 神名データベース「少名毘古那神」"},
       {k:"神話",t:"少名毘古那神が去ったあと、「海を光して依り来る神」が現れ、「倭の青垣の東の山の上に伊都岐奉れ」と告げた。注釈は、この神を、御諸山（三輪山）に坐す神、すなわち大物主神と見る。",s:"『古事記』上巻（國學院大學 古事記ビューア「少名毗古那神との国作り」）"},
       {k:"史実",x:"未確認",t:"御大の御前（みほのさき）が、現在のどの場所にあたるかは、確かめていない。ゲーム内の地図は、出雲の海辺としてあらわしている。",s:"（出典未確認）"}]},
{key:"kuniyuzuri",theme:"国譲りの神話と、建御名方神の行方",per:"神話時代",arr:"州羽の海（諏訪湖）の湖面が、空の光をはね返している。\nミナカタ「ここが州羽の海…。なんやろ、初めて来たのに、懐かしい気がするわ。」\nテンジン「ミナカタの名前の元になった神さん、建御名方神ゆかりの地やからな。」\nそのとき、西の空から、ひときわ強い風が吹いてきた。風に乗って、遠い出雲の浜の様子が伝わってくる。天照大御神の使者・建御雷神が、大国主神に、国を譲るよう迫っているのだ。そして大国主神の子・建御名方神が、力くらべを挑もうとしている。\nイナリ「えらいこっちゃ。神さん同士の力くらべやで！」\nハチマン「…どちらにも、それぞれの思いがある。軽々しく口は出せない。」\nアマテ「うむ。事の行方を、しかと見届けよう。」\nミナカタは、湖と西の空を、何度も見比べていた。",sp:[0, 0, 0, 0, 1, 0],f:"minakata",sc:"k2",era:"神代",place:"諏訪（長野県）",mk:"suwa",best:"minakata",bs:"ワシの名前の神さんの話や！ 任しとき！",gs:["okuninushi"],gl:"…この国を、天つ神の御子に譲ろう。",
 intro:"神話の時代。天照大御神の使者・建御雷神が、出雲の大国主神に、国を譲るよう迫った。\n大国主神の子・建御名方神は、力くらべを挑む。\n\nジンジャーマンは、この力くらべを見届けることになった。",
 pol:"力くらべのあと、どうする？",
 ch:[{l:"建御名方神を追いかける",sc:2,t:"力くらべに敗れた建御名方神は、科野国の州羽海（諏訪）まで逃れ、「この地のほかには行かない」と誓った、と『古事記』は記す。"},
     {l:"力くらべに加勢する",sc:0,t:"加勢しようとしたが、建御名方神が建御雷神の手を取ると、その手は氷のように、剣の刃のように変わった。\n割って入るすきはなかった。"},
     {l:"出雲に残って見守る",sc:1,t:"大国主神は、天つ神の御子に国を譲り、立派な宮殿を造って移り住んだ。これが出雲大社とされる。\n建御名方神の行方は、遠く諏訪へ続いていた。"}],
 res:"諏訪の地で、建御名方神は祀られた。中世には「日本第一大軍神」とも称され、多くの武将に崇敬されていく。",
 memo:[{k:"神話",t:"『古事記』では、建御雷神との力くらべに敗れた建御名方神が、科野国の州羽海（諏訪）まで逃れ、この地を出ないと誓った。",s:"『古事記』上巻「葦原中国平定」（國學院大學 古事記ビューア）／『神社のいろは』p.68（神社検定公式テキスト）"},
       {k:"伝承",t:"諏訪大社は、建御名方神を祀り、妃神の八坂刀売神を合わせて祀る。全国の諏訪神社の総本社とされる。",s:"『神社のいろは』p.68（神社検定公式テキスト）"},
       {k:"史実",t:"諏訪大社は、上社（本宮・前宮）と下社（春宮・秋宮）からなり、上社・下社とも本殿がない。下社は木を御神体とし、秋宮はイチイの木を拝む。",s:"『神社のいろは』p.68（神社検定公式テキスト）／諏訪大社（公式）"}]},
{key:"tenson",theme:"天孫降臨の神話",per:"神話時代",arr:"雲の上から見下ろすと、山々の峰が、島のように浮かんでいる。\n天照大御神の孫・邇邇芸命が、いよいよ地上へ降りる日が来た。一行は、厳かな面持ちで並んでいる。\nアマテ「ついに、この日が来たのじゃな…。」\nイナリ「アマテ、なんや目がうるうるしてるで。」\nアマテ「う、うるうるなどしておらぬ。風が目にしみただけじゃ。」\nミナカタ「ワシは、もう泣いてるで。旅立ちは、ええもんや…。」\nテンジン「降りる場所は、どの峰なんやろ。言い伝えが、いくつかに分かれてるんや。」\nハチマン「…まずは、無事に降りていただくことだ。」\nアマテ「うむ。お供の列を、乱してはならぬぞ。」\n雲の切れ間から、地上の緑がのぞいた。ジンジャーマンは、背筋をのばして、お供の列に加わった。",sp:[0, 0, 0, 0, 1, 0],f:"amate",sc:"m5",era:"神代",place:"高千穂峰（宮崎・鹿児島の県境）",mk:"kirishima",best:"amate",bs:"天照大御神さまの、お孫さまの旅立ちじゃ。わらわが見送ろう。",
 intro:"国譲りが終わり、天照大御神は、孫の邇邇芸命（ににぎのみこと）を、地上を治めるために送ることにした。\n\nジンジャーマンは、天から地上への旅のお供を任された。",
 pol:"天孫降臨を、どう手伝う？",
 ch:[{l:"三つの宝のお供をする",sc:2,t:"邇邇芸命は、天照大御神から、鏡・剣・勾玉を授けられていた。\nのちに「三種の神器」と呼ばれるものだ。"},
     {l:"道案内の神を出迎える",sc:1,t:"天から降る道の途中で、猿田毘古神が待っていた。\n一行の道案内をするために、出迎えたのだという。"},
     {l:"降臨の山を、一つに決める",sc:0,t:"決められなかった。\n降臨の地は、宮崎県高千穂町とする伝承と、霧島の高千穂峰とする伝承がある。"}],
 res:"邇邇芸命の一行は、竺紫（筑紫）の日向の高千穂の久士布流多気に天降った、と『古事記』は記す。その曾孫が、初代の神武天皇とされる。",
 memo:[{k:"神話",t:"天照大御神は、孫の邇邇芸命に三種の神器を授けて、地上に降らせた。『古事記』は、降った地を「竺紫の日向の高千穂の久士布流多気」と記す。",s:"『神社のいろは』p.166（神社検定公式テキスト）／『古事記』上巻「天孫降臨」（國學院大學 古事記ビューア）"},
       {k:"伝承",x:"諸説",t:"降臨の地は、宮崎県高千穂町とする伝承と、霧島の高千穂峰とする伝承がある。",s:"観光庁 地域観光資源の多言語解説文データベース"},
       {k:"伝承",t:"霧島神宮は、邇邇芸命（霧島神宮の表記では瓊瓊杵尊）を祀る。社伝では、はじめ高千穂峰に祀られ、文暦元年（1234年）の噴火で焼失し、文明16年（1484年）に兼慶上人によって今の地に再興されたという。",s:"霧島神宮（公式）"},
       {k:"伝承",t:"三種の神器のうち、八咫鏡は伊勢の神宮に、草薙剣は熱田神宮に祀られている。宮中では、鏡の御分身が賢所に祀られ、剣の御分身と勾玉は「剣璽」として受け継がれる。",s:"『神社のいろは』p.166-167（神社検定公式テキスト）"}]},
{key:"konohana",nw:1,theme:"木花之佐久夜毘売と、花のような命",per:"神話時代",arr:"宮崎・西都。古墳の丘がひろがる西都原に、ジンジャーマンは立っている。\nテンジン「この近くの都萬神社には、木花之佐久夜毘売命が祀られとる。天孫・邇邇芸命の、お妃になった神さんや。」\nアマテ「邇邇芸は、わらわの孫じゃ。…嫁取りの話は、少し、複雑なのじゃが。」\nイナリ「複雑て、なんや？」\nアマテ「…聞けば、わかる。」\nミナカタ「山の神さんの娘さんの話か。この広い景色に、よう似合うな。」",sp:[0,0,0,0,1,0],f:"amate",sc:"m21",era:"天孫降臨のあと",place:"西都原・都萬神社（宮崎県）",mk:"saitobaru",best:"amate",bs:"孫の話か…。わらわが、聞かねばなるまい。",
 intro:"天孫降臨のあと、邇邇芸命は、山の神・大山津見神の娘、木花之佐久夜毘売に出会った。姉の石長比売も、いっしょに差し出されたが、邇邇芸命は、妹だけを選んだ。\n\nこの話は、天皇の命が、木の花のように短くなった由来とされる。\n\nジンジャーマンは、宮崎の西都原を訪れた。",
 pol:"木花之佐久夜毘売の話を、どう受けとめる？",
 ch:[{l:"姉の石長比売のことを聞く",sc:2,t:"父の大山津見神は、姉の石長比売も、妹といっしょに差し出した。だが邇邇芸命は、姉を返し、妹だけを娶った。\n父神は、姉を迎えていれば、天神の子孫の命は、岩のように変わらないはずだった、と告げたとされる。"},
     {l:"火の中の出産を見守る",sc:1,t:"一夜で身ごもったと知った邇邇芸命は、「国つ神の子ではないか」と疑った。\n木花之佐久夜毘売は、産屋に土を塗って閉じこもり、火を放ち、火の中で三柱の子を無事に生んで、天孫の子であることを証した。\n西都原には、その産室の跡が「無戸室」として残る、と伝わる。\nハチマン「…覚悟が、違う。」"},
     {l:"西都原と、都萬神社を歩く",sc:2,t:"西都原は、東西約2.6km、南北約4.2kmの台地に、300基以上の古墳が点在する。男狭穂塚・女狭穂塚は、邇邇芸命と木花咲耶姫の陵墓と伝えられる。春には、桜と菜の花が咲く。\n都萬神社は、木花咲耶姫を祀る古社。姫が産後、お乳の代わりに甘酒を与えた、という伝承から、安産や子育ての神様として親しまれている。"}],
 res:"木花之佐久夜毘売は、火の中で、火照命・火須勢理命・火遠理命の三柱を生んだ。\n神の世から、人の世へ。命に限りができたことも、子が生まれ、続いていくことも、同じ話の中にある。\nアマテ「…孫の選択は、わらわにも、重い話じゃ。」\nミナカタ「ほな、次は、その子らの話やな。海の幸と、山の幸の…。」",
 memo:[{k:"神話",t:"木花之佐久夜毘売は、大山津見神の娘。邇邇芸命は、笠沙の岬で出会って求婚した。父の大山津見神は、姉の石長比売も添えて差し出したが、邇邇芸命は、姉を返し、妹だけを娶った。",s:"『古事記』上巻（國學院大學 神名データベース「木花之佐久夜毘売」）"},
       {k:"神話",t:"父神は、姉を返して妹だけを娶ったので、天皇（天神の御子）の命は、木の花のように短くなる、と述べた。『古事記』は、天皇の命が長くない理由を、この話に求めている。",s:"『古事記』上巻（國學院大學 神名データベース「木花之佐久夜毘売」／同大学の解説）"},
       {k:"神話",t:"木花之佐久夜毘売は、一夜で身ごもった。邇邇芸命に疑われると、産屋に土を塗って閉じこもり、火を放った。火の中で、火照命・火須勢理命・火遠理命の三柱を生み、天孫の子であることを証した。",s:"『古事記』上巻（國學院大學 神名データベース「木花之佐久夜毘売」）"},
       {k:"史実",x:"諸説",t:"この話は、東南アジアを中心に分布する「バナナ型」の、死の起源の神話の類話とされる（『古事記』では、バナナの代わりに「木花」が用いられる）。「木花」は、はかなさとともに、天皇家の繁栄を表すイメージとも考えられている。これは、学術的な解釈で、神話そのものとは別の見方。",s:"國學院大學の解説「降臨した天神の結婚に込められた意味」"},
       {k:"伝承",x:"未確認",t:"都萬神社（宮崎県西都市）は、瓊瓊杵命の妻・木花開耶姫を祀る古社。日向式内社のひとつで、古来、日向国二之宮と称えられる。「都萬」は「妻」の意とされ、瓊瓊杵命と木花開耶姫が、日本最初の「婚礼儀式」を行った地と伝わる。姫が産後、お乳の代わりに甘酒を与えた、という伝承があり、安産・子育ての神様とされる。境内の大クス（樹齢約1200年）は、国指定の天然記念物。ただし、神社の公式ページは確かめておらず、観光協会と県の資料に拠る。",s:"宮崎県観光協会「都萬神社」／宮崎県季刊誌「Jaja」「記紀の道を歩く」（神社公式は未確認）"},
       {k:"伝承",x:"未確認",t:"西都には、この物語にまつわる場所が伝わる。逢初川は、邇邇芸命と木花咲耶姫が出会った場所、無戸室は、姫が出入り口のない産室に火を放って三皇子を産んだ産室の跡、児湯の池は、三皇子の産湯を汲んだ池、とされる。いずれも地元に伝わる話で、確かめられた史実ではない。『古事記』では、出会いの場所は、笠沙の岬。",s:"宮崎県季刊誌「Jaja」「古代の息吹が伝わるまち・西都」「記紀の道を歩く」"},
       {k:"史実",x:"諸説",t:"西都原古墳群は、宮崎県西都市の台地（東西約2.6km、南北約4.2km）に、300基以上の古墳が点在する、日本有数の古墳群。昭和27年（1952年）に、特別史跡に指定された。古墳の数は、資料によって、311基・317基・319基などと書かれ、数え方が揃わない。春には、桜と菜の花が咲く名所でもある。",s:"西都市「西都原古墳群」／宮崎県観光協会「西都原古墳群」／宮崎県季刊誌「Jaja」"},
       {k:"伝承",t:"男狭穂塚・女狭穂塚は、西都原古墳群の中の、隣り合う二つの大きな古墳。邇邇芸命と木花咲耶姫の陵墓と伝えられる。宮内庁が、明治28年（1895年）に陵墓参考地とした。男狭穂塚は国内最大の帆立貝形古墳、女狭穂塚は九州最大規模の前方後円墳とされる。神話の神と、古墳という遺跡を結びつけるのは伝承で、確かめられた史実とは、区別して受けとめたい。",s:"西都市「西都原古墳群」／宮崎県観光協会「西都原古墳群」／宮崎県季刊誌「Jaja」"},
       {k:"伝承",x:"未確認",t:"木花之佐久夜毘売命は、静岡県の富士山本宮浅間大社の主祭神としても知られる。垂仁天皇の代に、浅間大神（木花之佐久夜毘売命）を奉斎したのが始まりと伝わる。ただし、神社の公式ページは取得できず、『古事記学』の神社データベースに拠る。",s:"國學院大學 古事記学センター 神社データベース「浅間大社」（神社公式は未確認）"},
       {k:"史実",t:"神社本庁の解説では、「木花咲耶比売」と表記される。表記は、資料によって、木花之佐久夜毘売・木花咲耶姫などと揺れる。",s:"神社本庁「天孫降臨」"},
       {k:"史実",x:"未確認",t:"「木花は桜のこと」という説明は、よく語られるが、確かめた資料には、そう書かれていない。",s:"（出典未確認）"}]},
{key:"umisachi",per:"神話時代",theme:"海幸山幸の神話",arr:"日向の海辺に、波が寄せては返している。\n邇邇芸命の子、火遠理命（山佐知毘古）は、浜にしゃがみこんで、肩を落としていた。兄の火照命（海佐知毘古）から借りた釣り針を、海でなくしてしまったのだ。\nイナリ「元気出しや。釣り針の一本くらい…。」\nテンジン「イナリ、それがな、兄さんは『元の釣り針やないとあかん』て言うてはるらしいで。」\nイナリ「…そら、きついなあ。」\nミナカタ「海のことやったら、水の神さんにゆかりの名前のワシに任しとき！ …泳ぐのは、ちょっと苦手やけど。」\nハチマン「…苦手なのか。」\nアマテ「兄弟のいさかいは、どちらにとっても、つらいものじゃ。」\nそのとき、潮の香りとともに、一人の老人が、ゆっくりと浜を歩いてきた。\n老人は、火遠理命の顔をのぞきこみ、やさしく声をかけた。「なぜ、泣いておられるのか」――。",
 sp:[0, 0, 0, 0, 1, 0],f:"minakata",sc:"m9",era:"神代",place:"日向・青島（宮崎県）",mk:"aoshima",best:"minakata",bs:"潮の満ち干きの話か。水の神さんにゆかりの名前の、ワシの出番や！",gs:["hoori"],gl:"…兄上の釣り針を、なくしてしまった。",
 intro:"邇邇芸命の子、火照命（海佐知毘古）と火遠理命（山佐知毘古）の兄弟。\n弟の火遠理命は、兄の釣り針を借りて海へ出たが、その釣り針を海でなくしてしまった。",
 pol:"火遠理命のために、何をする？",
 ch:[{l:"塩椎神の助言を聞く",sc:2,t:"海辺で嘆く火遠理命の前に、塩椎神が現れた。\n塩椎神は、すき間なく編んだ小船（無間勝間の小船）を作って火遠理命を乗せ、綿津見神の宮へと送り出した。"},
     {l:"海の神の宮で、釣り針を探す",sc:1,t:"綿津見神の宮で、火遠理命は、海の神の娘・豊玉毘売と結ばれ、三年を過ごした。\nやがて綿津見神の助けで、なくした釣り針が見つかった。"},
     {l:"新しい釣り針を作って返す",sc:0,t:"火遠理命は、剣をつぶして、たくさんの釣り針を作って償おうとした。\nけれど兄は「元の釣り針を返せ」と、受け取らなかった。"}],
 res:"綿津見神から塩盈珠・塩乾珠を授かった火遠理命は、地上に戻って釣り針を兄に返した。兄が攻めてくると、塩盈珠で潮を満たし、許しを請うと塩乾珠で潮を引かせた。兄の火照命は、昼も夜も弟を守る者として仕えることを誓った。火照命は、隼人の阿多君の祖とされる。",
 memo:[{k:"神話",t:"火照命（海佐知毘古）と火遠理命（山佐知毘古）は、邇邇芸命と木花之佐久夜毘売の子。弟の火遠理命は、兄から借りた釣り針を海でなくした。",s:"國學院大學 古事記ビューア 神名データベース「火遠理命」「火照命」"},
       {k:"神話",t:"塩椎神は、無間勝間の小船を作って火遠理命を乗せ、綿津見神の宮へ導いた。『日本書紀』では、塩土老翁・塩筒老翁と書かれる。",s:"國學院大學 古事記ビューア 神名データベース「塩椎神」"},
       {k:"神話",t:"綿津見神の宮で、火遠理命は豊玉毘売と結ばれて三年を過ごし、釣り針を取り戻した。綿津見神は、潮の満ち干きを操る塩盈珠・塩乾珠を授けた。",s:"國學院大學 古事記ビューア 神名データベース「火遠理命」「綿津見神」"},
       {k:"神話",t:"塩盈珠・塩乾珠で懲らしめられた火照命は、弟の昼夜の守護人として仕えることを誓った。火照命は、隼人の阿多君の祖とされる。",s:"國學院大學 古事記ビューア 神名データベース「火照命」"},
       {k:"伝承",t:"青島神社（宮崎市）は、彦火火出見命（火遠理命）が海積宮から帰った宮居の跡とされ、彦火火出見命・豊玉姫命・塩筒大神を祀る。",s:"青島神社（公式「ご由緒」）"}]},
{key:"jimmu",theme:"熊野の山と、八咫烏の導き（神話・伝承）",per:"神話時代",arr:"熊野の山は、どこまでも深い。木々が空をおおい、昼でも薄暗い。\n九州から大和を目指す神武天皇の一行は、紀伊半島を回って、この地にたどり着いた。だが、山が深くて、進む道が分からない。\nイナリ「右も左も、木、木、木や。さっき通った木と、この木、同じちゃう？」\nテンジン「木の見分けは、わしにも無理や…。」\nミナカタ「ほな、ワシが一本ずつ、目印をつけていこか。」\nハチマン「…それでは、日が暮れる。」\nアマテ「皆、静かに。…何か、聞こえぬか？」\n耳をすますと、頭の上のほうで、カラスが一声、鳴いた。見上げても、姿は見えない。\nイナリ「カラスか…。なんや、こっち来いって言うてるみたいやな。」\nジンジャーマンは、一行の道案内を手伝うことにした。",note:"※神武天皇の東征は、『古事記』『日本書紀』に伝わる物語で、実際の年代は定かではない。",sp:[0, 0, 0, 0, 1, 1],f:"kumanon",sc:"k1",era:"神武天皇の東征（伝承）",place:"熊野（和歌山県）",mk:"kumano",best:null,kumano:true,
 intro:"神武天皇（のちに初代の天皇とされる）の一行は、九州から大和を目指し、紀伊半島を回って熊野にたどり着いた。\n熊野は、深い山々が連なる土地だ。\n\nジンジャーマンは、一行の道案内を手伝うことになった。",
 pol:"熊野の山で、どう動く？",
 ch:[{l:"地図を作りながら進む",sc:0,t:"山は深く、地図づくりは進まない。\n『古事記』では、この先の山には荒ぶる神が多い、と告げられている。"},
     {l:"天からの導きを待つ",sc:2,t:"『古事記』では、高木神が「天から八咫烏をつかわすので、その導きに従え」と告げた。\n一行は、八咫烏の導きで、大和へ向かった。"},
     {l:"力ずくで山を越える",sc:1,t:"強行したが、熊野の山々は、深く険しい。\n一行は、やはり導き手を必要とした。"}],
 km:"…道なら、俺が知っている。ついて来い。",
 res:"八咫烏の導きで、一行は熊野から大和へ入ったと伝わる。熊野三山では、今も八咫烏を神の使いとしている。",
 memo:[{k:"伝承",t:"『古事記』では、高木神（高御産巣日神）が、天から八咫烏をつかわし、その導きに従うよう告げた。",s:"國學院大學 古事記学センター「『古事記』あらすじ」／熊野本宮大社（公式）"},
       {k:"伝承",t:"八咫烏の導きで、神武天皇の一行は大和の橿原へ向かったと伝わる。熊野は、神武天皇の東征ゆかりの地とされる。",s:"熊野本宮大社（公式）／『神社のいろは』p.66（神社検定公式テキスト）"},
       {k:"伝承",t:"熊野三山（熊野本宮大社・熊野速玉大社・熊野那智大社）は、いずれも八咫烏を神使とし、八咫烏をあしらったお札「牛王宝印」が知られる。",s:"『神社のいろは』p.66（神社検定公式テキスト）"}]},
{key:"kashihara",nw:1,theme:"金鵄の光と、橿原の建国（神話・伝承）",per:"神話時代",arr:"奈良・大和。熊野を越えた神武天皇の一行は、ついに、大和の平野にたどり着いた。\n行く手には、長髄彦の軍勢が、立ちはだかっている。\nハチマン「…戦いは、苦しいようだ。」\nそのとき、ひとすじの光が、差した。\n金色に輝く鵄が、神武天皇の弓の先に、とまっている。まばゆい光に、敵の兵たちは、目をおおって、うずくまった。\nハチマン「…あれが、金鵄。」\nハチマン「…見届けよう。この光の、行く先を。」",note:"※金鵄と神武天皇の建国は、神話・伝承に伝わる物語で、実際の年代は定かではない。",sp:[0, 0, 0, 0, 1, 1],f:"hachiman",sc:"m30",era:"神武天皇の即位（伝承）",place:"橿原（奈良県）",mk:"kashihara",best:"hachiman",bs:"…光の先を、見届けよう。",
 intro:"熊野から大和へ入った神武天皇の一行は、長髄彦の軍と戦った。苦戦のとき、金色の鵄が弓の先にとまり、まばゆい光を放って、敵は混乱した。のち、天皇は橿原宮で即位した、と伝わる。\n\nハチマンは、金鵄の光を見届けるため、橿原へ向かった。",
 pol:"金鵄の光と、建国の物語を、どう見届ける？",
 ch:[{l:"金鵄の光を見届ける",sc:2,t:"長髄彦との戦いが苦戦になったとき、金色の鵄が、神武天皇の弓の先にとまって、強い光を放った。敵の軍勢は、混乱して、戦えなくなったと伝わる。"},
     {l:"橿原宮での即位を見届ける",sc:2,t:"神武天皇は、畝傍山のほとりに橿原宮を造り、媛蹈鞴五十鈴媛命を皇后に迎え、紀元元年一月一日（辛酉年）に橿原宮で即位して、初代天皇になったと伝わる。\n『古事記』にも、「畝火の白橿原宮に坐しまして、天の下治らしめき」とある。"},
     {l:"いまに続く「建国をしのぶ日」を知る",sc:1,t:"毎年2月11日は、「建国記念の日」。橿原神宮では、この日に、神武天皇の即位に由来する例祭「紀元祭」が行われる。\n金鵄は、いまも、橿原神宮の授与品の意匠になっている。"}],
 res:"金鵄の光は、勝利を導いた瑞兆として語り継がれ、橿原で、国の歴史は、はじまったと伝わる。\nただし、これは、神話や伝承の語る「建国」の物語。年代や事実が確かめられる歴史とは、区別して、受けとめたい。\nハチマン「…伝えられてきた物語と、確かめられる事実。別々に、持っておこう。」",
 memo:[{k:"伝承",t:"長髄彦との戦いが苦戦になったとき、金色の鵄が、神武天皇（磐余彦尊）の弓の先にとまって、強い光を放った。敵の軍勢は混乱して、降伏したと伝わる。この前後、饒速日命は、長髄彦に従うよう勧めたが聞き入れられず、息子の可美真手命とともに、神武天皇に帰順したと伝わる。",s:"橿原神宮（公式）「神武天皇御一代記御絵巻」（13・14）"},
       {k:"伝承",t:"神武天皇は、畝傍山のほとりで大和統治の詔を宣言し、橿原に宮殿を造営した。事代主命の娘・媛蹈鞴五十鈴媛命を正妃に迎え、紀元元年一月一日（辛酉年）に、橿原宮で即位して、初代天皇となったと伝わる。",s:"橿原神宮（公式）「神武天皇御一代記御絵巻」（15〜17）"},
       {k:"神話",t:"『古事記』は、神武天皇（伊波禮毘古）が、荒ぶる神々を言向け平和し、従わない人々を退けて、「畝火の白橿原宮に坐しまして、天の下治らしめき」と記す。",s:"國學院大學「神武天皇のチャレンジ精神、「人の代」を切り開く」（『古事記』の引用）"},
       {k:"史実",x:"未確認",t:"金鵄の話は、『日本書紀』に伝わる話とされ、『古事記』の神武天皇の段には出てこない、と言われる。國學院大學の上の記事は、『古事記』にもとづき、金鵄には触れていない。『日本書紀』の本文は、今回、読めておらず、確かめていない。",s:"（出典未確認）"},
       {k:"史実",x:"未確認",t:"紀元元年（辛酉年）を西暦に換算した年、神武天皇が歴史上の人物として実在したか、橿原宮の実際の姿は、確かめていない。この章は、「伝承の語る建国」として扱い、確かめられる歴史とは区別している。",s:"（出典未確認）"},
       {k:"史実",t:"橿原神宮の祭神は、神武天皇と媛蹈鞴五十鈴媛皇后。橿原宮址は、畝傍山の東南麓にあたり、長く畑地だった。明治10年代に宮址を顕彰する動きが高まり、民間から創建の願い出が相次いだ。明治政府は明治22年（1889）に創建を認可し、京都御所の内侍所（賢所）と神嘉殿が下賜された。明治23年（1890）に創建された。",s:"橿原神宮（公式）「橿原神宮の歴史」「橿原神宮について」"},
       {k:"史実",t:"建国記念の日は、2月11日。昭和41年（1966）の祝日法改正で設けられ、「建国をしのび、国を愛する心を養う」日とされる。日付は政令（昭和41年政令第376号）で定められた。祝日法の制定前、昭和2年勅令第25号によって「紀元節（2月11日）」が休日とされており、この勅令は祝日法の附則で廃止された。",s:"内閣府「国民の祝日について」（建国記念の日／祝日法制定の経緯）"},
       {k:"史実",t:"橿原神宮の紀元祭は、毎年2月11日（建国記念の日）午前11時に行われる例祭で、神宮の祭典の中で最も重要とされる。勅使が参向する。神武天皇が大和橿原宮で第一代天皇に即位し、日本を建国されたことに由来する。",s:"橿原神宮（公式）「紀元祭」"},
       {k:"史実",t:"橿原神宮の授与品には、「神武天皇の危機を救った金鵄」をあしらったもの（勝ち守・金鵄幸運御守・御鏡守など）や、熊野で神武天皇を導いた八咫烏にちなむもの（交通安全御守など）がある。",s:"橿原神宮（公式）「お札・お守り」"}]},
{key:"miwayama",nw:1,theme:"三輪山と、本殿のない神社",per:"古墳時代",arr:"奈良・三輪。三輪山のふもとの大神神社には、いまも、本殿が、ない。\n社殿も、鳥居もない。巫女が、地面に茣蓙を敷き、供えものを並べて、山に向かって祈っている。足もとを、小さな白蛇が、はっていった。\nテンジン「ここは、山そのものが、ご神体なんや。」\nイナリ「本殿がない神社て、あるんか。」\nアマテ「社殿が建つ前の、神祀りの形が、残っておるのじゃな。」\nミナカタ「大物主は、親父と、深い縁のある神さんや。…近所にお邪魔するみたいで、ちょっと緊張するわ。」\nハチマン「…静かだ。」",sp:[0,0,0,0,1,1],f:"minakata",sc:"m23",era:"崇神天皇の御世（伝承）",place:"大神神社・三輪山（奈良県）",mk:"miwa",best:"minakata",bs:"山ごと拝む神社か。ええやんか。",
 intro:"奈良の三輪山は、大物主大神が鎮まる神の山として、古くから信仰されてきた。大神神社には、本殿がない。拝殿から、山そのものに祈る。\n\nジンジャーマンは、三輪山のふもとを訪れた。",
 pol:"山そのものを神とする、この神社で、どうする？",
 ch:[{l:"巫女の祈りを、見守る",sc:2,t:"社殿も、鳥居もない。巫女が、地面に茣蓙を敷いて、供えものを並べ、山に向かって祈っている。三輪山そのものが、神の座とされてきた。\nいまの大神神社には、拝殿の奥に、三ツ鳥居がある。拝殿との間の結界で、三輪山を本殿と見立てるなら、その御扉の役割とも言える。ただし、起源は、わからないという。むかしの祭りに鳥居があったかどうかは、確かめられない。\n（※絵の祭りの姿は、想像のイメージ。）"},
     {l:"杉と、磐座と、白蛇の話を聞く",sc:1,t:"三輪山は、高さ467メートル。一木一草に至るまで、神が宿る、と尊ばれてきた。山中には、神霊が鎮まる岩が点在し、頂上には大物主大神、中腹には大己貴神、麓には少彦名神が鎮まる、とされる。\n三輪山の杉の葉で作った杉玉は、酒造りのシンボルとして、酒屋の軒先に飾られるようになった。\n三輪山のふもとの「巳の神杉」には、大物主大神の化身の白蛇が棲む、と伝わる。蛇の好物の卵が、参拝者によってお供えされている。"},
     {l:"登拝の決まりを、静かに聞く",sc:2,t:"三輪山は、禁足の山として、入山が厳しく制限されてきた。いまは、狭井神社で受付をすれば、登拝ができる。\nただし、観光や登山ではなく、「お参り」。敬虔な心で入山すること、と求められている。"}],
 res:"大物主大神は、国づくりを成し遂げるために、三輪山に鎮まったとされる。\n社殿ではなく、山そのものに祈る。社殿ができるより前の神祀りの形が、いまに伝わる。\nミナカタ「…山が、神さんの家、いうことやな。」\nアマテ「社殿は、あとから生まれた形じゃ。山を拝む心は、ずっと、変わらぬのう。」",
 memo:[{k:"神話",t:"『古事記』では、大物主大神が大国主神に、「吾をば倭の青垣、東の山の上にいつきまつれ」と述べ、三輪山に祀られることを望んだ。『日本書紀』では、問答の中で、大物主大神が、大国主神の「幸魂・奇魂」と名乗り、三輪山に鎮まることを望んだ。",s:"大神神社（公式）「ご由緒」"},
       {k:"神話",t:"『古事記』上巻では、大物主神と大国主神は、別の神として描かれ、ともに国作りを行う。一方、『出雲国造神賀詞』では、大物主神は、大穴持命（大国主神）の「和魂」として位置づけられている。",s:"國學院大學 神名データベース「大物主神」"},
       {k:"史実",x:"諸説",t:"大神神社は、古来、本殿を設けず、三輪山そのものに直接祈りを捧げてきたとされる。社殿の成立以前の、原初の神祀りの形を伝えるものとして、「我が国最古の神社」と呼ばれる。",s:"大神神社（公式）「ご由緒」（「最古」は神社の説明）"},
       {k:"史実",t:"三輪山は、高さ467メートル、周囲16キロメートル、面積350ヘクタール。一木一草に至るまで、神が宿るものとして尊ばれる。山中には磐座が点在し、頂上には大物主大神、中腹には大己貴神、麓には少彦名神が鎮まるとされる。『万葉集』にも詠まれた「三輪の神杉」があり、三輪山の杉の葉で作った杉玉が、酒造りのシンボルとして、酒屋の軒先に飾られるようになった。",s:"大神神社（公式）「三輪山」"},
       {k:"史実",t:"拝殿は、文献によれば鎌倉時代の創建。現在の建物は、寛文4年（1664年）に、徳川家綱が再建した。三ツ鳥居とともに、国の重要文化財。三ツ鳥居の起源は、わからない。",s:"大神神社（公式）「三ツ鳥居と拝殿」"},
       {k:"史実",t:"神階は、貞観元年（859年）に正一位となり、『延喜式』では官幣大社に列せられた。のち、大和国一之宮となった。『延喜式』神名帳に、「大神大物主神社」の記事がある。",s:"大神神社（公式）「ご由緒」／國學院大學 神名データベース「大物主神」"},
       {k:"伝承",t:"崇神天皇（第十代）の時代には、国づくりの神、国家の守護神として、篤く祀られたとされる。崇神天皇の実際の年代は、定かではない。",s:"大神神社（公式）「ご由緒」"},
       {k:"史実",x:"未確認",t:"三輪山は、禁足の山として、入山が厳しく制限されてきた。近代になって、熱心な信者の要望もあり、特別に入山が許可された。いま、登拝は、狭井神社で受付をして、観光や登山ではなく、「お参り」として行う。ただし、いつから許可されたかの具体的な年代は、確かめていない。",s:"大神神社（公式）「三輪山登拝について」（年代は公式ページに記載なし）"},
       {k:"伝承",t:"大神神社では、蛇を「巳さん」と呼び、福徳をもたらす霊威として崇める。巳の神杉は、大物主大神の化身の白蛇が棲むことから名づけられたご神木で、蛇の好物とされる卵が、参拝者によってお供えされる。『日本書紀』には、大物主大神が蛇の姿で現れ、倭迹迹日百襲姫が驚いて亡くなった（墓は箸墓と呼ばれた）話がある。『古事記』の活玉依毘売の話では、若者が蛇だったとは述べられていない。",s:"大神神社（公式）「巳の神杉」「三輪山の神語り」"},
       {k:"史実",x:"未確認",t:"この章の場面（茣蓙を敷いた祭り、巫女、小さな白蛇）は、社殿ができる前の祈りを想像したイメージ。崇神天皇の時代（伝承）の三輪山の祭りに、社殿や鳥居があったか、巫女や茣蓙がどう使われたかは、確かめていない。三ツ鳥居の起源も、公式は「わからない」としている。",s:"（出典未確認。ゲーム内の想像）／大神神社（公式）「三ツ鳥居と拝殿」"}]},
{key:"yamatohime",theme:"倭姫命の巡行（伝承）",per:"古墳時代",arr:"大和の笠縫邑を出た倭姫命の一行は、長い旅を続けていた。天照大御神をお祀りするにふさわしい地を、探しているのだ。\nアマテ「天照大御神さまを、お祀りする地を探す旅じゃ。わらわも、身が引きしまる。」\nイナリ「長い旅やなあ。倭姫命さん、疲れてはれへんやろか。」\nミナカタ「荷物、ワシが持ちましょか！」\nハチマン「…それは、もう三回断られている。」\nミナカタ「四回目で、うなずいてくれるかもしれんやろ。」\nテンジン「その前向きさは、見習わなあかんな。」\nやがて一行は、清らかな川の流れる土地に出た。川面に光が映り、鳥の声が響く。倭姫命は、しばらく黙って、その景色を見つめていた。\nアマテ「…よい所じゃな。神さまの声に、耳をすませてみよう。」\nジンジャーマンも、そっと手を合わせた。",note:"※垂仁・景行・仲哀天皇の御世は、『古事記』『日本書紀』に伝わる伝承上の年代で、実際の年代は定かではない。この章は、ゲームでは古墳時代に置いている。",sp:[0, 0, 0, 1, 1, 1],f:"amate",sc:"k3",era:"垂仁天皇の御世（伝承）",place:"伊勢（三重県）",mk:"ise",best:"amate",bs:"天照大御神さまを、お祀りする場所探しじゃ。任せよ。",
 intro:"垂仁天皇の御世。\n皇女・倭姫命が、天照大御神をお祀りするにふさわしい場所を探して、旅に出た。\n\nジンジャーマンは、この巡行に同行することになった。",
 pol:"倭姫命の巡行に、どう関わる？",
 ch:[{l:"巡行の道筋を調べる",sc:1,t:"天照大御神は、はじめ皇居に、のちに大和の笠縫邑に祀られていた。\n倭姫命は、そこから諸国を巡ったと伝わる。"},
     {l:"神のお告げに耳をすます",sc:2,t:"『日本書紀』では、天照大御神が倭姫命に「この伊勢の国に居りたい」と告げたとされる。\n一行は、五十鈴川のほとりに宮を定めた。"},
     {l:"近道して、伊勢へ急ぐ",sc:0,t:"急いで伊勢に着いたが、なぜこの地なのか、分からないままだった。\n伝承では、倭姫命は、諸国を巡って場所を定めたとされる。"}],
 res:"天照大御神は、五十鈴川のほとりに祀られた。これが、伊勢の神宮（内宮）の始まりとされる。",
 memo:[{k:"伝承",t:"天照大御神は、はじめ皇居に祀られていたが、崇神天皇のときに笠縫邑（奈良県桜井市）に移され、垂仁天皇のときに、諸国を巡ったのち、今の五十鈴川のほとりに鎮座したとされる。",s:"『神社のいろは』p.152（神社検定公式テキスト）"},
       {k:"伝承",t:"垂仁天皇の時代、御鏡は、皇女・倭姫命によって、伊勢の神宮でお祀りされるようになったとされる。",s:"『神社のいろは』p.167（神社検定公式テキスト）"},
       {k:"史実",t:"「神宮」が正式名称。内宮（皇大神宮）・外宮（豊受大神宮）をはじめ、14の別宮と、109の摂社・末社・所管社を合わせた125社の総称である。",s:"『神社のいろは』p.152（神社検定公式テキスト）"}]},
{key:"takeru",theme:"日本武尊の東への旅（伝承）",per:"古墳時代",arr:"東へ向かう道に、草原が果てしなく続いている。\n景行天皇の皇子・日本武尊は、父の命を受けて、各地を平定する旅のさなかにあった。東へ向かう前に、伊勢に立ち寄るつもりだという。\nハチマン「…剣を持つ者の背中だ。重いものを、背負っている。」\nイナリ「ハチマン、なんか今日は、よう喋るな。」\nハチマン「…武の話なら、話す。」\nテンジン「この先は、草が背丈ほども伸びた野原や。見通しが悪いで。」\nミナカタ「風が乾いとるな。火の気には、気いつけなあかん。」\nアマテ「皆、気を引き締めてまいろう。」\n遠くの草むらが、かさりと揺れた。誰かが、こちらの様子をうかがっている気配がする。日本武尊は、何も言わずに、前を見すえていた。\nミナカタ「…なんや、ワシまで背筋がのびるわ。」",note:"※垂仁・景行・仲哀天皇の御世は、『古事記』『日本書紀』に伝わる伝承上の年代で、実際の年代は定かではない。この章は、ゲームでは古墳時代に置いている。",sp:[0, 0, 0, 1, 1, 1],f:"hachiman",sc:"m6",era:"景行天皇の御世（伝承）",place:"熱田（愛知県）",mk:"atsuta",best:"hachiman",bs:"…草薙剣の話か。武の神の名にかけて、俺が行く。",gs:["takeru"],gl:"この剣で、草を薙ぎ払う！",
 intro:"景行天皇の皇子・小碓命（おうすのみこと）。のちに日本武尊（『古事記』では倭建命）と呼ばれる。\n父の命を受けて、西へ東へ、各地を平定する旅を続けていた。\n\nジンジャーマンは、その東への旅に同行した。",
 pol:"日本武尊の旅で、何をする？",
 ch:[{l:"伊勢で、剣を授かる場に立ち会う",sc:1,t:"東へ向かう途中、日本武尊は伊勢の神宮に立ち寄り、叔母の倭姫命から、神剣を授けられたと伝わる。"},
     {l:"火攻めの野で、ともに戦う",sc:2,t:"敵に謀られ、火に囲まれた日本武尊は、神剣で周りの草を薙ぎ払い、向かい火を放って難を逃れた。\nこの話から、剣は「草薙剣」と呼ばれるようになったといわれる。"},
     {l:"旅の終わりを見届ける",sc:1,t:"東国を平定したのち、日本武尊は、尾張で宮簀媛命と結婚した。\n神剣を宮簀媛命のもとに置いたまま、伊吹山の神を討ちに向かい、病にかかって亡くなったという。"}],
 res:"宮簀媛命は、日本武尊の遺志を重んじて、熱田の地に神剣を祀った。これが、熱田神宮の始まりとされる。",
 memo:[{k:"伝承",t:"日本武尊は景行天皇の皇子で、もとの名は小碓命。『古事記』では倭建命と書かれる。",s:"國學院大學 古事記学センター「『古事記』あらすじ」／『神社のいろは』p.88（神社検定公式テキスト）"},
       {k:"伝承",t:"熱田神宮は、草薙神剣を御神体とし、草薙神剣を御霊代とする天照大御神（熱田神宮の表記では天照大神）を、「熱田大神」として祀る。",s:"『神社のいろは』p.88（神社検定公式テキスト）"},
       {k:"伝承",t:"熱田神宮の由緒では、日本武尊は景行天皇43年（西暦113年にあたるとされる）に亡くなり、のちに宮簀媛命が草薙神剣を熱田に祀ったという。創祀は1900年あまり前とされる。",s:"熱田神宮（公式）"},
       {k:"伝承",t:"火に囲まれた日本武尊が、神剣で草を薙ぎ払い、向かい火を放って難を逃れたことから、「草薙剣」の名がついたといわれる。",s:"『神社のいろは』p.88（神社検定公式テキスト）"},
       {k:"史実",t:"名前は、『古事記』では倭建命、『日本書紀』では日本武尊と書かれる。人物の描かれ方にも違いがある。",s:"亀山市（公式）"}]},
{key:"jingu",theme:"神功皇后と、応神天皇の誕生（伝承）",per:"古墳時代",arr:"筑紫の空は、どこか張りつめていた。\n仲哀天皇が香椎の地で亡くなったと伝わり、后の神功皇后は、深い悲しみの中にいる。しかも皇后は、のちの応神天皇を身ごもっているのだ。\nハチマン「…八幡さまの、母上だ。」\nイナリ「ハチマン、そわそわしてへん？」\nハチマン「…していない。」\nそう言うハチマンの足は、さっきから、同じところを行ったり来たりしている。\nアマテ「お腹の子と、皇后さまのお体が、何より大事じゃ。わらわたちにできることを考えよう。」\nミナカタ「重い物は、全部ワシが運ぶで！」\nテンジン「お産の場所は、静かで落ち着けるとこがええな。」\n皇后は、一行に向かって、静かにほほえんだ。その笑顔に、ハチマンは、背筋をぴんと伸ばした。",note:"※垂仁・景行・仲哀天皇の御世は、『古事記』『日本書紀』に伝わる伝承上の年代で、実際の年代は定かではない。この章は、ゲームでは古墳時代に置いている。",sp:[0, 0, 0, 1, 1, 1],f:"hachiman",sc:"m7",era:"仲哀天皇の御世（伝承）",place:"宇美（福岡県）",mk:"umi",best:"hachiman",bs:"…八幡さま（応神天皇）の、母上の話だ。俺が行く。",gs:["jingu"],gl:"…この子を、無事に産みたい。",
 intro:"仲哀天皇の后・神功皇后。\n天皇は、筑紫の香椎の地で亡くなったと伝わる。\n皇后は、のちの応神天皇を身ごもっていた。\n\nジンジャーマンは、皇后の一行に加わった。",
 pol:"神功皇后のために、何をする？",
 ch:[{l:"宇美で、お産を見守る",sc:2,t:"皇后が応神天皇を出産した地と伝わるのが、宇美八幡宮だ。\n境内の大楠「湯蓋の森」は、産湯の上に枝葉が蓋のように広がっていたことから、その名がついたといわれる。"},
     {l:"香椎で、仲哀天皇を祀る",sc:1,t:"香椎宮は、仲哀天皇と神功皇后を主祭神とする。\n社伝では、養老7年（723年）、神託によって新たに廟が造られ、翌年に完成したという。"},
     {l:"海の向こうへの遠征の話を調べる",sc:1,t:"記紀には、皇后が身ごもったまま海を渡り、朝鮮半島へ遠征したという話が記される。\nただし、神功皇后の物語は、伝説的な要素が強いといわれる。"}],
 res:"生まれた皇子は、のちの応神天皇。八幡神は、この応神天皇（誉田別尊）とされる。宇美八幡宮は、今も安産の神として信仰されている。",
 memo:[{k:"伝承",t:"応神天皇は、仲哀天皇と神功皇后の子とされる。",s:"『神社のいろは 続』p.174（神社検定公式テキスト）"},
       {k:"伝承",t:"宇美八幡宮は、神功皇后が応神天皇を出産した地と伝わる。境内の大楠「湯蓋の森」は、産湯のとき枝葉が蓋のように広がっていたことから名づけられたといわれ、国の天然記念物に指定されている。",s:"宇美町（公式）"},
       {k:"史実",t:"香椎宮（福岡市）は、仲哀天皇と神功皇后を主祭神とする。本殿は、独特の「香椎造」。",s:"『神社のいろは 続』p.174（神社検定公式テキスト）"},
       {k:"伝承",x:"諸説",t:"神功皇后は、伝説的な要素が強い人物といわれる。",s:"『神社のいろは 続』p.20-21（神社検定公式テキスト）"},
       {k:"伝承",t:"八幡神は、応神天皇（誉田別尊）とされ、母神の神功皇后、比売大神とともに祀られることが多い。",s:"『神社のいろは』p.60（神社検定公式テキスト）"}]},
{key:"munakata",nw:1,theme:"宗像・沖ノ島と、会いに行けない神様",per:"古墳時代",arr:"福岡・宗像。海に面した辺津宮で、ジンジャーマンは、はるか沖の方角を見つめている。\nテンジン「宗像大社は、三つの宮から成る、三社一体の信仰や。沖ノ島の沖津宮、大島の中津宮、ここ本土の辺津宮。」\nテンジン「沖ノ島は、島全体が信仰の対象でな。4世紀後半から9世紀末まで、約500年も、航海の安全を祈る祭祀が行われたんや。」\nイナリ「島全体が神さんなら、島に上陸して、会いに行けるはずや！」\nテンジン「…それが、そうはいかんのや。」\n沖ノ島は、いま、神職のほかは、上陸が許されていない。島の木も草も石も、一つとして、島の外へ持ち出してはならない。島で見聞きしたことは、口外してはならない。\nイナリ「…そうか。会いに行けん神さんも、おるんやな。」\nハチマン「…守られてきたから、いまに残っている。」\nアマテ「会いに行けぬ。それも、ひとつの、敬いの形じゃな。」\nミナカタ「ほな、ワシらは、どうやって拝むんや？」\nテンジン「大島に、遥拝所があるんや。遠くの島に向かって、拝むための場所や。」",sp:[0,0,0,1,1,1],f:"amate",sc:"m16",era:"4〜9世紀の祭祀",place:"宗像大社（福岡県）",mk:"munakata",best:"amate",bs:"三女神は、天照大御神と須佐之男命のうけいから生まれたとされる神々。ゆかりが深いのう。",
 intro:"福岡県の宗像大社は、沖ノ島・大島・本土の三つの宮が一体となる信仰を伝える。沖ノ島では、4世紀後半から9世紀末まで、古代の祭祀が行われた。\n\nジンジャーマンは、本土の辺津宮を訪れた。沖ノ島に、上陸はしない。",
 pol:"会いに行けない神様に、どう向き合う？",
 ch:[{l:"大島の遥拝所から、沖ノ島を拝む",sc:2,t:"遠く離れた沖ノ島への神事を恒常的に行うため、江戸時代に、大島に遥拝所が設けられた。ここから、沖ノ島に向かって、手を合わせる。"},
     {l:"辺津宮で、三女神の話を聞く",sc:2,t:"宗像三女神は、田心姫神・湍津姫神・市杵島姫神。沖津宮に田心姫神が祀られる。『古事記』『日本書紀』では、天照大御神と須佐之男命のうけいで生まれた神々とされる。"},
     {l:"沖ノ島のおきてを、静かに受けとめる",sc:1,t:"島の木も草も石も持ち出さず、見聞きしたことも口外しない。こうした禁忌に守られてきたからこそ、古代の祭祀の姿が、いまに残った。"}],
 res:"5人は、沖ノ島には、上陸しなかった。遠くの島影に向かって、静かに手を合わせた。\n会いに行けない神様がいる。それも、このゲームでは初めての、信仰のかたちだった。",
 memo:[{k:"史実",t:"宗像大社は、沖津宮（沖ノ島）・中津宮（大島）・辺津宮（本土）の三社が一体となる信仰で、宗像三女神を祀る。沖津宮の祭神は、田心姫神。",s:"宗像大社（公式）「沖津宮」"},
       {k:"神話",t:"宗像三女神（田心姫神・湍津姫神・市杵島姫神）は、天照大御神と須佐之男命の「うけい」で生まれたとされる。",s:"『古事記』上巻・『日本書紀』神代上"},
       {k:"史実",t:"沖ノ島では、4世紀後半から9世紀末までの約500年間、海を越えた交流の安全と成就を祈る祭祀が行われた。祭祀の場は、巨岩の上、巨岩の陰、露天の平坦地へと移った。",s:"世界遺産「神宿る島」宗像・沖ノ島と関連遺産群（公式）「沖ノ島と古代祭祀」"},
       {k:"史実",t:"島から出土した奉献品は、約8万点が一括して国宝に指定され、「海の正倉院」とも呼ばれる。",s:"福岡県「グラフふくおか」2017年秋号／同公式サイト"},
       {k:"史実",t:"沖ノ島は島全体が信仰の対象で、「一木一草一石たりとも島外へ持ち出さない」「島で見聞きしたことは口外しない」という禁忌が守られてきた（「お言わず様」）。現在は、神職以外は上陸できない。",s:"宗像大社（公式）「沖津宮」／福岡県「グラフふくおか」2017年秋号"},
       {k:"史実",t:"遠く離れた沖ノ島への神事を行うため、江戸時代に、大島に遥拝所が設けられた。",s:"福岡県「グラフふくおか」2017年秋号"},
       {k:"史実",x:"諸説",t:"4世紀以来の信仰・祭祀が継承されていると評価される一方、古代の祭祀と現在の宗像大社の信仰とのつながりについては、議論もある。断定はできない。",s:"（出典未確認：世界遺産の審査での議論は、まだ確かめていない）"},
       {k:"史実",t:"いま：2017年、「『神宿る島』宗像・沖ノ島と関連遺産群」が、世界遺産に登録された。",s:"福岡県「グラフふくおか」2017年秋号"}]},
{key:"asuka",per:"飛鳥時代",theme:"仏教の伝来と、新しい信仰をめぐる争い",arr:"飛鳥の山々のあいだを、川がゆったりと流れていく。\n6世紀のなかば、海の向こうの百済から、仏像と経典が伝えられた。朝廷では、この新しい信仰を受け入れるかどうかで、意見が二つに分かれているという。\nテンジン「新しい教えか…。どっちの言い分も、よう聞いてみなあかんな。」\nイナリ「俺らは、神社の神さんにゆかりの者やけど…。」\nアマテ「だからこそ、じゃ。相手を悪く言うて、済む話ではない。」\nハチマン「…どちらの人々も、国を思っている。」\nミナカタ「ワシ、仏さんの像、見てみたいわ。きっと、えらいきれいなんやろなあ。」\nテンジン「ミナカタ、ええこと言うな。まずは、知ることからや。」\n里の人々が、少し不安そうに、都のほうを見やっていた。新しい信仰をめぐる争いは、やがて大きな戦いへとつながっていく。\nイナリ「…せめて、巻きこまれる人らを守りたいな。」",
 sp:[0, 0, 0, 1, 1, 1],f:"tenjin",sc:"k23",era:"6世紀なかば〜587年",place:"飛鳥・難波（奈良県・大阪府）",mk:"asuka",best:"tenjin",bs:"新しい教えをめぐる時代や。どっちの言い分も、よう聞かなあかん。わしが行こ。",
 intro:"6世紀のなかば、海の向こうの百済から、仏像と経典が伝えられた。\n新しい信仰を受け入れるかどうかをめぐって、朝廷の意見は二つに分かれる。",
 pol:"新しい信仰をめぐる争いに、どう向き合う？",
 ch:[{l:"両方の言い分を聞く",sc:2,t:"『日本書紀』によれば、蘇我稲目は「諸国は皆、礼拝している。日本だけが背くべきだろうか」と答えた。\n物部尾輿と中臣鎌子は「今、改めて外国の神を拝めば、国つ神の怒りを受けるだろう」と反対した。\nどちらも、国を思っての言葉だった。"},
     {l:"難波の堀江へ向かう",sc:1,t:"善光寺の縁起では、仏像は、物部尾輿らによって難波の堀江に捨てられたと伝える。\nのちに、信濃の本田善光が、堀江で仏像を拾い上げ、信濃へ持ち帰ったという。"},
     {l:"どちらかの味方をする",sc:0,t:"どちらか一方を悪者にしても、争いは止められない。\n新しい信仰を受け入れるかどうか――それは、国の行く末をめぐる、時代の大きな問いだった。"}],
 res:"崇仏派の蘇我氏と、排仏派の物部氏・中臣氏の対立は続き、587年、蘇我馬子が物部守屋を滅ぼした。こののち、仏教は日本で広まっていく。ただ、仏教が受け入れられてからも、神々の祭りは続けられた。『日本書紀』は、推古天皇が聖徳太子と蘇我馬子に命じて、神祇を祭らせたと記す。",
 memo:[{k:"史実",x:"諸説",t:"『日本書紀』は、欽明天皇の時代に、百済の聖明王が仏像・経典などを献じたと記す（552年）。一方、『上宮聖徳法王帝説』や『元興寺縁起』には、538年に伝来したとある。",s:"『神社のいろは 続』p.28（神社検定公式テキスト）"},
       {k:"史実",t:"『日本書紀』によれば、仏教を受け入れるかどうかについて、蘇我稲目は賛成し、物部尾輿と中臣鎌子は「国つ神の怒りを受ける」と反対した。崇仏派の蘇我氏と、排仏派の物部氏・中臣氏の対立は、その後も続いた。",s:"『神社のいろは 続』p.29（神社検定公式テキスト）"},
       {k:"史実",t:"蘇我馬子は物部守屋を滅ぼし（587年）、こののち仏教は興隆していった。八尾（大阪府）は、この仏教をめぐる争いの古戦場となった。",s:"『神社のいろは 続』p.29-30（神社検定公式テキスト）／八尾市（公式）"},
       {k:"伝承",t:"善光寺の本尊・一光三尊阿弥陀如来は、『善光寺縁起』によれば、欽明天皇13年（552年）に百済から伝えられた仏像。物部尾輿らに難波の堀江へ捨てられたが、のちに信濃の本田善光が拾い上げて持ち帰ったという。",s:"善光寺（公式「紹介」「逸話」）"},
       {k:"史実",t:"仏教が受け入れられてからも、神々の祭りは続けられた。『日本書紀』は、推古天皇が聖徳太子と蘇我馬子に命じ、朝廷の役人を率いて神祇を祭らせたと記す。",s:"『神社のいろは 続』p.30-31（神社検定公式テキスト）"}]},
{key:"inari711",theme:"稲荷山への鎮座と、伏見稲荷大社の始まり",per:"奈良時代",arr:"山城国、深草の里。稲荷山の三つの峰が、なだらかに連なっている。\n深草の長者と伝わる秦伊呂具が、山の峰に神を祀ろうとしていた。里には、田んぼが広がっている。\nイナリ「ここや…。俺、なんか胸がいっぱいになってきたわ。」\nミナカタ「イナリ、泣いとるんか？」\nイナリ「泣いてへん！ 山の空気が、目にしみるだけや！」\nテンジン「どこかで聞いた言い訳やな。」\nアマテ「わ、わらわは関係なかろう。」\nハチマン「…良い土地だ。」\nイナリ「せやろ？ 稲の実りをつかさどる神さんに、ふさわしい山や。」\nそのとき、どこからか白い鳥が飛んできて、山の峰のほうへ消えていった。\nテンジン「今の鳥…。何かの由来と、関係ありそうやな。調べてみよか。」\nイナリ「よっしゃ、俺も行く！」",note:"※和銅4年（711年）は、伏見稲荷大社に伝わる鎮座の年。『山城国風土記』の逸文には、この年は書かれていない。",sp:[1, 1, 0, 1, 1, 1],f:"inari",sc:"k4",era:"和銅4年（711年）",place:"伏見稲荷（京都府）",mk:"fushimi",best:"inari",bs:"稲荷の始まりの話や！ 俺に任しとき！",
 intro:"711年、山城国の稲荷山。\n深草の長者と伝わる秦伊呂具（はたのいろぐ）が、山の峰に神を祀ろうとしている。\n\nジンジャーマンは、この鎮座に立ち会うことになった。",
 pol:"稲荷山で、何をする？",
 ch:[{l:"「いなり」の名の由来を調べる",sc:2,t:"『山城国風土記』の逸文には、伊呂具秦公が的にして射た餅が白鳥となって飛び、降りた山の峰に稲が生ったので、社の名とした、とある。"},
     {l:"山の三つの峰に登る",sc:1,t:"稲荷山には、三ヶ峰と呼ばれる峰が連なる。\n伏見稲荷大社の伝承では、和銅4年2月の初午の日、稲荷大神が、この三ヶ峰に鎮座したという。"},
     {l:"お供えの稲を運ぶ",sc:1,t:"重い稲束も、仲間と運べばすぐだ。\n稲荷の神は、稲の実りをつかさどる農業の神として、古くから信仰されてきた。"}],
 res:"稲荷大神は、稲荷山に祀られた。伏見稲荷大社の始まりと伝えられる。",
 memo:[{k:"伝承",t:"伏見稲荷大社は、和銅4年（711年）2月の初午の日に、稲荷大神が稲荷山の三ヶ峰に鎮座したと伝える。社記では、深草の長者・伊呂具秦公が勅命を受けて祀ったという。",s:"伏見稲荷大社（公式「沿革」）／『神社のいろは』p.62（神社検定公式テキスト）"},
       {k:"伝承",t:"『山城国風土記』の逸文では、伊呂具秦公が的にして射た餅が白鳥となって飛び、降りた峰に稲が生ったことから「伊奈利」を社名としたという。",s:"伏見稲荷大社（公式「沿革」）"},
       {k:"伝承",t:"2月の初午の日の祭りは、この鎮座の伝承にちなむ。当日授与される「しるしの杉」は、家々に稲荷神を招くものとして信仰される。",s:"『神社のいろは』p.62（神社検定公式テキスト）"},
       {k:"史実",t:"天長4年（827年）に従五位下、天慶5年（942年）には正一位の神階に進んだ。",s:"伏見稲荷大社（公式「沿革」）"}]},
{key:"todaiji749",theme:"八幡神の上京と、東大寺での出迎え",per:"奈良時代",arr:"奈良の都は、人であふれていた。東大寺では、大仏の造立が進んでいる。そこへ、遠く宇佐の八幡神が上京してくるという。\nハチマン「…八幡神の、晴れの日だ。」\nイナリ「ハチマン、ネクタイ曲がってるで。」\nハチマン「…ネクタイは、していない。」\nテンジン「八幡神が、大仏の造立を助ける…。神さんと仏さんが手を結ぶ、大事な場面やな。」\nミナカタ「行列の荷物、重そうやなあ。ワシ、腕が鳴るで！」\nアマテ「皆、粗相のないようにな。都の人々も、見ておるぞ。」\n人波をかき分けると、遠くの道に、行列の先頭が見えてきた。都の人々が、ひと目見ようと背伸びしている。\nイナリ「すごい人や…。ハチマン、はぐれたらあかんで。」\nハチマン「…行こう。出迎えの支度だ。」",sp:[2, 3, 0, 2, 2, 2],f:"hachiman",sc:"k5",era:"天平勝宝元年（749年）",place:"平城京・東大寺（奈良県）",mk:"nara",best:"hachiman",bs:"…八幡神の話なら、俺が適任だ。",
 intro:"749年、奈良の都。東大寺では、大仏の造立が進んでいる。\nそこへ、遠く宇佐の八幡神が、上京することになった。\n\nジンジャーマンは、この行列の護衛と出迎えを任された。",
 pol:"八幡神の上京に、どう関わる？",
 ch:[{l:"行列の道筋を整える",sc:1,t:"宇佐の八幡神は、大仏の造立を助けるというお告げを出し、都へ上ったと伝わる。\n遠い宇佐から、長い道のりだ。"},
     {l:"東大寺で、盛大に出迎える",sc:2,t:"749年、八幡神は奈良の都に迎えられ、東大寺の大仏を拝したという。\n八幡神は、東大寺を守る神としてまつられた（今の手向山八幡宮）。"},
     {l:"行列の荷を運ぶ（力仕事）",sc:1,t:"重い荷も、ミナカタにかかれば軽いもの。\n行列は、無事に東大寺へ着いた。"}],
 res:"八幡神は、仏法を守る神としても崇められるようになり、のちに「八幡大菩薩」の称号を贈られた。神仏習合のさきがけの一つとされる。",
 memo:[{k:"史実",t:"天平勝宝元年（749年）、宇佐の八幡神が奈良の都に迎えられ、東大寺の大仏を拝した。",s:"奈良市（公式）"},
       {k:"伝承",t:"八幡神は、東大寺の大仏造立を助けるというお告げを出して上京し、東大寺の守護神として鎮座したとされる。のちに「八幡大菩薩」の称号が贈られた。",s:"『神社のいろは』p.60（神社検定公式テキスト）"},
       {k:"伝承",t:"手向山八幡宮は、東大寺の鎮守。聖武天皇が、宇佐から八幡神を勧請したと伝わる。",s:"奈良県立図書情報館"}]},
{key:"usa769",theme:"宇佐での神託と、和気清麻呂の旅",per:"奈良時代",arr:"宇佐の森は、しんと静まりかえっていた。\n都から遣わされた和気清麻呂が、八幡神のお告げの真偽を確かめに来たのだ。道鏡を天皇にすれば天下は太平になる――そんなお告げがあったと、都で伝えられたからである。\n清麻呂の顔は、旅の疲れと緊張で、こわばっている。\nイナリ「清麻呂さん、肩に力が入りすぎや。ほら、深呼吸、深呼吸。」\n清麻呂は、少しだけ笑って、大きく息を吸った。\nテンジン「国の行方を左右するお告げや。そら、緊張もするわな。」\nハチマン「…真実を聞くには、まっすぐな心がいる。」\nアマテ「うむ。わらわたちも、心を澄ませて、ともに耳を傾けよう。」\nミナカタ「ワシ、静かにしときます。…くしゃみ、出そうやけど。」\n一行は、そっと、森の奥へ進んでいった。",sp:[3, 4, 0, 3, 3, 2],f:"hachiman",sc:"k6",era:"神護景雲3年（769年）",place:"宇佐（大分県）",mk:"usa",best:"hachiman",bs:"…八幡神のお告げの真偽か。俺が確かめる。",
 intro:"神護景雲3年（769年）。称徳天皇は、僧・道鏡に皇位を譲ろうとしていた。\n道鏡を天皇にすれば天下は太平になる、という八幡神のお告げがあった、と伝えられたのだ。\n真偽を確かめるため、和気清麻呂が宇佐へ遣わされた。\n\nジンジャーマンは、清麻呂の旅に同行した。",
 pol:"宇佐で、どう動く？",
 ch:[{l:"大尾神社で、お告げを聞く",sc:2,t:"和気清麻呂は、大尾神社で神託を受けた。\n皇位は、皇室の血を引く人にのみ継がれるべきだ、というものだった。"},
     {l:"都の思惑を探る",sc:1,t:"八幡神が本殿へ戻るのが遅れたのは、宇佐の影響力を警戒した、奈良の権力者の策略だった、と考える歴史学者もいる。"},
     {l:"大尾山の由来を調べる",sc:1,t:"749年の上京の帰り道、八幡神は、本殿が清められる間、大尾山に祀られるべきだと告げた。\n765年、大尾神社が建てられた。"}],
 res:"清麻呂が持ち帰った神託により、道鏡は天皇になれなかった。このことから、八幡神は皇位を守る神としても崇められていく。",
 memo:[{k:"史実",t:"神護景雲3年（769年）、称徳天皇は道鏡に皇位を譲ろうとしたが、宇佐八幡神のお告げと和気清麻呂によって、果たされなかった。",s:"『神社のいろは 続』p.50-51（神社検定公式テキスト）／『神社のいろは』p.60"},
       {k:"伝承",t:"宇佐神宮の大尾神社は、和気清麻呂が神託を受けた場所とされる。765年に建てられ、八幡神は15年間、そこに留まったという。",s:"観光庁 地域観光資源の多言語解説文データベース（大尾神社）"},
       {k:"史実",x:"諸説",t:"八幡神の本殿への帰還が遅れたのは、奈良の権力者の策略だった、と考える歴史学者もいる。",s:"観光庁 地域観光資源の多言語解説文データベース（大尾神社）"}]},
{key:"iwashimizu859",theme:"石清水八幡宮の始まり",per:"平安時代",arr:"平安京の南西、男山の峰に、霧がかかっている。\n南都・大安寺の僧・行教は、宇佐で受けた八幡神のお告げを胸に、この地へやって来た。\nテンジン「ここは、都から見て南西。『裏鬼門』いうて、守りが大事な方角や。」\nイナリ「鬼門の裏…。なんや、強そうな響きやな。」\nミナカタ「鬼が出たら、ワシが相撲で勝負したる！」\nハチマン「…鬼が出るとは、言っていない。」\nアマテ「都を守る神さまを、お迎えする山なのじゃな。」\n行教は、山の峰をじっと見上げ、静かに手を合わせた。長い旅だったのだろう。衣のすそは、泥で汚れている。\nイナリ「行教さん、ほんまに、ようここまで来はったなあ。」\nハチマン「…ありがたいことだ。」\nジンジャーマンも、八幡神を迎える支度を手伝うことにした。",sp:[6, 10, 0, 5, 5, 4],f:"hachiman",sc:"k7",era:"貞観元年（859年）",place:"石清水八幡宮（京都府）",mk:"iwashimizu",best:"hachiman",bs:"…八幡神を都へ迎えるなら、俺の出番だ。",
 intro:"平安京の時代。南都・大安寺の僧・行教が、宇佐八幡宮にこもり、八幡神のお告げを受けた。\n\nジンジャーマンは、八幡神を都の近くへ迎える旅に加わった。",
 pol:"八幡神を、どこに迎える？",
 ch:[{l:"都の裏鬼門・男山に迎える",sc:2,t:"男山は、都から見て南西、「裏鬼門」の方角にあたる。\n石清水八幡宮は、国家と都を守る神として迎えられた。"},
     {l:"お告げの言葉を記録する",sc:1,t:"行教が受けたお告げは「吾れ都近き男山の峯に移座して国家を鎮護せん」というものだったと伝わる。"},
     {l:"都の真ん中に迎える",sc:0,t:"都の真ん中ではなかった。\nお告げのとおり、八幡神は、都に近い男山の峯に迎えられた。"}],
 res:"八幡神は男山に迎えられ、石清水八幡宮が生まれた。のちに、伊勢の神宮に次ぐ「第二の宗廟」と称されるようになる。",
 memo:[{k:"伝承",t:"南都・大安寺の僧・行教が宇佐で八幡大神のお告げを受け、貞観元年（859年）、男山の峯に御神霊を奉安した。これが石清水八幡宮の起源とされる。",s:"石清水八幡宮（公式「石清水八幡宮について」）"},
       {k:"史実",t:"石清水八幡宮は、鎮護国家・王城鎮護の神として朝廷から篤く崇敬され、伊勢の神宮に次ぐ「第二の宗廟」と称された。",s:"『神社のいろは』p.60（神社検定公式テキスト）"},
       {k:"史実",t:"男山には、神仏習合のもとで多くの坊舎が建てられ、「男山四十八坊」と呼ばれた。",s:"奈良文化財研究所の報告書"}]},
{key:"gozu869",nw:1,theme:"祇園の御霊会と、牛頭天王",per:"平安時代",arr:"平安京の東、鴨川を渡った先に、祇園の社がある。\n貞観11年（869年）。都では疫病が流行り、人々は不安な日々を送っていた。\nテンジン「当時の人は、疫病を『御霊（ごりょう）』のたたりとも恐れてな。お祭りで鎮めようとしたんや。それが『御霊会』や。」\nイナリ「お祭りで、病気を追い払うんやな。」\nテンジン「せや。神泉苑いう庭園に神輿を送って、66本の矛を立てて祈った、と伝わっとる。」\nミナカタ「66本！ そんなぎょうさん、誰が運んだんや？ ワシ、手伝うで！」\nハチマン「…数えるのは、俺がやる。」\nアマテ「祇園のお社には、牛頭天王という神が祀られておるそうじゃ。」\nイナリ「ごずてんのう…。名前に『牛』がついとるな。」\nテンジン「姿のことは、ここで決めつけんとこ。ゆっくり調べよか。」\n社の奥から、ほのかな光がこぼれた。ジンジャーマンは、そっと近づいた。",sp:[7,11,0,6,6,4],f:"tenjin",sc:"m10",era:"貞観11年（869年）",place:"祇園・八坂神社（京都府）",mk:"gion",best:"tenjin",bs:"疫病と御霊（ごりょう）の話か。ワシの縁も深い話や。しっかり見とくで。",
 intro:"貞観11年（869年）、都に疫病が流行した。神泉苑で御霊会が行われ、祇園の社は、牛頭天王を祀る社として人々の信仰を集めていく。\n\nジンジャーマンは、祇園の社を訪ねた。",
 pol:"疫病の都で、何をする？",
 ch:[{l:"御霊会に加わる",sc:2,t:"貞観11年、疫病の流行のとき、神泉苑に神輿を送り、66本の矛を立てて、災いが除かれるように願った。これが祇園祭の由来とされる。"},
     {l:"蘇民将来の話を聞く",sc:2,t:"『備後国風土記』逸文に、旅の神・武塔神が、もてなしてくれた蘇民将来に、茅の輪を腰につけさせて、疫病から守ったという話がある。\n…これは、史実ではなく、伝承だ。"},
     {l:"牛頭天王のことを調べる",sc:1,t:"祇園の社は、牛頭天王を祀っていたので「祇園社」と呼ばれた。神と仏がまじわる神仏習合の中で、牛頭天王は、素戔嗚尊と同じ神とされるようになった。"}],
 res:"疫病を鎮める祈りは、のちの祇園祭につながっていった。牛頭天王への信仰は、京都の祇園社から、愛知の津島神社などの「天王社」へと広がっていく。茅の輪くぐりも、この蘇民将来の話に由来するといわれる。",
 memo:[{k:"史実",t:"貞観11年（869年）、疫病の流行のとき、神泉苑に神輿を送り、66本の矛を立てて、災いが除かれることを願った。これが祇園祭の由来とされる。",s:"八坂神社（公式）「八坂神社の歴史」"},
       {k:"史実",t:"祇園の社は、牛頭天王を祀っていたため「祇園社」と呼ばれた。素戔嗚尊は、古くは牛頭天王とも称された。神仏習合の中で、牛頭天王は、素戔嗚尊と同じ神とされた。",s:"八坂神社（公式）「八坂神社について」"},
       {k:"史実",t:"愛知県の津島神社は、かつて「津島牛頭天王社」と称した。牛頭天王信仰の中心の一つで、全国に3000社以上ある津島神社・天王社の総本社とされる。",s:"愛知県公式観光サイト Aichi Now「津島神社」／津島神社（公式）"},
       {k:"伝承",t:"津島神社は、欽明天皇元年（540年）の鎮座と伝えられる。",s:"愛知県公式観光サイト Aichi Now「津島神社」"},
       {k:"伝承",t:"『備後国風土記』逸文に、旅の神・武塔神（のちに、素戔嗚尊や牛頭天王と習合して語られる）が、もてなした蘇民将来に、茅の輪を腰につけさせ、疫病から守ったという話が伝わる。茅の輪くぐりや「蘇民将来之子孫也」の護符の起源とされる。",s:"八坂神社（公式）「御祭神」（疫神社）／『神社のいろは』p.70・p.116（神社検定公式テキスト）"},
       {k:"史実",x:"未確認",t:"神泉苑の御霊会については、史書に残る別の年（貞観5年）の記事もあるとされる。この章は、八坂神社の公式の説明（貞観11年）に従った。両者の関係は、まだ確かめていない。",s:"八坂神社（公式）「八坂神社の歴史」"}]},
{key:"dazaifu901",theme:"菅原道真の左遷と、大宰府での最期",per:"平安時代",arr:"大宰府の空は、どんよりと曇っていた。\n都で右大臣をつとめた菅原道真は、無実の罪に問われ、この地へ左遷されてきた。都は、はるか遠い。\nテンジン「……。」\nイナリ「テンジン、さっきから黙ってるな。」\nテンジン「わしの名前の元になった方の話や。軽口は、よう言われへん。」\nいつも冗談ばかりの仲間たちも、静かになった。\nアマテ「都を離れても、道真さまのお心までは、誰にも奪えぬ。」\nハチマン「…ああ。」\nミナカタ「なんか、ワシにできることないやろか…。せめて、温かいお茶でも。」\nテンジン「…ありがとうな、ミナカタ。」\nイナリ「…せやな。今日は、みんなで、そばにおろ。」\nテンジンは、遠い都の方角を、しばらく見つめていた。\n雲の向こうで、かすかに雷が鳴った。",sp:[8, 14, 0, 7, 7, 5],f:"tenjin",sc:"k8",era:"昌泰4年（901年）",place:"太宰府（福岡県）",mk:"dazaifu",best:"tenjin",bs:"天神の話なら、わしの出番やな。",
 intro:"昌泰4年（901年）。右大臣・菅原道真は、左大臣・藤原時平らによって無実の罪に問われ、大宰府へ左遷される。\n\nジンジャーマンは、道真の行く末を見届けるため、大宰府へ向かった。",
 pol:"道真の行く末を、どう見届ける？",
 ch:[{l:"道真を励ます",sc:1,t:"励ましたが、道真は、延喜3年（903年）2月25日に、大宰府で亡くなった。\n左遷から、わずか2年ほどのことだった。"},
     {l:"葬送を見届ける",sc:2,t:"亡骸を乗せた牛車は、途中で動かなくなったという。\n門弟の味酒安行は、これを道真の御心と考え、その地に葬った。"},
     {l:"都の様子を調べる",sc:1,t:"都では、災害や異変が続いた。道真を罪に陥れた人々が次々に亡くなり、宮中に雷が落ちることまで起きた。\n人々は、これを道真の怒りと考えた。"}],
 res:"延喜5年（905年）、道真の墓所に祠廟が建てられ、延喜19年（919年）には社殿が造営された。のちの太宰府天満宮である。",
 memo:[{k:"史実",t:"昌泰4年（901年）、右大臣・菅原道真は、藤原時平らによって無実の罪に問われ、大宰府に左遷された。",s:"太宰府市（公式）／『神社のいろは』p.64（神社検定公式テキスト）"},
       {k:"史実",t:"道真は、延喜3年（903年）2月25日、大宰府で59歳で亡くなった。",s:"太宰府天満宮（公式「御由緒」）／『神社のいろは』p.64"},
       {k:"伝承",t:"亡骸を乗せた牛車が動かなくなり、門弟の味酒安行が、その地に葬ったと伝わる。",s:"太宰府天満宮（公式「御由緒」）"},
       {k:"史実",t:"太宰府天満宮の創祀は延喜5年（905年）。延喜19年（919年）には、墓所の上に社殿が造営された。",s:"『神社のいろは』p.65（神社検定公式テキスト）／太宰府天満宮（公式「御由緒」）"}]},
{key:"kitano947",theme:"北野天満宮の創建",per:"平安時代",arr:"都では、不安なうわさが広がっていた。道真の死後に続いた災いは、道真の怒りによるものではないか、と。\nやがて、多治比文子という女性が「われを右近の馬場に祀れ」という道真のお告げを受けたと伝わる。\nテンジン「道真さんを祀り、お鎮めする社をつくるんや。わしも、本気出すで。」\nイナリ「テンジンの本気、初めて見るかもしれん。」\nテンジン「失礼な。わしはいつも本気や。…たまに、居眠りするだけで。」\nミナカタ「社を建てるなら、柱運びはワシに任しとき！」\nハチマン「…場所の確かめが、先だ。」\nアマテ「社ができれば、人々の不安な心も、少しは和らぐであろうな。」\n北野の野を、さわやかな風が吹き抜けていった。テンジンは、ぐっとこぶしを握りしめた。",sp:[10, 18, 3, 9, 9, 8],f:"tenjin",sc:"k9",era:"天暦元年（947年）",place:"北野天満宮（京都府）",mk:"kitano",best:"tenjin",bs:"北野の社づくりなら、わしが仕切るで。",
 intro:"道真の死後、都で起きた災いは、道真の怒りによるものだ、と考えられるようになった。\nやがて、多治比文子という女性が「われを右近の馬場に祀れ」という道真のお告げを受けたと伝わる。\n\nジンジャーマンは、社づくりを手伝うことになった。",
 pol:"北野で、何を手伝う？",
 ch:[{l:"北野に社を建てる",sc:2,t:"天暦元年（947年）、北野の地に、道真を祀る社が創建された。\nこれが、北野天満宮である。"},
     {l:"お告げの場所を探す",sc:1,t:"お告げの場所は、北野の右近馬場だった。\n文子が道真を祀った社は、北野天満宮の前身とも伝えられている（今の文子天満宮）。"},
     {l:"噂を打ち消して回る",sc:0,t:"噂は収まらなかった。\n朝廷も、道真の位を右大臣に戻し、さらに太政大臣の位を贈って、その怒りを慰めた。"}],
 res:"北野天満宮が創建された。永延元年（987年）には、朝廷から勅使が遣わされ、「北野天満大自在天神」とたたえられた。",
 memo:[{k:"史実",t:"天暦元年（947年）、北野天満宮が創祀された。",s:"『神社のいろは』p.65（神社検定公式テキスト）／『神社のいろは 続』p.78"},
       {k:"伝承",t:"「われを右近の馬場に祀れ」という道真のお告げを受けたのは、多治比文子と伝えられる。『神社のいろは』は「ある神職の息子と巫女に託宣が下り」と記す。",s:"京都市下京区役所「文子天満宮」／『神社のいろは』p.64"},
       {k:"史実",t:"永延元年（987年）、朝廷から勅使が遣わされ、「北野天満大自在天神」とたたえられた。",s:"北野天満宮（公式）"},
       {k:"史実",t:"江戸時代には、寺子屋や藩校で天神さまが祀られ、学問の神として広く信仰された。",s:"『神社のいろは』p.64（神社検定公式テキスト）／北野天満宮（公式）"}]},
{key:"kumano_insei",theme:"院政期の熊野御幸",per:"平安時代",arr:"熊野へ向かう山道に、長い長い行列が続いている。上皇や法皇たちの、熊野御幸だ。\nイナリ「すごい人数や…。列の終わりが見えへんで。」\nテンジン「都から熊野まで、山を越え、谷を越え。しかも、何度も来はったんやて。」\nミナカタ「ワシ、もう足がパンパンや…。」\nハチマン「…まだ、半分も来ていない。」\nミナカタ「言わんといてえな！」\nアマテ「つらい道だからこそ、たどり着いた時の喜びも大きいのであろう。」\nイナリ「帰りは、稲荷にも寄ってもらわな。熊野帰りのお約束や。」\nふと、杉木立の上で、カラスが鳴いた。見上げると、黒い影が、すっと枝から枝へ移った。\nアマテ「…今、足が三本、あったような。」\nイナリ「まさか。疲れて、見間違えたんちゃう？」",sp:[30, 120, 30, 20, 40, 150],f:"kumanon",sc:"k10",era:"院政期（11〜12世紀）",place:"熊野（和歌山県）",mk:"kumano",best:"inari",kumano:true,bs:"熊野の行き帰りは、稲荷に寄るのがお約束や！",
 intro:"院政の時代。上皇や法皇たちは、都から遠い熊野へ、何度も参詣した。「熊野御幸」である。\n\nジンジャーマンは、その長い行列に加わった。",
 pol:"熊野への道で、どう動く？",
 ch:[{l:"行列を守って、山道を進む",sc:1,t:"熊野への道は、山深く険しい。\n京都や大坂から、1カ月以上をかけて歩いて参詣した人々もいたという。"},
     {l:"帰り道に、稲荷社へ寄る",sc:2,t:"熊野詣の行き帰りには、稲荷社に参り、杉の小枝をいただいて身につける習わしがあった。\n今の「しるしの杉」の由来という。"},
     {l:"御幸の回数を数える",sc:1,t:"延喜7年（907年）の宇多法皇から亀山上皇まで、熊野御幸は百数十度に及んだという。\nただし、上皇ごとの回数は、資料によって違いがある。"}],
 km:"…熊野の道は、俺の庭だ。迷わせはしない。",
 res:"熊野への参詣は、上皇から武士や庶民へと広がり、その多さは「蟻の熊野詣」と呼ばれるほどになった。",
 memo:[{k:"史実",t:"熊野御幸は、延喜7年（907年）の宇多法皇に始まり、亀山上皇までで百数十度に及んだ（熊野本宮大社は「百余度」と記す）。",s:"『神社のいろは 続』p.88（神社検定公式テキスト）／熊野本宮大社（公式）"},
       {k:"史実",x:"諸説",t:"上皇ごとの御幸の回数は、資料によって違いがある。後鳥羽上皇は28度とされる。",s:"『神社のいろは 続』p.88（神社検定公式テキスト）"},
       {k:"史実",t:"熊野詣の行き帰りに稲荷社に参り、杉の小枝（しるしの杉）を身につける習わしがあった。永保元年（1081年）の藤原為房、平治元年（1159年）の平清盛の例が記録に残る。",s:"伏見稲荷大社（公式「しるしの杉」）"},
       {k:"史実",t:"熊野の三神は、神仏習合によって「熊野三所権現」とも呼ばれた。参詣者の多さは「蟻の熊野詣」といわれた。",s:"『神社のいろは』p.66（神社検定公式テキスト）"}]},
{key:"kamakura1180",theme:"源頼朝の鎌倉と、鶴岡八幡宮",per:"平安時代末期",arr:"鎌倉の浜に、波が打ち寄せている。平家を倒す兵を挙げた源頼朝が、この地に入った。\n浜の近くには、頼朝の祖先・源頼義が、京の石清水八幡宮から迎えた社がある。\nハチマン「…源氏の氏神、八幡神の社だ。」\nイナリ「ハチマン、なんや誇らしげやな。」\nハチマン「…気のせいだ。」\nテンジン「頼朝さんは、ここに新しい町をつくるつもりらしいで。道をまっすぐ通して、その奥に…。」\nミナカタ「町づくりか！ 地ならしやったら、ワシの出番やな！」\nアマテ「町の真ん中に、神さまをお祀りするのじゃな。」\n頼朝は、浜から山のほうを、じっと見つめていた。その目は、まだ見ぬ町の姿を、思い描いているようだった。\nイナリ「…ええ目や。この人、本気やで。」\nハチマン「…ああ。」",sp:[40, 300, 50, 30, 60, 250],f:"hachiman",sc:"k11",era:"治承4年（1180年）",place:"鎌倉（神奈川県）",mk:"kamakura",best:"hachiman",bs:"…源氏の氏神、八幡神の話だな。任された。",
 intro:"1180年。平家を倒す兵を挙げた源頼朝が、鎌倉に入った。\n鎌倉には、頼朝の祖先・源頼義が、京の石清水八幡宮から迎えた社があった。\n\nジンジャーマンは、新しい町づくりを手伝うことになった。",
 pol:"鎌倉の町づくりで、何をする？",
 ch:[{l:"八幡宮を、町の中心に移す",sc:2,t:"頼朝は、八幡宮を今の地に遷し、若宮大路を中心線とする鎌倉の町づくりを進めた。"},
     {l:"若宮の由来を調べる",sc:1,t:"康平6年（1063年）、源頼義が、京の石清水八幡宮を、鎌倉の由比の地に迎えたのが始まりだった。"},
     {l:"海辺の社を、そのまま守る",sc:0,t:"頼朝は、社を今の地へ移すことを選んだ。\n町の中心に、八幡宮を据えるためだった。"}],
 res:"鶴岡八幡宮は、源氏の氏神、幕府の守護神とされた。八幡神は、その後も武士の守護神として、全国に広まっていく。",
 memo:[{k:"史実",t:"鶴岡八幡宮の創祀は康平6年（1063年）。源頼義が、源氏の氏神として、石清水八幡宮を鎌倉の由比に勧請した。",s:"『神社のいろは』p.60（神社検定公式テキスト）／鶴岡八幡宮（公式）"},
       {k:"史実",t:"治承4年（1180年）、源頼朝は、先祖ゆかりの八幡宮を今の地に遷した。",s:"鶴岡八幡宮（公式）／『神社のいろは 続』p.90"},
       {k:"史実",t:"頼朝は、若宮大路を中心線とし、その奥に八幡宮を据えて、源氏の氏神・幕府の守護神と位置づけた。",s:"『神社のいろは 続』p.90（神社検定公式テキスト）"}]},
{key:"genko1281",theme:"元寇と、伊勢での祈り",per:"鎌倉時代",arr:"伊勢の空を、強い風が吹き抜けていく。\n九州には、海の向こうから、元の大軍が押し寄せた。伊勢でも、国の無事を祈る人々が集まっているという。\nミナカタ「すごい風や…。ワシ、風の神さんにゆかりの名前やけど、こんな風は初めてや。」\nテンジン「伊勢には、風の神さんを祀る社があるんやで。」\nイナリ「風の神さんか。…ほな、ミナカタの親戚？」\nミナカタ「ちゃうちゃう。たぶん、ちゃう。」\nハチマン「…九州では、今も戦いが続いている。」\nアマテ「遠く離れた地からでも、祈りは届くと、わらわは信じておる。」\nミナカタ「ほな、ワシも、風に向かって祈ってみるわ。」\n人々は、風の吹く方へ向かって、静かに頭を下げていた。ジンジャーマンも、その列の後ろに、そっと並んだ。",sp:[60, 800, 120, 80, 150, 500],f:"amate",sc:"k12",era:"弘安4年（1281年）",place:"伊勢（三重県）",mk:"ise",best:"amate",bs:"伊勢の神風か。わらわが見届けよう。",
 intro:"1274年と1281年、元の大軍が、九州に押し寄せた（元寇）。\n伊勢でも、祈りがささげられたと伝わる。\n\nジンジャーマンは、伊勢で、その祈りを見届けることになった。",
 pol:"伊勢で、何をする？",
 ch:[{l:"風の神の社に参る",sc:2,t:"内宮の風日祈宮の祭神は、風雨をつかさどる級長津彦命と級長戸辺命。\n元寇のとき神風を吹かせたとして、別宮に格上げされたと伝えられる。"},
     {l:"外宮の風宮も訪ねる",sc:1,t:"外宮にも、風の神を祀る社がある（風宮）。\n元寇のあと、内宮の風日祈宮とともに、別宮になったとされる。"},
     {l:"神風の言い伝えを調べる",sc:1,t:"2度の元寇で、日本は暴風雨によって難を免れた、と伝えられる。\nその風は、伊勢の風の神が吹かせた「神風」とされた。"}],
 res:"風の神の社は、別宮へと格が上がった。風日祈宮では、今も毎年「風日祈祭」が行われている。",
 memo:[{k:"伝承",t:"元寇のとき、内宮・外宮の風の神の社が神風を吹かせたとされ、朝廷の命で宮号を称して、別宮となった。",s:"『神社のいろは 続』p.100-101（神社検定公式テキスト）"},
       {k:"史実",t:"元寇は、文永の役（1274年）と弘安の役（1281年）の2回。日本は暴風雨によって難を免れた、と記される。",s:"『神社のいろは 続』p.95（神社検定公式テキスト）"},
       {k:"史実",t:"内宮の別宮・風日祈宮は、正応6年（1293年）に宮号を賜ったとされる。祭神は級長津彦命・級長戸辺命。",s:"神宮（公式）"},
       {k:"史実",t:"風日祈祭は、毎年5月14日と8月4日に行われる。",s:"神宮（公式）"}]},
{key:"shugendo",nw:1,theme:"山伏と天狗、山に入る信仰",per:"室町時代",arr:"奈良・吉野の山。霧の中から、法螺貝の音が響いてくる。\n白い装束の山伏たちが、列をつくって、山道を登っていく。\nテンジン「山伏や。修験道の行者さんやな。山に入って修行して、力を身につけるんや。」\nアマテ「神も仏も、同じ山にましますのか…。」\nイナリ「神さんと仏さんが、一緒におる山か。ややこしそうやな。」\nハチマン「…錫杖の音が、山に響く。」\nミナカタ「あのカッコ、どっかで見たことあるで。…そや、天狗や！」\n山伏「天狗ではござらぬ。山伏でござる。」",sp:[100,1300,250,240,300,700],f:"hachiman",sc:"m20",era:"役行者から、明治5年まで",place:"吉野・高尾山（奈良県・東京都）",mk:"yoshino",best:"hachiman",bs:"…山に入る。黙って、ついていく。",
 intro:"修験道は、山で修行する、日本独自の宗教。山岳信仰を基に、仏教などが重なって形づくられたとされる。修行者は「山伏」と呼ばれ、役行者を開祖と仰ぐ。\n\nジンジャーマンは、吉野の山から、高尾山の天狗の話までをたどった。",
 pol:"山伏の道を行く5人は、どうする？",
 ch:[{l:"役行者の話を聞く",sc:2,t:"役行者は、7世紀ごろの奈良に生まれた実在の人物とされ、修験道の開祖と仰がれる。『続日本紀』にも、その名が見える。\n大峯山で修行して蔵王権現を感得し、その姿を山桜に刻んだという話は、寺に伝わる伝承だ。"},
     {l:"白山と出羽三山の話を聞く",sc:1,t:"白山は、養老元年（717年）に越前の僧・泰澄が初めて登拝し、翌年、山頂に奥宮を祀ったと伝わる。加賀・越前・美濃には、登拝の拠点となる「馬場」ができた。\n出羽三山では、山伏が宿坊で参拝者を迎え、先達として山を案内する。三山を巡る旅は、「生まれかわりの旅」と呼ばれた。"},
     {l:"高尾山で、天狗の話を聞く",sc:2,t:"高尾山薬王院では、天狗は、飯縄大権現の眷属として、災いを除く力を持つとされる。深山で修行して験力を得た山伏の姿が、天狗と重ねられることも多いという。\n山伏「…天狗ではござらぬ。」\nミナカタ「天狗さんと山伏さんは、深い縁があるんやな。」"}],
 res:"山に入り、自然の中に神仏を見て、修行する。修験道は、神道とも仏教とも、少し違う道だった。\n明治5年（1872年）には、修験道廃止令が出された。山伏は、天台宗・真言宗の仏教教団に所属するか、還俗して、神職や一般の人として生きるしかなくなった。\nアマテ「神も仏も、山も、分けられぬものがあるのじゃな。」\nハチマン「…山は、残った。」\n5人は、法螺貝の音を背に、山をおりた。",
 memo:[{k:"史実",x:"未確認",t:"役行者は、『続日本紀』文武天皇3年の条に記される実在の人物とされ、修験道の開祖として、修験の各派に尊崇されている。ただし、金峯山寺の公式ページの西暦表記は「685年」で、文武天皇3年（699年）と合わない。年は、まだ確かめていない。",s:"金峯山寺（公式）「金峯山寺について」／聖護院門跡（公式）「修験道」"},
       {k:"史実",t:"修験道は、自然崇拝に、外来の仏教・道教・陰陽道などが融合して成立した、日本独自の宗教とされる。山岳で修行する人は「修験者」「山伏」と呼ばれ、出家・在家を問わない。",s:"金峯山寺（公式）「金峯山寺について」／聖護院門跡（公式）「修験道」"},
       {k:"伝承",x:"諸説",t:"寺伝では、役行者は634年に葛城上郡の茅原に生まれ、大峯山上ヶ岳で一千日の参籠修行をして、金剛蔵王大権現を感得したとされる。その姿を山桜に刻み、山上ヶ岳と吉野山に祀ったと伝わる。これは寺伝にもとづく伝承で、史実として検証されたものではない。没年も、昇天説と天竺渡航説があり、確定していない。",s:"金峯山寺（公式）「金峯山寺について」"},
       {k:"史実",t:"蔵王権現の「権現」は、神仏が姿を変えて現れた仮の姿をいう。修験者は、森羅万象を神仏の応化とみなして、山岳での修行を重んじたとされる。",s:"金峯山寺（公式）「金峯山寺について」（「神仏習合」の語は原文にない）"},
       {k:"史実",t:"聖護院は、寛治4年（1090年）、白河上皇の熊野御幸の先達を務めた増誉が寺院を賜ったことに始まる。現在は、本山修験宗の総本山で、春の葛城修行や秋の大峰奥駈修行を行っている。",s:"聖護院門跡（公式）「聖護院門跡とは」"},
       {k:"史実",x:"未確認",t:"「本山派（聖護院）と当山派（醍醐寺）」という二大派の成立の経緯と時期は、確かめた公式ページに記述がなく、まだ確かめていない。",s:"（出典未確認）"},
       {k:"史実",t:"白山は、上古には、白山比咩大神の神霊のまします禁足の神体山として仰がれた。登拝が盛んになると、加賀・越前・美濃に、拠点となる馬場が設けられ、加賀馬場の中心が現在の白山比咩神社、越前馬場が平泉寺白山神社、美濃馬場が長滝白山神社にあたる。",s:"白山比咩神社（公式）「白山信仰」"},
       {k:"伝承",t:"越前の僧・泰澄（682年生まれ）が、養老元年（717年）に初めて白山に登拝し、翌年、山頂に奥宮を祀ったとされる。霊亀2年（716年）に、夢で女神に「白山に来たれ」と呼びかけられたという。",s:"白山比咩神社（公式）「白山信仰」（公式は事実として記すが、同時代の記録ではなく、伝承として扱う）"},
       {k:"史実",t:"明治の神仏分離令により、仏像や仏具が、白山の山頂から下ろされた。",s:"白山比咩神社（公式）「白山信仰」"},
       {k:"史実",x:"未確認",t:"出羽三山は、三山を巡ることで、生きながら新たな魂として再生する「生まれかわりの旅」が、江戸時代から広まった。山伏は、宿坊で参拝者を迎え、先達として山を案内する。羽黒山は「現在の世」を表すとされる。開山の蜂子皇子の伝承は、【伝承】として扱う。出羽三山神社の公式ページは取得できず、これらは日本遺産ポータル（文化庁）に拠る。月山・湯殿山の時間軸は、確かめていない。",s:"日本遺産ポータルサイト（文化庁）「生まれかわりの旅」（出羽三山神社公式は未確認）"},
       {k:"史実",t:"高尾山では、天狗は飯縄大権現の眷属（随身）として、災いを除き、運を開く力を持つとされる。山伏の姿が天狗と同一視されることも多い。永和年間（1375年）に、俊源が飯縄大権現を奉祀して中興した。",s:"高尾山薬王院（公式）「高尾山と天狗様」"},
       {k:"伝承",t:"高尾山薬王院は、天平16年（744年）、聖武天皇の勅令により、行基が開山したと伝わる。",s:"高尾山薬王院（公式）「高尾山と天狗様」"},
       {k:"史実",x:"未確認",t:"「山伏の姿が天狗と結びつくのは中世以降」という点は、確かめた公式資料では、はっきりとは書かれていない。この章を中世の帯に置いたのは、高尾山の飯縄大権現の奉祀（1375年）に合わせた、ゲームの位置づけ。",s:"（出典未確認）"},
       {k:"史実",t:"明治5年（1872年）、修験道廃止令が出され、修験者は天台宗・真言宗の仏教教団に所属することになった。修験者は半僧半俗だったので、民籍（平民）として扱われた。還俗して神職や農業などに従事した人も多い。吉野の金峯山寺も廃寺となった（のち天台宗の寺院として復興し、昭和23年に大峯修験宗、昭和27年に金峯山修験本宗を名のる）。",s:"国立国会図書館レファレンス協同データベース（宮家準『修験道の地域的展開』ほか）／金峯山寺（公式）／聖護院門跡（公式）"},
       {k:"史実",x:"未確認",t:"修験道廃止令の太政官布告の日付と文面は、まだ確かめていない。",s:"（出典未確認）"}]},
{key:"onin1468",theme:"応仁の乱と、戦火の稲荷社",per:"室町時代",arr:"京の都が、燃えている。\n応仁元年に始まった応仁の乱は、終わりが見えない。翌年、戦火は、ついに稲荷山にも迫ってきた。\nイナリ「やめてくれ…。稲荷のお山や…。」\nいつも明るいイナリの声が、ふるえていた。\nミナカタ「イナリ、しっかりせえ！ ワシらがついとる！」\nハチマン「…まずは、人を逃がせ。」\nテンジン「大事な物は、持ち出せるだけ持ち出そう。燃えてしもたもんも、何があったか、わしがちゃんと書き留めとく。」\nアマテ「社は、人の手で、また建てられる。まずは命じゃ。」\nイナリは、ぐっと唇をかみ、うなずいた。\nイナリ「…せや。お山は、また元に戻せる。みんな、頼む。」\n煙の向こうで、山の木々がざわめいていた。\nハチマン「…行くぞ。一人も、取り残すな。」",sp:[150, 1800, 400, 400, 400, 900],f:"inari",sc:"k13",era:"応仁2年（1468年）",place:"伏見稲荷（京都府）",mk:"fushimi",best:"inari",bs:"稲荷のお山が燃える…！ 俺が行かな！",
 intro:"応仁元年（1467年）、京の都で、応仁の乱が始まった。\n翌年、戦火は、稲荷山にも迫る。\n\nジンジャーマンは、稲荷社を守るため、駆けつけた。",
 pol:"戦火の稲荷社で、どうする？",
 ch:[{l:"再興を見届ける",sc:2,t:"焼け落ちた社殿は、明応8年（1499年）に再興された。\nこのとき再興されたご本殿は、今も残り、重要文化財に指定されている。"},
     {l:"社殿を守って戦う",sc:0,t:"守りきれなかった。\n応仁2年（1468年）3月、稲荷山の社殿は、ほかの建物とともに焼けてしまった。"},
     {l:"焼け跡の記録を残す",sc:1,t:"伏見稲荷大社の記録では、応仁2年3月、ご本殿は、山上・山下のほかの殿舎とともに灰になったという。"}],
 res:"明応8年（1499年）11月、再興されたご本殿への遷宮が行われた。",
 memo:[{k:"史実",t:"応仁元年（1467年）に応仁の乱が起こり、応仁2年（1468年）3月、稲荷山の社殿・堂塔などが焼失した。",s:"伏見稲荷大社（公式「沿革」「ご本殿修造」）"},
       {k:"史実",t:"明応8年（1499年）、焼失した社殿が再興された。ご本殿は、室町時代の典型的な社殿大型建築として、重要文化財に指定されている。",s:"伏見稲荷大社（公式「沿革」「ご本殿修造」）"},
       {k:"史実",t:"京では、吉田社（吉田神社）も、応仁の乱で焼失した。",s:"『神社のいろは 続』p.110（神社検定公式テキスト）"}]},
{key:"shingen",theme:"戦国時代の武田信玄と、諏訪の神",per:"戦国時代",arr:"諏訪の湖のほとりに、武田の陣が張られている。風になびく旗の数が、すごい。\n甲斐の武田信玄は、信濃の諏訪に兵を進めていた。\nミナカタ「旗が、ぎょうさん…。どれも、気合いが入っとるなあ。」\nイナリ「ミナカタ、なんや、きょろきょろしてるな。」\nミナカタ「諏訪の神さんが、どう祀られてるか、気になってしもて。」\nアマテ「ミナカタ、そなたの目が、輝いておるぞ。」\nミナカタ「バレました？」\nハチマン「…戦の陣だ。気を抜くな。」\nテンジン「戦国の武将は、神さんへの祈りも、真剣やったんや。」\nアマテ「祈りの形には、その時代の人々の心が、表れるものじゃな。」\n陣の奥から、兵たちのかけ声が聞こえてくる。\nイナリ「よっしゃ、気を引き締めて行こか。」\nジンジャーマンは、陣の様子を見に行った。",sp:[300, 2600, 600, 600, 900, 1200],f:"minakata",sc:"k14",era:"天文11年（1542年）〜",place:"諏訪（長野県）",mk:"suwa",best:"minakata",bs:"諏訪の神さんの話は、ワシに任しとき！",
 intro:"戦国時代。甲斐の武田信玄（晴信）は、信濃の諏訪に兵を進めた。\n諏訪の神は、武の神としても、篤く信仰されていた。\n\nジンジャーマンは、信玄の陣を訪ねた。",
 pol:"信玄の陣で、何を見る？",
 ch:[{l:"陣の旗を見る",sc:2,t:"信玄は、諏訪大社に戦勝を祈り、その旗を立てて出陣したという。\n旗には「諏方南宮法性大明神」の文字が記されていた。"},
     {l:"兜を見せてもらう",sc:1,t:"信玄が使ったと伝えられる「諏訪法性兜」は、のちに浄瑠璃や歌舞伎の『本朝廿四孝』で、大事な道具として登場する。"},
     {l:"諏訪の祭りの話を聞く",sc:1,t:"信玄は、諏訪大社の祭りを立て直すことにも、力を注いだという。"}],
 res:"中世の諏訪大社は「日本第一大軍神」とも称され、多くの武将の崇敬を集めた。1582年、武田氏は滅亡する。",
 memo:[{k:"史実",t:"甲斐の武田信玄は、諏訪大社に戦勝を祈り、その旗を立てて出陣した。",s:"『神社のいろは』p.68（神社検定公式テキスト）／諏訪大社（公式）"},
       {k:"史実",t:"武田晴信（信玄）の願文（1542年）など、諏訪と武田氏の関わりを示す文書が残る（長野県宝）。",s:"長野県立歴史館（展示資料一覧）"},
       {k:"伝承",t:"信玄が使ったと伝わる「諏訪法性兜」は、『本朝廿四孝』に登場する。",s:"長野県立歴史館（「歴史館たより」）"},
       {k:"史実",t:"1582年（天正10年）、武田氏は滅亡した。",s:"長野県立歴史館（「歴史館たより」）"}]},
{key:"hideyoshi1589",theme:"豊臣秀吉の願いと、伏見稲荷の楼門",per:"安土桃山時代",arr:"天下人・豊臣秀吉が、稲荷社に、母・大政所の病の回復を祈っているという。\nイナリ「天下人も、お母さんの病気の前では、一人の息子なんやな…。」\nテンジン「どんな偉い人でも、親を思う気持ちは、おんなじや。」\nミナカタ「病気が治りますように、いう願いは、昔も今も変わらへんな。」\nハチマン「…家族は、大切にしろ。」\nアマテ「ハチマン、そなたが言うと、重みがあるのう。」\nハチマン「…そうか。」\nテンジン「お母さんを思う願いや。まっすぐ、届けたいなあ。」\nイナリ「よっしゃ。秀吉さんの願い、神さんに、ちゃんと届けたろ。」\nミナカタ「ワシも、何か手伝えることないか、聞いてこよ。」\n境内では、職人たちが、何やら大きな建物の準備を始めていた。木材を運ぶかけ声が、にぎやかに響いている。",sp:[400, 3000, 700, 800, 1100, 1300],f:"inari",sc:"k15",era:"天正17年（1589年）",place:"伏見稲荷（京都府）",mk:"fushimi",best:"inari",bs:"お稲荷さんへの願いごとなら、俺の出番や！",
 intro:"1589年。天下人・豊臣秀吉の母、大政所が、病に倒れた。\n秀吉は、稲荷社に、母の回復を祈る。\n\nジンジャーマンは、秀吉の願いを届けることになった。",
 pol:"秀吉の願いに、どう関わる？",
 ch:[{l:"願文を届ける",sc:2,t:"秀吉は、母の病が治れば一万石を奉加する、と記した願文を納めた。\n「命乞いの願文」と呼ばれ、今も伏見稲荷大社に伝わる。"},
     {l:"楼門の建築を手伝う",sc:1,t:"秀吉の寄進で、楼門が造営された。\n神社の楼門としては、最も大きいものの一つだ。"},
     {l:"参道で、名物を食べ歩く",sc:0,t:"参道の店をのぞいているうちに、日が暮れてしまった。\n…肝心の願いごとは、仲間に任せきりだった。"}],
 res:"楼門は、伏見稲荷大社の正門として、今も参拝者を迎えている。昭和48年の解体修理で、願文と同じ天正17年の墨書が見つかり、伝えられてきた年代が確かめられた。",
 memo:[{k:"史実",t:"天正17年（1589年）、豊臣秀吉の寄進により、楼門が造営された。",s:"伏見稲荷大社（公式「沿革」）"},
       {k:"史実",t:"昭和48年の解体修理で、願文と同じ「天正17年」の墨書が見つかり、造営の伝承が確かめられた。",s:"伏見稲荷大社（公式「楼門」）"},
       {k:"史実",t:"母・大政所の病気平癒を祈り、かなえば一万石を奉加すると記した秀吉の「命乞いの願文」が伝わる。",s:"伏見稲荷大社（公式「楼門」）"}]},
{key:"dazaifu1591",theme:"太宰府天満宮の本殿づくり",per:"安土桃山時代",arr:"太宰府の天満宮では、新しい本殿の普請が進んでいた。木を削る音が、境内に響いている。\nテンジン「道真さんのお墓の上に建つ社や。…前に来た時とは、ずいぶん違うなあ。」\nイナリ「テンジン、うれしそうやな。」\nテンジン「そら、うれしいわ。あの曇り空の大宰府から、こんなににぎやかになって。」\n道真が亡くなってから、七百年近くがたっている。\nミナカタ「ええ匂いがするで。削りたての木の香りや。」\nアマテ「多くの人の手で、守られてきたのじゃな。」\nハチマン「…職人の腕がいい。良い社になる。」\nテンジンは、しばらく本殿の骨組みを見上げていた。その目は、少しだけ、うるんでいた。\nイナリ「…山の空気が、しみるんやな？」\nテンジン「せや。しみるんや。」",sp:[420, 3050, 760, 820, 1120, 1320],f:"tenjin",sc:"k16",era:"天正19年（1591年）",place:"太宰府（福岡県）",mk:"dazaifu",best:"tenjin",bs:"天神さんの本殿や。わしが見とくで。",
 intro:"戦国の世が、終わりに近づくころ。\n道真を祀る太宰府の天満宮では、新しい本殿づくりが進んでいた。\n\nジンジャーマンは、普請を見届けることになった。",
 pol:"太宰府で、何をする？",
 ch:[{l:"本殿の普請を手伝う",sc:2,t:"今の本殿は、小早川隆景が建てたもので、天正19年（1591年）に完成した。\n五間社流造の建物は、国の重要文化財に指定されている。"},
     {l:"飛梅を見に行く",sc:1,t:"本殿のすぐ横の御神木「飛梅」は、道真を慕って、京から一夜のうちに飛んできたと伝えられる。\n境内の梅の中で、毎年いちばん早く咲くという。"},
     {l:"参道の太鼓橋を渡る",sc:1,t:"参道の池には、太鼓橋がかかっている。\nこの太鼓橋は、のちに黒田長政が寄進したとされる。"}],
 res:"太宰府天満宮は、道真の墓所の上に建てられた社として、今も多くの人々の崇敬を集めている。",
 memo:[{k:"史実",t:"今の本殿は、小早川隆景が建て、天正19年（1591年）に完成した。五間社流造で、国の重要文化財。",s:"太宰府天満宮（公式「御由緒」）／太宰府市（公式）"},
       {k:"伝承",t:"御神木「飛梅」は、道真を慕って、京から一夜のうちに飛んできたと伝えられる。",s:"太宰府天満宮（公式）／太宰府市（公式）"},
       {k:"史実",t:"太宰府天満宮は、かつて安楽寺と一体で、「安楽寺天満宮」と呼ばれた。",s:"太宰府市（公式）"}]},
{key:"shichifuku",nw:1,theme:"七福神巡りと、一隻の宝船",per:"江戸時代",arr:"江戸の正月。隅田川のほとりの向島では、人々が、のんびりと道を歩いている。\nテンジン「七福神巡りや。正月に、七つの社寺をまわって、福を授かる。江戸の人らの、楽しみやったそうや。」\nイナリ「七人もおるんか。ワシら五人より、二人も多いやん。」\nアマテ「七柱の先輩方に、ご挨拶に伺うのじゃ。礼を欠いてはならぬぞ。」\nハチマン「…先輩戦隊、か。」\nミナカタ「ほな、行こか。人数では、負けとるけどな！」\n道の先から、宝船の絵を売る声が聞こえてきた。",sp:[900,4200,1300,1400,1500,1700],f:"tenjin",sc:"m17",era:"室町時代に顔ぶれが揃う",place:"隅田川・谷中（東京都）",mk:"tokyo",best:"tenjin",bs:"七人の先輩か。ええ勉強をさせてもらおか。",
 intro:"七福神は、恵比寿・大黒天・毘沙門天・弁財天・福禄寿・寿老人・布袋の七柱。出身は、日本・インド・中国と、それぞれ違う。その七柱が一隻の宝船に乗り合わせる姿は、江戸の人々に、長く親しまれた。\n\nジンジャーマンは、江戸の七福神巡りの道を歩き、「七人の先輩戦隊」に挨拶へ向かった。",
 pol:"七福神のお社をまわりながら、何を考える？",
 ch:[{l:"出身のちがう七柱を、順に知る",sc:2,t:"恵比寿は日本、大黒天・毘沙門天・弁財天はインド、福禄寿・寿老人・布袋は中国がもとだ。\n七柱は、出身も姿も、ばらばらだ。それでも、同じ宝船に、並んで乗っている。"},
     {l:"人数も出身もちがう先輩に、自分たちを重ねる",sc:1,t:"イナリ「ワシらも、祀られとる神社も、もとの神さんも、ばらばらやな。」\nミナカタ「それでも、一つのチームや。七福神さんは、何百年も、人に親しまれとる。ワシらも、ああなりたいな。」\n違いがあっても、一つの船に乗って、長く愛される。5人は、自分たちのこれからを、少し重ねてみた。"},
     {l:"宝船の絵を、枕の下に入れてみる",sc:1,t:"江戸の人々は、正月に宝船の絵を枕の下に入れて、よい初夢を願った。絵には、「なかきよの とおのねふりの みなめさめ なみのりふねの おとのよきかな」の歌が添えられた。\n上から読んでも、下から読んでも、同じ音になる。回文だ。"}],
