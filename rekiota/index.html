国・栃木県（芳賀郡茂木町）","細川家：細川興貫（―（読み未取得））","1万6200石","外様","1610年","茂木県","細川興元の入封により立藩（入封時は1万54石）。1616年に藩庁を常陸国谷田部へ移して谷田部藩となったが、1871年3月28日（明治4年2月8日）に藩庁を茂木へ戻して茂木藩となった（「下野国」記事）。谷田部藩と同一の藩の別名という理解もある旨、記事に明記されている。石高は茂木藩として再置された時点のもの","Wikipedia"]]}]},{"h":"【東山道】陸奥国（5藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["125","弘前藩","ひろさきはん","陸奥国（りくおう）・青森県（弘前市、弘前城）","津軽家：津軽承昭（つぐあきら）","10万石","外様","1590年","弘前県","通称は津軽藩。旧称は高岡藩・堀越藩。1869年の分割前は陸奥国（むつ）の一部。戊辰戦争後に1万石の加増を受けたとされる","Wikipedia"],["126","黒石藩","くろいしはん","陸奥国（りくおう）・青森県（黒石市、黒石陣屋）","津軽家：津軽承叙（つぐみち）","1万石","外様","1809年","黒石県","弘前藩の支藩。領地の分知は1656年で、藩としての成立は1809年。1869年の分割前は陸奥国（むつ）の一部。値はWikipedia「弘前藩」記事の黒石藩の節による（「黒石藩」単独記事は取得できなかった）","Wikipedia"],["127","八戸藩","はちのへはん","陸奥国（りくおう）・青森県（八戸市、八戸城）","南部家：南部信順（―（読み未取得））","2万石","外様","1664年（寛文4年）","八戸県","盛岡藩の分割により成立した独立の藩（領地の配分は1665年）。1869年の分割前は陸奥国（むつ）の一部","Wikipedia"],["128","七戸藩","しちのへはん","陸奥国（りくおう）・青森県（上北郡七戸町、七戸城）","南部家：南部信方（―（読み未取得））","1万石","外様","1819年（文政2年）","七戸県","別称は盛岡新田藩（盛岡藩の支藩）。1869年1月〜2月（明治元年12月）に1000石を削減され、1869年2月（明治2年正月）に信方へ改めて1万石が下賜された。1869年の分割前は陸奥国（むつ）の一部","Wikipedia"],["129","斗南藩","となみはん","陸奥国（りくおう）・青森県（むつ市、斗南陣屋）","会津松平家：松平容大（かたはる）","3万石","親藩","1869年","斗南県","1869〜1871年の新設藩。旧会津藩主家の家名再興として、1869年12月6日（明治2年11月4日）に旧盛岡藩領の北郡・二戸郡・三戸郡3万石の支配を命じられた。藩庁は当初、旧五戸代官所、のち田名部の円通寺。1869年の分割前は陸奥国（むつ）の一部","Wikipedia"]]}]},{"h":"【東山道】陸中国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["130","一関藩","いちのせきはん","陸中国・岩手県（一関市）","田村家：田村崇顕（たむら たかあき）","2万7000石","外様","1681年","一関県","仙台藩の内分分知による支藩。田村建顕（たむら たつあき）が岩沼から移封して立藩。伊達家の一関藩（1660年立藩・1671年改易）とは別の藩。石高はもと3万石で、明治2年（1869年）に3000石の削減の上で田村崇顕（田村家11代）の家督相続が許された（記事本文）","Wikipedia"]]}]},{"h":"【東山道】陸前国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["131","仙台藩","せんだいはん","陸前国・宮城県（仙台市、仙台城）","伊達家：伊達宗敦（―（読み未取得））","28万石","外様","1601年","仙台県","立藩は慶長6年（1601年）（記事の基礎情報欄）。石高はもと62万石で、戊辰戦争後に28万石へ減封され、その石高で廃藩置県を迎えた。14代・宗基が28万石で相続したが幼少のため、15代・宗敦が藩知事に就任して廃藩置県を迎えた（記事の基礎情報欄は最終藩主を宗敦とする）","Wikipedia"]]}]},{"h":"【東山道】岩代国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["132","二本松藩","にほんまつはん","岩代国・福島県（二本松市、二本松城）","丹羽家：丹羽長裕（―（読み未取得））","5万700石","外様","1627年","二本松県","松下重綱の入部により立藩。1643年から丹羽家（10万700石）。1868年に5万石を減らされた。最後の藩主は丹羽家11代","Wikipedia"]]}]},{"h":"【東山道】磐城国（6藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["133","棚倉藩","たなぐらはん","磐城国・福島県（東白川郡棚倉町、棚倉城）","阿部家：阿部正功（―（読み未取得））","6万石","譜代","1603年","棚倉県","立花宗茂の入部により立藩。藩主家は9家が入れ替わり、1866年から阿部家（10万石）。維新後に4万石減封され6万石となった。藩庁のある白河郡は分割後は磐城国であり、記事のリード文も「陸奥国（磐城国）」とするが、本ファイルでは岩代の節に収録した","Wikipedia"],["134","三春藩","みはるはん","磐城国・福島県（田村郡三春町、三春城）","秋田家：秋田映季（―（読み未取得））","5万石","外様","1627年","三春県","加藤明利が3万石で入って立藩。1644年から秋田家（5万5000石→分与により5万石）。最後の藩主は秋田家11代。記事は所在地を「磐城国田村郡」とするが、本ファイルでは岩代の節に収録した","Wikipedia"],["135","相馬中村藩","そうまなかむらはん","磐城国・福島県（相馬市、中村城）","相馬家：相馬誠胤（―（読み未取得））","6万石","外様（後に譜代並の扱い・帝鑑間詰）","1602年","中村県","相馬藩・中村藩とも呼ばれる。1602年にいったん改易されたが、同年に本領を安堵された。初代藩主を16代・義胤とするか17代・利胤とするかは諸説あり、記事は利胤を初代とする。1871年8月29日に中村県が成立した旨、記事に明記されている。最後の藩主は13代","Wikipedia"],["136","磐城平藩","いわきたいらはん","磐城国・福島県（いわき市、磐城平城）","安藤家：安藤信勇（―（読み未取得））","3万石","譜代","1602年","平県","単に平藩（たいらはん）とも呼ばれる。藩主家は鳥居家・内藤家・井上家を経て安藤家。石高は安藤家の代に5万石→2万石→3万石（1869年〜1871年）と変遷。最後の藩主は安藤家7代","Wikipedia"],["137","湯長谷藩","ゆながやはん","磐城国・福島県（いわき市、湯長谷陣屋）","内藤（遠山）家：内藤政憲（まさのり）","1万4000石","譜代","1670年","未確認（記事に記載なし）","磐城平藩の支藩。立藩時は湯本藩（ゆもとはん）で、1676年に湯長谷へ藩庁を移した。石高は1万石→1万2000石→1万5000石→1万4000石（1868年に1000石を召し上げられた）。最後の藩主は14代","Wikipedia"],["138","泉藩","いずみはん","磐城国・福島県（いわき市、泉陣屋）","本多家：本多忠伸（―（読み未取得））","1万8000石","譜代","1634年","未確認（記事に記載なし）","内藤政晴への分知により立藩。藩主家は内藤家・板倉家を経て本多家。本多家の石高は1万5000石→2万石→1万8000石（戊辰戦争後に2000石を召し上げられた）。最後の藩主は本多家7代","Wikipedia"]]}]},{"h":"【東山道】羽後国（6藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["139","久保田藩（秋田藩）","くぼたはん","羽後国・秋田県（秋田市、久保田城）","佐竹家：佐竹義堯（―（読み未取得））","20万5000石","外様","1602年","秋田県","秋田藩（あきたはん）とも呼ばれる。石高は寛文4年（1664年）に20万5800石と決定された（記事本文。基礎情報欄は20万5000石）。1871年3月3日（明治4年1月13日）に秋田藩へ改称した。最後の藩主は12代","Wikipedia"],["140","岩崎藩","いわさきはん","羽後国・秋田県（湯沢市岩崎、岩崎藩陣屋）","佐竹家（壱岐守家）：佐竹義理（―（読み未取得））","2万石","外様（久保田藩の支藩）","1701年","岩崎県","明治維新以前は久保田新田藩（くぼたしんでんはん、別名・秋田新田藩）。蔵米支給の支藩で特定の領地を持たなかったが、1869年6月に雄勝郡岩崎へ移転して所領を持ち、岩崎藩と改称した。陣屋が構えられたのは1871年4月。値はWikipedia「久保田藩」記事の岩崎藩の節による（「岩崎藩」は同記事へのリダイレクト）。最後の藩主は9代","Wikipedia"],["141","亀田藩","かめだはん","羽後国・秋田県（由利本荘市、亀田城）","岩城家：岩城隆彰（―（読み未取得））","1万8000石","外様","1623年","未確認（記事に記載なし）","石高は2万石→1万8000石（1868年に2000石減封）。最後の藩主は13代","Wikipedia"],["142","本荘藩","ほんじょうはん","羽後国・秋田県（由利本荘市、本荘城）","六郷家：六郷政鑑（ろくごう まさかね）","2万石","外様","1623年","未確認（記事に記載なし）","最後の藩主は11代","Wikipedia"],["143","矢島藩","やしまはん","羽後国・秋田県（由利本荘市、矢島陣屋）","生駒家：生駒親敬（―（読み未取得））","1万5200石","外様","1868年","矢島県","1640年に堪忍料1万石で矢島に置かれたが、分知の後は8000石の交代寄合となり、藩ではなかった。慶応4年（1868年）の戊辰戦争の功により1万5200石に高直しされて諸侯（大名）に復帰し、再び立藩した。記事によれば、厳密には矢島藩が存在したのは1640〜1658年と1868〜1871年である。賞典禄1000石は石高とは別に下賜された。最後の藩主は12代","Wikipedia"],["144","出羽松山藩（松嶺藩）","まつやまはん","羽後国・山形県（酒田市、松山城）","酒井家：酒井忠匡（さかい ただまさ）","2万2500石","譜代","1647年","松嶺県","庄内藩の支藩。立藩は正保4年12月11日（1648年1月5日（新暦））に酒井忠恒が庄内藩から2万石を分知されたことによる。石高は2万石→2万5000石→2万2500石（1868年に2500石を収回）。明治2年6月22日（1869年7月30日）に伊予松山藩との混同を避けて松嶺藩（まつみねはん）と改称した。藩庁の飽海郡は分割後は羽後国。県名（松嶺県）はWikipedia「庄内藩」記事による。最後の藩主は8代","Wikipedia"]]}]},{"h":"【東山道】羽前国（5藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["145","庄内藩（大泉藩）","しょうないはん","羽前国・山形県（鶴岡市、鶴ヶ岡城）","酒井家：酒井忠宝（―（読み未取得））","16万7071石余","譜代","1622年","大泉県","明治2年9月29日（1869年）に大泉藩（おおいずみはん）と改称した。石高は慶応元年（1865年）の加増後の領知高（記事の記載）。1868年12月に忠宝が12万石に減封されて会津藩・磐城平藩へ転封を繰り返し、明治3年（1870年）に庄内へ復帰した。復帰後の石高は記事に明記がなく未確認。最後の藩主は12代","Wikipedia"],["146","新庄藩","しんじょうはん","羽前国・山形県（新庄市、新庄城）","戸沢家：戸沢正実（―（読み未取得））","8万3200石","外様→願譜代","1622年","新庄県","石高は6万8200石に、明治2年（1869年）の加増1万5000石を加えたもの。最後の藩主は11代","Wikipedia"],["147","天童藩","てんどうはん","羽前国・山形県（天童市、天童陣屋）","織田家：織田信敏（―（読み未取得））","1万8000石","外様","1830年","天童県","前身は高畠藩で、天保元年（1830年）に天童へ移って立藩した。石高は2万石→1万8000石（1868年に2000石を没収）。最後の藩主は信敏（3代・5代）","Wikipedia"],["148","上山藩","かみのやまはん","羽前国・山形県（上山市、上山城）","松平（藤井）家：松平信安（―（読み未取得））","2万7000石","譜代","1622年","上山県","藩主家は松平（能見）家・蒲生家・土岐家・金森家を経て松平（藤井）家。石高は藤井松平家の3万石から、明治元年12月22日（1869年2月3日）の処分で2万7000石に減封された。最後の藩主は藤井松平家10代。なお記事は廃藩置県の日を「明治4年7月14日（1871年8月19日）」とするが、明治4年7月14日の新暦換算は1871年8月29日であり、記事内の換算に誤りがあるとみられる","Wikipedia"],["149","米沢藩","よねざわはん","羽前国・山形県（米沢市、米沢城）","上杉家：上杉茂憲（―（読み未取得））","14万7000石","外様","1601年","米沢県","慶長6年（1601年）8月に上杉景勝が米沢30万石へ減封されて成立した。石高は30万石→15万石→18万7000石→14万7000石（明治元年12月（1869年1月）に4万石減封）。明治2年（1869年）に支藩の米沢新田藩（1万石）を併合した。最後の藩主は13代","Wikipedia"]]}]},{"h":"【北陸道】若狭国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["150","小浜藩","おばまはん","若狭国・福井県（小浜市、小浜城）※領地は若狭一国のほか越前敦賀郡・近江高島郡の一部にも及んだ","酒井家：酒井忠経（さかい ただつね）※廃藩置県時の藩知事。版籍奉還時（1869年）の藩知事は酒井忠禄","10万3500石","譜代","1600年（慶長5年）","小浜県","藩主家は京極家（外様）を経て1634年に酒井忠勝が入って以後は酒井家。1870年10月11日（明治3年9月17日）に鞠山藩（旧敦賀藩）を合併し、旧鞠山藩主の酒井忠経が小浜藩知事となった。石高について、記事本文は酒井家の所領が10万3500石となったとするが、歴代藩主の見出しは「11万3000石→10万3000石」と記し、食い違いがある。忠経の読みは、講談社『デジタル版 日本人名大辞典+Plus』が「ただつね」とする一方、日外アソシエーツ『新訂 政治家人名事典 明治～昭和』は「タダツグ」とする（食い違い）","Wikipedia"]]}]},{"h":"【北陸道】越前国（5藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["151","福井藩","ふくいはん","越前国・福井県（福井市、福井城）","越前松平家：松平茂昭（まつだいら もちあき）","32万石","親藩","1601年（慶長6年）","福井県","旧称は北ノ庄藩（北ノ荘藩）。立藩時の石高は67万石（越前一国）で、分割・減封を経て、最終的には11代・治好の代に32万石となった","Wikipedia"],["152","越前勝山藩","えちぜんかつやまはん","越前国・福井県（勝山市、勝山城）","小笠原家：小笠原長守（おがさわら ながもり）","2万2000石","譜代","1691年（元禄4年）","勝山県","1623年に結城松平家で成立し、明石松平家を経て1644年にいったん廃藩（福井藩預かり、のち幕府領）となった後、1691年に小笠原貞信が美濃高須藩から入って再び立藩した。表の立藩年は小笠原家による再立藩の年","Wikipedia"],["153","大野藩","おおのはん","越前国・福井県（大野市、大野城）","土井家：土井利恒（どい としつね）","4万石","譜代","1624年（寛永元年）","大野県","藩主家は越前松平家の諸家（雲州松平家・結城松平家・明石松平家）を経て、1682年に土井利房が入って以後は土井家","Wikipedia"],["154","丸岡藩","まるおかはん","越前国・福井県（坂井市丸岡町、丸岡城）","有馬家：有馬道純（ありま みちずみ）","5万石","譜代","1624年（寛永元年）","丸岡県","本多家（譜代4万3000石）を経て1695年に有馬清純が越後糸魚川藩から入封した。有馬家は1711年（正徳元年）に外様から譜代格へ格上げされており、最終時点の家格は譜代。記事本文は廃藩を「明治4年（1871年）9月」と記す（廃藩置県の詔は7月14日であり、月は記事の表記のまま転記した）。道純の読みは、講談社『デジタル版 日本人名大辞典+Plus』が「みちずみ」とする一方、日外アソシエーツ『新訂 政治家人名事典 明治～昭和』は「ミチスミ」とする（食い違い）","Wikipedia"],["155","鯖江藩","さばえはん","越前国・福井県（鯖江市、鯖江陣屋）","間部家：間部詮道（まなべ あきみち）","4万石","譜代","1720年（享保5年）","鯖江県","別称は西鯖江藩。立藩時は5万石。1862年（文久2年）に7代藩主・間部詮勝が安政の大獄の責を問われて1万石を減封され、4万石となった","Wikipedia"]]}]},{"h":"【北陸道】加賀国（2藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["156","加賀藩","かがはん","加賀国・石川県（金沢市、金沢城）※領地は加賀・能登・越中の3国の大半と近江の飛び地に及んだ","前田家：前田慶寧（まえだ よしやす）","102万5000石","外様","1600年（慶長5年）","金沢県","1869〜1871年の改称藩。1869年（明治2年）の版籍奉還後に藩名を金沢藩と定めた。記事の基礎情報欄は立藩年を「慶長7年（1600年）」と記すが、慶長7年は1602年に当たる。歴代藩主表の前田利長の在職開始は「慶長5年（1600年）」であり、食い違いがあるため、本表は1600年（慶長5年）とした","Wikipedia"],["157","大聖寺藩","だいしょうじはん","加賀国・石川県（加賀市、大聖寺陣屋）","前田家：前田利鬯（まえだ としか）","10万石","外様","1639年（寛永16年）","大聖寺県","加賀藩の支藩。立藩時は7万石で、1821年（文政4年）に9代藩主・利之が高直しを行って10万石となった","Wikipedia"]]}]},{"h":"【北陸道】能登国（0藩）","lv":3,"text":["- 1871年8月29日時点で、能登国に藩庁を置いた藩はない。江戸時代を通じて、大部分は加賀藩領であり、一部は幕府領（能登天領、加賀藩預地）・旗本領だった（Wikipedia「能登国」、取得日：2026-11-18／種別：Wikipedia）。","- 元禄年間に能登下村藩・西谷藩が短期間置かれたが、いずれも転出して幕府領に戻っており、対象外である（同上）。"],"tables":[]},{"h":"【北陸道】越中国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["158","富山藩","とやまはん","越中国・富山県（富山市、富山城）","前田家：前田利同（まえだ としあつ）","10万石","外様","1639年（寛永16年）","富山県","加賀藩の支藩。国内の大半は加賀（金沢）藩領であり、越中国に藩庁を置いた藩は富山藩のみ","Wikipedia"]]}]},{"h":"【北陸道】越後国（10藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["159","高田藩","たかだはん","越後国・新潟県（上越市、高田城）","榊原家：榊原政敬（さかきばら まさたか）","15万石","譜代","1600年（慶長5年）","高田県","別称は福嶋藩。藩主家は堀家→長沢松平家→酒井家→福井松平家→越前松平宗家→稲葉家→戸田家→久松松平家と替わり（この間、1681〜1685年は幕府領）、榊原家が播磨姫路藩から移封されて以後は榊原家","Wikipedia"],["160","清崎藩","きよさきはん","越後国・新潟県（糸魚川市、清崎城跡）","清崎松平家：松平直静（まつだいら なおやす）","1万石","親藩","1691年（元禄4年）","清崎県","旧称は糸魚川藩。1869〜1871年の改称藩：藩庁を清崎城跡に移して清崎藩と改称した。改称の時期は、「糸魚川藩」記事と「越後国」記事が1869年（「越後国」記事は1869年8月1日（明治2年6月24日）の任知藩事にともなう改称とする）とする一方、「松平直静」記事は明治元年（1868年）の改称とする（食い違い）。清崎松平家の入封は1717年","Wikipedia"],["161","椎谷藩","しいやはん","越後国・新潟県（柏崎市椎谷、椎谷陣屋）","堀家：堀之美（ほり ゆきよし）","1万石","譜代","1698年（元禄11年）","椎谷県","藩祖の系統（堀直之）は1616年に越後で知行を得たが大名となったのは関東（上総）でのことであり、椎谷藩の正式な成立は1698年に第4代当主・堀直宥が越後国内で1万石を領して椎谷に居住したことによる","Wikipedia"],["162","与板藩","よいたはん","越後国・新潟県（長岡市与板、与板陣屋。のち与板城）","井伊家：井伊直安（いい なおやす）","2万石","譜代","1634年（寛永11年）","与板県","牧野家（長岡藩の支藩、1万石）として立藩し、幕府領を経て1705年（宝永2年）に井伊直矩が2万石で入封した。なお歴代藩主表の井伊家の期間表記は「1706年 - 1871年」であり、本文の1705年入封と1年ずれる","Wikipedia"],["163","新発田藩","しばたはん","越後国・新潟県（新発田市、新発田城）","溝口家：溝口直正（みぞぐち なおまさ）","10万石","外様","1598年（慶長3年）","新発田県","1598年に溝口秀勝が入封し、1600年の関ヶ原の戦いの戦功により本領を安堵されて成立した。石高は6万石→5万石（分知による）と変遷し、11代藩主・溝口直溥の代に10万石への高直しが認められた","Wikipedia"],["164","黒川藩","くろかわはん","越後国・新潟県（胎内市黒川、黒川陣屋）","柳沢家：柳沢光邦（やなぎさわ みつくに）","1万石","譜代","1724年（享保9年）","黒川県","柳沢吉保の四男・柳沢経隆が、兄・吉里の大和郡山藩への移封に際して1万石を与えられて立藩した（大和郡山藩の支藩格）","Wikipedia"],["165","三日市藩","みつかいちはん","越後国・新潟県（新発田市、三日市陣屋）","柳沢家：柳沢徳忠（やなぎさわ のりただ）","1万石","譜代","1724年（享保9年）","三日市県","甲府新田藩で1万石を領していた柳沢時睦（吉保の五男）が、兄・吉里の郡山移封に際して越後三日市に1万石を与えられて立藩した（大和郡山藩の支藩格）","Wikipedia"],["166","村松藩","むらまつはん","越後国・新潟県（五泉市村松、村松城）","堀家：堀直弘（ほり なおひろ）","3万石","外様","1639年（寛永16年）","村松県","1639年に堀直時が安田3万石を与えられたことに始まり、1644年5月に領地替えで陣屋を村松へ移して正式な村松藩となった。石高は「一説に4万石」ともされる。戊辰戦争で11代藩主・堀直賀が奥羽越列藩同盟側に立ったため、9代藩主・直央の末子である堀直弘が新藩主として擁立され、廃藩置県時の藩主は直弘である","Wikipedia"],["167","峰岡藩","みねおかはん","越後国・新潟県（新潟市西蒲区峰岡、三根山陣屋）","牧野家：牧野忠泰（まきの ただひろ）","1万1000石","譜代","1863年（文久3年）","峰岡県","旧称は三根山藩。1869〜1871年の改称藩：1870年11月22日（明治3年10月29日）に、丹後の峰山藩と紛らわしいため峰岡藩と改称した（「越後国」記事による）。起源は1634年に長岡藩から分知された旗本領（三根山領6000石）で、1863年に高直しにより1万1000石となって立藩した幕末の立藩である","Wikipedia"],["168","村上藩","むらかみはん","越後国・新潟県（村上市、村上城）","内藤家：内藤信美（ないとう のぶとみ）","5万石","譜代","1598年（慶長3年）","村上県","藩主家は村上家→堀家→本多家→結城松平家→榊原家→本多家→大河内松平家→間部家と替わり（この間、1642〜1644年は廃藩）、1720年に内藤家が入って以後は内藤家","Wikipedia"]]}]},{"h":"【北陸道】佐渡国（0藩）","lv":3,"text":["- 1871年8月29日時点で、佐渡国に藩庁を置いた藩はない。明治初年時点では全域が佐渡奉行が管轄する幕府領であり（羽茂郡のごく一部に寺社領）、1868年に佐渡県（第1次）が置かれた（Wikipedia「佐渡国」、取得日：2026-11-18／種別：Wikipedia）。","---"],"tables":[]},{"h":"【山陰道】丹波国（7藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["169","亀岡藩","かめおかはん","丹波国・京都府（亀岡市、亀山城）","松平（形原）家：松平信正（まつだいら のぶまさ）","5万石","譜代","1600年（慶長5年）","亀岡県","旧称は丹波亀山藩。1869年7月27日（明治2年6月19日）に、伊勢亀山藩との混同を避けるため亀岡藩と改称した（「丹波亀山藩」記事の併記による）。1602年に一時天領となり、1609年に再立藩。藩主家は前田家→岡部家→松平（大給）家→菅沼家→松平（藤井）家→久世家→井上家→青山家と替わり、1749年に松平信岑が入って以後は形原松平家","Wikipedia"],["170","園部藩","そのべはん","丹波国・京都府（南丹市、園部城）","小出家：小出英尚（こいで ふさなお）","2万4000石","外様","1619年（元和5年）","園部県","石高は2万9800石→2万5000石→2万4000石と変遷。園部県は明治4年8月（旧暦。新暦では1871年9月〜10月）に廃され、明治4年11月（旧暦。新暦では1871年12月〜1872年1月）に京都府に編入された（「園部藩」記事。記事の月は旧暦の月であり、新暦換算は月単位）","Wikipedia"],["171","綾部藩","あやべはん","丹波国・京都府（綾部市、綾部陣屋）","九鬼家：九鬼隆備（くき たかとも）","1万9500石","外様","1633年（寛永10年）","綾部県","石高は2万石→1万9500石（1661年の分知による）。藩庁所在地について、「綾部藩」記事は「現在の京都府綾部市青野町、または同本宮町」とし、確定していない書き方になっている（09章も注記）","Wikipedia"],["172","山家藩","やまがはん","丹波国・京都府（綾部市広瀬町、山家陣屋）","谷家：谷衛滋（たに もりしげ）※読みは23章による","1万石","外様","未確認","山家県","立藩の年は「山家藩」記事に明記がない。藩祖・谷衛友が丹波国山家に1万6000石を領したのは天正10年（1582年）頃で、関ヶ原の戦いの後に所領を安堵された（23章）。どちらを立藩とするかは資料に明記がなく未確認。石高は1万6000石→1万石（2代衛政の代の分知による）","Wikipedia"],["173","福知山藩","ふくちやまはん","丹波国・京都府（福知山市、福知山城）","朽木家：朽木為綱（くつき もりつな）","3万2000石","譜代","1600年（慶長5年）","福知山県","藩主家は有馬家→岡部家→稲葉家→松平（深溝）家と替わり、1669年に朽木稙昌が入って以後は朽木家13代","Wikipedia"],["174","篠山藩","ささやまはん","丹波国・兵庫県（丹波篠山市、篠山城）","青山家：青山忠敏（あおやま ただゆき）","6万石","譜代","1609年（慶長14年）","篠山県","前身は八上藩（1602年立藩）。1609年に松平康重が八上から篠山へ政庁を移して篠山藩となった。藩主家は松平（松井）家→松平（藤井）家→松平（形原）家と替わり、1748年以後は青山家。石高は青山家で5万石→6万石（1827年の1万石加増による）。なお「篠山藩」記事の歴代藩主表は康重の就封を「慶長14年（1608年）9月」と記し、元号と西暦が食い違う（9月は旧暦の月。27章も記録）","Wikipedia"],["175","柏原藩","かいばらはん","丹波国・兵庫県（丹波市柏原、柏原陣屋）","織田家：織田信親（おだ のぶちか）","2万石","外様","1598年（慶長3年）","柏原県","1650年に廃藩となり、所領は幕府領となった。1695年に織田信休が2万石で入部して再立藩し、藩主家は信包流から信雄流に替わった。立藩時の石高は3万6000石","Wikipedia"]]}]},{"h":"【山陰道】丹後国（3藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["176","宮津藩","みやづはん","丹後国・京都府（宮津市、宮津城）","松平（本庄）家：松平宗武（まつだいら むねたけ）","7万石","譜代","1600年（慶長5年）","宮津県","立藩時は京極高知が丹後一国12万3000石を領したため丹後藩とも呼ばれた。藩主家は京極家→永井家→阿部家→奥平家→青山家と替わり、1758年に松平資昌が入って以後は本庄松平家","Wikipedia"],["177","舞鶴藩","まいづるはん","丹後国・京都府（舞鶴市、田辺城（舞鶴城））","牧野家：牧野弼成（まきの すけしげ）","3万5000石","譜代","1622年（元和8年）","舞鶴県","旧称は丹後田辺藩。明治2年（1869年）の版籍奉還に際し、紀伊田辺藩と重複することから太政官の命により、田辺城の雅名であった舞鶴城から藩名をとって舞鶴藩と改称した。立藩時は京極家（外様、3万5000石→3万3000石）、1668年に牧野親成が入って以後は牧野家10代","Wikipedia"],["178","峰山藩","みねやまはん","丹後国・京都府（京丹後市峰山町、峰山陣屋）","京極家：京極高陳（きょうごく たかのぶ）","1万1100石","外様","1622年（元和8年）","峰山県","石高は1万3000石→1万1600石→1万1100石（相続時の分知による）。明治初年の表高は1万1144石とも記される（「峰山藩」記事）。外様大名ではあったが譜代大名並の待遇を受け、譜代格とみなされていたともされる（同記事の注釈）","Wikipedia"]]}]},{"h":"【山陰道】但馬国（3藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["179","出石藩","いずしはん","但馬国・兵庫県（豊岡市出石町、出石城）","仙石家：仙石政固（せんごく まさかた）","3万石","外様","1600年（慶長5年）","出石県","藩主家は小出家→松平（藤井）家と替わり、1706年に仙石政明が入って以後は仙石家。石高は仙石家で5万8000石→3万石（仙石騒動による減封）","Wikipedia"],["180","豊岡藩","とよおかはん","但馬国・兵庫県（豊岡市、豊岡城→豊岡陣屋）","京極家：京極高厚（きょうごく たかあつ）","1万5000石","外様","1600年（慶長5年）","豊岡県","立藩時は杉原家（2万石→2万5000石→1万石）。1653年の改易で一時幕府領となり、1668年に京極高盛が3万5000石で入封した。1726年の減封で1万5000石となった","Wikipedia"],["181","村岡藩","むらおかはん","但馬国・兵庫県（美方郡香美町、村岡陣屋）","山名家：山名義路（やまな よしみち）","1万1000石","―（未確認）","1868年（慶応4年）","村岡県","維新立藩。江戸時代を通じては交代寄合（旗本）の山名家の知行地（但馬国七美郡6700石）であった。1868年8月8日（慶応4年6月20日）に1万1000石への高直しと維新立藩が認められ、明治2年（1869年）に藩主に取り立てられて村岡藩が成立した（「山名義済」記事）。初代藩主は山名義済（やまな よしなり）で、1871年3月31日（明治4年2月11日）に義路が家督を継いで最後の藩主（知藩事）となった。家格は今回の出典範囲では明記を確認できず未確認","Wikipedia"]]}]},{"h":"【山陰道】因幡国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["182","鳥取藩","とっとりはん","因幡国・鳥取県（鳥取市、鳥取城）","池田家：池田慶徳（いけだ よしのり）","32万5000石","外様","1600年（慶長5年）","鳥取県","因幡国・伯耆国の2国を領有したが、藩庁は因幡国に置かれたため本表では因幡国に置く。石高は6万石→32万石→32万5000石と変遷。池田家は外様ながら准家門の家格を与えられ、松平姓と葵紋を許された（「鳥取藩」記事）。支藩の鹿奴藩・若桜藩（鳥取西館新田藩）は1869年に鳥取藩へ吸収・編入されており対象外（冒頭参照）","Wikipedia"]]}]},{"h":"【山陰道】伯耆国（0藩）","lv":3,"text":["1871年8月29日時点で藩庁を置いた藩はない（全域が鳥取藩領。冒頭参照）。"],"tables":[]},{"h":"【山陰道】出雲国（3藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["183","松江藩","まつえはん","出雲国・島根県（松江市、松江城）","松平（雲州）家：松平定安（まつだいら さだやす）","18万6000石","親藩","1600年（慶長5年）","松江県","立藩時は堀尾家（外様24万石）が出雲富田藩として立藩し、1611年に松江城へ移って松江藩となった。藩主家は堀尾家→京極家と替わり、1638年に松平直政が18万6000石で入って以後は雲州松平家。隠岐国は幕府領で、松江藩が預地として治めた","Wikipedia"],["184","広瀬藩","ひろせはん","出雲国・島根県（安来市広瀬、広瀬陣屋）","松平（広瀬）家：松平直巳（まつだいら なおおき）","3万石","―（記事に明記なし）","1666年（寛文6年）","広瀬県","松江藩の支藩。松江藩主・松平直政の次男・近栄が3万石を分与されて立藩した。石高は3万石→1万5000石→2万石→3万石と変遷。家格は「広瀬藩」記事に明記がなく未確認（藩主家は越前松平家の分家）","Wikipedia"],["185","母里藩","もりはん","出雲国・島根県（安来市伯太町、母里陣屋）","松平（母里）家：松平直哉（まつだいら なおとも／なおとし）","1万石","―（記事に明記なし）","1666年（寛文6年）","母里県","松江藩の支藩。江戸時代中期までは神戸藩（かんべはん）と呼ばれた。立藩は寛文6年4月29日（1666年。旧暦）、松江藩主・松平直政の三男・隆政が1万石を分与されたことによる。直哉の読みは「松平直哉」記事が出典により「なおとも」と「なおとし」を併記する（食い違い）。家格は「母里藩」記事に明記がなく未確認（藩主は越前松平家分家と記される）","Wikipedia"]]}]},{"h":"【山陰道】石見国（0藩）","lv":3,"text":["1871年8月29日時点で藩庁を置いた藩はない（浜田藩は1866年に浜田を失い美作国鶴田藩となり、津和野藩は1871年8月11日に廃藩となっていた。冒頭参照）。"],"tables":[]},{"h":"【山陰道】隠岐国（0藩）","lv":3,"text":["藩は置かれなかった（全域が幕府領・松江藩預地。冒頭参照）。","---"],"tables":[]},{"h":"【山陽道】播磨国（10藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["186","姫路藩","ひめじはん","播磨国・兵庫県（姫路市、姫路城）","酒井家：酒井忠邦（―（読み未取得））","15万石","譜代","1600年（慶長5年）","姫路県","藩主家は外様の池田家（52万石）に始まり、本多家・奥平松平家・結城松平家・榊原家等を経て、1749年（寛延2年）から酒井家。石高は52万石→15万石と変遷","Wikipedia"],["187","明石藩","あかしはん","播磨国・兵庫県（明石市、明石城）","松平（明石松平）家：松平直致（―（読み未取得））","8万石（10万石格）","親藩","1617年（元和3年）","明石県","藩主家は小笠原家（10万石）→戸田松平家→大久保家→藤井松平家→本多家→明石松平家と変遷","Wikipedia"],["188","赤穂藩","あこうはん","播磨国・兵庫県（赤穂市、赤穂城）","森家：森忠儀（もり ただよし）","2万石","外様","1615年（元和元年）","赤穂県","藩主家は池田家→浅野家→永井家→森家と変遷。池田家・浅野家・永井家の石高は記事内部で食い違う（27章に記録済み）","Wikipedia"],["189","龍野藩","たつのはん","播磨国・兵庫県（たつの市、龍野城）","脇坂家：脇坂安斐（―（読み未取得））","5万1000石","譜代格（外様から願譜代）","1617年（元和3年）","龍野県","藩主家は本多家→小笠原家→岡部家→京極家→脇坂家と変遷（幕府領の期間を含む）。脇坂家の石高は5万3000石→5万1000石。家格は出典により「譜代格」「外様」と表記が分かれる","Wikipedia・その他"],["190","小野藩","おのはん","播磨国・兵庫県（小野市、小野陣屋）","一柳家：一柳末徳（―（読み未取得））","1万石","外様","1636年（寛永13年）","小野県","1636年に伊予川之江藩として立藩し、1642年（寛永19年）に播磨小野へ移って小野藩1万石が成立した。Wikipedia「藩の一覧」は立藩を1637年とし、記事間で食い違いがある（27章に記録済み）","Wikipedia"],["191","三草藩","みくさはん","播磨国・兵庫県（加東市、三草陣屋）","丹羽家：丹羽氏中（―（読み未取得））","1万石","譜代","1746年（延享3年）","三草県","丹羽薫氏が越後高柳藩から入封して立藩","Wikipedia・その他"],["192","安志藩","あんじはん","播磨国・兵庫県（姫路市安富町安志、安志陣屋）","小笠原家：小笠原貞孚（おがさわら さだざね）","1万石","譜代","1716年（享保元年）","安志県","中津藩主・小笠原長邕の無嗣改易に際し、弟の長興が安志に1万石で立藩を認められた","Wikipedia"],["193","山崎藩","やまさきはん","播磨国・兵庫県（宍粟市山崎町、山崎陣屋）","本多家：本多忠明（―（読み未取得））","1万石","譜代","1615年（慶長20年）","山崎県","別名・宍粟藩（しそうはん）。藩主家は池田家（外様）→松平（松井）家→池田家→本多家（1679年〜）と変遷し、改易・幕府領の期間を含む。最後の藩主について、幕末歴史ガイド（その他）は8代・本多忠鄰とするが、Wikipedia「山崎藩」の歴代藩主表は9代・本多忠明を最後とする（食い違い。本表はWikipedia・27章に従い忠明とした）","Wikipedia"],["194","林田藩","はやしだはん","播磨国・兵庫県（姫路市、林田陣屋）","建部家：建部政世（―（読み未取得））","1万石（表高）","外様","1617年（元和3年）","林田県","建部政長の入封以来、建部家が続いた","Wikipedia・その他"],["195","三日月藩","みかづきはん","播磨国・兵庫県（佐用郡佐用町、三日月陣屋）","森家：森俊滋（もり とししげ）","1万5000石","外様","1697年（元禄10年）","三日月県","別名・乃井野藩（のいのはん）。森長俊の入封により立藩","Wikipedia"]]}]},{"h":"【山陽道】美作国（3藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["196","津山藩","つやまはん","美作国・岡山県（津山市、津山城）","松平（津山松平）家：松平慶倫（まつだいら よしとも）","10万石","親藩","1603年（慶長8年）","津山県","藩主家は森家（外様、18万6500石）→津山松平家と変遷","Wikipedia"],["197","真島藩","ましまはん","美作国・岡山県（真庭市勝山、勝山城）","三浦家：三浦顕次（―（読み未取得））","2万3000石","譜代","1764年（明和元年）","真島県","旧称は勝山藩（当初は高田藩とも称された）。三河西尾藩より三浦家が転封。1869年（明治2年）に真島藩と改称したため、最後の名前で記載した","Wikipedia"],["198","鶴田藩","たずたはん","美作国・岡山県（津山市、鶴田陣屋）","松平家：松平武聰（―（読み未取得））","未確認（経緯は備考）","未確認","1867年（慶応3年）","鶴田県","移転藩。石見浜田藩が長州戦争で浜田を失い、美作の飛地へ移転して立藩した。従来所領8000石＋新領2万石＝2万8000石で立藩し、1868年（慶応4年）に朝廷から2万石の加増、1869年（明治2年）に蔵米と合わせて旧浜田藩の知行高6万1000石を回復したと記事は記すが、最終の表高の確定値は記事に明記がない","Wikipedia"]]}]},{"h":"【山陽道】備前国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["199","岡山藩","おかやまはん","備前国・岡山県（岡山市北区、岡山城）","池田家：池田章政（―（読み未取得））","31万5000石","外様","1603年（慶長8年）","岡山県","小早川家時代（1600〜1602年）があり、1603年に池田忠継が入封した。廃藩置県では藩領がそのまま岡山県となった（Wikipedia「備前国」）","Wikipedia"]]}]},{"h":"【山陽道】備中国（9藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["200","新見藩","にいみはん","備中国・岡山県（新見市、新見陣屋）","関家：関長克／関博直（いずれも読み未取得）","1万8000石","外様","1697年（元禄10年）","新見県","美作宮川藩より関長治が移封して立藩。歴代藩主表は9代・関長克までを載せ、本文は長克の後に女系の縁者・博直が婿養子として家督を継いだと記す。廃藩時点の藩主が長克か博直かは記事からは確定できない（未確認）","Wikipedia"],["201","高梁藩","たかはしはん","備中国・岡山県（高梁市、松山城）","板倉家：板倉勝弼（―（読み未取得））","2万石","譜代","1617年（元和3年）","高梁県","旧称は備中松山藩。1869年（明治2年）に高梁藩へ改称したため、最後の名前で記載した。藩主家は池田家→水谷家→安藤家→石川家→板倉家と変遷。石高は1869年に5万石から2万石へ減封された","Wikipedia"],["202","成羽藩","なりわはん","備中国・岡山県（高梁市成羽町、成羽陣屋）","山崎家：山崎治敏（やまざき はるとし）","1万2746石","外様","1868年8月8日（慶応4年6月20日）","成羽県","維新立藩。江戸時代の大半は交代寄合・表向御礼衆（旗本）の山崎氏の領地だった。1617〜1642年にも山崎家・水谷家の藩として存在した時期がある","Wikipedia"],["203","浅尾藩","あさおはん","備中国・岡山県（総社市門田、浅尾陣屋）","蒔田家：蒔田広孝（―（読み未取得））","1万石","譜代","1863年（文久3年）","浅尾県","江戸初期の1603〜1636年にも外様大名として1万石を領した時期があり、その後は旗本となった。1863年に高直しで大名に復帰し、再び立藩した","Wikipedia"],["204","足守藩","あしもりはん","備中国・岡山県（岡山市北区足守、足守陣屋）","木下家：木下利恭（きのした としゆき）","2万5000石","外様","1601年（慶長6年）","足守県","木下家定の入封により立藩。1609年に改易され、1610年に浅野長晟が入り、1615年に木下利房が再封された","Wikipedia"],["205","岡田藩","おかだはん","備中国・岡山県（倉敷市真備町岡田、岡田陣屋）","伊東家：伊東長𫡰（いとう ながとし）","1万343石","外様","1615年（元和元年）","岡田県","元禄年間に川辺に陣屋を置いたことから川辺藩とも呼ばれる。なおWikipedia「備中国」の廃藩置県の行には岡田県が列挙されておらず、記事間の不整合がある","Wikipedia"],["206","庭瀬藩","にわせはん","備中国・岡山県（岡山市北区庭瀬、庭瀬陣屋）","板倉家：板倉勝弘（―（読み未取得））","2万石","譜代","1600年（慶長5年）","庭瀬県","藩主家は戸川家→久世家→藤井松平家→板倉家と変遷","Wikipedia"],["207","生坂藩","いくさかはん","備中国・岡山県（倉敷市生坂、生坂陣屋）","池田家：池田政礼（―（読み未取得））","1万5000石","外様","1870年（明治3年）","生坂県","1869〜1871年の新設扱い。前身は岡山新田藩（1672年に岡山藩の内分分知として成立。領知朱印状は発行されず、藩主は岡山城下に居住した）。1870年（明治3年）に正式に藩として認められ、生坂藩と称した（記事はその日を明治3年1月12日とする。旧暦であり、新暦への換算は記事に明記がない）","Wikipedia"],["208","鴨方藩","かもがたはん","備中国・岡山県（浅口市鴨方町鴨方、鴨方陣屋）","池田家：池田政保（―（読み未取得））","2万5000石","外様","1868年（明治元年）","鴨方県","前身は岡山新田藩（1672年立藩）。1868年に鴨方陣屋を藩庁として鴨方藩と称した。改称の時期について、Wikipedia「備中国」は1869年8月2日（明治2年6月25日）とする（食い違い）","Wikipedia"]]}]},{"h":"【山陽道】備後国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["209","福山藩","ふくやまはん","備後国・広島県（福山市、福山城）","阿部家：阿部正桓（あべ まさたけ）","11万石","譜代","1619年（元和5年）","福山県","藩主家は水野家→幕府領→奥平松平家→阿部家と変遷。石高は10万石で、1852年（嘉永5年）に阿部正弘の功により1万石が加増され11万石となった（Wikipedia「備後福山藩」の冒頭の記述）。藩主の読みはコトバンク『日本大百科全書（ニッポニカ）』による","Wikipedia・その他（辞典）"]]}]},{"h":"【山陽道】安芸国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["210","広島藩","ひろしまはん","安芸国・広島県（広島市中区基町、広島城）","浅野家：浅野長勲（―（読み未取得））","42万6000石","外様","1600年（慶長5年）","広島県","福島正則の入封に始まる。領地は安芸国一円と備後国8郡。広島新田藩は1870年1月27日（明治2年12月26日）に広島藩へ編入され消滅したため対象外（冒頭参照）","Wikipedia"]]}]},{"h":"【山陽道】周防国（2藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["211","山口藩","やまぐちはん","周防国・山口県（山口市、山口城（山口政事堂））","毛利家：毛利元徳（―（読み未取得））","36万9000石","外様","1600年（慶長5年）","山口県","通称は長州藩（ちょうしゅうはん）。版籍奉還後の名が山口藩であり、府藩県三治制下では山口藩と称したため、最後の名前で記載した。藩庁は長く長門国萩（萩城）に置かれ、1863年（文久3年）に周防国山口へ移った。表高は36万9411石3斗1升5合とも記される。記事の基礎情報欄は立藩年を「慶長7年（1600年）」と記すが、慶長7年は1602年であり元号と西暦が合わない（本表は1600年＝慶長5年とした）","Wikipedia"],["212","岩国藩","いわくにはん","周防国・山口県（岩国市、岩国陣屋）","吉川家：吉川経健（―（読み未取得））","6万石","外様","1868年（慶応4年）","岩国県","江戸時代を通じては岩国領（長州藩毛利家の陪臣領）とされ、幕府からは3万石の外様大名格として扱われた。慶応4年3月13日（旧暦）に新政府が独立した藩として認め、正式に立藩した（新暦への換算は記事に明記がなく未確認）","Wikipedia"]]}]},{"h":"【山陽道】長門国（2藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["213","豊浦藩","とよらはん","長門国・山口県（下関市長府、長府陣屋）","毛利家：毛利元敏（もうり もととし）","5万石（公称）","外様","1600年（慶長5年）","豊浦県","旧称は長府藩（ちょうふはん）、府中藩ともいう。1869年（明治2年）に豊浦藩へ改称したため、最後の名前で記載した（改称の日は、Wikipedia「長門国」が1869年9月12日（明治2年8月7日）とする）。石高は幕府朱印状によらないため公称高はなかったが、1783年（天明3年）に幕府が公称5万石の城主格とした。幕末期の実高は12万7000余石に達したとも記される（以上、コトバンク『日本大百科全書（ニッポニカ）』「豊浦藩」）。藩名の読みは同辞典の見出しによる。最後の藩主とその読みは下関市公式サイトでも確認できる","その他（辞典）・自治体"],["214","清末藩","きよすえはん","長門国・山口県（下関市清末、清末陣屋）","毛利家：毛利元純（もうり もとずみ）","1万石","外様","1653年（承応2年）","清末県","長府藩の支藩。1653年に長府藩主・毛利秀元の次男元知が1万石を分与されて立藩した（コトバンク『日本大百科全書（ニッポニカ）』「豊浦藩」）。1718年（享保3年）に藩主が長府藩を継いで一時断絶し、1729年（享保14年）に再興された。最後の藩主とその読みは下関市公式サイト（市報しものせきの年表）による","その他（辞典）・自治体"]]}]},{"h":"【南海道】紀伊国（3藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["215","紀州藩","きしゅうはん","紀伊国・和歌山県（和歌山市、和歌山城）","紀州徳川家：徳川茂承（とくがわ もちつぐ）※第14代","55万5千石（附家老領を含む）","親藩（御三家）","1600年（慶長5年）","和歌山県","明治政府により和歌山藩と改称された。初代は浅野幸長（1600年入部）で、1619年に徳川頼宣が入部して紀州徳川家となった。浅野家時代は37万6千石（外様）。支藩の伊予西条藩は伊予国に藩庁を置くため伊予国の節に記した","Wikipedia"],["216","紀伊田辺藩","きいたなべはん","紀伊国・和歌山県（田辺市、田辺城）","安藤家：安藤直裕（あんどう なおひろ）※第16代（後に再勤）","3万8千石","譜代","1868年（慶応4年）","田辺県","維新立藩。江戸時代を通じては紀州藩の御附家老（安藤帯刀家）の所領で、独立した藩としては扱われなかった。慶応4年（1868年）正月に明治政府によって独立藩と認められた。所領そのものは1619年に安藤直次が与えられたもの","Wikipedia"],["217","紀伊新宮藩","きいしんぐうはん","紀伊国・和歌山県（新宮市、新宮城）","水野家：水野忠幹（みずの ただもと）※水野家第10代で、藩としては初代","3万5千石（幕府公認）","譜代","1868年（慶応4年）","新宮県","維新立藩。江戸時代は紀州藩の御附家老・水野家の新宮領で、陪臣のため藩とは扱われず、明治維新後に正式な藩として認められた。水野重央の入部は本文では元和7年（1621年）、歴代藩主表では元和5年（1619年）からとされ、記事内部に食い違いがある（下記「章との食い違い」参照）。浅野家時代の新宮領は2万8千石","Wikipedia"]]}]},{"h":"【南海道】淡路国（0藩）","lv":3,"text":["- 該当する藩はない。淡路国は徳島藩領で、藩庁は置かれず、筆頭家老の稲田家が洲本城代として統治した。廃藩置県により淡路は徳島藩から置かれた県の管轄となり、1871年12月26日（明治4年11月15日）の第1次府県統合で名東県に編入され、1876年8月21日に兵庫県へ移管された（27_兵庫県.md の転記による）。"],"tables":[]},{"h":"【南海道】阿波国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["218","徳島藩","とくしまはん","阿波国・徳島県（徳島市、徳島城）。淡路国も領有","蜂須賀家：蜂須賀茂韶（はちすか もちあき）※第14代","25万7千石","外様","1600年（慶長5年）","徳島県（第1次）","藩祖の蜂須賀家政の入部は1585年で、記事は関ヶ原の戦い後に至鎮へ旧領が安堵されたことをもって実質的な成立とする。入部当初は17万5千石で、大坂の陣後に淡路国が加増され25万7千石となった。淡路の統治は洲本城代（稲田家）が担った。徳島県は第1次府県統合で名東県となった","Wikipedia"]]}]},{"h":"【南海道】讃岐国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["219","高松藩","たかまつはん","讃岐国・香川県（高松市、高松城）","高松松平家：松平頼聰（まつだいら よりとし）※第11代","12万石","親藩・御連枝","1642年（寛永19年）","高松県","水戸徳川家の分家（御連枝）。先行して生駒家が讃岐一国17万3千石を領した時代（1587〜1640年）があり、1640年の改易と分割統治を経て、1642年に松平頼重が12万石で入封した","Wikipedia"]]}]},{"h":"【南海道】伊予国（8藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["220","伊予松山藩","いよまつやまはん","伊予国・愛媛県（松山市、松山城）","久松松平家：松平勝成（まつだいら かつしげ）※第13代・第15代（再勤）","15万石","親藩・御家門","1603年（慶長8年）","松山県","加藤嘉明が1603年に入部して20万石で立藩した（記事の行政変遷表は1600年〜1871年とする）。藩主家は加藤家（〜1627年）→蒲生家（1627〜1634年）→久松松平家（1635年〜）。第14代定昭の後、1868年に勝成が再勤し、明治政府の命で松平姓から旧姓の久松へ復姓した。支藩の松山新田藩は1765年に消滅（対象外）","Wikipedia"],["221","今治藩","いまばりはん","伊予国・愛媛県（今治市、今治城）","松平〔久松〕家：松平定法（まつだいら さだのり）※第10代","3万5千石","譜代","1600年（慶長5年）","今治県","藤堂高虎が20万石で立藩し、1608年に津藩へ転出した後は養子の高吉が越智郡2万石を領した。1635年に松平定房が3万石で入部し、以後は久松松平家。石高は3万石→4万石→3万5千石と変遷。1868年に松平氏を返上して久松氏に復姓した","Wikipedia"],["222","西条藩","さいじょうはん","伊予国・愛媛県（西条市、西条陣屋）","西条松平家：松平頼英（まつだいら よりひで）※松平家第10代","3万石","親藩・御連枝","1636年（寛永13年）","西条県","紀州藩（和歌山藩）の支藩。一柳家（外様、1636〜1665年）が改易された後、天領を経て1670年に松平頼純が3万石で入封した。藩庁は城ではなく陣屋で、藩主は江戸に定府した。なお「3万石（合力米2万石と併せ5万石）」とする資料もある","Wikipedia"],["223","小松藩","こまつはん","伊予国・愛媛県（西条市小松町、小松陣屋）","一柳家：一柳頼明（ひとつやなぎ よりあきら）※第9代","1万石","外様","1636年（寛永13年）","小松県","一柳直盛の遺領の分割により三男の直頼が1万石を分与されて立藩し、以後一柳家が9代続いた","Wikipedia"],["224","大洲藩","おおずはん","伊予国・愛媛県（大洲市、大洲城）","加藤家：加藤泰秋（かとう やすあき）※第13代","6万石","外様","1608年（慶長13年）","大洲県","脇坂安治が5万3千石で入部して立藩し、1617年に脇坂家が転封、加藤貞泰が6万石で入部して以後は加藤家","Wikipedia"],["225","新谷藩","にいやはん","伊予国・愛媛県（大洲市、新谷陣屋）","加藤家：加藤泰令（かとう やすのり）※第9代","1万石","外様","1623年（元和9年）","新谷県","大洲藩の支藩。大洲藩主・加藤泰興の弟の直泰が1万石分知の内諾を得て成立した。藩内分知は本来は陪臣の扱いだが、記事は、新谷藩は幕府より大名と認められた全国唯一の例とする。陣屋の完成は1642年。幕末の実高は9,693石と表高を割り込んでいたとされる","Wikipedia"],["226","宇和島藩","うわじまはん","伊予国・愛媛県（宇和島市、宇和島城）","伊達家：伊達宗徳（だて むねえ）※第9代","10万石","外様","1615年（慶長20年）","宇和島県","立藩の年に両説がある。「宇和島藩」記事は、富田信高が1608年に入部したことをもって立藩とする一方、伊達秀宗の入部（1615年）をもって正式な成立とする説も併記する。本表は伊達家の藩としての成立年として1615年を採った。1657年の伊予吉田藩分知で7万石となり、1696年の高直しで10万石格に復した","Wikipedia"],["227","伊予吉田藩","いよよしだはん","伊予国・愛媛県（宇和島市吉田町、伊予吉田陣屋）","伊達家：伊達宗敬（だて むねたか）※第9代","3万石","外様","1657年（明暦3年）","吉田県","宇和島藩の支藩。宇和島藩主・伊達秀宗の五男の宗純が3万石を分知されて立藩した（三河国の吉田藩と区別して伊予吉田藩と呼ばれる）。分知の経緯には諸説があるとされる","Wikipedia"]]}]},{"h":"【南海道】土佐国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["228","土佐藩（高知藩）","とさはん（こうちはん）","土佐国・高知県（高知市、高知城）","山内家：山内豊範（やまうち とよのり）※第16代","20万2600石","外様","1601年（慶長6年）","高知県","明治初年の正式名称は高知藩。土佐国一円を領し、一貫して山内家が支配した。支藩の土佐新田藩（高知新田藩）は1870年に高知藩へ編入され消滅（対象外）、中村藩も江戸時代初期に廃藩（対象外）","Wikipedia"]]}]},{"h":"【西海道】筑前国（2藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["229","福岡藩","ふくおかはん","筑前国・福岡県（福岡市、福岡城）","黒田家：黒田長知（くろだ ながとも、第12代）","47万3000石（表高。当初52万3000石）","外様（国主）","1600年（慶長5年）","福岡県","石高は分知により43万3000石となり、直方藩領の還付で47万3000石となって、廃藩置県までこの表高であった（記事による）。最後の藩主・黒田長知は1871年8月17日（明治4年7月2日）、太政官札贋造事件の責任により知藩事を罷免され、後任の知藩事には有栖川宮熾仁親王が就いた（廃藩置県まで12日間）","Wikipedia"],["230","秋月藩","あきづきはん","筑前国・福岡県（朝倉市秋月、秋月陣屋）","黒田家：黒田長徳（くろだ ながのり、第12代）","5万石","外様","1623年（元和9年）","秋月県","福岡藩の支藩","Wikipedia"]]}]},{"h":"【西海道】筑後国（3藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地
