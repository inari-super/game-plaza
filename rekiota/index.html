,"豊岡藩","とよおかはん","1600年〜1871年（1653年〜1668年は幕府領）","杉原長房（―）","京極高厚（―）","杉原家2万石→2万5000石→1万石→京極家3万5000石→1万5000石","豊岡城、のち豊岡陣屋","Wikipedia"],["23","村岡藩","むらおかはん","1868年立藩（維新立藩）〜1871年","山名義済（―）","山名義路（―）","交代寄合として6700石→1万1000石（1868年の高直しで立藩）","村岡陣屋","Wikipedia"],["24","八木藩","やぎはん","1585年入封〜1628年改易※豊臣政権下の別所氏の領国を「藩」と捉えた呼称（記事の記載）","別所重宗（しげむね）","別所吉治（よしはる）","1万5000石→2万石","八木城","Wikipedia"],["25","竹田藩","―（記事に読みなし）","未確認（Wikipedia「竹田藩」の記事は藩庁が竹田城である旨のみで、藩主・石高・期間の記載がない）","未確認","未確認","未確認","竹田城","Wikipedia"]]}]},{"h":"淡路国","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["26","淡路洲本藩（洲本藩）","すもとはん","脇坂安治の入封により立藩（立藩年は記事に明記なし）〜1609年／1613年再立藩（由良成山藩）〜1615年廃藩","脇坂安治（―）","池田忠雄（―）","脇坂家3万石（池田忠雄の石高は記事に記載なし）","洲本城、由良城（由良成山城）","Wikipedia"]]}]},{"h":"淡路の項（徳島藩の支配と洲本城代）","lv":3,"text":["出典：Wikipedia「淡路洲本藩」 https://ja.wikipedia.org/wiki/淡路洲本藩 ／ Wikipedia「徳島藩」 https://ja.wikipedia.org/wiki/徳島藩 （いずれも取得日：2026-11-18）【Wikipedia】","- 淡路国に藩があった時期は限られる。脇坂安治が3万石で入って淡路洲本藩が立藩したが、慶長14年（1609年）に安治は伊予大洲藩に移され、淡路は藤堂高虎の属領となり、その翌年に姫路藩主・池田輝政に淡路一国が加増され姫路藩の属領となった。慶長18年（1613年）に輝政の三男・忠雄に分与されて洲本藩が再立藩し、忠雄が由良成山城を築いて藩庁を移したため由良成山藩と名称が変わった。元和元年（1615年）、忠雄が岡山藩に移ったため由良成山藩は廃藩となった（「淡路洲本藩」）。","- その後、淡路は大坂の陣で軍功を挙げた蜂須賀至鎮の阿波藩（明治以降に徳島藩と改称）領となり、洲本に阿波藩が派遣した城代・稲田家が置かれたため、由良成山城は廃城となった（「淡路洲本藩」）。江戸時代の大半、淡路国に独立した藩はなく、徳島藩領であった。","- 徳島藩側の記載では、大坂の陣により蜂須賀家は岩屋周辺を除く淡路国7万石を与えられ、元和3年（1617年）に岩屋周辺も加増され、阿波・淡路の2国・25万7000石を領した（「徳島藩」）。","- 洲本城代の稲田氏は徳島藩の筆頭家老で、「淡路洲本領1万4000石・重臣」「脇城代・洲本城代」と記載されている。稲田家の歴代は植元―示植―植次―植栄＝植幹―植治＝植政―植久―植晟＝植樹―敏植―植封＝芸植―植乗＝植誠＝邦植（「徳島藩」の家老の項）。","- 幕末の徳島藩領として淡路国一円（津名郡124村・三原郡134村）が挙げられている。明治4年（1871年）5月、家老稲田氏の知行地のうち津名郡43か村浦が兵庫県に編入された。1871年8月29日（明治4年7月14日）の廃藩置県ののち、同年12月26日（11月15日）に淡路島全域は名東県に編入され、1876年8月21日の第2次府県統合で名東県より淡路島全域が兵庫県に移管された（「徳島藩」の幕末の領地の項）。"],"tables":[]},{"h":"幕府領・代官所・飛地・旗本領の項","lv":3,"text":["出典：Wikipedia「生野奉行」 https://ja.wikipedia.org/wiki/生野奉行 ほか各藩記事（取得日：2026-11-18）【Wikipedia】","代官所","幕府領の期間があった藩領","飛地（幕末の領地に他国・他郡の領地が記載されているもの）","旗本領・交代寄合（藩に準じる扱いのもの）"],"tables":[{"cols":["名称","読み","内容（出典の記載どおり）","出典の種別"],"rows":[["生野奉行／生野代官","いくのぶぎょう／いくのだいかん","織田信長、豊臣秀吉および江戸幕府により置かれ、生野銀山を管理した。1716年（享保元年）、生野銀山の産出量減少のため生野代官に組織変更された。奉行所・代官所は現在の兵庫県朝来市生野町口銀谷の生野小学校付近にあった。慶長3年（1598年）に初代生野奉行として間宮直元が就任。江戸時代の生野奉行は11代、代官に改組後は28人が勤めた。代官には旗本が任命され、生野銀山の後背地となっていた但馬国、播磨国、美作国の天領も統治した。統治規模は江戸時代初期は5万2000石、江戸時代末期には8万2000石に達していた","Wikipedia"]]},{"cols":["対象","期間","出典"],"rows":[["龍野藩領","1632年〜1633年、1636年〜1637年、1658年〜1672年（藩主不在の間は幕府領）","Wikipedia「龍野藩」"],["豊岡藩領","1653年〜1668年（杉原家改易後、京極高盛の転封まで一時幕府領）","Wikipedia「豊岡藩」"],["柏原藩領","1650年〜1695年（柏原藩廃藩後、その所領は幕府領となった）","Wikipedia「柏原藩」"],["山崎藩領","1649年（松平康映の転封後、いったん公儀御料となった）","Wikipedia「山崎藩」"],["清富藩領","1653年の無嗣断絶後、所領は収公された（幕府領となるに際し二方郡の表高は従来の7926石余に戻された）","Wikipedia「清富藩」"]]},{"cols":["藩","飛地の記載","出典"],"rows":[["明石藩","美作国吉野郡44村（播磨国内の美嚢郡81村・明石郡145村のほか）","Wikipedia「明石藩」"],["龍野藩","美作国英田郡11村・真島郡5村。また幕府領の預かりとして揖東郡9村・赤穂郡24村・佐用郡17村などの記載がある","Wikipedia「龍野藩」"],["尼崎藩","播磨国多可郡9村・赤穂郡31村・宍粟郡9村","Wikipedia「尼崎藩」"],["篠山藩","但馬国朝来郡16村、摂津国武庫郡3村、遠江国榛原郡10村・城東郡14村（遠江分は1827年の加増による）","Wikipedia「篠山藩」"],["三田藩","丹波国氷上郡10村","Wikipedia「三田藩」"],["柏原藩","丹波国内の何鹿郡9村・天田郡4村（氷上郡43村のほか）","Wikipedia「柏原藩」"]]},{"cols":["対象","内容（出典の記載どおり）","出典"],"rows":[["福本領（池田家）","1665年に分知により7000石・6000石などに分かれ、福本7000石の領主・政武は交代寄合の格式となった。以後3家とも明治維新まで存続し、1868年に石高直しで1万0573石となり再び藩となった","Wikipedia「福本藩」"],["村岡領（山名家）","関ヶ原の戦功により七美郡6700石を与えられた。知行は1万石に達しなかったが、交代寄合表御礼衆の一つとされた。1868年に1万1000石への高直しが認められて立藩した","Wikipedia「村岡藩」"],["新宮領（池田家）","播磨新宮藩の廃藩（1670年）と同年、重教は新宮周辺で3000石を与えられ、寄合として家名の存続を許された。以後13代・頼誠の時に明治維新を迎えた","Wikipedia「播磨新宮藩」"],["平福（松平康朗）","平福藩の廃藩後、平福には旗本・松平康朗が5000石で入り、明治までこの地を治めた","Wikipedia「平福藩」"],["赤穂藩の分知旗本","浅野家の分知旗本として若狭野浅野家・家原浅野家・浅野大学家（赤穂新田3000石）の記載がある","Wikipedia「赤穂藩」"]]}]},{"h":"注記・食い違い","lv":3,"text":["- 食い違い（赤穂藩・池田家の石高）：Wikipedia「赤穂藩」の基礎情報欄は3万5000石、歴代藩主表の見出しは「3万3000石」と、同一記事内で食い違う。","- 食い違い（赤穂藩・浅野家の石高）：基礎情報欄は「5万3000石→5万石」、本文は「5万3500石→5万石（分知による）」と食い違う。","- 食い違い（赤穂藩・永井家の石高）：基礎情報欄は3万2000石、「所領」の節は3万3000石と食い違う。","- 食い違い（三田藩・九鬼家の入部年）：Wikipedia「三田藩」の略史は寛永10年（1633年）に九鬼久隆が3万6000石で三田へ転封とするが、歴代藩主表の九鬼家の期間表記は「1632年〜1871年」で食い違う。","- 食い違い（篠山藩・松平康重の就封年）：Wikipedia「篠山藩」の歴代藩主表は松平康重の就封を「慶長14年（1608年）9月」とするが、慶長14年は1609年に当たり、元号と西暦が食い違う。本文およびWikipedia「八上藩」は慶長14年（1609年）12月に篠山城へ拠点を移したとする。","- 食い違い（福本藩の立藩年）：Wikipedia「福本藩」の本文は寛文3年（1663年）に福本藩が立藩したとするが、歴代藩主表の期間表記は「1662年〜1665年」で食い違う。","- 食い違い（小野藩の立藩年）：Wikipedia「藩の一覧」は小野藩を1637年〜とするが、Wikipedia「小野藩」は寛永13年（1636年）に川之江藩として立藩し、寛永19年（1642年）に小野藩1万石が成立したとする。","- 注記（清富藩）：Wikipedia「清富藩」によれば、『寛政重修諸家譜』の文面上は宮城家は大名になっておらず、「藩」として扱わない事典類もある。また「清富」の読みは、新温泉町は「きよどめ」とするが、日本郵政の郵便番号検索では「きよとみ」とする旨の注釈がある。","- 注記（八木藩）：Wikipedia「八木藩」は、別所吉治の所領の場所や石高について諸説あってはっきりしないとし、戦後の扱いについても「本領を安堵されたとする説」と「所領を没収されたのち丹波国氷上郡北由良の領主として復帰したとする説」などを併記している。本表の数値は同記事の歴代藩主表による。","- 注記（村岡藩）：江戸時代の大半は藩ではなく交代寄合（旗本）の山名家領であり、藩となったのは1868年である。","- 注記（姫路新田藩）：姫路藩の新田支藩で、内分分知のため具体的な領地についてはほとんど不明であり、江戸定府で居所はなかった（記事の記載）。","- 注記（鶴牧藩）：候補に挙がっていた鶴牧藩は安房国（現在の千葉県）の藩であり、Wikipedia「藩の一覧」の兵庫県域分には含まれないため、本表には入れていない。","- 注記（園部藩）：園部藩は丹波国（現在の京都府）の藩であり、その飛地も含め対象外とした。"],"tables":[]},{"h":"取得不可リスト（b）","lv":3,"text":["- Wikipedia「生野代官所」：その記事名のページは存在せず取得不可。代わりにWikipedia「生野奉行」（https://ja.wikipedia.org/wiki/生野奉行 ）を取得し、生野代官への改組（1716年）を含む記載を用いた。","- Wikipedia「竹田藩」：ページ自体は取得できたが、藩庁が竹田城（兵庫県朝来市和田山町竹田）である旨のみの未整備な記事で、藩主・石高・存続期間の記載がないため、これらの項目は取得不可（未確認）とした。","- 藩主の読み：姫路藩・明石藩・龍野藩・尼崎藩・小野藩・三草藩・山崎藩・林田藩・豊岡藩・村岡藩・福本藩・播磨新宮藩・姫路新田藩・清富藩・淡路洲本藩の各藩記事には藩主名の読みの記載がなく、読みは取得不可（本表では「―」）。自治体（市史・市公式サイト）出典による読みの確認は未実施で、未確認である。","- 本節全体について、公的・自治体出典（兵庫県・各市の公式サイト、市史等）での照合は未実施であり、出典はすべてWikipediaである。","---"],"tables":[]}],"c":[{"h":"出典","lv":2,"text":[],"tables":[{"cols":["#","媒体","記事名／ページ名","URL","種別"],"rows":[["c-1","兵庫県公式サイト","県域の変遷","https://web.pref.hyogo.lg.jp/kk32/pa13_000000013.html","自治体"],["c-2","兵庫県公式サイト","よくあるご質問","https://web.pref.hyogo.lg.jp/kk32/pa13_000000023.html","自治体"],["c-3","Wikipedia","兵庫県","https://ja.wikipedia.org/wiki/兵庫県","Wikipedia"],["c-4","Wikipedia","兵庫県庁","http://ja.wikipedia.org/wiki/兵庫県庁","Wikipedia"],["c-5","Wikipedia","豊岡県","https://ja.wikipedia.org/wiki/豊岡県","Wikipedia"],["c-6","Wikipedia","飾磨県","https://ja.wikipedia.org/wiki/飾磨県","Wikipedia"],["c-7","Wikipedia","名東県","https://ja.wikipedia.org/wiki/名東県","Wikipedia"],["c-8","Wikipedia","廃藩置県","https://ja.wikipedia.org/wiki/廃藩置県","Wikipedia"],["c-9","Wikipedia","桜井勉","http://ja.wikipedia.org/wiki/桜井勉","Wikipedia"],["c-10","コトバンク（日本大百科全書（ニッポニカ）「但馬国」）","但馬国","https://kotobank.jp/word/%E4%BD%86%E9%A6%AC%E5%9B%BD-93259","その他（百科事典）"],["c-11","講演会レポート（田辺眞人「兵庫五国の風土と文化」）","かんちゃ（note）","https://note.com/super_guppy6051/n/n8eb26e1328fb","その他（講演要約）"]]}]},{"h":"表1：廃藩置県（1871年8月29日（明治4年7月14日））で、現在の兵庫県域にあった県","lv":2,"text":["発足日は、兵庫県・生野県を除き、すべて廃藩置県の日（1871年8月29日（明治4年7月14日））である（出典 c-8 の当初県一覧による）。","（注）淡路国は廃藩置県の時点では徳島県（旧徳島藩）に属し、兵庫県域には含まれない。淡路の帰属は表2・年表を参照。また、久美浜県（現・京都府域）は但馬国朝来郡の一部を管轄していた時期がある（出典 c-10 の但馬国の沿革による）が、県そのものは京都府の章で扱う。"],"tables":[{"cols":["番号","県名","読み","前身","発足日","統合先","統合日"],"rows":[["1","兵庫県（第1次）","ひょうごけん","兵庫裁判所（摂津国・播磨国の幕府領・旗本領）","1868年7月12日（慶応4年5月23日）※廃藩置県以前から存在","兵庫県（第2次）として再発足","1871年11月（布告は下記注記）"],["2","尼崎県","あまがさきけん","尼崎藩","1871年8月29日（明治4年7月14日）","兵庫県","1871年11月"],["3","三田県","さんだけん","三田藩","1871年8月29日（明治4年7月14日）","兵庫県","1871年11月"],["4","姫路県（第1次）","ひめじけん","姫路藩","1871年8月29日（明治4年7月14日）","姫路県（第2次）へ統合、のち飾磨県に改称","1871年12月13日（明治4年11月2日）"],["5","明石県","あかしけん","明石藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["6","小野県","おのけん","小野藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["7","三草県","みくさけん","三草藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["8","龍野県","たつのけん","龍野藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["9","林田県","はやしだけん","林田藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["10","赤穂県","あこうけん","赤穂藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["11","安志県","あんじけん","安志藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["12","山崎県","やまさきけん","山崎藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["13","三日月県","みかづきけん","三日月藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["14","生野県","いくのけん","幕府領（生野代官所）。府中裁判所→久美浜県の管轄を経て設置","1869年9月15日（明治2年8月10日）※廃藩置県以前から存在","豊岡県","1871年12月13日（明治4年11月2日）"],["15","出石県","いずしけん","出石藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"],["16","豊岡県（第1次）","とよおかけん","豊岡藩","1871年8月29日（明治4年7月14日）","豊岡県（第2次）へ統合","1871年12月13日（明治4年11月2日）"],["17","村岡県","むらおかけん","村岡藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"],["18","篠山県","ささやまけん","篠山藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"],["19","柏原県","かいばらけん","柏原藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"]]}]},{"h":"表2：第1次府県統合（1871年11月）で成立した4県と、その後の帰結","lv":2,"text":["兵庫県公式「県域の変遷」（c-1）は、廃藩置県で現県域に「30を超える県」が成立し、明治4年11月の全面改正で次の4県に編成されたとする。"],"tables":[{"cols":["県名","読み","管轄（出典 c-1 の記載）","その後"],"rows":[["兵庫県（第2次）","ひょうごけん","摂津の西部5郡","1876年8月21日に飾磨県ほかを併合し第3次兵庫県となる"],["飾磨県","しかまけん","播磨全域","1876年8月21日に兵庫県へ合併され廃止"],["豊岡県（第2次）","とよおかけん","但馬全域・丹後全域・丹波3郡","1876年8月21日に廃止・分割（但馬国と丹波国氷上郡・多紀郡は兵庫県へ、丹後国と丹波国天田郡は京都府へ）"],["名東県","みょうどうけん","阿波及び淡路全域","1876年8月21日に廃止・分割（阿波国は高知県へ、淡路国は兵庫県へ）"]]}]},{"h":"年表：兵庫県の設置から現在の県域の成立まで","lv":2,"text":[],"tables":[{"cols":["日付（新暦（旧暦））","出来事","出典"],"rows":[["1868年2月15日（慶応4年1月22日）","兵庫鎮台を設置","c-3"],["1868年2月24日（慶応4年2月2日）","兵庫裁判所に改称。摂津国185村・播磨国209村の幕府領と、摂津26村・播磨108村の旗本領を管轄（この時、初めて旧摂津国が大阪府と兵庫県に分割された）","c-3"],["1868年7月12日（慶応4年5月23日）","兵庫裁判所を廃止して兵庫県を設置（第1次兵庫県）。県庁は兵庫津に置かれたが、同年9月に坂本村へ新築移転したため、兵庫津に置かれた期間は約3～4か月だった","c-2、c-3"],["1869年7月17日（明治2年7月17日）※旧暦の日付","太政官布告により、府は京都・東京・大阪に限るとされた。兵庫県は県のまま存続した（この布告の日付は旧暦であり、新暦換算は出典に記載なし）","第4便で確認済みの布告。兵庫県側の出典での裏付けは未確認"],["1869年9月7日（明治2年8月2日）","豊崎県を兵庫県に編入。ただし同年10月25日（明治2年9月21日）、旧豊崎県のうち西成郡・東成郡・住吉郡を大阪府に移管","c-3"],["1870年5月","稲田騒動（庚午事変）で一時、淡路北部を管地とする。大阪府域にも管地があった（出典 c-1 は月までの記載）","c-1"],["1871年（明治4年）5月（6月18日-7月17日）","徳島藩稲田氏知行地の淡路国津名郡43か村浦を兵庫県に編入","c-3"],["1871年8月29日（明治4年7月14日）","廃藩置県。現県域の旧藩が県となる（表1）","c-8"],["1871年11月","第1次府県統合により4県に編成（表2）。兵庫県（第2次）は摂津の西部5郡（八部郡・菟原郡・武庫郡・川辺郡・有馬郡）を管轄","c-1、c-8"],["1871年12月13日（明治4年11月2日）","布告により、播磨国10県を統合して姫路県（第2次）が発足。また生野県・出石県・豊岡県・村岡県・篠山県・柏原県ほかを統合して豊岡県（第2次）が発足","c-5、c-6、c-8"],["1871年12月20日（明治4年11月9日）","姫路県が飾磨県に改称（参事・土肥実光の嘆願による。改称の理由について宮武外骨『府藩県制史』の説があるが、記事は「学説として認められたものではない」と明記）","c-6"],["1871年12月26日（明治4年11月15日）","布告により名東県が設置され、淡路国全域が名東県に編入された","c-3、c-7、c-8"],["1871年12月31日（明治4年11月20日）","大阪府・兵庫県に関する布告（法令全書・太政官布告第609号）。兵庫県の管轄は摂津国のうち八部郡・菟原郡・武庫郡・川辺郡・有馬郡とされた","c-8"],["1873年（明治6年）2月20日","名東県が香川県（第1次）を編入（1875年9月5日に香川県（第2次）として再分離）","c-7"],["1876年8月21日","第2次府県統合。兵庫県・飾磨県が統合され改めて兵庫県が発足（第3次兵庫県）。豊岡県のうち但馬国および丹波国氷上郡・多紀郡を、名東県のうち淡路国全域を兵庫県に移管し、ほぼ現在の県域が確定","c-1、c-3、c-5、c-7、c-8"]]}]},{"h":"1876年8月21日の再編の経緯（出典の記載どおり）","lv":2,"text":["- 兵庫県公式「県域の変遷」（c-1）：「櫻井勉（但馬出身）は、大久保利通に豊岡・鳥取統合を問われ飾磨との併合を進言したが『開港場である兵庫県の力を充実させるように考え直せ』と言われ第3次兵庫県の原案を作成」し、大久保は「一府県の増減に過ぎぬが…一挙両得」と評した、とされる。","- Wikipedia「桜井勉」（c-9）：内務卿・大久保利通が桜井勉に豊岡県と鳥取県の合併について意見を求めたところ、桜井は「但馬と因幡の間は山が険しく往来が不便であるため、鳥取県は島根県、豊岡県は飾磨県と合併させる方が適切である」と進言した。物産が豊かな飾磨県を兵庫県と合併させることを考えていた大久保が難色を示したため、豊岡県を二分し、丹後および丹波の天田郡を京都府、但馬および丹波の氷上郡・多紀郡を兵庫県に編入することを再提案し、この意見が取り入れられた、とされる。","- Wikipedia「豊岡県」（c-5）は出典として『豊岡市史 下巻』p.53-54を挙げ、同様の経緯を記す。"],"tables":[]},{"h":"照合結果（c）","lv":2,"text":["- 兵庫県公式サイトで照合できたもの：兵庫県の3期区分（第1次＝慶応4年・1868年5月、第2次＝明治4年11月〜明治9年7月、第3次＝明治9年8月〜）、第1次府県統合で4県に編成されたこと、1876年8月に飾磨県と豊岡・名東両県の一部が兵庫県に併合され「ほぼ現在の県域」が確定したこと（c-1）。ただし公式ページの日付は「明治4年11月」のように月までのものが多く、日単位の照合はできていない。","- 国立公文書館／JACARでの照合：JACARで太政類典（第2編・明治4年〜明治10年）の関連巻の存在は確認したが、1876年8月21日の府県統合や1871年11月の府県統合の布告本文には到達できず、未確認（照合未実施）。布告の日付・番号は「廃藩置県」記事（c-8）が引く『法令全書』の通番（例：明治4年太政官布告第609号）によるもので、原典そのものの確認はしていない。","- 豊岡県の統合日（明治4年11月2日）は、豊岡県の歴代長官である権令・小松彰の任期開始日（明治4年11月2日〜）とも一致する（c-5）。"],"tables":[]},{"h":"注記・食い違い（c）","lv":2,"text":["1. 統合で廃された県の数（食い違い）：兵庫県公式「県域の変遷」（c-1）は、廃藩置県で現県域に「30を超える県」が成立したと記す。一方、Wikipedia「廃藩置県」（c-8）の当初県一覧から現在の兵庫県域にあたる県を数えると19県（表1）であり、田辺眞人の講演要約（c-11）も「現兵庫県域には19県があった」とする。公式の「30を超える」の数え方（飛地を管轄した他県や、廃藩置県以前に存在した県を含むかどうか）は未確認であり、両者を併記する。","2. 第1次府県統合での兵庫県再発足の日（食い違い）：Wikipedia「兵庫県」（c-3）の県域の変遷は「明治4年7月14日（1871年8月29日）第1次府県統合により摂津国西部の3県が統合され改めて兵庫県発足」とするが、同記事の布告関係および「廃藩置県」記事（c-8）では、大阪府・兵庫県に関する布告は明治4年11月20日（1871年12月31日）であり、兵庫県公式（c-1）も「明治4年11月」とする。7月14日は廃藩置県の日そのものであり、本表では11月を採用し、7月14日説を併記する。","3. 櫻井の名前の表記（食い違い）：兵庫県公式「県域の変遷」（c-1）とWikipedia「豊岡県」（c-5）・「桜井勉」（c-9）は「櫻井勉／桜井勉」とするが、Wikipedia「兵庫県」（c-3）の概説は「櫻井努」と記す。公式の表記「櫻井勉」を本文に置き、「努」の表記を併記する。","4. 淡路国津名郡の帰属の細部（食い違い）：Wikipedia「名東県」（c-7）は、明治4年11月15日（1871年12月26日）の設置時に「兵庫県から淡路国津名郡を編入し、阿波国と淡路国を以って名東県が設置」されたとする。一方、「廃藩置県」記事（c-8）の名東県の項は「阿波国一円、淡路国一円（ただし、津名郡は5日後に兵庫県に編入された）」と記し、津名郡の移管の向きが逆になっている。どちらが正しいかは未確認であり、両者を併記する。なお名東県の記事には出典不十分のテンプレートが付されている。","5. 生野県の豊岡県への合併日（食い違いの可能性）：Wikipedia「豊岡県」（c-5）は生野県を含む統合を明治4年11月2日（1871年12月13日）とするが、「生野銀山の歴史」年表（朝来市・生野書院パンフレットに基づく、その他）は「1871.11.15 生野県は豊岡県に合併される」とする。布告日と実施日の区別によるものかどうかは未確認。","6. 表1の各県の読みのうち、兵庫県・豊岡県・飾磨県・姫路県・名東県は出典本文で確認した。その他の県の読みは各県名の一般的な読みを記したが、本調査では個別に出典で照合していない（未確認）。"],"tables":[]},{"h":"取得不可リスト（c）","lv":2,"text":["- JACAR（アジア歴史資料センター）の府県統合関係の布告本文：太政類典の関連巻（例：Ref. A07060000050「太政類典・第2編・明治4年〜明治10年・第96巻・地方2・行政区2」）の目次までは確認できたが、1871年11月および1876年8月21日の府県統合の布告本文には到達できなかった。よって国立公文書館所蔵資料による日付の照合は未実施。","- 国立公文書館デジタルアーカイブの『法令全書』本文：取得できず。布告番号はWikipedia「廃藩置県」の引用による間接確認にとどまる。","---"],"tables":[]}],"d":[{"h":"出典","lv":2,"text":[],"tables":[{"cols":["#","媒体","記事名／ページ名","URL","種別"],"rows":[["d-1","兵庫県公式サイト","よくあるご質問（Q2）","https://web.pref.hyogo.lg.jp/kk32/pa13_000000023.html","自治体"],["d-2","兵庫県公式サイト","県域の歴史","https://web.pref.hyogo.lg.jp/kk32/pa13_000000011.html","自治体"],["d-3","兵庫県公式サイト","兵庫県の歴史（キッズ）","https://web.pref.hyogo.lg.jp/ac02/kids_history.html","自治体"],["d-4","国土交通省 近畿地方整備局 兵庫国道事務所","兵庫の名前の由来","https://www.kkr.mlit.go.jp/hyogo/introduction/kankou/yurai/index.html","公的"],["d-5","Wikipedia","兵庫県","https://ja.wikipedia.org/wiki/兵庫県","Wikipedia"]]}]},{"h":"県名の由来（公的出典の記載）","lv":2,"text":["兵庫県公式「よくあるご質問」（d-1）の記載：","- 県名は、現在の神戸市兵庫区辺りを指す「兵庫」という地名に由来する。","- 兵庫津（現在の神戸港の一部）は開港場に指定された。","- 慶応4年（1868年）に兵庫鎮台が置かれ、間もなく兵庫裁判所となり、同年5月23日に兵庫県となった（この「5月23日」は旧暦の日付。新暦では1868年7月12日）。","- 県名に「兵庫」と冠したのは、役所が置かれた地が兵庫にあったからだと推測されている（公式ページ自身が推測と明記）。","Wikipedia「兵庫県」（d-5）の記載：県名の由来は、摂津国八部郡の兵庫津（現在の神戸市兵庫区）に初代県庁舎が置かれたことによる。なお、県庁舎は慶応4年9月に坂本村へ新築移転し、1873年（明治6年）5月には神戸町へ移転した。兵庫津は1879年1月8日に神戸区の一部となり、兵庫港は1892年10月1日に神戸港の一部となったが、県名は「兵庫」のまま現在に至る（d-5）。"],"tables":[]},{"h":"地名「兵庫」の語源（諸説・仮説）","lv":2,"text":["以下はすべて仮説であり、兵庫県公式サイト自身が「よくわかっていません」と明記している（d-1、d-2）。","地名としての「兵庫」の古さについては、兵庫県公式「県域の歴史」（d-2）が、平安時代に「大輪田の泊」と呼ばれた地が、鎌倉時代に「兵庫津」と呼ばれるようになったと記す。"],"tables":[{"cols":["説","内容","出典"],"rows":[["兵器の倉庫説","「かつて兵器の倉庫がそこに置かれていたために名付けられたのではないかとも考えられますが、よくわかっていません」（兵庫県公式FAQの文言どおり）","d-1、d-2（自治体）"],["つわものぐら説（国道事務所）","「兵庫県の『兵庫』は、兵器を格納する倉庫である『兵庫（つわものぐら）』にちなんでいます」「645年 大化の改新の際、播磨国境の須磨関を守るため現在の神戸市兵庫区周辺に兵器庫『兵庫』が作られる」","d-4（公的）"],["つわものぐら説（Wikipedia）","「天智天皇の治世に兵の武器庫という意味である『つわものぐら（兵庫）』があったことに由来」し、兵庫県旗と県章も「兵」の字を図案化したものである、とする","d-5（Wikipedia）"]]}]},{"h":"照合結果（d）","lv":2,"text":["- 県名が「兵庫」という地名（兵庫津）に由来し、慶応4年（1868年）5月23日（旧暦）に兵庫県が置かれたことは、兵庫県公式（d-1）とWikipedia（d-5）で一致する。","- 県庁所在地との関係（役所が兵庫に置かれたために「兵庫」を冠した）については、兵庫県公式自身が「推測」と明記しており、確定した経緯としては扱わない。"],"tables":[]},{"h":"注記・食い違い（d）","lv":2,"text":["1. 語源の扱いの差（食い違い）：兵器庫「兵庫（つわものぐら）」に由来するという説について、兵庫県公式（d-1、d-2）は「よくわかっていません」とする一方、国土交通省兵庫国道事務所（d-4）は「ちなんでいます」と断定調で記し、645年（大化の改新の際）という具体的な年代まで挙げる。公的機関の間でも表現が異なるため、本項では仮説として併記し、県公式の「未詳」の立場を本文に置く。","2. つわものぐら説の年代についても、d-4は「645年」、d-5は「天智天皇の治世」（661〜671年）としており、一致しない。いずれも仮説の範囲であり、どちらかに決めない。","3. 兵庫県設置の日付「5月23日」は旧暦（慶応4年5月23日）であり、新暦では1868年7月12日である。兵庫県公式ページ（d-1）は旧暦の日付をそのまま記しているため、引用の際は暦の種別に注意すること。"],"tables":[]},{"h":"取得不可リスト（d）","lv":2,"text":["- なし（兵庫県公式サイトに県名の由来の説明ページが存在し、取得できた）。","---"],"tables":[]}],"e":[{"h":"出典","lv":2,"text":["- ユネスコ世界遺産センター「Himeji-jo」https://whc.unesco.org/en/list/661/ （公的）","- ユネスコ世界遺産センター「World Heritage List」一覧表（Himeji-jo、ID 661、1993年、107 ha）https://whc.unesco.org/en/list/?id_states=jp,kp,kr,mn&mode=table&order=country （公的）","- ユネスコ／ICOMOS評価書「Himeji-jo 661」https://whc.unesco.org/document/153975 （公的。検索結果の抜粋で確認）","- 姫路市公式「姫路城管理運営業務要求水準書」（令和8年8月、姫路城管理事務所）https://www.city.himeji.lg.jp//sangyo/cmsfiles/contents/0000033/33651/youkyusuijunhosoku2.pdf （自治体）","- 姫路市公式「第2章 姫路市の市勢」（資料：文化庁「国指定文化財等データベース」、令和6年3月現在）https://www.city.himeji.lg.jp/sangyo/cmsfiles/contents/0000003/3339/himeji_mp02.pdf （自治体）","- 姫路市公式「特別史跡姫路城跡保存活用計画 第1章」https://www.city.himeji.lg.jp/kanko/cmsfiles/contents/0000030/30274/chapter1.pdf （自治体）","- 兵庫県庁資料「史跡明石城跡の概要」（出典：文化庁文化財部監修『月刊文化財』平成16年8月号491号）https://web.pref.hyogo.lg.jp/ks24/documents/siryo-02.pdf （自治体／公的）","- 文化遺産データベース「明石城跡」https://bunka.nii.ac.jp/db/heritages/detail/173925 （公的）","- 兵庫県立歴史博物館（兵庫県教育委員会）「名所めぐり：竹田城跡」https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_sanindo/takedajo/ （自治体）","- 赤穂城跡パンフレット（赤穂市立歴史博物館所蔵資料、赤穂観光協会）https://ako-kankou.jp/wp-content/uploads/2020/02/booklet_AkoCastleRuins_202002.pdf （自治体）","- 洲本市公式「史跡洲本城跡整備基本計画（概要版）」（自治体）","- 兵庫県教育委員会『三田城跡発掘調査報告書』ほか三田城跡調査報告（奈良文化財研究所 遺跡データベース経由）https://sitereports.nabunken.go.jp/files/attach/26/26283/19245_1_%E4%B8%89%E7%94%B0%E5%9F%8E%E8%B7%A1.pdf （公的）","- Wikipedia「姫路城」「現存天守」https://ja.wikipedia.org/wiki/%E7%8F%BE%E5%AD%98%E5%A4%A9%E5%AE%88 「明石城」「赤穂城」https://ja.wikipedia.org/wiki/%E8%B5%A4%E7%A9%82%E5%9F%8E 「竹田城」ほか各城記事（Wikipedia）","- Weblio辞書（Wikipedia各城記事の転載）「三田城」https://www.weblio.jp/content/%E4%B8%89%E7%94%B0%E5%9F%8E ほか（Wikipedia）","- コトバンク「明石城」（小学館『デジタル大辞泉』、講談社『日本の城がわかる事典』等）https://kotobank.jp/word/%E6%98%8E%E7%9F%B3%E5%9F%8E-179644 （その他（事典））","- ニッポン城めぐり「尼崎城」https://cmeg.jp/a/castles/5663 （その他（城郭情報サイト、Wikipedia基礎情報を転載））"],"tables":[]},{"h":"表","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","築城者","築城年","廃城年または現状","現存・再建建物","出典の種別"],"rows":[["1","姫路城","ひめじじょう","赤松貞範（大改築：池田輝政）","1346年（正平元年／貞和2年）※諸説あり（注記参照）","1871年（明治4年）に廃城とする一覧あり。ただし存城として存続し、天守群は現存","大天守・東小天守・西小天守・乾小天守・イ・ロ・ハ・ニの渡櫓の8棟が国宝として現存。櫓・門・塀等74棟が重要文化財として現存","公的・自治体・Wikipedia"],["2","明石城","あかしじょう","小笠原忠真","1618年（元和4年）※着工1619年・完成1620年の公的資料あり（注記参照）","1874年（明治7年）※1869年説あり（注記参照）","天守は築かれず（天守台のみ）。巽櫓・坤櫓が現存（重要文化財）。石垣・堀現存","公的・自治体・Wikipedia"],["3","赤穂城","あこうじょう","浅野長直","1648年（慶安元年）〜1661年（寛文元年）","1873年（明治6年）※1872年廃城決定とする市資料あり（注記参照）","天守は築かれず（天守台のみ）。建物は現存せず、櫓・門を再建。本丸庭園・二之丸庭園あり","Wikipedia・自治体"],["4","竹田城","たけだじょう","山名宗全（持豊）","1431年（永享3年）※1443年（嘉吉3年）の伝承あり（注記参照）","1600年（慶長5年）","建物は現存せず。石垣がほぼそのままの状態で残る","Wikipedia・自治体"],["5","出石城","いずしじょう","小出吉英","1604年（慶長9年）","1868年（明治元年、城郭建築撤去）※1871年とする資料あり（注記参照）","建物は現存せず。隅櫓・登城門・登城橋を復元。石垣・堀現存","Wikipedia・その他"],["6","篠山城","ささやまじょう","徳川家康（縄張：藤堂高虎、普請総奉行：池田輝政）","1609年（慶長14年）","1871年（明治4年）","天守は築かれず（天守台のみ）。大書院を木造復元（2000年）。石垣・堀現存","Wikipedia"],["7","洲本城","すもとじょう","安宅氏（伝：安宅治興）","1526年（大永6年）と伝わる","1609年（慶長14年）に事実上の廃城（注記参照）","建物は現存せず。模擬天守（1928年築、鉄筋コンクリート造）。石垣・登り石垣現存","自治体・Wikipedia"],["8","龍野城","たつのじょう","赤松村秀","1499年（明応8年）※1500年頃とする資料あり（注記参照）","1871年（明治4年）","建物は現存せず。本丸御殿・隅櫓・埋門・多聞櫓を再建。石垣現存","Wikipedia・その他"],["9","三木城","みきじょう","別所則治","1492年（明応元年）前後※諸説あり（注記参照）","1615年（元和元年）※1616年・1617年説あり（注記参照）","建物は現存せず。天守台の土壇・井戸が残る","Wikipedia"],["10","三田城","さんだじょう","摂津有馬氏","不明（多説あり）","1649年（慶安2年）※陣屋として存続し1873年廃城令で廃城とする資料あり（注記参照）","建物は現存せず。内堀が残る","Wikipedia・公的"],["11","尼崎城","あまがさきじょう","戸田氏鉄","1617年（元和3年）※着工1618年とする資料あり（注記参照）","1873年（明治6年）","建物は現存せず。外観復元天守（2018年完成、鉄筋コンクリート造）。石垣は埋蔵","Wikipedia・その他"]]}]},{"h":"城ごとの注記","lv":2,"text":[],"tables":[]},{"h":"1. 姫路城","lv":3,"text":["- 別名は白鷺城。読みは「はくろじょう」「しらさぎじょう」の両方がWikipedia記事にあり、姫路市公式資料は「白鷺城（しらさぎじょう）」と記す。ユネスコ公式ページは英語名として \"Shirasagi-jo (White Heron Castle)\" と記す。","- 指定・登録の年次（姫路市公式資料で照合）：","- 国宝：1951年（昭和26年）6月9日、文化財保護法に基づき指定。国宝8棟は大天守・東小天守・西小天守・乾小天守・イ、ロ、ハ、ニの渡櫓（姫路市公式「姫路城管理運営業務要求水準書」、および文化庁「国指定文化財等データベース」を資料とする姫路市公式「市勢」）。","- 重要文化財：74棟。1931年（昭和6年）12月14日に国宝保存法に基づく当時の国宝として指定され、文化財保護法により重要文化財となった（姫路市公式「姫路城管理運営業務要求水準書」）。","- 特別史跡：1956年（昭和31年）に姫路城跡が特別史跡に指定された（姫路市公式「特別史跡姫路城跡保存活用計画 第1章」に「昭和26年（1951）に大天守など8棟の建造物が国宝に、昭和31年（1956）には中曲輪の一部を除く区域が特別史跡に指定」とある）。","- 世界遺産：登録年月日は1993年（平成5年）12月11日（姫路市公式）。ユネスコ世界遺産一覧表では「Himeji-jo、ID 661、1993年、面積107 ha」。登録基準は（i）（iv）（ユネスコ「New Inscribed Properties (17COM)」およびユネスコ公式ページの Criterion (i)・(iv) の記載）。法隆寺地域の仏教建造物とともに日本初の世界文化遺産（姫路市公式）。","- 史蹟指定：1928年（昭和3年）に史蹟に指定とする資料がある一方、ICOMOS評価書は \"designated an Historic Site in 1929\" と記しており、1年の食い違いがある（後述）。","- ユネスコ公式ページの記載：\"Himeji-jo is the finest surviving example of early 17th-century Japanese castle architecture.\"（17世紀初頭の日本の城郭建築の現存する最良の例、という趣旨の原文）。資産は107ヘクタール、82棟の建造物からなると記す。建造物と城跡は1950年の文化財保護法のもと国宝・重要文化財・特別史跡として保護されていると記す。","- 建造物数の検算：国宝8棟＋重要文化財74棟＝82棟で、ユネスコ公式ページの「82 buildings」と一致する。一方、ICOMOS評価書（1993年）は \"comprising 83 buildings in total\" と記しており、1棟の差がある（後述）。","- 築城の経緯：Wikipedia基礎情報は築城主を赤松貞範、築城年を1346年とするが、記事本文には、城郭としての本格的な築城は黒田重隆・職隆による1555〜1561年の拡張とする説も併記されている。池田輝政による大改築は1601〜1609年。","- 天守の建造年：Wikipedia「現存天守」は姫路城の天守建造年を1608年（慶長13年）とする。一方、大改築の完成を1609年とする資料が複数ある（後述）。","- 廃城年：Wikipedia「現存天守」の姫路城の項は「1346年築城 - 1871年（明治4年）廃城」と記す。姫路城自体の記事の基礎情報には廃城年の記載がなく、明治期に競売にかけられたが権利が放棄され、陸軍の使用を経て保存された経緯が記されている。"],"tables":[]},{"h":"2. 明石城","lv":3,"text":["- 別名は喜春城（きはるじょう、きしゅん-）、錦江城（きんこうじょう）（Wikipedia）。","- 指定：城跡は国の史跡（2004年（平成16年）9月30日、文部科学省告示第142号、指定面積273,771.50㎡。兵庫県庁資料）。巽櫓・坤櫓は国の重要文化財（1957年（昭和32年）6月18日指定。兵庫県庁資料に官報告示の転載あり）。","- 築城年について：Wikipedia基礎情報は1618年（元和4年）。文化庁の文化遺産データベース「明石城跡」は、元和5年（1619年）正月に石垣普請が開始され、元和6年（1620年）4月に造営を終えたと記す。1957年の重要文化財指定説明（官報告示、兵庫県庁資料に転載）は「明石城は元和三年（一六一七）小笠原忠真のため、岳父本多忠政（姫路城主）が築いたと伝えられる」と記す。小学館『デジタル大辞泉』は「元和4年（1618）小笠原忠真が新築、元和6年（1620）完成」とする。1617年は小笠原忠真の入封と築城命令の年である。","- 天守は計画されたが建てられなかった。本丸四隅に三重櫓4基（艮・巽・坤・乾）が建てられ、東南隅の巽櫓と南西隅の坤櫓が現存する。巽櫓は船上城から、坤櫓は伏見城から移築されたと伝えられ、1982年（昭和57年）の改修工事で移築と判明したとWikipedia記事は記す。"],"tables":[]},{"h":"3. 赤穂城","lv":3,"text":["- 別名は加里屋城。前身として池田長政による掻上城（1600年築と伝わる）があるとする資料がある。","- 築城期間の検算：1648年から1661年までは13年で、記事および赤穂市立歴史博物館所蔵資料に基づくパンフレットの「13年を費やして完成」と一致する。","- 指定：城郭は国の史跡（1971年（昭和46年）指定）、本丸庭園・二之丸庭園は国の名勝「旧赤穂城庭園」（2002年（平成14年）指定）（Wikipedia、赤穂城跡パンフレット）。","- 天守台は築かれたが、幕府の許可が下りず天守は築かれなかった（日本100名城公式ガイドブックを出典とする転載資料）。","- 本丸門は1992〜1996年に復元された。"],"tables":[]},{"h":"4. 竹田城","lv":3,"text":["- 別名は虎臥城。読みは「とらふすじょう」「こがじょう」の両方が資料にある。","- 指定：国の史跡（1943年（昭和18年）9月8日指定。Wikipedia）。","- 築城年について：Wikipedia基礎情報は1431年（永享3年）、築城主・山名宗全とする。一方、記事本文が紹介する『史跡・竹田城』の伝承では、嘉吉3年（1443年）に山名持豊（宗全）によって築かれ、太田垣光景が初代城主とされるが、これは口碑のみである。『和田上道氏日記』は嘉吉年間（1441〜1443年）に「安井ノ城」が築かれたと記す。朝来市公式サイト（二次資料が引用）は嘉吉年間（1441〜1443年）頃に山名持豊（宗全）が太田垣氏に築かせたと記す。","- 兵庫県立歴史博物館のページは「1433（嘉吉3）年に但馬国守護山名宗全（そうぜん）が13年かけて築かせた城といわれている」と記す。嘉吉3年は1443年であり、同ページの西暦「1433」とは一致しない（原文のまま転記）。","- 落城年について：兵庫県立歴史博物館は1577年（天正5年）落城と記し、朝来市公式（二次資料が引用）は1580年（天正8年）の秀吉の但馬侵攻で落城と記す。最後の城主・赤松広秀（県立歴史博物館は「赤松広英」と表記）が1600年に自害し、廃城となった点は各資料で一致する。","- Wikipedia記事の文言：「廃城から約400年を経ているが、石垣がほぼそのままの状態で残っており、現存する山城として日本屈指の規模となっている」。"],"tables":[]},{"h":"5. 出石城","lv":3,"text":["- 別名は高城。","- 指定：豊岡市指定史跡（「出石城跡（平城）」、1968年3月30日指定）。国指定ではない。有子山城とあわせて続日本100名城162番。","- 廃城年について：城郭建築の撤去は1868年（明治元年）に新政府の許可を得て行われ、同年10月までに全ての建物が解体された（Wikipedia記事本文）。基礎情報の廃城年も1868年（城郭建築撤去）とするが、1871年（明治4年）とする城郭情報サイトもある（後述）。","- 辰鼓櫓について：現存とする城郭情報サイトがあるが、別の資料では、辰鼓櫓は1871年に城の資材で建てられた時計台であるとされる。未確認。","- 有子山城は山名祐豊が1574年（天正2年）に築き、出石城の築城（1604年）に伴い廃された。"],"tables":[]},{"h":"6. 篠山城","lv":3,"text":["- 築城は天下普請で、15か国20大名が動員され、6か月で完成したとWikipedia記事は記す。","- 指定：国の史跡（1956年（昭和31年）12月28日、「篠山城跡」として指定。Wikipedia）。","- 天守は築かれず、天守台のみ。大書院は1873年以降の城郭取払いを免れたが1944年1月6日に火災で焼失し、2000年（平成12年）4月に木造復元が完成した。"],"tables":[]},{"h":"7. 洲本城","lv":3,"text":["- 洲本市公式「史跡洲本城跡整備基本計画（概要版）」の記載：安宅氏（淡路水軍）が築き、1585年（天正13年）に入った脇坂安治が総石垣の城に改修し、二条の登り石垣を築いた。1609年（慶長14年）の脇坂氏の伊予大洲への転封により事実上の廃城となった。","- 指定：山上の「上の城」は国の史跡（1999年（平成11年）指定）、山麓の「下の城」は洲本市指定史跡。政庁は1631〜1635年の由良引けの後、1642年（寛永19年）に山麓へ移った。徳島藩の稲田氏が洲本城代を務めた。","- 築城年は1526年（大永6年）に安宅治興が築いたと伝わるとする二次資料がある（公的出典では未確認）。","- 模擬天守は1928年（昭和天皇即位記念、鉄筋コンクリート造）。「日本最古の模擬天守」と記す二次資料があるが、公的出典では未確認。"],"tables":[]},{"h":"8. 龍野城","lv":3,"text":["- 別名は霞城。","- 鶏籠山山頂の城（龍野古城）が1499年に築かれ、1658年に破却された。1672年（寛文12年）に脇坂安政が山麓に陣屋形式で再建し、天守は築かれなかった。建物は1871年に解体された。本丸御殿は1979年（昭和54年）に再建され、隅櫓・埋門・多聞櫓は1975年以降に再建された。","- 国指定・県指定・市指定の別は、今回確認した出典では未確認。"],"tables":[]},{"h":"9. 三木城","lv":3,"text":["- 別名は釜山城・別所城。","- Wikipedia記事は、播磨三大城の一つとして御着城・英賀城とともに挙げる文言がある（記事の表現のまま）。","- 築城時期は諸説あってはっきりしないと記事自体が記す。基礎情報は「長享2年（1492年）前後」とするが、長享2年は1488年であり、記事本文が引く『三木戦史』は「明応元年（1492年）九月三木ノ釜山城ヲ築キテ」と記す。基礎情報の元号表記と西暦は一致しない（原文のまま転記）。","- 指定：国の史跡「三木城跡及び付城跡・土塁」。"],"tables":[]},{"h":"10. 三田城","lv":3,"text":["- 別名は三田陣屋、車瀬城、三田古城（Weblio転載のWikipedia基礎情報）。","- 築城時期は多説あり、どの説が正しいのかは不明である（Wikipedia記事）。『三田城史』は車瀬城を築いたのを有馬村秀とし、『三田市史』は有馬則景が車瀬に居館を造ったのが始まりとする（同記事）。","- 兵庫県教育委員会の発掘調査報告書は、三田城は南北朝時代に赤松円心の四男氏範が基礎を築いたとする説などがあり明らかでないこと、城として整備された時期が判明しているのは天正年間に荒木氏が支配を始めてからであること、九鬼氏は従来の三田城を廃して古城とし城域の南部と西部を三田陣屋として整備したこと、その後明治4年（1871）まで九鬼氏が三田藩主として支配したことを記す。","- 廃城年について：Wikipedia基礎情報は1649年（慶安2年）とする。一方、九鬼氏が明治6年（1873年）の廃城令で廃城となったと記す二次資料がある（後述）。"],"tables":[]},{"h":"11. 尼崎城","lv":3,"text":["- 天守は複合式層塔型4重4階で1618年築と城郭情報サイトは記す（天守構造の項）。築城年については元和3年（1617年）に戸田氏鉄が入封し築いたとするWikipedia本文と、元和4年（1618年）の春から築城が開始されたとする資料がある（後述）。","- 1873年（明治6年）の廃城令により建物は一部を除き取り壊された。本丸御殿の一部「金之間」は1874年（明治7年）に深正院へ移築されたが、戦災で焼失した。","- 外観復元天守は、資産家の寄贈により2018年（平成30年）に尼崎城址公園内に完成し、2019年3月29日に一般公開が始まった。鉄筋コンクリート造、地上5階建て。","- 国指定・県指定・市指定の別は、今回確認した出典では未確認（「尼崎城分間絵図」が尼崎市指定文化財である旨の記載は城郭情報サイトにある）。"],"tables":[]},{"h":"現存天守の確認結果","lv":2,"text":["- Wikipedia「現存天守」は、現存天守を「日本の城の天守のうち、江戸時代またはそれ以前に建設され、現代まで保存されている天守」と定義し、12の天守が現存すると記す。現存12天守は、弘前城（青森県）、松本城（長野県）、丸岡城（福井県）、犬山城（愛知県）、彦根城（滋賀県）、姫路城（兵庫県）、松江城（島根県）、備中松山城（岡山県）、丸亀城（香川県）、松山城（愛媛県）、宇和島城（愛媛県）、高知城（高知県）である。","- この12城のうち兵庫県内は姫路城のみであり、兵庫県内の現存天守は姫路城のみであることが確認できた。","- 同記事は、12城の天守はいずれも文化財保護法に基づいて重要文化財に指定され、このうち松本城、犬山城、彦根城、姫路城、松江城の五つの天守は国宝に指定されていると記し、この5城を「国宝五城」と呼ぶ（国宝城郭都市観光協議会による名称）と記す。","- 姫路城の天守について同記事は「日本国内最大の現存天守」と記す。"],"tables":[]},{"h":"注記・食い違い（e）","lv":2,"text":["- 【姫路城・築城年】Wikipedia基礎情報は1346年（赤松貞範）とするが、記事本文には黒田重隆・職隆による1555〜1561年の拡張を本格的な築城とする説も併記されている。食い違いとして併記する。","- 【姫路城・天守建造年】Wikipedia「現存天守」は1608年（慶長13年）とするが、池田輝政の大改築の完成を1609年とする資料が複数ある。食い違いとして併記する。","- 【姫路城・史蹟指定年】1928年とする資料と、ICOMOS評価書の1929年の記載がある。食い違いとして併記する。","- 【姫路城・建造物数】ユネスコ公式ページは82棟とし、国宝8棟＋重要文化財74棟＝82棟と一致する。ICOMOS評価書は83棟と記す。食い違いとして併記する。","- 【姫路城・重要文化財の内訳】Wikipedia基礎情報は「櫓・渡櫓27棟、門15棟、塀32棟」（計74棟）とする。姫路市公式「姫路城管理運営業務要求水準書」は「櫓27棟、門15棟、塀42棟」と記すが、この内訳の合計は84棟となり、74棟と一致しない。内訳の表記に食い違いがある。","- 【明石城・築城年】1617年（入封・築城命令の年、重要文化財指定説明は「築いたと伝えられる」とする）、1618年（Wikipedia基礎情報、『デジタル大辞泉』）、1619年着工・1620年完成（文化庁 文化遺産データベース）の記載がある。食い違いとして併記する。","- 【明石城・廃城年】Wikipedia基礎情報は1874年（明治7年）とするが、講談社『日本の城がわかる事典』は「明石城は1869年（明治2年）に廃城となった」と記す。食い違いとして併記する。","- 【赤穂城・廃城年】Wikipedia基礎情報は1873年（明治6年）とするが、赤穂市立歴史博物館所蔵資料に基づくパンフレットは「明治5年（1872年）赤穂城廃城決定、明治11年解体開始」と記す。食い違いとして併記する。","- 【竹田城・築城年】Wikipedia基礎情報の1431年（永享3年）と、伝承・朝来市公式の1443年（嘉吉3年）・嘉吉年間（1441〜1443年）の記載がある。食い違いとして併記する。","- 【竹田城・県立歴史博物館の年表記】兵庫県立歴史博物館は「1433（嘉吉3）年」と記すが、嘉吉3年は1443年であり、同ページ内で西暦と元号が一致しない。原文のまま転記した。","- 【竹田城・落城年】1577年（兵庫県立歴史博物館）と1580年（朝来市公式）の記載がある。食い違いとして併記する。また最後の城主の名は「赤松広秀」（Wikipedia）と「赤松広英」（兵庫県立歴史博物館）の表記の差がある。","- 【出石城・廃城年】1868年（城郭建築撤去。Wikipedia）と1871年（明治4年。城郭情報サイト）の記載がある。食い違いとして併記する。","- 【洲本城・築城年】1526年（大永6年）に安宅治興が築いたと伝わるとする記載は二次資料によるもので、洲本市公式の整備基本計画では築城年を確認できなかった。未確認。","- 【龍野城・築城年】1499年（明応8年。Wikipedia基礎情報）と1500年（明応9年）頃とする資料がある。また明応4年と記して1499年とする資料があるが、明応4年は1495年であり一致しない。食い違いとして併記する。","- 【三木城・築城年】基礎情報の「長享2年（1492年）前後」は、長享2年が1488年であるため元号と西暦が一致しない。記事本文の引く『三木戦史』は明応元年（1492年）とする。記事自体が築城時期は諸説あってはっきりしないと記す。","- 【三木城・廃城年】1615年（元和元年。基礎情報および一国一城令による破却とする本文）、1616年（元和2年）、1617年（元和3年。記事の略年表）の記載がある。食い違いとして併記する。","- 【三田城・廃城年】Wikipedia基礎情報は1649年（慶安2年）とするが、九鬼氏時代の三田陣屋は明治4年（1871年）まで存続し（兵庫県教育委員会発掘調査報告書）、明治6年（1873年）の廃城令で廃城となったと記す二次資料がある。城としての廃城と陣屋の存続は分けて併記する。","- 【尼崎城・築城年】1617年（元和3年）に戸田氏鉄が入封し築いたとする記載（Wikipedia本文）と、1618年（元和4年）春から築城開始とする資料がある。食い違いとして併記する。","- 【検算】赤穂城の築城期間「13年」は1648〜1661年の差（13年）と一致する。姫路城の池田輝政による大改築「8年」は1601〜1609年の差（8年）と一致する。その他の城では、出典に年数の記載を確認できなかった。"],"tables":[]},{"h":"取得不可リスト（e）","lv":2,"text":["- 文化遺産オンライン／文化庁「国指定文化財等データベース」の姫路城建造物（国宝・重要文化財）の個別レコード：直接取得できなかった。指定年月日は、姫路市公式資料（同データベースを資料として明記）経由で確認した。","- 龍野城の文化財指定の別（国・県・市）：市の公式ページ等で確認できず、未確認。","- 尼崎城の文化財指定の別（国・県・市）：尼崎市公式ページで確認できず、未確認。","- 洲本城の築城年（1526年・安宅治興）：洲本市公式資料では確認できず、二次資料のみ。未確認。","- 出石城の辰鼓櫓の現存扱い：出典により記載が分かれ、公的出典で確認できなかった。未確認。","---"],"tables":[]}],"f":[{"h":"f-1 江戸時代","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- コトバンク「灘五郷」（改訂新版 世界大百科事典・平凡社） https://kotobank.jp/word/%E7%81%98%E4%BA%94%E9%83%B7-588839 （種別：その他（辞典））","- 近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、種別：公的）※揖保乃糸・淡路島手延べそうめんの「地域との結びつき」「特性」欄","- 農林水産省「うちの郷土料理 出石皿そば 兵庫県」 https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/40_10_hyogo.html （種別：公的）","- 農林水産省「丹波篠山の黒大豆栽培」（日本農業遺産認定資料） https://www.maff.go.jp/j/nousin/kantai/attach/pdf/giahs_3_sasayama-5.pdf （種別：公的）","- 農林水産省「明石鯛 地理的表示登録申請 明細書」（令和7年3月15日付） https://www.maff.go.jp/j/shokusan/gi_act/notice/pnApplication/pdf/0302_specification.pdf （種別：公的）","- 兵庫県公式「北播磨地域 景観資源データベース【西脇市】」 http://web.pref.hyogo.lg.jp/nhk09/documents/database_nishiwaki.pdf （種別：自治体。播州織の項の出典は西脇市HPと明記）","- 関西広域連合「活かしたい自然エリア エコツアー報告書（北摂・南丹）」 https://www.kouiki-kansai.jp/material/files/group/10/ecotour-report_16.pdf （種別：公的）※一庫炭の解説は川西市史2・3巻による","- Wikipedia「菊炭」 https://ja.wikipedia.org/wiki/%E8%8F%8A%E7%82%AD （種別：Wikipedia）"],"tables":[]},{"h":"表","lv":3,"text":[],"tables":[{"cols":["番号","品目","読み","産地","備考（出典の引用）","出典の種別"],"rows":[["1","灘の酒（灘五郷）","なだごごう","西宮市・神戸市東灘区・灘区の沿岸部（摂津国西部）","「灘五郷とは灘の生一本（きいつぽん）の銘醸地の総称で，江戸時代の中期以降より急速に江戸積酒造業が発展し，今日にいたるまで全国有数の酒造地を形成している」「宮水（みやみず）と呼ばれる酒造に好適な地下水の発見（1840）は，灘の酒の品質を大いに高めた」「文化・文政期（1804-30）の最盛期には……摂泉十二郷の江戸入津樽数は100万樽を突破したが，このうち灘五郷で50%以上を占めていた」（世界大百科事典）。なお江戸時代の灘五郷の構成は現在の5郷（今津・西宮・魚崎・御影・西郷）と異なり、上灘三組・下灘・今津であったと同辞典は記す（注記参照）","その他（辞典）"],["2","揖保乃糸（手延べそうめん）","イボノイト","兵庫県（揖保川流域）","「生産地では、揖保川流域の肥沃な土壌を背景に、小麦と水車製粉による小麦粉の生産が盛んであった上、近隣の良質な赤穂塩の入手が容易であったため、古くから素麺作りが行われてきた。約600年に渡る『手延製法』と、『厄』と呼ばれる専用倉庫での熟成方法など、特有の製法を受け継いできた。明治27年には、統一基準による製品検査と等級分けを導入し……生産地を流れる揖保川の名に因んだ『揖保乃糸』に名称を統一した」（近畿農政局GIページ）。「揖保乃糸」の名称自体は明治27年の統一によるもので、江戸時代の時点の名称ではない","公的"],["3","淡路島手延べそうめん","アワジシマテノベソウメン","兵庫県南あわじ市","「原材料の配合や麺の熟成時間だけでなく、麺を延ばす最終工程である『門干し』の方法、さらには製造時期を限定するなど、品質向上のための独自の製法が江戸時代から継承されている」「江戸時代から続けられてきた天日干しの風景は『白糸の芸術』と言われ」（近畿農政局GIページ）","公的"],["4","出石皿そば","いずしさらそば","兵庫県豊岡市出石町","「始まりは、1706年（宝永3年）、信州（長野県）上田から国替えで来た藩主仙石政明（まさあきら）が連れてきたそば職人から。それ以前からあったそば打ち技術に新たな技術が加わり、以来300年以上、改良を加えながら職人の鍛錬によって発展してきた」（農林水産省「うちの郷土料理」）。そばを盛る小皿は出石焼の白磁で直径約13cm、5枚1組が一人前と同ページにある","公的"],["5","丹波黒大豆（丹波篠山の黒大豆）","読みは今回の出典に明記なし（未確認）","丹波篠山地域（現・丹波篠山市）","農林水産省の日本農業遺産資料によれば、「名称に確実に『黒豆』との記述が確認できる最も古い史料は享保15年（1730）刊行の料理本『料理網目調味抄』であり、『くろ豆は丹州笹山の名物なり』『黒豆 丹州笹山よし 押て汁煮染』と記されている」。また享保元年（1716）刊行の地誌『篠山封彊志』にも「黎豆（くろまめ）」が土産のひとつとして記述されている。優良種子生産方式の始まりは江戸時代後期にまで遡り、大庄屋・波部本次郎らが優良な種子を選抜育成した（丹波篠山市のプレスリリースによる）","公的／自治体"],["6","明石鯛","アカシダイ、アカシタイ（明細書の表記）","明石海峡及び明石沖（播磨国明石浦）","農林水産省に提出されたGI登録申請の明細書によれば、「『和漢三才図絵』（1712）、『日本山海名産図絵』（1799）などでも『播州明石浦の産』として紹介されている」「江戸時代には、明石藩主が将軍家に対し、鯛粕漬・生鯛・干鯛を季節の産物として献上していた記録もある」。また『播州名所巡覧図絵』（1804）に、天正9年（1581年）に羽柴秀吉が織田信長に「あかし干鯛千箇」を歳暮として献上したと伝えられる旨の記載があるとする","公的"],["7","播州織（起源）","ばんしゅうおり","西脇市を中心とする北播磨地域","兵庫県の景観資源データベース（出典：西脇市HP）によれば、「『播州織（ばんしゅうおり）』は西脇市を代表する地場産業であり、200年以上の歴史と伝統を誇る。江戸時代中期の寛政4年（1792）に比延庄村の宮大工飛田安兵衛（ひだやすべえ）が京都西陣から織物の技術を持ち帰ったのが起源と伝えられている。その後、農家の副業として、西脇市を中心に北播磨地域で生産されたため、当初は『播州縞（ばんしゅうしま）』と呼ばれていたが、明治時代後期に『播州織』と称されるようになった」。江戸時代の時点の呼称は「播州縞」である","自治体"],["8","菊炭（池田炭・一庫炭）","きくすみ（Wikipedia）。池田炭の読みは出典に明記なし（未確認）","川西市北部の一庫以北・黒川地区（旧摂津国。集荷地は池田）","関西広域連合の報告書（川西市史2・3巻による）によれば、「初めて文献にその名が現れたのは正保2年（1645年）に発刊された『毛吹草』です。『一庫炭…此所より池田の市に出て売なり故に是を池田炭共云』と記されています」。Wikipedia「菊炭」は「北摂地域で作られたクヌギの菊炭は『池田炭』と呼ばれ、茶の湯炭として著名だった」とする","公的／Wikipedia"]]}]},{"h":"f-2 現代","lv":2,"text":[],"tables":[]},{"h":"（1）経済産業大臣指定 伝統的工芸品","lv":3,"text":["出典：伝統的工芸品産業振興協会「伝統的工芸品指定品目一覧・都道府県別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-area_20251027.pdf （2025／令和7年10月27日現在、全国合計244品目、取得日2026-11-18、種別：公的）","同協会「伝統的工芸品指定品目一覧・業種別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （2025／令和7年10月27日現在、取得日2026-11-18、種別：公的）※業種の出典","兵庫県は「6」品目と明記され、並びは「丹波立杭焼　出石焼　豊岡杞柳細工　播州三木打刃物　播州そろばん　播州毛鉤」である。","注記（f-2（1））：","- 候補に挙がっていた「播州織」「播州毛針」は、2025年10月27日現在の都道府県別一覧の兵庫県6品目には含まれていない。一覧にあるのは「播州毛鉤」であって「播州毛針」ではない。","- 「三木金物」は国指定の品目名としては一覧になく、国指定の品目名は「播州三木打刃物」である。兵庫県指定の伝統工芸品とは制度が別であり、混同しないようここに注記する。"],"tables":[{"cols":["番号","品目","読み","産地","備考（業種は業種別一覧による）","出典の種別"],"rows":[["1","丹波立杭焼","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では陶磁器の部17番目に記載","公的"],["2","出石焼","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では陶磁器の部18番目に記載","公的"],["3","豊岡杞柳細工","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工品・竹工品の部26番目に記載","公的"],["4","播州三木打刃物","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では金工品の部14番目に記載","公的"],["5","播州そろばん","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では文具の部4番目に記載","公的"],["6","播州毛鉤","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧ではその他の工芸品の部21番目に記載","公的"]]}]},{"h":"（2）地理的表示（GI）","lv":3,"text":["出典：近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、近畿18産品、取得日2026-11-18、種別：公的）","※同ページ冒頭に「令和8年3月25日、新たに『淡路島手延べそうめん』（兵庫県）が登録されましたので、近畿管内では、現在18産品が登録されています」とある。兵庫県分は6件。","注記（f-2（2））：","- 候補に挙がっていた「淡路島たまねぎ」「東条産山田錦」は、近畿農政局のGI登録産品一覧には含まれていない。両者は地域団体商標として下記（3）の一覧に含まれている。","- 「明石鯛」はGI登録産品ではない。農林水産省には令和7年3月15日付で地理的表示登録の申請書類（申請者：明石鯛ブランド化推進委員会）が公示されている（f-1の出典）。登録の有無については今回の近畿農政局一覧（令和8年3月25日現在）には含まれていない。","- 酒類の地理的表示「灘五郷」は国税庁長官の指定であり、農林水産省のGI登録産品一覧（本表）とは制度が別である（本表には含まれていない）。"],"tables":[{"cols":["番号","品目","読み","登録番号","登録日","生産地","登録生産者団体","出典の種別"],"rows":[["1","但馬牛","タジマギュー（別名：但馬ビーフ（タジマビーフ）、TAJIMA BEEF）","第2号","平成27年12月22日","兵庫県内","神戸肉流通推進協議会","公的"],["2","神戸ビーフ","コウベビーフ（別名：神戸肉（コウベニク）、神戸牛（コウベギュー）、KOBE BEEF）","第3号","平成27年12月22日","兵庫県内","神戸肉流通推進協議会","公的"],["3","佐用もち大豆","サヨウモチダイズ","第78号","令和元年5月8日","兵庫県佐用郡佐用町","佐用もち大豆振興部会","公的"],["4","淡路島3年とらふぐ","アワジシマサンネントラフグ","第144号","令和6年1月29日","兵庫県淡路島福良湾","福良漁業協同組合","公的"],["5","揖保乃糸","イボノイト","第154号","令和6年8月27日","兵庫県","兵庫県手延素麵協同組合","公的"],["6","淡路島手延べそうめん","アワジシマテノベソウメン（別名：淡路そうめん（アワジソウメン））","第176号","令和8年3月25日","兵庫県南あわじ市","淡路手延素麺協同組合","公的"]]}]},{"h":"（3）地域団体商標","lv":3,"text":["出典：近畿農政局「地域団体商標の活用について」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （「近畿における農林水産物・食品の地域団体商標（令和6年1月現在）」、取得日2026-11-18、種別：公的）","※同ページは「近畿管内において地域団体商標を取得し、『ブランド』の保護を図っている農林水産物・食品をご紹介します」と対象を農林水産物・食品に限っており、より新しい近畿版一覧は同ページ上では確認できなかった（令和6年1月現在が同ページの最新時点）。","兵庫県分は32件（一覧の並び・表記のとおり）：但馬牛（うし）、出石皿そば、たじまピーマン、出石そば、加西ゴールデンベリーA、明石鯛、姫路おでん、龍野淡口醤油、淡路ビーフ、淡路島たまねぎ、淡路島3年とらふぐ、黒田庄和牛、東条産山田錦、須磨海苔、神戸ビーフ、神戸肉、神戸牛、但馬ビーフ、但馬牛（ぎゅう）、丹波篠山黒豆、丹波篠山牛、三田肉、三田牛、尼崎あんかけチャンポン、朝倉さんしょ、播州百日どり、ぼうぜがに、ぼうぜ鯖、淡路島サクラマス、淡路島エクストラヴァージンオリーヴオイル、坂越のかき。","注記（f-2（3））：","- 「出石皿そば」と「出石そば」は別項目として両方登録されている。","- 「神戸ビーフ」「神戸肉」「神戸牛」、「但馬牛（うし）」「但馬ビーフ」「但馬牛（ぎゅう）」はそれぞれ別項目である。","- 工芸品・繊維製品を含む地域団体商標の全体像は特許庁の所管であり、同ページも「最新の全ての地域団体商標の案内は特許庁へ」と案内している。特許庁の原資料での確認は今回できていない。"],"tables":[{"cols":["項目","内容"],"rows":[["読み","一覧に記載なし（未確認）。ただし「但馬牛」については、一覧が「但馬牛（うし）」と「但馬牛（ぎゅう）」を別項目として併記している"],["産地","一覧に記載なし（未確認）"]]}]},{"h":"（4）兵庫県公式の認証・選定制度","lv":3,"text":[],"tables":[]},{"h":"制度1：ひょうご食品認証制度（兵庫県認証食品）","lv":4,"text":["出典：兵庫県公式「ひょうご食品認証制度の概要」 https://web.pref.hyogo.lg.jp/nk06/ninshouseidogaiyou.html （取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["項目","内容（出典の記載どおり）"],"rows":[["制度名","ひょうご食品認証制度（認証食品は「兵庫県認証食品」）"],["概要","「兵庫県認証食品制度は、安全性や個性特長など一定の基準を満たした県産の農林水畜産物や加工食品を認証する制度です。認証を通じて県産県消の推進と県産食品の魅力発信を進めています」（兵庫県公式ページ冒頭は「安全・安心で特色のある兵庫県産食品を、兵庫県が認証する制度です」）"],["ブランドの区分","「ひょうご安心ブランド」と「ひょうご推奨ブランド」の2種類。兵庫県公式の説明では、「ひょうご推奨ブランド」は生産方法・品質・地域性等に個性や特長があり、法令の遵守・生産管理体制等の整備が図れていると県が確認した商品。「ひょうご安心ブランド」は推奨ブランドの認証基準に加えて、出荷記録等の整備や残留農薬等についてより厳しい基準をクリアした食品（兵庫県公式「兵庫の食を大切にする」 https://web.pref.hyogo.lg.jp/recommend/learn/learn03.html ）"],["認証条件","（1）個性・特長があること。（2）安全性が確保されていること。（3）生産履歴等が確保できていること"],["認証食品数","2,216食品（令和8年8月現在）。農産物1,680食品（うち安心ブランド1,217、推奨ブランド463）、畜産物36食品（うち安心ブランド5、推奨ブランド31）、水産物30食品（うち安心ブランド1、推奨ブランド29）、加工食品470食品（うち安心ブランド35、推奨ブランド435）。合計の内訳は安心ブランド1,258、推奨ブランド958"],["認証期間","5年"],["認証マーク","県認証マーク（はばタン）を使用できる"]]}]},{"h":"制度2：五つ星ひょうご","lv":4,"text":["出典：「五つ星ひょうご」公式サイト https://www.5stars-hyogo.com/ （兵庫県の選定事業の公式サイト、取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["項目","内容（出典の記載どおり）"],"rows":[["制度名","五つ星ひょうご"],["内容","「『五つ星ひょうご』とは、ひょうご五国（摂津･播磨･但馬･丹波･淡路）の豊かな自然や歴史･文化を生かした産品の中から、ひょうごの良さをアピールする『地域らしさ』と、これまでにない『新しさ』を兼ね備えた商品を『五つ星ひょうご』として選定し、全国に発信することにより観光・物産振興を図っています」"],["時点の情報","同サイトのお知らせに「令和8年度『五つ星ひょうご』選定品の決定」（2026.10.05）がある"]]}]},{"h":"注記・食い違い（f-1）","lv":3,"text":["- 但馬牛・神戸ビーフは江戸時代の表に入れない。 近畿農政局GIページは、素牛の但馬牛について「約1200年も昔から兵庫県北部の但馬地方の山あいで農耕に用いられた役牛が由来。明治期に肉牛として遺伝的に良質な血統であることが認識された」とし、ブランドとしての成立は明治期以降である。現代のGIについてはf-2参照。","- 淡路島たまねぎは江戸時代の表に入れない。 今回取得した公的出典では江戸時代の栽培を確認できなかった（未確認）。地域団体商標の一覧には含まれている（f-2参照）。","- 灘五郷の構成の時代差：現在の灘五郷（今津郷・西宮郷・魚崎郷・御影郷・西郷）は1886年の摂津灘酒造業組合創設以来の名称で、江戸時代の灘五郷は上灘三組（魚崎・御影・大石新在家）と下灘、今津からなっていた（世界大百科事典）。江戸時代に西宮は含まれていない。","- 「揖保乃糸」の名称：明治27年に統一された名称であり、江戸時代の品目名ではない。江戸時代にあたるのは手延製法そのものである。","- 『日本山海名物図会』『日本山海名産図会』『播磨鑑』の原文そのものからの引用は、今回の取得範囲では確認できなかった（下記「取得不可」参照）。明石鯛については、GI登録申請明細書が『日本山海名産図絵』（1799）等の記載を紹介している。"],"tables":[]},{"h":"取得不可（f-1）","lv":3,"text":["- 『日本山海名物図会』『日本山海名産図会』『摂津名所図会』『播磨鑑』の原典テキスト：国立国会図書館デジタルコレクション等への到達を試みたが、今回の取得では本文の逐語引用が可能な形で取得できず、取得不可として扱う（明石鯛・丹波黒大豆については、農林水産省資料が原典の記載を紹介している範囲で転記した）。"],"tables":[]},{"h":"取得不可（f-2）","lv":3,"text":["- 特許庁の地域団体商標の原資料（工芸品・繊維製品を含む全体の登録情報）：今回の取得範囲では原資料に到達できず、取得不可（近畿農政局の農林水産物・食品に限った一覧で代替した）。","- 伝統的工芸品の読み・産地：協会の都道府県別・業種別一覧には読み・産地の記載がないため未確認のまま残した（兵庫県公式の伝統的工芸品紹介での照合は今回未実施）。","---"],"tables":[]}],"g":[{"h":"g-1 摂津国（兵庫県域）","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （Wikipedia）","- 取得日：2026-11-18","注記（前提）：摂津国の国府・一宮・総社・国分寺・国分尼寺はいずれも大阪府域に所在し、第4便（大阪府）で扱った。本節では兵庫県の章に必要な範囲で簡潔に記す。","注記・食い違い：第4便の記載と同一出典（Wikipedia「摂津国」）であり、新たな食い違いは確認されなかった。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","上国。距離は近国","易林本『節用集』に摂津は「南暖北寒、故五穀先熟、魚鹽繁、大上國也」と記されている（記事引用）","Wikipedia"],["2","国府","―","所在地は確定していない。文献では『和名抄』に記載なし、『拾芥抄』は「西生郡」、『節用集』は「西成郡」。史書からの推定地として難波京（大阪市天王寺区国分町）、延暦24年（805年）の江頭（大阪市中央区か、『日本後紀』）、天長2年（825年）の豊島郡（『日本後紀』）、承和11年（844年）の旧鴻臚館（『続日本後紀』）、12世紀の住吉区が挙げられる","いずれも大阪府域","Wikipedia"],["3","一宮","―","住吉大社（大阪府大阪市住吉区）および坐摩神社（大阪府大阪市中央区）","第4便で両論併記済み。記事注記：住吉大社については「中世に住吉大社が一宮を自称した文書はない」。坐摩神社は近世以降一宮と呼ばれるようになった。本節ではこれ以上の詳細は扱わない","Wikipedia"],["4","総社","―","不詳。難波神社とする説がある","多田院境内の「惣社六所権現」は同地の荘園の惣社とされている","Wikipedia"],["5","国分寺（僧寺）","―","後継寺院は2説あり、いずれも創建時の遺構は明らかでない。天徳山国分寺（大阪市天王寺区国分町）／護国山（金剛院）国分寺（大阪市北区国分寺）","いずれも大阪府域","Wikipedia"],["6","国分尼寺","―","（天平）勝宝山法華寺（大阪市東淀川区柴島町）が後継寺院と推定され、境内には国分尼寺のものという礎石が伝わる","大阪府域","Wikipedia"],["7","延喜式内社","―","『延喜式神名帳』に大社26座16社・小社49座46社の計75座62社","兵庫県域の名神大社として武庫郡の広田神社（西宮市）、八部郡の生田神社・長田神社（いずれも神戸市）が記事に挙がる","Wikipedia"]]}]},{"h":"g-2 播磨国","lv":2,"text":["出典：","- Wikipedia「播磨国」 http://ja.wikipedia.org/wiki/播磨国 （Wikipedia）","- 兵庫県立歴史博物館「名所めぐり：播磨国総社（射楯兵主神社）」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_sanyou/harimasousha/ （自治体）","- 宍粟市公式サイト「宍粟市の文化財」 https://www.city.shiso.lg.jp/soshiki/kyoikuiinkai/rekishishiryokan/h_topics/s_cul_p.html （自治体）","- 國學院大學デジタル・ミュージアム「神道・神社史料データベース：射楯兵主神社」 http://jmapps.ne.jp/kokugakuin/det.html?data_id=54228 （その他（学術データベース））","- 取得日：2026-11-18","注記・食い違い：","- 一ツ山大祭の周期の表記差：射楯兵主神社の一ツ山大祭について、Wikipedia「射楯兵主神社」記事は「60年に1度」とし、姫路市公式サイトおよび兵庫県立歴史博物館は「61年ごと」とする（食い違い）。","- 国府の所在地は確定していない（記事は「説が有力視」と表現）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","大国。距離は近国","『延喜式』による区分。変遷の経緯はa-2の番号8参照","Wikipedia"],["2","国府","―","「播磨国府は、『和名抄』によれば飾磨郡にあった。姫路市中心部にある本町遺跡（姫路市総社本町）を国衙跡とする説が有力視されており」、周辺で奈良時代の大量の瓦や建物の柱跡が発見されている","『日本大百科全書』は「所在地はいまの姫路市で，姫路城の東または南東部と推定される」とする。記事は「説が有力」と述べるにとどまり、確定したとは書いていない","Wikipedia"],["3","一宮","伊和神社（いわじんじゃ）","宍粟市一宮町須行名。式内社「宍粟郡 伊和坐大名持御魂神社」の比定社","読みは宍粟市公式サイト「播磨国一の宮伊和神社(いわじんじゃ)」で確認。鎮座地の一宮町（現・宍粟市）の地名は当社に由来する","Wikipedia／自治体"],["4","総社","射楯兵主神社（いたてひょうずじんじゃ）","姫路市総社本町。式内社","読みは國學院大學「神道・神社史料データベース」および神社公式サイト（sohsha.jp）で確認。兵庫県立歴史博物館によれば「1181（養和元）年播磨国16郡の大小明神174座を境内で合祭し播磨国総社となった」。16郡は中世の郡数で、『延喜式』の12郡とは異なる（注記参照）","Wikipedia／自治体／その他（学術データベース）"],["5","国分寺（僧寺）","播磨国分寺跡","姫路市御国野町国分寺。国の史跡。推定寺域は方2町（約218メートル四方）。古代寺院跡に重複して位置する牛堂山国分寺が法燈を伝承する","―","Wikipedia"],["6","国分尼寺","播磨国分尼寺跡","姫路市御国野町国分寺。史跡指定なし。僧寺跡の北約600メートルに位置する。発掘調査により金堂基壇や講堂を囲む雨落溝が確認されている","―","Wikipedia"],["7","延喜式内社","―","『延喜式神名帳』に大社7座5社・小社43座42社の計50座47社","一宮以下の社格一覧は『中世諸国一宮制の基礎的研究』に基づくと記事に明記。二宮は荒田神社（多可郡多可町）、三宮は住吉神社（加西市）、四宮は白国神社（姫路市）","Wikipedia"]]}]},{"h":"g-3 但馬国","lv":2,"text":["出典：","- Wikipedia「但馬国」 http://ja.wikipedia.org/wiki/但馬国 （Wikipedia）","- 兵庫県立歴史博物館「名所めぐり：出石神社」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_tajima/izushijinja/ （自治体）","- 兵庫県立歴史博物館「名所めぐり：粟鹿神社」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_sanindo/awagajinja/ （自治体）","- 但馬検定公式サイト「ザ・たじま」「気多神社」 https://the-tajima.com/spot/51/ （その他（但馬検定））","- 取得日：2026-11-18","注記・食い違い：","- 一宮の食い違い：『中世諸国一宮制の基礎的研究』に基づく一覧（Wikipedia）および兵庫県立歴史博物館は出石神社を一宮とするが、『大日本国一宮記』（室町時代）は粟鹿神社を一宮に挙げ出石神社を記載しない。現在は両社とも但馬国一宮を称する。両論併記とする。","- 国府の初期所在地は「明らかでない」（記事の表現どおり）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","上国。距離は近国","―","Wikipedia"],["2","国府","―","『和名抄』および『拾芥抄』によると、国府は気多郡にあった。初期の国府の所在地には、豊岡市出石町の袴狭（はかざ）遺跡とする説、気多郡（現在の豊岡市日高町）内とする説があるが、「明らかでない」。『日本後紀』によると、延暦23年（804年）に気多郡高田郷に国府が移されたという。豊岡市日高町祢布の祢布ヶ森遺跡がこれに比定される","記事冒頭の諸元表では国府を「1. 未詳 2. 兵庫県豊岡市」とする。延暦23年は年表記のみ","Wikipedia"],["3","一宮","出石神社（いずしじんじゃ）","豊岡市出石町宮内。式内社「出石郡 伊豆志坐神社八座」の比定社","読みと一宮であることは兵庫県立歴史博物館「名所めぐり：出石神社」（「出石神社いずしじんじゃ」「但馬一宮の神社」）で確認。ただし下記の食い違いあり","Wikipedia／自治体"],["4","一宮（別説）","粟鹿神社（あわがじんじゃ）","朝来市山東町粟鹿。式内社（名神大社）","鎌倉時代の「但馬国大田文」では粟鹿神社を二宮とするが、室町時代の『大日本国一宮記』では粟鹿神社を一宮に挙げる（出石神社は記載なし）。「現在は粟鹿神社も但馬国一宮を称し、全国一の宮会に加盟する」。読みは兵庫県立歴史博物館「名所めぐり：粟鹿神社」（「粟鹿神社あわがじんじゃ」「但馬国一の宮と言われる」）で確認","Wikipedia／自治体"],["5","総社","気多神社（けたじんじゃ）","豊岡市日高町上郷。式内社（小社）。旧称「惣社気多大明神」","読みは但馬検定公式サイト「ザ・たじま」で確認","Wikipedia／その他（但馬検定）"],["6","国分寺（僧寺）","但馬国分寺跡","豊岡市日高町国分寺。国の史跡。寺域は1町半（約160メートル）四方。跡地付近の護国山国分寺が法燈を伝承する","―","Wikipedia"],["7","国分尼寺","但馬国分尼寺跡","豊岡市日高町水上・山本。国分寺跡から北方の豊岡市立日高東中学校付近。礎石が伝世され、尼寺の遺構とされる。北方の天台山法華寺が後継を称する","―","Wikipedia"],["8","延喜式内社","―","『延喜式神名帳』に大社18座10社・小社113座106社の計131座116社","一宮以下の一覧は『中世諸国一宮制の基礎的研究』に基づくと記事に明記。三宮は水谷神社（養父市）／養父神社（養父市）の2説","Wikipedia"]]}]},{"h":"g-4 淡路国","lv":2,"text":["出典：","- Wikipedia「淡路国」 https://ja.wikipedia.org/wiki/淡路国 （Wikipedia）","- 兵庫県立歴史博物館「名所めぐり：伊弉諾神宮」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_awaji/izanagijingu/ （自治体）","- 取得日：2026-11-18","注記・食い違い：なし（本便の範囲では出典間の食い違いは確認されなかった）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","下国。距離は近国","―","Wikipedia"],["2","国府","―","「『和名抄』によれば、国府は三原郡にあった。現在の南あわじ市（旧三原郡三原町）神代国衙にあったと推定されるが、遺跡はまだ見つかっていない」","確定していない","Wikipedia"],["3","一宮","伊弉諾神宮（いざなぎじんぐう）","淡路市多賀。式内社「津名郡 淡路伊佐奈伎神社」の比定社（名神大社）。『延喜式』には伊佐奈伎神社と記述がある","読みと淡路国一宮であることは兵庫県立歴史博物館「名所めぐり：伊弉諾神宮」（「伊弉諾神宮いざなぎじんぐう」「淡路国一宮であり」）で確認。地元では「いっくさん」と尊称される","Wikipedia／自治体"],["4","総社","総社十一明神社","南あわじ市十一カ所。「名神大社2社以外の式内社11社の祭神が祀られている」","読みは公的・神社公式の出典で確認できず未確認","Wikipedia"],["5","国分寺（僧寺）","淡路国分寺","「国分僧寺は、江戸時代に造営された護国山国分寺のある南あわじ市国分寺寺内に比定されている。今は、塔の心礎と跡石が残っているが、その礎石は創建当時の位置を保っておらず、伽藍の遺構も確認されていない。諸国国分寺で唯一創建当時の作とみられる丈六の釈迦如来坐像がある」","―","Wikipedia"],["6","国分尼寺","―","記事冒頭の諸元表では「（推定）兵庫県南あわじ市」とのみある","記事の「国分寺・国分尼寺」の節には僧寺の記述のみで、尼寺の所在地に関する本文の記述は確認できなかった","Wikipedia"],["7","延喜式内社","―","『延喜式神名帳』に大社2座2社・小社11座11社の計13座13社。大社2社はいずれも名神大社（津名郡 淡路伊佐奈伎神社、三原郡 大和大国魂神社）","二宮は大和大国魂神社、三宮は伊勢久留麻神社（記事）","Wikipedia"]]}]},{"h":"g-5 丹波国","lv":2,"text":["出典：","- Wikipedia「丹波国」 https://ja.wikipedia.org/wiki/丹波国 （Wikipedia）","- 京都府公式サイト「亀岡市の神社・仏閣」 https://www.pref.kyoto.jp/nantan/kankou/1236315163804.html （自治体）","- 取得日：2026-11-18","注記（前提）：丹波国の国府・一宮・総社・国分寺・国分尼寺はいずれも京都府域に所在し、兵庫県域（多紀郡・氷上郡）には所在しない。制度の記録として国全体分を記す。","注記・食い違い：なし（本便の範囲では出典間の食い違いは確認されなかった）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","上国。距離は近国","―","Wikipedia"],["2","国府","―","『和名抄』に「国府在桑田郡高低上一日下半日」とあることから、10世紀には桑田郡（現在の亀岡市周辺）にあったとされる。「しかしながら国府の位置は確定できておらず、現在も諸説がある」。諸説：桑田郡 案察使（亀岡市保津町）説、桑田郡 三宅（亀岡市三宅町）説、桑田郡 千代川（亀岡市千代川町）説（10世紀までの候補地として有力）、船井郡 屋賀（南丹市八木町屋賀）説。また、千代川にあった国府が平安末から鎌倉初期にかけて屋賀に移転したとする説もある","確定していない（記事の表現どおり）","Wikipedia"],["3","一宮","出雲大神宮（いずもだいじんぐう）","京都府亀岡市千歳町。式内社（名神大社）。旧称「出雲神社」、別称「元出雲」「千年宮」","読みは京都府公式サイト「出雲大神宮（いずもだいじんぐう」で確認。式内社「出雲神社」には出雲大神宮（亀岡市千歳町）と出雲神社（亀岡市本梅町）の論社二社がある（記事）","Wikipedia／自治体"],["4","総社","宗神社","京都府南丹市","記事は「推定」と明記する。鎮座地の屋賀には「丹波国総社の説のある宗神社も鎮座している」とある。読みは公的・神社公式の出典で確認できず未確認","Wikipedia"],["5","国分寺（僧寺）","丹波国分寺","京都府亀岡市千歳町国分。現在は同じ位置に護国山国分寺が立ち、法灯を伝承する","―","Wikipedia"],["6","国分尼寺","丹波国分尼寺","京都府亀岡市河原林町。通称「御上人林廃寺跡」","―","Wikipedia"],["7","延喜式内社","―","『延喜式神名帳』に大社5座4社・小社66座65社の計71座69社。大社はいずれも名神大社","兵庫県域の式内大社として多紀郡の櫛石窓神社二座（櫛石窓神社、丹波篠山市）が記事に挙がる。二宮以下はない（記事）","Wikipedia"]]}]},{"h":"暦に関する注記（a・g共通）","lv":2,"text":["- 延暦12年（793年）3月9日（摂津職廃止・摂津国設置）、和銅6年（713年）4月3日（丹後分立）は、出典が和暦表記のみのため旧暦の日付として扱う。","- 延暦23年（804年）の但馬国府移転、712年（和銅5年）の播磨国の大目、天武天皇4年（675年）の但馬国名の初見、天智天皇3年（664年）の百済郡設置は、いずれも出典が年のみの表記である。","- 明治4年11月20日（1871年12月31日）、明治4年11月2日（1871年12月13日）は出典が旧暦・新暦を併記している。1876年8月21日の第2次府県統合は改暦（1873年）後のため新暦である。","---"],"tables":[]},{"h":"取得不可だったページ・確認できなかった事項（a・g）","lv":2,"text":["1. 伊和神社の神社公式サイト：兵庫県神社庁の神社検索 事業","1934年に中谷常太郎が東亞特殊電機製作所として神戸で創業。同社資料に「非常用放送設備で国内トップシェア」とある。業務用の音響機器とセキュリティ機器の専門メーカー","その他（企業公式）・Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 菊正宗酒造の設立日：公式会社概要は「大正8年11月10日（1919年）」とするが、Wikipediaは「1919年11月20日」としており食い違う。表は公式の記載を採用した。","- 沢の鶴の設立年：Wikipediaは「1919年」（石崎株式会社に組織変更）とするが、求人情報（マイナビ転職の会社概要）は「設立 1898年（創業：1717年）」としており食い違う。同社公式の会社概要（プレスリリース）には設立年の記載がないため、表では「未確認」とした。","- オリバーソースの法人設立年：Wikipediaは法人設立を1947年とするが、同社公式沿革では昭和22年（1947年）5月は「道満食品工業株式会社」への社名変更とされており、「設立」とは記されていない。公式会社概要が掲げるのは「創業 1923年（大正12年）3月1日」のみのため、法人設立年は公式では確認できず「未確認」に準じて扱った。","- 川崎重工業の創業地：創業（1878年、川崎築地造船所の開設）は東京であり、神戸での法人設立は1896年である。h-1の条件「本社が兵庫県内」は現在の本店・神戸本社で満たすため収録し、経緯は備考に明記した。","- ユーハイムの創業地：創業（1909年）は青島（中国）であり、日本における1号店は横浜（1922年）、神戸への進出は1923年である。本社が神戸市にあるため h-1 に収録し、経緯は備考に明記した。","- ケンコーマヨネーズ（h-2候補）：同社公式会社概要は「本店所在地 兵庫県神戸市灘区都通3丁目3番16号」「（東京本社）東京都杉並区高井戸東3丁目8番13号」とし、創立は1958年3月。Wikipediaは「東京都杉並区に本社を置くマヨネーズを中心とした調味料製造メーカーである」「東京に本社があるが、発祥の地が神戸であるため、登記上本店は兵庫県神戸市灘区都通3丁目3番16号に存在している」とする。本社機能が東京都にあるため、h-2の定義（現在、本社が兵庫県内にある）に照らして本体には入れず、ここに区別して記す。","- イカリソース：創業は1896年だが大阪市（山城屋、大阪市阿波座）での創業であり、現在の本社事務所も大阪市福島区にある。登記上の本店と西宮工場は西宮市鳴尾浜にあるが、創業・本社とも大阪府のため h-1 本体には入れない。","- モロゾフ：神戸市に本社を置く洋菓子メーカーだが、創業は1931年で2026年時点で100年に満たないため、h-1の対象外とした（候補提示時の注意どおり）。","- UCCグループの統括会社：旧ユーシーシーホールディングス株式会社は2023年12月22日にUCC Capital株式会社へ商号変更し、グループ統括は2024年1月にシンガポールのUCC Holdings Pte. Ltd.へ移行した。このため h-2 には候補名「UCCホールディングス」ではなく、日本の中核事業会社ユーシーシー上島珈琲を収録した。また候補で示された創業年「1932年」は出典で確認できず、公式沿革・Wikipediaとも1933年（5月1日）とするため、1933年を採用した。","- 今回未収録（社名のみ。出典での裏取りが今回の範囲で及ばなかったもの、またはグループ会社として親会社に内包したもの）：日本盛、白鷹、バンドー化学、住友ゴム工業、ノーリツ、川崎車両、カワサキモータース（川崎重工業から分社）。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 本調査で取得不可だったページはなし。","- ただし次の各社は、公式サイトの会社概要ページそのものではなく、同社発行のプレスリリース・グループ会社の資料・Wikipedia等で代替確認した（公式ページの直接取得は未実施）：白鶴酒造、辰馬本家酒造、神戸製鋼所、TOA、フジッコ、ノエビアホールディングス。"],"tables":[]}],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai","kokumei"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun","han","tenryo","senko"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"県名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai","kokumei"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["県域は摂津・播磨・但馬・淡路・丹波の5国を中心とし、兵庫県公式は赤穂市の福浦（備前国）と佐用町の旧石井村周辺（美作国）を含めて「七国にまたがる」とする。本章は5国を扱い、備前・美作は扱わない。","各国の郡・郷数（摂津13郡78郷と、列挙12郡75郷の食い違いなど）はWikipediaのみ。","兵庫県公式「県域の変遷」は、第3次兵庫県の見出しを「明治9年7月」、本文を「8月」とし、月が食い違う。"],"b":["藩と藩主はWikipediaのみ。赤穂藩の石高、三田藩の入部年、篠山藩の就封（慶長14年を1608年と書く誤り）などに、記事内の食い違いがある。","藩主の読みの多くが未取得（自治体出典での確認は未実施）。竹田藩の記事は未整備。","淡路は徳島藩の領で、洲本城代（稲田家）が置かれた。廃藩置県の時点で兵庫県域ではない。"],"c":["統合で廃された県の数は、県公式が「30を超える」、Wikipediaの一覧から数えると19県で食い違う（数え方の違いとみられるが未確認）。","1869年7月17日の太政官布告（府は京都・東京・大阪に限る）は旧暦の日付。新暦では1869年8月24日で、出典には換算の記載がない。","兵庫県（第2次）の再発足日は、Wikipediaの記事間で食い違う（明治4年7月14日か、11月20日か）。生野県の豊岡県への合併日も、11月2日と11月15日で食い違う。","淡路国津名郡の名東県への編入の細部は、記事間で食い違う。","国立公文書館（アジア歴史資料センター）での布告本文の照合は未実施。","1868年2月15日（慶応4年1月22日）の兵庫鎮台の設置は、大阪鎮台の設置日と同じ日で、新暦の換算が一致する。"],"d":["県名は「兵庫」の地名（兵庫津）に由来する。役所が兵庫に置かれたためとされるが、兵庫県公式自身が「推測」と明記している。","「兵庫」の語源（兵器庫の「つわものぐら」説）は仮説。県公式は「よくわかっていません」、国土交通省は「ちなんでいます」と断定調で、表現が食い違う。年代も645年（国土交通省）と天智天皇の治世（Wikipedia）で食い違う。","兵庫県設置の「5月23日」は旧暦（新暦では1868年7月12日）。"],"e":["兵庫県内の現存天守は姫路城のみ。姫路城の国宝・世界遺産・特別史跡は、姫路市とユネスコの資料で照合した。","築城年・廃城年は、姫路城・明石城・赤穂城・竹田城・出石城・三木城・三田城・尼崎城などで、出典間の食い違いがある（併記している）。","三木城・龍野城・竹田城では、出典の元号と西暦が一致しない箇所がある（長享2年＝1488年、明応4年＝1495年、嘉吉3年＝1443年）。","龍野城・尼崎城の文化財指定、洲本城の築城年、出石城の辰鼓櫓の現存扱いは未確認。"],"f":["灘五郷・揖保乃糸・出石皿そば・丹波黒大豆・明石鯛などの江戸時代の起源は、農林水産省の資料などで確認した。原典の『日本山海名産図会』などの逐語引用は取得できていない。","但馬牛・神戸ビーフ・淡路島たまねぎは、江戸時代の表に入れていない（公的出典で江戸時代の記録を確認できていない）。","伝統的工芸品6品目は協会の一覧で確認（読み・産地は一覧にない）。GIは6件、令和8年3月25日に淡路島手延べそうめんが登録された。","地域団体商標の一覧は令和6年1月時点で、農林水産物・食品に限る。商標の登録は「名産」と同義ではない。"],"g":["旧国の制度は、Wikipediaが中心。一宮の読みと一宮であることは、自治体・神社の資料で確認したものがある。","総社十一明神社（淡路）と宗神社（丹波）の読み、淡路国分尼寺の所在地は未確認。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","川崎重工業・神戸製鋼所は本店が神戸だが、東京にも本社がある。ケンコーマヨネーズは同じ理由で注記のみ。本店と本社機能の、どちらを基準にするかは未統一。","川崎重工業の創業地は東京、ユーハイムの創業地は青島で、本社が神戸のため入れている。","沢の鶴の設立年（Wikipediaは1919年、求人情報は1898年）、オリバーソースの法人設立年は、公式で未確認。","UCCは、旧統括会社が改称・移管されたため、中核事業会社のユーシーシー上島珈琲を収録している。","モロゾフは創業1931年のため老舗の対象外。日本盛・白鷹・住友ゴムなどは未収録（未確認）。"]}},{"id":"mie","title":"三重県","sub":"旧伊勢国・伊賀国・志摩国・紀伊国（三重県域）","meta":["取得日：2026-11-18","範囲：三重県の項目a〜h（旧国名／藩／廃藩置県後の府県統合／県名の由来／城／名産／旧国の制度／企業）"],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai","kokumei"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun","han","tenryo","mikuriya","senko"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"県名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai","kokumei"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["三重県域は伊勢・伊賀・志摩の3国と、紀伊国の一部（旧熊野エリア）。","旧国の別称・郡数はWikipediaのみ。"],"b":["藩と藩主はWikipediaのみ（久居藩は独立記事を取得できず、参考出典による）。竹原藩・伊勢岩手藩・井生藩は名称のみ。","伊勢亀山藩の三宅家の石高の表記が未確認。"],"c":["伊賀は安濃津県、志摩は度会県に属した（再確認済み）。県公式で照合できたのは1876年4月18日の合併と県名の由来のみで、ほかの日付はWikipediaのみ。JACARでの照合は未実施。"],"d":["県名は、県庁の移転に伴い三重郡から付けた（県公式などで確認）。"],"e":["城の築城者・築城年・廃城年・現状はWikipediaのみ。"],"f":["伊勢うどんの成立と名称の由来は、文化庁・農林水産省の資料で確認した。","伊勢茶の江戸時代の成立時期、真珠養殖の開始年次、松阪牛の前身の公的照合は未実施。","伝統的工芸品5品目は協会一覧による。経済産業省の一覧での直接照合は未実施。"],"g":["旧国の制度はWikipediaのみが出典。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","住友電装は創業1917年（設立は東海電線）で、公式の会社概要で確認した。","おやつカンパニーは1948年創業で、h-1の対象外。","創業年の一部は公式沿革で未照合。"]},"a":[{"h":"概要・出典","lv":2,"text":["取得日：2026-11-18","範囲：三重県の項目a〜h（旧国名／藩／廃藩置県後の府県統合／県名の由来／城／名産／旧国の制度／企業）"],"tables":[]},{"h":"県域と旧国の対応","lv":2,"text":["出典：","- Wikipedia「三重県」https://ja.wikipedia.org/wiki/三重県 （取得日：2026-11-18、Wikipedia）","- Wikipedia「伊勢国」https://ja.wikipedia.org/wiki/伊勢国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「伊賀国」https://ja.wikipedia.org/wiki/伊賀国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「志摩国」https://ja.wikipedia.org/wiki/志摩国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「紀伊国」https://ja.wikipedia.org/wiki/紀伊国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「三重県」の記述：「令制国では、伊勢国・志摩国・伊賀国の全域と紀伊国（当初は熊野国）の一部、計4国より構成される。包括する旧律令国の数は、7国を包括する兵庫県に次ぐ。」","- 1876年（明治9年）4月18日の第2次府県統合により三重県と度会県が合併して現在の三重県となった（同記事）。","- 各国の相当領域は、伊勢国＝三重県の北中部（ほか愛知県弥富市・愛西市の一部、岐阜県海津市の一部）、伊賀国＝三重県西部（伊賀市・名張市）、志摩国＝三重県東部（志摩半島東端）、紀伊国＝和歌山県と三重県南部。","- 紀伊国のうち三重県域は、三重県南牟婁郡紀宝町・御浜町、熊野市、尾鷲市、北牟婁郡紀北町、度会郡大紀町の一部（錦）である（「紀伊国」記事）。すなわち三重県域の旧紀伊国分は旧牟婁郡の東部（旧熊野エリア）である。","---","出典：","- Wikipedia「伊勢国」https://ja.wikipedia.org/wiki/伊勢国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「伊賀国」https://ja.wikipedia.org/wiki/伊賀国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「志摩国」https://ja.wikipedia.org/wiki/志摩国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「紀伊国」https://ja.wikipedia.org/wiki/紀伊国 （取得日：2026-11-18、Wikipedia）"],"tables":[]},{"h":"a-1 伊勢国","lv":2,"text":["伊勢国の郡（13郡）：桑名郡・員弁郡・朝明郡・三重郡・鈴鹿郡・河曲郡・奄芸郡・安濃郡・一志郡・飯高郡・飯野郡・多気郡・度会郡","注記：","- 「伊勢国（いせのくに）は…令制国の一つ。東海道に属する。」（記事冒頭文）","- 天武天皇9年（680年）7月に伊賀国を分置。8世紀はじめまでに志摩国を分立（正確な時期は不明）。"],"tables":[{"cols":["番号","国名","読み","別称","所属する道","国力（等級）","距離","郡数・郷数","相当領域","出典の種別"],"rows":[["1","伊勢国","いせのくに","勢州（せいしゅう）","東海道","大国","近国","13郡84郷","三重県の北中部・愛知県弥富市の一部・愛知県愛西市の一部・岐阜県海津市の一部","Wikipedia"]]}]},{"h":"a-2 伊賀国","lv":2,"text":["伊賀国の郡（4郡）：阿拝郡・山田郡・伊賀郡・名張郡（当初は2郡、後に4郡）","注記：","- 680年（天武天皇9年）に伊勢国から分立した。"],"tables":[{"cols":["番号","国名","読み","別称","所属する道","国力（等級）","距離","郡数・郷数","相当領域","出典の種別"],"rows":[["1","伊賀国","いがのくに","伊州（いしゅう）・賀州（がしゅう）","東海道","下国","近国","4郡18郷","三重県西部（伊賀市・名張市）","Wikipedia"]]}]},{"h":"a-3 志摩国","lv":2,"text":["志摩国の郡（2郡）：答志郡・英虞郡（当初は佐芸郡、すぐに英虞郡に改名）","注記：","- 明治維新直前の領域は、現在の三重県鳥羽市全域と志摩市の大部分（磯部町山原・磯部町栗木広・磯部町桧山を除く）。","- 当初は度会郡南伊勢町・大紀町の錦地区・北牟婁郡紀北町・尾鷲市全域まで志摩郡に含まれた。天正10年（1582年）、荷坂峠を境に紀伊国牟婁郡と伊勢国度会郡に編入され、現在の鳥羽市・志摩市だけに限定された。"],"tables":[{"cols":["番号","国名","読み","別称","所属する道","国力（等級）","距離","郡数・郷数","相当領域","出典の種別"],"rows":[["1","志摩国","しまのくに","志州（ししゅう）","東海道","下国","近国","2郡14郷","三重県東部（志摩半島東端）","Wikipedia"]]}]},{"h":"a-4 紀伊国（三重県域分＝旧熊野エリア）","lv":2,"text":["紀伊国の郡（7郡）：名草郡・海部郡・那賀郡・伊都郡・有田郡（在田郡）・日高郡・牟婁郡","注記：","- 紀伊国の所属は南海道である（東海道ではない）。","- 三重県域は牟婁郡の東部で、三重県南牟婁郡紀宝町・御浜町、熊野市、尾鷲市、北牟婁郡紀北町、度会郡大紀町の一部（錦）（ほか奈良県五條市の一部）。","- 牟婁郡は明治の廃藩置県に際して四分され、東牟婁郡・西牟婁郡は和歌山県に、南牟婁郡および北牟婁郡は三重県に編入された（1879年〈明治12年〉）。","---"],"tables":[{"cols":["番号","国名","読み","別称","所属する道","国力（等級）","距離","郡数・郷数","相当領域","出典の種別"],"rows":[["1","紀伊国","きいのくに","紀州（きしゅう）・きのくに","南海道","上国","近国","7郡55郷","和歌山県、三重県南部","Wikipedia"]]}]}],"b":[{"h":"概要・出典","lv":2,"text":["出典：","- Wikipedia「藩の一覧」https://ja.wikipedia.org/wiki/藩の一覧 （取得日：2026-11-18、Wikipedia）","- Wikipedia「伊勢国」https://ja.wikipedia.org/wiki/伊勢国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「津藩」https://ja.wikipedia.org/wiki/津藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「桑名藩」https://ja.wikipedia.org/wiki/桑名藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「伊勢亀山藩」https://ja.wikipedia.org/wiki/伊勢亀山藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「長島藩」https://ja.wikipedia.org/wiki/長島藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「神戸藩」https://ja.wikipedia.org/wiki/神戸藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「菰野藩」https://ja.wikipedia.org/wiki/菰野藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「田丸藩」https://ja.wikipedia.org/wiki/田丸藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「伊賀上野藩」https://ja.wikipedia.org/wiki/伊賀上野藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「鳥羽藩」https://ja.wikipedia.org/wiki/鳥羽藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「紀伊国」https://ja.wikipedia.org/wiki/紀伊国 （取得日：2026-11-18、Wikipedia）","「藩の一覧」記事の凡例の注記（原文）：「設立後、すぐに廃藩となった藩などは記されていない場合がある」","「藩の一覧」における三重県域の藩の掲載：伊勢国＝長島藩・桑名藩・菰野藩・伊勢亀山藩・神戸藩・津藩（安濃津藩）・久居藩（津藩支藩）・八田藩・伊勢西条藩・南林崎藩・伊勢上野藩・伊勢林藩・雲出藩・松坂藩・竹原藩＜八知藩＞・伊勢岩手藩・田丸藩・井生藩。伊賀国＝伊賀上野藩のみ。志摩国＝鳥羽藩のみ。紀伊国＝紀州藩（和歌山藩）・田辺藩（紀州藩附家老）・新宮藩（紀州藩附家老）。","注記・食い違い：","- 田丸の久野家について：「田丸藩」記事は「一般的な『藩』の定義からは外れるものの、田丸久野家の知行地ないしは管轄地についても『田丸藩』と呼称されることがある」と記す。久野家は紀州藩御附家老で田丸城代を世襲し、知行地1万石、田丸領の管轄地は231か村・6万2013石（享保13年（1728年）成立の「御領分諸色数并土地之事」による。なお管轄地の石高は「5万石とも6万石とも」される旨の記事注釈がある）。歴代は久野宗成・宗晴・宗俊・俊正・俊純・輝純・昌純・純固の8代で、最後の当主は久野純固（文政6年-明治2年）。","- 食い違い（伊勢亀山藩）：「伊勢国」記事の藩表は「松平乗邑（6万石、1669年-1717年）」「板倉家（5万石、1717年-1744年）」と記すが、「伊勢亀山藩」記事本文の時系列では、板倉重常の入封は寛文9年（1669年）の石川憲之の淀移封後、板倉重治が宝永7年（1710年）に鳥羽藩へ移封、松平乗邑が入って享保2年（1717年）に淀へ移封、板倉重治が再封、延享元年（1744年）に石川総慶が入封したとされる。両出典で板倉家・松平乗邑の期間表記が食い違うため、両論を併記する。","- 伊勢亀山藩の三宅家の石高について、「伊勢亀山藩」記事の歴代藩主表の見出し表示と本文・「伊勢国」記事の藩表（1万石→1万2000石）の間で表記に揺れが見られた。要再確認として注記する。","---"],"tables":[{"cols":["番号","藩名","読み","初代藩主（読み）","最後の藩主（読み）","石高","期間","備考","出典の種別"],"rows":[["1","津藩","つはん","富田信高（―（記事に読みなし））","藤堂高潔（―（記事に読みなし））","富田家5万石→7万石／藤堂家22万950石→27万950石→32万3950石→27万3950石→27万950石","1595年-1871年（藤堂家は1608年-1871年）","藩庁は津城（安濃津城）。「安濃津藩（あのつはん）と呼ばれることもある」。藤堂高虎が慶長13年（1608年）8月25日に22万石で入封。第12代・藤堂高潔が1871年6月28日に就任し、1871年8月29日（明治4年7月14日）の廃藩置県で廃藩、安濃津県となった","Wikipedia"],["2","久居藩","ひさいはん","藤堂高通（たかみち）","藤堂高邦（―（記事に読みなし））","5万石→5万3000石→5万8700石","1669年-1871年","津藩支藩。居城は久居陣屋。寛文9年（1669年）9月29日、第2代津藩主・藤堂高次の隠居に際し次男・藤堂高通に5万石を分与して立藩（「津藩」記事）。Wikipediaに独立記事はなく、取得不可（末尾参照）。初代・最後の藩主名は参考出典による","Wikipedia／その他（幕末歴史ガイド・Reichsarchiv、参考）"],["3","桑名藩","くわなはん","本多忠勝（―（記事に読みなし））","松平定教（―（記事に読みなし））","本多家10万石／松平（久松）家第1期11万石→11万7000石→11万石→11万3000石／松平（奥平）家10万石／松平（久松）家第2期11万3000石→6万石","1601年-1871年","藩庁は桑名城。本多忠勝が慶長6年（1601年）1月1日に10万石で入封し立藩。最後の松平定教は1869年8月15日に6万石に減封の上で存続が決まり、9月20日に知藩事に任じられた。廃藩置県で桑名県→安濃津県→三重県","Wikipedia"],["4","伊勢亀山藩","いせかめやまはん","関一政（かずまさ）","石川成之（なりゆき）","関家3万石／松平忠明5万石／三宅家1万石→1万2000石／本多俊次5万石／石川憲之5万石／松平乗邑6万石／板倉家5万石／石川家6万石","1600年-1871年","藩庁は伊勢亀山城。丹波亀山藩と区別して「伊勢亀山藩」と称する","Wikipedia"],["5","長島藩","ながしまはん","菅沼定仍（さだより）","増山正同（まさとも）","菅沼家2万石／松平（久松）家1万石／増山家2万石","1601年-1871年（1621年-1649年は幕府領で中断）","居城は長島城。慶長6年（1601年）菅沼家2万石で立藩、元和7年（1621年）膳所移封で一時廃藩、慶安2年（1649年）松平康尚1万石で再立藩、元禄15年（1702年）松平忠充改易、増山正弥2万石で入封し以後8代。廃藩置県で長島県→安濃津県に編入","Wikipedia"],["6","神戸藩","かんべはん","一柳直盛（―（記事に読みなし））","本多忠貫（―（記事に読みなし））","一柳家5万石／石川家1万石→2万石→1万7000石／本多家1万石→1万5000石","1601年-1871年（1636年-1651年は幕府領で中断）","「神戸藩（かんべはん）は、伊勢国河曲郡の神戸城（三重県鈴鹿市神戸）を居城とした藩」。最後は本多忠貫（7代）。廃藩置県で神戸県→安濃津県→三重県","Wikipedia"],["7","菰野藩","こものはん","土方雄氏（かつうじ）","土方雄志（かつゆき）","1万2000石","1600年-1871年","土方家、外様。最後の雄志は13代（1870年-1871年）","Wikipedia"],["8","田丸藩","たまるはん","稲葉道通（―（記事に読みなし））","稲葉紀通（―（記事に読みなし））","4万5700石","1600年-1616年","居城は田丸城（現在の三重県度会郡玉城町田丸字城山）。「関ヶ原の合戦後、伊勢岩出城主・稲葉道通が加増を受け、田丸城に移って4万5700石を領したが、大坂の陣後の元和2年（1616年）に摂津中島藩に移封されて廃藩となった」。その後1619年に紀州藩領となり、御附家老・久野宗成が田丸城代となった（下記注記参照）","Wikipedia"],["9","松坂藩","まつさかはん","古田重勝（―（記事に読みなし））","古田家（記事の藩表は家名のみ）","5万5000石","1600年-1619年","「伊勢国」記事の藩表では「松坂藩 古田家（5万5千石、1600年-1619年）領地は紀州藩領に」。城の記事名は「松坂城」で「現在は松阪城とも表記される」","Wikipedia"],["10","伊勢上野藩","いせうえのはん","分部家（記事の藩表は家名のみ）","分部家（同上）","2万石","1600年-1619年","「伊勢国」記事の藩表では「伊勢上野藩 分部家（2万石、1600年-1619年）領地は紀州藩領に」。伊賀国の伊賀上野藩とは別の藩","Wikipedia"],["11","八田藩","はったはん","加納家（記事の藩表は家名のみ）","加納家（同上）","1万石→1万3000石","1726年-1826年","「伊勢国」記事の藩表による","Wikipedia"],["12","伊勢西条藩","いせさいじょうはん","有馬家（記事の藩表は家名のみ）","有馬家（同上）","1万石","1727年-1737年（1745年）","「伊勢国」記事の藩表による。期間の表記は記事のまま","Wikipedia"],["13","南林崎藩","みなみはやしざきはん","有馬家（記事の藩表は家名のみ）","有馬家（同上）","1万石","1737年（1745年）-1781年","「伊勢国」記事の藩表による。期間の表記は記事のまま","Wikipedia"],["14","林藩","はやしはん","織田信重（―（記事に読みなし））","織田信重（同上）","1万石","1600年-1615年","「伊勢国」記事の藩表では「林藩 織田信重（1万石、1600年-1615年）改易・廃藩」","Wikipedia"],["15","雲出藩","くもづはん","蒔田広定（―（記事に読みなし））","蒔田広定（同上）","1万石","1600年-1603年","「伊勢国」記事の藩表による","Wikipedia"],["16","伊賀上野藩","いがうえのはん","筒井定次（―（記事に読みなし））","筒井定次（同上）","20万石","1585年-1608年","居城は伊賀上野城。別名は伊賀藩（いがはん）。天正13年（1585年）閏8月18日、豊臣秀吉の命により筒井定次が大和郡山から伊賀上野20万石に移封（伊賀一国12万石・伊勢国内5万石・山城国内3万石）。慶長13年（1608年）に筒井氏が改易され廃藩。その後、伊賀一国は藤堂高虎が領有し伊勢津藩の一部に組み込まれた（藤堂家が伊賀上野城に城代を置いた）。したがって「藤堂藩」という藩は存在せず、伊賀国は津藩領である","Wikipedia"],["17","鳥羽藩","とばはん","九鬼守隆（もりたか）","稲垣長敬（ながひろ）","九鬼家3万5000石→5万5000石→5万6000石／内藤家3万5000石／土井家7万石／松平（大給）家6万石／板倉家5万石／松平（戸田）家7万石／稲垣家3万石","1600年-1871年（1680年-1681年は幕府直轄で中断）","藩庁は鳥羽城（志摩国答志郡、現在の三重県鳥羽市鳥羽）。稲垣家は8代続いた。明治4年（1871年）の廃藩置県で鳥羽県、さらに度会県を経て三重県に編入","Wikipedia"],["18","紀州藩の三重県域分","きしゅうはん","徳川頼宣（―（記事に読みなし））","徳川茂承（―（記事に読みなし））","藩全体55万5000石（うち伊勢国内約18万石）","1619年-1871年","紀州藩の領地は紀伊一国のみならず伊勢国内の約18万石も含まれた。伊勢国内の紀州藩領は松坂領・白子領・田丸領の3地域に分けて管轄され「伊勢三領」「勢州三領」と総称された（「田丸藩」記事）。藩主家は桑山家（1600年-1601年、2万石）→浅野家（1601年-1619年、37万6000石）→紀州徳川家（1619年-1871年、55万5000石）（「紀伊国」記事）。紀伊田辺藩（安藤家、紀州藩附家老、3万8000石）・紀伊新宮藩（水野家、紀州藩附家老、3万5000石）は現在の和歌山県域で、三重県域には含まれない","Wikipedia"],["19","名張藤堂家（名張藩ではない）","なばりとうどうけ","藤堂高吉（―（記事に読みなし））","―","1万5000石（分知後）","1636年-1868年","藩ではない。藤堂高虎の養子・藤堂高吉を祖とする津藩藤堂家の一門で、津藩の内分（伊賀名張領）。高吉は寛永13年（1636年）に高次の命により伊賀国名張に移封され、次男以下3人に5000石を分知して1万5000石となった。「藩の一覧」の伊賀国には伊賀上野藩のみが掲載され、名張藤堂家は掲載されていない","その他（ブログ掲載のWikipedia「名張藤堂家」記事引用・Japanese Wiki Corpus、参考）"],["20","竹原藩＜八知藩＞","―","―","―","―","―","「藩の一覧」の伊勢国に名称のみ掲載。詳細は今回未確認","Wikipedia"],["21","伊勢岩手藩","いせいわてはん","―","―","―","―","「藩の一覧」の伊勢国に名称のみ掲載。「田丸藩」記事に「伊勢岩手藩も参照」とあり、稲葉道通は伊勢岩出城主であったと記される。詳細は今回未確認","Wikipedia"],["22","井生藩","―","―","―","―","―","「藩の一覧」の伊勢国に名称のみ掲載。詳細は今回未確認","Wikipedia"]]}]}],"c":[{"h":"概要・出典","lv":2,"text":["出典：","- 三重県立総合博物館・県史編さん「いまの三重県の成立を伝える文書」https://www.bunka.pref.mie.lg.jp/rekishi/kenshi/asp/shijyo/detail575.html （取得日：2026-11-18、自治体）","- 三重県公式「県民の日」https://www.pref.mie.lg.jp/TOPICS/m0006900067.htm （取得日：2026-11-18、自治体）","- Wikipedia「伊勢国」https://ja.wikipedia.org/wiki/伊勢国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「紀伊国」https://ja.wikipedia.org/wiki/紀伊国 （取得日：2026-11-18、Wikipedia）","注記：","- 伊賀国の帰属：伊賀国は明治初年時点で全域が津藩（伊勢津藩）領であり、廃藩置県により津県の管轄となり、第1次府県統合により安濃津県の管轄となった（Wikipedia「伊賀国」）。第1次府県統合の内訳は、安濃津県（桑名県・亀山県・長島県・神戸県・菰野県・津県）と度会県（久居県・鳥羽県・度会県）である（Wikipedia「三重県」）。","- 志摩国の帰属：志摩国は鳥羽藩領から鳥羽県となり、第1次府県統合により度会県（第2次）の区域（伊勢国の一部・志摩国の全域・紀伊国牟婁郡の一部）に入った。鳥羽県の管轄地域の度会県への引き渡しは1872年（明治5年）3月から4月にかけて行われた（Wikipedia「度会県」）。","- 1876年に三重県へ編入された旧紀伊国の範囲は、度会県が管轄していた牟婁郡のうち熊野川・北山川以東の部分（後の北牟婁郡・南牟婁郡にあたる旧熊野エリア）である。","- 国立公文書館アジア歴史資料センター（JACAR）での日付照合は未実施である。","---"],"tables":[{"cols":["番号","出来事","日付","内容","出典の種別"],"rows":[["1","度会府の設置","1868年8月23日（慶応4年7月6日）","伊勢神宮領などが度会府の管轄となった","Wikipedia"],["2","度会県への改称","1869年8月24日（明治2年7月17日）","度会府が度会県に改称","Wikipedia"],["3","廃藩置県","1871年8月29日（明治4年7月14日）","伊勢国内に桑名県・長島県・菰野県・津県・久居県・亀山県・神戸県などが置かれた（ほか飛地）","Wikipedia"],["4","第1次府県統合","1872年1月2日（明治4年11月22日）","桑名郡・員弁郡・朝明郡・三重郡・鈴鹿郡・河曲郡・奄芸郡・安濃郡が安濃津県に、一志郡・飯高郡・飯野郡・多気郡・度会郡と志摩国の全域が度会県になった。紀伊国牟婁郡の一部（概ね熊野川・北山川以東、後の北牟婁郡・南牟婁郡）も度会県となり、残部は和歌山県となった。田丸領も同日に和歌山県から度会県に編入された（「田丸藩」記事）","Wikipedia"],["5","安濃津県の三重県への改称","1872年4月24日（明治5年3月17日）","安濃津県が三重県に改称した（三重県（第1次））。県史編さんページの記述：「三重の県名の始まりは、71年11月の第2次廃藩置県によって成立した現県域の北半分を管轄した安濃津県の県庁が、翌72年3月に津から三重郡の四日市に移されたことに基づく」","Wikipedia／自治体"],["6","三重県（第2次）の成立","1876年4月18日","第2次府県統合で三重県と度会県が合併し、現在の三重県となった。度会県の管轄だった旧紀伊国牟婁郡（度会県牟婁郡）も三重県の管轄となった。三重県公式「県民の日」：「明治4（1871）年の廃藩置県で安濃津県（後に三重県と改称）と度会県が置かれ、明治9（1876）年4月18日に、その2つの県が合併して現在の三重県が誕生しました」。県史編さんページ：「合併期日を示すものは太政官布告であり、4月18日付けで『度会県ヲ廃シ三重県ヘ合併』と見られ」る","自治体／Wikipedia"],["7","牟婁郡の分割","1879年（明治12年）","牟婁郡は四分され、東牟婁郡・西牟婁郡は和歌山県に、南牟婁郡および北牟婁郡は三重県に編入された（「紀伊国」記事）","Wikipedia"]]}]}],"d":[{"h":"概要・出典","lv":2,"text":["出典：","- 三重県立総合博物館・県史編さん「いまの三重県の成立を伝える文書」https://www.bunka.pref.mie.lg.jp/rekishi/kenshi/asp/shijyo/detail575.html （取得日：2026-11-18、自治体）","- 三重県公式「県民の日」https://www.pref.mie.lg.jp/TOPICS/m0006900067.htm （取得日：2026-11-18、自治体）","- 東京書籍 東書Eネット「三重県」https://ten.tokyo-shoseki.co.jp/ten_download/2020/2020078361.htm （取得日：2026-11-18、その他（教育出版社の教材資料）、参考）","三重県立総合博物館・県史編さんの記述（原文）：","「三重の県名の始まりは、71年11月の第2次廃藩置県によって成立した現県域の北半分を管轄した安濃津県の県庁が、翌72年3月に津から三重郡の四日市に移されたことに基づく。郡名を県名とすることが通例となっていたためである。その後、再び県庁が津に戻っても、県名が変更されることはなかった。」","参考（東書Eネット）：旧三重県はもともと安濃津県で津に庁舎を置き、明治5年3月に三重郡四日市に庁舎を移転する際に改称した。「三重郡」の「三重」は『古事記』景行天皇段に日本武尊が「わが足三重のまかりなして、いと疲れたり」と語ったことによるとする。","注記：","- 公式の説明どおり、県名は県庁移転先の三重郡（四日市）の郡名に由来する。","---"],"tables":[]}],"e":[{"h":"概要・出典","lv":2,"text":["出典：","- Wikipedia「津城」https://ja.wikipedia.org/wiki/津城 （取得日：2026-11-18、Wikipedia）","- Wikipedia「桑名城」https://ja.wikipedia.org/wiki/桑名城 （取得日：2026-11-18、Wikipedia）","- Wikipedia「亀山城 (伊勢国)」https://ja.wikipedia.org/wiki/%E4%BA%80%E5%B1%B1%E5%9F%8E_(%E4%BC%8A%E5%8B%A2%E5%9B%BD) （取得日：2026-11-18、Wikipedia）","- Wikipedia「松坂城」https://ja.wikipedia.org/wiki/%E6%9D%BE%E5%9D%82%E5%9F%8E （取得日：2026-11-18、Wikipedia）","- Wikipedia「上野城」http://ja.wikipedia.org/wiki/上野城 （取得日：2026-11-18、Wikipedia）","- Wikipedia「鳥羽城」https://ja.wikipedia.org/wiki/鳥羽城 （取得日：2026-11-18、Wikipedia）","- Wikipedia「田丸藩」https://ja.wikipedia.org/wiki/田丸藩 （取得日：2026-11-18、Wikipedia）","- Wikipedia「赤木城」http://ja.wikipedia.org/wiki/赤木城 （取得日：2026-11-18、Wikipedia）","- 現存12天守の一覧（城なび）https://oshiro-navi.com/what-existence-tensyu/ （取得日：2026-11-18、その他（城郭情報サイト））","注記：","- 現存天守について：現存12天守は弘前城（青森県）・松本城（長野県）・丸岡城（福井県）・犬山城（愛知県）・彦根城（滋賀県）・姫路城（兵庫県）・松江城（島根県）・備中松山城（岡山県）・丸亀城（香川県）・伊予松山城（愛媛県）・宇和島城（愛媛県）・高知城（高知県）であり、三重県内に現存天守はない（なし）。","- 伊賀上野城については、現存する高石垣（藤堂高虎築造、約30m）と、昭和10年（1935年）に木造で建てられた模擬天守（復興天守・伊賀文化産業城）を区別して記した。","---"],"tables":[{"cols":["番号","城名","読み","築城者","築城年","廃城年","現状・現存する建物","出典の種別"],"rows":[["1","津城","つじょう","細野藤敦","永禄年間（1558年-1570年）","明治4年（1871年）","別名・安濃津城（あのつじょう）。遺構は石垣・堀。再建造物は模擬隅櫓。天守（5重5階、1577年築）は非現存。三重県史跡。現在は「お城公園」「お城西公園」","Wikipedia"],["2","桑名城","くわなじょう","一柳可遊、本多忠勝","慶長6年（1601年）","明治6年（1873年）","別名・扇城、旭城。「城跡には現存建造物はなく、石垣、堀が残るのみ」。天守（複合式層塔型4重6階、1635年築）は元禄14年（1701年）に焼失し非現存。蟠龍櫓は外観復元（2003年）。三重県史跡、現在は桑名城址九華公園","Wikipedia"],["3","伊勢亀山城（亀山城）","かめやまじょう","関実忠","文永2年（1265年）","明治6年（1873年）","別名・粉蝶城（こちょうじょう、ふんちょうじょう）。遺構は多聞櫓・石垣・堀・土塁。多聞櫓は現存し「原位置のまま残る中核的城郭建築として三重県下では唯一の遺存例」であり、「旧亀山城多聞櫓」の名称で三重県史跡。天守は非現存（江戸時代初頭に丹波亀山城と間違えて取り壊された）","Wikipedia"],["4","松坂城","まつさかじょう","蒲生氏郷","1588年（天正16年）","1871年（明治4年）","別名・松阪城（現在の表記）。天守（連結式望楼型3重5階、1588年築）は1644年（正保元年）に台風で倒壊し非現存。「城内の建築物は1877年（明治10年）の失火と1881年（明治14年）までの破却によって失われ、現地には石垣のみが残っており、城址公園となっている」。遺構は天守台・本丸・二の丸・石垣等。殿町御城番屋敷に米倉のみ現存。国指定史跡（松坂城跡）","Wikipedia"],["5","伊賀上野城（上野城）","うえのじょう","筒井定次","天正13年（1585年）","明治4年（1871年）","別名・白鳳城、伊賀上野城。藤堂高虎が築いた高石垣（根石より天端まで29.7m、延長368m）が現存し、石垣・堀・武具蔵（手当蔵）が遺構。米倉は移築現存。天守は層塔型5重5階が完成間近の慶長17年（1612年）に倒壊し非現存。現在の天守は1935年（昭和10年）築の木造の模擬天守（復興天守）で、正式には「伊賀文化産業城」という。国史跡","Wikipedia"],["6","鳥羽城","とばじょう","九鬼嘉隆","文禄3年（1594年）","明治4年（1871年）","別名・鳥羽の浮城、錦城、二色城。遺構は石垣のみ（本丸と旧家老屋敷の石垣）。天守（3重、1633年築）は1854年（安政元年）の地震で倒壊し非現存。再建造物なし。三重県指定史跡","Wikipedia"],["7","田丸城","たまるじょう","北畠氏","14世紀前半（南北朝時代）","1871年（田丸城は明治4年2月9日に破却）","「14世紀前半（南北朝時代）、伊勢国司北畠氏によって田丸城が築かれ」た。現在は田丸城跡","Wikipedia"],["8","赤木城","あかぎじょう","藤堂高虎","天正17年（1589年）","元和元年（1615年）","紀伊国牟婁郡北山郷（現在の三重県熊野市紀和町赤木）に築かれた平山城。野面積みの石垣の遺構が現存し「築城当時の原形を残した城跡」。国の史跡（「赤木城跡及び田平子峠刑場跡」として1989年10月9日指定）","Wikipedia"]]}]}],"f":[{"h":"f-1 江戸時代に成立していたもの","lv":2,"text":["出典：","- 文化庁「令和4年度『食文化ストーリー』創出・発信モデル事業『伊勢うどん魅力発信事業』調査報告書」https://www.bunka.go.jp/seisaku/bunkazai/joseishien/syokubunka_story/pdf/93910611_02.pdf （取得日：2026-11-18、公的）","- 農林水産省「にっぽん伝統食図鑑 伊勢うどん」https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/ise_udon.html （取得日：2026-11-18、公的）","- 株式会社赤福 会社概要（公式プレスリリース等に掲載の会社概要による）https://www.akafuku.co.jp/ （取得日：2026-11-18、その他（企業公式））","- 三重県立美術館「三重の工芸」https://www.bunka.pref.mie.lg.jp/art-museum/55469038542.htm （取得日：2026-11-18、自治体）","- 四日市市広報「四日市萬古焼」https://www5.city.yokkaichi.mie.jp/www/contents/1599460821209/simple/202009joujun.pdf （取得日：2026-11-18、自治体）","注記：","- 真珠（養殖真珠）は明治期に始まるものであるため、江戸時代の表には入れない（年次の公的出典での確認は今回未実施）。"],"tables":[{"cols":["番号","名称","読み","成立時期","備考","出典の種別"],"rows":[["1","伊勢うどん","いせうどん","江戸時代（食べ方自体は江戸時代以前に遡る）","農林水産省「にっぽん伝統食図鑑」：「発祥は定かではないが、江戸時代以前から伊勢地方では、伸ばす手間をかけずにコシの無い太いうどんをつくり、これに地味噌からできた『たまり』を絡ませて食べていたという。江戸時代になり伊勢参りが盛んになると、参拝客の疲労回復とエネルギー源として最適な食べ物としてうどんを提供する店が現れ」た。「伊勢うどん」という名称は新しいもので、昭和47年（1972年）に伊勢市麺類飲食業組合が統一名を決めた。当時は「うどん」「素うどん」「並うどん」と呼ばれていた","公的"],["2","赤福（店）","あかふく","1707年（宝永4年）創業","株式会社赤福の会社概要：所在地 三重県伊勢市宇治中之切町26番地、創業 1707年（宝永4年）、事業内容「和洋菓子の製造・販売・開発、店舗の企画・運営」。なおWikipedia「赤福餅」は「赤福の正確な創業年は不明だが、江戸時代初期には…すでに『赤福』の屋号を持つ餅屋を営んでいたといわれる。1707年（宝永4年）執筆…『美景蒔絵松』に…これが『赤福』の屋号の初出である。そのため、現在は1707年（宝永4年）を赤福の創業年としている」と記す。法人設立は1954年","その他（企業公式）／Wikipedia"],["3","松阪牛の前身","まつさかうし","江戸時代（役牛としての但馬牛の導入）","松阪牛のルーツは兵庫県但馬地方の牛で、江戸時代には農耕用の役牛として導入されていたものが前身とされる。肉食用の銘柄としての「松阪牛」の確立は明治以降（詳細はf-2のGI・地域団体商標を参照）。出典は松阪牛協議会の公開情報をもとにした解説記事によるもので、公的出典での前身の成立時期の照合は今回未実施","その他（松阪牛協議会の公開情報に基づく解説、参考）"],["4","伊賀焼","いがやき","文献上の初出は天正年間（1573年-1592年）","「伊賀焼（いがやき）は天正年間（1573年～1592年）に初めて文献に現れます。それ以前の発祥については未だにはっきりとしていません」（陶磁器の産地解説）。三重県立美術館は桃山期の茶陶としての古伊賀を三重の工芸の第一に挙げる。発祥は天平年間に遡るとする伝承もあるが未確定","その他（産地解説）／自治体"],["5","萬古焼","ばんこやき","元文年間（1736年-1741年）","三重県立美術館：「茶道に通じていた沼波弄山（1718～77）が元文年間（1736～41）に三重郡朝日町小向に開窯したのが創始で、これは古萬古と称され」る。四日市市広報も「元文年間（1736～41年）に小向村（現在の朝日町小向）に窯を開いたのが、萬古焼の始まりと言われています」と記す。弄山の没後に衰退し、天保3年（1832年）に森有節・千秋兄弟が再興（有節萬古）。現在の「四日市萬古焼」の産地形成は明治以降である","自治体"],["6","伊勢茶","いせちゃ","未確認","江戸時代の成立時期について、今回、公的出典での確認ができなかったため未確認とする。現代の認定はf-2（地域団体商標「伊勢茶」）を参照","―"]]}]},{"h":"f-2 現代の公的な認定","lv":2,"text":["出典：","- 伝統的工芸品産業振興協会「伝統的工芸品指定品目一覧・業種別」（2025年10月27日現在）https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （取得日：2026-11-18、公的（経済産業省指定の伝統的工芸品の一覧））","- 農林水産省「登録の公示（第25号：特産松阪牛）」https://www.maff.go.jp/j/shokusan/gi_act/register/0025/index.html （取得日：2026-11-18、公的）","- 農林水産省東海農政局「知的財産・地域ブランド」https://www.maff.go.jp/tokai/keiei/shokuhin/chizai/index.html （取得日：2026-11-18、公的）","- 特許庁「三重県における知財活動の概要」（平成29年）https://www.jpo.go.jp/resources/report/chiiki-chusho/chiiki_report/document/h29/21.pdf （取得日：2026-11-18、公的）","- 三重県「みえの食セレクション」資料 https://www.pref.mie.lg.jp/common/content/001085326.pdf （取得日：2026-11-18、自治体）"],"tables":[]},{"h":"伝統的工芸品（経済産業省指定、2025年10月27日現在・全国244品目）","lv":3,"text":["三重県分は5品目である。","注記：指定年月日は三重県建築士会資料（参考）によれば、伊賀くみひも 昭和51年12月15日、四日市萬古焼 昭和54年1月12日、伊賀焼 昭和57年11月1日とされる（鈴鹿墨・伊勢形紙の日付は同資料の抜粋範囲では確認できなかった）。"],"tables":[{"cols":["番号","品目名","読み","業種区分（一覧での掲載区分）","出典の種別"],"rows":[["1","伊賀くみひも","いがくみひも","その他の繊維製品","公的（伝統的工芸品産業振興協会一覧）"],["2","四日市萬古焼","よっかいちばんこやき","陶磁器","公的（伝統的工芸品産業振興協会一覧）"],["3","伊賀焼","いがやき","陶磁器","公的（伝統的工芸品産業振興協会一覧）"],["4","鈴鹿墨","すずかずみ","文具","公的（伝統的工芸品産業振興協会一覧）"],["5","伊勢形紙","いせかたがみ","工芸材料・工芸用具（一覧の表記は「伊勢形紙」）","公的（伝統的工芸品産業振興協会一覧）"]]}]},{"h":"地理的表示（GI）","lv":3,"text":["東海農政局のページは「地理的表示法に基づき、東海地域で登録されている地理的表示は7産品です」とし、そのうち三重県分は次の1件である。","注記：GIに登録されているのは「特産松阪牛」であり、「松阪牛」全体ではない。特性は「未経産の黒毛和種の雌牛を12ヶ月齢までに兵庫県から導入し、900日以上の長期にわたり肥育」したもの（東海農政局）。"],"tables":[{"cols":["番号","名称","読み","登録番号","登録日","登録生産者団体","生産地","出典の種別"],"rows":[["1","特産松阪牛","とくさんまつさかうし","第25号","平成29年3月3日（2017年3月3日）","松阪牛連絡協議会","平成16年11月1日当時の行政区画名としての22市町村（松阪市、津市、伊勢市、久居市、香良洲町、一志町、白山町、嬉野町、美杉村、三雲町、飯南町、飯高町、多気町、明和町、大台町、勢和村、宮川村、玉城町、小俣町、大宮町、御薗村、度会町）","公的"]]}]},{"h":"地域団体商標","lv":3,"text":["特許庁資料（平成29年1月現在、参考として平成29年11月現在の登録件数15件）による三重県の地域団体商標の登録名称は次のとおりである（時点情報：2017年時点）。","松阪肉（第5022670号）・松阪牛（第5022671号）・伊勢茶（第5040759号）・伊勢うどん（第5113864号）・伊勢たくあん・伊勢ひじき・伊賀くみひも・大内山牛乳・みえ豚・伊勢赤どり・美旗メロン・四日市萬古焼・伊勢型紙・伊賀焼","注記：","- 「伊勢うどん」は2008年（平成20年）2月に地域団体商標に登録され、権利者は三重県製麺協同組合である（コトバンク「事典 日本の地域ブランド・名産品」）。","- 2024年12月時点で三重県の地域団体商標の登録数は20件とする民間の商標情報サイトの記載があるが、特許庁の最新の一覧での照合は今回未実施である。","- 三重県の管轄農政局は近畿農政局ではなく東海農政局である（東海農政局のページで確認）。"],"tables":[]},{"h":"県の認証制度","lv":3,"text":["- 「みえの食セレクション」：三重県の食の認定制度（県公式資料による）。","- Eマーク：伊勢うどんについて「県内産の大豆を使ったタレは三重県の地域特産品認定事業のEマークに認証されている」（Wikipedia「伊勢うどん」）。","---"],"tables":[]}],"g":[{"h":"概要・出典","lv":2,"text":["出典：","- Wikipedia「伊勢国」https://ja.wikipedia.org/wiki/伊勢国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「伊賀国」https://ja.wikipedia.org/wiki/伊賀国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「志摩国」https://ja.wikipedia.org/wiki/志摩国 （取得日：2026-11-18、Wikipedia）","- Wikipedia「紀伊国」https://ja.wikipedia.org/wiki/紀伊国 （取得日：2026-11-18、Wikipedia）"],"tables":[]},{"h":"g-1 伊勢国","lv":2,"text":[],"tables":[{"cols":["番号","項目","内容","出典の種別"],"rows":[["1","国司の等級","大国","Wikipedia"],["2","国府の所在地","鈴鹿郡（『和名抄』による）。奈良時代中ごろの国府（前期国府）は長者屋敷遺跡（鈴鹿市広瀬町・西富田町）で「伊勢国府跡」として国の史跡。初期・後期の国府は鈴鹿市国府町付近の可能性が非常に高いとされる","Wikipedia"],["3","一宮","椿大神社（鈴鹿市山本町御旅）。出典は『中世諸国一宮制の基礎的研究』。ただし二宮の多度神社（多度大社）について『類聚既験抄』のみが初見で「事実上は一宮であった可能性が高いとされる」。都波岐神社（鈴鹿市一の宮町）を『大日本国一宮記』を基に一宮とする説もあるが混同によるとされる。国府の節にも「最初の一宮は多度神社である」との記述がある","Wikipedia"],["4","総社","不詳。三宅神社（鈴鹿市国府町、明治以前の旧称「惣社大明神」）。伊奈冨神社（鈴鹿市稲生西）は「中世以来は事実上総社として機能したとされる」","Wikipedia"],["5","国分寺","伊勢国分寺跡（鈴鹿市国分町）、国の史跡。推定寺域約180メートル四方。塔跡は見つかっていない","Wikipedia"],["6","国分尼寺","未詳。鈴鹿市国分町の国分遺跡と推定されるが詳らかではない。（推定）三重県鈴鹿市","Wikipedia"],["7","延喜式内社の数","大社18座9社・小社235座223社、計253座232社。名神大社：阿射加神社三座（壱志郡、比定論社2社）、多度神社（桑名郡、比定社：多度大社）","Wikipedia"]]}]},{"h":"g-2 伊賀国","lv":2,"text":[],"tables":[{"cols":["番号","項目","内容","出典の種別"],"rows":[["1","国司の等級","下国","Wikipedia"],["2","国府の所在地","阿拝郡、現在の伊賀市坂之下字国町。2009年（平成21年）7月23日に「伊賀国庁跡」として国の史跡に指定","Wikipedia"],["3","一宮","敢國神社（伊賀市一之宮）。式内大社（阿拝郡 敢国神社）","Wikipedia"],["4","総社","不詳（伊賀市府中の府中神社は総社ではないとされる）。二宮は小宮神社、三宮は波多岐神社","Wikipedia"],["5","国分寺","伊賀国分寺跡（伊賀市西明寺字長者屋敷）、国の史跡。推定寺域は東西約220メートル・南北約240メートル","Wikipedia"],["6","国分尼寺","国の史跡「長楽山廃寺跡」（伊賀市西明寺字長楽寺）に比定","Wikipedia"],["7","延喜式内社の数","大社1座1社・小社24座24社、計25座25社。大社は阿拝郡 敢国神社","Wikipedia"]]}]},{"h":"g-3 志摩国","lv":2,"text":[],"tables":[{"cols":["番号","項目","内容","出典の種別"],"rows":[["1","国司の等級","下国","Wikipedia"],["2","国府の所在地","『和名抄』および『拾芥抄』に英虞郡とある。志摩市阿児町国府に比定","Wikipedia"],["3","一宮","伊雑宮（いざわのみや、志摩市磯部町上之郷、伊勢神宮別宮）と伊射波神社（いざわじんじゃ、鳥羽市安楽島町）。「ともに式内大社の『粟島坐伊射波神社』論社であり、両社ともが志摩国一宮とされている」。二宮以下はなし","Wikipedia"],["4","総社","不詳","Wikipedia"],["5","国分寺","志摩国分寺跡。志摩市阿児町国府字御堂の後にあった","Wikipedia"],["6","国分尼寺","志摩市阿児町国府字大堂にあった（インフォボックスでは「（未詳）」）","Wikipedia"],["7","延喜式内社の数","大社2座1社・小社1座1社、計3座2社。答志郡 粟島坐伊射波神社二座（式内大社）","Wikipedia"]]}]},{"h":"g-4 紀伊国（三重県域の扱い）","lv":2,"text":["注記：","- 紀伊国については、国府・一宮・総社・国分寺・国分尼寺はいずれも和歌山県側に所在し、三重県域（旧牟婁郡東部）には国単位の施設は所在しない。これが三重県域に関する扱いである。","- 食い違い（伊勢国一宮）：記事のインフォボックスと一宮の節は椿大神社を一宮とする一方、多度神社について「事実上は一宮であった可能性が高い」と記し、国府の節には「最初の一宮は多度神社である」との文もある。両論を併記する。","---"],"tables":[{"cols":["番号","項目","内容","出典の種別"],"rows":[["1","国司の等級","上国","Wikipedia"],["2","国府の所在地","名草郡。『和名抄』『大御記』からは10世紀以降は和歌山市府中（府守神社付近）に所在したと推定。それ以前は岡田遺跡（岩出市）説もある。いずれも和歌山県内","Wikipedia"],["3","一宮","日前神宮・國懸神宮（和歌山市）、丹生都比売神社（伊都郡かつらぎ町）、伊太祁曽神社（和歌山市）の3社の説があり、全て和歌山県内。三重県域（牟婁郡）には一宮は所在しない","Wikipedia"],["4","総社","大屋都姫神社に合祀の総社明神か。別説に府守神社（和歌山市府中）か。いずれも和歌山県内","Wikipedia"],["5","国分寺","紀伊国分寺跡（紀の川市打田町）、国の史跡。和歌山県内","Wikipedia"],["6","国分尼寺","不詳。西国分廃寺跡（岩出市西国分、国の史跡）を国分尼寺跡とする説がある。和歌山県内","Wikipedia"],["7","延喜式内社の数","大社13座13社・小社18座15社、計31座28社（紀伊国全体の数）","Wikipedia"]]}]}],"h":[{"h":"h-1 老舗企業（2026年時点で創業100年以上・現営業中・本社が三重県内）","lv":2,"text":["出典：","- 株式会社赤福 公式サイト・会社概要 https://www.akafuku.co.jp/company/ （取得日：2026-11-18、その他（企業公式））","- 株式会社宮﨑本店 公式サイト https://www.miyanoyuki.co.jp/ （取得日：2026-11-18、その他（企業公式））","- 株式会社柿安本店 企業概要 https://www.kakiyasuhonten.co.jp/corp/about/ （取得日：2026-11-18、その他（企業公式））","- 株式会社百五銀行 公式サイト https://www.hyakugo.co.jp/ （取得日：2026-11-18、その他（企業公式））","- 井村屋グループ株式会社 会社案内 https://www.imuraya-group.com/ （取得日：2026-11-18、その他（企業公式））","- 住友電装株式会社 公式サイト「会社概要」（同社CSR Report 2017掲載の会社概要）https://www.sws.co.jp/csr/report/_data/docs/csr17_03.pdf （取得日：2026-11-18、その他（企業公式））","公式出典で確認できたのは6社である。","注記：","- おやつカンパニーは1948年（昭和23年）創業のため h-1 の対象外である（1959
