ホールディングスについては、公式の会社概要で本社所在地（三重県津市）を確認したため、本表に収録した。","---"],"tables":[{"cols":["番号","企業名","読み","創業年（設立年）","本社所在地","業種・事業内容","備考","出典の種別"],"rows":[["1","井村屋グループ株式会社","いむらやグループ","1896年（設立1947年4月8日）","三重県津市高茶屋七丁目1番1号","菓子・食品の製造・販売（あずきバー、肉まん・あんまん等）","h-1と重複する","その他（企業公式）"],["2","株式会社百五銀行","ひゃくごぎんこう","1878年（設立1878年12月4日）","三重県津市岩田21番27号","銀行業","h-1と重複する","その他（企業公式）"],["3","株式会社三十三銀行","さんじゅうさんぎんこう","2021年5月1日発足","三重県四日市市西新地7番8号","銀行業","2021年5月1日に三重銀行と第三銀行が合併して発足した。第三銀行の後継はこの三十三銀行であり、本店は四日市市である（三十三フィナンシャルグループの公式資料による）。なお同グループの登記上の本店所在地は三重県松阪市京町510番地とされる資料もある","その他（企業公式）"],["4","ジャパンマテリアル株式会社","じゃぱんまてりある","1997年4月設立（1999年12月に株式会社へ組織変更）","三重県三重郡菰野町永井3098番22","半導体関連部品・材料の販売、特殊ガス販売管理業務（TGM）等の工場インフラサービス","設立当初は四日市市。その後、三重郡菰野町に本社工場を開設し本社を移転した","その他（企業公式）"],["5","株式会社おやつカンパニー","―","1948年（昭和23年）9月3日（松田産業有限会社として設立）","三重県津市一志町田尻428番地1","スナック菓子、カップ麺の製造・販売（ベビースターラーメン、ブタメン等）","同社の公式発表は「おやつカンパニーは1948年の創業後、製麺製造から事業を開始しました。1959年には…ベビースターラーメンが誕生し」とし、会社概要に本社所在地を三重県津市一志町田尻428-1、設立を1948年（昭和23年）9月3日とする。創業100年未満のため h-1 の対象外","その他（企業公式）"],["6","三重交通グループホールディングス株式会社","みえこうつうぐるーぷほーるでぃんぐす","2006年（平成18年）10月2日設立（株式会社三交ホールディングスとして）","三重県津市中央1番1号（三重会館）","純粋持株会社（株式所有によるグループ連結経営の立案と実行）。グループ事業は運輸業・不動産業・流通業・レジャー・サービス業","同社公式の会社概要（2026年6月18日現在）による。中核会社の三重交通は1944年2月11日創立（同社公式の決算補足説明資料の注記）","その他（企業公式）"]]}]}]},{"id":"shiga","title":"滋賀県","sub":"旧近江国","meta":["取得日：2026-11-18","表の前提：日付は新暦（西暦）で書き、1872年末（明治5年12月2日）までの日付は旧暦を括弧で併記する。暦が判別できない日付は原文のまま書き「暦不明」と注記する。出典の種別ラベルは「公的」「自治体」「その他（内容）」「Wikipedia」「その他（企業公式）」を用いる。","---","# a. 旧国名：近江国","出典：","- Wikipedia「近江国」 https://ja.wikipedia.org/wiki/近江国 （取得日：2026-11-18）","- Wikipedia「滋賀県」 https://ja.wikipedia.org/wiki/滋賀県 （取得日：2026-11-18）"],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai","kokumei"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun","han","tenryo","mikuriya","senko"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"県名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai","kokumei"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["近江国の郡数・郷数（12郡93郷）はWikipediaのみが出典。"],"b":["藩と藩主はWikipediaのみ。朝日山藩・堅田藩の藩主名は未取得。彦根藩・膳所藩・水口藩などの藩主の読みは記事になく未取得。","近江小室藩（1619〜1788年）は、6代小堀政方の改易で幕末まで存続していない（再確認済み）。"],"c":["大津県の終わりは1872年2月27日（明治5年1月19日）の滋賀県への改称で、県公文書館の資料で確認した。1872年1月2日（明治4年11月22日）は第1次府県統合による管轄変更の日。","合併日は、県公式が「明治5年9月29日」、Wikipediaが「9月28日」で1日の差がある（原因は未確認）。JACARでの照合は未実施。"],"d":["県名は滋賀郡に由来する（県公式で確認）。「しが」の語源は諸説で、確実な史料はない。"],"e":["彦根城は2026年9月3日に国内推薦候補に選定された（文化庁の報道発表で確認）。世界遺産への登録ではない。","城の築城年などはWikipediaのみ。文化遺産オンラインの個別照合は未実施。"],"f":["赤こんにゃくは江戸時代の成立が確認できず、表から除外した。","伝統的工芸品の品目数は、県公式が241品目、協会リストが244品目で数え方が違う。"],"g":["旧国の制度（国府・一宮・総社・国分寺）はWikipediaのみが出典。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","冨田酒造の創業年は、企業公式が「天文年間（1532〜1555）初期」までで、1534年はWikipediaのみ。酒蔵紹介サイトは1532年とする（諸説・未確認）。","大和バルブの創業1919年は、公式サイトで直接確認していない。","本社が県外の5社（写真化学・平岡織染・日本カーボン・大和バルブ・行田電線）は、老舗の基準（本社が県内）から外し、注記に移した。","フジテックの本社は彦根市で確定（公式・有価証券報告書）。","オプテックスグループの収録可否は未確認。"]},"a":[{"h":"概要・出典","lv":2,"text":["取得日：2026-11-18","表の前提：日付は新暦（西暦）で書き、1872年末（明治5年12月2日）までの日付は旧暦を括弧で併記する。暦が判別できない日付は原文のまま書き「暦不明」と注記する。出典の種別ラベルは「公的」「自治体」「その他（内容）」「Wikipedia」「その他（企業公式）」を用いる。","---","出典：","- Wikipedia「近江国」 https://ja.wikipedia.org/wiki/近江国 （取得日：2026-11-18）","- Wikipedia「滋賀県」 https://ja.wikipedia.org/wiki/滋賀県 （取得日：2026-11-18）","12郡は、滋賀郡・栗太郡・甲賀郡・野洲郡・蒲生郡・神崎郡・愛知郡・犬上郡・坂田郡・浅井郡・伊香郡・高島郡である（Wikipedia「近江国」）。","注記・食い違い：","- 滋賀県域と旧国の関係：Wikipedia「滋賀県」は、滋賀県の県域は令制国では近江国と完全に一致するとする。ただし期間限定の例外があり、1876年（明治9年）から1881年（明治14年）までは若狭国全域と越前国敦賀郡（現在の福井県嶺南）も滋賀県に含まれていた（Wikipedia「近江国」の沿革記述による）。","- 郡数・郷数（12郡93郷）はWikipediaのみで確認し、公的出典での照合は未実施。","---"],"tables":[{"cols":["番号","名称","読み","期間","備考","出典の種別"],"rows":[["1","近江国","おうみのくに","古代〜1871年（廃藩置県）","東山道に所属。別称は江州（ごうしゅう）。国力は大国、距離区分は近国。12郡93郷。相当領域は滋賀県","Wikipedia"]]}]}],"b":[{"h":"概要・出典","lv":2,"text":["出典：","- Wikipedia「近江国」 https://ja.wikipedia.org/wiki/近江国 （江戸時代の藩の一覧表、取得日：2026-11-18）","- Wikipedia「彦根藩」 https://ja.wikipedia.org/wiki/彦根藩 （取得日：2026-11-18）","- Wikipedia「膳所藩」 https://ja.wikipedia.org/wiki/膳所藩 （取得日：2026-11-18）","- Wikipedia「水口藩」 https://ja.wikipedia.org/wiki/水口藩 （取得日：2026-11-18）","- Wikipedia「大溝藩」 https://ja.wikipedia.org/wiki/大溝藩 （取得日：2026-11-18）","- Wikipedia「仁正寺藩」 https://ja.wikipedia.org/wiki/仁正寺藩 （取得日：2026-11-18）","- Wikipedia「三上藩」 https://ja.wikipedia.org/wiki/三上藩 （取得日：2026-11-18）","- Wikipedia「近江宮川藩」 https://ja.wikipedia.org/wiki/近江宮川藩 （取得日：2026-11-18）","- Wikipedia「山上藩」 https://ja.wikipedia.org/wiki/山上藩 （取得日：2026-11-18）","- Wikipedia「近江小室藩」 https://ja.wikipedia.org/wiki/近江小室藩 （取得日：2026-11-18）","注記・食い違い：","- 彦根藩の支藩として彦根新田藩が1714年（正徳4年）から1734年（享保19年）まで存続した（Wikipedia「彦根藩」）。","- 彦根藩の藩主の数え方には諸説がある。Wikipedia「彦根藩」は『新修彦根市史2巻 通史編近世』（2008年）が井伊直継を2代藩主とする一方、彦根城博物館では直継を数えない代数を用いていると記す。","- 三上藩は1870年5月14日（明治3年4月14日）に藩庁を和泉国吉見へ移し、以後は吉見藩と呼ばれた（Wikipedia「三上藩」。大阪府の部でも扱った吉見藩と同一）。","- 大溝藩は廃藩置県に先立って自ら廃藩した。Wikipedia「近江国」の注記は「大溝藩は明治4年6月3日（1871年4月16日）に廃藩」とするが、明治4年6月3日の新暦換算は1871年7月20日であり、記事内の換算が一致していない（原文のまま転記）。またWikipedia「大溝藩」は、分部光謙の藩知事辞任を明治4年（1871年）6月23日とする（食い違い）。","- 近江小室藩は幕末まで存続した藩ではない。Wikipedia「近江小室藩」は、天明8年（1788年）に6代藩主小堀政方が伏見奉行在職中の義民決起事件により改易され、藩が廃されたとする。石高の3段階の変遷（1万2,460石→1万1,460石→1万630石）は、歴代藩主が弟たちへ領地を分与したことによる減封である（同記事）。","- 幕府領は大津代官所の管轄であった。彦根藩は近江国内の幕府領を預地として管轄した部分がある（Wikipedia「彦根藩」の幕末領地の記述）。近江国内には他国藩の飛地が多数存在した（下野佐野藩・山城淀藩・河内狭山藩・上野前橋藩・丹後宮津藩・伊勢菰野藩・和泉伯太藩・武蔵川越藩・大和郡山藩・陸奥仙台藩・尾張名古屋藩・讃岐丸亀藩・丹後峰山藩・出羽山形藩・紀伊和歌山藩・三河吉田藩・上総飯野藩・若狭小浜藩・越前鞠山藩・加賀藩・丹波福知山藩など。Wikipedia「近江国」の郡別記述による）。","- 本項目はすべてWikipediaのみで、公的・自治体出典での照合は未実施。","---"],"tables":[{"cols":["番号","藩名","読み","初代藩主","最後の藩主","石高","期間","出典の種別"],"rows":[["1","彦根藩","ひこねはん","井伊直政（―（記事に読みなし））","井伊直憲（―（記事に読みなし））","18万石→15万石→20万石→25万石→30万石（35万石格）→20万石→23万石","1600年〜1871年","Wikipedia"],["2","膳所藩","ぜぜはん","戸田一西（―（記事に読みなし））","本多康穣（―（記事に読みなし））","戸田家3万石／本多家3万石／菅沼家3万1,000石／石川家7万石→5万3,000石／本多家（再封）7万石","1601年〜1871年","Wikipedia"],["3","水口藩","みなくちはん","加藤明友（―（記事に読みなし））","加藤明実（―（記事に読みなし））","加藤家2万石／鳥居家2万石／加藤家2万5千石","1682年〜1871年","Wikipedia"],["4","大溝藩","おおみぞはん","分部光信（みつのぶ）","分部光謙（みつのり）","2万石","1619年〜1871年","Wikipedia"],["5","仁正寺藩（西大路藩）","にしょうじはん（にしおおじはん）","市橋長政（ながまさ）","市橋長和（ながかず）","2万石→1万8,000石→1万7,000石","1620年〜1871年","Wikipedia"],["6","三上藩","みかみはん","遠藤胤親（たねちか）","遠藤胤城（たねき）","1万石→1万2,000石","1698年〜1870年","Wikipedia"],["7","近江宮川藩","おうみみやがわはん","堀田正休（まさやす）","堀田正養（まさやす）","1万石→1万3,000石","1698年〜1871年","Wikipedia"],["8","山上藩","やまかみはん","稲垣重定（しげさだ）","稲垣太祥（もとよし）","1万3,000石","1698年〜1871年","Wikipedia"],["9","堅田藩","かたたはん","堀田家（藩主名は未確認）","―","1万石→1万3,000石","1698年〜1826年","Wikipedia"],["10","朽木藩","くつきはん","朽木稙綱（―（記事に読みなし））","朽木稙綱（1代のみ、下野鹿沼藩へ転封）","1万石","1636年〜1648年","Wikipedia"],["11","大森藩","おおもりはん","最上義俊（―（記事に読みなし））","最上義俊（1代のみ）","1万石","1622年〜1632年","Wikipedia"],["12","近江高島藩","おうみたかしまはん","佐久間安政（―（記事に読みなし））","佐久間安政（1代のみ）","1万5,000石→2万石","1600年〜1616年","Wikipedia"],["13","近江小室藩","おうみこむろはん","小堀政一（まさかず）","小堀政方（まさみち）","1万2,460石→1万1,460石→1万630石","1619年〜1788年","Wikipedia"],["14","朝日山藩","あさひやまはん","山形藩（秋元家）の転封により成立（藩主名は未確認）","―","―","1870年〜1871年","Wikipedia"]]}]}],"c":[{"h":"概要・出典","lv":2,"text":["出典：","- Wikipedia「近江国」 https://ja.wikipedia.org/wiki/近江国 （沿革、取得日：2026-11-18）","- 滋賀県立公文書館 企画展資料「明治5年の滋賀県―県政140周年」 https://archives.pref.shiga.lg.jp （取得日：2026-11-18）","- 滋賀県立公文書館「滋賀県の誕生」 https://archives.pref.shiga.lg.jp/index.php?view=category&id=27 （取得日：2026-11-18）","- 滋賀県公式「滋賀県のすがた」（こども向けPDF） https://www.pref.shiga.lg.jp/documents/20847/20261014142848.pdf （取得日：2026-11-18）","廃藩置県時（1871年8月29日（明治4年7月14日））に置かれた県は、膳所県・宮川県・水口県・山上県・西大路県・彦根県・朝日山県の7県である（このほか他国藩の飛地に対応する各県があった）。大溝藩領・公家領・門跡領・寺社領は1871年10月に大津県へ編入された（Wikipedia「近江国」）。","注記・食い違い：","- 滋賀県立公文書館の企画展資料は、1871年（明治4年）11月に大津県・長浜県が置かれたこと、大津県の改称により滋賀県となったこと、1872年（明治5年）9月の合併で現在の滋賀県が誕生したことを月単位で示しており、Wikipediaの記述と月単位では一致する。県名改称の達は1872年1月とされる。","- 大津県の終わりについて：滋賀県立公文書館「滋賀県の誕生」は、明治5年（1872年）1月19日付けの資料として「県名改称の達」（大津県を滋賀県と改称するという太政官からの達）を示す。Wikipedia「大津県」も、1872年1月2日（明治4年11月22日）は第1次府県統合に伴う管轄変更の日であり、その後も大津県が存続して明治5年（1872年）に滋賀県へ改称されたとする。したがって大津県の期間の終わりは改称日の1872年2月27日（明治5年1月19日）であり、表1行目の旧表記（〜1872年1月2日）は誤りであったため修正した。","- 第1次統合後の大津県の管轄郡について、滋賀県立公文書館「滋賀県の誕生」は「廃藩置県後になされた府県統合にともない、明治4年11月には、近江国南部6郡（滋賀・栗太・野洲・甲賀・蒲生・神崎）へと大きく変更されました」とする一方、Wikipedia「大津県」は統合直後を「近江国南部の5郡と北部の高島郡」とし、同年11月29日（1872年1月9日）に高島郡を長浜県へ移管したとする（神崎郡は同日に長浜県から大津県へ移管。Wikipedia「神崎郡」）。時点の取り方の差として併記する。","- 食い違い：滋賀県公式「滋賀県のすがた」は改称を「明治5年（1872年）1月19日」と記すが、これは旧暦の日付である（新暦では1872年2月27日）。また同資料は合併を「明治5年9月29日」と記し、Wikipedia「近江国」の「1872年10月30日（明治5年9月28日）」と1日異なる（併記）。","- 国立公文書館（JACAR）での日付の照合は未実施。","---"],"tables":[{"cols":["番号","県名","読み","期間","備考","出典の種別"],"rows":[["1","大津県","おおつけん","1868年5月20日（慶応4年4月28日）〜1872年2月27日（明治5年1月19日）","前身は大津裁判所（1868年3月30日（慶応4年3月7日）に大津代官所へ設置）。1872年1月2日（明治4年11月22日）の第1次府県統合で管轄が近江国南部に変更された後も大津県として存続し、1872年2月27日（明治5年1月19日）に滋賀県へ改称して終わった","自治体／Wikipedia"],["2","長浜県","ながはまけん","1872年1月2日（明治4年11月22日）〜1872年4月4日（明治5年2月27日）","第1次府県統合で県域の北部7郡（神崎・愛知・犬上・坂田・浅井・伊香・高島）を管轄。犬上県に改称","Wikipedia"],["3","犬上県","いぬかみけん","1872年4月4日（明治5年2月27日）〜1872年10月30日（明治5年9月28日）","滋賀県に合併","Wikipedia"],["4","滋賀県","しがけん","1872年2月27日（明治5年1月19日）〜","大津県が改称して成立。1872年10月30日（明治5年9月28日）に犬上県を合併し、全域が滋賀県の管轄となる","Wikipedia"]]}]}],"d":[{"h":"概要・出典","lv":2,"text":["出典：","- 滋賀県公式「滋賀県のすがた」（こども向けPDF） https://www.pref.shiga.lg.jp/documents/20847/20261014142848.pdf （取得日：2026-11-18）","- 国立国会図書館 レファレンス協同データベース（回答：滋賀県立図書館） https://crd.ndl.go.jp/reference/entry/index.php?id=1000092351&page=ref_view （取得日：2026-11-18）","本文：","- 滋賀県公式「滋賀県のすがた」は、「滋賀県の名前は、県庁のある大津市が、明治31年（1898年）まで『滋賀郡大津町』であったことに由来します」と記す。すなわち県名は滋賀郡に由来する。","注記・食い違い：","- レファレンス協同データベース（滋賀県立図書館の回答）は『角川日本地名大辞典25 滋賀県』の「〔県名の由来〕滋賀郡の滋賀からきており、さざなみの志賀に通じるところから採用されたと思われるが、確実な史料はない」とする記述を紹介している。県公式の説明と大意は一致するが、「確実な史料はない」との留保がある（併記）。","- 同レファレンスは『志賀町史 第1巻』から1872年（明治5年）の改称経緯を引用する。同書の印刷には「明治五年（一八七三）一月」とあるが、レファレンス側で1872年の誤植である旨が注記されている。","- 「しが」の語源については諸説ある（『市町村名語源辞典』はシ（石）・カ（接尾語）で「石の多い所」か、スカ（砂州）の転とする。『日本地名大事典』は「シカ（石処）」の意とする）。いずれも仮説であり、確定した語源は未確認。","---"],"tables":[]}],"e":[{"h":"概要・出典","lv":2,"text":["出典：","- Wikipedia「彦根城」 https://ja.wikipedia.org/wiki/彦根城 （取得日：2026-11-18）","- Wikipedia「膳所城」 https://ja.wikipedia.org/wiki/膳所城 （取得日：2026-11-18）","- Wikipedia「長浜城（近江国）」 https://ja.wikipedia.org/wiki/長浜城_(近江国) （取得日：2026-11-18）","- Wikipedia「安土城」 https://ja.wikipedia.org/wiki/安土城 （取得日：2026-11-18）","- Wikipedia「大津城」 https://ja.wikipedia.org/wiki/大津城 （取得日：2026-11-18）","- Wikipedia「佐和山城」 https://ja.wikipedia.org/wiki/佐和山城 （取得日：2026-11-18）","- Wikipedia「観音寺城」 https://ja.wikipedia.org/wiki/観音寺城 （取得日：2026-11-18）","- Wikipedia「小谷城」 https://ja.wikipedia.org/wiki/小谷城 （取得日：2026-11-18）","- Wikipedia「水口岡山城」 https://ja.wikipedia.org/wiki/水口岡山城 （取得日：2026-11-18）","- Wikipedia「水口城」 https://ja.wikipedia.org/wiki/水口城 （取得日：2026-11-18）","- Wikipedia「現存天守」 https://ja.wikipedia.org/wiki/現存天守 （取得日：2026-11-18）","注記・食い違い：","- 現存天守：Wikipedia「現存天守」の現存12城は弘前城・松本城・丸岡城・犬山城・彦根城・姫路城・松江城・備中松山城・丸亀城・松山城・宇和島城・高知城であり、滋賀県内は彦根城のみである。同記事は彦根城について「1622年（元和8年）築城 - 1874年（明治7年）廃城」「天守建造年：1606年（慶長11年）」「文化財指定：特別史跡、国宝2棟・重要文化財5棟」とする。","- 彦根城の築城年について、Wikipedia「彦根城」の基礎情報欄は「1604年（慶長9年）竣工 1622年（元和8年）落成」とする一方、本文は築城開始1603年（慶長8年）、天守完成1606年、全工事完了1622年とする（枠組みの異なる表記として併記）。Wikipedia「彦根城」は「滋賀県は廃城令で解体された城が多く、彦根城は県内唯一の保存例」と記す。","- 時限情報（2026-11-18時点）：彦根城は1992年10月1日に世界遺産暫定リストに掲載された。2026年9月3日、文化審議会世界文化遺産部会が彦根城を本年度の世界文化遺産の国内推薦候補に選定したと文化庁が発表した（文化庁の報道発表資料（令和8年9月3日付）は「９月３日（木）に開催された文化審議会世界文化遺産部会において、「彦根城」を本年度の世界文化遺産の推薦候補とすることが答申されました」とする。彦根城世界遺産登録推進協議会（滋賀県・彦根市）の発表、共同通信プレスリリースによる）。世界遺産への登録はまだされておらず、政府の正式推薦もこれからであり、最短で2028年の世界遺産委員会での審査を目指すとされる。","- 観音寺城の築城年について、基礎情報欄は応仁・文明年間（1467年〜1487年）とする一方、本文は「建武2年（1335年）には観音正寺を臨時の砦として活用していたと考えられている」と記す（併記）。","- 小谷城の築城年について、基礎情報欄は1516年（永正13年）とする一方、本文は『浅井三代記』の1516年説には疑問点が多く、1523年（大永3年）〜1524年（大永4年）の築城説が有力とする（併記）。","- 安土城は、天守が1582年の本能寺の変後に焼失した後も二の丸で城として機能し、1585年（天正13年）に廃城となった（Wikipedia「安土城」）。","- 水口岡山城と水口城は別の城である。水口岡山城は中村一氏が築いた戦国期の山城で、水口城は1634年に徳川家光の上洛時の宿館として築かれ、のちに水口藩の居城となった平城である。","- 各城の文化庁文化遺産オンラインの個別レコードは直接取得できておらず、指定情報はWikipediaの記事の記載による。","---"],"tables":[{"cols":["番号","城名","読み","築城者","築城年","廃城年","現状・現存する建物","出典の種別"],"rows":[["1","彦根城","ひこねじょう","井伊直継","1604年（慶長9年）","1874年（明治7年）","天守（国宝）・附櫓及び多聞櫓（国宝）が現存。櫓・門・馬屋等5棟が重要文化財。城跡は特別史跡。別名は金亀城（こんきじょう）","Wikipedia"],["2","膳所城","ぜぜじょう","徳川家康","1601年（慶長6年）","1870年","天守（4重4階）は非現存。石垣が残り、移築された大手門・北大手門・南大手門が国の重要文化財（いずれも他所へ移築）。現在は膳所城跡公園。別名は石鹿城・望湖城","Wikipedia"],["3","長浜城","ながはまじょう","羽柴秀吉","1573年（天正元年）","1615年（慶長20年）","天守はなかった。現在の建物は1983年の鉄筋コンクリート造模擬天守（長浜城歴史博物館）。石垣・堀が残る。市指定史跡。別名は今浜城","Wikipedia"],["4","安土城","あづちじょう","織田信長","1576年（天正4年）","1585年（天正13年）","天守（望楼型5重6階地下1階、1579年築）は非現存。天守台・曲輪・石垣・堀が残る。摠見寺に仁王門・三重塔が残る。国の特別史跡","Wikipedia"],["5","大津城","おおつじょう","浅野長政","1586年（天正14年）","1601年（慶長6年）","天守（望楼型4重5階）は非現存。遺構は埋没（堀等）。未指定","Wikipedia"],["6","佐和山城","さわやまじょう","伝・佐保氏","鎌倉時代","1606年（慶長11年）","天守（五層、三層説あり。1595年築）は非現存。石垣・土塁・堀・曲輪等が残る。未指定。主な改修者は石田三成","Wikipedia"],["7","観音寺城","かんのんじじょう","六角氏頼","応仁・文明年間（1467年〜1487年）","1568年（永禄11年）","天守構造なし（屋形二階）。曲輪・土塁・石垣・竪堀・虎口・堀切・井戸が残る。国の史跡。別名は佐々木城・鷦鷯城（さゝきのしろ）","Wikipedia"],["8","小谷城","おだにじょう","浅井亮政","1516年（永正13年）","1575年（天正3年）","天守（望楼型2重3階）は非現存。曲輪・堀切・土塁・石垣・縦堀・礎石・虎口が残る。国の史跡","Wikipedia"],["9","水口岡山城","みなくちおかやまじょう","中村一氏","1585年（天正13年）","1600年（慶長5年）","天守構造は不明。石垣・堀切が残る。国の史跡「水口岡山城跡」（2017年2月9日指定）。別名は古城山城・岡山城・古城","Wikipedia"],["10","水口城","みなくちじょう","徳川家光","1634年（寛永11年）","1873年（明治6年）","天守構造は不明。石垣・堀が残る。滋賀県史跡。乾矢倉を再移築した水口城資料館がある。別名は碧水城","Wikipedia"]]}]}],"f":[{"h":"f-1 江戸時代に成立していたもの","lv":2,"text":["出典：","- Wikipedia「鮒ずし」 https://ja.wikipedia.org/wiki/鮒ずし （取得日：2026-11-18）","- 近畿農政局「地理的表示近畿地域登録産品」（近江牛の紹介を含む） https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （取得日：2026-11-18）","- 滋賀県公式「近江の茶」 http://www.pref.shiga.lg.jp/sa30/6624.html （取得日：2026-11-18）","- 滋賀県公式「メイド・イン・滋賀（湖東麻織物）」 http://www.pref.shiga.lg.jp/fd00/6494.html （取得日：2026-11-18）","- 和た与 公式サイト「和た与の歴史」 https://watayo.com/about （取得日：2026-11-18）","- 国立国会図書館 レファレンス協同データベース「近江八幡の和菓子『でっち羊羹』の由来を知りたい」 https://crd.ndl.go.jp/reference/entry/index.php?id=1000113800&page=ref_view （取得日：2026-11-18）","注記・食い違い：","- 赤こんにゃくは江戸時代の表に入れなかった。起源については織田信長が赤く染めさせたとする説、左義長祭の赤紙に由来するとする説、豊臣秀吉に由来するとする説など伝承のみで、製造元（元祖乃利松）自身が「文献として正確な資料は現存しておりません」としている。江戸時代の成立を公的・学術出典で確認できなかったため除外し、理由をここに記す。","- 丁稚羊羹の由来について、レファレンス協同データベースは『日本銘菓事典』を引き、和た与のでっち羊羹は「文久３年（１８６３）、砂糖問屋に奉公していた初代小川与惣松が作り出したもの」とし、名称の由来は丁稚奉公説と「でっちる」説の両説を併記している。和た与公式サイトの記述と一致する。"],"tables":[{"cols":["番号","名称","読み","成立時期","備考","出典の種別"],"rows":[["1","鮒寿司","ふなずし","起源は奈良時代・平安時代（江戸時代には成立済み）","『延喜式』に近江国筑摩厨（現在の米原市）から「鮨鮒」が貢納された記録がある。Wikipedia「鮒ずし」は「江戸時代以来、主に琵琶湖の固有種であるニゴロブナが最適とされてきた」と記す","Wikipedia"],["2","近江牛","おうみうし／おうみぎゅう","江戸時代","近畿農政局のGI紹介は「牛肉食が禁止されていた江戸時代、彦根藩は将軍家への献上のため、唯一、牛肉の生産が許されていました」と記す。GIの特性欄は「約400年前から生産が続く最も古い銘柄牛のひとつ」とする","公的"],["3","近江茶（土山茶・政所茶）","おうみちゃ（つちやまちゃ・まんどころちゃ）","土山茶は南北朝時代に始まり江戸時代に栽培が盛ん。政所茶は室町時代に栽培開始","滋賀県公式「近江の茶」は、805年に最澄が唐から茶種を持ち帰り比叡山麓の坂本に播いたのが始まりと「いわれて」いる（伝承としての表現のまま転記）。政所茶については「宇治は茶所、茶は政所」と謳われたとする紹介がある（その他出典）","自治体／その他（内容）"],["4","近江上布（高宮布）","おうみじょうふ（たかみやふ）","室町時代から生産の記録があり、江戸時代に発展","滋賀県公式「メイド・イン・滋賀（湖東麻織物）」は「江戸時代には農業の副業として彦根藩の手厚い保護のもとで発展し、近江商人により全国に販売されて、その名を高めた」「彦根藩に上納されていた上等の布であったことから（近江上布と）呼ばれるようになったと伝わる」と記す","自治体"],["5","丁稚羊羹","でっちようかん","江戸時代（文久3年（1863年））","和た与の公式サイトは「創業は文久三年(1863年)。砂糖問屋『綿伍』に奉公していた初代小川与惣松が暖簾分けを許され（中略）『綿与』という店を、ここ、近江八幡の地に開いた」と記す。名称の由来は、丁稚が帰郷の土産に買ったためとする説と、菓子屋用語でこね合わせることを「でっちる」ということからとする説の両方を公式サイトが併記しており、定まっていない","その他（企業公式）／公的（レファレンス協同データベース）"]]}]},{"h":"f-2 現代の公的な認定","lv":2,"text":["出典：","- 滋賀県公式「滋賀県の伝統的工芸品について」 http://www.pref.shiga.lg.jp/ippan/shigotosangyou/kigyou/20017.html （取得日：2026-11-18）","- 近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、取得日：2026-11-18）","- 近畿農政局「地域団体商標の活用について」（近畿における農林水産物・食品の地域団体商標（令和6年1月現在）を含む） https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （取得日：2026-11-18）","伝統的工芸品（経済産業大臣指定）：滋賀県は3品目である。彦根仏壇、信楽焼、近江上布（滋賀県公式）。このほか滋賀県知事指定の伝統的工芸品が36品目42製造者ある（第13次指定後。滋賀県公式）。","- 注記：滋賀県公式ページは全国の指定数を「伝統的工芸品241品目、伝統的工芸材料・工芸用具3品目（令和7年10月27日時点）」と記す。他県の調査で用いた伝統的工芸品産業振興協会の都道府県別リスト（2025年10月27日現在）は全国244品目としており、数え方（材料・工芸用具を含むか）に差がある可能性がある（食い違いとして併記）。同協会の都道府県別リスト自体は今回直接取得できていない。","地理的表示（GI）：滋賀県は4件である（近畿農政局、令和8年3月25日現在。近畿全体では18産品）。","地域団体商標（農林水産物・食品、近畿農政局、令和6年1月現在）：滋賀県は6件である。近江牛、琵琶湖産鮎、甲賀のお茶、モリヤマメロン、草津メロン、政所茶（まんどころちゃ）。","- 工芸系の地域団体商標として、彦根仏壇（ひこねぶつだん、彦根仏壇事業協同組合）と信楽焼（しがらきやき、信楽陶器工業協同組合・信楽陶器卸商業協同組合）がある（特許庁・INPITの地域団体商標カードによる）。","---"],"tables":[{"cols":["番号","名称","読み","登録番号・登録日","生産地・団体","出典の種別"],"rows":[["1","近江牛","オウミウシ、オウミギュウ","第56号、2017年12月15日","生産地は滋賀県。団体は一般社団法人滋賀県畜産振興協会","公的"],["2","伊吹そば","いぶきそば","第85号、2019年9月9日","団体は伊吹そば生産組合。生産地は一覧表では「滋賀県内」、詳細では「滋賀県米原市」とされ、表記が異なる（併記）","公的"],["3","近江日野産日野菜","おうみひのさんひのな","第122号","生産地は滋賀県蒲生郡日野町。団体はグリーン近江農業協同組合","公的"],["4","水口かんぴょう","みなくちかんぴょう","第150号","生産地は滋賀県甲賀市水口町。団体は甲賀農業協同組合","公的"]]}]}],"g":[{"h":"概要・出典","lv":2,"text":["出典：","- Wikipedia「近江国」 https://ja.wikipedia.org/wiki/近江国 （取得日：2026-11-18）","注記・食い違い：","- 国分僧寺について、本文の変遷（甲可寺→瀬田廃寺→国昌寺跡）と基礎情報欄の推定地3か所の表記は対応関係が記事内で明示されておらず、両方を併記した。","- 本項目はすべてWikipediaのみで、公的出典での照合は未実施。","---"],"tables":[{"cols":["番号","項目","内容","備考","出典の種別"],"rows":[["1","国司の等級","大国","距離区分は近国","Wikipedia"],["2","国府","栗太郡勢多","国府跡は大津市三大寺で1964年に発見された。記事は「国府の遺跡が発見された最初の例である」と記す","Wikipedia"],["3","一宮","建部大社（大津市）","二宮は日吉大社、三宮は多賀大社または御上神社とされる","Wikipedia"],["4","総社","不明","記事は総社を「不明」とする","Wikipedia"],["5","国分僧寺","はじめ甲可寺（甲賀市信楽町、紫香楽宮跡とされてきた）、のち瀬田廃寺（大津市神領）、焼失後820年（弘仁11年）に国昌寺跡（大津市国分）へ移転","記事の基礎情報欄では近江国分寺の推定地を「1.甲賀市（紫香楽宮跡） 2.大津市野郷原 3.大津市光が丘町」と別枠で示しており、本文の変遷記述と枠組みが異なる（併記）","Wikipedia"],["6","国分尼寺","（未詳）","石山国分遺跡（大津市国分）が尼寺跡として有力視されている","Wikipedia"],["7","延喜式内社","155座142社","大社13座10社・小社142座132社。大社はすべて名神大社","Wikipedia"]]}]}],"h":[{"h":"概要・出典","lv":2,"text":["定義：h-1 老舗企業＝2026年時点で創業100年以上（創業1926年以前）・現営業中・本社が滋賀県内。創業年は各社公式の沿革で裏取りし、法人設立年と分けて書く。本社を県外へ移した企業は本体に入れず注記で区別する。h-2 現代を代表する企業＝現在滋賀県に本社のある代表的企業（公式の会社概要で確認）。"],"tables":[]},{"h":"h-1 老舗企業（企業公式で確認できたもの：4社）","lv":2,"text":["出典：","- Wikipedia「冨田酒造」 https://ja.wikipedia.org/wiki/冨田酒造 （取得日：2026-11-18）","- 冨田酒造有限会社 公式サイト「冨田酒造について」 https://7yari.co.jp/aboutus/ （取得日：2026-11-18）","- 大塚産業マテリアル株式会社 公式サイト「沿革」 https://www.otksm.co.jp/company/history/ （取得日：2026-11-18）","- 滋賀県公式「滋賀に息づく長寿企業」（令和8年版リーフレット） https://www.pref.shiga.lg.jp/documents/15293/20261026105657.pdf （取得日：2026-11-18）","- 和た与 公式サイト https://watayo.com/ （取得日：2026-11-18）","- 株式会社たねや 公式発表（PR TIMES掲載の会社概要） https://prtimes.jp/main/html/rd/p/000000038.000101884.html （取得日：2026-11-18）","注記・食い違い：","- 冨田酒造の創業年について、同社の公式サイトは「冨田酒造は、天文年間（1532〜1555）初期の創業の酒蔵です。初代高保が母方の縁を頼り木之本へ移り、武士の身分を離れ酒を造るようになったと伝わります」と記すのみで、1534年（天文3年）という年は企業公式では未確認である。本文の1534年はWikipediaによる。","- 冨田酒造の創業年について、酒蔵紹介サイトTerroir HUB SAKEは1532年（天文元年）とする一方、Wikipediaは1534年（天文3年）とする（食い違い。両論併記）。","- 大塚産業マテリアルの創業について、同社の公式サイトの沿革は冒頭を「1700年代初頭 — 長浜地方において麻蚊帳の生産を起こす」とし、2006年の項に「大塚産業グループの創業が300周年を迎える」と記す。県リーフレットの「1700年代初頭」と企業公式の表記は一致する。","- 大塚産業マテリアルの創業年について、滋賀県公式リーフレットは「1700年代初頭」とする一方、中小企業庁系のポータル資料は「1706年3月」とする（食い違い。両論併記）。","- たねやの本社所在地について、Wikipediaは近江八幡市宮内町3番地とする一方、同社の公式発表（PR TIMES掲載の会社概要）は近江八幡市北之庄町615-1とする（食い違い。企業公式の表記を本文に置いた）。"],"tables":[{"cols":["番号","企業名","読み","創業年（設立年）","本社所在地","業種・事業内容","備考","出典の種別"],"rows":[["1","冨田酒造有限会社","とみたしゅぞう","1534年（天文3年）（法人設立年は記事に明記なし）","滋賀県長浜市木之本町木之本1107","清酒製造（主要銘柄「七本鎗」）","Wikipediaは「現存する日本の酒造会社としては5番目に古い」と記す。企業公式サイトは創業を「天文年間（1532〜1555）初期」とし、1534年という具体的な年は企業公式では未確認","Wikipedia"],["2","大塚産業マテリアル株式会社","おおつかさんぎょうまてりある","1700年代初頭（設立1987年3月31日）","滋賀県長浜市八幡中山町1番地","自動車内装部品の製造販売（不織布成形）","創業時は蚊帳産業。滋賀県公式リーフレットの掲載企業で最も古い。創業は企業公式の沿革でも「1700年代初頭」と確認できる","その他（企業公式）／自治体"],["3","株式会社和た与","わたよ","1863年（文久3年）（法人設立年は公式サイトに明記なし）","滋賀県近江八幡市玉木町2-3","和菓子製造販売（でっち羊羹）","初代小川与惣松が創業。「でっち羊羹発祥の店」を称する","その他（企業公式）"],["4","株式会社たねや","たねや","1872年（明治5年）（設立1972年8月）","滋賀県近江八幡市北之庄町615-1","菓子製造販売事業、飲食","洋菓子の「クラブハリエ」はグループ会社（株式会社クラブハリエ）の事業であり、たねや本体とは分けて扱う","その他（企業公式）"]]}]},{"h":"h-1 補足：滋賀県公式ガイドブックに掲載された創業1926年以前の企業","lv":2,"text":["滋賀県公式「滋賀に息づく長寿企業～創業70年以上の滋賀県企業ガイドブック～」（令和8年1月発行、掲載情報は令和8年1月現在）には、上記のほか次の企業が創業1926年以前として掲載されている。創業年は同ガイドブックによる。本社所在地は再確認（2026年11月18日）で各社の企業公式サイト等により確認し、備考に記した。","本社が県外の次の5社は、「本社が県内」の基準から外した（県ガイドブックは「本社または生産・開発拠点」で掲載）：株式会社写真化学（1868年）、平岡織染株式会社（1902年）、日本カーボン株式会社（1915年）、株式会社大和バルブ（1919年）、行田電線株式会社（1923年）。"],"tables":[{"cols":["番号","企業名","創業年","備考","出典の種別"],"rows":[["2","日の本辨工業株式会社","1884年","本社は滋賀県彦根市八坂町1236番地（企業公式）","自治体"],["3","京都建物辻正株式会社","1897年","本社は滋賀県甲賀市甲賀町相模141番地の1（企業公式）。社名に「京都」を含むが本社は滋賀県内","自治体"],["4","近江度量衡株式会社","1900年","本社は滋賀県草津市東矢倉3丁目11番70号（企業公式）","自治体"],["5","株式会社オーケーエム","1902年","本社は滋賀県野洲市市三宅446番地1。登記上の本店は滋賀県蒲生郡日野町大字大谷446番地の1（有価証券報告書）","自治体"],["8","株式会社メタルアート","1916年","ガイドブックでは「特別編：大企業」に掲載。本社は滋賀県草津市野路3丁目2番18号（企業公式）。創業は1916年5月5日、大阪市此花区の後藤鍛工所として（企業公式）","自治体"],["10","三陽建設株式会社","1920年","本社は滋賀県甲賀市甲賀町田堵野890番地の1（企業公式）。創業は大正9年（1920年）に宮大工棟梁船田粂一が建築請負業を開業したことによる（企業公式）","自治体"],["11","廣瀬バルブ工業株式会社","1923年","本社は滋賀県彦根市芹川町436（企業公式）。創業は1923年（大正12年）6月","自治体"]]}]},{"h":"h-2 現代を代表する企業","lv":2,"text":["出典：","- 日本電気硝子株式会社 公式発表（会社概要） https://www.neg.co.jp/ （取得日：2026-11-18）","- 株式会社平和堂 公式発表（会社概要） https://www.heiwado.jp/ （取得日：2026-11-18）","- 株式会社滋賀銀行（会社概要の紹介資料による） https://www.shigagin.com/ （取得日：2026-11-18）","- フジテック株式会社 公式サイト「会社概要」 https://www.fujitec.co.jp/corporate/outline （取得日：2026-11-18）","注記・食い違い：","- 平和堂の創業について、Wikipediaは1953年（昭和28年）12月に夏原平次郎が夏原商店を開店したことを創業とし、1957年に株式会社平和堂を設立したとする。一方、しがぎん経済文化センターの資料は「1957年に滋賀県彦根市の銀座街の一角に『靴とカバンの店 平和堂』を創業」とする（食い違い。両論併記）。","- 日本電気硝子の設立年について、求人情報サイト等の資料には「設立1944年10月31日」とするものがあるが、同社の会社概要は「創立1949年12月1日」としており、企業公式の表記を本文に置いた（併記）。","- フジテックの本社所在地について、同社の公式サイトの会社概要は「本社 ビッグウィング 〒522-8588 滋賀県彦根市宮田町591-1」とし、併せて東京本社（〒108-8307 東京都港区白金1-17-3）を示す。京都市南区上鳥羽鉾立町とする一部の二次資料の表記は、企業公式の資料では確認できなかった。","- 本社を県外へ移した企業（本体に入れず注記で区別）：西川株式会社は1566年（永禄9年）に初代仁右衛門が近江八幡で蚊帳・生活用品の販売業として創業した近江商人発祥の企業であるが、現在の本社は東京都中央区日本橋富沢町8番8号であり（設立1947年6月2日）、h-1の本体には入れなかった。東レ株式会社は本社が東京都のため対象外である（滋賀事業場は大津市にある）。","- オプテックスグループ株式会社（大津市）は候補として挙がったが、今回公式の会社概要での確認まで至らなかったため未収録とした。","- h-1で企業公式により確認できたのは4社である。補足表の12社は滋賀県公式ガイドブックの掲載に基づく。","---"],"tables":[{"cols":["番号","企業名","読み","創業年（設立年）","本社所在地","業種・事業内容","備考","出典の種別"],"rows":[["1","日本電気硝子株式会社","にっぽんでんきがらす","創立1949年12月1日","滋賀県大津市晴嵐二丁目7番1号","特殊ガラス製品の製造・販売およびガラス製造機械の製作・販売","会社概要では「創立」の表記を用いる","その他（企業公式）"],["2","株式会社平和堂","へいわどう","設立1957年6月","滋賀県彦根市西今町1番地","食料品・衣料品・住居関連品等の総合小売業及び店舗賃貸業等","創業年の表記には資料により差がある（注記参照）","その他（企業公式）"],["3","フジテック株式会社","ふじてっく","設立1948年2月","滋賀県彦根市宮田町591番地1","エレベータ、エスカレータ、動く歩道等の研究開発・製造・販売","本社のほかに東京本社（東京都港区白金1-17-3）を置く","その他（企業公式）"],["4","株式会社滋賀銀行","しがぎんこう","創立1933年10月","滋賀県大津市浜町1-38","普通銀行業務","","その他（内容）"]]}]}]},{"id":"wakayama","title":"和歌山県","sub":"旧紀伊国","meta":["取得日：2026-11-18","前提：和歌山県の県域は旧紀伊国の大半に当たるが、紀伊国のうち三重県域（旧牟婁郡の東部、現在の三重県南牟婁郡・北牟婁郡・熊野市・尾鷲市など）は和歌山県域に含まれない（項目a参照）。項目gは紀伊国全体の制度を扱う。","---","# a. 旧国名：紀伊国"],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai","kokumei"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun","han","tenryo","mikuriya","senko"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"県名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai","kokumei"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["紀伊国の郷数は55郷と53郷で食い違う（確定値は未確認）。"],"b":["藩と藩主・石高はWikipediaのみ。松島城は和歌山県内の城として確認できなかった。"],"c":["五條県の廃止は1872年1月2日（明治4年11月22日）。高野山領の移管は、日単位では未確定（11月1日説と11月22日説）。","和歌山・田辺・新宮3県の統合は県公式の資料で確認した。JACARでの照合は未実施。"],"d":["県名の由来は、県広報紙を引く二次出典などによる。県公式の単独説明は確認できなかった。","東書Eネットの記述は、根拠未確認。"],"e":["新宮城跡が国の史跡で石垣のみが残ることは県公式で確認した。国指定文化財データベースの個別照合は未実施。"],"f":["金山寺味噌・紀州みかん・梅などは農林水産省の資料で確認した。","県指定の郷土伝統的工芸品（根来塗・紀州雛）は、県公式での確認が未了。"],"g":["総社が府守神社であることの確定した出典は未確認。日前宮が一宮とされる12世紀後半以前の根拠も未確認。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","総本家駿河屋の1461年は、企業側の伝承（会社の主張）。法人設立年は未確認。","角長（1841年）・紀陽銀行（1895年）は公式ページなどで確認した。","ノーリツ鋼機は発祥が和歌山市だが、本店が移ったため注記のみ。","早和果樹園は創業年の確認未了のため未収録。"]},"a":[{"h":"概要・出典","lv":2,"text":["取得日：2026-11-18","前提：和歌山県の県域は旧紀伊国の大半に当たるが、紀伊国のうち三重県域（旧牟婁郡の東部、現在の三重県南牟婁郡・北牟婁郡・熊野市・尾鷲市など）は和歌山県域に含まれない（項目a参照）。項目gは紀伊国全体の制度を扱う。","---"],"tables":[]},{"h":"出典","lv":2,"text":["- Wikipedia「紀伊国」 https://ja.wikipedia.org/wiki/%E7%B4%80%E4%BC%8A%E5%9B%BD （取得日：2026-11-18）","- コトバンク「紀伊国」（世界大百科事典） https://kotobank.jp/word/%E7%B4%80%E4%BC%8A%E5%9B%BD-49858 （取得日：2026-11-18）"],"tables":[]},{"h":"表","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","所属・別称","郡数・郷数","備考","出典の種別"],"rows":[["1","紀伊国","きいのくに","南海道。別称：紀州（きしゅう）。異称「きのくに」","7郡55郷","7郡は伊都・那賀・名草・海部・在田（有田）・日高・牟婁。名称は7世紀当初「木国（きのくに）」とされ、和銅6年（713年）の好字令で「紀伊国」の表記になった","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["- Wikipedia「紀伊国」冒頭の記述（原文）：「南海道に属し、和歌山県と三重県南西部に属する」。","- 明治直前の領域（Wikipedia「紀伊国」）：現在の和歌山県に加え、三重県南牟婁郡紀宝町・御浜町、熊野市、尾鷲市、北牟婁郡紀北町、度会郡大紀町の一部（錦）、奈良県五條市の一部（畑田町の一部）を含む。牟婁郡は明治に四分され、東牟婁郡・西牟婁郡は和歌山県、南牟婁郡・北牟婁郡は三重県となった（1879年）。","- すなわち、旧紀伊国のうち旧熊野エリアの東部（三重県域）は現在の和歌山県域に含まれない。","- 食い違い（郷数）：Wikipedia「紀伊国」基礎情報欄は「7郡55郷」。コトバンク「世界大百科事典」の紀伊国解説は「7郡53郷」とする。なおコトバンク「日本歴史地名大系」は8世紀の史料「律書残篇」に「紀伊国郡七・郷三十七」とあることを引く（時代の異なる数値）。","---"],"tables":[]}],"b":[{"h":"出典","lv":2,"text":["- Wikipedia「紀州藩」 https://ja.wikipedia.org/wiki/%E7%B4%80%E5%B7%9E%E8%97%A9 （取得日：2026-11-18）","- Wikipedia「紀伊田辺藩」 http://ja.wikipedia.org/wiki/%E7%B4%80%E4%BC%8A%E7%94%B0%E8%BE%BA%E8%97%A9 （取得日：2026-11-18）","- Wikipedia「紀伊新宮藩」 https://ja.wikipedia.org/wiki/%E7%B4%80%E4%BC%8A%E6%96%B0%E5%AE%AE%E8%97%A9 （取得日：2026-11-18）","- Wikipedia「紀伊国」（藩一覧） https://ja.wikipedia.org/wiki/%E7%B4%80%E4%BC%8A%E5%9B%BD （取得日：2026-11-18）"],"tables":[]},{"h":"表","lv":2,"text":[],"tables":[{"cols":["番号","藩名","読み","初代藩主","最後の藩主","石高","期間","備考","出典の種別"],"rows":[["1","紀州藩（紀伊藩、明治の新名称は和歌山藩）","きしゅうはん（きいはん、わかやまはん）","浅野幸長（あさの よしなが）","徳川茂承（とくがわ もちつぐ）","浅野家37万6千石（外様）。紀州徳川家55万5千石（御三家）。石高には附家老の水野家新宮領と安藤家田辺領を含む","1600年立藩〜1871年廃藩","浅野幸長（1600〜1613年）、浅野長晟（あさの ながあきら、1613〜1619年）ののち、1619年に徳川頼宣（とくがわ よりのぶ）が入部し紀州徳川家となる。第14代が茂承（1858〜1869年）。支藩は伊予西条藩3万石（現在の愛媛県域で、和歌山県域ではない）","Wikipedia"],["2","紀伊田辺藩","きいたなべはん","安藤直次（あんどう なおつぐ）","安藤直裕（あんどう なおひろ）","3万8千石","立藩は1868年（慶応4年）。廃藩は1871年","紀州藩附家老・安藤家（安藤帯刀家）の領地。江戸時代を通じて独立した藩としては扱われず、藩主が諸侯に列し正式に藩と認められたのは明治維新後。慶応4年（1868年）正月に明治政府によって独立藩と認められ和歌山藩から自立した。歴代は16代まで数えられ、17代に安藤直行（あんどう なおゆき）、18代に直裕が再勤し、最後は直裕。明治4年の廃藩置県で田辺県を経て和歌山県に編入","Wikipedia"],["3","紀伊新宮藩","きいしんぐうはん","水野忠幹（みずの ただもと）","水野忠幹（みずの ただもと）","水野家3万5千石（江戸幕府公認）。浅野家時代は2万8千石","立藩は慶応4年（1868年）。廃藩は明治4年（1871年）","紀州藩附家老・水野家の領地。陪臣のため藩扱いされず、維新に立藩した。浅野家時代の藩主は浅野忠吉（あさの ただよし、1600〜1619年）。水野家歴代は水野重央（みずの しげなか、1619〜1621年）に始まり10代・水野忠幹（1860〜1871年）まで","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 付家老領の扱い：田辺（安藤家3万8千石）・新宮（水野家3万5千石）は紀州藩の附家老の領地であり、江戸時代を通じて独立藩とは扱われなかった。藩として独立したのは慶応4年（1868年）である（項目cの田辺県・新宮県に接続する）。このほか紀州藩の附家老領として三浦家（紀伊貴志領1万5千石）・久野家（伊勢田丸城代1万石）があるが、藩とはされていない（久野家の田丸は伊勢国で県域外）。","- 食い違い（紀州藩の始まり）：Wikipedia「紀伊国」の藩一覧表は紀州藩の家を「桑山家（1600年〜1601年、2万石）→浅野家（1601年〜1619年）」と書くが、Wikipedia「紀州藩」は立藩1600年・初代藩主を浅野幸長とする。桑山重晴・一晴は和歌山城代／城主としての扱いの差とみられるが、出典同士の表記の違いとして併記する。","- 新宮藩の藩史記述では水野重央の転封を「元和7年（1621年）」とする箇所がある一方、歴代表は元和5年（1619年）から始まる。記事内の表記の差として注記する。","---"],"tables":[]}],"c":[{"h":"出典","lv":2,"text":["- Wikipedia「紀伊国」（近世以降の沿革） https://ja.wikipedia.org/wiki/%E7%B4%80%E4%BC%8A%E5%9B%BD （取得日：2026-11-18）","- 和歌山県東京事務所メールマガジン（和歌山県公式、pref.wakayama.lg.jp のPDF）（取得日：2026-11-18）","- 東書Eネット「都道府県の豆知識 和歌山県」 https://ten.tokyo-shoseki.co.jp/ten_download/2020/2020078367.htm （取得日：2026-11-18）","- Wikipedia「和歌山県」（年表） https://ja.wikipedia.org/wiki/%E5%92%8C%E6%AD%8C%E5%B1%B1%E7%9C%8C （取得日：2026-11-18）"],"tables":[]},{"h":"表","lv":2,"text":[],"tables":[{"cols":["番号","県名","読み","設置","統合・廃止","備考","出典の種別"],"rows":[["1","和歌山県（第1次）","わかやまけん","1871年8月29日（明治4年7月14日）、廃藩置県により和歌山藩（紀州藩）から設置","1872年1月2日（明治4年11月22日）の第1次府県統合で田辺県・新宮県等を編入し、和歌山県（第2次）となる","東書Eネット：「明治4年7月14日、砂の丸にあった政事庁を和歌山県庁としました」","Wikipedia"],["2","田辺県","―（出典に読みの明記なし）","1871年8月29日（明治4年7月14日）、田辺藩から設置","1872年1月2日（明治4年11月22日）、和歌山県に統合","田辺藩は1868年に紀州藩附家老領から独立藩となったもの","Wikipedia"],["3","新宮県","―（出典に読みの明記なし）","1871年8月29日（明治4年7月14日）、新宮藩から設置","1872年1月2日（明治4年11月22日）、和歌山県に統合","新宮藩は1868年に紀州藩附家老領から独立藩となったもの","Wikipedia"],["4","五條県（高野山領分）","ごじょうけん","高野山領は1869年（明治2年）8月に堺県管轄、1870年5月27日（明治3年4月27日）に五條県へ移管","1872年1月2日（明治4年11月22日）の第1次府県統合で和歌山県へ。五條県は同日廃止（大和国分は奈良県、河内国分は堺県へ）","Wikipedia「紀伊国」は「明治4年11月1日（1871年12月12日）に五條県の管轄地域が和歌山県の管轄となる」とし、和歌山県広報紙「県民の友」は11月22日に「五條県の旧高野山領」が統合されたとする。東書Eネットは「高野山領は明治4年11月に和歌山県に統合され現在の県域が定まった」とする（下記注記参照）","Wikipedia"],["5","度会県（牟婁郡分）","わたらいけん","1872年1月2日（明治4年11月22日）の第1次府県統合により、牟婁郡の一部（概ね熊野川・北山川以東、後の北牟婁郡・南牟婁郡）が和歌山県から度会県へ移管","1876年4月18日、第2次府県統合により度会県の牟婁郡が三重県の管轄となる","この1876年の移管により、旧紀伊国の東部が三重県域として確定し、和歌山県の県域がほぼ確定した","Wikipedia"]]}]},{"h":"年表（紀伊国関係分）","lv":2,"text":["- 1868年2月17日（慶応4年1月24日）：新宮領・田辺領が立藩して新宮藩・田辺藩となる。","- 1869年（明治2年）8月：高野山領が堺県管轄となる。","- 1870年5月27日（明治3年4月27日）：堺県管轄地域（高野山領）が五條県へ移る。","- 1871年8月29日（明治4年7月14日）：廃藩置県により、藩領が和歌山県・新宮県・田辺県になる。","- 1872年1月2日（明治4年11月22日）：第1次府県統合により五條県が廃止され、紀伊国分（高野山領）が和歌山県の管轄となる（Wikipedia「五條県」）。Wikipedia「紀伊国」は明治4年11月1日（1871年12月12日）に五條県の管轄地域が和歌山県の管轄となったとする（食い違い。下記注記参照）。","- 1872年1月2日（明治4年11月22日）：第1次府県統合により、牟婁郡の一部（概ね熊野川・北山川以東）が度会県、残部が和歌山県の管轄となる。","- 1876年4月18日：第2次府県統合により、度会県の牟婁郡が三重県の管轄となる。"],"tables":[]},{"h":"注記・食い違い","lv":2,"text":["- 和歌山県公式（県東京事務所メールマガジン）の記述（原文）：「明治4年（1871年）11月22日、和歌山・田辺・新宮の紀州3県の統合により現在の和歌山県が誕生」。この日は「和歌山県ふるさと誕生日」（条例制定）の由来とされる。1871年11月22日は旧暦の日付であり、新暦では1872年1月2日に当たる。","- 食い違い（高野山領の編入時期）：Wikipedia「紀伊国」は五條県管轄地域の和歌山県への移管を「明治4年11月1日（1871年12月12日）」とする一方、Wikipedia「五條県」は第1次府県統合の日（1872年1月2日（明治4年11月22日））に大和・河内・紀伊の各管轄が分かれ「同日五條県廃止」とし、和歌山県広報紙「県民の友」（令和3年12月号）も11月22日に「五條県の旧高野山領」が統合されたとする。東書Eネットは「明治4年11月」と月単位の記述である。五條県の廃止日は1872年1月2日（明治4年11月22日）で一致するが、高野山領の移管日は11月1日説と11月22日説が食い違い、日レベルの確定はできていない（未確認）。詳細は再確認ファイル（37_和歌山県_再確認.md）参照。","- 和歌山県公式・県史による日付の照合は、1871年11月22日の統合については県公式資料で確認できたが、和歌山県（第1次）の設置日（1871年8月29日）等の日レベルでの県公式照合は未実施（未確認）。","- 国立公文書館（JACAR）での照合は未実施。","---"],"tables":[]}],"d":[{"h":"出典","lv":2,"text":["- 東書Eネット「都道府県の豆知識 和歌山県」 https://ten.tokyo-shoseki.co.jp/ten_download/2020/2020078367.htm （取得日：2026-11-18）","- Wikipedia「和歌山県」（地名の由来） https://ja.wikipedia.org/wiki/%E5%92%8C%E6%AD%8C%E5%B1%B1%E7%9C%8C （取得日：2026-11-18）","- 地名由来辞典「和歌山県の由来」（和歌山市公式資料・和歌山県広報紙「県民の友」の内容を引く） https://chimeiyurai.pages.dev/prefectures/wakayama/origin/ （取得日：2026-11-18）"],"tables":[]},{"h":"転記","lv":2,"text":["- 県名は藩名（和歌山藩）に由来する。東書Eネットの記述：古代は「木国（きのくに）」と呼ばれ、713年の好字令で紀伊国となった。「和歌山」と「若山」が混用され、元禄年間ごろ藩が「若山」に統一した。藩名は明治から和歌山藩に統一されたようである。また「和歌山県は、御三家の中でただ一つだけ藩の名前がつけられました」とし、その理由として家茂と和宮の結婚で公武合体に協力したこと等を挙げる（原文ママ）。","- 地名「和歌山」の由来について、Wikipedia「和歌山県」は「『和歌浦』の和歌と『岡山』の山との合成語とされている。豊臣秀吉の命名」とする。同記事の概要では「和歌の浦からの豊臣秀吉の命名による」とする。","- 和歌山市の公式資料によれば（地名由来辞典が引く）、天正13年（1585年）に豊臣秀長が城を築いた際、豊臣秀吉が名勝「和歌浦（わかのうら）」にちなんで命名したものとされる。","- 和歌山県の広報紙「県民の友」は、令和3年12月号で和歌浦の名にちなむ説を有力とし、令和8年（2026年）6月号では築城地の「岡山」と「和歌」の組合せ説を紹介している（地名由来辞典が引く）。"],"tables":[]},{"h":"注記・食い違い","lv":2,"text":["- 食い違い（由来の説明）：「和歌浦にちなむ命名」（和歌山市公式資料・県民の友令和3年12月号）と「和歌浦の『和歌』と岡山の『山』の合成語」（Wikipedia「和歌山県」・県民の友令和8年6月号）とで説明が異なる。両論を併記する。","- 東書Eネットの説明の根拠：東書Eネットが挙げる「家茂と和宮の結婚で公武合体に協力したこと」等を理由とする説明は、同教材自身が「ともいわれています」と伝聞の形で記すものであり、和歌山県広報紙「県民の友」・Wikipedia「和歌山県」など今回確認した他の出典には同旨の説明がなかった。教材の説明（根拠未確認）として扱う。詳細は再確認ファイル（37_和歌山県_再確認.md）参照。","- 和歌山県公式サイトに県名由来を単独で説明するページは、今回の調査では確認できなかった（未確認）。県公式の説明は広報紙「県民の友」の記述を二次的に引いたものである。","---"],"tables":[]}],"e":[{"h":"出典","lv":2,"text":["- Wikipedia「和歌山城」 https://ja.wikipedia.org/wiki/%E5%92%8C%E6%AD%8C%E5%B1%B1%E5%9F%8E （取得日：2026-11-18）","- Wikipedia「新宮城」 https://ja.wikipedia.org/wiki/%E6%96%B0%E5%AE%AE%E5%9F%8E （取得日：2026-11-18）","- 和歌山県公式「新宮城跡（丹鶴城跡）」 https://www.pref.wakayama.lg.jp/prefg/081300/d00214634.html （取得日：2026-11-18）","- Wikipedia「田辺城 (紀伊国)」 https://ja.wikipedia.org/wiki/%E7%94%B0%E8%BE%BA%E5%9F%8E_(%E7%B4%80%E4%BC%8A%E5%9B%BD) （取得日：2026-11-18）","- コトバンク「田辺城」（講談社『日本の城がわかる事典』） https://kotobank.jp/word/%E7%94%B0%E8%BE%BA%E5%9F%8E-180105 （取得日：2026-11-18）"],"tables":[]},{"h":"表","lv":2,"text":[],"tables":[{"cols":["番号","城名","読み","築城者","築城年","廃城年","現状・現存する建物","出典の種別"],"rows":[["1","和歌山城","わかやまじょう","豊臣秀長","1585年（天正13年）","1871年（明治4年）","別名は虎伏城、竹垣城。天守は連立式層塔型3重3階（1605年築・1850年再建・1958年外観復元）。遺構は門・塀、庭園、石垣、堀。岡口門・続塀は国の重要文化財。国の史跡。西の丸庭園は国の名勝","Wikipedia"],["2","新宮城","しんぐうじょう","浅野忠吉","1618年（元和4年）※基礎情報欄の年。下記注記参照","1873年（明治6年）","別名は丹鶴城（たんかくじょう）・沖見城（おきみじょう）。遺構は天守台・石塁。国の史跡「新宮城跡附水野家墓所」（2003年8月27日指定）。天守は望楼型3層5階（非現存）。和歌山県公式：「明治時代の廃藩置県で廃城となり、城内の建物が取り壊されたため、石垣のみ」。紀州藩附家老・水野家3万5千石の居城","Wikipedia／自治体"],["3","田辺城（紀伊国）","たなべじょう","浅野知近","1606年","1871年","別名は錦水城（きんすいじょう）、湊村城、湊城。平城。遺構は石垣、水門。水門は田辺市指定史跡。1615年（元和元年）の一国一城令の後は改築して陣屋とされた。主な改修者は安藤直裕","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 和歌山城の旧天守の焼失経緯（Wikipedia「和歌山城」）：1935年（昭和10年）に天守など11棟が国宝（国宝保存法）に指定されたが、1945年（昭和20年）7月9日の和歌山大空襲により天守などの指定建造物11棟すべてを焼失した。焼失したのは大天守・小天守・北西隅櫓・西南隅櫓・楠門・北東多門・北西多門・西多門・南多門・東倉庫・西倉庫（出典は文化庁編『新版 戦災等による焼失文化財』と記事に記される）。1958年（昭和33年）に鉄筋コンクリートで外観復元再建された。すなわち現在の天守は復興天守であり、現存天守ではない。","- 和歌山城の天守創建年には諸説がある（1600年の浅野幸長説／1619年の頼宣説など）。また落雷による焼失について、記事内では1846年（弘化3年）7月26日とする箇所と「1847年（弘化4年）に焼失した際」とする箇所があり、記事内の表記が食い違う。","- 新宮城の築城年：基礎情報欄は1618年（元和4年）とするが、本文では1601年に築城開始・1602年に城を築いたこと、1615年の一国一城令により廃城となったこと、1618年に再築に着手し、水野重央が継続して1633年に完成、1667年に近世城郭として完成したことが記される。築城年の扱いは出典の表記のまま併記する。","- 田辺城の城郭としての扱い：コトバンク（講談社『日本の城がわかる事典』）は「江戸時代に築城された陣屋造りの城。田辺城は天守閣がなく、典型的な水城である」「田辺城は陣屋構えで、天守や櫓はなかった」とする。食い違い（築城経緯）：同事典は「浅野氏重が湊城を築いた→安藤直次が湊城を改築して田辺城を築いた」と説明するが、Wikipedia「田辺城 (紀伊国)」は築城主を浅野知近（1606年）とする。","- 松島城：今回の調査では、和歌山県内の城として「松島城」を確認できなかった（検索で現れる松島城は長野県伊那地方のものである）。未確認として記す。","- 現存天守：現存12城（弘前・松本・丸岡・犬山・彦根・姫路・備中松山・松江・丸亀・伊予松山・宇和島・高知）に和歌山県の城は含まれない。和歌山県内に現存天守はなし。","---"],"tables":[]}],"f":[{"h":"f-1 江戸時代に成立していたもの","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- 農林水産省「日本農業遺産 有田地域資料」 https://www.maff.go.jp/j/nousin/kantai/attach/pdf/giahs_3_arida-8.pdf （取得日：2026-11-18）","- 農林水産省「地理的表示登録簿 第39号 紀州金山寺味噌」 https://www.maff.go.jp/j/shokusan/gi_act/register/0039/pdf/0039_register.pdf （取得日：2026-11-18）","- 農林水産省「うちの郷土料理」（取得日：2026-11-18）※一部は二次引用による","- Wikipedia「備長炭」 http://ja.wikipedia.org/wiki/備長炭 （取得日：2026-11-18）","- Wikipedia「高野豆腐」 https://ja.wikipedia.org/wiki/%E9%AB%98%E9%87%8E%E8%B1%86%E8%85%90 （取得日：2026-11-18）","- Wikipedia「金山寺味噌」 https://ja.wikipedia.org/wiki/%E9%87%91%E5%B1%B1%E5%AF%BA%E5%91%B3%E5%99%8C （取得日：2026-11-18）"],"tables":[]},{"h":"表","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","成立時期","備考","出典の種別"],"rows":[["1","紀州みかん（紀州小みかん。有田みかんの起源）","きしゅうみかん","江戸時代","農林水産省の日本農業遺産資料：有田地域は江戸時代に日本で初めてみかん栽培を生計の手段にまで発展させた地域であり、江戸時代に日本初のみかん共同出荷組織「蜜柑方」を組織した。1574年に肥後国八代から「八代の小みかん」を導入（伊藤孫右衛門）し、江戸時代に「紀州みかん」の名で全国を席巻した「紀州小みかん」を育成した。1698年（元禄11年）より税「御口銀」の徴収が始まった。『日本山海名物図絵』（1754年）に「中でも紀州産優れ、皮厚くしてその味甘し」とある。農水省「うちの郷土料理」によれば、1634年に滝川原藤兵衛が初めて船で江戸に紀州みかんを運んだとされ、紀伊國屋文左衛門の逸話（1685年）が知られる","公的"],["2","金山寺味噌","きんざんじみそ","起源は鎌倉時代とされる。現在の製法に近似する工業的な製法は1615年に完成されたとされる","GI登録簿（農林水産省）：「製法は、鎌倉時代に、和歌山県内に伝えられたとする説が有力」。覚心が1254年に帰朝し由良町に興国寺を開山した際に伝えた宋の径山寺（きんざんじ）の味噌の製法を起源とする説が有力（空海説もあるが前者が有力とされる）。「現在の製法に近似する工業的な製法は1615年に完成されたとされ、江戸では紀州名物として販売されていた」。Wikipedia「金山寺味噌」：江戸時代前期に「径山寺（きんざんじ）」の名で売り出し、名物として定着した","公的／Wikipedia"],["3","備長炭（紀州備長炭）","びんちょうずみ（びんちょうたん）","江戸時代（元禄年間、1688〜1704年）に名称が広まったとされる","Wikipedia「備長炭」：「『備長炭』の名は元禄年間（1688年 - 1704年）に紀伊国の炭問屋であった備中屋長左衛門が江戸で広めたことに由来する」","Wikipedia"],["4","高野豆腐","こうやどうふ","「高野豆腐」と呼ばれるに至ったのは江戸時代とされる","Wikipedia「高野豆腐」：「高野山で木食応其によって製法が完成された凍り豆腐が、精進料理の一つとして日本全国に広まったものとされる」「高野豆腐と呼ばれるに至ったのは、江戸時代において高野山の土産物として珍重されたからとも言われている」。現在は9割以上が長野県で生産される","Wikipedia"],["5","梅干し（田辺梅）","うめぼし","江戸時代に田辺領で梅栽培が本格化したとされる","農林水産省「うちの郷土料理」：江戸時代、田辺領の城代家老・安藤直次がやせ地に自生していた「やぶ梅」に注目し栽培を推奨したのが本格的な梅栽培のはじまりとされ、江戸でも「田辺梅」として称賛された。なお現在の代表品種「南高梅」は明治時代に高田貞楠が見つけた大果の梅「高田梅」に始まり、昭和40年（1965年）に優良系統として選抜され品種登録されたものであるため、江戸時代の品目としては扱わない","公的"]]}]},{"h":"f-2 現代の公的な認定","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- 伝統的工芸品産業振興協会「指定品目一覧」PDF https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （2025年10月27日現在、全国244品目）（取得日：2026-11-18）","- 近畿農政局「近畿の地理的表示（GI）登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、近畿18産品）（取得日：2026-11-18）","- 近畿農政局「地域団体商標」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （令和6年1月現在。農林水産物・食品のみ）（取得日：2026-11-18）","- 和歌山県記者発表資料（プレミア和歌山推奨制度の見直し、令和6年4月2日） https://www.pref.wakayama.lg.jp/chiji/press_animation/r6_d/fil/060402_3.pdf （取得日：2026-11-18）","- 和歌山県記者発表資料（新たな県産品の推奨制度、令和7年2月4日） https://www.pref.wakayama.lg.jp/chiji/press/06/20250204_d/fil/250204_1.pdf （取得日：2026-11-18）"],"tables":[]},{"h":"伝統的工芸品（経済産業省指定）和歌山県分：3品目","lv":3,"text":["注記：県知事指定の郷土伝統的工芸品には根来寺根来塗（2007年／平成19年指定）・紀州雛（平成16年指定）などがあるとされるが（その他出典による）、県公式での直接確認は未実施（未確認）。"],"tables":[{"cols":["番号","品目名","読み","備考","出典の種別"],"rows":[["1","紀州漆器","きしゅうしっき","漆器。指定日は1978年（昭和53年）2月6日とされる（その他出典による。協会一覧に指定日なし）","公的"],["2","紀州箪笥","き 、一宮を主張したとされる","Wikipedia"],["6","総社","総社明神（大屋都姫神社に合祀）とされる。別説に府守神社","おおやつひめじんじゃ／ふもりじんじゃ","『中世諸国一宮制の基礎的研究』による整理では、総社は大屋都姫神社に合祀された総社明神かとされ、別説として府守神社（和歌山市府中）が挙げられる。府守神社が総社であるとの確定した出典は今回確認できなかった（未確認）","Wikipedia"],["7","国分寺","紀伊国分寺跡（紀の川市打田町）","きいこくぶんじ","国の史跡。八光山醫王院国分寺が法燈を伝承する","Wikipedia"],["8","国分尼寺","不詳","―","西国分廃寺跡（岩出市西国分、国の史跡）を国分尼寺跡とする説がある","Wikipedia"],["9","延喜式内社","大社13座13社・小社18座15社の計31座28社","―","大社13社のうち熊野早玉神社以外は名神大社。世界大百科事典も「式内社31座のうち13座が名神大社」とする","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 一宮については、Wikipedia「紀伊国」基礎情報欄の一宮欄に日前・国懸神宮、丹生都比売神社、伊太祁曽神社の3社が併記される。本文（一宮・総社の整理）でも3社の説が併記されており、単一の一宮に確定していない。","- 日前宮が一宮とされる根拠として出典に明記されるのは、12世紀後半には事実上の一宮であったという『中世諸国一宮制の基礎的研究』の整理である。それ以前の根拠を示す公的出典は今回確認できなかった（未確認）。","- 国府の所在地について、世界大百科事典は「国府を名草郡（現・和歌山市府中）に置き」とする。","- 文化庁の文化財データベースでの個別照合は今回行っていない（未確認）。","---"],"tables":[]}],"h":[{"h":"概要・出典","lv":2,"text":["定義：h-1 老舗企業＝2026年時点で創業100年以上（創業1926年以前）・現営業中・本社が和歌山県内。創業年は各社公式の沿革・会社概要で裏取りし、法人設立年と分けて書く。h-2 現代を代表する企業＝現在和歌山県に本社のある代表的企業（公式の会社概要で確認）。"],"tables":[]},{"h":"h-1 老舗企業（確認できたのは4社）","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- 株式会社総本家駿河屋 会社概要（WESTERモール内ショップ紹介・会社概要、企業提供） https://wester-mall.westjr.co.jp/shop-info?shopId=2023 （取得日：2026-11-18）","- Wikipedia「角長」 http://ja.wikipedia.org/wiki/角長 ／和歌山県資料「角長（加納家住宅）の重要文化財（建造物）指定に係る資料」 http://wave.pref.wakayama.lg.jp/news/file/36823_0.pdf （取得日：2026-11-18）","- 株式会社紀陽銀行 会社説明会資料（取得日：2026-11-18）／Wikipedia「紀陽銀行」 https://ja.wikipedia.org/wiki/%E7%B4%80%E9%99%BD%E9%8A%80%E8%A1%8C","- 中田食品株式会社 公式「会社概要」 https://www.nakatafoods.co.jp/about/company （取得日：2026-11-18）"],"tables":[]},{"h":"表","lv":3,"text":[],"tables":[{"cols":["番号","企業名","読み","創業年（設立年）","本社所在地","業種・事業内容","備考","出典の種別"],"rows":[["1","株式会社総本家駿河屋（総本家駿河屋善右衛門）","そうほんけするがや","1461年（設立年は公式に明記なし）","和歌山県和歌山市小倉25番地","和菓子の製造・販売","創業は1461年、室町時代に京都伏見で初代岡本善右衛門が『鶴屋』と号して饅頭処を開業したのが始まり。その後、初代紀州藩主・徳川頼宣に召し連れられ和歌山に店舗を構え現在に至る（創業地は京都府域、和歌山への移転は江戸時代初期）","その他（企業公式）"],["2","株式会社角長","かどちょう","1841年（天保12年）創業（1983年（昭和58年）に株式会社角長を設立して法人化）","和歌山県有田郡湯浅町湯浅7",  let h="";if(s.h)h+=(s.lv<=2?'<h2 class="sh">':'<h3 class="sh">')+esc(s.h)+(s.lv<=2?'</h2>':'</h3>');
 h+=textH(s.text);s.tables.forEach(t=>{h+=tblH(t)});return h}
function splitSecs(secs){const i=secs.findIndex(s=>/^注記|^取得不可/.test(s.h));return i<0?[secs,[]]:[secs.slice(0,i),secs.slice(i)]}
function metaH(m){return m&&m.length?'<details><summary>出典・表の前提</summary><div class="win">'+textH(m)+'</div></details>':""}
function flagH(a){return a&&a.length?'<div class="flag"><b>確認中のメモ（運営）</b><ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>':""}
function backTo(){const r=S.ret;if(!r)return go({step:"title"});go(r)}
function fillBind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const o=JSON.parse(b.dataset.go);if(o.ret===true)o.ret={step:S.step,c:S.c,k:S.k,l:S.l,ret:S.ret};go(o)});
 const f=$("#flt");if(f)f.oninput=()=>{const q=f.value.trim();document.querySelectorAll(".ent").forEach(e=>e.classList.toggle("hide",!!q&&!e.textContent.includes(q)))}}
const gb=o=>"data-go='"+JSON.stringify(o).replace(/'/g,"&#39;")+"'";
function btn(label,o,cls,sub){return '<button class="btn '+(cls||"")+'" '+gb(o)+'><span>'+label+(sub?'<small>'+sub+'</small>':"")+'</span></button>'}
function mk(h){app.innerHTML=h;fillBind()}
function rTitle(){
 let h='<div class="win"><h1>レキオタ</h1><div class="sub">歴史手帳をひらいて、京都から旅する。</div><div class="small" style="text-align:center;margin-top:6px">試作版：いまは京都府の章と、閑話休題（歴史手帳）だけです。</div></div>';
 if(S.ask){h+='<div class="win msg">はじめからにすると、今の記録（読んだ項目）は消えます。よいですか？</div><div class="row"><button class="btn" id="yes">はい</button><button class="btn" id="no">いいえ</button></div>';mk(h);$("#yes").onclick=()=>{reset();S.ask=false;go({step:"route"})};$("#no").onclick=()=>go({ask:false});return}
 if(S.has)h+=btn("つづきから",{step:"route"},"gold");
 h+='<button class="btn" id="new"><span>はじめから</span></button>';
 h+=btn("閑話休題（歴史手帳）",{step:"kan",ret:{step:"title"}},"","歴代天皇・年号・将軍・首相・官制・中国と朝鮮の国名");
 h+=btn("あそびかた・出典について",{step:"help"});
 mk(h);$("#new").onclick=()=>{if(S.has)go({ask:true});else go({step:"route"})}}
function rHelp(){mk('<div class="win msg">このゲームは、歴史が好きな人のための「歴史手帳」です。県ごとに、旧国名・藩・廃藩置県・県名の由来・城・名産を巡ります。\n\n各項目には出典のタグが付きます。\n・緑「公的」「自治体」：公的機関の出典\n・黄「Wikipedia（要検証）」：Wikipediaだけが出典。まだ公的出典で照合していません\n\n「確認中のメモ」は、運営が気づいた疑問点です。事実と推測は分けて書いています。\n\n日付は、1872年末までは「新暦（旧暦）」の併記を原則にします。\n\n閑話休題のボタンから、歴代天皇などの一覧に飛べます。</div>'+btn("もどる",{step:"title"}))}
function rRoute(){let h='<div class="win"><div class="nm" style="color:var(--gold)">旅の道</div><div class="small">県ごとの章を巡ります。</div></div>';D.CH.forEach(c=>{const r=S.read[c.id]||{};const n=c.topics.filter(t=>r[t.k]).length;h+=btn(esc(c.title)+'<small>'+esc(c.sub)+'　読んだ '+n+'/'+c.topics.length+'</small>',{step:"hub",c:c.id})});const done=new Set(D.CH.map(c=>c.id));let nx=null;D.PLAN.forEach(g=>g.items.forEach(it=>{if(!nx&&!done.has(it[0]))nx=it}));if(nx)h+='<button class="btn" disabled><span>'+esc(nx[1])+'<small>準備中</small></span></button>';
h+='<details><summary>旅の予定（五畿七道の順。道の中の順は変わることがあります）</summary><div class="win">'+D.PLAN.map(g=>'<div class="note"><b style="color:var(--gold);font-weight:normal">'+esc(g.dou)+'</b>　'+g.items.map(it=>esc(it[1])+(done.has(it[0])?'（済）':'')).join('・')+'</div>').join("")+'<div class="note">兵庫県は摂津で訪れ、播磨・但馬・淡路は章の中で触れます。全47都道府県。</div></div></details>';
h+=btn("閑話休題（歴史手帳）",{step:"kan",ret:{step:"route"}},"gold")+btn("タイトルへ",{step:"title"});mk(h)}
function rHub(){const K=CH(),r=S.read[K.id]||{};const n=K.topics.filter(t=>r[t.k]).length;
 let h='<div class="win"><div class="nm" style="color:var(--gold)">'+esc(K.title)+'</div><div class="small">'+esc(K.sub)+'</div><div class="small">読んだ：'+n+' / '+K.topics.length+'</div></div>';
 K.topics.forEach(t=>{h+=btn(esc(t.t)+(r[t.k]?' <span class="st">済</span>':""),{step:"topic",c:K.id,k:t.k,ret:{step:"hub",c:K.id}})});
 h+=btn("閑話休題（歴史手帳）",{step:"kan",ret:{step:"hub",c:K.id}},"gold");
 h+=btn("旅の道へ",{step:"route"})+btn("タイトルへ",{step:"title"});
 mk(h)}
function relBtns(rel,from){return rel.map(id=>btn("閑話休題：「"+esc(id==="calendar"?REL.calendar.t:LI[id].t)+"」へ",{step:"list",l:id,ret:from},"sm")).join("")}
function rTopic(){const K=CH(),t=K.topics.find(x=>x.k===S.k);
 (S.read[K.id]=S.read[K.id]||{})[t.k]=1;save();
 const [main,notes]=splitSecs(K[t.k]);
 let h='<div class="win"><div class="nm" style="color:var(--gold)">'+esc(K.title)+' ― '+esc(t.t)+'</div></div>';
 h+='<div class="win">'+main.map(s=>secH(s)).join("")+'</div>';
 if(notes.length)h+='<details open><summary>注記・食い違い（出典の記述）</summary><div class="win">'+notes.map(s=>secH(s)).join("")+'</div></details>';
 h+=flagH(K.flags[t.k]);
 const here={step:"topic",c:K.id,k:t.k,ret:S.ret};
 h+='<div class="grp">閑話休題（関連）</div>'+relBtns(t.rel,here)+btn("閑話休題（一覧）",{step:"kan",ret:here},"sm");
 const i=K.topics.findIndex(x=>x.k===t.k),nx=K.topics[i+1];
 h+='<div class="row">'+(nx?'<button class="btn" '+gb({step:"topic",c:K.id,k:nx.k,ret:{step:"hub",c:K.id}})+'><span>つぎ：'+esc(nx.t)+'</span></button>':"")+'<button class="btn" '+gb({step:"hub"})+'><span>章の目次へ</span></button></div>';
 const m=K.meta;h+=metaH(m);
 mk(h)}
function rKan(){let h='<div class="win"><div class="nm" style="color:var(--gold)">閑話休題</div><div class="small">歴史手帳。ここから、もとの場所にもどれます。</div></div>';
 let g="";D.L.forEach(l=>{if(l.g!==g){g=l.g;h+='<div class="grp">'+esc(g)+'</div>'}h+=btn(esc(l.t),{step:"list",l:l.id,ret:{step:"kan",ret:S.ret}})});
 h+='<div class="grp">読み方</div>'+btn(esc(REL.calendar.t),{step:"list",l:"calendar",ret:{step:"kan",ret:S.ret}});
 h+=btn("もどる",S.ret||{step:"title"},"gold");mk(h)}
function rList(){
 if(S.l==="calendar"){mk('<div class="win"><div class="nm" style="color:var(--gold)">'+esc(REL.calendar.t)+'</div>'+textH(D.CAL)+'</div>'+btn("もどる",S.ret||{step:"kan"},"gold"));return}
 const l=LI[S.l];const [main,notes]=splitSecs(l.secs);const cnt=main.reduce((a,s)=>a+s.tables.reduce((b,t)=>b+t.rows.length,0),0);
 let h='<div class="win"><div class="nm" style="color:var(--gold)">'+esc(l.t)+'</div><div class="small">'+cnt+'件</div></div>'+btn("もどる",S.ret||{step:"kan"},"gold");
 if(cnt>20)h+='<input id="flt" class="flt" type="search" placeholder="しぼりこみ（名前・年・読みなど）" autocomplete="off">';
 h+=metaH(l.meta);
 h+='<div class="win">'+main.map(s=>secH(s)).join("")+'</div>';
 if(notes.length)h+='<details><summary>注記・食い違い（出典の記述）</summary><div class="win">'+notes.map(s=>secH(s)).join("")+'</div></details>';
 h+=btn("もどる",S.ret||{step:"kan"},"gold");mk(h)}
function render(){document.documentElement.lang="ja";({title:rTitle,help:rHelp,route:rRoute,hub:rHub,topic:rTopic,kan:rKan,list:rList})[S.step]()}
window.__R={S,go};
render();
})();
</script>
