整合しないため、この日の西暦換算は未確認として扱う。","6. Wikipedia「堺県」には出典が不十分である旨のテンプレートが付されている。日付については上記のとおり大阪府公文書館資料で照合できた範囲を c-3 に分けて記した。"],"tables":[]},{"h":"取得不可（c）","lv":3,"text":["- Wikipedia「廃藩置県」 https://ja.wikipedia.org/wiki/廃藩置県 — 取得を試みたが、取得ツール側のレート制限（HTTP 429）のため取得不可。このため、高槻県・麻田県の発足・統合に関する日本語版Wikipediaの表での照合は未実施。","- Wikipedia「豊崎県」 https://ja.wikipedia.org/wiki/豊崎県 — 同じくレート制限（HTTP 429）のため取得不可。摂津県の設置日・豊崎県への改称日・廃止の日レベルの日付は未確認（月レベルでは学術論文による）。","- 国立公文書館／アジア歴史資料センター（JACAR）の個別文書（第1次府県統合・堺県合併に関する太政官布告・太政類典所収文書）：検索ではコレクションの目録までは到達したが、該当文書そのものには到達できず、取得不可（未確認）として扱う。","---"],"tables":[]}],"d":[{"h":"d. 府名の由来","lv":2,"text":["出典：","- 「大阪府の成立と地方自治の原型」（大阪教育大学リポジトリ収録論文） https://osaka-kyoiku.repo.nii.ac.jp/record/2085319/files/koumin_1_003.pdf （取得日2026-11-18、種別：その他（学術論文）。以下「学術論文」）","- Wikipedia「大阪」 https://ja.wikipedia.org/wiki/大阪 （取得日2026-11-18、種別：Wikipedia。本文はミラーサイト newikis https://newikis.com/ja/大阪 経由で確認したため補助扱いとする。ミラーサイト自体は出典としない）","- 大阪府公式「府議会のあゆみ」 https://www.pref.osaka.lg.jp/o170010/gikai_giji/aramashi/ayumi.html （取得日2026-11-18、種別：自治体）","- 大阪府公文書館 歴史講座資料「大阪府の成立とその発展」 https://archives.pref.osaka.lg.jp/search/image/h26Re-text.pdf （取得日2026-11-18、種別：自治体）","- 学研キッズネット「おおさか〖大阪（府）〗」 https://kids.gakken.co.jp/jiten/dictionary01500145/ （取得日2026-11-18、種別：その他（辞典））","- 「大阪は歴史的には『大坂』！」（Maido／大阪観光情報サイト） https://maido-bob.osaka/2022/12/07/osaka-writings/ （取得日2026-11-18、種別：その他）","- 由来タイム「『大阪府』の由来とは」 https://zikanwakaran.jp/?p=220 （取得日2026-11-18、種別：その他）"],"tables":[]},{"h":"d-1. 府名「大阪府」の由来（事実として出典に記されるもの）","lv":3,"text":["大阪府公式サイトには、府名の由来そのものを説明するページは今回の検索範囲では確認できなかった（未確認）。大阪府公式「府議会のあゆみ」は「慶応4年（1868年）の5月、大阪裁判所（現在の司法裁判所ではなく、行政一般を司る役所）を改め、大阪府が設置されました」と記すのみである。","学術論文は次のとおり記す。「大阪府の名称の由来については、確実な史料があるわけではないが、上述のとおり、近世の大坂三郷の地に大阪鎮台・大阪裁判所が設置され、府庁も同じ地（大阪裁判所であった2月2日、津村別院から東大組内本町橋詰町の元西町奉行所跡に移転）に置かれたためであることは間違いないであろう。」","また「府」とされた経緯については、大阪府公文書館歴史講座資料が「明治2（1869）年7月17日太政官布告：『府』は『京都・東京・大阪に限る』」と記し、学術論文も「当初は全国に9府あったが、翌明治2年には東京・大阪・京都の3府を残し、ほかはすべて県に改められた」「大阪府の管轄区域・機構はその後大きく変化するが、大阪府の名称だけは変わることがなく、今日まで連綿として続くことになる」と記す。"],"tables":[]},{"h":"d-2. 地名表記「大坂」から「大阪」への変遷","lv":3,"text":["「大坂」の初出","学術論文：「『おおさか』の地名の史料上の初見は、明応5年（1496）蓮如上人の『消息』である。それによると、同年蓮如が83歳の秋に、『摂州東成郡生玉之庄内、大坂トイフ在所』に坊舎を建て、隠居寺としたとある。後の石山本願寺がこれである。」","Wikipedia「大阪」：「この漢字の地名に関する最古の記録は、1496年、浄土真宗中興の祖である蓮如によって書かれた御文の中に見られる『摂州東成郡生玉乃庄内大坂』との記載である。」","なお、由来タイムは「1498年（明応7年）の蓮如の手紙に『大坂』が登場」とし、年が異なる（下記「注記・食い違い」参照）。","それ以前の表記と発音","学術論文：「『厳助往年記』天文元年（1532）6月5日の条に『小坂大騒動』、また同永禄4年（1561）3月28日の条には、『小坂』の本願寺で親鸞上人三百年忌法会を行ったという記事があり、当時は『大坂』あるいは『小坂』と書いて、ともに『おさか』と発音していたようである。近世に入ると、『大坂』が一般的に用いられ、発音も『おおさか』に変わる。」","Wikipedia「大阪」：蓮如以前の大坂は「オホサカ」ではなく「ヲサカ」と発音されており、諸資料にも「小坂（おさか）」と表記された例が見られる（正安3年（1301年）刊の『宴曲抄』に「九品津小坂郡戸の王子」が言及されており、これが大坂に比定される。また『日本書紀』には烏瑳箇とある）。","「大阪」表記の出現と江戸時代の用例","学術論文が挙げる「大阪」の用例（石刻・印刷物）：「箕面市の用水路で発見された『安永八年（1779）牧之荘寺井新十郎』の銘がある道標には『大阪城五里』とあり、堺市の百舌鳥八幡宮にある天明3年（1783）の石灯籠には『大阪住はなや文治郎』、大阪市内住吉神社の同6年（1786）の石灯籠にも『大阪庭講中』と見える。印刷物では、寛政2年（1790）刊行の『謳字引』の奥付に『大阪心斎橋筋北久太郎町浪華書林』と記され、文化3年（1806）には『増脩改正摂州大阪地図』が出ている。」同論文はこれらを「例えば」と列挙しており、このうち最も古い用例は安永8年（1779年）の道標である。同論文は「このようにして、坂と阪が混用されたが、もともと坂と阪は同じ字で、阪は説文すなわち漢字の成立と原義を解き明かすための形であり……そこから坂の字が生まれたから、当時、坂と阪の混用が問題とされることはなかった」と記す。","Wikipedia「大阪」：「漢字の表記は当初『大坂』が一般的だったが、江戸時代後期頃から『大阪』とも書くようになった。浜松歌国が文化5年（1808年）に執筆した『摂陽落穂集』巻一には、『或人のいはく大坂と書くに坂の字を用ゆる事心得あるべし坂の字は土扁に反るといふ土にかへるとあるゆへ忌みきらひ阝（コザト）扁に書くべきとあり』と書いてあり、19世紀初頭には『大阪』と書く人が相当数いたことが示唆されている。」","明治期の扱いと統一の経緯","学術論文：「明治時代になっても、この近世の慣用はそのまま継承された。大阪府が成立してから阪の字を用いるように命じた布令や布達は一切なく、明治元年5月から12月までの間の府の布達では、大阪府より大坂府が圧倒的に多く使用され、2年・3年にはそれが逆転するものの、坂・阪の混用は後を絶たなかった。4年知事となった渡辺昇は、公文書に『大坂府知事』と肩書きし、官職印は『大阪府知事渡辺昇』と刻んだものを使用する無頓着さであった。さらに、13年知事に就任した建野郷三にいたっては、肩書・官職印とも坂の字を用いていた。現在、大阪府公文書館に架蔵されている文書に見るかぎり、明治30年代においても坂・阪の混用が知られる。教科書に関していえば、10年8月、大阪府師範学校の初代校長布施萬と同校二等訓導石井鉤三郎が著した『大阪府管内地誌略』には、大阪が22例、大坂が3例用いられている。また、37年の国定教科書『小学地理』一・二では、大坂府・大坂平野となっていた。これが阪の字に統一されたのは、43年の国定教科書『尋常小学校地理』巻一・二からであり、このころには大阪の用字がほぼ完全に定着していたと考えられる。」","Wikipedia「大阪」：「元来の『大坂』に代わって『大阪』が正式な表記となったのは、明治維新後の1868年、新政府がもとの大坂三郷に大阪府を置いたこのころである」としつつ、『大阪市史』巻1（昭和2年再版）の引用として「大阪府庁所用の官印に、大阪府印、大坂府印の両様あるを以て見れば、坂阪二字の變更は偶然に起こりしにて、必ずしも深き理由ありしにあらざるべし」と記す。","Maido（大阪観光情報サイト）：「『大阪府』が正式の地名になってからも、急に社会に定着したわけではなく、しばらくは『大坂』表記も併用され、官報ですら遅れて明治20年前後から『阪』の文字に変わったらしく、明治半ばごろになって、ようやく『大阪』が一般に定着したようです。」また『広辞苑』の見出しについて「おおさかと、両方が併記され、『古称、難波。室町時代には小坂（おさか）・大坂といい、明治初期以降、大阪に統一』と載っています」と記す。"],"tables":[]},{"h":"d-3. 地名「大阪（大坂）」の語源（諸説。いずれも仮説であり、確定した事実ではない）","lv":3,"text":["- 大きな坂があったとする説：Wikipedia「大阪」は「その語源は、大きな坂があったために大坂という字が当てられたという説があるが、蓮如以前の大坂は『オホサカ』ではなく『ヲサカ』と発音されており、諸資料にも『小坂（おさか）』と表記された例が見られる……このためにこの説は信憑性に乏しい」と記す。","- 上町台地の傾斜地形によるとする見方：学術論文は「この地名の由来は、上町台地北端の傾斜した地勢によるものと判断され、ごく小さな地域の呼び名にすぎなかった」と記す。","- 「小坂」から「大坂」への改称（好字化）とする説：由来タイムは『精選版 日本国語大辞典』の説として、石山本願寺の完成を祝して「小坂」の呼び名を改称し新しく「大坂」と呼ぶようになったとする説を紹介する。Maido（大阪観光情報サイト）も、国が編纂した百科事典『古事類苑』地部を引き、「大坂は、元は『小坂』、あるいは『尾坂』と呼ばれていたが、明応年間（1492～1501）のころから、『大坂』と表記するようになったと考える」とする。","- 辞典の扱い：学研キッズネット「おおさか〖大阪（府）〗」は府名の由来について「地形からきた名ともいわれるが，はっきりしない。江戸（えど）時代までは，小坂または大坂と書いた。明治（めいじ）になって，坂が阪にあらためられ，大阪となった」と記す。","- 「坂」から「阪」への変更の理由とされる説：Wikipedia「大阪」は「一説に『坂』から『阪』への変更は、明治新政府が『坂』が『士が反する』、すなわち武士が叛く（士族の反乱）と読めることから『坂』の字を嫌ったともいわれる」と記す（一説として紹介されるもので、確定した事実ではない）。江戸時代の『摂陽落穂集』（文化5年・1808年）の記述では、「坂」は「土に反る＝土に返る」ため忌み嫌って「阪」と書くべきだとされていた（d-2参照）。ただし学術論文は、明治期に阪の字を用いるよう命じた布令・布達は一切なかったと記し（d-2参照）、『大阪市史』は変更を「偶然」とする見方を示している。"],"tables":[]},{"h":"注記・食い違い（d）","lv":3,"text":["1. 蓮如の文書の年：学術論文およびWikipedia「大阪」は、初見を明応5年（1496年）の蓮如の消息・御文とする。これに対し由来タイムは「1498年（明応7年）の蓮如の手紙に『大坂』が登場」とする。食い違いとして両方を併記する。なおMaido（大阪観光情報サイト）が引く御文章の文面には「去ぬる明応第五の秋下旬のころより……当年は、はや既に三年の星霜をへたりき」とあり、明応5年の出来事を3年後に記した文面とも読めるが、文書自体の成立年について出典間で一致していないため、ここでは決めない。","2. 「大阪」が正式表記となった時期の表現：Wikipedia「大阪」は1868年の大阪府設置のころに正式な表記となったとするが、学術論文は、明治元年の府の布達では「大坂府」が圧倒的に多く、混用は明治30年代まで続き、用字の統一は明治43年の国定教科書からとする。府名としての採用（1868年）と社会的な表記の定着（明治半ば〜明治43年）とは別の段階として、両方を併記する。","3. 語源の「大きな坂」説への評価：一般に広く紹介される説だが、Wikipedia「大阪」は発音（ヲサカ）と「小坂」表記の存在から「信憑性に乏しい」とし、学研キッズネットは「はっきりしない」とする。確定した語源は出典上も定まっていない。","4. Wikipedia「大阪」の本文はミラーサイト（newikis）経由で確認したものであり、記事自体の直接取得は今回行っていない（補助扱い）。"],"tables":[]},{"h":"取得不可（d）","lv":3,"text":["- 大阪府公式サイトの府名の由来を説明するページ：検索範囲では該当ページを確認できず、取得不可（未確認）。大阪府公式で確認できたのは「府議会のあゆみ」の設置の記述のみ。","- Wikipedia「大阪」 https://ja.wikipedia.org/wiki/大阪 の直接取得：今回は行わず、ミラーサイト経由の確認にとどまる（出典としては補助扱い）。","- 国立公文書館／アジア歴史資料センター（JACAR）の「大阪府」命名に関する個別文書：到達できず、未確認（照合未実施）。","---"],"tables":[]}],"e":[{"h":"e. 有名な城","lv":2,"text":["出典（取得日はいずれも2026-11-18）：","- Wikipedia「大坂城」 https://ja.wikipedia.org/wiki/大坂城 （種別：Wikipedia）","- Wikipedia「岸和田城」 https://ja.wikipedia.org/wiki/岸和田城 （種別：Wikipedia）","- Wikipedia「高槻城」 https://ja.wikipedia.org/wiki/高槻城 （種別：Wikipedia）","- Wikipedia「千早城」 https://ja.wikipedia.org/wiki/千早城 （種別：Wikipedia）","- 文化遺産オンライン「千早城跡」（文化庁「国指定文化財等データベース」の転載） https://bunka.nii.ac.jp/heritages/detail/161678 （種別：公的）","- コトバンク「国指定史跡ガイド 千早城跡」 https://kotobank.jp/word/千早城跡-1444432 （種別：その他）","- Wikipedia「飯盛山城」 https://ja.wikipedia.org/wiki/飯盛山城 （種別：Wikipedia）","- 大東市・四條畷市「史跡飯盛城跡保存活用計画」（令和6年3月） https://www.city.daito.lg.jp/uploaded/life/54095_136551_misc.pdf および第3章 https://www.city.daito.lg.jp/uploaded/life/54095_136558_misc.pdf （種別：自治体）","- Wikipedia「芥川山城」 https://ja.wikipedia.org/wiki/芥川山城 （種別：Wikipedia）","- Wikipedia「現存天守」 https://ja.wikipedia.org/wiki/現存天守 （種別：Wikipedia）","- 堺市「堺の歴史的風致に関する資料（堺環濠都市区域）」（堺市公式サイト掲載PDF） https://www.city.sakai.lg.jp/kanko/rekishi/bunkazai/bunkazai/rekimachi/gijiroku_haifu/rekimachi_shiryo_23.files/rekishi_fuchi_shiryo_12_04.pdf （種別：自治体）"],"tables":[{"cols":["番号","名称","読み","築城者","築城年","廃城年または現状","現存・再建建物","出典の種別"],"rows":[["1","大坂城（豊臣期）","おおさかじょう","豊臣秀吉","1583年（天正11年）","1615年（慶長20年）の大坂夏の陣で落城し、豊臣氏は滅亡した（記事）。豊臣大坂城の遺構は現在多くが埋没している","天守は複合式もしくは連結式望楼型5重6階地下2階（1585年築）、いずれも非現存。徳川大坂城本丸の地中に埋没している豊臣大坂城詰ノ丸の石垣は、2025年（令和7年）4月1日に開館した「豊臣石垣館」の地下展示室で見ることができる（記事）","Wikipedia"],["2","大坂城（徳川期）","おおさかじょう","徳川秀忠（主な改修者。再築工事は1620年（元和6年）開始、3期足かけ9年の普請で1629年（寛永6年）に完成）","再築1620年〜1629年。天守は独立式層塔型5重5階地下1階（1626年築）","廃城年1868年（明治元年）。徳川期の天守は1665年（寛文5年）正月2日の落雷で焼失し、再建されなかった","現存：江戸時代初期から後期にかけて建てられた櫓や門、蔵など建物13棟および内堀と外堀（13棟は国の重要文化財）。現在の天守は1931年（昭和6年）にSRC造で復興された独立式望楼型5重8階で、国の登録有形文化財（1997年登録）。城跡は国の特別史跡","Wikipedia"],["3","岸和田城","きしわだじょう","信濃泰義か（基礎情報欄）。伝承では楠木正成の甥・和田高家（注記参照）","応永年間（1394年-1428年）","明治4年（1871年）。文政10年（1827年）に天守を焼失し、以降再建されないまま廃城とされ、まもなく破却された","遺構：石垣、堀。再建：復興天守（昭和29年・1954年再建、連結式望楼型3重3階）、復興櫓・門（昭和44年・1969年）。指定：城跡は大阪府史跡、本丸庭園は国の名勝","Wikipedia"],["4","高槻城","たかつきじょう","近藤忠範","10世紀末（990年に近藤忠範が久米路山と呼ばれる小丘に築城したのが始まりと言われているが「確証はない」と記事にある）","明治7年（1874年）（基礎情報欄）。本文では「明治4年（1871年）7月、廃藩置県により廃城。明治7年（1874年）には破却が始まり」とする（注記参照）","天守は三重三階天守（非現存）。現存建物は城内の建造物を移築した本行寺門および永井神社唐門（野見神社境内）。再建：復元石垣、模擬天守台。指定：大阪府指定史跡","Wikipedia"],["5","千早城","ちはやじょう","楠木正成","元弘2年/正慶元年（1332年）","明徳3年（1392年）。1392年（明徳3年）正月、楠木正勝の時に北朝方の畠山基国に攻められ落城した（記事）","再建造物なし。遺構：曲輪、空堀。指定：国の史跡（1934年（昭和9年）3月13日指定。文化庁データベースでも指定年月日1934.03.13を確認）","Wikipedia／公的"],["6","飯盛山城","いいもりやまじょう（国史跡の指定名称は「飯盛城跡」、読みは「いいもりじょうあと」。大東市・四條畷市の保存活用計画による）","佐々目憲法か木沢長政（基礎情報欄）","建武年間（1334年-1338年）","天正4年（1576年）。天正4年（1576年）に落城し廃城となった（記事）","再建造物なし。天守構造は「なし」。遺構：石垣・竪堀・畝状竪堀群・堀切・井戸跡。指定：国の史跡（2021年（令和3年）10月11日指定、2022年11月10日・2023年3月20日に追加指定。大東市・四條畷市の保存活用計画で照合）","Wikipedia／自治体"],["7","芥川山城","あくたがわさんじょう","細川高国","永正12–13年（1515–1516年）","元亀4年（1573年）頃","再建造物なし。天守構造は「なし」。遺構：曲輪、堀切、石垣、土塁、土橋、虎口。指定：国の史跡（指定名称は「芥川城跡」。文化審議会の答申は2022年6月17日、指定は令和4年11月10日文部科学省告示第141号。いずれも記事の脚注による）","Wikipedia"]]}]},{"h":"城ごとの注記","lv":3,"text":["1・2. 大坂城","- 記事冒頭：「大坂城または大阪城（おおさかじょう）は、現在の大阪府大阪市中央区大阪城（上町台地の先端、摂津国東成郡生玉荘大坂）にあった、安土桃山時代に築かれ、江戸時代に再築された日本の城。別称は錦城（きんじょう、金城とも表記）。」","- 豊臣期と徳川期の違い（記事）：「1583年（天正11年）から1598年（慶長3年）にかけて豊臣秀吉が築いた大坂城（豊臣大坂城）の遺構は、現在多くが埋没しており、地表に見ることのできる大坂城の遺構は、1620年（元和6年）から1629年（寛永6年）にかけて徳川秀忠が大規模な修築を施した大坂城（徳川大坂城）の遺構である。」","- 現在の天守について（記事）：「天守は1931年（昭和6年）に鉄骨鉄筋コンクリート（SRC）構造で、徳川時代に再建された天守台石垣の上に資料の乏しい豊臣時代の天守閣を想像し大坂夏の陣図屏風絵などを参考に模擬復興された創作物であるが、1997年（平成9年）に国の登録有形文化財となり、博物館『大阪城天守閣』として営業している。」","- 指定の年次（記事）：「1953年（昭和28年）…3月31日、大坂城跡が国の史跡に指定される。6月11日、大手門、千貫櫓、乾櫓など建造物13棟が重要文化財に指定される」「1955年（昭和30年）6月24日、大坂城跡が国の特別史跡に指定される」。特別史跡の範囲は「城跡は710,000平方メートルの範囲が国の特別史跡に指定されている」。","- 徳川期の天守の寿命について記事は「天守は39年と短命だった」とする。検算：1626年築、1665年焼失で39年となり、一致する。","- 強い表現の引用（記事）：「文献等にもよるが、日本三名城の一つに数えられる（他の二つは名古屋城、姫路城、熊本城の内から挙げられる場合が多い）」。","3. 岸和田城","- 別名は千亀利城（ちきりじょう）。記事：「本丸庭園は国の名勝、城跡は大阪府の史跡に指定されている」。略年表では「昭和18年（1943年）大阪府史跡に指定される」、本丸庭園（八陣の庭）は「国の名勝（平成26年10月6日指定）」とある。","- 天守の変遷（記事）：『岸城古今記』には天守が慶長2年（1597年）に竣工したと記している（記事）。文政10年（1827年）11月20日落雷によって消失し、再建されなかった。現在の天守は「昭和29年に市民の寄付や旧城主の子孫である岡部氏の要望などにより再建された」もので、連結式望楼型3重。当時の天守は5層で「当時の天守の高さは18間あり、今の天守より約10mは高かったと思われている」と記事にある。","- 岸和田古城との区別：記事によれば、平成時代の発掘調査で、現在の岸和田城跡から約500m南東に15世紀後半に築かれた山城（岸和田古城）が確認されており、現在の岸和田城とは別の城である。","4. 高槻城","- 別名は入江城（いりえじょう）、久米路山龍ヶ城。","- 本格的な城塞化は天正元年（1573年）から（記事概要）。元和3年（1617年）に土岐定義が城主となると「高槻城は完全な近代城郭として改修した」と記事にある。","- 天守について記事は「本丸にあった三重の天守は焼失したとの記録がないため、幕末まで存在した可能性がある」とする。","- 指定について、記事の脚注は出典として「『高槻城』高槻市公式HP」を挙げている（指定自体は大阪府指定史跡）。指定年は今回取得した出典では確認できなかった（未確認）。","5. 千早城","- 別名は金剛山城、楠木詰城など。記事：「四方を絶壁に囲まれ要塞堅固を誇ったといわれる連郭式山城である。金剛山城。楠木七城の一つ。」","- 文化庁「国指定文化財等データベース」（文化遺産オンライン転載）でも、名称「千早城跡」、種別「史跡」、指定年月日「1934.03.13（昭和9.03.13）」、管理団体「千早赤阪村（昭9・5・18）」を確認した。","- コトバンク「国指定史跡ガイド」は「1934年（昭和9）の建武中興600年を機に、上・下赤阪城跡、金剛寺境内、観心寺境内などとともに国の史跡に指定された」とする。","- 年数の検算：記事は落城をもって「61年に及ぶ歴史に幕を閉じた」とする。築城1332年から1392年の差は60年で、数え年では61年となり、記事の表現は数え年によるものとみられる（記事の文言をそのまま転記した）。","6. 飯盛山城","- 大東市・四條畷市「史跡飯盛城跡保存活用計画」によれば、指定名称は「飯盛城跡（いいもりじょうあと）」、令和3年（2021年）10月11日に文部科学省告示第164号で史跡に指定され、令和4年（2022年）11月10日と令和5年（2023年）3月20日に追加指定があった。同計画の指定説明文は「飯盛城跡は、大阪府と奈良県の境を南北に連なる生駒山地の北支脈である飯盛山（標高314.3メートル）に築かれた戦国時代（16世紀中頃）の城跡」とする。なおWikipedia記事は標高を315.9mとする（保存活用計画の314.3mと異なる。両方を併記する）。","- 規模について記事は「全盛期には、南北に1200m、東西に500mに達し、70以上の曲輪が確認されている」とする。一方、保存活用計画は「城域は東西約400m、南北約700mを測り」とする。測り方の違いによるものかは出典に明記がなく、両方を併記する。","7. 芥川山城","- 記事：「当時の呼称は『芥川城』であるが、同じ高槻市殿町周辺にあった城も『芥川城』と呼ばれており、『高槻市史』が便宜上、三好山にあった城を『芥川山城』と呼称した」。殿町周辺の芥川城とは別の城である。","- 記事：「芥川山城は飯盛山城と共に大阪府下では最も規模が大きな城跡で、遺構の残存状態も良好で戦国時代の典型的な山城である」（記事の文言そのまま）。","- 年数の検算：記事は廃城をもって「60年にわたる歴史を閉じたとされる」とするが、築城1515〜1516年から廃城1573年頃までの差は57〜58年で、記事の「60年」とは一致しない。記事の文言をそのまま転記し、ここに注記する。"],"tables":[]},{"h":"関連項目：堺の環濠（城ではない）","lv":3,"text":["出典：堺市公式サイト掲載資料「堺環濠都市区域」（種別：自治体、取得日2026-11-18）。","- 「和泉と摂津の国境に成立した堺は、中世に勘合・南蛮貿易によって栄えた港町である。」","- 中世の環濠について：「濠は都市外周を囲う『総（惣）構え堀』的な環濠のみならず、都市内部を縦横に走る内堀も存在しており、この景観を見た当時のヨーロッパの宣教師は『堺はベネチアの如く・・・』と表現している」「この時期堺は、有力町衆によって構成された会合衆による自由都市として発展する。」","- 江戸時代の環濠について：「中世の都市域は、慶長20年（＝元和元年・1615）の大坂夏の陣で全焼」し、「その後徳川幕府の天領（直轄地）として、都市域は中世よりも一回り大きく拡大し、全域が統一的な町割プランに再編され『元和の町割り』と呼ばれている」「濠は都市域拡大後の外周に、新たに江戸期の環濠が掘り直された」。","- 現在の区域：「慶長20年（1615）の大坂夏の陣後に徳川幕府の天領として整備された旧市街地である堺環濠都市地域は、南北3Km、東西1Kmの周辺を環濠で囲まれるエリアである」「周辺を囲む環濠は現在、北端は市道三宝高須線、東端は阪神高速となって濠割が失われているものの、南端、西端には環濠の面影をとどめる」。"],"tables":[]},{"h":"現存天守の確認結果","lv":3,"text":["結論：大阪府内に現存天守はない。","- 根拠：Wikipedia「現存天守」は「現存天守とは、日本の城の天守のうち、江戸時代またはそれ以前に建設され、現代まで保存されている天守のことである。12の天守が現存している」とし、現存12天守として弘前城（青森県）、松本城（長野県）、丸岡城（福井県）、犬山城（愛知県）、彦根城（滋賀県）、姫路城（兵庫県）、松江城（島根県）、備中松山城（岡山県）、丸亀城（香川県）、松山城（愛媛県）、宇和島城（愛媛県）、高知城（高知県）を挙げる。大阪府の城は含まれていない。","- 本表の城についても個別に確認した。大坂城の天守はいずれも「非現存」で現在は1931年の復興天守、岸和田城は1954年の復興天守、高槻城の天守は「非現存」、千早城・飯盛山城・芥川山城に再建天守はない。"],"tables":[]},{"h":"注記・食い違い（e）","lv":3,"text":["1. 岸和田城の築城者：Wikipediaの基礎情報欄は「信濃泰義か」とする（本文は『日本城郭大系』によると信濃泰義によって現在地に移築されたとする）。一方、楠木正成の甥・和田高家が築城したという伝説があったが、Wikipedia本文は「かつては、楠木正成の甥和田高家という人物が岸和田城を築城したという伝説があった。しかし、これらの文献の出典を遡っても江戸時代初期にまでしか到達せず、しかも岸和田に城があったことを示す最初の一次史料は後述の永禄元年（1558年）に三好氏が同城に入ったことを記した浄心院快栄書状まで下る」とし、伝承として扱っている。両方を併記する。","2. 岸和田城への岡部宣勝の入城年：Wikipedia本文には「寛永17年（1631年）、高槻城より岡部宣勝が入城し」とあるが、寛永17年は1640年であり、同記事の略年表は「寛永17年・1640年・松平康重転封後、高槻城より岡部宣勝が入城する」とする。記事内の西暦表記が食い違っているため、そのまま併記する。","3. 高槻城の廃城年：基礎情報欄は「明治7年（1874年）」とするが、本文は「明治4年（1871年）7月、廃藩置県により廃城。明治7年（1874年）には破却が始まり」とする。廃藩置県による廃城（1871年）と破却開始（1874年）の両方を併記する。","4. 千早城の落城年：Wikipediaは廃城年を明徳3年（1392年）とし、1392年正月に畠山基国に攻められ落城したとする。一方、文化庁「国指定文化財等データベース」の千早城跡の解説文には「元中元年楠木正勝■ニ攻メ落サルヽニ及ビ以後廢墟トナレリ」（■は欠字）とあり、元中元年は1384年にあたる。食い違いとして両方を併記する。","5. 飯盛山城の築城：基礎情報欄は築城主を「佐々目憲法か木沢長政」、築城年を建武年間（1334年-1338年）とするが、本文は「この城の始まりは、佐々目憲法（僧正憲法）が南北朝時代に築いたとされているが（『河内志』）、これは河内国ではなく紀伊の飯盛山城であるとも指摘されている」とする。両方を併記する。","6. 飯盛山の標高：Wikipedia「飯盛山城」は315.9m、大東市・四條畷市「史跡飯盛城跡保存活用計画」の指定説明文は314.3mとする。食い違いとして両方を併記する。","7. 芥川山城の存続年数：記事の「60年にわたる歴史」という表現は、築城年（1515〜1516年）と廃城年（1573年頃）の差（57〜58年）と一致しない（上記注記参照）。"],"tables":[]},{"h":"取得不可（e）","lv":3,"text":["- 岸和田市公式サイト「岸和田城」 https://www.city.kishiwada.osaka.jp/soshiki/36/kishiwadajyo.html — テキスト取得がエラーとなり内容を確認できなかった。このため岸和田城の指定（大阪府史跡・国の名勝）や年次はWikipedia記事の記載によるもので、市の公式での照合はできていない。","- 大阪城天守閣の公式サイトおよび高槻市公式サイトの「高槻城」ページ — 今回は直接の取得を行わなかった。大坂城の特別史跡・重要文化財の指定年次はWikipedia記事による（高槻城については、Wikipedia記事の脚注が出典として高槻市公式HPを挙げている）。","---"],"tables":[]}],"f":[{"h":"f-1 江戸時代","lv":3,"text":["出典：","- 大阪府公式「堺打刃物／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o110070/mono/dento/dento16.html （取得日2026-11-18、種別：自治体）","- 大阪府公式「堺線香／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o110070/mono/dento/dento18.html （取得日2026-11-18、種別：自治体）","- 八尾市公式「資料６ 国登録文化財 意見具申用所見（木村家住宅）」 https://www.city.yao.osaka.jp/_res/projects/default_project/_page_/001/025/241/data6.pdf （取得日2026-11-18、種別：自治体）","- 八尾市公式「第２章 高安千塚古墳群を取り巻く環境」 https://www.city.yao.osaka.jp/_res/projects/default_project/_page_/001/011/399/02-1.pdf （取得日2026-11-18、種別：自治体）","- 堺市立図書館「平成28年度堺歴史文化市民講座 河内木綿」（読み「かわちもめん」の出典） https://www.lib-sakai.jp/oshirase/2016/kawachimomen1106.pdf （取得日2026-11-18、種別：自治体）","- 大阪府公式「なにわの伝統野菜／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120090/nosei/naniwanonousanbutu/dentou.html （取得日2026-11-18、種別：自治体）※同ページは「発祥時期」を品目ごとに明記しており、江戸時代と記された品目を本表に入れた","- 近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、取得日2026-11-18、種別：公的）※泉州水なすの「地域との結びつき」欄","- 日本植物油協会「植物油information」 https://www.oil.or.jp/info/96/page02.html （取得日2026-11-18、種別：その他）"],"tables":[{"cols":["番号","品目","読み","産地","備考（出典の引用）","出典の種別"],"rows":[["1","堺打刃物","さかいうちはもの","大阪市、堺市（大阪府ページ「主な産地」）","「安土桃山時代、煙草庖丁の製造が堺で始まり、江戸時代初期には、出刃庖丁、料理庖丁が製造され、全国的にその地位を確立した。さらに江戸時代後期には、生花鋏・植木鋏等の製造が行われ、それぞれ専業者が株仲間を組織し産地を形成した。」（大阪府公式）","自治体"],["2","堺線香","さかいせんこう","堺市（大阪府ページ「主な産地」）","「16世紀終わり頃、線香製法が伝わり、わが国最初の線香が堺で作られ、江戸時代には、すでに産地として名を成している。」（大阪府公式。大阪府知事指定伝統工芸品、指定年月日は昭和61年2月5日）","自治体"],["3","河内木綿","かわちもめん（堺市立図書館の講座案内に「か わ ち も め ん」と振り仮名）","河内地方（中河内一帯。八尾市）","「宝永元年（1701）の大和川付替えにより中河内一帯が大綿作地になると、木綿仲買組の八尾組に名を連ね、河内木綿商として繁栄を築くことになる。」（八尾市公式・木村家住宅の所見。木村家についての記述）。八尾市公式の別の資料では、1704年（宝永元年）の大和川付け替え後の新田開発で「砂地に適した河内木綿が栽培され、全国的に著名な産地となった」旨が記される（同資料の文章は取得テキストが断片化しており、文言の逐語確認は未確認）","自治体"],["4","泉州水なす","センシュウミズナス（近畿農政局GIページの表記）","泉州地域（GIの生産地は下記f-2参照）","「江戸時代初期から泉州地域で栽培されており、他地域で栽培すると形質が変わると言われ、同地域の門外不出の特産品とされていた。」（近畿農政局GIページ「地域との結びつき」）","公的"],["5","難波葱","なんばねぎ","大阪市","発祥時期「江戸時代」。「大阪市難波周辺で江戸時代からさかんに栽培されていたことから『難波葱』と呼ばれる。」（大阪府公式「なにわの伝統野菜」）","自治体"],["6","毛馬胡瓜","けまきゅうり","大阪市","発祥時期「江戸時代」。「大阪市都島区毛馬町が起源とされる黒いぼきゅうり。果実は長さが約30センチメートル、太さ約3センチメートルで、果実の先端部よりの3分の2は淡緑白色からやや黄色気味となり、末端部には独特の苦みがある。果肉は歯切れよく、奈良漬けに重宝されていた。」（大阪府公式）","自治体"],["7","玉造黒門越瓜","たまつくりくろもんしろうり","大阪市","発祥時期「江戸時代」。「大阪城の玉造門（黒門）付近が発祥地。」（大阪府公式）","自治体"],["8","勝間南瓜","こつまなんきん","大阪市","発祥時期「江戸時代」。「大阪市西成区玉出町（旧勝間村）が発祥地。」（大阪府公式）","自治体"],["9","金時人参","きんときにんじん","大阪市","発祥時期「江戸時代」。「江戸時代から昭和初期にかけて大阪市浪速区付近の特産であり、『大阪人参』と呼ばれていた。」（大阪府公式）","自治体"],["10","大阪しろな","おおさかしろな","大阪市","発祥時期「江戸時代」。「江戸時代から栽培が始まり、大阪市の天満橋付近で栽培が盛んだったため、『天満菜(てんまな)』とも呼ばれる。」（大阪府公式）","自治体"],["11","天王寺蕪","てんのうじかぶら","大阪市","発祥時期「江戸時代」。「大阪市天王寺付近が発祥で、葉の切れ込みが深い切葉と葉の切れ込みが浅く葉の形が丸い丸葉の2系統がある。いずれも根は純白扁平で甘味が強く、肉質が緻密である。蕪が地面から浮き上がったように成長することから『浮き蕪』とも呼ばれていた。」（大阪府公式）","自治体"],["12","田辺大根","たなべだいこん","大阪市","発祥時期「江戸時代」。「大阪市東住吉区の田辺地区の特産であった白首(しろくび)大根。」（大阪府公式）","自治体"],["13","服部越瓜","はっとりしろうり","高槻市","発祥時期「江戸時代」。「高槻市の塚脇地区で江戸時代から栽培されている。」（大阪府公式）","自治体"],["14","鳥飼茄子","とりかいなす","摂津市","発祥時期「江戸時代」。「摂津市の鳥飼地区で江戸時代から栽培されている丸なす。」（大阪府公式）","自治体"],["15","三島独活","みしまうど","茨木市","発祥時期「江戸時代」。「茨木市を中心に三島地域で江戸時代から栽培されている。」（大阪府公式）","自治体"],["16","吹田慈姑","すいたくわい","吹田市","発祥時期「江戸時代」。「吹田市で江戸時代以前から自生していたクワイ。」（大阪府公式）","自治体"],["17","高山真菜","たかやままな","豊能町","発祥時期「江戸時代」。「豊能町高山地区で江戸時代から栽培されているアブラナ科のつけな類。」（大阪府公式）","自治体"],["18","高山牛蒡","たかやまごぼう","豊能町","発祥時期「江戸時代」。「豊能町高山地区で江戸時代から栽培されている牛蒡。」（大阪府公式）","自治体"],["19","菜種油（遠里小野・摂津）","読みは出典に明記なし（未確認）","摂津国遠里小野村（現・大阪市住吉区遠里小野とされる地名。ただし出典ページに現行地名の明記はなく、この対応は未確認）","「江戸時代になると菜種の生産が広がり、江戸幕府は菜種生産を奨励しました。1600年代には遠里小野村で長木より効率的な搾油道具である『搾め木』（しめぎ）が開発され、遠里小野村の油生産が再び活気を取り戻し、攝津一帯が菜種油の産地として繁栄を迎えることとなりました。この油は、菱垣廻船で江戸に運ばれ『下り油』として珍重され」た（日本植物油協会）","その他"]]}]},{"h":"f-2 現代","lv":3,"text":[],"tables":[]},{"h":"（1）経済産業大臣指定 伝統的工芸品","lv":4,"text":["出典：伝統的工芸品産業振興協会「伝統的工芸品指定品目一覧・都道府県別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-area_20251027.pdf （2025／令和7年10月27日現在、全国合計244品目、取得日2026-11-18、種別：公的）","同協会「伝統的工芸品指定品目一覧・業種別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （2025／令和7年10月27日現在、取得日2026-11-18、種別：公的）※業種の出典","大阪府は「9」品目と明記され、並びは「浪華本染め　大阪欄間　大阪唐木指物　大阪泉州桐箪笥　大阪金剛簾　堺打刃物　大阪浪華錫器　大阪仏壇　いずみガラス」である。","注記（f-2（1））：","- 候補に挙がっていた「堺五月鯉幟」は、2025年10月27日現在の都道府県別一覧の大阪府9品目には含まれていない。","- 表記の揺れ：「大阪泉州桐箪笥」（協会一覧）と「大阪泉州桐簞笥」（特許庁資料を紹介する二次資料の表記）が併存する。協会の公式一覧の表記は「大阪泉州桐箪笥」である。"],"tables":[{"cols":["番号","品目","読み","産地","備考（業種は業種別一覧による）","出典の種別"],"rows":[["1","浪華本染め","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では染色品の部に記載","公的"],["2","大阪欄間","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載","公的"],["3","大阪唐木指物","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載","公的"],["4","大阪泉州桐箪笥","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載。表記は「大阪泉州桐箪笥」（「簞笥」とする資料もあり、表記の揺れ。下記注記参照）","公的"],["5","大阪金剛簾","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載","公的"],["6","堺打刃物","一覧に記載なし（未確認）。なお大阪府公式ページでは「さかいうちはもの」と読みが明記されている","一覧に記載なし（未確認）。なお大阪府公式ページの「主な産地」は大阪市、堺市","業種別一覧では金工品の部12番目に記載。大阪府公式ページによれば指定年月日は昭和57年3月5日","公的／自治体"],["7","大阪浪華錫器","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では金工品の部13番目に記載","公的"],["8","大阪仏壇","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では仏壇・仏具の部に記載","公的"],["9","いずみガラス","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧ではその他の工芸品の部に記載","公的"]]}]},{"h":"（2）地理的表示（GI）","lv":4,"text":["出典：近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、近畿18産品、取得日2026-11-18、種別：公的）","注記（f-2（2））：","- 近畿農政局のプレスリリース（令和7年1月30日登録分）では「今回の登録により、大阪府のGI登録産品は2産品となりました」とされており、大阪府分は上記2件である。","- 酒類の地理的表示「大阪」（ぶどう酒）は国税庁長官の指定であり、農林水産省のGI登録産品一覧（本表）とは制度が別である。近畿農政局のGI・知的財産のページに「近畿地域では、『灘五郷』、『はりま』、『和歌山梅酒』、『大阪』、『滋賀』、『伊丹』、『京都』が指定されています。（令和7年10月現在）」とあるため、混同しないようここに注記する。"],"tables":[{"cols":["番号","品目","読み","登録番号","登録日","生産地","登録生産者団体","出典の種別"],"rows":[["1","富田林の海老芋","トンダバヤシノエビイモ","第137号","令和5年7月20日","大阪府富田林市（彼方、西板持、東板持、南大伴、北大伴、錦織）","富田林市海老芋振興協議会（一覧表の表記は「富田林海老芋振興協議会」、詳細欄の表記は「富田林市海老芋振興協議会」。両表記を併記する）","公的"],["2","泉州水なす","センシュウミズナス（別表記として Sensyu Mizunasu、OSAKA MIZUNASU、大阪紫晶茄が詳細欄に併記）","第161号","令和7年1月30日","大阪府岸和田市、泉大津市、貝塚市、泉佐野市、和泉市、高石市、泉南市、阪南市、泉北郡忠岡町、泉南郡熊取町、田尻町及び岬町","全国農業協同組合連合会","公的"]]}]},{"h":"（3）地域団体商標","lv":4,"text":["出典：近畿農政局「地域団体商標の活用について」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （「近畿における農林水産物・食品の地域団体商標（令和6年1月現在）」、取得日2026-11-18、種別：公的）","※同ページは「近畿管内において地域団体商標を取得し、『ブランド』の保護を図っている農林水産物・食品をご紹介します」と対象を農林水産物・食品に限っており、より新しい近畿版一覧は同ページ上では確認できなかった（令和6年1月現在が同ページの最新時点）。","注記（f-2（3））：","- 候補に挙がっていた「泉州タオル」「堺刃物」は、上記の近畿農政局一覧（農林水産物・食品に対象を限ったもの）には含まれていない。工芸品・繊維製品を含む地域団体商標の全体像は特許庁の所管であり、同ページも「最新の全ての地域団体商標の案内は特許庁へ」と案内している。特許庁資料を紹介する二次資料によれば「泉州タオル」は2007年に、「堺打刃物」「堺刃物」は平成19年（2007年）10月5日に地域団体商標登録されたとされるが、特許庁の原資料での直接確認は今回できていないため、ここでは未確認として記す。なお「堺打刃物」については大阪府公式ページ自体に「平成19年10月5日（地域団体商標）」と明記がある（f-1出典と同じページ）。","- 読みは近畿農政局の一覧PDF（下記）の検索結果に表示された抜粋によるもので、PDF本文の直接取得は失敗した（取得不可参照）。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","八尾若ごぼう","やおわかごぼう（近畿農政局の一覧PDFの表記による。下記注記参照）","一覧に記載なし（未確認）","農林水産物・食品に限った一覧での大阪府分3件のうちの1件","公的"],["2","泉州水なす","せんしゅうみずなす（同上）","一覧に記載なし（未確認）","GI（第161号）と重なる品目","公的"],["3","泉だこ","いずみだこ（同上）","一覧に記載なし（未確認）","同上","公的"]]}]},{"h":"（4）大阪府公式の認証制度","lv":4,"text":["制度1：なにわの伝統野菜認証制度","出典：","- 大阪府公式「なにわの伝統野菜認証制度／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120090/nosei/naniwanonousanbutu/ninteiseido.html （取得日2026-11-18、種別：自治体）","- 大阪府公式「なにわの伝統野菜認証要領」 https://www.pref.osaka.lg.jp/documents/29195/080512yoryo.pdf （平成17年9月6日施行、令和8年5月12日一部改正、種別：自治体）","- 大阪府公式「なにわの伝統野菜／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120090/nosei/naniwanonousanbutu/dentou.html （取得日2026-11-18、種別：自治体）","対象品目26件（大阪府公式ページの並び・表記のとおり。発祥時期も同ページの記載どおり）：河内一寸空豆（明治時代）、石川早生芋（飛鳥時代）、海老芋（大正時代）、河内れんこん（明治時代）、大阪黒菜（明治時代）、馬場なす（大正時代）、貝塚澤茄子（室町時代）、堺 鷹の爪（明治時代）、難波葱（江戸時代）、毛馬胡瓜（江戸時代）、玉造黒門越瓜（江戸時代）、勝間南瓜（江戸時代）、金時人参（江戸時代）、大阪しろな（江戸時代）、天王寺蕪（江戸時代）、田辺大根（江戸時代）、芽紫蘇（明治時代）、服部越瓜（江戸時代）、鳥飼茄子（江戸時代）、三島独活（江戸時代）、吹田慈姑（江戸時代）、泉州黄玉葱（明治時代）、高山真菜（江戸時代）、高山牛蒡（江戸時代）、守口大根（安土桃山時代）、碓井豌豆（明治時代）。","※このうち発祥時期が江戸時代とされた13品目（難波葱〜高山牛蒡の該当分）はf-1の表にも入れた。守口大根は発祥時期が「安土桃山時代」とされているためf-1には入れていない。","制度2：大阪産（もん）／大阪産（もん）名品","出典：大阪府公式「『大阪産(もん)』『大阪産(もん)名品』ロゴマーク等手続き一覧／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120110/ryutai/osaka_mon/osakamon_logo.html （取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["項目","内容（出典の記載どおり）"],"rows":[["制度名","なにわの伝統野菜認証制度"],["開始","「大阪府で平成17年10月からスタートした本認証制度」（大阪府公式ページ）。要領の附則は「この要領は、平成１７年９月６日から施行する」"],["目的（要領第1条）","「古くから府内で生産され、大阪の農業と食文化を支えてきた歴史、伝統をもつ独特の野菜を『なにわの伝統野菜』として認証することで、伝統野菜を府民に広く魅力発信するとともに、地産地消を進め、大阪農業の理解促進と振興を図る」"],["定義（要領第2条）","次の（1）から（3）を全て満たす野菜。（1）昭和初期以前（概ね100年前）から大阪府内で栽培されてきた野菜。（2）苗、種子等の来歴が明らかで、大阪独自の品目、品種、栽培方法によるもの、又は府内特定地域の気候風土に育まれたものであり、栽培に供する苗、種子等の確保が可能な野菜。（3）現在も府内で生産されている野菜"],["対象品目数","26品目（大阪府公式ページ「なにわの伝統野菜26品目」。「令和8年5月より、『河内一寸空豆』をなにわの伝統野菜として新たに認証し、合計26品目となりました」）"],["認証期間","「認証マークの使用は承認後5年間です」。ただし「難波葱、河内一寸空豆については承認後3年間」"]]},{"cols":["項目","内容（出典の記載どおり）"],"rows":[["大阪産(もん)とは","「大阪府内で生産された農林水産物とそれらを使った加工品のことです。上記に当てはまるものはすべて大阪産(もん)ですが、ロゴマークの使用許可等を申請することで、ロゴマークを使ったPR販売等が可能となります」"],["大阪産(もん)名品とは","「『天下の台所・大阪』で長く愛され続けている、お土産や贈り物にもおすすめの加工食品です。伝統や大阪らしさなど、複数の項目を審査し、認証されたもののみが大阪産(もん)名品となります。現在お菓子やお惣菜、お酒や調味料を含む幅広い品目の300商品以上が認証されています」"],["両者の違い","「大阪産（もん）名品は、大阪府内産原材料の使用を前提としていない点で大阪産（もん）とは異なります」が、「大阪の食のブランドとして、大阪産（もん）との一体感を出すため同じロゴを使用しています」"]]}]},{"h":"注記・食い違い（f-1）","lv":3,"text":["- 泉州タオルは江戸時代の表に入れない。 起源は明治時代である。泉佐野市観光サイト「泉州タオル館 本店」 https://visitizumisanojpn.com/senshu-towel-hall/ （種別：自治体）に「1887年（明治20年）、大阪府泉佐野市（当時の佐野村）にて、当時、白木綿業を営んでいた里井圓次郎氏が海外製のタオルを目にし、『打出機』の開発に成功したのが始まりです」とある。現代の地域団体商標についてはf-2の注記参照。","- 大阪の地酒（下り酒）：大阪府酒造組合の記述として「江戸時代、大阪は天下一の酒どころでした。摂津・河内・和泉と呼ばれた三州から江戸に向けて大量の酒が運び込まれ、『下り酒』としてもてはやされた」と紹介する二次資料（日本酒の教科書 https://sakesoul.jp/osaka-jizake/ 、種別：その他）は確認できたが、組合公式ページの原文を直接取得できていないため、本表には入れず、ここに未確認として記す。","- 『日本山海名物図会』『日本山海名産図会』『摂津名所図会』の原文そのものからの引用は、今回の取得範囲では確認できなかった（下記「取得不可」参照）。国立国会図書館レファレンス協同データベースの事例（柴島晒）では、『摂津名所図会大成』に「此辺淀河の流れをくみて布木綿をさらす。是を國嶋晒といふ」とある旨が紹介されている（ https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000354392 、種別：公的）。柴島晒（くにじまさらし）は河内木綿の晒しに関するものであるが、原典の逐語確認が取れていないため本表には入れていない。","- 河内木綿について、八尾市公式の2資料で大和川付替えの年が「1704年（宝永元年）」（高安千塚古墳群資料）と「宝永元年（1701）」（木村家住宅所見）と併存する。宝永元年は1704年であり、「1701」は資料側の表記のまま転記した（食い違いとして併記）。"],"tables":[]},{"h":"取得不可（f-1）","lv":3,"text":["- 『摂津名所図会』『日本山海名物図会』の原典テキスト：大阪市立図書館デジタルアーカイブ等への到達を試みたが、今回の取得では本文の逐語引用が可能な形で取得できず、取得不可として扱う（上記のとおりレファレンス事例経由の紹介のみ確認）。","- 大阪府酒造組合公式サイトの「下り酒」に関する原文ページ：直接取得できず、取得不可（二次資料のみ確認）。"],"tables":[]},{"h":"取得不可（f-2）","lv":3,"text":["- 近畿農政局「近畿における農林水産物等の地域団体商標一覧（PDF）」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/attach/pdf/chiikidanntai-2.pdf — 取得を試みたが、取得ツール側のレート制限（HTTP 429）のため本文を直接取得できず、取得不可として扱う。大阪府分の品目名は同局のHTMLページ（令和6年1月現在）で確認し、読みは検索結果に表示された同PDFの抜粋によった。","- 特許庁の地域団体商標の原資料（泉州タオル・堺刃物の登録情報）：今回の取得範囲では原資料に到達できず、取得不可（二次資料の紹介のみ確認、上記注記参照）。","---"],"tables":[]}],"g":[{"h":"g. 旧国の制度","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「河内国」 https://ja.wikipedia.org/wiki/河内国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「和泉国」 https://ja.wikipedia.org/wiki/和泉国 （取得日2026-11-18、種別：Wikipedia）","- 住吉大社公式サイト「住吉大社の由緒」 https://sumiyoshitaisha.net/about/origin.html （取得日2026-11-18、種別：その他）※「摂津国一之宮」の称のみ","- 坐摩神社公式サイト https://www.ikasuri.or.jp/ 、大阪府神社庁「坐摩神社（いかすりじんじゃ）」 https://www.osaka-jinjacho.jp/funai_jinja/dai7shibu/chuo-ku/07001ikasurijinja.html （取得日2026-11-18、種別：その他）※読みの確認","- 枚岡神社公式サイト https://www.hiraoka-jinja.org/ （取得日2026-11-18、種別：その他）※「河内国一之宮」の称","- 大鳥大社公式サイト https://www.ootoritaisha.jp/ （取得日2026-11-18、種別：その他）※「和泉國一之宮」の称","- Wikipedia「住吉大社」 https://ja.wikipedia.org/wiki/住吉大社 ／Wikipedia「大鳥大社」 https://ja.wikipedia.org/wiki/大鳥大社 （取得日2026-11-18、種別：Wikipedia）※読み"],"tables":[]},{"h":"表：摂津国","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g1","摂津国の等級","―","上国（記事の基礎情報欄「国力：上国」）","なお、易林本の『節用集』に摂津は「南暖北寒、故五穀先熟、魚鹽繁、大上國也」と記されている（記事「地域」の項）","Wikipedia"],["g2","摂津国府","―","国府所在地を記した文献は次の通り。『和名抄』（平安時代中期成立）では、記載はない。『拾芥抄』（鎌倉時代中期から南北朝時代成立）では、「西生郡」。『節用集』（室町時代中期成立）では、「西成郡」。一方、史書からは次のように推定される。難波京（大阪市天王寺区国分町）、延暦24年（805年）江頭（大阪市中央区か）（『日本後紀』）、天長2年（825年）豊島郡（『日本後紀』）、承和11年（844年）旧鴻臚館（『続日本後紀』）、12世紀 住吉区。記事の基礎情報欄は「1.（推定）大阪府大阪市天王寺区 2.（推定）大阪府大阪市中央区」とする","文献と推定地が複数あり、国府所在地は確定していない（記事は複数の推定を併記する）","Wikipedia"],["g3","摂津国一宮（1）","すみよしたいしゃ（住吉大社）","住吉大社（大阪府大阪市住吉区住吉）。記事の基礎情報欄「一宮」にも挙がる。神社公式サイトも「摂津国一之宮 住吉神社の総本社」とする","ただし、記事は「中世に住吉大社が一宮を自称した文書はない」と注記する","Wikipedia／その他（神社公式）"],["g4","摂津国一宮（2）","いかすりじんじゃ（坐摩神社）","坐摩神社（大阪府大阪市中央区）。記事の基礎情報欄「一宮」に住吉大社とともに挙がる。「坐摩神社（大阪市中央区）は『全国一の宮会』に加盟しており、近世以降こちらも一宮と呼ばれるようになっているが、社勢は住吉大社に及ばなかったとされる。二宮以下も不詳である」（記事）","読み「いかすりじんじゃ」は大阪府神社庁の紹介ページおよび神社公式サイトのドメイン表記による","Wikipedia／その他（大阪府神社庁・神社公式）"],["g5","摂津国総社","―","総社：不詳。難波神社とする説がある（記事）","―","Wikipedia"],["g6","摂津国分寺","―","後継寺院は以下の2説。創建時の遺構はいずれも明らかでないが、天王寺の国分寺付近からは瓦が出土している。天徳山国分寺（大阪府大阪市天王寺区国分町）、護国山（金剛院）国分寺（大阪府大阪市北区国分寺）。記事の基礎情報欄は「1.（推定）大阪府大阪市天王寺区 2.（推定）大阪府大阪市北区」とする","2説併記","Wikipedia"],["g7","摂津国分尼寺","―","（天平）勝宝山法華寺（大阪府大阪市東淀川区柴島町）が後継寺院と推定され、境内には国分尼寺のものという礎石が伝わる。記事の基礎情報欄は「（推定）大阪府大阪市東淀川区」とする","―","Wikipedia"],["g8","延喜式内社（参考）","―","『延喜式神名帳』には、大社26座16社・小社49座46社の計75座62社が記載されている","原史料『延喜式』を引く記載","Wikipedia"]]}]},{"h":"表：河内国","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g9","河内国の等級","―","大国（記事の基礎情報欄「国力：大国」）","―","Wikipedia"],["g10","河内国府","―","国府所在地を記した文献は次の通り。『和名抄』（平安時代中期成立）では、「志紀郡」。『拾芥抄』（鎌倉時代中期から南北朝時代成立）では、「大縣郡（大県郡）」。『節用集』（室町時代中期成立）では、「丹北郡」。国府は、現在の大阪府藤井寺市国府・惣社にある国府遺跡と推定されている。ただし、奈良時代の間に一度移動しているとされる（どちらも現在の藤井寺市内）。記事の基礎情報欄は「大阪府藤井寺市」とする","文献により郡が異なる（食い違い、両論併記）","Wikipedia"],["g11","河内国一宮","ひらおかじんじゃ（枚岡神社）","枚岡神社（大阪府東大阪市出雲井町）。神社公式サイトも「河内国一之宮」を称する","ただし、実際に「一宮」と呼ばれるようになるのは近世以後である（記事）。また片埜神社（大阪府枚方市）も「河州一ノ宮」を名乗っているが、実際には交野郷一宮であったものが河内一宮と混同されたものとされる。二宮には恩智神社（大阪府八尾市恩智中町）が挙げられることがあるが、これは河内国第2位の勢力を持っただけで、神社制度としての二宮となった訳ではなく、二宮と呼ばれるようになるのも近世以後である。三宮以下はない（記事）","Wikipedia／その他（神社公式）"],["g12","河内国総社","―","志貴県主神社（大阪府藤井寺市惣社）。惣社のある土地にこの神社が移ってきたという説と国府の近くにあったので惣社になったという説がある（記事）","―","Wikipedia"],["g13","河内国分寺","―","河内国分寺跡（大阪府柏原市国分東条町）。僧寺は天平期に創建、南北朝時代のころに廃れたとされる","記事の基礎情報欄は「大阪府柏原市（河内国分寺跡）」とする","Wikipedia"],["g14","河内国分尼寺","―","尼寺は同じく柏原市国分東条尼寺にあったと推定されているが、平安時代には荒廃していたと考えられている。記事の基礎情報欄は「（推定）大阪府柏原市」とする","―","Wikipedia"],["g15","延喜式内社（参考）","―","『延喜式神名帳』には、大社23座13社・小社90座80社の計113座93社が記載されている","原史料『延喜式』を引く記載","Wikipedia"]]}]},{"h":"表：和泉国","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g16","和泉国の等級","―","下国（記事の基礎情報欄「国力：下国」）","―","Wikipedia"],["g17","和泉国府","―","国府所在地を記した文献は次の通り。『和名抄』（平安時代中期成立）では、「和泉郡」。『拾芥抄』（鎌倉時代中期から南北朝時代成立）では、「和泉郡」。『節用集』（室町時代中期成立）では、「和泉郡」。国府跡は、現在の大阪府和泉市府中町の府中遺跡とされる。記事の基礎情報欄は「大阪府和泉市」とする","現在の大阪府和泉市の市名は、かつて市内府中町に国府があったことに由来する（記事）","Wikipedia"],["g18","和泉国一宮","おおとりたいしゃ（大鳥大社）","大鳥大社（大阪府堺市西区鳳北町）。正式には大鳥神社。神社公式サイトも「和泉國一之宮 大鳥大社」とする。二宮は泉穴師神社（大阪府泉大津市豊中町）、三宮は聖神社（大阪府和泉市王子町）、四宮は積川神社（大阪府岸和田市積川町）、五宮は日根神社（大阪府泉佐野市日根野）","日根神社は「1501年の文書には四宮と記されている」（記事）。読み「おおとりたいしゃ」はWikipedia「大鳥大社」の冒頭による","Wikipedia／その他（神社公式）"],["g19","和泉国総社","―","五社総社（大阪府和泉市府中町）。泉井上神社境内。国府そばにあり、五宮までの神が祀られている（記事）","―","Wikipedia"],["g20","和泉国分寺","―","和泉国分寺跡（大阪府和泉市国分町）。国分寺推定跡地上に、後継寺院の護国山福徳寺が所在する","―","Wikipedia"],["g21","和泉国分尼寺","―","記事の基礎情報欄は「（未詳）」とする。和泉国内には、僧寺だけで尼寺は設置されなかったと推察されている（記事）","―","Wikipedia"],["g22","延喜式内社（参考）","―","『延喜式神名帳』には、大社1座1社・小社61座52社の計62座53社が記載されている。大社1社は大鳥郡 大鳥神社で、名神大社である","原史料『延喜式』を引く記載","Wikipedia"]]}]},{"h":"注記・食い違い（g）","lv":3,"text":["1. 摂津国一宮（両論併記）：住吉大社と坐摩神社の両方が一宮とされる。摂津国記事の基礎情報欄も両社を併記する。住吉大社については「中世に住吉大社が一宮を自称した文書はない」と記事が注記し、坐摩神社については「近世以降こちらも一宮と呼ばれるようになっている」と記事が記す。","2. 摂津国府は確定していない：文献（『拾芥抄』＝西生郡、『節用集』＝西成郡、『和名抄』＝記載なし）と史書からの推定地（難波京、江頭、豊島郡、旧鴻臚館、住吉区）が複数あり、記事は確定した所在地を示していない。","3. 河内国府の文献上の所在地（食い違い）：『和名抄』＝志紀郡、『拾芥抄』＝大県郡、『節用集』＝丹北郡と文献により異なる。推定地は藤井寺市内の国府遺跡とされるが、奈良時代の間に一度移動しているとされる。","4. 和泉国分尼寺：基礎情報欄は「（未詳）」であり、記事は「僧寺だけで尼寺は設置されなかったと推察されている」とする。設置の有無自体が推察の域を出ない。","5. 等級の表記差：摂津国の等級は基礎情報欄では「上国」だが、易林本『節用集』には「大上國也」と記されている（記事が引用）。両方を併記する。","6. 一宮の読みのうち、住吉大社「すみよしたいしゃ」と大鳥大社「おおとりたいしゃ」はWikipediaの各神社記事の冒頭により、神社公式サイトのページ本文では読み仮名の明記を確認できなかった。坐摩神社「いかすりじんじゃ」は大阪府神社庁の紹介ページに明記がある。","---"],"tables":[]}],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai","kokumei"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun","han","tenryo","senko"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"府名の由来（大坂→大阪）","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai","kokumei"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["旧国名・五畿七道はWikipediaのみが出典。府域が摂津・河内・和泉の3国にまたがる点は、大阪府公式で確認できていない。","摂津国の郡・郷数は、基礎情報欄が13郡78郷、列挙された12郡の郷数合計は75郷で食い違う（理由は未確認）。","和泉監の設置日は、河内国の記事（716年4月16日）と和泉国の記事（3月27日・4月13日）で食い違う。","716年・740年・757年などの日付は、暦の種別が出典に明記されていない（暦不明）。","堺は摂津・河内・和泉の3国にまたがる。1871年（明治4年）9月＝新暦11月12日に、摂津住吉郡の大和川以南が和泉に編入された。"],"b":["藩と藩主はWikipediaのみが出典。高槻藩・岸和田藩など、記事内で数字の食い違いがある（注記のとおり）。","藩主の読みは、各藩記事に明記があるものだけを載せている。小出秀政・岡部長職・北条氏恭ほかは未取得。","岸田藩（奈良の回の未取得分）は、今回も取得できなかった。内容は未確認。","枚方代官所は設置・管轄が未確認。大坂代官は大阪市史編纂所の紹介による。"],"c":["日付は、大阪府公文書館・大阪府公式と、Wikipedia・学術論文で照合した（大阪府の設置、堺県の成立、奈良県の合併、堺県の廃止）。国立公文書館（アジア歴史資料センター）での照合は未実施。","大阪鎮台の設置日は、Wikipediaの西暦換算（2月12日）が他の換算と合わない。計算上は1868年2月15日になるが、確認のため未確認として扱う。","河内県の発足「明治2年1月20日」は、西暦の月日換算が出典になく、暦不明。","堺県の成立時の管轄（河内・和泉両国か、和泉国内4郡のみか）が出典間で食い違う。","第1次統合で堺県にまとまった県の数は、Wikipediaが5県（堺県を含む）、堺市公式が4県で、数え方の違いとみられる。","高槻県・麻田県の統合日（1871年12月31日＝明治4年11月20日）は、タウンガイド大阪のみ。摂津県・豊崎県の日レベルの日付は未確認。"],"d":["府名「大阪府」の由来を説明した大阪府公式のページは見つからなかった。学術論文は「確実な史料はないが、大坂三郷の地に設置されたためであることは間違いないであろう」とする。","「大坂」の初見は、蓮如の文書で明応5年（1496年）とする説と、1498年とする説で食い違う。","「大阪」が府名になった1868年と、社会的に表記が定着した明治半ば〜明治43年とは別の段階。","語源の「大きな坂」説は、Wikipediaが「信憑性に乏しい」とする。語源はいずれも仮説で、確定していない。「坂」を「阪」に変えた理由（士が反する）も一説にとどまる。"],"e":["大阪府内に現存天守はない（大坂城・岸和田城は復興天守）。","千早城の史跡指定（1934年3月13日）は文化庁のデータベースで確認した。それ以外の城はWikipediaのみが出典。","千早城の落城年は、Wikipediaが1392年、文化庁の解説文が元中元年（1384年）で食い違う。","岸和田城：築城者は「信濃泰義か」で確定していない。岡部宣勝の入城年は「寛永17年（1631年）」と書かれているが、寛永17年は1640年。","芥川山城：記事の「60年」は、築城（1515〜1516年）から廃城（1573年頃）の差57〜58年と合わない。","高槻城の廃城年は1871年（廃藩置県）と1874年（破却開始）の両説。","堺の環濠は城ではないが、関連項目として載せている。"],"f":["江戸時代の名産は、大阪府公式・八尾市・堺市立図書館の資料で確認した。『摂津名所図会』などの原典の逐語引用は取得できていない。","泉州タオルの起源は明治20年（1887年）のため、江戸時代の表には入れていない。","伝統的工芸品9品目は協会の一覧で確認した（読み・産地は一覧にない）。","地域団体商標の一覧は令和6年1月時点で、農林水産物・食品に限る。泉州タオル・堺刃物は一覧に含まれない。","河内木綿の大和川付替えは、八尾市公式の2資料で1701年と1704年に割れている。"],"g":["旧国の制度はWikipediaのみが出典。一宮の称は神社公式サイトでも確認した。","摂津国府の所在地は、文献と推定地が複数あり確定していない。河内国府も『和名抄』『拾芥抄』『節用集』で郡が異なる。","摂津国の一宮は、住吉大社と坐摩神社の両説。","和泉国分尼寺は設置の有無自体が推察。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","大林組と日清食品は、発祥は大阪だが本社機能が東京のため、注記のみにしている。一方、武田薬品・クボタ・サントリーなどは本店が大阪のまま入れている。本店の所在地と本社機能の、どちらを基準にするかは未統一。","金剛組の創業578年は会社が伝える創業年。法人の設立年は、親会社の資料は2006年1月、Wikipediaは2005年11月1日で食い違う。","田辺三菱製薬の「田辺ファーマ」への商号変更は、公式で未確認。","シャープの本社所在地（堺市か大阪市中央区か）は、出典間で食い違う。","小林製薬は創業1886年（公式）。江崎グリコの設立年は1929年と1941年で食い違う。","日本生命・近鉄・阪急阪神・ミズノ・カプコンは、未収録（未確認）。"]},"h":[{"h":"出典","lv":2,"text":["- 武田薬品工業 公式サイト「ヒストリー」 https://www.takeda.com/jp/about/our-company/history/ （その他（企業公式））","- 塩野義製薬 公式サイト「ヒストリー」 https://www.shionogi.com/jp/ja/company/history.html （その他（企業公式））","- ロート製薬 公式サイト「沿革」 https://www.rohto.co.jp/company/history/ （その他（企業公式））","- ハウス食品 公式サイト「沿革」 https://housefoods.jp/company/information/history.html （その他（企業公式））","- 積水ハウス 公式サイト「会社概要」 https://www.sekisuihouse.co.jp/company/info/outline/ （その他（企業公式））","- 関西電力 公式サイト「会社概要」 https://www.kepco.co.jp/corporate/profile/outline.html （その他（企業公式））","- 大阪ガス 公式サイト「会社概要」 https://www.osakagas.co.jp/company/profile/index.html （その他（企業公式））","- クボタ 公式ニュースリリース（会社概要欄） https://www.kubota.co.jp/news/2021/management-20211201-2.html （その他（企業公式））","- 小野薬品工業 公式サイト「会社概要」PDF（ono-pharma.com）（その他（企業公式））","- 大日本除虫菊 公式note（KINCHO公式）（その他（企業公式））","- ダイキン工業 公式 会社概要PDF（daikin.co.jp）（その他（企業公式））","- 江崎グリコ Wikipedia「江崎グリコ」 https://ja.wikipedia.org/wiki/江崎グリコ （Wikipedia）","- 株式会社金剛組 公式サイト https://www.kongogumi.co.jp/ ／ 髙松コンストラクショングループ プレスリリース（PR TIMES）の金剛組会社概要 https://prtimes.jp/main/html/rd/p/000000009.000137188.html （その他（企業公式））","- Wikipedia「金剛組」 https://ja.wikipedia.org/wiki/%E9%87%91%E5%89%9B%E7%B5%84 （Wikipedia）","- その他各社 Wikipedia記事・有価証券報告書の沿革転記（個別に表・注記へ記載）"],"tables":[]},{"h "Wikipedia"],["10","伊藤忠商事","いとうじゅうしょうじ","創業1858年（初代伊藤忠兵衛が麻布類の卸売業）／設立1949年12月1日","大阪本社：大阪市北区梅田3丁目1番3号（本店）。東京本社：東京都港区北青山2丁目5番1号","繊維、機械、金属、エネルギー・化学品、食料、住生活、情報・金融","2本社制","Wikipedia・その他"],["11","関西電力","かんさいでんりょく","設立1951年5月1日","大阪市北区中之島3丁目6番16号（本店）","電気事業、熱供給事業、電気通信事業、ガス供給事業等","","その他（企業公式）"],["12","大阪ガス","―","設立1897年4月10日／創業（事業開始）1905年10月19日","大阪市中央区平野町四丁目1番2号","ガス事業等（Daigasグループ）","設立と創業の前後関係は注記参照","その他（企業公式）"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 小林製薬の創業年（食い違い）：公式の沿革・有価証券報告書では「1886年2月創業」とする一方、マイナビの企業情報ではルーツを「1892年に名古屋で創業」と記載する。表では公式の1886年を採用し、両論をここに併記する。","- 江崎グリコの設立年（食い違い）：Wikipedia・コトバンク（日本の企業がわかる事典）は「1929年（昭和4年）2月に株式会社江崎を設立」とする一方、キャリアインサイトの企業概要は設立を「1941年（昭和16年）9月29日」と記載する。表では1929年2月を採用し、両論を併記する。","- シャープの本社所在地（食い違い）：2016年に本社を堺市堺区匠町1番地へ移転したとする出典が複数ある一方、2026年11月17日頃にクロールされたWikipediaのミラー（Newikis）では本社所在地を「大阪市中央区久太郎町2丁目1番25号」、設立を「1935年5月2日」と記載する。いずれが現行の記載かは未確認。表では堺市への移転を採用し、両論を併記する。","- 大阪ガスの設立と創業：公式の会社概要は「設立1897年4月10日」「創業（事業開始）1905年10月19日」と、設立が事業開始より先に来る形で記載している。出典どおりに両方を転記した。","- 田辺三菱製薬の商号変更（未確認）：商号が2025年12月より「田辺ファーマ株式会社」となることが公表されている旨の記載が二次資料（その他）にあるが、企業公式ページでの直接確認は未実施のため、表の社名は取得日時点の「田辺三菱製薬」とし、本件は未確認としてここに記す。","- 発祥は大阪府だが現在は本社機能が府外の企業（本体に入れず注記のみ）：","- 大林組（おおばやしぐみ）：1892年（明治25年）1月25日、大林芳五郎が大阪市西区靱南通四丁目（現・西本町二丁目）で土木建築請負業「大林店」を創業。設立は1918年（大正7年）12月（有価証券報告書の沿革では、1936年12月の株式会社第二大林組設立をもって当社の設立とする旨の記載もある）。2010年に登記上の本店および本社機能を東京へ移転し、現在は本社＝東京都港区港南二丁目15番2号（品川インターシティB棟）、大阪本店＝大阪市中央区北浜三丁目5番29号（日本生命淀屋橋ビル、2023年移転）の体制。出典：Wikipedia（Weblio転記）・コトバンク（その他）。","- 日清食品（日清食品ホールディングス）：1948年（昭和23年）9月4日、創業者・安藤百福が大阪府泉大津市に株式会社中交総社を設立（本店は泉大津市汐見町）。1958年12月に日清食品株式会社へ商号変更。1988年3月に東京支社を東京本社と改称し、2008年には本社機能を東京へ移転・集約した。現在の日清食品株式会社は東京本社＝東京都新宿区新宿6-28-1、大阪本社＝大阪市淀川区西中島4-1-1で、本店所在地は大阪市淀川区。持株会社の日清食品ホールディングスは「本社・東京、登記上本店・大阪」とされる。出典：有価証券報告書の沿革（転記）・Wikipedia（Weblio転記）。","- 今回未収録（本社が大阪府内の大手だが、本項目の調査時間内に裏取りできなかったため社名のみ）：日本生命保険、近鉄グループホールディングス、阪急阪神ホールディングス、ミズノ、カプコン。","- 金剛組の法人設立年：親会社（髙松コンストラクショングループ）のプレスリリースの会社概要は「設立 2006年1月（創業 飛鳥時代第30代敏達天皇7年（西暦578年））」とする一方、Wikipedia「金剛組」の基礎情報は「設立 2005年11月1日」とする。創業578年は両出典で一致する。表ではプレスリリースの2006年1月を採用し、両論をここに併記する。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 本項目（h）の調査で、取得不可となったページはない。","- ただし、田辺三菱製薬の商号変更（2025年12月〜「田辺ファーマ株式会社」）については企業公式ページでの直接確認が未実施のため、上記のとおり「未確認」として注記に記載した。"],"tables":[]}]},{"id":"hyogo","title":"兵庫県","sub":"旧摂津国（兵庫県域）・播磨・但馬・淡路・丹波国（兵庫県域）","meta":["取得日：2026-11-18（全出典共通）","範囲：兵庫県全域を1章で扱う。旧国は摂津（兵庫県域のみ）・播磨・但馬・淡路・丹波（兵庫県域＝丹波篠山市・丹波市）の5国。aとgは旧国ごとに表を分け、ほかは県単位でまとめる。日付は新暦を主にし、1872年末までは旧暦を括弧で併記する。","---"],"a":[{"h":"県域と旧国の対応（兵庫県公式による確認）","lv":2,"text":["出典：","- 兵庫県公式サイト「県域の変遷」 https://web.pref.hyogo.lg.jp/kk32/pa13_000000013.html （自治体）","- ひょうご歴史ステーション「ひょうご史Q&A」（兵庫県立歴史博物館） https://www.hyogo-c.ed.jp/~rekihaku-bo/historystation/rekihaku-meet/q-and-a/index.html （自治体）","- 取得日：2026-11-18","注記・食い違い：","- 兵庫県公式「県域の変遷」では、第3次兵庫県の見出しは「明治9年7月～」とあるが、本文は「明治9年(1876)8月、飾磨県と豊岡・名東両県の一部が兵庫県に併合」とあり、見出しと本文で月が食い違う（食い違い）。Wikipedia各国記事は第2次府県統合を1876年8月21日とする。","- 兵庫県公式サイト本体で旧国の郡数・制度まで記したページは確認できず、各国の詳細は兵庫県立歴史博物館のサイトおよびWikipedia等で補った。","---"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","兵庫県域を構成する旧国","―","「現在の兵庫県域は、摂津・丹波・但馬・播磨・淡路の５つの旧国を中心に構成されています」","神戸市の主要部分から三田市、阪神間にかけてが「摂津国全13郡のうち５郡」。丹波篠山市・丹波市は「丹波国６郡のうち２郡」に相当し「丹波国の残り４郡は京都府の中部を構成」。県域北部・日本海側は但馬国。神戸市垂水区・西区・北区から西の瀬戸内海沿岸部は播磨国。淡路島は島全体で淡路国","自治体"],["2","五国以外の旧国","―","赤穂市西部の福浦地区は1963年（昭和38）まで岡山県域で旧国は備前国。佐用郡佐用町北西部の旧石井村地区周辺も1896年（明治29）まで岡山県で旧国は美作国。「ですので、詳しくみると、現在の県域は旧国では七国にまたがることになります」","本章では五国を対象とし、備前・美作は扱わない","自治体"],["3","兵庫県の成立（県公式）","―","「兵庫県が播磨・但馬・淡路と、丹波・摂津の一部を加えた、五か国にまたがる大きな県」になった。第2次兵庫県（明治4年11月～）は「摂津の西部5郡を管地とするもの」。「明治9年(1876)8月、飾磨県と豊岡・名東両県の一部が兵庫県に併合されて、ほぼ現在の県域が確定しました」","1876年は改暦（1873年）後のため新暦","自治体"]]}]},{"h":"a-1 摂津国（兵庫県域）","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （Wikipedia）","- ひょうご歴史ステーション「ひょうご史Q&A」（兵庫県立歴史博物館） https://www.hyogo-c.ed.jp/~rekihaku-bo/historystation/rekihaku-meet/q-and-a/index.html （自治体）","- 取得日：2026-11-18","注記・食い違い：","- 郡数・郷数の食い違い：記事冒頭の諸元表は「13郡78郷」とするが、「郡」の節に列挙されるのは12郡で、その郷数を合計すると75郷となり、78郷と一致しない（検算済み。食い違い。理由は記事に記載がなく未確認）。13郡目にあたる百済郡は沿革に「天智天皇3年（664年）に百済郡が設置された」とあるが、「郡」の節の一覧には挙がっていない。","- 等級についてはg-1に記す（易林本『節用集』の「大上國也」の記載あり）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","摂津国","せっつのくに","令制国の一つ。畿内に属する。旧字体は「攝津國」。現在の大阪府北中部の大半と兵庫県南東部にあたる","もと「津国（つのくに）」と呼ばれた（難波津・住吉津があったため）","Wikipedia"],["2","別称","摂州（せっしゅう）","―","―","Wikipedia"],["3","所属","―","畿内","五畿の一つ","Wikipedia"],["4","郡・郷数","―","13郡78郷","記事冒頭の諸元表による。下記注記の食い違い参照","Wikipedia"],["5","郡名一覧","―","島上郡（全5郷）・島下郡（全4郷）・豊島郡（全7郷）・能勢郡（全3郷）・川辺郡（全8郷）・有馬郡（全5郷）・武庫郡（全8郷）・菟原郡（全8郷）・八部郡（全5郷）・西成郡（全12郷）・東成郡（全5郷）・住吉郡（全5郷）","記事「郡」の節に挙がるのは12郡。能勢郡は和銅6年（713年）に河辺（川辺）郡の一部を割いて設置。島上・島下両郡は古代三島郡が大宝元年（701年）に分割されて設置","Wikipedia"],["6","兵庫県域の郡","―","川辺郡・有馬郡・武庫郡・菟原郡・八部郡の5郡（郷数は川辺8・有馬5・武庫8・菟原8・八部5の計34郷）","兵庫県立歴史博物館「摂津国全13郡のうち５郡」と一致。明治4年11月20日（1871年12月31日）の第1次府県統合により、この5郡が兵庫県の管轄となった（Wikipedia）。神戸市のうち北区淡河町、須磨区須磨ニュータウン西部、垂水区の大部分、西区は播磨国に属する","Wikipedia／自治体"],["7","摂津職の経緯","せっつしき","壬申の乱に勝利した天武天皇が、難波宮を副都とし「国司を置く代わりに、津国を摂（管掌）する機関として特に摂津職を置いた」。摂津職は京官とされ、大夫・亮・進・属の四等官で構成された。長岡京遷都に伴い難波宮が解体され副都の実が失われたため、延暦12年（793年）3月9日に摂津職を廃し、新たに摂津国を置いた。「前身の摂津職から引き継いで『摂』の字を冠し、『せっつのくに』とも呼び、また元の津国の訓みそのままに『つのくに』とも呼んだ」","延暦12年3月9日は和暦表記のみの出典による（旧暦）。摂津大夫の任官は天武天皇6年（677年）の多比麻呂から見える","Wikipedia"],["8","百済郡","くだらのこおり（読みは記事に明記なし）","天智天皇3年（664年）に百済郡が設置された","記事「郡」の節の一覧には含まれない（下記注記参照）","Wikipedia"]]}]},{"h":"a-2 播磨国","lv":2,"text":["出典：","- Wikipedia「播磨国」 http://ja.wikipedia.org/wiki/播磨国 （Wikipedia）","- コトバンク「播磨国」『日本大百科全書（ニッポニカ）』 https://kotobank.jp/word/播磨国-117772 （その他（日本大百科全書））","- 取得日：2026-11-18","注記・食い違い：","- 郡名の表記差：Wikipediaは「加古郡」「美嚢郡」、『日本大百科全書』は「賀古」「美囊（みなき）」と表記する（食い違いではなく表記の差として併記）。","- 神戸市域の国境：現在の神戸市域では、須磨区を境に東部（長田区・兵庫区・中央区・灘区・東灘区の全域および須磨区・北区のそれぞれ大部分）が摂津国、西部（垂水区・西区の全域と北区・須磨区のそれぞれ一部）が播磨国であった（Wikipedia）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","播磨国","はりまのくに","令制国の一つ。山陽道に属する。相当領域は兵庫県南西部","―","Wikipedia"],["2","別称","播州（ばんしゅう）","「播」という漢字を「バン」と読むのは「播州」またはその省略形に限られ、本来の音読みは「ハ」である","―","Wikipedia"],["3","所属","―","山陽道","―","Wikipedia"],["4","郡・郷数","―","12郡98郷","―","Wikipedia"],["5","郡名一覧","―","明石郡・美嚢郡・加古郡・印南郡・賀茂郡・多可郡・飾磨郡・神崎郡・揖保郡・宍粟郡・佐用郡・赤穂郡の12郡","記事に「※はじめの郡名は『延喜式』による」と明記。近世以降、賀茂郡は加東郡・加西郡に、飾磨郡は飾東郡・飾西郡に、神崎郡は神東郡・神西郡に、揖保郡は揖東郡・揖西郡に分かれた形で記事に記載される。『日本大百科全書』では郡名を「明石，賀古，印南（いなみ），飾磨（しかま），揖保（いいぼ），赤穂，佐用，宍粟（しさわ），神崎，多可，賀茂，美囊（みなき）の12郡」とする（表記差あり。下記注記参照）","Wikipedia／その他（日本大百科全書）"],["6","国名表記の変遷","―","木簡では「針間国」・「幡麻国」と表記しているものもある。『日本大百科全書』によれば「国名は《古事記》《旧事本紀》等に〈針間〉と記され，播磨の表記が一般化するのは710年ころ以後である」。郡名も飾磨がもとは〈志加麻〉、宍粟が〈宍禾〉などと表記されていた（藤原宮出土木簡、『播磨国風土記』）","『播磨国風土記』冒頭に国名の由来があったと見られるが、冒頭部分が欠失しており明らかではない（Wikipedia）","Wikipedia／その他（日本大百科全書）"],["7","成立の経緯","―","「針間国（播磨中・西部）・明石国（東播磨・神明・三木地域）・針間鴨国（北部）が大化の改新以降に播磨国（針間国）へ編入されたと推定されている」。7世紀に成立。『旧事本紀』は律令制に基づく播磨国の成立以前に、明石国造・針間鴨国造・針間国造の3国造がいたとする（日本大百科全書）","『播磨国風土記』は713年（和銅6年）に編まれた風土記のうち、現在まで文献が残る五か国の一つ","Wikipedia／その他（日本大百科全書）"],["8","等級の変遷","―","『延喜式』では大国。『日本大百科全書』：「国司四等官のうち大国にのみ置かれる大目（だいさかん）が712年（和銅5）に播磨国にいるので（《続日本紀》），8世紀初めより大国であったことがわかる」","Wikipedia「播磨国」記事には等級の変遷の記述はなく、大国であることのみ記載される。712年は年表記のみ","その他（日本大百科全書）"]]}]},{"h":"a-3 但馬国","lv":2,"text":["出典：","- Wikipedia「但馬国」 http://ja.wikipedia.org/wiki/但馬国 （Wikipedia）","- 取得日：2026-11-18","注記・食い違い：","- 郷数について、Wikipedia記事は59郷とする。『和名抄』に基づく郷数を63郷とする事典類の記載があるかは、本便では当該事典の本文を取得できておらず未確認。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","但馬国","たじまのくに","かつて日本の地方行政区分だった令制国の一つ。山陰道に属する。相当領域は兵庫県北部。但馬の歴史的仮名遣いは「たぢま」","古文書では「儋馬國」と表記","Wikipedia"],["2","別称","但州（たんしゅう）","―","―","Wikipedia"],["3","所属","―","山陰道","―","Wikipedia"],["4","郡・郷数","―","8郡59郷","下記の郷数に関する注記参照","Wikipedia"],["5","郡名一覧","―","朝来郡・養父郡・出石郡・気多郡・城崎郡・美含郡・二方郡・七美郡の8郡","記事に「※郡名は『延喜式』による」と明記。記事「地域」の節では城崎郡を「城埼郡」と表記する箇所がある（記事内の表記揺れ）","Wikipedia"],["6","国名表記の変遷","―","『古事記』には「多遅摩国」と記載される。国造の名として「但遅麻国造」「二方国造」が見える","―","Wikipedia"],["7","成立の経緯","―","「但馬国は7世紀後半に丹波国より8郡を分割して成立したとする説もあるが確証はない。『日本書紀』天武天皇4年（675年）条に国名がみえるので、この頃成立したと推定されている」","のちに但馬国となる地域は、その後、丹波国造の支配地域である丹波国となったと記事は記す","Wikipedia"]]}]},{"h":"a-4 淡路国","lv":2,"text":["出典：","- Wikipedia「淡路国」 https://ja.wikipedia.org/wiki/淡路国 （Wikipedia）","- 取得日：2026-11-18","注記・食い違い：なし（本便の範囲では出典間の食い違いは確認されなかった）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","淡路国","あわじのくに","かつて日本の地方行政区分だった令制国の一つ。南海道に属する。兵庫県淡路島・沼島にあたる","『古事記』『日本書紀』の国産み神話では、日本列島で最初に生まれた島とされる","Wikipedia"],["2","別称","淡州（たんしゅう）","―","―","Wikipedia"],["3","所属","―","南海道","―","Wikipedia"],["4","郡・郷数","―","2郡17郷","―","Wikipedia"],["5","郡名一覧","―","津名郡・三原郡","記事に「※郡名は『延喜式』による」と明記。「古くは津名郡と三原郡で構成されていた」","Wikipedia"],["6","国名表記の変遷","―","「律令制以前は淡道国造の領域であり、『淡道』の表記であった。律令制において令制国のひとつとなり『淡路』の表記となった」。5世紀の仁徳天皇の御代に設置された淡道国造に起源を持つものと推定される（国造本紀）","『古事記』では淡路島を「淡道之穂之狭別島」と記す","Wikipedia"],["7","御食国","みけつくに","『延喜式』や平城京などから発見された木簡によると、租庸調に加え、贄（にえ）とよばれた海産物（主に魚）を直接に朝廷の内膳司に納めていたことが分かっており、「朝廷にとって淡路国が特殊な位置にあったとする説がある（御食国を参照）」","―","Wikipedia"]]}]},{"h":"a-5 丹波国（兵庫県域＝丹波篠山市・丹波市）","lv":2,"text":["出典：","- Wikipedia「丹波国」 https://ja.wikipedia.org/wiki/丹波国 （Wikipedia）","- ひょうご歴史ステーション「ひょうご史Q&A」（兵庫県立歴史博物館） https://www.hyogo-c.ed.jp/~rekihaku-bo/historystation/rekihaku-meet/q-and-a/index.html （自治体）","- 取得日：2026-11-18","注記・食い違い：","- 年数の検算：記事は豊岡県の時期について「1871年（明治4年）11月2日～1876年（明治9年）8月21日の約5年間」と記す。実際の期間は4年9か月余であり、「約5年間」の表記と整合する（検算済み）。","---"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","丹波国","たんばのくに","日本の地方行政区分である令制国の一つ。山陰道に属する。相当領域は京都府中部、兵庫県北東部、大阪府の一部","古くは「たには」とも称した。『和名抄』では「丹波」を「太迩波（たには）」と訓む","Wikipedia"],["2","別称","丹州（たんしゅう）","―","記事の注釈：「別称『丹州』は、丹後国とあわせて、または単独での呼称」（第2便・京都府F5の確認と一致）","Wikipedia"],["3","所属","―","山陰道","―","Wikipedia"],["4","郡・郷数","―","6郡68郷","丹後分立後の郡数","Wikipedia"],["5","郡名一覧","―","桑田郡（くわだ）・船井郡（ふない）・何鹿郡（いかるが）・天田郡（あまた）・多紀郡（たき）・氷上郡（ひかみ）の6郡","兵庫県域は多紀郡（丹波篠山市）と氷上郡（丹波市）。兵庫県立歴史博物館：「丹波篠山市・丹波市は丹波国６郡のうち２郡に相当し、丹波国の残り４郡は京都府の中部を構成しています」","Wikipedia／自治体"],["6","国名表記の変遷","―","主に「丹波」が使われているが、「旦波」「但波」「丹婆」「谿羽」などの表記も見られる。「藤原宮跡出土木簡では例外を除いて全て『丹波』なので、大宝律令の施行とともに『丹波』に統一されたと考えられている」","由来は『和訓栞』の「谷端」説と『諸国名義考』の「田庭（平らかに広い地）」説があり、後者が有力視されている（記事）","Wikipedia"],["7","分国の経緯","―","律令制以前は但馬、丹後も含み丹波国造の領域とされた。「7世紀の令制国成立に伴い、但馬地域が分国し但馬国となり、また和銅6年（713年）4月3日北部5郡が丹後国として分国、そして都に近い郡は『丹波国』となった」。現在では丹波・丹後・但馬を「三丹」、但馬を含まない場合は「両丹」と総称することもある","和銅6年4月3日は和暦表記のみの出典による（旧暦）。分立前の11郡の郡名一覧は記事本文では確認できず未確認","Wikipedia"],["8","兵庫県域への帰属","―","明治4年11月2日（1871年12月13日）の第1次府県統合により多紀郡・氷上郡・天田郡は豊岡県に分けられ、1876年（明治9年）8月21日の第2次府県統合により「氷上郡、多紀郡の二郡が兵庫県に編入」された（天田郡は京都府へ）","1876年8月21日は改暦後のため新暦","Wikipedia"]]}]}],"b":[{"h":"出典","lv":3,"text":["- Wikipedia「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧 （取得日：2026-11-18）【Wikipedia】— 県域の藩の網羅確認に使用","- 各藩記事：三田藩／尼崎藩／柏原藩（丹波柏原藩）／篠山藩／八上藩／姫路藩／明石藩／赤穂藩／龍野藩／小野藩／三草藩／安志藩／山崎藩／林田藩／三日月藩／福本藩／播磨新宮藩／姫路新田藩／平福藩／清富藩／出石藩／豊岡藩／村岡藩／八木藩／竹田藩／淡路洲本藩／徳島藩／生野奉行（いずれもWikipedia、取得日：2026-11-18）","※本表の出典はすべてWikipediaであり、公的・自治体出典での照合は未実施。藩主の読みは各藩記事に読みの記載がある場合のみ転記し、記載がないものは「―（記事に読みなし）」とした。自治体出典による読みの確認は未実施（未確認）。"],"tables":[]},{"h":"本表","lv":3,"text":[],"tables":[]},{"h":"摂津国（兵庫県域分）","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["1","三田藩","さんだはん","1601年立藩（有馬則頼入封）〜1871年","山崎家盛（いえもり）※歴代藩主表の筆頭。1600年〜1601年","九鬼隆義（たかよし）","山崎家2万3000石→有馬家2万石→松平〔能見〕家3万石→九鬼家3万6000石","三田城、のち三田陣屋","Wikipedia"],["2","尼崎藩","あまがさきはん","1615年〜1871年","建部政長（―）・池田重利（―）※1615年〜1617年は両家が在城","松平〔桜井〕忠興（―）","建部家・池田家 各1万石→戸田家5万石→青山家5万石→5万4000石→4万8000石→松平〔桜井〕家4万8000石→4万石→4万5000石","尼崎城","Wikipedia"]]}]},{"h":"丹波国（兵庫県域分）","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["3","柏原藩（丹波柏原藩）","かいばらはん","1598年立藩〜1650年廃藩／1695年再立藩〜1871年","織田信包（おだ のぶかね）","織田信親（おだ のぶちか）","3万6000石→（1650年〜1695年は幕府領）→2万石","柏原陣屋","Wikipedia"],["4","篠山藩","ささやまはん","1609年（八上藩から移行）〜1871年","松平康重（まつだいら やすしげ）","青山忠敏（あおやま ただゆき）","5万石（松井松平家・藤井松平家・形原松平家）→青山家5万石→6万石（忠裕の代に1万石加増）","篠山城","Wikipedia"],["5","八上藩","やかみはん","1602年〜1609年（篠山藩へ移行）","前田茂勝（しげかつ）","松平康重（やすしげ）","5万石","八上（居城名は記事に明記なし）","Wikipedia"]]}]},{"h":"播磨国","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["6","姫路藩","ひめじはん","1600年〜1871年","池田輝政（―）","酒井忠邦（―）","池田家52万石→本多家15万石→奥平松平家18万石→結城松平家・榊原家・本多家・酒井家いずれも15万石","姫路城","Wikipedia"
