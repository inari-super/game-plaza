(1989年)1月7日 - 平成31年(2019年)4月30日","日本国憲法及び現皇室典範に基づいて即位した最初の天皇。また、天皇の退位等に関する皇室典範特例法に基づいて、憲政史上初めてかつ最高齢で譲位した天皇でもある。年齢が確かとされる推古天皇以降で歴代最長寿の天皇。「上皇」は追号・諡号ではなく、同特例法により定められた称号。改元（平成）は翌1月8日。","Wikipedia"],["126","今上天皇（徳仁）","（読みなし）","令和元年(2019年)5月1日 - 在位中","戦後かつ日本国憲法及び現皇室典範下の生まれで即位した初の天皇。「今上天皇」は追号・諡号ではない。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： Wikipedia「天皇の一覧」（取得日2026-11-18）。以下は同記事の記述の転記。"],"tables":[]},{"h":"代数の数え方","lv":3,"text":["- 『皇統譜』に基づくかぎり、歴代天皇は、初代神武天皇から今上徳仁まで、126代が挙げられる。この126代のうち、第37代斉明天皇は第35代皇極天皇の、第48代称徳天皇は第46代孝謙天皇の、それぞれ重祚（一度譲位した天皇が再び位に就くこと）であるため、総数は124人となっている。","- 歴代天皇の確定： 歴代天皇を確定するための基準が定まったのは、大正時代末期のことである。このとき示された基準によって、「歴代天皇は126代、124人（北朝を含めると総数129人）」という2023年（令和5年）現在の歴代天皇の形が確定している。"],"tables":[]},{"h":"北朝の扱い","lv":3,"text":["- 南北朝時代に、北朝（京都）で即位した天皇のうち、後小松天皇を除く光厳天皇、光明天皇、崇光天皇、後光厳天皇、及び後円融天皇の5代、5人は、明治時代に歴代天皇から除外されたため、この126代の天皇には数えられないものの、宮中祭祀等においては天皇として扱われる。このため、現在に至る天皇の総数は129人と数えられることもある。","- 北朝の天皇5人は、明治時代までは、神武天皇からの連番である歴代天皇の代数に数えられていたものの、明治時代に南北朝正閏問題が政治問題になり、歴代天皇の代数から除外するとともに、後小松天皇の在位期間を1392年（明徳3年）の南北朝合一以後のみとした。","- 明治天皇の配慮により、宮中祭祀などでは天皇として扱われているほか、宮内庁公式サイトをはじめ、北朝の天皇は歴代代数には含めないものの、歴史上存在した天皇として扱われている。"],"tables":[]},{"h":"弘文天皇","lv":3,"text":["- 弘文天皇は明治3年に追諡されて第39代天皇として認められたが、実際に即位したか否かには議論がある。（同記事の表外参照）"],"tables":[]},{"h":"神功皇后","lv":3,"text":["- 現在の歴代天皇（126代）には含まれない。","- 『本朝皇胤紹運録』では第15代天皇として数えられている。","- 伝号天皇として： 『常陸国風土記』に「息長帯比賣天皇」とある。江戸時代の偽書『大成経』に「神功天皇」とある。"],"tables":[]},{"h":"『本朝皇胤紹運録』との食い違い","lv":3,"text":["同記事の「歴代天皇（本朝皇胤紹運録）」表との比較。『本朝皇胤紹運録』は、後小松上皇の命令で編纂され、明治以前の一般的な皇室の系譜となったもので、同書では――","- 神功皇后を歴代に数える（皇統譜では数えない）。","- 弘文天皇および仲恭天皇を歴代に数えない（皇統譜では第39代・第85代として数える）。","- 後醍醐天皇を除く南朝天皇を天皇と認めずに北朝天皇を歴代天皇に数える。具体的には、後村上天皇・長慶天皇・後亀山天皇を歴代に含めず、北朝の光厳・光明・崇光・後光厳・後円融を歴代として数える。","- そのため代数がずれ、今上天皇は同書の数え方では第127代となる。"],"tables":[]},{"h":"取得不可・未実施の報告","lv":2,"text":["- 宮内庁「歴代天皇陵のご案内」（http://www.kunaicho.go.jp/ryobo/ ）： 動的検索ページのため、テキスト取得では「全0件中0件表示」となり、一覧の転記は取得不可。検索インデックス上では「全124件」と表示されることを確認したのみで、全件の照合は未実施。","- 宮内庁の天皇系図そのもの（画像・系図形式）： テキストとしての転記は未実施。次回以降の課題。"],"tables":[]}],"f 以下は同記事の記述の転記。"],"tables":[]},{"h":"南北朝期の両朝の年号","lv":3,"text":["- 元徳3年（1331年）、後醍醐天皇（大覚寺統）の倒幕計画発覚後、天皇は「元弘」に改元した。しかし、鎌倉幕府は改元を認めず、「元徳」を使い続けるとともに光厳天皇（持明院統）を擁立した。","- 建武の新政は2年足らずで崩壊し、建武3年（1336年）に後醍醐天皇は「延元」に改元した。これに対して尊氏は入京して光明天皇を擁立し、「建武」の元号を使い続けた。後醍醐天皇は吉野へ逃れ、吉野朝廷（南朝）が成立した。","- 南朝の建徳以降の元号は改元史料を欠き、正確な始期を明らかにし難い。文中を除いて、『続史愚抄』『南朝公卿補任』以来の通説を掲げる（同記事の明記）。","- 元中9年（1392年）、後亀山天皇が退位して南北朝合一が成った（明徳の和約）。元号は「明徳」に統一された。"],"tables":[]},{"h":"元号の地域的な継続使用","lv":3,"text":["- 治承4年（1180年）に安徳天皇が即位し、翌年「養和」へ改元されたが、対立する源頼朝の関東政権は「養和」と「寿永」を使わず「治承」を引き続き使用した（寿永2年（治承7年、1183年）まで）。一方、平氏一門は都落ちした後も元暦2年（寿永4年、1185年）の壇ノ浦の戦いで滅亡するまで「寿永」を使用していた。","- 長門探題（後に九州探題）の足利直冬は九州の広い地域で7年（=観応2年=1351年）まで貞和の元号を用いた。観応の元号は2年の正平一統によりいったん廃されたが、破談により翌年に復活した。","- 鎌倉公方の足利持氏は永享への改元を認めず、正長の元号を4年（=永享3年=1431年）まで用いた。古河公方の足利成氏は康正以後の改元を認めず、以後も関東の広い地域において、享徳の元号は27年（=文明10年=1478年）まで用いられた（享徳の乱）。"],"tables":[]},{"h":"私年号の扱い","lv":3,"text":["- 同記事には「中央政府以外の元号」として「私年号」の節があるが、一覧そのものは本表には含まれていない（別記事への案内のみ）。私年号の個別の転記は未実施。"],"tables":[]},{"h":"大化の始期","lv":3,"text":["- 同記事の表では大化の始期は「大化元年7月1日（645年7月29日）」だが、同記事の注記によれば、「大化」は皇極天皇4年6月19日（645年7月17日）以後30日以前に公布され、翌月1日から実施されたと考えられるが、史書によって記述が一定しないため、正確な始期は不明。『扶桑略記』や『帝王編年記』では「7月」、『元亨釈書』では「正月」（7月に公布）、『国史大辞典』（吉川弘文館、1908年発行）では「6月19日」となっている。"],"tables":[]},{"h":"寛平・昌泰の境目","lv":3,"text":["- 同記事の注釈によれば、寛平の終期・昌泰の始期の日付には「4月16日（5月10日）、8月16日（9月5日）の説もある」。"],"tables":[]},{"h":"改元の方式","lv":3,"text":["- 改元の日付は、平成は翌日改元、令和は翌月改元であり、最初の大化も公布翌月の実施と見られるが、白雉から明治までの多くは当年（年初）から改元する年初改元、大正・昭和は当日（日初）から改元する当日改元だった。","- 明治以降の元号は、天皇一代につき元号を一つ制定する制度（一世一元の制）に基づいている。"],"tables":[]},{"h":"取得不可・未実施の報告","lv":2,"text":["- 国立公文書館デジタルアーカイブ「元号一覧」（同記事の外部リンクに掲載）： 取得不可として報告済みのため、本文には使用していない。","- 私年号の一覧： 同記事内には一覧がなく、未実施。"],"tables":[]}],"file":"02_gengo.md"},{"id":"shogun","t":"歴代将軍（征夷大将軍）","g":"人物と年代","meta":["- 出典URL： https://ja.wikipedia.org/wiki/征夷大将軍","- 記事名： 「征夷大将軍」（Wikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提（同記事の明記）： 同記事の一覧は「源頼朝より前については、蝦夷征討使の長官にして、征夷大将軍に準じる性質のものを全て採録」したもの。古例の場合、「大使」は「大将軍」と同義であるとされる。備考欄の官位は、将軍補任時と解任時、および没後の贈官位。同記事の一覧には名前の読みが付さ 。","Wikipedia"],["―","藤原小黒麻呂","ふじわら の おぐろまろ","宝亀11年9月23日（780年10月25日） - 天応元年8月（781年9月）","持節征東大使。参議正四位下兼右衛士督。","Wikipedia"],["―","大伴家持","おおとも の やかもち","延暦3年2月24日（784年3月19日） - 延暦4年8月28日（785年10月5日）","持節征東将軍。中納言従三位兼春宮大夫陸奥按察使。","Wikipedia"],["―","紀古佐美","き の こさみ","延暦7年7月6日（788年8月11日） - 延暦8年9月8日（789年10月1日）","征東大将軍（『公卿補任』は征夷大将軍に作る）。参議左大弁正四位下兼春宮大夫。","Wikipedia"],["―","大伴弟麻呂","おおとも の おとまろ","延暦10年7月13日（791年8月17日） - 延暦14年1月29日（795年2月23日）","初め征東大使、延暦13年（794年）征夷大将軍として初見。従四位下 → 従三位・勲二等。","Wikipedia"],["―","坂上田村麻呂","さかのうえ の たむらまろ","延暦16年11月5日（797年11月27日） - 延暦20年10月28日（801年12月7日）／還任：延暦23年1月28日（804年3月13日） - 大同5年9月10日？（810年10月11日？）","陸奥出羽按察使従四位下兼陸奥守 → 大納言正三位。贈従二位。","Wikipedia"],["―","文室綿麻呂","ふんや の わたまろ","弘仁2年4月17日（811年5月12日） - ―／還任：弘仁4年5月30日（813年7月1日） - 弘仁7年（816年）","征夷将軍。参議正四位上大蔵卿兼陸奥出羽按察使 → 参議従三位。","Wikipedia"],["―","藤原忠文","ふじわら の ただぶみ","天慶3年1月19日（940年2月29日） - 天慶3年5月15日（940年6月23日）","征東大将軍。参議正四位下修理大夫兼右衛門督。平将門討伐のためで、蝦夷征討を目的としたものではなかった（同記事の注釈）。","Wikipedia"],["―","源義仲（木曾義仲）","みなもと の よしなか","寿永3年1月10日（1184年2月23日） - 寿永3年1月20日（1184年3月4日）","征東大将軍。従四位下伊予守。","Wikipedia"]]}]},{"h":"建武政権・南朝","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","任期（補任 - 解任）","備考","出典の種別"],"rows":[["建武","護良親王","もりよししんのう、もりながしんのう","元弘3年6月13日（1333年7月25日） - 元弘3年9月（1333年10月）","宮将軍、後醍醐天皇の皇子。二品兵部卿。","Wikipedia"],["建武","成良親王","なりよししんのう、なりながしんのう","建武2年8月1日（1335年8月19日） - 建武3年2月（1336年3月）","宮将軍、後醍醐天皇の皇子。上野太守四品。","Wikipedia"],["建武","足利尊氏","あしかが たかうじ","建武2年8月9日（1335年8月27日） - 建武2年11月26日？（1336年1月9日？）","征東将軍。中先代の乱討伐に伴う東下を追認する形で補任される。","Wikipedia"],["南朝","興良親王","おきよししんのう、おきなが","延元4年（1339年） - ―","宮将軍、護良親王の王子。二品兵部卿？","Wikipedia"],["南朝","宗良親王","むねよししんのう、むねながしんのう","正平7年閏2月6日（1352年3月22日） - ―","宮将軍（征東将軍の説あり）、後醍醐天皇の皇子。一品式部卿。","Wikipedia"],["南朝","（尹良親王）","ゆきよししんのう、これなが、ただなが","元中3年8月8日？（1386年9月2日？） - ―","宮将軍、宗良親王の王子という。同時代史料に見えないため、実在が疑問視されている。","Wikipedia"]]}]},{"h":"贈征夷大将軍","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","任期","備考","出典の種別"],"rows":[["―","徳川綱重","とくがわ つなしげ","宝永7年8月23日（1710年9月16日）追贈","没後に征夷大将軍を追贈された人物。甲斐甲府藩主、江戸幕府6代徳川家宣の父。参議正三位、贈権中納言従三位、のち贈太政大臣正一位。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： Wikipedia「征夷大将軍」（取得日2026-11-18）。以下は同記事の記述の転記。"],"tables":[]},{"h":"数え方","lv":3,"text":["- 鎌倉は9代（源氏3代・摂家2代・宮将軍4代）。室町は15代で、足利尊氏と足利義材（義稙）の還任は別代として数えない。江戸は15代。","- 建武政権の護良親王・成良親王、南朝の興良親王・宗良親王・尹良親王は、室町幕府の代数には含まれない（同記事の一覧の区分による）。"],"tables":[]},{"h":"源頼朝の補任をめぐる諸説","lv":3,"text":["- 通説では頼朝が「大将軍」の称号を望み、朝廷が征夷大将軍を吉例として任じた（建久3年、1192年）とされる。","- 近年明らかになった新史料（『三槐荒涼抜書要』所収『山槐記』建久3年7月9日条・12日条）によれば、頼朝は「前右府」の号に代わる「大将軍」を望んだが、「征夷大将軍」を直接望んではいなかった。朝廷で「惣官」「征東大将軍」「征夷大将軍」「上将軍」の4候補が検討され、坂上田村麻呂の任官した「征夷大将軍」が吉例として選ばれた。他の候補は、平宗盛の「惣官」や義仲の「征東大将軍」は凶例、「上将軍」は日本では先例がないとして斥けられた。","- 頼朝の建久5年（1194年）解任（辞官）については説が分かれる： 文書形式の変化から辞官の意思表示と解釈する説がある一方、高橋富雄は辞任否定説を取る。石井良助は『尊卑分脈』の「辞将軍」の記述から実際に辞任したとの説を取る。受理されたか否かも論争がある。"],"tables":[]},{"h":"足利義昭の将軍職","lv":3,"text":["- 義昭は京都から追放された後も、朝廷が積極的に解官しなかったため、豊臣政権の初めに辞官するまで（天正16年1月13日）将軍職だった。将軍職は足利家の家職と認識されていたとする見方もある。"],"tables":[]},{"h":"豊臣秀吉","lv":3,"text":["- 豊臣秀吉は天下人となりながら征夷大将軍になることはなかった。秀吉も就任を目指していたとする説（林羅山『豊臣秀吉譜』の、足利義昭の養子になろうとして失敗したとする逸話）があるが、徳川幕府称賛のための捏造という指摘もある。また、秀吉は朝廷から公卿就任時に征夷大将軍の兼任を勧められていたと記載する史料もある。"],"tables":[]},{"h":"その他","lv":3,"text":["- 征夷大将軍職は慶応3年（1867年）の王政復古の大号令で廃止された。","- 「源氏でなければ将軍になれない」という源氏将軍説があるが、実際には摂家将軍や皇族将軍の例があり、清和源氏以外に藤原氏や皇族、後嵯峨源氏も就任している（同記事）。"],"tables":[]},{"h":"取得不可・未実施の報告","lv":2,"text":["- 同記事の一覧には将軍名の読みが付されていないため、読み欄は全て「―」とした。読みの転記は未実施（別の出典で確認する場合は出典を分けて併記する）。"],"tables":[]}],"file":"03_shogun.md"},{"id":"shikken","t":"歴代執権・連署（鎌倉幕府）","g":"人物と年代","meta":["- 出典URL： https://ja.wikipedia.org/wiki/執権 ／ https://ja.wikipedia.org/wiki/連署","- 記事名： 「執権」「連署」（Wikipedia日本語版）。執権の一覧は「執権」記事内の「鎌倉幕府の執権一覧」からの抜粋節、連署の一覧は「連署」記事内の「鎌倉幕府の連署一覧」による。","- 取得日： 2026-11-18","- 表の前提： 執権（しっけん）は鎌倉幕府の職名で、鎌倉殿を助け政務を統轄した。連署（れんしょ）は執権の補佐役で、実質上の「副執権」ともいえる重職。連署一覧の日付は旧暦（同記事の明記）。執権表には数値の列（78・62・60…）があるが、取得した本文では列名が判読できなかったため転記していない。"],"secs":[{"h":"執権","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","任期（在職）","備考","出典の種別"],"rows":[["1","北条時政","ほうじょう ときまさ","建仁3年（1203年）9月 - 元久2年（1205年）閏7月／1年","従五位下 遠江守。北条氏。", ょう ときむね","文永元年（1264年）8月11日 - 文永5年（1268年）3月5日","得宗。のち執権。","Wikipedia"],["5","北条政村（再任）","ほうじょう まさむら","文永5年（1268年）3月5日 - 文永10年（1273年）5月27日","執権を務めた後の再任。","Wikipedia"],["6","北条義政","ほうじょう よしまさ","文永10年（1273年）6月17日 - 建治3年（1277年）4月4日","極楽寺流、塩田流祖。","Wikipedia"],["7","北条業時","ほうじょう なりとき","弘安6年（1283年）4月16日 - 弘安10年（1287年）6月18日","極楽寺流、普恩寺流祖。","Wikipedia"],["8","大仏宣時","おさらぎ のぶとき（北条宣時：ほうじょう のぶとき。「大仏」＝おさらぎは「大仏流北条氏」の記事冒頭による）","弘安10年（1287年）8月19日 - 正安3年（1301年）8月23日","大仏流。","Wikipedia"],["9","北条時村","ほうじょう ときむら","正安3年（1301年）8月23日 - 嘉元3年（1305年）4月23日","政村流。嘉元の乱で討たれる。","Wikipedia"],["10","大仏宗宣","おさらぎ むねのぶ（北条宗宣：ほうじょう むねのぶ。「大仏」＝おさらぎは「大仏流北条氏」の記事冒頭による）","嘉元3年（1305年）7月22日 - 応長元年（1311年）10月3日","大仏流。のち執権。","Wikipedia"],["11","北条煕時","ほうじょう ひろとき","応長元年（1311年）10月3日 - 正和元年（1312年）6月2日","政村流。のち執権。","Wikipedia"],["12","金沢貞顕","かねさわ さだあき（北条貞顕：ほうじょう さだあき。「金沢」は「金沢流北条氏」の記事冒頭の読み。地名・金沢文庫は「かなざわ」で、読みが食い違う）","正和4年（1315年）7月12日 - 嘉暦元年（1326年）3月16日","金沢流。のち執権。","Wikipedia"],["13","北条維貞","ほうじょう これさだ","嘉暦元年（1326年）4月24日 - 嘉暦2年（1327年）9月7日","大仏流。","Wikipedia"],["14","北条茂時","ほうじょう しげとき、もちとき","元徳2年（1330年）7月9日 - 元弘3年（1333年）5月22日","政村流。鎌倉幕府滅亡。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： Wikipedia「執権」「連署」（取得日2026-11-18）。以下は両記事の記述の転記。"],"tables":[]},{"h":"執権の始まり","lv":3,"text":["- いわゆる初代の執権は、1203年（建仁3年）に北条時政が3代将軍源実朝を擁立した際に政所別当とともに任じられたのが最初とされている。","- 異説として、初代政所別当である大江広元を初代執権とする説もあるが少数説である。また、北条泰時の時代に初めて登場したとする説もある（時政・義時を執権としたのは『吾妻鏡』の遡及的な記述に由来とする説）。"],"tables":[]},{"h":"連署の設置と初代の就任日","lv":3,"text":["- 『吾妻鏡』には、貞応3年（1224年）の北条義時の死去直後、北条政子の発案によって設置されたと記されており、長らく信じられてきた。","- しかし上横手雅敬によって、連署の設置は政子の死後に行われたことが論証された。『明月記』によると貞応3年7月13日の時点で時房は在京しており、嘉禄元年（1225年）6月15日まで六波羅探題として在京していた。その間の関東下知状は泰時の単独署判であり、時房の連署就任は実際には嘉禄元年6月以降と考えられる。","- 一方、石井清文は上横手説には時房の鎌倉滞在時期についての誤りがあるとして、やはり政子の発案であったと考えるべきであるとする見解を示している。森幸夫は市河文書の書状を根拠に上横手説を支持している。","- 発足当初は「連署」という職名は存在せず、初代の時房も「執権」として扱われており、「両執権体制」が敷かれていた。名目上は対等だったが、実質的には泰時の権限の方が優越していたという。"],"tables":[]},{"h":"その他","lv":3,"text":["- 執権の多くは相模守に任官され、武蔵守に任官された連署と共に「両国司」（『沙汰未練書』）と呼ばれた。","- 得宗への権力移動： 5代執権時頼が執権の座を6代長時に譲り出家した後も幕府内の権力を保持し続けたことが端緒となり、以降は得宗と執権が分離し、実際の権力は得宗が持つようになった。","- 最後の執権とされる北条貞将は、執権表で「17?」と疑問符つきで示されている。"],"tables":[]},{"h":"取得不可・未実施の報告","lv":2,"text":["- 連署の一覧（「連署」記事）には名前の読みが付されていないため、連署表の読み欄は「―」とした。","- 執権表の数値の列（78・62・60…）は、取得した本文では列名が判読できなかったため転記していない。"],"tables":[]}],"file":"04_shikken_rensho.md"},{"id":"souri","t":"歴代内閣総理大臣","g":"人物と年代","meta":["- 出典URL： https://ja.wikipedia.org/wiki/内閣総理大臣の一覧","- 記事名： 「内閣総理大臣の一覧」（Wikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提： リスト5（ファイル05）のデータを、代数・氏名・読み・就任日・退任日・内閣名の形式に並べ替えたもの。データ自体はリスト5と同一で、新たな取得はしていない。内閣名はリスト5の備考欄の冒頭の名称をそのまま移した。在任日数は備考に残した。臨時代理・臨時兼任の行は代数を「―」とし、内閣名は所属した内閣（臨時代理等を行った内閣）を記す。首相官邸「歴代内閣」は表として直接取得できなかったため、リスト5と同じく本文には使っていない。"],"secs":[{"h":"明治時代","lv":2,"text":[],"tables":[{"cols":["代","氏名","読み","就任日","退任日","内閣名","備考","出典の種別"],"rows":[["1","伊藤博文","いとう ひろぶみ","1885年12月22日","1888年4月30日","第1次伊藤内閣","在任861日。藩閥政権、長州藩、枢密院議長就任のため辞任。","Wikipedia"],["2","黒田清隆","くろだ きよたか","1888年4月30日","1889年10月25日","黒田内閣","在任544日。藩閥政権、薩摩藩、条約改正交渉反対運動で辞任。","Wikipedia"],["―","三条実美","さんじょう さねとみ","1889年10月25日","1889年12月24日","三条暫定内閣","在任(61日)。藩閥政権、公家、内閣総理大臣兼任（内大臣）。現在の政府解釈では代数に含まれない（同記事の注釈）。","Wikipedia"],["3","山県有朋","やまがた ありとも","1889年12月24日","1891年5月6日","第1次山県内閣","在任499日。藩閥政権、長州藩、第1回帝国議会会期終了後に辞任。","Wikipedia"],["4","松方正義","まつかた まさよし","1891年5月6日","1892年8月8日","第1次松方内閣","在任461日。藩閥政権、薩摩藩、選挙干渉追及により辞任。","Wikipedia"],["5","伊藤博文","いとう ひろぶみ","1892年8月8日","1896年8月31日","第2次伊藤内閣","在任1485日（通算2346日）。藩閥政権（自由党協力）、長州藩、閣内不一致により辞任。","Wikipedia"],["―","黒田清隆","くろだ きよたか","1896年8月31日","1896年9月18日","第2次伊藤内閣","在任(19日)。内閣総理大臣臨時兼任（枢密院議長）。","Wikipedia"],["6","松方正義","まつかた まさよし","1896年9月18日","1898年1月12日","第2次松方内閣","在任482日（通算943日）。藩閥政権（進歩党協力）、薩摩藩、地租増徴で対立し辞任。","Wikipedia"],["7","伊藤博文","いとう ひろぶみ","1898年1月12日","1898年6月30日","第3次伊藤内閣","在任170日（通算2516日）。藩閥政権、長州藩、新党結成に関する元老間の不一致により辞任。","Wikipedia"],["8","大隈重信","おおくま しげのぶ","1898年6月30日","1898年11月8日","第1次大隈内閣","在任132日。憲政党政権、憲政党総裁、史上初の政党内閣、憲政党と憲政本党分裂により辞任。","Wikipedia"],["9","山県有朋","やまがた ありとも","1898年11月8日","1900年10月19日","第2次山県内閣"," ,"かん なおと","2010年6月8日","2011年9月2日","菅内閣","在任452日。民国連立政権、民主党代表。","Wikipedia"],["95","野田佳彦","のだ よしひこ","2011年9月2日","2012年12月26日","野田内閣","在任482日。衆院選敗北により辞任。","Wikipedia"],["96","安倍晋三","あべ しんぞう","2012年12月26日","2014年12月24日","第2次安倍内閣","在任729日（通算1095日）。自公連立政権。","Wikipedia"],["97","安倍晋三","あべ しんぞう","2014年12月24日","2017年11月1日","第3次安倍内閣","在任1044日（通算2138日）。","Wikipedia"],["98","安倍晋三","あべ しんぞう","2017年11月1日","2020年9月16日","第4次安倍内閣","在任1051日（通算3188日）。病気のため辞任。","Wikipedia"]]}]},{"h":"令和時代","lv":2,"text":[],"tables":[{"cols":["代","氏名","読み","就任日","退任日","内閣名","備考","出典の種別"],"rows":[["99","菅義偉","すが よしひで","2020年9月16日","2021年10月4日","菅内閣","在任384日。総裁任期満了により退任。","Wikipedia"],["100","岸田文雄","きしだ ふみお","2021年10月4日","2021年11月10日","第1次岸田内閣","在任38日。自公連立政権。","Wikipedia"],["101","岸田文雄","きしだ ふみお","2021年11月10日","2024年10月1日","第2次岸田内閣","在任1057日（通算1094日）。総裁任期満了により退任。","Wikipedia"],["102","石破茂","いしば しげる","2024年10月1日","2024年11月11日","第1次石破内閣","在任42日。自公連立政権。","Wikipedia"],["103","石破茂","いしば しげる","2024年11月11日","2025年10月21日","第2次石破内閣","在任345日（通算386日）。衆院選・参院選敗北により辞任。","Wikipedia"],["104","高市早苗","たかいち さなえ","2025年10月21日","2026年2月18日","第1次高市内閣","在任121日。自維連立政権、史上初の女性首相。","Wikipedia"],["105","高市早苗","たかいち さなえ","2026年2月18日","在任中","第2次高市内閣","自維連立政権、現職。通算393日は同記事の数値。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： リスト5（Wikipedia「内閣総理大臣の一覧」、取得日2026-11-18）の注記をそのまま引き継ぐ。","- 「代」は内閣の代数で、第105代まで。別人としての人数は66人。","- 臨時代理・臨時兼任（三条実美、黒田清隆、西園寺公望、内田康哉、若槻禮次郎、幣原喜重郎、高橋是清、後藤文夫、伊東正義、青木幹雄）は代数に数えない。三条実美については「現在の政府解釈では代数に含まれない」と同記事の注釈にある。","- 同記事内の表記の食い違い： 高橋是清の生年が、同記事内で「1854年」（第20代の行）と「1855年」（犬養内閣の臨時兼任の行）の両表記になっている。","- 現職は高市早苗（第105代、第2次高市内閣、2026年2月18日就任、在任中）。史上初めての女性の内閣総理大臣。","- 最長は安倍晋三の通算3188日（第98代終了時点）。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- 首相官邸「歴代内閣」は表として直接取得できなかったため取得不可（リスト5と同じ）。本文には使用していない。"],"tables":[]}],"file":"05_souri.md"},{"id":"kansei","t":"官制：二官八省・太政官・内閣","g":"官制","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/日本の官制","- https://ja.wikipedia.org/wiki/太政官","- https://ja.wikipedia.org/wiki/太政官_(明治時代)","- https://ja.wikipedia.org/wiki/内閣官制","- 記事名： 「日本の官制」「太政官」「太政官 (明治時代)」「内閣官制」（いずれもWikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提： 中央官制は二官八省を基本とする体制で、天皇の下に祭祀を担当する神祇官と国政を統括する太政官が置かれ（二官）、太政官の下に行政を分担する八省が置かれた。二官八省の他にも、行政組織を監察する弾正台や宮中を守る衛府が天皇の直轄として置かれた（まとめて二官八省一台五衛府）。諸官司には一般に長官（かみ）・次官（すけ）・判官（じょう）・主典（さかん）の四等官が置かれた（以上「日本の官制」）。八省の読みは取得した記事本文に示されていないため「―」とした。"],"secs":[{"h":"第1部 律令制の二官八省","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間","備考","出典の種別"],"rows":[["二官1","神祇官","―","律令制期（大宝律令701年で制度化）","神祇祭祀を司る。四等官は伯（長官）、大副・少副、大祐・少祐、大史・少史。","Wikipedia"],["二官2","太政官","だいじょうかん（だじょうかん／おおいまつりごとのつかさ）","645年設立、701年の大宝律令施行で正式に制度化、1868年1月3日解散","国政一般を司る。司法・行政・立法を司った。太政大臣・左大臣・右大臣と大納言などの合議体による議政官組織と、その下の少納言局・左右弁官局からなる。後に内大臣・中納言・参議が置かれた。唐名は尚書省・都省。天平宝字2年（758年）から同8年（764年）まで乾政官（けんせいかん）と改称されていた時期がある。","Wikipedia"]]}]},{"h":"太政官の構成（四等官）","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","期間","備考","出典の種別"],"rows":[["―","太政大臣","だいじょうだいじん","律令制期","長官（かみ）。正一位・従一位。常設の地位ではなく、則闕の官とも呼ばれた。","Wikipedia"],["―","左大臣","―","律令制期","長官。正二位・従二位。事実上の行政最高責任者。","Wikipedia"],["―","右大臣","―","律令制期","長官。正二位・従二位。左大臣の補佐を行う。","Wikipedia"],["―","内大臣","―","律令制期","長官。正二位・従二位。大宝律令以前からの内臣の後身。平安時代に令外官として常制化する。","Wikipedia"],["―","知太政官事","―","律令制期","令外官の一つ。正式な太政大臣を任命できない時に設置された。任命例は4度しかなく全て飛鳥時代・奈良時代のもので、皇族以外への任命例はない。","Wikipedia"],["―","大納言","―","律令制期","次官（すけ）。正三位。","Wikipedia"],["―","中納言","―","律令制期","次官。従三位。大宝律令では廃止され、令外官として復活する（大宝令成立時に廃止されたが4年後に復置）。","Wikipedia"],["―","参議","―","律令制期","次官。令外官。一時観察使に改編されるが復活。","Wikipedia"],["―","左大弁・左中弁・左少弁","―","律令制期","判官（じょう）。左弁官局を司る。下に四省（中務省・式部省・治部省・民部省）を持つ。官位相当は左大弁が従四位上、左中弁が正五位上、左少弁が正五位下。","Wikipedia"],["―","右大弁・右中弁・右少弁","―","律令制期","判官。右弁官局を司る。下に四省（兵部省・刑部省・大蔵省・宮内省）を持つ。","Wikipedia"],["―","少納言","―","律令制期","判官。少納言局を司る。従五位下。少納言局は太政官の事務・秘書部局で、少納言・大外記・少外記・史生・使部からなる。","Wikipedia"],["―","左大史・左少史／右大史・右少史","―","律令制期","主典（さかん）。各弁官局に属して事務を行う。","Wikipedia"],["―","大外記・少外記","―","律令制期","主典。少納言局に属して書記を行う。","Wikipedia"],["―","巡察使","―","律令制期","臨時に諸国を監察する。","Wikipedia"]]}]},{"h":"八省","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","期間","備考","出典の種別"],"rows":[["八省1","中務省","―","律令制期","左弁官局の管轄。天皇に侍従し、詔勅の作成・宣旨、伝奏などの宮中事務や位記・戸籍などの事務を掌る。下部機関に中宮職・図書寮・内蔵寮・縫殿寮・陰陽寮など。","Wikipedia"],["八省2","式部省","―","律令制期","左弁官局の管轄。文官の人事や朝儀・学校などを掌る。758年から764年の間のみ文部省に改名。下部機関に大学寮など。","Wikipedia"],["八省3","治部省","―","律令制期","左弁官局の管轄。諸氏の族姓や葬事・仏寺・雅楽・外交事務を掌る。下部機関に雅楽寮・玄蕃寮など。","Wikipedia"],["八省4","民部省","―","律令制期","左弁官局の管轄。民政特に租税・財政を掌る。戸籍・田畑を司る。下部機関に主計寮・主税寮など。","Wikipedia"],["八省5","兵部省","―","律令制期","右弁官局の管轄。武官の人事と軍事全般を掌る。","Wikipedia"],["八省6","刑部省","―","律令制期","右弁官局の管轄。司法を掌る。良賤の訴などを司る。","Wikipedia"],["八省7","大蔵省","―","律令制期","右弁官局の管轄。財宝・出納・物価・度量衡などを掌る。","Wikipedia"],["八省8","宮内省","―","律令制期","右弁官局の管轄。宮中の衣食住・財物その他の諸事を掌る。下部機関に大膳職・木工寮・大炊寮・主殿寮・典薬寮・掃部寮など。","Wikipedia"],["―","弾正台","―","律令制期","二官八省とは別に天皇直轄。行政監察を掌る。四等官は尹・弼・大忠少忠・大疏少疏。","Wikipedia"],["―","五衛府","―","律令制期","天皇直轄。左兵衛府・右兵衛府、左衛士府・右衛士府（のち衛門府を併合して左右衛門府）、衛門府。後に左近衛府・右近衛府が新設された。","Wikipedia"]]}]},{"h":"四等官の型（同記事の表より）","lv":3,"text":[],"tables":[{"cols":["官司","長官（かみ）","次官（すけ）","判官（じょう）","主典（さかん）","出典の種別"],"rows":[["神祇官","伯","大副・少副","大祐・少祐","大史・少史","Wikipedia"],["太政官","（太政大臣）・左大臣・右大臣","大納言・中納言・参議","少納言・左大弁・左中弁・左少弁・右大弁・右中弁・右少弁","大外記・少外記・左大史・左少史・右大史・右少史","Wikipedia"],["省","卿","大輔・少輔","大丞・少丞","大録・少録","Wikipedia"],["職","大夫","亮","大進・少進","大属・少属","Wikipedia"],["寮","頭","助","允・大允・少允","属・大属・少属","Wikipedia"],["司","正","―","佑","令史・大令史・少令史","Wikipedia"],["弾正台","尹","弼","大忠・少忠","大疏・少疏","Wikipedia"]]}]},{"h":"第2部 太政官制の変遷（律令制から明治の太政官制、内閣へ）","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間・年月日","備考","出典の種別"],"rows":[["1","太政官の設立","―","645年7月12日（皇極天皇4年6月14日）","大化の改新に設立（「太政官」記事の組織概要）。","Wikipedia"],["2","大宝律令による制度化","―","701年","大宝律令施行で正式に制度化。太政官は八省の上に位置付けられ最高機関とされた。","Wikipedia"],["3","乾政官への改称","けんせいかん","天平宝字2年（758年） - 同8年（764年）","官職の唐風改称による一時的な改称。","Wikipedia"],["4","王政復古の大号令と三職","―","慶応3年12月9日（1868年1月3日）","摂関・幕府の廃絶と太政官の漸次再興を宣言。総裁（有栖川宮熾仁親王）、議定（10名）、参与（20名）の三職を設置。律令制の太政官は同日に解散し、明治の太政官へ継承された。","Wikipedia"],["5","三職七科・三職八局","―","慶応4年1月17日（1868年2月10日）・2月3日","神祇・内国・外国・海陸軍・会計・刑法・制度の7事務科を設置。後に科を局として総裁局を設置し三職八局とした。","Wikipedia"],["6","政体書による太政官","―","慶応4年閏4月21日（1868年6月11日）公布","政体書に基づく官制改革で成立。当初は議政官以下7官の総称。立法・行政・司法の三権を太政官に帰し、内部で分立させた。立法の議政官、行政の行政官・神祇官・会計官・軍務官・外国官、司法の刑法官からなる。","Wikipedia"],["7","職員令による二官六省制","―","明治2年7月8日（1869年8月15日）","政体書体制を廃止し「祭政一致」を原則とした復古的な官制。神祇官は太政官から独立し、かつ太政官よりも上位とされた。太政官の下に民部省・大蔵省・兵部省・刑部省・宮内省・外務省の6省。太政官には左右両大臣と大納言・参議が置かれた。","Wikipedia"],["8","太政大臣の設置と廃藩置県後の改革","―","明治4年7月27日（1871年9月11日）","長官として太政大臣が置かれた（三条実美）。廃藩置県と前後して司法省・文部省が設置され、正院（中央政府）・左院（諮問機関）・右院（調整機関）が置かれ、神祇官は神祇省に格下げされた。","Wikipedia"],["9","内務省の設立","―","明治6年（1873年）11月10日","大久保利通により設立され、大久保自らが初代内務卿となった。","Wikipedia"],["10","立憲政体の詔書","―","明治8年（1875年）4月14日","太政官布告第58号。行政の太政官・正院、立法の元老院・地方官会議、司法の大審院を置く三権分立制の基礎を形作った。神祇省は宮内省の所管となった。","Wikipedia"],["11","明治8年の省構成","―","明治8年（1875年） - 明治18年（1885年）","正院、元老院、地方官会議、司法省、大審院、警視庁、開拓使、外務省、内務省、大蔵省、陸軍省、海軍省、文部省、教部省、工部省、宮内省。この体制は内閣制度が発足するまで続いた。","Wikipedia"],["12","太政官の廃止・内閣へ","―","明治18年（1885年）12月22日","内閣制度樹立に伴い、明治の太政官は廃止され、内閣が継承後組織となった。","Wikipedia"]]}]},{"h":"第3部 内閣制度の変遷","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間・年月日","備考","出典の種別"],"rows":[["1","内閣職権","ないかくしょっけん","明治18年（1885年）12月22日","太政官達により内閣の組織などを定めた。内閣官制の制定により実効性を喪失した（「内閣官制」記事では明治18年太政官達第69号及び内閣職権（太政大臣公爵三条実美達）と記される）。初代内閣総理大臣は伊藤博文（リスト5参照）。","Wikipedia"],["2","内閣官制","ないかくかんせい","明治22年（1889年）12月24日公布（勅令第135号） - 1947年5月3日廃止","内閣の組織、内閣総理大臣の職権などを定めた勅令。大日本帝国憲法は「内閣」や「内閣総理大臣」について規定しなかったため、内閣は国務各大臣の協議と意思統一のための合議体とされた。内閣総理大臣は「各大臣ノ首班」＝同輩中の首席と解された。","Wikipedia"],["3","内閣官制の改正","―","明治40年（1907年）2月1日","公文式の廃止と公式令の制定に伴う改正。すべての勅令に内閣総理大臣が副署することになり、内閣総理大臣の権限を強化するものであった。","Wikipedia"],["4","内閣法の施行・内閣官制の廃止","―","昭和22年（1947年）5月3日","日本国憲法の施行と同日に内閣法（昭和22年法律第5号）が施行され、内閣官制は「内閣官制の廃止等に関する政令」（政令第4号）で廃止された。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： Wikipedia「日本の官制」「太政官」「太政官 (明治時代)」「内閣官制」（取得日2026-11-18）。以下は各記事の記述の転記。"],"tables":[]},{"h":"太政官の位置づけをめぐる見方","lv":3,"text":["- 太政官は唐の制度における門下省と尚書省の役割を統合した性格を有する。少納言局と弁官局の位置づけについては、少納言局が判官・主典、弁官局が独立した品官とする見方と、弁官局が判官・主典を構成し大納言―少納言は独自の役割であったものが大宝令によって初めて四等官に組み込まれたとする説があり、両論が併記されている。","- 中国の律令制が三省（中書省・門下省・尚書省）で皇帝を補佐する体制であるのに対し、日本では天皇と各省の間に太政官を置いたことに特徴がある。神祇官と太政官を並列した点も日本のオリジナルの律令とされる。"],"tables":[]},{"h":"太政官の読み","lv":3,"text":["- 「太政官」の読みは、律令制では「だいじょうかん、だじょうかん、おおいまつりごとのつかさ」、明治の太政官は「だじょうかん」と記事に記されている。"],"tables":[]},{"h":"中納言の扱い","lv":3,"text":["- 中納言は飛鳥浄御原令で設けられ、大宝令成立時に廃止されたが4年後に復置された。令外官として復活したと記す記事もある（両記事の記述をそのまま併記）。"],"tables":[]},{"h":"内閣職権の番号","lv":3,"text":["- 「内閣官制」記事では「明治18年太政官達第69号及び内閣職権（明治18年12月22日太政大臣公爵三条実美達）」と記されている。番号の扱いは同記事の表記のまま転記した。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- Wikipedia「二官八省」はテキスト取得に失敗したため、同内容を扱う「日本の官制」「太政官」の両記事で代替した。八省の読みは取得した記事本文に示されていないため未転記。"],"tables":[]}],"file":"06_kansei.md"},{"id":"hassho","t":"八省の読みと管轄","g":"官制","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/中務省","- https://ja.wikipedia.org/wiki/式部省","- https://ja.wikipedia.org/wiki/治部省","- https://ja.wikipedia.org/wiki/民部省","- https://ja.wikipedia.org/wiki/兵部省","- https://ja.wikipedia.org/wiki/刑部省","- https://ja.wikipedia.org/wiki/大蔵省_(律令制)","- https://ja.wikipedia.org/wiki/宮内省_(律令制)","- 記事名： 「中務省」「式部省」「治部省」「民部省」「兵部省」「刑部省」「大蔵省 (律令制)」「宮内省 (律令制)」（いずれもWikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提： リスト6（官制）で読みが「―」だった八省について、各省の個別記事から読み・和名・唐名・管轄を補ったもの。八省は太政官の下に置かれた行政機関で、各省の長官は卿（正四位下相当。中務卿のみ正四位上相当）。"],"secs":[{"h":"","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","和名・唐名","管轄（各記事より）","出典の種別"],"rows":[["1","中務省","なかつかさしょう","和名「なかのまつりごとのつかさ」。唐名は中書省など","天皇の補佐や詔勅の宣下、叙位など朝廷に関する職務全般を担ったことから、八省の中でも最重要の省とされた。長官である中務卿は他省の卿より高い正四位上相当とされ、平安時代以降はもっぱら四品以上の親王を遇する地位となった。","Wikipedia"],["2","式部省","しきぶしょう","和名「のりのつかさ」。唐名は吏部省又は吏部","文官の人事考課、礼式、及び選叙（叙位及び任官）、行賞を司り、役人養成機関である大学寮を統括するため、八省の内でも中務省に次いで重要な省とされてきた。大学寮・散位寮の2寮を管掌していた。天平宝字2年（758年）から同8年（764年）の間は、文部省（ぶんぶしょう）へ改称された。","Wikipedia"],["3","治部省","じぶしょう","和名「おさむるつかさ」。唐名は礼部","外事・戸籍（姓名関係）・儀礼全般を管轄し姓氏に関する訴訟や、結婚、戸籍関係の管理および訴訟、僧尼、仏事に対する監督、雅楽の監督、山陵の監督、および外国からの使節の接待などを職掌としていた。","Wikipedia"],["4","民部省","みんぶしょう（たみつかさ）","―","財政・租税一般を管轄し諸国の戸口、田畑、山川、道路、租税のことを司る。財政官庁として他に大蔵省があったが租税や租税関係の戸籍はこちらが取り扱ったため大蔵省よりも重視された。戸籍のうち姓氏などは治部省の管轄である。","Wikipedia"],["5","兵部省","ひょうぶしょう（つわもののつかさ）","―","内外の武官の人事考課、選叙（叙位及び任官）、諸国の衛士の管理、武器の管理など、軍事防衛関連事項の一切を司る。","Wikipedia"],["6","刑部省","ぎょうぶしょう","和名「うたへただすつかさ」。唐名は刑部、秋官、大理","主な職掌は、司法全般を管轄し重大事件の裁判・監獄の管理・刑罰を執行することである。軽罪については各官司が独自に裁判権を持ち、平安時代に検非違使が設置されて以降、ほとんどの職掌を検非違使に奪われることとなり、有名無実化した。","Wikipedia"],["7","大蔵省","おおくらしょう","和名「おおくらのつかさ」。唐名は大府、大府寺、天官、外官","朝廷の倉庫である大蔵を管轄し、朝廷の銭貨・金銀・調・貢物の出納、保管や諸国・民間の度量衡や売買価格の公定などである。ただし租税などは民部省の管轄であり国家財政官庁としての地位はさほど高くはなく、国有財産の管理や官営工房としての役割が大きかった。藤原仲麻呂による官職の唐風改称期間中の呼称は節部省。","Wikipedia"],["8","宮内省","くないしょう（みやうちのつかさ）","唐名は工部省、冬官、司農寺、殿中省","八省のうち中務省は宮中の政治に関する事務、宮内省は政事に関係のない宮中の庶務を扱った。宮廷の修繕や食事、掃除、医療などの庶務一切を務め、天皇の財産を管理した。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： 上記の各記事（取得日2026-11-18）。","- 神祇官は二官の一つであり、八省には含まれない（リスト6参照）。","- 民部省について： 「かきべのつかさ」と読んだ例もあるが「かきべ」は律令制以前の豪族の私有民で「民部」と書くが「民部省」の「民部」とは意味が異なる（「民部省」の脚注）。","- 刑部省について： 「刑部」を「おさかべ」と読むのは「忍坂部」の当て字であり刑部省の「刑部」の意味を表した言葉ではないので「刑部省」を「おさかべのつかさ」と読むことはない（「刑部省」の注釈）。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- なし。"],"tables":[]}],"file":"17_B5_hassho.md"},{"id":"ryogai","t":"令外官","g":"官制","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/令外官","- https://ja.wikipedia.org/wiki/摂政","- https://ja.wikipedia.org/wiki/関白","- https://ja.wikipedia.org/wiki/内覧","- https://ja.wikipedia.org/wiki/検非違使","- https://ja.wikipedia.org/wiki/勘解由使","- https://ja.wikipedia.org/wiki/蔵人","- リスト6（官制）で使用した「太政官」「日本の官制」の各記事","- 記事名： 「令外官」「摂政」「関白」「内覧」「検非違使」「勘解由使」「蔵人」（いずれもWikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提： 令外官（りょうげのかん）とは、律令の令制に規定のない新設の官職。令外官が管掌する官司を令外官司（りょうげのかんし）と称する場合もある。現実的な政治課題に対して、既存の律令制・官制にとらわれず、柔軟かつ即応的な対応を行うために置かれた。日本では8世紀末の桓武期の改革の際に多くの令外官が置かれ、その後も現実に対応するため、いくつかの令外官が設置されていった（「令外官」）。設置年は各記事の記述による。日付は新暦（旧暦）の順で併記する。"],"secs":[{"h":"","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","設置年","概要","出典の種別"],"rows":[["1","摂政","せっしょう","人臣摂政の初例は866年（貞観8年）","君主が幼少、女性、病弱である等の理由で政務を執り行うことが不可能な場合に、君主に代わって政務を摂る役職。もともと「摂政」は普通名詞で律令に官職として設けられなかったが、藤原良房・基経の後に「天皇に代わって政務を執る者の職である令外の官」として定義されることとなった。人臣で初めて摂政となったのは藤原良房（866年）。皇族の摂政は『日本書紀』で推古天皇の時の厩戸皇子（聖徳太子）が最初とされる。1868年1月3日（慶応3年12月9日）の王政復古で人臣摂政は廃止された。","Wikipedia"],["2","関白","かんぱく","884年ごろ（諸説あり。注記参照）","前近代の朝廷において、成人の天皇を補佐する官職。令外官。摂政とともに臣下が就きうる最高の職位であった。太政官からの意見を天皇に奏上する権限を持ち、その権限は「内覧」とも呼ばれた。初任者は藤原基経。幼少の天皇には摂政、成人後の天皇には関白が置かれる慣例が確立したのは藤原忠平が初例とされる。1868年1月3日（慶応3年12月9日）の王政復古の大号令で摂政・征夷大将軍とともに廃止された。","Wikipedia"],["3","内覧","ないらん","897年（寛平9年）","天皇に奏上する文書や、天皇が裁可する文書一切を前もって読み、政務を補佐する権限、またその権限を与えられた者の職掌や地位。関白の権限の一部で、関白と異なり官職化せず、天皇の私的諮詢機関的性格を持っていた。始まりは寛平9年（897年）に宇多天皇が醍醐天皇に譲位した際の詔書で、大納言藤原時平と権大納言菅原道真が任じられたこと。単独の内覧の初見は天禄3年（972年）の藤原兼通。","Wikipedia"],["4","検非違使","けびいし（けんびいし）","816年ごろ／824年（食い違い。注記参照）","律令制下の令外官の役人。「（不法・違法など）非違を検察する（天皇の）使者」の意で、略して「非違」ともいう。京都の治安維持と民政を所管した。衛門府の組織を利用して創設され、衛門府の武官（中央官人）が宣旨によって兼務し軍事・警察を担った。官位相当はない。内部官職として別当（長官に相当）、佐、大尉、少尉、大志・少志などがあった。平安時代後期には令制国にも置かれるようになった。","Wikipedia"],["5","勘解由使","かげゆし","797年（延暦16年）ころ","律令制下の令外官の一つ。平安時代初期、地方行政を監査するために設置された。和名は「とくるよしかんがふるのつかさ」。唐名は「勾勘」。国司の任期満了時に交付される解由状の監査を行ない、国司交替時の紛争を抑制し、国司行政の品質改善を図った。806年（大同元年）に一旦廃止され観察使が代わりに設置されたが、824年（天長元年）に再置され、監査の対象は内官（京都の各官職）へと拡大した。","Wikipedia"],["6","蔵人（蔵人所）","くろうど","810年（大同5年）","律令制下の令外官の一つ。天皇の秘書的役割を果たした。唐名は侍中など。蔵人所は事務を行う場所のことで、内裏校書殿の北部に置かれた。嵯峨天皇が大同5年（810年）に藤原冬嗣と巨勢野足を蔵人頭に、清原夏野らを蔵人に任命したのがはじまり。もともと天皇家の家政機関として、書籍や御物の管理、機密文書の取り扱いや訴訟を扱った。1868年6月11日（慶応4年閏4月21日）に蔵人所は廃止された。","Wikipedia"],["7","征夷大将軍","せいいたいしょうぐん","記事に設置年の明記なし","武家政権（幕府）の長として武家の棟梁が就任したが、本来は蝦夷征討を目的とした令外官の一つであった（「令外官」）。任命の実例と任期はリスト3（征夷大将軍）を参照。","Wikipedia"],["8","中納言","ちゅうなごん","大宝律令制定直後から（復置は大宝令の4年後）","太政官の次官（すけ）。従三位。飛鳥浄御原令で設けられ、大宝律令成立時に廃止されたが4年後に復置された。令外官として復活したと記す記事もある（リスト6の注記参照）。「令外官」記事では、大宝律令の制定直後から置かれていた令外官の一つとして挙げられている。","Wikipedia"],["9","参議","さんぎ","大宝律令制定直後から","太政官の次官。令外官。一時観察使に改編されるが復活した（リスト6）。「令外官」記事では、大宝律令の制定直後から置かれていた令外官の一つとして挙げられている。","Wikipedia"],["10","内大臣","ないだいじん","平安時代に令外官として常制化","太政官の長官（かみ）。正二位・従二位。大宝律令以前からの内臣の後身。平安時代に令外官として常制化した（リスト6）。","Wikipedia"],["11","押領使","―","10世紀","地方の治安警察を担当した令外官。10世紀になり地方で富豪層が登場し、所領紛争などにより治安が悪化したため置かれた（「令外官」）。読みと設置年の詳細は同記事に明記なし。","Wikipedia"],["12","追捕使","―","10世紀","押領使とともに置かれ、地方の治安警察を担当した（「令外官」）。読みと設置年の詳細は同記事に明記なし。","Wikipedia"],["13","文章博士","―","設置年の明記なし","大学寮に令外官として設置された。儒教以外の知識に通じた官人育成の観点から置かれ、後に文章博士は大学寮の博士の首位となった（「令外官」）。","Wikipedia"],["14","明法博士","―","設置年の明記なし","大学寮に置かれた令外官として「令外官」記事の一覧に挙げられている。","Wikipedia"],["15","鎮守府将軍","―","設置年の明記なし","「令外官」記事の「主な令外官の一覧」に挙げられている。読み・設置年・概要は同記事に記載なし（未取得）。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： 上記の各記事（取得日2026-11-18）。"],"tables":[]},{"h":"関白の設置年（諸説）","lv":3,"text":["- 『公卿補任』では、藤原基経が元慶4年11月8日（880年12月13日）に摂政から転じて関白になったとする。この記述をそのまま採用する書籍は多いが、当該期日に関白就任に関する記事が正史『日本三代実録』に全く見られないこと、この日に転任する理由がないことから、後に藤原忠平が摂政から関白に転じた天慶4年11月8日（941年11月29日）との日付の取り違えが起こったものと思われ、この日に転任した可能性は低いとする説がある。","- 元慶8年6月5日（884年7月1日）、光孝天皇は基経に対して国政に対する権限を与える詔を出した。この詔には「関白」の語自体は用いられていないが、後の関白の職掌である天皇に太政官の決定を奏上することが書かれており、竹内理三以来平安時代史の研究家の間では、実質的な関白の始まりとして支持が多い説である。","- 「関白」の語源である「関り白す」の言が入った詔書の初例は、宇多天皇の即位後の仁和3年11月21日（887年12月9日）の国政委任の詔書である。","- 関白の任務が摂政とはっきり別れた時期についても、忠平の時代（竹内理三・橋本義彦）、宇多天皇の時代（坂上康俊）、光孝天皇の時代（瀧浪貞子）などの諸説がある。"],"tables":[]},{"h":"検非違使の設置年（食い違い）","lv":3,"text":["- 「令外官」記事： 嵯峨天皇が「824年に検非違使を置いた」とある。","- 「検非違使」記事： 「平安時代の弘仁7年（816年）が初見で、その頃に設置されたと考えられている」とある。","- 両記事の記述が異なるため、どちらとも決めず併記した。"],"tables":[]},{"h":"その他","lv":3,"text":["- 摂政について： 「摂政」という語はもともと「政務を摂る」という意の普通名詞であり、律令制度が導入されても\"摂政\"という官職は設けられなかった。人臣摂政の職能の由来については、太政大臣の職能から派生したとする説と天皇の職能から派生したとする説が対立している（「摂政」）。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- なし。鎮守府将軍は「令外官」記事の一覧に名称のみがあり、個別の記述は同記事にないため「未取得」とした。"],"tables":[]}],"file":"13_B1_ryogenokan.md"},{"id":"edo","t":"江戸幕府の職制","g":"官制","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/江戸幕府","- https://ja.wikipedia.org/wiki/老中","- https://ja.wikipedia.org/wiki/若年寄","- https://ja.wikipedia.org/wiki/大老","- https://ja.wikipedia.org/wiki/側用人","- https://ja.wikipedia.org/wiki/京都所司代","- https://ja.wikipedia.org/wiki/大坂城代","- https://ja.wikipedia.org/wiki/寺社奉行","- https://ja.wikipedia.org/wiki/奏者番","- https://ja.wikipedia.org/wiki/大目付","- https://ja.wikipedia.org/wiki/町奉行","- https://ja.wikipedia.org/wiki/勘定奉行","- 記事名： 「江戸幕府」「老中」「若年寄」「大老」「側用人」「京都所司代」「大坂城代」「寺社奉行」「奏者番」「大目付」「町奉行」「勘定奉行」（いずれもWikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提： 江戸幕府では権力の集中を避けるため主要な役職は複数名が配置され、一か月交代で政務を担当する月番制を導入し、重要な決定は合議を原則とした（「江戸幕府」）。「幕閣」と呼ばれたのは大老・大老格と老中・老中格で、側用人・御側御用取次は時代や個人によって権限に大きな差があった（同）。寺社奉行・町奉行・勘定奉行を三奉行といい、評定所を構成した。"],"secs":[{"h":"","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","役割","出典の種別"],"rows":[["1","大老","たいろう","江戸幕府の職制で、臨時に将軍の補佐役として置かれた最高職。原則的に毎日登城し、大政全般に関与するが、月番や評定所への出座、奉書加判は免除されていた。成立には諸説がある（注記参照）。","Wikipedia"],["2","老中","ろうじゅう","江戸幕府に常設された最高職。2万5000石以上の譜代大名から任用され、複数名が月番制で政務を執ったが、筆頭者（老中首座）は事実上の執政として幕政を主導した。大目付・町奉行・遠国奉行・駿府城代などを指揮監督し、朝廷・公家・大名・寺社に関する事柄、知行割りについてなどを統轄した。定員は4人から5人。","Wikipedia"],["3","側用人","そばようにん","征夷大将軍の側近であり、将軍の命令を老中らに伝え、また、老中の上申を将軍に取り次ぐ役目を担った。将軍近侍役の最高位。牧野成貞が1681年（天和元年）12月に御側衆から「御側御用人」に補任されたのが側用人の始まりとされる。幕閣ではないが、老中以上の実権をふるうものも多かった。","Wikipedia"],["4","若年寄","わかどしより","老中に次ぐ重職。全国支配の担当である老中に対し、旗本や御家人の支配を軸とする将軍家の家政を担当した。通常4人を定員とし、小禄の譜代大名から選任された。1662年（寛文2年）に設置された（前身は1633年（寛永10年）に置かれた六人衆）。","Wikipedia"],["5","京都所司代","きょうとしょしだい","京都に設置された幕府の部署。定員1名。3万石以上の譜代大名から任命された。京都の統治、朝廷・公家の監察、西日本諸大名の監視、五畿内及び近江、丹波、播磨の8カ国の民政を総括した。1688年（元禄元年）に京都支配など民政上の権限を京都町奉行に譲り、1722年（享保7年）の権限再編で老中の監督下に置かれた。","Wikipedia"],["6","大坂城代","おおさかじょうだい","将軍直属で有力な譜代大名が任じられ、大坂城主である将軍に代わり大坂城を預かった。大坂城守衛の総監および西国大名の監視等にあたった。1619年（元和5年）に大坂は江戸幕府直轄地となり、大坂城に城代が置かれるようになった。","Wikipedia"],["7","寺社奉行","じしゃぶぎょう","三奉行の最上位。1635年（寛永12年）に設置された。将軍直属。主な任務は全国の社寺や僧職・神職の統制であるが、門前町民や社寺領民、修験者や陰陽師らの民間宗教者、さらに連歌師などの芸能民らも管轄した。宗門人別改帳は社寺が管理していたため、結婚と離婚、移住、旅行（通行手形の発行）に関する行政も担当した。定員は4名で、譜代大名が月番制で務め、奏者番を兼任していた。","Wikipedia"],["8","奏者番","そうじゃばん（そうしゃばん）","城中における武家の礼式を管理する。大名・旗本が将軍に拝謁する際、あるいは在国の大名が献上品を使者に持たせて江戸城に派遣した場合に、その氏名と献上品の内容を確認して将軍に報告し、将軍が下賜を行う際にその伝達にあたった。大名の転封などの重大な決定や大名家の不幸に際して上使として派遣されることもあった。定員の定めは特にないが20名から30名とされる。1658年（万治元年）以後、奏者番の内4名は寺社奉行を兼任する。","Wikipedia"],["9","大目付","おおめつけ","大名・高家および朝廷を監視して、これらの謀反から幕府を守る監察官の役割を持った。1632年（寛永9年）12月17日に、秋山正重・水野守信・柳生宗矩・井上政重の4名が任じられたのがはじまりである（設置当初は惣目付と称した）。旗本の中から選任され、職制上は老中の管轄支配下とされた。江戸時代中期になると、監察官としての色彩よりも伝令や殿中での儀礼官としての色彩が濃くなった。","Wikipedia"],["10","目付","―","若年寄支配。幕府および全ての諸藩の監査役、監察官（「江戸幕府」）。読みは同記事に明記なし。","Wikipedia"],["11","町奉行","まちぶぎょう","三奉行の一つ。領内の都市部（町方）の行政・司法を担当する役職。江戸の町奉行は江戸の民政を担当し、その管轄下において「町触」という法令を出すとともに行政権や裁判権を有した。基本的に定員は2人で、それぞれ北町奉行所と南町奉行所を司ったが、月番制であり南北に管轄を分けていたわけではない。旗本が就く役職としては最高のもの。","Wikipedia"],["12","勘定奉行","かんじょうぶぎょう","三奉行の一つ。勘定所の最高責任者で財政や幕府直轄領を支配する郡代や代官の指揮監督などを司った。老中支配の役職。定員は約4人。財政以外では、金融や経済、交通や運輸、長崎貿易、警察や裁判、治水も担当した。","Wikipedia"],["13","留守居","―","老中支配の役職として「江戸幕府」記事の役職一覧に挙げられる。役割の詳細と読みは同記事に記載なし（未取得）。","Wikipedia"],["14","遠国奉行","―","江戸以外の天領都市に置かれた奉行の総称。江戸以外の天領都市の幕府町奉行は大坂町奉行など地名を冠し、遠国奉行と総称する（「町奉行」）。「江戸幕府」記事では老中支配に置かれ、長崎奉行・浦賀奉行・京都町奉行・大坂町奉行・佐渡奉行・奈良奉行・堺奉行などが挙げられている。読みは各記事に明記なし。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： 上記の各記事（取得日2026-11-18）。"],"tables":[]},{"h":"大老の成立（諸説）","lv":3,"text":["- 大老制度の成立には諸説があり、統一された見解はない。『徳川実紀』は寛永15年（1638年）11月7日に老中土井利勝・酒井忠勝が小事への関与を免ぜられた件を指して「今の世にいふ大老なり」としており、大老の最初であるとされることが多いが、『徳川実紀』には19世紀頃の政治意識に基づく書き換えが行われているとの指摘もある。","- 松平太郎と藤野保は、寛文6年（1666年）3月29日に酒井忠清が大老となり、職名としての「大老」と職制としての大老が確立されたのはこれ以降であるとしている。ただし『徳川実紀』や『江戸幕府日記』には忠清が大老となったという記載はない。","- 寛永年間から元禄年間の大老については、美和信夫が24の辞典・研究書等を検討したところ12通りの見解に分かれていたという。"],"tables":[]},{"h":"その他","lv":3,"text":["- 老中について： 就任には通常5万石以上の譜代大名という規定があったが、家禄が要件に満たなくても老中格（ろうじゅうかく）に登用される道が開かれており、職責は老中とほとんど遜色がなかった（ただし老中奉書への連署は行わなかった）。","- 寺社奉行について： 三奉行の中でも筆頭格といわれる（白井筆頭）。例外として大岡忠相が旗本のまま大名格となり、奏者番を兼ねずに勤めたことがあり、江戸時代全体でも異例である。","- 大目付について： 道中奉行を兼帯する大目付は筆頭格であり、京都所司代・大坂城代等と同様に将軍を代理する立場にあった。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- なし。留守居の役割の詳細と、目付・留守居・遠国奉行の読みは、取得した記事に記載がなかったため「未取得」「―」とした。"],"tables":[]}],"file":"14_B2_edo_shokusei.md"},{"id":"kokugun","t":"国郡制と国司・郡司","g":"官制","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/国郡里制","- https://ja.wikipedia.org/wiki/国司","- https://ja.wikipedia.org/wiki/郡司","- 記事名： 「国郡里制」「国司」「郡司」（いずれもWikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提： 国郡里制（こくぐんりせい）とは、古代日本において大宝律令により施行された地方行政・地方官制の方式である。701年（大宝元年）に制定された大宝律令で、日本国内は国・郡・里の三段階の行政組織に編成され、それぞれ国司・郡司・里長が置かれた。郡は大宝令以前は評と呼ばれた。国は畿内と七道の計66国と壱岐嶋、対馬嶋の2島という枠組みがほぼ定まった（「国郡里制」）。四等官の型（長官＝かみ、次官＝すけ、判官＝じょう、主典＝さかん）はリスト6（官制）のとおり。"],"secs":[{"h":"","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","区分・位置づけ","概要","出典の種別"],"rows":[["1","国郡里制","こくぐんりせい","制度全体","大宝律令により施行された地方行政・地方官制の方式。701年（大宝元年）に制定された大宝律令で、日本国内は国・郡・里の三段階の行政組織に編成された。里は715年（霊亀元年）に郷に改められた（年については注記参照）。地方の行政組織は全て太政官左右弁官局の共同管轄下に置かれた。","Wikipedia"],["2","国司","こくし（くにのつかさ、くにのみこともち）","国の官司","古代から中世の日本で、地方行政単位である国を支配する行政官として朝廷から任命され派遣された中央官吏たちを指す。守（かみ）、介（すけ）、掾（じょう）、目（さかん）の四等官が派遣された。任期は6年（のちに4年）だった。国司たちは国衙において政務に当たり、祭祀・行政・司法・軍事のすべてを司り、赴任した国内では絶大な権限を与えられた。戸籍の作成、田地の班給、租庸調の収取はいずれも国司の職務であった。","Wikipedia"],["3","守","かみ","国司の長官（四等官）","国司の筆頭。守の唐名は刺史、太守など。大国、上国の守は比較的に位階の高い貴族が任命された。守は毎年1回国内の各郡を視察する義務があった（部内巡行）。国の等級は大国・上国・中国・下国の4等級で、官位相当は大国の守は従五位上、上国の守は従五位下、中国の守と大国の介は従六位下などと大宝令・養老令に定められていた。","Wikipedia"],["4","介","すけ","国司の次官（四等官）","上国には介を置き、中国には介を置かず、下国には介・掾は置かないなどの規則があった（実際には各国の繁忙さに合わせて人員調整が行われていた）。親王任国では守が遥任のため、実務上の最高位は次官の介であった。","Wikipedia"],["5","掾","じょう","国司の判官（四等官）","四等官の第三位。下国には掾は置かれないとされた（「国郡里制」では「下国にはさらに掾も置かれない」）。","Wikipedia"],["6","目","さかん","国司の主典（四等官）","四等官の第四位。国の繁忙さに応じて大目・少目の増員が行われた例が『続日本紀』宝亀6年（775年）の条に見える。","Wikipedia"],["7","史生","ししょう／しせい（食い違い。注記参照）","国司の下級職員","四等官の下に置かれた。博士、医師などとともに広義では国司の中に含めて扱われていた（「国司」）。地元採用の書記官として国書生も置かれた（「国郡里制」）。","Wikipedia"],["8","受領","―","実際に赴任する国司の最高責任者","平安時代に、国司（守、介、掾、目）の中の実際に現地赴任する最高責任者を受領と呼ぶようになった。「守」（ただし親王任国では「介」）が租税納入の責任を負うこととなった。受領は一定額の租税の国庫納付を果たしさえすれば、それ以上の収入を私的に獲得・蓄積することができるようになった。読みは取得した記事に明記なし。","Wikipedia"],["9","太守（親王任国）","たいしゅ","親王任国の長官名","諸国のうち上総国、常陸国、上野国の三ヶ国は親王任国として、その長官を「太守」と言った。826年（天長3年）から親王任国の制度が始まり、親王任国の守には必ず親王が補任された。皇族であるため赴任はせず（遥任）、ただ俸給のみをとっていた。","Wikipedia"],["10","郡司","ぐんじ（こおりのつかさ）","郡の地方官","律令制下において、律令国内の各郡を治める地方官である。中央官僚である国司の下で、郡の行政に当たり、その地の有力者が世襲的に任命された。701年（大宝元年）に編纂された大宝令により、評が廃止されて郡が置かれ、郡司として大領・少領・主政・主帳の四等官に整備された。中央の官人が任期制で派遣された国司とは異なり、郡司は旧国造などの地方豪族が世襲的に任命され、任期のない終身官であった。郡司は徴税権のみならず、保管、貢進、運用、班田の収受も任されるなど絶大な権限を有していた。郡司の任免は式部省が管轄した。","Wikipedia"],["11","大領","だいりょう","郡司の長官（四等官）","郡司の筆頭。大領・少領を合わせて郡領といい、特に権限が強かった。郡領にはかつての国造一族などの在地首長が任ぜられた。職田は大領が6町。","Wikipedia"],["12","少領","―","郡司の次官（四等官）","大領と合わせて郡領という。職田は少領が4町。読みは取得した記事に明記なし。","Wikipedia"],["13","主政","しゅせい","郡司の判官（四等官）","郡の等級は大郡（16〜20里）・上郡（12〜15里）・中郡（8〜11里）・下郡（4〜7里）・小郡（2〜3里）の五等級で、下郡には主政が置かれず、小郡では大領・少領を区別せずにただ領一人を置いた。職田は主政・主帳が2町。","Wikipedia"],["14","主帳","しゅちょう","郡司の主典（四等官）","四等官の第四位。職田は2町。","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： 上記の各記事（取得日2026-11-18）。"],"tables":[]},{"h":"史生の読み（食い違い）","lv":3,"text":["- 「国司」記事： 史生（ししょう）。","- 「国郡里制」記事： 国司の構成として「史生(しせい)」。","- 両記事で読みが異なるため、どちらとも決めず併記した。"],"tables":[]},{"h":"里から郷への改称の年（同じ記事の中の食い違い）","lv":3,"text":["- 「国郡里制」記事の概要： 「里は、715年（霊亀元）に郷に改め、郷を2、3の里に分ける」。","- 同記事の「郷里・郷長・里長」の節： 「717年（霊亀3）に里は郷(ごう)と改称され、郷里制に変わった」。また「740年（天平12）頃を境に里は廃止され郷制に移行した」ともある。","- 同じ記事の中で年が分かれているため、そのまま併記した。"],"tables":[]},{"h":"その他","lv":3,"text":["- 国司の本来の意味について： 本来の国司とは地方官個人やその官職を指すのではなく、守を長官とする官司すなわち行政機関の名称であるとする指摘が出されている。官吏個人を対象として「国司」と呼称するのは本来は誤用とみなすべきだが、平安時代には一般化したと考えられている（「国司」）。","- 郡司の身分について： 養老律令の官位令には郡司が官位相当の対象とされておらず、公式令（52条）では郡司が職事官ではないことが明記されており、律令法に基づく制度でありながら実際には律令官制の体系には属さないという特殊な身分であった（「郡司」）。","- 国の等級（延喜式の時代）： 大国13カ国、上国35カ国、中国11カ国、下国9カ国（「国司」）。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- なし。"],"tables":[]}],"file":"15_B3_kokugun.md"},{"id":"ikai","t":"位階と官位相当","g":"官制","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/位階","- 官位相当の例はリスト6（官制）・B3（国司）で使用した各記事","- 記事名： 「位階」（Wikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提： 位階（いかい）は、国家の制度に基づく個人の序列の標示である。位階を授与することを「位階に叙する」または叙位（じょい）と称する。律令制における位階は親王が4階（品位、ほんい）、諸王が15階、諸臣が30階ある。位階に対応した官職に就くことを原則とした（官位相当制）。正位は「しょうい」、従位は「じゅい」と読む。一般的に三位は「さんみ」、四位は「しい」、七位は「しちい」と読む（「位階」）。"],"secs":[{"h":"表1 律令制の位階（養老律令・官位令、757年）","lv":2,"text":[],"tables":[{"cols":["番号","位階","読み","区分","備考","出典の種別"],"rows":[["1","一品","いっぽん","親王（品位）","親王は一品から四品までの4階。品位は「ほんい」とも読む。","Wikipedia"],["2","二品","―","親王（品位）","","Wikipedia"],["3","三品","―","親王（品位）","","Wikipedia"],["4","四品","しほん","親王（品位）","","Wikipedia"],["5","正一位","しょういちい","諸王・諸臣","諸王は正一位から従五位下まで14階。諸臣は正一位から少初位下まで30階。","Wikipedia"],["6","従一位","じゅいちい","諸王・諸臣","","Wikipedia"],["7","正二位","しょうにい","諸王・諸臣","","Wikipedia"],["8","従二位","じゅにい","諸王・諸臣","","Wikipedia"],["9","正三位","しょうさんみ","諸王・諸臣","三位は「さんみ」と読む。","Wikipedia"],["10","従三位","じゅさんみ","諸王・諸臣","","Wikipedia"],["11","正四位上","しょうしいのじょう","諸王・諸臣","四位は「しい」と読む。","Wikipedia"],["12","正四位下","しょうしいのげ","諸王・諸臣","","Wikipedia"],["13","従四位上","じゅしいのじょう","諸王・諸臣","","Wikipedia"],["14","従四位下","じゅしいのげ","諸王・諸臣","","Wikipedia"],["15","正五位上","しょうごいのじょう","諸王・諸臣","五位以上の者を律令制における「貴族」と指した。五位以上の者は位田の支給が規定されていた。外位では外正五位上。","Wikipedia"],["16","正五位下","しょうごいのげ","諸王・諸臣","外位では外正五位下。","Wikipedia"],["17","従五位上","じゅごいのじょう","諸王・諸臣","外位では外従五位上。","Wikipedia"],["18","従五位下","じゅごいのげ","諸王・諸臣","諸王の位階はここまで（14階）。外位では外従五位下。","Wikipedia"],["19","正六位上","しょうろくいじょう","諸臣","外位では外正六位上。","Wikipedia"],["20","正六位下","しょうろくいげ","諸臣","外位では外正六位下。","Wikipedia"],["21","従六位上","じゅろくいじょう","諸臣","外位では外従六位上。","Wikipedia"],["22","従六位下","じゅろくいげ","諸臣","外位では外従六位下。","Wikipedia"],["23","正七位上","しょうしちいじょう","諸臣","七位は「しちい」と読む。外位では外正七位上。","Wikipedia"],["24","正七位下","しょうしちいげ","諸臣","外位では外正七位下。","Wikipedia"],["25","従七位上","じゅしちいじょう","諸臣","外位では外従七位上。","Wikipedia"],["26","従七位下","じゅしちいげ","諸臣","外位では外従七位下。","Wikipedia"],["27","正八位上","しょうはちいじょう","諸臣","外位では外正八位上。","Wikipedia"],["28","正八位下","しょうはちいげ","諸臣","外位では外正八位下。","Wikipedia"],["29","従八位上","じゅはちいじょう","諸臣","外位では外従八位上。","Wikipedia"],["30","従八位下","じゅはちいげ","諸臣","外位では外従八位下。","Wikipedia"],["31","大初位上","だいそいのじょう","諸臣","初位は一位〜八位の下に置かれた。外位では外大初位上。","Wikipedia"],["32","大初位下","だいそいのげ","諸臣","外位では外大初位下。","Wikipedia"],["33","少初位上","しょうそいのじょう","諸臣","外位では外少初位上。","Wikipedia"],["34","少初位下","しょうそいのげ","諸臣","諸臣の最下位。外位では外少初位下。","Wikipedia"]]}]},{"h":"表2 官位相当の例","lv":2,"text":["出典： リスト6（官制）・B3（国司）で転記した各記事の記述（取得日2026-11-18）。"],"tables":[{"cols":["番号","官職","官位相当","備考","出典の種別"],"rows":[["1","太政大臣","正一位・従一位","太政官の長官（「太政官」）。","Wikipedia"],["2","左大臣・右大臣","正二位・従二位","太政官の長官（「太政官」）。","Wikipedia"],["3","内大臣","正二位・従二位","太政官の長官（「太政官」）。","Wikipedia"],["4","大納言","正三位・従三位","太政官の次官（「太政官」）。","Wikipedia"],["5","中納言","従三位","太政官の次官（「太政官」）。","Wikipedia"],["6","参議","正四位下・従四位下","太政官の次官（「太政官」）。","Wikipedia"],["7","大国の守","従五位上","大宝令・養老令に定められていた（「国司」）。","Wikipedia"],["8","上国の守","従五位下","（「国司」）","Wikipedia"],["9","中国の守・大国の介","従六位下","（「国司」）","Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： 「位階」（取得日2026-11-18）ほか。"],"tables":[]},{"h":"官位相当制の原則","lv":3,"text":["- 律令制は位階により就くことができる官職が定まっていた（官位相当制）。","- 選叙令によれば、内外の五位以上は勅授、内八位・外七位以上は奏授、外八位及び内外の初位は皆、太政官の判授とした。","- 内外文武の官に任じるとき、本人の位階と官の相当位階に高低があるならば、もし職務の相当位階が低いなら「行」とし、高いなら「守」とすることとした。","- 全ての官人が位階を有していた訳ではなく、官位相当制のない使部・伴部・舎人などの下級官人の中には无位（無位）の官人も存在した。"],"tables":[]},{"h":"蔭位の制","lv":3,"text":["- 高位者の子孫に位階を授ける蔭位（おんい）の制度が設けられた。選叙令によれば、子孫が21歳以上になったときに叙位され、蔭位資格者は皇親・五世王の子、諸臣三位以上の子と孫、五位以上の子である。","- 例： 親王の子は従四位下、諸王の子は従五位下。正一位・従一位の嫡子は従五位下、庶子は正六位上。正五位（内位・外位とも）の嫡子は正八位下、庶子は従八位上。"],"tables":[]},{"h":"明治以降の位階","lv":3,"text":["- 明治時代初期には位階制は正一位から少初位まで18階に簡素化され、のちに初位の上に正九位および従九位を設けて20階とした。","- 1871年9月24日（明治4年8月10日）に官位相当制は廃止され、位階制と官職制は分離した。","- 1887年（明治20年）5月4日に公布された叙位条例で、位階は正一位から従八位までの16階とされ、栄典の役割に特化した。","- 1926年（大正15年）10月21日に位階令（大正15年勅令第325号）が公布され、現行法として存続している。現在は生存者に対する叙位は停止され、故人のみを対象に運用されている。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- 「官位相当」（Wikipedia）： 取得を試みたが、ページの読み込みに失敗したため取得不可とした。官位相当の例は、リスト6・B3で転記済みの記事の記述から補った。"],"tables":[]}],"file":"16_B4_ikai.md"},{"id":"chugoku","t":"中国の王朝名・国名","g":"国名","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/中国の歴代王朝一覧","- https://ja.wikipedia.org/wiki/中国の歴史","- 記事名： 「中国の歴代王朝一覧」「中国の歴史」（いずれもWikipedia日本語版）","- 取得日： 2026-11-18","- 表の前提（同記事群の明記）： 「中国の王朝」とは、現在の中国の地域において、天子（皇帝）が天の委任を受け、天下（九州）の全部または一部を治めた朝廷（政権）のこと。夏については、実在が完全に証明されていないが、実在したと考える研究者が少なくなく、徳の継承が殷・周になされているため取り上げる（「中国の歴代王朝一覧」）。王朝名の読みは取得した記事本文に示されていないため「―」とした。存在年は同記事の表の表記のまま（BCは紀元前）。"],"secs":[{"h":"三代・春秋戦国","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["1","夏","か","BC1920〜BC1449、471年間","三代の一つ。国都は崇→陽城→斟鄩→帝丘→綸→夏邑→原→老丘→西河→斟鄩。初代君主は姒文命、最後の君主は夏后履癸。鳴条の戦いで交代。夏商交代については、夏王朝の建国をBC1920年として逆算し、471年間という数字は史書に因った（同記事注釈）。年代は「中国の歴史」と食い違い（注記参照）。","Wikipedia"],["2","殷（商）","いん（商：しょう）","BC1449〜BC1046、403年間","三代の一つ。国都は亳→隞→相→庇→邢→奄→商→朝歌。初代君主は子履、最後の君主は子受（帝辛）。牧野の戦いで交代。日本では一般に「殷」と呼ばれるが、中国では「商」と呼ぶほうが一般的で、「殷商」とも呼ぶ（「中国の歴史」）。実在の確認されている中国最古の王朝（同）。","Wikipedia"],["3","西周","せいしゅう","BC1046〜BC771、275年間","三代の一つ。国都は豊京・鎬京。初代君主は姫発、最後の君主は姫宮涅。申侯の乱（のちに平王が東遷し、周を復活させる）。殷滅亡の年は夏商周年表プロジェクトによりBC1046としたが、竹書紀年ではBC1027など、実際はBC1127〜BC1018の間とするのが正しいとされる（同記事注釈）。","Wikipedia"],["4","東周","とうしゅう","前770年 - 前256年","周朝。名義上は全国を統治、実際は洛邑（河南省洛陽市）の周囲の狭小地区。国都は洛邑、爵位は王（天子）。初代君主は平王、最後の君主は赧王。秦による東周の滅亡。紀元前771年から紀元前403年までを春秋時代、以降を戦国時代と呼ぶ（同記事注釈）。","Wikipedia"]]}]},{"h":"戦国七雄（参考）","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["―","秦","しん","前770年 - 前206年","嬴姓趙氏。国都は秦邑・汧邑・汧渭の会・平陽・雍・櫟陽・咸陽。前221年に中華を統一した。","Wikipedia"],["―","燕","えん","前1046年 - 前221年 ※個別記事「燕 (春秋)」は前222年（突き合わせ参照）","姞姓。国都は薊（副都：下都）。秦に滅ぼされた。","Wikipedia"],["―","楚","そ","殷代 - 前223年","羋姓熊氏。国都は丹陽・郢・陳・寿春。秦に滅ぼされた。","Wikipedia"],["―","趙","ちょう","前403年 - 前222年","嬴姓趙氏。国都は邯鄲。秦に滅ぼされた。","Wikipedia"],["―","魏","ぎ","前403年 - 前225年","姫姓魏氏。国都は安邑・大梁。秦に滅ぼされた。","Wikipedia"],["―","韓","かん","前403年 - 前230年","姫姓韓氏。国都は陽翟・新鄭。秦に滅ぼされた。","Wikipedia"],["―","斉（田斉）","でんせい","前386年 - 前221年","嬀姓田氏。国都は臨淄。秦に滅ぼされた。前身は姜斉（前1046年 - 前379年）。晋（前1033年 - 前349年）は韓・趙・魏に分裂した。","Wikipedia"]]}]},{"h":"秦・漢","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["5","秦","しん","BC221〜BC206、15年間","国都は咸陽。初代君主は始皇帝・趙政（嬴政）、最後の君主は秦王・趙子嬰。劉邦の咸陽入城により滅亡。","Wikipedia"],["6","前漢（西漢）","ぜんかん（西漢：せいかん）","BC206〜AD8、214年間","国都は長安。初代君主は劉邦、最後の君主は劉衎。王莽による簒奪。","Wikipedia"],["7","新","しん","AD8〜AD23、15年間","国都は常安。初代・最後の君主とも王莽。昆陽の戦い。","Wikipedia"],["8","後漢（東漢）","ごかん","AD23〜AD220、197年間","国都は洛陽→長安→許昌。初代君主は劉秀、最後の君主は劉協。曹魏の曹丕に禅譲。","Wikipedia"]]}]},{"h":"三国・晋","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["9","魏（曹魏）","そうぎ","220〜265、45年間","国都は洛陽。初代君主は曹丕、最後の君主は曹奐。西晋の司馬炎に禅譲。","Wikipedia"],["10","呉（孫呉、東呉）","そんご","222〜280、58年間","国都は建業。初代君主は孫権、最後の君主は孫晧。西晋によって滅亡。","Wikipedia"],["11","蜀（漢、蜀漢）","しょくかん／しょっかん","221〜263、42年間","国都は成都。初代君主は劉備、最後の君主は劉禅。魏によって滅亡。蜀漢の当時の国名は「漢」であった（同記事）。","Wikipedia"],["12","西晋","せいしん","265〜316、51年間","国都は洛陽。初代君主は司馬炎、最後の君主は司馬鄴。永嘉の乱と漢（後の前趙）によって滅亡。","Wikipedia"],["13","東晋","とうしん","317〜420、103年間","国都は建康。初代君主は司馬睿、最後の君主は司馬徳文。禅譲により南朝宋へ。","Wikipedia"],["―","桓楚","かんそ","403〜404、1年間","国都は洛陽。初代君主は桓玄、最後の君主は桓石綏。劉裕の東晋復興クーデター。","Wikipedia"]]}]},{"h":"五胡十六国","lv":2,"text":["同記事の明記： 五胡十六国時代については、帝号・王号・単于号など様々な称号を有する国が乱立していたため、ここではいわゆる五胡十六国のみ記す。冉魏、代、西燕、翟魏、譙蜀は十六国としてカウントされない（同記事注釈）。"],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["14-1","前涼","ぜんりょう","301〜376","首都は姑臧。漢族。初代君主は張軌、最後の君主は張天錫。前秦による滅亡。","Wikipedia"],["14-2","前趙","ぜんちょう","304〜329","首都は左国城→離石→黎亭→蒲子→平陽→長安。匈奴。初代君主は劉淵、最後の君主は劉煕。後趙による滅亡。","Wikipedia"],["14-3","成漢","せいかん","304〜347","首都は成都。巴賨（氐）。初代君主は李特、最後の君主は李勢。東晋の成都攻略。","Wikipedia"],["14-4","後趙","こうちょう","319〜351","首都は襄国→鄴。羯。初代君主は石勒、最後の君主は石祗。冉魏の成立。","Wikipedia"],["14-5","前燕","ぜんえん","337〜370","首都は棘城→龍城→薊→鄴。鮮卑。初代君主は慕容皝、最後の君主は慕容暐。前秦による侵攻。","Wikipedia"],["14-6","前秦","ぜんしん","351〜394","首都は長安→晋陽→南安→胡空堡→湟中。氐。初代君主は苻健、最後の君主は苻崇。淝水の戦いの敗戦を一因とする分裂。","Wikipedia"],["14-7","後燕","こうえん","384〜409","首都は中山→龍城。鮮卑。初代君主は慕容垂、最後の君主は慕容熙。馮跋のクーデターによる北燕成立。","Wikipedia"],["14-8","後秦","こうしん","384〜417","首都は長安。羌。初代君主は姚萇、最後の君主は姚泓。東晋の侵攻。","Wikipedia"],["14-9","西秦","せいしん","385〜400、409〜431","鮮卑。初代君主は乞伏国仁・乞伏乾帰、最後の君主は乞伏暮末。","Wikipedia"],["14-10","後涼","こうりょう","386〜403","首都は姑臧。氐。初代君主は呂光、最後の君主は呂隆。後秦による属国化、臣従。","Wikipedia"],["14-11","南涼","なんりょう","397〜414","鮮卑。初代君主は禿髪烏孤、最後の君主は禿髪傉檀。西秦に降伏。","Wikipedia"],["14-12","北涼","ほくりょう","397〜439","盧水胡（匈奴）。初代君主は沮渠蒙遜、最後の君主は沮渠牧犍。北魏に降伏。","Wikipedia"],["14-13","南燕","なんえん","398〜410","首都は滑台→広固。鮮卑。初代君主は慕容徳、最後の君主は慕容超。東晋の反撃により滅亡。","Wikipedia"],["14-14","西涼","せいりょう","400〜421","首都は敦煌→酒泉→敦煌。漢族。初代君主は李暠、最後の君主は李恂。北涼の侵攻で大敗。","Wikipedia"],["14-15","夏（胡夏）","―（記事「夏 (五胡十六国)」の冒頭は「夏（か）」だが、「胡夏」自体の読みの明記なし）","407〜431","首都は統万城→上邽→平涼。匈奴。初代君主は赫連勃勃、最後の君主は赫連定。","Wikipedia"],["14-16","北燕","ほくえん","409〜436","首都は龍城。漢族。初代君主は馮跋、最後の君主は馮弘。北魏の侵攻。","Wikipedia"]]}]},{"h":"南北朝","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["15","北魏","ほくぎ","386〜534、148年間","北朝。国都は盛楽→平城→洛陽。初代君主は拓跋珪、最後の君主は元脩。東西分裂。","Wikipedia"],["16","東魏","とうぎ","534〜550、14年間 ※個別記事「東魏」は「16年」。一覧の14年間は誤りの可能性が高い（突き合わせ参照）","北朝。国都は鄴。初代・最後の君主とも元善見。禅譲により北斉へ。","Wikipedia"],["17","西魏","せいぎ","535〜556、21年間","北朝。国都は長安。初代君主は元宝炬、最後の君主は拓跋廓。禅譲により北周へ。","Wikipedia"],["18","北斉","ほくせい","550〜577、27年間","北朝。国都は鄴。初代君主は高洋、最後の君主は高恒。北周が滅ぼす。","Wikipedia"],["19","北周","ほくしゅう","556〜581、25年間","北朝。国都は長安。初代君主は宇文覚、最後の君主は宇文闡。禅譲により隋へ。","Wikipedia"],["20","宋（劉宋）","りゅうそう","420〜479、59年間","南朝。国都は建康。初代君主は劉裕、最後の君主は劉準。禅譲により斉へ。","Wikipedia"],["21","斉（南斉）","なんせい","479〜502、23年間","南朝。国都は建康。初代君主は蕭道成、最後の君主は蕭宝融。禅譲により梁へ。","Wikipedia"],["22","梁（蕭梁）","―（記事「梁 (南朝)」の冒頭は「梁（りょう）」だが、「蕭梁」自体の読みの明記なし）","502〜557、55年間","南朝。国都は建康。初代君主は蕭衍、最後の君主は蕭方智。陳による滅亡。","Wikipedia"],["―","後梁（西梁）","こうりょう、ごりょう","554〜587、33年間","南朝。国都は江陵。初代君主は蕭詧、最後の君主は蕭琮。隋の侵攻。","Wikipedia"],["23","陳（南陳）","―（記事「陳 (南朝)」の冒頭は「陳（ちん）」だが、「南陳」自体の読みの明記なし）","557〜589、32年間","南朝。国都は建康。初代君主は陳霸先、最後の君主は陳叔宝。隋の侵攻。","Wikipedia"]]}]},{"h":"隋・唐","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["24","隋","ずい（呉音）／すい（漢音）","581〜618、37年間","国都は大興城。初代君主は楊堅、最後の君主は楊侑。唐に禅譲。","Wikipedia"],["25","唐","とう","618〜690、705〜907、289年間","国都は長安。初代君主は李淵。武則天による廃位・武周建国で中断し、朱全忠による簒奪・後梁建国で滅亡。","Wikipedia"],["26","武周","―（記事「武周」の冒頭は「周（しゅう）」だが、「武周」自体の読みの明記なし）","690〜705、15年間","国都は神都。初代・最後の君主とも武則天。家臣の退位進言、李顕の復位。通例では唐代に含むが、王朝の定義を満たしているため記載する（同記事注釈）。","Wikipedia"]]}]},{"h":"五代十国","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["27","後梁","こうりょう","907〜923、16年間","五代。国都は開封。初代君主は朱全忠、最後の君主は朱友貞。後唐の成立。","Wikipedia"],["28","後唐","こうとう","923〜936、13年間","五代。国都は洛陽。初代君主は李存勗、最後の君主は李従珂。後晋建国・契丹（後の遼）軍の侵入。","Wikipedia"],["29","後晋","こうしん","937〜946、9年間","五代。国都は開封。初代君主は石敬瑭、最後の君主は石重貴。契丹軍の侵入。","Wikipedia"],["30","後漢","こうかん","946〜950、4年間","五代。国都は開封。初代君主は劉知遠、最後の君主は劉承祐。後周の成立。五代の後漢は「こうかん」と読み、三国・漢の後漢（ごかん）とは別の国（同記事）。","Wikipedia"],["31","後周","こうしゅう","951〜960、9年間","五代。国都は開封。初代君主は郭威、最後の君主は柴宗訓。北宋の成立（趙匡胤への禅譲）。","Wikipedia"],["32-1","前蜀","ぜんしょく","907〜925、18年間","十国。国都は成都。初代君主は王建、最後の君主は王衍。後唐による侵攻。","Wikipedia"],["32-2","後蜀","こうしょく","934〜965、31年間","十国。国都は成都。初代君主は孟知祥、最後の君主は孟昶。宋による併合。","Wikipedia"],["32-3","呉","ご","902〜937、35年間","十国。国都は江都府。初代君主は楊行密、最後の君主は楊溥。李昪（南唐）に禅譲。","Wikipedia"],["32-4","南唐","なんとう","937〜975、38年間","十国。国都は江寧府→南昌府→江寧府。初代君主は李昪、最後の君主は李煜。宋の侵攻。","Wikipedia"],["32-5","荊南","けいなん","907〜963、56年間","十国。国都は江陵。初代君主は高季興、最後の君主は高継沖。宋の侵攻。","Wikipedia"],["32-6","呉越","ごえつ","907〜978、71年間","十国。国都は銭塘。初代君主は銭鏐、最後の君主は銭弘俶。宋に領地献上。","Wikipedia"],["32-7","閩","びん","909〜945、36年間","十国。国都は長楽府。初代君主は王審知、最後の君主は王延政。南唐の侵攻。","Wikipedia"],["32-8","楚","そ","907〜951、44年間","十国。国都は長沙。初代君主は馬殷、最後の君主は馬希崇。南唐の侵攻。","Wikipedia"],["32-9","南漢","なんかん","909〜971、62年間","十国。国都は興王府。初代君主は劉龑、最後の君主は劉鋹。宋による併合。","Wikipedia"],["32-10","北漢","ほくかん","951〜979、28年間","十国。国都は太原府。初代君主は劉崇、最後の君主は劉継元。宋による併合。","Wikipedia"],["―","岐","き","907〜924、17年間","同記事の十国の表に併記。国都は鳳翔。初代・最後の君主とも李茂貞。後唐に領地献上。","Wikipedia"],["―","桀燕","けつえん","911〜913、2年間","同記事の十国の表に併記。国都は幽州。初代・最後の君主とも劉守光。晋の侵攻。","Wikipedia"]]}]},{"h":"宋と並立した王朝","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["33","北宋","ほくそう","960〜1127、167年間","国都は開封。初代君主は趙匡胤、最後の君主は趙桓。靖康の変。","Wikipedia"],["34","南宋","なんそう","1127〜1276、149年間","国都は臨安。初代君主は趙構、最後の君主は趙昺。クビライによる侵攻。同記事の「宋」の行では960〜1279とされる（注記参照）。","Wikipedia"],["35","遼","りょう","907〜1125、218年間","国都は上京臨潢府。初代君主は耶律阿保機、最後の君主は耶律阿果。金の反乱。耶律大石は逃れて西遼建国（同記事注釈）。","Wikipedia"],["36","西夏","せいか","1038〜1227、189年間","国都は興慶。初代君主は李元昊、最後の君主は李睍。モンゴルの侵攻。","Wikipedia"],["37","金","きん","1115〜1234、119年間","国都は会寧→燕京→汴京。初代君主は完顔阿骨打、最後の君主は完顔呼敦。モンゴルの侵攻。","Wikipedia"],["38","モンゴル帝国","モンゴルていこく","1206〜1271、65年間","国都はカラコルム。初代君主はチンギス・カン（本名テムジン）、最後の君主はモンケ（分裂前までの君主）。元などに分裂し緩やかな連合体に。北元までをモンゴル帝国とする場合は林丹汗となる（同記事注釈）。","Wikipedia"]]}]},{"h":"元・明・清","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間（存在年）","備考","出典の種別"],"rows":[["39","元","げん","1271〜1368、92年間 ※1271〜1368は97年で、一覧内の数字が整合しない。個別記事に年数の明記なし","国都は上都／大都。初代君主は世祖クビライ、最後の君主は恵宗トゴン・テムル。明の北伐に伴う北遷。北元は1368年に元が中国領土を喪失して以降の後世の名称であり、王朝の連続性を見れば元と北元は同一の王朝である（同記事）。","Wikipedia"],["40","明","みん","1368〜1644、276年間","国都は南京→北京。初代君主は朱元璋、最後の君主は朱由検。李自成の乱。南明は1644年の明滅亡後に明の皇族たちによって立てられた諸政権の総称であり、一つの王朝が存在したわけではない（同記事）。","Wikipedia"],["41","後金","こうきん","1616〜1636、20年間","国都はヘトゥアラ→盛京。初代君主は愛新覚羅弩爾哈斉、最後の君主は愛新覚羅皇太極。清に改称。","Wikipedia"],["42","清","しん","1636〜1912、276年間","国都は盛京→北京。初代君主は愛新覚羅皇太極、最後の君主は愛新覚羅溥儀。袁世凱による退位。後金時代を含めると1616〜1912（同記事注釈）。最後の王朝である清は、1912年の中華民国の建国によって滅亡し、中国の帝制はここで消えた（「中国の歴史」）。","Wikipedia"]]}]},{"h":"近代以降の国名","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間","備考","出典の種別"],"rows":[["43","中華民国","ちゅうかみんこく","1912年 - 現在","「中国の歴史」の概略一覧による。同記事の勢力図には満洲国が併記され、現在の中華民国は「中華民国（台湾）」とも表記される。","Wikipedia"],["44","中華人民共和国","ちゅうかじんみんきょうわこく","1949年 - 現在","「中国の歴史」の概略一覧による。","Wikipedia"]]}]},{"h":"補完：一覧記事と個別記事の突き合わせ","lv":2,"text":[],"tables":[{"cols":["項目","リスト7（一覧記事）の記述","個別記事の記述","判定"],"rows":[["燕の滅亡年","前221年","記事「燕 (春秋)」は紀元前11世紀–前222年。本文では、前226年に首都の薊が陥落し、前222年に燕王喜が王賁に捕らえられ滅亡した","食い違い（前221年／前222年）。両論併記"],["燕の姓","姞姓のみ","記事「燕 (春秋)」の国姓欄は「姫姓若しくは姞姓」。本文は「姫姓の伯爵であった」とし、注釈では『史記』燕世家では周王朝と同姓の「姫姓」、殷墟の卜辞および『史記索隠』が引く『竹書紀年』によれば南燕国は姞姓であることから北燕も姞姓だとする説もある、とある","両論併記（姫姓が本文の主記、姞姓は説として）"],["東魏の存在年数","534〜550年、14年間","記事「東魏」は534年–550年で、本文に「ここに東魏の16年の短い歴史が終った」とある","食い違い（14年間／16年）。両論併記"],["元の存在年数","1271〜1368年、92年間","記事「元 (王朝)」は1271年–1368年で、年数（○年間）の明記は冒頭・基礎情報に見当たらない","一覧表の「92年間」は、1368−1271＝97（数え年では98）のどちらとも合わず、一覧表内の数字同士が整合しない。どちらが正しいかは断定しない"]]}]},{"h":"補完：日本との接点（出典付き）","lv":2,"text":[],"tables":[{"cols":["接点","内容","出典"],"rows":[["倭の五王と宋（劉宋）","『宋書』倭国伝に登場する讃・珍・済・興・武の5王。421年に讃が宋へ遣使したのが交渉の始まりで、478年の武の遣使・上表が史料上確実な最後。五王の天皇への比定は諸説あり、武＝雄略天皇が有力。他の四王は諸説（Museの要約「讃・珍は有力な仮説なし」は要確認）","Wikipedia「倭の五王」"],["邪馬台国と魏（曹魏）","『三国志』魏書東夷伝倭人条（『魏志倭人伝』）に記された3世紀の倭の国、女王卑弥呼。卑弥呼は景初二年（238年）に大夫難升米らを魏へ送り（『日本書紀』が引く『魏志』では景初三年＝239年とされ、遣使年に2つの系年がある）、魏から「親魏倭王」に冊封され金印紫綬・銅鏡百枚などを授与された。243年・247年にも遣使・報告があり、卑弥呼の死（247–248年ごろ）の後は台与が立ち魏へ遣使した。所在地は確定しておらず、畿内説・九州説が対立する","Wikipedia「邪馬台国」"],["遣隋使と隋","推古朝に倭国（俀国）が隋へ派遣した使節で、600年–618年の18年間に3回から5回。607年の第2回で小野妹子が「日出處天子致書日沒處天子無恙云云」の国書を携行した（『隋書』俀国伝）。倭の五王時代と異なり冊封を受けない外交原則とし、遣唐使にも引き継がれた","Wikipedia「遣隋使」"],["遣唐使と唐","7世紀の倭国及び8〜9世紀の日本が唐（武周を含む）へ派遣した使節。舒明天皇2年（630年）に始まり、最終は承和5年（838年）。寛平6年（894年）に再開が計画されたが菅原道真の意見で中止された。回数には諸説がある（12回・14回・15回・16回・18回・20回説）。唐側は朝貢使として扱ったが、日本の天皇は冊封を受けていない。702年の遣唐使から「日本」の国号を対外的に使用した","Wikipedia「遣唐使」"],["元寇と元","1274年・1281年にモンゴル帝国（元朝）および属国の高麗によって行われた対日侵攻。1度目を文永の役（1274年11月4日–19日）、2度目を弘安の役（1281年6月8日–8月22日）という。日本側は鎌倉幕府（執権 北条時宗）、元側の皇帝はクビライ。1266年の「大蒙古国皇帝奉書」が1268年に大宰府へ届けられたのが発端の一つ ※日付は西暦のみの記載で、暦の別は不明","Wikipedia「元寇」"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： Wikipedia「中国の歴代王朝一覧」「中国の歴史」（取得日2026-11-18）。以下は各記事の記述の転記。"],"tables":[]},{"h":"夏・殷・周の年代","lv":3,"text":["- 「中国の歴代王朝一覧」： 夏はBC1920〜BC1449、殷はBC1449〜BC1046、西周はBC1046〜BC771。","- 「中国の歴史」： 夏は紀元前2070年頃 - 紀元前1600年頃（＊諸説あり）、殷は紀元前1600年頃 - 紀元前12世紀・紀元前11世紀ごろ、周は紀元前12世紀・紀元前11世紀ごろ - 紀元前256年。克殷の年代については諸説あり、はっきりしない。","- 両記事で年代が異なるため、どちらにも決めず併記する。"],"tables":[]},{"h":"南宋の終年","lv":3,"text":["- 「中国の歴代王朝一覧」の宋代の表では、南宋は1127〜1276（149年間）とされ、宋の行では960〜1279とされる。同記事内でも表記が分かれているため、そのまま転記した。"],"tables":[]},{"h":"王朝交代の形","lv":3,"text":["- 王朝交代の形には禅譲（ぜんじょう：帝王が次代を徳のある臣下から選ぶ）と放伐（ほうばつ：悪政を理由に武力で打倒する）の2種が存在する。ただし東周を秦が滅ぼしたケースなど例外も存在する（同記事注釈）。"],"tables":[]},{"h":"征服王朝","lv":3,"text":["- 征服王朝（せいふくおうちょう）とは漢族以外による支配が行われた王朝のことで、五胡十六国や北朝は浸透王朝に含めるため、実質的には遼・金・元・清の4王朝を指す（同記事）。"],"tables":[]},{"h":"同名の王朝の区別","lv":3,"text":["- 同名の王朝が複数ある例が多く、後世に区別するため便宜上「前・後」（前漢・後金など）、方角の「東・西・南・北」（東周・北魏など）、建国した皇帝の姓（田斉・曹魏・武周など）の修飾語を付している（同記事）。","- 「漢」については、前漢・後漢（ごかん）と五代の後漢（こうかん）は別の国で、中国では混乱を避けるため前漢を西漢、後漢（ごかん）を東漢と呼ぶことが多い（同記事）。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- 取得に失敗したページはない。本文はWikipedia「中国の歴代王朝一覧」を用い、「中国の歴史」の概略一覧で近代以降と年代の照合を行った。外務省・国立国会図書館などの公的出典による王朝の一覧表は、本作業では取得していない。"],"tables":[]}],"file":"07_chugoku.md"},{"id":"chosen","t":"朝鮮の国名","g":"国名","meta":["- 出典URL：","- https://ja.wikipedia.org/wiki/朝鮮の歴史","- https://www.mofa.go.jp/mofaj/area/korea/data.html","- 記事名： 「朝鮮の歴史」（Wikipedia日本語版）、「大韓民国基礎データ」（外務省）","- 取得日： 2026-11-18","- 表の前提： 変遷の本文はWikipedia「朝鮮の歴史」の年表区分と本文による。現在の大韓民国の国名・政体は外務省「大韓民国基礎データ」で確認した（同ページに略史の一覧はない）。読みは各記事に示されたもののみ記し、それ以外は「―」とした。三国の建国年は「朝鮮の歴史」の年表・本文に明示されていないため、滅亡・統一の年を中心に転記した。"],"secs":[{"h":"","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間","備考","出典の種別"],"rows":[["1","檀君朝鮮","だんくんちょうせん","伝説上の建国（大韓民国では檀君即位の年をB.C.2333年とする）","伝説・神話の時代。檀君は神話上の人物で、『三国遺事』に中国の堯帝時代に檀君が平壌城で建国したと記される。大韓民国（韓国）では檀君即位の年から数える「檀君紀元」（檀紀）が存在する。朝鮮民主主義人民共和国（北朝鮮）の檀君陵復元には考古学的根拠は全くないと同記事にある。","Wikipedia"],["2","箕子朝鮮","きしちょうせん","- 紀元前194年","中国の殷を出自とする箕子が建国したとされる伝説的な古代国家。韓氏朝鮮・奇氏朝鮮とも呼ぶ。首都は王倹城（現在の平壌）。現在の韓国では後世の創作として否定しているが、中国では実在したと考えられている。","Wikipedia"],["3","衛氏朝鮮","えいしちょうせん","紀元前195年？ - 紀元前108年","考古学的に証明できる朝鮮の最初の国家。燕人の衛満が箕子朝鮮の王・準王を追い出して建国したという。三代衛右渠の時、漢の武帝に滅ぼされ、領地は楽浪郡・真番郡・臨屯郡・玄菟郡の漢四郡として400年間支配された。","Wikipedia"],["―","漢四郡・原三国時代","―","紀元前108年 - 2世紀中葉","原三国時代の諸勢力として、馬韓・辰韓・弁韓、楽浪郡・帯方郡、濊・貊・沃沮などが同記事に挙げられる。","Wikipedia"],["4","高句麗","こうくり（古名は「こま」。「こうくり」は高麗との区別のための慣習と記事にある）","- 668年","三国の一つ。4世紀の広開土王の代に最盛期。668年に唐が高句麗を滅ぼした。高句麗史をどのような枠組みで捉えるかについては議論がある（高句麗論争）と同記事にある。建国年は同記事に明示なし。","Wikipedia"],["5","百済","くだら／ひゃくさい","- 660年","三国の一つ。都は漢城、475年に熊津へ遷都。660年に唐が百済を滅ぼした。建国年は同記事に明示なし。","Wikipedia"],["6","新羅","しらぎ／しんら","- 935年","三国の一つ。唐と同盟し百済・高句麗を滅ぼして半島の大部分を統一した（統一新羅）。935年に敬順王が高麗に国を譲渡し滅亡。建国年は同記事に明示なし。","Wikipedia"],["―","伽耶諸国","かや","- 562年","1世紀から6世紀中頃にかけて洛東江流域に散在していた小国連盟。「六伽耶」「任那」などの名でも記され、最終的に新羅に吸収された。","Wikipedia"],["7","統一新羅","―（記事に明記なし）","676年 - 935年","新羅による三国統一後の時代区分。唐を朝鮮半島から撤退させた。ほぼ同時期に渤海が並立した（南北国時代の項参照）。","Wikipedia／外務省「北朝鮮基礎データ」の略史（期間を照合済）"],["8","渤海","ぼっかい","698年 - 926年","旧高句麗の支配地域に大祚栄が建国。高句麗遺民が合流した。統一新羅と並立。","Wikipedia"],["9","後高句麗","ごこうくり／こうこうくり","901年 - 918年","後三国の一つ。後継の高麗に継承された。","Wikipedia"],["10","後百済","ごくだら／こうひゃくさい","892年 - 936年","後三国の一つ。936年に高麗に滅ぼされ、朝鮮半島が統一された。","Wikipedia"],["11","高麗","こうらい","918年 - 1392年","918年に王建が高麗を建国。935年に新羅を滅ぼし、936年に後百済を滅ぼして統一。13世紀にモンゴル帝国（元）の侵攻を受け支配下に入った。同記事の年表区分では武臣政権（1170年 - 1270年）、元の征東行省（1270年 - 1356年）の時期が区別される。","Wikipedia／外務省「北朝鮮基礎データ」の略史（期間を照合済）"],["12","李氏朝鮮","りしちょうせん","1392年 - 1897年","1392年に李成桂が高麗王に即位し、1393年に国号が朝鮮となった（明の皇帝から「朝鮮」と「和寧」の2案から選ぶ形式的手順を踏んだ）。15世紀の世宗の時に黄金期。16世紀に豊臣秀吉の侵攻、17世紀に清の侵攻を受けた。","Wikipedia／外務省「北朝鮮基礎データ」の略史（期間を照合済）"],["13","大韓帝国","だいかんていこく","1897年 - 1910年","日清戦争後の下関条約によって冊封体制から離脱し、1897年に朝鮮から国号を変更して独立。1905年の第二次日韓協約で外交権を失い日本の保護国となった。","Wikipedia／外務省「北朝鮮基礎データ」の略史（期間を照合済）"],["14","日本統治時代の朝鮮","―","1910年 - 1945年","1910年に日韓併合条約を結び日本に併合された。韓国から朝鮮に国号を戻し、京城に朝鮮総督府が設置された。1919年に三・一独立運動が起こり、上海で大韓民国臨時政府が設立された。","Wikipedia／外務省「北朝鮮基礎データ」の略史（期間を照合済）"],["15","朝鮮人民共和国","ちょうせんじんみんきょうわこく","1945年","1945年9月6日に京城府で呂運亨らによって「朝鮮人民共和国」樹立が宣言された。アメリカ合衆国は承認を拒否した。北緯38度線以北をソビエト連邦軍、以南をアメリカ軍が管轄する連合軍軍政期に入った。","Wikipedia"],["16","大韓民国","だいかんみんこく","1948年 - 現在","1948年8月15日に大韓民国政府樹立を宣言、李承晩が初代大統領に就任。政体は民主共和国、首都はソウル、元首は李在明（イ・ジェミョン）大統領（外務省基礎データ、2026-11-18時点）。","Wikipedia／公的（外務省）"],["17","朝鮮民主主義人民共和国","ちょうせんみんしゅしゅぎじんみんきょうわこく","1948年 - 現在","1948年9月9日に金日成首相率いる朝鮮民主主義人民共和国の建国が宣言された。1950年に朝鮮戦争が起こるが統一はならず、現在も南北に2つの国家が並立している。","Wikipedia／外務省「北朝鮮基礎データ」の略史（期間を照合済）"]]}]},{"h":"補完：三国の建国年（『三国史記』の伝承年代）","lv":2,"text":[],"tables":[{"cols":["番号","国名","建国年","備考","出典の種別"],"rows":[["1","高句麗","紀元前37年（伝承）","『三国史記』の伝説によれば初代王・朱蒙（東明聖王）が紀元前37年に建国。記事は、文献史学的にも考古学的にも高句麗の登場はこれよりやや古いと見られるとし、基礎情報欄の成立は「紀元前1世紀頃」、東明聖王の在位は「前37年?–前19年?」と疑問符付きで示す","Wikipedia"],["2","百済","紀元前18年（伝承）","基礎情報欄に「建国（『三国史記』による）紀元前18年」と明記。記事本文によれば、日本の学界では4世紀前半頃の成立とする説が定着し、韓国では3世紀後半説が最も有力で、中央集権的国家の出現は4世紀半ば以後とされる","Wikipedia"],["3","新羅","紀元前57年（伝承）","『三国史記』新羅本紀の記述に従うと建国は紀元前57年。記事は、末松保和らの研究によって後世に造作されたものであることが明らかにされているとし、史実として確実性が高いのは4世紀の第17代奈勿王以降とする","Wikipedia"]]}]},{"h":"補完：後百済の開始年と後高句麗の国号変遷","lv":2,"text":[],"tables":[{"cols":["番号","対象","内容","備考","出典の種別"],"rows":[["1","後百済の開始年","892年（建国）と900年（国号確定）の2段階","基礎情報欄・冒頭とも892年–936年で建国は892年。本文によれば、甄萱は892年に挙兵して武珍州・完山州を占領し、900年に王となり国号を百済と定めた。首都は全州、初代は甄萱（892年–935年）、最後は甄神剣（935年–936年）","Wikipedia"],["2","後高句麗の国号変遷","899年挙兵 → 901年「高麗（高句麗）」 → 904年「摩震」 → 911年「泰封」 → 918年滅亡","弓裔は899年に挙兵し、901年に松嶽（開城）に遷都して国号を高麗（高句麗）と定めた。904年に国号を摩震（摩訶震旦の略）に改め年号を武泰と定め、905年に鉄円へ遷都、911年に国号を泰封（たいふう）に改め年号を水徳万歳と定めた。918年に王建の革命で滅亡。国王は弓裔のみ。冒頭は「899年–918年」、基礎情報欄は「901年–918年」とあり、始期の表記が記事内で食い違う","Wikipedia"]]}]},{"h":"補完：追加する国・政権","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間","備考","出典の種別"],"rows":[["1","夫余","ふよ","―（記事に期間の明記なし）","現在の中国東北部（満洲）に存在した民族およびその国家。「扶余」とも表記。北魏の時代まで存在し、太和18年（494年）に勿吉に滅ぼされた","Wikipedia"],["2","沃沮","よくそ","紀元前2世紀〜3世紀","朝鮮半島北部の日本海沿岸（現在の咸鏡道付近）に住んでいたと思われる民族。『三国志』や『後漢書』では東沃沮（とうよくそ）と表記。「沃沮」という独自の国家があったのではなく、濊貊系種族を指すものと考えられていると記事にある","Wikipedia"],["3","濊","わい","紀元前2世紀以来、約10世紀","『三国志』や『後漢書』などに記された古代民族。朝鮮半島の咸鏡道から江原道にかけての沿海地帯および中国の松花江付近に実在した","Wikipedia"],["4","耽羅","たんら／ちんら／とむら","?–1402年","済州島に古代から中世にかけて存在した王国。百済・統一新羅・高麗に内属し、15世紀初めに李氏朝鮮に完全併合された。高麗は1105年に「耽羅郡」を設置し1108年に「済州郡」に改称（ここで「耽羅国」としての歴史は途切れた）。1402年に星主・王子の称号改称で星主時代が終わった","Wikipedia"],["5","大韓民国臨時政府","だいかんみんこくりんじせいふ","1919年〜1945年","1919年の三・一運動後、同年4月11日に中華民国の上海市で結成された朝鮮民族の組織。概要表の創設年は「1919年3月1日」、解散年は「1945年9月8日」とあり本文と併記する。1987年の大韓民国憲法前文に「大韓民国臨時政府の法統」の継承とある一方、国際的な承認は得られておらず異論も存在すると記事にある。韓国政府は2019年より樹立日を4月13日から4月11日に変更した","Wikipedia"],["6","連合軍軍政期","れんごうぐんぐんせいき","1945年〜1948年","1945年9月9日から1948年まで、アメリカ合衆国とソビエト連邦による占領統治の時代。38度線以南は在朝鮮アメリカ陸軍司令部軍政庁（1945年9月11日新設）が統治し、1948年8月15日の大韓民国樹立でアメリカ軍政は公式に廃止された。北部は1948年9月9日に朝鮮民主主義人民共和国が建国され、10月12日にソ連の承認を受けてソ連軍政は終結した","Wikipedia"]]}]},{"h":"補完：日本との接点（補助欄）","lv":2,"text":[],"tables":[{"cols":["番号","出来事","読み","時期","内容","出典の種別"],"rows":[["1","白村江の戦い","はくすきのえのたたかい／はくそんこうのたたかい","663年","天智2年8月（663年10月。旧暦8月27日–28日、ユリウス暦663年10月4日–5日）に白村江（現在の錦江河口付近）で行われた、百済復興を目指す日本・百済遺民連合軍と唐・新羅連合軍の戦争。結果は唐・新羅連合軍の大勝で、朝鮮半島における倭の勢力圏は完全に消滅した。660年に百済が滅亡し、鬼室福信らによる百済復興運動が起き、救援を求められた倭国が663年に参戦した一連の戦役を「百済の役（くだらのえき）」という。戦後、天智天皇は唐・新羅の侵攻を恐れて大宰府の水城や朝鮮式古代山城、防人を配備し、667年に都を近江京へ移した。なお同記事の冒頭には出典不足・独自研究の注意テンプレート（2023年6月付）がある","Wikipedia"],["2","文禄・慶長の役","ぶんろく・けいちょうのえき","1592年〜1598年","豊臣秀吉が1592–98年に2度にわたって企てた朝鮮に対する侵略戦争。期間は天正20年4月13日（1592年5月24日）から慶長3年11月25日（1598年12月22日）。結果は李氏朝鮮と明の勝利。秀吉は明の征服を目指し、冊封国である朝鮮に服属を強要したが拒まれた。1598年に日本軍が朝鮮半島から撤退して終結し、日朝間の国交回復は9年後の1607年。朝鮮側の呼称は、文禄の役が「壬辰倭乱」、慶長の役が「丁酉再乱」","Wikipedia"],["3","朝鮮通信使","ちょうせんつうしんし（正式名称は朝鮮聘礼使、ちょうせんへいれいし）","1375年〜1811年（江戸時代は1607年〜1811年）","室町時代から江戸時代にかけて朝鮮から日本へ派遣された外交使節団。始まりは1375年（永和元年）に足利義満が派遣した日本国王使に対する返礼。文禄・慶長の役で国交が断絶して中断し、江戸時代に再開された。江戸時代は計12回派遣され、第1回は1607年（慶長12年）で名称は「回答兼刷還使」（捕虜返還が目的で、第1次で約1300人が帰国、帰国総数は6000人から7500人ほどとされる）。1811年（文化8年）の第12回は対馬までで差し止められて最後となった。一行は正使・副使・書状官の3使を中心に470人から500人で、対馬藩の案内・警護約1500人が加わった。江戸幕府の外交では、朝鮮は琉球と並ぶ正式な国交のある「通信国」とされた","Wikipedia"],["4","江華島事件","こうかとうじけん（別名・雲揚号事件、うんようごうじけん）","1875年","1875年（明治8年）9月20日に江華島付近で日本の軍艦雲揚号が江華島・永宗島砲台と交戦した武力衝突（9月20日–22日）。日朝修好条規締結の契機となった。背景には、明治政府の国書を朝鮮が「皇」「勅」の文字等を理由に受け取りを拒否した書契問題がある。事件が偶発か計画的挑発かについては、現代の研究者では意図的な挑発行為であったと解釈するのが定説と記事にある。1876年2月に日朝修好条規（江華条約）が締結され決着した","Wikipedia"],["5","（参考）その他の接点","―","―","「百済」の記事： 660年に百済が滅亡し、王族や遺臣たちは倭国の支援を受けて百済復興運動を起こしたが、663年の白村江の戦いの敗戦とともに鎮圧された。「後百済」の記事： 922年と929年に後百済は日本に参戦・援助を要請したが拒絶された。「耽羅」の記事： 661年5月に王子らを派遣して日本へ初めて朝貢し、以後も朝貢が続いた（『日本書紀』）","Wikipedia"]]}]},{"h":"補完：外務省「北朝鮮基礎データ」","lv":2,"text":["出典： 外務省「北朝鮮基礎データ」（https://www.mofa.go.jp/mofaj/area/n_korea/data.html 、ページ表記日付は令和4年4月21日、取得日2026-11-18、種別：公的）","略史（同ページの転記）：","- 3世紀終わり頃に氏族国家成立","- 三国時代（4世紀頃～7世紀後半）","- 統一新羅（676～935）","- 高麗（918～1392）","- 朝鮮（1392～1897）。1897年10月に国号を大韓帝国と改称","- 大韓帝国（1897～1910）","- 日本による統治（1910～1945）を経て第2次大戦後、北緯38度以北をソ連が占領","- 1948年に北朝鮮「政府」樹立。同時期に朝鮮半島の南半分では大韓民国が成立","一般事情（同ページの転記）： 面積は12万余平方キロメートル、人口は約2,578万人（2020年、国連統計部）、首都は平壌（ピョンヤン）、民族は朝鮮民族、言語は朝鮮語。","政治（同ページの転記、取得日2026-11-18時点のページ内容）： 国務委員長は金正恩（キム・ジョンウン）、内閣総理は金徳訓。","なお、リスト8で使った外務省「大韓民国基礎データ」の取得済みテキストには略史の節が含まれていなかったため、韓国の側の略史は今回も取得できていない。","※外務省ページの表記日付は令和4年4月21日だが、内閣総理に金徳訓とあるなど内容は新しい。ページ日付と内容の更新時期が合わない可能性があり、現職情報は要再確認。"],"tables":[]},{"h":"注記・食い違い","lv":2,"text":["出典： Wikipedia「朝鮮の歴史」、外務省「大韓民国基礎データ」（取得日2026-11-18）。以下は各記事の記述の転記。"],"tables":[]},{"h":"「統一新羅時代」と「南北国時代」の呼称","lv":3,"text":["- 新羅による三国統一後、渤海が滅亡するまで両者は並立していた。渤海を朝鮮の歴史の一部とみなすべきか否かについては賛否両論があり、渤海を朝鮮史の一部とする1975年以降の韓国ではこの時代を「南北国時代」と称しているが、渤海を朝鮮史へ組み込むことに否定的な日本・中国などでは「統一新羅時代」と称される（「朝鮮の歴史」）。"],"tables":[]},{"h":"箕子朝鮮の実在をめぐる見解","lv":3,"text":["- 現在の韓国では後世の創作として否定しているが、中国では実在したと考えられている（「朝鮮の歴史」）。"],"tables":[]},{"h":"高句麗史の枠組み","lv":3,"text":["- 高句麗史をどのような枠組みで捉えるかについては議論がある（高句麗論争）（「朝鮮の歴史」）。"],"tables":[]},{"h":"大韓帝国の冊封国扱いをめぐる記述","lv":3,"text":["- 1897年に朝鮮は清の冊封体制から離脱し独立国となったが、韓国は歴史上中国の冊封国であったことを認めていないと同記事にある。"],"tables":[]},{"h":"取得不可だったページ","lv":2,"text":["- 取得に失敗したページはない。外務省「大韓民国基礎データ」は取得できたが、同ページに略史（国名変遷）の一覧は含まれていないため、現在の国名・政体の確認にのみ用いた。外務省「北朝鮮基礎データ」は本作業では未取得。"],"tables":[]},{"h":"補完時の注記・食い違い（D）","lv":2,"text":["出典： 上記の各記事・外務省ページ（取得日2026-11-18）。","- 後高句麗の始期： 冒頭は899年、基礎情報欄は901年と、同じ記事の中で食い違う。901年は国号を「高麗」と定めた年であり、899年は挙兵の年である。","- 大韓民国臨時政府の創設日： 本文は1919年4月11日結成、概要表は創設年「1919年3月1日」とあり、記事内で表記が分かれる。","- 高句麗の読み「こうくり」について： 記事は、本来の日本語の古名は「こま」であり、「こうくり」は高麗と区別するため一般化した慣習だと説明する。","- 白村江の戦いの記事には、冒頭に出典不足・独自研究の注意テンプレート（2023年6月付）がある。"],"tables":[]},{"h":"補完時の取得不可だったページ（D）","lv":2,"text":["- Wikipedia「大韓帝国」の記事自体は、本作業の取得手段では開くことができなかった。読み（だいかんていこく）は「李氏朝鮮」の記事本文中の言及から転記し、参考扱いとした。","- 外務省「大韓民国基礎データ」の略史の節は、取得済みテキストに含まれていなかった（未取得）。"],"tables":[]}],"file":"08_chosen.md"},{"id":"shinise","t":"老舗企業の創業年一覧","g":"企業","file":"","meta":["- 各県の章の項目h（h-1 老舗）から自動で作った一覧。章が増えると自動で増える。","- 老舗の基準：創業1926年以前（2026年時点で100年以上）、現在も営業中、本社がその県内。","- 創業年は各社の公式沿革などによる。法人の設立年が違う場合は併記している。諸説・未確認は各県の章の「確認中のメモ」を見る。","- 並び順は創業年の古い順。「創業年」の欄の年は、表記の最初の西暦で並べている。"],"secs":[{"h":"創業年の古い順（66社）","lv":2,"text":[],"tables":[{"cols":["順","創業","企業名","県","本社所在地","業種・事業内容","もとの表記（創業年・設立年）","備考"],"rows":[["1","578年","株式会社金剛組","大阪府","大阪市天王寺区四天王寺一丁目14番29号","社寺建築の設計・施工、文化財建造物の復元・修理等","創業578年（敏達天皇7年、四天王寺建立のため聖徳太子が招聘した宮大工・金剛重光による）／現法人の設立2006年1月","世界最古の企業とされる。2005年に髙松建設（現・髙松コンストラクショングループ）の子会社となり、現法人は2006年1月に設立（親会社プレスリリースの会社概要による）。旧法人の設立年は注記参照"],["2","1461年","株式会社総本家駿河屋（総本家駿河屋善右衛門）","和歌山県","和歌山県和歌山市小倉25番地","和菓子の製造・販売","1461年（設立年は公式に明記なし）","創業は1461年、室町時代に京都伏見で初代岡本善右衛門が『鶴屋』と号して饅頭処を開業したのが始まり。その後、初代紀州藩主・徳川頼宣に召し連れられ和歌山に店舗を構え現在に至る（創業地は京都府域、和歌山への移転は江戸時代初期）"],["3","1534年","冨田酒造有限会社","滋賀県","滋賀県長浜市木之本町木之本1107","清酒製造（主要銘柄「七本鎗」）","1534年（天文3年）（法人設立年は記事に明記なし）","Wikipediaは「現存する日本の酒造会社としては5番目に古い」と記す。企業公式サイ とされる。日本政府の立場（外務省「北方領土」）では、北方四島は一度も他国の領土となったことがない日本固有の領土であり、1945年にソ連に占領され、今日に至るまでソ連・ロシアによる不法占拠が続いている。他方、現実の支配の事実としては、ロシア連邦がこれらの島々を実効支配している。1875年（明治8年）に追加された得撫郡・新知郡・占守郡（得撫島以北）についても、現在はロシア連邦が実効支配している","5郡（国後・択捉・振別・紗那・蘂取）","千州（せんしゅう）","Wikipedia"]]}]},{"h":"琉球国","lv":2,"text":["出典：Wikipedia「令制国」 https://ja.wikipedia.org/wiki/令制国 （取得日：2026-11-18）／種別：Wikipedia"],"tables":[{"cols":["番号","国名","読み","道","等級","現在の都道府県","郡数","別称","出典の種別"],"rows":[["80","琉球国","りゅうきゅうこく","―（五畿八道に含まれない）","―（制度なし）","沖縄県","―（制度なし）","琉球王国","Wikipedia"]]}]},{"h":"注記・食い違い（各道の出典の記述）","lv":2,"text":[],"tables":[]},{"h":"畿内：章との食い違い","lv":3,"text":["- 摂津国の郡数：26章・27章はいずれも「基礎情報欄13郡78郷／郡の節12郡75郷」の併存を記録しており、本ファイルも同じ値を転記した（章との食い違いではなく、記事内部の食い違い）。","- 大和国分寺：25章は東大寺説と橿原市国分寺説（『大和志』）の両論を記録しており、本ファイルも両論併記で一致する。","- 和泉国の分立：26章は716年（和泉監）・757年（和泉国）の2段階とし、和泉監設置日は記事間で食い違いがある旨を記録済み。本ファイルもそのまま転記した。","- 山城国：京都府の章（09・23）には旧国の制度（国府・一宮・総社・国分寺）を扱う節がないため、本ファイルの山城国の値は章と照合できていない（食い違いの有無自体が未確認）。","- 摂津国一宮：26章・27章とも住吉大社と坐摩神社の両論併記であり、本ファイルと一致する。"],"tables":[]},{"h":"畿内：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各国記事・「令制国一覧」・「令制国」はすべて取得できた）。ただし各国の値はWikipediaのみに基づくものが大半であり、公的・学術出典での照合は行えていない（下記3分類参照）。"],"tables":[]},{"h":"東海道：章との食い違い","lv":3,"text":["- 伊勢国の一宮：33章のg節は椿大神社を正式の一宮とし、多度神社の「事実上一宮」説を併記する。一方、33章の国府に関する記述には「最初の一宮は多度神社」とする旨もあり、章の内部で記述の置き方が異なる。本ファイルはg節の整理（椿大神社を正式とし多度神社説を併記）に合わせ、食い違いとして明記する。","- 志摩国の国分尼寺：33章のg節本文は所在地を「志摩市阿児町国府字大堂」とするが、同章が転記した基礎情報欄は「（未詳）」である。本ファイルは両方を併記した。","- 伊賀国の一宮・敢國神社の読み：33章には読みの記載がない。本ファイルでも読みは未確認とし、社名のみを転記した。","- 上記以外の伊勢・伊賀・志摩の値（等級・郡数・国府・総社・国分寺・式内社数）は、33章のa節・g節の値と一致する。"],"tables":[]},{"h":"東海道：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各国記事・「令制国一覧」はすべて取得できた）。ただし各国の値はWikipediaのみに基づくものが大半であり、公的・学術出典での照合は行えていない（下記3分類参照）。"],"tables":[]},{"h":"東山道：章との食い違い","lv":3,"text":["- 近江国：本ファイルの値は32章（滋賀県）a節・g節の転記そのものであり、章との食い違いはない。ただし国分寺（国分僧寺）については、32章の本文の変遷説（甲可寺→瀬田廃寺→国昌寺跡）と基礎情報欄の推定地3か所（甲賀市紫香楽宮跡・大津市野郷原・大津市光が丘町）が併存しており、本ファイルも両方を併記した（記事・章内部の併存であって、章との食い違いではない）。","- 美濃・飛騨・信濃・上野・陸奥・出羽・下野の各国については、対応する府県の章がまだないため、章との照合は行えていない。"],"tables":[]},{"h":"東山道：取得不可","lv":3,"text":["- 『国史大辞典』（吉川弘文館）の本文：有料データベース（ジャパンナレッジの別途契約コンテンツ）または国立国会図書館内限定公開のため取得不可。詳細は畿内分（40_藩一覧_畿内.md）の『国史大辞典』での確認の節に記録済みであり、本ファイルでも同様に取得不可として扱う。"],"tables":[]},{"h":"北陸道：章との食い違い","lv":3,"text":["- 北陸道4県（福井・石川・富山・新潟）については、既存の府県の章（25〜34は近畿7府県）が存在しないため、本ファイルの値は章と照合できていない（食い違いの有無自体が未確認）。","- 越前国の郡数：基礎情報欄の「6郡55郷」と「郡」の節の「8郡」は、記事内部の食い違い（時代の異なる構成）として表に併記した。南条郡は明治期に丹生郡から分離した郡であるため、8郡は明治期以降の構成とみられるが、記事に時代の明記はない。"],"tables":[]},{"h":"北陸道：取得不可","lv":3,"text":["- 『国史大辞典』（吉川弘文館）の各国・各項目の本文は取得不可（有料会員制のジャパンナレッジ「セレクト」コンテンツ、および国立国会図書館内限定公開のため。詳細は40_藩一覧_畿内.mdの「吉川弘文館『国史大辞典』での確認（取得不可）」に記録済み）。","- 上記のほか、本ファイルで使用したWikipedia各国記事・「令制国一覧」はすべて取得できた。ただし各国の値はWikipediaのみに基づくものが大半であり、公的・学術出典での照合は行えていない（下記3分類参照）。"],"tables":[]},{"h":"山陰道：章との食い違い","lv":3,"text":["- 但馬国：本ファイルの値（一宮は出石神社と粟鹿神社の両論、総社は気多神社、国府は気多郡で祢布ヶ森遺跡に比定、国分寺・国分尼寺の所在地）は27章（兵庫県）のg節と一致する。なお郷数について、27章は『和名抄』に基づく別数（63郷）とする事典類の本文は取得しておらず未確認であると記録しており、本ファイルも基礎情報欄の59郷を転記したうえで、この点は未確認のままである。","- 丹波国・丹後国：京都府の章（09・23）には旧国の制度（国府・一宮・総社・国分寺）を扱う節がないため、本ファイルの両国の値は章と照合できていない（食い違いの有無自体が未確認）。別称「丹州」が丹波・丹後の両国に使われる点は23章（F5）と一致する。","- 因幡国の郡数：基礎情報欄の「7郡50郷」と「郡」の節の8郡の併存は、記事内部の食い違いとして表に明記した（章との食い違いではない）。"],"tables":[]},{"h":"山陰道：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各国記事・「令制国一覧」はすべて取得できた）。ただし各国の値はWikipediaのみに基づくものが大半であり、公的・学術出典での照合は行えていない（下記3分類参照）。"],"tables":[]},{"h":"山陽道：章との食い違い","lv":3,"text":["- 播磨国：等級（大国）・郡数（12郡98郷）・国府（一宮：伊和神社・総社：射楯兵主神社・国分寺・国分尼寺・延喜式内社50座47社の各値は、27章（兵庫県）のg節と照合し、一致した。","- 一ツ山大祭の周期：Wikipedia系の記述は60年ごと、姫路市・兵庫県立歴史博物館は61年ごととする食い違いは、27章に記録済みであり、本ファイルにも転記した（記事・出典間の食い違いであり、章との食い違いではない）。","- 播磨以外の7国（美作・備前・備中・備後・安芸・周防・長門）には対応する府県の章（岡山県・広島県・山口県の章）がまだないため、本ファイルの値と章との照合は行えていない（食い違いの有無自体が未確認）。"],"tables":[]},{"h":"山陽道：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各国記事・「令制国一覧」はすべて取得できた）。ただし各国の値はWikipediaのみに基づくものが大半であり、公的・学術出典での照合は播磨の一部を除き行えていない（下記3分類参照）。","- 『国史大辞典』（吉川弘文館）の各国・各項目の本文は、有料会員制データベース（ジャパンナレッジ）または国立国会図書館内限定公開のため取得不可であり、本ファイルでは出典として用いていない（詳細は40_藩一覧_畿内.mdに記録済み）。"],"tables":[]},{"h":"南海道：章との食い違い","lv":3,"text":["- 紀伊国の郡数：34章は、Wikipedia「紀伊国」の7郡55郷と、コトバンク『世界大百科事典』の7郡53郷の食い違いを記録済みであり、本ファイルも両値を併記して一致する（章との食い違いではなく、出典間の食い違い）。","- 紀伊国の一宮：34章も日前神宮・國懸神宮、丹生都比売神社、伊太祁曽神社の3説併記であり、本ファイルと一致する。","- 紀伊国の総社：34章も「総社明神（大屋都姫神社に合祀）とされるが確定した出典なし」とし、本ファイルも未確認として一致する。","- 淡路国の値（等級・郡数・国府・一宮・総社・国分寺）：27章のa-4節・g-4節の転記と一致する。総社十一明神社の読みは27章でも未確認であり、本ファイルも未確認とした。","- 阿波・讃岐・伊予・土佐の4国は、対応する府県の章がないため照合できていない（食い違いの有無自体が未確認）。"],"tables":[]},{"h":"南海道：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各国記事・「令制国一覧」はすべて取得できた）。ただし各国の値はWikipediaのみに基づくものが大半であり、公的・学術出典での照合は行えていない（下記3分類参照）。"],"tables":[]},{"h":"西海道：章との食い違い","lv":3,"text":["- 既存の府県の章（京都＝09・23、奈良＝25、大阪＝26、兵庫＝27、三重＝33、滋賀＝32、和歌山＝34）に、西海道11国を扱う章はないため、本ファイルの値は章と照合できていない（食い違いの有無自体が未確認）。"],"tables":[]},{"h":"西海道：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各国記事・「令制国一覧」はすべて取得できた）。ただし各国の値はWikipediaのみに基づくものが大半であり、公的・学術出典での照合は行えていない（下記3分類参照）。","- 『国史大辞典』（吉川弘文館）の項目本文は取得不可（有料会員制・国立国会図書館内限定公開のため。畿内分の40_藩一覧_畿内.mdに経緯を記載済み）。"],"tables":[]}]},{"id":"han","t":"藩の一覧（廃藩置県の時点）","g":"国と藩","file":"","meta":["- 1871年8月29日（明治4年7月14日）の廃藩置県の時点で、藩庁を置いていた藩。計261藩（通説の261藩）。","- 廃藩置県より前に廃藩した藩は入れていない。山川の辞典がいう「先行して廃藩した14藩」は、別の一覧「廃藩置県より前に廃藩した14藩」に載せた（長岡藩は1870年11月15日＝明治3年10月22日の廃藩で、入れていない。確認済み）。","- 先行廃藩の14藩の表は「廃藩置県より前に廃藩した14藩」を見る。","- 藩庁が他国へ移った藩（重原・松川・龍ヶ崎など）は、移った先の国に載せている。陸奥・出羽は分割後の国名（陸奥・陸中・陸前・岩代・磐城・羽前・羽後）で分けた。","- 立藩の年の基準は、藩によってそろっていない（初立藩か、藩主家の入封か）。備考を見る。","- 第10便で集めたデータをそのまま載せている。補正便（第11便）はまだ届いていないため、確認中の項目が残っている（末尾の「注記」を見る）。","- 日付は1872年末まで「新暦（旧暦）」の順。原文で旧暦の月日に西暦の年が付いていたものは、確認できた範囲で直した。","- 出典はほぼWikipedia。『国史大辞典』は有料・館内限定のため取得できていない。"],"secs":[{"h":"【畿内】山城国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["1","淀藩","よどはん","山城国・京都府（京都市伏見区、淀城）","稲葉家：稲葉正邦（いなば まさくに）","10万2000石","譜代","1623年（元和9年）","淀県","藩主家は松平家（親藩）→永井家→石川家→松平家→松平家と替わり、1723年に稲葉正知が入って以後は稲葉家。所領は山城のほか摂津・河内・近江・下総・越後など7か国に分散した","Wikipedia"]]}]},{"h":"【畿内】大和国（8藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["2","郡山藩","こおりやまはん","大和国・奈良県（大和郡山市、郡山城）","柳沢家：柳沢保申（やなぎさわ やすのぶ）","15万1000石","譜代","1615年（元和元年）","郡山県","藩主家は水野家→松平家→本多家→松平家→本多家と替わり、1724年に柳沢吉里が入って以後は柳沢家","Wikipedia"],["3","柳生藩","やぎゅうはん","大和国・奈良県（奈良市柳生、柳生陣屋）","柳生家：柳生俊益（やぎゅう とします）","1万石","譜代","1636年（寛永13年）","柳生県","1650年の分知で一時旗本に降格し、1668年に1万石の大名に復帰した（「柳生藩」記事）。領地の一部は山城国にも所在","Wikipedia"],["4","小泉藩","こいずみはん","大和国・奈良県（大和郡山市小泉町、小泉陣屋）","片桐家：片桐貞篤（かたぎり さだあつ）※読みは25章による","1万1000石","外様","1600年（慶長5年）","小泉県","石高は1万石→1万6000石→1万3000石→1万1000石と変遷。領地は大和のほか山城・和泉・摂津にも所在。立藩年には1615年とする説もある（25章に食い違いとして記録）","Wikipedia"],["5","柳本藩","やなぎもとはん","大和国・奈良県（天理市柳本町、柳本陣屋）","織田家：織田信及（おだ のぶひろ）","1万石","外様","1615年（元和元年）","柳本県","織田有楽（長益）の所領の分与により成立。芝村藩と同系","Wikipedia"],["6","芝村藩","しばむらはん","大和国・奈良県（桜井市芝、芝村陣屋）","織田家：織田長易（おだ ながやす）","1万石","外様","1615年（元和元年）","芝村県","旧称は戒重藩。1745年に藩庁を戒重から芝村へ移して改称した。領地の一部は摂津国にも所在","Wikipedia"],["7","櫛羅藩","くじらはん","大和国・奈良県（御所市櫛羅、櫛羅陣屋）","永井家：永井直哉（ながい なおちか）※読みの食い違いは備考参照","1万石","譜代","1680年（延宝8年）","櫛羅県","旧称は大和新庄藩。立藩年は、永井家が1680年に大和で1万石を与えられて新庄藩となった年による。永井家は居所を新庄と公称し、1863年（文久3年）に櫛羅へ陣屋を移して櫛羅藩と改称した。永井直哉の読みは、コトバンク（講談社『デジタル版 日本人名大辞典+Plus』）が「なおちか」とする一方、Wikipedia「永井直哉」は「なおや〈なおちか〉」と併記する（食い違い）。また入封年は「櫛羅藩」記事が延宝8年（1680年）、コトバンク（小学館『日本大百科全書（ニッポニカ）』「櫛羅藩」）が天和1年（1681年）とする（食い違い）","Wikipedia"],["8","高取藩","たかとりはん","大和国・奈良県（高市郡高取町、高取城）","植村家：植村家壺（うえむら いえひろ）※読みは25章による","2万5000石","譜代","1640年（寛永17年）","高取県","本多家時代（1600〜1637年）があり、1640年に植村家政が入って再び立藩した。石高は2万5000石→2万500石→2万5000石と変遷","Wikipedia"],["9","田原本藩","たわらもとはん","大和国・奈良県（磯城郡田原本町、田原本陣屋）","平野家：平野長裕（ひらの ながひろ）","1万石","外様","1868年7月13日（慶応4年5月24日）","田原本県","維新立藩。江戸時代を通じては交代寄合（旗本）平野家の知行地であり、1868年に1万石の大名となって藩となった。立藩の日の換算根拠：慶応4年は閏4月のある年で、5月1日は新暦6月20日に当たる（裏取り：慶応4年5月15日＝新暦1868年7月4日、慶応4年閏4月29日＝新暦1868年6月19日。いずれもWikipedia「上野戦争」の換算による）。したがって慶応4年5月24日の新暦換算は1868年7月13日である。Wikipedia「田原本藩」「平野長裕」は立藩を7月14日とするが、これは換算の1日のずれであり、食い違いとして明記する。家格は、Wikipedia「交代寄合」が、平野家を含む維新立藩6家の立藩は外様であることを条件に認められたとする記述による。石高は同記事では10,001石とも記される","Wikipedia"]]}]},{"h":"【畿内】河内国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["10","丹南藩","たんなんはん","河内国・大阪府（松原市丹南、丹南陣屋）","高木家：高木正善（たかぎ まさよし）","1万石","譜代","1623年（元和9年）","丹南県","領地の一部は下野国にも所在。藩庁所在地について、辞典類に「現在の堺市美原区」とするものがあるが、陣屋のあった近世丹南村は松原市丹南にあたる（「丹南藩」記事の注釈）","Wikipedia"]]}]},{"h":"【畿内】和泉国（3藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["11","岸和田藩","きしわだはん","和泉国・大阪府（岸和田市、岸和田城）","岡部家：岡部長職（おかべ ながもと）","5万3000石","譜代","1600年（慶長5年）","岸和田県","立藩年は、関ヶ原の戦いの後に小出家の所領が安堵された1600年による（「岸和田藩」記事の歴代藩主表でも小出家を1600年〜1619年とする）。別説として、同記事の略史は「岸和田藩は天正13年（1585年）、豊臣秀吉の母方の叔父・小出秀政が岸和田城主に封ぜられたことに始まる」とし、26章（大阪府）も1585年を立藩年とする（章との食い違いの節に明記）。藩主家は小出家→松平（松井）家と替わり、1640年に岡部宣勝が入って以後は岡部家。石高は岡部家で6万石→5万3000石","Wikipedia"],["12","伯太藩","はかたはん","和泉国・大阪府（和泉市伯太町、伯太陣屋）","渡辺家：渡辺章綱（わたなべ あきつな）","1万3500石","譜代","1661年（寛文元年）","伯太県","旧称は野本藩（1661年〜）、大庭寺藩（1698年〜）。1727年に居所を伯太村へ移して伯太藩となった。渡辺吉綱が1661年に河内・和泉両国内で加増を受けて大名となったのが成立で、当初の居所については河内国大井に陣屋を置いた「大井藩」とする見解もある（「伯太藩」記事）","Wikipedia"],["13","吉見藩","よしみはん","和泉国・大阪府（泉南郡田尻町吉見、吉見陣屋）","遠藤家：遠藤胤城（えんどう たねき）","1万4500石","譜代（「吉見藩」記事は「旧譜代格」と記す）","1698年（元禄11年）","吉見県","1869〜1871年の移転・改称藩。立藩年は前身の近江三上藩の立藩年（1698年）による。1870年5月14日（明治3年4月14日）に藩庁を三上から和泉国吉見へ移して吉見藩と改称し、翌年の廃藩置県まで存続した（移転日の換算は32章（滋賀県）と一致する）","Wikipedia"]]}]},{"h":"【畿内】摂津国（4藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["14","高槻藩","たかつきはん","摂津国・大阪府（高槻市、高槻城）","永井家：永井直諒（ながい なおまさ）","3万6000石","譜代","1615年（元和元年）","高槻県","藩主家は内藤家→土岐家→松平家→岡部家→松平家と替わり、1649年に永井直清が入って以後は永井家","Wikipedia"],["15","麻田藩","あさだはん","摂津国・大阪府（豊中市蛍池、麻田陣屋）","青木家：青木重義（あおき しげよし）","1万石","外様","1615年（元和元年）","麻田県","立藩時は1万2000石で、1617年までの分知により1万石となった。存続期間の大部分で表高1万石。領地の一部は備中国にも所在","Wikipedia"],["16","三田藩","さんだはん","摂津国・兵庫県（三田市、三田陣屋）","九鬼家：九鬼隆義（くき たかよし）","3万6000石","外様","1601年（慶長6年）","三田県","1602年に一旦廃藩となり、1626年に松平重直が入って復活、1633年に九鬼久隆が鳥羽
