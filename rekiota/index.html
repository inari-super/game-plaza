","たつのけん","龍野藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["9","林田県","はやしだけん","林田藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["10","赤穂県","あこうけん","赤穂藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["11","安志県","あんじけん","安志藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["12","山崎県","やまさきけん","山崎藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["13","三日月県","みかづきけん","三日月藩","1871年8月29日（明治4年7月14日）","姫路県","1871年12月13日（明治4年11月2日）"],["14","生野県","いくのけん","幕府領（生野代官所）。府中裁判所→久美浜県の管轄を経て設置","1869年9月15日（明治2年8月10日）※廃藩置県以前から存在","豊岡県","1871年12月13日（明治4年11月2日）"],["15","出石県","いずしけん","出石藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"],["16","豊岡県（第1次）","とよおかけん","豊岡藩","1871年8月29日（明治4年7月14日）","豊岡県（第2次）へ統合","1871年12月13日（明治4年11月2日）"],["17","村岡県","むらおかけん","村岡藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"],["18","篠山県","ささやまけん","篠山藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"],["19","柏原県","かいばらけん","柏原藩","1871年8月29日（明治4年7月14日）","豊岡県","1871年12月13日（明治4年11月2日）"]]}]},{"h":"表2：第1次府県統合（1871年11月）で成立した4県と、その後の帰結","lv":2,"text":["兵庫県公式「県域の変遷」（c-1）は、廃藩置県で現県域に「30を超える県」が成立し、明治4年11月の全面改正で次の4県に編成されたとする。"],"tables":[{"cols":["県名","読み","管轄（出典 c-1 の記載）","その後"],"rows":[["兵庫県（第2次）","ひょうごけん","摂津の西部5郡","1876年8月21日に飾磨県ほかを併合し第3次兵庫県となる"],["飾磨県","しかまけん","播磨全域","1876年8月21日に兵庫県へ合併され廃止"],["豊岡県（第2次）","とよおかけん","但馬全域・丹後全域・丹波3郡","1876年8月21日に廃止・分割（但馬国と丹波国氷上郡・多紀郡は兵庫県へ、丹後国と丹波国天田郡は京都府へ）"],["名東県","みょうどうけん","阿波及び淡路全域","1876年8月21日に廃止・分割（阿波国は高知県へ、淡路国は兵庫県へ）"]]}]},{"h":"年表：兵庫県の設置から現在の県域の成立まで","lv":2,"text":[],"tables":[{"cols":["日付（新暦（旧暦））","出来事","出典"],"rows":[["1868年2月15日（慶応4年1月22日）","兵庫鎮台を設置","c-3"],["1868年2月24日（慶応4年2月2日）","兵庫裁判所に改称。摂津国185村・播磨国209村の幕府領と、摂津26村・播磨108村の旗本領を管轄（この時、初めて旧摂津国が大阪府と兵庫県に分割された）","c-3"],["1868年7月12日（慶応4年5月23日）","兵庫裁判所を廃止して兵庫県を設置（第1次兵庫県）。県庁は兵庫津に置かれたが、同年9月に坂本村へ新築移転したため、兵庫津に置かれた期間は約3～4か月だった","c-2、c-3"],["1869年7月17日（明治2年7月17日）※旧暦の日付","太政官布告により、府は京都・東京・大阪に限るとされた。兵庫県は県のまま存続した（この布告の日付は旧暦であり、新暦換算は出典に記載なし）","第4便で確認済みの布告。兵庫県側の出典での裏付けは未確認"],["1869年9月7日（明治2年8月2日）","豊崎県を兵庫県に編入。ただし同年10月25日（明治2年9月21日）、旧豊崎県のうち西成郡・東成郡・住吉郡を大阪府に移管","c-3"],["1870年5月","稲田騒動（庚午事変）で一時、淡路北部を管地とする。大阪府域にも管地があった（出典 c-1 は月までの記載）","c-1"],["1871年（明治4年）5月（6月18日-7月17日）","徳島藩稲田氏知行地の淡路国津名郡43か村浦を兵庫県に編入","c-3"],["1871年8月29日（明治4年7月14日）","廃藩置県。現県域の旧藩が県となる（表1）","c-8"],["1871年11月","第1次府県統合により4県に編成（表2）。兵庫県（第2次）は摂津の西部5郡（八部郡・菟原郡・武庫郡・川辺郡・有馬郡）を管轄","c-1、c-8"],["1871年12月13日（明治4年11月2日）","布告により、播磨国10県を統合して姫路県（第2次）が発足。また生野県・出石県・豊岡県・村岡県・篠山県・柏原県ほかを統合して豊岡県（第2次）が発足","c-5、c-6、c-8"],["1871年12月20日（明治4年11月9日）","姫路県が飾磨県に改称（参事・土肥実光の嘆願による。改称の理由について宮武外骨『府藩県制史』の説があるが、記事は「学説として認められたものではない」と明記）","c-6"],["1871年12月26日（明治4年11月15日）","布告により名東県が設置され、淡路国全域が名東県に編入された","c-3、c-7、c-8"],["1871年12月31日（明治4年11月20日）","大阪府・兵庫県に関する布告（法令全書・太政官布告第609号）。兵庫県の管轄は摂津国のうち八部郡・菟原郡・武庫郡・川辺郡・有馬郡とされた","c-8"],["1873年（明治6年）2月20日","名東県が香川県（第1次）を編入（1875年9月5日に香川県（第2次）として再分離）","c-7"],["1876年8月21日","第2次府県統合。兵庫県・飾磨県が統合され改めて兵庫県が発足（第3次兵庫県）。豊岡県のうち但馬国および丹波国氷上郡・多紀郡を、名東県のうち淡路国全域を兵庫県に移管し、ほぼ現在の県域が確定","c-1、c-3、c-5、c-7、c-8"]]}]},{"h":"1876年8月21日の再編の経緯（出典の記載どおり）","lv":2,"text":["- 兵庫県公式「県域の変遷」（c-1）：「櫻井勉（但馬出身）は、大久保利通に豊岡・鳥取統合を問われ飾磨との併合を進言したが『開港場である兵庫県の力を充実させるように考え直せ』と言われ第3次兵庫県の原案を作成」し、大久保は「一府県の増減に過ぎぬが…一挙両得」と評した、とされる。","- Wikipedia「桜井勉」（c-9）：内務卿・大久保利通が桜井勉に豊岡県と鳥取県の合併について意見を求めたところ、桜井は「但馬と因幡の間は山が険しく往来が不便であるため、鳥取県は島根県、豊岡県は飾磨県と合併させる方が適切である」と進言した。物産が豊かな飾磨県を兵庫県と合併させることを考えていた大久保が難色を示したため、豊岡県を二分し、丹後および丹波の天田郡を京都府、但馬および丹波の氷上郡・多紀郡を兵庫県に編入することを再提案し、この意見が取り入れられた、とされる。","- Wikipedia「豊岡県」（c-5）は出典として『豊岡市史 下巻』p.53-54を挙げ、同様の経緯を記す。"],"tables":[]},{"h":"照合結果（c）","lv":2,"text":["- 兵庫県公式サイトで照合できたもの：兵庫県の3期区分（第1次＝慶応4年・1868年5月、第2次＝明治4年11月〜明治9年7月、第3次＝明治9年8月〜）、第1次府県統合で4県に編成されたこと、1876年8月に飾磨県と豊岡・名東両県の一部が兵庫県に併合され「ほぼ現在の県域」が確定したこと（c-1）。ただし公式ページの日付は「明治4年11月」のように月までのものが多く、日単位の照合はできていない。","- 国立公文書館／JACARでの照合：JACARで太政類典（第2編・明治4年〜明治10年）の関連巻の存在は確認したが、1876年8月21日の府県統合や1871年11月の府県統合の布告本文には到達できず、未確認（照合未実施）。布告の日付・番号は「廃藩置県」記事（c-8）が引く『法令全書』の通番（例：明治4年太政官布告第609号）によるもので、原典そのものの確認はしていない。","- 豊岡県の統合日（明治4年11月2日）は、豊岡県の歴代長官である権令・小松彰の任期開始日（明治4年11月2日〜）とも一致する（c-5）。"],"tables":[]},{"h":"注記・食い違い（c）","lv":2,"text":["1. 統合で廃された県の数（食い違い）：兵庫県公式「県域の変遷」（c-1）は、廃藩置県で現県域に「30を超える県」が成立したと記す。一方、Wikipedia「廃藩置県」（c-8）の当初県一覧から現在の兵庫県域にあたる県を数えると19県（表1）であり、田辺眞人の講演要約（c-11）も「現兵庫県域には19県があった」とする。公式の「30を超える」の数え方（飛地を管轄した他県や、廃藩置県以前に存在した県を含むかどうか）は未確認であり、両者を併記する。","2. 第1次府県統合での兵庫県再発足の日（食い違い）：Wikipedia「兵庫県」（c-3）の県域の変遷は「明治4年7月14日（1871年8月29日）第1次府県統合により摂津国西部の3県が統合され改めて兵庫県発足」とするが、同記事の布告関係および「廃藩置県」記事（c-8）では、大阪府・兵庫県に関する布告は明治4年11月20日（1871年12月31日）であり、兵庫県公式（c-1）も「明治4年11月」とする。7月14日は廃藩置県の日そのものであり、本表では11月を採用し、7月14日説を併記する。","3. 櫻井の名前の表記（食い違い）：兵庫県公式「県域の変遷」（c-1）とWikipedia「豊岡県」（c-5）・「桜井勉」（c-9）は「櫻井勉／桜井勉」とするが、Wikipedia「兵庫県」（c-3）の概説は「櫻井努」と記す。公式の表記「櫻井勉」を本文に置き、「努」の表記を併記する。","4. 淡路国津名郡の帰属の細部（食い違い）：Wikipedia「名東県」（c-7）は、明治4年11月15日（1871年12月26日）の設置時に「兵庫県から淡路国津名郡を編入し、阿波国と淡路国を以って名東県が設置」されたとする。一方、「廃藩置県」記事（c-8）の名東県の項は「阿波国一円、淡路国一円（ただし、津名郡は5日後に兵庫県に編入された）」と記し、津名郡の移管の向きが逆になっている。どちらが正しいかは未確認であり、両者を併記する。なお名東県の記事には出典不十分のテンプレートが付されている。","5. 生野県の豊岡県への合併日（食い違いの可能性）：Wikipedia「豊岡県」（c-5）は生野県を含む統合を明治4年11月2日（1871年12月13日）とするが、「生野銀山の歴史」年表（朝来市・生野書院パンフレットに基づく、その他）は「1871.11.15 生野県は豊岡県に合併される」とする。布告日と実施日の区別によるものかどうかは未確認。","6. 表1の各県の読みのうち、兵庫県・豊岡県・飾磨県・姫路県・名東県は出典本文で確認した。その他の県の読みは各県名の一般的な読みを記したが、本調査では個別に出典で照合していない（未確認）。"],"tables":[]},{"h":"取得不可リスト（c）","lv":2,"text":["- JACAR（アジア歴史資料センター）の府県統合関係の布告本文：太政類典の関連巻（例：Ref. A07060000050「太政類典・第2編・明治4年〜明治10年・第96巻・地方2・行政区2」）の目次までは確認できたが、1871年11月および1876年8月21日の府県統合の布告本文には到達できなかった。よって国立公文書館所蔵資料による日付の照合は未実施。","- 国立公文書館デジタルアーカイブの『法令全書』本文：取得できず。布告番号はWikipedia「廃藩置県」の引用による間接確認にとどまる。","---"],"tables":[]}],"d":[{"h":"出典","lv":2,"text":[],"tables":[{"cols":["#","媒体","記事名／ページ名","URL","種別"],"rows":[["d-1","兵庫県公式サイト","よくあるご質問（Q2）","https://web.pref.hyogo.lg.jp/kk32/pa13_000000023.html","自治体"],["d-2","兵庫県公式サイト","県域の歴史","https://web.pref.hyogo.lg.jp/kk32/pa13_000000011.html","自治体"],["d-3","兵庫県公式サイト","兵庫県の歴史（キッズ）","https://web.pref.hyogo.lg.jp/ac02/kids_history.html","自治体"],["d-4","国土交通省 近畿地方整備局 兵庫国道事務所","兵庫の名前の由来","https://www.kkr.mlit.go.jp/hyogo/introduction/kankou/yurai/index.html","公的"],["d-5","Wikipedia","兵庫県","https://ja.wikipedia.org/wiki/兵庫県","Wikipedia"]]}]},{"h":"県名の由来（公的出典の記載）","lv":2,"text":["兵庫県公式「よくあるご質問」（d-1）の記載：","- 県名は、現在の神戸市兵庫区辺りを指す「兵庫」という地名に由来する。","- 兵庫津（現在の神戸港の一部）は開港場に指定された。","- 慶応4年（1868年）に兵庫鎮台が置かれ、間もなく兵庫裁判所となり、同年5月23日に兵庫県となった（この「5月23日」は旧暦の日付。新暦では1868年7月12日）。","- 県名に「兵庫」と冠したのは、役所が置かれた地が兵庫にあったからだと推測されている（公式ページ自身が推測と明記）。","Wikipedia「兵庫県」（d-5）の記載：県名の由来は、摂津国八部郡の兵庫津（現在の神戸市兵庫区）に初代県庁舎が置かれたことによる。なお、県庁舎は慶応4年9月に坂本村へ新築移転し、1873年（明治6年）5月には神戸町へ移転した。兵庫津は1879年1月8日に神戸区の一部となり、兵庫港は1892年10月1日に神戸港の一部となったが、県名は「兵庫」のまま現在に至る（d-5）。"],"tables":[]},{"h":"地名「兵庫」の語源（諸説・仮説）","lv":2,"text":["以下はすべて仮説であり、兵庫県公式サイト自身が「よくわかっていません」と明記している（d-1、d-2）。","地名としての「兵庫」の古さについては、兵庫県公式「県域の歴史」（d-2）が、平安時代に「大輪田の泊」と呼ばれた地が、鎌倉時代に「兵庫津」と呼ばれるようになったと記す。"],"tables":[{"cols":["説","内容","出典"],"rows":[["兵器の倉庫説","「かつて兵器の倉庫がそこに置かれていたために名付けられたのではないかとも考えられますが、よくわかっていません」（兵庫県公式FAQの文言どおり）","d-1、d-2（自治体）"],["つわものぐら説（国道事務所）","「兵庫県の『兵庫』は、兵器を格納する倉庫である『兵庫（つわものぐら）』にちなんでいます」「645年 大化の改新の際、播磨国境の須磨関を守るため現在の神戸市兵庫区周辺に兵器庫『兵庫』が作られる」","d-4（公的）"],["つわものぐら説（Wikipedia）","「天智天皇の治世に兵の武器庫という意味である『つわものぐら（兵庫）』があったことに由来」し、兵庫県旗と県章も「兵」の字を図案化したものである、とする","d-5（Wikipedia）"]]}]},{"h":"照合結果（d）","lv":2,"text":["- 県名が「兵庫」という地名（兵庫津）に由来し、慶応4年（1868年）5月23日（旧暦）に兵庫県が置かれたことは、兵庫県公式（d-1）とWikipedia（d-5）で一致する。","- 県庁所在地との関係（役所が兵庫に置かれたために「兵庫」を冠した）については、兵庫県公式自身が「推測」と明記しており、確定した経緯としては扱わない。"],"tables":[]},{"h":"注記・食い違い（d）","lv":2,"text":["1. 語源の扱いの差（食い違い）：兵器庫「兵庫（つわものぐら）」に由来するという説について、兵庫県公式（d-1、d-2）は「よくわかっていません」とする一方、国土交通省兵庫国道事務所（d-4）は「ちなんでいます」と断定調で記し、645年（大化の改新の際）という具体的な年代まで挙げる。公的機関の間でも表現が異なるため、本項では仮説として併記し、県公式の「未詳」の立場を本文に置く。","2. つわものぐら説の年代についても、d-4は「645年」、d-5は「天智天皇の治世」（661〜671年）としており、一致しない。いずれも仮説の範囲であり、どちらかに決めない。","3. 兵庫県設置の日付「5月23日」は旧暦（慶応4年5月23日）であり、新暦では1868年7月12日である。兵庫県公式ページ（d-1）は旧暦の日付をそのまま記しているため、引用の際は暦の種別に注意すること。"],"tables":[]},{"h":"取得不可リスト（d）","lv":2,"text":["- なし（兵庫県公式サイトに県名の由来の説明ページが存在し、取得できた）。","---"],"tables":[]}],"e":[{"h":"出典","lv":2,"text":["- ユネスコ世界遺産センター「Himeji-jo」https://whc.unesco.org/en/list/661/ （公的）","- ユネスコ世界遺産センター「World Heritage List」一覧表（Himeji-jo、ID 661、1993年、107 ha）https://whc.unesco.org/en/list/?id_states=jp,kp,kr,mn&mode=table&order=country （公的）","- ユネスコ／ICOMOS評価書「Himeji-jo 661」https://whc.unesco.org/document/153975 （公的。検索結果の抜粋で確認）","- 姫路市公式「姫路城管理運営業務要求水準書」（令和8年8月、姫路城管理事務所）https://www.city.himeji.lg.jp//sangyo/cmsfiles/contents/0000033/33651/youkyusuijunhosoku2.pdf （自治体）","- 姫路市公式「第2章 姫路市の市勢」（資料：文化庁「国指定文化財等データベース」、令和6年3月現在）https://www.city.himeji.lg.jp/sangyo/cmsfiles/contents/0000003/3339/himeji_mp02.pdf （自治体）","- 姫路市公式「特別史跡姫路城跡保存活用計画 第1章」https://www.city.himeji.lg.jp/kanko/cmsfiles/contents/0000030/30274/chapter1.pdf （自治体）","- 兵庫県庁資料「史跡明石城跡の概要」（出典：文化庁文化財部監修『月刊文化財』平成16年8月号491号）https://web.pref.hyogo.lg.jp/ks24/documents/siryo-02.pdf （自治体／公的）","- 文化遺産データベース「明石城跡」https://bunka.nii.ac.jp/db/heritages/detail/173925 （公的）","- 兵庫県立歴史博物館（兵庫県教育委員会）「名所めぐり：竹田城跡」https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_sanindo/takedajo/ （自治体）","- 赤穂城跡パンフレット（赤穂市立歴史博物館所蔵資料、赤穂観光協会）https://ako-kankou.jp/wp-content/uploads/2020/02/booklet_AkoCastleRuins_202002.pdf （自治体）","- 洲本市公式「史跡洲本城跡整備基本計画（概要版）」（自治体）","- 兵庫県教育委員会『三田城跡発掘調査報告書』ほか三田城跡調査報告（奈良文化財研究所 遺跡データベース経由）https://sitereports.nabunken.go.jp/files/attach/26/26283/19245_1_%E4%B8%89%E7%94%B0%E5%9F%8E%E8%B7%A1.pdf （公的）","- Wikipedia「姫路城」「現存天守」https://ja.wikipedia.org/wiki/%E7%8F%BE%E5%AD%98%E5%A4%A9%E5%AE%88 「明石城」「赤穂城」https://ja.wikipedia.org/wiki/%E8%B5%A4%E7%A9%82%E5%9F%8E 「竹田城」ほか各城記事（Wikipedia）","- Weblio辞書（Wikipedia各城記事の転載）「三田城」https://www.weblio.jp/content/%E4%B8%89%E7%94%B0%E5%9F%8E ほか（Wikipedia）","- コトバンク「明石城」（小学館『デジタル大辞泉』、講談社『日本の城がわかる事典』等）https://kotobank.jp/word/%E6%98%8E%E7%9F%B3%E5%9F%8E-179644 （その他（事典））","- ニッポン城めぐり「尼崎城」https://cmeg.jp/a/castles/5663 （その他（城郭情報サイト、Wikipedia基礎情報を転載））"],"tables":[]},{"h":"表","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","築城者","築城年","廃城年または現状","現存・再建建物","出典の種別"],"rows":[["1","姫路城","ひめじじょう","赤松貞範（大改築：池田輝政）","1346年（正平元年／貞和2年）※諸説あり（注記参照）","1871年（明治4年）に廃城とする一覧あり。ただし存城として存続し、天守群は現存","大天守・東小天守・西小天守・乾小天守・イ・ロ・ハ・ニの渡櫓の8棟が国宝として現存。櫓・門・塀等74棟が重要文化財として現存","公的・自治体・Wikipedia"],["2","明石城","あかしじょう","小笠原忠真","1618年（元和4年）※着工1619年・完成1620年の公的資料あり（注記参照）","1874年（明治7年）※1869年説あり（注記参照）","天守は築かれず（天守台のみ）。巽櫓・坤櫓が現存（重要文化財）。石垣・堀現存","公的・自治体・Wikipedia"],["3","赤穂城","あこうじょう","浅野長直","1648年（慶安元年）〜1661年（寛文元年）","1873年（明治6年）※1872年廃城決定とする市資料あり（注記参照）","天守は築かれず（天守台のみ）。建物は現存せず、櫓・門を再建。本丸庭園・二之丸庭園あり","Wikipedia・自治体"],["4","竹田城","たけだじょう","山名宗全（持豊）","1431年（永享3年）※1443年（嘉吉3年）の伝承あり（注記参照）","1600年（慶長5年）","建物は現存せず。石垣がほぼそのままの状態で残る","Wikipedia・自治体"],["5","出石城","いずしじょう","小出吉英","1604年（慶長9年）","1868年（明治元年、城郭建築撤去）※1871年とする資料あり（注記参照）","建物は現存せず。隅櫓・登城門・登城橋を復元。石垣・堀現存","Wikipedia・その他"],["6","篠山城","ささやまじょう","徳川家康（縄張：藤堂高虎、普請総奉行：池田輝政）","1609年（慶長14年）","1871年（明治4年）","天守は築かれず（天守台のみ）。大書院を木造復元（2000年）。石垣・堀現存","Wikipedia"],["7","洲本城","すもとじょう","安宅氏（伝：安宅治興）","1526年（大永6年）と伝わる","1609年（慶長14年）に事実上の廃城（注記参照）","建物は現存せず。模擬天守（1928年築、鉄筋コンクリート造）。石垣・登り石垣現存","自治体・Wikipedia"],["8","龍野城","たつのじょう","赤松村秀","1499年（明応8年）※1500年頃とする資料あり（注記参照）","1871年（明治4年）","建物は現存せず。本丸御殿・隅櫓・埋門・多聞櫓を再建。石垣現存","Wikipedia・その他"],["9","三木城","みきじょう","別所則治","1492年（明応元年）前後※諸説あり（注記参照）","1615年（元和元年）※1616年・1617年説あり（注記参照）","建物は現存せず。天守台の土壇・井戸が残る","Wikipedia"],["10","三田城","さんだじょう","摂津有馬氏","不明（多説あり）","1649年（慶安2年）※陣屋として存続し1873年廃城令で廃城とする資料あり（注記参照）","建物は現存せず。内堀が残る","Wikipedia・公的"],["11","尼崎城","あまがさきじょう","戸田氏鉄","1617年（元和3年）※着工1618年とする資料あり（注記参照）","1873年（明治6年）","建物は現存せず。外観復元天守（2018年完成、鉄筋コンクリート造）。石垣は埋蔵","Wikipedia・その他"]]}]},{"h":"城ごとの注記","lv":2,"text":[],"tables":[]},{"h":"1. 姫路城","lv":3,"text":["- 別名は白鷺城。読みは「はくろじょう」「しらさぎじょう」の両方がWikipedia記事にあり、姫路市公式資料は「白鷺城（しらさぎじょう）」と記す。ユネスコ公式ページは英語名として \"Shirasagi-jo (White Heron Castle)\" と記す。","- 指定・登録の年次（姫路市公式資料で照合）：","- 国宝：1951年（昭和26年）6月9日、文化財保護法に基づき指定。国宝8棟は大天守・東小天守・西小天守・乾小天守・イ、ロ、ハ、ニの渡櫓（姫路市公式「姫路城管理運営業務要求水準書」、および文化庁「国指定文化財等データベース」を資料とする姫路市公式「市勢」）。","- 重要文化財：74棟。1931年（昭和6年）12月14日に国宝保存法に基づく当時の国宝として指定され、文化財保護法により重要文化財となった（姫路市公式「姫路城管理運営業務要求水準書」）。","- 特別史跡：1956年（昭和31年）に姫路城跡が特別史跡に指定された（姫路市公式「特別史跡姫路城跡保存活用計画 第1章」に「昭和26年（1951）に大天守など8棟の建造物が国宝に、昭和31年（1956）には中曲輪の一部を除く区域が特別史跡に指定」とある）。","- 世界遺産：登録年月日は1993年（平成5年）12月11日（姫路市公式）。ユネスコ世界遺産一覧表では「Himeji-jo、ID 661、1993年、面積107 ha」。登録基準は（i）（iv）（ユネスコ「New Inscribed Properties (17COM)」およびユネスコ公式ページの Criterion (i)・(iv) の記載）。法隆寺地域の仏教建造物とともに日本初の世界文化遺産（姫路市公式）。","- 史蹟指定：1928年（昭和3年）に史蹟に指定とする資料がある一方、ICOMOS評価書は \"designated an Historic Site in 1929\" と記しており、1年の食い違いがある（後述）。","- ユネスコ公式ページの記載：\"Himeji-jo is the finest surviving example of early 17th-century Japanese castle architecture.\"（17世紀初頭の日本の城郭建築の現存する最良の例、という趣旨の原文）。資産は107ヘクタール、82棟の建造物からなると記す。建造物と城跡は1950年の文化財保護法のもと国宝・重要文化財・特別史跡として保護されていると記す。","- 建造物数の検算：国宝8棟＋重要文化財74棟＝82棟で、ユネスコ公式ページの「82 buildings」と一致する。一方、ICOMOS評価書（1993年）は \"comprising 83 buildings in total\" と記しており、1棟の差がある（後述）。","- 築城の経緯：Wikipedia基礎情報は築城主を赤松貞範、築城年を1346年とするが、記事本文には、城郭としての本格的な築城は黒田重隆・職隆による1555〜1561年の拡張とする説も併記されている。池田輝政による大改築は1601〜1609年。","- 天守の建造年：Wikipedia「現存天守」は姫路城の天守建造年を1608年（慶長13年）とする。一方、大改築の完成を1609年とする資料が複数ある（後述）。","- 廃城年：Wikipedia「現存天守」の姫路城の項は「1346年築城 - 1871年（明治4年）廃城」と記す。姫路城自体の記事の基礎情報には廃城年の記載がなく、明治期に競売にかけられたが権利が放棄され、陸軍の使用を経て保存された経緯が記されている。"],"tables":[]},{"h":"2. 明石城","lv":3,"text":["- 別名は喜春城（きはるじょう、きしゅん-）、錦江城（きんこうじょう）（Wikipedia）。","- 指定：城跡は国の史跡（2004年（平成16年）9月30日、文部科学省告示第142号、指定面積273,771.50㎡。兵庫県庁資料）。巽櫓・坤櫓は国の重要文化財（1957年（昭和32年）6月18日指定。兵庫県庁資料に官報告示の転載あり）。","- 築城年について：Wikipedia基礎情報は1618年（元和4年）。文化庁の文化遺産データベース「明石城跡」は、元和5年（1619年）正月に石垣普請が開始され、元和6年（1620年）4月に造営を終えたと記す。1957年の重要文化財指定説明（官報告示、兵庫県庁資料に転載）は「明石城は元和三年（一六一七）小笠原忠真のため、岳父本多忠政（姫路城主）が築いたと伝えられる」と記す。小学館『デジタル大辞泉』は「元和4年（1618）小笠原忠真が新築、元和6年（1620）完成」とする。1617年は小笠原忠真の入封と築城命令の年である。","- 天守は計画されたが建てられなかった。本丸四隅に三重櫓4基（艮・巽・坤・乾）が建てられ、東南隅の巽櫓と南西隅の坤櫓が現存する。巽櫓は船上城から、坤櫓は伏見城から移築されたと伝えられ、1982年（昭和57年）の改修工事で移築と判明したとWikipedia記事は記す。"],"tables":[]},{"h":"3. 赤穂城","lv":3,"text":["- 別名は加里屋城。前身として池田長政による掻上城（1600年築と伝わる）があるとする資料がある。","- 築城期間の検算：1648年から1661年までは13年で、記事および赤穂市立歴史博物館所蔵資料に基づくパンフレットの「13年を費やして完成」と一致する。","- 指定：城郭は国の史跡（1971年（昭和46年）指定）、本丸庭園・二之丸庭園は国の名勝「旧赤穂城庭園」（2002年（平成14年）指定）（Wikipedia、赤穂城跡パンフレット）。","- 天守台は築かれたが、幕府の許可が下りず天守は築かれなかった（日本100名城公式ガイドブックを出典とする転載資料）。","- 本丸門は1992〜1996年に復元された。"],"tables":[]},{"h":"4. 竹田城","lv":3,"text":["- 別名は虎臥城。読みは「とらふすじょう」「こがじょう」の両方が資料にある。","- 指定：国の史跡（1943年（昭和18年）9月8日指定。Wikipedia）。","- 築城年について：Wikipedia基礎情報は1431年（永享3年）、築城主・山名宗全とする。一方、記事本文が紹介する『史跡・竹田城』の伝承では、嘉吉3年（1443年）に山名持豊（宗全）によって築かれ、太田垣光景が初代城主とされるが、これは口碑のみである。『和田上道氏日記』は嘉吉年間（1441〜1443年）に「安井ノ城」が築かれたと記す。朝来市公式サイト（二次資料が引用）は嘉吉年間（1441〜1443年）頃に山名持豊（宗全）が太田垣氏に築かせたと記す。","- 兵庫県立歴史博物館のページは「1433（嘉吉3）年に但馬国守護山名宗全（そうぜん）が13年かけて築かせた城といわれている」と記す。嘉吉3年は1443年であり、同ページの西暦「1433」とは一致しない（原文のまま転記）。","- 落城年について：兵庫県立歴史博物館は1577年（天正5年）落城と記し、朝来市公式（二次資料が引用）は1580年（天正8年）の秀吉の但馬侵攻で落城と記す。最後の城主・赤松広秀（県立歴史博物館は「赤松広英」と表記）が1600年に自害し、廃城となった点は各資料で一致する。","- Wikipedia記事の文言：「廃城から約400年を経ているが、石垣がほぼそのままの状態で残っており、現存する山城として日本屈指の規模となっている」。"],"tables":[]},{"h":"5. 出石城","lv":3,"text":["- 別名は高城。","- 指定：豊岡市指定史跡（「出石城跡（平城）」、1968年3月30日指定）。国指定ではない。有子山城とあわせて続日本100名城162番。","- 廃城年について：城郭建築の撤去は1868年（明治元年）に新政府の許可を得て行われ、同年10月までに全ての建物が解体された（Wikipedia記事本文）。基礎情報の廃城年も1868年（城郭建築撤去）とするが、1871年（明治4年）とする城郭情報サイトもある（後述）。","- 辰鼓櫓について：現存とする城郭情報サイトがあるが、別の資料では、辰鼓櫓は1871年に城の資材で建てられた時計台であるとされる。未確認。","- 有子山城は山名祐豊が1574年（天正2年）に築き、出石城の築城（1604年）に伴い廃された。"],"tables":[]},{"h":"6. 篠山城","lv":3,"text":["- 築城は天下普請で、15か国20大名が動員され、6か月で完成したとWikipedia記事は記す。","- 指定：国の史跡（1956年（昭和31年）12月28日、「篠山城跡」として指定。Wikipedia）。","- 天守は築かれず、天守台のみ。大書院は1873年以降の城郭取払いを免れたが1944年1月6日に火災で焼失し、2000年（平成12年）4月に木造復元が完成した。"],"tables":[]},{"h":"7. 洲本城","lv":3,"text":["- 洲本市公式「史跡洲本城跡整備基本計画（概要版）」の記載：安宅氏（淡路水軍）が築き、1585年（天正13年）に入った脇坂安治が総石垣の城に改修し、二条の登り石垣を築いた。1609年（慶長14年）の脇坂氏の伊予大洲への転封により事実上の廃城となった。","- 指定：山上の「上の城」は国の史跡（1999年（平成11年）指定）、山麓の「下の城」は洲本市指定史跡。政庁は1631〜1635年の由良引けの後、1642年（寛永19年）に山麓へ移った。徳島藩の稲田氏が洲本城代を務めた。","- 築城年は1526年（大永6年）に安宅治興が築いたと伝わるとする二次資料がある（公的出典では未確認）。","- 模擬天守は1928年（昭和天皇即位記念、鉄筋コンクリート造）。「日本最古の模擬天守」と記す二次資料があるが、公的出典では未確認。"],"tables":[]},{"h":"8. 龍野城","lv":3,"text":["- 別名は霞城。","- 鶏籠山山頂の城（龍野古城）が1499年に築かれ、1658年に破却された。1672年（寛文12年）に脇坂安政が山麓に陣屋形式で再建し、天守は築かれなかった。建物は1871年に解体された。本丸御殿は1979年（昭和54年）に再建され、隅櫓・埋門・多聞櫓は1975年以降に再建された。","- 国指定・県指定・市指定の別は、今回確認した出典では未確認。"],"tables":[]},{"h":"9. 三木城","lv":3,"text":["- 別名は釜山城・別所城。","- Wikipedia記事は、播磨三大城の一つとして御着城・英賀城とともに挙げる文言がある（記事の表現のまま）。","- 築城時期は諸説あってはっきりしないと記事自体が記す。基礎情報は「長享2年（1492年）前後」とするが、長享2年は1488年であり、記事本文が引く『三木戦史』は「明応元年（1492年）九月三木ノ釜山城ヲ築キテ」と記す。基礎情報の元号表記と西暦は一致しない（原文のまま転記）。","- 指定：国の史跡「三木城跡及び付城跡・土塁」。"],"tables":[]},{"h":"10. 三田城","lv":3,"text":["- 別名は三田陣屋、車瀬城、三田古城（Weblio転載のWikipedia基礎情報）。","- 築城時期は多説あり、どの説が正しいのかは不明である（Wikipedia記事）。『三田城史』は車瀬城を築いたのを有馬村秀とし、『三田市史』は有馬則景が車瀬に居館を造ったのが始まりとする（同記事）。","- 兵庫県教育委員会の発掘調査報告書は、三田城は南北朝時代に赤松円心の四男氏範が基礎を築いたとする説などがあり明らかでないこと、城として整備された時期が判明しているのは天正年間に荒木氏が支配を始めてからであること、九鬼氏は従来の三田城を廃して古城とし城域の南部と西部を三田陣屋として整備したこと、その後明治4年（1871）まで九鬼氏が三田藩主として支配したことを記す。","- 廃城年について：Wikipedia基礎情報は1649年（慶安2年）とする。一方、九鬼氏が明治6年（1873年）の廃城令で廃城となったと記す二次資料がある（後述）。"],"tables":[]},{"h":"11. 尼崎城","lv":3,"text":["- 天守は複合式層塔型4重4階で1618年築と城郭情報サイトは記す（天守構造の項）。築城年については元和3年（1617年）に戸田氏鉄が入封し築いたとするWikipedia本文と、元和4年（1618年）の春から築城が開始されたとする資料がある（後述）。","- 1873年（明治6年）の廃城令により建物は一部を除き取り壊された。本丸御殿の一部「金之間」は1874年（明治7年）に深正院へ移築されたが、戦災で焼失した。","- 外観復元天守は、資産家の寄贈により2018年（平成30年）に尼崎城址公園内に完成し、2019年3月29日に一般公開が始まった。鉄筋コンクリート造、地上5階建て。","- 国指定・県指定・市指定の別は、今回確認した出典では未確認（「尼崎城分間絵図」が尼崎市指定文化財である旨の記載は城郭情報サイトにある）。"],"tables":[]},{"h":"現存天守の確認結果","lv":2,"text":["- Wikipedia「現存天守」は、現存天守を「日本の城の天守のうち、江戸時代またはそれ以前に建設され、現代まで保存されている天守」と定義し、12の天守が現存すると記す。現存12天守は、弘前城（青森県）、松本城（長野県）、丸岡城（福井県）、犬山城（愛知県）、彦根城（滋賀県）、姫路城（兵庫県）、松江城（島根県）、備中松山城（岡山県）、丸亀城（香川県）、松山城（愛媛県）、宇和島城（愛媛県）、高知城（高知県）である。","- この12城のうち兵庫県内は姫路城のみであり、兵庫県内の現存天守は姫路城のみであることが確認できた。","- 同記事は、12城の天守はいずれも文化財保護法に基づいて重要文化財に指定され、このうち松本城、犬山城、彦根城、姫路城、松江城の五つの天守は国宝に指定されていると記し、この5城を「国宝五城」と呼ぶ（国宝城郭都市観光協議会による名称）と記す。","- 姫路城の天守について同記事は「日本国内最大の現存天守」と記す。"],"tables":[]},{"h":"注記・食い違い（e）","lv":2,"text":["- 【姫路城・築城年】Wikipedia基礎情報は1346年（赤松貞範）とするが、記事本文には黒田重隆・職隆による1555〜1561年の拡張を本格的な築城とする説も併記されている。食い違いとして併記する。","- 【姫路城・天守建造年】Wikipedia「現存天守」は1608年（慶長13年）とするが、池田輝政の大改築の完成を1609年とする資料が複数ある。食い違いとして併記する。","- 【姫路城・史蹟指定年】1928年とする資料と、ICOMOS評価書の1929年の記載がある。食い違いとして併記する。","- 【姫路城・建造物数】ユネスコ公式ページは82棟とし、国宝8棟＋重要文化財74棟＝82棟と一致する。ICOMOS評価書は83棟と記す。食い違いとして併記する。","- 【姫路城・重要文化財の内訳】Wikipedia基礎情報は「櫓・渡櫓27棟、門15棟、塀32棟」（計74棟）とする。姫路市公式「姫路城管理運営業務要求水準書」は「櫓27棟、門15棟、塀42棟」と記すが、この内訳の合計は84棟となり、74棟と一致しない。内訳の表記に食い違いがある。","- 【明石城・築城年】1617年（入封・築城命令の年、重要文化財指定説明は「築いたと伝えられる」とする）、1618年（Wikipedia基礎情報、『デジタル大辞泉』）、1619年着工・1620年完成（文化庁 文化遺産データベース）の記載がある。食い違いとして併記する。","- 【明石城・廃城年】Wikipedia基礎情報は1874年（明治7年）とするが、講談社『日本の城がわかる事典』は「明石城は1869年（明治2年）に廃城となった」と記す。食い違いとして併記する。","- 【赤穂城・廃城年】Wikipedia基礎情報は1873年（明治6年）とするが、赤穂市立歴史博物館所蔵資料に基づくパンフレットは「明治5年（1872年）赤穂城廃城決定、明治11年解体開始」と記す。食い違いとして併記する。","- 【竹田城・築城年】Wikipedia基礎情報の1431年（永享3年）と、伝承・朝来市公式の1443年（嘉吉3年）・嘉吉年間（1441〜1443年）の記載がある。食い違いとして併記する。","- 【竹田城・県立歴史博物館の年表記】兵庫県立歴史博物館は「1433（嘉吉3）年」と記すが、嘉吉3年は1443年であり、同ページ内で西暦と元号が一致しない。原文のまま転記した。","- 【竹田城・落城年】1577年（兵庫県立歴史博物館）と1580年（朝来市公式）の記載がある。食い違いとして併記する。また最後の城主の名は「赤松広秀」（Wikipedia）と「赤松広英」（兵庫県立歴史博物館）の表記の差がある。","- 【出石城・廃城年】1868年（城郭建築撤去。Wikipedia）と1871年（明治4年。城郭情報サイト）の記載がある。食い違いとして併記する。","- 【洲本城・築城年】1526年（大永6年）に安宅治興が築いたと伝わるとする記載は二次資料によるもので、洲本市公式の整備基本計画では築城年を確認できなかった。未確認。","- 【龍野城・築城年】1499年（明応8年。Wikipedia基礎情報）と1500年（明応9年）頃とする資料がある。また明応4年と記して1499年とする資料があるが、明応4年は1495年であり一致しない。食い違いとして併記する。","- 【三木城・築城年】基礎情報の「長享2年（1492年）前後」は、長享2年が1488年であるため元号と西暦が一致しない。記事本文の引く『三木戦史』は明応元年（1492年）とする。記事自体が築城時期は諸説あってはっきりしないと記す。","- 【三木城・廃城年】1615年（元和元年。基礎情報および一国一城令による破却とする本文）、1616年（元和2年）、1617年（元和3年。記事の略年表）の記載がある。食い違いとして併記する。","- 【三田城・廃城年】Wikipedia基礎情報は1649年（慶安2年）とするが、九鬼氏時代の三田陣屋は明治4年（1871年）まで存続し（兵庫県教育委員会発掘調査報告書）、明治6年（1873年）の廃城令で廃城となったと記す二次資料がある。城としての廃城と陣屋の存続は分けて併記する。","- 【尼崎城・築城年】1617年（元和3年）に戸田氏鉄が入封し築いたとする記載（Wikipedia本文）と、1618年（元和4年）春から築城開始とする資料がある。食い違いとして併記する。","- 【検算】赤穂城の築城期間「13年」は1648〜1661年の差（13年）と一致する。姫路城の池田輝政による大改築「8年」は1601〜1609年の差（8年）と一致する。その他の城では、出典に年数の記載を確認できなかった。"],"tables":[]},{"h":"取得不可リスト（e）","lv":2,"text":["- 文化遺産オンライン／文化庁「国指定文化財等データベース」の姫路城建造物（国宝・重要文化財）の個別レコード：直接取得できなかった。指定年月日は、姫路市公式資料（同データベースを資料として明記）経由で確認した。","- 龍野城の文化財指定の別（国・県・市）：市の公式ページ等で確認できず、未確認。","- 尼崎城の文化財指定の別（国・県・市）：尼崎市公式ページで確認できず、未確認。","- 洲本城の築城年（1526年・安宅治興）：洲本市公式資料では確認できず、二次資料のみ。未確認。","- 出石城の辰鼓櫓の現存扱い：出典により記載が分かれ、公的出典で確認できなかった。未確認。","---"],"tables":[]}],"f":[{"h":"f-1 江戸時代","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- コトバンク「灘五郷」（改訂新版 世界大百科事典・平凡社） https://kotobank.jp/word/%E7%81%98%E4%BA%94%E9%83%B7-588839 （種別：その他（辞典））","- 近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、種別：公的）※揖保乃糸・淡路島手延べそうめんの「地域との結びつき」「特性」欄","- 農林水産省「うちの郷土料理 出石皿そば 兵庫県」 https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/40_10_hyogo.html （種別：公的）","- 農林水産省「丹波篠山の黒大豆栽培」（日本農業遺産認定資料） https://www.maff.go.jp/j/nousin/kantai/attach/pdf/giahs_3_sasayama-5.pdf （種別：公的）","- 農林水産省「明石鯛 地理的表示登録申請 明細書」（令和7年3月15日付） https://www.maff.go.jp/j/shokusan/gi_act/notice/pnApplication/pdf/0302_specification.pdf （種別：公的）","- 兵庫県公式「北播磨地域 景観資源データベース【西脇市】」 http://web.pref.hyogo.lg.jp/nhk09/documents/database_nishiwaki.pdf （種別：自治体。播州織の項の出典は西脇市HPと明記）","- 関西広域連合「活かしたい自然エリア エコツアー報告書（北摂・南丹）」 https://www.kouiki-kansai.jp/material/files/group/10/ecotour-report_16.pdf （種別：公的）※一庫炭の解説は川西市史2・3巻による","- Wikipedia「菊炭」 https://ja.wikipedia.org/wiki/%E8%8F%8A%E7%82%AD （種別：Wikipedia）"],"tables":[]},{"h":"表","lv":3,"text":[],"tables":[{"cols":["番号","品目","読み","産地","備考（出典の引用）","出典の種別"],"rows":[["1","灘の酒（灘五郷）","なだごごう","西宮市・神戸市東灘区・灘区の沿岸部（摂津国西部）","「灘五郷とは灘の生一本（きいつぽん）の銘醸地の総称で，江戸時代の中期以降より急速に江戸積酒造業が発展し，今日にいたるまで全国有数の酒造地を形成している」「宮水（みやみず）と呼ばれる酒造に好適な地下水の発見（1840）は，灘の酒の品質を大いに高めた」「文化・文政期（1804-30）の最盛期には……摂泉十二郷の江戸入津樽数は100万樽を突破したが，このうち灘五郷で50%以上を占めていた」（世界大百科事典）。なお江戸時代の灘五郷の構成は現在の5郷（今津・西宮・魚崎・御影・西郷）と異なり、上灘三組・下灘・今津であったと同辞典は記す（注記参照）","その他（辞典）"],["2","揖保乃糸（手延べそうめん）","イボノイト","兵庫県（揖保川流域）","「生産地では、揖保川流域の肥沃な土壌を背景に、小麦と水車製粉による小麦粉の生産が盛んであった上、近隣の良質な赤穂塩の入手が容易であったため、古くから素麺作りが行われてきた。約600年に渡る『手延製法』と、『厄』と呼ばれる専用倉庫での熟成方法など、特有の製法を受け継いできた。明治27年には、統一基準による製品検査と等級分けを導入し……生産地を流れる揖保川の名に因んだ『揖保乃糸』に名称を統一した」（近畿農政局GIページ）。「揖保乃糸」の名称自体は明治27年の統一によるもので、江戸時代の時点の名称ではない","公的"],["3","淡路島手延べそうめん","アワジシマテノベソウメン","兵庫県南あわじ市","「原材料の配合や麺の熟成時間だけでなく、麺を延ばす最終工程である『門干し』の方法、さらには製造時期を限定するなど、品質向上のための独自の製法が江戸時代から継承されている」「江戸時代から続けられてきた天日干しの風景は『白糸の芸術』と言われ」（近畿農政局GIページ）","公的"],["4","出石皿そば","いずしさらそば","兵庫県豊岡市出石町","「始まりは、1706年（宝永3年）、信州（長野県）上田から国替えで来た藩主仙石政明（まさあきら）が連れてきたそば職人から。それ以前からあったそば打ち技術に新たな技術が加わり、以来300年以上、改良を加えながら職人の鍛錬によって発展してきた」（農林水産省「うちの郷土料理」）。そばを盛る小皿は出石焼の白磁で直径約13cm、5枚1組が一人前と同ページにある","公的"],["5","丹波黒大豆（丹波篠山の黒大豆）","読みは今回の出典に明記なし（未確認）","丹波篠山地域（現・丹波篠山市）","農林水産省の日本農業遺産資料によれば、「名称に確実に『黒豆』との記述が確認できる最も古い史料は享保15年（1730）刊行の料理本『料理網目調味抄』であり、『くろ豆は丹州笹山の名物なり』『黒豆 丹州笹山よし 押て汁煮染』と記されている」。また享保元年（1716）刊行の地誌『篠山封彊志』にも「黎豆（くろまめ）」が土産のひとつとして記述されている。優良種子生産方式の始まりは江戸時代後期にまで遡り、大庄屋・波部本次郎らが優良な種子を選抜育成した（丹波篠山市のプレスリリースによる）","公的／自治体"],["6","明石鯛","アカシダイ、アカシタイ（明細書の表記）","明石海峡及び明石沖（播磨国明石浦）","農林水産省に提出されたGI登録申請の明細書によれば、「『和漢三才図絵』（1712）、『日本山海名産図絵』（1799）などでも『播州明石浦の産』として紹介されている」「江戸時代には、明石藩主が将軍家に対し、鯛粕漬・生鯛・干鯛を季節の産物として献上していた記録もある」。また『播州名所巡覧図絵』（1804）に、天正9年（1581年）に羽柴秀吉が織田信長に「あかし干鯛千箇」を歳暮として献上したと伝えられる旨の記載があるとする","公的"],["7","播州織（起源）","ばんしゅうおり","西脇市を中心とする北播磨地域","兵庫県の景観資源データベース（出典：西脇市HP）によれば、「『播州織（ばんしゅうおり）』は西脇市を代表する地場産業であり、200年以上の歴史と伝統を誇る。江戸時代中期の寛政4年（1792）に比延庄村の宮大工飛田安兵衛（ひだやすべえ）が京都西陣から織物の技術を持ち帰ったのが起源と伝えられている。その後、農家の副業として、西脇市を中心に北播磨地域で生産されたため、当初は『播州縞（ばんしゅうしま）』と呼ばれていたが、明治時代後期に『播州織』と称されるようになった」。江戸時代の時点の呼称は「播州縞」である","自治体"],["8","菊炭（池田炭・一庫炭）","きくすみ（Wikipedia）。池田炭の読みは出典に明記なし（未確認）","川西市北部の一庫以北・黒川地区（旧摂津国。集荷地は池田）","関西広域連合の報告書（川西市史2・3巻による）によれば、「初めて文献にその名が現れたのは正保2年（1645年）に発刊された『毛吹草』です。『一庫炭…此所より池田の市に出て売なり故に是を池田炭共云』と記されています」。Wikipedia「菊炭」は「北摂地域で作られたクヌギの菊炭は『池田炭』と呼ばれ、茶の湯炭として著名だった」とする","公的／Wikipedia"]]}]},{"h":"f-2 現代","lv":2,"text":[],"tables":[]},{"h":"（1）経済産業大臣指定 伝統的工芸品","lv":3,"text":["出典：伝統的工芸品産業振興協会「伝統的工芸品指定品目一覧・都道府県別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-area_20251027.pdf （2025／令和7年10月27日現在、全国合計244品目、取得日2026-11-18、種別：公的）","同協会「伝統的工芸品指定品目一覧・業種別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （2025／令和7年10月27日現在、取得日2026-11-18、種別：公的）※業種の出典","兵庫県は「6」品目と明記され、並びは「丹波立杭焼　出石焼　豊岡杞柳細工　播州三木打刃物　播州そろばん　播州毛鉤」である。","注記（f-2（1））：","- 候補に挙がっていた「播州織」「播州毛針」は、2025年10月27日現在の都道府県別一覧の兵庫県6品目には含まれていない。一覧にあるのは「播州毛鉤」であって「播州毛針」ではない。","- 「三木金物」は国指定の品目名としては一覧になく、国指定の品目名は「播州三木打刃物」である。兵庫県指定の伝統工芸品とは制度が別であり、混同しないようここに注記する。"],"tables":[{"cols":["番号","品目","読み","産地","備考（業種は業種別一覧による）","出典の種別"],"rows":[["1","丹波立杭焼","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では陶磁器の部17番目に記載","公的"],["2","出石焼","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では陶磁器の部18番目に記載","公的"],["3","豊岡杞柳細工","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工品・竹工品の部26番目に記載","公的"],["4","播州三木打刃物","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では金工品の部14番目に記載","公的"],["5","播州そろばん","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では文具の部4番目に記載","公的"],["6","播州毛鉤","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧ではその他の工芸品の部21番目に記載","公的"]]}]},{"h":"（2）地理的表示（GI）","lv":3,"text":["出典：近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、近畿18産品、取得日2026-11-18、種別：公的）","※同ページ冒頭に「令和8年3月25日、新たに『淡路島手延べそうめん』（兵庫県）が登録されましたので、近畿管内では、現在18産品が登録されています」とある。兵庫県分は6件。","注記（f-2（2））：","- 候補に挙がっていた「淡路島たまねぎ」「東条産山田錦」は、近畿農政局のGI登録産品一覧には含まれていない。両者は地域団体商標として下記（3）の一覧に含まれている。","- 「明石鯛」はGI登録産品ではない。農林水産省には令和7年3月15日付で地理的表示登録の申請書類（申請者：明石鯛ブランド化推進委員会）が公示されている（f-1の出典）。登録の有無については今回の近畿農政局一覧（令和8年3月25日現在）には含まれていない。","- 酒類の地理的表示「灘五郷」は国税庁長官の指定であり、農林水産省のGI登録産品一覧（本表）とは制度が別である（本表には含まれていない）。"],"tables":[{"cols":["番号","品目","読み","登録番号","登録日","生産地","登録生産者団体","出典の種別"],"rows":[["1","但馬牛","タジマギュー（別名：但馬ビーフ（タジマビーフ）、TAJIMA BEEF）","第2号","平成27年12月22日","兵庫県内","神戸肉流通推進協議会","公的"],["2","神戸ビーフ","コウベビーフ（別名：神戸肉（コウベニク）、神戸牛（コウベギュー）、KOBE BEEF）","第3号","平成27年12月22日","兵庫県内","神戸肉流通推進協議会","公的"],["3","佐用もち大豆","サヨウモチダイズ","第78号","令和元年5月8日","兵庫県佐用郡佐用町","佐用もち大豆振興部会","公的"],["4","淡路島3年とらふぐ","アワジシマサンネントラフグ","第144号","令和6年1月29日","兵庫県淡路島福良湾","福良漁業協同組合","公的"],["5","揖保乃糸","イボノイト","第154号","令和6年8月27日","兵庫県","兵庫県手延素麵協同組合","公的"],["6","淡路島手延べそうめん","アワジシマテノベソウメン（別名：淡路そうめん（アワジソウメン））","第176号","令和8年3月25日","兵庫県南あわじ市","淡路手延素麺協同組合","公的"]]}]},{"h":"（3）地域団体商標","lv":3,"text":["出典：近畿農政局「地域団体商標の活用について」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （「近畿における農林水産物・食品の地域団体商標（令和6年1月現在）」、取得日2026-11-18、種別：公的）","※同ページは「近畿管内において地域団体商標を取得し、『ブランド』の保護を図っている農林水産物・食品をご紹介します」と対象を農林水産物・食品に限っており、より新しい近畿版一覧は同ページ上では確認できなかった（令和6年1月現在が同ページの最新時点）。","兵庫県分は32件（一覧の並び・表記のとおり）：但馬牛（うし）、出石皿そば、たじまピーマン、出石そば、加西ゴールデンベリーA、明石鯛、姫路おでん、龍野淡口醤油、淡路ビーフ、淡路島たまねぎ、淡路島3年とらふぐ、黒田庄和牛、東条産山田錦、須磨海苔、神戸ビーフ、神戸肉、神戸牛、但馬ビーフ、但馬牛（ぎゅう）、丹波篠山黒豆、丹波篠山牛、三田肉、三田牛、尼崎あんかけチャンポン、朝倉さんしょ、播州百日どり、ぼうぜがに、ぼうぜ鯖、淡路島サクラマス、淡路島エクストラヴァージンオリーヴオイル、坂越のかき。","注記（f-2（3））：","- 「出石皿そば」と「出石そば」は別項目として両方登録されている。","- 「神戸ビーフ」「神戸肉」「神戸牛」、「但馬牛（うし）」「但馬ビーフ」「但馬牛（ぎゅう）」はそれぞれ別項目である。","- 工芸品・繊維製品を含む地域団体商標の全体像は特許庁の所管であり、同ページも「最新の全ての地域団体商標の案内は特許庁へ」と案内している。特許庁の原資料での確認は今回できていない。"],"tables":[{"cols":["項目","内容"],"rows":[["読み","一覧に記載なし（未確認）。ただし「但馬牛」については、一覧が「但馬牛（うし）」と「但馬牛（ぎゅう）」を別項目として併記している"],["産地","一覧に記載なし（未確認）"]]}]},{"h":"（4）兵庫県公式の認証・選定制度","lv":3,"text":[],"tables":[]},{"h":"制度1：ひょうご食品認証制度（兵庫県認証食品）","lv":4,"text":["出典：兵庫県公式「ひょうご食品認証制度の概要」 https://web.pref.hyogo.lg.jp/nk06/ninshouseidogaiyou.html （取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["項目","内容（出典の記載どおり）"],"rows":[["制度名","ひょうご食品認証制度（認証食品は「兵庫県認証食品」）"],["概要","「兵庫県認証食品制度は、安全性や個性特長など一定の基準を満たした県産の農林水畜産物や加工食品を認証する制度です。認証を通じて県産県消の推進と県産食品の魅力発信を進めています」（兵庫県公式ページ冒頭は「安全・安心で特色のある兵庫県産食品を、兵庫県が認証する制度です」）"],["ブランドの区分","「ひょうご安心ブランド」と「ひょうご推奨ブランド」の2種類。兵庫県公式の説明では、「ひょうご推奨ブランド」は生産方法・品質・地域性等に個性や特長があり、法令の遵守・生産管理体制等の整備が図れていると県が確認した商品。「ひょうご安心ブランド」は推奨ブランドの認証基準に加えて、出荷記録等の整備や残留農薬等についてより厳しい基準をクリアした食品（兵庫県公式「兵庫の食を大切にする」 https://web.pref.hyogo.lg.jp/recommend/learn/learn03.html ）"],["認証条件","（1）個性・特長があること。（2）安全性が確保されていること。（3）生産履歴等が確保できていること"],["認証食品数","2,216食品（令和8年8月現在）。農産物1,680食品（うち安心ブランド1,217、推奨ブランド463）、畜産物36食品（うち安心ブランド5、推奨ブランド31）、水産物30食品（うち安心ブランド1、推奨ブランド29）、加工食品470食品（うち安心ブランド35、推奨ブランド435）。合計の内訳は安心ブランド1,258、推奨ブランド958"],["認証期間","5年"],["認証マーク","県認証マーク（はばタン）を使用できる"]]}]},{"h":"制度2：五つ星ひょうご","lv":4,"text":["出典：「五つ星ひょうご」公式サイト https://www.5stars-hyogo.com/ （兵庫県の選定事業の公式サイト、取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["項目","内容（出典の記載どおり）"],"rows":[["制度名","五つ星ひょうご"],["内容","「『五つ星ひょうご』とは、ひょうご五国（摂津･播磨･但馬･丹波･淡路）の豊かな自然や歴史･文化を生かした産品の中から、ひょうごの良さをアピールする『地域らしさ』と、これまでにない『新しさ』を兼ね備えた商品を『五つ星ひょうご』として選定し、全国に発信することにより観光・物産振興を図っています」"],["時点の情報","同サイトのお知らせに「令和8年度『五つ星ひょうご』選定品の決定」（2026.10.05）がある"]]}]},{"h":"注記・食い違い（f-1）","lv":3,"text":["- 但馬牛・神戸ビーフは江戸時代の表に入れない。 近畿農政局GIページは、素牛の但馬牛について「約1200年も昔から兵庫県北部の但馬地方の山あいで農耕に用いられた役牛が由来。明治期に肉牛として遺伝的に良質な血統であることが認識された」とし、ブランドとしての成立は明治期以降である。現代のGIについてはf-2参照。","- 淡路島たまねぎは江戸時代の表に入れない。 今回取得した公的出典では江戸時代の栽培を確認できなかった（未確認）。地域団体商標の一覧には含まれている（f-2参照）。","- 灘五郷の構成の時代差：現在の灘五郷（今津郷・西宮郷・魚崎郷・御影郷・西郷）は1886年の摂津灘酒造業組合創設以来の名称で、江戸時代の灘五郷は上灘三組（魚崎・御影・大石新在家）と下灘、今津からなっていた（世界大百科事典）。江戸時代に西宮は含まれていない。","- 「揖保乃糸」の名称：明治27年に統一された名称であり、江戸時代の品目名ではない。江戸時代にあたるのは手延製法そのものである。","- 『日本山海名物図会』『日本山海名産図会』『播磨鑑』の原文そのものからの引用は、今回の取得範囲では確認できなかった（下記「取得不可」参照）。明石鯛については、GI登録申請明細書が『日本山海名産図絵』（1799）等の記載を紹介している。"],"tables":[]},{"h":"取得不可（f-1）","lv":3,"text":["- 『日本山海名物図会』『日本山海名産図会』『摂津名所図会』『播磨鑑』の原典テキスト：国立国会図書館デジタルコレクション等への到達を試みたが、今回の取得では本文の逐語引用が可能な形で取得できず、取得不可として扱う（明石鯛・丹波黒大豆については、農林水産省資料が原典の記載を紹介している範囲で転記した）。"],"tables":[]},{"h":"取得不可（f-2）","lv":3,"text":["- 特許庁の地域団体商標の原資料（工芸品・繊維製品を含む全体の登録情報）：今回の取得範囲では原資料に到達できず、取得不可（近畿農政局の農林水産物・食品に限った一覧で代替した）。","- 伝統的工芸品の読み・産地：協会の都道府県別・業種別一覧には読み・産地の記載がないため未確認のまま残した（兵庫県公式の伝統的工芸品紹介での照合は今回未実施）。","---"],"tables":[]}],"g":[{"h":"g-1 摂津国（兵庫県域）","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （Wikipedia）","- 取得日：2026-11-18","注記（前提）：摂津国の国府・一宮・総社・国分寺・国分尼寺はいずれも大阪府域に所在し、第4便（大阪府）で扱った。本節では兵庫県の章に必要な範囲で簡潔に記す。","注記・食い違い：第4便の記載と同一出典（Wikipedia「摂津国」）であり、新たな食い違いは確認されなかった。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","上国。距離は近国","易林本『節用集』に摂津は「南暖北寒、故五穀先熟、魚鹽繁、大上國也」と記されている（記事引用）","Wikipedia"],["2","国府","―","所在地は確定していない。文献では『和名抄』に記載なし、『拾芥抄』は「西生郡」、『節用集』は「西成郡」。史書からの推定地として難波京（大阪市天王寺区国分町）、延暦24年（805年）の江頭（大阪市中央区か、『日本後紀』）、天長2年（825年）の豊島郡（『日本後紀』）、承和11年（844年）の旧鴻臚館（『続日本後紀』）、12世紀の住吉区が挙げられる","いずれも大阪府域","Wikipedia"],["3","一宮","―","住吉大社（大阪府大阪市住吉区）および坐摩神社（大阪府大阪市中央区）","第4便で両論併記済み。記事注記：住吉大社については「中世に住吉大社が一宮を自称した文書はない」。坐摩神社は近世以降一宮と呼ばれるようになった。本節ではこれ以上の詳細は扱わない","Wikipedia"],["4","総社","―","不詳。難波神社とする説がある","多田院境内の「惣社六所権現」は同地の荘園の惣社とされている","Wikipedia"],["5","国分寺（僧寺）","―","後継寺院は2説あり、いずれも創建時の遺構は明らかでない。天徳山国分寺（大阪市天王寺区国分町）／護国山（金剛院）国分寺（大阪市北区国分寺）","いずれも大阪府域","Wikipedia"],["6","国分尼寺","―","（天平）勝宝山法華寺（大阪市東淀川区柴島町）が後継寺院と推定され、境内には国分尼寺のものという礎石が伝わる","大阪府域","Wikipedia"],["7","延喜式内社","―","『延喜式神名帳』に大社26座16社・小社49座46社の計75座62社","兵庫県域の名神大社として武庫郡の広田神社（西宮市）、八部郡の生田神社・長田神社（いずれも神戸市）が記事に挙がる","Wikipedia"]]}]},{"h":"g-2 播磨国","lv":2,"text":["出典：","- Wikipedia「播磨国」 http://ja.wikipedia.org/wiki/播磨国 （Wikipedia）","- 兵庫県立歴史博物館「名所めぐり：播磨国総社（射楯兵主神社）」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_sanyou/harimasousha/ （自治体）","- 宍粟市公式サイト「宍粟市の文化財」 https://www.city.shiso.lg.jp/soshiki/kyoikuiinkai/rekishishiryokan/h_topics/s_cul_p.html （自治体）","- 國學院大學デジタル・ミュージアム「神道・神社史料データベース：射楯兵主神社」 http://jmapps.ne.jp/kokugakuin/det.html?data_id=54228 （その他（学術データベース））","- 取得日：2026-11-18","注記・食い違い：","- 一ツ山大祭の周期の表記差：射楯兵主神社の一ツ山大祭について、Wikipedia「射楯兵主神社」記事は「60年に1度」とし、姫路市公式サイトおよび兵庫県立歴史博物館は「61年ごと」とする（食い違い）。","- 国府の所在地は確定していない（記事は「説が有力視」と表現）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","大国。距離は近国","『延喜式』による区分。変遷の経緯はa-2の番号8参照","Wikipedia"],["2","国府","―","「播磨国府は、『和名抄』によれば飾磨郡にあった。姫路市中心部にある本町遺跡（姫路市総社本町）を国衙跡とする説が有力視されており」、周辺で奈良時代の大量の瓦や建物の柱跡が発見されている","『日本大百科全書』は「所在地はいまの姫路市で，姫路城の東または南東部と推定される」とする。記事は「説が有力」と述べるにとどまり、確定したとは書いていない","Wikipedia"],["3","一宮","伊和神社（いわじんじゃ）","宍粟市一宮町須行名。式内社「宍粟郡 伊和坐大名持御魂神社」の比定社","読みは宍粟市公式サイト「播磨国一の宮伊和神社(いわじんじゃ)」で確認。鎮座地の一宮町（現・宍粟市）の地名は当社に由来する","Wikipedia／自治体"],["4","総社","射楯兵主神社（いたてひょうずじんじゃ）","姫路市総社本町。式内社","読みは國學院大學「神道・神社史料データベース」および神社公式サイト（sohsha.jp）で確認。兵庫県立歴史博物館によれば「1181（養和元）年播磨国16郡の大小明神174座を境内で合祭し播磨国総社となった」。16郡は中世の郡数で、『延喜式』の12郡とは異なる（注記参照）","Wikipedia／自治体／その他（学術データベース）"],["5","国分寺（僧寺）","播磨国分寺跡","姫路市御国野町国分寺。国の史跡。推定寺域は方2町（約218メートル四方）。古代寺院跡に重複して位置する牛堂山国分寺が法燈を伝承する","―","Wikipedia"],["6","国分尼寺","播磨国分尼寺跡","姫路市御国野町国分寺。史跡指定なし。僧寺跡の北約600メートルに位置する。発掘調査により金堂基壇や講堂を囲む雨落溝が確認されている","―","Wikipedia"],["7","延喜式内社","―","『延喜式神名帳』に大社7座5社・小社43座42社の計50座47社","一宮以下の社格一覧は『中世諸国一宮制の基礎的研究』に基づくと記事に明記。二宮は荒田神社（多可郡多可町）、三宮は住吉神社（加西市）、四宮は白国神社（姫路市）","Wikipedia"]]}]},{"h":"g-3 但馬国","lv":2,"text":["出典：","- Wikipedia「但馬国」 http://ja.wikipedia.org/wiki/但馬国 （Wikipedia）","- 兵庫県立歴史博物館「名所めぐり：出石神社」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_tajima/izushijinja/ （自治体）","- 兵庫県立歴史博物館「名所めぐり：粟鹿神社」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_sanindo/awagajinja/ （自治体）","- 但馬検定公式サイト「ザ・たじま」「気多神社」 https://the-tajima.com/spot/51/ （その他（但馬検定））","- 取得日：2026-11-18","注記・食い違い：","- 一宮の食い違い：『中世諸国一宮制の基礎的研究』に基づく一覧（Wikipedia）および兵庫県立歴史博物館は出石神社を一宮とするが、『大日本国一宮記』（室町時代）は粟鹿神社を一宮に挙げ出石神社を記載しない。現在は両社とも但馬国一宮を称する。両論併記とする。","- 国府の初期所在地は「明らかでない」（記事の表現どおり）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","上国。距離は近国","―","Wikipedia"],["2","国府","―","『和名抄』および『拾芥抄』によると、国府は気多郡にあった。初期の国府の所在地には、豊岡市出石町の袴狭（はかざ）遺跡とする説、気多郡（現在の豊岡市日高町）内とする説があるが、「明らかでない」。『日本後紀』によると、延暦23年（804年）に気多郡高田郷に国府が移されたという。豊岡市日高町祢布の祢布ヶ森遺跡がこれに比定される","記事冒頭の諸元表では国府を「1. 未詳 2. 兵庫県豊岡市」とする。延暦23年は年表記のみ","Wikipedia"],["3","一宮","出石神社（いずしじんじゃ）","豊岡市出石町宮内。式内社「出石郡 伊豆志坐神社八座」の比定社","読みと一宮であることは兵庫県立歴史博物館「名所めぐり：出石神社」（「出石神社いずしじんじゃ」「但馬一宮の神社」）で確認。ただし下記の食い違いあり","Wikipedia／自治体"],["4","一宮（別説）","粟鹿神社（あわがじんじゃ）","朝来市山東町粟鹿。式内社（名神大社）","鎌倉時代の「但馬国大田文」では粟鹿神社を二宮とするが、室町時代の『大日本国一宮記』では粟鹿神社を一宮に挙げる（出石神社は記載なし）。「現在は粟鹿神社も但馬国一宮を称し、全国一の宮会に加盟する」。読みは兵庫県立歴史博物館「名所めぐり：粟鹿神社」（「粟鹿神社あわがじんじゃ」「但馬国一の宮と言われる」）で確認","Wikipedia／自治体"],["5","総社","気多神社（けたじんじゃ）","豊岡市日高町上郷。式内社（小社）。旧称「惣社気多大明神」","読みは但馬検定公式サイト「ザ・たじま」で確認","Wikipedia／その他（但馬検定）"],["6","国分寺（僧寺）","但馬国分寺跡","豊岡市日高町国分寺。国の史跡。寺域は1町半（約160メートル）四方。跡地付近の護国山国分寺が法燈を伝承する","―","Wikipedia"],["7","国分尼寺","但馬国分尼寺跡","豊岡市日高町水上・山本。国分寺跡から北方の豊岡市立日高東中学校付近。礎石が伝世され、尼寺の遺構とされる。北方の天台山法華寺が後継を称する","―","Wikipedia"],["8","延喜式内社","―","『延喜式神名帳』に大社18座10社・小社113座106社の計131座116社","一宮以下の一覧は『中世諸国一宮制の基礎的研究』に基づくと記事に明記。三宮は水谷神社（養父市）／養父神社（養父市）の2説","Wikipedia"]]}]},{"h":"g-4 淡路国","lv":2,"text":["出典：","- Wikipedia「淡路国」 https://ja.wikipedia.org/wiki/淡路国 （Wikipedia）","- 兵庫県立歴史博物館「名所めぐり：伊弉諾神宮」 https://rekihaku.pref.hyogo.lg.jp/digital_museum/trip/road_awaji/izanagijingu/ （自治体）","- 取得日：2026-11-18","注記・食い違い：なし（本便の範囲では出典間の食い違いは確認されなかった）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","下国。距離は近国","―","Wikipedia"],["2","国府","―","「『和名抄』によれば、国府は三原郡にあった。現在の南あわじ市（旧三原郡三原町）神代国衙にあったと推定されるが、遺跡はまだ見つかっていない」","確定していない","Wikipedia"],["3","一宮","伊弉諾神宮（いざなぎじんぐう）","淡路市多賀。式内社「津名郡 淡路伊佐奈伎神社」の比定社（名神大社）。『延喜式』には伊佐奈伎神社と記述がある","読みと淡路国一宮であることは兵庫県立歴史博物館「名所めぐり：伊弉諾神宮」（「伊弉諾神宮いざなぎじんぐう」「淡路国一宮であり」）で確認。地元では「いっくさん」と尊称される","Wikipedia／自治体"],["4","総社","総社十一明神社","南あわじ市十一カ所。「名神大社2社以外の式内社11社の祭神が祀られている」","読みは公的・神社公式の出典で確認できず未確認","Wikipedia"],["5","国分寺（僧寺）","淡路国分寺","「国分僧寺は、江戸時代に造営された護国山国分寺のある南あわじ市国分寺寺内に比定されている。今は、塔の心礎と跡石が残っているが、その礎石は創建当時の位置を保っておらず、伽藍の遺構も確認されていない。諸国国分寺で唯一創建当時の作とみられる丈六の釈迦如来坐像がある」","―","Wikipedia"],["6","国分尼寺","―","記事冒頭の諸元表では「（推定）兵庫県南あわじ市」とのみある","記事の「国分寺・国分尼寺」の節には僧寺の記述のみで、尼寺の所在地に関する本文の記述は確認できなかった","Wikipedia"],["7","延喜式内社","―","『延喜式神名帳』に大社2座2社・小社11座11社の計13座13社。大社2社はいずれも名神大社（津名郡 淡路伊佐奈伎神社、三原郡 大和大国魂神社）","二宮は大和大国魂神社、三宮は伊勢久留麻神社（記事）","Wikipedia"]]}]},{"h":"g-5 丹波国","lv":2,"text":["出典：","- Wikipedia「丹波国」 https://ja.wikipedia.org/wiki/丹波国 （Wikipedia）","- 京都府公式サイト「亀岡市の神社・仏閣」 https://www.pref.kyoto.jp/nantan/kankou/1236315163804.html （自治体）","- 取得日：2026-11-18","注記（前提）：丹波国の国府・一宮・総社・国分寺・国分尼寺はいずれも京都府域に所在し、兵庫県域（多紀郡・氷上郡）には所在しない。制度の記録として国全体分を記す。","注記・食い違い：なし（本便の範囲では出典間の食い違いは確認されなかった）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","等級","―","上国。距離は近国","―","Wikipedia"],["2","国府","―","『和名抄』に「国府在桑田郡高低上一日下半日」とあることから、10世紀には桑田郡（現在の亀岡市周辺）にあったとされる。「しかしながら国府の位置は確定できておらず、現在も諸説がある」。諸説：桑田郡 案察使（亀岡市保津町）説、桑田郡 三宅（亀岡市三宅町）説、桑田郡 千代川（亀岡市千代川町）説（10世紀までの候補地として有力）、船井郡 屋賀（南丹市八木町屋賀）説。また、千代川にあった国府が平安末から鎌倉初期にかけて屋賀に移転したとする説もある","確定していない（記事の表現どおり）","Wikipedia"],["3","一宮","出雲大神宮（いずもだいじんぐう）","京都府亀岡市千歳町。式内社（名神大社）。旧称「出雲神社」、別称「元出雲」「千年宮」","読みは京都府公式サイト「出雲大神宮（いずもだいじんぐう」で確認。式内社「出雲神社」には出雲大神宮（亀岡市千歳町）と出雲神社（亀岡市本梅町）の論社二社がある（記事）","Wikipedia／自治体"],["4","総社","宗神社","京都府南丹市","記事は「推定」と明記する。鎮座地の屋賀には「丹波国総社の説のある宗神社も鎮座している」とある。読みは公的・神社公式の出典で確認できず未確認","Wikipedia"],["5","国分寺（僧寺）","丹波国分寺","京都府亀岡市千歳町国分。現在は同じ位置に護国山国分寺が立ち、法灯を伝承する","―","Wikipedia"],["6","国分尼寺","丹波国分尼寺","京都府亀岡市河原林町。通称「御上人林廃寺跡」","―","Wikipedia"], 33年（5月1日）とするため、1933年を採用した。","- 今回未収録（社名のみ。出典での裏取りが今回の範囲で及ばなかったもの、またはグループ会社として親会社に内包したもの）：日本盛、白鷹、バンドー化学、住友ゴム工業、ノーリツ、川崎車両、カワサキモータース（川崎重工業から分社）。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 本調査で取得不可だったページはなし。","- ただし次の各社は、公式サイトの会社概要ページそのものではなく、同社発行のプレスリリース・グループ会社の資料・Wikipedia等で代替確認した（公式ページの直接取得は未実施）：白鶴酒造、辰馬本家酒造、神戸製鋼所、TOA、フジッコ、ノエビアホールディングス。"],"tables":[]}],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"県名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["県域は摂津・播磨・但馬・淡路・丹波の5国を中心とし、兵庫県公式は赤穂市の福浦（備前国）と佐用町の旧石井村周辺（美作国）を含めて「七国にまたがる」とする。本章は5国を扱い、備前・美作は扱わない。","各国の郡・郷数（摂津13郡78郷と、列挙12郡75郷の食い違いなど）はWikipediaのみ。","兵庫県公式「県域の変遷」は、第3次兵庫県の見出しを「明治9年7月」、本文を「8月」とし、月が食い違う。"],"b":["藩と藩主はWikipediaのみ。赤穂藩の石高、三田藩の入部年、篠山藩の就封（慶長14年を1608年と書く誤り）などに、記事内の食い違いがある。","藩主の読みの多くが未取得（自治体出典での確認は未実施）。竹田藩の記事は未整備。","淡路は徳島藩の領で、洲本城代（稲田家）が置かれた。廃藩置県の時点で兵庫県域ではない。"],"c":["統合で廃された県の数は、県公式が「30を超える」、Wikipediaの一覧から数えると19県で食い違う（数え方の違いとみられるが未確認）。","1869年7月17日の太政官布告（府は京都・東京・大阪に限る）は旧暦の日付。新暦では1869年8月24日で、出典には換算の記載がない。","兵庫県（第2次）の再発足日は、Wikipediaの記事間で食い違う（明治4年7月14日か、11月20日か）。生野県の豊岡県への合併日も、11月2日と11月15日で食い違う。","淡路国津名郡の名東県への編入の細部は、記事間で食い違う。","国立公文書館（アジア歴史資料センター）での布告本文の照合は未実施。","1868年2月15日（慶応4年1月22日）の兵庫鎮台の設置は、大阪鎮台の設置日と同じ日で、新暦の換算が一致する。"],"d":["県名は「兵庫」の地名（兵庫津）に由来する。役所が兵庫に置かれたためとされるが、兵庫県公式自身が「推測」と明記している。","「兵庫」の語源（兵器庫の「つわものぐら」説）は仮説。県公式は「よくわかっていません」、国土交通省は「ちなんでいます」と断定調で、表現が食い違う。年代も645年（国土交通省）と天智天皇の治世（Wikipedia）で食い違う。","兵庫県設置の「5月23日」は旧暦（新暦では1868年7月12日）。"],"e":["兵庫県内の現存天守は姫路城のみ。姫路城の国宝・世界遺産・特別史跡は、姫路市とユネスコの資料で照合した。","築城年・廃城年は、姫路城・明石城・赤穂城・竹田城・出石城・三木城・三田城・尼崎城などで、出典間の食い違いがある（併記している）。","三木城・龍野城・竹田城では、出典の元号と西暦が一致しない箇所がある（長享2年＝1488年、明応4年＝1495年、嘉吉3年＝1443年）。","龍野城・尼崎城の文化財指定、洲本城の築城年、出石城の辰鼓櫓の現存扱いは未確認。"],"f":["灘五郷・揖保乃糸・出石皿そば・丹波黒大豆・明石鯛などの江戸時代の起源は、農林水産省の資料などで確認した。原典の『日本山海名産図会』などの逐語引用は取得できていない。","但馬牛・神戸ビーフ・淡路島たまねぎは、江戸時代の表に入れていない（公的出典で江戸時代の記録を確認できていない）。","伝統的工芸品6品目は協会の一覧で確認（読み・産地は一覧にない）。GIは6件、令和8年3月25日に淡路島手延べそうめんが登録された。","地域団体商標の一覧は令和6年1月時点で、農林水産物・食品に限る。商標の登録は「名産」と同義ではない。"],"g":["旧国の制度は、Wikipediaが中心。一宮の読みと一宮であることは、自治体・神社の資料で確認したものがある。","総社十一明神社（淡路）と宗神社（丹波）の読み、淡路国分尼寺の所在地は未確認。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","川崎重工業・神戸製鋼所は本店が神戸だが、東京にも本社がある。ケンコーマヨネーズは同じ理由で注記のみ。本店と本社機能の、どちらを基準にするかは未統一。","川崎重工業の創業地は東京、ユーハイムの創業地は青島で、本社が神戸のため入れている。","沢の鶴の設立年（Wikipediaは1919年、求人情報は1898年）、オリバーソースの法人設立年は、公式で未確認。","UCCは、旧統括会社が改称・移管されたため、中核事業会社のユーシーシー上島珈琲を収録している。","モロゾフは創業1931年のため老舗の対象外。日本盛・白鷹・住友ゴムなどは未収録（未確認）。"]}}],"PLAN":[{"dou":"畿内","items":[["kyoto","京都府"],["nara","奈良県"],["osaka","大阪府"],["hyogo","兵庫県"]]},{"dou":"東海道","items":[["mie","三重県"],["aichi","愛知県"],["shizuoka","静岡県"],["yamanashi","山梨県"],["kanagawa","神奈川県"],["tokyo","東京都"],["saitama","埼玉県"],["chiba","千葉県"],["ibaraki","茨城県"]]},{"dou":"東山道","items":[["shiga","滋賀県"],["gifu","岐阜県"],["nagano","長野県"],["gunma","群馬県"],["tochigi","栃木県"],["fukushima","福島県"],["miyagi","宮城県"],["yamagata","山形県"],["akita","秋田県"],["iwate","岩手県"],["aomori","青森県"]]},{"dou":"北陸道","items":[["fukui","福井県"],["ishikawa","石川県"],["toyama","富山県"],["niigata","新潟県"]]},{"dou":"山陰道","items":[["tottori","鳥取県"],["shimane","島根県"]]},{"dou":"山陽道","items":[["okayama","岡山県"],["hiroshima","広島県"],["yamaguchi","山口県"]]},{"dou":"南海道","items":[["wakayama","和歌山県"],["tokushima","徳島県"],["kagawa","香川県"],["ehime","愛媛県"],["kochi","高知県"]]},{"dou":"西海道","items":[["fukuoka","福岡県"],["saga","佐賀県"],["nagasaki","長崎県"],["oita","大分県"],["kumamoto","熊本県"],["miyazaki","宮崎県"],["kagoshima","鹿児島県"]]},{"dou":"最後に","items":[["hokkaido","北海道"],["okinawa","沖縄県"]]}],"CAL":["日付は、原則として「新暦（旧暦）」の順に書きます（1872年末まで。出典の古いリストは「旧暦（新暦）」の順のものもあります）。","日本で新暦（グレゴリオ暦）になったのは1873年1月1日（明治5年12月3日が明治6年1月1日）。それ以前の和暦の日付は旧暦です。","年号一覧（リスト2）の西暦換算は、天正の始期まではユリウス暦、天正の終期以降はグレゴリオ暦（出典の明記）。","将軍一覧（リスト3）の西暦換算は、ユリウス暦かグレゴリオ暦か、出典に明記がありません（暦不明）。","執権の表は、和暦の月日が旧暦で、西暦は年のみ。連署の表は、日付が旧暦と出典に明記されています。","官制（リスト6）は出典が「旧暦（新暦）」で併記。例：王政復古は慶応3年12月9日（1868年1月3日）、太政大臣の設置は明治4年7月27日（1871年9月11日）。","1872年末以前の日付を西暦だけで引用すると旧暦と誤認されるおそれがあるため、このゲームでは併記を原則にします。"]};</script><script>(()=>{
const D=window.__D,KEY="rekiota-v1",$=s=>document.querySelector(s),app=$("#app");
let S={step:"title",c:"kyoto",k:null,l:null,ret:null,read:{},has:false,ask:false};
try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o){S.read=o.read||{};S.has=true}}catch(e){}
function save(){S.has=true;try{localStorage.setItem(KEY,JSON.stringify({read:S.read}))}catch(e){}}
function reset(){S.read={};S.has=false;try{localStorage.removeItem(KEY)}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CH=()=>D.CH.find(c=>c.id===S.c)||D.CH[0];const LI=Object.fromEntries(D.L.map(l=>[l.id,l]));
const REL={calendar:{t:"日付の読み方（暦）",g:"読み方"}};
function go(o){Object.assign(S,o);render();window.scrollTo(0,0)}
function srcTag(s){s=(s||"").trim();if(!s)return"";
 if(/^(公的|自治体)/.test(s)||/照合済/.test(s))return '<span class="tag f">'+esc(s)+'</span>';
 let t=s;if(/^Wikipedia$/.test(s))t="Wikipedia（要検証）";return '<span class="tag w">'+esc(t)+'</span>'}
const dash=v=>!v||v==="―"||v==="-";
function rowH(cols,r){
 const last=cols[cols.length-1]==="出典の種別";const n=last?cols.length-1:cols.length;let i=0,no="",nm="",rd="";
 if(cols[0]==="番号"||cols[0]==="代"){no=r[0];i=1}
 nm=r[i];i++;
 if(cols[i]==="読み"){rd=r[i];i++}
 let kv="";for(;i<n;i++){if(dash(r[i]))continue;kv+='<span class="kv"><i>'+esc(cols[i])+'</i>'+esc(r[i])+'</span>'}
 return '<div class="ent">'+(dash(no)?"":'<span class="no">'+esc(no)+'</span>')+'<span class="nm2">'+esc(nm)+'</span>'+(dash(rd)?"":'<span class="rd">'+esc(rd)+'</span>')+(last?srcTag(r[n]):"")+kv+'</div>'}
function tblH(t){return t.rows.map(r=>rowH(t.cols,r)).join("")}
function textH(a){return a.map(x=>'<div class="note">'+esc(x.replace(/^[-・]\s*/,"・"))+'</div>').join("")}
function secH(s,noteMode){
 let h="";if(s.h)h+=(s.lv<=2?'<h2 class="sh">':'<h3 class="sh">')+esc(s.h)+(s.lv<=2?'</h2>':'</h3>');
 h+=textH(s.text);s.tables.forEach(t=>{h+=tblH(t)});return h}
function splitSecs(secs){const i=secs.findIndex(s=>/^注記|^取得不可/.test(s.h));return i<0?[secs,[]]:[secs.slice(0,i),secs.slice(i)]}
function metaH(m){return m&&m.length?'<details><summary>出典・表の前提</summary><div class="win">'+textH(m)+'</div></details>':""}
function flagH(a){return a&&a.length?'<div class="flag"><b>確認中のメモ（運営）</b><ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>':""}
function backTo(){const r=S.ret;if(!r)return go({step:"title"});go(r)}
function fillBind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const o=JSON.parse(b.dataset.go);if(o.ret===true)o.ret={step:S.step,c:S.c,k:S.k,l:S.l,ret:S.ret};go(o)});
 const f=$("#flt");if(f)f.oninput=()=>{const q=f.value.trim();document.querySelectorAll(".ent").forEach(e=>e.classList.toggle("hide",!!q&&!e.textContent.includes(q)))}}
const gb=o=>"data-go='"+JSON.stringify(o).replace(/'/g,"&#39;")+"'";

function mk(h){app.innerHTML=h;fillBind()}
function rTitle(){
 let h='<div class="win"><h1>レキオタ</h1><div class="sub">歴史手帳をひらいて、京都から旅する。</div><div class="small" style="text-align:center;margin-top:6px">試作版：いまは京都府の章と、閑話休題（歴史手帳）だけです。</div></div>';
 if(S.ask){h+='<div class="win msg">はじめからにすると、今の記録（読んだ項目）は消えます。よいですか？</div><div class="row"><button class="btn" id="yes">はい</button><button class="btn" id="no">いいえ</button></div>';mk(h);$("#yes").onclick=()=>{reset();S.ask=false;go({step:"route"})};$("#no").onclick=()=>go({ask:false});return}
 if(S.has)h+=btn("つづきから",{step:"route"},"gold");
 h+='<button class="btn" id="new"><span>はじめから</span></button>';
 h+=btn("閑話休題（歴史手帳）",{step:"kan",ret:{step:"title"}},"","歴代天皇・年号・将軍・首相・官制・中国と朝鮮の国名");
 h+=btn("あそびかた・出典について",{step:"help"});
 mk(h);$("#new").onclick=()=>{if(S.has)go({ask:true});else go({step:"route"})}}
function rHelp(){mk('<div class="win msg">このゲームは、歴史が好きな人のための「歴史手帳」です。県ごとに、旧国名・藩・廃藩置県・県名の由来・城・名産を巡ります。\n\n各項目には出典のタグが付きます。\n・緑「公的」「自治体」：公的機関の出典\n・黄「Wikipedia（要検証）」：Wikipediaだけが出典。まだ公的出典で照合していません\n\n「確認中のメモ」は、運営が気づいた疑問点です。事実と推測は分けて書いています。\n\n日付は、1872年末までは「新暦（旧暦）」の併記を原則にします。\n\n閑話休題のボタンから、歴代天皇などの一覧に飛べます。</div>'+btn("もどる",{step:"title"}))}
function rRoute(){let h='<div class="win"><div class="nm" style="color:var(--gold)">旅の道</div><div class="small">県ごとの章を巡ります。</div></div>';D.CH.forEach(c=>{const r=S.read[c.id]||{};const n=c.topics.filter(t=>r[t.k]).length;h+=btn(esc(c.title)+'<small>'+esc(c.sub)+'　読んだ '+n+'/'+c.topics.length+'</small>',{step:"hub",c:c.id})});const done=new Set(D.CH.map(c=>c.id));let nx=null;D.PLAN.forEach(g=>g.items.forEach(it=>{if(!nx&&!done.has(it[0]))nx=it}));if(nx)h+='<button class="btn" disabled><span>'+esc(nx[1])+'<small>準備中</small></span></button>';
h+='<details><summary>旅の予定（五畿七道の順。道の中の順は変わることがあります）</summary><div class="win">'+D.PLAN.map(g=>'<div class="note"><b style="color:var(--gold);font-weight:normal">'+esc(g.dou)+'</b>　'+g.items.map(it=>esc(it[1])+(done.has(it[0])?'（済）':'')).join('・')+'</div>').join("")+'<div class="note">兵庫県は摂津で訪れ、播磨・但馬・淡路は章の中で触れます。全47都道府県。</div></div></details>';
h+=btn("閑話休題（歴史手帳）",{step:"kan",ret:{step:"route"}},"gold")+btn("タイトルへ",{step:"title"});mk(h)}
function rHub(){const K=CH(),r=S.read[K.id]||{};const n=K.topics.filter(t=>r[t.k]).length;
 let h='<div class="win"><div class="nm" style="color:var(--gold)">'+esc(K.title)+'</div><div class="small">'+esc(K.sub)+'</div><div class="small">読んだ：'+n+' / '+K.topics.length+'</div></div>';
 K.topics.forEach(t=>{h+=btn(esc(t.t)+(r[t.k]?' <span class="st">済</span>':""),{step:"topic",c:K.id,k:t.k,ret:{step:"hub",c:K.id}})});
 h+=btn("閑話休題（歴史手帳）",{step:"kan",ret:{step:"hub",c:K.id}},"gold");
 h+=btn("旅の道へ",{step:"route"})+btn("タイトルへ",{step:"title"});
 mk(h)}
function relBtns(rel,from){return rel.map(id=>btn("閑話休題：「"+esc(id==="calendar"?REL.calendar.t:LI[id].t)+"」へ",{step:"list",l:id,ret:from},"sm")).join("")}
function rTopic(){const K=CH(),t=K.topics.find(x=>x.k===S.k);
 (S.read[K.id]=S.read[K.id]||{})[t.k]=1;save();
 const [main,notes]=splitSecs(K[t.k]);
 let h='<div class="win"><div class="nm" style="color:var(--gold)">'+esc(K.title)+' ― '+esc(t.t)+'</div></div>';
 h+='<div class="win">'+main.map(s=>secH(s)).join("")+'</div>';
 if(notes.length)h+='<details open><summary>注記・食い違い（出典の記述）</summary><div class="win">'+notes.map(s=>secH(s)).join("")+'</div></details>';
 h+=flagH(K.flags[t.k]);
 const here={step:"topic",c:K.id,k:t.k,ret:S.ret};
 h+='<div class="grp">閑話休題（関連）</div>'+relBtns(t.rel,here)+btn("閑話休題（一覧）",{step:"kan",ret:here},"sm");
 const i=K.topics.findIndex(x=>x.k===t.k),nx=K.topics[i+1];
 h+='<div class="row">'+(nx?'<button class="btn" '+gb({step:"topic",c:K.id,k:nx.k,ret:{step:"hub",c:K.id}})+'><span>つぎ：'+esc(nx.t)+'</span></button>':"")+'<button class="btn" '+gb({step:"hub"})+'><span>章の目次へ</span></button></div>';
 const m=K.meta;h+=metaH(m);
 mk(h)}
function rKan(){let h='<div class="win"><div class="nm" style="color:var(--gold)">閑話休題</div><div class="small">歴史手帳。ここから、もとの場所にもどれます。</div></div>';
 let g="";D.L.forEach(l=>{if(l.g!==g){g=l.g;h+='<div class="grp">'+esc(g)+'</div>'}h+=btn(esc(l.t),{step:"list",l:l.id,ret:{step:"kan",ret:S.ret}})});
 h+='<div class="grp">読み方</div>'+btn(esc(REL.calendar.t),{step:"list",l:"calendar",ret:{step:"kan",ret:S.ret}});
 h+=btn("もどる",S.ret||{step:"title"},"gold");mk(h)}
function rList(){
 if(S.l==="calendar"){mk('<div class="win"><div class="nm" style="color:var(--gold)">'+esc(REL.calendar.t)+'</div>'+textH(D.CAL)+'</div>'+btn("もどる",S.ret||{step:"kan"},"gold"));return}
 const l=LI[S.l];const [main,notes]=splitSecs(l.secs);const cnt=main.reduce((a,s)=>a+s.tables.reduce((b,t)=>b+t.rows.length,0),0);
 let h='<div class="win"><div class="nm" style="color:var(--gold)">'+esc(l.t)+'</div><div class="small">'+cnt+'件</div></div>'+btn("もどる",S.ret||{step:"kan"},"gold");
 if(cnt>20)h+='<input id="flt" class="flt" type="search" placeholder="しぼりこみ（名前・年・読みなど）" autocomplete="off">';
 h+=metaH(l.meta);
 h+='<div class="win">'+main.map(s=>secH(s)).join("")+'</div>';
 if(notes.length)h+='<details><summary>注記・食い違い（出典の記述）</summary><div class="win">'+notes.map(s=>secH(s)).join("")+'</div></details>';
 h+=btn("もどる",S.ret||{step:"kan"},"gold");mk(h)}
function render(){document.documentElement.lang="ja";({title:rTitle,help:rHelp,route:rRoute,hub:rHub,topic:rTopic,kan:rKan,list:rList})[S.step]()}
window.__R={S,go};
render();
})();
</script>
