居堂（京都市中京区）・株式会社東京鳩居堂（東京都中央区銀座）に分社化された。本表では創業地であり現在も本店を置く株式会社京都鳩居堂を本体とし、東京鳩居堂は府外法人のため本体には入れていない。創業1663年はWikipediaおよび同社関係者の発言（日本香堂公式サイト内の対談記事）で確認したが、同社公式サイトの沿革ページでの直接確認はできていない（下記「取得不可」参照）。","- 注記（黄桜の本社所在地）：登記上の本社所在地は「京都市伏見区塩屋町223番地」（Wikipedia・京都市企業情報）だが、会社のプレスリリース等の会社概要では本社所在地を「京都府京都市伏見区横大路下三栖梶原町53」（本社事務所・伏水蔵の所在地）とするものがある。両表記を併記する。","- 注記（宝酒造の扱い）：候補名は「宝酒造」だが、創業1842年・設立1925年はグループの持株会社である宝ホールディングス株式会社の公式表記である。現在の宝酒造株式会社は2002年の持株会社化の際に事業会社として設立された法人であり、法人としての設立年は1842年・1925年のいずれでもない。本表ではグループとして「宝酒造（宝ホールディングス）」と記した。","- 注記（SCREENホールディングスの創業年）：同社は公式資料で「1868年 石田旭山印刷所を創業」を歩みの起点とし、2018年に創業150周年を迎えた。一方、法人（大日本スクリーン製造株式会社）の設立は1943年であり、有価証券報告書の沿革も1943年設立から始まる。創業と設立を分けて転記した。","- 注記（オムロンの創業地）：オムロンの創業は1933年、大阪市都島区東野田（立石電機製作所）であり、京都へ本社を移したのは1945年である。創業100年には2026年時点で達していない（93年）ため、h-1には入れずh-2のみに掲載した。","- 注記（府外へ本社を移した企業）：今回の候補の中に、発祥が京都府で現在は府外に本社を置く企業は確認されなかった。鳩居堂の東京法人（株式会社東京鳩居堂、本社・東京都中央区銀座）は上記のとおり注記に留めた。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 鳩居堂 公式サイト（kyukyodo.co.jp）の会社概要・沿革ページ：トップページは取得できたが、「鳩居堂について」の下位ページの本文は今回取得できず、創業1663年・分社化の経緯は公式サイトでは直接確認できなかった（Wikipediaおよび関係者発言で代替）。","- 中村藤吉本店 公式サイト（tokichi.jp）の会社概要ページ：今回未取得。創業1854年（安政元年）・設立1949年12月・本社所在地は、求人媒体に掲載された同社の企業情報で確認したにとどまる。","- 任天堂・京セラ・ニデックの公式サイトの会社概要ページ：今回直接取得しておらず、創業・設立・本社所在地はWikipediaおよび公式サイト引用の二次資料で確認した。公式ページでの直接照合は未実施である。"],"tables":[]}]},{"id":"nara","title":"奈良県","sub":"旧大和国","meta":["- 取得日：2026-11-18","- 前提：要約・加工なし、出典つき転記。事実と推測を分け、確認できないことは「未確認」と書く。公的・公式出典をWikipediaより優先し、Wikipediaだけの項目は出典の種別にその旨を残す。出典の種別は「公的」「自治体」「その他（内容）」「Wikipedia」の4種。","- 暦の方針：日付は新暦を主にし、1872年末までの日付は旧暦を括弧で併記する。1582年以前の西暦の月日は暦の種別を注記し、分からなければ「暦不明」と書く。出典が旧暦か新暦か判断できない日付は原文のまま書き「暦不明」と注記する。","- 表の列は京都のe・fの形式にそろえた。末尾に「注記・食い違い」「取得不可だったページ」「照合区分の一覧」を付ける。","---"],"a":[{"h":"a. 旧国名と五畿七道","lv":2,"text":["出典：","- Wikipedia「大和国」 https://ja.wikipedia.org/wiki/大和国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「五畿七道」 https://ja.wikipedia.org/wiki/五畿七道 （取得日2026-11-18、種別：Wikipedia）"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["a1","大和国","やまとのくに","日本の地方行政区分である令制国の一つ。畿内に属する。現在の奈良県に相当","律令制定の際の表記は「大倭国（やまとのくに）」として成立したとされる","Wikipedia"],["a2","大和国の別称","―","和州","「大和国」記事の基礎情報欄「別称：和州（わしゅう）」","Wikipedia"],["a3","大和国の異称","―","「神国」","戦国時代を経ても古い寺社が権門領主として大和国を支配していたことから、安土桃山時代には「神国」という異称もあった（記事）","Wikipedia"],["a4","国名表記の変遷","―","大倭国 → 大養徳 → 大倭 → 大和","天平9年12月27日（ユリウス暦:738年1月21日）に表記は「大養徳」に改められた。天平19年3月16日（747年4月29日）には元の「大倭」に改称。その後、天平宝字元年（757年）頃から「大和」に定められたとされる。平安時代以降は「大和」で一般化した","Wikipedia"],["a5","五畿（畿内）","ごき（きない）","大和、山城、摂津、河内、和泉の五国。現在の奈良県、京都府中南部、大阪府、兵庫県南東部を合わせた地域","五畿七道は「畿内七道（きないしちどう）」とも呼ばれた。1869年（明治2年）、北海道が新設されてからは五畿八道と呼ばれる","Wikipedia"],["a6","大和国の郡・郷数","―","15郡39郷","「大和国」記事の基礎情報欄「郡・郷数」による","Wikipedia"],["a7","大和国の郡（15郡）","―","添上郡、添下郡、平群郡、広瀬郡、葛上郡、葛下郡、忍海郡、宇智郡、宇陀郡、式上郡、式下郡、十市郡、高市郡、山辺郡、吉野郡","郡名は『延喜式』による（記事）。古代の郡名として曾布（→添上・添下）、葛城（→葛下・葛上・忍海）、磯城（城上→式上、城下→式下）などの対応も記事に記載","Wikipedia"]]}]},{"h":"注記・食い違い（a）","lv":3,"text":["- 他の旧国にまたがる地域：「大和国」記事の基礎情報欄「相当領域」は「奈良県」とのみあり、奈良県域が大和国以外の令制国にまたがる旨の記述は、取得した記事には見当たらなかった。公的出典での照合は未実施のため、この点は未確認として残す。","- 747年の改称日：「大和国」記事は「天平19年3月16日（747年4月29日）」と西暦日を併記するが、その西暦日がユリウス暦かグレゴリオ暦かの明記はない。738年の改称日については記事が「ユリウス暦:738年1月21日」と明記している。747年分は暦不明として扱う。","- 「大和」への確定時期について、記事の注釈は「国史に改名記事がないため時期は諸説あるが、天平宝字元年（757年）の『養老令』施行からが有力視される（上田正昭『私の日本古代史（上）』）」としている。断定ではないため「とされる」として転記した。"],"tables":[]},{"h":"取得不可（a）","lv":3,"text":["- なし（指定の候補ページはすべて取得できた）。ただし公的・自治体出典（奈良県公式など）での大和国の相当領域・郡数の照合は今回未実施で、a全体がWikipediaのみの出典である。","---"],"tables":[]}],"b":[{"h":"b. 江戸時代の藩と藩主","lv":2,"text":["出典：Wikipedia「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧 （取得日2026-11-18、種別：Wikipedia）および各藩・藩主の個別記事（出典一覧は本節末尾）。公的・自治体出典での照合は本節では未実施。読みが藩記事になく個人記事も取得できなかった藩主は「―（記事に読みなし）」とした。","「藩の一覧」の大和国の項に挙がる藩は次の16藩：柳生藩（1636年-）、郡山藩（1615年-）、小泉藩（1600年-）、柳本藩（1600年-）、戒重藩（1615年-）、芝村藩（1745年-）、櫛羅藩（1863年-）、宇陀松山藩（1600年-）、高取藩、興留藩（1679年-）、竜田藩（1601年-）、田原本藩（1868年-）、岸田藩、大和新庄藩（1600年-）、御所藩（1600年-）、大和五条藩（1600年-）。","※同記事の凡例：「設立後、すぐに廃藩となった藩などは記されていない場合がある」。なお興留藩について一覧は「1679年-」とするが、個別記事「興留藩」は立藩を貞享3年（1686年）とし、食い違いがある（注記参照）。"],"tables":[{"cols":["番号","藩名","読み","立藩年","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城・陣屋","出典の種別"],"rows":[["1","柳生藩","やぎゅうはん","記事に単一の立藩年の明記なし（初代の在職は寛永13年＝1636年〜。宗矩の死後に分知され一時旗本となり、寛文8年（1668年）に大名復帰）","柳生宗矩（やぎゅう むねのり）","柳生俊益（やぎゅう とします）※第13代","1万2500石→8300石（旗本）→1万石","柳生陣屋","Wikipedia"],["2","郡山藩","こおりやまはん","元和元年（1615年）（水野勝成が6万石で入って立藩）","水野勝成（みずの かつなり）","柳沢保申（やなぎさわ やすのぶ）※柳沢家第6代","水野家6万石→松平（奥平）家12万石→本多家15万石→12万石→松平（藤井）家12万石（本文では信之は8万石で入封とあり食い違い・注記参照）→本多家12万石→5万石→柳沢家15万1000石","郡山城（大和郡山市）","Wikipedia"],["3","小泉藩","こいずみはん","慶長5年（1600年）（片桐貞隆が大和小泉1万石に移され立藩。個人記事「片桐貞隆」には1615年に1万6千石を知行とあり食い違い・注記参照）","片桐貞隆（かたぎり さだたか）","片桐貞篤（かたぎり さだあつ）※第12代","1万石→1万6000石→1万3000石→1万2000石→1万1000石（歴代藩主表見出しは1万2000石の段階を欠く）","小泉陣屋（大和郡山市小泉町）","Wikipedia"],["4","柳本藩","やなぎもとはん","記事に「立藩」の明記なし（初代の藩主就任は元和元年（1615年）8月12日。織田有楽（長益）の分与による）","織田尚長（おだ なおなが）","織田信及（おだ のぶひろ）※第13代","1万石（変遷の記載なし）","柳本陣屋（天理市柳本町。家格は城主格大名）","Wikipedia"],["5","戒重藩","かいじゅうはん","元和元年（1615年）（織田有楽の分与により織田長政の戒重藩と尚長の柳本藩が成立）","織田長政（おだ ながまさ）","―（戒重藩時代のみを区切った最後の藩主の記載は記事になし。通しの最後は芝村藩の織田長易）","1万石（当初は9980石余とも伝えられる）","戒重陣屋（桜井市戒重。元和4年（1618年）に戒重城跡に陣屋を設けた）","Wikipedia（「戒重藩」は「芝村藩」記事へリダイレクト）"],["6","芝村藩","しばむらはん","藩の成立は戒重藩と同一（1615年）。芝村藩の名称の起点は延享2年（1745年）の藩庁移転","織田長政（おだ ながまさ）※通しの初代。芝村移転時の藩主は第7代織田輔宜（すけよし）","織田長易（おだ ながやす）※第11代","1万石（変遷の記載なし）","芝村陣屋（桜井市芝。寛保2年（1742年）完成、1745年移転）","Wikipedia"],["7","櫛羅藩","くじらはん","文久3年（1863年）（永井直壮が櫛羅に陣屋を新設して成立。1680年立藩とする事典の説もあり・注記参照）","永井直壮（―（記事に読みなし））","永井直哉（―（記事に読みなし））※第2代","1万石","櫛羅陣屋（御所市櫛羅）","Wikipedia"],["8","宇陀松山藩","うだまつやまはん（別称：大和松山藩）","記事に立藩年の明記なし（福島高晴が慶長5年（1600年）〜在任と歴代藩主表に記載。関ヶ原の功績により長島から加増転封されて立藩）","福島高晴（ふくしま たかはる）","織田信休（おだ のぶやす）※織田家第5代。元禄8年（1695年）に2万石に減らされ丹波国柏原藩へ減移封され廃藩","福島家3万1717石→織田家2万8000石（信雄入封時は大和・上野合わせて5万石）","松山陣屋（宇陀市大宇陀）","Wikipedia"],["8-補","郡山新田藩（郡山藩の支藩）","こおりやましんでんはん","寛永16年（1639年）（本多政勝の郡山移封にともない本多勝行が4万石を分知）","本多勝行（―（記事に読みなし））","本多政利（―（記事に読みなし））※延宝7年（1679年）に明石藩へ移封され廃藩","4万石→3万石と1万石→6万石と1万石","記事に居城・陣屋の明記なし（未確認）","Wikipedia（「郡山藩」記事内の支藩の節）"],["9","高取藩（本多家時代）","たかとりはん","慶長5年（1600年）に本多俊政が戦功により2万5000石に加増（歴代藩主表見出しは「3万石（異説として2万5000石）」）。寛永14年（1637年）に本多家断絶、以後は桑山一玄・小出吉親による城番時代","本多俊政（ほんだ としまさ）","本多政武（―（記事に読みなし））※第2代","1万5000石（秀長家臣時代）→2万5000石（異説3万石）","高取城（高取町）","Wikipedia"],["10","高取藩（植村家時代）","たかとりはん","寛永17年（1640年）10月19日（植村家政が2万5000石に加増されて大名となり再び立藩）","植村家政（うえむら いえまさ）","植村家壺（うえむら いえひろ）※第14代","2万5000石→2万500石（分知による）→2万5000石（第9代家長の功績で4500石加増）","高取城（藩庁。寛永末期から藩主・家臣団は城下に移転し城には城番のみ）","Wikipedia"],["11","興留藩","おきどめはん","貞享3年（1686年）8月（松平信通が1万石を継ぎ興留に陣屋を構えて立藩。「藩の一覧」は1679年-とし食い違い・注記参照）","松平信通（―（記事に読みなし））※1代のみ","松平信通（同左）","1万石","興留（斑鳩町興留）に陣屋（名称の明記なし）","Wikipedia"],["12","竜田藩","たつたはん","慶長6年（1601年）（片桐且元が竜田に2万8000石の大名として取り立てられた）","片桐且元（―（記事に読みなし））","片桐為次（―（記事に読みなし））※第4代。承応3年（1654年）の父・為元の死後に継ぎ、翌年11月に15歳で死去、無嗣で廃藩","1万石→2万8000石→4万石→1万石（為元の相続時に4万石から1万石へ減）","未確認（取得した記事本文に居城・陣屋の明記なし）","Wikipedia"],["13","田原本藩","たわらもとはん","慶応4年（1868年）7月14日（新政府により1万石の大名となった「維新立藩」。江戸時代を通じては交代寄合・平野家の知行地）","平野長裕（ひらの ながひろ）※初代かつ最後の正式な藩主（在任約3年）。知行地としての初代領主は平野長泰（ながやす）","平野長裕（同左）","5000石→1万石","田原本陣屋（田原本町）","Wikipedia"],["14","岸田藩","―（取得不可）","未確認","未確認","未確認","未確認","未確認","Wikipedia（取得不可）"],["15","大和新庄藩（桑山家）","やまとしんじょうはん（新庄村成立以前は布施藩（ふせはん）とも）","慶長5年（1600年）説（『徳川加封録』）と慶長6年（1601年）説（『寛政譜』）の両論併記","桑山一晴（くわやま かずはる）","桑山一尹（―（記事に読みなし））※第4代。天和2年（1682年）5月に改易","2万石→1万6000石→1万3000石→1万1000石","新庄城／新庄陣屋（葛城市新庄。屋敷山古墳の墳丘を利用）","Wikipedia"],["16","大和新庄藩（永井家）","同上（「新庄藩」と呼ばれる）","延宝8年（1680年）より永井氏が当地周辺で1万石を領する（定府の大名で、新庄村に陣屋を置いたとも伝えられていない）","永井直圓（なおみつ）※本文の表記は「直円（なおみつ）」、歴代藩主欄は「直圓」","永井直壮（―（記事に読みなし））※第8代。文久3年（1863年）に櫛羅へ陣屋を移し以後は櫛羅藩","1万石","―（陣屋なし。1863年に櫛羅陣屋を新設）","Wikipedia"],["17","御所藩","ごせはん","慶長5年（1600年）の分与により成立（最大時2万6000石、2代約30年）","桑山元晴（くわやま もとはる）","桑山貞晴（―（記事に読みなし））※第2代。寛永6年（1629年）に無嗣で死去し、末期養子が認められず廃藩","1万2000石→1万石→1万6000石→2万6000石（個人記事「桑山元晴」では2万6380石とあり食い違い・注記参照）","御所陣屋（御所市。所在地は正確にはわかっていないと記事に記載）","Wikipedia"],["18","大和五条藩","やまとごじょうはん（別名：五条二見藩、二見五条藩）","慶長5年（1600年）に五條1万石を与えられ立藩とする本文と、『寛政譜』による慶長13年（1608年）7月に二見五條で1万石を与えられたとする記述の両論併記","松倉重政（まつくら しげまさ）※1代のみ","松倉重政（同左）。元和2年（1616年）に肥前島原藩4万3000石へ加増移封され廃藩、旧藩領は幕府領となった","1万石","二見城（二見五条、五條市二見町）","Wikipedia"]]}]},{"h":"飛地（本拠が県域外の藩の大和国内領地）","lv":3,"text":["出典：Wikipedia「大和国」 https://ja.wikipedia.org/wiki/大和国 （取得日2026-11-18、種別：Wikipedia）","同記事の『旧高旧領取調帳』に基づく明治初年時点の国内支配一覧（1,497村・495,885石余）に、飛地領として挙がる他国の藩は次のとおり。","※このほか同郡内に公家領（添上郡）、能楽師領（添上郡）、奈良楽人領（平群郡）の記載がある。"],"tables":[{"cols":["藩名","本拠","大和国内の飛地がある郡（記事の記載どおり）"],"rows":[["伊勢津藩","伊勢国","添上郡、式上郡、十市郡、山辺郡"],["伊勢久居藩（津藩支藩）","伊勢国","添上郡、広瀬郡、式上郡、十市郡、山辺郡"],["下野壬生藩","下野国","葛下郡"],["上総大多喜藩","上総国","十市郡"]]}]},{"h":"幕府領・旗本領","lv":3,"text":["出典：Wikipedia「大和国」、「遠国奉行」 https://ja.wikipedia.org/wiki/遠国奉行 、「五條代官所」 https://ja.wikipedia.org/wiki/五條代官所 （いずれも取得日2026-11-18、種別：Wikipedia）","- 幕府領の管轄：明治初年時点の一覧では、奈良奉行が添上・平群・葛上・葛下・式上・式下・忍海・宇陀・高市・十市・山辺の各郡に、五條代官所が葛上・宇智・宇陀・吉野の各郡に、それぞれ幕府領の管轄として記載されている。","- 奈良奉行：「遠国奉行」記事の奈良奉行の節による。慶長18年（1613年）設置。京都所司代の指揮下で奈良の町政および寺社を管轄し、興福寺・東大寺など南都の大寺院の監視と門前町（北町・南町）の支配のため設置された（南都町奉行とも）。定員1、2名、役高1,000石。奉行所は現・奈良女子大学の敷地内に置かれていた。","- 五條代官所：寛政7年（1795年）に大和国宇智郡五條村（現在の五條市本町）に設けられた。文久3年（1863年）の天誅組の変で襲撃・放火され、元治元年（1864年）10月に新町村（現在の五條市新町三丁目）で再建。明治3年（1870年）2月、旧代官所を県庁として五條県が設置され、旧代官所管轄地や旧旗本領を管轄した。","- 高取藩による幕府領の預かり：「高取藩」記事による。第5代藩主・植村家包の時代の元文3年（1738年）から大和国における幕府領の預かりを任され、第9代・植村家長の時代には預かり地が6万6000石近くになった。","- 旗本領：「大和国」記事の一覧では、添下・平群・葛下・式上・式下・宇智・高市・十市・山辺・吉野の各郡に「旗本領」の記載がある。沿革欄：「慶応4年5月21日（1868年7月10日）— 寺社領・旗本領が奈良府の管轄となる」。","- 寺社領：同記事の総括文：「下記のほか葛上郡・忍海郡・宇智郡を除く各郡に寺社領が所在」。","- 宇陀松山藩の廃藩後：「宇陀松山藩」記事による。元禄8年（1695年）の廃藩以後、旧領は「江戸時代を通じて天領となった」と記載。"],"tables":[]},{"h":"注記・食い違い（b）","lv":3,"text":["1. 興留藩の立藩年：「藩の一覧」は「1679年-」とするが、個別記事「興留藩」は立藩を貞享3年（1686年）8月とする。両論併記。","2. 郡山藩・松平信之の石高：歴代藩主表の見出しは「松平（藤井）家 譜代 12万石（1679年 - 1685年）」だが、藩史本文は「忠国移封後は、播磨国明石藩から松平信之が8万石で入る」とする。記事内の食い違いとして併記。","3. 小泉藩の立藩：藩記事は慶長5年（1600年）に1万石で立藩とするが、初代の個人記事「片桐貞隆」の略歴は「1615年、大和国小泉に1万6千石を知行した」とする。両論併記。また石高について、歴代藩主表見出しは1万2000石の段階を欠くが、藩史本文には第3代・片桐貞房の分与で1万2000石となった記述がある。","4. 櫛羅藩の立藩年：藩記事本文は文久3年（1863年）の陣屋新設をもって立藩とするが、同記事の注釈が引く『藩と城下町の事典』は1680年に永井直円が櫛羅で1万石を与えられて立藩とし、『角川新版日本史辞典』附録は1680年に新庄へ入封・1863年に居所を移して新庄藩は廃藩とする。両論併記。","5. 大和新庄藩の立藩年：慶長5年（1600年）説（『徳川加封録』）と慶長6年（1601年）説（『寛政譜』）を記事が併記。両論併記。また永井家の始祖の表記は本文「直円（なおみつ）」、歴代藩主欄「直圓」で揺れがある。","6. 御所藩の最大石高：歴代藩主表見出しは2万6000石、個人記事「桑山元晴」は慶長14年（1609年）に「2万6,380石を領する大名となった」とする。両論併記。","7. 大和五条藩の立藩年：本文の慶長5年（1600年）説と『寛政譜』の慶長13年（1608年）説を記事が併記。両論併記。","8. 高取藩の本多家の石高：歴代藩主表見出しは「3万石（異説として2万5000石）」とし、藩史本文は関ヶ原の戦功で2万5000石に加増（異説として3万石）とする。両論併記。","9. 芝村藩の最後の藩主の読み：歴代藩主表では第10代・織田長恭と第11代・織田長易がいずれも「ながやす」と表記されている。記事の表記どおり転記した。","10. 柳生藩の廃藩年：取得した記事本文に廃藩置県の記述がなく、最後の藩主の在職が明治2年（1869年）までとされるのみのため、廃藩年は未確認とした。","11. 田原本藩の廃藩年：取得した記事本文に廃藩年・経緯の記載がなく未確認とした。","12. 竜田藩の居城・陣屋：取得した記事本文に名称の明記がなく未確認とした。また最後の藩主・片桐為次の死去は「翌年11月」とのみ記され、元号・西暦の明記はない（承応3年（1654年）の翌年）。","13. 奈良奉行の単独記事：日本語版「奈良奉行」の単独記事は取得できなかったため、「遠国奉行」記事中の奈良奉行の節の記述を転記した。"],"tables":[]},{"h":"取得不可（b）","lv":3,"text":["- Wikipedia「岸田藩」 https://ja.wikipedia.org/wiki/岸田藩 — 取得失敗のため再取得できず、内容未確認（「藩の一覧」の大和国の項には藩名のみ挙がる）。","- 藩主個人記事（レート制限429のため取得不可）：「永井直壮」「永井直哉」「松平信通」「片桐且元」「片桐為次」「桑山一尹」「桑山貞晴」— このため当該藩主の読みは「―（記事に読みなし）」のまま残した。"],"tables":[]},{"h":"出典一覧（b、取得日はいずれも2026-11-18、種別はいずれもWikipedia）","lv":3,"text":["- 「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧","- 「柳生藩」「郡山藩」「小泉藩」「柳本藩」「芝村藩」（「戒重藩」からリダイレクト）「櫛羅藩」「宇陀松山藩」「高取藩」「興留藩」「竜田藩」「田原本藩」「大和新庄藩」「御所藩」「大和五条藩」「大和国」「遠国奉行」「五條代官所」（各 https://ja.wikipedia.org/wiki/記事名 ）","- 読みの出典：「水野勝成」「柳沢保申」「片桐貞隆」「片桐貞篤」「本多俊政」「植村家政」「植村家壺」「桑山一晴」「桑山元晴」「松倉重政」","---"],"tables":[]}],"c":[{"h":"c-1. 表：廃藩置県で県になった旧藩と、幕府領から県になったもの","lv":3,"text":["前提：廃藩置県は1871年8月29日（明治4年7月14日）に実施され、各藩はそのまま県を名乗った（Wikipedia「廃藩置県」 https://ja.wikipedia.org/wiki/廃藩置県 、取得日2026-11-18、種別：Wikipedia）。大和国の県として同記事のリストに挙がるのは、柳生県・郡山県・小泉県・柳本県・芝村県・田原本県・高取県・櫛羅県と、廃藩置県以前から存在した奈良県・五條県の計10県である。第1次府県統合での奈良県設置は、1872年1月2日（明治4年11月22日）布告（法令全書所収・太政官布告第614号）による「奈良県 - 大和国一円」と同記事にある。同記事は断りとして「合併の期日も、資料によってはこれと異なるものもある」と記す。","注記（飛地の5藩）：奈良県立図書館「奈良県の誕生」は「大和8藩以外に久居・津・大多喜・壬生・和歌山の他藩領があったが、いずれも明治4年11月22日に奈良県となった」とする。これら5藩は本拠地でそれぞれ県を名乗っており（Wikipedia「廃藩置県」のリストでは津県・久居県は伊勢国、和歌山県は紀伊国、大多喜県は上総国、壬生県は下野国に分類）、大和国内の飛地領が奈良県に編入されたものである。奈良県公式の県政略年表は統合について「奈良・五條を含む15県を廃し、奈良県を設置」と記しており、上の10県にこの5藩を加えた数え方とみられるが、年表自体に15県の内訳の明記はない（未確認）。","注記（五條県の管轄の変遷）：Wikipedia「五條県」によれば、1870年4月27日（明治3年4月27日）に堺県のうち紀伊国内の旧高野山領を、1870年6月17日（明治3年5月19日）に軍務官・兵部省管轄の大和国吉野郡十津川郷を、それぞれ管轄に加えた。"],"tables":[{"cols":["番号","県名","読み","前身","発足日","統合先・廃止先","統合日・廃止日","出典の種別"],"rows":[["1","奈良県（慶応4年設置分）","ならけん","大和鎮撫総督府（大和国一円の幕府領・旗本領・寺社領）","1868年7月8日（慶応4年5月19日）","奈良県（大和国一円を管轄する統合後の奈良県）","1872年1月2日（明治4年11月22日）","Wikipedia／自治体"],["2","五條県","ごじょうけん","五條代官所の管轄区域・大和国南部の旧旗本領・河内国南部の旧幕府領・旗本領の一部（旧幕府領・旗本領から設置）","1870年3月28日（明治3年2月27日）","大和国分は奈良県、河内国分は堺県、紀伊国分は和歌山県へ。同日、五條県廃止","1872年1月2日（明治4年11月22日）","Wikipedia／自治体"],["3","郡山県","こおりやまけん","郡山藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["4","高取県","たかとりけん","高取藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["5","小泉県","こいずみけん","小泉藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["6","櫛羅県","くじらけん","櫛羅藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["7","芝村県","しばむらけん","芝村藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["8","柳生県","やぎゅうけん","柳生藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["9","柳本県","やなぎもとけん","柳本藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["10","田原本県","たわらもとけん","田原本藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"]]}]},{"h":"c-2. 奈良県の設置・廃止・再設置","lv":3,"text":["出典：Wikipedia「奈良県」 https://ja.wikipedia.org/wiki/奈良県 、「奈良県再設置運動」 https://ja.wikipedia.org/wiki/奈良県再設置運動 、奈良県公式「県政沿革」、奈良県立図書館「奈良県の誕生」、Wikisource「奈良縣設置ノ件」（取得日はいずれも2026-11-18）。","- 1868年2月14日（慶応4年1月21日）：新政府が添上郡奈良に大和鎮台を設置。大和鎮撫総督府を経て（県政略年表では「のち2月1日大和国鎮撫総督府と改称」）。","- 1868年7月8日（慶応4年5月19日）：奈良県（第1次）を設置。大和国一円の幕府領・旗本領・寺社領を管轄。初代知事（知県事）は春日仲襄。","- 1868年9月15日（慶応4年7月29日）：奈良府に改称。","- 1869年8月24日（明治2年7月17日）：奈良県に改称（日付に食い違いあり、注記参照）。","- 1870年：宇智郡・吉野郡などを五條県へ移管（五條県の設置は上表のとおり）。","- 1872年1月2日（明治4年11月22日）：大和国の各県が統合され、大和国一円を管轄する奈良県が設置された（第1次府県統合）。県庁は興福寺一乗院、県令は五條県知事だった四条隆平（県立図書館「奈良県の誕生」）。","- 1876年4月18日：奈良県は堺県に編入されて廃止（第2次府県統合）。","- 1881年2月7日：堺県が大阪府に編入されて廃止。同年12月、今村勤三ら大和出身の大阪府会議員を中心に奈良県再設置運動が開始された。","- 1887年11月4日：奈良県（第2次）が再設置された。根拠法令は明治20年勅令第59号「奈良縣設置ノ件」（公布日：明治20年11月4日、底本『官報』1887年11月10日）。勅令の本文は「奈良縣ヲ置ク／縣廰位置 大和國添上郡奈良／管轄 大和國一圓」。初代県知事は税所篤。","- 1887年12月1日：奈良県庁開庁（県政略年表「12月1日 奈良県開庁。（知事に税所篤）」、県立図書館「奈良県の誕生」も「12月1日に奈良県庁開庁式」）。"],"tables":[]},{"h":"c-3. 公式照合の結果","lv":3,"text":["照合できたもの","- 奈良県公式サイト「県政沿革」（『奈良県政概要』第1章、PDF https://www.pref.nara.lg.jp/documents/12514/n040101_02.pdf 、種別：自治体）：慶応4年1月21日 大和鎮台設置、2月1日 大和国鎮撫総督府と改称、5月19日 奈良県を置く、7月29日 奈良府と改称、明治2年7月17日 奈良県と改称、明治4年11月22日「奈良・五條を含む15県を廃し、奈良県を設置」、明治14年2月7日 堺県が大阪府に合併、明治20年11月4日 大阪府から分離して奈良県が置かれる、12月1日 奈良県開庁——の日付が年表形式で確認できた。","- 奈良県公式サイト「奈良県はいつできたのかな」 https://www.pref.nara.lg.jp/n002/1335.html （種別：自治体）：明治元年（1868年）に奈良県、明治4年（1871年）に大和国内に15県ができそののち大和全域を管轄する奈良県、明治9年（1876年）に堺県へ合併、明治14年（1881年）に堺県が大阪府へ合併、明治20年（1887年）に奈良県再設置——年までの照合ができた（日付レベルではない）。","- 奈良県立図書館「奈良県の誕生」 https://www.library.pref.nara.jp/sites/default/files/002_s.pdf （種別：自治体）：大和鎮台（1.1.21）→奈良県（1.5.19）→奈良府（1.7.29）→奈良県（2.7.17）→五條県（3.2.27）→奈良県（4.11.22）→堺県（9.4.18）→大阪府（14.2.7）→奈良県（20.11.4）の変遷図と、各藩県の発足（4.7.14）が確認でき、Wikipediaの日付と一致した。","照合できなかったもの","- 国立公文書館／アジア歴史資料センター（JACAR）：太政類典に収録されるはずの第1次府県統合・堺県編入の記録、および明治20年勅令第59号の御署名原本について、今回の検索範囲では該当文書そのものに到達できず、未確認（照合未実施）。なお勅令第59号の本文自体は、Wikisource「奈良縣設置ノ件」 https://ja.wikisource.org/wiki/奈良縣設置ノ件 （底本：『官報』1887年11月10日、国立国会図書館デジタルコレクション）で確認できた。奈良県公式の県政だより記事（「県民だより奈良」2022年11月号）には「奈良県設置の勅令（国立公文書館所蔵）」の写真が掲載されている旨が二次的に確認できるのみである。"],"tables":[]},{"h":"注記・食い違い（c）","lv":3,"text":["1. 奈良府から奈良県への改称日：1869年8月24日（明治2年7月17日）とするもの（奈良県公式「県政沿革」、奈良県立図書館「奈良県の誕生」の変遷図、Wikipedia「奈良県」）に対し、Wikipedia「奈良県再設置運動」は「明治2年（1869年）7月12日に再び奈良県に戻されている」と記す。食い違いとして両方を併記する。公式資料はいずれも7月17日である。","2. 統合で廃された県の数：Wikipedia「廃藩置県」の大和国リストとWikipedia「奈良県」（「大和国10県が統合」）は10県、奈良県公式（「県政略年表」および「奈良県はいつできたのかな」）は15県とする。食い違い。15県は飛地を持つ5藩（久居・津・大多喜・壬生・和歌山）を加えた数と整合するが、公式年表に内訳の明記はなく、その点は未確認。","3. 五條県の成立時の構成：奈良県立図書館「奈良県の誕生」は「奈良県管轄の大和国宇智郡・吉野郡が分離して、河内国の一部と紀伊国の一部とともに新たに五條県が成立」とする。東書Eネットは「奈良県の宇智、吉野郡と堺県の錦部、石川両郡をあわせて五條県が成立」とする。Wikipedia「五條県」は「奈良県のうち旧五條代官所の管轄区域、大和国南部の旧旗本領および河内国南部の旧幕府領・旗本領の一部を管轄」とし、高野山領（紀伊国）と十津川郷は設置後に編入されたとする。記述に差異があるため併記する。","4. 五條県の管轄に葛上郡・宇陀郡が含まれるか：Wikipedia「奈良県」は明治3年に「宇智郡・吉野郡および葛上郡・宇陀郡の一部を五條県に移管」と記すが、Wikipedia「五條県」は「旧高旧領取調帳」以外の資料に葛上郡・宇陀郡の記述がなく「誤記と考えられる」と記す。食い違い。","5. 第1次府県統合の期日について：Wikipedia「廃藩置県」は、太政官布告に基づく一覧を示しつつ「合併の期日も、資料によってはこれと異なるものもある」と断っている。奈良県については布告日と統合日が同日（明治4年11月22日）とされているが、布告日と実施日の区別は同記事上も明確には分かれていない（未確認）。"],"tables":[]},{"h":"取得不可・未確認（c）","lv":3,"text":["- 国立公文書館／アジア歴史資料センター（JACAR）の該当文書（太政類典所収の府県統合・堺県編入の記録、明治20年勅令第59号の御署名原本）：今回の検索では文書そのものに到達できず、取得不可（未確認）として扱う。日付の照合は奈良県公式サイト・奈良県立図書館資料とWikipediaの範囲で完了し、JACARでの照合はできなかった。","- 15県の内訳（公式年表の明記なし）：未確認。","- 第1次府県統合における奈良県設置の布告日と実施日の区別：未確認。","---"],"tables":[]}],"d":[{"h":"d-1. 県名「奈良県」の由来（事実として出典に記されるもの）","lv":3,"text":["奈良県公式サイト「奈良県はいつできたのかな」 https://www.pref.nara.lg.jp/n002/1335.html （取得日2026-11-18、種別：自治体）の「※県名の由来」には、次のとおり記されている。「平安時代から鎌倉時代にかけて、東大寺や興福寺の門前町として『奈良町』が生まれ、江戸時代には幕府の奉行所がおかれて政治の中心となりました。明治時代になって県名をつけるとき、それをとったのが由来です。」Wikipedia「奈良県再設置運動」 https://ja.wikipedia.org/wiki/奈良県再設置運動 （種別：Wikipedia）も「奈良県という名の由来は、東大寺や興福寺の門前町で、幕府の奉行所が置かれていた『奈良町』からとられたものである」と記す。東書Eネット「都道府県の豆知識 奈良県」 https://ten.tokyo-shoseki.co.jp/ten_download/2020/2020078366.htm （種別：その他（教育サイト））の県名の由来も同旨である。","県名の決定時期：県名「奈良県」が初めて現れるのは1868年7月8日（慶応4年5月19日）の奈良県設置のときで（c-2参照）、県庁所在地の奈良（奈良町）の名をとったものとされる。1887年の再設置でも、勅令第59号は「奈良縣ヲ置ク」とし、県庁位置を「大和國添上郡奈良」と定めた。"],"tables":[]},{"h":"d-2. 地名「奈良」の語源（諸説。いずれも仮説であり、確定した事実ではない）","lv":3,"text":["出典：Wikipedia「奈良」 https://ja.wikipedia.org/wiki/奈良 （取得日2026-11-18、種別：Wikipedia）。同記事は「奈良の語源を巡っては諸説あるが、比較的知られているものを挙げる」と前置きする。","説1 『日本書紀』による説","武埴安彦命の反乱鎮圧に向かった大彦命らの軍勢が、当地の丘（平城山丘陵）の草木を踏みならしたという記録に由来するとする。『日本書紀』崇神天皇十年九月条に「則ち精兵（ときいくさ）を率（ゐ）て、進みて那羅山に登りて軍（いくさだち）す。時に官軍（みいくさ）屯聚（いは）みて、草木を蹢跙（ふみなら）す。因りて其の山を号（なづ）けて、那羅山と曰ふ」とある。同記事は「これ自体はよくある地名由来譚であり史実とみる研究者は少ないものの、最古の史料として必ず言及され、また下記の柳田説とも言語学的関連がある」と記す。","説2 柳田國男による説","「平（なら）した地」の意で、緩傾斜地を指すとする説。柳田國男が『地名の研究』（1936年）で論じた。柳田によれば、東国では平（タヒラ）、九州南部ではハエと呼ばれる「山腹の傾斜の比較的緩やかなる」地形は、中国・四国ではナルと呼ばれ、ナラス（動詞）・ナラシ（副詞）・ナルシ（形容詞）はその変化形である。ナルと呼ばれる地名には「平」を含んだ漢字が当てられており、「文字が語義を証明している」とする。『因幡志』（1795年）巻14に「平地」と書いて「ナルヂ」の振仮名があることも根拠に挙げる。ナラ・ナロはその異種で、奈良はかつて「平城」とも書かれた。同記事は、この説が日本国語大辞典、各種の地名辞典や郷土史本でも取り上げられていると記す。奈良市第4次総合計画（奈良市公式 https://www.city.nara.lg.jp/uploaded/attachment/30231.pdf 、種別：自治体）も「一般に古代人の住居に適したなだらかな丘陵地を意味する平地（なるじ）、平（なら）などのナラとする説」を挙げており、この系統の説を自治体資料でも確認できる。","説3 吉田東伍による説","植物の「ナラ（楢）」に由来するとする説。吉田東伍による（『大日本地名辞書』1907年）。植物のナラは『万葉集』や『播磨国風土記』（715年）に見られ、『播磨国風土記』には「楢原（ならはら）と号（なづ）くる所以は、柞（なら）此の村に生へり。故、柞原といふ」とある。角川日本地名大辞典はこの説も取り上げるが、楠原佑介ほか（『古代地名語源辞典』）はこの説を退けると同記事は記す。","説4 朝鮮語からの借用語とする説","朝鮮語「나라（ナラ）」（国の意）からの借用語とする説。朝鮮語の影響の指摘は金沢庄三郎『寧楽考』（1910年）に見られる。文献でナラの語が確認できるのは15世紀（『竜飛御天歌』1447年など）で、より古くは *narak という発音だったと考えられる。一方、ナラ・ナル・ナロという地名が奈良以外にも多く存在することを説明できないという否定的意見もある（楠原ほか）。奈良市第4次総合計画も「渡来人の居住地を古代の朝鮮で国を意味する言葉からナラと名付けたことから、ナラの地名がおこったとする説」を併記している。","説5 ツングース諸語との関連をみる説","ツングース系のいくつかの言語や日本語（さらに高句麗の言語）では na が「地」などの意味を表すが、「奈良」の語源はこれと関係するのではないかとみる説がある（同記事。出典として奈良市編『奈良市史』1937年などが引かれる）。","なお、表記については「奈良」の異表記として那羅・平城・寧楽・乃楽・楢などがあり、読みは全て「なら」である（Wikipedia「奈良」）。"],"tables":[]},{"h":"注記（d）","lv":3,"text":["- 「奈良」の語源の諸説はいずれも仮説であり、Wikipedia「奈良」自体が「諸説ある」とする。説1は「史実とみる研究者は少ない」と記事が明記する。県名の由来（奈良町からとった）とは別の問題として分けて扱った。","---"],"tables":[]}],"e":[{"h":"e. 有名な城","lv":2,"text":["出典（取得日はいずれも2026-11-18）：","- Wikipedia「郡山城 (大和国)」 http://ja.wikipedia.org/wiki/郡山城_(大和国) （種別：Wikipedia）※基礎情報欄は検索結果に表示された記事抜粋で確認。本文の直接取得は未実施（取得不可参照）","- Wikipedia「高取城」 https://ja.wikipedia.org/wiki/高取城 （種別：Wikipedia）","- Wikipedia「多聞山城」 https://ja.wikipedia.org/wiki/多聞山城 （種別：Wikipedia）","- Wikipedia「筒井城」 https://ja.wikipedia.org/wiki/筒井城 （種別：Wikipedia）","- Wikipedia「信貴山城」 https://ja.wikipedia.org/wiki/信貴山城 （種別：Wikipedia）","- Wikipedia「現存天守」 https://ja.wikipedia.org/wiki/現存天守 （種別：Wikipedia）","- 奈良県公式「郡山城」 https://www.pref.nara.lg.jp/ikasu-nara/naranoshiro/koriyamajo/index.html （種別：自治体）","- 大和郡山市公式「郡山城～国史跡・続日本100名城・日本さくら名所100選～」 https://www.city.yamatokoriyama.lg.jp/soshiki/chiikishinkoka/kanko/2/1630.html （種別：自治体）","- 大和郡山市公式「国38 郡山城跡」 https://www.city.yamatokoriyama.lg.jp/soshiki/machidukuri_senryaku/rekishi_bunkazai/bunkazai101/j_bunkazai/shiseki/1847.html （種別：自治体）","- 大和郡山市公式「令和7年3月『幻の天守(閣)』」 https://www.city.yamatokoriyama.lg.jp/soshiki/hisyoka/shichoshitsu/1/reiwa7/16211.html （種別：自治体）","- 大和郡山市「史跡郡山城跡整備基本計画」第3章 https://www.city.yamatokoriyama.lg.jp/material/files/group/63/seibi_kihon_keikaku03.pdf （種別：自治体）","- 文化庁「文化審議会の答申（史跡等の指定等）について」（令和4年6月17日） https://www.bunka.go.jp/koho_hodo_oshirase/hodohappyo/pdf/93721801_01.pdf （種別：公的）※郡山城跡の答申部分は検索結果に表示された抜粋で確認"],"tables":[{"cols":["番号","名称","読み","築城者","築城年","廃城年または現状","現存・再建建物","出典の種別"],"rows":[["1","大和郡山城","こおりやまじょう","郡山衆及び筒井順慶","応保2年（1162年）及び天正8年（1580年）","1873年（明治6年）。なお慶長5年（1600年）に一旦取り壊され廃城、元和元年（1615年）以降に再興された（奈良県公式）","現存建物なし（天守は非現存）。再建：追手向櫓、追手東隅櫓、多聞櫓、追手門（梅林門）、極楽橋。天守台は展望施設として整備（平成29年完成）","Wikipedia・自治体・公的"],["2","高取城","たかとりじょう","越智邦澄","元弘2年（1332年）","明治6年（1873年）。ただし天正8年（1580年）に一旦廃城","再建造物なし。城内の現存建物はなし。移築されて現存する門：二の門（子嶋寺山門）、新御殿（藩主下屋敷）の表門、松ノ門。遺構：石垣、堀、井戸など多数","Wikipedia"],["3","多聞山城（多聞城）","たもんやまじょう","松永久秀","永禄2年（1559年）","天正4年（1576年）※基礎情報欄の表記。本文では天正5年（1577年）6月頃に建物が破壊されたとする（注記参照）","再建造物なし。遺構：土塁、空堀。跡地は奈良市立若草中学校の敷地","Wikipedia"],["4","筒井城","つついじょう","基礎情報欄に築城主の記載なし","永享元年（1429年）以前※本文では「築かれた時期については不明」とし、文献上の初見が永享元年（1429年）","天正8年（1580年）8月17日","再建造物なし。天守構造「なし」。遺構：水堀","Wikipedia"],["5","信貴山城","しぎさんじょう","木沢長政","天文5年（1536年）","天正5年（1577年）","再建造物なし。遺構：曲輪、堀切、土塁、門跡、石積。四層の天守櫓があったとされるが「実際の遺構については確認されていない」（記事本文）","Wikipedia"]]}]},{"h":"城ごとの注記","lv":3,"text":["1. 大和郡山城","- 読みは、文化庁の答申資料の振り仮名「こおりやま じょうあと」およびWikipedia冒頭「郡山城（こおりやまじょう）」による。","- 別名：Wikipedia基礎情報欄は「雁陣之城」、奈良県公式は「遠くから見るとちょうど犬が伏せているように見えることから、別名『犬伏城』とも呼ばれています」とする。両方を併記する。","- 天守の規模に食い違いがある。Wikipedia基礎情報欄は「伝5層6階（1583年築・非現存）」。大和郡山市公式「幻の天守(閣)」は、天守台整備に伴う発掘調査で「天守の礎石や金箔瓦が発見され、豊臣政権期に天守が存在していたことが初めて明らかになった」「天守の規模は1階部分が7×8間(約13×15メートル）で、5階建ての建物であったと推定されています」とする。「5層6階」と「5階建て」は階数の数え方が一致しないため、両方を併記し、決めない。","- 一時廃城と再興：奈良県公式の略年表は「慶長5年（1600年）関ヶ原の戦い後、廃城」「元和元年（1615年）水野勝成が修復に取りかかる」とする。本文は慶長5年10月に「取り壊されて伏見城に運ばれます」とする。最終的な廃城年1873年（明治6年）はWikipedia基礎情報欄による。大和郡山市の整備基本計画（第3章）も「郡山城は明治に廃城となってまもなくすべての城郭建築が失われた」とする。","- 再建物の年次：奈良県公式の略年表は「昭和58年（1983年）市民活動により追手門が復元。昭和59年には追手東隅櫓と多聞櫓、昭和62年には追手向櫓が復元」とする。","- 指定文化財：国の史跡。指定年月日は令和4（2022）年11月10日（大和郡山市「史跡郡山城跡整備基本計画」第3章に明記。文化庁の令和4年6月17日付答申にも「郡山城跡」が新指定9件に含まれる）。それ以前は奈良県指定史跡（大和郡山市の計画では「昭和35年（1960）に中心部を構成する曲輪の一部が奈良県指定史跡となった」、奈良県公式の略年表では「昭和36年（1961年）郡山城跡が奈良県指定文化財となる」とあり、年が1年ずれている。両方を併記する）。","- 同名の別の城との混同注意：広島県安芸高田市の郡山城（毛利氏の城。文化遺産オンラインの「郡山城跡」はこちらのもの）、福島県の郡山城とは別の城である。本項は大和国の郡山城のみを扱う。","- 年数の検算：築城1580年〜廃城1873年の差は293年。記事側に年数の主張はない。","2. 高取城","- 築城について、本文は「南北朝時代、南朝方であった越智邦澄が元弘2年（正慶元年、1332年）に築城したのが始まりと伝えられている」とし、「伝えられている」という表現である。そのまま記す。","- 廃城が2回ある。天正8年（1580年）に一旦廃城（本文「織田信長によって大和国内の城は郡山城一城と定められ、高取城は天正8年（1580年）に一旦は廃城となった」）。その後、筒井順慶が天正12年（1584年）に「本格的城塞へと改めた」、本多利久が天正17年（1589年）に「新しい縄張りをもって築造した」と本文にある。移転ではなく同一の山（高取山）での再築・大改修である。","- 最終の廃城：基礎情報欄・本文とも明治6年（1873年）。ただし建物の消滅時期について本文に2つの記述がある。(1)「明治20年（1887年）頃まで天守をはじめとした主要建造物は城内に残っていたが…自然倒壊したとされる」、(2)「明治6年（1873年）に建物の払い下げが行われ…明治24年（1891年）ごろに天守以下の建物全ての取り壊しが行われたともされる」。両方を併記する。","- 天守構造は基礎情報欄に「連立式3重3階地下1階（非現存）」と明記されている。","- 現存構造物について本文は「確認されている高取城の現存構造物はこれらのみである」（二の門、新御殿表門、松ノ門を指す）とする。これらは城内ではなく移築先に現存する。","- 指定文化財：国の史跡。本文に「昭和28年（1953年）3月31日に国の史跡に指定された」とある。","- 強い表現の引用：本文は「日本国内では最大規模の山城で、備中松山城（岡山県）・岩村城（岐阜県）とともに日本三大山城の一つに数えられる」とする（記事の文言そのまま）。","- 年数の検算：1332年〜1873年の差は541年（ただし1580〜1584年頃は廃城期間）。記事側に年数の主張はない。","3. 多聞山城（多聞城）","- 廃城年の食い違い：基礎情報欄は「天正4年（1576年）」。本文は、織田信長の破却命令により天正4年（1576年）7月から破城工事が始まり「天正5年（1577年）6月頃には建物は破壊され」とする。両方を併記する。","- 年数の検算：本文に「城があった期間はわずか16年間だった」とある。築城1559年から1577年までは18年で合わない。入城した永禄4年（1561年）から1577年までは16年で合う。どちらの起算かは記事に明記がないため、未確認として両方を記す。","- 天守について：基礎情報欄は「天守の存在が不明（高矢倉が天守だとするなら4層）」。本文は「天正5年（1577年）の解体時に『高矢倉』と呼ばれた四階櫓がありこれが四重の天守なら、安土城をはじめとする近世城郭における天守の先駆けと言えるが定かではない」とする。断定されていないため、そのまま記す。","- 石材の転用：本文によれば、建物は京都の二条新御所に移築され、石材は筒井城に用いられ、さらに郡山城にも移された。","- 混同注意：大和郡山城の再建物にある「多聞櫓」は櫓の名称であり、多聞山城とは別のものである。","- 築城年・完成年：永禄2年（1559年）築城、永禄4年（1561年）入城、永禄7年（1564年）完成と本文にある。","4. 筒井城","- 築城者：基礎情報欄に「築城主」の欄自体がない。歴代城主の初代は筒井順覚と本文・城主一覧にあるが、築城者とは書かれていないため、築城者は未確認とする。","- 築城年：基礎情報欄は「永享元年（1429年）以前」。本文は「筒井城が築かれた時期については不明であるが、文献上の初見は『満済准后日記』に、大和永享の乱が始まった永享元年（1429年）で城主は筒井順覚。この時は『筒井館』と記載されている事もあった」とする。","- 廃城：本文は「信長の『大和一国破城命令』により廃城とし、居城を郡山城に移した。翌天正8年（1580年）8月17日の事であった」とし、基礎情報欄の廃城年「天正8年（1580年）8月17日」と一致する。","- 天守構造は基礎情報欄に「なし」と明記されている。","- 年数の検算：1429年以前〜1580年のため存続期間は151年以上。記事側に年数の主張はない。","5. 信貴山城","- 築城年の留保：基礎情報欄は築城主・木沢長政、築城年・天文5年（1536年）。ただし本文によれば、城の史料上の初見は長禄4年（1460年）で、中川貴皓によれば『経覚私要抄』の記述が初見とされる。また「南北朝時代に楠木正成によって築城されたという伝承も存在するが、しかし、同時代史料の裏付けはない」と本文にある。1536年は本格的な城郭の築城年として記す。","- 天守櫓の築造年の食い違い：基礎情報欄は「四層の天守櫓（1559年頃築）」。本文の略年表は「永禄3年（1560年）松永久秀、信貴山城に四階櫓を設ける」とする。1559年頃と1560年が併存するため、両方を併記する。","- 松永久秀の入城年について、本文は「松永久秀の信貴山城入城は通説では永禄2年のこととされてきたが、中川貴皓によれば、これは誤りであると考えられる」とする（1559年8月に修築し入場、という記述に基づく）。","- 規模の強い表現の引用：本文は「曲輪の数は110以上あり、奈良県下最大規模の中世城郭である」とする（記事の文言そのまま）。","- 指定文化財：奈良県指定史跡「信貴山城跡」。脚注に「令和7年3月25日奈良県公報より奈良県告示第414号」とある。","- 年数の検算：1536年〜1577年の差は41年。記事側に年数の主張はない。"],"tables":[]},{"h":"現存天守が奈良県にあるかどうか（確認結果）","lv":3,"text":["結論：奈良県内に現存天守はない。","- 根拠：Wikipedia「現存天守」は、江戸時代以前に建設され現代まで保存されている天守は12城とし、その一覧は弘前城（青森県）、松本城（長野県）、丸岡城（福井県）、犬山城（愛知県）、彦根城（滋賀県）、姫路城（兵庫県）、松江城（島根県）、備中松山城（岡山県）、丸亀城（香川県）、松山城（愛媛県）、宇和島城（愛媛県）、高知城（高知県）である。奈良県の城は含まれていない。","- 本表の5城についても個別に確認した。大和郡山城の天守は「非現存」（Wikipedia基礎情報欄）、高取城の天守は「（非現存）」と明記、多聞山城は「天守の存在が不明」、筒井城は天守構造「なし」、信貴山城の天守櫓は「実際の遺構については確認されていない」。いずれも現存天守ではない。"],"tables":[]},{"h":"注記・食い違い（e、まとめ）","lv":3,"text":["1. 大和郡山城の天守の階数：「伝5層6階」（Wikipedia基礎情報欄）と「5階建てと推定」（大和郡山市公式）が一致しない。両方併記。","2. 大和郡山城の別名：「雁陣之城」（Wikipedia）と「犬伏城」（奈良県公式）が併存。両方併記。","3. 大和郡山城の奈良県指定の年：昭和35年（1960年）（大和郡山市の整備基本計画）と昭和36年（1961年）（奈良県公式の略年表）で1年ずれる。両方併記。","4. 多聞山城の廃城年：天正4年（1576年）（基礎情報欄）と、天正5年（1577年）6月頃に建物破壊（本文）が併存。両方併記。","5. 多聞山城の「16年間」という本文の記述は、築城1559年起算（18年）では合わず、入城1561年起算（16年）では合う。起算点は記事に明記がなく未確認。","6. 信貴山城の天守櫓の築造年：「1559年頃」（基礎情報欄）と「永禄3年（1560年）」（略年表）が併存。両方併記。","7. 高取城の建物消滅時期：明治20年（1887年）頃まで残り自然倒壊したとする記述と、明治24年（1891年）ごろに全て取り壊されたとする記述が併存。両方併記。","8. 高取城の築城は「伝えられている」という表現であり、確定した事実としては書かれていない。","9. 筒井城の築城者は未確認（記事に築城主の記載なし）。"],"tables":[]},{"h":"取得不可（e）","lv":3,"text":["- Wikipedia「大和郡山城」（この題名のURL）：取得不可（ページの複製がなく読み取れなかった）。大和国の郡山城の記事の正式な題名は「郡山城 (大和国)」であり、その基礎情報欄は検索結果に表示された記事抜粋（WikipediaおよびWeblio辞書の同一記事抜粋）で確認した。本文の直接取得は未実施のため、大和郡山城の本文レベルの記述は自治体・公的出典で補った。","- Wikipedia「宇陀松山城」：取得不可（取得試行時にリクエスト上限エラー）。奈良県公式「郡山城」ページの関連リンクに「宇陀松山城」が奈良の城の一つとして挙がっていることは確認したが、築城者・築城年・廃城年等は確認できていないため、本表には入れていない（追加候補・未確認）。","- 文化庁「国指定文化財等データベース」の個別ページ：直接の取得は未実施。郡山城跡の国史跡指定については、文化庁の答申資料と大和郡山市の整備基本計画で照合した。高取城・信貴山城の指定情報はWikipedia記事の記述による（文化庁データベースでの個別照合は未実施）。","---"],"tables":[]}],"f":[{"h":"f-1 江戸時代","lv":3,"text":["出典：","- 文化庁「I 奈良漬」（食文化関連調査資料PDF） https://www.bunka.go.jp/seisaku/bunkazai/joseishien/syokubunka_story/pdf/94054901_16.pdf （取得日2026-11-18、種別：公的）","- 文化庁 令和5年度「食文化ストーリー」創出・発信モデル事業 資料 https://www.bunka.go.jp/seisaku/bunkazai/joseishien/syokubunka_story/pdf/94176801_01.pdf （取得日2026-11-18、種別：公的）","- 青梅市文化財資料（そうめん解説PDF） https://www.city.ome.tokyo.jp/uploaded/attachment/10287.pdf （取得日2026-11-18、種別：自治体）","- 株式会社池利「三輪そうめんについて」 https://www.ikeri.co.jp/miwasoumen/index.html （取得日2026-11-18、種別：その他）","- 奈良市観光協会「匠が受け継ぐ伝統の技 奈良の工芸」 https://narashikanko.or.jp/skill （取得日2026-11-18、種別：その他）","- 奈良県公式「奥大和の自然」 https://www.pref.nara.lg.jp/site/okuyamato/jp/about/nature/index.html （取得日2026-11-18、種別：自治体）","- 黒滝村「林業パンフレット」 https://www.vill.kurotaki.nara.jp/cms/wp-content/uploads/2017/03/ringyou-1.pdf （取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","三輪そうめん（表記は出典により「三輪素麺」とも）","みわそうめん","桜井市三輪（大和国）","江戸時代の文献『日本山海名物図会』（宝暦4年・1754年刊）に「大和三輪素麺、名物なり。細きこと糸のごとく、白きこと雪のごとし。ゆでてふとらず余国のより出るそうめんの及ぶ所にあらず」とある（青梅市文化財資料の転記）。同書は江戸時代文献そのもの。お伊勢参りで声価が諸国へ伝わったとも記される（池利サイト）","自治体（青梅市）／その他（池利・e-food.jp）"],["2","奈良漬","ならづけ","奈良（大和国）","文化庁の調査資料によれば、江戸時代の『本朝食鑑』（1697年刊）に「香の物には数種あり、糟漬、甘醴漬、味噌漬、糠漬、乾し瓜等なり、糟漬は家々これを競造る。ただ和の奈良漬、攝の豊田、森口をもって上と為す」とある。商品化は慶長年間（1596～1615年）頃からとされ、奈良の中筋町の漢方医・糸屋宗仙がしろうりを酒粕に漬けて「奈良漬」として売り出したのが一般に売り出されたはじめといわれる（同資料）","公的（文化庁）"],["3","吉野葛","よしのくず（読みは今回の出典には明記なし。未確認）","吉野地方","文化庁「食文化ストーリー」資料に「葛粉づくりの工程が図示された『製葛録』(江戸時代)」との記載があり、江戸時代の文献に吉野の葛粉づくりが図示されていたことまでは確認できる。それ以上の江戸時代の生産・流通の詳細は今回の出典では未確認","公的（文化庁）"],["4","柿の葉寿司","かきのはずし","吉野地方（県南部）","文化庁「食文化ストーリー」資料に「江戸時代中頃には県南部の吉野地方で、夏祭りのごちそうとして、塩鯖を使った柿の葉寿司が生まれました」とある","公的（文化庁）"],["5","奈良筆","ならふで","奈良町（現・奈良市）","奈良市観光協会によれば「今日のような無芯筆がつくられるようになったのは、江戸時代の元禄期になってからです。細井広沢が強弱の毛を組み合わせてまぜ込み、糊で固める水筆をつくり、その後はこの方法による毛筆が多くなり」各地で製造されるようになった。江戸時代の文献・幕府記録での確認ではなく、観光協会の解説による","その他（奈良市観光協会）"],["6","吉野杉","よしのすぎ（読みは今回の出典には明記なし。未確認）","吉野地方（吉野郡）","奈良県公式サイト「奥大和の自然」に「天然林が伐採されたあとに、建築材としてより価値の高い杉や檜を植える植林が江戸時代初期に始められ、現在まで約500年という植林の歴史を持つ吉野林業」とある。黒滝村の林業パンフレットにも「江戸時代には森林資源の減少に伴い、造林の他、山守制度など吉野林業独自の制度が生まれ、大きく発展しました」とある","自治体（奈良県／黒滝村）"]]}]},{"h":"f-2 現代","lv":3,"text":[],"tables":[]},{"h":"（1）経済産業大臣指定 伝統的工芸品","lv":4,"text":["出典：伝統的工芸品産業振興協会「伝統的工芸品指定品目一覧・業種別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （2025年10月27日現在、全244品目、取得日2026-11-18、種別：公的）","当該PDFは業種別の一覧で、奈良県の品目は次の3件のみ。「奈良」の文字で全文検索しても奈良県分はこの3件以外にない（赤膚焼・奈良漆器は同PDFに記載なし）。","参考：奈良通1級テキスト（その他）では「国指定伝統的工芸品（3）」として高山茶筅＝生駒市、奈良筆＝奈良市、奈良墨＝奈良市と産地が併記されている。産地はこの出典による。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","高山茶筌","たかやまちゃせん（読みはPDFに記載なし。未確認）","PDFに産地の記載なし（未確認）","木工品・竹工品の部27番目に記載。表記は「高山茶筌」（注記参照）","公的（伝統的工芸品産業振興協会）"],["2","奈良筆","ならふで","PDFに産地の記載なし（未確認）","文具の部5番目に記載。指定年は奈良市観光協会によれば昭和52年10月","公的（同上）／その他（奈良市観光協会）"],["3","奈良墨","ならずみ（読みはPDFに記載なし。未確認）","PDFに産地の記載なし（未確認）","文具の部6番目に記載","公的（同上）"]]}]},{"h":"（2）地理的表示（GI）登録産品","lv":4,"text":["出典：近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在・近畿18産品、取得日2026-11-18、種別：公的）","奈良県分は1件のみ。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","三輪素麺","ミワソウメン","奈良県全域","登録番号第12号。登録日 平成28年3月29日。登録生産者団体は奈良県三輪素麺工業協同組合・奈良県三輪素麺販売協議会。特性欄に「約1300年前の奈良時代に生産が始まり、三輪地方が手延べ素麺発祥の地と伝えられている」とある","公的（近畿農政局）"]]}]},{"h":"（3）地域団体商標","lv":4,"text":["出典：近畿農政局「地域団体商標の活用について」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （「近畿における農林水産物・食品の地域団体商標」令和6年1月現在、取得日2026-11-18、種別：公的）","奈良県分は8件。同ページは「最新の全ての地域団体商標の案内は特許庁へ」と案内しており、より新しい近畿版一覧は今回見つからなかった（注記参照）。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","平群の小菊","一覧に記載なし（未確認）","一覧に記載なし（未確認）","農林水産物・食品に限った一覧","公的（近畿農政局）"],["2","大和肉鶏","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["3","結崎ネブカ","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["4","吉野材","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["5","吉野本葛","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上。「吉野葛」とは別項目として併記されている","公的（近畿農政局）"],["6","吉野葛","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["7","吉野杉","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["8","吉野桧","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"]]}]},{"h":"（4）奈良県公式の認証制度","lv":4,"text":["出典：奈良県公式ホームページ https://www.pref.nara.lg.jp/item/122033.htm （奈良県プレミアムセレクトの説明を含むページ、種別：自治体）、奈良県公式「県民だより奈良 特集1」 https://www.pref.nara.lg.jp/n002/57044.html （種別：自治体）。取得日はいずれも2026-11-18。"],"tables":[{"cols":["制度名","内容（出典の記載どおり）","出典の種別"],"rows":[["奈良県プレミアムセレクト","奈良県農畜水産物ブランド認証制度。「大きさや形など外観の基準だけでなく、品質面でも優れた特徴を持つ『とびきり』の産品を、県が認証する制度」（奈良県公式サイトの説明）。大和牛での認証は平成28年12月開始（奈良県報道資料）","自治体（奈良県）"],["大和の伝統野菜（認定）","「戦前から奈良県内で生産が確認されている品目で、地域の歴史・文化を受け継いだ独特の栽培法等により『味、香り、形態、来歴』などの特徴がある野菜」と奈良県公式サイトに定義がある","自治体（奈良県）"],["大和畜産ブランド","県が規格を設けて認定する畜産ブランド。県民だより奈良2020年12月号特集に「現在はこの5つを大和畜産ブランドと認定しています ※令和2年10月時点」とある（品目の内訳は今回未確認）","自治体（奈良県）"]]}]},{"h":"注記・食い違い（f）","lv":3,"text":["- 表記の揺れ1：「高山茶筌」（伝統的工芸品産業振興協会の指定品目一覧の表記）と「高山茶筅」（奈良通1級テキストの表記）。正式な指定品目名は協会PDFの「高山茶筌」。","- 表記の揺れ2：「三輪素麺」（GI登録名・近畿農政局）と「三輪そうめん」（一般表記・Wikipedia記事名）。『日本山海名物図会』の引用文では「大和三輪素麺」と「大和三輪索麺」の2種の転記が異なる出典にあり、原文の字句は未確認。","- 地域団体商標の範囲の違い：近畿農政局の一覧（令和6年1月現在）は「農林水産物・食品」に限るため工芸品は入っていない。特許庁資料に基づく平成29年11月現在の奈良県一覧（特許庁「奈良県における知財活動の概要」）では登録11件とされ、高山茶筌・吉野割箸・吉野杉箸など工芸品・箸類も含まれる。両者は時点と対象範囲が違うため、件数の食い違いではない。","- 伝統的工芸品の産地：協会の業種別PDFには産地欄がない。産地（高山茶筅＝生駒市、奈良筆・奈良墨＝奈良市）は奈良通1級テキスト（その他）による併記で、公的出典での照合は未実施。","- 吉野葛と吉野本葛：地域団体商標では別項目として両方が登録されている。違いの説明は今回の出典にないため未確認。","- 柿渋：候補に挙がっていたが、江戸時代の文献・公的出典での確認が今回取れなかったため、表には入れていない（未確認）。"],"tables":[]},{"h":"取得不可（f）","lv":3,"text":["- Wikipedia「三輪そうめん」：取得を試みたが、取得ツール側のレート制限（HTTP 429）のため取得不可。本文の転記はしていない。","- Wikipedia「奈良漬」：同じくレート制限のため取得不可。本文の転記はしていない（奈良漬の江戸時代の裏付けは文化庁資料で代替した）。","---"],"tables":[]}],"g":[{"h":"g. 旧国の制度","lv":2,"text":["出典：","- Wikipedia「大和国」 https://ja.wikipedia.org/wiki/大和国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「一宮」 https://ja.wikipedia.org/wiki/一宮 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「国分寺」 https://ja.wikipedia.org/wiki/国分寺 （取得日2026-11-18、種別：Wikipedia）","- 「総社・一宮・二宮候補・三宮候補・国府の一覧」（op1722.com） https://op1722.com/zinzya1-2-3.html （取得日2026-11-18、種別：その他）※大神神社の読みのみに使用","※一宮・総社は中山の指示により正式項目として入れた。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g1","大和国の等級","―","大国","「大和国」記事の基礎情報欄「国力：大国」、本文冒頭にも「大国」と明記","Wikipedia"],["g2","大和国府（文献上の所在地）","―","『和名抄』（平安時代中期成立）では「高市郡」、『拾芥抄』（鎌倉時代中期から南北朝時代成立）では「高市郡」、『節用集』（室町時代中期成立）では「十市郡」","文献により郡が異なる（食い違い、両論併記）","Wikipedia"],["g3","大和国府（推定地の変遷）","―","国府は葛上郡掖上（現在の御所市東北部と同市名柄の二説あり）の地にあったが、平城京遷都に伴って8世紀に高市郡（『和名類聚抄』）の軽の地に移ったとされる。その後13世紀には平群郡（現在の大和郡山市今国府）に移った","記事は「このように国府は数か所に推定されているが、詳細は明らかでない」と明記。「大和国」記事の基礎情報欄も「大和国府：（推定）奈良県大和郡山市／（推定）奈良県高市郡高取町」と2か所を併記。軽の所在地にも諸説あり（記事注釈：現在の橿原市大軽町と石川町の接点「軽の衢」、ほかに久米町、西池尻/東池尻、高取町土佐の三説）","Wikipedia"],["g4","一宮","おおみわじんじゃ（大神神社）","大神神社（奈良県桜井市三輪）","読み「おおみわじんじゃ」は「一宮」「大和国」両記事に明記がなく、その他サイト（一覧ページ）による。「大和国」記事は「ただし、神社側で自ら一宮を称した文書は見つかっていない」と注記。二宮以下はない（「大和国」記事・「一宮」記事とも）。「一宮」記事の一覧表では、式内社の別は名神大社、近代社格は官幣大社、別表神社、二十二社、全国一の宮会加盟と記載","Wikipedia／その他（読みのみ）"],["g5","総社","―","国府神社（奈良県高市郡高取町下土佐）","「大和国」記事「総社・一宮」の項による","Wikipedia"],["g6","大和国分寺（国分僧寺）","―","東大寺（奈良県奈良市）。総国分寺を兼ねる","「東大寺とするのが一般的だが、後者とする説もある」として、橿原市の国分寺（勝満山満法院）を大和国分寺とする説を併記（食い違い、両論併記）。「国分寺」記事の注釈では『大和志』が橿原市の国分寺に比定する旨を記す","Wikipedia"],["g7","大和国分尼寺","―","法華寺（奈良県奈良市）。総国分尼寺を兼ねる","「国分寺」記事の一覧では創建所在地「奈良県奈良市法華寺町」、国の史跡・法華寺（総国分尼寺）と記載","Wikipedia"],["g8","延喜式内社（参考）","―","『延喜式神名帳』には、大社128座85社（うち名神大社47座26社）・小社158座131社の計286座216社が記載されている","「大和国」記事「延喜式内社」の項による（原史料『延喜式』を引く記載）","Wikipedia"],["g9","国分寺建立の詔（制度一般・参考）","―","『続日本紀』『類聚三代格』によれば、天平13年（741年）2月14日（日付は『類聚三代格』による）、聖武天皇から「国分寺建立の詔」が出された。国分僧寺の正式名称は「金光明四天王護国之寺（こんこうみょうしてんのうごこくのてら）」、国分尼寺は「法華滅罪之寺（ほっけめつざいのてら）」。大和国の東大寺・法華寺は総国分寺・総国分尼寺とされ、全国の国分寺・国分尼寺の総本山と位置づけられた","「国分寺」記事による。741年2月14日の西暦換算は記事に記載がなく、暦の種別も明記されていないため暦不明","Wikipedia"]]}]},{"h":"注記・食い違い（g）","lv":3,"text":["- 国府所在地：文献（『和名抄』『拾芥抄』＝高市郡／『節用集』＝十市郡）で食い違いがあり、推定地も葛上郡掖上・高市郡軽・平群郡（大和郡山市今国府）など複数説がある。記事自身が「詳細は明らかでない」としており、どれか一つに決めない。","- 国分寺の比定：東大寺（一般的）／橿原市国分寺（『大和志』による説）の両論併記。","- 一宮の根拠：大神神社を一宮とする一方、「神社側で自ら一宮を称した文書は見つかっていない」という注記が記事にある。","- 公的出典での照合：等級・国府・一宮・国分寺のいずれも、今回はWikipediaの記事の記載のみで、文化庁・奈良県公式による照合はできていない（下記「取得不可」参照）。この点は未確認として残す。"],"tables":[]},{"h":"取得不可（g）","lv":3,"text":["- 文化庁「国指定文化財等データベース」 https://kunishitei.bunka.go.jp/bsys/index （種別：公的）— トップページは取得できたが、個別レコード（大和国府跡・国分寺関係）の検索結果ページはテキスト取得では開けず、照合に使えなかった。","- 奈良県公式サイトの大和国府・国分寺に関するページ — 今回の取得では該当ページにたどり着けず、未取得（取得不可として明記する）。","---"],"tables":[]}],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"県名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["旧国名・五畿七道はWikipediaのみが出典。公的出典での照合は未実施。","747年の「大倭」改称の日付は、西暦換算の暦種別が不明（暦不明）。","奈良県域が大和国以外の旧国にまたがるかは、取得した記事に記載がなく未確認。"],"b":["藩と藩主はWikipediaのみが出典（公的・自治体での照合は未実施）。","岸田藩は取得できず、内容が未確認。","藩主の読みが未取得の人物がいる（永井直壮・永井直哉・松平信通・片桐且元・片桐為次・桑山一尹・桑山貞晴）。","柳生藩・田原本藩の廃藩年、竜田藩の居城・陣屋、郡山新田藩の居城・陣屋は未確認。"],"c":["統合で廃された県の数は、Wikipediaが10県、奈良県公式が15県で食い違う。飛地の5藩（久居・津・大多喜・壬生・和歌山）を加えると15になるが、公式年表に内訳の明記はなく未確認。","奈良県の再改称（奈良府→奈良県）は、7月17日と7月12日の2つの日付がある。奈良県公式の年表は7月17日。","奈良県の沿革は奈良県公式（県政沿革・奈良県立図書館）で日付まで照合した。国立公文書館（アジア歴史資料センター）での照合は未実施。","第1次府県統合の布告日と実施日の区別は未確認。"],"d":["県名の由来（奈良町）は奈良県公式で確認した事実。","「奈良」という地名の語源は諸説あり、いずれも仮説で確定していない。"],"e":["奈良県内に現存天守はない（Wikipedia「現存天守」の12城に含まれない）。","大和郡山城：天守の階数が「伝5層6階」と「5階建てと推定」で食い違う。別名も「雁陣之城」「犬伏城」の2つ。県指定年も1960年と1961年で1年ずれる。国史跡の指定は文化庁の答申資料と市の資料で照合した。","多聞山城：廃城年が1576年と1577年の両説。本文の「16年間」は、築城年（1559年）から数えると合わない。","高取城：建物の消滅が1887年頃と1891年頃の両説。築城は「伝えられている」という表現。","信貴山城：天守櫓の築造が「1559年頃」と「1560年」の両説。楠木正成築城説は同時代史料の裏付けがない。","筒井城：築城者は未確認。宇陀松山城は取得できず、表に入れていない（追加候補）。","高取城・多聞山城・筒井城・信貴山城はWikipediaのみが出典。"],"f":["江戸時代の名産の一部（奈良漬・柿の葉寿司・吉野葛への言及）は文化庁の資料で確認。三輪そうめん・奈良筆は自治体や民間の解説による。","伝統的工芸品3品目（高山茶筌・奈良筆・奈良墨）は協会の一覧で確認。協会の一覧に産地欄がなく、産地は民間のテキストによるため、公的な照合は未実施。","読みが出典にない品目（吉野葛・吉野杉・奈良墨・高山茶筌など）は「未確認」と表示している。","吉野葛と吉野本葛は地域団体商標で別項目。違いは未確認。","地域団体商標の一覧は令和6年1月時点で、農林水産物・食品に限る。商標の登録は「名産」と同義ではない。"],"g":["旧国の制度（国の等級・国府・一宮・総社・国分寺）はWikipediaのみが出典。文化庁・県での公的照合は未実施。","国府の所在地は、『和名抄』が高市郡、『節用集』が十市郡とし、推定地も複数ある。確定していない。","国分寺は東大寺とする説と、橿原市の国分寺とする説がある。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","老舗8社は、候補のうち公式出典で裏取りできたもの。奈良県の「100年企業顕彰」（令和6年度、30社）を網羅したものではない。","三輪山本の法人設立年は未確認（Wikipediaは1717年、データベース系は1974年）。今西清兵衛商店・三輪山本は、公式の会社概要ページを直接取得できていない。","DMG森精機は奈良と東京の二本社制で、グローバル本社は東京。本店は奈良市のため現代に入れ、備考に明記している。","柿安本店（桑名市）と大和ハウス工業（大阪市）は、本社が県外のため対象外。"]},"h":[{"h":"出典","lv":2,"text":["- 株式会社中川政七商店 公式企業サイト「中川政七商店｜日本の工芸を元気にする！」 https://www.nakagawa-masashichi.jp/company/ （その他（企業公式））","- 株式会社中川政七商店 プレスリリース（PR TIMES、2026年6月3日・2025年1月14日配信） https://prtimes.jp/main/html/rd/p/000000089.000016802.html ほか（その他（企業公式））※本社所在地・創業・設立は同社の会社概要記載による","- 奈良ホテル 公式「Nara Hotel History」（JR西日本ホテルズ） https://jrwest-hotels.jp/narahotel/about/history/ （その他（企業公式））","- 奈良県公式「令和6年度奈良県100年企業顕彰 株式会社奈良ホテル」 https://www.pref.nara.lg.jp/documents/7099/14.pdf （自治体）","- 奈良県公式「令和6年度 奈良県100年企業顕彰企業紹介」 https://www.pref.nara.lg.jp/n100/68602.html （自治体）","- 株式会社菊一文珠四郎包永 公式「菊一文珠四郎包永について」 https://kikuichi.com/about/ （その他（企業公式））","- Wikipedia「今西清兵衛商店」 http://ja.wikipedia.org/wiki/今西清兵衛商店 （Wikipedia）※沿革は同社公式「会社概要」を出典とする記事","- 厚生労働省 奈良若年者雇用情報「株式会社 今西清兵衛商店」 https://jakunen-nara.mhlw.go.jp/gousetsu/kigyou_list/pdf/index/2403/66.pdf （公的）","- 油長酒造株式会社 公式「私たちの想い｜油長酒造の物語」 https://yucho-sake.jp/concept/ （その他（企業公式））","- 株式会社中谷本舗 プレスリリース（PR TIMES、2025年9月26日配信ほか） https://prtimes.jp/main/html/rd/p/000000022.000061612.html （その他（企業公式））","- 株式会社池利 公式「会社案内」 https://www.ikeri.co.jp/company/index.html （その他（企業公式））","- Wikipedia「三輪山本」 http://ja.wikipedia.org/wiki/三輪山本 （Wikipedia）","- 株式会社南都銀行 公式 統合報告書（デ
