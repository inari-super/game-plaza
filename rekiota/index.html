38","岡藩","おかはん","豊後国・大分県（竹田市、岡城）","中川家：中川久成（なかがわ ひさなり、第13代）","7万石","外様","1594年（文禄3年）","岡県","別名：竹田藩。初代・中川秀成の入封時は6万6000石で、表高7万石は1598年（慶長3年）の検地による","Wikipedia"],["239","杵築藩","きつきはん","豊後国・大分県（杵築市、杵築城）","能見松平家：松平親貴（まつだいら ちかたか、第10代）","3万2000石","譜代","1632年（寛永9年）","杵築県","立藩時は木付藩（きつきはん）と称し、初代は小笠原忠知（4万石）。1712年（正徳2年）に地名の表記が「木付」から「杵築」となった","Wikipedia"],["240","臼杵藩","うすきはん","豊後国・大分県（臼杵市、臼杵城）","稲葉家：稲葉久通（いなば ひさみち、第15代）","5万石","外様","1600年（慶長5年）","臼杵県","稲葉家は外様大名として扱われた（記事による）","Wikipedia"],["241","佐伯藩","さいきはん","豊後国・大分県（佐伯市、佐伯城）","毛利家：毛利高謙（もうり たかあき、読みは「たかかた」とも。第12代）","2万石","外様","1601年（慶長6年）","佐伯県","初代・毛利高政は1594年（文禄3年）に日田へ2万石で入封しており、1601年4月5日に佐伯へ移封されて藩が成立した。藩名の読み「さいき」は『国史大辞典』によると記事の注記にある（『日本歴史大事典』は「さえき」とする）","Wikipedia"],["242","日出藩","ひじはん","豊後国・大分県（速見郡日出町、日出城）","木下家：木下俊愿（きのした としまさ、第16代）","2万5000石（当初3万石）","外様","1600年（慶長5年）","日出県","石高は1642年（寛永19年）に木下延由へ5000石を分与したため2万5000石となった","Wikipedia"],["243","森藩","もりはん","豊後国・大分県（玖珠郡玖珠町、森陣屋）","久留島家：久留島通靖（くるしま みちやす、第12代）","1万2500石（当初1万4000石）","外様","1601年（慶長6年）","森県","初代は来島長親。1616年（元和2年）に姓を来島から久留島へ改めた","Wikipedia"]]}]},{"h":"【西海道】肥前国（9藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["244","佐賀藩","さがはん","肥前国・佐賀県（佐賀市、佐賀城）","鍋島家：鍋島直大（なべしま なおひろ、第11代）","35万7000石","外様（国主）","1600年（慶長5年）","佐賀県","別名：肥前藩（ひぜんはん）、鍋島藩（なべしまはん）。支藩として蓮池藩、小城藩、鹿島藩があった。最後の藩主について、基礎情報欄は「鍋島直大」とする一方、歴代藩主表の第11代は「鍋島茂実（なべしま もちざね）」とするが、人物記事「鍋島直大」によれば同一人物であり、初名は直縄（なおただ）、文久元年（1861年）に将軍・徳川家茂の偏諱を受けて茂実と名乗り、1868年より直大と改名した。立藩の年について、基礎情報欄は「慶長5年（1602年）」と元号と西暦が食い違う（慶長5年は1600年）。歴代藩主表は龍造寺家を1600年〜1607年とするため、1600年（慶長5年）に直した","Wikipedia"],["245","蓮池藩","はすのいけはん","肥前国・佐賀県（佐賀市蓮池町、蓮池陣屋。当初は佐賀城三の丸）","蓮池鍋島家：鍋島直紀（なべしま なおただ、第9代）","5万2000石（佐賀藩の内高）","佐賀藩支藩（親藩・譜代・外様の別は記事に明記なし＝未確認）","立藩時期は諸説あり確定しない（江戸時代初期。「藩の一覧」では1642年－）","蓮池県","佐賀藩の支藩","Wikipedia"],["246","小城藩","おぎはん","肥前国・佐賀県（小城市、小城陣屋（桜岡館））","小城鍋島家：鍋島直虎（なべしま なおとら）","73252石5斗","外様（佐賀藩支藩）","1617年（元和3年）※基礎情報欄","小城県","佐賀藩の支藩。成立時期ははっきりと確定しておらず、参勤交代の開始（1642年）をもって成立とみなす見解が多いと記事は記す","Wikipedia"],["247","鹿島藩","かしまはん","肥前国・佐賀県（鹿島市、常広城→鹿島陣屋）","鹿島鍋島家：鍋島直彬（なべしま なおよし、第13代）","2万石（当初2万5000石）","外様（佐賀藩支藩）","1609年（慶長14年）","鹿島県","佐賀藩の支藩。藩庁は常広城（1610年〜1821年）から鹿島陣屋（1821年〜1871年）へ移った。なお藩庁移転について記事本文は「文化4年（1821年）に鹿島城を築き、文化7年（1810年）5月11日に高津原の新城へと移住」と年次が前後する表記がある（記事内部の表記の乱れ。原文どおり転記）。立藩の年について、「鹿島藩」記事は基礎情報欄・本文とも「慶長16年（1610年）」とするが、慶長16年は1611年で西暦と合わない（1610年は慶長15年）。初代藩主の人物記事「鍋島忠茂」とコトバンク『日本大百科全書（ニッポニカ）』「鹿島藩」は、慶長14年（1609年）に忠茂が2万石を分与され立藩したとするため、1609年（慶長14年）を採った。なお「鹿島藩」記事の注記によれば、池田史郎『藩史大辞典』は寛永19年（1642年）に直朝へ2万石が与えられたことをもって藩成立とする","Wikipedia"],["248","唐津藩","からつはん","肥前国・佐賀県（唐津市、唐津城）","小笠原家：小笠原長国（おがさわら ながくに）","6万石（幕末時点、江戸幕府公認）","譜代（寺沢家のみ外様）","1593年（文禄2年）？※基礎情報欄に「？」付き","唐津県","藩主家は寺沢家・大久保家・大給松平家・土井家・水野家・小笠原家の6家が務めた","Wikipedia"],["249","平戸藩","ひらどはん","肥前国・長崎県（平戸市、平戸城）","松浦家：松浦詮（まつら あきら、第12代）","6万1700石","外様","1600年（慶長5年）","平戸県","領地は肥前国松浦郡・彼杵郡の一部、および壱岐国（壱岐国は平戸藩領）。元禄2年（1689年）に平戸新田藩が分立し、1870年（明治3年）の支藩併合により6万1700石となった","Wikipedia"],["250","大村藩","おおむらはん","肥前国・長崎県（大村市、玖島城）","大村家：大村純熈（おおむら すみひろ、第12代）","2万7900石余","外様→願譜代（譜代格扱い）","未確認（記事に基礎情報欄がなく、立藩年の明記を確認できなかった）","大村県","記事冒頭に「幕末・廃藩置県まで存続した」と明記される","Wikipedia"],["251","島原藩","しまばらはん","肥前国・長崎県（島原市、島原城。初期は日野江城（南島原市））","深溝松平家：松平忠和（まつだいら ただかず、再入封後の第8代）","6万5000石","譜代","未確認（記事に基礎情報欄がなく、立藩年の明記を確認できなかった）","島原県","初期は日野江藩（ひのえはん）と呼ばれる。松平家は延享4年（1747年）※原文は「寛延2年（1747年）」。寛延2年は1749年のため元号と西暦が合わないに戸田家と入れ替わり宇都宮へ移封され、安永3年（1774年）に6万5000石で再び戻り、以後1871年まで","Wikipedia"],["252","福江藩","ふくえはん","肥前国・長崎県（五島市、石田城。当初は江川城）","五島家：五島盛徳（ごとう もりのり、第11代）","1万5000余石","外様","1603年（慶長8年）","福江県","別名：五島藩（ごとうはん）。寛文元年（1661年）に富江領3000石を分知し一時1万2000余石。文久3年（1863年）に石田城が竣工した（「日本で最も新しい城」と記事は記す）","Wikipedia"]]}]},{"h":"【西海道】肥後国（2藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["253","熊本藩","くまもとはん","肥後国・熊本県（熊本市、熊本城）","細川家：細川護久（ほそかわ もりひさ）※藩主名の表記については備考参照","54万石（細川家時代）","外様（国主）","1600年（慶長5年）","熊本県","別名：肥後藩（ひごはん）、細川藩（ほそかわはん）。最後の藩主について、基礎情報欄・本文は「細川護久」とする一方、歴代藩主表の第12代は「細川喜廷（ほそかわ のぶたか）」とするが、人物記事「細川護久」によれば同一人物であり、改名は護久→喜廷→護久とたどる。慶応2年（1866年）に将軍・徳川慶喜の偏諱を受けて喜廷と改名し、慶応4年（1868年）4月23日に護久へ戻した。護久は1870年5月8日（明治3年。暦の別は確認中）に兄・韶邦の隠居により跡を継ぎ、熊本藩第2代知藩事となった。なお「喜廷」は、書物によって「喜延」と表記するものもある（人物記事の注釈）","Wikipedia"],["254","人吉藩","ひとよしはん","肥後国・熊本県（人吉市、人吉城）","相良家：相良頼基（さがら よりもと、第16代）","2万2000石","外様","1600年（慶長5年）","人吉県","廃藩年は明治4年7月14日（1871年8月29日）と記事に明記される。立藩の年について、基礎情報欄は「慶長7年（1600年）」と元号と西暦が食い違う（慶長7年は1602年）。本文は慶長5年（1600年）の関ヶ原の戦いの後、旧領を安堵され各自立藩したと記すため、1600年（慶長5年）に直した","Wikipedia"]]}]},{"h":"【西海道】日向国（4藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["255","延岡藩","のべおかはん","日向国・宮崎県（延岡市、縣城（延岡城））","内藤家：内藤政挙（まさたか、第8代）","7万石","譜代","1600年（慶長5年）※県藩の成立。始まりは1587年（天正15年）の高橋元種の封","延岡県","別名：縣（県）藩（あがたはん）","Wikipedia"],["256","高鍋藩","たかなべはん","日向国・宮崎県（児湯郡高鍋町、高鍋城）","秋月家：秋月種殷（あきづき たねとみ、第10代）","2万7000石（当初3万石）","外様","1604年（慶長9年）","高鍋県","旧称は財部藩（たからべはん）。慶長9年（1604年）に居城を財部城（高鍋城）に移し「正確にはこの時点より高鍋藩が成立したと言える」と記事は記す。延宝元年（1673年）に財部から高鍋に城地の名を改めた","Wikipedia"],["257","佐土原藩","さどわらはん","日向国・宮崎県（宮崎市佐土原町、佐土原城）","佐土原島津家：島津忠寛（ただひろ、第11代）","食い違い：基礎情報欄は3万石、歴代藩主欄は「3万石→2万7千石」（元禄3年（1690年）の分与による）","外様","1603年（慶長8年）","佐土原県","薩摩藩との関係について、記事は「薩摩藩の支藩とされる」としつつ、「薩摩藩支藩ではないとの見解がある一方、支藩と見なされることが多くなったという見解がある」と両論を記す。版籍奉還後、藩庁を佐土原城から広瀬城へ移す転城を進めていたが、廃藩置県で広瀬城は建設中止になった","Wikipedia"],["258","飫肥藩","おびはん","日向国・宮崎県（日南市、飫肥城）","伊東家：伊東祐帰（すけより、第14代）","5万1千石（当初5万7千石→5万4千石）","外様","未確認（記事に基礎情報欄がなく、立藩年の明記を確認できなかった。元和3年（1617年）に飫肥藩5万7千石の所領安堵の朱印状を受けたと記事は記す）","飫肥県","","Wikipedia"]]}]},{"h":"【西海道】大隅国（0藩）","lv":3,"text":["- 大隅国に藩庁を置いた藩はない。大隅国は薩摩藩の領地であった（薩摩藩は薩摩・大隅の2か国および日向国諸県郡の大部分を領有した）。"],"tables":[]},{"h":"【西海道】薩摩国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["259","薩摩藩","さつまはん","薩摩国・鹿児島県（鹿児島市、鹿児島城。領地は薩摩国・大隅国・日向国の一部）","島津家：島津忠義（ただよし、第12代）","食い違い：基礎情報欄は72万9000石、歴代藩主欄・本文は77万石","外様（国主）","1602年（慶長7年）※基礎情報欄","鹿児島県","別名：鹿児島藩。本文は関ヶ原後の1600年をもって「正式な薩摩藩成立と見なすのが通説」とも記す。大隅国に藩庁を置いた藩はなく、大隅国は薩摩藩領であった","Wikipedia"]]}]},{"h":"【西海道】壱岐国（0藩）","lv":3,"text":["- 壱岐国に藩庁を置いた藩はない。壱岐国は平戸藩の領地であった（平戸藩は肥前国の節に置いた）。"],"tables":[]},{"h":"【西海道】対馬国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["260","厳原藩","いづはらはん","対馬国・長崎県（対馬市厳原町、金石城→桟原城）","宗家：宗義達（そう よしあきら、第15代）","10万石格（歴代藩主欄は「2万石→10万石以上格」）","外様（国主）","1600年（慶長5年）","厳原県","旧称は対馬府中藩（つしまふちゅうはん）。一般に単に「対馬藩」と呼ばれる。1869年（明治2年）、宗義達は版籍を奉還し、新藩制により厳原藩と改称されて厳原藩知事となった。これとともに「対馬府中」の地名も「厳原」に改められた。廃藩後、厳原県は1871年9月（旧暦と思われる。新暦は確認中）に伊万里県へ編入された","Wikipedia"]]}]},{"h":"【北海道】渡島国（1藩）","lv":3,"text":[],"tables":[{"cols":["番号","藩名","読み","所在地（旧国・現在の都道府県）","藩主家（最後の藩主・読み）","石高（最終）","家格","立藩の年","廃藩置県の直後に属した県","備考","出典の種別"],"rows":[["261","松前藩","まつまえはん","渡島国・北海道（松前郡松前町、福山館→松前城→館城）","松前家：松前修広（まつまえ ながひろ）","3万石（格）","外様","1599年（慶長4年）","館県","下記「松前藩の経緯」参照","Wikipedia"]]}]},{"h":"注記・食い違い（各道の対象・対象外の藩、出典の記述）","lv":2,"text":[],"tables":[]},{"h":"畿内：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、畿内5国（山城・大和・河内・和泉・摂津）に藩庁を置いていた藩のみ。畿内では 17藩 が該当する（山城1・大和8・河内1・和泉3・摂津4）。","- 並び順：旧国の順（山城・大和・河内・和泉・摂津）。旧国一覧（39）と同じ順に統一した。","- 対象外：江戸時代の途中で消滅した藩は含めない。例：西代藩（河内、1732年廃藩）、陶器藩（和泉、1696年廃藩）、大坂藩（摂津、1619年廃藩）、茨木藩（摂津、江戸初期に廃藩）、宇陀松山藩（大和、1695年廃藩）、竜田藩（大和、1655年廃藩）、山城長岡藩（1649年廃藩）、伏見藩（山城、江戸初期に廃藩）など。","- 廃藩置県を待たずに消滅した藩も対象外である。畿内では 狭山藩（河内） がこれに当たる：最後の藩主・北条氏恭は明治2年12月（新暦1870年1月）に藩知事を辞任し、狭山藩は廃藩となって堺県に編入された（Wikipedia「北条氏恭」、大阪狭山市公式サイト「大阪狭山の歴史」）。そのため1871年8月29日時点では存在しない。なお廃藩の日について、26章（大阪府）は堺県への編入を1870年1月27日（明治2年12月26日）とし、Wikipedia「北条氏恭」は辞任を明治2年12月27日（新暦1870年1月28日）とする食い違いがある。","- 岸田藩（大和）について：25章（奈良県）はWikipedia「藩の一覧」にその名があるが内容は未確認として掲載した。岸田藩は豊臣政権期の所領であり、藩主・岸田忠氏は関ヶ原の戦い（1600年）で西軍に属して改易されたもので、江戸時代を通じて存続した藩ではなく、1871年時点の対象にはならない。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた。1869〜1871年に新設・移転した藩（田原本藩は1868年の維新立藩、吉見藩は1870年の移転・改称）は備考に明記した。","- 立藩の年は、江戸時代の藩としての成立年に統一し、別説は備考に書いた。元号と西暦の対応は検算した。","- 日付は、1872年末までのものは新暦（旧暦）の順に書く。月だけの表記でも、旧暦であればその旨を明記して新暦に換算する。","- 「廃藩の年」は全藩とも廃藩置県による1871年であるため、表では年だけを記した（月日は1871年8月29日（明治4年7月14日）で共通）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（明治4年11月＝新暦の1871年12月〜1872年1月）より前に置かれた県（旧藩名と同名の県）を記した。"],"tables":[]},{"h":"畿内：章との食い違い","lv":3,"text":["- 吉見藩（三上藩）の最終石高：32章（滋賀県）の三上藩の石高は「1万石→1万2,000石」と転記されているが、26章（大阪府）の吉見藩とWikipedia「吉見藩」は1万4500石とする。本ファイルは吉見藩としての最終値1万4500石を採り、32章の値との食い違いとして明記する（32章の1万2000石は三上藩時代の値とみられるが、その区別は32章には書かれていない）。","- 岸和田藩の立藩年：26章（大阪府）は1585年（天正13年、小出秀政が岸和田城主に封ぜられた年）を立藩年とする。本ファイルは、江戸時代の藩としての成立年として1600年（慶長5年）を採り、1585年を備考に別説として記した。","- 高取藩の立藩年：25章は植村家入封の1640年を立藩とし、本多俊政の就任（1600年）を併記する。本ファイルも1640年とし、本多家時代を備考に書いた。Wikipedia「高取藩」の行政変遷表も「1640年 - 1871年」で一致する。","- 三田藩の九鬼家入封年：27章は立藩1601年（有馬則頼）とする。本ファイルも1601年とした。ただし「三田藩」記事内部で、本文の九鬼久隆転入「寛永10年（1633年）」と歴代藩主表の見出し「1632年 - 1871年」が1年ずれる（記事内部の食い違いとして備考に明記）。","- 櫛羅藩の永井家入封年：25章は1680年（延宝8年）とする。「櫛羅藩」記事も延宝8年（1680年）だが、コトバンク『日本大百科全書（ニッポニカ）』「櫛羅藩」は天和1年（1681年）入封とする（食い違いとして備考に明記）。","- 狭山藩の廃藩日：26章は堺県への編入を1870年1月27日（明治2年12月26日）とし、Wikipedia「北条氏恭」は藩知事の辞任を明治2年12月27日（新暦1870年1月28日）とする（1日の食い違い。冒頭に明記）。","- 岸田藩の扱い：25章は「藩の一覧」に名があるが内容未確認として藩の表に掲載した。本ファイルでは、岸田藩は1600年に改易された豊臣政権期の所領であり、1871年時点の藩ではないため対象外とした（冒頭に明記）。25章の表の値そのものは訂正していない。"],"tables":[]},{"h":"畿内：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各藩・各藩主記事、「藩の一覧」、コトバンクの2記事、大阪狭山市公式サイトはいずれも取得できた）。ただし藩の値の大半はWikipediaのみに基づく（下記3分類参照）。"],"tables":[]},{"h":"東海道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象は、1871年8月29日（明治4年7月14日）の廃藩置県の時点で、東海道15国（伊賀・伊勢・志摩・尾張・三河・遠江・駿河・伊豆・甲斐・相模・武蔵・安房・上総・下総・常陸）に藩庁を置いていた藩のみとする。東海道15国で対象は合計65藩（伊賀0・伊勢7・志摩1・尾張2・三河10・遠江1・駿河1・伊豆0・甲斐0・相模2・武蔵4・安房4・上総11・下総9・常陸13）。","- 並び順は、旧国一覧（39_旧国一覧_東海道.md）と同じくWikipedia「令制国一覧」の東海道の順（伊賀 → 伊勢 → 志摩 → 尾張 → 三河 → 遠江 → 駿河 → 伊豆 → 甲斐 → 相模 → 武蔵 → 安房 → 上総 → 下総 → 常陸）とし、番号は全15国を通して連続させる。","- 対象外：江戸時代の途中で消滅した藩、および廃藩置県を待たずに消滅した藩は入れない。主な例：","- 伊賀国：伊賀上野藩（1608年廃藩）。なお名張藤堂家は津藩の内分であり、藩ではないため対象外。","- 伊勢国：田丸藩（1616年廃藩）、松坂藩（1619年廃藩）、伊勢上野藩（1619年廃藩）、八田藩（1826年廃藩）、林藩（1615年廃藩）、雲出藩（1603年廃藩）など。","- 伊豆国：藩庁を置いた藩はなく、全域が韮山代官所・韮山県の管轄であったため該当藩なし。","- 甲斐国：藩庁を置いた藩はない。田安徳川家が1868年（慶応4年）に立藩した田安藩は、藩庁が江戸・田安門内にあり甲斐国にはなく、1870年1月27日（明治2年12月26日）に廃藩となったため、1871年時点では存在せず対象外。","- 相模国：玉縄藩（1632年廃藩）、深見藩（1694年廃藩）。","- 安房国：船形藩（1868年廃藩）、北条藩（1614年廃藩）、東条藩（1619年廃藩）。","- 上総国：請西藩（貝淵藩）。1869年1月（明治元年12月）に領地を没収され廃藩となったため対象外。","- 三河国：大給藩（奥殿藩）は1863年に藩庁を信濃国佐久郡の飛地へ移したため東海道では数えない。畑村藩は1869年に藩庁を美濃国野村へ移した（野村藩）ため東海道では数えない。","- 武蔵国：岡部藩は1868年（慶応4年）に藩庁を三河国半原へ移したため、三河国の半原藩として数える。","- 1868年に他国へ移封された藩（遠江国の浜松藩→上総国鶴舞藩、掛川藩→上総国柴山藩（のち松尾藩）、横須賀藩→安房国花房藩、相良藩→上総国小久保藩、駿河国の沼津藩→上総国菊間藩、田中藩→安房国長尾藩、小島藩→上総国金ヶ崎藩（のち桜井藩））は、移封先の国で数える。","- 改称・移転した藩は最後の名前で書き、旧称は備考に書く。","- 立藩の年は「江戸時代の藩としての成立年」に統一し、最終藩主家の入封年や再立藩の年など別説は備考に回す。元号と西暦の対応は検算した（例：慶長7年＝1602年）。","- 廃藩の年は全藩1871年で共通のため、年だけを書く。","- 「廃藩置県の直後に属した県」は、第1次府県統合より前の、旧藩名と同名の県を書く。","- 日付は、1872年末（明治5年12月2日）までのものは新暦（旧暦）の順に書く。換算の根拠が確認できない日付は旧暦の表記のまま書き、その旨を注記する。"],"tables":[]},{"h":"東海道：章との食い違い","lv":3,"text":["伊勢・伊賀・志摩の藩について、既存の三重県の章（33_三重県.md）b節の値と照合した結果は次のとおり。","- 久居藩の最終石高：33章は5万8700石を最終とするが、本ファイルで確認できたWikipedia「城主大名」記事の記載は5万3000石であり、食い違う。本ファイルは5万3000石を転記し、食い違いとして明記する（久居藩の単独記事が取得できていないため、どちらの値が正しいかは未確認）。","- 津藩の立藩年の置き方：33章は藤堂家の1608年入封を中心に期間を示すが、本ファイルは第11便の共通ルール（立藩年は藩としての成立年に統一）に従い、富田家による成立年1595年を立藩年とし、藤堂家の入封1608年を備考に回した。値そのものの食い違いではない。","- 伊勢亀山藩の藩主変遷については、33章の時点で「伊勢国」記事と「伊勢亀山藩」記事の間に食い違いがあることが記録されている。本ファイルの伊勢亀山藩の値は「伊勢亀山藩」記事による。","- 上記以外の伊勢・志摩の藩（津藩27万950石、桑名藩6万石、伊勢亀山藩6万石、長島藩2万石、神戸藩1万5000石、菰野藩1万2000石、鳥羽藩3万石、および石川成之・増山正同・土方雄志・稲垣長敬の読み）は、33章b節の値と一致する。","記事内部・記事間の食い違い（章以外）：","- 岡崎藩の立藩年：記事は「慶長6年（1602年）」と記すが慶長6年は1601年であり、元号と西暦が合わない。","- 六浦藩の立藩年：基礎情報欄は「享保17年（1722年）」と記すが享保17年は1732年であり、本文の「享保7年（1722年）」と合わない。本表は本文による。","- 静岡藩への改称時期：記事の冒頭（1869年9月12日（明治2年8月7日））と本文（明治2年6月20日（旧暦））で異なる。","- 神戸藩の第6代藩主名：本文「忠都」と藩主一覧「忠寛」で異なる。","- 尾張藩の成立年：尾張藩記事の基礎情報欄は1610年とするが、尾張国記事は徳川義直の入封を1607年とする。","- 曾我野藩の成立年：曾我野藩記事・「藩の一覧」は1870年とするが、「下総国」記事は1871年3月19日（旧暦）の転封による成立とする。","- 重原藩・志筑藩の立藩年：「藩の一覧」の年（重原藩1792年、志筑藩1602年）は各藩記事の立藩年と異なり、藩主家の領地の始まりを指すものとして区別した。"],"tables":[]},{"h":"東海道：取得不可","lv":3,"text":["- Wikipedia「久居藩」の単独記事：取得不可（同名記事を確認できなかった）。久居藩の値はWikipedia「津藩」「城主大名」「支藩」記事および郡記事・藩主個人記事の記載による。","- 『国史大辞典』（吉川弘文館）の本文：取得不可（冒頭の節に理由を明記）。","- 一部の藩記事（三河・上総・下総・常陸の一部）は、取得時のレート制限により全文を確認できず、記事本文の抜粋で確認できた範囲の転記である。抜粋範囲で確認できなかった項目は各行に「未取得」「―（読み未取得）」と明記した。主な未取得項目：刈谷藩の立藩年、下館藩の立藩年、関宿藩の最終石高、半原藩の最終石高。"],"tables":[]},{"h":"東山道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、東山道8国（近江・美濃・飛騨・信濃・上野・下野・陸奥・出羽）に藩庁を置いていた藩のみ。","- 本ファイルで番号を付けて収録したのは 70藩（近江7・美濃8・信濃10・上野8・下野9・陸奥（分割後の陸奥国（りくおう））5・陸中1・陸前1・岩代4・磐城5・羽後6・羽前6）。飛騨は該当藩なし（0藩）。","- 並び順：旧国の順（近江・美濃・飛騨・信濃・上野・下野・陸奥・出羽）。陸奥・出羽の藩は、1869年1月19日（明治元年12月7日）の国分割後の国名（陸奥（りくおう）・陸中・陸前・岩代・磐城・羽前・羽後）で所在地を特定し、分割前の旧国名（陸奥・出羽）との対応を備考に書いた。","- 対象外：江戸時代の途中で消滅した藩は含めない。例：飛騨高山藩（飛騨、1692年廃藩。以後は公儀御料（幕府領）となり、高山代官所・飛騨郡代が置かれた）、堅田藩（近江、1826年）、朽木藩（近江、1648年）、近江小室藩（近江、1788年に改易）など。","- 廃藩置県を待たずに消滅した藩も対象外である。東山道では次がこれに当たる。","- 大溝藩（近江）：最後の藩主・分部光謙（わけべ みつのり）は1871年8月9日（明治4年6月23日）に藩知事を辞任し、大溝藩は大津県に編入された（Wikipedia「大溝藩」）。分部家、2万石、外様、1619年立藩。そのため1871年8月29日時点では存在しない。","- 高須藩（美濃）：尾張松平家の支藩（3万石）。1870年に本藩（尾張藩）へ併合された。","- 竜岡藩（信濃）：田野口藩が1869年7月30日（明治2年6月22日）に竜岡藩へ改称したが、1871年7月19日（明治4年6月2日）に廃藩となったため、対象日時点では存在しない。なお「信濃国」記事の近世の記述は竜岡藩を廃藩置県時点の藩に含めるように書くが、同記事の沿革および県の一覧とは矛盾する（食い違いとして明記）。","- 吉井藩（上野）：1870年1月27日（明治2年12月26日）に廃藩となり、領地は岩鼻県に属した。","- 盛岡藩（陸中）：最後の藩主・南部利恭（としゆき）は、1870年8月6日（明治3年7月10日）に藩知事の辞任を願い出て許可され、盛岡藩は廃されて盛岡県（第2次）が設置された（Wikipedia「盛岡藩」）。そのため1871年8月29日時点では存在しない。南部家、外様、最終の石高は13万石（盛岡へ復帰後のもの。戊辰戦争前は20万石）、立藩は1600年。なお盛岡藩は戊辰戦争の処分で一時、白石藩（1869年、旧仙台藩領の白石13万石）へ減転封されたが、白石藩も1869年のうちに白石県（のち角田県）となっており、対象日時点では存在しない。","- 会津藩（岩代）：戊辰戦争（1868年）で滅亡したため対象外。その藩主家の家名再興として1869年に新設されたのが斗南藩であり、本ファイルに収録した。","- 下手渡藩（岩代）：立花家、外様、1万石、1806年立藩。1868年9月に藩庁を三池へ移し、下手渡藩は廃藩となった（Wikipedia「下手渡藩」）。そのため1871年8月29日時点では存在しない。","- 高徳藩（下野）：戸田家、譜代、1万石、1866年立藩（幕藩体制で最後に生まれた藩）。1870年に下総国曽我野へ移転して曽我野藩となり、高徳藩としては廃藩となった（Wikipedia「下野国」：明治3年3月19日（1870年4月19日）に高徳藩が転封となり、領地は日光県に編入）。そのため対象日時点では下野国に存在しない。","- 喜連川藩（下野）：喜連川（足利）家、外様、5000石、1590年立藩。明治3年7月17日（1870年8月13日）に廃藩となり、日光県に編入された（Wikipedia「下野国」「喜連川藩」）。そのため対象日時点では存在しない。","- 米沢新田藩（羽前）：上杉家の蔵米支給の支藩（1万石）。明治2年（1869年）に本藩の米沢藩へ併合された（Wikipedia「米沢藩」）。そのため1871年8月29日時点では存在せず、対象外とした（判定確定）。","- 三上藩（近江）：1870年に藩庁を和泉国吉見へ移して吉見藩となり、畿内分（40_藩一覧_畿内.md）に収録済みのため、本ファイルでは対象外とした。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた。1869〜1871年に新設・移転した藩（朝日山藩・斗南藩・野村藩（改称・移転））は備考に明記した。","- 対象日までに藩庁が旧国の外へ移っていた藩（福島藩→重原藩（藩庁は三河国）、守山藩→松川藩（藩庁は常陸国）、長瀞藩→大網藩→龍ヶ崎藩（藩庁は常陸国））は、移転前の旧国の節に最後の名前で収録し、備考に移転の経緯を明記した。","- 「立藩の年」は、江戸時代の藩としての成立年に統一した。別説がある場合は備考に書いた。元号と西暦の対応は検算した。","- 「廃藩の年」は全藩とも廃藩置県による1871年であるため、表では年だけを記した（月日は1871年8月29日（明治4年7月14日）で共通）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（明治4年11月＝新暦の1871年12月〜1872年1月）より前に置かれた県（旧藩名と同名の県）を記した。","- 日付の表記：1872年末までの日付は「新暦（旧暦）」の順に書く。旧暦の月日しか確認できない場合は、旧暦であることを明記し、新暦への換算は「未確認」とした。暦の別が判別できない日付は原文のまま書き「暦不明」と注記した。"],"tables":[]},{"h":"東山道：章との食い違い・出典間の食い違い","lv":3,"text":["- 朝日山藩の藩主家：32章（滋賀県）b節は、朝日山藩の藩主家を秋元家（山形藩から移封）としていた。しかし、コトバンク収録の辞典類（『世界大百科事典』『日本大百科全書（ニッポニカ）』『ブリタニカ』等の山形藩の項）はいずれも水野家・水野忠弘とする。本ファイルは水野家を採り、32章の値との食い違いとして明記する（32章の値そのものは訂正していない）。","- 大溝藩の廃藩（辞任）の日付：32章は大溝藩の消滅を「明治4年6月3日（1871年4月16日）」とするが、明治4年6月3日の新暦換算は1871年7月20日であり、章の換算自体が合わない。またWikipedia「大溝藩」は、分部光謙の藩知事辞任を1871年8月9日（明治4年6月23日）とする。本ファイルは「大溝藩」記事の値を採った。","- 西大路藩の最後の藩主：Wikipedia「市橋氏」は最後の藩主を市橋長義とするが、32章およびWikipedia「仁正寺藩」は市橋長和（ながかず）とする。本ファイルは長和を採り、食い違いを備考に明記した。","- 加納藩の永井家の期間：Wikipedia「美濃国」記事の藩の表は永井家を「1711年–1871年」とするが、「加納藩」記事では1711〜1756年は安藤家であり、永井直陳の入封は宝暦6年（1756年）である。本ファイルは「加納藩」記事に従い、食い違いを備考に明記した。","- 福島藩の処分を受けた藩主の名：Wikipedia「福島藩」は板倉勝己とし、「重原藩」は板倉勝尚とする。本ファイルは両方を備考に併記した。","- 佐野藩の再興の年：Wikipedia「佐野藩」のリード文は1825年、本文は文政9年（1826年）とする。本ファイルは本文の1826年を採り、食い違いを備考に明記した。","- 長瀞藩の立藩の年：Wikipedia「長瀞藩」のリード文は1796年入封とし、本文・基礎情報欄は寛政10年（1798年）の成立とする。本ファイルは1798年を採り、食い違いを備考に明記した。","- 上山藩の廃藩置県の日の換算：Wikipedia「上山藩」は「明治4年7月14日（1871年8月19日）」とするが、明治4年7月14日の新暦換算は1871年8月29日であり、記事内の換算に誤りがあるとみられる。本ファイルの対象日は他藩と共通の1871年8月29日とした。","- 棚倉藩・三春藩の所属国：両藩の記事は所在地を磐城国（棚倉藩は白河郡、三春藩は田村郡）とするが、本ファイルでは岩代の節に収録した（各行の備考に明記）。","- 近江の他の6藩（彦根・膳所・水口・近江宮川・山上・三上（対象外））については、32章b節の値と今回取得した値の間に食い違いは確認できなかった。"],"tables":[]},{"h":"東山道：取得不可","lv":3,"text":["- Wikipedia「黒石藩」単独記事：ページ参照エラーで取得できなかった。値は「弘前藩」記事の黒石藩の節で代替した。","- Wikipedia「出羽松山藩（松山藩 (出羽国)）」の日本語版の藩記事：2026-11-18に取得を試みたが取得できなかった。値は中国語版Wikipedia「松山藩 (出羽國)」と日本語版の個別記事（「酒井忠匡」「酒井忠恒 (出羽松山藩主)」）で代替し、その旨を羽後国の節に明記した。","- Wikipedia「岩崎藩」「米沢新田藩」の単独記事：いずれも他記事へのリダイレクトであり、単独記事は存在しない。岩崎藩の値は「久保田藩」記事の岩崎藩の節、米沢新田藩の併合の事実は「米沢藩」記事によった。","- 『国史大辞典』（吉川弘文館）の本文：有料・館内限定のため取得不可（詳細は畿内分（40_藩一覧_畿内.md）に記録済み）。"],"tables":[]},{"h":"北陸道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、北陸道7国（若狭・越前・加賀・能登・越中・越後・佐渡）に藩庁を置いていた藩のみ。北陸道では 19藩 が該当する（若狭1・越前5・加賀2・能登0・越中1・越後10・佐渡0）。","- 並び順：旧国の順（若狭・越前・加賀・能登・越中・越後・佐渡）。39_旧国一覧_北陸道.mdと同じ順である。","- 対象外：江戸時代の途中で消滅した藩は含めない。例：大聖寺新田藩（加賀、1709年廃藩）、木本藩・吉江藩・松岡藩（越前、いずれも江戸時代に廃藩・再併合）、能登下村藩・西谷藩（能登、元禄年間に短期間置かれたが転出して幕府領に戻った）など。","- 廃藩置県を待たずに消滅した藩も対象外である。北陸道では次の2藩がこれに当たる。","- 鞠山藩（旧・敦賀藩。越前国敦賀）：1869年8月1日（明治2年6月24日）に敦賀藩が正式名称となり、1870年4月23日（明治3年3月23日）に鞠山藩へ改称したが、1870年10月11日（明治3年9月17日）に小浜藩へ編入され消滅した（Wikipedia「小浜藩」「鞠山藩」）。そのため1871年8月29日時点では存在しない。なお旧藩主・酒井忠経は合併後の小浜藩知事となったため、小浜藩の項に現れる。","- 長岡藩（越後）：1870年11月15日（明治3年10月22日）に廃藩となり、領地は新潟県・柏崎県に編入された（Wikipedia「越後国」）。そのため1871年8月29日時点では存在しない。","- 能登国・佐渡国には、1871年時点で藩庁を置いた藩はない（能登は加賀藩領・幕府領・旗本領、佐渡は全域が佐渡奉行管轄の幕府領）。各国の節にその旨を明記した。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた。1869〜1871年に改称した藩（加賀藩→金沢藩は1869年、糸魚川藩→清崎藩は1869年、三根山藩→峰岡藩は1870年）は備考に明記した。","- 「廃藩の年」は全藩とも廃藩置県による1871年であるため、表では年だけを記した（月日は1871年8月29日（明治4年7月14日）で共通）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（明治4年11月＝新暦の1871年12月〜1872年1月）より前に置かれた県（旧藩名と同名の県）を記した。"],"tables":[]},{"h":"北陸道：章との食い違い","lv":3,"text":["- 北陸道4県（福井・石川・富山・新潟）については、既存の府県の章（25〜34は近畿7府県）が存在しないため、本ファイルの値は章と照合できていない（食い違いの有無自体が未確認）。","- 記事内部・辞典間の食い違いは各行の備考に明記した。主なものは次のとおり。","- 小浜藩の最終石高：記事本文「10万3500石」と歴代藩主の見出し「10万3000石」の食い違い。","- 加賀藩の立藩年：基礎情報欄「慶長7年（1600年）」と歴代藩主表「慶長5年（1600年）」の食い違い（慶長7年は1602年）。","- 清崎藩への改称年：1869年説（「糸魚川藩」「越後国」）と1868年説（「松平直静」）の食い違い。","- 与板藩の井伊家入封年：本文1705年と歴代藩主表の期間表記「1706年 - 」の食い違い。","- 丸岡藩の廃藩の月：記事本文は「明治4年（1871年）9月」と記す（他藩の記事は7月14日（1871年8月29日）とするものが多い）。","- 藩主の読み：酒井忠経（ただつね／タダツグ）、有馬道純（みちずみ／ミチスミ）の辞典間の食い違い。"],"tables":[]},{"h":"北陸道：取得不可","lv":3,"text":["- 吉川弘文館『国史大辞典』の項目本文は取得不可（詳細は40_藩一覧_畿内.mdに記録済み）。","- 上記のほか、本ファイルで使用したWikipedia各藩・各藩主記事、コトバンクの人名辞典記事はいずれも取得できた。ただし藩の値の大半はWikipediaのみに基づく（下記3分類参照）。"],"tables":[]},{"h":"山陰道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、山陰道8国（丹波・丹後・但馬・因幡・伯耆・出雲・石見・隠岐）に藩庁を置いていた藩のみ。山陰道では 17藩 が該当する（丹波7・丹後3・但馬3・因幡1・出雲3。伯耆・石見・隠岐は0）。","- 並び順：旧国の順（丹波・丹後・但馬・因幡・伯耆・出雲・石見・隠岐。39_旧国一覧_山陰道.md と同じ）。","- 対象外：江戸時代の途中で消滅した藩は含めない。例：八上藩（丹波、1609年に篠山藩へ移行）、八木藩・清富藩・竹田藩（いずれも但馬、江戸時代初期に消滅）、鹿野藩（因幡、江戸時代初期）、山崎家の若桜藩（因幡、1617年廃藩）、米子藩・倉吉藩・黒坂藩・矢橋藩（いずれも伯耆、江戸時代初期に廃藩・転封）、松江新田藩（出雲、1704年に所領を松江藩へ還付して廃藩）、吉永藩（石見、江戸時代中期に水口藩へ転封）など。","- 伯耆国について：1871年時点では国内の全域が鳥取藩領であり、藩庁を置いた藩はない。「伯耆国」の記事は「鳥取藩以外の藩はいずれも廃藩後、所領が池田家の属領として鳥取藩に併合された」とする。","- 石見国について：1871年8月29日時点で藩庁を置いた藩はない。","- 浜田藩は、慶応2年（1866年）の第二次長州征伐で藩主・松平武聰が浜田城を放棄して飛地の美作国鶴田へ逃れ、浜田は長州藩軍に占領されて廃藩となった（Wikipedia「浜田藩」。なお「石見国」の記事は「長州戦争により浜田藩が移転して美作鶴田藩となり、領地が周防山口藩預地となる」とする）。その後の藩庁は美作国（東山道）に置かれた鶴田藩であり、本ファイル（山陰道）の対象にはならない。","- 津和野藩は、最後の藩主・亀井茲監が、1871年8月29日（明治4年7月14日）に詔勅された廃藩置県に先立って廃藩建議書を提出し、同時に藩知事を辞職した（Wikipedia「津和野藩」）。Wikipedia「石見国」は津和野藩の廃藩を1871年8月11日（明治4年6月25日）とし、全域が浜田県の管轄となったとする。したがって1871年8月29日時点では存在せず、廃藩置県を待たずに消滅した狭山藩（畿内分）と同様に対象外とする。","- 隠岐国について：藩は置かれなかった。全域が幕府領（松江藩預地）であり、1869年（明治2年）には隠岐県が置かれた。","- 因幡国の鳥取藩の支藩について：鹿奴藩（鳥取東館新田藩）は明治2年（1869年）にみずから廃藩し、鳥取藩に吸収された（Wikipedia「鹿奴藩」）。若桜藩（鳥取西館新田藩）は明治元年（1868年）に若桜を居所として「若桜藩」を称したが新政府はこれを公認せず、明治2年（1869年）に廃止されて鳥取藩に編入された（Wikipedia「若桜藩」）。いずれも1871年時点では存在しないため対象外とする。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた。1868〜1871年に新設された藩（村岡藩は1868年の維新立藩）は備考に明記した。","- 「廃藩の年」は全藩とも廃藩置県による1871年であるため、表では年だけを記した（月日は1871年8月29日（明治4年7月14日）で共通）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（明治4年10月〜11月（旧暦）。新暦では1871年12月〜1872年1月）より前に置かれた県（旧藩名と同名の県）を記した。","- 「立藩の年」は、江戸時代の藩としての成立年に統一した。別説がある場合は備考に回した。元号と西暦の対応は検算した（例：慶長5年＝1600年、慶長7年＝1602年、元和8年＝1622年）。","- 1872年末までの日付は、新暦（旧暦）の順に書く。月だけの表記でも、旧暦の月であればその旨を明記し、新暦に換算した（月単位の換算になる場合は範囲で示した）。新暦への換算が出典にない日付は、旧暦であることを明記し、換算は未確認とした。"],"tables":[]},{"h":"山陰道：章との食い違い","lv":3,"text":["- 峰山藩の立藩年：Wikipedia「藩の一覧」は峰山藩を（1616年 - ）とするが、これは京極高通が元和2年（1616年）に独自に3000石を与えられた年であり、「峰山藩」記事と09章は立藩を元和8年（1622年）（高知の遺領1万石と合わせて1万3000石）とする。本ファイルは1622年を採り、「藩の一覧」の1616年を食い違いとして明記する。","- 篠山藩・松平康重の就封年：27章が記録するとおり、「篠山藩」記事の歴代藩主表は康重の八上入封を「慶長14年（1608年）9月」と記し、元号（慶長14年＝1609年）と西暦が食い違う。本ファイルの立藩年1609年は同記事本文と「藩の一覧」による。","- 村岡藩の成立の時期：27章は「1868年立藩（維新立藩）」とする。「山名義済」記事は、慶応4年6月20日（1868年。旧暦）に維新立藩（1万1000石への高直し）が認められ、藩主に取り立てられたのは明治2年（1869年）とする2段階の記述である。食い違いというより段階の区別であり、本ファイルは立藩の年を1868年とし、2段階の経緯を備考に明記した。","- 津和野藩の亀井家時代の始年（対象外の藩だが記録する）：「津和野藩」記事の歴代藩主表の見出しは亀井家を（1618年 - 1871年）とするが、本文は亀井政矩の入封を元和3年7月20日（1617年。旧暦）とする（記事内部の食い違い）。","- 丹波・丹後の各藩（亀岡・園部・綾部・山家・福知山・宮津・舞鶴・峰山）の最後の藩主・石高・期間は09章と一致した。山家藩の立藩年は09章・23章とも明記がなく、本ファイルも未確認として一致する。","- 但馬の各藩（出石・豊岡・村岡）と丹波の篠山藩・柏原藩の最後の藩主・石高・期間は27章と一致した。"],"tables":[]},{"h":"山陰道：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia各藩・各藩主記事はいずれも取得できた）。ただし『国史大辞典』の項目本文は取得不可である（冒頭参照）。藩の値の大半はWikipediaのみに基づく（下記3分類参照）。"],"tables":[]},{"h":"山陽道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、山陽道8国（播磨・美作・備前・備中・備後・安芸・周防・長門）に藩庁を置いていた藩のみ。山陽道では 29藩 が該当する（播磨10・美作3・備前1・備中9・備後1・安芸1・周防2・長門2）。","- 並び順：旧国の順（播磨・美作・備前・備中・備後・安芸・周防・長門）。Wikipedia「令制国一覧」の山陽道の順に同じ。","- 対象外：江戸時代の途中で消滅した藩は含めない。例：播磨新宮藩（播磨、1670年廃藩）、平福藩（播磨、1615〜1631年）、児島藩（備前、1649年廃藩）など。","- 廃藩置県を待たずに消滅した藩も対象外である。山陽道では次がこれに当たる。","- 徳山藩（周防）：第9代藩主・毛利元蕃が1871年（明治4年）5月に藩知事を辞任し、所領を本家・山口藩に返還した（Wikipedia「徳山藩」）。一方、Wikipedia「周防国」は明治4年6月19日（1871年8月5日）に徳山藩が廃藩となり領地が山口藩の管轄となったとする（時期の食い違い）。いずれにせよ1871年8月29日時点では存在しない。","- 福本藩（播磨）：1870年（明治3年）に鳥取藩へ併合され廃藩となったため、1871年8月29日時点では存在しない。27章（兵庫県）は存続期間の異なる藩も含めて表に掲載したが、本ファイルでは対象外とした（扱いの違い。末尾の「章との食い違い」参照）。","- 姫路新田藩（播磨）：姫路藩の新田支藩で、内分分知のため具体的な領地はほとんど不明であり、江戸定府で居所はなかった（Wikipedia「姫路新田藩」。27章の転記）。藩庁を播磨に置いた藩とは扱わず、対象外とした。","- 広島新田藩（安芸）：1870年1月27日（明治2年12月26日）に広島藩へ編入され消滅したため、対象外。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた。1869〜1871年に新設・移転・改称した藩（真島藩の改称、生坂藩の新設扱い、鴨方藩の改称）は備考に明記した。また1868年の維新立藩・正式立藩（成羽藩・岩国藩）も備考に明記した。","- 「廃藩の年」は全藩とも廃藩置県による1871年であるため、表では年だけを記した（月日は1871年8月29日（明治4年7月14日）で共通）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（明治4年11月。旧暦で、新暦では1871年12月頃）より前に置かれた県（旧藩名と同名の県）を記した。"],"tables":[]},{"h":"山陽道：章との食い違い","lv":3,"text":["- 播磨10藩の値：最後の藩主名・最終石高・立藩年は、27章（兵庫県）のb節と照合し、一致した（姫路藩 酒井忠邦・15万石、明石藩 松平直致・8万石（10万石格）、赤穂藩 森忠儀・森家2万石、龍野藩 脇坂安斐・脇坂家5万1000石、小野藩 一柳末徳・1万石、三草藩 丹羽氏中・1万石、安志藩 小笠原貞孚・1万石、山崎藩 本多忠明・本多家1万石、林田藩 建部政世・1万石（表高）、三日月藩 森俊滋・1万5000石）。","- 家格：27章のb節の表には家格の記載がないため、本ファイルの播磨各藩の家格は章と照合できていない（食い違いではなく未照合）。","- 藩主の読み：27章は姫路藩・明石藩・龍野藩・小野藩・三草藩・山崎藩・林田藩の各藩記事に藩主名の読みの記載がなく取得不可とした。本ファイルでも同じく未取得である。赤穂藩・安志藩・三日月藩の読みは27章でも取得済みで、本ファイルと一致する。","- 山崎藩の最後の藩主：27章は本多忠明とし、本ファイルもWikipedia「山崎藩」の歴代藩主表（9代・忠明）により忠明とした。幕末歴史ガイド（その他）は8代・本多忠鄰を最後の藩主とするため、出典間で食い違いがある（表の備考に明記）。","- 小野藩の立藩年：27章は、Wikipedia「藩の一覧」の1637年説と「小野藩」記事の1636年（川之江藩として立藩）・1642年（小野藩成立）の食い違いを記録済み。本ファイルも同じ扱いとした。","- 赤穂藩の石高：池田家・浅野家・永井家の石高についての記事内部の食い違い（3件）は27章に記録済み。本ファイルの最終値（森家2万石）は27章と一致する。","- 福本藩・播磨新宮藩・平福藩・姫路新田藩の扱い：27章はこれらを藩の表に含めた（福本藩は1870年廃藩、播磨新宮藩・平福藩は江戸時代前期に消滅、姫路新田藩は居所のない支藩）。本ファイルは1871年8月29日時点で藩庁を置いた藩のみを対象とするため、いずれも対象外とした（冒頭に明記）。値の食い違いではなく、対象範囲の違いである。","- 播磨以外の7国の藩には対応する府県の章（岡山県・広島県・山口県の章）がまだないため、章との照合は行えていない。"],"tables":[]},{"h":"山陽道：取得不可","lv":3,"text":["- Wikipedia「備後福山藩」「長州藩」「長府藩」「清末藩」の各記事本文：取得を試みたがレート制限（429）のため取得できなかった。福山藩・山口藩・豊浦藩・清末藩の値は、検索結果に表示された記事の抜粋・基礎情報欄、およびコトバンク『日本大百科全書（ニッポニカ）』・自治体公式サイトで確認できる範囲のみを転記し、確認できない項目は「未確認」または「―（読み未取得）」とした。","- 吉川弘文館『国史大辞典』の項目本文：有料会員制データベース（ジャパンナレッジ）または国立国会図書館内限定公開のため取得不可（40_藩一覧_畿内.mdに詳記）。"],"tables":[]},{"h":"南海道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、南海道6国（紀伊・淡路・阿波・讃岐・伊予・土佐）に藩庁を置いていた藩のみ。南海道では 14藩 が該当する（紀伊3・淡路0・阿波1・讃岐1・伊予8・土佐1）。","- 対象の基準（明文化）：本ファイルの対象は、「1871年8月29日（明治4年7月14日）の時点で藩として存在したこと」を唯一の基準とする。廃藩置県に先立って廃藩となった藩（先行廃藩の藩）は、その時期や事情（願い出による自主廃藩か、本藩への編入か等）を問わず一律に対象外とし、経緯は本節と各国の節に明記する。この基準は、廃藩置県直前の藩総数261の数え方（先行する自主廃藩14藩を除いた数。下記「廃藩置県時点の藩の総数（全国）について」参照）とも整合する。","- 並び順：旧国の順（紀伊・淡路・阿波・讃岐・伊予・土佐。「令制国一覧」の南海道の順）。","- 淡路国には該当する藩がない。淡路国は徳島藩領であり、藩庁は置かれず、筆頭家老の稲田家が洲本城代として統治した（27_兵庫県.md b節の転記による）。江戸時代初期の洲本藩・由良成山藩は1615年に廃藩となっており、対象外である。","- 対象外：江戸時代の途中で消滅した藩は含めない。例：阿波富田藩（阿波、徳島藩支藩、1725年廃藩）、松山新田藩（伊予、伊予松山藩支藩、1765年に藩主が本家を継ぎ新田分が幕府へ返上されて消滅）、中村藩（土佐、土佐藩支藩、江戸時代初期に廃藩）、川之江藩（伊予、1642年に藩庁を播磨国へ移して小野藩となり伊予を離れた）など。","- 廃藩置県を待たずに消滅した藩（先行廃藩の藩）も、上記の基準により対象外である。南海道では 多度津藩（讃岐）、丸亀藩（讃岐）、土佐新田藩（土佐） の3藩がこれに当たる。","- 多度津藩（丸亀藩支藩、京極家、外様1万石、最後の藩主は京極高典）：明治4年正月に解藩の建白書を提出し、1871年3月25日（明治4年2月5日） に廃藩が認められて、その領地は倉敷県の管轄となった（Wikipedia「讃岐国」「多度郡」。Wikipedia「府藩県三治制」の「任知藩事後に廃止された藩」の一覧も、多度津藩の廃止日を明治4年2月5日（1871年3月25日）・倉敷県へ編入とする）。「讃岐国」記事が「1871年（明治4年）2月5日」と記す日付は旧暦の月日であり、新暦は1871年3月25日である。そのため1871年8月29日時点では存在しない。なおWikipedia「多度津藩」は「1871年（明治4年）廃藩置県により倉敷県となる」と記しており、廃藩の時期の書き方には食い違いがある（同記事は日付を示さない概略的な記述である）。","- 丸亀藩（京極家、外様、最終石高5万1千石、最後の藩主は京極朗徹）：京極朗徹の人物記事（Wikipedia「京極朗徹」）によれば、明治4年（1871年）3月に諸藩に先駆けて廃藩置県を願い出て、1871年5月28日（明治4年4月10日） に丸亀藩は廃藩となって丸亀県が置かれ、朗徹は丸亀県知事に任じられた（日付の換算はWikipedia「府藩県三治制」の「任知藩事後に廃止された藩」の一覧による。香川県立図書館『香川県近代教育史年表』も、明治元年〜5年を太陰暦で表示する方針のもと「4・10 丸亀藩を廃し丸亀県を置く」と記す）。そのため1871年8月29日時点では存在しない。なおWikipedia「丸亀藩」は「1871年（明治4年）廃藩置県により丸亀県となる」と記しており、廃藩の時期の書き方には食い違いがある（同記事は日付を示さない概略的な記述である）。","- 土佐新田藩（高知新田藩、土佐藩支藩、1万3千石）：Wikipedia「土佐国」によれば、1870年9月20日（明治3年8月25日）に高知藩へ編入された。そのため1871年8月29日時点では存在しない。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた。1868年に維新立藩した藩（紀伊田辺藩・紀伊新宮藩）は備考に明記した。","- 「廃藩の年」は対象の全藩とも1871年であるため、表では年だけを記した（月日は1871年8月29日（明治4年7月14日）で共通）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（1872年1月2日（明治4年11月22日）に完了。南海道関係では、香川県（第1次）と名東県が1871年12月26日（明治4年11月15日）に置かれた）より前に、廃藩置県で置かれた県（旧藩名と同名の県）を記した。"],"tables":[]},{"h":"南海道：章との食い違い","lv":3,"text":["- 紀州藩の立藩と藩主家の始まり：34章は立藩1600年・初代藩主を浅野幸長とする。本ファイルも34章に合わせて1600年・浅野家から記した。一方、Wikipedia「紀伊国」の藩の表は、1600〜1601年を桑山家（2万石）とし、浅野家を1601年からとする書き方をしており、記事の間で食い違いがある（34章の値は変更していない）。","- 紀伊新宮藩の水野重央の入部年：「紀伊新宮藩」記事の本文は、元和7年（1621年）に水野重央が浜松領から転封したとするが、同記事の歴代藩主表では重央の在職期間の開始を元和5年7月19日（1619年）とする（記事内部の食い違い）。34章もこの食い違いを記録済みであり、本ファイルも両方を備考に残した。","- 紀伊田辺藩・紀伊新宮藩の立藩年：34章はいずれも1868年（慶応4年）の立藩とし、本ファイルも一致する。両藩とも、それ以前は紀州藩の附家老領であり藩としては扱われなかった点も34章と一致する。","- 淡路の扱い：27章は淡路を徳島藩領・洲本城代（稲田家）の統治とし、本ファイルも藩庁を置いた藩なしとして一致する。","- 阿波・讃岐・伊予・土佐の各藩は、対応する府県の章がないため照合できていない（食い違いの有無自体が未確認）。"],"tables":[]},{"h":"南海道：取得不可","lv":3,"text":["- 『国史大辞典』の項目本文（有料・館内限定のため。詳細は冒頭の「吉川弘文館『国史大辞典』での確認（取得不可）」の節に記した）。","- Wikipedia「伊予西条藩」の題では記事が存在せず取得できなかったため、西条藩については「西条藩」の題の記事を用い、Weblio辞書に転載された同記事（2025年12月14日版）で取得した。","- 上記を除き、本ファイルで使用したWikipedia各藩・各藩主記事、コトバンクの記事、徳島県公式サイトはいずれも取得できた。ただし藩の値の大半はWikipediaのみに基づく（下記3分類参照）。"],"tables":[]},{"h":"西海道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、西海道11国（筑前・筑後・豊前・豊後・肥前・肥後・日向・大隅・薩摩・壱岐・対馬）に藩庁を置いていた藩のみ。並び順は旧国の順（筑前・筑後・豊前・豊後・肥前・肥後・日向・大隅・薩摩・壱岐・対馬）。","- 確認できた藩は32藩（筑前2・筑後3・豊前3・豊後7・肥前9・肥後2・日向4・薩摩1・対馬1）。大隅国・壱岐国には藩庁を置いた藩はない（後述）。","- 対象外：江戸時代の途中で消滅した藩、および廃藩置県を待たずに消滅した藩は含めない。確認できた例：直方藩（筑前、福岡藩支藩。当初は東蓮寺藩と称し1623年に立藩、1675年（延宝3年）に直方藩へ改称、1677年に領地を福岡藩へ還付して消滅。第2期は1688年に立藩し、1720年（享保5年）に廃藩となり領地は福岡藩へ還付）、松崎藩（筑後、久留米藩支藩。1668年（寛文8年）に立藩、1684年（貞享元年）に藩主・有馬豊祐が改易され廃藩）、竜王藩・高田藩（豊後。1632年（寛永9年）に豊前国竜王（宇佐郡）で立藩して竜王藩と称し、1639年（寛永16年）に豊後国高田城へ藩庁を移して高田藩となり、1645年（正保2年）に藩主・松平英親が杵築藩へ移封されたため廃藩）、豊後高松藩（藩主・大給松平忠昭が1658年（明暦4年）に府内藩へ移封されたため廃藩。「府内藩」記事による）、日田藩（豊後。1686年（貞享3年）以降は幕府直轄領（代官支配）となり、廃藩置県の時点で藩は存在しない）、平戸新田藩（肥前、1870年に平戸藩に併合）、富江藩（肥前、福江藩の支藩、1868年に領地を没収され福江藩に併合）、宇土藩・高瀬藩（肥後、熊本藩の支藩、1870年に熊本藩へ編入）、富岡藩（肥後、1671年に廃藩となり、以後天草郡は幕府領のまま明治維新を迎えた）。","- 豊前国の千束藩（旧称は小倉新田藩）について：小倉藩の内分分知による支藩として1667年に立藩し、1869年8月1日（明治2年6月24日）に藩庁を千束へ移して千束藩と改称し、廃藩置県により千束県となったため、対象に含めた（記事「小倉新田藩」による）。","- 大隅国について：「藩の一覧」に大隅国の見出し自体がなく、大隅国は薩摩藩の領地であった（薩摩藩の基礎情報欄の国は「薩摩国・大隅国・日向国」）。大隅国に藩庁を置いた藩はない。","- 壱岐国について：「藩の一覧」に壱岐国の見出し自体がなく、壱岐国は平戸藩の領地であった（平戸藩は肥前国松浦郡・彼杵郡の一部と壱岐国を領した）。壱岐国に藩庁を置いた藩はない。藩庁は肥前国にあるため、平戸藩は肥前国の節に置く。","- 対馬国について：対馬府中藩は1869年（明治2年）に厳原藩と改称したため、最後の名前である 厳原藩 で書き、旧称を備考に書いた。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた。1869〜1871年に新設・移転した藩があれば備考に明記する。","- 「廃藩の年」は確認できた藩すべて廃藩置県による1871年であるため、表では年だけを記した（月日は1871年8月29日（明治4年7月14日）で共通）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（明治4年11月＝新暦の1871年12月〜1872年1月）より前に置かれた県（旧藩名と同名の県）を記した。"],"tables":[]},{"h":"西海道：章との食い違い","lv":3,"text":["- 既存の府県の章（京都＝09・23、奈良＝25、大阪＝26、兵庫＝27、三重＝33、滋賀＝32、和歌山＝34）に、西海道11国の藩を扱う章はないため、本ファイルの値は章と照合できていない（食い違いの有無自体が未確認）。"],"tables":[]},{"h":"西海道：取得不可","lv":3,"text":["- 『国史大辞典』（吉川弘文館）の項目本文は取得不可（有料会員制・国立国会図書館内限定公開のため。畿内分の本ファイルに経緯を記載済み）。","- 上記以外の出典（Wikipedia「藩の一覧」の九州地方の節、筑前・筑後・豊前・豊後を含む各藩記事、関係する人物記事）はすべて取得できた。なおWikipedia「千束藩」は記事「小倉新田藩」への転送であり、同記事で確認した。"],"tables":[]},{"h":"北海道：対象と範囲（先行して廃藩した藩など）","lv":3,"text":["- 対象：廃藩置県の時点、すなわち 1871年8月29日（明治4年7月14日） の時点で、北海道（渡島国）に藩庁を置いていた藩。該当するのは 松前藩（館藩）の1藩のみ である。","- 北海道11国は1869年9月20日（明治2年8月15日）の太政官布告で置かれたもので（39_旧国一覧_北海道琉球.md 参照）、藩庁の所在地は渡島国である。","- 対象外：明治2年（1869年）7月から明治4年（1871年）8月まで行われた北海道の「分領支配」に関与した諸藩（福岡藩・仙台藩・山口藩・鹿児島藩・久保田藩など）は、開拓使管轄下の所領を与えられたもので、藩庁を北海道に置いた藩ではないため含めない。分領支配は廃藩置県直後の明治4年（1871年）8月に廃止され、館県を除く全土が開拓使の直轄地とされた（Wikipedia「北海道の分領支配」）。","- 藩の名前が変わった藩は最後の名前で書き、旧称を備考に書いた（松前藩は明治期に 館藩 と称した）。","- 「廃藩置県の直後に属した県」は、第1次府県統合（明治4年11月＝新暦の1871年12月〜1872年1月）より前に置かれた県（旧藩名と同名の県）を記した。","---"],"tables":[]},{"h":"北海道：取得不可","lv":3,"text":["- なし（本ファイルで使用したWikipedia「松前藩」「北海道の分領支配」「北海道 (令制)」、コトバンク「松前藩」はいずれも取得できた）。ただし藩の値の大半はWikipediaのみに基づく（下記3分類参照）。"],"tables":[]}]},{"id":"tenryo","t":"天領・直轄地（奉行・郡代・代官所）","g":"土地と支配","file":"","meta":["- 第10便で集めたデータをそのまま載せている。補正便（第11便）はまだ届いていないため、確認中の項目が残っている（末尾の「注記」を見る）。"],"secs":[{"h":"対象と範囲","lv":3,"text":["- 対象：江戸幕府の直轄領（天領・幕領）と、その支配機構（奉行・郡代・代官所）、直轄の鉱山・港・関所、および関連用語の定義。","- 「天領」は俗称であり、江戸時代の正式な呼称ではない（第1節参照）。本ファイルでは便宜上「天領」を用いる。","- 日付は、1872年末までのものは新暦（旧暦）の順に書く。月だけの表記でも、旧暦であればその旨を明記して新暦に換算する。元号と西暦の対応は検算した。","- 支配機構の表の列は、番号／機関名／読み／所在地（旧国・現在の都道府県）／管轄範囲／設置年・廃止年／備考／出典の種別 とした。","- 代官所については数が多く変遷も激しいため、出典で確認できた範囲を明記し、網羅はしていない。","---"],"tables":[]},{"h":"1. 天領の概要","lv":3,"text":["出典：","- コトバンク「天領」（平凡社『改訂新版 世界大百科事典』、講談社『日本大百科全書（ニッポニカ）』） https://kotobank.jp/word/%E5%A4%A9%E9%A0%98-102868 （取得日：2026-11-18）／種別：その他（辞典）","- コトバンク「幕領」（山川出版社『山川 日本史小辞典 改訂新版』） https://kotobank.jp/word/%E5%B9%95%E9%A0%98-155502 （取得日：2026-11-18）／種別：その他（辞典）","- Wikipedia「天領」 https://ja.wikipedia.org/wiki/天領 （取得日：2026-11-18）／種別：Wikipedia"],"tables":[]},{"h":"呼称","lv":3,"text":["- 「天領」（てんりょう）は江戸幕府直轄地（幕領）の俗称。江戸時代には御料所もしくは御領と呼んだ（世界大百科事典）。","- 幕府直轄地が「天領」と呼ばれるようになったのは明治時代からで、江戸時代に使われていた呼称ではない。江戸幕府での正式名は御料・御領（ごりょう）。幕府法令には御料所（ごりょうしょ）、代官所、支配所の呼称もあり、地方書では大名領や旗本領を私領としたのに対して公領・公料、公儀御料所という呼称もあった（Wikipedia「天領」）。","- 近年は幕府の直轄地を「幕領」と呼ぶ傾向になっている（Wikipedia「天領」）。","- 山川『日本史小辞典』「幕領」：江戸幕府の直轄地。俗に天領ともいい、近世には御料・御蔵入とよばれた。"],"tables":[]},{"h":"総石高の変遷","lv":3,"text":["出典により数値が異なるため、出典ごとに転記する。","- 世界大百科事典「天領」：1603年（慶長8年）に開かれた江戸幕府は、徳川氏の蔵入地を引き継いで直轄領を形成し、慶長（1596〜1615）末年には200万石程度であったが、諸大名の改易・転封を通じて拡大し、元禄（1688〜1704）末年には400万石を超えた。その後1744年（延享1年）に461万石に達して江戸時代のピークを記録したが、やがて漸減に向かい1838年（天保9年）には419万石であった。","- 日本大百科全書（ニッポニカ）「天領」：天領は徳川氏の蔵入地が関ヶ原の戦いを経て1603年（慶長8年）の幕府開設後に拡大され、慶長末年には約230万石に達し、元禄年間（1688〜1704）には約400万石となった。総石高は固定化されていなかったが、1744年（延享1年）の総石高463万石、年貢高180万石を最高に、以後減少の傾向がみられた。","- 山川『日本史小辞典』「幕領」：総高は1615年（元和元年）頃には200万石ほどだったが、その後増加しつづけ、ピークの18世紀半ばには460万石をこえた。以後漸減するが幕末まで総高400万石以上を維持した。","- Wikipedia「天領」：幕府直轄領は元禄以降、全国で約400万石あった。「御取箇辻書付」（大河内家記録・向山誠斎『癸卯日記』所収）によれば、天領の石高が初めて300万石を超えたのは万治3年（1660年）、元禄5年（1692年）に初めて400万石を突破し、享保16年（1731年）には450万石に達し、延享元年（1744年）には江戸時代を通じて最大の463万4076石余となった。天保9年（1838年）には410万石台に落ち、天保以降も幕末まで410万石台を維持したと考えられる。なお個々の年度の石高は史料によって異なり、例えば元禄7年（1694年）の天領総石高は『癸卯日記』所収「御取箇辻書付」では395万5560石余、『近藤重蔵遺書』所収「御蔵入高並御物成元払積書」では418万1000石余と20万石以上の差がある。","食い違い：ピーク時の数値は、世界大百科事典が「461万石」、ニッポニカとWikipediaが「463万石（463万4076石余）」とする。慶長末年の数値も、世界大百科事典「200万石程度」、ニッポニカ「約230万石」と異なる。いずれも延享元年（1744年）をピークの年とする点は一致する。"],"tables":[]},{"h":"全国総石高に対する割合","lv":3,"text":["- 世界大百科事典「天領」：天保期の全国総石高3055万石のうち、大名領73.6%（2249万石）、旗本領11.6%（353万石）、禁裏・寺社領1.0%（33万石）に対して天領は13.7%の割合であった。","- ニッポニカ「天領」：享保（1716〜1736年）ごろ450万石（全国総石高の約15%）に達し、以降ほぼ400万石台。","- Wikipedia「天領」：元禄年間には400万石余に増加し、旗本知行地300万石を加えれば全国の約4分の1になった（コトバンク「天領」所収の解説による）。"],"tables":[]},{"h":"分布","lv":3,"text":["- 世界大百科事典「天領」：天領の分布は全国68か国中47か国に及び、1838年（天保9年）には関東筋94万石、奥羽筋55万石、信越筋73万石、海道筋74万石、近畿筋63万石、中国四国筋39万石、西国筋22万石と広がっており、幕府の膝元である関東、京・大坂を囲む近畿、東海道を擁する海道筋、米作地帯の出羽・越後方面に集中している。","- Wikipedia「天領」：江戸時代を通じて何らかの形で幕府直轄地が存在した国は51か国と1地域（蝦夷地）に及ぶ。年貢収取の対象となる田畑以外に、交通・商業の要衝と港湾、主要な鉱山、城郭や御殿の建築用材の産出地としての山林地帯（御林）が編入された。","- 食い違い：直轄地のあった国の数は、世界大百科事典「47か国」（1838年時点の分布）、Wikipedia「51か国と1地域」（江戸時代を通じて何らかの形で存在した国）で、時点と数え方が異なる。","- 一国まるごと天領となった国：佐渡、甲斐、飛騨、隠岐（Wikipedia「天領」）。","- 蝦夷地は、1799年（寛政11年）に東蝦夷地、1807年（文化4年）に和人地および西蝦夷地が天領となったが、1821年（文政4年）に一旦松前藩領に復し、1855年（安政2年）に再び天領とされた（Wikipedia「天領」）。"],"tables":[]},{"h":"支配の仕組み","lv":3,"text":["- 世界大百科事典「天領」：天領の支配は、石高5万〜10万石前後に1人の代官（郡代）を置いたが、一部は大名預地（預所）と称して近隣の藩に預けて年貢米の徴収を委託した。江戸には町奉行を置くほか、主要な拠点には遠国奉行（大坂、京都、駿府、伏見、奈良、堺、山田、日光、下田、浦賀、新潟、佐渡、長崎、箱館、兵庫（幕末）、神奈川（幕末））を置いて支配した。1838年（天保9年）には、代官支配地328万石、大名預地76万石、遠国奉行支配地14万石であった。遠国奉行は老中支配で上層の旗本が任命され、代官は勘定奉行の支配で下層の旗本が任命された。","- ニッポニカ「天領」：1730年（享保15年）には、天領のうち郡代・代官支配地360万石、大名預所74万石、遠国奉行支配地13万石に分けられていた。勘定奉行支配下で、郡代や代官が年貢徴収や一般民政事務を行った。","- 山川『日本史小辞典』「幕領」：管理は約8割が幕府の勘定方より派遣した郡代・代官による直接支配で、残りは大名などによる預所形式をとった。","- Wikipedia「天領」：幕府直轄の各領地には代官所がつくられ、郡代や代官・遠国奉行が支配した。すべての土地に奉行や代官を配することは現実的ではなく、これらは預地と称して近隣の大名や旗本、遠国奉行に管理が委託された（預所）。預所からの実収は幕領地総石高の6分の1に相当した。天領は村単位で保持され、散在あるいは虫食いの状態であった。旗本や公家寺社領などには多かった相給は天領には少なかったとされる。","---"],"tables":[]},{"h":"2. 主要な直轄支配機構の一覧","lv":3,"text":[],"tables":[]},{"h":"2-1. 奉行（江戸町奉行・遠国奉行）","lv":3,"text":["出典：","- Wikipedia「遠国奉行」 https://ja.wikipedia.org/wiki/遠国奉行 （取得日：2026-11-18）／種別：Wikipedia","- Wikipedia「町奉行」（江戸町奉行の奉行所設置年について。取得日：2026-11-18）／種別：Wikipedia","- 東京都公文書館「東京市史稿 市街篇第3」目次（江戸町奉行任命の記録） https://www.soumu.metro.tokyo.lg.jp/01soumu-archives/06kanko_butsu/0601sisiko/0601shigai/0601shigai03 （取得日：2026-11-18）／種別：公的","遠国奉行（おんごくぶぎょう）は、江戸以外の幕府直轄領のうち重要な場所に置かれ、その土地の政務を取り扱った奉行。老中の支配下。遠国奉行首座は長崎奉行。伏見奉行は大名から、他は旗本から任ぜられた。遠国奉行の管轄地を奉行知行所と呼ぶ（Wikipedia「遠国奉行」）。"],"tables":[{"cols":["番号","機関名","読み","所在地（旧国・現在の都道府県）","管轄範囲","設置年・廃止年","備考","出典の種別"],"rows":[["1","江戸町奉行","えどまちぶぎょう","武蔵国・東京都（北町奉行所は現在の東京駅八重洲北口付近、南町奉行所は有楽町付近）","江戸の町方（御府内）の行政・司法・警察","奉行所の設置は1631年（寛永8年）。廃止は1868年","公称は単に「町奉行」。定員2人（北町・南町、月番制）。1702年（元禄15年）から1719年（享保4年）までは中町奉行所も置かれた。1631年までは任命された者の邸宅を奉行所として執務した","Wikipedia"],["2","長崎奉行","ながさきぶぎょう","肥前国・長崎県","長崎の政務、貿易・外交の管理","1603年（慶長8年）設置、1867年（慶応3年）廃止","遠国奉行首座","Wikipedia"],["3","京都町奉行","きょうとまちぶぎょう","山城国・京都府","京都の町政","1668年（寛文8年）設置","Wikipedia「遠国奉行」の一覧表は「寛文8年（1669年）」と表記するが、寛文8年は1668年に当たるため本表では1668年とした（食い違いとして明記）","Wikipedia"],["4","大坂町奉行","おおさかまちぶぎょう","摂津国・大阪府","大坂の町政","1619年（元和5年）設置","堺奉行の廃止時には大坂町奉行へ統合された","Wikipedia"],["5","駿府町奉行","すんぷまちぶぎょう","駿河国・静岡県","駿府の町政のほか、駿河国内の天領の主に公事方、久能山東照宮の警衛","1607年（慶長12年）に設けられたが元和2年（1616年）以後しばらく廃職。1632年（寛永9年）再置、1868年（慶応4年）廃止","定員は当初2名（横内組町奉行・大手町奉行）、1702年（元禄15年）から1人役。老中の支配に属した","Wikipedia"],["6","伏見奉行","ふしみぶぎょう","山城国・京都府","伏見および周辺8村、木津川の船舶の取り締まり","1666年（寛文6年）設置、のち京都町奉行へ統合","遠国奉行のうち唯一、大名から任ぜられた（実際には5,000石級以上の大身旗本もいる）","Wikipedia"],["7","山田奉行","やまだぶぎょう","伊勢国・三重県（宇治山田）","伊勢神宮の警衛と宇治山田の政務","1603年（慶長8年）設置、1868年（慶応4年）廃止","明治維新後は度会府が置かれた","Wikipedia"],["8","日光奉行","にっこうぶぎょう","下野国・栃木県","東照宮・大猷院廟の経営、日光三山の年中行事。1791年（寛政3年）以降は日光目代の職権を兼務し日光領を直接支配","1700年（元禄13年）設置","定員2名で日光と江戸に1名ずつ、交替制。老中支配","Wikipedia"],["9","奈良奉行","ならぶぎょう","大和国・奈良県","奈良の町政および寺社。興福寺・東大寺など南都の大寺院の監視と門前町の支配、春日大社の警衛","1613年（慶長18年）設置","南都町奉行とも呼ばれる。老中支配だが直接には京都所司代の指揮下。定員1〜2名","Wikipedia"],["10","堺奉行","さかいぶぎょう","和泉国・大阪府","堺の政務","1600年（慶長5年）設置、1696年（元禄9年）廃止（大坂町奉行へ統合）。1702年（元禄15年）再置、1866年（慶応2年）廃止※原文は「1867年（慶応2年）」。慶応2年は1866年","再置後の行政機関としての後身は大坂町奉行","Wikipedia"],["11","佐渡奉行","さどぶぎょう","佐渡国・新潟県","佐渡一国と佐渡金山の支配","1601年（慶長6年）設置","佐渡は一国まるごと天領","Wikipedia"],["12","浦賀奉行","うらがぶぎょう","相模国・神奈川県","江戸湾に入る船舶の監視・積荷の検査、相模や浦賀の民政裁判。のち江戸湾の警備","1720年（享保5年）設置（下田奉行の移転による）","定員は時代により1〜2名。幕末期には外国との交渉の窓口となった","Wikipedia"],["13","下田奉行","しもだぶぎょう","伊豆国・静岡県","下田の港の警備、船舶の監督、貨物検査、当地の民政","1616年（元和2年）設置、1720年（享保5年）に浦賀へ移転。1842年（天保13年）再置、1844年（天保15年）統合。1854年（嘉永7年）再置、1860年（万延元年）まで","再置の期間は浦賀奉行と並存した","Wikipedia"],["14","羽田奉行","はねだぶぎょう","武蔵国・東京都","羽田の警備","1842年（天保13年）設置、1844年（弘化元年）廃止","短期間のみ存在","Wikipedia"],["15","新潟奉行","にいがたぶぎょう","越後国・新潟県","新潟周辺の民政、出入船舶の監視、密貿易の取り締まり、海岸警備","1843年（天保14年）設置、1868年（慶応4年）廃止","天保14年に天領となった新潟周辺を支配するため新設。初代は川村修就。日本海交通の要衝である新潟港の管理が設置理由","Wikipedia"],["16","箱館奉行","はこだてぶぎょう","渡島国（蝦夷地）・北海道","蝦夷地の行政・警固、開港地箱館における外国人の応対","1802年（享和2年）設置（当初の名称は蝦夷奉行、同年箱館奉行に改称）、1807年（文化4年）に松前奉行へ移転。1856年（安政3年）再置、1868年（慶応4年）廃止","奉行所は元治元年（1864年）に五稜郭へ移転","Wikipedia"],["17","松前奉行","まつまえぶぎょう","渡島国（蝦夷地）・北海道","蝦夷地の行政・警固","1807年（文化4年）設置、1822年（文政5年）廃止","松前藩の復領に伴う廃止","Wikipedia"],["18","大津奉行","おおつぶぎょう","近江国・滋賀県","大津の政務","1615年（元和元年）設置、1722年（享保7年）廃止（京都町奉行へ統合）","","Wikipedia"],["19","清水奉行","しみずぶぎょう","駿河国・静岡県","駿河湾の警衛","1621年（元和7年）設置、1696年（元禄9年）廃止（駿府町奉行へ統合）","配下に水主50人が所属。職務は駿府町奉行が継承","Wikipedia"],["20","神奈川奉行","かながわぶぎょう","武蔵国・神奈川県","神奈川（横浜）の政務、開港場の管理","1859年（安政6年）設置、1868年（慶応4年）廃止","","Wikipedia"],["21","兵庫奉行","ひょうごぶぎょう","摂津国・兵庫県","兵庫港の管理","1864年（元治元年）設置、1865年（慶応元年）廃止（兵庫港の廃止による）。1867年（慶応3年）再置、1868年（慶応4年）廃止","再置は兵庫開港に伴う","Wikipedia"]]}]},{"h":"2-2. 郡代","lv":3,"text":["出典：","- コトバンク「郡代」（平凡社『改訂新版 世界大百科事典』、講談社『日本大百科全書（ニッポニカ）』、小学館『精選版 日本国語大辞典』、山川出版社『山川 日本史小辞典 改訂新版』） http://kotobank.jp/word/%E9%83%A1%E4%BB%A3-58399 （取得日：2026-11-18）／種別：その他（辞典）","- Wikipedia「郡代」 https://ja.wikipedia.org/wiki/郡代 （取得日：2026-11-18）／種別：Wikipedia","- Wikipedia「関東郡代」 https://ja.wikipedia.org/wiki/関東郡代 （取得日：2026-11-18）／種別：Wikipedia","- Wikipedia「美濃郡代」 https://ja.wikipedia.org/wiki/美濃郡代 （取得日：2026-11-18）／種別：Wikipedia","- Wikipedia「飛騨郡代」（Weblio辞書による転載で確認。取得日：2026-11-18）／種別：Wikipedia","- コトバンク「西国筋郡代」（講談社『日本大百科全書（ニッポニカ）』） https://kotobank.jp/word/%E8%A5%BF%E5%9B%BD%E7%AD%8B%E9%83%A1%E4%BB%A3-271987 （取得日：2026-11-18）／種別：その他（辞典）","郡代（ぐんだい）は、勘定奉行の支配に属し、幕府直轄地の租税の徴収、領民の裁判、その他民政全般をつかさどった職。格式・支配地域とも代官より上で、大体10万石以上を支配した（精選版 日本国語大辞典）。江戸時代初期には上方、尼崎、三河、丹波、河内などほぼ1国単位に郡代が置かれたが、中期以降は関東郡代、美濃郡代、飛騨郡代、西国筋郡代の4郡代に固定化した（世界大百科事典、ニッポニカ、山川『日本史小辞典』、Wikipedia「郡代」）。","注記：","- 江戸時代初期の郡代として、上方郡代、尼崎郡代、丹波郡代、三河郡代、河内郡代があった（世界大百科事典、ニッポニカ、Wikipedia「郡代」）。これらは中期以降に廃止・再編され4郡代に固定化した。各初期郡代の設置年・廃止年は今回の出典範囲では未確認。","- 「東国郡代」という名称の郡代は、今回確認した辞典類・Wikipedia「郡代」のいずれにも見当たらず、未確認（存在を確認できなかった）。"],"tables":[{"cols":["番号","機関名","読み","所在地（旧国・現在の都道府県）","管轄範囲","設置年・廃止年","備考","出典の種別"],"rows":[["1","関東郡代","かんとうぐんだい","江戸（武蔵国・東京都）","関八州の幕府直轄領約30万石（Wikipedia「関東郡代」）","関東代官頭としての始まりは1590年（天正18年）。1820年（文政3年）に一度廃止、幕末に再置され1868年に廃止","代官頭の系統を引く伊奈家が代々就いた。近年の研究では、公式の関東郡代の設置は寛政4年（1792年）のことであり、それ以前に伊奈氏が就いていたとされる「関東郡代」は「関東代官」であった伊奈氏による自称に過ぎなかったことが明らかにされている（Wikipedia「郡代」、太田尚宏の研究）。伊奈忠篤は飛騨郡代も一時兼務した","その他（辞典）、Wikipedia"],["2","美濃郡代","みのぐんだい","笠松陣屋（美濃国・岐阜県羽島郡笠松町）","美濃国中西部と伊勢国桑名郡の一部の幕府直轄領。美濃国内の幕府領19万石余りのうち一部は大垣藩の預地","前身は関ヶ原の戦い後に置かれた美濃国奉行（大久保長安）。郡代・代官制への移行後、歴代は岡田善同（1613年（慶長18年）〜1631年（寛永8年））から数えて24代。廃止は1868年","別名・上方郡代。陣屋は当初可児郡姫村、のち徳野村を経て笠松へ移転。勘定奉行支配、席次は関東郡代に次ぐ。郡上郡・加茂郡・恵那郡は1726年（享保11年）から1860年（万延元年）まで飛騨郡代が所管した","Wikipedia"],["3","飛騨郡代","ひだぐんだい","高山陣屋（飛騨国・岐阜県高山市）","飛騨国全域ならびに美濃国の山間部、越前国および加賀国の一部の幕府直轄領","1692年（元禄5年）に飛騨が高山藩領から幕府領となった際に代官が置かれ（初代は関東郡代の伊奈忠篤が兼任）、1777年（安永6年）に郡代に昇格。廃止は1868年","勘定奉行支配、席次は西国郡代に次ぐ。支所として下川辺出張陣屋（美濃国加茂郡、現在の岐阜県加茂郡川辺町）が置かれた。郡代昇格前の代官11代と郡代14代を合わせて25代が派遣された","Wikipedia"],["4","西国筋郡代","さいごくすじぐんだい","日田・永山布政所（豊後国・大分県日田市）","九州地方の幕府直轄領。1776年（安永5年）時点で豊後、豊前、肥前、肥後、日向の5か国15郡にまたがり石高15万石弱（のち筑前を加え6か国とも）","前身の日田代官は1639年（寛永16年）設置。1767年（明和4年）に日田代官の揖斐政俊が郡代に昇格して成立。廃止は1868年","勘定奉行の配下。郡代としては関東、美濃に次いで3番目に設置された。日田代官が郡代に昇格しなかった期間は設置されなかった","その他（辞典）"]]}]},{"h":"2-3. 代官所","lv":3,"text":["出典：","- Wikipedia「代官」 https://ja.wikipedia.org/wiki/代官所 （「代官所」から転送。取得日：2026-11-18）／種別：Wikipedia","- 文化遺産オンライン「韮山役所跡」（文化庁） https://online.bunka.go.jp/heritages/detail/192622 （取得日：2026-11-18）／種別：公的","- 静岡県公式ホームページ「しずおか文化財ナビ 韮山役所跡」 https://www.pref.shizuoka.jp/kankosports/bunkageijutsu/bunkazai/1002825/1041003/1041884/1004956/1020734.html （取得日：2026-11-18）／種別：自治体","代官（だいかん）は郡代と共に勘定奉行の支配下におかれ、小禄の旗本の知行地と天領を治めた。通常、代官支配地は数万石位を単位に編成され、代官は支配所に陣屋（代官所）を設置し統治にあたった。代官の身分は150俵と旗本としては最下層に属するが、支配地域・権限は大きかった（Wikipedia「代官」）。","主要な代官所（個別に確認できたもの）：","このほかの代官所・陣屋（Wikipedia「代官」の「主な代官所・陣屋一覧」の転記。個別の設置年・管轄範囲は未確認）：","- 陸奥国：浅川陣屋、川俣代官所、中畑陣屋","- 出羽国：尾花沢代官陣屋、寒河江代官陣屋、東根代官陣屋","- 下野国：東郷陣屋、真岡陣屋","- 上野国：岩鼻陣屋","- 武蔵国：岡津陣屋、小杉陣屋、世田谷代官屋敷（現存する彦根藩の飛地代官所）","- 越後国：小千谷陣屋、川浦陣屋、塩野町陣屋、脇野町陣屋","- 越前国：本保陣屋","- 甲斐国：上飯田代官所、石和代官所、市川代官所、谷村代官所、谷村陣屋","- 信濃国：飯島陣屋、中野陣屋、中之条陣屋、御影陣屋、山村代官屋敷","- 駿河国：駿府紺屋町陣屋","- 遠江国：黒田家代官屋敷","- 三河国：赤坂陣屋、島田陣屋","- 備中国：西江邸代官御用所","注記：","- 高山陣屋は飛騨郡代（2-2の3）、笠松陣屋は美濃郡代（2-2の2）、日田代官所（永山布政所）は西国筋郡代（2-2の4）の役所であるため、代官所の表には重ねて入れなかった。","- 羽生・岡部（武蔵国）、藤岡（上野国）、松本（信濃国）の代官所については、今回確認した出典の範囲では確認できず未確認。","---"],"tables":[{"cols":["番号","機関名","読み","所在地（旧国・現在の都道府県）","管轄範囲","設置年・廃止年","備考","出典の種別"],"rows":[["1","韮山代官所","にらやまだいかんしょ","伊豆国・静岡県伊豆の国市韮山","伊豆国を中心に駿河国・相模国・武蔵国に及び、幕末には甲斐国も管轄。石高は5万〜10万石余、江川英龍のとき12万石余、晩年には26万石余","1596年（慶長元年）に江川英長が伊豆代官職に任命されたのが始まり。廃止は1868年（明治維新後は韮山県庁として引き継がれた）","江川家がほぼ世襲（1723年（享保8年）〜1758年（宝暦8年）の間を除く）。役所は江戸と韮山の2か所にあり、江戸で武蔵・相模・甲斐、韮山で伊豆・駿河を管轄した。出先機関として三島陣屋、谷村陣屋、松岡陣屋などが置かれた。36代英龍（坦庵）は反射炉・品川台場の建設で知られる","公的、自治体"],["2","松崎代官所","まつざきだいかんしょ","伊豆国・静岡県賀茂郡松崎町","伊豆国の幕府領の一部","未確認","代官・宮川智之助佐衛門が知られる（Wikipedia「代官」）","Wikipedia"],["3","大森代官所","おおもりだいかんしょ","石見国・島根県大田市大森町","石見銀山とその周辺の幕府領","未確認","旧大森代官所の門長屋が現存する（Wikipedia「代官」）","Wikipedia"],["4","生野代官所","いくのだいかんしょ","但馬国・兵庫県朝来市生野町","生野銀山と但馬国の幕府領","未確認","第2-3節の一覧（Wikipedia「代官」の主な代官所・陣屋一覧）による","Wikipedia"],["5","倉敷代官所","くらしきだいかんしょ","備中国・岡山県倉敷市","備中国の幕府領","未確認","","Wikipedia"],["6","五條代官所","ごじょうだいかんしょ","大和国・奈良県五條市","南大和7万石","未確認（幕末時点の人員構成が伝わる）","幕末の五条代官所では、代官1人、幕臣の手付3人、お抱えの手代10人（士分）しかいなかったという（Wikipedia「代官」）","Wikipedia"],["7","久美浜代官所","くみはまだいかんしょ","丹後国・京都府京丹後市","丹後国の幕府領","未確認","","Wikipedia"],["8","川之江代官所","かわのえだいかんしょ","伊予国・愛媛県四国中央市","伊予国の幕府領","未確認","","Wikipedia"],["9","出雲崎代官所","いずもざきだいかんしょ","越後国・新潟県三島郡出雲崎町","越後国の幕府領","未確認","","Wikipedia"],["10","水原代官所","すいばらだいかんしょ","越後国・新潟県阿賀野市","越後国の幕府領","未確認","水原陣屋とも","Wikipedia"],["11","甲府代官所","こうふだいかんしょ","甲斐国・山梨県甲府市","甲斐国の幕府領（甲斐は一国天領）","未確認","甲斐国にはほかに上飯田代官所、石和代官所、市川代官所、谷村代官所があった（Wikipedia「代官」）","Wikipedia"],["12","四日市陣屋","よっかいちじんや","伊勢国・三重県四日市市","伊勢国の幕府領","未確認","","Wikipedia"],["13","交野代官所","かたのだいかんしょ","河内国・大阪府交野市","河内国の幕府領","未確認","","Wikipedia"],["14","亀岡陣屋","かめおかじんや","丹波国・京都府亀岡市","丹波国の幕府領","未確認","","Wikipedia"]]}]},{"h":"3. 直轄の鉱山・重要拠点","lv":3,"text":[],"tables":[]},{"h":"3-1. 直轄の鉱山","lv":3,"text":["出典：","- Wikipedia「天領」 https://ja.wikipedia.org/wiki/天領 （取得日：2026-11-18）／種別：Wikipedia","- Wikipedia「遠国奉行」 https://ja.wikipedia.org/wiki/遠国奉行 （佐渡奉行の設置年。取得日：2026-11-18）／種別：Wikipedia","- Wikipedia「代官」 https://ja.wikipedia.org/wiki/代官所 （大森代官所・生野代官所。取得日：2026-11-18）／種別：Wikipedia","- 「金属の歴史12（江戸時代1）」（金属史の年表サイト） http://tuguhikeiko21.g1.xrea.com/kinzoku/kinzo12.html （取得日：2026-11-18）／種別：その他（内容）","- Wikipedia「院内銀山」 https://ja.wikipedia.org/wiki/院内銀山 （取得日：2026-11-18）／種別：Wikipedia","幕府は主要な鉱山を直営・直轄とし、佐渡（相川）、石見（大森）、伊豆（土肥）などの主要な鉱山を直営とした（「金属の歴史12」）。年貢収取の対象となる田畑以外に主要な鉱山が直轄領に編入され、幕府の主要な財源であった（Wikipedia「天領」）。","注意（幕府直轄ではない鉱山）：","- 院内銀山（いんないぎんざん、出羽国・秋田県湯沢市）は1606年（慶長11年）に村山宗兵衛らにより発見・開山したが、久保田藩（秋田藩）によって管理され、久保田藩の財政を支える重要な鉱山であった。Wikipedia「院内銀山」は「他の主要鉱山が幕府直轄地であったのに対し、院内・阿仁の両鉱山を有し、ともに藩営とした久保田藩」と明記しており、院内銀山・阿仁銅山（あにどうざん、出羽国・秋田県北秋田市）は幕府直轄ではなく久保田藩の直轄（藩営）である。"],"tables":[{"cols":["番号","鉱山名","読み","所在地（旧国・現在の都道府県）","産出物","直轄の経緯・支配","出典の種別"],"rows":[["1","佐渡金山","さどきんざん","佐渡国・新潟県佐渡市（相川）","金・銀","1601年（慶長6年）に佐渡奉行が置かれ、佐渡一国とともに直轄支配された。1601年7月に佐渡の金銀山が発見され、伊豆・生野・石見・甲斐より山師を招集し開発が強化された（年表）","Wikipedia、その他（内容）"],["2","石見銀山","いわみぎんざん","石見国・島根県大田市（大森）","銀","江戸時代の主要な直営鉱山の一つ。支配は大森代官所による","Wikipedia、その他（内容）"],["3","生野銀山","いくのぎんざん","但馬国・兵庫県朝来市生野町","銀","江戸時代の主要鉱山として直轄とされ、生野代官所が置かれた。1635年（寛永12年）に運上銀1200貫を幕府に貢上した（年表）","Wikipedia、その他（内容）"],["4","土肥金山","といきんざん","伊豆国・静岡県伊豆市（土肥）","金・銀","伊豆の諸金銀山は幕府直営とされた。伊豆の鉱山は韮山代官の管轄に関わる","その他（内容）"],["5","足尾銅山","あしおどうざん","下野国・栃木県日光市（足尾）","銅","1610年（慶長15年）に農民によって発見され、1647年（正保4年）に幕府直轄の銅山となった（年表）","その他（内容）"],["6","吉岡銅山","よしおかどうざん","備中国・岡山県高梁市（小泉銅山）","銅","1642年（寛永19年）に盛況となり、幕府直轄の銅山となった。毎年5万300斤の銅を産出した（年表）","その他（内容）"]]}]},{"h":"3-2. 直轄の港","lv":3,"text":["直轄の港は、おおむね奉行の管轄と一体である（第2-1節参照）。","- 長崎：長崎奉行（1603年設置）。貿易・外交の窓口。","- 下田：下田奉行（1616年設置、のち浦賀へ移転・再置）。","- 浦賀：浦賀奉行（1720年設置）。江戸湾の船舶監視。","- 新潟：新潟奉行（1843年設置）。日本海交通の要衝である新潟港の管理が設置理由（Wikipedia「遠国奉行」）。","- 箱館：箱館奉行（1802年設置、1856年再置）。開港地の外国人応対。","- 神奈川（横浜）：神奈川奉行（1859年設置）。","- 兵庫：兵庫奉行（1864年設置、1867年再置）。"],"tables":[]},{"h":"3-3. 関所","lv":3,"text":["出典：","- 「箱根関所 - Monumento」 https://ja.monumen.to/spots/9931 （取得日：2026-11-18）／種別：その他（内容）","- Weblio辞書「箱根関所」（Wikipedia「箱根関所」の転載） https://www.weblio.jp/content/%E7%AE%B1%E6%A0%B9%E9%96%A2%E6%89%80 （取得日：2026-11-18）／種別：Wikipedia","- 江戸幕府は江戸防衛のために全国に53か所の関所を設置した。そのうち特に重要で規模が大きかったのは、東海道の箱根（相模国、現在の神奈川県箱根町）と新居（今切、遠江国、現在の静岡県湖西市）、中山道の碓氷（上野国、現在の群馬県安中市）、木曽福島（信濃国、現在の長野県木曽町）の4関所とされる。","- 箱根関所は元和5年（1619年）に設置されたと伝えられ、明治2年（1869年）の関所制度廃止まで機能した。ただし実際の管理運営は、一時期を除いて原則として小田原藩が行っていた（幕府直轄の関所だが運営は藩への委託）。","- 新居関所（今切関所）は、元和5年（1619年）に服部正信・政重兄弟が関所奉行に就き、元禄15年（1702年）に三河吉田藩に管理が移された（出典：秋山伸隆ほか「東海道遠江・駿河」資料、その他（内容））。","- その他の関所の個別の設置年・管轄は、今回の出典範囲では未確認。","---"],"tables":[]},{"h":"4. 用語の定義","lv":3,"text":["出典：","- コトバンク「相給」（平凡社『改訂新版 世界大百科事典』、講談社『日本大百科全書（ニッポニカ）』、山川出版社『山川 日本史小辞典 改訂新版』、小学館『精選版 日本国語大辞典』） http://kotobank.jp/word/%E7%9B%B8%E7%B5%A6-23647 （取得日：2026-11-18）／種別：その他（辞典）","- コトバンク「公領」（小学館『デジタル大辞泉』、平凡社『百科事典マイペディア』、山川出版社『山川 日本史小辞典 改訂新版』） http://kotobank.jp/word/%E5%85%AC%E9%A0%98-497889 （取得日：2026-11-18）／種別：その他（辞典）","- コトバンク「私領」（小学館『デジタル大辞泉』、小学館『精選版 日本国語大辞典』） https://kotobank.jp/word/%E7%A7%81%E9%A0%98-535886 （取得日：2026-11-18）／種別：その他（辞典）","- コトバンク「天領」「幕領」（第1節の出典に同じ）／種別：その他（辞典）","- 天領・幕領：江戸幕府の直轄地。天領は俗称で、近世には御料・御蔵入とよばれた（第1節参照）。","- 御料・御蔵入（蔵入地）：幕府の直轄領の当時の呼称。天領は徳川氏の蔵入地（くらいりち）を引き継いで形成された（世界大百科事典「天領」）。蔵入地とは本来、領主が家臣に給与せず直接支配した土地をいう。","- 公領（こうりょう）：朝廷・国衙・幕府などの領地。江戸時代には天領にもいった（デジタル大辞泉）。私領に対する語。","- 私領（しりょう）：江戸時代、幕府の直轄地に対して、大名・旗本・御家人の領地（デジタル大辞泉）。幕藩体制の下では、一部の寺社・朝廷領を別とすれば全国の土地・人民は御料、私領に区分された（世界大百科事典「私領」）。","- 旗本領（旗本知行地）：将軍直属の家臣である旗本の知行地。天領には含まれない（Wikipedia「天領」：親藩や譜代、旗本等は徳川の一門直臣であるが、これらの領地は天領には含まない）。石高は、天保期で353万石（全国総石高の11.6%、世界大百科事典「天領」）、元禄年間で300万石（ニッポニカ「天領」）とされる。食い違いではなく時点の異なる数値である。","- 御家人：将軍直属の家臣のうち旗本より下の身分。多くは知行地を持たず蔵米・切米で給与されたため、「御家人領」というまとまった領地区分は通常用いられない（この点の辞典類での明示的な定義は今回未確認）。","- 相給（あいきゅう）：江戸時代、1村が2人以上の地頭または領主によって領知されること、またはその知行地。1村が分割領有されるので分郷（わけごう）ともいう。分給・相知・相知行・入会（いりあい）知行ともいう（世界大百科事典、ニッポニカ、山川『日本史小辞典』）。相給例は地頭の知行所（旗本知行所、藩士知行所）に特に著しく、公家領・寺社領でも少なくないが、大名領・天領では少ない傾向にあった。相給人数により二給、三給などと呼ばれた（世界大百科事典）。広義には、一村内に幕府直轄領・大名領・旗本知行地などが併存することも相給という（百科事典マイペディア）。","- 預地・預所（あずかりしょ）：天領のうち、幕府が代官・奉行を置かず、近隣の大名などに年貢徴収などの管理を委託した土地（世界大百科事典「天領」、山川『日本史小辞典』「幕領」）。1838年（天保9年）には大名預地76万石、1730年（享保15年）には大名預所74万石（第1節参照）。","- 上知（あげち）：幕府が大名・旗本の領地を没収・収公して直轄領に編入すること。蝦夷地の上知（1799年、1807年、1855年）や、水野忠邦の天保の改革における上知令（江戸城・大坂城の十里四方を天領とするもの）が知られる（Wikipedia「天領」）。","---"],"tables":[]},{"h":"取得不可だったページ","lv":3,"text":["- 吉川弘文館『国史大辞典』の「天領」「郡代」「代官」等の項目本文：本文が読める経路はジャパンナレッジ（有料会員登録・ログインが必要で、法人向けLibでは別途契約の「セレクト」コンテンツ）と国立国会図書館デジタルコレクション（館内限定公開）であり、いずれも利用できなかったため取得不可。詳細は40_藩一覧_畿内.md の同名の節に記録済み。","- Wikipedia「阿仁銅山」の記事ページ：今回の取得ではページが解決できず本文を取得できなかった。阿仁銅山が久保田藩営であることは、Wikipedia「院内銀山」の記述（「院内・阿仁の両鉱山を有し、ともに藩営とした久保田藩」）で確認した。","---"],"tables":[]},{"h":"3分類","lv":3,"text":[],"tables":[]},{"h":"公的で照合できたもの","lv":3,"text":["- 韮山代官所（韮山役所跡）の所在地・江川家の世襲代官であること、慶長元年（1596年）の任用、支配地と石高の変遷（文化遺産オンライン＝文化庁、静岡県公式サイト）。","- 江戸町奉行の任命記録の存在（東京都公文書館「東京市史稿」）。"],"tables":[]},{"h":"Wikipediaだけのもの","lv":3,"text":["- 遠国奉行の一覧（各奉行の設置年・廃止年・管轄）と、江戸町奉行の奉行所設置年（1631年）。","- 郡代のうち美濃郡代・飛騨郡代の管轄範囲と沿革、関東郡代の管轄石高（約30万石）。","- 代官所の一覧（大森・生野・倉敷・五條・久美浜・川之江・出雲崎・水原・甲府・四日市・交野・亀岡ほか、地域別の代官所・陣屋名）。","- 天領の石高の年度別変遷（「御取箇辻書付」による数値）と、一国天領（佐渡・甲斐・飛騨・隠岐）、蝦夷地の上知の経緯。","- 院内銀山・阿仁銅山が久保田藩営であること。"],"tables":[]},{"h":"未確認のもの","lv":3,"text":["- 『国史大辞典』本文での天領・郡代・代官の記述（取得不可）。","- 「東国郡代」という郡代の存在（辞典類・Wikipedia「郡代」に見当たらなかった）。","- 江戸時代初期の郡代（上方・尼崎・丹波・三河・河内）の個別の設置年・廃止年。","- 代官所の大半の設置年・廃止年と個別の管轄石高（羽生・岡部・藤岡・松本の代官所の存在自体を含む）。","- 石見銀山・生野銀山の直轄化の正確な年次（大森代官所・生野代官所の設置年を含む）。","- 関所53か所の個別の一覧と、箱根・新居・碓氷・木曽福島以外の関所の設置年。","- 御家人に知行地が原則なかったことの辞典類での明示的な定義。","- 天領の総石高のピーク値（461万石と463万石の食い違いは未解決のまま併記）。"],"tables":[]}]},{"id":"mikuriya","t":"伊勢神宮の御厨・神宮領","g":"土地と支配","file":"","meta":["取得日：2026-11-18","前提：本ファイルは伊勢神宮の御厨（みくりや）・神宮領について、出典で確認できた範囲を転記したものである。御厨の総数は中世の史料では450余所とされるが（第1節参照）、個別の御厨名を出典で確認できたのは一部にとどまるため、第2節の一覧は網羅的なものではない。古代・中世の日付は出典の表記（和暦）のまま転記し、西暦への換算が出典にないものは「暦不明（旧暦）」と注記した。1872年末までの日付で換算が確認できるものは新暦（旧暦）の順で書いた。","---","- 第10便で集めたデータをそのまま載せている。補正便（第11便）はまだ届いていないため、確認中の項目が残っている（末尾の「注記」を見る）。"],"secs":[{"h":"1. 御厨の定義と制度","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- コトバンク「御厨」（小学館『日本大百科全書（ニッポニカ）』「御厨（荘園）」、平凡社『改訂新版 世界大百科事典』「御厨」、山川出版社『山川 日本史小辞典 改訂新版』「御厨」） https://kotobank.jp/word/%E5%BE%A1%E5%8E%A8-138397 （取得日：2026-11-18）","- Wikipedia「御厨」 https://ja.wikipedia.org/wiki/御厨 （取得日：2026-11-18）","- Wikipedia「神郡」 https://ja.wikipedia.org/wiki/神郡 （取得日：2026-11-18）","- コトバンク「神郡」（小学館『日本大百科全書（ニッポニカ）』「神郡」、平凡社『改訂新版 世界大百科事典』「神郡」） http://kotobank.jp/word/%E7%A5%9E%E9%83%A1-81573 （取得日：2026-11-18）","- コトバンク「伊勢国」（平凡社『日本歴史地名大系』「伊勢国」） https://kotobank.jp/word/%E4%BC%8A%E5%8B%A2%E5%9B%BD （取得日：2026-11-18）","- コトバンク「伊勢神宮」（小学館『日本大百科全書（ニッポニカ）』「伊勢神宮」） https://kotobank.jp/word/%E4%BC%8A%E5%8B%A2%E7%A5%9E%E5%AE%AE-30959 （取得日：2026-11-18）","- 「ムラの戸籍簿」データベース「伊勢国」（作成者：鎌倉佐保・伊藤哲平） https://drfh.jp/mura/index.php?title=%E4%BC%8A%E5%8B%A2%E5%9B%BD （取得日：2026-11-18）"],"tables":[]},{"h":"御厨の定義（出典の転記）","lv":3,"text":["- Wikipedia「御厨」：「御厨（みくり、みくりや）とは、『御』（神の）+『厨』（台所）の意で、神饌を調進する場所のことである。本来は神饌を用意するための屋舎を意味する。御園（みその、みそのう）ともいう」「表現の一種として神饌を調進するための領地も意味する。そこに生産者（漁民など）が神人として属していた」。","- 『日本大百科全書（ニッポニカ）』「御厨（荘園）」（コトバンク）：「皇室および伊勢神宮、賀茂神社などの神社への供膳と供祭のための魚菜類を貢進することを目的に、おもに漁民を対象に設けられたもの」「10世紀以降、田畠を中心とする荘園と同質化の方向に進んだ」。また同項は、伊勢神宮について「神郡の行政のために神（かんだち）が設けられていたが、孝徳天皇（在位645～654）のときに神だちの名称を改めて御厨としたという。御厨には贄（にえ）が納められ、また祭の後の大饗（たいきょう）もここでなされた」と記す。","- 『改訂新版 世界大百科事典』「御厨」（コトバンク）：「古代・中世の皇室や伊勢神宮などの大神社に付属する，食料品調達にかかわる所領。平安時代末から鎌倉時代ごろには荘園とほとんど変わらないものとなった」「1069年（延久1）に贄貢進制の決定的な改革が行われ，諸国の贄は御厨子所預（あずかり）の管理する御厨，御薗（みその）の負担するところとなった」「旧来の御厨に加えて11世紀後半以降，東国を中心に荘園としての御厨が多く寄進されて増加し，13世紀初めの《神宮雑例集》では御薗と合わせて450余所と記されている」。","- Wikipedia「御厨」：「神社は神田、神郡、神戸といった領地を持っていたが、平安時代中期以降荘園が増え神社も権禰宜による自墾地系の地域の特産品を納めるかわりに神税を免除される御厨・御園という名の荘園を持つようになる。その後、権禰宜の仲介で武士からの寄進地系の御厨・御園が増加していった」。","- 御厨と御園の呼び分けについて：「磐田物語」（静岡県磐田市の地域史サイト）の解説では、「伊勢神宮の場合、農産物（米など）を主に納める所領を御厨、野菜・果実や塩・海産物など畑作・特産を主とする所領を御園（みその）と呼び分けることが多い」とされる（種別：その他（内容））。"],"tables":[]},{"h":"神郡（しんぐん）","lv":3,"text":["- Wikipedia「神郡」：「神郡（しんぐん/かみのこおり）は、日本の律令制下において一郡全体が特定の神社の所領・神域として定められた郡。社領（神領）の一種で、郡からの収入はその神社の修理・祭祀費用に充てられた」。","- 伊勢の神郡：伊勢国には13郡が存在したが、そのうち次の8郡が伊勢神宮領の神郡と定められて「神八郡」と称された（Wikipedia「神郡」）。度会郡・多気郡・飯野郡（この3郡は「神三郡」または「道後三郡」）・飯高郡・安濃郡・三重郡・朝明郡・員弁郡（北伊勢の員弁郡・三重郡・朝明郡の3郡は「道前三郡」）。","- 神郡の成立過程（Wikipedia「神郡」）：神郡成立時には度会郡・多気郡の2郡が神郡に定められた。弘仁8年（817年、旧暦）には改めて度会郡・多気郡が神宮に寄進されて国衙の影響を排し、さらに寛平年間（889年-898年）に飯野郡、天慶3年（940年）に員弁郡、応和2年（962年）に三重郡、天延元年（973年）頃※原文は「972年」に安濃郡、寛仁元年（1017年）に朝明郡、文治元年（1185年）に飯高郡が順次寄進された。","- 「ムラの戸籍簿」データベース「伊勢国」：弘仁8年（817年）に神郡の雑務が、同12年（821年）に田租検納の権限が神宮に付与され、従来の伊勢国司にかわり、伊勢太神宮司がその行政権を掌握するようになる、とされる。","- 中世以降の神郡（Wikipedia「神郡」）：「中世に入ってからはこれらの神郡に対する神宮の支配力が低下し、南北朝時代から室町時代頃には実質的支配は神三郡に限定されるようになり、さらにこれらの3郡でも伊勢北畠氏の台頭とともに神宮の支配は形骸化していった」。","- 神郡そのものの初見（Wikipedia「神郡」）：文献上での初見は、持統天皇6年（692年）。ただし『神宮雑例集』や『常陸国風土記』では大化5年（649年）での多気郡・度会郡・香島郡（鹿島郡）の建郡の記述があり、大化から天武天皇期（645年-686年）頃にかけて順次設置されたと推測される。『令集解』によると、養老7年（723年）11月16日時点で神郡として8郡が見え、「八神郡」と総称されている（伊勢の度会・多気のほか、安房国の安房郡、下総国の香取郡、常陸国の鹿島郡、出雲国の意宇郡、紀伊国の名草郡、筑前国の宗像郡）。","- 神戸・神田（『日本大百科全書（ニッポニカ）』「伊勢神宮」、コトバンク）：古代律令制下の伊勢神宮領として、神戸（かんべ）と神田（かみた）の2種があった。神戸は大和国、伊賀国、伊勢国、志摩国、尾張国、参河国、遠江国などに展開し、大同元年（806年）には1130戸が認められた。神田は神宮近辺に集中し、延喜年間（901～923年）に36町1段を数えた。"],"tables":[]},{"h":"内外宮の領の区分","lv":3,"text":["- 『日本大百科全書（ニッポニカ）』「御厨（荘園）」（コトバンク）：「鎌倉期の『神宮雑例集』は御厨、御園（野菜・果物類を貢進する）あわせて450余とし、内宮領200余、外宮領130余、二宮領110余とその内訳を記している」。すなわち神宮領は内宮（皇大神宮）領・外宮（豊受大神宮）領・二宮領（両宮に属する領）に区分されていた。","- なお、内宮の禰宜は荒木田一族、外宮の禰宜は度会一族が古くから就任していた（『日本大百科全書（ニッポニカ）』「伊勢神宮」、コトバンク）。"],"tables":[]},{"h":"御厨・神宮領の総数（出典ごとに併記）","lv":3,"text":["- 注記：450余所は「御厨・御園」に限った数、1380余ヵ所は「神宮領」全体の数とされ、対象の範囲が異なる数値である。どちらが最盛期の御厨の総数かは、出典の範囲では断定できない（未確認）。","- 平凡社『日本歴史地名大系』「伊勢国」（コトバンク）：「平安後期に荘園が急増する社会的傾向の中で，伊勢神宮領は神郡に加え御厨（みくりや），御薗（みその）が全国的規模で拡大し，神宮の権威を頼って所領を寄進する貴族・在地領主も数多く，13世紀初頭には神宮領は全国で1380余ヵ所にのぼった」「源頼朝をはじめ伊勢神宮に所領を寄進する者が多く，神宮は経済的最盛期を迎える」。","---"],"tables":[{"cols":["数値","対象と時点","出典","出典の種別"],"rows":[["450余所（内宮領200余・外宮領130余・二宮領110余）","伊勢神宮の御厨・御園。13世紀初めの『神宮雑例集』の記載","『日本大百科全書（ニッポニカ）』「御厨（荘園）」／『改訂新版 世界大百科事典』「御厨」（コトバンク）","その他（内容）"],["1380余ヵ所","伊勢神宮領全体。13世紀初頭","平凡社『日本歴史地名大系』「伊勢国」（コトバンク）","その他（内容）"],["約500か所","皇室・伊勢神宮・賀茂神社など有力神社の御厨全体。鎌倉時代","Wikipedia「御厨」","Wikipedia"],["数百ヵ所","伊勢神宮領の御厨。『神鳳抄』（『神凰抄』）にあげられる数","『山川 日本史小辞典 改訂新版』「御厨」／平凡社『ブリタニカ国際大百科事典 小項目事典』「御厨」（コトバンク）","その他（内容）"]]}]},{"h":"2. 御厨の一覧表","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- Wikipedia「御厨」 https://ja.wikipedia.org/wiki/御厨 （取得日：2026-11-18）","- Wikipedia「阿射賀御厨」 http://ja.wikipedia.org/wiki/阿射賀御厨 （取得日：2026-11-18）","- コトバンク「阿射賀御厨」（平凡社『日本歴史地名大系』） https://kotobank.jp/word/%E9%98%BF%E5%B0%84%E8%B3%80%E5%BE%A1%E5%8E%A8-3068469 （取得日：2026-11-18）","- Wikipedia「相馬御厨」 https://ja.wikipedia.org/wiki/相馬御厨 （取得日：2026-11-18）","- Wikipedia「大庭御厨」 https://ja.wikipedia.org/wiki/大庭御厨 （取得日：2026-11-18）","- Wikipedia「簗田御厨」 https://ja.wikipedia.org/wiki/%E7%B0%97%E7%94%B0%E5%BE%A1%E5%8E%A8 （取得日：2026-11-18）","- 「鎌田御厨 ── 伊勢神宮領だった村の名残」（磐田物語） https://iwata-monogatari.net/u002 （取得日：2026-11-18）","- コトバンク「御厨」（小学館『日本大百科全書（ニッポニカ）』「御厨（荘園）」「御厨（長崎県）」） https://kotobank.jp/word/%E5%BE%A1%E5%8E%A8-138397 （取得日：2026-11-18）"],"tables":[]},{"h":"表","lv":3,"text":[],"tables":[{"cols":["番号","御厨名","読み","所在地（旧国・現在の都道府県）","属する宮","成立時期","備考","出典の種別"],"rows":[["1","阿射賀御厨","あざかのみくりや","伊勢国一志郡。現在の三重県松阪市大阿坂町・小阿坂町付近","外宮","初出は康平3年（1060年、旧暦）","『大神宮諸雑事記』康平3年8月3日条に、一志郡司が阿射賀御厨の御厨司を兼任していたことがみえる。平安時代末期には大阿射賀御厨・小阿射賀御厨の大小2つに分離した","Wikipedia"],["2","相馬御厨","そうまみくりや","下総国相馬郡。現在の茨城県取手市・守谷市、千葉県柏市・流山市・我孫子市のあたり","伊勢神宮（供祭料は内宮の一の禰宜へ納められたと記事にある）","大治5年（1130年、旧暦）6月11日に千葉常重が相馬郡布施郷を寄進","寄進型荘園。寄進の内容は「地利の上分」（田1段につき1斗5升、畠1段につき5升）と「土産のもの」（雉100羽、塩曳き鮭100尺）を伊勢神宮に納めるものだった。相馬御厨をめぐる攻防が治承・寿永の乱の原動力の1つとなったとされる","Wikipedia"],["3","大庭御厨","おおばみくりや","相模国高座郡の南部。現在の神奈川県茅ヶ崎市、藤沢市","伊勢神宮","長治元年（1104年、旧暦）頃に鎌倉景正が開発。永久5年（1117年、旧暦）に伊勢神宮に寄進","寄進型荘園。鎌倉時代末期には13の郷が存在した相模国最大の御厨（伊勢神宮領）。永治元年（1141年）に官省符荘に昇格した","Wikipedia"],["4","簗田御厨","やなだのみくりや","下野国梁田郡。現在の栃木県足利市福富町付近","伊勢神宮二宮（皇大神宮・豊受大神宮）","康治2年（1143年、旧暦）に成立","梁田郡のほぼ全域に広がる荘園であったが、福富町の御厨神社付近がその中心であったとみられる。梁田御厨とも書く","Wikipedia"],["5","鎌田御厨","かまだのみくりや","遠江国。現在の静岡県磐田市御厨地区（鎌田・新貝・稗原・東貝塚）","伊勢神宮","未確認（成立の正確な年代や寄進の経緯は史料的に未確定とされる）","伊勢神宮の遠江神領。磐田市の「御厨（みくりや）」という地名は、この鎌田御厨に由来すると考えられている。鎌田には伊勢の神を祀る鎌田神明宮がある","その他（内容）"],["6","榛谷御厨","未確認","武蔵国。現在の横浜市保土ヶ谷一帯とされる","伊勢神宮","1112年に小山田有重が伊勢神宮に寄進したと伝える資料があるが、確認した出典は個人サイトであり未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される","Wikipedia"],["7","東条御厨","未確認","安房国（現在の千葉県）","未確認","未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される。詳細は未確認","Wikipedia"],["8","丸御厨","未確認","安房国（現在の千葉県）","未確認","未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される。詳細は未確認","Wikipedia"],["9","夏見御厨","未確認","下総国（現在の千葉県・茨城県）","未確認","未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される。詳細は未確認","Wikipedia"],["10","葛西御厨","未確認","下総国（現在の千葉県・東京都）","未確認","未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される。詳細は未確認","Wikipedia"],["11","筑摩御厨","未確認（つかま／ちくまの両表記が辞典にみえる）","近江国（現在の滋賀県）","皇室（天皇家）の御厨とされる。伊勢神宮領かどうかは未確認","天智天皇時代に建立されたという伝承をもつものがある（『改訂新版 世界大百科事典』）","『日本大百科全書（ニッポニカ）』「御厨（荘園）」では皇室にかかわる御厨の例としてあげられる。伊勢神宮の御厨とは区別する必要がある","Wikipedia"],["12","中河御厨","未確認","美濃国（現在の岐阜県）","未確認","未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される。詳細は未確認","Wikipedia"],["13","矢原御厨","未確認","信濃国（現在の長野県）","未確認","未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される。詳細は未確認","Wikipedia"],["14","布施御厨","未確認","信濃国（現在の長野県）","未確認","未確認","Wikipedia「御厨」の「主な御厨」に名称のみ掲載される。詳細は未確認","Wikipedia"],["15","島抜御厨","しまぬき","伊勢国。現在の三重県津市","未確認","未確認","『日本大百科全書（ニッポニカ）』「御厨（荘園）」に「贄を出す土地」の例としてあげられる","その他（内容）"],["16","衣比原御厨","えびはら","伊勢国。現在の三重県四日市市","未確認","未確認","『日本大百科全書（ニッポニカ）』「御厨（荘園）」に「贄を出す土地」の例としてあげられる","その他（内容）"],["17","宇野御厨","うの","肥前国。現在の長崎県松浦市付近","伊勢神宮","平安時代末期","『日本大百科全書（ニッポニカ）』「御厨（長崎県）」：「平安末期この地には、伊勢神宮領といわれる宇野御厨が置かれたが、その贄人であった松浦一族らの開発によって荘園化し」た","その他（内容）"],["18","久永御厨","くえいのみくりや","美作国か（岡山県久米郡と推定される）","未確認（外宮との関係がうかがえる記述があるが未確認）","建久3年（1192年、旧暦）の第27回外宮遷宮の年に鉄2000鋌が納入されたと記される（『長講堂領所領目録』ほか）","出典は個人の研究メモ的な資料であり、所在地・所属は推定として扱う","その他（内容）"]]}]},{"h":"注記","lv":3,"text":["- 本表は出典で個別に確認できた18件のみであり、『神宮雑例集』に記される450余所を網羅していない。御厨の完全な一覧は、今回確認した出典の範囲では得られなかった（未確認）。","- 供物の種類による区分について：御厨は本来、神饌（贄）を納める所領であり、塩・魚介などの海産物を納める土地も御厨・御園に含まれた（第1節の定義参照）。ただし「御贄御厨」「塩御厨」といった固有の名称をもつ御厨の一覧は、今回確認した出典の範囲では確認できなかった（未確認）。なお『延喜式』には、皇室への贄について「諸国貢進御贄」「諸国貢進御厨御贄」の項目がある（Wikipedia「御食国」）。","- 尾張国にも御厨・御園が多数存在したことが学術研究で扱われている（鈴木「尾張国御厨御園考―中世伊勢神宮領の分析―」『皇學館大学』紀要）が、個別の御厨名の読み取りが判読資料の状態から確定できなかったため、本表には収録していない。","---"],"tables":[]},{"h":"3. 江戸時代の神宮領","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- 三重県「近世に古来の流れ継承―文書から見る伊勢神宮領」（三重県環境生活部文化振興課） https://www.bunka.pref.mie.lg.jp/rekishi/kenshi/asp/hakken2/detail328.html （取得日：2026-11-18）","- Wikipedia「山田奉行」 https://ja.wikipedia.org/wiki/山田奉行 （取得日：2026-11-18）","- 茂木陽一「近世神宮領における捨子と行き倒れ」（三重大学『人文論叢』） https://mietan.repo.nii.ac.jp/record/431/files/%E8%8C%82%E6%9C%88%E9%99%BD%E4%B8%80%E5%85%88%E7%94%9F.pdf （取得日：2026-11-18）","- コトバンク「度会県」（平凡社『世界大百科事典』「度会県」） https://kotobank.jp/word/%E5%BA%A6%E4%BC%9A%E7%9C%8C-1442448 （取得日：2026-11-18）","- Wikipedia「府藩県三治制」（Weblio転載で確認） https://www.weblio.jp/content/%E5%BA%9C%E8%97%A9%E7%9C%8C （取得日：2026-11-18）","- Wikipedia「寺社領」 http://ja.wikipedia.org/wiki/寺社領 （取得日：2026-11-18）"],"tables":[]},{"h":"範囲","lv":3,"text":["- 茂木陽一「近世神宮領における捨子と行き倒れ」：「伊勢神宮領は、宮川以東と表現される様に度会郡の東半分ほど、現在の伊勢市域にほぼ重なる範囲であり、他に多気郡内の現明和町内の斎宮地区を含んでいる」「伊勢神宮領はさらに外宮領と内宮領に分かれ、内宮領は6つの郷から成り立っており、これを宇治六郷と称している」。","- 三重県「近世に古来の流れ継承―文書から見る伊勢神宮領」：神宮領のうち宮川より内側の四郷地区や山田・宇治・大湊地区においては、豊臣政権による1594年（文禄3年）の検地（文禄検地・太閤検地）が実施されなかったために、中世期の様式の表記（小字と四至による土地の特定）が江戸時代になってもそのまま継続した。一方、二見地域（荘・三津村など、もと鳥羽藩領で文禄検地の実施後に神宮領となった地域）では石高表示に基づく表記となっている。"],"tables":[]},{"h":"石高について","lv":3,"text":["- 上記のとおり、神宮領の中核部では検地が実施されず、石高による土地の表示が行われなかったため、江戸時代の神宮領全体の石高の総計は、今回確認した出典の範囲では明示されなかった（未確認）。","- 参考：Wikipedia「寺社領」に、国立歴史民俗博物館の『旧高旧領取調帳データベース』に基づく幕末期の寺社領の村数が郡ごとにあげられている。伊勢国では多気郡のうち5村、度会郡のうち13村などとされるが、これは伊勢国内の寺社領全体の数であり、伊勢神宮領だけの数ではない。"],"tables":[]},{"h":"支配機構","lv":3,"text":["- 山田奉行（Wikipedia「山田奉行」）：「山田奉行（やまだぶぎょう、江戸期の読みは『ようだぶぎょう』）は、江戸幕府の役職の一つ。伊勢神宮の守護・造営修理と祭礼、遷宮、門前町の支配、伊勢・志摩における訴訟、鳥羽港の警備・船舶点検などを担当した」「遠国奉行の1つで老中支配。定員は1、2名、元禄9年（1696年）には2名となり、江戸と現地で交代勤務となる。役高は1000石で、役料1500俵を支給された。配下は与力6騎・同心70人・水主40人」。","- 山田奉行の設置（Wikipedia「山田奉行」）：「慶長8年（1603年）、幕府は伊勢大神宮神領地に『山田奉行所』を置いた」。一説によると、山田奉行はかつて豊臣秀吉が設けたもので、それを江戸幕府が引き継いで、慶長5年（1600年）に設置された、といわれている。当初、奉行所は伊勢国山田（現在の三重県伊勢市）に置かれ、1635年（寛永12年）に伊勢国度会郡小林（現・伊勢市御薗町小林）に移転した。","- 三重県「近世に古来の流れ継承―文書から見る伊勢神宮領」：「江戸時代に神宮領が山田奉行支配の幕府領となったことで、1643（寛永20）年には『宗門改』が実施されている」。","- 自治機構（茂木陽一「近世神宮領における捨子と行き倒れ」）：内宮領では上二郷の年寄によって宇治会合（内宮会合）という自治機関が組織され、内宮領の自治的行政機関になっていた。外宮領は三方会合によって自治的に運営されていた。山田奉行は「祭祀執行機関としての伊勢神宮の保護と監督のために置かれており、他の遠国奉行の様な行政機関ではないが、神宮領内のトラブルに関して内宮会合で解決できない様なものに対する裁許を行っており、実質的には宇治会合の上位機関の役割を果たしている」。","- 「宇治奉行」について：今回確認した出典の範囲では、宇治に奉行が置かれたという記述は確認できなかった。宇治（内宮領）の行政は上記の宇治会合が担ったとされる（未確認：宇治奉行という役職の存否そのものは、出典の範囲では確認できなかった）。"],"tables":[]},{"h":"明治に入ってからの神宮領の扱い","lv":3,"text":["- 平凡社『世界大百科事典』「度会県」（コトバンク）：「1868年（明治1）旧天領，神宮領を管轄する度会（わたらい）府が置かれ，翌年度会県と改称された」。","- 度会府の設置と改称の日付（Wikipedia「府藩県三治制」）：度会府は1868年8月23日（慶応4年7月6日）に設置され、1869年8月24日（明治2年7月17日）に度会県に改称された。","- 寺社領の上知（Wikipedia「府藩県三治制」）：1871年2月23日（明治4年1月5日）に寺社領の上知が決定され、府・藩・県のいずれかに所属することが定められた。これにより全国の寺社領が消滅した。また、1868年7月13日（慶応4年5月24日）の旗本采地の府県管轄指令により、旗本領と寺社領が最寄の府県の管轄となることが定められていた（ただし全国一斉に管轄となったわけではなかった）。","- 上知令（Wikipedia「寺社領」）：「明治政府の地租改正に伴う1871年（明治4年）と1875年（明治8年）の上知令により境内以外の土地が没収された」。","---"],"tables":[]},{"h":"4. その他の特別な所領（参考）","lv":2,"text":[],"tables":[]},{"h":"出典","lv":3,"text":["- Wikipedia「神郡」 https://ja.wikipedia.org/wiki/神郡 （取得日：2026-11-18）","- コトバンク「熱田神宮」（平凡社『改訂新版 世界大百科事典』「熱田神宮」、小学館『日本大百科全書（ニッポニカ）』「熱田神宮」） https://kotobank.jp/word/%E7%86%B1%E7%94%B0%E7%A5%9E%E5%AE%AE-26002 （取得日：2026-11-18）","- コトバンク「日光東照宮」（平凡社『改訂新版 世界大百科事典』「日光東照宮」） https://kotobank.jp/word/%E6%97%A5%E5%85%89%E6%9D%B1%E7%85%A7%E5%AE%AE-109821 （取得日：2026-11-18）"],"tables":[]},{"h":"鹿島神宮・香取神宮などの神郡","lv":3,"text":["- 養老7年（723年）時点で「八神郡」と総称された郡には、伊勢神宮の度会郡・多気郡のほか、常陸国鹿島郡（鹿島神宮）、下総国香取郡（香取神宮）、安房国安房郡（安房神社）、出雲国意宇郡（出雲大社）、紀伊国名草郡（日前神宮・國懸神宮）、筑前国宗像郡（宗像大社）が含まれる（Wikipedia「神郡」、第1節参照）。","- 『日本大百科全書（ニッポニカ）』「神郡」（コトバンク）：これらの神郡は「律令制の崩壊とともに消失した」とされる。"],"tables":[]},{"h":"熱田神宮の神領","lv":3,"text":["- 平凡社『改訂新版 世界大百科事典』「熱田神宮」（コトバンク）：「中世において，神領は増加し，おもな年次だけでも，1238年（暦仁1），75年（建治1），1337年（延元2・建武4），54年（正平9・文和3）と，その増加が記録され，すでに正安（1299-1302）ごろに，係争のある社領だけでも2644町に達している。神領は尾張国一円におよび，美濃羽島郡にも達している」「神領は，秀吉のため一時没収され，江戸幕府によって御朱印地700余石が寄進された」。","- 『日本大百科全書（ニッポニカ）』「熱田神宮」（コトバンク）：江戸時代には「徳川氏は御供料405石、大宮司料717石を寄せた」とされる。"],"tables":[]},{"h":"日光東照宮の所領","lv":3,"text":["- 平凡社『改訂新版 世界大百科事典』「日光東照宮」（コトバンク）：「日光山領は豊臣秀吉により門前，屋敷，足尾村以外を没収されたが，秀忠は20年（1620年）日光山領に1400石を加増，東照社領5000石を寄進した。日光山に家光の大猷院廟が建立されると，52年（承応1）堂領3630石余が寄進され，55年（明暦1）東照宮領は1万石とされた。この本高1万3630石余に93年（元禄6）の検地打出高，1700年の足知（たしち）が加わり2万5000石余となったが，92年（寛政4）新御領上知により2万0900石余となった」。","- 同項：「神領支配は目代（もくだい）山口氏が，日光守護は梶定良が担当したが，定良没後幕府は1700年日光奉行を新置し，91年（元禄4年か、1691年）山口氏は処罰され，日光奉行の権限は強化された」（原文の年次表記「91年」は元禄4年（1691年）と解されるが、原文のまま転記し、解釈は断定しない）。","---"],"tables":[]},{"h":"取得不可だったページ・確認できなかった出典","lv":2,"text":["- 神宮司庁・伊勢神宮の公式サイト（isejingu.or.jp）について：御厨・神宮領の制度を解説する公式ページは、今回の検索の範囲では確認できなかった。そのため本ファイルでは、神宮関係の古典籍（『古事類苑』神宮司庁編、『神宮雑例集』など）を引く辞典類・学術資料を出典とした。","- 皇學館大学の紀要論文（鈴木「尾張国御厨御園考」ほか、kogakkan.repo.nii.ac.jp）：PDFのテキストが判読困難な状態で取得され、尾張国の御厨・御園の個別名を正確に転記できなかったため、本ファイルでは個別名を収録していない。"],"tables":[]},{"h":"3分類","lv":2,"text":[],"tables":[]},{"h":"公的で照合できたもの","lv":3,"text":["- 江戸時代の神宮領で検地が実施されなかったこと、中世様式の土地表記が江戸時代も継続したこと、1643年（寛永20年）に宗門改が実施されたこと（三重県「近世に古来の流れ継承―文書から見る伊勢神宮領」、種別：自治体）。"],"tables":[]},{"h":"Wikipediaだけのもの","lv":3,"text":["- 御厨の定義の一部、神郡の成立過程（度会郡・多気郡から神八郡への拡大の年次）、神八郡・神三郡の構成。","- 相馬御厨・大庭御厨・簗田御厨・阿射賀御厨の所在地・成立時期の詳細。","- 山田奉行の職掌・定員・役高、慶長8年（1603年）の奉行所設置と1635年（寛永12年）の移転。","- 度会府の設置日（1868年8月23日（慶応4年7月6日））と度会県への改称日（1869年8月24日（明治2年7月17日））、寺社領の上知の決定日（1871年2月23日（明治4年1月5日））。","- 幕末期の寺社領の村数（『旧高旧領取調帳データベース』に基づく伊勢国の郡ごとの数。ただし伊勢神宮領だけの数ではない）。"],"tables":[]},{"h":"未確認のもの","lv":3,"text":["- 御厨の総数について、450余所（御厨・御園のみ、『神宮雑例集』）と1380余ヵ所（神宮領全体、『日本歴史地名大系』）のどちらの範囲をもって「最盛期の御厨の総数」とするか。","- 御厨の完全な一覧（本表は18件のみ）。","- 「御贄御厨」「塩御厨」といった供物の種類による固有名をもつ御厨の一覧。","- 江戸時代の神宮領全体の石高の総計（神宮領の中核部では検地が行われず石高表示がなかったため、出典に総計の明示なし）。","- 「宇治奉行」という役職の存否。","- 第2節の表で「未確認」とした各御厨の読み・所在地の詳細・属する宮・成立時期。","- 鎌田御厨の成立年代、久永御厨の所在地と所属。"],"tables":[]}]},{"id":"senko","t":"廃藩置県より前に廃藩した14藩","g":"国と藩","file":"","meta":["- 山川『日本史小辞典』「廃藩置県」の「71年6月までに14藩」の内訳。内訳を直接並べた辞典は見つからず、Wikipedia「府藩県三治制」の一覧との符合で特定した（推定）。","- 日付は新暦（旧暦）の順。月は旧暦の明治2年12月〜明治4年6月。","- 第10便で集めたデータをそのまま載せている。補正便（第11便）はまだ届いていないため、確認中の項目が残っている（末尾の「注記」を見る）。"],"secs":[{"h":"廃藩の日の古い順（14藩）","lv":2,"text":[],"tables":[{"cols":["番号","藩名","読み","旧国","廃藩の日（新暦（旧暦））","経緯","出典・種別"],"rows":[["1","吉井藩","よしいはん","上野国","1870年1月27日（明治2年12月26日）※藩の記事は12月25日（1870年1月26日）とする（食い違い）","知藩事・松平信謹が辞職し廃藩。領地は岩鼻県へ編入（願い出による廃藩）","Wikipedia「府藩県三治制」「吉井藩」"],["2","狭山藩","さやまはん","河内国","1870年1月27日（明治2年12月26日）※堺県への編入の日。辞任の日は12月27日（1870年1月28日）とする記述もあり（食い違い）","藩知事・北条氏恭が辞任し、堺県へ編入。理由は軍事費の増大と藩債（財政難）","Wikipedia「狭山藩」「北条氏恭」、大阪狭山市公式サイト（自治体）"],["3","盛岡藩","もりおかはん","陸中国","1870年8月6日（明治3年7月10日）","戊辰戦争の処分による減封・上納金の支払い不能と凶作で財政が破綻し、藩知事・南部利恭の廃藩と辞任の願い出が許可され、盛岡県（第2次）が設置された","Wikipedia「盛岡藩」「府藩県三治制」"],["4","喜連川藩","きつれがわはん","下野国","1870年8月13日（明治3年7月17日）","藩政を返上して消滅。領地は日光県へ編入","Wikipedia「喜連川藩」「府藩県三治制」"],["5","鞠山藩","まりやまはん（旧・敦賀藩）","越前国","1870年10月11日（明治3年9月17日）","小浜藩の支藩。本藩・小浜藩へ併合された。併合が藩側の願い出によるものかは未確認。合併後、小浜藩知事は旧鞠山藩知事・酒井忠経が務めた","Wikipedia「敦賀藩」「府藩県三治制」"],["6","長岡藩","ながおかはん","越後国","1870年11月15日（明治3年10月22日）","藩知事・牧野忠毅が財政窮乏などの理由で城知を返上し廃藩。領地は柏崎県へ編入","Wikipedia「越後長岡藩」、新潟県公式『新潟県統計要覧』第1章「藩・県の変遷」図（自治体）、長岡市公式（自治体）"],["7","福本藩","ふくもとはん","播磨国","1871年1月13日（明治3年11月23日）","鳥取藩の支藩的立場。藩財政の困窮のため鳥取藩へ併合され廃藩","Wikipedia「福本藩」「府藩県三治制」"],["8","高須藩","たかすはん","美濃国","1871年2月12日（明治3年12月23日）","尾張（名古屋）藩の支藩（御連枝）。本藩・名古屋藩へ併合され廃藩。願い出の明記は未確認","Wikipedia「高須藩」"],["9","多度津藩","たどつはん","讃岐国","1871年3月25日（明治4年2月5日）","丸亀藩の支藩。「解藩建白書」を提出し廃藩。領地は倉敷県へ編入","Wikipedia「府藩県三治制」「讃岐国」、幕末歴史ガイド（その他）"],["10","丸亀藩","まるがめはん","讃岐国","1871年5月28日（明治4年4月10日）","藩知事・京極朗徹が諸藩に先駆けて廃藩を願い出て廃藩となり、丸亀県が置かれた","Wikipedia「京極朗徹」「府藩県三治制」、香川県立図書館『香川県近代教育史年表』（自治体）"],["11","竜岡藩","たつおかはん（旧・田野口藩）","信濃国","1871年7月19日（明治4年6月2日）","藩財政の破綻のため、藩知事・大給恒（松平乗謨）が廃藩を申し出て廃藩。領地は中野県・伊那県へ分割編入","Wikipedia「大給恒」「佐久郡」「府藩県三治制」"],["12","徳山藩","とくやまはん","周防国","1871年8月5日（明治4年6月19日）","長州（山口）藩の支藩。藩知事・毛利元蕃が明治4年5月に辞任し、所領を本家・山口藩へ返還。廃藩・編入の日は6月19日とされる","Wikipedia「徳山藩」「周防国」、小学館『日本大百科全書（ニッポニカ）』・平凡社『改訂新版 世界大百科事典』（いずれも1871年6月の合併とする）"],["13","大溝藩","おおみぞはん","近江国","1871年8月9日（明治4年6月23日）","藩財政が極度に悪化し、廃藩願いを出して受理され廃藩。領地は大津県へ編入","Wikipedia「大溝藩」"],["14","津和野藩","つわのはん","石見国","1871年8月11日（明治4年6月25日）","藩知事・亀井茲監が廃藩建議書を提出し、同時に藩知事を辞職。領地は浜田県へ編入。財政難ではなく藩主の建議による","Wikipedia「津和野藩」「石見国」"]]}]},{"h":"14藩に含まれない先行廃藩・本藩への編入（参考）","lv":2,"text":["いずれも1871年8月29日時点では存在せず、藩一覧の対象外である点は14藩と同じだが、山川のいう14藩には数えられない。Wikipedia「府藩県三治制」では「任知藩事前に廃止された藩」に分類される（知藩事に任命されないまま廃止・本藩へ編入された藩）。","- 会津藩（岩代）：1868年、戊辰戦争により滅亡（改易）。","- 請西藩（上総）：1869年1月（明治元年12月）に領地を没収され廃藩。","- 一橋藩（武蔵・江戸）：田安藩と同様、知藩事に任命されず廃藩を命じられた。1870年1月27日（明治2年12月26日）廃藩。","- 田安藩（武蔵・江戸）：上記「4件の判定」参照。","- 米沢新田藩（羽前）：上記「4件の判定」参照。","- 広島新田藩（安芸）：1870年1月27日（明治2年12月26日）に広島藩へ編入。","- 土佐新田藩（高知新田藩、土佐）：1870年9月20日（明治3年8月25日）に高知藩へ編入。","- 高瀬藩（肥後）：1870年9月26日（明治3年9月2日）に熊本藩へ編入。","- 宇土藩（肥後）：1870年に熊本藩へ編入。","- 平戸新田藩（肥前）：1870年に平戸藩へ併合。","- 鹿奴藩（因幡、鳥取藩支藩）：鳥取藩への編入は1870年11月26日（明治3年閏10月4日）とされる（Wikipedia「府藩県三治制」）。一方、Wikipedia「鹿奴藩」は明治2年（1869年）にみずから廃藩し鳥取藩に吸収されたとする（食い違い）。","- 若桜藩（因幡、鳥取藩支藩）：1869年に鳥取藩へ編入（新政府が藩として公認しなかった）。","- 富江藩（肥前、福江藩支藩）：1868年に領地を没収され福江藩に併合。"],"tables":[]},{"h":"14藩の特定と、判定した4件の結論","lv":2,"text":[],"tables":[]},{"h":"1. 14藩の確定度合い","lv":3,"text":["- 14藩のすべてについて、1871年8月29日より前に廃藩となった事実と、その日付を出典付きで確認できた（下表）。","- 内訳の特定は、次の符合による。山川出版社『日本史小辞典 改訂新版』「廃藩置県」（コトバンクで本文を確認）は「財政悪化などのために自発的に廃藩を願い出る藩が出始め，69年12月の吉井・狭山両藩を皮切りに，71年6月までに14藩に及んだ」と記す。Wikipedia「府藩県三治制」の「任知藩事後に廃止された藩」の一覧は、ちょうど14藩からなり、期間（明治2年12月〜明治4年6月）・起点の藩（吉井・狭山）・末尾（津和野、明治4年6月25日）が山川の記述と一致する。この14藩を山川のいう14藩と特定した。","- ただし、14藩の内訳を直接列挙した辞典・公的資料そのものは確認できていない（未確認。下記「出典の3分類」参照）。","- 山川は「自発的に廃藩を願い出た」と総括するが、内訳には支藩が本藩へ併合されたもの（鞠山・高須・福本・徳山）も含まれる。幕末歴史ガイド（その他）は、願い出による廃藩9藩（吉井・狭山・盛岡・長岡・多度津・丸亀・竜岡・大溝・津和野）と支藩の本藩への併合7藩（広島新田・米沢新田・鞠山・高須・若桜・福本・徳山）を分けて挙げ、総数は資料により14藩・13藩・10以上と異なるとする。"],"tables":[]},{"h":"2. 手元の12藩の照合結果","lv":3,"text":["- 14藩に含まれる（11藩）：吉井・狭山・盛岡・喜連川・高須・多度津・丸亀・大溝・竜岡・津和野・徳山。","- 14藩に含まれない（1藩）：土佐新田。1870年9月20日（明治3年8月25日）に本藩・高知藩へ編入されたが、Wikipedia「府藩県三治制」では「任知藩事前に廃止された藩」に分類され、知藩事任命を経た廃藩の数には数えられない。","- 14藩のうち、手元の12藩に含まれていなかったのは長岡・福本・鞠山の3藩である。"],"tables":[]},{"h":"3. 4件の判定","lv":3,"text":["- 鞠山藩：14藩に含まれる。ただし小浜藩への併合の日は1870年10月11日（明治3年9月17日）である。1869年8月1日（明治2年6月24日）は版籍奉還（知藩事任命）の日であり、合併の日ではない。藩名の変遷は、敦賀藩→1870年4月23日（明治3年3月23日）に鞠山藩へ改称→同年10月11日（明治3年9月17日）に小浜藩へ編入。","- 田安藩：14藩に含まれない。版籍奉還に際し、藩主・徳川慶頼は知藩事に任命されず、廃藩を命じられた（政府の措置）ため、「自発的に廃藩を願い出た」藩ではない。Wikipedia「府藩県三治制」でも「任知藩事前に廃止された藩」に分類される。廃藩の確定日は未確認（明治2年12月（新暦1870年1月）に版籍奉還が認められて廃藩とする記述と、明治3年4月27日（新暦1870年5月）に廃藩とする記述があり、食い違い）。1871年8月29日時点で存在しないことは確実であり、藩一覧の対象外とする扱いは正しい。","- 米沢新田藩：14藩に含まれない。理由は2つある。(1) 本藩・米沢藩への併合が明治2年7月とも同年8月19日（1869年9月24日）ともされ（食い違い）、いずれも山川の期間の始期（明治2年12月）より前である。(2) 藩主・上杉勝道は知藩事に任命されないまま本藩へ併合された支藩であり、Wikipedia「府藩県三治制」では「任知藩事前に廃止された藩」に分類される。","- 長岡藩：14藩に含まれる（次の4を参照）。"],"tables":[]},{"h":"4. 長岡藩の結論","lv":3,"text":["- 長岡藩は、藩知事・牧野忠毅が財政窮乏などの理由で城知を返上し、1870年11月15日（明治3年10月22日）に廃藩となり、領地は柏崎県に編入された（Wikipedia「越後長岡藩」）。","- この1870年廃藩は公的・自治体資料でも裏付けられる。新潟県公式『新潟県統計要覧』第1章「藩・県の変遷」図（資料：県地方課『新潟縣市町村合併誌』）は長岡藩の終期を「（3.10.22）」＝明治3年10月22日とし、長岡市公式の刊行物案内（長岡市立中央図書館文書資料室）は『長岡市史 資料編3 近世二』の収録範囲を「明治3年長岡藩廃藩まで」と説明する。","- したがって、1871年8月29日時点で長岡藩は存在せず、越後国で廃藩置県を迎えた藩は10藩（村上・三日市・黒川・新発田・村松・峰岡・与板・椎谷・高田・清崎）である。「1871年に越後11藩」という数え方に合う出典は未確認（長岡藩を含めて数えたものとみられるが、それは1871年時点の数ではない）。","- なお廃藩年には辞典間で食い違いがある。小学館『日本大百科全書（ニッポニカ）』と講談社『藩名・旧国名がわかる事典』は1871年廃藩とし、平凡社『改訂新版 世界大百科事典』と『百科事典マイペディア』は1870年廃藩とする。日付の確定した公的出典・記事出典は1870年側と一致する。"],"tables":[]},{"h":"注記・出典の3分類と未確認","lv":2,"text":[],"tables":[]},{"h":"公的・自治体資料で照合できたもの","lv":3,"text":["- 長岡藩の廃藩の日（1870年11月15日（明治3年10月22日））：新潟県公式『新潟県統計要覧』第1章「藩・県の変遷」図（資料：県地方課『新潟縣市町村合併誌』）が長岡藩の終期を「（3.10.22）」とし、長岡市公式の刊行物案内（長岡市立中央図書館文書資料室）が『長岡市史 資料編3 近世二』の収録範囲を「明治3年長岡藩廃藩まで」と説明する。種別：自治体。","- 丸亀藩の廃藩の日（1871年5月28日（明治4年4月10日））：香川県立図書館『香川県近代教育史年表』が「4・10 丸亀藩を廃し丸亀県を置く」と記す。種別：自治体。","- 狭山藩の辞任と堺県への編入：大阪狭山市公式サイト「大阪狭山の歴史」。種別：自治体。"],"tables":[]},{"h":"Wikipedia・辞典だけのもの","lv":3,"text":["- 14藩の特定そのもの：山川出版社『日本史小辞典 改訂新版』「廃藩置県」の記述（数・期間・起点）とWikipedia「府藩県三治制」の「任知藩事後に廃止された藩」の一覧の符合による。","- 上記3藩を除く11藩の廃藩の日と経緯：各藩のWikipedia記事およびWikipedia「府藩県三治制」による。","- 徳山藩の1871年（明治4年）6月の山口藩への合併：小学館『日本大百科全書（ニッポニカ）』、平凡社『改訂新版 世界大百科事典』、講談社『藩名・旧国名がわかる事典』（コトバンク）でも確認できる。","- 米沢新田藩の1869年の米沢藩への併合：小学館『日本大百科全書（ニッポニカ）』、山川出版社『日本史小辞典 改訂新版』「米沢藩」（コトバンク）でも確認できる。","- 田安藩・一橋藩が知藩事に任命されず廃藩を命じられたこと：Wikipedia「版籍奉還」「徳川慶頼」「田安徳川家」による。"],"tables":[]},{"h":"未確認のもの","lv":3,"text":["- 山川のいう14藩の内訳を直接列挙した辞典・公的資料（内訳の特定はWikipedia「府藩県三治制」の一覧との符合による推定一致である）。","- 吉井藩の廃藩の日（明治2年12月25日か26日か）。","- 狭山藩の廃藩の確定した日（明治2年12月26日か27日か）。","- 田安藩の廃藩の確定した日（明治2年12月に承認とする記述と明治3年4月27日とする記述の食い違い）。","- 米沢新田藩の併合の月日（明治2年7月か8月19日か）。","- 鞠山藩・高須藩について、併合が藩側の願い出によるものだったか。","- 「1871年に越後11藩」とする出典。","- 吉川弘文館『国史大辞典』「廃藩置県」の本文：ジャパンナレッジ（有料会員制・セレクトコンテンツ）と国立国会図書館デジタルコレクション（館内限定公開）のいずれでも本文を取得できず、取得不可である。"],"tables":[]}]},{"id":"rikugun","t":"歴代陸軍大臣","g":"官制","file":"","meta":["- 対象：内閣制度の発足（1885年12月22日）から廃止（1945年12月1日）までの陸軍大臣。再任は別の行にし、備考に「再任」と書く。","- 出典：Wikipedia英語版「Army Ministry」の歴代大臣の表（Wikipedia）。公的資料との照合は未実施（未確認）。","- 日付はすべて新暦（1885年以降は旧暦の問題なし）。","- 読み：出典に無い。レキオタ側の補記で、未確認。","- 取得日：2026-11-18。"],"secs":[{"h":"歴代陸軍大臣（33代）","lv":2,"text":[],"tables":[{"cols":["番号","氏名","読み","在任期間","内閣（出典の表）","備考","出典の種別"],"rows":[["1","大山
