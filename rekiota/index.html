株式会社今西清兵衛商店","いまにしせいべいしょうてん","創業1884年（明治17年）（法人化1956年（昭和31年））","奈良県奈良市福智院町24-1","清酒の製造・販売。日本酒「春鹿」の醸造元。日本酒のほか、みりん、リキュール、奈良漬けなどの製造・販売も行う","沿革：1884年（明治17年）に清酒、みりん、あられ酒（飲用みりん）の製造を開始。1956年（昭和31年）に法人化し株式会社今西清兵衛商店とする（記事の記載で、出典は同社公式「会社概要」）","Wikipedia／公的"],["7","株式会社奈良ホテル","ならホテル","創業1909年（明治42年）10月17日（株式会社奈良ホテルは1983年1月31日に設立）","奈良県奈良市高畑町1096","ホテル業","奈良県の令和6年度「奈良県100年企業顕彰」の対象企業で、県資料は「創業：1909年10月17日」「業種：ホテル業」「住所：奈良県奈良市高畑町1096」とする。公式の沿革では、1909年10月17日に奈良ホテルが開業し、当初は大日本ホテル株式会社が運営した。1983年1月31日に株式会社奈良ホテルが設立された","自治体／その他（企業公式）"],["8","株式会社中谷本舗（屋号「ゐざさ」）","―（公式プレスリリースに読みの明記なし）","創業1921年（大正10年）（設立1986年7月）","奈良県吉野郡上北山村河合353番地","名産寿司の製造・販売。奈良名産の「柿の葉寿司」など名産寿司の製造・販売を「ゐざさ」の屋号で手がける","同社プレスリリースは「1921年（大正10年）、奈良県吉野郡上北山村で創業。2021年に、創業100年を迎えました」と記す。当初は「中谷商店」の名前で米屋として営業していた","その他（企業公式）"]]}]},{"h":"h-2 現代を代表する企業","lv":2,"text":["確認できたのは3社である。奈良県内に本店・本社を置く上場企業等は限られ、本表は公式の会社概要等で本社所在地を確認できた範囲である。"],"tables":[{"cols":["番号","企業名","読み","創業年（設立年）","本社所在地","業種・事業内容","備考","出典の種別"],"rows":[["1","株式会社南都銀行","なんとぎんこう","設立1934年（昭和9年）6月1日","本店所在地 奈良市大宮町四丁目297番地の2","銀行業。当行グループとしてリース・信託・証券・コンサルティングなどの総合金融サービスを展開（同行統合報告書の記載）","同行プロフィール（2026年3月31日現在）は「創立：1934年6月1日」「本店所在地：奈良市大宮町四丁目297番地の2」とする。前身は株式会社六十八銀行・株式会社吉野銀行・株式会社八木銀行・株式会社御所銀行で、1934年6月1日に合併し株式会社南都銀行が設立された。本店は2025年2月に奈良市橋本町16番地から現在地に移転した（Wikipedia）","その他（企業公式）／Wikipedia"],["2","奈良交通株式会社","ならこうつう","設立1929年1月20日（前身の奈良自動車（株）設立。1943年7月23日に奈良交通（株）に商号変更）","奈良市大宮町1丁目1番25号","自動車運送事業等（乗合事業・貸切事業・旅行事業・乗用事業）および生活創造事業（不動産・駐車場、駐輪場・飲食・自動車教習所など）","公式「企業概要」（数字は2026年3月31日現在）は、乗合バス636両、運行路線数181路線、輸送人員1日当り約13.4万人とする。「奈良県全域および京都府南部などで路線バスを運行」すると記す","その他（企業公式）"],["3","DMG森精機株式会社","ディーエムジーもりせいき","設立1948年（昭和23年）10月26日","第二本社：奈良県奈良市三条本町2番1号（奈良商品開発センタ）。グローバル本社：東京都江東区潮見2-3-23（東京グローバルヘッドクォータ）。本店所在地：奈良県奈良市三条本町2-1","工作機械（マシニングセンタ、数値制御装置付旋盤及びその他の製品）の製造・販売","同社の2022年3月22日付プレスリリースは「2022年7月1日に愛知県名古屋市から奈良県奈良市へ本社を移転いたします」「東京グローバルヘッドクォータとともに、奈良県奈良市および東京都江東区潮見の両拠点を本社とする二本社制を導入します」「当社は1948年に奈良県大和郡山市で創業し」と記す。本社が奈良県内だけにある企業ではないため、二本社制であることを明記して収録する","その他（企業公式）／Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 中谷本舗の創業年：候補として挙がっていた1912年ではなく、同社の公式プレスリリースでは1921年（大正10年）創業とされる。本表は1921年を採用した。","- 菊一文珠四郎包永の「設立」表記：同社公式「会社概要」は「設立 明治3年」とする一方、同ページの「菊一文珠四郎包永の歩み」は明治3年（1870年）を「『菊一文珠四郎包永』創業」とし、昭和45年（1970年）に「『株式会社 菊一文珠四郎包永』設立」とする。創業年と法人設立年を分けて本表に書いた。また、同社は手掻派以来「750年を超える歴史」を公式に掲げるが、これは刀工集団の系譜の年数であり、企業の創業年（1870年）とは別である。","- 三輪山本の法人設立年：Wikipedia「三輪山本」は基礎情報で「設立 1717年（享保2年）2月」とし、特記事項として「1717年（享保2年）2月に創業」とする。一方、企業情報データベース系の資料には設立を1974年3月（4月）とするものがある。公式サイトの会社概要で法人設立年を確認できなかったため、本表では法人設立年を未確認とした。","- 油長酒造の創業年の根拠：同社公式サイト自身が、1600年代後期には酒を造り始めていたようだとしたうえで、1719年（享保4年）の古文書をもとに創業を1719年とすると説明している。本表は公式の説明どおりに書いた。","- 奈良ホテルの創業と運営会社：ホテルの開業（創業）は1909年10月17日だが、当初の運営は大日本ホテル株式会社であり、現在の株式会社奈良ホテルの設立は1983年1月31日である。両者を分けて書いた。","- 柿安（株式会社柿安本店）は奈良県の企業ではない：同社公式「企業概要」は、創業を明治4年（1871年）11月8日、本社を三重県桑名市吉之丸8番地とする。奈良県内に本社がないため、h-1の本体には入れなかった。","- 大和ハウス工業は対象外：同社公式「会社概要」は、本社所在地を大阪市北区梅田3丁目3番5号、創業を1955年4月5日（設立1947年3月4日）とする。大阪本社のため、h-2の本体には入れなかった（同社は奈良市に総合技術研究所などを置くが、本社は大阪市である）。","- DMG森精機の本社の扱い：同社は奈良と東京の二本社制で、グローバル本社は東京都江東区である。本店所在地と第二本社は奈良市にあるためh-2に入れたが、「本社が奈良県内のみ」の企業ではない点を備考に明記した。","- 奈良県100年企業顕彰について：奈良県は令和6年度に「奈良県100年企業顕彰」を創設し、30社を顕彰した（奈良県公式）。本表のh-1は候補として挙がった企業のうち公式出典で裏取りできた8社であり、県内の100年企業を網羅したものではない。顕彰企業には株式会社あかしや（筆の製造販売、奈良市）、乾製麺所（製麺業、桜井市）、株式会社三光丸（医薬品製造業、御所市）なども含まれる。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 今西清兵衛商店 公式サイトの「会社概要」ページ：検索では同社公式サイト内の会社概要ページを直接取得できず、取得不可とした。創業・法人化の年は、同社公式「会社概要」を出典とするWikipedia「今西清兵衛商店」の沿革と、厚生労働省の企業情報（公的）で代替確認した。","- 三輪山本 公式サイトの会社概要ページ：公式オンラインショップ等のページからは創業年・本社所在地の会社概要を直接取得できず、取得不可とした。創業1717年・本社奈良県桜井市箸中880はWikipedia「三輪山本」で確認し、同社の楽天市場店の会社概要（創業 享保2年（1717年）、奈良県桜井市箸中880）とも一致する。","- 中川政七商店 公式企業サイトの会社概要（所在地・設立年月日を一覧するページ）：今回開いた企業サイトのトップページでは所在地・法人設立日の一覧を確認できず、その項目は同社のプレスリリースに付された会社概要で確認した。","- 菊一文珠四郎包永 公式「会社概要」の所在地：同ページでは会社名・代表者・設立・従業員数・URLのみが表示され、所在地を確認できなかったため、所在地は奈良県の海外展開資料（自治体）に拠った。"],"tables":[]}]},{"id":"osaka","title":"大阪府","sub":"旧摂津国（府域）・河内国・和泉国","meta":["- 取得日：2026-11-18","- 前提：要約・加工なし、出典つき転記。事実と推測を分け、確認できないことは「未確認」と書く。公的・自治体の出典をWikipediaより優先し、Wikipediaだけの項目は出典の種別にその旨を残す。出典の種別は「公的」「自治体」「その他（内容）」「Wikipedia」の4種。","- 暦の方針：日付は新暦を主にし、1872年末までの日付は旧暦を括弧で併記する。1582年以前の西暦の月日は暦の種別を注記し、分からなければ「暦不明」と書く。出典が旧暦か新暦か判断できない日付は原文のまま書き「暦不明」と注記する。","- 対象範囲：大阪府域は3つの旧国にまたがる。摂津（大阪市・堺市北部ほか。兵庫県側は扱わない）、河内、和泉。堺は和泉と摂津（住吉郡）の境界があり、扱いはa13に注記した。","- 表の列は奈良（第3便）の形式にそろえた。末尾に「注記・食い違い」「取得不可だったページ」「照合区分の一覧」を付ける。","---"],"a":[{"h":"a. 旧国名と五畿七道","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「河内国」 https://ja.wikipedia.org/wiki/河内国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「和泉国」 https://ja.wikipedia.org/wiki/和泉国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「五畿七道」 https://ja.wikipedia.org/wiki/五畿七道 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「大阪府」 https://ja.wikipedia.org/wiki/大阪府 （取得日2026-11-18、種別：Wikipedia）※a14のみ","- 「大阪府の主要大名」（gioan-awk.com） http://gioan-awk.com/daimyou-27osaka.htm （取得日2026-11-18、種別：その他）※『延喜式』の郡数に関する注記のみ"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["a1","五畿（畿内）","ごき（きない）","五畿七道は古代日本の律令制における広域地方行政区画で、「畿内七道（きないしちどう）」とも呼ばれた。五畿は「畿内」ともいい、大和、山城、摂津、河内、和泉の五国。現在の奈良県、京都府中南部、大阪府、兵庫県南東部を合わせた地域。七道は東海道、東山道、北陸道、山陽道、山陰道、南海道、西海道","1869年（明治2年）、北海道が新設されてからは五畿八道と呼ばれる","Wikipedia"],["a2","摂津国","せっつのくに","日本の令制国の一つ。畿内に属する。現在の大阪府北中部の大半と兵庫県南東部にあたる。旧字体は「攝津國」。別称は摂州（せっしゅう）","瀬戸内海航路の起点で、淀川・大和川水系との結節点でもある難波津や住吉津があり「津国（つのくに）」と呼ばれた（記事）","Wikipedia"],["a3","摂津国の郡・郷数","―","13郡78郷（記事の基礎情報欄「郡・郷数」）。記事の「郡」の節に挙がる郡は次の12郡（郷数は記事の記載どおり）：島上郡（嶋上郡）…全5郷、島下郡（嶋下郡）…全4郷、豊島郡…全7郷、能勢郡…全3郷、川辺郡（河辺郡）…全8郷、有馬郡…全5郷、武庫郡…全8郷、菟原郡…全8郷、八部郡…全5郷、西成郡（西生郡）…全12郷、東成郡（東生郡）…全5郷、住吉郡…全5郷","島上郡と島下郡は古代三島郡が大宝元年（701年）に分割されて設置された。能勢郡は和銅6年（713年）に河辺郡の一部を割いて設置。記事には天智天皇3年（664年）に百済郡が設置されたとの記載もある。郡数の食い違いについては注記参照","Wikipedia"],["a4","摂津職","せっつしき","壬申の乱に勝利した天武天皇は、畿内の外港を抱える要地難波宮を副都とし、国司を置く代わりに、津国を摂（管掌）する機関として特に摂津職を置いた。摂津職は京官とされ、大夫・亮・進・属の四等官で構成された。延暦12年（793年）3月9日に摂津職を廃し、新たに摂津国を置いた。前身の摂津職から引き継いで「摂」の字を冠し、「せっつのくに」とも呼び、また元の津国の訓みそのままに「つのくに」とも呼んだ","記事の「人物」欄に挙がる最初の摂津大夫は多比麻呂で、天武天皇6年（677年）任官とある","Wikipedia"],["a5","河内国","かわちのくに（かはちのくに）","日本の地方行政区分である令制国の一つ。畿内に属する。旧字体は「河內國」。別称は河州（かしゅう）。相当領域は大阪府東部（当初は南西部も含む）","飛鳥時代の7世紀に成立した。『古事記』には「川内」の表記も見え、7世紀末・8世紀初めの木簡2例にも川内と書かれている。河内の名が確定したのは、おそらく大宝4年（704年）の国印鋳造時である（記事）","Wikipedia"],["a6","河内国の郡・郷数","―","14郡79郷（記事の基礎情報欄「郡・郷数」）。記事の「郡」の節に挙がる郡は次のとおり：茨田郡、交野郡（飛鳥時代後期に茨田郡より割置）、讃良郡、河内郡、高安郡、大県郡（養老4年（720年）11月、堅下郡と堅上郡を統合して設置）、若江郡、渋川郡、志紀郡、安宿部郡（安宿郡とも表記）、古市郡、石川郡、錦部郡、丹比郡（平安時代後期に分割され丹南郡・丹北郡となり、八上郡は平安時代後期に丹北郡より割置）","『延喜式』では河内は14郡（後代16郡）とする資料がある（その他出典の注記）","Wikipedia"],["a7","河内国の範囲と和泉の分立（河内国記事）","―","河内国の範囲は現在の大阪府東部に該当するが、奈良時代の初めまでは海側の和泉国の領域も含んでいた。霊亀2年（716年）4月16日に、大鳥郡・和泉郡・日根郡を割いて和泉監を分立させた。天平12年（740年）8月20日に和泉監を併合するが、天平宝字元年（757年）5月8日に、今度は和泉国として再び分立させた","和泉国記事の記載とは日付に食い違いがある（注記参照）","Wikipedia"],["a8","河内職","かわちしき","称徳朝の神護景雲3年（769年）に由義宮（八尾市）が建設されるとこれを西京と称し、それに伴って河内国が廃止され、かわって特別行政組織「河内職」が設置されたが、翌年元に戻された","―","Wikipedia"],["a9","和泉国","いずみのくに／いづみのくに","日本の地方行政区分である令制国の一つ。畿内に属する。別称は泉州（せんしゅう）。相当領域は大阪府南西部（大和川以南）","和泉地方の古名は「チヌ」（茅渟、血沼、珍）といった。もともとは「泉」一字で表記された。「和泉」の国名は、和銅6年（713年）の諸国郡郷名著好字令により国名を二字にする必要があり、佳字の「和」を付与したものにしたためで、「和」は読まない（記事）","Wikipedia"],["a10","和泉国の郡・郷数","―","3郡24郷（記事の基礎情報欄「郡・郷数」）。記事の「郡」の節に挙がる郡は次のとおり：大鳥郡、和泉郡（泉郡とも表記）、南郡（13世紀頃に和泉郡より分割）、日根郡","『延喜式』では和泉は3郡（後代4郡）とする資料がある（その他出典の注記）","Wikipedia"],["a11","和泉監の設置と和泉国の成立（和泉国記事）","―","『続日本紀』によれば、霊亀2年（716年）3月27日に河内国から和泉郡・日根郡を割き、さらに同年4月13日に同国大鳥郡を併せて「和泉監」が建てられた。元正天皇の離宮（珍努宮、茅渟宮、和泉宮とも）がこの地に造営されたことが、国司ではない監という特別な官司の設置の理由であると見られる。その後、天平12年（740年）8月20日に和泉監は廃止されて河内国に戻されたが、天平勝宝9歳（757年）5月8日に再度分離して和泉国が設置された","河内国記事の記載とは日付に食い違いがある（注記参照）。また記事の注釈によれば、『先代旧事本紀』国造本紀には、これより先の715年（霊亀元年）に茅野監（ちののげん）が茅渟宮に置かれたという","Wikipedia"],["a12","摂津4郡の和泉編入計画（未実施）","―","『日本紀略』によれば、天長2年（825年）3月30日、摂津国から東生・西生・百済・住吉の4郡を和泉国に編入しようとしたが、地元の反対があったため、同年閏7月21日に取り止めとなった","和泉国記事の記載","Wikipedia"],["a13","堺における国境の扱い","―","摂津・河内・和泉三国の国境は、現在の堺市の方違神社（三国山・三国丘）にあったが、明治4年（1871年）に和泉との国境は堺大小路から大和川に改められ、一部が和泉に編入された（摂津国記事）。明治4年（1871年）9月には住吉郡のうち大和川以南地域を和泉国大鳥郡へ編入した。和泉国記事は「明治4年（1871年）に摂津国との境界が堺大小路、長尾街道（大津道）から大和川に変更された（ただし、長尾街道以北でも、旧 北庄村・西万屋新田は以前から和泉国）」とする。現在の行政区分では、堺市堺区のうち大小路以北の堺市街地、旧三宝村大字弥三次郎新田・南島新田、旧向井町大字七道・遠里小野、北区のうち旧五箇荘村は明治4年（1871年）まで摂津国に属し、堺市東区全域・美原区全域・北区の一部（旧金岡村・北八下村）は河内国に属した","堺は摂津国住吉郡と和泉国大鳥郡の境界に位置し、市域は摂津・河内・和泉の3国にまたがる","Wikipedia"],["a14","大阪府域と3つの旧国","せっかせん（摂河泉）","Wikipedia「大阪府」は「府域は令制国の摂津国東部（7郡）および河内国と和泉国のそれぞれ全域で構成され、三国の文字を取って摂河泉（せっかせん）とも呼ばれる」とする。ただし、京都府から樫田村全域と亀岡市の一部が越境編入された1958年以降は丹波国南東部（ごく一部）も含むようになっている。なお、堺県編入の1881年から奈良県再設置の1887年までは大和国の全域も含んでいた","大阪府公式サイトでこの点を確認することは今回できなかった（取得不可参照）","Wikipedia"]]}]},{"h":"注記・食い違い（a）","lv":3,"text":["1. 和泉監設置の日付（食い違い）：河内国記事は「霊亀2年（716年）4月16日に、大鳥郡・和泉郡・日根郡を割いて和泉監を分立させた」とする。一方、和泉国記事は『続日本紀』によれば「霊亀2年（716年）3月27日に河内国から和泉郡・日根郡を割き、さらに同年4月13日に同国大鳥郡を併せて和泉監が建てられた」とする。両論併記し、どちらか一方に決めない。","2. 757年の再分立の年号表記：河内国記事は「天平宝字元年（757年）5月8日」、和泉国記事は「天平勝宝9歳（757年）5月8日」とし、年号の表記は異なるが年月日は一致する。","3. 摂津国の郡数・郷数（食い違い）：摂津国記事の基礎情報欄は「13郡78郷」とするが、同記事の「郡」の節に列挙されるのは12郡で、各郡の郷数を合計すると75郷となり、基礎情報欄の数と一致しない。なお「大阪府の主要大名」（その他）には「『延喜式』では摂津は13郡（後代12郡）」とある。差異の理由は各出典に明記がなく、未確認として残す。","4. 日付の暦について：716年・740年・757年・793年・825年の月日は、各記事が元号とともに記す日付であり、新暦への換算は記事に記載がないため、原文のまま転記した（暦の種別の明記はない）。","5. 河内国の読み：河内国記事の冒頭は「かわちのくに、かはちのくに」の両方を併記する。"],"tables":[]},{"h":"取得不可（a）","lv":3,"text":["- 大阪府公式サイト（pref.osaka.lg.jp）で、大阪府域が摂津・河内・和泉の3つの旧国にまたがる旨を記したページ：検索では該当ページに到達できず、公的出典での確認はできなかった。この点は未確認とし、代替としてWikipedia「大阪府」の記述（a14）を転記した。","---"],"tables":[]}],"b":[{"h":"b. 江戸時代の藩と藩主","lv":2,"text":["出典：Wikipedia「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧 （取得日2026-11-18、種別：Wikipedia）および各藩・藩主の個別記事。出典の種別は特記なき限り「Wikipedia」。藩主の読みは、各藩記事・個人記事に読みの明記がある場合のみ転記し、明記がないものは「―（記事に読みなし）」とした（自治体出典での読みの取得は今回できなかった分を含む。下記「取得不可」参照）。","同記事の凡例：「設立後、すぐに廃藩となった藩などは記されていない場合がある」。","- 和泉国の項：陶器藩（1604年-）、伯太藩（大庭寺藩）（1698年-）、岸和田藩、谷川藩、吉見藩（1870年-）","- 河内国の項：丹南藩（1623年-）、狭山藩（1600年-）、西代藩（1679年-）","- 摂津国の項：三田藩、高槻藩、麻田藩（1615年-）、尼崎藩（1615年-）、大坂藩、茨木藩、摂津中島藩（1616？年-）、味舌藩（ましたはん）","- このうち三田藩・尼崎藩は現在の兵庫県域のため本表から除いた。大阪府域分は高槻藩・麻田藩・大坂藩・茨木藩・摂津中島藩・味舌藩の6藩。","- なお、依頼文の候補にあった三日月藩は、同記事では播磨国の項に挙がる（1697年-）藩で、現在の兵庫県域のため本表には入れていない。"],"tables":[{"cols":["番号","藩名","読み","立藩年","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城・陣屋","出典の種別"],"rows":[["1","岸和田藩","きしわだはん","天正13年（1585年）（豊臣秀吉の母方の叔父・小出秀政が岸和田城主に封ぜられたことに始まる、と記事）","小出秀政（―（記事に読みなし））","岡部長職（―（記事に読みなし））※第13代（岡部家）","小出家3万石→5万石（1600年-1619年）→松平（松井）家5万石→6万石→5万石（1619年-1640年）→岡部家6万石→5万3千石（1640年-1871年）","岸和田城（和泉国南郡岸和田、現在の大阪府岸和田市）","Wikipedia"],["2","高槻藩","たかつきはん","元和元年（1615年）（内藤信正が近江国長浜より4万石で入り立藩、と記事）","内藤信正（のぶまさ）","永井直諒（なおまさ）※永井家第13代","内藤家4万石（1615年-1617年）→土岐家2万石（1617年-1619年）→松平（形原）家2万石（1619年-1635年）→岡部家5万石（1635年-1640年）→松平（形原）家3万6000石（1640年-1649年）→永井家3万6000石（1649年-1871年）","高槻城（現在の大阪府高槻市城内町付近）","Wikipedia"],["3","狭山藩","さやまはん","慶長5年（1600年）（北条氏盛が父氏規の遺領を継いで1万1000石の大名となる。「これが狭山藩の始まりである」と記事）","北条氏盛（―（記事に読みなし））","北条氏恭（―（記事に読みなし））※第12代","1万1000石→1万石（第4代氏治の代に減封）","狭山陣屋（丹南郡池尻村および半田村、現・大阪府大阪狭山市狭山。第2代氏信の元和2年（1616年）に営まれた。当初は久宝寺町の大坂屋敷で政務）","Wikipedia"],["4","丹南藩","たんなんはん","元和9年（1623年）（高木正次が大坂定番就任の際1000石加増を受けて1万石の大名となり、領地を河内国丹南郡22村に移されて丹南を居所とした）","高木正次（―（記事に読みなし））","高木正善（―（記事に読みなし））※第13代","1万石（存続期間の大部分。2代正成の代に安房・上総へ3000石加増があったが、3代正弘が弟2人に1500石ずつ分与し1万石に戻った）","丹南陣屋（河内国丹南郡丹南村、現在の大阪府松原市丹南）","Wikipedia"],["5","西代藩","にしだいはん（にしんだいはん、注記参照）","延宝7年（1679年）（近江膳所藩本多家の分家として本多忠恒に1万石が分知されて成立。ただし西代に陣屋を置いたのは1711年、2代忠統の代）","本多忠恒（―（記事に読みなし））","本多忠統（―（記事に読みなし））※第2代。享保17年（1732年）に伊勢神戸藩へ転出し西代藩は廃藩","1万石","西代陣屋（河内国錦部郡西代村、現在の大阪府河内長野市西代町。1711年に忠統が構えた。立藩当初、忠恒は膳所を国元の住まいとした）","Wikipedia"],["6","陶器藩","とうきはん（かわらけはん、注記参照）","慶長9年（1604年）（『角川日本地名大辞典』による。小出吉英の領地から1万石が三尹に分与され成立。記事本文は慶長8年（1603年）の小出秀家没後に三尹が遺領2000石を継いだ経緯から説く）","小出三尹（みつまさ）","小出重興（―（記事に読みなし））※第4代。元禄9年（1696年）に無嗣のため改易","1万石","陶器陣屋（和泉国大鳥郡陶器庄の北村、現在の大阪府堺市中区陶器北付近）","Wikipedia"],["7","伯太藩","はかたはん","渡辺家の藩としての成立は寛文元年（1661年）（渡辺吉綱が大坂定番就任の際、河内・和泉両国内で1万石の加増を受け合計1万3500余石の大名となり野本藩が成立）。元禄11年（1698年）に居所を大庭寺村へ移し大庭寺藩、享保12年（1727年）に伯太村へ移し伯太藩。「藩の一覧」は和泉国の項に「伯太藩（大庭寺藩）（1698年-）」と挙げる","渡辺吉綱（―（記事に読みなし））※野本藩初代。伯太藩としての初代は渡辺基綱","渡辺章綱（―（記事に読みなし））※伯太移転後第9代","1万3500石","伯太陣屋（和泉国和泉郡伯太村、現在の大阪府和泉市伯太町。1727年移転。それ以前は大庭寺陣屋（大鳥郡大庭寺村、現・堺市南区）、さらに以前の居所については野本（武蔵国）とする説と河内国大井（現・藤井寺市）とする説がある）","Wikipedia"],["8","谷川藩","たにがわはん（『藩と城下町の事典』は「たにかわ」、注記参照）","慶長11年（1606年）（桑山重晴の養老料のうち1万石が桑山清晴に与えられて成立）","桑山清晴（―（記事に読みなし））※1代のみ","桑山清晴（同左）。慶長14年（1609年）に改易され廃藩","1万石","谷川陣屋（和泉国日根郡谷川村、現在の大阪府泉南郡岬町多奈川谷川）","Wikipedia"],["9","吉見藩","よしみはん","明治3年（1870年）4月14日（近江三上藩が藩庁を和泉国吉見へ移して成立。翌明治4年（1871年）7月の廃藩置県で消滅）","遠藤胤城（―（記事に読みなし））※藩知事、1代のみ（三上藩主からの継続）","遠藤胤城（同左）","1万4500石（三上藩・遠藤家の表高。『太政類典』によれば大政奉還時点の知行地は近江国4227石・和泉国5173石などに分布）","吉見（和泉国日根郡吉見村、現在の大阪府泉南郡田尻町吉見。春日神社境内に知藩事邸・藩士住居が設けられた）","Wikipedia"],["10","麻田藩","あさだはん","元和元年（1615年）（大坂の陣後に青木一重が入封して成立。同年7月に旧領の領有が認められ麻田に陣屋を構えた）","青木一重（かずしげ）","青木重義（しげよし）※第14代","1万2000石→1万石（元和3年（1617年）までの間に弟・可直へ2000石を分知）","麻田陣屋（摂津国豊島郡麻田村、現在の大阪府豊中市蛍池）","Wikipedia"],["11","大坂藩","おおさかはん","慶長20年（1615年）（大坂の陣による豊臣家滅亡後、松平忠明が10万石で入封し成立。元和5年（1619年）に忠明が大和郡山藩へ移封となり廃藩、以後は幕府直轄）※関ヶ原後に豊臣秀頼が摂津・河内・和泉65万7000石の一大名に押し込められたという解釈では、それ以前から「大坂藩といえる」と記事は記す","松平忠明（まつだいら ただあきら）※豊臣家を藩主家とみる場合は豊臣秀頼（とよとみ ひでより）","松平忠明（同左、1代のみ）","豊臣家65万7000石／松平家10万石","大坂城（摂津国東成郡、現在の大阪市中央区）","Wikipedia"],["12","茨木藩","いばらきはん","記事に立藩年の明記なし（関ヶ原の戦いの後、片桐且元が入ったとされる）","片桐且元（かつもと）※1代のみ","片桐且元（同左）。大坂の陣後、茨木は幕府領となった","2万8000石（片桐家、外様）","茨木城（摂津国、現在の大阪府茨木市片桐町・上泉町。一国一城令で廃城）","Wikipedia"],["13","摂津中島藩","せっつなかじまはん","元和2年（1616年）（稲葉紀通が伊勢田丸藩から領地替えを受けて移封され成立。寛永元年（1624年）に丹波福知山藩へ移封され廃藩）","稲葉紀通（のりみち）※1代のみ","稲葉紀通（同左）","4万5700石","柴島城（摂津国西成郡中島、現在の大阪市東淀川区柴島付近）であったとされる","Wikipedia"],["14","味舌藩","ましたはん","慶長5年（1600年）（織田長益（有楽斎）が関ヶ原の戦功により大和国山辺郡内に2万8000石を加増され、味舌の本領2000石と合わせて3万石の大名となり成立。所領の大部分は大和国内）","織田長益（―（記事に読みの明記なし））※元和元年（1615年）に子2人へ1万石ずつ分与し、残る1万石は長益の隠居料となった。元和7年（1621年）の長益死去をもって廃藩とされる（長則が継いだとする見解では寛永8年（1631年）廃藩）","織田長益（同左）","3万石→（1615年の分与後）隠居料1万石","味舌（摂津国島下郡味舌、現在の大阪府摂津市三島付近）を居所とする。なお『角川日本地名大辞典』「戒重村」の項は、長益が大名になった際に大和国戒重村に陣屋を置いたとする説を否定し、長益は京都に居住していたと記す（記事注釈）","Wikipedia"]]}]},{"h":"幕府領・幕府の機関","lv":3,"text":["出典：Wikipedia「大坂城代」 https://ja.wikipedia.org/wiki/大坂城代 ／「大坂町奉行」 https://ja.wikipedia.org/wiki/大坂町奉行 ／「堺奉行」 https://ja.wikipedia.org/wiki/堺奉行 （いずれも取得日2026-11-18、種別：Wikipedia）。出典（大坂町奉行の一覧）として記事内に「大坂城代・定番・町奉行・加番一覧 - 大阪府立図書館」の記載がある。","大坂城代","- 「大坂城代（おおさかじょうだい）は、江戸幕府の役職の一つ。将軍直属で有力な譜代大名が任じられ、大坂城主である将軍に代わり大坂城を預かった」（記事冒頭）。","- 松平忠明の大和郡山移封をもって大坂藩は廃止され、1619年（元和5年）に大坂は江戸幕府直轄地となり、大坂城に城代が置かれるようになった。1620年（元和6年）からは大坂城修築工事も始まり、大坂城代は大坂城守衛の総監および西国大名の監視等にあたった。","- 1623年（元和9年）には副城代に相当する京橋口定番・玉造口定番の大坂定番2名が置かれ、城代が追手口、京橋口定番が京橋口、玉造口定番が玉造口の各虎口の守衛をそれぞれ主に担当した。将軍直属の大坂城代と異なり、大坂定番は大坂町奉行などと同様に老中支配であった。","- 初代は内藤信正（1619年 - 1626年）。歴代は記事に68代まで挙がる（最後は牧野貞明（1864年 - 1868年））。","- 関東地方など遠方に領地を持つ大名が大坂城代に就任すると、所領のうち1万〜2万石程度を大坂近郊の摂津国・河内国・和泉国などに割り当て直された。退任時には元の所領に戻された。","大坂町奉行","- 「大坂町奉行（おおさかまちぶぎょう）は、江戸幕府が大坂に設置した遠国奉行の1つ。東西の奉行所が設置され、江戸町奉行と同様に東西1ヶ月ごとの月番制を取り、東西の奉行所はそれぞれ『東の御番所』『西の御番所』と呼ばれていた。初名は大坂郡代（おおさかぐんだい）。老中支配下で大坂城下（大坂三郷）および摂津・河内の支配を目的としていた」（記事冒頭）。","- 元和5年（1619年）8月22日に久貝正俊（東町奉行）・嶋田直時（西町奉行）がそれぞれ役高3000石をもって任じられたのが始まりとされている。","- 定員は東西それぞれ1名ずつ。元禄9年（1696年）- 同15年（1702年）の6年間のみ、一時廃止となった堺町奉行を兼務する3人目の奉行が設置されていた。","- 時代が下るにつれて、幕府領となった兵庫津・西宮の民政、摂津・河内・和泉・播磨における幕府領における年貢徴収および公事取扱（享保7年（1722年）以後）など、その職務権限は拡大された。","- 東西各奉行所に、それぞれ与力30騎、同心50人が配属された。","堺奉行","- 「堺奉行（さかいぶぎょう）は、江戸幕府が江戸以外の幕府直轄領内の重要な場所に置いた遠国奉行の一つで、堺および和泉・河内両国の幕府直轄領を統治した。前身は中世に設けられた堺政所（さかいまんどころ）である。堺奉行は老中支配の元に置かれ、配下は与力10騎・同心50人（一時与力6騎・同心40人となる）、足高は役高1000石・役料現米600石であった」（記事冒頭）。","- 1600年、徳川家康が成瀬正成、米津親勝、細井政成を堺政所に任じた。1614年に堺は幕府の直轄下となった。1618年に堺政所から堺奉行に改称した。","- 1696年2月には堺奉行が廃止され、堺は大坂町奉行の管轄となった。その後1702年11月に堺奉行が再設置されたものの、引き続き大坂町奉行の指揮下に置かれて、与力6騎、同心40人に削減された。1711年になって旧制の10騎・50人体制に復帰した。","- 1867年8月、慶応の改革によって堺奉行が再び廃止され、堺は大坂町奉行の管轄となった。","代官・代官所","- 大坂代官について：大阪市史編纂所の刊行物紹介（大阪市公式サイト内）によれば、「大坂代官は、摂津・河内・和泉・播磨の４ヵ国に散在する幕領（幕府直轄領）の村々を支配した幕府役人」であり、天保11年（1840年）出版の『大坂便用録』には「当時代官所のあった谷町・鈴木町各代官所の人員構成が掲載されています」とある（出典：大阪市史編纂所「大阪市史料調査会報 第38号」 https://www.oml.city.osaka.lg.jp/torikomi/upload/tayori038.pdf ／取得日2026-11-18／種別：自治体）。同紹介文には木町代官への言及もある。","- 枚方代官所については、下記「取得不可」のとおり、今回の取得範囲では確認できなかった。"],"tables":[]},{"h":"飛地・旗本領・幕府領の預かり","lv":3,"text":["出典はいずれも上記の各藩記事（Wikipedia、取得日2026-11-18）。","本拠が府域外の藩の飛地・府域外に領地を持つ府域の藩（記事の「幕末の領地」等の記載どおり）","- 高槻藩：摂津国のほか、丹波国桑田郡のうち15村、河内国茨田郡のうち3村（堺県に編入）を領した。","- 狭山藩：河内国のほか、近江国滋賀郡のうち1村、栗太郡のうち3村、野洲郡のうち2村、甲賀郡のうち1村を領した。","- 丹南藩：河内国のほか、下野国足利郡のうち4村を領した。","- 西代藩：河内国錦部郡のほか、近江国高島郡・甲賀郡に領地があった。1732年の転出後も、西代村を除く河内領は引き続き伊勢神戸藩本多家の知行地として続いた。","- 陶器藩：寛文4年（1664年）時点の領地は和泉国大鳥郡・河内国錦部郡・摂津国西成郡・但馬国気多郡・美含郡の4国5郡内に分散していた。","- 伯太藩：和泉・河内のほか近江国（栗太郡・野洲郡・蒲生郡・高島郡）に領地があり、近江の諸村は「東江州郷」「西江州郷」に編成された。和泉郡池上村は大和小泉藩と伯太藩の相給であった。","- 麻田藩：摂津国のほか、備中国小田郡・後月郡・浅口郡に領地があった。","- 吉見藩（三上藩）：吉見県管轄地には、旧藩領以外に和泉郡の旧幕府領2村、日根郡の旧土浦藩領2村が編入された（記事の旧高旧領取調帳データベースに基づく表による）。","幕府領の預かり（記事の記載どおり）","- 岸和田藩：「上記のほか、大鳥郡1村、和泉郡1村、南郡4村、日根郡5村の幕府領を預かり、大鳥郡1村が堺県に、残部が本藩に編入された」。","- 高槻藩：「島下郡14村、島上郡17村、能勢郡18村の幕府領を預かり、島上郡3村は本藩に、残部は摂津県に編入された。また、茨田郡6村の幕府領を預かったが、全域が堺県に編入された」。","旗本領","- 旗本小出家（陶器）：陶器藩の廃藩後、宝永2年（1705年）に大身旗本・小出有仍が和泉国大鳥郡11か村・河内錦部郡3か村に知行地5000石を移された。これらは陶器藩旧領であり、以後幕末まで大身旗本小出家の知行地となった。文政4年（1821年）には大鳥郡田園村に陣屋（田園陣屋）を構えた（Wikipedia「陶器藩」）。","- 旗本青木家（麻田）：麻田藩初代・青木一重が弟の可直に分知した2000石は旗本青木家の知行となり、牧荘の平尾村に「平尾役所」を置いて知行地の支配にあたった（Wikipedia「麻田藩」）。"],"tables":[]},{"h":"奈良県の回で未取得だった人物の読み（追加取得分）","lv":3,"text":["出典：Wikipedia「片桐且元」 https://ja.wikipedia.org/wiki/片桐且元 ／「片桐為次」 https://ja.wikipedia.org/wiki/片桐為次 （いずれも取得日2026-11-18、種別：Wikipedia）"],"tables":[{"cols":["人物","読み","出典の記載"],"rows":[["片桐且元","かたぎり かつもと","「片桐 且元（かたぎり かつもと）は、安土桃山時代から江戸時代初期にかけての武将、大名。……大和国竜田藩初代藩主」。基礎情報欄に「藩：大和竜田藩主」。なお慶長6年（1601年）正月に1万8千石の加増を受け2万8千石を領し「大和竜田城を居城としている」と本文にある。本表の茨木藩の藩主でもある"],["片桐為次","かたぎり ためつぐ","「片桐 為次（かたぎり ためつぐ、寛永18年（1641年） - 明暦元年11月6日（1655年12月3日））は、大和竜田藩の第4代（最後）の藩主」。承応3年（1654年）に父の死去により跡を継ぐが、翌年11月6日に15歳で死去し、嗣子がなく竜田藩は無嗣改易となった"]]}]},{"h":"岸田藩（追加項目）","lv":3,"text":["- Wikipedia「藩の一覧」の大和国の項に「岸田藩」の藩名のみ挙がることは確認できた（立藩年の記載なし）。個別記事「岸田藩」は下記のとおり取得できなかったため、藩名・読み・立藩年・藩主・石高・居城はいずれも未確認。"],"tables":[]},{"h":"注記・食い違い（b）","lv":3,"text":["1. 高槻藩・岡部宣勝の石高：同記事の概要は「播磨国龍野藩より岡部宣勝が5万1000石で入った」とするが、歴代藩主の家の見出しは「岡部家 譜代 5万石 （1635年 - 1640年）」とする。記事内の食い違いとして両方を併記する。","2. 岸和田藩・岡部行隆の在職開始年：歴代藩主表は2代行隆の在職を「寛文元年10月27日（1624年）」と記すが、寛文元年は1661年であり、表中の西暦併記「1624年」は1代宣勝の在職終了「寛文元年10月27日（1661年）」とも一致しない。記事の表記どおり転記した（記事内の食い違い）。","3. 西代藩の読み：記事は「西代藩（にしだいはん、にしんだいはん）」と2つの読みを併記する。注釈によれば「西代という地名は本来『にしんだい』と読むが、現代の行政地名としての河内長野市西代町は『にしだいちょう』とされる」。","4. 陶器藩の読み：記事冒頭は「陶器藩（とうきはん / かわらけはん）」。注釈によれば『出石町史』は「陶器」に「かわらけ」と読み仮名を振っている。","5. 谷川藩の読み：記事注釈によれば、日本郵便の郵便番号検索では「谷川」は「たにがわ」、『藩と城下町の事典』は「たにかわ」とする。食い違いとして両方を併記する。","6. 伯太藩の居所の変遷：渡辺家の居所については、野本藩（武蔵国野本村）とする見解と、河内国大井に陣屋を置いた「大井藩」とする見解（『藩と城下町の事典』は「武蔵国野本藩の一時的な仮称」とする）があり、記事は「居所については不明瞭な点を含み」と明記する。両論併記。","7. 大庭寺の読み：伯太藩記事の注釈によれば、日本郵政の「郵便番号検索」では大庭寺は「おおばでら」、『角川日本地名大辞典』『角川新版日本史辞典』は「おばでら」とする。食い違いとして併記する。","8. 陶器藩の2代藩主名：歴代藩主の見出しは「2. 有棟」とするが、本文（文化の節）には「2代藩主・有宗（有棟）」「2代藩主・三尹の妻」と異なる表記が混在する。記事の表記どおり転記した。","9. 大坂藩の成立時期：豊臣秀頼を一大名とみる解釈では関ヶ原後（1600年）から「大坂藩といえる」とする一方、記事本文は松平忠明の入封（1615年）をもって「大坂藩が成立した」とする。両方を併記した。","10. 味舌藩の廃藩年：元和7年（1621年）の織田長益死去をもって廃藩とするのが記事の本文の扱いだが、孫の長則が「味舌藩」を継いだとする見解では、その死去した寛永8年（1631年）が廃藩時期となる。両論併記。","11. 麻田藩の石高表記：基礎情報欄は「1万2000石→1万石」、歴代藩主の見出しは「外様 1万2千石 （元和元年（1615年） - 1871年（明治4年））」とする。本文によれば分知後の表高は1万石で、「存続期間のほとんどにおいて表高は1万石」。"],"tables":[]},{"h":"取得不可（b）","lv":3,"text":["- Wikipedia「岸田藩」 https://ja.wikipedia.org/wiki/岸田藩 — 取得を試みたが、ページの保存コピーがなく取得に失敗した（奈良県の回に続き2回目の取得不可）。内容は未確認。","- Wikipedia「枚方代官所」 — その題名のページは存在せず（取得時にページが見つからなかった）。府域の代官については、大阪市史編纂所の刊行物紹介（自治体）にある大坂代官・谷町／鈴木町／木町代官所の記述で代替し、枚方代官所そのものの設置・管轄は未確認。","- 藩主個人記事（取得ツールのレート制限（429）のため取得不可）：「小出秀政」「岡部長職」「北条氏恭」ほか、本表で「―（記事に読みなし）」とした藩主の個人記事は、今回の取得ではレート制限により開けなかった。このため当該藩主の読みは未取得のまま残した（読みが取れたのは各藩記事・個人記事に明記があった分のみ）。","- 自治体出典（市史・市公式サイト）による藩主の読み：丹南藩記事が引用する松原市公式「61 高木氏と丹南藩一万石」など、記事内の引用元ページそのものは今回直接取得できていない。","---"],"tables":[]}],"c":[{"h":"c-1. 表：廃藩置県で県になった府域の旧藩と、幕府領・大阪府から県になったもの","lv":3,"text":["前提：廃藩置県は1871年8月29日（明治4年7月14日）に実施され、各藩はそのまま県を名乗った（大阪府公文書館歴史講座資料は「明治4（1871）年7月14日廃藩置県・・・3府302県」とする）。第1次府県統合は明治4年10〜11月に行われ「3府72県」となった（同資料）。","出典：Wikipedia「堺県」 https://ja.wikipedia.org/wiki/堺県 、「河内県 (日本)」 https://ja.wikipedia.org/wiki/河内県_(日本) 、大阪府公文書館資料、大阪府公式「府議会のあゆみ」、堺市公式、タウンガイド大阪（取得日はいずれも2026-11-18）。","注記（狭山藩）：狭山藩からは県は置かれなかった。狭山藩は廃藩置県以前の1869年に廃藩となり、1870年1月27日（明治2年12月26日）に堺県へ編入された（Wikipedia「堺県」）。堺市公式も「翌年、河内県・狭山藩を合併」とする。","注記（読み）：堺県・河内県の読みは各Wikipedia記事の冒頭表記による。伯太（はかた）・丹南（たんなん）は堺市公式の表記による。高槻（たかつき）は学研キッズネット「おおさか〖大阪（府）〗」の高槻藩（たかつきはん）の表記による。岸和田は岸和田藩（きしわだはん）（Weblio辞書）の読みによる。吉見県・麻田県については、県名としての読みを明記した出典を今回確認できなかったため、読みは未確認として扱う（表中の読みは藩名・地名の読みによる）。","注記（高槻県・麻田県の統合日）：タウンガイド大阪の「明治初年の地方制度の変遷」は「1871年（明治4年）11月20日高槻県、麻田県を大阪府に編入合併」とする。英語版Wikipedia「List of mergers in Osaka Prefecture」も高槻県・麻田県が大阪府へ統合された旨を記すが日付は示さない。日本語版Wikipediaでの照合は未実施（下記「取得不可」参照）。学術論文「大阪府の成立と地方自治の原型」は、明治4年11月の府県大改革により大阪府が「大阪市街地と摂津7郡（西成・東成・住吉・島上・島下・豊島・能勢）」を管轄し、兵庫県とは猪名川、堺県とは大和川を境界としたと記す。"],"tables":[{"cols":["番号","県名","読み","前身","発足日","統合先・廃止先","統合日・廃止日","出典の種別"],"rows":[["1","岸和田県","きしわだけん","岸和田藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia"],["2","伯太県","はかたけん","伯太藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia／自治体（堺市公式）"],["3","吉見県","よしみけん（読みは未確認。下記注記参照）","吉見藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia"],["4","丹南県","たんなんけん","丹南藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia／自治体（堺市公式）"],["5","高槻県","たかつきけん","高槻藩","1871年8月29日（明治4年7月14日）","大阪府","1871年12月31日（明治4年11月20日）","その他（タウンガイド大阪）"],["6","麻田県","あさだけん（読みは未確認。下記注記参照）","麻田藩","1871年8月29日（明治4年7月14日）","大阪府","1871年12月31日（明治4年11月20日）","その他（タウンガイド大阪）"],["7","河内県","かわちけん","大阪府南司農局の管轄地域（河内国の旧幕府領・旗本領）","1869年（明治2年）1月20日（西暦の月日換算は出典に明記なし）","堺県","1869年9月7日（明治2年8月2日）","Wikipedia"],["8","堺県（第1次）","さかいけん","大阪府（堺役所）。堺役所は大坂裁判所の出張所として堺奉行所跡に置かれ、慶応4年閏4月に堺役所へ改称、6月8日より和泉国の旧幕府領を管轄","1868年8月10日（慶応4年6月22日）","第1次府県統合により伯太県・岸和田県・吉見県・丹南県と統合され、改めて堺県（第2次）が発足","1872年1月2日（明治4年11月22日）","Wikipedia／自治体（大阪府公文書館）"],["9","五條県の河内国分","―","五條県","―","堺県（大和国分は奈良県、紀伊国分は和歌山県へ。同日、五條県廃止）","1872年1月2日（明治4年11月22日）","Wikipedia"]]}]},{"h":"c-2. 年表：大阪府・堺県・河内県などの設置・統合・廃止","lv":3,"text":["出典：Wikipedia「堺県」「河内県 (日本)」、大阪府公文書館「大阪あーかいぶず第35号」（矢切努「戦前地方『自治』の確立と大阪府」 https://archives.pref.osaka.lg.jp/search/information.do?method=initPage&id=55 ）・歴史講座資料「大阪府の成立とその発展」 https://archives.pref.osaka.lg.jp/search/image/h26Re-text.pdf 、大阪府公式「府議会のあゆみ」 https://www.pref.osaka.lg.jp/o170010/gikai_giji/aramashi/ayumi.html 、「大阪府の成立と地方自治の原型」（大阪教育大学リポジトリ収録論文 https://osaka-kyoiku.repo.nii.ac.jp/record/2085319/files/koumin_1_003.pdf ）（取得日はいずれも2026-11-18）。明治5年以前の日付は旧暦（Wikipedia「堺県」の沿革の表記方針による）。","- 1868年（慶応4年）1月22日：大阪鎮台が西本願寺津村別院に置かれる（大阪府公文書館歴史講座資料）。Wikipedia「堺県」は「正月22日（2月12日）に大坂鎮台を設置」と西暦換算を併記するが、この換算は他の換算と整合しない箇所があり、西暦の日は未確認として扱う（注記参照）。","- 1868年（慶応4年）1月27日：大阪鎮台は大阪裁判所と改称（大阪府公文書館歴史講座資料、学術論文）。","- 1868年（慶応4年）閏4月12日・21日：太政官布告により地方を府・藩・県に分け、9府22県266藩が設置された（大阪府公文書館歴史講座資料）。学術論文は「閏4月21日政体書が公布され、府藩県の三治制が実施されることになった」とする。","- 1868年6月21日（慶応4年5月2日）：大阪裁判所は大阪府と改称・設置（Wikipedia「堺県」、大阪府公文書館「大阪あーかいぶず第35号」、大阪府公式「府議会のあゆみ」は「慶応4年（1868年）の5月、大阪裁判所を改め、大阪府が設置されました」とする）。","- 1868年8月10日（慶応4年6月22日）：大阪府から堺役所を分割して堺県（第1次）が発足。発足当時の管轄は堺市街地一円と和泉国内4郡の郡村（Wikipedia「堺県」）。大阪府公文書館歴史講座資料も「同年6月22日、堺役所を大阪府から分割 →堺県誕生」とし、堺奉行所跡がそのまま堺県庁舎となったとする。","- 1868年12月7日（慶応4年10月24日）：大阪府との境界を大和川に定める太政官達が出され、摂津国住吉郡の大和川以南を堺県所管とすることとされたが、実際の編入は1871年11月12日（明治4年9月30日）（Wikipedia「堺県」）。","- 1869年（明治2年）1月：摂津県と河内県が大阪府から分離独立した（学術論文）。河内県の発足は1869年（明治2年）1月20日で、県庁は若江郡寺内村（現在の八尾市）の八尾別院大信寺の対面所に置かれた（Wikipedia「河内県 (日本)」）。","- 1869年（明治2年）5月：摂津県は豊崎県と改称（学術論文）。摂津県・豊崎県の日レベルの日付は未確認（下記「取得不可」参照）。","- 1869年（明治2年）：大阪府の管轄は大坂三郷とその町および属邑のみとなり、同年1月と9月に市街地に隣接する西成・東成・住吉の3郡が大阪府に戻された（Wikipedia「河内県 (日本)」、学術論文）。","- 1869年9月7日（明治2年8月2日）：河内県廃止に伴い、旧河内県の河内国16郡内の郡村が堺県管轄となる。引受完了は1869年10月2日（明治2年8月27日）（Wikipedia「堺県」「河内県 (日本)」）。","- 1869年7月17日：太政官布告により「府」は「京都・東京・大阪に限る」とされた（大阪府公文書館歴史講座資料）。学術論文は「翌明治2年には東京・大阪・京都の3府を残し、ほかはすべて県に改められた」とする。","- 1870年1月27日（明治2年12月26日）：廃藩となった狭山藩を堺県が編入（Wikipedia「堺県」）。","- 1870年3月28日（明治3年2月27日）：旧高野山領および錦部郡、石川郡の一部が新設の五條県に編入された（Wikipedia「堺県」）。","- 1871年8月29日（明治4年7月14日）：廃藩置県。府域では岸和田県・伯太県・吉見県・丹南県・高槻県・麻田県が発足（c-1表）。","- 1871年11月12日（明治4年9月30日）：摂津国住吉郡のうち大和川以南が和泉国大鳥郡に編入された（Wikipedia「堺県」）。","- 1871年12月31日（明治4年11月20日）：高槻県・麻田県を大阪府に編入合併（タウンガイド大阪）。","- 1872年1月2日（明治4年11月22日）：第1次府県統合により、堺県・伯太県・岸和田県・吉見県・丹南県が統合され、改めて堺県（第2次）が発足。「堺県」が正式名称として確定し、県庁を本願寺堺別院（堺北御坊）へ移転（Wikipedia「堺県」）。五條県も同日に廃止され、河内国分は堺県へ編入（Wikipedia「五條県」）。","- 1876年4月18日：第2次府県統合により、堺県が奈良県を編入。堺県の管轄は和泉国・河内国・大和国の全域となった（Wikipedia「堺県」、大阪府公文書館「大阪あーかいぶず第35号」）。","- 1881年2月7日：堺県が廃止され、大阪府に編入（Wikipedia「堺県」、大阪府公文書館「大阪あーかいぶず第35号」、大阪府公式「府議会のあゆみ」は「明治14年（1881年）2月に堺県が廃止され大阪府の管轄となった」とする）。これにより大阪府の管轄は河内・和泉・大和3か国の全域を加えた広域となった（学術論文）。","- 1887年11月4日：奈良県（第2次）が大阪府から分離して再設置された。根拠法令は明治20年勅令第59号「奈良縣設置ノ件」（第3便でWikisource（底本『官報』1887年11月10日）により本文を確認済み）。初代県知事は税所篤（堺県令だった人物）（Wikipedia「堺県」）。学術論文も「奈良県は、20年11月大阪府から分離独立」とする。","堺県合併の理由（出典の記載）：学術論文「大阪府の成立と地方自治の原型」は、第一の理由を大阪府の管轄区域の狭さ（「東西12km、南北40㎞余りしかなかった」）、第二の理由を財政問題（明治14年度から府庁舎修築費や監獄・土木の諸経費が地方税支弁となり、管轄区域の狭い大阪府の財政難が見込まれた）とし、合併当時の地租は大阪府581,859円に対し堺県は約2.6倍、人口は大阪府55万人に対し堺県94万人だったと記す（堺県の地租の正確な額は、取得したPDFの文字が判読できず未確認）。堺市公式「新しい時代へ 変わりゆく近代の美原」 https://www.city.sakai.lg.jp/mihara/miryoku/konnamachi/kunorekishi/rekishikiko/kindai/atarasiijidaihe.html のコラムは「東京・京都・大阪府の3府の内、最も狭小で、財政が弱かった大阪府を補強するため、わずか県治14年にして廃県、大阪府へ編入された」と記す。Wikipedia「堺県」は「府域が極めて狭い上、……経済の地盤沈下に直面していた大阪府を、『府』にふさわしい規模にするために行われたと考えられている」と記す（ただし記事には出典不十分のテンプレートがある）。"],"tables":[]},{"h":"c-3. 照合結果","lv":3,"text":["照合できたもの（公的・自治体出典とWikipedia・学術論文で一致）","- 大阪府の設置：1868年（慶応4年）5月2日（旧暦）に大阪裁判所を改めて設置（大阪府公文書館「大阪あーかいぶず第35号」・歴史講座資料、大阪府公式「府議会のあゆみ」、Wikipedia「堺県」、学術論文）。","- 堺県の成立：1868年（慶応4年）6月22日（旧暦）（大阪府公文書館「大阪あーかいぶず第35号」・歴史講座資料、Wikipedia「堺県」）。","- 奈良県の堺県への合併：1876年（明治9年）4月18日（大阪府公文書館「大阪あーかいぶず第35号」、Wikipedia「堺県」）。","- 堺県の大阪府への合併（廃止）：1881年（明治14年）2月7日（大阪府公文書館「大阪あーかいぶず第35号」、大阪府公式「府議会のあゆみ」、Wikipedia「堺県」）。","- 廃藩置県時点の全国の府県数「3府302県」、第1次府県統廃合後「3府72県」、1881年時点で「3府38県（堺県を大阪府に統合）」（大阪府公文書館歴史講座資料）。","照合できなかったもの","- 国立公文書館／アジア歴史資料センター（JACAR）：検索では太政類典や「記録材料・太政官布告」（レファレンスコード A07060003500 など）のコレクションには到達したが、第1次府県統合（堺県の統合）・堺県の大阪府合併・奈良県設置に関する個別の文書そのものには到達できず、未確認（照合未実施）として扱う。日付の照合は大阪府公文書館・大阪府公式の資料とWikipedia・学術論文の範囲で完了した。","- 高槻県・麻田県の統合日（1871年12月31日（明治4年11月20日））：タウンガイド大阪（その他）の記載のみで、日本語版Wikipediaでの照合は未実施（下記「取得不可」）。","- 第1次府県統合における堺県発足の布告日と実施日の区別：出典上は明治4年11月22日が統合の日とされ、布告日との区別は明記されていない（未確認）。"],"tables":[]},{"h":"注記・食い違い（c）","lv":3,"text":["1. 堺県成立時の管轄範囲：大阪府公文書館「大阪あーかいぶず第35号」は「慶応4(1868)年6月22日、河内・和泉両国を管轄する堺県が成立した」と記す。これに対しWikipedia「堺県」の沿革は、発足当時の管轄を「堺市街地一円と和泉国内4郡の郡村」とし、河内国の編入は1869年9月7日（明治2年8月2日）の河内県廃止に伴うものとする。食い違い（記述の差異）として両方を併記する。なおWikipedia「堺県」の冒頭文の旧版（他サイトに転載されたもの）は「和泉国および河内国の一部の旧幕府領・旗本領を管轄するために設置」としていた。","2. 大阪府設置時の管轄：大阪府公文書館「大阪あーかいぶず第35号」は「慶応4(1868)年5月2日に設置された大阪府は、現在の府域の内、摂津7郡を管轄するに過ぎなかった」と記す。一方、学術論文は、明治2年には大阪府の管轄は大阪市街地だけとなり、明治4年11月の府県大改革で大阪市街地と摂津7郡を管轄することになったとする。摂津7郡の管轄が設置当初からか明治4年11月以降かで記述に差異があるため併記する。","3. 堺県の初代知事の名：Wikipedia「堺県」は「堺役所判事だった小河一敏が初代堺県知事となった」とする。大阪府公文書館歴史講座資料は「同年5月9日、小河弥右衛門が大阪府判事として堺役所在勤」「大阪府判事小河が堺県知事に」とする。名の表記が異なるため食い違いとして両方を併記する。","4. 第1次府県統合で堺県に統合された県の数：Wikipedia「堺県」は「堺県、伯太県、岸和田県、吉見県、丹南県が統合され、改めて堺県が発足」（堺県を含む5県）とする。堺市公式「堺県庁跡」 https://www.city.sakai.lg.jp/kanko/rekishi/bunkazai/bunkazai/shokai/bunya/shiseki/oldkencho.html は「同4年には伯太（はかた）、岸和田、吉見、丹南4県を……合併」とし、堺市公式のコラムも「伯太・岸和田・丹南・吉見の4県を統合」とする。これは堺県自身を数えるかどうかの数え方の違いとみられるが、出典の表記どおり両方を併記する。","5. 大阪鎮台設置日の西暦換算：Wikipedia「堺県」は「正月22日（2月12日）」とするが、同記事の他の換算（正月10日＝2月3日、正月27日＝2月20日）とは整合しないため、この日の西暦換算は未確認として扱う。","6. Wikipedia「堺県」には出典が不十分である旨のテンプレートが付されている。日付については上記のとおり大阪府公文書館資料で照合できた範囲を c-3 に分けて記した。"],"tables":[]},{"h":"取得不可（c）","lv":3,"text":["- Wikipedia「廃藩置県」 https://ja.wikipedia.org/wiki/廃藩置県 — 取得を試みたが、取得ツール側のレート制限（HTTP 429）のため取得不可。このため、高槻県・麻田県の発足・統合に関する日本語版Wikipediaの表での照合は未実施。","- Wikipedia「豊崎県」 https://ja.wikipedia.org/wiki/豊崎県 — 同じくレート制限（HTTP 429）のため取得不可。摂津県の設置日・豊崎県への改称日・廃止の日レベルの日付は未確認（月レベルでは学術論文による）。","- 国立公文書館／アジア歴史資料センター（JACAR）の個別文書（第1次府県統合・堺県合併に関する太政官布告・太政類典所収文書）：検索ではコレクションの目録までは到達したが、該当文書そのものには到達できず、取得不可（未確認）として扱う。","---"],"tables":[]}],"d":[{"h":"d. 府名の由来","lv":2,"text":["出典：","- 「大阪府の成立と地方自治の原型」（大阪教育大学リポジトリ収録論文） https://osaka-kyoiku.repo.nii.ac.jp/record/2085319/files/koumin_1_003.pdf （取得日2026-11-18、種別：その他（学術論文）。以下「学術論文」）","- Wikipedia「大阪」 https://ja.wikipedia.org/wiki/大阪 （取得日2026-11-18、種別：Wikipedia。本文はミラーサイト newikis https://newikis.com/ja/大阪 経由で確認したため補助扱いとする。ミラーサイト自体は出典としない）","- 大阪府公式「府議会のあゆみ」 https://www.pref.osaka.lg.jp/o170010/gikai_giji/aramashi/ayumi.html （取得日2026-11-18、種別：自治体）","- 大阪府公文書館 歴史講座資料「大阪府の成立とその発展」 https://archives.pref.osaka.lg.jp/search/image/h26Re-text.pdf （取得日2026-11-18、種別：自治体）","- 学研キッズネット「おおさか〖大阪（府）〗」 https://kids.gakken.co.jp/jiten/dictionary01500145/ （取得日2026-11-18、種別：その他（辞典））","- 「大阪は歴史的には『大坂』！」（Maido／大阪観光情報サイト） https://maido-bob.osaka/2022/12/07/osaka-writings/ （取得日2026-11-18、種別：その他）","- 由来タイム「『大阪府』の由来とは」 https://zikanwakaran.jp/?p=220 （取得日2026-11-18、種別：その他）"],"tables":[]},{"h":"d-1. 府名「大阪府」の由来（事実として出典に記されるもの）","lv":3,"text":["大阪府公式サイトには、府名の由来そのものを説明するページは今回の検索範囲では確認できなかった（未確認）。大阪府公式「府議会のあゆみ」は「慶応4年（1868年）の5月、大阪裁判所（現在の司法裁判所ではなく、行政一般を司る役所）を改め、大阪府が設置されました」と記すのみである。","学術論文は次のとおり記す。「大阪府の名称の由来については、確実な史料があるわけではないが、上述のとおり、近世の大坂三郷の地に大阪鎮台・大阪裁判所が設置され、府庁も同じ地（大阪裁判所であった2月2日、津村別院から東大組内本町橋詰町の元西町奉行所跡に移転）に置かれたためであることは間違いないであろう。」","また「府」とされた経緯については、大阪府公文書館歴史講座資料が「明治2（1869）年7月17日太政官布告：『府』は『京都・東京・大阪に限る』」と記し、学術論文も「当初は全国に9府あったが、翌明治2年には東京・大阪・京都の3府を残し、ほかはすべて県に改められた」「大阪府の管轄区域・機構はその後大きく変化するが、大阪府の名称だけは変わることがなく、今日まで連綿として続くことになる」と記す。"],"tables":[]},{"h":"d-2. 地名表記「大坂」から「大阪」への変遷","lv":3,"text":["「大坂」の初出","学術論文：「『おおさか』の地名の史料上の初見は、明応5年（1496）蓮如上人の『消息』である。それによると、同年蓮如が83歳の秋に、『摂州東成郡生玉之庄内、大坂トイフ在所』に坊舎を建て、隠居寺としたとある。後の石山本願寺がこれである。」","Wikipedia「大阪」：「この漢字の地名に関する最古の記録は、1496年、浄土真宗中興の祖である蓮如によって書かれた御文の中に見られる『摂州東成郡生玉乃庄内大坂』との記載である。」","なお、由来タイムは「1498年（明応7年）の蓮如の手紙に『大坂』が登場」とし、年が異なる（下記「注記・食い違い」参照）。","それ以前の表記と発音","学術論文：「『厳助往年記』天文元年（1532）6月5日の条に『小坂大騒動』、また同永禄4年（1561）3月28日の条には、『小坂』の本願寺で親鸞上人三百年忌法会を行ったという記事があり、当時は『大坂』あるいは『小坂』と書いて、ともに『おさか』と発音していたようである。近世に入ると、『大坂』が一般的に用いられ、発音も『おおさか』に変わる。」","Wikipedia「大阪」：蓮如以前の大坂は「オホサカ」ではなく「ヲサカ」と発音されており、諸資料にも「小坂（おさか）」と表記された例が見られる（正安3年（1301年）刊の『宴曲抄』に「九品津小坂郡戸の王子」が言及されており、これが大坂に比定される。また『日本書紀』には烏瑳箇とある）。","「大阪」表記の出現と江戸時代の用例","学術論文が挙げる「大阪」の用例（石刻・印刷物）：「箕面市の用水路で発見された『安永八年（1779）牧之荘寺井新十郎』の銘がある道標には『大阪城五里』とあり、堺市の百舌鳥八幡宮にある天明3年（1783）の石灯籠には『大阪住はなや文治郎』、大阪市内住吉神社の同6年（1786）の石灯籠にも『大阪庭講中』と見える。印刷物では、寛政2年（1790）刊行の『謳字引』の奥付に『大阪心斎橋筋北久太郎町浪華書林』と記され、文化3年（1806）には『増脩改正摂州大阪地図』が出ている。」同論文はこれらを「例えば」と列挙しており、このうち最も古い用例は安永8年（1779年）の道標である。同論文は「このようにして、坂と阪が混用されたが、もともと坂と阪は同じ字で、阪は説文すなわち漢字の成立と原義を解き明かすための形であり……そこから坂の字が生まれたから、当時、坂と阪の混用が問題とされることはなかった」と記す。","Wikipedia「大阪」：「漢字の表記は当初『大坂』が一般的だったが、江戸時代後期頃から『大阪』とも書くようになった。浜松歌国が文化5年（1808年）に執筆した『摂陽落穂集』巻一には、『或人のいはく大坂と書くに坂の字を用ゆる事心得あるべし坂の字は土扁に反るといふ土にかへるとあるゆへ忌みきらひ阝（コザト）扁に書くべきとあり』と書いてあり、19世紀初頭には『大阪』と書く人が相当数いたことが示唆されている。」","明治期の扱いと統一の経緯","学術論文：「明治時代になっても、この近世の慣用はそのまま継承された。大阪府が成立してから阪の字を用いるように命じた布令や布達は一切なく、明治元年5月から12月までの間の府の布達では、大阪府より大坂府が圧倒的に多く使用され、2年・3年にはそれが逆転するものの、坂・阪の混用は後を絶たなかった。4年知事となった渡辺昇は、公文書に『大坂府知事』と肩書きし、官職印は『大阪府知事渡辺昇』と刻んだものを使用する無頓着さであった。さらに、13年知事に就任した建野郷三にいたっては、肩書・官職印とも坂の字を用いていた。現在、大阪府公文書館に架蔵されている文書に見るかぎり、明治30年代においても坂・阪の混用が知られる。教科書に関していえば、10年8月、大阪府師範学校の初代校長布施萬と同校二等訓導石井鉤三郎が著した『大阪府管内地誌略』には、大阪が22例、大坂が3例用いられている。また、37年の国定教科書『小学地理』一・二では、大坂府・大坂平野となっていた。これが阪の字に統一されたのは、43年の国定教科書『尋常小学校地理』巻一・二からであり、このころには大阪の用字がほぼ完全に定着していたと考えられる。」","Wikipedia「大阪」：「元来の『大坂』に代わって『大阪』が正式な表記となったのは、明治維新後の1868年、新政府がもとの大坂三郷に大阪府を置いたこのころである」としつつ、『大阪市史』巻1（昭和2年再版）の引用として「大阪府庁所用の官印に、大阪府印、大坂府印の両様あるを以て見れば、坂阪二字の變更は偶然に起こりしにて、必ずしも深き理由ありしにあらざるべし」と記す。","Maido（大阪観光情報サイト）：「『大阪府』が正式の地名になってからも、急に社会に定着したわけではなく、しばらくは『大坂』表記も併用され、官報ですら遅れて明治20年前後から『阪』の文字に変わったらしく、明治半ばごろになって、ようやく『大阪』が一般に定着したようです。」また『広辞苑』の見出しについて「おおさかと、両方が併記され、『古称、難波。室町時代には小坂（おさか）・大坂といい、明治初期以降、大阪に統一』と載っています」と記す。"],"tables":[]},{"h":"d-3. 地名「大阪（大坂）」の語源（諸説。いずれも仮説であり、確定した事実ではない）","lv":3,"text":["- 大きな坂があったとする説：Wikipedia「大阪」は「その語源は、大きな坂があったために大坂という字が当てられたという説があるが、蓮如以前の大坂は『オホサカ』ではなく『ヲサカ』と発音されており、諸資料にも『小坂（おさか）』と表記された例が見られる……このためにこの説は信憑性に乏しい」と記す。","- 上町台地の傾斜地形によるとする見方：学術論文は「この地名の由来は、上町台地北端の傾斜した地勢によるものと判断され、ごく小さな地域の呼び名にすぎなかった」と記す。","- 「小坂」から「大坂」への改称（好字化）とする説：由来タイムは『精選版 日本国語大辞典』の説として、石山本願寺の完成を祝して「小坂」の呼び名を改称し新しく「大坂」と呼ぶようになったとする説を紹介する。Maido（大阪観光情報サイト）も、国が編纂した百科事典『古事類苑』地部を引き、「大坂は、元は『小坂』、あるいは『尾坂』と呼ばれていたが、明応年間（1492～1501）のころから、『大坂』と表記するようになったと考える」とする。","- 辞典の扱い：学研キッズネット「おおさか〖大阪（府）〗」は府名の由来について「地形からきた名ともいわれるが，はっきりしない。江戸（えど）時代までは，小坂または大坂と書いた。明治（めいじ）になって，坂が阪にあらためられ，大阪となった」と記す。","- 「坂」から「阪」への変更の理由とされる説：Wikipedia「大阪」は「一説に『坂』から『阪』への変更は、明治新政府が『坂』が『士が反する』、すなわち武士が叛く（士族の反乱）と読めることから『坂』の字を嫌ったともいわれる」と記す（一説として紹介されるもので、確定した事実ではない）。江戸時代の『摂陽落穂集』（文化5年・1808年）の記述では、「坂」は「土に反る＝土に返る」ため忌み嫌って「阪」と書くべきだとされていた（d-2参照）。ただし学術論文は、明治期に阪の字を用いるよう命じた布令・布達は一切なかったと記し（d-2参照）、『大阪市史』は変更を「偶然」とする見方を示している。"],"tables":[]},{"h":"注記・食い違い（d）","lv":3,"text":["1. 蓮如の文書の年：学術論文およびWikipedia「大阪」は、初見を明応5年（1496年）の蓮如の消息・御文とする。これに対し由来タイムは「1498年（明応7年）の蓮如の手紙に『大坂』が登場」とする。食い違いとして両方を併記する。なおMaido（大阪観光情報サイト）が引く御文章の文面には「去ぬる明応第五の秋下旬のころより……当年は、はや既に三年の星霜をへたりき」とあり、明応5年の出来事を3年後に記した文面とも読めるが、文書自体の成立年について出典間で一致していないため、ここでは決めない。","2. 「大阪」が正式表記となった時期の表現：Wikipedia「大阪」は1868年の大阪府設置のころに正式な表記となったとするが、学術論文は、明治元年の府の布達では「大坂府」が圧倒的に多く、混用は明治30年代まで続き、用字の統一は明治43年の国定教科書からとする。府名としての採用（1868年）と社会的な表記の定着（明治半ば〜明治43年）とは別の段階として、両方を併記する。","3. 語源の「大きな坂」説への評価：一般に広く紹介される説だが、Wikipedia「大阪」は発音（ヲサカ）と「小坂」表記の存在から「信憑性に乏しい」とし、学研キッズネットは「はっきりしない」とする。確定した語源は出典上も定まっていない。","4. Wikipedia「大阪」の本文はミラーサイト（newikis）経由で確認したものであり、記事自体の直接取得は今回行っていない（補助扱い）。"],"tables":[]},{"h":"取得不可（d）","lv":3,"text":["- 大阪府公式サイトの府名の由来を説明するページ：検索範囲では該当ページを確認できず、取得不可（未確認）。大阪府公式で確認できたのは「府議会のあゆみ」の設置の記述のみ。","- Wikipedia「大阪」 https://ja.wikipedia.org/wiki/大阪 の直接取得：今回は行わず、ミラーサイト経由の確認にとどまる（出典としては補助扱い）。","- 国立公文書館／アジア歴史資料センター（JACAR）の「大阪府」命名に関する個別文書：到達できず、未確認（照合未実施）。","---"],"tables":[]}],"e":[{"h":"e. 有名な城","lv":2,"text":["出典（取得日はいずれも2026-11-18）：","- Wikipedia「大坂城」 https://ja.wikipedia.org/wiki/大坂城 （種別：Wikipedia）","- Wikipedia「岸和田城」 https://ja.wikipedia.org/wiki/岸和田城 （種別：Wikipedia）","- Wikipedia「高槻城」 https://ja.wikipedia.org/wiki/高槻城 （種別：Wikipedia）","- Wikipedia「千早城」 https://ja.wikipedia.org/wiki/千早城 （種別：Wikipedia）","- 文化遺産オンライン「千早城跡」（文化庁「国指定文化財等データベース」の転載） https://bunka.nii.ac.jp/heritages/detail/161678 （種別：公的）","- コトバンク「国指定史跡ガイド 千早城跡」 https://kotobank.jp/word/千早城跡-1444432 （種別：その他）","- Wikipedia「飯盛山城」 https://ja.wikipedia.org/wiki/飯盛山城 （種別：Wikipedia）","- 大東市・四條畷市「史跡飯盛城跡保存活用計画」（令和6年3月） https://www.city.daito.lg.jp/uploaded/life/54095_136551_misc.pdf および第3章 https://www.city.daito.lg.jp/uploaded/life/54095_136558_misc.pdf （種別：自治体）","- Wikipedia「芥川山城」 https://ja.wikipedia.org/wiki/芥川山城 （種別：Wikipedia）","- Wikipedia「現存天守」 https://ja.wikipedia.org/wiki/現存天守 （種別：Wikipedia）","- 堺市「堺の歴史的風致に関する資料（堺環濠都市区域）」（堺市公式サイト掲載PDF） https://www.city.sakai.lg.jp/kanko/rekishi/bunkazai/bunkazai/rekimachi/gijiroku_haifu/rekimachi_shiryo_23.files/rekishi_fuchi_shiryo_12_04.pdf （種別：自治体）"],"tables":[{"cols":["番号","名称","読み","築城者","築城年","廃城年または現状","現存・再建建物","出典の種別"],"rows":[["1","大坂城（豊臣期）","おおさかじょう","豊臣秀吉","1583年（天正11年）","1615年（慶長20年）の大坂夏の陣で落城し、豊臣氏は滅亡した（記事）。豊臣大坂城の遺構は現在多くが埋没している","天守は複合式もしくは連結式望楼型5重6階地下2階（1585年築）、いずれも非現存。徳川大坂城本丸の地中に埋没している豊臣大坂城詰ノ丸の石垣は、2025年（令和7年）4月1日に開館した「豊臣石垣館」の地下展示室で見ることができる（記事）","Wikipedia"],["2","大坂城（徳川期）","おおさかじょう","徳川秀忠（主な改修者。再築工事は1620年（元和6年）開始、3期足かけ9年の普請で1629年（寛永6年）に完成）","再築1620年〜1629年。天守は独立式層塔型5重5階地下1階（1626年築）","廃城年1868年（明治元年）。徳川期の天守は1665年（寛文5年）正月2日の落雷で焼失し、再建されなかった","現存：江戸時代初期から後期にかけて建てられた櫓や門、蔵など建物13棟および内堀と外堀（13棟は国の重要文化財）。現在の天守は1931年（昭和6年）にSRC造で復興された独立式望楼型5重8階で、国の登録有形文化財（1997年登録）。城跡は国の特別史跡","Wikipedia"],["3","岸和田城","きしわだじょう","信濃泰義か（基礎情報欄）。伝承では楠木正成の甥・和田高家（注記参照）","応永年間（1394年-1428年）","明治4年（1871年）。文政10年（1827年）に天守を焼失し、以降再建されないまま廃城とされ、まもなく破却された","遺構：石垣、堀。再建：復興天守（昭和29年・1954年再建、連結式望楼型3重3階）、復興櫓・門（昭和44年・1969年）。指定：城跡は大阪府史跡、本丸庭園は国の名勝","Wikipedia"],["4","高槻城","たかつきじょう","近藤忠範","10世紀末（990年に近藤忠範が久米路山と呼ばれる小丘に築城したのが始まりと言われているが「確証はない」と記事にある）","明治7年（1874年）（基礎情報欄）。本文では「明治4年（1871年）7月、廃藩置県により廃城。明治7年（1874年）には破却が始まり」とする（注記参照）","天守は三重三階天守（非現存）。現存建物は城内の建造物を移築した本行寺門および永井神社唐門（野見神社境内）。再建：復元石垣、模擬天守台。指定：大阪府指定史跡","Wikipedia"],["5","千早城","ちはやじょう","楠木正成","元弘2年/正慶元年（1332年）","明徳3年（1392年）。1392年（明徳3年）正月、楠木正勝の時に北朝方の畠山基国に攻められ落城した（記事）","再建造物なし。遺構：曲輪、空堀。指定：国の史跡（1934年（昭和9年）3月13日指定。文化庁データベースでも指定年月日1934.03.13を確認）","Wikipedia／公的"],["6","飯盛山城","いいもりやまじょう（国史跡の指定名称は「飯盛城跡」、読みは「いいもりじょうあと」。大東市・四條畷市の保存活用計画による）","佐々目憲法か木沢長政（基礎情報欄）","建武年間（1334年-1338年）","天正4年（1576年）。天正4年（1576年）に落城し廃城となった（記事）","再建造物なし。天守構造は「なし」。遺構：石垣・竪堀・畝状竪堀群・堀切・井戸跡。指定：国の史跡（2021年（令和3年）10月11日指定、2022年11月10日・2023年3月20日に追加指定。大東市・四條畷市の保存活用計画で照合）","Wikipedia／自治体"],["7","芥川山城","あくたがわさんじょう","細川高国","永正12–13年（1515–1516年）","元亀4年（1573年）頃","再建造物なし。天守構造は「なし」。遺構：曲輪、堀切、石垣、土塁、土橋、虎口。指定：国の史跡（指定名称は「芥川城跡」。文化審議会の答申は2022年6月17日、指定は令和4年11月10日文部科学省告示第141号。いずれも記事の脚注による）","Wikipedia"]]}]},{"h":"城ごとの注記","lv":3,"text":["1・2. 大坂城","- 記事冒頭：「大坂城または大阪城（おおさかじょう）は、現在の大阪府大阪市中央区大阪城（上町台地の先端、摂津国東成郡生玉荘大坂）にあった、安土桃山時代に築かれ、江戸時代に再築された日本の城。別称は錦城（きんじょう、金城とも表記）。」","- 豊臣期と徳川期の違い（記事）：「1583年（天正11年）から1598年（慶長3年）にかけて豊臣秀吉が築いた大坂城（豊臣大坂城）の遺構は、現在多くが埋没しており、地表に見ることのできる大坂城の遺構は、1620年（元和6年）から1629年（寛永6年）にかけて徳川秀忠が大規模な修築を施した大坂城（徳川大坂城）の遺構である。」","- 現在の天守について（記事）：「天守は1931年（昭和6年）に鉄骨鉄筋コンクリート（SRC）構造で、徳川時代に再建された天守台石垣の上に資料の乏しい豊臣時代の天守閣を想像し大坂夏の陣図屏風絵などを参考に模擬復興された創作物であるが、1997年（平成9年）に国の登録有形文化財となり、博物館『大阪城天守閣』として営業している。」","- 指定の年次（記事）：「1953年（昭和28年）…3月31日、大坂城跡が国の史跡に指定される。6月11日、大手門、千貫櫓、乾櫓など建造物13棟が重要文化財に指定される」「1955年（昭和30年）6月24日、大坂城跡が国の特別史跡に指定される」。特別史跡の範囲は「城跡は710,000平方メートルの範囲が国の特別史跡に指定されている」。","- 徳川期の天守の寿命について記事は「天守は39年と短命だった」とする。検算：1626年築、1665年焼失で39年となり、一致する。","- 強い表現の引用（記事）：「文献等にもよるが、日本三名城の一つに数えられる（他の二つは名古屋城、姫路城、熊本城の内から挙げられる場合が多い）」。","3. 岸和田城","- 別名は千亀利城（ちきりじょう）。記事：「本丸庭園は国の名勝、城跡は大阪府の史跡に指定されている」。略年表では「昭和18年（1943年）大阪府史跡に指定される」、本丸庭園（八陣の庭）は「国の名勝（平成26年10月6日指定）」とある。","- 天守の変遷（記事）：『岸城古今記』には天守が慶長2年（1597年）に竣工したと記している（記事）。文政10年（1827年）11月20日落雷によって消失し、再建されなかった。現在の天守は「昭和29年に市民の寄付や旧城主の子孫である岡部氏の要望などにより再建された」もので、連結式望楼型3重。当時の天守は5層で「当時の天守の高さは18間あり、今の天守より約10mは高かったと思われている」と記事にある。","- 岸和田古城との区別：記事によれば、平成時代の発掘調査で、現在の岸和田城跡から約500m南東に15世紀後半に築かれた山城（岸和田古城）が確認されており、現在の岸和田城とは別の城である。","4. 高槻城","- 別名は入江城（いりえじょう）、久米路山龍ヶ城。","- 本格的な城塞化は天正元年（1573年）から（記事概要）。元和3年（1617年）に土岐定義が城主となると「高槻城は完全な近代城郭として改修した」と記事にある。","- 天守について記事は「本丸にあった三重の天守は焼失したとの記録がないため、幕末まで存在した可能性がある」とする。","- 指定について、記事の脚注は出典として「『高槻城』高槻市公式HP」を挙げている（指定自体は大阪府指定史跡）。指定年は今回取得した出典では確認できなかった（未確認）。","5. 千早城","- 別名は金剛山城、楠木詰城など。記事：「四方を絶壁に囲まれ要塞堅固を誇ったといわれる連郭式山城である。金剛山城。楠木七城の一つ。」","- 文化庁「国指定文化財等データベース」（文化遺産オンライン転載）でも、名称「千早城跡」、種別「史跡」、指定年月日「1934.03.13（昭和9.03.13）」、管理団体「千早赤阪村（昭9・5・18）」を確認した。","- コトバンク「国指定史跡ガイド」は「1934年（昭和9）の建武中興600年を機に、上・下赤阪城跡、金剛寺境内、観心寺境内などとともに国の史跡に指定された」とする。","- 年数の検算：記事は落城をもって「61年に及ぶ歴史に幕を閉じた」とする。築城1332年から1392年の差は60年で、数え年では61年となり、記事の表現は数え年によるものとみられる（記事の文言をそのまま転記した）。","6. 飯盛山城","- 大東市・四條畷市「史跡飯盛城跡保存活用計画」によれば、指定名称は「飯盛城跡（いいもりじょうあと）」、令和3年（2021年）10月11日に文部科学省告示第164号で史跡に指定され、令和4年（2022年）11月10日と令和5年（2023年）3月20日に追加指定があった。同計画の指定説明文は「飯盛城跡は、大阪府と奈良県の境を南北に連なる生駒山地の北支脈である飯盛山（標高314.3メートル）に築かれた戦国時代（16世紀中頃）の城跡」とする。なおWikipedia記事は標高を315.9mとする（保存活用計画の314.3mと異なる。両方を併記する）。","- 規模について記事は「全盛期には、南北に1200m、東西に500mに達し、70以上の曲輪が確認されている」とする。一方、保存活用計画は「城域は東西約400m、南北約700mを測り」とする。測り方の違いによるものかは出典に明記がなく、両方を併記する。","7. 芥川山城","- 記事：「当時の呼称は『芥川城』であるが、同じ高槻市殿町周辺にあった城も『芥川城』と呼ばれており、『高槻市史』が便宜上、三好山にあった城を『芥川山城』と呼称した」。殿町周辺の芥川城とは別の城である。","- 記事：「芥川山城は飯盛山城と共に大阪府下では最も規模が大きな城跡で、遺構の残存状態も良好で戦国時代の典型的な山城である」（記事の文言そのまま）。","- 年数の検算：記事は廃城をもって「60年にわたる歴史を閉じたとされる」とするが、築城1515〜1516年から廃城1573年頃までの差は57〜58年で、記事の「60年」とは一致しない。記事の文言をそのまま転記し、ここに注記する。"],"tables":[]},{"h":"関連項目：堺の環濠（城ではない）","lv":3,"text":["出典：堺市公式サイト掲載資料「堺環濠都市区域」（種別：自治体、取得日2026-11-18）。","- 「和泉と摂津の国境に成立した堺は、中世に勘合・南蛮貿易によって栄えた港町である。」","- 中世の環濠について：「濠は都市外周を囲う『総（惣）構え堀』的な環濠のみならず、都市内部を縦横に走る内堀も存在しており、この景観を見た当時のヨーロッパの宣教師は『堺はベネチアの如く・・・』と表現している」「この時期堺は、有力町衆によって構成された会合衆による自由都市として発展する。」","- 江戸時代の環濠について：「中世の都市域は、慶長20年（＝元和元年・1615）の大坂夏の陣で全焼」し、「その後徳川幕府の天領（直轄地）として、都市域は中世よりも一回り大きく拡大し、全域が統一的な町割プランに再編され『元和の町割り』と呼ばれている」「濠は都市域拡大後の外周に、新たに江戸期の環濠が掘り直された」。","- 現在の区域：「慶長20年（1615）の大坂夏の陣後に徳川幕府の天領として整備された旧市街地である堺環濠都市地域は、南北3Km、東西1Kmの周辺を環濠で囲まれるエリアである」「周辺を囲む環濠は現在、北端は市道三宝高須線、東端は阪神高速となって濠割が失われているものの、南端、西端には環濠の面影をとどめる」。"],"tables":[]},{"h":"現存天守の確認結果","lv":3,"text":["結論：大阪府内に現存天守はない。","- 根拠：Wikipedia「現存天守」は「現存天守とは、日本の城の天守のうち、江戸時代またはそれ以前に建設され、現代まで保存されている天守のことである。12の天守が現存している」とし、現存12天守として弘前城（青森県）、松本城（長野県）、丸岡城（福井県）、犬山城（愛知県）、彦根城（滋賀県）、姫路城（兵庫県）、松江城（島根県）、備中松山城（岡山県）、丸亀城（香川県）、松山城（愛媛県）、宇和島城（愛媛県）、高知城（高知県）を挙げる。大阪府の城は含まれていない。","- 本表の城についても個別に確認した。大坂城の天守はいずれも「非現存」で現在は1931年の復興天守、岸和田城は1954年の復興天守、高槻城の天守は「非現存」、千早城・飯盛山城・芥川山城に再建天守はない。"],"tables":[]},{"h":"注記・食い違い（e）","lv":3,"text":["1. 岸和田城の築城者：Wikipediaの基礎情報欄は「信濃泰義か」とする（本文は『日本城郭大系』によると信濃泰義によって現在地に移築されたとする）。一方、楠木正成の甥・和田高家が築城したという伝説があったが、Wikipedia本文は「かつては、楠木正成の甥和田高家という人物が岸和田城を築城したという伝説があった。しかし、これらの文献の出典を遡っても江戸時代初期にまでしか到達せず、しかも岸和田に城があったことを示す最初の一次史料は後述の永禄元年（1558年）に三好氏が同城に入ったことを記した浄心院快栄書状まで下る」とし、伝承として扱っている。両方を併記する。","2. 岸和田城への岡部宣勝の入城年：Wikipedia本文には「寛永17年（1631年）、高槻城より岡部宣勝が入城し」とあるが、寛永17年は1640年であり、同記事の略年表は「寛永17年・1640年・松平康重転封後、高槻城より岡部宣勝が入城する」とする。記事内の西暦表記が食い違っているため、そのまま併記する。","3. 高槻城の廃城年：基礎情報欄は「明治7年（1874年）」とするが、本文は「明治4年（1871年）7月、廃藩置県により廃城。明治7年（1874年）には破却が始まり」とする。廃藩置県による廃城（1871年）と破却開始（1874年）の両方を併記する。","4. 千早城の落城年：Wikipediaは廃城年を明徳3年（1392年）とし、1392年正月に畠山基国に攻められ落城したとする。一方、文化庁「国指定文化財等データベース」の千早城跡の解説文には「元中元年楠木正勝■ニ攻メ落サルヽニ及ビ以後廢墟トナレリ」（■は欠字）とあり、元中元年は1384年にあたる。食い違いとして両方を併記する。","5. 飯盛山城の築城：基礎情報欄は築城主を「佐々目憲法か木沢長政」、築城年を建武年間（1334年-1338年）とするが、本文は「この城の始まりは、佐々目憲法（僧正憲法）が南北朝時代に築いたとされているが（『河内志』）、これは河内国ではなく紀伊の飯盛山城であるとも指摘されている」とする。両方を併記する。","6. 飯盛山の標高：Wikipedia「飯盛山城」は315.9m、大東市・四條畷市「史跡飯盛城跡保存活用計画」の指定説明文は314.3mとする。食い違いとして両方を併記する。","7. 芥川山城の存続年数：記事の「60年にわたる歴史」という表現は、築城年（1515〜1516年）と廃城年（1573年頃）の差（57〜58年）と一致しない（上記注記参照）。"],"tables":[]},{"h":"取得不可（e）","lv":3,"text":["- 岸和田市公式サイト「岸和田城」 https://www.city.kishiwada.osaka.jp/soshiki/36/kishiwadajyo.html — テキスト取得がエラーとなり内容を確認できなかった。このため岸和田城の指定（大阪府史跡・国の名勝）や年次はWikipedia記事の記載によるもので、市の公式での照合はできていない。","- 大阪城天守閣の公式サイトおよび高槻市公式サイトの「高槻城」ページ — 今回は直接の取得を行わなかった。大坂城の特別史跡・重要文化財の指定年次はWikipedia記事による（高槻城については、Wikipedia記事の脚注が出典として高槻市公式HPを挙げている）。","---"],"tables":[]}],"f":[{"h":"f-1 江戸時代","lv":3,"text":["出典：","- 大阪府公式「堺打刃物／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o110070/mono/dento/dento16.html （取得日2026-11-18、種別：自治体）","- 大阪府公式「堺線香／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o110070/mono/dento/dento18.html （取得日2026-11-18、種別：自治体）","- 八尾市公式「資料６ 国登録文化財 意見具申用所見（木村家住宅）」 https://www.city.yao.osaka.jp/_res/projects/default_project/_page_/001/025/241/data6.pdf （取得日2026-11-18、種別：自治体）","- 八尾市公式「第２章 高安千塚古墳群を取り巻く環境」 https://www.city.yao.osaka.jp/_res/projects/default_project/_page_/001/011/399/02-1.pdf （取得日2026-11-18、種別：自治体）","- 堺市立図書館「平成28年度堺歴史文化市民講座 河内木綿」（読み「かわちもめん」の出典） https://www.lib-sakai.jp/oshirase/2016/kawachimomen1106.pdf （取得日2026-11-18、種別：自治体）","- 大阪府公式「なにわの伝統野菜／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120090/nosei/naniwanonousanbutu/dentou.html （取得日2026-11-18、種別：自治体）※同ページは「発祥時期」を品目ごとに明記しており、江戸時代と記された品目を本表に入れた","- 近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、取得日2026-11-18、種別：公的）※泉州水なすの「地域との結びつき」欄","- 日本植物油協会「植物油information」 https://www.oil.or.jp/info/96/page02.html （取得日2026-11-18、種別：その他）"],"tables":[{"cols":["番号","品目","読み","産地","備考（出典の引用）","出典の種別"],"rows":[["1","堺打刃物","さかいうちはもの","大阪市、堺市（大阪府ページ「主な産地」）","「安土桃山時代、煙草庖丁の製造が堺で始まり、江戸時代初期には、出刃庖丁、料理庖丁が製造され、全国的にその地位を確立した。さらに江戸時代後期には、生花鋏・植木鋏等の製造が行われ、それぞれ専業者が株仲間を組織し産地を形成した。」（大阪府公式）","自治体"],["2","堺線香","さかいせんこう","堺市（大阪府ページ「主な産地」）","「16世紀終わり頃、線香製法が伝わり、わが国最初の線香が堺で作られ、江戸時代には、すでに産地として名を成している。」（大阪府公式。大阪府知事指定伝統工芸品、指定年月日は昭和61年2月5日）","自治体"],["3","河内木綿","かわちもめん（堺市立図書館の講座案内に「か わ ち も め ん」と振り仮名）","河内地方（中河内一帯。八尾市）","「宝永元年（1701）の大和川付替えにより中河内一帯が大綿作地になると、木綿仲買組の八尾組に名を連ね、河内木綿商として繁栄を築くことになる。」（八尾市公式・木村家住宅の所見。木村家についての記述）。八尾市公式の別の資料では、1704年（宝永元年）の大和川付け替え後の新田開発で「砂地に適した河内木綿が栽培され、全国的に著名な産地となった」旨が記される（同資料の文章は取得テキストが断片化しており、文言の逐語確認は未確認）","自治体"],["4","泉州水なす","センシュウミズナス（近畿農政局GIページの表記）","泉州地域（GIの生産地は下記f-2参照）","「江戸時代初期から泉州地域で栽培されており、他地域で栽培すると形質が変わると言われ、同地域の門外不出の特産品とされていた。」（近畿農政局GIページ「地域との結びつき」）","公的"],["5","難波葱","なんばねぎ","大阪市","発祥時期「江戸時代」。「大阪市難波周辺で江戸時代からさかんに栽培されていたことから『難波葱』と呼ばれる。」（大阪府公式「なにわの伝統野菜」）","自治体"],["6","毛馬胡瓜","けまきゅうり","大阪市","発祥時期「江戸時代」。「大阪市都島区毛馬町が起源とされる黒いぼきゅうり。果実は長さが約30センチメートル、太さ約3センチメートルで、果実の先端部よりの3分の2は淡緑白色からやや黄色気味となり、末端部には独特の苦みがある。果肉は歯切れよく、奈良漬けに重宝されていた。」（大阪府公式）","自治体"],["7","玉造黒門越瓜","たまつくりくろもんしろうり","大阪市","発祥時期「江戸時代」。「大阪城の玉造門（黒門）付近が発祥地。」（大阪府公式）","自治体"],["8","勝間南瓜","こつまなんきん","大阪市","発祥時期「江戸時代」。「大阪市西成区玉出町（旧勝間村）が発祥地。」（大阪府公式）","自治体"],["9","金時人参","きんときにんじん","大阪市","発祥時期「江戸時代」。「江戸時代から昭和初期にかけて大阪市浪速区付近の特産であり、『大阪人参』と呼ばれていた。」（大阪府公式）","自治体"],["10","大阪しろな","おおさかしろな","大阪市","発祥時期「江戸時代」。「江戸時代から栽培が始まり、大阪市の天満橋付近で栽培が盛んだったため、『天満菜(てんまな)』とも呼ばれる。」（大阪府公式）","自治体"],["11","天王寺蕪","てんのうじかぶら","大阪市","発祥時期「江戸時代」。「大阪市天王寺付近が発祥で、葉の切れ込みが深い切葉と葉の切れ込みが浅く葉の形が丸い丸葉の2系統がある。いずれも根は純白扁平で甘味が強く、肉質が緻密である。蕪が地面から浮き上がったように成長することから『浮き蕪』とも呼ばれていた。」（大阪府公式）","自治体"],["12","田辺大根","たなべだいこん","大阪市","発祥時期「江戸時代」。「大阪市東住吉区の田辺地区の特産であった白首(しろくび)大根。」（大阪府公式）","自治体"],["13","服部越瓜","はっとりしろうり","高槻市","発祥時期「江戸時代」。「高槻市の塚脇地区で江戸時代から栽培されている。」（大阪府公式）","自治体"],["14","鳥飼茄子","とりかいなす","摂津市","発祥時期「江戸時代」。「摂津市の鳥飼地区で江戸時代から栽培されている丸なす。」（大阪府公式）","自治体"],["15","三島独活","みしまうど","茨木市","発祥時期「江戸時代」。「茨木市を中心に三島地域で江戸時代から栽培されている。」（大阪府公式）","自治体"],["16","吹田慈姑","すいたくわい","吹田市","発祥時期「江戸時代」。「吹田市で江戸時代以前から自生していたクワイ。」（大阪府公式）","自治体"],["17","高山真菜","たかやままな","豊能町","発祥時期「江戸時代」。「豊能町高山地区で江戸時代から栽培されているアブラナ科のつけな類。」（大阪府公式）","自治体"],["18","高山牛蒡","たかやまごぼう","豊能町","発祥時期「江戸時代」。「豊能町高山地区で江戸時代から栽培されている牛蒡。」（大阪府公式）","自治体"],["19","菜種油（遠里小野・摂津）","読みは出典に明記なし（未確認）","摂津国遠里小野村（現・大阪市住吉区遠里小野とされる地名。ただし出典ページに現行地名の明記はなく、この対応は未確認）","「江戸時代になると菜種の生産が広がり、江戸幕府は菜種生産を奨励しました。1600年代には遠里小野村で長木より効率的な搾油道具である『搾め木』（しめぎ）が開発され、遠里小野村の油生産が再び活気を取り戻し、攝津一帯が菜種油の産地として繁栄を迎えることとなりました。この油は、菱垣廻船で江戸に運ばれ『下り油』として珍重され」た（日本植物油協会）","その他"]]}]},{"h":"f-2 現代","lv":3,"text":[],"tables":[]},{"h":"（1）経済産業大臣指定 伝統的工芸品","lv":4,"text":["出典：伝統的工芸品産業振興協会「伝統的工芸品指定品目一覧・都道府県別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-area_20251027.pdf （2025／令和7年10月27日現在、全国合計244品目、取得日2026-11-18、種別：公的）","同協会「伝統的工芸品指定品目一覧・業種別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （2025／令和7年10月27日現在、取得日2026-11-18、種別：公的）※業種の出典","大阪府は「9」品目と明記され、並びは「浪華本染め　大阪欄間　大阪唐木指物　大阪泉州桐箪笥　大阪金剛簾　堺打刃物　大阪浪華錫器　大阪仏壇　いずみガラス」である。","注記（f-2（1））：","- 候補に挙がっていた「堺五月鯉幟」は、2025年10月27日現在の都道府県別一覧の大阪府9品目には含まれていない。","- 表記の揺れ：「大阪泉州桐箪笥」（協会一覧）と「大阪泉州桐簞笥」（特許庁資料を紹介する二次資料の表記）が併存する。協会の公式一覧の表記は「大阪泉州桐箪笥」である。"],"tables":[{"cols":["番号","品目","読み","産地","備考（業種は業種別一覧による）","出典の種別"],"rows":[["1","浪華本染め","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では染色品の部に記載","公的"],["2","大阪欄間","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載","公的"],["3","大阪唐木指物","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載","公的"],["4","大阪泉州桐箪笥","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載。表記は「大阪泉州桐箪笥」（「簞笥」とする資料もあり、表記の揺れ。下記注記参照）","公的"],["5","大阪金剛簾","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では木工・竹工品の部に記載","公的"],["6","堺打刃物","一覧に記載なし（未確認）。なお大阪府公式ページでは「さかいうちはもの」と読みが明記されている","一覧に記載なし（未確認）。なお大阪府公式ページの「主な産地」は大阪市、堺市","業種別一覧では金工品の部12番目に記載。大阪府公式ページによれば指定年月日は昭和57年3月5日","公的／自治体"],["7","大阪浪華錫器","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では金工品の部13番目に記載","公的"],["8","大阪仏壇","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧では仏壇・仏具の部に記載","公的"],["9","いずみガラス","一覧に記載なし（未確認）","一覧に記載なし（未確認）","業種別一覧ではその他の工芸品の部に記載","公的"]]}]},{"h":"（2）地理的表示（GI）","lv":4,"text":["出典：近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在、近畿18産品、取得日2026-11-18、種別：公的）","注記（f-2（2））：","- 近畿農政局のプレスリリース（令和7年1月30日登録分）では「今回の登録により、大阪府のGI登録産品は2産品となりました」とされており、大阪府分は上記2件である。","- 酒類の地理的表示「大阪」（ぶどう酒）は国税庁長官の指定であり、農林水産省のGI登録産品一覧（本表）とは制度が別である。近畿農政局のGI・知的財産のページに「近畿地域では、『灘五郷』、『はりま』、『和歌山梅酒』、『大阪』、『滋賀』、『伊丹』、『京都』が指定されています。（令和7年10月現在）」とあるため、混同しないようここに注記する。"],"tables":[{"cols":["番号","品目","読み","登録番号","登録日","生産地","登録生産者団体","出典の種別"],"rows":[["1","富田林の海老芋","トンダバヤシノエビイモ","第137号","令和5年7月20日","大阪府富田林市（彼方、西板持、東板持、南大伴、北大伴、錦織）","富田林市海老芋振興協議会（一覧表の表記は「富田林海老芋振興協議会」、詳細欄の表記は「富田林市海老芋振興協議会」。両表記を併記する）","公的"],["2","泉州水なす","センシュウミズナス（別表記として Sensyu Mizunasu、OSAKA MIZUNASU、大阪紫晶茄が詳細欄に併記）","第161号","令和7年1月30日","大阪府岸和田市、泉大津市、貝塚市、泉佐野市、和泉市、高石市、泉南市、阪南市、泉北郡忠岡町、泉南郡熊取町、田尻町及び岬町","全国農業協同組合連合会","公的"]]}]},{"h":"（3）地域団体商標","lv":4,"text":["出典：近畿農政局「地域団体商標の活用について」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （「近畿における農林水産物・食品の地域団体商標（令和6年1月現在）」、取得日2026-11-18、種別：公的）","※同ページは「近畿管内において地域団体商標を取得し、『ブランド』の保護を図っている農林水産物・食品をご紹介します」と対象を農林水産物・食品に限っており、より新しい近畿版一覧は同ページ上では確認できなかった（令和6年1月現在が同ページの最新時点）。","注記（f-2（3））：","- 候補に挙がっていた「泉州タオル」「堺刃物」は、上記の近畿農政局一覧（農林水産物・食品に対象を限ったもの）には含まれていない。工芸品・繊維製品を含む地域団体商標の全体像は特許庁の所管であり、同ページも「最新の全ての地域団体商標の案内は特許庁へ」と案内している。特許庁資料を紹介する二次資料によれば「泉州タオル」は2007年に、「堺打刃物」「堺刃物」は平成19年（2007年）10月5日に地域団体商標登録されたとされるが、特許庁の原資料での直接確認は今回できていないため、ここでは未確認として記す。なお「堺打刃物」については大阪府公式ページ自体に「平成19年10月5日（地域団体商標）」と明記がある（f-1出典と同じページ）。","- 読みは近畿農政局の一覧PDF（下記）の検索結果に表示された抜粋によるもので、PDF本文の直接取得は失敗した（取得不可参照）。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","八尾若ごぼう","やおわかごぼう（近畿農政局の一覧PDFの表記による。下記注記参照）","一覧に記載なし（未確認）","農林水産物・食品に限った一覧での大阪府分3件のうちの1件","公的"],["2","泉州水なす","せんしゅうみずなす（同上）","一覧に記載なし（未確認）","GI（第161号）と重なる品目","公的"],["3","泉だこ","いずみだこ（同上）","一覧に記載なし（未確認）","同上","公的"]]}]},{"h":"（4）大阪府公式の認証制度","lv":4,"text":["制度1：なにわの伝統野菜認証制度","出典：","- 大阪府公式「なにわの伝統野菜認証制度／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120090/nosei/naniwanonousanbutu/ninteiseido.html （取得日2026-11-18、種別：自治体）","- 大阪府公式「なにわの伝統野菜認証要領」 https://www.pref.osaka.lg.jp/documents/29195/080512yoryo.pdf （平成17年9月6日施行、令和8年5月12日一部改正、種別：自治体）","- 大阪府公式「なにわの伝統野菜／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120090/nosei/naniwanonousanbutu/dentou.html （取得日2026-11-18、種別：自治体）","対象品目26件（大阪府公式ページの並び・表記のとおり。発祥時期も同ページの記載どおり）：河内一寸空豆（明治時代）、石川早生芋（飛鳥時代）、海老芋（大正時代）、河内れんこん（明治時代）、大阪黒菜（明治時代）、馬場なす（大正時代）、貝塚澤茄子（室町時代）、堺 鷹の爪（明治時代）、難波葱（江戸時代）、毛馬胡瓜（江戸時代）、玉造黒門越瓜（江戸時代）、勝間南瓜（江戸時代）、金時人参（江戸時代）、大阪しろな（江戸時代）、天王寺蕪（江戸時代）、田辺大根（江戸時代）、芽紫蘇（明治時代）、服部越瓜（江戸時代）、鳥飼茄子（江戸時代）、三島独活（江戸時代）、吹田慈姑（江戸時代）、泉州黄玉葱（明治時代）、高山真菜（江戸時代）、高山牛蒡（江戸時代）、守口大根（安土桃山時代）、碓井豌豆（明治時代）。","※このうち発祥時期が江戸時代とされた13品目（難波葱〜高山牛蒡の該当分）はf-1の表にも入れた。守口大根は発祥時期が「安土桃山時代」とされているためf-1には入れていない。","制度2：大阪産（もん）／大阪産（もん）名品","出典：大阪府公式「『大阪産(もん)』『大阪産(もん)名品』ロゴマーク等手続き一覧／大阪府ホームページ」 https://www.pref.osaka.lg.jp/o120110/ryutai/osaka_mon/osakamon_logo.html （取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["項目","内容（出典の記載どおり）"],"rows":[["制度名","なにわの伝統野菜認証制度"],["開始","「大阪府で平成17年10月からスタートした本認証制度」（大阪府公式ページ）。要領の附則は「この要領は、平成１７年９月６日から施行する」"],["目的（要領第1条）","「古くから府内で生産され、大阪の農業と食文化を支えてきた歴史、伝統をもつ独特の野菜を『なにわの伝統野菜』として認証することで、伝統野菜を府民に広く魅力発信するとともに、地産地消を進め、大阪農業の理解促進と振興を図る」"],["定義（要領第2条）","次の（1）から（3）を全て満たす野菜。（1）昭和初期以前（概ね100年前）から大阪府内で栽培されてきた野菜。（2）苗、種子等の来歴が明らかで、大阪独自の品目、品種、栽培方法によるもの、又は府内特定地域の気候風土に育まれたものであり、栽培に供する苗、種子等の確保が可能な野菜。（3）現在も府内で生産されている野菜"],["対象品目数","26品目（大阪府公式ページ「なにわの伝統野菜26品目」。「令和8年5月より、『河内一寸空豆』をなにわの伝統野菜として新たに認証し、合計26品目となりました」）"],["認証期間","「認証マークの使用は承認後5年間です」。ただし「難波葱、河内一寸空豆については承認後3年間」"]]},{"cols":["項目","内容（出典の記載どおり）"],"rows":[["大阪産(もん)とは","「大阪府内で生産された農林水産物とそれらを使った加工品のことです。上記に当てはまるものはすべて大阪産(もん)ですが、ロゴマークの使用許可等を申請することで、ロゴマークを使ったPR販売等が可能となります」"],["大阪産(もん)名品とは","「『天下の台所・大阪』で長く愛され続けている、お土産や贈り物にもおすすめの加工食品です。伝統や大阪らしさなど、複数の項目を審査し、認証されたもののみが大阪産(もん)名品となります。現在お菓子やお惣菜、お酒や調味料を含む幅広い品目の300商品以上が認証されています」"],["両者の違い","「大阪産（もん）名品は、大阪府内産原材料の使用を前提としていない点で大阪産（もん）とは異なります」が、「大阪の食のブランドとして、大阪産（もん）との一体感を出すため同じロゴを使用しています」"]]}]},{"h":"注記・食い違い（f-1）","lv":3,"text":["- 泉州タオルは江戸時代の表に入れない。 起源は明治時代である。泉佐野市観光サイト「泉州タオル館 本店」 https://visitizumisanojpn.com/senshu-towel-hall/ （種別：自治体）に「1887年（明治20年）、大阪府泉佐野市（当時の佐野村）にて、当時、白木綿業を営んでいた里井圓次郎氏が海外製のタオルを目にし、『打出機』の開発に成功したのが始まりです」とある。現代の地域団体商標についてはf-2の注記参照。","- 大阪の地酒（下り酒）：大阪府酒造組合の記述として「江戸時代、大阪は天下一の酒どころでした。摂津・河内・和泉と呼ばれた三州から江戸に向けて大量の酒が運び込まれ、『下り酒』としてもてはやされた」と紹介する二次資料（日本酒の教科書 https://sakesoul.jp/osaka-jizake/ 、種別：その他）は確認できたが、組合公式ページの原文を直接取得できていないため、本表には入れず、ここに未確認として記す。","- 『日本山海名物図会』『日本山海名産図会』『摂津名所図会』の原文そのものからの引用は、今回の取得範囲では確認できなかった（下記「取得不可」参照）。国立国会図書館レファレンス協同データベースの事例（柴島晒）では、『摂津名所図会大成』に「此辺淀河の流れをくみて布木綿をさらす。是を國嶋晒といふ」とある旨が紹介されている（ https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000354392 、種別：公的）。柴島晒（くにじまさらし）は河内木綿の晒しに関するものであるが、原典の逐語確認が取れていないため本表には入れていない。","- 河内木綿について、八尾市公式の2資料で大和川付替えの年が「1704年（宝永元年）」（高安千塚古墳群資料）と「宝永元年（1701）」（木村家住宅所見）と併存する。宝永元年は1704年であり、「1701」は資料側の表記のまま転記した（食い違いとして併記）。"],"tables":[]},{"h":"取得不可（f-1）","lv":3,"text":["- 『摂津名所図会』『日本山海名物図会』の原典テキスト：大阪市立図書館デジタルアーカイブ等への到達を試みたが、今回の取得では本文の逐語引用が可能な形で取得できず、取得不可として扱う（上記のとおりレファレンス事例経由の紹介のみ確認）。","- 大阪府酒造組合公式サイトの「下り酒」に関する原文ページ：直接取得できず、取得不可（二次資料のみ確認）。"],"tables":[]},{"h":"取得不可（f-2）","lv":3,"text":["- 近畿農政局「近畿における農林水産物等の地域団体商標一覧（PDF）」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/attach/pdf/chiikidanntai-2.pdf — 取得を試みたが、取得ツール側のレート制限（HTTP 429）のため本文を直接取得できず、取得不可として扱う。大阪府分の品目名は同局のHTMLページ（令和6年1月現在）で確認し、読みは検索結果に表示された同PDFの抜粋によった。","- 特許庁の地域団体商標の原資料（泉州タオル・堺刃物の登録情報）：今回の取得範囲では原資料に到達できず、取得不可（二次資料の紹介のみ確認、上記注記参照）。","---"],"tables":[]}],"g":[{"h":"g. 旧国の制度","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「河内国」 https://ja.wikipedia.org/wiki/河内国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「和泉国」 https://ja.wikipedia.org/wiki/和泉国 （取得日2026-11-18、種別：Wikipedia）","- 住吉大社公式サイト「住吉大社の由緒」 https://sumiyoshitaisha.net/about/origin.html （取得日2026-11-18、種別：その他）※「摂津国一之宮」の称のみ","- 坐摩神社公式サイト https://www.ikasuri.or.jp/ 、大阪府神社庁「坐摩神社（いかすりじんじゃ）」 https://www.osaka-jinjacho.jp/funai_jinja/dai7shibu/chuo-ku/07001ikasurijinja.html （取得日2026-11-18、種別：その他）※読みの確認","- 枚岡神社公式サイト https://www.hiraoka-jinja.org/ （取得日2026-11-18、種別：その他）※「河内国一之宮」の称","- 大鳥大社公式サイト https://www.ootoritaisha.jp/ （取得日2026-11-18、種別：その他）※「和泉國一之宮」の称","- Wikipedia「住吉大社」 https://ja.wikipedia.org/wiki/住吉大社 ／Wikipedia「大鳥大社」 https://ja.wikipedia.org/wiki/大鳥大社 （取得日2026-11-18、種別：Wikipedia）※読み"],"tables":[]},{"h":"表：摂津国","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g1","摂津国の等級","―","上国（記事の基礎情報欄「国力：上国」）","なお、易林本の『節用集』に摂津は「南暖北寒、故五穀先熟、魚鹽繁、大上國也」と記されている（記事「地域」の項）","Wikipedia"],["g2","摂津国府","―","国府所在地を記した文献は次の通り。『和名抄』（平安時代中期成立）では、記載はない。『拾芥抄』（鎌倉時代中期から南北朝時代成立）では、「西生郡」。『節用集』（室町時代中期成立）では、「西成郡」。一方、史書からは次のように推定される。難波京（大阪市天王寺区国分町）、延暦24年（805年）江頭（大阪市中央区か）（『日本後紀』）、天長2年（825年）豊島郡（『日本後紀』）、承和11年（844年）旧鴻臚館（『続日本後紀』）、12世紀 住吉区。記事の基礎情報欄は「1.（推定）大阪府大阪市天王寺区 2.（推定）大阪府大阪市中央区」とする","文献と推定地が複数あり、国府所在地は確定していない（記事は複数の推定を併記する）","Wikipedia"],["g3","摂津国一宮（1）","すみよしたいしゃ（住吉大社）","住吉大社（大阪府大阪市住吉区住吉）。記事の基礎情報欄「一宮」にも挙がる。神社公式サイトも「摂津国一之宮 住吉神社の総本社」とする","ただし、記事は「中世に住吉大社が一宮を自称した文書はない」と注記する","Wikipedia／その他（神社公式）"],["g4","摂津国一宮（2）","いかすりじんじゃ（坐摩神社）","坐摩神社（大阪府大阪市中央区）。記事の基礎情報欄「一宮」に住吉大社とともに挙がる。「坐摩神社（大阪市中央区）は『全国一の宮会』に加盟しており、近世以降こちらも一宮と呼ばれるようになっているが、社勢は住吉大社に及ばなかったとされる。二宮以下も不詳である」（記事）","読み「いかすりじんじゃ」は大阪府神社庁の紹介ページおよび神社公式サイトのドメイン表記による","Wikipedia／その他（大阪府神社庁・神社公式）"],["g5","摂津国総社","―","総社：不詳。難波神社とする説がある（記事）","―","Wikipedia"],["g6","摂津国分寺","―","後継寺院は以下の2説。創建時の遺構はいずれも明らかでないが、天王寺の国分寺付近からは瓦が出土している。天徳山国分寺（大阪府大阪市天王寺区国分町）、護国山（金剛院）国分寺（大阪府大阪市北区国分寺）。記事の基礎情報欄は「1.（推定）大阪府大阪市天王寺区 2.（推定）大阪府大阪市北区」とする","2説併記","Wikipedia"],["g7","摂津国分尼寺","―","（天平）勝宝山法華寺（大阪府大阪市東淀川区柴島町）が後継寺院と推定され、境内には国分尼寺のものという礎石が伝わる。記事の基礎情報欄は「（推定）大阪府大阪市東淀川区」とする","―","Wikipedia"],["g8","延喜式内社（参考）","―","『延喜式神名帳』には、大社26座16社・小社49座46社の計75座62社が記載されている","原史料『延喜式』を引く記載","Wikipedia"]]}]},{"h":"表：河内国","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g9","河内国の等級","―","大国（記事の基礎情報欄「国力：大国」）","―","Wikipedia"],["g10","河内国府","―","国府所在地を記した文献は次の通り。『和名抄』（平安時代中期成立）では、「志紀郡」。『拾芥抄』（鎌倉時代中期から南北朝時代成立）では、「大縣郡（大県郡）」。『節用集』（室町時代中期成立）では、「丹北郡」。国府は、現在の大阪府藤井寺市国府・惣社にある国府遺跡と推定されている。ただし、奈良時代の間に一度移動しているとされる（どちらも現在の藤井寺市内）。記事の基礎情報欄は「大阪府藤井寺市」とする","文献により郡が異なる（食い違い、両論併記）","Wikipedia"],["g11","河内国一宮","ひらおかじんじゃ（枚岡神社）","枚岡神社（大阪府東大阪市出雲井町）。神社公式サイトも「河内国一之宮」を称する","ただし、実際に「一宮」と呼ばれるようになるのは近世以後である（記事）。また片埜神社（大阪府枚方市）も「河州一ノ宮」を名乗っているが、実際には交野郷一宮であったものが河内一宮と混同されたものとされる。二宮には恩智神社（大阪府八尾市恩智中町）が挙げられることがあるが、これは河内国第2位の勢力を持っただけで、神社制度としての二宮となった訳ではなく、二宮と呼ばれるようになるのも近世以後である。三宮以下はない（記事）","Wikipedia／その他（神社公式）"],["g12","河内国総社","―","志貴県主神社（大阪府藤井寺市惣社）。惣社のある土地にこの神社が移ってきたという説と国府の近くにあったので惣社になったという説がある（記事）","―","Wikipedia"],["g13","河内国分寺","―","河内国分寺跡（大阪府柏原市国分東条町）。僧寺は天平期に創建、南北朝時代のころに廃れたとされる","記事の基礎情報欄は「大阪府柏原市（河内国分寺跡）」とする","Wikipedia"],["g14","河内国分尼寺","―","尼寺は同じく柏原市国分東条尼寺にあったと推定されているが、平安時代には荒廃していたと考えられている。記事の基礎情報欄は「（推定）大阪府柏原市」とする","―","Wikipedia"],["g15","延喜式内社（参考）","―","『延喜式神名帳』には、大社23座13社・小社90座80社の計113座93社が記載されている","原史料『延喜式』を引く記載","Wikipedia"]]}]},{"h":"表：和泉国","lv":3,"text":[],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g16","和泉国の等級","―","下国（記事の基礎情報欄「国力：下国」）","―","Wikipedia"],["g17","和泉国府","―","国府所在地を記した文献は次の通り。『和名抄』（平安時代中期成立）では、「和泉郡」。『拾芥抄』（鎌倉時代中期から南北朝時代成立）では、「和泉郡」。『節用集』（室町時代中期成立）では、「和泉郡」。国府跡は、現在の大阪府和泉市府中町の府中遺跡とされる。記事の基礎情報欄は「大阪府和泉市」とする","現在の大阪府和泉市の市名は、かつて市内府中町に国府があったことに由来する（記事）","Wikipedia"],["g18","和泉国一宮","おおとりたいしゃ（大鳥大社）","大鳥大社（大阪府堺市西区鳳北町）。正式には大鳥神社。神社公式サイトも「和泉國一之宮 大鳥大社」とする。二宮は泉穴師神社（大阪府泉大津市豊中町）、三宮は聖神社（大阪府和泉市王子町）、四宮は積川神社（大阪府岸和田市積川町）、五宮は日根神社（大阪府泉佐野市日根野）","日根神社は「1501年の文書には四宮と記されている」（記事）。読み「おおとりたいしゃ」はWikipedia「大鳥大社」の冒頭による","Wikipedia／その他（神社公式）"],["g19","和泉国総社","―","五社総社（大阪府和泉市府中町）。泉井上神社境内。国府そばにあり、五宮までの神が祀られている（記事）","―","Wikipedia"],["g20","和泉国分寺","―","和泉国分寺跡（大阪府和泉市国分町）。国分寺推定跡地上に、後継寺院の護国山福徳寺が所在する","―","Wikipedia"],["g21","和泉国分尼寺","―","記事の基礎情報欄は「（未詳）」とする。和泉国内には、僧寺だけで尼寺は設置されなかったと推察されている（記事）","―","Wikipedia"],["g22","延喜式内社（参考）","―","『延喜式神名帳』には、大社1座1社・小社61座52社の計62座53社が記載されている。大社1社は大鳥郡 大鳥神社で、名神大社である","原史料『延喜式』を引く記載","Wikipedia"]]}]},{"h":"注記・食い違い（g）","lv":3,"text":["1. 摂津国一宮（両論併記）：住吉大社と坐摩神社の両方が一宮とされる。摂津国記事の基礎情報欄も両社を併記する。住吉大社については「中世に住吉大社が一宮を自称した文書はない」と記事が注記し、坐摩神社については「近世以降こちらも一宮と呼ばれるようになっている」と記事が記す。","2. 摂津国府は確定していない：文献（『拾芥抄』＝西生郡、『節用集』＝西成郡、『和名抄』＝記載なし）と史書からの推定地（難波京、江頭、豊島郡、旧鴻臚館、住吉区）が複数あり、記事は確定した所在地を示していない。","3. 河内国府の文献上の所在地（食い違い）：『和名抄』＝志紀郡、『拾芥抄』＝大県郡、『節用集』＝丹北郡と文献により異なる。推定地は藤井寺市内の国府遺跡とされるが、奈良時代の間に一度移動しているとされる。","4. 和泉国分尼寺：基礎情報欄は「（未詳）」であり、記事は「僧寺だけで尼寺は設置されなかったと推察されている」とする。設置の有無自体が推察の域を出ない。","5. 等級の表記差：摂津国の等級は基礎情報欄では「上国」だが、易林本『節用集』には「大上國也」と記されている（記事が引用）。両方を併記する。","6. 一宮の読みのうち、住吉大社「すみよしたいしゃ」と大鳥大社「おおとりたいしゃ」はWikipediaの各神社記事の冒頭により、神社公式サイトのページ本文では読み仮名の明記を確認できなかった。坐摩神社「いかすりじんじゃ」は大阪府神社庁の紹介ページに明記がある。","---"],"tables":[]}],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"府名の由来（大坂→大阪）","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["旧国名・五畿七道はWikipediaのみが出典。府域が摂津・河内・和泉の3国にまたがる点は、大阪府公式で確認できていない。","摂津国の郡・郷数は、基礎情報欄が13郡78郷、列挙された12郡の郷数合計は75郷で食い違う（理由は未確認）。","和泉監の設置日は、河内国の記事（716年4月16日）と和泉国の記事（3月27日・4月13日）で食い違う。","716年・740年・757年などの日付は、暦の種別が出典に明記されていない（暦不明）。","堺は摂津・河内・和泉の3国にまたがる。1871年（明治4年）9月＝新暦11月12日に、摂津住吉郡の大和川以南が和泉に編入された。"],"b":["藩と藩主はWikipediaのみが出典。高槻藩・岸和田藩など、記事内で数字の食い違いがある（注記のとおり）。","藩主の読みは、各藩記事に明記があるものだけを載せている。小出秀政・岡部長職・北条氏恭ほかは未取得。","岸田藩（奈良の回の未取得分）は、今回も取得できなかった。内容は未確認。","枚方代官所は設置・管轄が未確認。大坂代官は大阪市史編纂所の紹介による。"],"c":["日付は、大阪府公文書館・大阪府公式と、Wikipedia・学術論文で照合した（大阪府の設置、堺県の成立、奈良県の合併、堺県の廃止）。国立公文書館（アジア歴史資料センター）での照合は未実施。","大阪鎮台の設置日は、Wikipediaの西暦換算（2月12日）が他の換算と合わない。計算上は1868年2月15日になるが、確認のため未確認として扱う。","河内県の発足「明治2年1月20日」は、西暦の月日換算が出典になく、暦不明。","堺県の成立時の管轄（河内・和泉両国か、和泉国内4郡のみか）が出典間で食い違う。","第1次統合で堺県にまとまった県の数は、Wikipediaが5県（堺県を含む）、堺市公式が4県で、数え方の違いとみられる。","高槻県・麻田県の統合日（1871年12月31日＝明治4年11月20日）は、タウンガイド大阪のみ。摂津県・豊崎県の日レベルの日付は未確認。"],"d":["府名「大阪府」の由来を説明した大阪府公式のページは見つからなかった。学術論文は「確実な史料はないが、大坂三郷の地に設置されたためであることは間違いないであろう」とする。","「大坂」の初見は、蓮如の文書で明応5年（1496年）とする説と、1498年とする説で食い違う。","「大阪」が府名になった1868年と、社会的に表記が定着した明治半ば〜明治43年とは別の段階。","語源の「大きな坂」説は、Wikipediaが「信憑性に乏しい」とする。語源はいずれも仮説で、確定していない。「坂」を「阪」に変えた理由（士が反する）も一説にとどまる。"],"e":["大阪府内に現存天守はない（大坂城・岸和田城は復興天守）。","千早城の史跡指定（1934年3月13日）は文化庁のデータベースで確認した。それ以外の城はWikipediaのみが出典。","千早城の落城年は、Wikipediaが1392年、文化庁の解説文が元中元年（1384年）で食い違う。","岸和田城：築城者は「信濃泰義か」で確定していない。岡部宣勝の入城年は「寛永17年（1631年）」と書かれているが、寛永17年は1640年。","芥川山城：記事の「60年」は、築城（1515〜1516年）から廃城（1573年頃）の差57〜58年と合わない。","高槻城の廃城年は1871年（廃藩置県）と1874年（破却開始）の両説。","堺の環濠は城ではないが、関連項目として載せている。"],"f":["江戸時代の名産は、大阪府公式・八尾市・堺市立図書館の資料で確認した。『摂津名所図会』などの原典の逐語引用は取得できていない。","泉州タオルの起源は明治20年（1887年）のため、江戸時代の表には入れていない。","伝統的工芸品9品目は協会の一覧で確認した（読み・産地は一覧にない）。","地域団体商標の一覧は令和6年1月時点で、農林水産物・食品に限る。泉州タオル・堺刃物は一覧に含まれない。","河内木綿の大和川付替えは、八尾市公式の2資料で1701年と1704年に割れている。"],"g":["旧国の制度はWikipediaのみが出典。一宮の称は神社公式サイトでも確認した。","摂津国府の所在地は、文献と推定地が複数あり確定していない。河内国府も『和名抄』『拾芥抄』『節用集』で郡が異なる。","摂津国の一宮は、住吉大社と坐摩神社の両説。","和泉国分尼寺は設置の有無自体が推察。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","大林組と日清食品は、発祥は大阪だが本社機能が東京のため、注記のみにしている。一方、武田薬品・クボタ・サントリーなどは本店が大阪のまま入れている。本店の所在地と本社機能の、どちらを基準にするかは未統一。","金剛組の創業578年は会社が伝える創業年。法人の設立年は、親会社の資料は2006年1月、Wikipediaは2005年11月1日で食い違う。","田辺三菱製薬の「田辺ファーマ」への商号変更は、公式で未確認。","シャープの本社所在地（堺市か大阪市中央区か）は、出典間で食い違う。","小林製薬は創業1886年（公式）。江崎グリコの設立年は1929年と1941年で食い違う。","日本生命・近鉄・阪急阪神・ミズノ・カプコンは、未収録（未確認）。"]},"h":[{"h":"出典","lv":2,"text":["- 武田薬品工業 公式サイト「ヒストリー」 https://www.takeda.com/jp/about/our-company/history/ （その他（企業公式））","- 塩野義製薬 公式サイト「ヒストリー」 https://www.shionogi.com/jp/ja/company/history.html （その他（企業公式））","- ロート製薬 公式サイト「沿革」 https://www.rohto.co.jp/company/history/ （その他（企業公式））","- ハウス食品 公式サイト「沿革」 https://housefoods.jp/company/information/history.html （その他（企業公式））","- 積水ハウス 公式サイト「会社概要」 https://www.sekisuihouse.co.jp/company/info/outline/ （その他（企業公式））","- 関西電力 公式サイト「会社概要」 https://www.kepco.co.jp/corporate/profile/outline.html （その他（企業公式））","- 大阪ガス 公式サイト「会社概要」 https://www.osakagas.co.jp/company/profile/index.html （その他（企業公式））","- クボタ 公式ニュースリリース（会社概要欄） https://www.kubota.co.jp/news/2021/management- のグループ経営","h-1と重複収録","その他（企業公式）・その他"],["6","ハウス食品グループ本社","―","創業1913年11月11日／設立1947年6月7日","大阪本社：東大阪市御厨栄町一丁目5番7号（登記上の本店）。東京本社：東京都千代田区紀尾井町6番3号","食品のグループ経営","h-1と重複収録。2本社体制","その他（企業公式）"],["7","クボタ","クボタ","創業1890年2月／設立1930年12月22日","大阪市浪速区敷津東一丁目2番47号。東京本社：東京都中央区京橋二丁目1番3号","農業機械、建設機械、エンジン、水道用鉄管等","h-1と重複収録","その他（企業公式）・Wikipedia"],["8","積水ハウス","せきすいハウス","設立1960年8月1日（積水ハウス産業株式会社として独立）","大阪市北区大淀中一丁目1番88号 梅田スカイビル タワーイースト","住宅","","その他（企業公式）"],["9","キーエンス","キーエンス","設立1974年5月27日","大阪市東淀川区東中島一丁目3番14号","FA用センサ、測定機器、電子応用機器の開発・設計・製造・販売","前身はリード電機。設立地は兵庫県尼崎市（Wikipedia）","Wikipedia"],["10","伊藤忠商事","いとうじゅうしょうじ","創業1858年（初代伊藤忠兵衛が麻布類の卸売業）／設立1949年12月1日","大阪本社：大阪市北区梅田3丁目1番3号（本店）。東京本社：東京都港区北青山2丁目5番1号","繊維、機械、金属、エネルギー・化学品、食料、住生活、情報・金融","2本社制","Wikipedia・その他"],["11","関西電力","かんさいでんりょく","設立1951年5月1日","大阪市北区中之島3丁目6番16号（本店）","電気事業、熱供給事業、電気通信事業、ガス供給事業等","","その他（企業公式）"],["12","大阪ガス","―","設立1897年4月10日／創業（事業開始）1905年10月19日","大阪市中央区平野町四丁目1番2号","ガス事業等（Daigasグループ）","設立と創業の前後関係は注記参照","その他（企業公式）"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 小林製薬の創業年（食い違い）：公式の沿革・有価証券報告書では「1886年2月創業」とする一方、マイナビの企業情報ではルーツを「1892年に名古屋で創業」と記載する。表では公式の1886年を採用し、両論をここに併記する。","- 江崎グリコの設立年（食い違い）：Wikipedia・コトバンク（日本の企業がわかる事典）は「1929年（昭和4年）2月に株式会社江崎を設立」とする一方、キャリアインサイトの企業概要は設立を「1941年（昭和16年）9月29日」と記載する。表では1929年2月を採用し、両論を併記する。","- シャープの本社所在地（食い違い）：2016年に本社を堺市堺区匠町1番地へ移転したとする出典が複数ある一方、2026年11月17日頃にクロールされたWikipediaのミラー（Newikis）では本社所在地を「大阪市中央区久太郎町2丁目1番25号」、設立を「1935年5月2日」と記載する。いずれが現行の記載かは未確認。表では堺市への移転を採用し、両論を併記する。","- 大阪ガスの設立と創業：公式の会社概要は「設立1897年4月10日」「創業（事業開始）1905年10月19日」と、設立が事業開始より先に来る形で記載している。出典どおりに両方を転記した。","- 田辺三菱製薬の商号変更（未確認）：商号が2025年12月より「田辺ファーマ株式会社」となることが公表されている旨の記載が二次資料（その他）にあるが、企業公式ページでの直接確認は未実施のため、表の社名は取得日時点の「田辺三菱製薬」とし、本件は未確認としてここに記す。","- 発祥は大阪府だが現在は本社機能が府外の企業（本体に入れず注記のみ）：","- 大林組（おおばやしぐみ）：1892年（明治25年）1月25日、大林芳五郎が大阪市西区靱南通四丁目（現・西本町二丁目）で土木建築請負業「大林店」を創業。設立は1918年（大正7年）12月（有価証券報告書の沿革では、1936年12月の株式会社第二大林組設立をもって当社の設立とする旨の記載もある）。2010年に登記上の本店および本社機能を東京へ移転し、現在は本社＝東京都港区港南二丁目15番2号（品川インターシティB棟）、大阪本店＝大阪市中央区北浜三丁目5番29号（日本生命淀屋橋ビル、2023年移転）の体制。出典：Wikipedia（Weblio転記）・コトバンク（その他）。","- 日清食品（日清食品ホールディングス）：1948年（昭和23年）9月4日、創業者・安藤百福が大阪府泉大津市に株式会社中交総社を設立（本店は泉大津市汐見町）。1958年12月に日清食品株式会社へ商号変更。1988年3月に東京支社を東京本社と改称し、2008年には本社機能を東京へ移転・集約した。現在の日清食品株式会社は東京本社＝東京都新宿区新宿6-28-1、大阪本社＝大阪市淀川区西中島4-1-1で、本店所在地は大阪市淀川区。持株会社の日清食品ホールディングスは「本社・東京、登記上本店・大阪」とされる。出典：有価証券報告書の沿革（転記）・Wikipedia（Weblio転記）。","- 今回未収録（本社が大阪府内の大手だが、本項目の調査時間内に裏取りできなかったため社名のみ）：日本生命保険、近鉄グループホールディングス、阪急阪神ホールディングス、ミズノ、カプコン。","- 金剛組の法人設立年：親会社（髙松コンストラクショングループ）のプレスリリースの会社概要は「設立 2006年1月（創業 飛鳥時代第30代敏達天皇7年（西暦578年））」とする一方、Wikipedia「金剛組」の基礎情報は「設立 2005年11月1日」とする。創業578年は両出典で一致する。表ではプレスリリースの2006年1月を採用し、両論をここに併記する。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 本項目（h）の調査で、取得不可となったページはない。","- ただし、田辺三菱製薬の商号変更（2025年12月〜「田辺ファーマ株式会社」）については企業公式ページでの直接確認が未実施のため、上記のとおり「未確認」として注記に記載した。"],"tables":[]}]},{"id":"hyogo","title":"兵庫県","sub":"旧摂津国（兵庫県域）・播磨・但馬・淡路・丹波国（兵庫県域）","meta":["取得日：2026-11-18（全出典共通）","範囲：兵庫県全域を1章で扱う。旧国は摂津（兵庫県域のみ）・播磨・但馬・淡路・丹波（兵庫県域＝丹波篠山市・丹波市）の5国。aとgは旧国ごとに表を分け、ほかは県単位でまとめる。日付は新暦を主にし、1872年末までは旧暦を括弧で併記する。","---"],"a":[{"h":"県域と旧国の対応（兵庫県公式による確認）","lv":2,"text":["出典：","- 兵庫県公式サイト「県域の変遷」 https://web.pref.hyogo.lg.jp/kk32/pa13_000000013.html （自治体）","- ひょうご歴史ステーション「ひょうご史Q&A」（兵庫県立歴史博物館） https://www.hyogo-c.ed.jp/~rekihaku-bo/historystation/rekihaku-meet/q-and-a/index.html （自治体）","- 取得日：2026-11-18","注記・食い違い：","- 兵庫県公式「県域の変遷」では、第3次兵庫県の見出しは「明治9年7月～」とあるが、本文は「明治9年(1876)8月、飾磨県と豊岡・名東両県の一部が兵庫県に併合」とあり、見出しと本文で月が食い違う（食い違い）。Wikipedia各国記事は第2次府県統合を1876年8月21日とする。","- 兵庫県公式サイト本体で旧国の郡数・制度まで記したページは確認できず、各国の詳細は兵庫県立歴史博物館のサイトおよびWikipedia等で補った。","---"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","兵庫県域を構成する旧国","―","「現在の兵庫県域は、摂津・丹波・但馬・播磨・淡路の５つの旧国を中心に構成されています」","神戸市の主要部分から三田市、阪神間にかけてが「摂津国全13郡のうち５郡」。丹波篠山市・丹波市は「丹波国６郡のうち２郡」に相当し「丹波国の残り４郡は京都府の中部を構成」。県域北部・日本海側は但馬国。神戸市垂水区・西区・北区から西の瀬戸内海沿岸部は播磨国。淡路島は島全体で淡路国","自治体"],["2","五国以外の旧国","―","赤穂市西部の福浦地区は1963年（昭和38）まで岡山県域で旧国は備前国。佐用郡佐用町北西部の旧石井村地区周辺も1896年（明治29）まで岡山県で旧国は美作国。「ですので、詳しくみると、現在の県域は旧国では七国にまたがることになります」","本章では五国を対象とし、備前・美作は扱わない","自治体"],["3","兵庫県の成立（県公式）","―","「兵庫県が播磨・但馬・淡路と、丹波・摂津の一部を加えた、五か国にまたがる大きな県」になった。第2次兵庫県（明治4年11月～）は「摂津の西部5郡を管地とするもの」。「明治9年(1876)8月、飾磨県と豊岡・名東両県の一部が兵庫県に併合されて、ほぼ現在の県域が確定しました」","1876年は改暦（1873年）後のため新暦","自治体"]]}]},{"h":"a-1 摂津国（兵庫県域）","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （Wikipedia）","- ひょうご歴史ステーション「ひょうご史Q&A」（兵庫県立歴史博物館） https://www.hyogo-c.ed.jp/~rekihaku-bo/historystation/rekihaku-meet/q-and-a/index.html （自治体）","- 取得日：2026-11-18","注記・食い違い：","- 郡数・郷数の食い違い：記事冒頭の諸元表は「13郡78郷」とするが、「郡」の節に列挙されるのは12郡で、その郷数を合計すると75郷となり、78郷と一致しない（検算済み。食い違い。理由は記事に記載がなく未確認）。13郡目にあたる百済郡は沿革に「天智天皇3年（664年）に百済郡が設置された」とあるが、「郡」の節の一覧には挙がっていない。","- 等級についてはg-1に記す（易林本『節用集』の「大上國也」の記載あり）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","摂津国","せっつのくに","令制国の一つ。畿内に属する。旧字体は「攝津國」。現在の大阪府北中部の大半と兵庫県南東部にあたる","もと「津国（つのくに）」と呼ばれた（難波津・住吉津があったため）","Wikipedia"],["2","別称","摂州（せっしゅう）","―","―","Wikipedia"],["3","所属","―","畿内","五畿の一つ","Wikipedia"],["4","郡・郷数","―","13郡78郷","記事冒頭の諸元表による。下記注記の食い違い参照","Wikipedia"],["5","郡名一覧","―","島上郡（全5郷）・島下郡（全4郷）・豊島郡（全7郷）・能勢郡（全3郷）・川辺郡（全8郷）・有馬郡（全5郷）・武庫郡（全8郷）・菟原郡（全8郷）・八部郡（全5郷）・西成郡（全12郷）・東成郡（全5郷）・住吉郡（全5郷）","記事「郡」の節に挙がるのは12郡。能勢郡は和銅6年（713年）に河辺（川辺）郡の一部を割いて設置。島上・島下両郡は古代三島郡が大宝元年（701年）に分割されて設置","Wikipedia"],["6","兵庫県域の郡","―","川辺郡・有馬郡・武庫郡・菟原郡・八部郡の5郡（郷数は川辺8・有馬5・武庫8・菟原8・八部5の計34郷）","兵庫県立歴史博物館「摂津国全13郡のうち５郡」と一致。明治4年11月20日（1871年12月31日）の第1次府県統合により、この5郡が兵庫県の管轄となった（Wikipedia）。神戸市のうち北区淡河町、須磨区須磨ニュータウン西部、垂水区の大部分、西区は播磨国に属する","Wikipedia／自治体"],["7","摂津職の経緯","せっつしき","壬申の乱に勝利した天武天皇が、難波宮を副都とし「国司を置く代わりに、津国を摂（管掌）する機関として特に摂津職を置いた」。摂津職は京官とされ、大夫・亮・進・属の四等官で構成された。長岡京遷都に伴い難波宮が解体され副都の実が失われたため、延暦12年（793年）3月9日に摂津職を廃し、新たに摂津国を置いた。「前身の摂津職から引き継いで『摂』の字を冠し、『せっつのくに』とも呼び、また元の津国の訓みそのままに『つのくに』とも呼んだ」","延暦12年3月9日は和暦表記のみの出典による（旧暦）。摂津大夫の任官は天武天皇6年（677年）の多比麻呂から見える","Wikipedia"],["8","百済郡","くだらのこおり（読みは記事に明記なし）","天智天皇3年（664年）に百済郡が設置された","記事「郡」の節の一覧には含まれない（下記注記参照）","Wikipedia"]]}]},{"h":"a-2 播磨国","lv":2,"text":["出典：","- Wikipedia「播磨国」 http://ja.wikipedia.org/wiki/播磨国 （Wikipedia）","- コトバンク「播磨国」『日本大百科全書（ニッポニカ）』 https://kotobank.jp/word/播磨国-117772 （その他（日本大百科全書））","- 取得日：2026-11-18","注記・食い違い：","- 郡名の表記差：Wikipediaは「加古郡」「美嚢郡」、『日本大百科全書』は「賀古」「美囊（みなき）」と表記する（食い違いではなく表記の差として併記）。","- 神戸市域の国境：現在の神戸市域では、須磨区を境に東部（長田区・兵庫区・中央区・灘区・東灘区の全域および須磨区・北区のそれぞれ大部分）が摂津国、西部（垂水区・西区の全域と北区・須磨区のそれぞれ一部）が播磨国であった（Wikipedia）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","播磨国","はりまのくに","令制国の一つ。山陽道に属する。相当領域は兵庫県南西部","―","Wikipedia"],["2","別称","播州（ばんしゅう）","「播」という漢字を「バン」と読むのは「播州」またはその省略形に限られ、本来の音読みは「ハ」である","―","Wikipedia"],["3","所属","―","山陽道","―","Wikipedia"],["4","郡・郷数","―","12郡98郷","―","Wikipedia"],["5","郡名一覧","―","明石郡・美嚢郡・加古郡・印南郡・賀茂郡・多可郡・飾磨郡・神崎郡・揖保郡・宍粟郡・佐用郡・赤穂郡の12郡","記事に「※はじめの郡名は『延喜式』による」と明記。近世以降、賀茂郡は加東郡・加西郡に、飾磨郡は飾東郡・飾西郡に、神崎郡は神東郡・神西郡に、揖保郡は揖東郡・揖西郡に分かれた形で記事に記載される。『日本大百科全書』では郡名を「明石，賀古，印南（いなみ），飾磨（しかま），揖保（いいぼ），赤穂，佐用，宍粟（しさわ），神崎，多可，賀茂，美囊（みなき）の12郡」とする（表記差あり。下記注記参照）","Wikipedia／その他（日本大百科全書）"],["6","国名表記の変遷","―","木簡では「針間国」・「幡麻国」と表記しているものもある。『日本大百科全書』によれば「国名は《古事記》《旧事本紀》等に〈針間〉と記され，播磨の表記が一般化するのは710年ころ以後である」。郡名も飾磨がもとは〈志加麻〉、宍粟が〈宍禾〉などと表記されていた（藤原宮出土木簡、『播磨国風土記』）","『播磨国風土記』冒頭に国名の由来があったと見られるが、冒頭部分が欠失しており明らかではない（Wikipedia）","Wikipedia／その他（日本大百科全書）"],["7","成立の経緯","―","「針間国（播磨中・西部）・明石国（東播磨・神明・三木地域）・針間鴨国（北部）が大化の改新以降に播磨国（針間国）へ編入されたと推定されている」。7世紀に成立。『旧事本紀』は律令制に基づく播磨国の成立以前に、明石国造・針間鴨国造・針間国造の3国造がいたとする（日本大百科全書）","『播磨国風土記』は713年（和銅6年）に編まれた風土記のうち、現在まで文献が残る五か国の一つ","Wikipedia／その他（日本大百科全書）"],["8","等級の変遷","―","『延喜式』では大国。『日本大百科全書』：「国司四等官のうち大国にのみ置かれる大目（だいさかん）が712年（和銅5）に播磨国にいるので（《続日本紀》），8世紀初めより大国であったことがわかる」","Wikipedia「播磨国」記事には等級の変遷の記述はなく、大国であることのみ記載される。712年は年表記のみ","その他（日本大百科全書）"]]}]},{"h":"a-3 但馬国","lv":2,"text":["出典：","- Wikipedia「但馬国」 http://ja.wikipedia.org/wiki/但馬国 （Wikipedia）","- 取得日：2026-11-18","注記・食い違い：","- 郷数について、Wikipedia記事は59郷とする。『和名抄』に基づく郷数を63郷とする事典類の記載があるかは、本便では当該事典の本文を取得できておらず未確認。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","但馬国","たじまのくに","かつて日本の地方行政区分だった令制国の一つ。山陰道に属する。相当領域は兵庫県北部。但馬の歴史的仮名遣いは「たぢま」","古文書では「儋馬國」と表記","Wikipedia"],["2","別称","但州（たんしゅう）","―","―","Wikipedia"],["3","所属","―","山陰道","―","Wikipedia"],["4","郡・郷数","―","8郡59郷","下記の郷数に関する注記参照","Wikipedia"],["5","郡名一覧","―","朝来郡・養父郡・出石郡・気多郡・城崎郡・美含郡・二方郡・七美郡の8郡","記事に「※郡名は『延喜式』による」と明記。記事「地域」の節では城崎郡を「城埼郡」と表記する箇所がある（記事内の表記揺れ）","Wikipedia"],["6","国名表記の変遷","―","『古事記』には「多遅摩国」と記載される。国造の名として「但遅麻国造」「二方国造」が見える","―","Wikipedia"],["7","成立の経緯","―","「但馬国は7世紀後半に丹波国より8郡を分割して成立したとする説もあるが確証はない。『日本書紀』天武天皇4年（675年）条に国名がみえるので、この頃成立したと推定されている」","のちに但馬国となる地域は、その後、丹波国造の支配地域である丹波国となったと記事は記す","Wikipedia"]]}]},{"h":"a-4 淡路国","lv":2,"text":["出典：","- Wikipedia「淡路国」 https://ja.wikipedia.org/wiki/淡路国 （Wikipedia）","- 取得日：2026-11-18","注記・食い違い：なし（本便の範囲では出典間の食い違いは確認されなかった）。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","淡路国","あわじのくに","かつて日本の地方行政区分だった令制国の一つ。南海道に属する。兵庫県淡路島・沼島にあたる","『古事記』『日本書紀』の国産み神話では、日本列島で最初に生まれた島とされる","Wikipedia"],["2","別称","淡州（たんしゅう）","―","―","Wikipedia"],["3","所属","―","南海道","―","Wikipedia"],["4","郡・郷数","―","2郡17郷","―","Wikipedia"],["5","郡名一覧","―","津名郡・三原郡","記事に「※郡名は『延喜式』による」と明記。「古くは津名郡と三原郡で構成されていた」","Wikipedia"],["6","国名表記の変遷","―","「律令制以前は淡道国造の領域であり、『淡道』の表記であった。律令制において令制国のひとつとなり『淡路』の表記となった」。5世紀の仁徳天皇の御代に設置された淡道国造に起源を持つものと推定される（国造本紀）","『古事記』では淡路島を「淡道之穂之狭別島」と記す","Wikipedia"],["7","御食国","みけつくに","『延喜式』や平城京などから発見された木簡によると、租庸調に加え、贄（にえ）とよばれた海産物（主に魚）を直接に朝廷の内膳司に納めていたことが分かっており、「朝廷にとって淡路国が特殊な位置にあったとする説がある（御食国を参照）」","―","Wikipedia"]]}]},{"h":"a-5 丹波国（兵庫県域＝丹波篠山市・丹波市）","lv":2,"text":["出典：","- Wikipedia「丹波国」 https://ja.wikipedia.org/wiki/丹波国 （Wikipedia）","- ひょうご歴史ステーション「ひょうご史Q&A」（兵庫県立歴史博物館） https://www.hyogo-c.ed.jp/~rekihaku-bo/historystation/rekihaku-meet/q-and-a/index.html （自治体）","- 取得日：2026-11-18","注記・食い違い：","- 年数の検算：記事は豊岡県の時期について「1871年（明治4年）11月2日～1876年（明治9年）8月21日の約5年間」と記す。実際の期間は4年9か月余であり、「約5年間」の表記と整合する（検算済み）。","---"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["1","丹波国","たんばのくに","日本の地方行政区分である令制国の一つ。山陰道に属する。相当領域は京都府中部、兵庫県北東部、大阪府の一部","古くは「たには」とも称した。『和名抄』では「丹波」を「太迩波（たには）」と訓む","Wikipedia"],["2","別称","丹州（たんしゅう）","―","記事の注釈：「別称『丹州』は、丹後国とあわせて、または単独での呼称」（第2便・京都府F5の確認と一致）","Wikipedia"],["3","所属","―","山陰道","―","Wikipedia"],["4","郡・郷数","―","6郡68郷","丹後分立後の郡数","Wikipedia"],["5","郡名一覧","―","桑田郡（くわだ）・船井郡（ふない）・何鹿郡（いかるが）・天田郡（あまた）・多紀郡（たき）・氷上郡（ひかみ）の6郡","兵庫県域は多紀郡（丹波篠山市）と氷上郡（丹波市）。兵庫県立歴史博物館：「丹波篠山市・丹波市は丹波国６郡のうち２郡に相当し、丹波国の残り４郡は京都府の中部を構成しています」","Wikipedia／自治体"],["6","国名表記の変遷","―","主に「丹波」が使われているが、「旦波」「但波」「丹婆」「谿羽」などの表記も見られる。「藤原宮跡出土木簡では例外を除いて全て『丹波』なので、大宝律令の施行とともに『丹波』に統一されたと考えられている」","由来は『和訓栞』の「谷端」説と『諸国名義考』の「田庭（平らかに広い地）」説があり、後者が有力視されている（記事）","Wikipedia"],["7","分国の経緯","―","律令制以前は但馬、丹後も含み丹波国造の領域とされた。「7世紀の令制国成立に伴い、但馬地域が分国し但馬国となり、また和銅6年（713年）4月3日北部5郡が丹後国として分国、そして都に近い郡は『丹波国』となった」。現在では丹波・丹後・但馬を「三丹」、但馬を含まない場合は「両丹」と総称することもある","和銅6年4月3日は和暦表記のみの出典による（旧暦）。分立前の11郡の郡名一覧は記事本文では確認できず未確認","Wikipedia"],["8","兵庫県域への帰属","―","明治4年11月2日（1871年12月13日）の第1次府県統合により多紀郡・氷上郡・天田郡は豊岡県に分けられ、1876年（明治9年）8月21日の第2次府県統合により「氷上郡、多紀郡の二郡が兵庫県に編入」された（天田郡は京都府へ）","1876年8月21日は改暦後のため新暦","Wikipedia"]]}]}],"b":[{"h":"出典","lv":3,"text":["- Wikipedia「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧 （取得日：2026-11-18）【Wikipedia】— 県域の藩の網羅確認に使用","- 各藩記事：三田藩／尼崎藩／柏原藩（丹波柏原藩）／篠山藩／八上藩／姫路藩／明石藩／赤穂藩／龍野藩／小野藩／三草藩／安志藩／山崎藩／林田藩／三日月藩／福本藩／播磨新宮藩／姫路新田藩／平福藩／清富藩／出石藩／豊岡藩／村岡藩／八木藩／竹田藩／淡路洲本藩／徳島藩／生野奉行（いずれもWikipedia、取得日：2026-11-18）","※本表の出典はすべてWikipediaであり、公的・自治体出典での照合は未実施。藩主の読みは各藩記事に読みの記載がある場合のみ転記し、記載がないものは「―（記事に読みなし）」とした。自治体出典による読みの確認は未実施（未確認）。"],"tables":[]},{"h":"本表","lv":3,"text":[],"tables":[]},{"h":"摂津国（兵庫県域分）","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["1","三田藩","さんだはん","1601年立藩（有馬則頼入封）〜1871年","山崎家盛（いえもり）※歴代藩主表の筆頭。1600年〜1601年","九鬼隆義（たかよし）","山崎家2万3000石→有馬家2万石→松平〔能見〕家3万石→九鬼家3万6000石","三田城、のち三田陣屋","Wikipedia"],["2","尼崎藩","あまがさきはん","1615年〜1871年","建部政長（―）・池田重利（―）※1615年〜1617年は両家が在城","松平〔桜井〕忠興（―）","建部家・池田家 各1万石→戸田家5万石→青山家5万石→5万4000石→4万8000石→松平〔桜井〕家4万8000石→4万石→4万5000石","尼崎城","Wikipedia"]]}]},{"h":"丹波国（兵庫県域分）","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["3","柏原藩（丹波柏原藩）","かいばらはん","1598年立藩〜1650年廃藩／1695年再立藩〜1871年","織田信包（おだ のぶかね）","織田信親（おだ のぶちか）","3 〜1817年）","本多忠刻（―）","酒井忠全（―）","本多家10万石→5万石と4万石→奥平松平家3万石→酒井家1万石","江戸定府で居所はなし（記事の記載）","Wikipedia"],["19","平福藩","ひらふくはん","1615年〜1631年","池田輝興（てるおき）※唯一の藩主","池田輝興（てるおき）","2万5000石","利神城","Wikipedia"]]}]},{"h":"但馬国","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["20","清富藩","きよどめはん","1627年〜1653年（無嗣改易）","宮城豊嗣（―）※唯一の藩主","宮城豊嗣（―）","1万3000石","清富陣屋（前身は芦屋陣屋）","Wikipedia"],["21","出石藩","いずしはん","1600年〜1871年","小出吉政（よしまさ）","仙石政固（まさかた）","小出家6万石→5万石→松平〔藤井〕家4万8000石→仙石家5万8000石→3万石","出石城","Wikipedia"],["22","豊岡藩","とよおかはん","1600年〜1871年（1653年〜1668年は幕府領）","杉原長房（―）","京極高厚（―）","杉原家2万石→2万5000石→1万石→京極家3万5000石→1万5000石","豊岡城、のち豊岡陣屋","Wikipedia"],["23","村岡藩","むらおかはん","1868年立藩（維新立藩）〜1871年","山名義済（―）","山名義路（―）","交代寄合として6700石→1万1000石（1868年の高直しで立藩）","村岡陣屋","Wikipedia"],["24","八木藩","やぎはん","1585年入封〜1628年改易※豊臣政権下の別所氏の領国を「藩」と捉えた呼称（記事の記載）","別所重宗（しげむね）","別所吉治（よしはる）","1万5000石→2万石","八木城","Wikipedia"],["25","竹田藩","―（記事に読みなし）","未確認（Wikipedia「竹田藩」の記事は藩庁が竹田城である旨のみで、藩主・石高・期間の記載がない）","未確認","未確認","未確認","竹田城","Wikipedia"]]}]},{"h":"淡路国","lv":4,"text":[],"tables":[{"cols":["番号","名称","読み","立藩年・存続期間","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城／陣屋","出典の種別"],"rows":[["26","淡路洲本藩（洲本藩）","すもとはん","脇坂安治の入封により立藩（立藩年は記事に明記なし）〜1609年／1613年再立藩（由良成山藩）〜1615年廃藩","脇坂安治（―）","池田忠雄（―）","脇坂家3万石（池田忠雄の石高は記事に記載なし）","洲本城、由良城（由良成山城）","Wikipedia"]]}]},{"h":"淡路の項（徳島藩の支配と洲本城代）","lv":3,"text":["出典：Wikipedia「淡路洲本藩」 https://ja.wikipedia.org/wiki/淡路洲本藩 ／ Wikipedia「徳島藩」 https://ja.wikipedia.org/wiki/徳島藩 （いずれも取得日：2026-11-18）【Wikipedia】","- 淡路国に藩があった時期は限られる。脇坂安治が3万石で入って淡路洲本藩が立藩したが、慶長14年（1609年）に安治は伊予大洲藩に移され、淡路は藤堂高虎の属領となり、その翌年に姫路藩主・池田輝政に淡路一国が加増され姫路藩の属領となった。慶長18年（1613年）に輝政の三男・忠雄に分与されて洲本藩が再立藩し、忠雄が由良成山城を築いて藩庁を移したため由良成山藩と名称が変わった。元和元年（1615年）、忠雄が岡山藩に移ったため由良成山藩は廃藩となった（「淡路洲本藩」）。","- その後、淡路は大坂の陣で軍功を挙げた蜂須賀至鎮の阿波藩（明治以降に徳島藩と改称）領となり、洲本に阿波藩が派遣した城代・稲田家が置かれたため、由良成山城は廃城となった（「淡路洲本藩」）。江戸時代の大半、淡路国に独立した藩はなく、徳島藩領であった。","- 徳島藩側の記載では、大坂の陣により蜂須賀家は岩屋周辺を除く淡路国7万石を与えられ、元和3年（1617年）に岩屋周辺も加増され、阿波・淡路の2国・25万7000石を領した（「徳島藩」）。","- 洲本城代の稲田氏は徳島藩の筆頭家老で、「淡路洲本領1万4000石・重臣」「脇城代・洲本城代」と記載されている。稲田家の歴代は植元―示植―植次―植栄＝植幹―植治＝植政―植久―植晟＝植樹―敏植―植封＝芸植―植乗＝植誠＝邦植（「徳島藩」の家老の項）。","- 幕末の徳島藩領として淡路国一円（津名郡124村・三原郡134村）が挙げられている。明治4年（1871年）5月、家老稲田氏の知行地のうち津名郡43か村浦が兵庫県に編入された。1871年8月29日（明治4年7月14日）の廃藩置県ののち、同年12月26日（11月15日）に淡路島全域は名東県に編入され、1876年8月21日の第2次府県統合で名東県より淡路島全域が兵庫県に移管された（「徳島藩」の幕末の領地の項）。"],"tables":[]},{"h":"幕府領・代官所・飛地・旗本領の項","lv":3,"text":["出典：Wikipedia「生野奉行」 https://ja.wikipedia.org/wiki/生野奉行 ほか各藩記事（取得日：2026-11-18）【Wikipedia】","代官所","幕府領の期間があった藩領","飛地（幕末の領地に他国・他郡の領地が記載されているもの）","旗本領・交代寄合（藩に準じる扱いのもの）"],"tables":[{"cols":["名称","読み","内容（出典の記載どおり）","出典の種別"],"rows":[["生野奉行／生野代官","いくのぶぎょう／いくのだいかん","織田信長、豊臣秀吉および江戸幕府により置かれ、生野銀山を管理した。1716年（享保元年）、生野銀山の産出量減少のため生野代官に組織変更された。奉行所・代官所は現在の兵庫県朝来市生野町口銀谷の生野小学校付近にあった。慶長3年（1598年）に初代生野奉行として間宮直元が就任。江戸時代の生野奉行は11代、代官に改組後は28人が勤めた。代官には旗本が任命され、生野銀山の後背地となっていた但馬国、播磨国、美作国の天領も統治した。統治規模は江戸時代初期は5万2000石、江戸時代末期には8万2000石に達していた","Wikipedia"]]},{"cols":["対象","期間","出典"],"rows":[["龍野藩領","1632年〜1633年、1636年〜1637年、1658年〜1672年（藩主不在の間は幕府領）","Wikipedia「龍野藩」"],["豊岡藩領","1653年〜1668年（杉原家改易後、京極高盛の転封まで一時幕府領）","Wikipedia「豊岡藩」"],["柏原藩領","1650年〜1695年（柏原藩廃藩後、その所領は幕府領となった）","Wikipedia「柏原藩」"],["山崎藩領","1649年（松平康映の転封後、いったん公儀御料となった）","Wikipedia「山崎藩」"],["清富藩領","1653年の無嗣断絶後、所領は収公された（幕府領となるに際し二方郡の表高は従来の7926石余に戻された）","Wikipedia「清富藩」"]]},{"cols":["藩","飛地の記載","出典"],"rows":[["明石藩","美作国吉野郡44村（播磨国内の美嚢郡81村・明石郡145村のほか）","Wikipedia「明石藩」"],["龍野藩","美作国英田郡11村・真島郡5村。また幕府領の預かりとして揖東郡9村・赤穂郡24村・佐用郡17村などの記載がある","Wikipedia「龍野藩」"],["尼崎藩","播磨国多可郡9村・赤穂郡31村・宍粟郡9村","Wikipedia「尼崎藩」"],["篠山藩","但馬国朝来郡16村、摂津国武庫郡3村、遠江国榛原郡10村・城東郡14村（遠江分は1827年の加増による）","Wikipedia「篠山藩」"],["三田藩","丹波国氷上郡10村","Wikipedia「三田藩」"],["柏原藩","丹波国内の何鹿郡9村・天田郡4村（氷上郡43村のほか）","Wikipedia「柏原藩」"]]},{"cols":["対象","内容（出典の記載どおり）","出典"],"rows":[["福本領（池田家）","1665年に分知により7000石・6000石などに分かれ、福本7000石の領主・政武は交代寄合の格式となった。以後3家とも明治維新まで存続し、1868年に石高直しで1万0573石となり再び藩となった","Wikipedia「福本藩」"],["村岡領（山名家）","関ヶ原の戦功により七美郡6700石を与えられた。知行は1万石に達しなかったが、交代寄合表御礼衆の一つとされた。1868年に1万1000石への高直しが認められて立藩した","Wikipedia「村岡藩」"],["新宮領（池田家）","播磨新宮藩の廃藩（1670年）と同年、重教は新宮周辺で3000石を与えられ、寄合として家名の存続を許された。以後13代・頼誠の時に明治維新を迎えた","Wikipedia「播磨新宮藩」"],["平福（松平康朗）","平福藩の廃藩後、平福には旗本・松平康朗が5000石で入り、明治までこの地を治めた","Wikipedia「平福藩」"],["赤穂藩の分知旗本","浅野家の分知旗本として若狭野浅野家・家原浅野家・浅野大学家（赤穂新田3000石）の記載がある","Wikipedia「赤穂藩」"]]}]},{"h":"注記・食い違い","lv":3,"text":["- 食い違い（赤穂藩・池田家の石高）：Wikipedia「赤穂藩」の基礎情報欄は3万5000石、歴代藩主表の見出しは「3万3000石」と、同一記事内で食い違う。","- 食い違い（赤穂藩・浅野家の石高）：基礎情報欄は「5万3000石→5万石」、本文は「5万3500石→5万石（分知による）」と食い違う。","- 食い違い（赤穂藩・永井家の石高）：基礎情報欄は3万2000石、「所領」の節は3万3000石と食い違う。","- 食い違い（三田藩・九鬼家の入部年）：Wikipedia「三田藩」の略史は寛永10年（1633年）に九鬼久隆が3万6000石で三田へ転封とするが、歴代藩主表の九鬼家の期間表記は「1632年〜1871年」で食い違う。","- 食い違い（篠山藩・松平康重の就封年）：Wikipedia「篠山藩」の歴代藩主表は松平康重の就封を「慶長14年（1608年）9月」とするが、慶長14年は1609年に当たり、元号と西暦が食い違う。本文およびWikipedia「八上藩」は慶長14年（1609年）12月に篠山城へ拠点を移したとする。","- 食い違い（福本藩の立藩年）：Wikipedia「福本藩」の本文は寛文3年（1663年）に福本藩が立藩したとするが、歴代藩主表の期間表記は「1662年〜1665年」で食い違う。","- 食い違い（小野藩の立藩年）：Wikipedia「藩の一覧」は小野藩を1637年〜とするが、Wikipedia「小野藩」は寛永13年（1636年）に川之江藩として立藩し、寛永19年（1642年）に小野藩1万石が成立したとする。","- 注記（清富藩）：Wikipedia「清富藩」によれば、『寛政重修諸家譜』の文面上は宮城家は大名になっておらず、「藩」として扱わない事典類もある。また「清富」の読みは、新温泉町は「きよどめ」とするが、日本郵政の郵便番号検索では「きよとみ」とする旨の注釈がある。","- 注記（八木藩）：Wikipedia「八木藩」は、別所吉治の所領の場所や石高について諸説あってはっきりしないとし、戦後の扱いについても「本領を安堵されたとする説」と「所領を没収されたのち丹波国氷上郡北由良の領主として復帰したとする説」などを併記している。本表の数値は同記事の歴代藩主表による。","- 注記（村岡藩）：江戸時代の大半は藩ではなく交代寄合（旗本）の山名家領であり、藩となったのは1868年である。","- 注記（姫路新田藩）：姫路藩の新田支藩で、内分分知のため具体的な領地についてはほとんど不明であり、江戸定府で居所はなかった（記事の記載）。","- 注記（鶴牧藩）：候補に挙がっていた鶴牧藩は安房国（現在の千葉県）の藩であり、Wikipedia「藩の一覧」の兵庫県域分には含まれないため、本表には入れていない。","- 注記（園部藩）：園部藩は丹波国（現在の京都府）の藩であり、その飛地も含め対象外とした。"],"tables":[]},{"h":"取得不可リスト（b）","lv":3,"text":["- Wikipedia「生野代官所」：その記事名のページは存在せず取得不可。代わりにWikipedia「生野奉行」（https://ja.wikipedia.org/wiki/生野奉行 ）を取得し、生野代官への改組（1716年）を含む記載を用いた。","- Wikipedia「竹田藩」：ページ自体は取得できたが、藩庁が竹田城（兵庫県朝来市和田山町竹田）である旨のみの未整備な記事で、藩主・石高・存続期間の記載がないため、これらの項目は取得不可（未確認）とした。","- 藩主の読み：姫路藩・明石藩・龍野藩・尼崎藩・小野藩・三草藩・山崎藩・林田藩・豊岡藩・村岡藩・福本藩・播磨新宮藩・姫路新田藩・清富藩・淡路洲本藩の各藩記事には藩主名の読みの記載がなく、読みは取得不可（本表では「―」）。自治体（市史・市公式サイト）出典による読みの確認は未実施で、未確認である。","- 本節全体について、公的・自治体出典（兵庫県・各市の公式サイト、市史等）での照合は未実施であり、出典はすべてWikipediaである。"
