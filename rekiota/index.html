滋」（いずれも https://ja.wikipedia.org/wiki/ の当該記事）","- 京都府公式「統計でみる 府民 くらし」（https://www.pref.kyoto.jp/tokei/yearly/kurashi/kurashi2010a.pdf ）、「京都府開庁150年記念式典」（https://www.pref.kyoto.jp/somucho/sikiten/150sikiten.html ）","- 総務省統計局「統計でみる都道府県」京都府（https://www.soumu.go.jp/main_content/000650953.pdf ）","- 東書Eネット「都道府県の豆知識 京都府」（https://ten.tokyo-shoseki.co.jp/ten_download/2020/2020078363.htm ）","- 廃藩置県データ表（shurey.com、https://www.shurey.com/Excel/ の近江国分PDF。Wikipedia収集データの編纂物）","- 取得日： 2026-11-18","- 表の前提： 日付は第2便の暦の方針に従い、新暦（グレゴリオ暦）を主に、1872年末までの日付は旧暦を括弧で併記した。旧暦の日付しか分からないものは旧暦で示し、その旨を書いた。確認できない日付は「未確認」とした。"],"a":[{"h":"a. 旧国名と五畿七道","lv":2,"text":["五畿七道（ごきしちどう）は、古代日本の律令制における広域地方行政区画で、畿内七道（きないしちどう）とも呼ばれた。1869年（明治2年）に北海道が新設されてからは五畿八道と呼ばれる（Wikipedia「五畿七道」）。","七道は東海道、東山道、北陸道、山陽道、山陰道、南海道、西海道（Wikipedia「五畿七道」）。"],"tables":[{"cols":["番号","名称","読み","所属","備考","出典の種別"],"rows":[["1","山城国","やましろ","畿内（五畿）","別称は城州、山州、雍州。五畿は大和・山城・摂津・河内・和泉の五国で、現在の奈良県、京都府中南部、大阪府、兵庫県南東部を合わせた地域。京都府の府域は山城国の全域を含む。","Wikipedia"],["2","丹波国","たんば","山陰道","別称は丹州。山陰道は現在の京都府北部と兵庫県北部、鳥取、島根を合わせた地域。京都府の府域は丹波国の東部（兵庫県側が西部）。","Wikipedia"],["3","丹後国","たんご","山陰道","別称は丹州。713年に丹波国より分立。京都府の府域は丹後国の全域を含む。","Wikipedia"]]}]},{"h":"丹州の別称について（確認結果）","lv":2,"text":["旧ファイル09で丹波国・丹後国の両方に別称「丹州」と書いた点は、誤りではなかった。「丹後国」の記事の別称欄は「丹州（たんしゅう）」で、注釈に「別称『丹州』は、丹波国とあわせて、または単独での呼称」とある。つまり「丹州」は丹波・丹後を合わせた呼び方でもあり、各国単独の別称としても使われる。丹後国にはこのほかに北丹（ほくたん）、奥丹（おくたん）の別称がある。"],"tables":[]}],"b":[{"h":"b. 江戸時代の藩","lv":2,"text":["「藩の一覧」（Wikipedia）で現在の京都府域に挙げられる藩は、山城国の淀藩、丹波国の福知山藩・綾部藩・山家藩・園部藩・丹波亀山藩、丹後国の峰山藩・宮津藩・丹後田辺藩（舞鶴藩）の9藩である（同記事の山城国には山城長岡藩・伏見藩・御牧藩も挙げられるが、いずれも江戸時代初期までの短期間の藩のため、ここでは9藩を本文とした）。石高は藩主家ごとに変遷するため、主な変遷を併記した。"],"tables":[{"cols":["番号","名称","読み","期間","藩主（初代／最後）・石高・居城","出典の種別"],"rows":[["1","淀藩","よどはん","1623年 - 1871年","山城国久世郡。立藩時の藩主は松平定綱（さだつな）、3万5000石、居城は淀城。藩主家はたびたび入れ替わり、1723年に稲葉正知が10万2000石で入って稲葉家が定着した。最後の藩主は稲葉家第12代の稲葉正邦（まさくに）。石高は家により変遷（永井家10万石→7万3600石、石川家6万石など）。","Wikipedia"],["2","園部藩","そのべはん","1619年 - 1871年","丹波国船井郡。初代藩主は小出吉親（よしちか）、最後は第10代の小出英尚（ふさなお）。石高は2万9800石→2万5000石→2万4000石。初代が園部城を築城した。","Wikipedia"],["3","丹波亀山藩（亀岡藩）","かめやまはん（かめおかはん）","1600年 - 1871年","丹波国。藩庁は亀山城。成立時の藩主は前田玄以（げんい）、5万石。藩主家は定着せず、1749年に形原松平家の松平信岑が5万石で入って定着し、最後は第8代の松平信正（のぶまさ）。明治時代に亀山の地名を亀岡に改称したため、これ以降は亀岡藩と呼ばれる。","Wikipedia"],["4","綾部藩","あやべはん","1633年 - 1871年","丹波国。初代藩主は九鬼隆季（たかすえ）、最後は第10代の九鬼隆備（たかとも）。石高は2万石→1万9500石。藩庁は綾部陣屋。","Wikipedia"],["5","山家藩","やまがはん","- 1871年（谷家13代）","丹波国何鹿郡山家。藩祖は谷衛友、石高は1万6000石→分知により1万石。最後は第13代の谷衛滋。藩庁は山家陣屋（現在の綾部市広瀬町）。各藩主の読みは同記事に記載なし。","Wikipedia"],["6","福知山藩","ふくちやまはん","1600年 - 1871年","丹波国天田郡。初代藩主は有馬豊氏（とようじ）、6万石→8万石。藩庁は福知山城。藩主家は入れ替わり、1669年に朽木稙昌が3万2000石で入って朽木家13代が定着し、最後は朽木為綱（もりつな）。","Wikipedia"],["7","宮津藩","みやづはん","1600年 - 1871年","丹後国。初代藩主は京極高知（たかとも）、12万3000石で丹後一国を領したため丹後藩とも呼ばれた。藩庁は宮津城。京極家は1666年に改易となり、以後藩主家は入れ替わり、1758年に松平（本庄）家の松平資昌が7万石で入って定着し、最後は第7代の松平宗武（むねたけ）。","Wikipedia"],["8","丹後田辺藩（舞鶴藩）","たなべはん（まいづるはん）","1622年 - 1871年","丹後国加佐郡。初代藩主は京極高三（たかみつ）、3万5000石→3万3000石。藩庁は田辺城（舞鶴城）。1668年に牧野親成が3万5000石で入り牧野家10代が続き、最後は牧野弼成（すけしげ）。明治維新後に舞鶴藩と改称した。","Wikipedia"],["9","峰山藩","みねやまはん","1622年 - 1871年","丹後国。初代藩主は京極高通（たかみち）、最後は第12代の京極高陳（たかのぶ）。石高は1万3000石→1万1600石→1万1100石。居城は峰山陣屋（無城・陣屋）。藩内では丹後ちりめんの制作が奨励された。","Wikipedia"]]}]},{"h":"山家藩の補足（始点と藩主の読み）","lv":2,"text":["- 始点： 「山家藩」の記事自体には立藩年の明記がない。藩祖・谷衛友の記事では「天正10年（1582年）頃、秀吉より丹波国何鹿郡山家村に移封されて、1万6000石を領した」とあり、関ヶ原の戦い（1600年）の後に所領を安堵された。したがって始点の候補は、領有の始まりとしては1582年頃、安堵による確定としては1600年であり、どちらを「藩の成立」とするかは資料に明記がないため、両方を併記する。","- 藩主の読み： 「山家藩」の記事の歴代藩主一覧には読みがない。個別の人物記事で確認できたのは、初代・谷衛友（たに もりとも）と第13代（最後）・谷衛滋（たに もりしげ）の2人。第2代衛政から第12代衛弼までの読みは今回未取得。"],"tables":[]},{"h":"綾部藩・山家藩の所在地表記","lv":3,"text":["- 「綾部藩」の記事では藩の所在地を「現在の京都府綾部市青野町、または同本宮町」とし、確定していない書き方になっている。"],"tables":[]}],"c":[{"h":"c. 廃藩置県の変遷（概要）","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","期間・日付","備考","出典の種別"],"rows":[["1","京都府（第1次）","きょうとふ","1868年6月19日（慶応4年閏4月29日）発足 ※京都府公式で照合（F3）","王政復古に伴い京都市中取締役所が設置され、京都裁判所と改称、さらに京都府（第1次）と改称した。発足時の領域は山城国のうち藩領を除く地域および摂津国島上郡1村（寺社領）。当時の府域は元の山城国だけだった（東書Eネット）。","Wikipedia／その他（教育サイト）"],["2","廃藩置県による各県の発足","―","1871年8月29日（明治4年7月14日）※新暦は換算","各藩が県となった。京都府域関係では亀岡県・園部県・福知山県・宮津県・舞鶴県（旧田辺藩）・峰山県の発足が各藩の記事で確認できる。東書Eネットによれば、中部の亀岡や北部の宮津などの8藩と久美浜県は当時京都府ではなかった。","Wikipedia／その他（教育サイト）"],["3","京都府（第2次）","きょうとふ","1871年11月（第1次府県統合）※日付は未確認（F3・F7）","山城・丹波6県が新たな京都府（第2次）となり、京都府は従来の山城国域に加え丹波国域の桑田郡、船井郡、何鹿郡を併合した。東書Eネットによれば、淀県と中部の亀岡県や綾部県など5県が京都府に入った。","Wikipedia／その他（教育サイト）"],["4","豊岡県","とよおかけん","1871年 - 1876年","第1次府県統合で丹波・丹後・但馬11県が豊岡県となった。福知山県など北部の県と久美浜県はこちらに属した（東書Eネット）。","Wikipedia／その他（教育サイト）"],["5","京都府（第3次）","きょうとふ","1876年8月（第2次府県統合）","豊岡県が廃止され、丹後5郡と丹波国域の天田郡を併合し、現在の京都府（第3次）の管轄地がほぼ画定した。","Wikipedia"]]}]},{"h":"F1. 廃藩置県で県になった旧藩と久美浜県（現在の京都府域ぶん、全10県）","lv":2,"text":["補足（東書Eネット「都道府県の豆知識 京都府」）： 「明治4年7月の廃藩置県で藩は県となり、同年11月には淀県と中部の亀岡県や綾部県など5県が京都府に入り、福知山県など北部の4県と久美浜県は豊岡県を構成した」とあり、京都府（第2次）に入ったのは淀・亀岡・綾部・園部・山家の5県、豊岡県に入ったのは福知山・宮津・舞鶴・峰山の4県と久美浜県という内訳が確認できる。"],"tables":[{"cols":["番号","県名","読み","前身","発足日","統合先","統合日","出典の種別"],"rows":[["1","淀県","よどけん","淀藩。ただし淀藩の所領は7か国に分散していたため、淀県は山城国紀伊郡・久世郡の藩領域をもって成立し、飛地は各地の府県に組み込まれた（「淀町 (京都府)」の記事が『角川日本地名大辞典 26 京都府』の「淀県」項を引く）","1871年8月29日（明治4年7月14日）","京都府（第2次）","1871年11月（東書Eネット）。日まで示す資料では1872年1月2日（明治4年11月22日）（廃藩置県データ表）","Wikipedia／その他"],["2","園部県","そのべけん","園部藩","1871年8月29日（明治4年7月14日）","京都府（第2次）","「園部藩」の記事では「園部県は同年8月に廃され、同年11月には京都府に編入された」とある。8月に県が廃されたとする点は他の資料と合わず、詳細は未確認（注記参照）","Wikipedia"],["3","亀岡県","かめおかけん","丹波亀山藩（明治2年に亀岡藩と改称）","1871年8月29日（明治4年7月14日）","京都府（第2次）","1871年11月（日は未確認）","Wikipedia"],["4","綾部県","あやべけん","綾部藩","1871年8月29日（明治4年7月14日）","京都府（第2次）","年月日は「綾部藩」の記事に記載なし（未確認）","Wikipedia"],["5","山家県","やまがけん","山家藩","1871年8月29日（明治4年7月14日）","京都府（第2次）","年月日は「山家藩」の記事に記載なし（未確認）","Wikipedia"],["6","福知山県","ふくちやまけん","福知山藩","1871年8月29日（明治4年7月14日）","豊岡県（第2次）。のち1876年8月21日に京都府へ編入","豊岡県への統合日は資料により食い違う（F7参照）。「福知山藩」の記事は1871年10月2日（旧暦）、「豊岡県」「丹後国」の記事は1871年12月13日（明治4年11月2日）","Wikipedia"],["7","宮津県","みやづけん","宮津藩","1871年8月29日（明治4年7月14日）","豊岡県（第2次）。のち京都府へ編入","豊岡県への統合は「宮津藩」の記事の宮津県の節で1871年11月22日（旧暦表記）とあるが、「豊岡県」「丹後国」の記事は1871年12月13日（明治4年11月2日）。京都府への編入も同節は1876年8月22日、「豊岡県」ほかの記事は1876年8月21日（F7参照）","Wikipedia"],["8","舞鶴県","まいづるけん","丹後田辺藩（明治2年に舞鶴藩と改称）","1871年8月29日（明治4年7月14日）","豊岡県（第2次）。のち京都府へ編入","宮津県と同じ食い違いがある（「丹後田辺藩」の記事の舞鶴県の節は1871年11月22日、1876年8月22日）","Wikipedia"],["9","峰山県","みねやまけん","峰山藩","1871年8月29日（明治4年7月14日）","豊岡県（第2次）。のち京都府へ編入","「峰山藩」の記事は「同年に豊岡県に編入」とのみ。豊岡県側の日付はF7参照","Wikipedia"],["10","久美浜県","くみはまけん","藩ではない。久美浜代官所・生野代官所が管轄した幕府領・旗本領（F2参照）","1868年6月18日（慶応4年閏4月28日）","豊岡県（第2次）。のち丹後分は京都府へ編入","1871年12月13日（明治4年11月2日）","Wikipedia"]]}]},{"h":"F2. 久美浜県の由来","lv":2,"text":["久美浜県は藩から県になったものではなく、幕府領（天領）から県になったものである。「久美浜県」の記事によれば、1868年（慶応4年）に丹後国・丹波国・但馬国・播磨国・美作国の幕府領・旗本領を管轄するため明治政府が設置した県で、丹後・丹波・但馬・播磨・美作5か国の久美浜代官所・生野代官所の支配地と但馬・丹波の旗本領、あわせて926村・23万石を管轄した。県庁は旧久美浜代官所（現・京丹後市）に置かれた。1869年（明治2年）に但馬・播磨・美作の180村が生野県として分離し、1871年（明治4年）の第1次府県統合で豊岡県に編入され廃止された。"],"tables":[]},{"h":"F3. 京都府（第1次）の発足日と第1次府県統合の日付","lv":2,"text":["- 京都府（第1次）の発足日： 京都府公式の資料では「京都府がはじめて設けられたのは慶応4年（1868年）閏4月29日（新暦6月19日）」とあり、京都裁判所が京都府に改称された日とされる。京都府の開庁150年記念のページと総務省統計局の資料も同じ日（1868年6月19日）を挙げる。新暦では 1868年6月19日（慶応4年閏4月29日）。","- 食い違い： Wikipedia「京都の年表」では「4月25日（5月17日）に京都裁判所を『京都府』に改称」とあり、公式の日付と合わない。公式を本文とし、こちらは参考として併記する。","- 第1次府県統合（京都府側）の日付： 東書Eネットと京都府公式の沿革資料はいずれも「明治4年（1871年）11月」と月までしか示さない。日まで示す資料としては、廃藩置県データ表（Wikipedia収集データの編纂物、種別は「その他」）が淀県の統合を明治4年11月22日（新暦1872年1月2日）とする。公的出典での日付の確認はできていない（F6参照）。"],"tables":[]},{"h":"F6. 京都府公式サイト・国立公文書館での照合","lv":2,"text":["- 京都府公式サイト： 発足日（1868年6月19日＝慶応4年閏4月29日）は京都府公式の統計資料と開庁150年のページ、総務省統計局の資料で照合できた。一方、廃藩置県と府県統合については、京都府公式の沿革資料（「統計でみる 府民 くらし」の「京都府のなりたち」）は「明治4年（1871年）の廃藩置県により区域は山城国の全部と丹波3郡（船井・何鹿・桑田）になり、明治9年に豊岡県の廃止に伴い丹後5郡と丹波国天田郡が編入された」という内容で、日付までは記されていない。統合の日付の公式照合は未実施のままである。","- 国立公文書館の資料での照合は未実施（アジア歴史資料センターの太政類典に府県統合関係の文書があることは検索で確認したが、個別の日付の照合までは行っていない）。"],"tables":[]},{"h":"F7. 豊岡県への統合日の食い違い（10月2日／11月2日／11月22日）","lv":2,"text":["どの日付が布告日で、どれが実施日（事務の引き継ぎ日）なのかは、今回取得したページの範囲では確認できなかった（未確認）。事実として言えるのは、最も詳しい「豊岡県」の記事（『豊岡市史』出典、日付の暦の扱いを明記）が11月2日を採り、「丹後国」の記事も同じ日付であること、宮津県・舞鶴県の節と福知山藩の記事はそれぞれ異なる日付を書いていることである。11月22日が他グループ（京都府側）の統合日と同日である点は、宮津・舞鶴の記事が別の統合の日付を取り違えた可能性を示すが、これは推測であり、断定はしない。"],"tables":[{"cols":["日付（旧暦）","新暦換算","出典","備考"],"rows":[["明治4年11月2日","1871年12月13日","Wikipedia「豊岡県」「丹後国」","「豊岡県」の記事は「明治5年以前の日付は旧暦、括弧内は西暦換算」と明記し、出典に『豊岡市史』を挙げる。統合された11県の名も列挙されている"],["明治4年11月22日","1872年1月2日","Wikipedia「宮津藩」（宮津県の節）、「丹後田辺藩」（舞鶴県の節）","両記事の沿革のみこの日付。なお11月22日は、廃藩置県データ表では京都府・滋賀県のグループの統合日として現れる日付でもある"],["明治4年10月2日","1871年11月13日","Wikipedia「福知山藩」","同記事は京都府への編入を1876年8月21日としており、この点は「豊岡県」の記事と一致する"]]}]},{"h":"注記・食い違い","lv":2,"text":["出典： 上記の各記事・各公式ページ（取得日2026-11-18）。","- 園部県の廃止時期： 「園部藩」の記事は「園部県は同年8月に廃され、同年11月には京都府に編入」とするが、8月に県が廃されて11月に編入という経過は他資料に見当たらず、未確認として残す。","- 京都府への編入日（1876年）： 「豊岡県」「丹後国」「福知山藩」の記事は8月21日、「宮津藩」「丹後田辺藩」の記事の県の節は8月22日。1日の食い違いがある。","- 淀藩の扱い： 「淀藩」の記事は「所領は各近辺の府県に組み込まれることとなった」とのみ書き、淀県の名を挙げない。淀県の存在は「淀町 (京都府)」の記事が引く『角川日本地名大辞典 26 京都府』と東書Eネットで確認した。","- 京都府（第2次）への統合日： 京都府側5県の統合日は、公的出典では月（1871年11月）までしか確認できていない。"],"tables":[]}],"d":[{"h":"d. 京都府名の由来","lv":2,"text":["出典： 東書Eネット「都道府県の豆知識 京都府」、日本経済新聞「大阪と京都だけなぜ『府』なのか」、Wikipedia「京都府」（取得日2026-11-18）。以下は各出典の記述の転記。","- 京都府は1868（明治元）年に制定された（東書Eネット）。","- 「京都」という言葉について：中国では「京都」も「京師」とともに「みやこ」を指す普通名詞だった。平安時代、京都に都がおかれて「京都」と呼ばれるようになったのではない。平安中期には院政との関係もあって「京・白河」と呼ばれていたようである。平安末期から鎌倉初期にかけて、普通名詞の「京都」が固有名詞の「京都」になったといわれているが定かではない。「京都」が公的に使われだしたのは、北条時政が初代の任についた「京都守護」という役職が最初とされる（東書Eネット）。","- 「府」という字について：明治政府が、幕府直轄地のうち奉行が支配した土地や開港した港などを「府」、代官の支配地を「県」と称したのが始まり。「府」という漢字は軍事・政治の拠点や大都市を意味し、要地として直接管理する意志を示すため「府」と称したようだ（佐々木克・京都大学名誉教授の説明として日本経済新聞が紹介）。「府」になったのは1868年に設置された京都府を皮切りに計10カ所で、1869年の太政官布告により京都・東京・大阪の3都市のみの呼称となった（日本経済新聞）。","- 京都府の発足の経緯はcの通り、京都市中取締役所→京都裁判所→京都府（第1次）への改称による（Wikipedia「京都府」）。"],"tables":[]}],"e":[{"h":"e. 城","lv":2,"text":[],"tables":[{"cols":["番号","名称","読み","築城者","築城年","廃城年／現状","現存する建物","出典の種別"],"rows":[["1","二条城（元離宮二条城）","にじょうじょう","徳川家康","1601年（慶長6年）","廃城年は1873年（明治6年）。ただし同記事の概要欄には「廃城令により存城処分を受ける」とあり、城としての存続が認められた扱い。現在は元離宮二条城として公開","二の丸御殿（6棟、国宝）、本丸御殿群、二の丸庭園、番所・土蔵、櫓・門・土塀、天守台、石垣・堀・井戸。天守は焼失し非現存","Wikipedia"],["2","伏見城（桃山城）","ふしみじょう","豊臣秀吉","1592年（文禄元年）","廃城1623年（元和9年）。1619年に廃城が決まり翌年から城割りが始まったと本文にある。現在は伏見桃山城運動公園","城跡自体に現存建物はない。遺構は移築門、石垣、水堀、土橋、天守台。移築遺構は各地に現存する（御香宮神社表門、西本願寺唐門、福山城伏見櫓、金地院方丈、高台寺の時雨亭・傘亭など）。現在の天守は1964年築の鉄筋コンクリート造模擬天守で、史実との関係はないと同記事にある","Wikipedia"],["3","淀城","よどじょう","松平定綱","1623年（元和9年）","廃城1871年（明治4年）。現在は淀城跡公園","現存建物なし。再建造物もなし。遺構は石垣、堀、天守台、本丸跡、二の丸跡。天守は1756年（宝暦6年）の落雷で焼失し再建されなかった","Wikipedia"],["4","福知山城","ふくちやまじょう","明智光秀","1579年（天正7年）","概要欄の廃城年は1873年（明治6年）。本文では「廃藩置県後の1871年によって廃城となり、1873年の廃城令によって解体された」とあり、廃城と解体の年が分かれる（注記参照）。現在は福知山城公園、天守は福知山市郷土資料館","現存の城郭建物は移築された番所・門（銅門番所は1916年に天守台へ移築）。遺構は曲輪、石垣、井戸。再建造物として大天守・小天守・釣鐘門があり、天守は外観復元で小天守が1985年、大天守が1986年に完成","Wikipedia"],["5","園部城（園部陣屋）","そのべじょう","小出吉親","1619年（元和5年）","廃城1872年（明治5年）。前身は園部陣屋で天守はなかった。幕末に築城が認められ1869年（明治2年）に新築完成した建物は「日本の城郭史で最後の建築物」と同記事にある。現在は京都府立園部高等学校の敷地内","巽櫓、櫓門、番所、太鼓櫓が現存（太鼓櫓は八木町の安楽寺に移築）。巽櫓・櫓門・番所は京都府暫定登録文化財（2017年登録）。遺構は石垣、堀。再建造物なし","Wikipedia"],["6","亀山城（丹波亀山城、亀岡城）","かめやまじょう","明智光秀","1578年（天正6年）","廃城1877年（明治10年）。1873年に陸軍省が存廃を決定し建物の一部を払い下げ、1877年に政府が廃城処分を決定したと本文にある。城跡は現在、宗教法人大本の本部（天恩郷）で、見学には入口受付で申込みと許可が必要","現存建物なし。遺構は石垣、堀。新御殿（長屋門）は亀岡市立千代川小学校に移築されている","Wikipedia"],["7","田辺城（舞鶴城）","たなべじょう（別名・舞鶴城は「ぶがくじょう」）","細川藤孝","1582年（天正10年）","概要欄の廃城年は「明治7年（1873年）」とある（1873年は明治6年であり、記事内の年号と西暦が一致しない。注記参照）。現在は舞鶴公園","現存建物なし。遺構は石垣、堀、庭園。再建造物として櫓・門・塀と模擬櫓があり、1940年（昭和15年）に復興された二層櫓（彰古館）と、1992年（平成4年）に模擬復興された城門（田辺城資料館）がある","Wikipedia"],["8","宮津城","みやづじょう","細川藤孝","1580年（天正8年）","廃城1868年（明治元年）頃。城郭そのものは土の中に埋もれ見た目には姿を消したと同記事にある","太鼓門が現存する（宮津小学校に移築され、2010年に同校正門へ移築）。御殿の玄関は与謝野町の愛宕神社拝殿に移築されて現存。遺構は石垣。大手川に沿った城壁は近年の再建で2010年完成","Wikipedia"]]}]},{"h":"伏見城の築城地（確認結果）","lv":2,"text":["・指月：文禄元年（1592）に、宇治川に臨む指月の岡（現・伏見区桃山町泰長老）に、秀吉の別荘として造営された。","・木幡山：慶長元年（1596）閏7月の大地震（慶長の大地震）で指月の城が倒壊し、木幡山（現・伏見区桃山町の明治天皇陵域内）に場所を移して新たに築城された。本丸は1596年10月、天守・殿舎は1597年5月に完成。","出典：京都市公式「都市史20 伏見城」（Museの取得。原文引用）。別の京都市文化財保護課の資料（指月に関する報告書PDF）でも、指月の造営（文禄元年）、地震での倒壊（1596年）、木幡山への移転を確認した。種別：自治体。"],"tables":[]},{"h":"注記・食い違い（城）","lv":2,"text":["- 福知山城の廃城年： 概要欄は1873年、本文は「1871年に廃城、1873年の廃城令で解体」とあり、同じ記事の中で「廃城」の指す時点が分かれる。両方を併記した。","- 田辺城の廃城年： 概要欄に「明治7年（1873年）」とあるが、1873年は明治6年にあたるため、記事内の表記そのままを転記し、食い違いとして残した。","- 二条城の「廃城年1873年」は、廃城令で存城処分（存続が認められた城）となった年であり、他の城の廃城とは意味が異なる。同記事の概要欄の表記による。","- 伏見城の廃城： 概要欄は1623年、本文は「1619年に廃城が決まり、翌年から城割り開始、1623年の将軍宣下の後に完全な廃城」と段階を分けて記す。両方を併記した。"],"tables":[]}],"f":[{"h":"f. 名産","lv":2,"text":[],"tables":[]},{"h":"江戸時代","lv":3,"text":[],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","西陣織","にしじんおり","京都・西陣","先染めによる高級絹織物。18世紀初頭の元禄〜享保年間に最盛期を迎えた。14代将軍徳川家茂が妻の和宮に故郷の土産として西陣織を贈った話が同記事にある","Wikipedia"],["2","宇治茶","うじちゃ","宇治","江戸時代には幕府に献上されるお茶壷道中（宇治採茶使）が宇治から江戸までの道中を練り歩いた。1738年に永谷宗円が青製煎茶製法を開発、1834年（天保5年）に宇治で玉露製法が創製された","Wikipedia"],["3","丹後ちりめん","たんごちりめん","丹後・峰山","享保5年（1720年）に峰山の絹屋佐平治らが京都西陣から技術を持ち帰り製織に成功した絹織物。峰山藩では制作が奨励された。京都府公式「織物業の歴史」では、創業者は峰山の絹屋佐平治（きぬやさへいじ）と加悦谷の手米屋小右衛門・山本屋佐兵衛・木綿屋六右衛門の4人とされる","Wikipedia／自治体（京都府公式）"],["4","丹後ちりめん","たんごちりめん","丹後・加悦谷","享保7年（1722年）に加悦谷の手米屋小右衛門、山本屋佐兵衛、木綿屋六右衛門の3人が協力して西陣から技術を持ち帰ったのが加悦谷側の発祥とされる（「丹後ちりめん回廊」の構成文化財一覧による転記。峰山側の絹屋佐平治とは関連がないと同資料にある）","Wikipedia"],["5","黒谷和紙","くろたにわし","丹波・山家（現・綾部市）","山家藩の特産品で、林業とともに藩財政を支えたと「山家藩」の記事にある","Wikipedia"]]}]},{"h":"現代","lv":3,"text":[],"tables":[{"cols":["番号","区分","品目・内容","読み","備考","出典の種別"],"rows":[["1","伝統的工芸品（経済産業大臣指定）","京都府17品目：西陣織、京鹿の子絞、京仏壇、京仏具、京漆器、京友禅、京小紋、京指物、京繍、京くみひも、京焼・清水焼、京扇子、京うちわ、京黒紋付染、京石工芸品、京人形、京表具","―","2025年10月27日現在の指定品目一覧（全国244品目）による。旧ファイル10で教育サイト経由だった17品目の内訳は、この指定一覧と一致した","その他（伝統的工芸品産業振興協会の指定品目一覧。指定主体は経済産業大臣）"],["2","京都市指定の伝統産業品","74品目（西陣織、京鹿の子絞、京友禅、京小紋、京くみひも、京繍、京仏壇、京仏具、京漆器、京焼・清水焼、京扇子、京うちわ、京人形、京菓子、京漬物、清酒など）","―","京都市公式の別表PDFによる","自治体（京都市公式）"],["3","地理的表示（GI）登録","万願寺甘とう（登録番号第37号）","まんがんじあまとう","登録日は2017年（平成29年）6月23日。生産地は京都府綾部市、舞鶴市、福知山市。登録生産者団体は全国農業協同組合連合会。特性は「辛み成分のない甘味種とうがらし」など","公的（農林水産省近畿農政局）"],["4","地理的表示（GI）登録","京賀茂なす（登録番号第165号）","きょうかもなす","生産地は京都府京都市北区、左京区。登録生産者団体は上賀茂特産野菜研究会","公的（農林水産省近畿農政局）"],["5","地域団体商標","京都府28件：間人ガニ、京たんご梨、舞鶴かまぼこ、万願寺甘とう、丹後とり貝、舞鶴かに、北山丸太、北山杉、京あられ、京おかき、京都名産すぐき、京都名産千枚漬、京つけもの、京漬物、京味噌、京都肉、京あめ、京せんべい、京都米、京の伝統野菜、京とうふ、京菓子、宇治茶、京ゆば、宇治煎茶、宇治玉露、宇治碾茶、宇治抹茶","―","近畿農政局の一覧（令和6年1月現在）による","公的（農林水産省近畿農政局）"],["6","京のブランド産品","京都府が認証するブランド京野菜、ブランド水産物、ブランド加工品、ブランド畜産物（京都肉、京地どり、京都ぽーく）","きょうのブランドさんぴん","京都府公式ページによる","自治体（京都府公式）"]]}]},{"h":"注記・食い違い（名産）","lv":2,"text":["- 丹後ちりめんの創業者： 「峰山藩」記事と京都府公式は絹屋佐平治を挙げ、「丹後ちりめん回廊」の構成文化財一覧は峰山側と加悦谷側で発祥が別だとする。創業者4人を併記した。","- f江戸時代の出典について： 指定の「藩や幕府の記録で確認できるもの」には当たれておらず、確認できたのは藩の記事（Wikipedia）と京都府公式資料までである。記録そのものの確認は未実施と明記する。"],"tables":[]}],"id":"kyoto","title":"京都府","sub":"旧山城国・丹波国の東部・丹後国","topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai","kokumei"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun","han","tenryo","senko"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"府名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["旧国名・五畿七道はWikipediaのみが出典。公的出典での照合は未実施。"],"b":["山家藩は、第2代〜第12代の藩主の読みが未取得。立藩の始点は資料に明記がなく、1582年頃（領有の始まり）と1600年（安堵）を併記している。","石高・藩主の代は各藩の記事（Wikipedia）のみによる。"],"c":["府県統合の日付は、公的出典では月（1871年11月）までしか確認できていない。","豊岡県への統合日は3つの説（旧暦の10月2日・11月2日・11月22日）がある。布告日か実施日かは未確認。『豊岡市史』を出典とする「豊岡県」の記事は11月2日（旧暦。権令の任期も同日から）。11月22日は、第1次府県統合の一般的な日付が豊岡に当てはめられた取り違えの可能性があるが、出所候補はWikipediaのミラーサイトの旧版らしい記事で、仮説。10月2日説の出所は未確認。","園部県が8月に廃されたとする点は、「園部藩」の記事（Wikipedia）による。公的出典での照合は未実施。","綾部県・山家県の統合日は、各藩の記事に記載がない。","京都府公式に日付まで書いた沿革ページは見つからなかった。国立公文書館（アジア歴史資料センター）での照合は未実施。","1871年8月29日（明治4年7月14日）の新暦換算は、他の日付との整合を確認した換算。"],"d":["「京都守護が最初」は東書Eネットの説明で、同ページ自身が「定かではない」と書いている。","「府」の字の由来は、佐々木克氏の説明を日本経済新聞が紹介したもの（個人の説）。"],"e":["城の項目はWikipediaのみが出典。文化庁・市の公式での照合は未実施。","伏見城は2か所ある。1592年の築城は指月のもの、木幡山は1596年の大地震のあとに移して再築した（京都市の公式資料で確認）。現在の模擬天守の場所との関係は、出典に明記がない。","園部城の「最後の建築物」は出典の表現どおり。他の見方もありうる。","淀城は、淀殿ゆかりの「淀古城」とは別の城。注記を追加予定。","二条城での大政奉還（1867）の記述が出典にない。追加予定。","福知山城・伏見城・田辺城は、出典の記事内で廃城年の表記が割れている（注記のとおり）。"],"f":["宇治の玉露の創製年は出典では1834年。他の資料で年が異なる可能性があり、確認中。","西陣織の「家茂と和宮」の話は、1記事のみの逸話。","江戸時代の名産は、藩の記事と京都府公式資料までしか確認できていない。藩や幕府の記録そのものは未確認。","地域団体商標の一覧は令和6年1月時点。商標の登録は「名産」と同義ではない。京あめ／京飴の表記が、資料により揺れている。","伝統的工芸品17品目は、伝統的工芸品産業振興協会の指定品目一覧（2025年10月27日現在）と一致した。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","一保堂茶舗の設立年は、公式サイトが1982年、京都市が1964年 年設立から始まる。創業と設立を分けて転記した。","- 注記（オムロンの創業地）：オムロンの創業は1933年、大阪市都島区東野田（立石電機製作所）であり、京都へ本社を移したのは1945年である。創業100年には2026年時点で達していない（93年）ため、h-1には入れずh-2のみに掲載した。","- 注記（府外へ本社を移した企業）：今回の候補の中に、発祥が京都府で現在は府外に本社を置く企業は確認されなかった。鳩居堂の東京法人（株式会社東京鳩居堂、本社・東京都中央区銀座）は上記のとおり注記に留めた。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 鳩居堂 公式サイト（kyukyodo.co.jp）の会社概要・沿革ページ：トップページは取得できたが、「鳩居堂について」の下位ページの本文は今回取得できず、創業1663年・分社化の経緯は公式サイトでは直接確認できなかった（Wikipediaおよび関係者発言で代替）。","- 中村藤吉本店 公式サイト（tokichi.jp）の会社概要ページ：今回未取得。創業1854年（安政元年）・設立1949年12月・本社所在地は、求人媒体に掲載された同社の企業情報で確認したにとどまる。","- 任天堂・京セラ・ニデックの公式サイトの会社概要ページ：今回直接取得しておらず、創業・設立・本社所在地はWikipediaおよび公式サイト引用の二次資料で確認した。公式ページでの直接照合は未実施である。"],"tables":[]}]},{"id":"nara","title":"奈良県","sub":"旧大和国","meta":["- 取得日：2026-11-18","- 前提：要約・加工なし、出典つき転記。事実と推測を分け、確認できないことは「未確認」と書く。公的・公式出典をWikipediaより優先し、Wikipediaだけの項目は出典の種別にその旨を残す。出典の種別は「公的」「自治体」「その他（内容）」「Wikipedia」の4種。","- 暦の方針：日付は新暦を主にし、1872年末までの日付は旧暦を括弧で併記する。1582年以前の西暦の月日は暦の種別を注記し、分からなければ「暦不明」と書く。出典が旧暦か新暦か判断できない日付は原文のまま書き「暦不明」と注記する。","- 表の列は京都のe・fの形式にそろえた。末尾に「注記・食い違い」「取得不可だったページ」「照合区分の一覧」を付ける。","---"],"a":[{"h":"a. 旧国名と五畿七道","lv":2,"text":["出典：","- Wikipedia「大和国」 https://ja.wikipedia.org/wiki/大和国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「五畿七道」 https://ja.wikipedia.org/wiki/五畿七道 （取得日2026-11-18、種別：Wikipedia）"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["a1","大和国","やまとのくに","日本の地方行政区分である令制国の一つ。畿内に属する。現在の奈良県に相当","律令制定の際の表記は「大倭国（やまとのくに）」として成立したとされる","Wikipedia"],["a2","大和国の別称","―","和州","「大和国」記事の基礎情報欄「別称：和州（わしゅう）」","Wikipedia"],["a3","大和国の異称","―","「神国」","戦国時代を経ても古い寺社が権門領主として大和国を支配していたことから、安土桃山時代には「神国」という異称もあった（記事）","Wikipedia"],["a4","国名表記の変遷","―","大倭国 → 大養徳 → 大倭 → 大和","天平9年12月27日（ユリウス暦:738年1月21日）に表記は「大養徳」に改められた。天平19年3月16日（747年4月29日）には元の「大倭」に改称。その後、天平宝字元年（757年）頃から「大和」に定められたとされる。平安時代以降は「大和」で一般化した","Wikipedia"],["a5","五畿（畿内）","ごき（きない）","大和、山城、摂津、河内、和泉の五国。現在の奈良県、京都府中南部、大阪府、兵庫県南東部を合わせた地域","五畿七道は「畿内七道（きないしちどう）」とも呼ばれた。1869年（明治2年）、北海道が新設されてからは五畿八道と呼ばれる","Wikipedia"],["a6","大和国の郡・郷数","―","15郡39郷","「大和国」記事の基礎情報欄「郡・郷数」による","Wikipedia"],["a7","大和国の郡（15郡）","―","添上郡、添下郡、平群郡、広瀬郡、葛上郡、葛下郡、忍海郡、宇智郡、宇陀郡、式上郡、式下郡、十市郡、高市郡、山辺郡、吉野郡","郡名は『延喜式』による（記事）。古代の郡名として曾布（→添上・添下）、葛城（→葛下・葛上・忍海）、磯城（城上→式上、城下→式下）などの対応も記事に記載","Wikipedia"]]}]},{"h":"注記・食い違い（a）","lv":3,"text":["- 他の旧国にまたがる地域：「大和国」記事の基礎情報欄「相当領域」は「奈良県」とのみあり、奈良県域が大和国以外の令制国にまたがる旨の記述は、取得した記事には見当たらなかった。公的出典での照合は未実施のため、この点は未確認として残す。","- 747年の改称日：「大和国」記事は「天平19年3月16日（747年4月29日）」と西暦日を併記するが、その西暦日がユリウス暦かグレゴリオ暦かの明記はない。738年の改称日については記事が「ユリウス暦:738年1月21日」と明記している。747年分は暦不明として扱う。","- 「大和」への確定時期について、記事の注釈は「国史に改名記事がないため時期は諸説あるが、天平宝字元年（757年）の『養老令』施行からが有力視される（上田正昭『私の日本古代史（上）』）」としている。断定ではないため「とされる」として転記した。"],"tables":[]},{"h":"取得不可（a）","lv":3,"text":["- なし（指定の候補ページはすべて取得できた）。ただし公的・自治体出典（奈良県公式など）での大和国の相当領域・郡数の照合は今回未実施で、a全体がWikipediaのみの出典である。","---"],"tables":[]}],"b":[{"h":"b. 江戸時代の藩と藩主","lv":2,"text":["出典：Wikipedia「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧 （取得日2026-11-18、種別：Wikipedia）および各藩・藩主の個別記事（出典一覧は本節末尾）。公的・自治体出典での照合は本節では未実施。読みが藩記事になく個人記事も取得できなかった藩主は「―（記事に読みなし）」とした。","「藩の一覧」の大和国の項に挙がる藩は次の16藩：柳生藩（1636年-）、郡山藩（1615年-）、小泉藩（1600年-）、柳本藩（1600年-）、戒重藩（1615年-）、芝村藩（1745年-）、櫛羅藩（1863年-）、宇陀松山藩（1600年-）、高取藩、興留藩（1679年-）、竜田藩（1601年-）、田原本藩（1868年-）、岸田藩、大和新庄藩（1600年-）、御所藩（1600年-）、大和五条藩（1600年-）。","※同記事の凡例：「設立後、すぐに廃藩となった藩などは記されていない場合がある」。なお興留藩について一覧は「1679年-」とするが、個別記事「興留藩」は立藩を貞享3年（1686年）とし、食い違いがある（注記参照）。"],"tables":[{"cols":["番号","藩名","読み","立藩年","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城・陣屋","出典の種別"],"rows":[["1","柳生藩","やぎゅうはん","記事に単一の立藩年の明記なし（初代の在職は寛永13年＝1636年〜。宗矩の死後に分知され一時旗本となり、寛文8年（1668年）に大名復帰）","柳生宗矩（やぎゅう むねのり）","柳生俊益（やぎゅう とします）※第13代","1万2500石→8300石（旗本）→1万石","柳生陣屋","Wikipedia"],["2","郡山藩","こおりやまはん","元和元年（1615年）（水野勝成が6万石で入って立藩）","水野勝成（みずの かつなり）","柳沢保申（やなぎさわ やすのぶ）※柳沢家第6代","水野家6万石→松平（奥平）家12万石→本多家15万石→12万石→松平（藤井）家12万石（本文では信之は8万石で入封とあり食い違い・注記参照）→本多家12万石→5万石→柳沢家15万1000石","郡山城（大和郡山市）","Wikipedia"],["3","小泉藩","こいずみはん","慶長5年（1600年）（片桐貞隆が大和小泉1万石に移され立藩。個人記事「片桐貞隆」には1615年に1万6千石を知行とあり食い違い・注記参照）","片桐貞隆（かたぎり さだたか）","片桐貞篤（かたぎり さだあつ）※第12代","1万石→1万6000石→1万3000石→1万2000石→1万1000石（歴代藩主表見出しは1万2000石の段階を欠く）","小泉陣屋（大和郡山市小泉町）", 石から1万石へ減）","未確認（取得した記事本文に居城・陣屋の明記なし）","Wikipedia"],["13","田原本藩","たわらもとはん","慶応4年（1868年）7月14日（新政府により1万石の大名となった「維新立藩」。江戸時代を通じては交代寄合・平野家の知行地）","平野長裕（ひらの ながひろ）※初代かつ最後の正式な藩主（在任約3年）。知行地としての初代領主は平野長泰（ながやす）","平野長裕（同左）","5000石→1万石","田原本陣屋（田原本町）","Wikipedia"],["14","岸田藩","―（取得不可）","未確認","未確認","未確認","未確認","未確認","Wikipedia（取得不可）"],["15","大和新庄藩（桑山家）","やまとしんじょうはん（新庄村成立以前は布施藩（ふせはん）とも）","慶長5年（1600年）説（『徳川加封録』）と慶長6年（1601年）説（『寛政譜』）の両論併記","桑山一晴（くわやま かずはる）","桑山一尹（―（記事に読みなし））※第4代。天和2年（1682年）5月に改易","2万石→1万6000石→1万3000石→1万1000石","新庄城／新庄陣屋（葛城市新庄。屋敷山古墳の墳丘を利用）","Wikipedia"],["16","大和新庄藩（永井家）","同上（「新庄藩」と呼ばれる）","延宝8年（1680年）より永井氏が当地周辺で1万石を領する（定府の大名で、新庄村に陣屋を置いたとも伝えられていない）","永井直圓（なおみつ）※本文の表記は「直円（なおみつ）」、歴代藩主欄は「直圓」","永井直壮（―（記事に読みなし））※第8代。文久3年（1863年）に櫛羅へ陣屋を移し以後は櫛羅藩","1万石","―（陣屋なし。1863年に櫛羅陣屋を新設）","Wikipedia"],["17","御所藩","ごせはん","慶長5年（1600年）の分与により成立（最大時2万6000石、2代約30年）","桑山元晴（くわやま もとはる）","桑山貞晴（―（記事に読みなし））※第2代。寛永6年（1629年）に無嗣で死去し、末期養子が認められず廃藩","1万2000石→1万石→1万6000石→2万6000石（個人記事「桑山元晴」では2万6380石とあり食い違い・注記参照）","御所陣屋（御所市。所在地は正確にはわかっていないと記事に記載）","Wikipedia"],["18","大和五条藩","やまとごじょうはん（別名：五条二見藩、二見五条藩）","慶長5年（1600年）に五條1万石を与えられ立藩とする本文と、『寛政譜』による慶長13年（1608年）7月に二見五條で1万石を与えられたとする記述の両論併記","松倉重政（まつくら しげまさ）※1代のみ","松倉重政（同左）。元和2年（1616年）に肥前島原藩4万3000石へ加増移封され廃藩、旧藩領は幕府領となった","1万石","二見城（二見五条、五條市二見町）","Wikipedia"]]}]},{"h":"飛地（本拠が県域外の藩の大和国内領地）","lv":3,"text":["出典：Wikipedia「大和国」 https://ja.wikipedia.org/wiki/大和国 （取得日2026-11-18、種別：Wikipedia）","同記事の『旧高旧領取調帳』に基づく明治初年時点の国内支配一覧（1,497村・495,885石余）に、飛地領として挙がる他国の藩は次のとおり。","※このほか同郡内に公家領（添上郡）、能楽師領（添上郡）、奈良楽人領（平群郡）の記載がある。"],"tables":[{"cols":["藩名","本拠","大和国内の飛地がある郡（記事の記載どおり）"],"rows":[["伊勢津藩","伊勢国","添上郡、式上郡、十市郡、山辺郡"],["伊勢久居藩（津藩支藩）","伊勢国","添上郡、広瀬郡、式上郡、十市郡、山辺郡"],["下野壬生藩","下野国","葛下郡"],["上総大多喜藩","上総国","十市郡"]]}]},{"h":"幕府領・旗本領","lv":3,"text":["出典：Wikipedia「大和国」、「遠国奉行」 https://ja.wikipedia.org/wiki/遠国奉行 、「五條代官所」 https://ja.wikipedia.org/wiki/五條代官所 （いずれも取得日2026-11-18、種別：Wikipedia）","- 幕府領の管轄：明治初年時点の一覧では、奈良奉行が添上・平群・葛上・葛下・式上・式下・忍海・宇陀・高市・十市・山辺の各郡に、五條代官所が葛上・宇智・宇陀・吉野の各郡に、それぞれ幕府領の管轄として記載されている。","- 奈良奉行：「遠国奉行」記事の奈良奉行の節による。慶長18年（1613年）設置。京都所司代の指揮下で奈良の町政および寺社を管轄し、興福寺・東大寺など南都の大寺院の監視と門前町（北町・南町）の支配のため設置された（南都町奉行とも）。定員1、2名、役高1,000石。奉行所は現・奈良女子大学の敷地内に置かれていた。","- 五條代官所：寛政7年（1795年）に大和国宇智郡五條村（現在の五條市本町）に設けられた。文久3年（1863年）の天誅組の変で襲撃・放火され、元治元年（1864年）10月に新町村（現在の五條市新町三丁目）で再建。明治3年（1870年）2月、旧代官所を県庁として五條県が設置され、旧代官所管轄地や旧旗本領を管轄した。","- 高取藩による幕府領の預かり：「高取藩」記事による。第5代藩主・植村家包の時代の元文3年（1738年）から大和国における幕府領の預かりを任され、第9代・植村家長の時代には預かり地が6万6000石近くになった。","- 旗本領：「大和国」記事の一覧では、添下・平群・葛下・式上・式下・宇智・高市・十市・山辺・吉野の各郡に「旗本領」の記載がある。沿革欄：「慶応4年5月21日（1868年7月10日）— 寺社領・旗本領が奈良府の管轄となる」。","- 寺社領：同記事の総括文：「下記のほか葛上郡・忍海郡・宇智郡を除く各郡に寺社領が所在」。","- 宇陀松山藩の廃藩後：「宇陀松山藩」記事による。元禄8年（1695年）の廃藩以後、旧領は「江戸時代を通じて天領となった」と記載。"],"tables":[]},{"h":"注記・食い違い（b）","lv":3,"text":["1. 興留藩の立藩年：「藩の一覧」は「1679年-」とするが、個別記事「興留藩」は立藩を貞享3年（1686年）8月とする。両論併記。","2. 郡山藩・松平信之の石高：歴代藩主表の見出しは「松平（藤井）家 譜代 12万石（1679年 - 1685年）」だが、藩史本文は「忠国移封後は、播磨国明石藩から松平信之が8万石で入る」とする。記事内の食い違いとして併記。","3. 小泉藩の立藩：藩記事は慶長5年（1600年）に1万石で立藩とするが、初代の個人記事「片桐貞隆」の略歴は「1615年、大和国小泉に1万6千石を知行した」とする。両論併記。また石高について、歴代藩主表見出しは1万2000石の段階を欠くが、藩史本文には第3代・片桐貞房の分与で1万2000石となった記述がある。","4. 櫛羅藩の立藩年：藩記事本文は文久3年（1863年）の陣屋新設をもって立藩とするが、同記事の注釈が引く『藩と城下町の事典』は1680年に永井直円が櫛羅で1万石を与えられて立藩とし、『角川新版日本史辞典』附録は1680年に新庄へ入封・1863年に居所を移して新庄藩は廃藩とする。両論併記。","5. 大和新庄藩の立藩年：慶長5年（1600年）説（『徳川加封録』）と慶長6年（1601年）説（『寛政譜』）を記事が併記。両論併記。また永井家の始祖の表記は本文「直円（なおみつ）」、歴代藩主欄「直圓」で揺れがある。","6. 御所藩の最大石高：歴代藩主表見出しは2万6000石、個人記事「桑山元晴」は慶長14年（1609年）に「2万6,380石を領する大名となった」とする。両論併記。","7. 大和五条藩の立藩年：本文の慶長5年（1600年）説と『寛政譜』の慶長13年（1608年）説を記事が併記。両論併記。","8. 高取藩の本多家の石高：歴代藩主表見出しは「3万石（異説として2万5000石）」とし、藩史本文は関ヶ原の戦功で2万5000石に加増（異説として3万石）とする。両論併記。","9. 芝村藩の最後の藩主の読み：歴代藩主表では第10代・織田長恭と第11代・織田長易がいずれも「ながやす」と表記されている。記事の表記どおり転記した。","10. 柳生藩の廃藩年：取得した記事本文に廃藩置県の記述がなく、最後の藩主の在職が明治2年（1869年）までとされるのみのため、廃藩年は未確認とした。","11. 田原本藩の廃藩年：取得した記事本文に廃藩年・経緯の記載がなく未確認とした。","12. 竜田藩の居城・陣屋：取得した記事本文に名称の明記がなく未確認とした。また最後の藩主・片桐為次の死去は「翌年11月」とのみ記され、元号・西暦の明記はない（承応3年（1654年）の翌年）。","13. 奈良奉行の単独記事：日本語版「奈良奉行」の単独記事は取得できなかったため、「遠国奉行」記事中の奈良奉行の節の記述を転記した。"],"tables":[]},{"h":"取得不可（b）","lv":3,"text":["- Wikipedia「岸田藩」 https://ja.wikipedia.org/wiki/岸田藩 — 取得失敗のため再取得できず、内容未確認（「藩の一覧」の大和国の項には藩名のみ挙がる）。","- 藩主個人記事（レート制限429のため取得不可）：「永井直壮」「永井直哉」「松平信通」「片桐且元」「片桐為次」「桑山一尹」「桑山貞晴」— このため当該藩主の読みは「―（記事に読みなし）」のまま残した。"],"tables":[]},{"h":"出典一覧（b、取得日はいずれも2026-11-18、種別はいずれもWikipedia）","lv":3,"text":["- 「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧","- 「柳生藩」「郡山藩」「小泉藩」「柳本藩」「芝村藩」（「戒重藩」からリダイレクト）「櫛羅藩」「宇陀松山藩」「高取藩」「興留藩」「竜田藩」「田原本藩」「大和新庄藩」「御所藩」「大和五条藩」「大和国」「遠国奉行」「五條代官所」（各 https://ja.wikipedia.org/wiki/記事名 ）","- 読みの出典：「水野勝成」「柳沢保申」「片桐貞隆」「片桐貞篤」「本多俊政」「植村家政」「植村家壺」「桑山一晴」「桑山元晴」「松倉重政」","---"],"tables":[]}],"c":[{"h":"c-1. 表：廃藩置県で県になった旧藩と、幕府領から県になったもの","lv":3,"text":["前提：廃藩置県は1871年8月29日（明治4年7月14日）に実施され、各藩はそのまま県を名乗った（Wikipedia「廃藩置県」 https://ja.wikipedia.org/wiki/廃藩置県 、取得日2026-11-18、種別：Wikipedia）。大和国の県として同記事のリストに挙がるのは、柳生県・郡山県・小泉県・柳本県・芝村県・田原本県・高取県・櫛羅県と、廃藩置県以前から存在した奈良県・五條県の計10県である。第1次府県統合での奈良県設置は、1872年1月2日（明治4年11月22日）布告（法令全書所収・太政官布告第614号）による「奈良県 - 大和国一円」と同記事にある。同記事は断りとして「合併の期日も、資料によってはこれと異なるものもある」と記す。","注記（飛地の5藩）：奈良県立図書館「奈良県の誕生」は「大和8藩以外に久居・津・大多喜・壬生・和歌山の他藩領があったが、いずれも明治4年11月22日に奈良県となった」とする。これら5藩は本拠地でそれぞれ県を名乗っており（Wikipedia「廃藩置県」のリストでは津県・久居県は伊勢国、和歌山県は紀伊国、大多喜県は上総国、壬生県は下野国に分類）、大和国内の飛地領が奈良県に編入されたものである。奈良県公式の県政略年表は統合について「奈良・五條を含む15県を廃し、奈良県を設置」と記しており、上の10県にこの5藩を加えた数え方とみられるが、年表自体に15県の内訳の明記はない（未確認）。","注記（五條県の管轄の変遷）：Wikipedia「五條県」によれば、1870年4月27日（明治3年4月27日）に堺県のうち紀伊国内の旧高野山領を、1870年6月17日（明治3年5月19日）に軍務官・兵部省管轄の大和国吉野郡十津川郷を、それぞれ管轄に加えた。"],"tables":[{"cols":["番号","県名","読み","前身","発足日","統合先・廃止先","統合日・廃止日","出典の種別"],"rows":[["1","奈良県（慶応4年設置分）","ならけん","大和鎮撫総督府（大和国一円の幕府領・旗本領・寺社領）","1868年7月8日（慶応4年5月19日）","奈良県（大和国一円を管轄する統合後の奈良県）","1872年1月2日（明治4年11月22日）","Wikipedia／自治体"],["2","五條県","ごじょうけん","五條代官所の管轄区域・大和国南部の旧旗本領・河内国南部の旧幕府領・旗本領の一部（旧幕府領・旗本領から設置）","1870年3月28日（明治3年2月27日）","大和国分は奈良県、河内国分は堺県、紀伊国分は和歌山県へ。同日、五條県廃止","1872年1月2日（明治4年11月22日）","Wikipedia／自治体"],["3","郡山県","こおりやまけん","郡山藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["4","高取県","たかとりけん","高取藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["5","小泉県","こいずみけん","小泉藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["6","櫛羅県","くじらけん","櫛羅藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["7","芝村県","しばむらけん","芝村藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["8","柳生県","やぎゅうけん","柳生藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["9","柳本県","やなぎもとけん","柳本藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"],["10","田原本県","たわらもとけん","田原本藩","1871年8月29日（明治4年7月14日）","奈良県","1872年1月2日（明治4年11月22日）","Wikipedia／その他（教育サイト）"]]}]},{"h":"c-2. 奈良県の設置・廃止・再設置","lv":3,"text":["出典：Wikipedia「奈良県」 https://ja.wikipedia.org/wiki/奈良県 、「奈良県再設置運動」 https://ja.wikipedia.org/wiki/奈良県再設置運動 、奈良県公式「県政沿革」、奈良県立図書館「奈良県の誕生」、Wikisource「奈良縣設置ノ件」（取得日はいずれも2026-11-18）。","- 1868年2月14日（慶応4年1月21日）：新政府が添上郡奈良に大和鎮台を設置。大和鎮撫総督府を経て（県政略年表では「のち2月1日大和国鎮撫総督府と改称」）。","- 1868年7月8日（慶応4年5月19日）：奈良県（第1次）を設置。大和国一円の幕府領・旗本領・寺社領を管轄。初代知事（知県事）は春日仲襄。","- 1868年9月15日（慶応4年7月29日）：奈良府に改称。","- 1869年8月24日（明治2年7月17日）：奈良県に改称（日付に食い違いあり、注記参照）。","- 1870年：宇智郡・吉野郡などを五條県へ移管（五條県の設置は上表のとおり）。","- 1872年1月2日（明治4年11月22日）：大和国の各県が統合され、大和国一円を管轄する奈良県が設置された（第1次府県統合）。県庁は興福寺一乗院、県令は五條県知事だった四条隆平（県立図書館「奈良県の誕生」）。","- 1876年4月18日：奈良県は堺県に編入されて廃止（第2次府県統合）。","- 1881年2月7日：堺県が大阪府に編入されて廃止。同年12月、今村勤三ら大和出身の大阪府会議員を中心に奈良県再設置運動が開始された。","- 1887年11月4日：奈良県（第2次）が再設置された。根拠法令は明治20年勅令第59号「奈良縣設置ノ件」（公布日：明治20年11月4日、底本『官報』1887年11月10日）。勅令の本文は「奈良縣ヲ置ク／縣廰位置 大和國添上郡奈良／管轄 大和國一圓」。初代県知事は税所篤。","- 1887年12月1日：奈良県庁開庁（県政略年表「12月1日 奈良県開庁。（知事に税所篤）」、県立図書館「奈良県の誕生」も「12月1日に奈良県庁開庁式」）。"],"tables":[]},{"h":"c-3. 公式照合の結果","lv":3,"text":["照合できたもの","- 奈良県公式サイト「県政沿革」（『奈良県政概要』第1章、PDF https://www.pref.nara.lg.jp/documents/12514/n040101_02.pdf 、種別：自治体）：慶応4年1月21日 大和鎮台設置、2月1日 大和国鎮撫総督府と改称、5月19日 奈良県を置く、7月29日 奈良府と改称、明治2年7月17日 奈良県と改称、明治4年11月22日「奈良・五條を含む15県を廃し、奈良県を設置」、明治14年2月7日 堺県が大阪府に合併、明治20年11月4日 大阪府から分離して奈良県が置かれる、12月1日 奈良県開庁——の日付が年表形式で確認できた。","- 奈良県公式サイト「奈良県はいつできたのかな」 https://www.pref.nara.lg.jp/n002/1335.html （種別：自治体）：明治元年（1868年）に奈良県、明治4年（1871年）に大和国内に15県ができそののち大和全域を管轄する奈良県、明治9年（1876年）に堺県へ合併、明治14年（1881年）に堺県が大阪府へ合併、明治20年（1887年）に奈良県再設置——年までの照合ができた（日付レベルではない）。","- 奈良県立図書館「奈良県の誕生」 https://www.library.pref.nara.jp/sites/default/files/002_s.pdf （種別：自治体）：大和鎮台（1.1.21）→奈良県（1.5.19）→奈良府（1.7.29）→奈良県（2.7.17）→五條県（3.2.27）→奈良県（4.11.22）→堺県（9.4.18）→大阪府（14.2.7）→奈良県（20.11.4）の変遷図と、各藩県の発足（4.7.14）が確認でき、Wikipediaの日付と一致した。","照合できなかったもの","- 国立公文書館／アジア歴史資料センター（JACAR）：太政類典に収録されるはずの第1次府県統合・堺県編入の記録、および明治20年勅令第59号の御署名原本について、今回の検索範囲では該当文書そのものに到達できず、未確認（照合未実施）。なお勅令第59号の本文自体は、Wikisource「奈良縣設置ノ件」 https://ja.wikisource.org/wiki/奈良縣設置ノ件 （底本：『官報』1887年11月10日、国立国会図書館デジタルコレクション）で確認できた。奈良県公式の県政だより記事（「県民だより奈良」2022年11月号）には「奈良県設置の勅令（国立公文書館所蔵）」の写真が掲載されている旨が二次的に確認できるのみである。"],"tables":[]},{"h":"注記・食い違い（c）","lv":3,"text":["1. 奈良府から奈良県への改称日：1869年8月24日（明治2年7月17日）とするもの（奈良県公式「県政沿革」、奈良県立図書館「奈良県の誕生」の変遷図、Wikipedia「奈良県」）に対し、Wikipedia「奈良県再設置運動」は「明治2年（1869年）7月12日に再び奈良県に戻されている」と記す。食い違いとして両方を併記する。公式資料はいずれも7月17日である。","2. 統合で廃された県の数：Wikipedia「廃藩置県」の大和国リストとWikipedia「奈良県」（「大和国10県が統合」）は10県、奈良県公式（「県政略年表」および「奈良県はいつできたのかな」）は15県とする。食い違い。15県は飛地を持つ5藩（久居・津・大多喜・壬生・和歌山）を加えた数と整合するが、公式年表に内訳の明記はなく、その点は未確認。","3. 五條県の成立時の構成：奈良県立図書館「奈良県の誕生」は「奈良県管轄の大和国宇智郡・吉野郡が分離して、河内国の一部と紀伊国の一部とともに新たに五條県が成立」とする。東書Eネットは「奈良県の宇智、吉野郡と堺県の錦部、石川両郡をあわせて五條県が成立」とする。Wikipedia「五條県」は「奈良県のうち旧五條代官所の管轄区域、大和国南部の旧旗本領および河内国南部の旧幕府領・旗本領の一部を管轄」とし、高野山領（紀伊国）と十津川郷は設置後に編入されたとする。記述に差異があるため併記する。","4. 五條県の管轄に葛上郡・宇陀郡が含まれるか：Wikipedia「奈良県」は明治3年に「宇智郡・吉野郡および葛上郡・宇陀郡の一部を五條県に移管」と記すが、Wikipedia「五條県」は「旧高旧領取調帳」以外の資料に葛上郡・宇陀郡の記述がなく「誤記と考えられる」と記す。食い違い。","5. 第1次府県統合の期日について：Wikipedia「廃藩置県」は、太政官布告に基づく一覧を示しつつ「合併の期日も、資料によってはこれと異なるものもある」と断っている。奈良県については布告日と統合日が同日（明治4年11月22日）とされているが、布告日と実施日の区別は同記事上も明確には分かれていない（未確認）。"],"tables":[]},{"h":"取得不可・未確認（c）","lv":3,"text":["- 国立公文書館／アジア歴史資料センター（JACAR）の該当文書（太政類典所収の府県統合・堺県編入の記録、明治20年勅令第59号の御署名原本）：今回の検索では文書そのものに到達できず、取得不可（未確認）として扱う。日付の照合は奈良県公式サイト・奈良県立図書館資料とWikipediaの範囲で完了し、JACARでの照合はできなかった。","- 15県の内訳（公式年表の明記なし）：未確認。","- 第1次府県統合における奈良県設置の布告日と実施日の区別：未確認。","---"],"tables":[]}],"d":[{"h":"d-1. 県名「奈良県」の由来（事実として出典に記されるもの）","lv":3,"text":["奈良県公式サイト「奈良県はいつできたのかな」 https://www.pref.nara.lg.jp/n002/1335.html （取得日2026-11-18、種別：自治体）の「※県名の由来」には、次のとおり記されている。「平安時代から鎌倉時代にかけて、東大寺や興福寺の門前町として『奈良町』が生まれ、江戸時代には幕府の奉行所がおかれて政治の中心となりました。明治時代になって県名をつけるとき、それをとったのが由来です。」Wikipedia「奈良県再設置運動」 https://ja.wikipedia.org/wiki/奈良県再設置運動 （種別：Wikipedia）も「奈良県という名の由来は、東大寺や興福寺の門前町で、幕府の奉行所が置かれていた『奈良町』からとられたものである」と記す。東書Eネット「都道府県の豆知識 奈良県」 https://ten.tokyo-shoseki.co.jp/ten_download/2020/2020078366.htm （種別：その他（教育サイト））の県名の由来も同旨である。","県名の決定時期：県名「奈良県」が初めて現れるのは1868年7月8日（慶応4年5月19日）の奈良県設置のときで（c-2参照）、県庁所在地の奈良（奈良町）の名をとったものとされる。1887年の再設置でも、勅令第59号は「奈良縣ヲ置ク」とし、県庁位置を「大和國添上郡奈良」と定めた。"],"tables":[]},{"h":"d-2. 地名「奈良」の語源（諸説。いずれも仮説であり、確定した事実ではない）","lv":3,"text":["出典：Wikipedia「奈良」 https://ja.wikipedia.org/wiki/奈良 （取得日2026-11-18、種別：Wikipedia）。同記事は「奈良の語源を巡っては諸説あるが、比較的知られているものを挙げる」と前置きする。","説1 『日本書紀』による説","武埴安彦命の反乱鎮圧に向かった大彦命らの軍勢が、当地の丘（平城山丘陵）の草木を踏みならしたという記録に由来するとする。『日本書紀』崇神天皇十年九月条に「則ち精兵（ときいくさ）を率（ゐ）て、進みて那羅山に登りて軍（いくさだち）す。時に官軍（みいくさ）屯聚（いは）みて、草木を蹢跙（ふみなら）す。因りて其の山を号（なづ）けて、那羅山と曰ふ」とある。同記事は「これ自体はよくある地名由来譚であり史実とみる研究者は少ないものの、最古の史料として必ず言及され、また下記の柳田説とも言語学的関連がある」と記す。","説2 柳田國男による説","「平（なら）した地」の意で、緩傾斜地を指すとする説。柳田國男が『地名の研究』（1936年）で論じた。柳田によれば、東国では平（タヒラ）、九州南部ではハエと呼ばれる「山腹の傾斜の比較的緩やかなる」地形は、中国・四国ではナルと呼ばれ、ナラス（動詞）・ナラシ（副詞）・ナルシ（形容詞）はその変化形である。ナルと呼ばれる地名には「平」を含んだ漢字が当てられており、「文字が語義を証明している」とする。『因幡志』（1795年）巻14に「平地」と書いて「ナルヂ」の振仮名があることも根拠に挙げる。ナラ・ナロはその異種で、奈良はかつて「平城」とも書かれた。同記事は、この説が日本国語大辞典、各種の地名辞典や郷土史本でも取り上げられていると記す。奈良市第4次総合計画（奈良市公式 https://www.city.nara.lg.jp/uploaded/attachment/30231.pdf 、種別：自治体）も「一般に古代人の住居に適したなだらかな丘陵地を意味する平地（なるじ）、平（なら）などのナラとする説」を挙げており、この系統の説を自治体資料でも確認できる。","説3 吉田東伍による説","植物の「ナラ（楢）」に由来するとする説。吉田東伍による（『大日本地名辞書』1907年）。植物のナラは『万葉集』や『播磨国風土記』（715年）に見られ、『播磨国風土記』には「楢原（ならはら）と号（なづ）くる所以は、柞（なら）此の村に生へり。故、柞原といふ」とある。角川日本地名大辞典はこの説も取り上げるが、楠原佑介ほか（『古代地名語源辞典』）はこの説を退けると同記事は記す。","説4 朝鮮語からの借用語とする説","朝鮮語「나라（ナラ）」（国の意）からの借用語とする説。朝鮮語の影響の指摘は金沢庄三郎『寧楽考』（1910年）に見られる。文献でナラの語が確認できるのは15世紀（『竜飛御天歌』1447年など）で、より古くは *narak という発音だったと考えられる。一方、ナラ・ナル・ナロという地名が奈良以外にも多く存在することを説明できないという否定的意見もある（楠原ほか）。奈良市第4次総合計画も「渡来人の居住地を古代の朝鮮で国を意味する言葉からナラと名付けたことから、ナラの地名がおこったとする説」を併記している。","説5 ツングース諸語との関連をみる説","ツングース系のいくつかの言語や日本語（さらに高句麗の言語）では na が「地」などの意味を表すが、「奈良」の語源はこれと関係するのではないかとみる説がある（同記事。出典として奈良市編『奈良市史』1937年などが引かれる）。","なお、表記については「奈良」の異表記として那羅・平城・寧楽・乃楽・楢などがあり、読みは全て「なら」である（Wikipedia「奈良」）。"],"tables":[]},{"h":"注記（d）","lv":3,"text":["- 「奈良」の語源の諸説はいずれも仮説であり、Wikipedia「奈良」自体が「諸説ある」とする。説1は「史実とみる研究者は少ない」と記事が明記する。県名の由来（奈良町からとった）とは別の問題として分けて扱った。","---"],"tables":[]}],"e":[{"h":"e. 有名な城","lv":2,"text":["出典（取得日はいずれも2026-11-18）：","- Wikipedia「郡山城 (大和国)」 http://ja.wikipedia.org/wiki/郡山城_(大和国) （種別：Wikipedia）※基礎情報欄は検索結果に表示された記事抜粋で確認。本文の直接取得は未実施（取得不可参照）","- Wikipedia「高取城」 https://ja.wikipedia.org/wiki/高取城 （種別：Wikipedia）","- Wikipedia「多聞山城」 https://ja.wikipedia.org/wiki/多聞山城 （種別：Wikipedia）","- Wikipedia「筒井城」 https://ja.wikipedia.org/wiki/筒井城 （種別：Wikipedia）","- Wikipedia「信貴山城」 https://ja.wikipedia.org/wiki/信貴山城 （種別：Wikipedia）","- Wikipedia「現存天守」 https://ja.wikipedia.org/wiki/現存天守 （種別：Wikipedia）","- 奈良県公式「郡山城」 https://www.pref.nara.lg.jp/ikasu-nara/naranoshiro/koriyamajo/index.html （種別：自治体）","- 大和郡山市公式「郡山城～国史跡・続日本100名城・日本さくら名所100選～」 https://www.city.yamatokoriyama.lg.jp/soshiki/chiikishinkoka/kanko/2/1630.html （種別：自治体）","- 大和郡山市公式「国38 郡山城跡」 https://www.city.yamatokoriyama.lg.jp/soshiki/machidukuri_senryaku/rekishi_bunkazai/bunkazai101/j_bunkazai/shiseki/1847.html （種別：自治体）","- 大和郡山市公式「令和7年3月『幻の天守(閣)』」 https://www.city.yamatokoriyama.lg.jp/soshiki/hisyoka/shichoshitsu/1/reiwa7/16211.html （種別：自治体）","- 大和郡山市「史跡郡山城跡整備基本計画」第3章 https://www.city.yamatokoriyama.lg.jp/material/files/group/63/seibi_kihon_keikaku03.pdf （種別：自治体）","- 文化庁「文化審議会の答申（史跡等の指定等）について」（令和4年6月17日） https://www.bunka.go.jp/koho_hodo_oshirase/hodohappyo/pdf/93721801_01.pdf （種別：公的）※郡山城跡の答申部分は検索結果に表示された抜粋で確認"],"tables":[{"cols":["番号","名称","読み","築城者","築城年","廃城年または現状","現存・再建建物","出典の種別"],"rows":[["1","大和郡山城","こおりやまじょう","郡山衆及び筒井順慶","応保2年（1162年）及び天正8年（1580年）","1873年（明治6年）。なお慶長5年（1600年）に一旦取り壊され廃城、元和元年（1615年）以降に再興された（奈良県公式）","現存建物なし（天守は非現存）。再建：追手向櫓、追手東隅櫓、多聞櫓、追手門（梅林門）、極楽橋。天守台は展望施設として整備（平成29年完成）","Wikipedia・自治体・公的"],["2","高取城","たかとりじょう","越智邦澄","元弘2年（1332年）","明治6年（1873年）。ただし天正8年（1580年）に一旦廃城","再建造物なし。城内の現存建物はなし。移築されて現存する門：二の門（子嶋寺山門）、新御殿（藩主下屋敷）の表門、松ノ門。遺構：石垣、堀、井戸など多数","Wikipedia"],["3","多聞山城（多聞城）","たもんやまじょう","松永久秀","永禄2年（1559年）","天正4年（1576年）※基礎情報欄の表記。本文では天正5年（1577年）6月頃に建物が破壊されたとする（注記参照）","再建造物なし。遺構：土塁、空堀。跡地は奈良市立若草中学校の敷地","Wikipedia"],["4","筒井城","つついじょう","基礎情報欄に築城主の記載なし","永享元年（1429年）以前※本文では「築かれた時期については不明」とし、文献上の初見が永享元年（1429年）","天正8年（1580年）8月17日","再建造物なし。天守構造「なし」。遺構：水堀","Wikipedia"],["5","信貴山城","しぎさんじょう","木沢長政","天文5年（1536年）","天正5年（1577年）","再建造物なし。遺構：曲輪、堀切、土塁、門跡、石積。四層の天守櫓があったとされるが「実際の遺構については確認されていない」（記事本文）","Wikipedia"]]}]},{"h":"城ごとの注記","lv":3,"text":["1. 大和郡山城","- 読みは、文化庁の答申資料の振り仮名「こおりやま じょうあと」およびWikipedia冒頭「郡山城（こおりやまじょう）」による。","- 別名：Wikipedia基礎情報欄は「雁陣之城」、奈良県公式は「遠くから見るとちょうど犬が伏せているように見えることから、別名『犬伏城』とも呼ばれています」とする。両方を併記する。","- 天守の規模に食い違いがある。Wikipedia基礎情報欄は「伝5層6階（1583年築・非現存）」。大和郡山市公式「幻の天守(閣)」は、天守台整備に伴う発掘調査で「天守の礎石や金箔瓦が発見され、豊臣政権期に天守が存在していたことが初めて明らかになった」「天守の規模は1階部分が7×8間(約13×15メートル）で、5階建ての建物であったと推定されています」とする。「5層6階」と「5階建て」は階数の数え方が一致しないため、両方を併記し、決めない。","- 一時廃城と再興：奈良県公式の略年表は「慶長5年（1600年）関ヶ原の戦い後、廃城」「元和元年（1615年）水野勝成が修復に取りかかる」とする。本文は慶長5年10月に「取り壊されて伏見城に運ばれます」とする。最終的な廃城年1873年（明治6年）はWikipedia基礎情報欄による。大和郡山市の整備基本計画（第3章）も「郡山城は明治に廃城となってまもなくすべての城郭建築が失われた」とする。","- 再建物の年次：奈良県公式の略年表は「昭和58年（1983年）市民活動により追手門が復元。昭和59年には追手東隅櫓と多聞櫓、昭和62年には追手向櫓が復元」とする。","- 指定文化財：国の史跡。指定年月日は令和4（2022）年11月10日（大和郡山市「史跡郡山城跡整備基本計画」第3章に明記。文化庁の令和4年6月17日付答申にも「郡山城跡」が新指定9件に含まれる）。それ以前は奈良県指定史跡（大和郡山市の計画では「昭和35年（1960）に中心部を構成する曲輪の一部が奈良県指定史跡となった」、奈良県公式の略年表では「昭和36年（1961年）郡山城跡が奈良県指定文化財となる」とあり、年が1年ずれている。両方を併記する）。","- 同名の別の城との混同注意：広島県安芸高田市の郡山城（毛利氏の城。文化遺産オンラインの「郡山城跡」はこちらのもの）、福島県の郡山城とは別の城である。本項は大和国の郡山城のみを扱う。","- 年数の検算：築城1580年〜廃城1873年の差は293年。記事側に年数の主張はない。","2. 高取城","- 築城について、本文は「南北朝時代、南朝方であった越智邦澄が元弘2年（正慶元年、1332年）に築城したのが始まりと伝えられている」とし、「伝えられている」という表現である。そのまま記す。","- 廃城が2回ある。天正8年（1580年）に一旦廃城（本文「織田信長によって大和国内の城は郡山城一城と定められ、高取城は天正8年（1580年）に一旦は廃城となった」）。その後、筒井順慶が天正12年（1584年）に「本格的城塞へと改めた」、本多利久が天正17年（1589年）に「新しい縄張りをもって築造した」と本文にある。移転ではなく同一の山（高取山）での再築・大改修である。","- 最終の廃城：基礎情報欄・本文とも明治6年（1873年）。ただし建物の消滅時期について本文に2つの記述がある。(1)「明治20年（1887年）頃まで天守をはじめとした主要建造物は城内に残っていたが…自然倒壊したとされる」、(2)「明治6年（1873年）に建物の払い下げが行われ…明治24年（1891年）ごろに天守以下の建物全ての取り壊しが行われたともされる」。両方を併記する。","- 天守構造は基礎情報欄に「連立式3重3階地下1階（非現存）」と明記されている。","- 現存構造物について本文は「確認されている高取城の現存構造物はこれらのみである」（二の門、新御殿表門、松ノ門を指す）とする。これらは城内ではなく移築先に現存する。","- 指定文化財：国の史跡。本文に「昭和28年（1953年）3月31日に国の史跡に指定された」とある。","- 強い表現の引用：本文は「日本国内では最大規模の山城で、備中松山城（岡山県）・岩村城（岐阜県）とともに日本三大山城の一つに数えられる」とする（記事の文言そのまま）。","- 年数の検算：1332年〜1873年の差は541年（ただし1580〜1584年頃は廃城期間）。記事側に年数の主張はない。","3. 多聞山城（多聞城）","- 廃城年の食い違い：基礎情報欄は「天正4年（1576年）」。本文は、織田信長の破却命令により天正4年（1576年）7月から破城工事が始まり「天正5年（1577年）6月頃には建物は破壊され」とする。両方を併記する。","- 年数の検算：本文に「城があった期間はわずか16年間だった」とある。築城1559年から1577年までは18年で合わない。入城した永禄4年（1561年）から1577年までは16年で合う。どちらの起算かは記事に明記がないため、未確認として両方を記す。","- 天守について：基礎情報欄は「天守の存在が不明（高矢倉が天守だとするなら4層）」。本文は「天正5年（1577年）の解体時に『高矢倉』と呼ばれた四階櫓がありこれが四重の天守なら、安土城をはじめとする近世城郭における天守の先駆けと言えるが定かではない」とする。断定されていないため、そのまま記す。","- 石材の転用：本文によれば、建物は京都の二条新御所に移築され、石材は筒井城に用いられ、さらに郡山城にも移された。","- 混同注意：大和郡山城の再建物にある「多聞櫓」は櫓の名称であり、多聞山城とは別のものである。","- 築城年・完成年：永禄2年（1559年）築城、永禄4年（1561年）入城、永禄7年（1564年）完成と本文にある。","4. 筒井城","- 築城者：基礎情報欄に「築城主」の欄自体がない。歴代城主の初代は筒井順覚と本文・城主一覧にあるが、築城者とは書かれていないため、築城者は未確認とする。","- 築城年：基礎情報欄は「永享元年（1429年）以前」。本文は「筒井城が築かれた時期については不明であるが、文献上の初見は『満済准后日記』に、大和永享の乱が始まった永享元年（1429年）で城主は筒井順覚。この時は『筒井館』と記載されている事もあった」とする。","- 廃城：本文は「信長の『大和一国破城命令』により廃城とし、居城を郡山城に移した。翌天正8年（1580年）8月17日の事であった」とし、基礎情報欄の廃城年「天正8年（1580年）8月17日」と一致する。","- 天守構造は基礎情報欄に「なし」と明記されている。","- 年数の検算：1429年以前〜1580年のため存続期間は151年以上。記事側に年数の主張はない。","5. 信貴山城","- 築城年の留保：基礎情報欄は築城主・木沢長政、築城年・天文5年（1536年）。ただし本文によれば、城の史料上の初見は長禄4年（1460年）で、中川貴皓によれば『経覚私要抄』の記述が初見とされる。また「南北朝時代に楠木正成によって築城されたという伝承も存在するが、しかし、同時代史料の裏付けはない」と本文にある。1536年は本格的な城郭の築城年として記す。","- 天守櫓の築造年の食い違い：基礎情報欄は「四層の天守櫓（1559年頃築）」。本文の略年表は「永禄3年（1560年）松永久秀、信貴山城に四階櫓を設ける」とする。1559年頃と1560年が併存するため、両方を併記する。","- 松永久秀の入城年について、本文は「松永久秀の信貴山城入城は通説では永禄2年のこととされてきたが、中川貴皓によれば、これは誤りであると考えられる」とする（1559年8月に修築し入場、という記述に基づく）。","- 規模の強い表現の引用：本文は「曲輪の数は110以上あり、奈良県下最大規模の中世城郭である」とする（記事の文言そのまま）。","- 指定文化財：奈良県指定史跡「信貴山城跡」。脚注に「令和7年3月25日奈良県公報より奈良県告示第414号」とある。","- 年数の検算：1536年〜1577年の差は41年。記事側に年数の主張はない。"],"tables":[]},{"h":"現存天守が奈良県にあるかどうか（確認結果）","lv":3,"text":["結論：奈良県内に現存天守はない。","- 根拠：Wikipedia「現存天守」は、江戸時代以前に建設され現代まで保存されている天守は12城とし、その一覧は弘前城（青森県）、松本城（長野県）、丸岡城（福井県）、犬山城（愛知県）、彦根城（滋賀県）、姫路城（兵庫県）、松江城（島根県）、備中松山城（岡山県）、丸亀城（香川県）、松山城（愛媛県）、宇和島城（愛媛県）、高知城（高知県）である。奈良県の城は含まれていない。","- 本表の5城についても個別に確認した。大和郡山城の天守は「非現存」（Wikipedia基礎情報欄）、高取城の天守は「（非現存）」と明記、多聞山城は「天守の存在が不明」、筒井城は天守構造「なし」、信貴山城の天守櫓は「実際の遺構については確認されていない」。いずれも現存天守ではない。"],"tables":[]},{"h":"注記・食い違い（e、まとめ）","lv":3,"text":["1. 大和郡山城の天守の階数：「伝5層6階」（Wikipedia基礎情報欄）と「5階建てと推定」（大和郡山市公式）が一致しない。両方併記。","2. 大和郡山城の別名：「雁陣之城」（Wikipedia）と「犬伏城」（奈良県公式）が併存。両方併記。","3. 大和郡山城の奈良県指定の年：昭和35年（1960年）（大和郡山市の整備基本計画）と昭和36年（1961年）（奈良県公式の略年表）で1年ずれる。両方併記。","4. 多聞山城の廃城年：天正4年（1576年）（基礎情報欄）と、天正5年（1577年）6月頃に建物破壊（本文）が併存。両方併記。","5. 多聞山城の「16年間」という本文の記述は、築城1559年起算（18年）では合わず、入城1561年起算（16年）では合う。起算点は記事に明記がなく未確認。","6. 信貴山城の天守櫓の築造年：「1559年頃」（基礎情報欄）と「永禄3年（1560年）」（略年表）が併存。両方併記。","7. 高取城の建物消滅時期：明治20年（1887年）頃まで残り自然倒壊したとする記述と、明治24年（1891年）ごろに全て取り壊されたとする記述が併存。両方併記。","8. 高取城の築城は「伝えられている」という表現であり、確定した事実としては書かれていない。","9. 筒井城の築城者は未確認（記事に築城主の記載なし）。"],"tables":[]},{"h":"取得不可（e）","lv":3,"text":["- Wikipedia「大和郡山城」（この題名のURL）：取得不可（ページの複製がなく読み取れなかった）。大和国の郡山城の記事の正式な題名は「郡山城 (大和国)」であり、その基礎情報欄は検索結果に表示された記事抜粋（WikipediaおよびWeblio辞書の同一記事抜粋）で確認した。本文の直接取得は未実施のため、大和郡山城の本文レベルの記述は自治体・公的出典で補った。","- Wikipedia「宇陀松山城」：取得不可（取得試行時にリクエスト上限エラー）。奈良県公式「郡山城」ページの関連リンクに「宇陀松山城」が奈良の城の一つとして挙がっていることは確認したが、築城者・築城年・廃城年等は確認できていないため、本表には入れていない（追加候補・未確認）。","- 文化庁「国指定文化財等データベース」の個別ページ：直接の取得は未実施。郡山城跡の国史跡指定については、文化庁の答申資料と大和郡山市の整備基本計画で照合した。高取城・信貴山城の指定情報はWikipedia記事の記述による（文化庁データベースでの個別照合は未実施）。","---"],"tables":[]}],"f":[{"h":"f-1 江戸時代","lv":3,"text":["出典：","- 文化庁「I 奈良漬」（食文化関連調査資料PDF） https://www.bunka.go.jp/seisaku/bunkazai/joseishien/syokubunka_story/pdf/94054901_16.pdf （取得日2026-11-18、種別：公的）","- 文化庁 令和5年度「食文化ストーリー」創出・発信モデル事業 資料 https://www.bunka.go.jp/seisaku/bunkazai/joseishien/syokubunka_story/pdf/94176801_01.pdf （取得日2026-11-18、種別：公的）","- 青梅市文化財資料（そうめん解説PDF） https://www.city.ome.tokyo.jp/uploaded/attachment/10287.pdf （取得日2026-11-18、種別：自治体）","- 株式会社池利「三輪そうめんについて」 https://www.ikeri.co.jp/miwasoumen/index.html （取得日2026-11-18、種別：その他）","- 奈良市観光協会「匠が受け継ぐ伝統の技 奈良の工芸」 https://narashikanko.or.jp/skill （取得日2026-11-18、種別：その他）","- 奈良県公式「奥大和の自然」 https://www.pref.nara.lg.jp/site/okuyamato/jp/about/nature/index.html （取得日2026-11-18、種別：自治体）","- 黒滝村「林業パンフレット」 https://www.vill.kurotaki.nara.jp/cms/wp-content/uploads/2017/03/ringyou-1.pdf （取得日2026-11-18、種別：自治体）"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","三輪そうめん（表記は出典により「三輪素麺」とも）","みわそうめん","桜井市三輪（大和国）","江戸時代の文献『日本山海名物図会』（宝暦4年・1754年刊）に「大和三輪素麺、名物なり。細きこと糸のごとく、白きこと雪のごとし。ゆでてふとらず余国のより出るそうめんの及ぶ所にあらず」とある（青梅市文化財資料の転記）。同書は江戸時代文献そのもの。お伊勢参りで声価が諸国へ伝わったとも記される（池利サイト）","自治体（青梅市）／その他（池利・e-food.jp）"],["2","奈良漬","ならづけ","奈良（大和国）","文化庁の調査資料によれば、江戸時代の『本朝食鑑』（1697年刊）に「香の物には数種あり、糟漬、甘醴漬、味噌漬、糠漬、乾し瓜等なり、糟漬は家々これを競造る。ただ和の奈良漬、攝の豊田、森口をもって上と為す」とある。商品化は慶長年間（1596～1615年）頃からとされ、奈良の中筋町の漢方医・糸屋宗仙がしろうりを酒粕に漬けて「奈良漬」として売り出したのが一般に売り出されたはじめといわれる（同資料）","公的（文化庁）"],["3","吉野葛","よしのくず（読みは今回の出典には明記なし。未確認）","吉野地方","文化庁「食文化ストーリー」資料に「葛粉づくりの工程が図示された『製葛録』(江戸時代)」との記載があり、江戸時代の文献に吉野の葛粉づくりが図示されていたことまでは確認できる。それ以上の江戸時代の生産・流通の詳細は今回の出典では未確認","公的（文化庁）"],["4","柿の葉寿司","かきのはずし","吉野地方（県南部）","文化庁「食文化ストーリー」資料に「江戸時代中頃には県南部の吉野地方で、夏祭りのごちそうとして、塩鯖を使った柿の葉寿司が生まれました」とある","公的（文化庁）"],["5","奈良筆","ならふで","奈良町（現・奈良市）","奈良市観光協会によれば「今日のような無芯筆がつくられるようになったのは、江戸時代の元禄期になってからです。細井広沢が強弱の毛を組み合わせてまぜ込み、糊で固める水筆をつくり、その後はこの方法による毛筆が多くなり」各地で製造されるようになった。江戸時代の文献・幕府記録での確認ではなく、観光協会の解説による","その他（奈良市観光協会）"],["6","吉野杉","よしのすぎ（読みは今回の出典には明記なし。未確認）","吉野地方（吉野郡）","奈良県公式サイト「奥大和の自然」に「天然林が伐採されたあとに、建築材としてより価値の高い杉や檜を植える植林が江戸時代初期に始められ、現在まで約500年という植林の歴史を持つ吉野林業」とある。黒滝村の林業パンフレットにも「江戸時代には森林資源の減少に伴い、造林の他、山守制度など吉野林業独自の制度が生まれ、大きく発展しました」とある","自治体（奈良県／黒滝村）"]]}]},{"h":"f-2 現代","lv":3,"text":[],"tables":[]},{"h":"（1）経済産業大臣指定 伝統的工芸品","lv":4,"text":["出典：伝統的工芸品産業振興協会「伝統的工芸品指定品目一覧・業種別」 https://kyokai.kougeihin.jp/wp/wp-content/uploads/2025/10/shitei-Industry_20251027.pdf （2025年10月27日現在、全244品目、取得日2026-11-18、種別：公的）","当該PDFは業種別の一覧で、奈良県の品目は次の3件のみ。「奈良」の文字で全文検索しても奈良県分はこの3件以外にない（赤膚焼・奈良漆器は同PDFに記載なし）。","参考：奈良通1級テキスト（その他）では「国指定伝統的工芸品（3）」として高山茶筅＝生駒市、奈良筆＝奈良市、奈良墨＝奈良市と産地が併記されている。産地はこの出典による。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","高山茶筌","たかやまちゃせん（読みはPDFに記載なし。未確認）","PDFに産地の記載なし（未確認）","木工品・竹工品の部27番目に記載。表記は「高山茶筌」（注記参照）","公的（伝統的工芸品産業振興協会）"],["2","奈良筆","ならふで","PDFに産地の記載なし（未確認）","文具の部5番目に記載。指定年は奈良市観光協会によれば昭和52年10月","公的（同上）／その他（奈良市観光協会）"],["3","奈良墨","ならずみ（読みはPDFに記載なし。未確認）","PDFに産地の記載なし（未確認）","文具の部6番目に記載","公的（同上）"]]}]},{"h":"（2）地理的表示（GI）登録産品","lv":4,"text":["出典：近畿農政局「地理的表示近畿地域登録産品」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/gi/kinki_gi.html （令和8年3月25日現在・近畿18産品、取得日2026-11-18、種別：公的）","奈良県分は1件のみ。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","三輪素麺","ミワソウメン","奈良県全域","登録番号第12号。登録日 平成28年3月29日。登録生産者団体は奈良県三輪素麺工業協同組合・奈良県三輪素麺販売協議会。特性欄に「約1300年前の奈良時代に生産が始まり、三輪地方が手延べ素麺発祥の地と伝えられている」とある","公的（近畿農政局）"]]}]},{"h":"（3）地域団体商標","lv":4,"text":["出典：近畿農政局「地域団体商標の活用について」 https://www.maff.go.jp/kinki/keiei/tiiki_syokuhin/zaisan_brand/chiikidanntai.html （「近畿における農林水産物・食品の地域団体商標」令和6年1月現在、取得日2026-11-18、種別：公的）","奈良県分は8件。同ページは「最新の全ての地域団体商標の案内は特許庁へ」と案内しており、より新しい近畿版一覧は今回見つからなかった（注記参照）。"],"tables":[{"cols":["番号","品目","読み","産地","備考","出典の種別"],"rows":[["1","平群の小菊","一覧に記載なし（未確認）","一覧に記載なし（未確認）","農林水産物・食品に限った一覧","公的（近畿農政局）"],["2","大和肉鶏","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["3","結崎ネブカ","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["4","吉野材","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["5","吉野本葛","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上。「吉野葛」とは別項目として併記されている","公的（近畿農政局）"],["6","吉野葛","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["7","吉野杉","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"],["8","吉野桧","一覧に記載なし（未確認）","一覧に記載なし（未確認）","同上","公的（近畿農政局）"]]}]},{"h":"（4）奈良県公式の認証制度","lv":4,"text":["出典：奈良県公式ホームページ https://www.pref.nara.lg.jp/item/122033.htm （奈良県プレミアムセレクトの説明を含むページ、種別：自治体）、奈良県公式「県民だより奈良 特集1」 https://www.pref.nara.lg.jp/n002/57044.html （種別：自治体）。取得日はいずれも2026-11-18。"],"tables":[{"cols":["制度名","内容（出典の記載どおり）","出典の種別"],"rows":[["奈良県プレミアムセレクト","奈良県農畜水産物ブランド認証制度。「大きさや形など外観の基準だけでなく、品質面でも優れた特徴を持つ『とびきり』の産品を、県が認証する制度」（奈良県公式サイトの説明）。大和牛での認証は平成28年12月開始（奈良県報道資料）","自治体（奈良県）"],["大和の伝統野菜（認定）","「戦前から奈良県内で生産が確認されている品目で、地域の歴史・文化を受け継いだ独特の栽培法等により『味、香り、形態、来歴』などの特徴がある野菜」と奈良県公式サイトに定義がある","自治体（奈良県）"],["大和畜産ブランド","県が規格を設けて認定する畜産ブランド。県民だより奈良2020年12月号特集に「現在はこの5つを大和畜産ブランドと認定しています ※令和2年10月時点」とある（品目の内訳は今回未確認）","自治体（奈良県）"]]}]},{"h":"注記・食い違い（f）","lv":3,"text":["- 表記の揺れ1：「高山茶筌」（伝統的工芸品産業振興協会の指定品目一覧の表記）と「高山茶筅」（奈良通1級テキストの表記）。正式な指定品目名は協会PDFの「高山茶筌」。","- 表記の揺れ2：「三輪素麺」（GI登録名・近畿農政局）と「三輪そうめん」（一般表記・Wikipedia記事名）。『日本山海名物図会』の引用文では「大和三輪素麺」と「大和三輪索麺」の2種の転記が異なる出典にあり、原文の字句は未確認。","- 地域団体商標の範囲の違い：近畿農政局の一覧（令和6年1月現在）は「農林水産物・食品」に限るため工芸品は入っていない。特許庁資料に基づく平成29年11月現在の奈良県一覧（特許庁「奈良県における知財活動の概要」）では登録11件とされ、高山茶筌・吉野割箸・吉野杉箸など工芸品・箸類も含まれる。両者は時点と対象範囲が違うため、件数の食い違いではない。","- 伝統的工芸品の産地：協会の業種別PDFには産地欄がない。産地（高山茶筅＝生駒市、奈良筆・奈良墨＝奈良市）は奈良通1級テキスト（その他）による併記で、公的出典での照合は未実施。","- 吉野葛と吉野本葛：地域団体商標では別項目として両方が登録されている。違いの説明は今回の出典にないため未確認。","- 柿渋：候補に挙がっていたが、江戸時代の文献・公的出典での確認が今回取れなかったため、表には入れていない（未確認）。"],"tables":[]},{"h":"取得不可（f）","lv":3,"text":["- Wikipedia「三輪そうめん」：取得を試みたが、取得ツール側のレート制限（HTTP 429）のため取得不可。本文の転記はしていない。","- Wikipedia「奈良漬」：同じくレート制限のため取得不可。本文の転記はしていない（奈良漬の江戸時代の裏付けは文化庁資料で代替した）。","---"],"tables":[]}],"g":[{"h":"g. 旧国の制度","lv":2,"text":["出典：","- Wikipedia「大和国」 https://ja.wikipedia.org/wiki/大和国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「一宮」 https://ja.wikipedia.org/wiki/一宮 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「国分寺」 https://ja.wikipedia.org/wiki/国分寺 （取得日2026-11-18、種別：Wikipedia）","- 「総社・一宮・二宮候補・三宮候補・国府の一覧」（op1722.com） https://op1722.com/zinzya1-2-3.html （取得日2026-11-18、種別：その他）※大神神社の読みのみに使用","※一宮・総社は中山の指示により正式項目として入れた。"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["g1","大和国の等級","―","大国","「大和国」記事の基礎情報欄「国力：大国」、本文冒頭にも「大国」と明記","Wikipedia"],["g2","大和国府（文献上の所在地）","―","『和名抄』（平安時代中期成立）では「高市郡」、『拾芥抄』（鎌倉時代中期から南北朝時代成立）では「高市郡」、『節用集』（室町時代中期成立）では「十市郡」","文献により郡が異なる（食い違い、両論併記）","Wikipedia"],["g3","大和国府（推定地の変遷）","―","国府は葛上郡掖上（現在の御所市東北部と同市名柄の二説あり）の地にあったが、平城京遷都に伴って8世紀に高市郡（『和名類聚抄』）の軽の地に移ったとされる。その後13世紀には平群郡（現在の大和郡山市今国府）に移った","記事は「このように国府は数か所に推定されているが、詳細は明らかでない」と明記。「大和国」記事の基礎情報欄も「大和国府：（推定）奈良県大和郡山市／（推定）奈良県高市郡高取町」と2か所を併記。軽の所在地にも諸説あり（記事注釈：現在の橿原市大軽町と石川町の接点「軽の衢」、ほかに久米町、西池尻/東池尻、高取町土佐の三説）","Wikipedia"],["g4","一宮","おおみわじんじゃ（大神神社）","大神神社（奈良県桜井市三輪）","読み「おおみわじんじゃ」は「一宮」「大和国」両記事に明記がなく、その他サイト（一覧ページ）による。「大和国」記事は「ただし、神社側で自ら一宮を称した文書は見つかっていない」と注記。二宮以下はない（「大和国」記事・「一宮」記事とも）。「一宮」記事の一覧表では、式内社の別は名神大社、近代社格は官幣大社、別表神社、二十二社、全国一の宮会加盟と記載","Wikipedia／その他（読みのみ）"],["g5","総社","―","国府神社（奈良県高市郡高取町下土佐）","「大和国」記事「総社・一宮」の項による","Wikipedia"],["g6","大和国分寺（国分僧寺）","―","東大寺（奈良県奈良市）。総国分寺を兼ねる","「東大寺とするのが一般的だが、後者とする説もある」として、橿原市の国分寺（勝満山満法院）を大和国分寺とする説を併記（食い違い、両論併記）。「国分寺」記事の注釈では『大和志』が橿原市の国分寺に比定する旨を記す","Wikipedia"],["g7","大和国分尼寺","―","法華寺（奈良県奈良市）。総国分尼寺を兼ねる","「国分寺」記事の一覧では創建所在地「奈良県奈良市法華寺町」、国の史跡・法華寺（総国分尼寺）と記載","Wikipedia"],["g8","延喜式内社（参考）","―","『延喜式神名帳』には、大社128座85社（うち名神大社47座26社）・小社158座131社の計286座216社が記載されている","「大和国」記事「延喜式内社」の項による（原史料『延喜式』を引く記載）","Wikipedia"],["g9","国分寺建立の詔（制度一般・参考）","―","『続日本紀』『類聚三代格』によれば、天平13年（741年）2月14日（日付は『類聚三代格』による）、聖武天皇から「国分寺建立の詔」が出された。国分僧寺の正式名称は「金光明四天王護国之寺（こんこうみょうしてんのうごこくのてら）」、国分尼寺は「法華滅罪之寺（ほっけめつざいのてら）」。大和国の東大寺・法華寺は総国分寺・総国分尼寺とされ、全国の国分寺・国分尼寺の総本山と位置づけられた","「国分寺」記事による。741年2月14日の西暦換算は記事に記載がなく、暦の種別も明記されていないため暦不明","Wikipedia"]]}]},{"h":"注記・食い違い（g）","lv":3,"text":["- 国府所在地：文献（『和名抄』『拾芥抄』＝高市郡／『節用集』＝十市郡）で食い違いがあり、推定地も葛上郡掖上・高市郡軽・平群郡（大和郡山市今国府）など複数説がある。記事自身が「詳細は明らかでない」としており、どれか一つに決めない。","- 国分寺の比定：東大寺（一般的）／橿原市国分寺（『大和志』による説）の両論併記。","- 一宮の根拠：大神神社を一宮とする一方、「神社側で自ら一宮を称した文書は見つかっていない」という注記が記事にある。","- 公的出典での照合：等級・国府・一宮・国分寺のいずれも、今回はWikipediaの記事の記載のみで、文化庁・奈良県公式による照合はできていない（下記「取得不可」参照）。この点は未確認として残す。"],"tables":[]},{"h":"取得不可（g）","lv":3,"text":["- 文化庁「国指定文化財等データベース」 https://kunishitei.bunka.go.jp/bsys/index （種別：公的）— トップページは取得できたが、個別レコード（大和国府跡・国分寺関係）の検索結果ページはテキスト取得では開けず、照合に使えなかった。","- 奈良県公式サイトの大和国府・国分寺に関するページ — 今回の取得では該当ページにたどり着けず、未取得（取得不可として明記する）。","---"],"tables":[]}],"topics":[{"k":"a","t":"旧国名と五畿七道","rel":["kokugun","ikai","kokumei"]},{"k":"b","t":"江戸時代の藩と藩主","rel":["edo","shogun","han","tenryo","senko"]},{"k":"c","t":"廃藩置県の変遷","rel":["kansei","calendar"]},{"k":"d","t":"県名の由来","rel":["calendar","gengo"]},{"k":"e","t":"有名な城","rel":["shogun","gengo"]},{"k":"f","t":"名産（江戸時代／現代）","rel":["gengo","edo"]},{"k":"g","t":"旧国の制度（国府・一宮・国分寺）","rel":["kokugun","ikai","kokumei"]},{"k":"h","t":"企業（老舗／現代）","rel":["gengo","edo"]}],"flags":{"a":["旧国名・五畿七道はWikipediaのみが出典。公的出典での照合は未実施。","747年の「大倭」改称の日付は、西暦換算の暦種別が不明（暦不明）。","奈良県域が大和国以外の旧国にまたがるかは、取得した記事に記載がなく未確認。"],"b":["藩と藩主はWikipediaのみが出典（公的・自治体での照合は未実施）。","岸田藩は取得できず、内容が未確認。","藩主の読みが未取得の人物がいる（永井直壮・永井直哉・松平信通・片桐且元・片桐為次・桑山一尹・桑山貞晴）。","柳生藩・田原本藩の廃藩年、竜田藩の居城・陣屋、郡山新田藩の居城・陣屋は未確認。"],"c":["統合で廃された県の数は、Wikipediaが10県、奈良県公式が15県で食い違う。飛地の5藩（久居・津・大多喜・壬生・和歌山）を加えると15になるが、公式年表に内訳の明記はなく未確認。","奈良県の再改称（奈良府→奈良県）は、7月17日と7月12日の2つの日付がある。奈良県公式の年表は7月17日。","奈良県の沿革は奈良県公式（県政沿革・奈良県立図書館）で日付まで照合した。国立公文書館（アジア歴史資料センター）での照合は未実施。","第1次府県統合の布告日と実施日の区別は未確認。"],"d":["県名の由来（奈良町）は奈良県公式で確認した事実。","「奈良」という地名の語源は諸説あり、いずれも仮説で確定していない。"],"e":["奈良県内に現存天守はない（Wikipedia「現存天守」の12城に含まれない）。","大和郡山城：天守の階数が「伝5層6階」と「5階建てと推定」で食い違う。別名も「雁陣之城」「犬伏城」の2つ。県指定年も1960年と1961年で1年ずれる。国史跡の指定は文化庁の答申資料と市の資料で照合した。","多聞山城：廃城年が1576年と1577年の両説。本文の「16年間」は、築城年（1559年）から数えると合わない。","高取城：建物の消滅が1887年頃と1891年頃の両説。築城は「伝えられている」という表現。","信貴山城：天守櫓の築造が「1559年頃」と「1560年」の両説。楠木正成築城説は同時代史料の裏付けがない。","筒井城：築城者は未確認。宇陀松山城は取得できず、表に入れていない（追加候補）。","高取城・多聞山城・筒井城・信貴山城はWikipediaのみが出典。"],"f":["江戸時代の名産の一部（奈良漬・柿の葉寿司・吉野葛への言及）は文化庁の資料で確認。三輪そうめん・奈良筆は自治体や民間の解説による。","伝統的工芸品3品目（高山茶筌・奈良筆・奈良墨）は協会の一覧で確認。協会の一覧に産地欄がなく、産地は民間のテキストによるため、公的な照合は未実施。","読みが出典にない品目（吉野葛・吉野杉・奈良墨・高山茶筌など）は「未確認」と表示している。","吉野葛と吉野本葛は地域団体商標で別項目。違いは未確認。","地域団体商標の一覧は令和6年1月時点で、農林水産物・食品に限る。商標の登録は「名産」と同義ではない。"],"g":["旧国の制度（国の等級・国府・一宮・総社・国分寺）はWikipediaのみが出典。文化庁・県での公的照合は未実施。","国府の所在地は、『和名抄』が高市郡、『節用集』が十市郡とし、推定地も複数ある。確定していない。","国分寺は東大寺とする説と、橿原市の国分寺とする説がある。"],"h":["「老舗」は創業1926年以前（2026年時点で100年以上）で、現在も営業中、本社が県内の企業。創業年と法人設立年が違う場合は両方を書いている。","老舗8社は、候補のうち公式出典で裏取りできたもの。奈良県の「100年企業顕彰」（令和6年度、30社）を網羅したものではない。","三輪山本の法人設立年は未確認（Wikipediaは1717年、データベース系は1974年）。今西清兵衛商店・三輪山本は、公式の会社概要ページを直接取得できていない。","DMG森精機は奈良と東京の二本社制で、グローバル本社は東京。本店は奈良市のため現代に入れ、備考に明記している。","柿安本店（桑名市）と大和ハウス工業（大阪市）は、本社が県外のため対象外。"]},"h":[{"h":"出典","lv":2,"text":["- 株式会社中川政七商店 公式企業サイト「中川政七商店｜日本の工芸を元気にする！」 https://www.nakagawa-masashichi.jp/company/ （その他（企業公式））","- 株式会社中川政七商店 プレスリリース（PR TIMES、2026年6月3日・2025年1月14日配信） https://prtimes.jp/main/html/rd/p/000000089.000016802.html ほか（その他（企業公式））※本社所在地・創業・設立は同社の会社概要記載による","- 奈良ホテル 公式「Nara Hotel History」（JR西日本ホテルズ） https://jrwest-hotels.jp/narahotel/about/history/ （その他（企業公式））","- 奈良県公式「令和6年度奈良県100年企業顕彰 株式会社奈良ホテル」 https://www.pref.nara.lg.jp/documents/7099/14.pdf （自治体）","- 奈良県公式「令和6年度 奈良県100年企業顕彰企業紹介」 https://www.pref.nara.lg.jp/n100/68602.html （自治体）","- 株式会社菊一文珠四郎包永 公式「菊一文珠四郎包永について」 https://kikuichi.com/about/ （その他（企業公式））","- Wikipedia「今西清兵衛商店」 http://ja.wikipedia.org/wiki/今西清兵衛商店 （Wikipedia）※沿革は同社公式「会社概要」を出典とする記事","- 厚生労働省 奈良若年者雇用情報「株式会社 今西清兵衛商店」 https://jakunen-nara.mhlw.go.jp/gousetsu/kigyou_list/pdf/index/2403/66.pdf （公的）","- 油長酒造株式会社 公式「私たちの想い｜油長酒造の物語」 https://yucho-sake.jp/concept/ （その他（企業公式））","- 株式会社中谷本舗 プレスリリース（PR TIMES、2025年9月26日配信ほか） https://prtimes.jp/main/html/rd/p/000000022.000061612.html （その他（企業公式））","- 株式会社池利 公式「会社案内」 https://www.ikeri.co.jp/company/index.html （その他（企業公式））","- Wikipedia「三輪山本」 http://ja.wikipedia.org/wiki/三輪山本 （Wikipedia）","- 株式会社南都銀行 公式 統合報告書（ディスクロージャー誌） https://www.nantobank.co.jp/investor/disclosure/pdf/2026_all_print.pdf （その他（企業公式））","- 奈良交通株式会社 公式「企業概要」 https://www.narakotsu.co.jp/company/profile/ （その他（企業公式））","- DMG森精機株式会社 公式プレスリリース「2022年7月 創業地奈良へ本社移転 奈良と東京の二本社制導入のお知らせ」（2022年3月22日） https://www.dmgmori.co.jp/corporate/news/pdf/20220322_pdc.pdf （その他（企業公式））","- Wikipedia「DMG森精機」 https://ja.wikipedia.org/wiki/DMG%E6%A3%AE%E7%B2%BE%E6%A9%9F （Wikipedia）","- 株式会社柿安本店 公式「企業概要」 https://www.kakiyasuhonten.co.jp/corp/about/ （その他（企業公式））","- 大和ハウス工業株式会社 公式「会社概要」 http://www.daiwahouse.co.jp/company/outline/index.html?page=from_header （その他（企業公式））"],"tables":[]},{"h":"h-1 老舗企業（創業100年以上）","lv":2,"text":["確認できたのは8社である。"],"tables":[{"cols":["番号","企業名","読み","創業年（設立年）","本社所在地","業種・事業内容","備考","出典の種別"],"rows":[["1","株式会社中川政七商店","なかがわまさしちしょうてん","創業1716年（享保元年）（設立1983年11月30日）","奈良県奈良市東九条町1112-1","生活雑貨の製造小売業、産地支援事業（同社プレスリリースの事業内容）","公式企業サイトは「一七一六 1716（享保元）年、奈良晒の商いからはじまった中川政七商店」と記す。創業と法人設立は別の年である","その他（企業公式）"],["2","株式会社三輪山本","みわやまもと","創業1717年（享保2年）2月（法人設立年は未確認。下記注記参照）","奈良県桜井市箸中880","手延べそうめん・乾麺・つゆ類の製造・販売、お食事席の経営","創業300周年を迎えた2017年に、社名を「三輪そうめん山本」(旧)から「三輪山本」(新)に刷新（記事の記載）","Wikipedia"],["3","油長酒造株式会社","ゆうちょうしゅぞう","創業1719年（享保4年）（法人設立年は今回の公式ページでは未確認）","奈良県御所市1160番地（本拠。Wikipediaの記載）","日本酒メーカー。主要ブランドは『鷹長』『風の森』『水端』","公式サイトは「1600年代の後期には酒を造り始めていたようですが、1719年（享保4年）に酒道具の売買をしている古文書をもとに創業を1719年とさせていただいております。以来300余年にわたって酒造りを続けて参りました」と記す。前身は製油業で、屋号が「油長」である","その他（企業公式）／Wikipedia"],["4","株式会社池利","―（公式「会社案内」に読みの明記なし）","創業嘉永3年（1850年）（設立：昭和27年（1952年）に株式会社池利商店を設立、平成7年（1995年）に株式会社池利に社名変更）","本社 奈良県桜井市芝322-2","手延べそうめん、手延べうどん、春雨、乾麺、乾物の製造及び販売","公式「沿革」は「嘉永3年初代、利平が素麺作りを始める」と記す。令和7年度奈良県100年企業顕彰の対象企業でもある（奈良県公式）","その他（企業公式）／自治体"],["5","株式会社菊一文珠四郎包永","きくいちもんじゅしろうかねなが（公式「会社概要」の会社名の読み）","創業明治3年（1870年）（株式会社の設立は昭和45年（1970年）。下記注記参照）","奈良県奈良市雑司町488（奈良県資料による。本店所在地。公式「会社概要」には所在地の記載を確認できなかった）","国内外での打刃物の卸販売、物産の販売、食堂（レストラン）の経営","公式サイトは、刀工集団の大和五派の一つ手掻派の流れを組み、「750年を超える歴史」と記すが、企業としての創業は歩みの表で明治3年（1870年）とされる。寛永（1624～38年）に奈良の本家が屋号を菊一文珠四郎包永と称したとする記載もある","その他（企業公式）／自治体"],["6","株式会社今西清兵衛商店","いまにしせいべいしょうてん","創業1884年（明治17年）（法人化1956年（昭和31年））","奈良県奈良市福智院町24-1","清酒の製造・販売。日本酒「春鹿」の醸造元。日本酒のほか、みりん、リキュール、奈良漬けなどの製造・販売も行う","沿革：1884年（明治17年）に清酒、みりん、あられ酒（飲用みりん）の製造を開始。1956年（昭和31年）に法人化し株式会社今西清兵衛商店とする（記事の記載で、出典は同社公式「会社概要」）","Wikipedia／公的"],["7","株式会社奈良ホテル","ならホテル","創業1909年（明治42年）10月17日（株式会社奈良ホテルは1983年1月31日に設立）","奈良県奈良市高畑町1096","ホテル業","奈良県の令和6年度「奈良県100年企業顕彰」の対象企業で、県資料は「創業：1909年10月17日」「業種：ホテル業」「住所：奈良県奈良市高畑町1096」とする。公式の沿革では、1909年10月17日に奈良ホテルが開業し、当初は大日本ホテル株式会社が運営した。1983年1月31日に株式会社奈良ホテルが設立された","自治体／その他（企業公式）"],["8","株式会社中谷本舗（屋号「ゐざさ」）","―（公式プレスリリースに読みの明記なし）","創業1921年（大正10年）（設立1986年7月）","奈良県吉野郡上北山村河合353番地","名産寿司の製造・販売。奈良名産の「柿の葉寿司」など名産寿司の製造・販売を「ゐざさ」の屋号で手がける","同社プレスリリースは「1921年（大正10年）、奈良県吉野郡上北山村で創業。2021年に、創業100年を迎えました」と記す。当初は「中谷商店」の名前で米屋として営業していた","その他（企業公式）"]]}]},{"h":"h-2 現代を代表する企業","lv":2,"text":["確認できたのは3社である。奈良県内に本店・本社を置く上場企業等は限られ、本表は公式の会社概要等で本社所在地を確認できた範囲である。"],"tables":[{"cols":["番号","企業名","読み","創業年（設立年）","本社所在地","業種・事業内容","備考","出典の種別"],"rows":[["1","株式会社南都銀行","なんとぎんこう","設立1934年（昭和9年）6月1日","本店所在地 奈良市大宮町四丁目297番地の2","銀行業。当行グループとしてリース・信託・証券・コンサルティングなどの総合金融サービスを展開（同行統合報告書の記載）","同行プロフィール（2026年3月31日現在）は「創立：1934年6月1日」「本店所在地：奈良市大宮町四丁目297番地の2」とする。前身は株式会社六十八銀行・株式会社吉野銀行・株式会社八木銀行・株式会社御所銀行で、1934年6月1日に合併し株式会社南都銀行が設立された。本店は2025年2月に奈良市橋本町16番地から現在地に移転した（Wikipedia）","その他（企業公式）／Wikipedia"],["2","奈良交通株式会社","ならこうつう","設立1929年1月20日（前身の奈良自動車（株）設立。1943年7月23日に奈良交通（株）に商号変更）","奈良市大宮町1丁目1番25号","自動車運送事業等（乗合事業・貸切事業・旅行事業・乗用事業）および生活創造事業（不動産・駐車場、駐輪場・飲食・自動車教習所など）","公式「企業概要」（数字は2026年3月31日現在）は、乗合バス636両、運行路線数181路線、輸送人員1日当り約13.4万人とする。「奈良県全域および京都府南部などで路線バスを運行」すると記す","その他（企業公式）"],["3","DMG森精機株式会社","ディーエムジーもりせいき","設立1948年（昭和23年）10月26日","第二本社：奈良県奈良市三条本町2番1号（奈良商品開発センタ）。グローバル本社：東京都江東区潮見2-3-23（東京グローバルヘッドクォータ）。本店所在地：奈良県奈良市三条本町2-1","工作機械（マシニングセンタ、数値制御装置付旋盤及びその他の製品）の製造・販売","同社の2022年3月22日付プレスリリースは「2022年7月1日に愛知県名古屋市から奈良県奈良市へ本社を移転いたします」「東京グローバルヘッドクォータとともに、奈良県奈良市および東京都江東区潮見の両拠点を本社とする二本社制を導入します」「当社は1948年に奈良県大和郡山市で創業し」と記す。本社が奈良県内だけにある企業ではないため、二本社制であることを明記して収録する","その他（企業公式）／Wikipedia"]]}]},{"h":"注記・食い違い","lv":2,"text":["- 中谷本舗の創業年：候補として挙がっていた1912年ではなく、同社の公式プレスリリースでは1921年（大正10年）創業とされる。本表は1921年を採用した。","- 菊一文珠四郎包永の「設立」表記：同社公式「会社概要」は「設立 明治3年」とする一方、同ページの「菊一文珠四郎包永の歩み」は明治3年（1870年）を「『菊一文珠四郎包永』創業」とし、昭和45年（1970年）に「『株式会社 菊一文珠四郎包永』設立」とする。創業年と法人設立年を分けて本表に書いた。また、同社は手掻派以来「750年を超える歴史」を公式に掲げるが、これは刀工集団の系譜の年数であり、企業の創業年（1870年）とは別である。","- 三輪山本の法人設立年：Wikipedia「三輪山本」は基礎情報で「設立 1717年（享保2年）2月」とし、特記事項として「1717年（享保2年）2月に創業」とする。一方、企業情報データベース系の資料には設立を1974年3月（4月）とするものがある。公式サイトの会社概要で法人設立年を確認できなかったため、本表では法人設立年を未確認とした。","- 油長酒造の創業年の根拠：同社公式サイト自身が、1600年代後期には酒を造り始めていたようだとしたうえで、1719年（享保4年）の古文書をもとに創業を1719年とすると説明している。本表は公式の説明どおりに書いた。","- 奈良ホテルの創業と運営会社：ホテルの開業（創業）は1909年10月17日だが、当初の運営は大日本ホテル株式会社であり、現在の株式会社奈良ホテルの設立は1983年1月31日である。両者を分けて書いた。","- 柿安（株式会社柿安本店）は奈良県の企業ではない：同社公式「企業概要」は、創業を明治4年（1871年）11月8日、本社を三重県桑名市吉之丸8番地とする。奈良県内に本社がないため、h-1の本体には入れなかった。","- 大和ハウス工業は対象外：同社公式「会社概要」は、本社所在地を大阪市北区梅田3丁目3番5号、創業を1955年4月5日（設立1947年3月4日）とする。大阪本社のため、h-2の本体には入れなかった（同社は奈良市に総合技術研究所などを置くが、本社は大阪市である）。","- DMG森精機の本社の扱い：同社は奈良と東京の二本社制で、グローバル本社は東京都江東区である。本店所在地と第二本社は奈良市にあるためh-2に入れたが、「本社が奈良県内のみ」の企業ではない点を備考に明記した。","- 奈良県100年企業顕彰について：奈良県は令和6年度に「奈良県100年企業顕彰」を創設し、30社を顕彰した（奈良県公式）。本表のh-1は候補として挙がった企業のうち公式出典で裏取りできた8社であり、県内の100年企業を網羅したものではない。顕彰企業には株式会社あかしや（筆の製造販売、奈良市）、乾製麺所（製麺業、桜井市）、株式会社三光丸（医薬品製造業、御所市）なども含まれる。"],"tables":[]},{"h":"取得不可リスト","lv":2,"text":["- 今西清兵衛商店 公式サイトの「会社概要」ページ：検索では同社公式サイト内の会社概要ページを直接取得できず、取得不可とした。創業・法人化の年は、同社公式「会社概要」を出典とするWikipedia「今西清兵衛商店」の沿革と、厚生労働省の企業情報（公的）で代替確認した。","- 三輪山本 公式サイトの会社概要ページ：公式オンラインショップ等のページからは創業年・本社所在地の会社概要を直接取得できず、取得不可とした。創業1717年・本社奈良県桜井市箸中880はWikipedia「三輪山本」で確認し、同社の楽天市場店の会社概要（創業 享保2年（1717年）、奈良県桜井市箸中880）とも一致する。","- 中川政七商店 公式企業サイトの会社概要（所在地・設立年月日を一覧するページ）：今回開いた企業サイトのトップページでは所在地・法人設立日の一覧を確認できず、その項目は同社のプレスリリースに付された会社概要で確認した。","- 菊一文珠四郎包永 公式「会社概要」の所在地：同ページでは会社名・代表者・設立・従業員数・URLのみが表示され、所在地を確認できなかったため、所在地は奈良県の海外展開資料（自治体）に拠った。"],"tables":[]}]},{"id":"osaka","title":"大阪府","sub":"旧摂津国（府域）・河内国・和泉国","meta":["- 取得日：2026-11-18","- 前提：要約・加工なし、出典つき転記。事実と推測を分け、確認できないことは「未確認」と書く。公的・自治体の出典をWikipediaより優先し、Wikipediaだけの項目は出典の種別にその旨を残す。出典の種別は「公的」「自治体」「その他（内容）」「Wikipedia」の4種。","- 暦の方針：日付は新暦を主にし、1872年末までの日付は旧暦を括弧で併記する。1582年以前の西暦の月日は暦の種別を注記し、分からなければ「暦不明」と書く。出典が旧暦か新暦か判断できない日付は原文のまま書き「暦不明」と注記する。","- 対象範囲：大阪府域は3つの旧国にまたがる。摂津（大阪市・堺市北部ほか。兵庫県側は扱わない）、河内、和泉。堺は和泉と摂津（住吉郡）の境界があり、扱いはa13に注記した。","- 表の列は奈良（第3便）の形式にそろえた。末尾に「注記・食い違い」「取得不可だったページ」「照合区分の一覧」を付ける。","---"],"a":[{"h":"a. 旧国名と五畿七道","lv":2,"text":["出典：","- Wikipedia「摂津国」 https://ja.wikipedia.org/wiki/摂津国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「河内国」 https://ja.wikipedia.org/wiki/河内国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「和泉国」 https://ja.wikipedia.org/wiki/和泉国 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「五畿七道」 https://ja.wikipedia.org/wiki/五畿七道 （取得日2026-11-18、種別：Wikipedia）","- Wikipedia「大阪府」 https://ja.wikipedia.org/wiki/大阪府 （取得日2026-11-18、種別：Wikipedia）※a14のみ","- 「大阪府の主要大名」（gioan-awk.com） http://gioan-awk.com/daimyou-27osaka.htm （取得日2026-11-18、種別：その他）※『延喜式』の郡数に関する注記のみ"],"tables":[{"cols":["番号","名称","読み","内容・期間","備考","出典の種別"],"rows":[["a1","五畿（畿内）","ごき（きない）","五畿七道は古代日本の律令制における広域地方行政区画で、「畿内七道（きないしちどう）」とも呼ばれた。五畿は「畿内」ともいい、大和、山城、摂津、河内、和泉の五国。現在の奈良県、京都府中南部、大阪府、兵庫県南東部を合わせた地域。七道は東海道、東山道、北陸道、山陽道、山陰道、南海道、西海道","1869年（明治2年）、北海道が新設されてからは五畿八道と呼ばれる","Wikipedia"],["a2","摂津国","せっつのくに","日本の令制国の一つ。畿内に属する。現在の大阪府北中部の大半と兵庫県南東部にあたる。旧字体は「攝津國」。別称は摂州（せっしゅう）","瀬戸内海航路の起点で、淀川・大和川水系との結節点でもある難波津や住吉津があり「津国（つのくに）」と呼ばれた（記事）","Wikipedia"],["a3","摂津国の郡・郷数","―","13郡78郷（記事の基礎情報欄「郡・郷数」）。記事の「郡」の節に挙がる郡は次の12郡（郷数は記事の記載どおり）：島上郡（嶋上郡）…全5郷、島下郡（嶋下郡）…全4郷、豊島郡…全7郷、能勢郡…全3郷、川辺郡（河辺郡）…全8郷、有馬郡…全5郷、武庫郡…全8郷、菟原郡…全8郷、八部郡…全5郷、西成郡（西生郡）…全12郷、東成郡（東生郡）…全5郷、住吉郡…全5郷","島上郡と島下郡は古代三島郡が大宝元年（701年）に分割されて設置された。能勢郡は和銅6年（713年）に河辺郡の一部を割いて設置。記事には天智天皇3年（664年）に百済郡が設置されたとの記載もある。郡数の食い違いについては注記参照","Wikipedia"],["a4","摂津職","せっつしき","壬申の乱に勝利した天武天皇は、畿内の外港を抱える要地難波宮を副都とし、国司を置く代わりに、津国を摂（管掌）する機関として特に摂津職を置いた。摂津職は京官とされ、大夫・亮・進・属の四等官で構成された。延暦12年（793年）3月9日に摂津職を廃し、新たに摂津国を置いた。前身の摂津職から引き継いで「摂」の字を冠し、「せっつのくに」とも呼び、また元の津国の訓みそのままに「つのくに」とも呼んだ","記事の「人物」欄に挙がる最初の摂津大夫は多比麻呂で、天武天皇6年（677年）任官とある","Wikipedia"],["a5","河内国","かわちのくに（かはちのくに）","日本の地方行政区分である令制国の一つ。畿内に属する。旧字体は「河內國」。別称は河州（かしゅう）。相当領域は大阪府東部（当初は南西部も含む）","飛鳥時代の7世紀に成立した。『古事記』には「川内」の表記も見え、7世紀末・8世紀初めの木簡2例にも川内と書かれている。河内の名が確定したのは、おそらく大宝4年（704年）の国印鋳造時である（記事）","Wikipedia"],["a6","河内国の郡・郷数","―","14郡79郷（記事の基礎情報欄「郡・郷数」）。記事の「郡」の節に挙がる郡は次のとおり：茨田郡、交野郡（飛鳥時代後期に茨田郡より割置）、讃良郡、河内郡、高安郡、大県郡（養老4年（720年）11月、堅下郡と堅上郡を統合して設置）、若江郡、渋川郡、志紀郡、安宿部郡（安宿郡とも表記）、古市郡、石川郡、錦部郡、丹比郡（平安時代後期に分割され丹南郡・丹北郡となり、八上郡は平安時代後期に丹北郡より割置）","『延喜式』では河内は14郡（後代16郡）とする資料がある（その他出典の注記）","Wikipedia"],["a7","河内国の範囲と和泉の分立（河内国記事）","―","河内国の範囲は現在の大阪府東部に該当するが、奈良時代の初めまでは海側の和泉国の領域も含んでいた。霊亀2年（716年）4月16日に、大鳥郡・和泉郡・日根郡を割いて和泉監を分立させた。天平12年（740年）8月20日に和泉監を併合するが、天平宝字元年（757年）5月8日に、今度は和泉国として再び分立させた","和泉国記事の記載とは日付に食い違いがある（注記参照）","Wikipedia"],["a8","河内職","かわちしき","称徳朝の神護景雲3年（769年）に由義宮（八尾市）が建設されるとこれを西京と称し、それに伴って河内国が廃止され、かわって特別行政組織「河内職」が設置されたが、翌年元に戻された","―","Wikipedia"],["a9","和泉国","いずみのくに／いづみのくに","日本の地方行政区分である令制国の一つ。畿内に属する。別称は泉州（せんしゅう）。相当領域は大阪府南西部（大和川以南）","和泉地方の古名は「チヌ」（茅渟、血沼、珍）といった。もともとは「泉」一字で表記された。「和泉」の国名は、和銅6年（713年）の諸国郡郷名著好字令により国名を二字にする必要があり、佳字の「和」を付与したものにしたためで、「和」は読まない（記事）","Wikipedia"],["a10","和泉国の郡・郷数","―","3郡24郷（記事の基礎情報欄「郡・郷数」）。記事の「郡」の節に挙がる郡は次のとおり：大鳥郡、和泉郡（泉郡とも表記）、南郡（13世紀頃に和泉郡より分割）、日根郡","『延喜式』では和泉は3郡（後代4郡）とする資料がある（その他出典の注記）","Wikipedia"],["a11","和泉監の設置と和泉国の成立（和泉国記事）","―","『続日本紀』によれば、霊亀2年（716年）3月27日に河内国から和泉郡・日根郡を割き、さらに同年4月13日に同国大鳥郡を併せて「和泉監」が建てられた。元正天皇の離宮（珍努宮、茅渟宮、和泉宮とも）がこの地に造営されたことが、国司ではない監という特別な官司の設置の理由であると見られる。その後、天平12年（740年）8月20日に和泉監は廃止されて河内国に戻されたが、天平勝宝9歳（757年）5月8日に再度分離して和泉国が設置された","河内国記事の記載とは日付に食い違いがある（注記参照）。また記事の注釈によれば、『先代旧事本紀』国造本紀には、これより先の715年（霊亀元年）に茅野監（ちののげん）が茅渟宮に置かれたという","Wikipedia"],["a12","摂津4郡の和泉編入計画（未実施）","―","『日本紀略』によれば、天長2年（825年）3月30日、摂津国から東生・西生・百済・住吉の4郡を和泉国に編入しようとしたが、地元の反対があったため、同年閏7月21日に取り止めとなった","和泉国記事の記載","Wikipedia"],["a13","堺における国境の扱い","―","摂津・河内・和泉三国の国境は、現在の堺市の方違神社（三国山・三国丘）にあったが、明治4年（1871年）に和泉との国境は堺大小路から大和川に改められ、一部が和泉に編入された（摂津国記事）。明治4年（1871年）9月には住吉郡のうち大和川以南地域を和泉国大鳥郡へ編入した。和泉国記事は「明治4年（1871年）に摂津国との境界が堺大小路、長尾街道（大津道）から大和川に変更された（ただし、長尾街道以北でも、旧 北庄村・西万屋新田は以前から和泉国）」とする。現在の行政区分では、堺市堺区のうち大小路以北の堺市街地、旧三宝村大字弥三次郎新田・南島新田、旧向井町大字七道・遠里小野、北区のうち旧五箇荘村は明治4年（1871年）まで摂津国に属し、堺市東区全域・美原区全域・北区の一部（旧金岡村・北八下村）は河内国に属した","堺は摂津国住吉郡と和泉国大鳥郡の境界に位置し、市域は摂津・河内・和泉の3国にまたがる","Wikipedia"],["a14","大阪府域と3つの旧国","せっかせん（摂河泉）","Wikipedia「大阪府」は「府域は令制国の摂津国東部（7郡）および河内国と和泉国のそれぞれ全域で構成され、三国の文字を取って摂河泉（せっかせん）とも呼ばれる」とする。ただし、京都府から樫田村全域と亀岡市の一部が越境編入された1958年以降は丹波国南東部（ごく一部）も含むようになっている。なお、堺県編入の1881年から奈良県再設置の1887年までは大和国の全域も含んでいた","大阪府公式サイトでこの点を確認することは今回できなかった（取得不可参照）","Wikipedia"]]}]},{"h":"注記・食い違い（a）","lv":3,"text":["1. 和泉監設置の日付（食い違い）：河内国記事は「霊亀2年（716年）4月16日に、大鳥郡・和泉郡・日根郡を割いて和泉監を分立させた」とする。一方、和泉国記事は『続日本紀』によれば「霊亀2年（716年）3月27日に河内国から和泉郡・日根郡を割き、さらに同年4月13日に同国大鳥郡を併せて和泉監が建てられた」とする。両論併記し、どちらか一方に決めない。","2. 757年の再分立の年号表記：河内国記事は「天平宝字元年（757年）5月8日」、和泉国記事は「天平勝宝9歳（757年）5月8日」とし、年号の表記は異なるが年月日は一致する。","3. 摂津国の郡数・郷数（食い違い）：摂津国記事の基礎情報欄は「13郡78郷」とするが、同記事の「郡」の節に列挙されるのは12郡で、各郡の郷数を合計すると75郷となり、基礎情報欄の数と一致しない。なお「大阪府の主要大名」（その他）には「『延喜式』では摂津は13郡（後代12郡）」とある。差異の理由は各出典に明記がなく、未確認として残す。","4. 日付の暦について：716年・740年・757年・793年・825年の月日は、各記事が元号とともに記す日付であり、新暦への換算は記事に記載がないため、原文のまま転記した（暦の種別の明記はない）。","5. 河内国の読み：河内国記事の冒頭は「かわちのくに、かはちのくに」の両方を併記する。"],"tables":[]},{"h":"取得不可（a）","lv":3,"text":["- 大阪府公式サイト（pref.osaka.lg.jp）で、大阪府域が摂津・河内・和泉の3つの旧国にまたがる旨を記したページ：検索では該当ページに到達できず、公的出典での確認はできなかった。この点は未確認とし、代替としてWikipedia「大阪府」の記述（a14）を転記した。","---"],"tables":[]}],"b":[{"h":"b. 江戸時代の藩と藩主","lv":2,"text":["出典：Wikipedia「藩の一覧」 https://ja.wikipedia.org/wiki/藩の一覧 （取得日2026-11-18、種別：Wikipedia）および各藩・藩主の個別記事。出典の種別は特記なき限り「Wikipedia」。藩主の読みは、各藩記事・個人記事に読みの明記がある場合のみ転記し、明記がないものは「―（記事に読みなし）」とした（自治体出典での読みの取得は今回できなかった分を含む。下記「取得不可」参照）。","同記事の凡例：「設立後、すぐに廃藩となった藩などは記されていない場合がある」。","- 和泉国の項：陶器藩（1604年-）、伯太藩（大庭寺藩）（1698年-）、岸和田藩、谷川藩、吉見藩（1870年-）","- 河内国の項：丹南藩（1623年-）、狭山藩（1600年-）、西代藩（1679年-）","- 摂津国の項：三田藩、高槻藩、麻田藩（1615年-）、尼崎藩（1615年-）、大坂藩、茨木藩、摂津中島藩（1616？年-）、味舌藩（ましたはん）","- このうち三田藩・尼崎藩は現在の兵庫県域のため本表から除いた。大阪府域分は高槻藩・麻田藩・大坂藩・茨木藩・摂津中島藩・味舌藩の6藩。","- なお、依頼文の候補にあった三日月藩は、同記事では播磨国の項に挙がる（1697年-）藩で、現在の兵庫県域のため本表には入れていない。"],"tables":[{"cols":["番号","藩名","読み","立藩年","初代藩主（読み）","最後の藩主（読み）","石高の変遷","居城・陣屋","出典の種別"],"rows":[["1","岸和田藩","きしわだはん","天正13年（1585年）（豊臣秀吉の母方の叔父・小出秀政が岸和田城主に封ぜられたことに始まる、と記事）","小出秀政（―（記事に読みなし））","岡部長職（―（記事に読みなし））※第13代（岡部家）","小出家3万石→5万石（1600年-1619年）→松平（松井）家5万石→6万石→5万石（1619年-1640年）→岡部家6万石→5万3千石（1640年-1871年）","岸和田城（和泉国南郡岸和田、現在の大阪府岸和田市）","Wikipedia"],["2","高槻藩","たかつきはん","元和元年（1615年）（内藤信正が近江国長浜より4万石で入り立藩、と記事）","内藤信正（のぶまさ）","永井直諒（なおまさ）※永井家第13代","内藤家4万石（1615年-1617年）→土岐家2万石（1617年-1619年）→松平（形原）家2万石（1619年-1635年）→岡部家5万石（1635年-1640年）→松平（形原）家3万6000石（1640年-1649年）→永井家3万6000石（1649年-1871年）","高槻城（現在の大阪府高槻市城内町付近）","Wikipedia"],["3","狭山藩","さやまはん","慶長5年（1600年）（北条氏盛が父氏規の遺領を継いで1万1000石の大名となる。「これが狭山藩の始まりである」と記事）","北条氏盛（―（記事に読みなし））","北条氏恭（―（記事に読みなし））※第12代","1万1000石→1万石（第4代氏治の代に減封）","狭山陣屋（丹南郡池尻村および半田村、現・大阪府大阪狭山市狭山。第2代氏信の元和2年（1616年）に営まれた。当初は久宝寺町の大坂屋敷で政務）","Wikipedia"],["4","丹南藩","たんなんはん","元和9年（1623年）（高木正次が大坂定番就任の際1000石加増を受けて1万石の大名となり、領地を河内国丹南郡22村に移されて丹南を居所とした）","高木正次（―（記事に読みなし））","高木正善（―（記事に読みなし））※第13代","1万石（存続期間の大部分。2代正成の代に安房・上総へ3000石加増があったが、3代正弘が弟2人に1500石ずつ分与し1万石に戻った）","丹南陣屋（河内国丹南郡丹南村、現在の大阪府松原市丹南）","Wikipedia"],["5","西代藩","にしだいはん（にしんだいはん、注記参照）","延宝7年（1679年）（近江膳所藩本多家の分家として本多忠恒に1万石が分知されて成立。ただし西代に陣屋を置いたのは1711年、2代忠統の代）","本多忠恒（―（記事に読みなし））","本多忠統（―（記事に読みなし））※第2代。享保17年（1732年）に伊勢神戸藩へ転出し西代藩は廃藩","1万石","西代陣屋（河内国錦部郡西代村、現在の大阪府河内長野市西代町。1711年に忠統が構えた。立藩当初、忠恒は膳所を国元の住まいとした）","Wikipedia"],["6","陶器藩","とうきはん（かわらけはん、注記参照）","慶長9年（1604年）（『角川日本地名大辞典』による。小出吉英の領地から1万石が三尹に分与され成立。記事本文は慶長8年（1603年）の小出秀家没後に三尹が遺領2000石を継いだ経緯から説く）","小出三尹（みつまさ）","小出重興（―（記事に読みなし））※第4代。元禄9年（1696年）に無嗣のため改易","1万石","陶器陣屋（和泉国大鳥郡陶器庄の北村、現在の大阪府堺市中区陶器北付近）","Wikipedia"],["7","伯太藩","はかたはん","渡辺家の藩としての成立は寛文元年（1661年）（渡辺吉綱が大坂定番就任の際、河内・和泉両国内で1万石の加増を受け合計1万3500余石の大名となり野本藩が成立）。元禄11年（1698年）に居所を大庭寺村へ移し大庭寺藩、享保12年（1727年）に伯太村へ移し伯太藩。「藩の一覧」は和泉国の項に「伯太藩（大庭寺藩）（1698年-）」と挙げる","渡辺吉綱（―（記事に読みなし））※野本藩初代。伯太藩としての初代は渡辺基綱","渡辺章綱（―（記事に読みなし））※伯太移転後第9代","1万3500石","伯太陣屋（和泉国和泉郡伯太村、現在の大阪府和泉市伯太町。1727年移転。それ以前は大庭寺陣屋（大鳥郡大庭寺村、現・堺市南区）、さらに以前の居所については野本（武蔵国）とする説と河内国大井（現・藤井寺市）とする説がある）","Wikipedia"],["8","谷川藩","たにがわはん（『藩と城下町の事典』は「たにかわ」、注記参照）","慶長11年（1606年）（桑山重晴の養老料のうち1万石が桑山清晴に与えられて成立）","桑山清晴（―（記事に読みなし））※1代のみ","桑山清晴（同左）。慶長14年（1609年）に改易され廃藩","1万石","谷川陣屋（和泉国日根郡谷川村、現在の大阪府泉南郡岬町多奈川谷川）","Wikipedia"],["9","吉見藩","よしみはん","明治3年（1870年）4月14日（近江三上藩が藩庁を和泉国吉見へ移して成立。翌明治4年（1871年）7月の廃藩置県で消滅）","遠藤胤城（―（記事に読みなし））※藩知事、1代のみ（三上藩主からの継続）","遠藤胤城（同左）","1万4500石（三上藩・遠藤家の表高。『太政類典』によれば大政奉還時点の知行地は近江国4227石・和泉国5173石などに分布）","吉見（和泉国日根郡吉見村、現在の大阪府泉南郡田尻町吉見。春日神社境内に知藩事邸・藩士住居が設けられた）","Wikipedia"],["10","麻田藩","あさだはん","元和元年（1615年）（大坂の陣後に青木一重が入封して成立。同年7月に旧領の領有が認められ麻田に陣屋を構えた）","青木一重（かずしげ）","青木重義（しげよし）※第14代","1万2000石→1万石（元和3年（1617年）までの間に弟・可直へ2000石を分知）","麻田陣屋（摂津国豊島郡麻田村、現在の大阪府豊中市蛍池）","Wikipedia"],["11","大坂藩","おおさかはん","慶長20年（1615年）（大坂の陣による豊臣家滅亡後、松平忠明が10万石で入封し成立。元和5年（1619年）に忠明が大和郡山藩へ移封となり廃藩、以後は幕府直轄）※関ヶ原後に豊臣秀頼が摂津・河内・和泉65万7000石の一大名に押し込められたという解釈では、それ以前から「大坂藩といえる」と記事は記す","松平忠明（まつだいら ただあきら）※豊臣家を藩主家とみる場合は豊臣秀頼（とよとみ ひでより）","松平忠明（同左、1代のみ）","豊臣家65万7000石／松平家10万石","大坂城（摂津国東成郡、現在の大阪市中央区）","Wikipedia"],["12","茨木藩","いばらきはん","記事に立藩年の明記なし（関ヶ原の戦いの後、片桐且元が入ったとされる）","片桐且元（かつもと）※1代のみ","片桐且元（同左）。大坂の陣後、茨木は幕府領となった","2万8000石（片桐家、外様）","茨木城（摂津国、現在の大阪府茨木市片桐町・上泉町。一国一城令で廃城）","Wikipedia"],["13","摂津中島藩","せっつなかじまはん","元和2年（1616年）（稲葉紀通が伊勢田丸藩から領地替えを受けて移封され成立。寛永元年（1624年）に丹波福知山藩へ移封され廃藩）","稲葉紀通（のりみち）※1代のみ","稲葉紀通（同左）","4万5700石","柴島城（摂津国西成郡中島、現在の大阪市東淀川区柴島付近）であったとされる","Wikipedia"],["14","味舌藩","ましたはん","慶長5年（1600年）（織田長益（有楽斎）が関ヶ原の戦功により大和国山辺郡内に2万8000石を加増され、味舌の本領2000石と合わせて3万石の大名となり成立。所領の大部分は大和国内）","織田長益（―（記事に読みの明記なし））※元和元年（1615年）に子2人へ1万石ずつ分与し、残る1万石は長益の隠居料となった。元和7年（1621年）の長益死去をもって廃藩とされる（長則が継いだとする見解では寛永8年（1631年）廃藩）","織田長益（同左）","3万石→（1615年の分与後）隠居料1万石","味舌（摂津国島下郡味舌、現在の大阪府摂津市三島付近）を居所とする。なお『角川日本地名大辞典』「戒重村」の項は、長益が大名になった際に大和国戒重村に陣屋を置いたとする説を否定し、長益は京都に居住していたと記す（記事注釈）","Wikipedia"]]}]},{"h":"幕府領・幕府の機関","lv":3,"text":["出典：Wikipedia「大坂城代」 https://ja.wikipedia.org/wiki/大坂城代 ／「大坂町奉行」 https://ja.wikipedia.org/wiki/大坂町奉行 ／「堺奉行」 https://ja.wikipedia.org/wiki/堺奉行 （いずれも取得日2026-11-18、種別：Wikipedia）。出典（大坂町奉行の一覧）として記事内に「大坂城代・定番・町奉行・加番一覧 - 大阪府立図書館」の記載がある。","大坂城代","- 「大坂城代（おおさかじょうだい）は、江戸幕府の役職の一つ。将軍直属で有力な譜代大名が任じられ、大坂城主である将軍に代わり大坂城を預かった」（記事冒頭）。","- 松平忠明の大和郡山移封をもって大坂藩は廃止され、1619年（元和5年）に大坂は江戸幕府直轄地となり、大坂城に城代が置かれるようになった。1620年（元和6年）からは大坂城修築工事も始まり、大坂城代は大坂城守衛の総監および西国大名の監視等にあたった。","- 1623年（元和9年）には副城代に相当する京橋口定番・玉造口定番の大坂定番2名が置かれ、城代が追手口、京橋口定番が京橋口、玉造口定番が玉造口の各虎口の守衛をそれぞれ主に担当した。将軍直属の大坂城代と異なり、大坂定番は大坂町奉行などと同様に老中支配であった。","- 初代は内藤信正（1619年 - 1626年）。歴代は記事に68代まで挙がる（最後は牧野貞明（1864年 - 1868年））。","- 関東地方など遠方に領地を持つ大名が大坂城代に就任すると、所領のうち1万〜2万石程度を大坂近郊の摂津国・河内国・和泉国などに割り当て直された。退任時には元の所領に戻された。","大坂町奉行","- 「大坂町奉行（おおさかまちぶぎょう）は、江戸幕府が大坂に設置した遠国奉行の1つ。東西の奉行所が設置され、江戸町奉行と同様に東西1ヶ月ごとの月番制を取り、東西の奉行所はそれぞれ『東の御番所』『西の御番所』と呼ばれていた。初名は大坂郡代（おおさかぐんだい）。老中支配下で大坂城下（大坂三郷）および摂津・河内の支配を目的としていた」（記事冒頭）。","- 元和5年（1619年）8月22日に久貝正俊（東町奉行）・嶋田直時（西町奉行）がそれぞれ役高3000石をもって任じられたのが始まりとされている。","- 定員は東西それぞれ1名ずつ。元禄9年（1696年）- 同15年（1702年）の6年間のみ、一時廃止となった堺町奉行を兼務する3人目の奉行が設置されていた。","- 時代が下るにつれて、幕府領となった兵庫津・西宮の民政、摂津・河内・和泉・播磨における幕府領における年貢徴収および公事取扱（享保7年（1722年）以後）など、その職務権限は拡大された。","- 東西各奉行所に、それぞれ与力30騎、同心50人が配属された。","堺奉行","- 「堺奉行（さかいぶぎょう）は、江戸幕府が江戸以外の幕府直轄領内の重要な場所に置いた遠国奉行の一つで、堺および和泉・河内両国の幕府直轄領を統治した。前身は中世に設けられた堺政所（さかいまんどころ）である。堺奉行は老中支配の元に置かれ、配下は与力10騎・同心50人（一時与力6騎・同心40人となる）、足高は役高1000石・役料現米600石であった」（記事冒頭）。","- 1600年、徳川家康が成瀬正成、米津親勝、細井政成を堺政所に任じた。1614年に堺は幕府の直轄下となった。1618年に堺政所から堺奉行に改称した。","- 1696年2月には堺奉行が廃止され、堺は大坂町奉行の管轄となった。その後1702年11月に堺奉行が再設置されたものの、引き続き大坂町奉行の指揮下に置かれて、与力6騎、同心40人に削減された。1711年になって旧制の10騎・50人体制に復帰した。","- 1867年8月、慶応の改革によって堺奉行が再び廃止され、堺は大坂町奉行の管轄となった。","代官・代官所","- 大坂代官について：大阪市史編纂所の刊行物紹介（大阪市公式サイト内）によれば、「大坂代官は、摂津・河内・和泉・播磨の４ヵ国に散在する幕領（幕府直轄領）の村々を支配した幕府役人」であり、天保11年（1840年）出版の『大坂便用録』には「当時代官所のあった谷町・鈴木町各代官所の人員構成が掲載されています」とある（出典：大阪市史編纂所「大阪市史料調査会報 第38号」 https://www.oml.city.osaka.lg.jp/torikomi/upload/tayori038.pdf ／取得日2026-11-18／種別：自治体）。同紹介文には木町代官への言及もある。","- 枚方代官所については、下記「取得不可」のとおり、今回の取得範囲では確認できなかった。"],"tables":[]},{"h":"飛地・旗本領・幕府領の預かり","lv":3,"text":["出典はいずれも上記の各藩記事（Wikipedia、取得日2026-11-18）。","本拠が府域外の藩の飛地・府域外に領地を持つ府域の藩（記事の「幕末の領地」等の記載どおり）","- 高槻藩：摂津国のほか、丹波国桑田郡のうち15村、河内国茨田郡のうち3村（堺県に編入）を領した。","- 狭山藩：河内国のほか、近江国滋賀郡のうち1村、栗太郡のうち3村、野洲郡のうち2村、甲賀郡のうち1村を領した。","- 丹南藩：河内国のほか、下野国足利郡のうち4村を領した。","- 西代藩：河内国錦部郡のほか、近江国高島郡・甲賀郡に領地があった。1732年の転出後も、西代村を除く河内領は引き続き伊勢神戸藩本多家の知行地として続いた。","- 陶器藩：寛文4年（1664年）時点の領地は和泉国大鳥郡・河内国錦部郡・摂津国西成郡・但馬国気多郡・美含郡の4国5郡内に分散していた。","- 伯太藩：和泉・河内のほか近江国（栗太郡・野洲郡・蒲生郡・高島郡）に領地があり、近江の諸村は「東江州郷」「西江州郷」に編成された。和泉郡池上村は大和小泉藩と伯太藩の相給であった。","- 麻田藩：摂津国のほか、備中国小田郡・後月郡・浅口郡に領地があった。","- 吉見藩（三上藩）：吉見県管轄地には、旧藩領以外に和泉郡の旧幕府領2村、日根郡の旧土浦藩領2村が編入された（記事の旧高旧領取調帳データベースに基づく表による）。","幕府領の預かり（記事の記載どおり）","- 岸和田藩：「上記のほか、大鳥郡1村、和泉郡1村、南郡4村、日根郡5村の幕府領を預かり、大鳥郡1村が堺県に、残部が本藩に編入された」。","- 高槻藩：「島下郡14村、島上郡17村、能勢郡18村の幕府領を預かり、島上郡3村は本藩に、残部は摂津県に編入された。また、茨田郡6村の幕府領を預かったが、全域が堺県に編入された」。","旗本領","- 旗本小出家（陶器）：陶器藩の廃藩後、宝永2年（1705年）に大身旗本・小出有仍が和泉国大鳥郡11か村・河内錦部郡3か村に知行地5000石を移された。これらは陶器藩旧領であり、以後幕末まで大身旗本小出家の知行地となった。文政4年（1821年）には大鳥郡田園村に陣屋（田園陣屋）を構えた（Wikipedia「陶器藩」）。","- 旗本青木家（麻田）：麻田藩初代・青木一重が弟の可直に分知した2000石は旗本青木家の知行となり、牧荘の平尾村に「平尾役所」を置いて知行地の支配にあたった（Wikipedia「麻田藩」）。"],"tables":[]},{"h":"奈良県の回で未取得だった人物の読み（追加取得分）","lv":3,"text":["出典：Wikipedia「片桐且元」 https://ja.wikipedia.org/wiki/片桐且元 ／「片桐為次」 https://ja.wikipedia.org/wiki/片桐為次 （いずれも取得日2026-11-18、種別：Wikipedia）"],"tables":[{"cols":["人物","読み","出典の記載"],"rows":[["片桐且元","かたぎり かつもと","「片桐 且元（かたぎり かつもと）は、安土桃山時代から江戸時代初期にかけての武将、大名。……大和国竜田藩初代藩主」。基礎情報欄に「藩：大和竜田藩主」。なお慶長6年（1601年）正月に1万8千石の加増を受け2万8千石を領し「大和竜田城を居城としている」と本文にある。本表の茨木藩の藩主でもある"],["片桐為次","かたぎり ためつぐ","「片桐 為次（かたぎり ためつぐ、寛永18年（1641年） - 明暦元年11月6日（1655年12月3日））は、大和竜田藩の第4代（最後）の藩主」。承応3年（1654年）に父の死去により跡を継ぐが、翌年11月6日に15歳で死去し、嗣子がなく竜田藩は無嗣改易となった"]]}]},{"h":"岸田藩（追加項目）","lv":3,"text":["- Wikipedia「藩の一覧」の大和国の項に「岸田藩」の藩名のみ挙がることは確認できた（立藩年の記載なし）。個別記事「岸田藩」は下記のとおり取得できなかったため、藩名・読み・立藩年・藩主・石高・居城はいずれも未確認。"],"tables":[]},{"h":"注記・食い違い（b）","lv":3,"text":["1. 高槻藩・岡部宣勝の石高：同記事の概要は「播磨国龍野藩より岡部宣勝が5万1000石で入った」とするが、歴代藩主の家の見出しは「岡部家 譜代 5万石 （1635年 - 1640年）」とする。記事内の食い違いとして両方を併記する。","2. 岸和田藩・岡部行隆の在職開始年：歴代藩主表は2代行隆の在職を「寛文元年10月27日（1624年）」と記すが、寛文元年は1661年であり、表中の西暦併記「1624年」は1代宣勝の在職終了「寛文元年10月27日（1661年）」とも一致しない。記事の表記どおり転記した（記事内の食い違い）。","3. 西代藩の読み：記事は「西代藩（にしだいはん、にしんだいはん）」と2つの読みを併記する。注釈によれば「西代という地名は本来『にしんだい』と読むが、現代の行政地名としての河内長野市西代町は『にしだいちょう』とされる」。","4. 陶器藩の読み：記事冒頭は「陶器藩（とうきはん / かわらけはん）」。注釈によれば『出石町史』は「陶器」に「かわらけ」と読み仮名を振っている。","5. 谷川藩の読み：記事注釈によれば、日本郵便の郵便番号検索では「谷川」は「たにがわ」、『藩と城下町の事典』は「たにかわ」とする。食い違いとして両方を併記する。","6. 伯太藩の居所の変遷：渡辺家の居所については、野本藩（武蔵国野本村）とする見解と、河内国大井に陣屋を置いた「大井藩」とする見解（『藩と城下町の事典』は「武蔵国野本藩の一時的な仮称」とする）があり、記事は「居所については不明瞭な点を含み」と明記する。両論併記。","7. 大庭寺の読み：伯太藩記事の注釈によれば、日本郵政の「郵便番号検索」では大庭寺は「おおばでら」、『角川日本地名大辞典』『角川新版日本史辞典』は「おばでら」とする。食い違いとして併記する。","8. 陶器藩の2代藩主名：歴代藩主の見出しは「2. 有棟」とするが、本文（文化の節）には「2代藩主・有宗（有棟）」「2代藩主・三尹の妻」と異なる表記が混在する。記事の表記どおり転記した。","9. 大坂藩の成立時期：豊臣秀頼を一大名とみる解釈では関ヶ原後（1600年）から「大坂藩といえる」とする一方、記事本文は松平忠明の入封（1615年）をもって「大坂藩が成立した」とする。両方を併記した。","10. 味舌藩の廃藩年：元和7年（1621年）の織田長益死去をもって廃藩とするのが記事の本文の扱いだが、孫の長則が「味舌藩」を継いだとする見解では、その死去した寛永8年（1631年）が廃藩時期となる。両論併記。","11. 麻田藩の石高表記：基礎情報欄は「1万2000石→1万石」、歴代藩主の見出しは「外様 1万2千石 （元和元年（1615年） - 1871年（明治4年））」とする。本文によれば分知後の表高は1万石で、「存続期間のほとんどにおいて表高は1万石」。"],"tables":[]},{"h":"取得不可（b）","lv":3,"text":["- Wikipedia「岸田藩」 https://ja.wikipedia.org/wiki/岸田藩 — 取得を試みたが、ページの保存コピーがなく取得に失敗した（奈良県の回に続き2回目の取得不可）。内容は未確認。","- Wikipedia「枚方代官所」 — その題名のページは存在せず（取得時にページが見つからなかった）。府域の代官については、大阪市史編纂所の刊行物紹介（自治体）にある大坂代官・谷町／鈴木町／木町代官所の記述で代替し、枚方代官所そのものの設置・管轄は未確認。","- 藩主個人記事（取得ツールのレート制限（429）のため取得不可）：「小出秀政」「岡部長職」「北条氏恭」ほか、本表で「―（記事に読みなし）」とした藩主の個人記事は、今回の取得ではレート制限により開けなかった。このため当該藩主の読みは未取得のまま残した（読みが取れたのは各藩記事・個人記事に明記があった分のみ）。","- 自治体出典（市史・市公式サイト）による藩主の読み：丹南藩記事が引用する松原市公式「61 高木氏と丹南藩一万石」など、記事内の引用元ページそのものは今回直接取得できていない。","---"],"tables":[]}],"c":[{"h":"c-1. 表：廃藩置県で県になった府域の旧藩と、幕府領・大阪府から県になったもの","lv":3,"text":["前提：廃藩置県は1871年8月29日（明治4年7月14日）に実施され、各藩はそのまま県を名乗った（大阪府公文書館歴史講座資料は「明治4（1871）年7月14日廃藩置県・・・3府302県」とする）。第1次府県統合は明治4年10〜11月に行われ「3府72県」となった（同資料）。","出典：Wikipedia「堺県」 https://ja.wikipedia.org/wiki/堺県 、「河内県 (日本)」 https://ja.wikipedia.org/wiki/河内県_(日本) 、大阪府公文書館資料、大阪府公式「府議会のあゆみ」、堺市公式、タウンガイド大阪（取得日はいずれも2026-11-18）。","注記（狭山藩）：狭山藩からは県は置かれなかった。狭山藩は廃藩置県以前の1869年に廃藩となり、1870年1月27日（明治2年12月26日）に堺県へ編入された（Wikipedia「堺県」）。堺市公式も「翌年、河内県・狭山藩を合併」とする。","注記（読み）：堺県・河内県の読みは各Wikipedia記事の冒頭表記による。伯太（はかた）・丹南（たんなん）は堺市公式の表記による。高槻（たかつき）は学研キッズネット「おおさか〖大阪（府）〗」の高槻藩（たかつきはん）の表記による。岸和田は岸和田藩（きしわだはん）（Weblio辞書）の読みによる。吉見県・麻田県については、県名としての読みを明記した出典を今回確認できなかったため、読みは未確認として扱う（表中の読みは藩名・地名の読みによる）。","注記（高槻県・麻田県の統合日）：タウンガイド大阪の「明治初年の地方制度の変遷」は「1871年（明治4年）11月20日高槻県、麻田県を大阪府に編入合併」とする。英語版Wikipedia「List of mergers in Osaka Prefecture」も高槻県・麻田県が大阪府へ統合された旨を記すが日付は示さない。日本語版Wikipediaでの照合は未実施（下記「取得不可」参照）。学術論文「大阪府の成立と地方自治の原型」は、明治4年11月の府県大改革により大阪府が「大阪市街地と摂津7郡（西成・東成・住吉・島上・島下・豊島・能勢）」を管轄し、兵庫県とは猪名川、堺県とは大和川を境界としたと記す。"],"tables":[{"cols":["番号","県名","読み","前身","発足日","統合先・廃止先","統合日・廃止日","出典の種別"],"rows":[["1","岸和田県","きしわだけん","岸和田藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia"],["2","伯太県","はかたけん","伯太藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia／自治体（堺市公式）"],["3","吉見県","よしみけん（読みは未確認。下記注記参照）","吉見藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia"],["4","丹南県","たんなんけん","丹南藩","1871年8月29日（明治4年7月14日）","堺県","1872年1月2日（明治4年11月22日）","Wikipedia／自治体（堺市公式）"],["5","高槻県","たかつきけん","高槻藩","1871年8月29日（明治4年7月14日）","大阪府","1871年12月31日（明治4年11月20日）","その他（タウンガイド大阪）"],["6","麻田県","あさだけん（読みは未確認。下記注記参照）","麻田藩","1871年8月29日（明治4年7月14日）","大阪府","1871年12月31日（明治4年11月20日）","その他（タウンガイド大阪）"],["7","河内県","かわちけん","大阪府南司農局の管轄地域（河内国の旧幕府領・旗本領）","1869年（明治2年）1月20日（西暦の月日換算は出典に明記なし）","堺県","1869年9月7日（明治2年8月2日）","Wikipedia"],["8","堺県（第1次）","さかいけん","大阪府（堺役所）。堺役所は大坂裁判所の出張所として堺奉行所跡に置かれ、慶応4年閏4月に堺役所へ改称、6月8日より和泉国の旧幕府領を管轄","1868年8月10日（慶応4年6月22日）","第1次府県統合により伯太県・岸和田県・吉見県・丹南県と統合され、改めて堺県（第2次）が発足","1872年1月2日（明治4年11月22日）","Wikipedia／自治体（大阪府公文書館）"],["9","五條県の河内国分","―","五條県","―","堺県（大和国分は奈良県、紀伊国分は和歌山県へ。同日、五條県廃止）","1872年1月2日（明治4年11月22日）","Wikipedia"]]}]},{"h":"c-2. 年表：大阪府・堺県・河内県などの設置・統合・廃止","lv":3,"text":["出典：Wikipedia「堺県」「河内県 (日本)」、大阪府公文書館「大阪あーかいぶず第35号」（矢切努「戦前地方『自治』の確立と大阪府」 https://archives.pref.osaka.lg.jp/search/information.do?method=initPage&id=55 ）・歴史講座資料「大阪府の成立とその発展」 https://archives.pref.osaka.lg.jp/search/image/h26Re-text.pdf 、大阪府公式「府議会のあゆみ」 https://www.pref.osaka.lg.jp/o170010/gikai_giji/aramashi/ayumi.html 、「大阪府の成立と地方自治の原型」（大阪教育大学リポジトリ収録論文 https://osaka-kyoiku.repo.nii.ac.jp/record/2085319/files/koumin_1_003.pdf ）（取得日はいずれも2026-11-18）。明治5年以前の日付は旧暦（Wikipedia「堺県」の沿革の表記方針による）。","- 1868年（慶応4年）1月22日：大阪鎮台が西本願寺津村別院に置かれる（大阪府公文書館歴史講座資料）。Wikipedia「堺県」は「正月22日（2月12日）に大坂鎮台を設置」と西暦換算を併記するが、この換算は他の換算と整合しない箇所があり、西暦の日は未確認として扱う（注記参照）。","- 1868年（慶応4年）1月27日：大阪鎮台は大阪裁判所と改称（大阪府公文書館歴史講座資料、学術論文）。","- 1868年（慶応4年）閏4月12日・21日：太政官布告により地方を府・藩・県に分け、9府22県266藩が設置された（大阪府公文書館歴史講座資料）。学術論文は「閏4月21日政体書が公布され、府藩県の三治制が実施されることになった」とする。","- 1868年6月21日（慶応4年5月2日）：大阪裁判所は大阪府と改称・設置（Wikipedia「堺県」、大阪府公文書館「大阪あーかいぶず第35号」、大阪府公式「府議会のあゆみ」は「慶応4年（1868年）の5月、大阪裁判所を改め、大阪府が設置されました」とする）。","- 1868年8月10日（慶応4年6月22日）：大阪府から堺役所を分割して堺県（第1次）が発足。発足当時の管轄は堺市街地一円と和泉国内4郡の郡村（Wikipedia「堺県」）。大阪府公文書館歴史講座資料も「同年6月22日、堺役所を大阪府から分割 →堺県誕生」とし、堺奉行所跡がそのまま堺県庁舎となったとする。","- 1868年12月7日（慶応4年10月24日）：大阪府との境界を大和川に定める太政官達が出され、摂津国住吉郡の大和川以南を堺県所管とすることとされたが、実際の編入は1871年11月12日（明治4年9月30日）（Wikipedia「堺県」）。","- 1869年（明治2年）1月：摂津県と河内県が大阪府から分離独立した（学術論文）。河内県の発足は1869年（明治2年）1月20日で、県庁は若江郡寺内村（現在の八尾市）の八尾別院大信寺の対面所に置かれた（Wikipedia「河内県 (日本)」）。","- 1869年（明治2年）5月：摂津県は豊崎県と改称（学術論文）。摂津県・豊崎県の日レベルの日付は未確認（下記「取得不可」参照）。","- 1869年（明治2年）：大阪府の管轄は大坂三郷とその町および属邑のみとなり、同年1月と9月に市街地に隣接する西成・東成・住吉の3郡が大阪府に戻された（Wikipedia「河内県 (日本)」、学術論文）。","- 1869年9月7日（明治2年8月2日）：河内県廃止に伴い、旧河内県の河内国16郡内の郡村が堺県管轄となる。引受完了は1869年10月2日（明治2年8月27日）（Wikipedia「堺県」「河内県 (日本)」）。","- 1869年7月17日：太政官布告により「府」は「京都・東京・大阪に限る」とされた（大阪府公文書館歴史講座資料）。学術論文は「翌明治2年には東京・大阪・京都の3府を残し、ほかはすべて県に改められた」とする。","- 1870年1月27日（明治2年12月26日）：廃藩となった狭山藩を堺県が編入（Wikipedia「堺県」）。","- 1870年3月28日（明治3年2月27日）：旧高野山領および錦部郡、石川郡の一部が新設の五條県に編入された（Wikipedia「堺県」）。","- 1871年8月29日（明治4年7月14日）：廃藩置県。府域では岸和田県・伯太県・吉見県・丹南県・高槻県・麻田県が発足（c-1表）。","- 1871年11月12日（明治4年9月30日）：摂津国住吉郡のうち大和川以南が和泉国大鳥郡に編入された（Wikipedia「堺県」）。","- 1871年12月31日（明治4年11月20日）：高槻県・麻田県を大阪府に編入合併（タウンガイド大阪）。","- 1872年1月2日（明治4年11月22日）：第1次府県統合により、堺県・伯太県・岸和田県・吉見県・丹南県が統合され、改めて堺県（第2次）が発足。「堺県」が正式名称として確定し、県庁を本願寺堺別院（堺北御坊）へ移転（Wikipedia「堺県」）。五條県も同日に廃止され、河内国分は堺県へ編入（Wikipedia「五條県」）。","- 1876年4月18日：第2次府県統合により、堺県が奈良県を編入。堺県の管轄は和泉国・河内国・大和国の全域となった（Wikipedia「堺県」、大阪府公文書館「大阪あーかいぶず第35号」）。","- 1881年2月7日：堺県が廃止され、大阪府に編入（Wikipedia「堺県」、大阪府公文書館「大阪あーかいぶず第35号」、大阪府公式「府議会のあゆみ」は「明治14年（1881年）2月に堺県が廃止され大阪府の管轄となった」とする）。これにより大阪府の管轄は河内・和泉・大和3か国の全域を加えた広域となった（学術論文）。","- 1887年11月4日：奈良県（第2次）が大阪府から分離して再設置された。根拠法令は明治20年勅令第59号「奈良縣設置ノ件」（第3便でWikisource（底本『官報』1887年11月10日）により本文を確認済み）。初代県知事は税所篤（堺県令だった人物）（Wikipedia「堺県」）。学術論文も「奈良県は、20年11月大阪府から分離独立」とする。","堺県合併の理由（出典の記載）：学術論文「大阪府の成立と地方自治の原型」は、第一の理由を大阪府の管轄区域の狭さ（「東西12km、南北40㎞余りしかなかった」）、第二の理由を財政問題（明治14年度から府庁舎修築費や監獄・土木の諸経費が地方税支弁となり、管轄区域の狭い大阪府の財政難が見込まれた）とし、合併当時の地租は大阪府581,859円に対し堺県は約2.6倍、人口は大阪府55万人に対し堺県94万人だったと記す（堺県の地租の正確な額は、取得したPDFの文字が判読できず未確認）。堺市公式「新しい時代へ 変わりゆく近代の美原」 https://www.city.sakai.lg.jp/mihara/miryoku/konnamachi/kunorekishi/rekishikiko/kindai/atarasiijidaihe.html のコラムは「東京・京都・大阪府の3府の内、最も狭小で、財政が弱かった大阪府を補強するため、わずか県治14年にして廃県、大阪府へ編入された」と記す。Wikipedia「堺県」は「府域が極めて狭い上、……経済の地盤沈下に直面していた大阪府を、『府』にふさわしい規模にするために行われたと考えられている」と記す（ただし記事には出典不十分のテンプレートがある）。"],"tables":[]},{"h":"c-3. 照合結果","lv":3,"text":["照合できたもの（公的・自治体出典とWikipedia・学術論文で一致）","- 大阪府の設置：1868年（慶応4年）5月2日（旧暦）に大阪裁判所を改めて設置（大阪府公文書館「大阪あーかいぶず第35号」・歴史講座資料、大阪府公式「府議会のあゆみ」、Wikipedia「堺県」、学術論文）。","- 堺県の成立：1868年（慶応4年）6月22日（旧暦）（大阪府公文書館「大阪あーかいぶず第35号」・歴史講座資料、Wikipedia「堺県」）。","- 奈良県の堺県への合併：1876年（明治9年）4月18日（大阪府公文書館「大阪あーかいぶず第35号」、Wikipedia「堺県」）。","- 堺県の大阪府への合併（廃止）：1881年（明治14年）2月7日（大阪府公文書館「大阪あーかいぶず第35号」、大阪府公式「府議会のあゆみ」、Wikipedia「堺県」）。","- 廃藩置県時点の全国の府県数「3府302県」、第1次府県統廃合後「3府72県」、1881年時点で「3府38県（堺県を大阪府に統合）」（大阪府公文書館歴史講座資料）。","照合できなかったもの","- 国立公文書館／アジア歴史資料センター（JACAR）：検索では太政類典や「記録材料・太政官布告」（レファレンスコード A07060003500 など）のコレクションには到達したが、第1次府県統合（堺県の統合）・堺県の大阪府合併・奈良県設置に関する個別の文書そのものには到達できず、未確認（照合未実施）として扱う。日付の照合は大阪府公文書館・大阪府公式の資料とWikipedia・学術論文の範囲で完了した。","- 高槻県・麻田県の統合日（1871年12月31日（明治4年11月20日））：タウンガイド大阪（その他）の記載のみで、日本語版Wikipediaでの照合は未実施（下記「取得不可」）。","- 第1次府県統合における堺県発足の布告日と実施日の区別：出典上は明治4年11月22日が統合の日とされ、布告日との区別は明記されていない（未確認）。"],"tables":[]},{"h":"注記・食い違い（c）","lv":3,"text":["1. 堺県成立時の管轄範囲：大阪府公文書館「大阪あーかいぶず第35号」は「慶応4(1868)年6月22日、河内・和泉両国を管轄する堺県が成立した」と記す。これに対しWikipedia「堺県」の沿革は、発足当時の管轄を「堺市街地一円と和泉国内4郡の郡村」とし、河内国の編入は1869年9月7日（明治2年8月2日）の河内県廃止に伴うものとする。食い違い（記述の差異）として両方を併記する。なおWikipedia「堺県」の冒頭文の旧版（他サイトに転載されたもの）は「和泉国および河内国の一部の旧幕府領・旗本領を管轄するために設置」としていた。","2. 大阪府設置時の管轄：大阪府公文書館「大阪あーかいぶず第35号」は「慶応4(1868)年5月2日に設置された大阪府は、現在の府域の内、摂津7郡を管轄するに過ぎなかった」と記す。一方、学術論文は、明治2年には大阪府の管轄は大阪市街地だけとなり、明治4年11月の府県大改革で大阪市街地と摂津7郡を管轄することになったとする。摂津7郡の管轄が設置当初からか明治4年11月以降かで記述に差異があるため併記する。","3. 堺県の初代知事の名：Wikipedia「堺県」は「堺役所判事だった小河一敏が初代堺県知事となった」とする。大阪府公文書館歴史講座資料は「同年5月9日、小河弥右衛門が大阪府判事として堺役所在勤」「大阪府判事小河が堺県知事に」とする。名の表記が異なるため食い違いとして両方を併記する。","4. 第1次府県統合で堺県に統合された県の数：Wikipedia「堺県」は「堺県、伯太県、岸和田県、吉見県、丹南県が統合され、改めて堺県が発足」（堺県を含む5県）とする。堺市公式「堺県庁跡」 https://www.city.sakai.lg.jp/kanko/rekishi/bunkazai/bunkazai/shokai/bunya/shiseki/oldkencho.html は「同4年には伯太（はかた）、岸和田、吉見、丹南4県を……合併」とし、堺市公式のコラムも「伯太・岸和田・丹南・吉見の4県を統合」とする。これは堺県自身を数えるかどうかの数え方の違いとみられるが、出典の表記どおり両方を併記する。","5. 大阪鎮台設置日の西暦換算：Wikipedia「堺県」は「正月22日（2月12日）」とするが、同記事の他の換算（正月10日＝2月3日、正月27日＝2月20日）とは
