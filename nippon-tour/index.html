酒（20歳から）", "en": "Sake (adults only)"}, "history": {"ja": "歴史", "en": "History"}, "tf": {"ja": "確認済み", "en": "Verified"}, "tl": {"ja": "伝承", "en": "Folklore"}, "tx": {"ja": "未確認", "en": "Unconfirmed"}, "src": {"ja": "出典", "en": "Source"}, "end": {"ja": "関東の旅、完了！", "en": "Kanto tour complete!"}, "endtxt": {"ja": "大宮駅から、東北新幹線で北へ。次の弾は、東北編（予定）。\n\n※お酒の紹介は、おとな向けです。味わいは、確認できた範囲だけを書いています。", "en": "From Omiya, the Tohoku Shinkansen runs north. Next: the Tohoku part (planned).\n\n*Sake notes are for adults, and tasting notes appear only where we could confirm them."}, "reset": {"ja": "記録を消す", "en": "Erase save"}, "sure": {"ja": "本当に消す？（もう一度押すと消えます）", "en": "Really erase? (press again)"}, "stars": {"ja": "★", "en": "★"}, "modes": {"ja": "のりもの", "en": "Transport"}, "from": {"ja": "出発", "en": "Start"}, "sp": {"ja": "{n}ばんめ", "en": "No. {n}"}, "sayc": {"ja": "県庁所在地は、ここやで。", "en": "Here's the prefectural seat."}, "sayt": {"ja": "見てみよ。", "en": "Take a look."}, "saw": {"ja": "ええ香りがする…", "en": "Smells great..."}, "kenmin": {"ja": "県民性（よく言われる）", "en": "Local character (folk image)"}, "tk": {"ja": "よく言われる", "en": "Folk image"}, "bgm": {"ja": "♪音楽", "en": "♪ Music"}, "se": {"ja": "ピー音", "en": "Beeps"}, "on": {"ja": "オン", "en": "on"}, "off": {"ja": "オフ", "en": "off"}, "skip": {"ja": "（タップで全部表示）", "en": "(tap to show all)"}}, "P": [{"id": "tokyo", "ja": "東京都", "en": "Tokyo", "ll": [35.69, 139.692], "cap": {"ja": "新宿区（東京都庁）", "en": "Shinjuku Ward (Tokyo Metropolitan Government)"}, "intro": {"ja": "イナリ「着いたで、東京や！ ここから日本一周の旅のはじまりや！」\nテンジン「まずは、東京の中身を、ひととおり見ていこか。」", "en": "Inari: \"We made it to Tokyo! Our journey around Japan starts here!\"\nTenjin: \"Let's take a good look around first.\""}, "topics": {"cap": {"title": {"ja": "県庁所在地：新宿", "en": "Prefectural seat: Shinjuku"}, "text": {"ja": "東京都の都庁は、新宿区にある。「東京」は、23の特別区と市町村からなる都で、都庁の所在地は、新宿区とされる。", "en": "Tokyo's metropolitan government sits in Shinjuku Ward. Tokyo is a 'metropolis' made of 23 special wards plus cities, towns and villages."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "東京都庁があるのは、どこ？", "en": "Where is the Tokyo Metropolitan Government located?"}, "c": [{"ja": "新宿区", "en": "Shinjuku Ward"}, {"ja": "千代田区", "en": "Chiyoda Ward"}, {"ja": "港区", "en": "Minato Ward"}], "a": 0}, "shrine": {"title": {"ja": "明治神宮", "en": "Meiji Jingu"}, "text": {"ja": "渋谷・原宿にある明治神宮は、明治天皇と昭憲皇太后を祀る。大正9年（1920年）に鎮座した。（千葉の亀田酒造は、この神宮の新嘗祭へ、毎年お酒を奉納している蔵とされる。）", "en": "Meiji Jingu, in Shibuya/Harajuku, enshrines Emperor Meiji and Empress Shoken. It was founded in 1920. (Kameda Shuzo of Chiba is said to be the only brewery that offers sake every year at its Niinamesai harvest rite.)"}, "tag": "x", "s": "鎮座年は出典未確認。亀田酒造の奉納：千葉県公式観光サイト「まるちば」", "q": {"ja": "明治神宮が鎮座したのは、いつ？", "en": "When was Meiji Jingu founded?"}, "c": [{"ja": "1920年", "en": "1920"}, {"ja": "1868年", "en": "1868"}, {"ja": "1964年", "en": "1964"}], "a": 0}, "food": {"title": {"ja": "名物：江戸前寿司", "en": "Specialty: Edomae sushi"}, "text": {"ja": "江戸前寿司は、江戸の海（江戸前）でとれた魚介を使う握りずしの流れをくむ。屋台から広まったとされる。", "en": "Edomae sushi comes from nigiri sushi made with seafood from the waters off Edo. It is said to have spread from street stalls."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "江戸前寿司の「江戸前」とは、もとは何を指す？", "en": "What did 'Edomae' originally refer to?"}, "c": [{"ja": "江戸の海の魚", "en": "Fish from the waters off Edo"}, {"ja": "寿司の大きさ", "en": "The size of the sushi"}, {"ja": "お店の名前", "en": "The name of a shop"}], "a": 0}, "gourmet": {"title": {"ja": "ご当地グルメ：もんじゃ焼き", "en": "Local eats: Monja-yaki"}, "text": {"ja": "もんじゃ焼きは、鉄板で焼いて、小さなヘラで食べる。月島のもんじゃストリートが有名。", "en": "Monja-yaki is cooked on an iron griddle and eaten with a tiny spatula. Tsukishima's 'Monja Street' is famous for it."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "もんじゃ焼きで有名な、東京の街は？", "en": "Which Tokyo neighbourhood is famous for monja-yaki?"}, "c": [{"ja": "月島", "en": "Tsukishima"}, {"ja": "浅草橋", "en": "Asakusabashi"}, {"ja": "高円寺", "en": "Koenji"}], "a": 0}, "sake": {"title": {"ja": "お酒：多満自慢（福生）", "en": "Sake: Tamajiman (Fussa)"}, "text": {"ja": "多摩の福生市には、江戸時代から酒を造る蔵がある。福生市の資料は、「多満自慢」を、地元で親しまれる銘柄に挙げる。味わいの記述は、確認できなかった（未確認）。※お酒は20歳になってから。", "en": "In Fussa, western Tokyo, breweries have made sake since the Edo period. Fussa City's material lists 'Tamajiman' among the local favourites. We could not verify a tasting description (unconfirmed). *Drinking is for adults only."}, "tag": "f", "s": "福生市「ふるさと」資料（銘柄・江戸時代からの酒造り）。味わいは未確認", "q": {"ja": "福生の地酒として、市の資料に挙がる銘柄は？", "en": "Which Fussa sake brand is named in the city's material?"}, "c": [{"ja": "多満自慢", "en": "Tamajiman"}, {"ja": "群馬泉", "en": "Gunma Izumi"}, {"ja": "天青", "en": "Tensei"}], "a": 0}, "history": {"title": {"ja": "歴史：江戸と東京", "en": "History: Edo and Tokyo"}, "text": {"ja": "1603年、徳川家康が江戸に幕府を開いた。1868年、江戸は「東京」と改められた。（東京が都になった経緯には、遷都の正式な宣言はなかったとする見方もあり、諸説ある。）", "en": "In 1603, Tokugawa Ieyasu founded his shogunate at Edo. In 1868 Edo was renamed 'Tokyo'. (How Tokyo became the capital is debated; some note there was no formal declaration of transfer.)"}, "tag": "x", "s": "出典未確認（諸説あり）", "q": {"ja": "江戸に幕府を開いたのは？", "en": "Who founded the shogunate at Edo?"}, "c": [{"ja": "徳川家康", "en": "Tokugawa Ieyasu"}, {"ja": "源頼朝", "en": "Minamoto no Yoritomo"}, {"ja": "織田信長", "en": "Oda Nobunaga"}], "a": 0}, "kenmin": {"title": {"ja": "江戸っ子と、集まる人々", "en": "Edokko and people from everywhere"}, "text": {"ja": "「江戸っ子」は、気っぷがよく、さっぱりした気質だと語られてきた（俗説）。いまの東京は、日本各地や世界から来た人が暮らす街でもある。\n\n※県民性は、昔から語られてきた『よく言われること』で、科学的に確かめられた性格の違いではありません。世代や個人による差は大きく、人は一人ひとり違います。", "en": "'Edokko' (born-and-bred Tokyoites) have been described as easygoing and open-handed (folk image). Today Tokyo is also home to people from all over Japan and the world.\n\n*'Prefectural character' is long-told folk imagery, not a scientifically established difference in personality. Differences between generations and individuals are large, and everyone is different."}, "tag": "k", "s": "俗説・出典未確認", "q": null}}}, {"id": "kanagawa", "ja": "神奈川県", "en": "Kanagawa", "ll": [35.444, 139.638], "cap": {"ja": "横浜市", "en": "Yokohama City"}, "intro": {"ja": "ハチマン「…海の匂いがする。」\nアマテ「ここは、開かれた港の街、横浜ですね。」", "en": "Hachiman: \"...I smell the sea.\"\nAmate: \"This is Yokohama, a port city that opened to the world.\""}, "topics": {"cap": {"title": {"ja": "県庁所在地：横浜市", "en": "Prefectural capital: Yokohama"}, "text": {"ja": "神奈川県の県庁所在地は、横浜市。県庁は、横浜の港に近い関内にある。", "en": "The capital of Kanagawa Prefecture is Yokohama. The prefectural office is in Kannai, near the harbour."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "神奈川県の県庁所在地は？", "en": "What is the capital of Kanagawa?"}, "c": [{"ja": "横浜市", "en": "Yokohama"}, {"ja": "鎌倉市", "en": "Kamakura"}, {"ja": "川崎市", "en": "Kawasaki"}], "a": 0}, "shrine": {"title": {"ja": "鶴岡八幡宮（鎌倉）", "en": "Tsurugaoka Hachimangu (Kamakura)"}, "text": {"ja": "鎌倉の鶴岡八幡宮は、1180年、源頼朝が鎌倉に拠点を置いたとき、建てたとされる。鎌倉幕府を開いた武士の信仰を、いまに伝える。", "en": "In 1180, when Minamoto no Yoritomo set up his base at Kamakura, he is recorded as building Tsurugaoka Hachimangu. It keeps alive the faith of the warriors who founded the Kamakura shogunate."}, "tag": "f", "s": "国土交通省「多言語解説文データベース」鶴岡八幡宮の解説", "q": {"ja": "鶴岡八幡宮を建てたとされる人物は？", "en": "Who is recorded as building Tsurugaoka Hachimangu in 1180?"}, "c": [{"ja": "源頼朝", "en": "Minamoto no Yoritomo"}, {"ja": "北条時宗", "en": "Hojo Tokimune"}, {"ja": "足利尊氏", "en": "Ashikaga Takauji"}], "a": 0}, "food": {"title": {"ja": "名物：崎陽軒のシウマイ", "en": "Specialty: Shumai (Kiyoken)"}, "text": {"ja": "横浜の名物として知られるのが、シウマイ。横浜駅の駅弁などで親しまれる。", "en": "Shumai is a well-known Yokohama specialty, familiar from station bento at Yokohama Station."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "横浜の名物として知られる点心は？", "en": "Which dim sum is known as a Yokohama specialty?"}, "c": [{"ja": "シウマイ", "en": "Shumai"}, {"ja": "小籠包", "en": "Xiao long bao"}, {"ja": "春巻", "en": "Spring rolls"}], "a": 0}, "gourmet": {"title": {"ja": "ご当地グルメ：横浜中華街", "en": "Local eats: Yokohama Chinatown"}, "text": {"ja": "横浜中華街は、港の開港のあとに生まれた華僑の街とされる。食べ歩きが楽しい。", "en": "Yokohama Chinatown grew from the Chinese community after the port opened. It is a joy to eat your way through."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "横浜中華街は、何の後に生まれた街とされる？", "en": "Yokohama Chinatown grew after what happened?"}, "c": [{"ja": "港の開港", "en": "The opening of the port"}, {"ja": "関東大震災の後だけ", "en": "Only after the 1923 earthquake"}, {"ja": "鉄道の開業の後だけ", "en": "Only after the railway opened"}], "a": 0}, "sake": {"title": {"ja": "お酒：天青と、県内最古の蔵", "en": "Sake: Tensei and the oldest brewery"}, "text": {"ja": "茅ヶ崎の熊澤酒造（1872年創業）は、湘南に残る唯一の蔵元で、銘柄は「天青」。相模原の清水酒造（1751年創業）は、県内最古。海老名の泉橋酒造は、米作りから醸造まで一貫して行い、純米酒だけを造る。伊勢原の吉川醸造は、大山の伏流水を使い、全体に辛口で芳醇。※お酒は20歳になってから。", "en": "Kumazawa Shuzo in Chigasaki (founded 1872), the only brewery left in Shonan, makes 'Tensei'. Shimizu Shuzo in Sagamihara (1751) is the prefecture's oldest. Izumibashi in Ebina grows its own rice and makes only junmai. Yoshikawa Jozo in Isehara uses Oyama's underground water; its sake is generally dry yet full-bodied. *Drinking is for adults only."}, "tag": "f", "s": "神奈川県「神奈川の日本酒」蔵元一覧（県公式ページ）", "q": {"ja": "県内最古とされる蔵（1751年創業）は？", "en": "Which brewery (founded 1751) is the oldest in Kanagawa?"}, "c": [{"ja": "清水酒造", "en": "Shimizu Shuzo"}, {"ja": "熊澤酒造", "en": "Kumazawa Shuzo"}, {"ja": "泉橋酒造", "en": "Izumibashi Shuzo"}], "a": 0}, "history": {"title": {"ja": "歴史：ペリー来航と開港", "en": "History: Perry and the opening of ports"}, "text": {"ja": "1853年、ペリー率いる黒船が浦賀に来航した。翌1854年に日米和親条約が結ばれ、のちに横浜が開港して、日本は世界へ開かれていった。", "en": "In 1853 Perry's Black Ships arrived at Uraga. A treaty followed in 1854, and later Yokohama opened as a port as Japan opened to the world."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "ペリーの黒船が来航した港は？", "en": "At which port did Perry's Black Ships arrive in 1853?"}, "c": [{"ja": "浦賀", "en": "Uraga"}, {"ja": "神戸", "en": "Kobe"}, {"ja": "函館", "en": "Hakodate"}], "a": 0}, "kenmin": {"title": {"ja": "開港の街の気風", "en": "The spirit of a port town"}, "text": {"ja": "開港の街・横浜は、新しいものを取り入れる気風があると、よく言われる（俗説）。\n\n※県民性は、昔から語られてきた『よく言われること』で、科学的に確かめられた性格の違いではありません。世代や個人による差は大きく、人は一人ひとり違います。", "en": "Yokohama, a port town, is often said to have a spirit of welcoming new things (folk image).\n\n*'Prefectural character' is long-told folk imagery, not a scientifically established difference in personality. Differences between generations and individuals are large, and everyone is different."}, "tag": "k", "s": "俗説・出典未確認", "q": null}}}, {"id": "chiba", "ja": "千葉県", "en": "Chiba", "ll": [35.607, 140.106], "cap": {"ja": "千葉市", "en": "Chiba City"}, "intro": {"ja": "ミナカタ「船は気持ちええな！ 房総半島やで！」\nイナリ「落花生が、待っとるで！」", "en": "Minakata: \"Nothing beats a ferry ride! This is the Boso Peninsula!\"\nInari: \"And peanuts are waiting for us!\""}, "topics": {"cap": {"title": {"ja": "県庁所在地：千葉市", "en": "Prefectural capital: Chiba City"}, "text": {"ja": "千葉県の県庁所在地は、千葉市。東京湾に面した、大きな街。", "en": "The capital of Chiba is Chiba City, a large city on Tokyo Bay."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "千葉県の県庁所在地は？", "en": "What is the capital of Chiba?"}, "c": [{"ja": "千葉市", "en": "Chiba City"}, {"ja": "成田市", "en": "Narita"}, {"ja": "船橋市", "en": "Funabashi"}], "a": 0}, "shrine": {"title": {"ja": "成田山新勝寺", "en": "Naritasan Shinshoji"}, "text": {"ja": "成田山新勝寺は、940年に始まったとされる。平将門の乱を鎮めるため、寛朝大僧正が、不動明王を京都から成田に奉安したと伝わる。本尊は、弘法大師が彫り、開眼したとされる不動明王。", "en": "Naritasan Shinshoji is said to date from 940. To quell the rebellion of Taira no Masakado, the high priest Kancho is said to have brought the Fudo Myoo image from Kyoto to Narita. The main image is said to have been carved and consecrated by Kobo Daishi."}, "tag": "f", "s": "千葉県観光物産協会「まるちば」成田山新勝寺", "q": {"ja": "成田山新勝寺の本尊は？", "en": "What is the main deity of Naritasan Shinshoji?"}, "c": [{"ja": "不動明王", "en": "Fudo Myoo"}, {"ja": "阿弥陀如来", "en": "Amida Nyorai"}, {"ja": "観音菩薩", "en": "Kannon"}], "a": 0}, "food": {"title": {"ja": "名物：落花生", "en": "Specialty: Peanuts"}, "text": {"ja": "千葉県は、落花生の産地として知られる。ゆでたり、煎ったり、味わい方が多い。", "en": "Chiba is known for peanuts, enjoyed boiled, roasted and in many other ways."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "千葉県で有名な作物は？", "en": "Which crop is Chiba famous for?"}, "c": [{"ja": "落花生", "en": "Peanuts"}, {"ja": "みかん", "en": "Mandarins"}, {"ja": "りんご", "en": "Apples"}], "a": 0}, "gourmet": {"title": {"ja": "ご当地グルメ：房総の海の幸", "en": "Local eats: Boso seafood"}, "text": {"ja": "房総半島は、海の幸が豊か。「なめろう」は、魚をたたいて味噌などで和えた漁師の料理として知られる。", "en": "The Boso Peninsula is rich in seafood. 'Namero' is a fishermen's dish of minced fish mixed with miso and other seasonings."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "魚をたたいて味噌で和える、漁師の料理は？", "en": "Which fishermen's dish is minced fish mixed with miso?"}, "c": [{"ja": "なめろう", "en": "Namero"}, {"ja": "ぬた", "en": "Nuta"}, {"ja": "へしこ", "en": "Heshiko"}], "a": 0}, "sake": {"title": {"ja": "お酒：甲子と寿萬亀", "en": "Sake: Kinoene and Kotobuki-mangame"}, "text": {"ja": "酒々井町の飯沼本家は、江戸時代から続く醸造元で、銘柄は「甲子（きのえね）」。酒蔵見学は要予約。鴨川の亀田酒造は、明治神宮の新嘗祭へ毎年お酒を奉納している全国で唯一の蔵とされる（銘柄は「寿萬亀」）。千葉県酒造組合には、37社が加盟している。味わいの記述は未確認。※お酒は20歳になってから。", "en": "Iinuma Honke in Shisui has brewed since the Edo period; its brand is 'Kinoene'. Brewery tours need a booking. Kameda Shuzo in Kamogawa is said to be the only brewery that offers sake every year at Meiji Jingu's Niinamesai (brand: 'Kotobuki-mangame'). 37 companies belong to the Chiba brewers' association. Tasting notes unconfirmed. *Drinking is for adults only."}, "tag": "f", "s": "千葉県観光物産協会「まるちば」酒蔵紹介", "q": {"ja": "明治神宮に毎年お酒を奉納しているとされる、千葉の蔵は？", "en": "Which Chiba brewery offers sake yearly at Meiji Jingu?"}, "c": [{"ja": "亀田酒造", "en": "Kameda Shuzo"}, {"ja": "飯沼本家", "en": "Iinuma Honke"}, {"ja": "守屋酒造", "en": "Moriya Shuzo"}], "a": 0}, "history": {"title": {"ja": "歴史：伊能忠敬", "en": "History: Ino Tadataka"}, "text": {"ja": "伊能忠敬（1745〜1818）は、いまの千葉県の佐原などで商人として働いたのち、日本各地を歩いて測量し、日本地図づくりにとりくんだ人物。", "en": "Ino Tadataka (1745–1818) worked as a merchant in Sawara in today's Chiba, then walked across Japan surveying the land to make maps of the country."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "日本各地を歩いて測量した人物は？", "en": "Who walked across Japan surveying for a map?"}, "c": [{"ja": "伊能忠敬", "en": "Ino Tadataka"}, {"ja": "間宮林蔵", "en": "Mamiya Rinzo"}, {"ja": "坂本龍馬", "en": "Sakamoto Ryoma"}], "a": 0}, "kenmin": {"title": {"ja": "のんびり温暖な房総", "en": "Easygoing Boso"}, "text": {"ja": "温暖な気候の房総は、おおらかで、のんびりしていると、よく言われる（俗説）。\n\n※県民性は、昔から語られてきた『よく言われること』で、科学的に確かめられた性格の違いではありません。世代や個人による差は大きく、人は一人ひとり違います。", "en": "With its mild climate, Boso is often said to be relaxed and easygoing (folk image).\n\n*'Prefectural character' is long-told folk imagery, not a scientifically established difference in personality. Differences between generations and individuals are large, and everyone is different."}, "tag": "k", "s": "俗説・出典未確認", "q": null}}}, {"id": "ibaraki", "ja": "茨城県", "en": "Ibaraki", "ll": [36.366, 140.447], "cap": {"ja": "水戸市", "en": "Mito City"}, "intro": {"ja": "テンジン「水戸いうたら、あの御老公やな。」\nアマテ「納豆も、梅も、お酒も、楽しみです。」", "en": "Tenjin: \"Mito... home of the famous old lord, isn't it?\"\nAmate: \"Natto, plum blossoms and sake — I'm looking forward to all of them.\""}, "topics": {"cap": {"title": {"ja": "県庁所在地：水戸市", "en": "Prefectural capital: Mito City"}, "text": {"ja": "茨城県の県庁所在地は、水戸市。江戸時代には、水戸徳川家の城下町だった。", "en": "The capital of Ibaraki is Mito City, once the castle town of the Mito branch of the Tokugawa family."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "茨城県の県庁所在地は？", "en": "What is the capital of Ibaraki?"}, "c": [{"ja": "水戸市", "en": "Mito City"}, {"ja": "つくば市", "en": "Tsukuba"}, {"ja": "土浦市", "en": "Tsuchiura"}], "a": 0}, "shrine": {"title": {"ja": "鹿島神宮", "en": "Kashima Jingu"}, "text": {"ja": "鹿島神宮は、常陸国の一宮として知られる古い神社。境内の「要石」は、地震を抑える石だと語り継がれてきた（伝承）。", "en": "Kashima Jingu is an ancient shrine known as the Ichinomiya of Hitachi Province. The 'Kaname-ishi' stone in its grounds is traditionally said to hold down earthquakes (folklore)."}, "tag": "l", "s": "伝承（要石）。一宮であることは出典未確認", "q": {"ja": "鹿島神宮の「要石」は、何を抑えると伝わる？", "en": "What does Kashima's 'Kaname-ishi' stone traditionally hold down?"}, "c": [{"ja": "地震", "en": "Earthquakes"}, {"ja": "洪水", "en": "Floods"}, {"ja": "火事", "en": "Fires"}], "a": 0}, "food": {"title": {"ja": "名物：水戸納豆", "en": "Specialty: Mito natto"}, "text": {"ja": "水戸は、納豆の名産地として知られる。小粒の納豆が多いといわれる。", "en": "Mito is a famous natto town, often associated with small-bean natto."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "水戸の名産として知られる発酵食品は？", "en": "Which fermented food is Mito famous for?"}, "c": [{"ja": "納豆", "en": "Natto"}, {"ja": "味噌煮", "en": "Miso stew"}, {"ja": "くさや", "en": "Kusaya"}], "a": 0}, "gourmet": {"title": {"ja": "ご当地グルメ：あんこう鍋", "en": "Local eats: Monkfish hotpot"}, "text": {"ja": "冬の茨城の味として知られるのが、あんこう鍋。大洗や北茨城の港町で親しまれる。", "en": "Monkfish hotpot is a winter taste of Ibaraki, enjoyed in port towns such as Oarai and Kitaibaraki."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "茨城の冬の味、あんこう鍋の「あんこう」は？", "en": "What is 'ankou' in Ibaraki's winter hotpot?"}, "c": [{"ja": "深海の魚", "en": "A deep-sea fish"}, {"ja": "小豆のあん", "en": "Sweet bean paste"}, {"ja": "きのこ", "en": "A mushroom"}], "a": 0}, "sake": {"title": {"ja": "お酒：一品と副将軍（水戸）", "en": "Sake: Ippin and Fukushogun (Mito)"}, "text": {"ja": "茨城県酒造組合には、35の蔵が加盟している。水戸の吉久保酒造「一品」は、水戸黄門ゆかりの水を使った「旨辛口」。同じ水戸の明利酒類には、「副将軍」がある。つくばの浦里酒造店「霧筑波」は、小川酵母を使った淡麗な味わいとされる。※お酒は20歳になってから。", "en": "35 breweries belong to the Ibaraki brewers' association. Yoshikubo Shuzo's 'Ippin' in Mito is 'umakarakuchi' (dry but flavourful), using water tied to Mito Komon. Meiri Shurui, also in Mito, makes 'Fukushogun'. 'Kiritsukuba' from Urasato Shuzo in Tsukuba is described as light and clean, brewed with Ogawa yeast. *Drinking is for adults only."}, "tag": "f", "s": "茨城県「いばらきの地酒特集2025」（県公式ページ）", "q": {"ja": "水戸黄門ゆかりの水を使う「旨辛口」の酒は？", "en": "Which sake is 'umakarakuchi' using water tied to Mito Komon?"}, "c": [{"ja": "一品", "en": "Ippin"}, {"ja": "霧筑波", "en": "Kiritsukuba"}, {"ja": "天青", "en": "Tensei"}], "a": 0}, "history": {"title": {"ja": "歴史：水戸藩と徳川光圀", "en": "History: Mito domain and Tokugawa Mitsukuni"}, "text": {"ja": "徳川光圀は、水戸藩の2代藩主で、のちに「水戸黄門」として物語に親しまれた。偕楽園は、水戸藩の9代藩主・徳川斉昭が、1842年に開いた庭園として知られる。", "en": "Tokugawa Mitsukuni was the 2nd lord of Mito, later beloved as 'Mito Komon' in stories. Kairakuen garden is known as opened in 1842 by the 9th lord, Tokugawa Nariaki."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "偕楽園を開いた水戸藩9代藩主は？", "en": "Which 9th lord of Mito opened Kairakuen?"}, "c": [{"ja": "徳川斉昭", "en": "Tokugawa Nariaki"}, {"ja": "徳川光圀", "en": "Tokugawa Mitsukuni"}, {"ja": "徳川慶喜", "en": "Tokugawa Yoshinobu"}], "a": 0}, "kenmin": {"title": {"ja": "水戸っぽ", "en": "Mitoppo"}, "text": {"ja": "水戸の人は、「水戸っぽ」と呼ばれ、正義感が強く、一本気で、議論を好むと言われてきた（俗説。水戸藩の学問の伝統と結びつけて語られることが多い）。\n\n※県民性は、昔から語られてきた『よく言われること』で、科学的に確かめられた性格の違いではありません。世代や個人による差は大きく、人は一人ひとり違います。", "en": "People of Mito have been called 'Mitoppo' — said to have a strong sense of justice, a single-minded streak and a love of debate (folk image, often linked to Mito's scholarly tradition).\n\n*'Prefectural character' is long-told folk imagery, not a scientifically established difference in personality. Differences between generations and individuals are large, and everyone is different."}, "tag": "k", "s": "俗説・出典未確認", "q": null}}}, {"id": "tochigi", "ja": "栃木県", "en": "Tochigi", "ll": [36.566, 139.884], "cap": {"ja": "宇都宮市", "en": "Utsunomiya City"}, "intro": {"ja": "ハチマン「…山の気配がする。」\nミナカタ「宇都宮いうたら、餃子やろ！」", "en": "Hachiman: \"...I can feel the mountains.\"\nMinakata: \"Utsunomiya means gyoza, right?!\""}, "topics": {"cap": {"title": {"ja": "県庁所在地：宇都宮市", "en": "Prefectural capital: Utsunomiya City"}, "text": {"ja": "栃木県の県庁所在地は、宇都宮市。県名の「栃木」は、栃木市の名にちなむが、県庁は、宇都宮市にある。", "en": "The capital of Tochigi is Utsunomiya City — not Tochigi City, even though the prefecture is named after it."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "栃木県の県庁所在地は？", "en": "What is the capital of Tochigi?"}, "c": [{"ja": "宇都宮市", "en": "Utsunomiya"}, {"ja": "栃木市", "en": "Tochigi City"}, {"ja": "日光市", "en": "Nikko"}], "a": 0}, "shrine": {"title": {"ja": "日光東照宮", "en": "Nikko Toshogu"}, "text": {"ja": "日光東照宮は、1617年（元和3年）、二代将軍秀忠が、家康の遺言に基づいて東照社を建てたのがはじまり。日光山輪王寺、日光東照宮、日光二荒山神社の「二社一寺」は、1999年に世界遺産に登録された。", "en": "Nikko Toshogu began in 1617, when the second shogun Hidetada built Toshosha following Ieyasu's will. The 'two shrines and one temple' — Rinnoji, Toshogu and Futarasan Shrine — became a World Heritage Site in 1999."}, "tag": "f", "s": "日光市「未来へ届けたい日光」資料", "q": {"ja": "日光の二社一寺が世界遺産になった年は？", "en": "In what year did Nikko's shrines and temple become a World Heritage Site?"}, "c": [{"ja": "1999年", "en": "1999"}, {"ja": "1964年", "en": "1964"}, {"ja": "2014年", "en": "2014"}], "a": 0}, "food": {"title": {"ja": "名物：宇都宮餃子", "en": "Specialty: Utsunomiya gyoza"}, "text": {"ja": "宇都宮は、餃子の街として知られる。焼き餃子や水餃子など、食べ方もいろいろ。", "en": "Utsunomiya is known as a gyoza town, with pan-fried, boiled and many other styles."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "宇都宮が名物にしている料理は？", "en": "Which dish is Utsunomiya known for?"}, "c": [{"ja": "餃子", "en": "Gyoza"}, {"ja": "たこ焼き", "en": "Takoyaki"}, {"ja": "ラーメンだけ", "en": "Only ramen"}], "a": 0}, "gourmet": {"title": {"ja": "ご当地グルメ：日光ゆば", "en": "Local eats: Nikko yuba"}, "text": {"ja": "日光は、湯葉の産地としても知られる。精進料理の流れをくむとされる。（日光市の資料には、記述が見つからなかった：未確認）", "en": "Nikko is also known for yuba (tofu skin), said to descend from temple cuisine. (We could not find it in Nikko City's material: unconfirmed.)"}, "tag": "x", "s": "出典未確認（日光市資料には記述なし）", "q": {"ja": "日光の名物とされる、豆乳の膜から作る食材は？", "en": "Which Nikko food is made from the skin of soy milk?"}, "c": [{"ja": "湯葉", "en": "Yuba"}, {"ja": "寒天", "en": "Kanten"}, {"ja": "こんにゃく", "en": "Konnyaku"}], "a": 0}, "sake": {"title": {"ja": "お酒：栃木の酒づくり", "en": "Sake: brewing in Tochigi"}, "text": {"ja": "栃木県の資料は、栃木の酒づくりを、江戸時代に関西から持ち込まれた技が、酒造組合や杜氏組合を中心に独自に発展したものと説明する。新しい技術を受け入れてきた歴史がある、ともいう。個別の銘柄と味わいは、確認できなかった（未確認）。※お酒は20歳になってから。", "en": "A Tochigi prefectural document explains that brewing came from the Kansai region in the Edo period and developed in its own way around brewers' and master-brewers' guilds, with a history of welcoming new techniques. Individual brands and tasting notes were not confirmed. *Drinking is for adults only."}, "tag": "f", "s": "栃木県「酒蔵飲み比べ」案内資料（県公式PDF）。銘柄は未確認", "q": {"ja": "栃木の酒づくりの技は、江戸時代にどこから持ち込まれたと説明される？", "en": "Where did Tochigi's brewing techniques come from in the Edo period?"}, "c": [{"ja": "関西", "en": "Kansai"}, {"ja": "北海道", "en": "Hokkaido"}, {"ja": "九州", "en": "Kyushu"}], "a": 0}, "history": {"title": {"ja": "歴史：家康と日光", "en": "History: Ieyasu and Nikko"}, "text": {"ja": "徳川家康の遺言に基づき、1617年に、日光に東照社が建てられた。日光は、徳川家の聖地となった。", "en": "Following Tokugawa Ieyasu's will, Toshosha was built at Nikko in 1617, and Nikko became a sacred place of the Tokugawa."}, "tag": "f", "s": "日光市「未来へ届けたい日光」資料", "q": {"ja": "日光に東照社を建てたのは、誰の遺言に基づく？", "en": "Whose will led to the building of Toshosha at Nikko?"}, "c": [{"ja": "徳川家康", "en": "Tokugawa Ieyasu"}, {"ja": "豊臣秀吉", "en": "Toyotomi Hideyoshi"}, {"ja": "武田信玄", "en": "Takeda Shingen"}], "a": 0}, "kenmin": {"title": {"ja": "おだやかな北関東", "en": "Mellow northern Kanto"}, "text": {"ja": "栃木の人は、おだやかで、まじめだと、よく言われる（俗説）。夏の雷の多さも、土地の個性として知られる。\n\n※県民性は、昔から語られてきた『よく言われること』で、科学的に確かめられた性格の違いではありません。世代や個人による差は大きく、人は一人ひとり違います。", "en": "People of Tochigi are often said to be mild-mannered and earnest (folk image). Frequent summer thunderstorms are another local trademark.\n\n*'Prefectural character' is long-told folk imagery, not a scientifically established difference in personality. Differences between generations and individuals are large, and everyone is different."}, "tag": "k", "s": "俗説・出典未確認", "q": null}}}, {"id": "gunma", "ja": "群馬県", "en": "Gunma", "ll": [36.391, 139.061], "cap": {"ja": "前橋市", "en": "Maebashi City"}, "intro": {"ja": "イナリ「山、山、山や！ 空っ風が吹いとるで！」\nテンジン「ここは、群馬。温泉と、絹の国やな。」", "en": "Inari: \"Mountains everywhere! The dry wind is blowing!\"\nTenjin: \"Gunma — a land of hot springs and silk.\""}, "topics": {"cap": {"title": {"ja": "県庁所在地：前橋市", "en": "Prefectural capital: Maebashi City"}, "text": {"ja": "群馬県の県庁所在地は、前橋市。高崎市と並ぶ、県の中心の街。", "en": "The capital of Gunma is Maebashi City, a central city alongside Takasaki."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "群馬県の県庁所在地は？", "en": "What is the capital of Gunma?"}, "c": [{"ja": "前橋市", "en": "Maebashi"}, {"ja": "高崎市", "en": "Takasaki"}, {"ja": "太田市", "en": "Ota"}], "a": 0}, "shrine": {"title": {"ja": "榛名神社と高崎の達磨寺", "en": "Haruna Shrine and Takasaki's Daruma temple"}, "text": {"ja": "榛名山の麓の榛名神社は、山の神を祀る古い神社。高崎の少林山達磨寺は、縁起物の「高崎だるま」で知られる。（寺社の由緒は、公式資料の確認ができていない：未確認）", "en": "Haruna Shrine at the foot of Mt. Haruna is an old mountain shrine. Shorinzan Daruma-ji in Takasaki is known for the lucky 'Takasaki daruma' dolls. (Their histories were not checked against official sources: unconfirmed.)"}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "高崎の達磨寺で知られる縁起物は？", "en": "Which lucky charm is Takasaki's Daruma temple known for?"}, "c": [{"ja": "高崎だるま", "en": "Takasaki daruma"}, {"ja": "こけし", "en": "Kokeshi"}, {"ja": "招き猫", "en": "Maneki-neko"}], "a": 0}, "food": {"title": {"ja": "名物：焼きまんじゅう", "en": "Specialty: Yaki-manju"}, "text": {"ja": "焼きまんじゅうは、串に刺したまんじゅうを、味噌だれで焼いた、群馬の味。", "en": "Yaki-manju is a Gunma treat: skewered steamed buns grilled with a sweet miso glaze."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "焼きまんじゅうに塗る、たれは？", "en": "What sauce is brushed on yaki-manju?"}, "c": [{"ja": "味噌だれ", "en": "Miso glaze"}, {"ja": "ソース", "en": "Worcestershire sauce"}, {"ja": "カレー", "en": "Curry"}], "a": 0}, "gourmet": {"title": {"ja": "ご当地グルメ：うどん", "en": "Local eats: udon"}, "text": {"ja": "群馬は、うどんの盛んな土地として知られる。桐生のひもかわや、渋川の水沢うどんなどが知られる。", "en": "Gunma is a land of udon, known for Kiryu's ribbon-wide 'himokawa' and Shibukawa's Mizusawa udon."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "ひもかわうどんで知られる、群馬の街は？", "en": "Which Gunma town is known for himokawa udon?"}, "c": [{"ja": "桐生", "en": "Kiryu"}, {"ja": "草津", "en": "Kusatsu"}, {"ja": "館林", "en": "Tatebayashi"}], "a": 0}, "sake": {"title": {"ja": "お酒：群馬泉と桂川", "en": "Sake: Gunma Izumi and Katsuragawa"}, "text": {"ja": "群馬県の品評会では、太田市の島岡酒造「群馬泉」、前橋市の栁澤酒造「桂川」、町田酒造店「清嘹」、高崎市の牧野酒造「榛名山」などが優等賞を受けた（第50回）。特徴の記述は、確認できなかった（未確認）。※お酒は20歳になってから。", "en": "At the prefectural sake competition (50th), 'Gunma Izumi' (Shimaoka Shuzo, Ota), 'Katsuragawa' (Yanagisawa Shuzo, Maebashi), 'Seiryo' (Machida Shuzo) and 'Harunasan' (Makino Shuzo, Takasaki) won top prizes. Tasting notes were not confirmed. *Drinking is for adults only."}, "tag": "f", "s": "群馬県「群馬の日本酒」品評会結果ページ（県公式）", "q": {"ja": "太田市の島岡酒造の銘柄は？", "en": "Which brand does Shimaoka Shuzo in Ota make?"}, "c": [{"ja": "群馬泉", "en": "Gunma Izumi"}, {"ja": "桂川", "en": "Katsuragawa"}, {"ja": "榛名山", "en": "Harunasan"}], "a": 0}, "history": {"title": {"ja": "歴史：富岡製糸場", "en": "History: Tomioka Silk Mill"}, "text": {"ja": "1872年に開かれた富岡製糸場は、日本の近代化を支えた製糸工場。2014年に世界遺産に登録された（登録年は出典未確認）。", "en": "The Tomioka Silk Mill, opened in 1872, helped drive Japan's modernization. It became a World Heritage Site in 2014 (date unconfirmed)."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "富岡製糸場が開かれた年は？", "en": "In what year did the Tomioka Silk Mill open?"}, "c": [{"ja": "1872年", "en": "1872"}, {"ja": "1603年", "en": "1603"}, {"ja": "1945年", "en": "1945"}], "a": 0}, "kenmin": {"title": {"ja": "かかあ天下と空っ風", "en": "Kakaa-denka and the dry wind"}, "text": {"ja": "「かかあ天下」は、「一家で妻が夫より強い」という意味。群馬では、明治から養蚕・製糸・織物など絹産業の中心を女性が担い、女性が働き者で、男性も家事に加わるのが当たり前だったため、そう呼ばれて名物になったと考えられている（諸説あり）。平成27年、文化庁の日本遺産に「かかあ天下―ぐんまの絹物語―」が選ばれた。いまは、働き者の妻をたたえる言葉として受けとめることもできる。\n\n※県民性は、昔から語られてきた『よく言われること』で、科学的に確かめられた性格の違いではありません。世代や個人による差は大きく、人は一人ひとり違います。", "en": "'Kakaa-denka' means a household where the wife is the stronger one. In Gunma, women were central to the silk trades from the Meiji era, working hard while men also shared housework — which is thought to be why Gunma became known for it (several views exist). In 2015 'Kakaa-denka: Gunma's Silk Story' was designated a Japan Heritage story. Today it can be read as praise for hard-working wives.\n\n*'Prefectural character' is long-told folk imagery, not a scientifically established difference in personality. Differences between generations and individuals are large, and everyone is different."}, "tag": "f", "s": "群馬県公式ページ「かかあ天下」", "q": null}}}, {"id": "saitama", "ja": "埼玉県", "en": "Saitama", "ll": [35.861, 139.646], "cap": {"ja": "さいたま市", "en": "Saitama City"}, "intro": {"ja": "アマテ「関東の旅も、ここで一区切りですね。」\nイナリ「大宮から、新幹線で北へ向かえるんやな。」", "en": "Amate: \"Our Kanto tour comes to a close here.\"\nInari: \"And from Omiya, the Shinkansen heads north!\""}, "topics": {"cap": {"title": {"ja": "県庁所在地：さいたま市", "en": "Prefectural capital: Saitama City"}, "text": {"ja": "埼玉県の県庁所在地は、さいたま市。浦和・大宮などの街からなる。", "en": "The capital of Saitama is Saitama City, made up of areas such as Urawa and Omiya."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "埼玉県の県庁所在地は？", "en": "What is the capital of Saitama?"}, "c": [{"ja": "さいたま市", "en": "Saitama City"}, {"ja": "川越市", "en": "Kawagoe"}, {"ja": "熊谷市", "en": "Kumagaya"}], "a": 0}, "shrine": {"title": {"ja": "大宮氷川神社", "en": "Omiya Hikawa Shrine"}, "text": {"ja": "大宮氷川神社の参道は、南北約2kmにわたる、ケヤキを中心とした並木道。神社は、約1200年前の聖武天皇の御代に武蔵国一宮と定められたとされる。", "en": "The approach to Omiya Hikawa Shrine is a tree-lined road about 2 km long, mainly zelkova. The shrine is said to have been designated the Ichinomiya of Musashi Province in the reign of Emperor Shomu, about 1,200 years ago."}, "tag": "f", "s": "さいたま市「氷川参道のまちづくり」資料", "q": {"ja": "氷川参道の長さは、約どれくらい？", "en": "About how long is the Hikawa approach?"}, "c": [{"ja": "約2km", "en": "About 2 km"}, {"ja": "約200m", "en": "About 200 m"}, {"ja": "約20km", "en": "About 20 km"}], "a": 0}, "food": {"title": {"ja": "名物：草加せんべい", "en": "Specialty: Soka senbei"}, "text": {"ja": "草加せんべいは、埼玉の草加の名物として知られる、堅焼きの米菓。", "en": "Soka senbei is a firm-baked rice cracker known as a specialty of Soka, Saitama."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "草加せんべいは、何から作る？", "en": "What is Soka senbei made from?"}, "c": [{"ja": "お米", "en": "Rice"}, {"ja": "小麦", "en": "Wheat only"}, {"ja": "じゃがいも", "en": "Potatoes"}], "a": 0}, "gourmet": {"title": {"ja": "ご当地グルメ：川越のさつまいも", "en": "Local eats: Kawagoe sweet potatoes"}, "text": {"ja": "小江戸・川越は、サツマイモが名産。クラフトビール「COEDO」の「紅赤」にも、川越のサツマイモが使われる。", "en": "Kawagoe, 'Little Edo', is famed for sweet potatoes. The craft beer 'COEDO' even makes a 'Beniaka' brew with Kawagoe's sweet potatoes."}, "tag": "f", "s": "るるぶ&more「GOOD LIFEフェア2025」の記事（COEDO「紅赤」）", "q": {"ja": "COEDOビールの「紅赤」に使われるのは？", "en": "What goes into COEDO's 'Beniaka'?"}, "c": [{"ja": "サツマイモ", "en": "Sweet potatoes"}, {"ja": "かぼちゃ", "en": "Pumpkin"}, {"ja": "とうもろこし", "en": "Corn"}], "a": 0}, "sake": {"title": {"ja": "お酒：帝松と長瀞の蔵", "en": "Sake: Teimatsu and the Nagatoro brewery"}, "text": {"ja": "埼玉は、日本酒の出荷量が全国4位の酒処とされる。小川町の松岡醸造「帝松」は、1851年創業。全国新酒鑑評会で8年連続金賞。秩父の山々の雨水から生まれた硬水を仕込みに使う。長瀞の藤﨑摠兵衛商店は、1728年創業。酒米は埼玉県産のみ。※お酒は20歳になってから。", "en": "Saitama is described as ranking 4th in Japan for sake shipments. Matsuoka Jozo's 'Teimatsu' (Ogawa, founded 1851) won gold at the national new-sake appraisal 8 years running, brewed with hard water from rain on the Chichibu mountains. Fujisaki Sobei Shoten in Nagatoro (1728) uses only Saitama rice. *Drinking is for adults only."}, "tag": "f", "s": "るるぶ&more「埼玉県はお酒県だった⁉」記事（GOOD LIFEフェア2025）", "q": {"ja": "松岡醸造（小川町）の銘柄は？", "en": "Which brand does Matsuoka Jozo (Ogawa) make?"}, "c": [{"ja": "帝松", "en": "Teimatsu"}, {"ja": "一品", "en": "Ippin"}, {"ja": "甲子", "en": "Kinoene"}], "a": 0}, "history": {"title": {"ja": "歴史：武蔵国", "en": "History: Musashi Province"}, "text": {"ja": "いまの埼玉県の大部分は、昔の「武蔵国」にあたる。氷川神社が武蔵国一宮とされることが、土地の歴史の古さを物語る。", "en": "Most of today's Saitama was once 'Musashi Province'. Hikawa Shrine being its Ichinomiya hints at the area's long history."}, "tag": "x", "s": "出典未確認（一般に知られる事柄）", "q": {"ja": "昔の埼玉の大部分は、何という国だった？", "en": "What province covered most of today's Saitama?"}, "c": [{"ja": "武蔵国", "en": "Musashi"}, {"ja": "常陸国", "en": "Hitachi"}, {"ja": "下野国", "en": "Shimotsuke"}], "a": 0}, "kenmin": {"title": {"ja": "地域ごとに、ちがう顔", "en": "Many faces, many areas"}, "text": {"ja": "埼玉は、東京に近い南部と、山あいの秩父など、地域ごとに雰囲気が違うと、よく言われる（俗説）。\n\n※県民性は、昔から語られてきた『よく言われること』で、科学的に確かめられた性格の違いではありません。世代や個人による差は大きく、人は一人ひとり違います。", "en": "Saitama is often said to feel different from area to area, from the Tokyo-side south to mountain Chichibu (folk image).\n\n*'Prefectural character' is long-told folk imagery, not a scientifically established difference in personality. Differences between generations and individuals are large, and everyone is different."}, "tag": "k", "s": "俗説・出典未確認", "q": null}}}], "L": {"tokyo>kanagawa": [{"mode": "rail", "name": {"ja": "JR東海道線で、東京駅から横浜駅へ", "en": "JR Tokaido Line: Tokyo → Yokohama"}, "text": {"ja": "東京駅から横浜駅へ。海ぞいの街へ、鉄道でするりと着く。ダイヤは、時期や列車で変わる。", "en": "From Tokyo Station to Yokohama Station by rail. Timetables vary by season and train."}, "tag": "x", "s": "路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}, {"mode": "shinkansen", "name": {"ja": "東海道新幹線で、新横浜へ", "en": "Tokaido Shinkansen: Tokyo → Shin-Yokohama"}, "text": {"ja": "東京駅から新横浜駅へ。新幹線の駅は、横浜駅とは別の場所にある。", "en": "From Tokyo to Shin-Yokohama. The Shinkansen station is separate from Yokohama Station."}, "tag": "x", "s": "路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}], "kanagawa>chiba": [{"mode": "ship", "name": {"ja": "東京湾フェリーで、久里浜から金谷へ", "en": "Tokyo Bay Ferry: Kurihama → Kanaya"}, "text": {"ja": "神奈川の久里浜港から、千葉の金谷港へ。片道約40分で、東京湾を渡る。運航は、東京湾フェリー株式会社。", "en": "From Kurihama in Kanagawa to Kanaya in Chiba — about 40 minutes across Tokyo Bay, operated by Tokyo Bay Ferry Co., Ltd."}, "tag": "f", "s": "千葉県観光物産協会「まるちば」東京湾フェリー（片道約40分）"}, {"mode": "rail", "name": {"ja": "JRを乗りついで、横浜から千葉へ", "en": "By JR trains, Yokohama → Chiba"}, "text": {"ja": "横浜から、JRを乗りついで、東京湾の北まわりで千葉へ。海を渡らず、ぐるっとまわる道。", "en": "From Yokohama by JR around the north of Tokyo Bay — the long way round without crossing the water."}, "tag": function spr(name,scale){const key="i"+name+scale;if(ART.cache[key])return ART.cache[key];
 const rows=SPR[name],c=mkc(12,12),g=c.getContext("2d");
 rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==="~"){g.fillStyle="#58a0f8"}else{const col=PAL[ch];if(!col)return;g.fillStyle=col}g.fillRect(x,y,1,1)}));
 ART.cache[key]=c.toDataURL();return ART.cache[key]}
function sIcon(name,px){return '<img class="ico" alt="" width="'+px+'" height="'+px+'" src="'+spr(name)+'">'}
function sScene(id){return '<img class="scene" alt="" src="'+scene(id)+'">'}
/* 音：Web Audio で合成（外部ファイルなし）。BGMは県ごとの原曲（スケール・テンポ・音色・乱数の種が県ごとに違う） */
const AU={ctx:null,bgm:true,se:true,timer:null,track:null,step:0,next:0,master:null};
function auInit(){if(AU.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.5;AU.master.connect(AU.ctx.destination)}catch(e){AU.ctx=null}}
function auResume(){auInit();if(AU.ctx&&AU.ctx.state==="suspended")AU.ctx.resume()}
function tone(f,t,d,type,vol,dest){const c=AU.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest||AU.master);o.start(t);o.stop(t+d+.02)}
const HP={inari:520,hachiman:300,tenjin:420,amate:640,minakata:260};
function seBlip(who){if(!AU.se||!AU.ctx)return;const f=(HP[who]||440)*(1+Math.random()*.12);tone(f,AU.ctx.currentTime,.05,"square",.09)}
function seOk(){if(!AU.se||!AU.ctx)return;const t=AU.ctx.currentTime;[660,880,1320].forEach((f,i)=>tone(f,t+i*.07,.12,"square",.1))}
function seNg(){if(!AU.se||!AU.ctx)return;const t=AU.ctx.currentTime;[330,247].forEach((f,i)=>tone(f,t+i*.1,.16,"sawtooth",.08))}
function seTap(){if(!AU.se||!AU.ctx)return;tone(740,AU.ctx.currentTime,.05,"square",.07)}
function seGo(){if(!AU.se||!AU.ctx)return;const t=AU.ctx.currentTime;[392,523,659,784].forEach((f,i)=>tone(f,t+i*.08,.14,"triangle",.12))}
/* 県ごとの曲の設定 */
const SC={maj:[0,2,4,5,7,9,11],pent:[0,2,4,7,9],minp:[0,3,5,7,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10],lyd:[0,2,4,6,7,9,11],yo:[0,2,5,7,9],min:[0,2,3,5,7,8,10]};
const TRACKS={
 title:{root:57,sc:"maj",bpm:104,lead:"square",bass:"triangle",prog:[0,4,5,3],seed:11,dens:.7},
 tokyo:{root:60,sc:"pent",bpm:132,lead:"square",bass:"triangle",prog:[0,5,3,4],seed:21,dens:.85},
 kanagawa:{root:55,sc:"mix",bpm:112,lead:"triangle",bass:"sine",prog:[0,3,4,0],seed:33,dens:.6},
 chiba:{root:62,sc:"lyd",bpm:96,lead:"triangle",bass:"sine",prog:[0,1,4,0],seed:47,dens:.55},
 ibaraki:{root:57,sc:"yo",bpm:88,lead:"square",bass:"triangle",prog:[0,3,0,4],seed:59,dens:.5},
 tochigi:{root:50,sc:"dor",bpm:100,lead:"sawtooth",bass:"triangle",prog:[0,3,6,4],seed:71,dens:.6},
 gunma:{root:52,sc:"minp",bpm:124,lead:"square",bass:"triangle",prog:[0,5,3,4],seed:83,dens:.8},
 saitama:{root:59,sc:"maj",bpm:118,lead:"square",bass:"sine",prog:[0,4,5,3],seed:97,dens:.75}};
function degNote(tr,deg,oct){const s=SC[tr.sc];const n=s.length;const o=Math.floor(deg/n);return tr.root+s[((deg%n)+n)%n]+12*(o+(oct||0))}
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function buildPattern(tr){const r=rnd(tr.seed);const bars=[];
 for(let b=0;b<8;b++){const chord=tr.prog[b%4];const notes=[];let d=chord+Math.floor(r()*3)+2;
  for(let s=0;s<8;s++){if(r()<tr.dens||s===0){d+=Math.floor(r()*5)-2;if(d<chord)d=chord+2;if(d>chord+9)d=chord+5;notes.push(d)}else notes.push(null)}
  bars.push({chord,notes})}
 /* 後半は前半を少し変奏 */
 for(let b=4;b<8;b++)bars[b].notes=bars[b-4].notes.map((n,i)=>(n!==null&&i===7)?n+1:n);
 return bars}
function bgmStop(){if(AU.timer){clearInterval(AU.timer);AU.timer=null}AU.track=null}
function bgmPlay(name){if(!AU.bgm||!AU.ctx){AU.want=name;return}if(AU.track===name&&AU.timer)return;bgmStop();const tr=TRACKS[name]||TRACKS.title;AU.track=name;AU.pat=buildPattern(tr);AU.tr=tr;AU.step=0;AU.next=AU.ctx.currentTime+.1;
 AU.timer=setInterval(bgmTick,80)}
function bgmTick(){const c=AU.ctx;if(!c||!AU.tr)return;const tr=AU.tr,eighth=60/tr.bpm/2;
 while(AU.next<c.currentTime+.3){const s=AU.step%64,bar=Math.floor(s/8),i=s%8,b=AU.pat[bar];
  const n=b.notes[i];if(n!==null)tone(mtof(degNote(tr,n,1)),AU.next,eighth*1.6,tr.lead,.05);
  if(i===0||i===4){tone(mtof(degNote(tr,b.chord,-1)),AU.next,eighth*3.2,tr.bass,.09)}
  if(i===2||i===6){tone(mtof(degNote(tr,b.chord+2,0)),AU.next,eighth*1.2,"triangle",.025)}
  AU.next+=eighth;AU.step++}}
function auSet(k,v){AU[k]=v;if(k==="bgm"){if(!v)bgmStop();else if(AU.want)bgmPlay(AU.want)}}
const D=window.__D;const KEY="nippon-tour-v1";
let S={lang:(navigator.language||"ja").slice(0,2)==="en"?"en":"ja",step:"title",i:0,read:{},stars:{},stamps:{},q:null,qi:0,right:0,sure:false,has:false,bgm:true,se:true};
try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o){S.lang=o.lang||S.lang;S.i=o.i||0;S.read=o.read||{};S.stars=o.stars||{};S.stamps=o.stamps||{};S.has=!!o.has;if(o.bgm===false)S.bgm=false;if(o.se===false)S.se=false}}catch(e){}
AU.bgm=S.bgm;AU.se=S.se;
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang:S.lang,i:S.i,read:S.read,stars:S.stars,stamps:S.stamps,has:true,bgm:S.bgm,se:S.se}))}catch(e){}}
const $=s=>document.querySelector(s);const app=$("#app");
const t=o=>o[S.lang]||o.ja;const u=k=>t(D.UI[k]);
const SIX=["cap","shrine","food","gourmet","sake","history"];
const KICON={cap:"cap",shrine:"shrine",food:"food",gourmet:"gourmet",sake:"sake",history:"history",kenmin:"kenmin"};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function himg(k){return '<img alt="" src="data:image/png;base64,'+D.H[k]+'">'}
function mk(h){app.innerHTML=h;twStart()}
/* 文字送り＋ピー音 */
let TW=null;
function twStart(){if(TW){clearInterval(TW.id);TW=null}const els=[...app.querySelectorAll(".tw")];if(!els.length)return;
 const full=els.map(e=>e.dataset.t);els.forEach(e=>e.textContent="");let ei=0,ci=0;const who=S.who||"inari";
 const done=()=>{if(TW){clearInterval(TW.id);TW=null}els.forEach((e,k)=>e.textContent=full[k])};
 TW={id:setInterval(()=>{if(ei>=els.length){done();return}ci++;const f=full[ei];els[ei].textContent=f.slice(0,ci);const ch=f[ci-1];if(ch&&!/\s|[、。，．,.…「」『』（）()]/.test(ch)&&ci%2===0)seBlip(who);if(ci>=f.length){ei++;ci=0}},34),done};
 app.querySelectorAll(".win").forEach(w=>w.addEventListener("pointerdown",()=>{if(TW)TW.done()},{once:false}))}
function tw(txt,cls){return '<div class="msg tw '+(cls||"")+'" data-t="'+esc(txt)+'"></div>'}
function langBtn(){return '<button class="btn" id="lg" style="width:auto;min-height:36px;padding:6px 12px">'+u("lang")+'</button>'}
function bindLang(){const b=$("#lg");if(b)b.onclick=()=>{S.lang=S.lang==="ja"?"en":"ja";save();render()}}
function sndBar(){return '<div class="snd"><button class="btn" id="sb">'+u("bgm")+' '+(S.bgm?u("on"):u("off"))+'</button><button class="btn" id="ss">'+u("se")+' '+(S.se?u("on"):u("off"))+'</button></div>'}
function bindSnd(){const a=$("#sb"),b=$("#ss");
 if(a)a.onclick=()=>{S.bgm=!S.bgm;auSet("bgm",S.bgm);save();if(S.bgm)bgmFor();render()};
 if(b)b.onclick=()=>{S.se=!S.se;AU.se=S.se;save();render()}}
function tagH(g){return '<span class="tag '+g+'">'+u("t"+g)+'</span>'}
function mapSvg(){const W=300,Hh=250,X=l=>(l-138.7)/(140.8-138.7)*(W-40)+20,Y=l=>(36.8-l)/(36.8-35.1)*(Hh-40)+20;
 let s='<svg id="map" viewBox="0 0 '+W+' '+Hh+'" aria-hidden="true">';
 const P=D.P;for(let k=1;k<=Math.min(S.i,P.length-1);k++){const a=P[k-1].ll,b=P[k].ll;s+='<line x1="'+X(a[1])+'" y1="'+Y(a[0])+'" x2="'+X(b[1])+'" y2="'+Y(b[0])+'" stroke="#f8d820" stroke-width="2" stroke-dasharray="5 3"/>'}
 P.forEach((p,k)=>{const x=X(p.ll[1]),y=Y(p.ll[0]);const cur=k===S.i,done=S.stars[p.id]>0;
  s+='<circle cx="'+x+'" cy="'+y+'" r="'+(cur?7:5)+'" fill="'+(done?"#98e0a8":cur?"#f83800":"#7a86ff")+'" stroke="#fff" stroke-width="2"/>';
  s+='<text x="'+x+'" y="'+(y+17)+'" font-size="13" fill="#fff" text-anchor="middle" stroke="#000" stroke-width="3" paint-order="stroke" font-family="DotGothic16,sans-serif">'+esc(t(p))+'</text>'});
 return s+'</svg>'}
function topbar(){const p=D.P[S.i];const n=Object.values(S.stars).reduce((a,b)=>a+b,0);return '<div id="top" class="win"><span><b>'+esc(t(p))+'</b> ('+(S.i+1)+'/'+D.P.length+')</span><span class="stars">★'+n+'/'+D.P.length*3+'</span></div>'}
function bgmFor(){const n=(S.step==="title"||S.step==="help"||S.step==="end"||S.step==="rec")?"title":D.P[S.i].id;bgmPlay(n)}
function render(){document.documentElement.lang=S.lang;({title:rTitle,hub:rHub,topic:rTopic,quiz:rQuiz,qres:rQres,route:rRoute,link:rLink,end:rEnd,rec:rRec,help:rHelp})[S.step]();bgmFor()}
function heroRow(){return '<div class="heroes">'+["inari","hachiman","tenjin","amate","minakata"].map(k=>'<figure>'+himg(k)+t(D.HN[k])+'</figure>').join("")+'</div>'}
function rTitle(){S.who="inari";mk('<div class="win"><h1>'+esc(u("title"))+'</h1><div class="sub">'+u("sub")+'</div>'+sScene("tokyo")+heroRow()+'</div>'+
 '<button class="btn gold" id="n">'+u("new")+'</button>'+(S.has?'<button class="btn" id="c">'+u("cont")+'</button>':'')+'<button class="btn" id="r">'+u("rec")+'</button><button class="btn" id="h">'+u("help")+'</button><div class="row">'+langBtn()+'</div>'+sndBar()+'<div class="small">'+u("note")+'</div>');
 bindLang();bindSnd();$("#n").onclick=()=>{auResume();seTap();S.i=0;S.read={};S.stars={};S.stamps={};save();S.step="hub";render()};
 if($("#c"))$("#c").onclick=()=>{auResume();seTap();S.step="hub";render()};$("#r").onclick=()=>{auResume();S.back="title";S.step="rec";render()};$("#h").onclick=()=>{auResume();S.step="help";render()}}
function rHelp(){mk('<div class="win msg">'+esc(u("helptxt"))+'</div><button class="btn" id="b">'+u("back")+'</button>');$("#b").onclick=()=>{S.step="title";render()}}
function rHub(){const p=D.P[S.i];const r=S.read[p.id]||{};const all=D.ORDER.every(k=>r[k]);S.who="inari";
 mk(topbar()+'<div class="win">'+sScene(p.id)+'<div style="margin-top:8px"></div>'+tw(t(p.intro))+'<div class="hint">'+u("skip")+'</div></div>'+mapSvg()+'<div class="small" style="padding:0 4px">'+u("hub")+'</div>'+
 D.ORDER.map(k=>'<button class="btn" data-k="'+k+'">'+sIcon(KICON[k],32)+'<span>'+u(k)+'<small>'+esc(t(p.topics[k].title))+'</small></span><span class="st">'+(r[k]?'✓':'')+'</span></button>').join("")+
 '<button class="btn gold" id="q"'+(all?'':' disabled')+'>'+(all?u("quiz"):u("quizlock"))+'</button><div class="row"><button class="btn" id="t">'+u("back")+'</button>'+langBtn()+'</div>'+sndBar());
 bindLang();bindSnd();app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{seTap();S.k=b.dataset.k;S.step="topic";render()});
 $("#q").onclick=()=>{if(!all)return;seGo();const ks=SIX.slice().sort(()=>Math.random()-.5).slice(0,3);S.q=ks;S.qi=0;S.right=0;S.step="quiz";render()};
 $("#t").onclick=()=>{S.step="title";render()}}
function rTopic(){const p=D.P[S.i],k=S.k,c=p.topics[k];(S.read[p.id]=S.read[p.id]||{})[k]=1;save();const sp=D.SPEAK[k];S.who=sp;
 mk(topbar()+'<div class="win"><div class="who">'+himg(sp)+'<div><div class="nm">'+t(D.HN[sp])+'</div><div class="small">'+u(k)+'</div></div><div style="margin-left:auto">'+sIcon(KICON[k],56)+'</div></div><div style="color:var(--gold);margin:8px 0">'+esc(t(c.title))+'</div>'+tw(t(c.text))+'<div class="hint">'+u("skip")+'</div><div class="src">'+tagH(c.tag)+u("src")+': '+esc(c.s)+'</div></div><button class="btn gold" id="b">'+u("back")+'</button>');
 $("#b").onclick=()=>{seTap();S.step="hub";render()}}
function rQuiz(){const p=D.P[S.i],k=S.q[S.qi],c=p.topics[k];S.who="tenjin";
 mk(topbar()+'<div class="win"><div class="who">'+himg("tenjin")+'<div class="small">Q'+(S.qi+1)+'/3 ・ '+u(k)+'</div><div style="margin-left:auto">'+sIcon(KICON[k],40)+'</div></div>'+tw(t(c.q))+'</div>'+c.c.map((o,j)=>'<button class="btn" data-j="'+j+'">'+esc(t(o))+'</button>').join(""));
 app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===c.a;if(ok){S.right++;seOk()}else seNg();S.last=ok;S.step="qres";render()})}
function rQres(){const p=D.P[S.i],k=S.q[S.qi],c=p.topics[k];S.who=S.last?"amate":"minakata";
 mk(topbar()+'<div class="win"><div class="who">'+himg(S.who)+'</div>'+tw(S.last?u("ok"):u("ng").replace("{a}",t(c.c[c.a])))+'<div class="src">'+esc(t(c.text))+'</div></div><button class="btn gold" id="n">'+u("next")+'</button>');
 $("#n").onclick=()=>{seTap();S.qi++;if(S.qi<3){S.step="quiz"}else{const n=Math.max(1,S.right);S.stars[p.id]=Math.max(S.stars[p.id]||0,n);save();S.step="route"}render()}}
function rRoute(){const p=D.P[S.i];const n=S.stars[p.id];const last=S.i>=D.P.length-1;S.who="inari";
 mk(topbar()+'<div class="win">'+sScene(p.id)+'<div style="margin-top:8px"></div>'+tw(u("result").replace("{p}",t(p)).replace("{n}",n))+'</div>'+(last?'<button class="btn gold" id="e">'+u("end")+'</button>':
 '<div class="small" style="padding:0 4px">'+u("route")+'</div>'+(D.L[p.id+">"+D.P[S.i+1].id]||[]).map((o,j)=>'<button class="btn" data-j="'+j+'">'+sIcon(o.mode,32)+'<span class="opt"><span class="t">'+esc(t(o.name))+'</span></span></button>').join(""))+'<button class="btn" id="b">'+u("back")+'</button>');
 if(last)$("#e").onclick=()=>{seGo();S.step="end";render()};else app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{seTap();S.j=+b.dataset.j;S.step="link";render()});
 $("#b").onclick=()=>{S.step="hub";render()}}
function rLink(){const p=D.P[S.i],nx=D.P[S.i+1];const o=D.L[p.id+">"+nx.id][S.j];S.stamps[o.mode]=1;save();S.who="minakata";
 mk(topbar()+'<div class="win"><div class="who">'+sIcon(o.mode,56)+'<div class="nm">'+esc(t(o.name))+'</div></div>'+tw(t(o.text))+'<div class="src">'+tagH(o.tag)+u("src")+': '+esc(o.s)+'</div></div><button class="btn gold" id="g">'+u("go")+' → '+esc(t(nx))+'</button><button class="btn" id="b">'+u("back")+'</button>');
 $("#g").onclick=()=>{seGo();S.i++;save();S.step="hub";render()};$("#b").onclick=()=>{S.step="route";render()}}
function rEnd(){const n=Object.values(S.stars).reduce((a,b)=>a+b,0);S.who="amate";mk('<div class="win"><h1 style="font-size:22px">'+u("end")+'</h1><div class="msg" style="text-align:center"><span class="stars">★'+n+'/'+D.P.length*3+'</span></div>'+sScene("saitama")+heroRow()+tw(u("endtxt"))+'</div><button class="btn" id="r">'+u("rec")+'</button><button class="btn gold" id="b">'+u("back")+'</button>');
 $("#r").onclick=()=>{S.back="end";S.step="rec";render()};$("#b").onclick=()=>{S.step="title";render()}}
function rRec(){let h='<div class="win"><div class="nm">'+u("rec")+'</div>'+D.P.map(p=>'<div style="margin:6px 0">'+esc(t(p))+' <span class="stars">'+('★'.repeat(S.stars[p.id]||0)||'–')+'</span></div>').join("")+'<div class="small" style="margin-top:8px">'+u("modes")+': '+(Object.keys(S.stamps).map(m=>sIcon(m,28)).join(" ")||'–')+'</div></div>';
 h+='<div class="win"><div class="nm">'+u("src")+'</div><div class="small">'+D.P.map(p=>'<div style="margin-top:6px"><b style="color:#fff;font-weight:normal">'+esc(t(p))+'</b>'+D.ORDER.map(k=>'<div>'+tagH(p.topics[k].tag)+esc(p.topics[k].s)+'</div>').join("")+'</div>').join("")+'</div></div>';
 h+='<button class="btn" id="x">'+(S.sure?u("sure"):u("reset"))+'</button><button class="btn gold" id="b">'+u("back")+'</button>';mk(h);
 $("#x").onclick=()=>{if(!S.sure){S.sure=true;render();return}try{localStorage.removeItem(KEY)}catch(e){}S.sure=false;S.has=false;S.i=0;S.read={};S.stars={};S.stamps={};S.step="title";render()};
 $("#b").onclick=()=>{S.step=S.back||"title";render()}}
/* 最初のタップで音を有効にする（ブラウザの決まり） */
document.addEventListener("pointerdown",()=>{if(!AU.ctx){auResume();bgmFor()}else if(AU.ctx.state==="suspended")AU.ctx.resume()},{passive:true});
render();
