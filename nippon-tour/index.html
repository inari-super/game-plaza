<style>
:root{--bg:#05051c;--w1:#1a1a7a;--w2:#0a0a3c;--line:#e8e8ff;--l2:#7a86ff;--gold:#f8d820;--dim:#a8b0e8;--green:#98e0a8;--warn:#f8a8c0;color-scheme:dark;
 --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:var(--font)}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100%;padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.win{background:linear-gradient(180deg,var(--w1),var(--w2));border:2px solid var(--line);border-radius:4px;box-shadow:0 0 0 2px #000;padding:10px 12px}
h1{font-weight:normal;color:var(--gold);font-size:26px;line-height:1.3;margin:6px 0;text-align:center;text-shadow:3px 3px 0 #800;white-space:pre-line}
.sub{text-align:center;color:#9ad0ff;font-size:14px}
.heroes{display:flex;justify-content:center;gap:6px;margin:10px 0;align-items:flex-end}
.heroes figure{margin:0;text-align:center;font-size:11px}.heroes img{height:64px;image-rendering:pixelated;display:block;margin:0 auto 2px}
.btn{font-family:var(--font);font-size:15px;color:#fff;text-align:left;padding:10px 12px;min-height:46px;border-radius:4px;border:2px solid var(--line);background:linear-gradient(180deg,#3a3ac8,#1a1a7a);box-shadow:0 0 0 2px #000;cursor:pointer;width:100%;display:flex;align-items:center;gap:8px}
.btn:active,.btn:focus-visible{background:linear-gradient(180deg,#4a4ad8,#2a2a88);outline:2px solid var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}.btn[disabled]{background:#24243a;border-color:#5a5a70;color:#8c8ca4;cursor:not-allowed}
.btn,#lg{white-space:nowrap}.btn small{display:block;font-size:11px;color:var(--dim)}.btn .st{margin-left:auto;color:var(--gold)}
.row{display:flex;gap:6px}.row .btn{justify-content:center}
#top{display:flex;justify-content:space-between;font-size:12px;gap:8px}#top b{color:var(--gold);font-weight:normal}
#map{width:100%;height:auto;display:block;background:#183484;border:2px solid var(--line);border-radius:4px}
.msg{font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.who{display:flex;gap:8px;align-items:flex-end}.who img{height:56px;image-rendering:pixelated}.nm{color:var(--gold);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:0 5px;border:1px solid;border-radius:2px;margin-right:6px}
.tag.f{color:var(--green);border-color:var(--green)}.tag.l{color:#c8b0ff;border-color:#c8b0ff}.tag.x{color:var(--gold);border-color:var(--gold)}
.src{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
.small{font-size:11px;color:var(--dim);line-height:1.7}
.stars{color:var(--gold);letter-spacing:2px}
.mode{font-size:10px;border:1px solid var(--l2);padding:0 4px;border-radius:2px;color:var(--dim);flex:none}
#app>*{flex-shrink:0}.btn span{min-width:0;overflow-wrap:anywhere}.opt{display:block}
.scene{display:block;width:100%;height:auto;image-rendering:pixelated;border:2px solid var(--line);box-shadow:0 0 0 2px #000;border-radius:2px}.ico{image-rendering:pixelated;flex:none}.tag.k{color:#c8b0ff;border-color:#c8b0ff}.snd{display:flex;gap:6px}.snd .btn{min-height:36px;padding:6px 10px;font-size:13px;justify-content:center}.hint{font-size:10px;color:var(--dim);text-align:right}.opt .t{font-size:15px}.card{border:4px solid var(--cc);border-radius:8px;background:linear-gradient(180deg,#fff8,#0000),#201c40;box-shadow:0 0 0 2px #000,0 0 14px var(--cc);padding:8px;margin:6px auto;max-width:280px}.card img{width:100%;image-rendering:pixelated;display:block;border:2px solid #000;border-radius:2px}.card .cn{color:#fff;font-size:15px;margin:6px 0 2px;text-align:center}.card .cr{color:var(--cc);font-size:11px;text-align:center}.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cgrid .card{padding:4px;border-width:3px;margin:0}.cgrid .cn{font-size:10px}.cgrid .emp{aspect-ratio:1;background:#0006;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#667}

.btn span{white-space:normal}
.snd{flex-wrap:wrap}.snd .btn{width:auto;flex:1 1 auto;white-space:normal}

<script>window.__D={"UI":{"title":{"ja":"歴史戦隊ジンジャーマン\nニッポン縦断 ぐるっと47","en":"Jingerman Squad\nAround Japan in 47"},"sub":{"ja":"第1弾　東京と関東6県　＋　第2弾　東北6県","en":"Part 1: Tokyo & the six Kanto prefectures  +  Part 2: the six Tohoku prefectures"},"new":{"ja":"はじめから","en":"New game"},"cont":{"ja":"つづきから","en":"Continue"},"rec":{"ja":"旅の記録","en":"Travel log"},"help":{"ja":"あそびかた","en":"How to play"},"lang":{"ja":"English","en":"日本語"},"back":{"ja":"もどる","en":"Back"},"note":{"ja":"事実の確認状況は、各カードの札（確認済み／伝承／未確認）と出典で示します。ダイヤ・料金は、各社の公式サイトで確認してください。お酒は20歳になってから。","en":"Each card is labelled (verified / folklore / unconfirmed) with its source. Check operators' sites for timetables and fares. Drinking is for adults only."},"helptxt":{"ja":"東京から出発して、関東と東北の13の都県をめぐります。\n①その県と言えば・町・県庁所在地・神社仏閣・名物・ご当地グルメ・お酒・歴史・祭り・偉人・おみやげ・県民性の12項目から、7つ以上を読む。おみやげは「おみやげ袋」に入る。\n②全部読んだら、クイズ3問(県民性以外から出題)に挑戦（★は正解の数）。\n③次の県へ、実在の電車・新幹線・フェリーから道を選んで進む。\nセーブは自動です。","en":"Start in Tokyo and travel through thirteen prefectures of Kanto and Tohoku.\n1) Read at least 7 of 12 cards: known for, towns (with a map), capital, shrine/temple, specialty, local eats, sake, history, festival, notable person, souvenir (goes into your souvenir bag), local character.\n2) Take a 3-question quiz (stars = correct answers).\n3) Choose a real train, Shinkansen or ferry to the next prefecture.\nProgress saves automatically."},"hub":{"ja":"ここで、何を見る？","en":"What shall we look at?"},"read":{"ja":"読んだ","en":"read"},"quiz":{"ja":"クイズに挑戦！","en":"Take the quiz!"},"quizlock":{"ja":"クイズ（7つ読むと解放）","en":"Quiz (unlocks after reading 7)"},"next":{"ja":"次へ","en":"Next"},"go":{"ja":"次の県へ出発","en":"Head to the next prefecture"},"ok":{"ja":"正解！","en":"Correct!"},"ng":{"ja":"おしい！ 答えは「{a}」","en":"Not quite! The answer: \"{a}\""},"result":{"ja":"{p}クリア！　★{n}／3","en":"{p} cleared!  Stars {n}/3"},"route":{"ja":"どの道で行く？（実在の交通機関）","en":"Which way shall we go? (real transport)"},"cap":{"ja":"県庁所在地","en":"Capital"},"shrine":{"ja":"神社・仏閣","en":"Shrine / Temple"},"food":{"ja":"名物料理","en":"Specialty"},"gourmet":{"ja":"ご当地グルメ","en":"Local eats"},"sake":{"ja":"お酒（20歳から）","en":"Sake (adults only)"},"history":{"ja":"歴史","en":"History"},"tf":{"ja":"確認済み","en":"Verified"},"tl":{"ja":"伝承","en":"Folklore"},"tx":{"ja":"未確認","en":"Unconfirmed"},"src":{"ja":"出典","en":"Source"},"end":{"ja":"ここまでの旅、完了！","en":"Journey so far complete!"},"endtxt":{"ja":"次の弾は、北海道（予定）。\n\n※お酒の紹介は、おとな向けです。味わいは、確認できた範囲だけを書いています。","en":"Next: Hokkaido (planned).\n\n*Sake notes are for adults, and tasting notes appear only where we could confirm them."},"reset":{"ja":"記録を消す","en":"Erase save"},"sure":{"ja":"本当に消す？（もう一度押すと消えます）","en":"Really erase? (press again)"},"stars":{"ja":"★","en":"★"},"modes":{"ja":"のりもの","en":"Transport"},"from":{"ja":"出発","en":"Start"},"sp":{"ja":"{n}ばんめ","en":"No. {n}"},"sayc":{"ja":"県庁所在地は、ここやで。","en":"Here's the prefectural seat."},"sayt":{"ja":"見てみよ。","en":"Take a look."},"mapc":{"ja":"地図：国土地理院「地球地図日本」をもとに作成（簡略化）","en":"Map: based on GSI Global Map Japan (simplified)"},"matsuri":{"ja":"祭り","en":"Festival"},"person":{"ja":"偉人","en":"Notable person"},"omiyage":{"ja":"おみやげ・駅弁","en":"Souvenir / Ekiben"},"bag":{"ja":"おみやげ袋","en":"Souvenir bag"},"got":{"ja":"おみやげ袋に入れた！","en":"Added to your souvenir bag!"},"saw":{"ja":"ええ香りがする…","en":"Smells great..."},"kenmin":{"ja":"県民性（よく言われる）","en":"Local character (folk image)"},"tk":{"ja":"よく言われる","en":"Folk image"},"bgm":{"ja":"♪音楽","en":"♪ Music"},"se":{"ja":"ピー音","en":"Beeps"},"on":{"ja":"オン","en":"on"},"off":{"ja":"オフ","en":"off"},"skip":{"ja":"（タップで全部表示）","en":"(tap to show all)"},"famous":{"ja":"その県と言えば","en":"Known for"},"towns":{"ja":"その県の町","en":"Towns"},"tmap":{"ja":"町の位置は目安です","en":"Town positions are approximate"},"cardget":{"ja":"ご当地カードをもらった！","en":"You got a local card!"},"cards":{"ja":"ご当地カード","en":"Local cards"},"rar":{"ja":["ブロンズ","シルバー","ゴールド"],"en":["Bronze","Silver","Gold"]}},"P":[{"id":"tokyo","ja":"東京都","en":"Tokyo","ll":[35.69,139.692],"cap":{"ja":"新宿区（東京都庁）","en":"Shinjuku Ward (Tokyo Metropolitan Government)"},"intro":{"ja":"イナリ「着いたで、東京や！ ここから日本一周の旅のはじまりや！」\nテンジン「まずは、東京の中身を、ひととおり見ていこか。」","en":"Inari: \"We made it to Tokyo! Our journey around Japan starts here!\"\nTenjin: \"Let's take a good look around first.\""},"topics":{"cap":{"title":{"ja":"県庁所在地：新宿","en":"Prefectural seat: Shinjuku"},"text":{"ja":"東京都の都庁は、新宿区にある。「東京」は、23の特別区と市町村からなる都で、都庁の所在地は、新宿区とされる。","en":"Tokyo's metropolitan government sits in Shinjuku Ward. Tokyo is a 'metropolis' made of 23 special wards plus cities, towns and villages."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"東京都庁があるのは、どこ？","en":"Where is the Tokyo Metropolitan Government located?"},"c":[{"ja":"新宿区","en":"Shinjuku Ward"},{"ja":"千代田区","en":"Chiyoda Ward"},{"ja":"港区","en":"Minato Ward"}],"a":0},"shrine":{"title":{"ja":"明治神宮","en":"Meiji Jingu"},"text":{"ja":"渋谷・原宿にある明治神宮は、明治天皇と昭憲皇太后を祀る。大正9年（1920年）に鎮座した。（千葉の亀田酒造は、この神宮の新嘗祭へ、毎年お酒を奉納している蔵とされる。）","en":"Meiji Jingu, in Shibuya/Harajuku, enshrines Emperor Meiji and Empress Shoken. It was founded in 1920. (Kameda Shuzo of Chiba is said to be the only brewery that offers sake every year at its Niinamesai harvest rite.)"},"tag":"x","s":"鎮座年は出典未確認。亀田酒造の奉納：千葉県公式観光サイト「まるちば」","q":{"ja":"明治神宮が鎮座したのは、いつ？","en":"When was Meiji Jingu founded?"},"c":[{"ja":"1920年","en":"1920"},{"ja":"1868年","en":"1868"},{"ja":"1964年","en":"1964"}],"a":0,"more":[{"title":{"ja":"浅草寺","en":"Senso-ji"},"text":{"ja":"浅草寺は、言い伝えによると628年に始まる。漁師の兄弟が網で観音菩薩の金の像を見つけ、土師中知とともに寺を創建して安置したとされる。参拝客が増え、境内の商店街「仲見世」が生まれた。","en":"By tradition, Senso-ji began in 628: two fishermen brothers netted a golden Kannon image and, with Haji no Nakatomo, founded a temple to enshrine it. Growing crowds of worshippers gave rise to the shopping street Nakamise."},"tag":"l","s":"国土交通省「多言語解説文データベース」浅草寺"},{"title":{"ja":"神田明神","en":"Kanda Myojin"},"text":{"ja":"神田明神は730年に創建されたとされ、江戸城の拡張のため、1616年に現在の場所へ移った。二代将軍・秀忠が、江戸の守りの神社として奉った。","en":"Kanda Myojin is said to have been founded in 730 and moved to its present site in 1616 to make room for Edo Castle's expansion. The second shogun, Hidetada, dedicated it as a protective shrine of Edo."},"tag":"f","s":"国立国会図書館「ランドマーク 神田明神」"}]},"food":{"title":{"ja":"名物：江戸前寿司","en":"Specialty: Edomae sushi"},"text":{"ja":"江戸前寿司は、江戸の海（江戸前）でとれた魚介を使う握りずしの流れをくむ。屋台から広まったとされる。","en":"Edomae sushi comes from nigiri sushi made with seafood from the waters off Edo. It is said to have spread from street stalls."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"江戸前寿司の「江戸前」とは、もとは何を指す？","en":"What did 'Edomae' originally refer to?"},"c":[{"ja":"江戸の海の魚","en":"Fish from the waters off Edo"},{"ja":"寿司の大きさ","en":"The size of the sushi"},{"ja":"お店の名前","en":"The name of a shop"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：もんじゃ焼き","en":"Local eats: Monja-yaki"},"text":{"ja":"もんじゃ焼きは、鉄板で焼いて、小さなヘラで食べる。月島のもんじゃストリートが有名。","en":"Monja-yaki is cooked on an iron griddle and eaten with a tiny spatula. Tsukishima's 'Monja Street' is famous for it."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"もんじゃ焼きで有名な、東京の街は？","en":"Which Tokyo neighbourhood is famous for monja-yaki?"},"c":[{"ja":"月島","en":"Tsukishima"},{"ja":"浅草橋","en":"Asakusabashi"},{"ja":"高円寺","en":"Koenji"}],"a":0},"sake":{"title":{"ja":"お酒：多満自慢（福生）","en":"Sake: Tamajiman (Fussa)"},"text":{"ja":"多摩の福生市には、江戸時代から酒を造る蔵がある。福生市の資料は、「多満自慢」を、地元で親しまれる銘柄に挙げる。味わいの記述は、確認できなかった（未確認）。※お酒は20歳になってから。","en":"In Fussa, western Tokyo, breweries have made sake since the Edo period. Fussa City's material lists 'Tamajiman' among the local favourites. We could not verify a tasting description (unconfirmed). *Drinking is for adults only."},"tag":"f","s":"福生市「ふるさと」資料（銘柄・江戸時代からの酒造り）。味わいは未確認","q":{"ja":"福生の地酒として、市の資料に挙がる銘柄は？","en":"Which Fussa sake brand is named in the city's material?"},"c":[{"ja":"多満自慢","en":"Tamajiman"},{"ja":"群馬泉","en":"Gunma Izumi"},{"ja":"天青","en":"Tensei"}],"a":0},"history":{"title":{"ja":"歴史：江戸と東京","en":"History: Edo and Tokyo"},"text":{"ja":"1603年、徳川家康が江戸に幕府を開いた。1868年、江戸は「東京」と改められた。（東京が都になった経緯には、遷都の正式な宣言はなかったとする見方もあり、諸説ある。）","en":"In 1603, Tokugawa Ieyasu founded his shogunate at Edo. In 1868 Edo was renamed 'Tokyo'. (How Tokyo became the capital is debated; some note there was no formal declaration of transfer.)"},"tag":"x","s":"出典未確認（諸説あり）","q":{"ja":"江戸に幕府を開いたのは？","en":"Who founded the shogunate at Edo?"},"c":[{"ja":"徳川家康","en":"Tokugawa Ieyasu"},{"ja":"源頼朝","en":"Minamoto no Yoritomo"},{"ja":"織田信長","en":"Oda Nobunaga"}],"a":0},"kenmin":{"title":{"ja":"江戸っ子と、集まる人々","en":"Edokko and people from everywhere"},"text":{"ja":"「江戸っ子」は、気っぷがよく、さっぱりした気質だと語られてきた（俗説）。いまの東京は、日本各地や世界から来た人が暮らす街でもある。","en":"'Edokko' (born-and-bred Tokyoites) have been described as easygoing and open-handed (folk image). Today Tokyo is also home to people from all over Japan and the world."},"tag":"k","s":"俗説・出典未確認","q":null},"matsuri":{"title":{"ja":"三社祭（浅草神社）","en":"Sanja Matsuri (Asakusa Shrine)"},"text":{"ja":"浅草神社の三社祭は、5月に行われる。台東区の案内では、令和8年は5月15日・16日・17日。","en":"Asakusa Shrine's Sanja Matsuri is held in May. Taito Ward's guide lists 15–17 May for 2026 (Reiwa 8)."},"tag":"f","s":"台東区公式ページ「三社祭」（令和8年の日程）。祭神・由来は読めず未確認","q":{"ja":"三社祭が行われるのは、何月？","en":"In which month is Sanja Matsuri held?"},"c":[{"ja":"5月","en":"May"},{"ja":"12月","en":"December"},{"ja":"8月","en":"August"}],"a":0,"more":[{"title":{"ja":"神田祭（神田明神）","en":"Kanda Festival (Kanda Myojin)"},"text":{"ja":"神田祭は、江戸三大祭の一つ。かつては9月15日に行われ、いまは5月に行われる。1681年からは、山王祭と1年おきに行われた。行列は、将軍が見るため、江戸城内へ入った。","en":"The Kanda Festival was one of Edo's three great festivals. It was once held on 15 September and is now held in May. From 1681 it alternated yearly with the Sanno Festival, and its procession entered Edo Castle to be viewed by the shogun."},"tag":"f","s":"国立国会図書館「ランドマーク 神田明神」"},{"title":{"ja":"東京高円寺阿波おどり","en":"Tokyo Koenji Awa Odori"},"text":{"ja":"東京高円寺阿波おどりは、1957年（昭和32年）8月27日に「高円寺ばか踊り」として始まった。通りを練り歩きながら踊る形式で、100万人の観衆が集まる夏の一大イベントとされる。徳島の本場と交流して発展した。","en":"Tokyo Koenji Awa Odori began on 27 August 1957 as the 'Koenji Baka Odori'. Dancers move along the streets, and the event is described as a major summer spectacle drawing a million spectators. It developed through exchange with Tokushima's original Awa Odori."},"tag":"f","s":"杉並区公式「東京高円寺阿波おどり」"}]},"person":{"title":{"ja":"葛飾北斎","en":"Katsushika Hokusai"},"text":{"ja":"葛飾北斎は、1760年に、いまの墨田区で生まれた（1760～1849）。代表作「神奈川沖浪裏」は、海外で「Great Wave」として知られる。作品はヨーロッパなど海外の絵画に大きな影響を与えたとされる。2016年に墨田区がすみだ北斎美術館を開いた。","en":"Katsushika Hokusai was born in 1760 in what is now Sumida Ward (1760–1849). His 'Under the Wave off Kanagawa' is known abroad as the 'Great Wave', and his work is said to have greatly influenced painting overseas. Sumida opened the Sumida Hokusai Museum in 2016."},"tag":"f","s":"内閣広報室「Highlighting JAPAN」2019年9月号","q":{"ja":"「神奈川沖浪裏」は、海外で何と呼ばれる？","en":"What is 'Under the Wave off Kanagawa' called abroad?"},"c":[{"ja":"Great Wave","en":"Great Wave"},{"ja":"Big Mountain","en":"Big Mountain"},{"ja":"Red Sun","en":"Red Sun"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：雷おこし","en":"Souvenir: Kaminari-okoshi"},"text":{"ja":"雷おこしは、浅草名物。浅草寺の裏手の「雷5656会館」では、雷おこしの製造を見学できる「浅草工房」と、自分で作れる体験がある。由来は、確認できなかった（未確認）。","en":"Kaminari-okoshi is an Asakusa specialty. Behind Sensoji, the 'Kaminari 5656 Kaikan' has a 'Asakusa Kobo' where you can watch it made, plus a make-your-own experience. Its origin could not be confirmed."},"tag":"f","s":"台東区公式観光サイト「雷5656会館」。由来は未確認","q":{"ja":"雷おこしの製造を見学できる施設は？","en":"Where can you watch kaminari-okoshi being made?"},"c":[{"ja":"雷5656会館","en":"Kaminari 5656 Kaikan"},{"ja":"東京タワー","en":"Tokyo Tower"},{"ja":"東京駅","en":"Tokyo Station"}],"a":0},"famous":{"title":{"ja":"東京都と言えば","en":"Known for"},"text":{"ja":"・東京スカイツリー\n・浅草・浅草寺\n・渋谷スクランブル交差点\n・築地・豊洲の寿司\n・秋葉原のアニメ・ゲーム","en":"• Tokyo Skytree\n• Asakusa & Senso-ji\n• Shibuya Crossing\n• Sushi at Tsukiji & Toyosu\n• Akihabara anime & games"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"東京都の町","en":"Towns of Tokyo"},"text":{"ja":"新宿　高層ビルとネオンの夜の街\n渋谷　世界的に有名な大きな交差点\n浅草　浅草寺と下町の雰囲気\n秋葉原　アニメ・ゲーム・電気街\n原宿　若者のファッションと明治神宮\n上野　公園と博物館が集まる\n八王子　高尾山への玄関口","en":"Shinjuku – Skyscrapers and neon nights\nShibuya – A famously huge crossing\nAsakusa – Senso-ji and old-town charm\nAkihabara – Anime, games and electronics\nHarajuku – Youth fashion and Meiji Jingu\nUeno – Park and museums\nHachioji – Gateway to Mt. Takao"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"新宿","en":"Shinjuku"},"ll":[35.69,139.7],"w":{"ja":"高層ビルとネオンの夜の街","en":"Skyscrapers and neon nights"}},{"n":{"ja":"渋谷","en":"Shibuya"},"ll":[35.659,139.701],"w":{"ja":"世界的に有名な大きな交差点","en":"A famously huge crossing"}},{"n":{"ja":"浅草","en":"Asakusa"},"ll":[35.715,139.797],"w":{"ja":"浅草寺と下町の雰囲気","en":"Senso-ji and old-town charm"}},{"n":{"ja":"秋葉原","en":"Akihabara"},"ll":[35.698,139.773],"w":{"ja":"アニメ・ゲーム・電気街","en":"Anime, games and electronics"}},{"n":{"ja":"原宿","en":"Harajuku"},"ll":[35.67,139.703],"w":{"ja":"若者のファッションと明治神宮","en":"Youth fashion and Meiji Jingu"}},{"n":{"ja":"上野","en":"Ueno"},"ll":[35.714,139.777],"w":{"ja":"公園と博物館が集まる","en":"Park and museums"}},{"n":{"ja":"八王子","en":"Hachioji"},"ll":[35.656,139.324],"w":{"ja":"高尾山への玄関口","en":"Gateway to Mt. Takao"}}]},{"id":"kanagawa","ja":"神奈川県","en":"Kanagawa","ll":[35.444,139.638],"cap":{"ja":"横浜市","en":"Yokohama City"},"intro":{"ja":"ハチマン「…海の匂いがする。」\nアマテ「ここは、開かれた港の街、横浜ですね。」","en":"Hachiman: \"...I smell the sea.\"\nAmate: \"This is Yokohama, a port city that opened to the world.\""},"topics":{"cap":{"title":{"ja":"県庁所在地：横浜市","en":"Prefectural capital: Yokohama"},"text":{"ja":"神奈川県の県庁所在地は、横浜市。県庁は、横浜の港に近い関内にある。","en":"The capital of Kanagawa Prefecture is Yokohama. The prefectural office is in Kannai, near the harbour."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"神奈川県の県庁所在地は？","en":"What is the capital of Kanagawa?"},"c":[{"ja":"横浜市","en":"Yokohama"},{"ja":"鎌倉市","en":"Kamakura"},{"ja":"川崎市","en":"Kawasaki"}],"a":0},"shrine":{"title":{"ja":"鶴岡八幡宮（鎌倉）","en":"Tsurugaoka Hachimangu (Kamakura)"},"text":{"ja":"鎌倉の鶴岡八幡宮は、1180年、源頼朝が鎌倉に拠点を置いたとき、建てたとされる。鎌倉幕府を開いた武士の信仰を、いまに伝える。","en":"In 1180, when Minamoto no Yoritomo set up his base at Kamakura, he is recorded as building Tsurugaoka Hachimangu. It keeps alive the faith of the warriors who founded the Kamakura shogunate."},"tag":"f","s":"国土交通省「多言語解説文データベース」鶴岡八幡宮の解説","q":{"ja":"鶴岡八幡宮を建てたとされる人物は？","en":"Who is recorded as building Tsurugaoka Hachimangu in 1180?"},"c":[{"ja":"源頼朝","en":"Minamoto no Yoritomo"},{"ja":"北条時宗","en":"Hojo Tokimune"},{"ja":"足利尊氏","en":"Ashikaga Takauji"}],"a":0,"more":[{"title":{"ja":"高徳院（鎌倉大仏）","en":"Kotoku-in (Kamakura Great Buddha)"},"text":{"ja":"高徳院の大仏は、銅製で高さ11.3m、重さ121トン。阿弥陀仏の像で、国宝に指定されている。鋳造は1252年に始まったとされる。仏師の名は明らかになっていない。","en":"The Great Buddha of Kotoku-in is bronze, 11.3 m tall and 121 tonnes, an Amida Buddha designated a National Treasure. Casting is said to have begun in 1252; the sculptor's name is not known."},"tag":"f","s":"国土交通省「多言語解説文データベース」高徳院"},{"title":{"ja":"箱根神社","en":"Hakone Shrine"},"text":{"ja":"箱根神社は、伝説では、757年に万巻上人が建てたとされる。芦ノ湖のほとりにあり、湖畔の「平和の鳥居」は、1952年にサンフランシスコ講和条約を記念して建てられた。九頭龍神社新宮には、湖の守護神の九頭の龍が祀られている。","en":"By legend, Hakone Shrine was built in 757 by the monk Mankan. It stands on Lake Ashi; the lakeside 'Peace Torii' was erected in 1952 to commemorate the San Francisco Peace Treaty. The Kuzuryu Shrine annex enshrines the nine-headed dragon, guardian of the lake."},"tag":"l","s":"国土交通省「多言語解説文データベース」箱根神社"}]},"food":{"title":{"ja":"名物：崎陽軒のシウマイ","en":"Specialty: Shumai (Kiyoken)"},"text":{"ja":"横浜の名物として知られるのが、シウマイ。横浜駅の駅弁などで親しまれる。","en":"Shumai is a well-known Yokohama specialty, familiar from station bento at Yokohama Station."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"横浜の名物として知られる点心は？","en":"Which dim sum is known as a Yokohama specialty?"},"c":[{"ja":"シウマイ","en":"Shumai"},{"ja":"小籠包","en":"Xiao long bao"},{"ja":"春巻","en":"Spring rolls"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：横浜中華街","en":"Local eats: Yokohama Chinatown"},"text":{"ja":"横浜中華街は、港の開港のあとに生まれた華僑の街とされる。食べ歩きが楽しい。","en":"Yokohama Chinatown grew from the Chinese community after the port opened. It is a joy to eat your way through."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"横浜中華街は、何の後に生まれた街とされる？","en":"Yokohama Chinatown grew after what happened?"},"c":[{"ja":"港の開港","en":"The opening of the port"},{"ja":"関東大震災の後だけ","en":"Only after the 1923 earthquake"},{"ja":"鉄道の開業の後だけ","en":"Only after the railway opened"}],"a":0},"sake":{"title":{"ja":"お酒：天青と、県内最古の蔵","en":"Sake: Tensei and the oldest brewery"},"text":{"ja":"茅ヶ崎の熊澤酒造（1872年創業）は、湘南に残る唯一の蔵元で、銘柄は「天青」。相模原の清水酒造（1751年創業）は、県内最古。海老名の泉橋酒造は、米作りから醸造まで一貫して行い、純米酒だけを造る。伊勢原の吉川醸造は、大山の伏流水を使い、全体に辛口で芳醇。※お酒は20歳になってから。","en":"Kumazawa Shuzo in Chigasaki (founded 1872), the only brewery left in Shonan, makes 'Tensei'. Shimizu Shuzo in Sagamihara (1751) is the prefecture's oldest. Izumibashi in Ebina grows its own rice and makes only junmai. Yoshikawa Jozo in Isehara uses Oyama's underground water; its sake is generally dry yet full-bodied. *Drinking is for adults only."},"tag":"f","s":"神奈川県「神奈川の日本酒」蔵元一覧（県公式ページ）","q":{"ja":"県内最古とされる蔵（1751年創業）は？","en":"Which brewery (founded 1751) is the oldest in Kanagawa?"},"c":[{"ja":"清水酒造","en":"Shimizu Shuzo"},{"ja":"熊澤酒造","en":"Kumazawa Shuzo"},{"ja":"泉橋酒造","en":"Izumibashi Shuzo"}],"a":0},"history":{"title":{"ja":"歴史：ペリー来航と開港","en":"History: Perry and the opening of ports"},"text":{"ja":"1853年、ペリー率いる黒船が浦賀に来航した。翌1854年に日米和親条約が結ばれ、のちに横浜が開港して、日本は世界へ開かれていった。","en":"In 1853 Perry's Black Ships arrived at Uraga. A treaty followed in 1854, and later Yokohama opened as a port as Japan opened to the world."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"ペリーの黒船が来航した港は？","en":"At which port did Perry's Black Ships arrive in 1853?"},"c":[{"ja":"浦賀","en":"Uraga"},{"ja":"神戸","en":"Kobe"},{"ja":"函館","en":"Hakodate"}],"a":0},"kenmin":{"title":{"ja":"開港の街の気風","en":"The spirit of a port town"},"text":{"ja":"開港の街・横浜は、新しいものを取り入れる気風があると、よく言われる（俗説）。","en":"Yokohama, a port town, is often said to have a spirit of welcoming new things (folk image)."},"tag":"k","s":"俗説・出典未確認","q":null},"matsuri":{"title":{"ja":"鶴岡八幡宮の例大祭と流鏑馬","en":"Tsurugaoka Hachimangu's grand festival and yabusame"},"text":{"ja":"鶴岡八幡宮は、9月16日の例大祭に流鏑馬神事を行うことで知られる。馬を走らせながら矢を射る神事で、武士の信仰を今に伝える。（公式サイトのお知らせの題名から。本文は読めず、日付と内容は未確認）","en":"Tsurugaoka Hachimangu is known for yabusame — archery from a galloping horse — at its 16 September grand festival, a rite that keeps warrior faith alive. (From the titles of the shrine's notices; the pages themselves could not be read, so date and details are unconfirmed.)"},"tag":"x","s":"鶴岡八幡宮公式サイトの題名のみ確認（本文は取得不可）","q":{"ja":"流鏑馬で、武者は何に乗って矢を射る？","en":"What do archers ride in yabusame?"},"c":[{"ja":"馬","en":"A horse"},{"ja":"牛","en":"An ox"},{"ja":"船","en":"A boat"}],"a":0,"more":[{"title":{"ja":"小田原北条五代祭り","en":"Odawara Hojo Godai Festival"},"text":{"ja":"小田原北条五代祭りは、毎年5月3日に開かれる。北条五代の城主にふんした武者行列が、小田原城址公園のまわりを進む。2026年は第62回で、総勢1,700名。鉄砲隊の発砲演技や、風魔忍者のパフォーマンスもある。","en":"The Odawara Hojo Godai Festival is held every 3 May. A warrior parade, with actors as the five generations of Hojo lords, marches around Odawara Castle Park. The 2026 event was the 62nd, with 1,700 participants, plus matchlock-gun displays and Fuma ninja performances."},"tag":"f","s":"神奈川県観光協会「小田原北条五代祭り」"},{"title":{"ja":"湘南ひらつか七夕まつり","en":"Shonan Hiratsuka Tanabata Festival"},"text":{"ja":"湘南ひらつか七夕まつりは、昭和26年に始まった。戦後の復興と繁栄を願い、仙台の七夕を手本にしたという。「日本一の竹飾り」が見どころで、2025年は7月4日～6日に開かれた。※「日本三大七夕」は、諸説ある。","en":"The Shonan Hiratsuka Tanabata Festival began in 1951, wishing for postwar recovery and modelled on Sendai's Tanabata. Its tall bamboo decorations are the highlight; in 2025 it ran 4–6 July. *'One of Japan's three great Tanabata' is disputed."},"tag":"x","s":"旅行情報サイト「平塚七夕まつり」（公式は未確認）"}]},"person":{"title":{"ja":"源頼朝と鎌倉","en":"Minamoto no Yoritomo and Kamakura"},"text":{"ja":"源頼朝は、1180年に鎌倉に入って「大倉幕府」を立ち上げ、侍所を置いた。征夷大将軍になったのは1192年。鎌倉幕府の始まりの年は、1180年・1185年（守護・地頭）・1192年と、諸説ある。1199年に落馬の事故で亡くなったとされる。","en":"Minamoto no Yoritomo entered Kamakura in 1180, set up the 'Okura Bakufu' and established the Samurai-dokoro. He became shogun in 1192. The start of the Kamakura shogunate is dated variously to 1180, 1185 (appointment of shugo and jito) or 1192. He is said to have died in 1199 after a fall from his horse."},"tag":"f","s":"nippon.com「源頼朝」","q":{"ja":"頼朝が鎌倉に入って拠点を置いた年は？","en":"In what year did Yoritomo enter Kamakura and set up his base?"},"c":[{"ja":"1180年","en":"1180"},{"ja":"1603年","en":"1603"},{"ja":"1868年","en":"1868"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：鳩サブレー","en":"Souvenir: Hato Sable"},"text":{"ja":"鎌倉の鳩サブレーを作る豊島屋は、1894年（明治27年）8月10日の創業。鳩サブレーの発売年や由来は、確認できなかった（未確認）。","en":"Toshimaya, maker of Kamakura's Hato Sable, was founded on 10 August 1894 (Meiji 27). The release year and origin of the cookie could not be confirmed."},"tag":"f","s":"豊島屋「会社概要」。発売年・由来は未確認","q":{"ja":"豊島屋の創業は？","en":"When was Toshimaya founded?"},"c":[{"ja":"1894年","en":"1894"},{"ja":"1603年","en":"1603"},{"ja":"1964年","en":"1964"}],"a":0},"famous":{"title":{"ja":"神奈川県と言えば","en":"Known for"},"text":{"ja":"・横浜中華街\n・鎌倉の大仏\n・箱根の温泉\n・江ノ島と江ノ電\n・みなとみらいの夜景","en":"• Yokohama Chinatown\n• Kamakura Great Buddha\n• Hakone hot springs\n• Enoshima & Enoden\n• Minato Mirai night view"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"神奈川県の町","en":"Towns of Kanagawa"},"text":{"ja":"横浜　港町と中華街\n鎌倉　大仏と古い寺社\n箱根　温泉と富士山の眺め\n江の島　海辺の島と江ノ電\n小田原　小田原城と海の幸\n川崎　工場夜景\n横須賀　軍港めぐりとカレー","en":"Yokohama – Port city and Chinatown\nKamakura – Great Buddha and old temples\nHakone – Hot springs and Fuji views\nEnoshima – A seaside island and the Enoden\nOdawara – Castle and fresh seafood\nKawasaki – Night views of factories\nYokosuka – Naval-port cruise and curry"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"横浜","en":"Yokohama"},"ll":[35.444,139.638],"w":{"ja":"港町と中華街","en":"Port city and Chinatown"}},{"n":{"ja":"鎌倉","en":"Kamakura"},"ll":[35.319,139.547],"w":{"ja":"大仏と古い寺社","en":"Great Buddha and old temples"}},{"n":{"ja":"箱根","en":"Hakone"},"ll":[35.233,139.107],"w":{"ja":"温泉と富士山の眺め","en":"Hot springs and Fuji views"}},{"n":{"ja":"江の島","en":"Enoshima"},"ll":[35.3,139.48],"w":{"ja":"海辺の島と江ノ電","en":"A seaside island and the Enoden"}},{"n":{"ja":"小田原","en":"Odawara"},"ll":[35.256,139.155],"w":{"ja":"小田原城と海の幸","en":"Castle and fresh seafood"}},{"n":{"ja":"川崎","en":"Kawasaki"},"ll":[35.531,139.697],"w":{"ja":"工場夜景","en":"Night views of factories"}},{"n":{"ja":"横須賀","en":"Yokosuka"},"ll":[35.281,139.672],"w":{"ja":"軍港めぐりとカレー","en":"Naval-port cruise and curry"}}]},{"id":"chiba","ja":"千葉県","en":"Chiba","ll":[35.607,140.106],"cap":{"ja":"千葉市","en":"Chiba City"},"intro":{"ja":"ミナカタ「船は気持ちええな！ 房総半島やで！」\nイナリ「落花生が、待っとるで！」","en":"Minakata: \"Nothing beats a ferry ride! This is the Boso Peninsula!\"\nInari: \"And peanuts are waiting for us!\""},"topics":{"cap":{"title":{"ja":"県庁所在地：千葉市","en":"Prefectural capital: Chiba City"},"text":{"ja":"千葉県の県庁所在地は、千葉市。東京湾に面した、大きな街。","en":"The capital of Chiba is Chiba City, a large city on Tokyo Bay."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"千葉県の県庁所在地は？","en":"What is the capital of Chiba?"},"c":[{"ja":"千葉市","en":"Chiba City"},{"ja":"成田市","en":"Narita"},{"ja":"船橋市","en":"Funabashi"}],"a":0},"shrine":{"title":{"ja":"成田山新勝寺","en":"Naritasan Shinshoji"},"text":{"ja":"成田山新勝寺は、940年に始まったとされる。平将門の乱を鎮めるため、寛朝大僧正が、不動明王を京都から成田に奉安したと伝わる。本尊は、弘法大師が彫り、開眼したとされる不動明王。","en":"Naritasan Shinshoji is said to date from 940. To quell the rebellion of Taira no Masakado, the high priest Kancho is said to have brought the Fudo Myoo image from Kyoto to Narita. The main image is said to have been carved and consecrated by Kobo Daishi."},"tag":"f","s":"千葉県観光物産協会「まるちば」成田山新勝寺","q":{"ja":"成田山新勝寺の本尊は？","en":"What is the main deity of Naritasan Shinshoji?"},"c":[{"ja":"不動明王","en":"Fudo Myoo"},{"ja":"阿弥陀如来","en":"Amida Nyorai"},{"ja":"観音菩薩","en":"Kannon"}],"a":0,"more":[{"title":{"ja":"香取神宮","en":"Katori Jingu"},"text":{"ja":"香取神宮は、神武天皇18年の創建と伝わる、下総国一宮。祭神は、勝利の神とされる経津主大神。明治より前に「神宮」を名乗れたのは、伊勢・香取・鹿島の三社だけとされる。国宝の「海獣葡萄鏡」を持ち、楼門は重要文化財。","en":"Katori Jingu is the Ichinomiya of Shimosa, said to have been founded in the 18th year of Emperor Jimmu. It enshrines Futsunushi, a god of victory. Before the Meiji era only Ise, Katori and Kashima are said to have been called 'Jingu'. It holds the National Treasure 'sea-beast and grape mirror', and its tower gate is an Important Cultural Property."},"tag":"l","s":"千葉県観光物産協会「まるちば」香取神宮"},{"title":{"ja":"鋸山 日本寺","en":"Nokogiriyama Nihon-ji"},"text":{"ja":"日本寺は、725年に聖武天皇の勅詔を受けた行基が開山したとされる、関東最古の勅願所。鋸山の南斜面にあり、日本最大の磨崖仏や百尺観音像がある。山頂の「地獄のぞき」からは、房総半島や富士山を見渡せる。","en":"Nihon-ji is said to have been opened in 725 by the monk Gyoki on the edict of Emperor Shomu, and is called the Kanto region's oldest imperially-sponsored temple. On Mt. Nokogiri's south slope, it has Japan's largest cliff-carved Buddha and a 100-shaku Kannon. The 'Hell Peek' lookout offers views of the Boso Peninsula and Mt. Fuji."},"tag":"f","s":"千葉県観光物産協会「まるちば」鋸山 日本寺"}]},"food":{"title":{"ja":"名物：落花生","en":"Specialty: Peanuts"},"text":{"ja":"千葉県は、落花生の産地として知られる。ゆでたり、煎ったり、味わい方が多い。","en":"Chiba is known for peanuts, enjoyed boiled, roasted and in many other ways."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"千葉県で有名な作物は？","en":"Which crop is Chiba famous for?"},"c":[{"ja":"落花生","en":"Peanuts"},{"ja":"みかん","en":"Mandarins"},{"ja":"りんご","en":"Apples"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：房総の海の幸","en":"Local eats: Boso seafood"},"text":{"ja":"房総半島は、海の幸が豊か。「なめろう」は、魚をたたいて味噌などで和えた漁師の料理として知られる。","en":"The Boso Peninsula is rich in seafood. 'Namero' is a fishermen's dish of minced fish mixed with miso and other seasonings."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"魚をたたいて味噌で和える、漁師の料理は？","en":"Which fishermen's dish is minced fish mixed with miso?"},"c":[{"ja":"なめろう","en":"Namero"},{"ja":"ぬた","en":"Nuta"},{"ja":"へしこ","en":"Heshiko"}],"a":0},"sake":{"title":{"ja":"お酒：甲子と寿萬亀","en":"Sake: Kinoene and Kotobuki-mangame"},"text":{"ja":"酒々井町の飯沼本家は、江戸時代から続く醸造元で、銘柄は「甲子（きのえね）」。酒蔵見学は要予約。鴨川の亀田酒造は、明治神宮の新嘗祭へ毎年お酒を奉納している全国で唯一の蔵とされる（銘柄は「寿萬亀」）。千葉県酒造組合には、37社が加盟している。味わいの記述は未確認。※お酒は20歳になってから。","en":"Iinuma Honke in Shisui has brewed since the Edo period; its brand is 'Kinoene'. Brewery tours need a booking. Kameda Shuzo in Kamogawa is said to be the only brewery that offers sake every year at Meiji Jingu's Niinamesai (brand: 'Kotobuki-mangame'). 37 companies belong to the Chiba brewers' association. Tasting notes unconfirmed. *Drinking is for adults only."},"tag":"f","s":"千葉県観光物産協会「まるちば」酒蔵紹介","q":{"ja":"明治神宮に毎年お酒を奉納しているとされる、千葉の蔵は？","en":"Which Chiba brewery offers sake yearly at Meiji Jingu?"},"c":[{"ja":"亀田酒造","en":"Kameda Shuzo"},{"ja":"飯沼本家","en":"Iinuma Honke"},{"ja":"守屋酒造","en":"Moriya Shuzo"}],"a":0},"history":{"title":{"ja":"歴史：伊能忠敬","en":"History: Ino Tadataka"},"text":{"ja":"伊能忠敬（1745〜1818）は、いまの千葉県の佐原などで商人として働いたのち、日本各地を歩いて測量し、日本地図づくりにとりくんだ人物。","en":"Ino Tadataka (1745–1818) worked as a merchant in Sawara in today's Chiba, then walked across Japan surveying the land to make maps of the country."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"日本各地を歩いて測量した人物は？","en":"Who walked across Japan surveying for a map?"},"c":[{"ja":"伊能忠敬","en":"Ino Tadataka"},{"ja":"間宮林蔵","en":"Mamiya Rinzo"},{"ja":"坂本龍馬","en":"Sakamoto Ryoma"}],"a":0},"kenmin":{"title":{"ja":"のんびり温暖な房総","en":"Easygoing Boso"},"text":{"ja":"温暖な気候の房総は、おおらかで、のんびりしていると、よく言われる（俗説）。","en":"With its mild climate, Boso is often said to be relaxed and easygoing (folk image)."},"tag":"k","s":"俗説・出典未確認","q":null},"matsuri":{"title":{"ja":"佐原の大祭","en":"Sawara Grand Festival"},"text":{"ja":"佐原の大祭は、夏（7月10日以降の金・土・日、八坂神社の祇園祭）と秋（10月第2土曜を中日とする金・土・日、諏訪神社の秋祭り）に行われる。山車は、夏が10台、秋が14台で、合わせて24台。2004年に、国の重要無形民俗文化財に指定された。関東三大山車祭りの一つとされ、約300年の伝統がある。","en":"Sawara's festival is held in summer (Fri–Sun from 10 July onward, Yasaka Shrine) and autumn (Fri–Sun centred on the 2nd Saturday of October, Suwa Shrine). There are 10 floats in summer and 14 in autumn — 24 in all. It was designated a national Important Intangible Folk Cultural Property in 2004, is counted among the Kanto region's three great float festivals, and has about 300 years of tradition."},"tag":"f","s":"香取市公式「佐原の大祭とは」","q":{"ja":"佐原の大祭の山車は、全部で何台？","en":"How many floats are there in all?"},"c":[{"ja":"24台","en":"24"},{"ja":"6台","en":"6"},{"ja":"100台","en":"100"}],"a":0,"more":[{"title":{"ja":"成田祇園祭","en":"Narita Gion Festival"},"text":{"ja":"成田祇園祭は、約300年の歴史がある。2026年は7月10日～12日で、成田山新勝寺と表参道が中心。10台の山車・屋台が各町を飾り、「総引き」では、山車が仲町の急坂を一斉に駆け上がる。","en":"The Narita Gion Festival has a history of about 300 years. In 2026 it ran 10–12 July, centred on Naritasan Shinshoji and its approach. Ten floats and festival carts from the districts take part, and in the 'Sobiki' they surge up a steep slope in Nakacho."},"tag":"f","s":"千葉県観光物産協会「まるちば」成田祇園祭"},{"title":{"ja":"勝浦ビッグひな祭り","en":"Katsuura Big Hina Festival"},"text":{"ja":"勝浦のひな祭りでは、遠見岬神社の60段の階段に、約1,800体のひな人形が並ぶ。※この数は、遠見岬神社の説明によるもので、祭り全体の数ではない。","en":"In Katsuura's Hina Festival, about 1,800 hina dolls fill the 60 steps of Tomimisaki Shrine. *This figure is from the shrine's description, not the festival total."},"tag":"f","s":"千葉県観光物産協会「まるちば」遠見岬神社"}]},"person":{"title":{"ja":"伊能忠敬","en":"Ino Tadataka"},"text":{"ja":"伊能忠敬は、1745年に九十九里町で生まれ、佐原の伊能家で約33年を過ごした。55歳で測量を始め、全国測量の旅は、約17年、歩いた距離は約4万km。地図『大日本沿海輿地全図』は、忠敬の死の3年後に完成した。※資料では、1818年に73歳で亡くなったとあり、年数の数え方に差がある。","en":"Ino Tadataka was born in 1745 in Kujukuri and spent about 33 years in the Ino family of Sawara. He began surveying at 55; his nationwide surveys took about 17 years and some 40,000 km on foot. The map 'Dai Nihon Enkai Yochi Zenzu' was completed three years after his death. *The source also says he died in 1818 aged 73, so the year count differs by about one."},"tag":"f","s":"千葉県観光物産協会「まるちば」伊能忠敬の知られざる生涯","q":{"ja":"伊能忠敬が全国測量で歩いた距離は、約何km？","en":"About how far did Ino Tadataka walk during his surveys?"},"c":[{"ja":"約4万km","en":"About 40,000 km"},{"ja":"約400km","en":"About 400 km"},{"ja":"約4,000km","en":"About 4,000 km"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：ぬれ煎餅（銚子電鉄）","en":"Souvenir: Nure Senbei (Choshi Electric Railway)"},"text":{"ja":"銚子電鉄は、副業のぬれ煎餅で、経営の危機を乗り越えてきた。2014年6月には、新工場が稼働し、「ぬれ煎餅駅」が開業した。","en":"The Choshi Electric Railway weathered financial crises thanks to its side business of 'nure senbei' (moist rice crackers). In June 2014 a new factory opened along with the 'Nure Senbei Station' shop."},"tag":"f","s":"銚子電気鉄道公式「銚電ストーリー」","q":{"ja":"銚子電鉄の経営を支えた副業は？","en":"Which side business supported the Choshi Electric Railway?"},"c":[{"ja":"ぬれ煎餅","en":"Nure senbei"},{"ja":"駅弁","en":"Station bento"},{"ja":"温泉","en":"Hot springs"}],"a":0},"famous":{"title":{"ja":"千葉県と言えば","en":"Known for"},"text":{"ja":"・東京ディズニーリゾート\n・成田山新勝寺\n・成田のうなぎ\n・落花生\n・鴨川シーワールド","en":"• Tokyo Disney Resort\n• Naritasan Shinshoji\n• Narita unagi\n• Peanuts\n• Kamogawa Sea World"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"千葉県の町","en":"Towns of Chiba"},"text":{"ja":"千葉　県庁所在地・海辺の都市\n成田　空港と成田山\n浦安　東京ディズニーリゾートがある\n銚子　漁港と灯台、海の幸\n香取（佐原）　水辺の古い町並み\n館山　南房総の海と花\n鴨川　海と水族館\n木更津　東京湾アクアライン","en":"Chiba – Prefectural capital by the bay\nNarita – The airport and Naritasan\nUrayasu – Home of Tokyo Disney Resort\nChoshi – Fishing port, lighthouse, seafood\nKatori (Sawara) – Old waterside streets\nTateyama – Sea and flowers of south Boso\nKamogawa – Sea and an aquarium\nKisarazu – Tokyo Bay Aqua-Line"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"千葉","en":"Chiba"},"ll":[35.607,140.106],"w":{"ja":"県庁所在地・海辺の都市","en":"Prefectural capital by the bay"}},{"n":{"ja":"成田","en":"Narita"},"ll":[35.776,140.318],"w":{"ja":"空港と成田山","en":"The airport and Naritasan"}},{"n":{"ja":"浦安","en":"Urayasu"},"ll":[35.654,139.902],"w":{"ja":"東京ディズニーリゾートがある","en":"Home of Tokyo Disney Resort"}},{"n":{"ja":"銚子","en":"Choshi"},"ll":[35.734,140.827],"w":{"ja":"漁港と灯台、海の幸","en":"Fishing port, lighthouse, seafood"}},{"n":{"ja":"香取（佐原）","en":"Katori (Sawara)"},"ll":[35.887,140.499],"w":{"ja":"水辺の古い町並み","en":"Old waterside streets"}},{"n":{"ja":"館山","en":"Tateyama"},"ll":[34.997,139.87],"w":{"ja":"南房総の海と花","en":"Sea and flowers of south Boso"}},{"n":{"ja":"鴨川","en":"Kamogawa"},"ll":[35.115,140.1],"w":{"ja":"海と水族館","en":"Sea and an aquarium"}},{"n":{"ja":"木更津","en":"Kisarazu"},"ll":[35.376,139.917],"w":{"ja":"東京湾アクアライン","en":"Tokyo Bay Aqua-Line"}}]},{"id":"ibaraki","ja":"茨城県","en":"Ibaraki","ll":[36.366,140.447],"cap":{"ja":"水戸市","en":"Mito City"},"intro":{"ja":"テンジン「水戸いうたら、あの御老公やな。」\nアマテ「納豆も、梅も、お酒も、楽しみです。」","en":"Tenjin: \"Mito... home of the famous old lord, isn't it?\"\nAmate: \"Natto, plum blossoms and sake — I'm looking forward to all of them.\""},"topics":{"cap":{"title":{"ja":"県庁所在地：水戸市","en":"Prefectural capital: Mito City"},"text":{"ja":"茨城県の県庁所在地は、水戸市。江戸時代には、水戸徳川家の城下町だった。","en":"The capital of Ibaraki is Mito City, once the castle town of the Mito branch of the Tokugawa family."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"茨城県の県庁所在地は？","en":"What is the capital of Ibaraki?"},"c":[{"ja":"水戸市","en":"Mito City"},{"ja":"つくば市","en":"Tsukuba"},{"ja":"土浦市","en":"Tsuchiura"}],"a":0},"shrine":{"title":{"ja":"鹿島神宮","en":"Kashima Jingu"},"text":{"ja":"鹿島神宮は、常陸国の一宮として知られる古い神社。境内の「要石」は、地震を抑える石だと語り継がれてきた（伝承）。","en":"Kashima Jingu is an ancient shrine known as the Ichinomiya of Hitachi Province. The 'Kaname-ishi' stone in its grounds is traditionally said to hold down earthquakes (folklore)."},"tag":"l","s":"伝承（要石）。一宮であることは出典未確認","q":{"ja":"鹿島神宮の「要石」は、何を抑えると伝わる？","en":"What does Kashima's 'Kaname-ishi' stone traditionally hold down?"},"c":[{"ja":"地震","en":"Earthquakes"},{"ja":"洪水","en":"Floods"},{"ja":"火事","en":"Fires"}],"a":0,"more":[{"title":{"ja":"筑波山神社","en":"Tsukuba Shrine"},"text":{"ja":"筑波山神社は、筑波山そのものを御神体とする。男体山（871m）と女体山（877m）の山頂に、イザナギとイザナミを祀る本殿がある。古くから信仰の山で、朝夕に山肌の色が変わることから「紫峰」とも呼ばれる。","en":"Tsukuba Shrine regards Mt. Tsukuba itself as its sacred body. Shrines to Izanagi and Izanami stand on the summits of Nantai (871 m) and Nyotai (877 m). The mountain has long been revered and is also called 'Shiho' (purple peak) for the colours it takes at dawn and dusk."},"tag":"x","s":"Go Local Travel Japan「筑波山神社」（旅行情報サイト。公式は未確認）"},{"title":{"ja":"大洗磯前神社","en":"Oarai Isosaki Shrine"},"text":{"ja":"大洗磯前神社は、856年に大己貴命と少彦名命が降り立ったことが創建のきっかけとされる。海辺の岩礁「神磯」の上に鳥居が立つ。茅葺きの本殿があり、水戸藩主・徳川光圀の命で造られ、1730年に竣工した。","en":"Oarai Isosaki Shrine's origin is linked to the descent of Onamuchi and Sukunabikona in 856. A torii stands on the offshore rocks called 'Kamiiso'. The thatched main hall was built on the order of Mito lord Tokugawa Mitsukuni and completed in 1730."},"tag":"x","s":"Go Local Travel Japan「大洗磯前神社」（旅行情報サイト。公式は未確認）"}]},"food":{"title":{"ja":"名物：水戸納豆","en":"Specialty: Mito natto"},"text":{"ja":"水戸は、納豆の名産地として知られる。小粒の納豆が多いといわれる。","en":"Mito is a famous natto town, often associated with small-bean natto."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"水戸の名産として知られる発酵食品は？","en":"Which fermented food is Mito famous for?"},"c":[{"ja":"納豆","en":"Natto"},{"ja":"味噌煮","en":"Miso stew"},{"ja":"くさや","en":"Kusaya"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：あんこう鍋","en":"Local eats: Monkfish hotpot"},"text":{"ja":"冬の茨城の味として知られるのが、あんこう鍋。大洗や北茨城の港町で親しまれる。","en":"Monkfish hotpot is a winter taste of Ibaraki, enjoyed in port towns such as Oarai and Kitaibaraki."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"茨城の冬の味、あんこう鍋の「あんこう」は？","en":"What is 'ankou' in Ibaraki's winter hotpot?"},"c":[{"ja":"深海の魚","en":"A deep-sea fish"},{"ja":"小豆のあん","en":"Sweet bean paste"},{"ja":"きのこ","en":"A mushroom"}],"a":0},"sake":{"title":{"ja":"お酒：一品と副将軍（水戸）","en":"Sake: Ippin and Fukushogun (Mito)"},"text":{"ja":"茨城県酒造組合には、35の蔵が加盟している。水戸の吉久保酒造「一品」は、水戸黄門ゆかりの水を使った「旨辛口」。同じ水戸の明利酒類には、「副将軍」がある。つくばの浦里酒造店「霧筑波」は、小川酵母を使った淡麗な味わいとされる。※お酒は20歳になってから。","en":"35 breweries belong to the Ibaraki brewers' association. Yoshikubo Shuzo's 'Ippin' in Mito is 'umakarakuchi' (dry but flavourful), using water tied to Mito Komon. Meiri Shurui, also in Mito, makes 'Fukushogun'. 'Kiritsukuba' from Urasato Shuzo in Tsukuba is described as light and clean, brewed with Ogawa yeast. *Drinking is for adults only."},"tag":"f","s":"茨城県「いばらきの地酒特集2025」（県公式ページ）","q":{"ja":"水戸黄門ゆかりの水を使う「旨辛口」の酒は？","en":"Which sake is 'umakarakuchi' using water tied to Mito Komon?"},"c":[{"ja":"一品","en":"Ippin"},{"ja":"霧筑波","en":"Kiritsukuba"},{"ja":"天青","en":"Tensei"}],"a":0},"history":{"title":{"ja":"歴史：水戸藩と徳川光圀","en":"History: Mito domain and Tokugawa Mitsukuni"},"text":{"ja":"徳川光圀は、水戸藩の2代藩主で、のちに「水戸黄門」として物語に親しまれた。偕楽園は、水戸藩の9代藩主・徳川斉昭が、1842年に開いた庭園として知られる。","en":"Tokugawa Mitsukuni was the 2nd lord of Mito, later beloved as 'Mito Komon' in stories. Kairakuen garden is known as opened in 1842 by the 9th lord, Tokugawa Nariaki."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"偕楽園を開いた水戸藩9代藩主は？","en":"Which 9th lord of Mito opened Kairakuen?"},"c":[{"ja":"徳川斉昭","en":"Tokugawa Nariaki"},{"ja":"徳川光圀","en":"Tokugawa Mitsukuni"},{"ja":"徳川慶喜","en":"Tokugawa Yoshinobu"}],"a":0},"kenmin":{"title":{"ja":"水戸っぽ","en":"Mitoppo"},"text":{"ja":"水戸の人は、「水戸っぽ」と呼ばれ、正義感が強く、一本気で、議論を好むと言われてきた（俗説。水戸藩の学問の伝統と結びつけて語られることが多い）。","en":"People of Mito have been called 'Mitoppo' — said to have a strong sense of justice, a single-minded streak and a love of debate (folk image, often linked to Mito's scholarly tradition)."},"tag":"k","s":"俗説・出典未確認","q":null},"matsuri":{"title":{"ja":"水戸の梅まつり","en":"Mito Plum Festival"},"text":{"ja":"偕楽園の「水戸の梅まつり」は、今年は2月11日から3月22日まで（第130回の記念）。偕楽園には約100品種・3,000本の梅がある。日本三名園の一つで、創設者は徳川斉昭。","en":"Kairakuen's Mito Plum Festival runs from 11 February to 22 March this year (its 130th). The garden has about 100 varieties and 3,000 plum trees. It is one of Japan's Three Great Gardens, founded by Tokugawa Nariaki."},"tag":"f","s":"茨城県「いばらきの梅満喫特集2026」（県公式）","q":{"ja":"偕楽園の梅は、約何本？","en":"About how many plum trees are in Kairakuen?"},"c":[{"ja":"3,000本","en":"3,000"},{"ja":"30本","en":"30"},{"ja":"30万本","en":"300,000"}],"a":0,"more":[{"title":{"ja":"日立風流物","en":"Hitachi Furyumono"},"text":{"ja":"日立風流物は、神峰神社の大祭典で、4つの町から1台ずつ山車が出る。五層の屋形が中央から割れて、からくり人形芝居が演じられる。1977年に国の重要無形民俗文化財に指定され、ユネスコ無形文化遺産にも記載された。公開日は、毎年5月3～5日。","en":"The Hitachi Furyumono is part of Kamine Shrine's grand festival: four districts each bring a float whose five-tier hall splits open for a mechanical puppet play. It was designated a national Important Intangible Folk Cultural Property in 1977 and is inscribed on UNESCO's Intangible Cultural Heritage list. It is shown each year on 3–5 May."},"tag":"f","s":"文化庁「国指定文化財等データベース」日立風流物"},{"title":{"ja":"土浦全国花火競技大会","en":"Tsuchiura All-Japan Fireworks Competition"},"text":{"ja":"土浦全国花火競技大会は、1925年（大正14年）、霞ヶ浦海軍航空隊の殉職者の慰霊と土浦の経済振興のために、神龍寺の秋元梅峯住職が始めたとされる。いまは、全国の花火師が腕を競う競技会として開かれる。","en":"The Tsuchiura All-Japan Fireworks Competition began in 1925, started by Shinryuji priest Akimoto Baiho to console the war dead of the Kasumigaura Naval Air Group and to boost Tsuchiura's economy. Today it is a contest in which fireworks makers from across Japan compete."},"tag":"f","s":"土浦市公式資料「土浦全国花火競技大会」"}]},"person":{"title":{"ja":"徳川光圀","en":"Tokugawa Mitsukuni"},"text":{"ja":"徳川光圀は、水戸藩の2代藩主。1657年（明暦3年）、世子の時代に史局（のちの彰考館）を開き、国史の編纂を始めた。これが『大日本史』で、完成は1906年（明治39年）、402巻。南朝を正統とするなど光圀の史観を反映し、幕末の尊皇思想に影響を与えた。","en":"Tokugawa Mitsukuni was the second lord of the Mito domain. In 1657, still heir, he opened a history bureau (later the Shokokan) and began compiling national history — the 'Dai Nihon Shi', completed in 1906 in 402 volumes. It reflects his view of history, including treating the Southern Court as legitimate, and influenced late-Edo imperial loyalism."},"tag":"f","s":"国立公文書館「歴史と物語」徳川光圀","q":{"ja":"光圀が始めた歴史書の名前は？","en":"What is the name of the history Mitsukuni began?"},"c":[{"ja":"大日本史","en":"Dai Nihon Shi"},{"ja":"古事記","en":"Kojiki"},{"ja":"吾妻鏡","en":"Azuma Kagami"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：干しいも","en":"Souvenir: Hoshi-imo"},"text":{"ja":"茨城県は、干しいものシェアが全国トップとされる。主な産地は、ひたちなか市・東海村・那珂市。皮付きのまま蒸して、皮をむき、切って、風通しのよい場所で約1週間天日に干して作る。干しいもの発祥は、静岡県とされる。","en":"Ibaraki holds the top national share of dried sweet potatoes (hoshi-imo). The main areas are Hitachinaka, Tokai and Naka. They are steamed, peeled, sliced and sun-dried for about a week in a breezy spot. Hoshi-imo is said to have originated in Shizuoka."},"tag":"f","s":"農林水産省「うちの郷土料理 干しいも 茨城県」","q":{"ja":"茨城の干しいもの主な産地は？","en":"Which city is a main hoshi-imo area?"},"c":[{"ja":"ひたちなか市","en":"Hitachinaka"},{"ja":"熊谷市","en":"Kumagaya"},{"ja":"前橋市","en":"Maebashi"}],"a":0},"famous":{"title":{"ja":"茨城県と言えば","en":"Known for"},"text":{"ja":"・ひたち海浜公園のネモフィラ\n・偕楽園の梅\n・納豆\n・筑波山\n・鹿島神宮","en":"• Nemophila at Hitachi Seaside Park\n• Plums at Kairakuen\n• Natto\n• Mt. Tsukuba\n• Kashima Jingu"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"茨城県の町","en":"Towns of Ibaraki"},"text":{"ja":"水戸　偕楽園の梅\nつくば　科学の街と筑波山\nひたちなか　ネモフィラの丘\n大洗　海辺の町\n鹿嶋　鹿島神宮\n笠間　焼き物と稲荷神社\n日立　海に面した工業都市","en":"Mito – Plums at Kairakuen\nTsukuba – Science city and Mt. Tsukuba\nHitachinaka – The nemophila hill\nOarai – A seaside town\nKashima – Kashima Jingu\nKasama – Pottery and Inari shrine\nHitachi – A coastal industrial city"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"水戸","en":"Mito"},"ll":[36.366,140.471],"w":{"ja":"偕楽園の梅","en":"Plums at Kairakuen"}},{"n":{"ja":"つくば","en":"Tsukuba"},"ll":[36.083,140.077],"w":{"ja":"科学の街と筑波山","en":"Science city and Mt. Tsukuba"}},{"n":{"ja":"ひたちなか","en":"Hitachinaka"},"ll":[36.397,140.534],"w":{"ja":"ネモフィラの丘","en":"The nemophila hill"}},{"n":{"ja":"大洗","en":"Oarai"},"ll":[36.314,140.576],"w":{"ja":"海辺の町","en":"A seaside town"}},{"n":{"ja":"鹿嶋","en":"Kashima"},"ll":[35.966,140.645],"w":{"ja":"鹿島神宮","en":"Kashima Jingu"}},{"n":{"ja":"笠間","en":"Kasama"},"ll":[36.383,140.303],"w":{"ja":"焼き物と稲荷神社","en":"Pottery and Inari shrine"}},{"n":{"ja":"日立","en":"Hitachi"},"ll":[36.599,140.651],"w":{"ja":"海に面した工業都市","en":"A coastal industrial city"}}]},{"id":"tochigi","ja":"栃木県","en":"Tochigi","ll":[36.566,139.884],"cap":{"ja":"宇都宮市","en":"Utsunomiya City"},"intro":{"ja":"ハチマン「…山の気配がする。」\nミナカタ「宇都宮いうたら、餃子やろ！」","en":"Hachiman: \"...I can feel the mountains.\"\nMinakata: \"Utsunomiya means gyoza, right?!\""},"topics":{"cap":{"title":{"ja":"県庁所在地：宇都宮市","en":"Prefectural capital: Utsunomiya City"},"text":{"ja":"栃木県の県庁所在地は、宇都宮市。県名の「栃木」は、栃木市の名にちなむが、県庁は、宇都宮市にある。","en":"The capital of Tochigi is Utsunomiya City — not Tochigi City, even though the prefecture is named after it."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"栃木県の県庁所在地は？","en":"What is the capital of Tochigi?"},"c":[{"ja":"宇都宮市","en":"Utsunomiya"},{"ja":"栃木市","en":"Tochigi City"},{"ja":"日光市","en":"Nikko"}],"a":0},"shrine":{"title":{"ja":"日光東照宮","en":"Nikko Toshogu"},"text":{"ja":"日光東照宮は、1617年（元和3年）、二代将軍秀忠が、家康の遺言に基づいて東照社を建てたのがはじまり。日光山輪王寺、日光東照宮、日光二荒山神社の「二社一寺」は、1999年に世界遺産に登録された。","en":"Nikko Toshogu began in 1617, when the second shogun Hidetada built Toshosha following Ieyasu's will. The 'two shrines and one temple' — Rinnoji, Toshogu and Futarasan Shrine — became a World Heritage Site in 1999."},"tag":"f","s":"日光市「未来へ届けたい日光」資料","q":{"ja":"日光の二社一寺が世界遺産になった年は？","en":"In what year did Nikko's shrines and temple become a World Heritage Site?"},"c":[{"ja":"1999年","en":"1999"},{"ja":"1964年","en":"1964"},{"ja":"2014年","en":"2014"}],"a":0,"more":[{"title":{"ja":"宇都宮二荒山神社（うつのみやふたあらやまじんじゃ）","en":"Utsunomiya Futaarayama Shrine"},"text":{"ja":"宇都宮二荒山神社は、およそ1600年前、宇都宮の始祖・豊城入彦命を祀るために創建されたと伝わる。宇都宮は、この神社の門前町として栄えた。日光二荒山神社とともに、どちらも下野国一之宮とされる。1月15日の春渡祭と12月15日の冬渡祭は、「おたりや」として有名。","en":"Utsunomiya Futaarayama Shrine is said to have been founded about 1,600 years ago to enshrine Toyokiirihiko, the ancestor of Utsunomiya, which prospered as the shrine's gate town. It and Nikko Futarasan Shrine are both regarded as Ichinomiya of Shimotsuke. Its rites on 15 January and 15 December are famous as 'Otariya'."},"tag":"x","s":"旅行情報サイト「宇都宮二荒山神社」（公式は未確認）"},{"title":{"ja":"日光山輪王寺","en":"Nikko Rinno-ji"},"text":{"ja":"日光山の開山は、勝道上人とされる。勝道は766年に男体山をめざし、麓で中禅寺湖に出会ったと伝わる。のちに円仁が、三仏堂などを建てたとされる。","en":"The founding of Nikko is attributed to the monk Shodo, who is said to have set out for Mt. Nantai in 766 and found Lake Chuzenji at its foot. Ennin later built the Sanbutsu-do and other halls."},"tag":"l","s":"国土交通省「多言語解説文データベース」日光山"}]},"food":{"title":{"ja":"名物：宇都宮餃子","en":"Specialty: Utsunomiya gyoza"},"text":{"ja":"宇都宮は、餃子の街として知られる。焼き餃子や水餃子など、食べ方もいろいろ。","en":"Utsunomiya is known as a gyoza town, with pan-fried, boiled and many other styles."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"宇都宮が名物にしている料理は？","en":"Which dish is Utsunomiya known for?"},"c":[{"ja":"餃子","en":"Gyoza"},{"ja":"たこ焼き","en":"Takoyaki"},{"ja":"ラーメンだけ","en":"Only ramen"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：日光ゆば","en":"Local eats: Nikko yuba"},"text":{"ja":"日光は、湯葉の産地としても知られる。精進料理の流れをくむとされる。（日光市の資料には、記述が見つからなかった：未確認）","en":"Nikko is also known for yuba (tofu skin), said to descend from temple cuisine. (We could not find it in Nikko City's material: unconfirmed.)"},"tag":"x","s":"出典未確認（日光市資料には記述なし）","q":{"ja":"日光の名物とされる、豆乳の膜から作る食材は？","en":"Which Nikko food is made from the skin of soy milk?"},"c":[{"ja":"湯葉","en":"Yuba"},{"ja":"寒天","en":"Kanten"},{"ja":"こんにゃく","en":"Konnyaku"}],"a":0},"sake":{"title":{"ja":"お酒：栃木の酒づくり","en":"Sake: brewing in Tochigi"},"text":{"ja":"栃木県の資料は、栃木の酒づくりを、江戸時代に関西から持ち込まれた技が、酒造組合や杜氏組合を中心に独自に発展したものと説明する。新しい技術を受け入れてきた歴史がある、ともいう。個別の銘柄と味わいは、確認できなかった（未確認）。※お酒は20歳になってから。","en":"A Tochigi prefectural document explains that brewing came from the Kansai region in the Edo period and developed in its own way around brewers' and master-brewers' guilds, with a history of welcoming new techniques. Individual brands and tasting notes were not confirmed. *Drinking is for adults only."},"tag":"f","s":"栃木県「酒蔵飲み比べ」案内資料（県公式PDF）。銘柄は未確認","q":{"ja":"栃木の酒づくりの技は、江戸時代にどこから持ち込まれたと説明される？","en":"Where did Tochigi's brewing techniques come from in the Edo period?"},"c":[{"ja":"関西","en":"Kansai"},{"ja":"北海道","en":"Hokkaido"},{"ja":"九州","en":"Kyushu"}],"a":0},"history":{"title":{"ja":"歴史：家康と日光","en":"History: Ieyasu and Nikko"},"text":{"ja":"徳川家康の遺言に基づき、1617年に、日光に東照社が建てられた。日光は、徳川家の聖地となった。","en":"Following Tokugawa Ieyasu's will, Toshosha was built at Nikko in 1617, and Nikko became a sacred place of the Tokugawa."},"tag":"f","s":"日光市「未来へ届けたい日光」資料","q":{"ja":"日光に東照社を建てたのは、誰の遺言に基づく？","en":"Whose will led to the building of Toshosha at Nikko?"},"c":[{"ja":"徳川家康","en":"Tokugawa Ieyasu"},{"ja":"豊臣秀吉","en":"Toyotomi Hideyoshi"},{"ja":"武田信玄","en":"Takeda Shingen"}],"a":0},"kenmin":{"title":{"ja":"おだやかな北関東","en":"Mellow northern Kanto"},"text":{"ja":"栃木の人は、おだやかで、まじめだと、よく言われる（俗説）。夏の雷の多さも、土地の個性として知られる。","en":"People of Tochigi are often said to be mild-mannered and earnest (folk image). Frequent summer thunderstorms are another local trademark."},"tag":"k","s":"俗説・出典未確認","q":null},"matsuri":{"title":{"ja":"日光東照宮 春季例大祭","en":"Nikko Toshogu Spring Grand Festival"},"text":{"ja":"日光東照宮の春季例大祭は、5月17日に例祭と神事流鏑馬、5月18日に渡御祭「百物揃千人武者行列」が行われる。行列は、鎧武者など53種類・1,200余名がご奉仕する。","en":"At Nikko Toshogu's spring festival, the main rite and yabusame take place on 17 May, and the 'Hyakumono-zoroi Sennin Musha Gyoretsu' procession on 18 May, with armoured warriors and others — 53 kinds, over 1,200 people."},"tag":"f","s":"日光東照宮公式「祭典行事」","q":{"ja":"千人武者行列が行われるのは、5月何日？","en":"On which May date is the warrior procession held?"},"c":[{"ja":"18日","en":"18th"},{"ja":"1日","en":"1st"},{"ja":"31日","en":"31st"}],"a":0,"more":[{"title":{"ja":"烏山の山あげ祭","en":"Karasuyama Yamaage Festival"},"text":{"ja":"烏山の山あげ祭は、毎年7月の第4土曜日を含む金・土・日に開かれる。道路の上に長さ100mにもなる舞台を作り、烏山和紙の背景を、舞台の進行に合わせて変える野外劇。460年以上の歴史があり、国の重要無形民俗文化財、ユネスコ無形文化遺産になっている。","en":"The Karasuyama Yamaage Festival runs over the Friday–Sunday including the 4th Saturday of July. A stage up to 100 m long is built on the road for an open-air play whose Karasuyama-washi backdrops change as the story advances. With over 460 years of history, it is a national Important Intangible Folk Cultural Property and on UNESCO's list."},"tag":"f","s":"栃木県観光物産協会パンフレット「山あげ祭」"},{"title":{"ja":"日光 弥生祭","en":"Nikko Yayoi Festival"},"text":{"ja":"日光二荒山神社の弥生祭は、毎年4月13日～17日。767年から770年に始まるといわれる。旧暦3月に行われたため「弥生祭」と呼ばれる。4月17日の大祭には、ヤシオツツジの造花で飾った花家体12台が出る。","en":"The Yayoi Festival of Nikko Futarasan Shrine is held each 13–17 April and is said to date from 767–770. It was held in the third lunar month ('yayoi'), hence the name. On the main day, 17 April, twelve floats decorated with artificial yashio azaleas take part."},"tag":"x","s":"旅行情報サイト「日光 弥生祭」（公式は未確認）"}]},"person":{"title":{"ja":"徳川家康と日光東照宮","en":"Tokugawa Ieyasu and Nikko Toshogu"},"text":{"ja":"日光東照宮は、1617年（元和3年）、二代将軍・秀忠が、徳川家康の遺言に基づいて東照社を建てたのがはじまり。※家康が江戸幕府を開いた初代将軍であることは、一般的な歴史知識で、出典は未確認。","en":"Nikko Toshogu began in 1617 (Genna 3) when the second shogun, Hidetada, built Toshosha following the will of Tokugawa Ieyasu. *That Ieyasu founded the Edo shogunate as its first shogun is general historical knowledge, not source-checked here."},"tag":"f","s":"日光市「未来へ届けたい日光」資料","q":{"ja":"日光東照宮のはじまりは、何年？","en":"In what year did Nikko Toshogu begin?"},"c":[{"ja":"1617年","en":"1617"},{"ja":"1868年","en":"1868"},{"ja":"1185年","en":"1185"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：益子焼","en":"Souvenir: Mashiko ware"},"text":{"ja":"益子の陶芸の歴史は、奈良時代にさかのぼるとされる。いまの益子焼のルーツは、江戸期に日用品として作られた、かめや土瓶。大正期に濱田庄司が入り、「用の美」を見直す民芸運動を実践した。厚手で、素朴で力強い美しさが特徴。陶器市は、毎年、春と秋の年2回。","en":"Pottery in Mashiko is said to go back to the Nara period. Today's Mashiko ware traces to everyday jars and teapots made in the Edo period. In the Taisho era Hamada Shoji arrived and practised the Mingei movement, which reappraised the 'beauty of use'. It is typically thick and has a simple, sturdy beauty. Pottery fairs are held twice a year, spring and autumn."},"tag":"f","s":"栃木県公式「陶芸の町 益子」","q":{"ja":"益子の陶器市は、年に何回？","en":"How many times a year are Mashiko pottery fairs held?"},"c":[{"ja":"2回","en":"Twice"},{"ja":"1回","en":"Once"},{"ja":"12回","en":"Monthly"}],"a":0},"famous":{"title":{"ja":"栃木県と言えば","en":"Known for"},"text":{"ja":"・日光東照宮\n・いちご\n・宇都宮餃子\n・那須高原\n・益子焼","en":"• Nikko Toshogu\n• Strawberries\n• Utsunomiya gyoza\n• Nasu Highlands\n• Mashiko pottery"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"栃木県の町","en":"Towns of Tochigi"},"text":{"ja":"宇都宮　餃子の街\n日光　東照宮と山の自然\n那須　高原と温泉\n足利　古い学校と花の公園\n益子　陶器の町\n佐野　ラーメンとアウトレット\n栃木　蔵の町並み","en":"Utsunomiya – The gyoza city\nNikko – Toshogu and mountain nature\nNasu – Highlands and hot springs\nAshikaga – An old school and flower park\nMashiko – Pottery town\nSano – Ramen and outlets\nTochigi – Warehouse streets"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"宇都宮","en":"Utsunomiya"},"ll":[36.555,139.883],"w":{"ja":"餃子の街","en":"The gyoza city"}},{"n":{"ja":"日光","en":"Nikko"},"ll":[36.75,139.599],"w":{"ja":"東照宮と山の自然","en":"Toshogu and mountain nature"}},{"n":{"ja":"那須","en":"Nasu"},"ll":[37.02,140.13],"w":{"ja":"高原と温泉","en":"Highlands and hot springs"}},{"n":{"ja":"足利","en":"Ashikaga"},"ll":[36.34,139.45],"w":{"ja":"古い学校と花の公園","en":"An old school and flower park"}},{"n":{"ja":"益子","en":"Mashiko"},"ll":[36.466,140.092],"w":{"ja":"陶器の町","en":"Pottery town"}},{"n":{"ja":"佐野","en":"Sano"},"ll":[36.314,139.578],"w":{"ja":"ラーメンとアウトレット","en":"Ramen and outlets"}},{"n":{"ja":"栃木","en":"Tochigi"},"ll":[36.383,139.733],"w":{"ja":"蔵の町並み","en":"Warehouse streets"}}]},{"id":"gunma","ja":"群馬県","en":"Gunma","ll":[36.391,139.061],"cap":{"ja":"前橋市","en":"Maebashi City"},"intro":{"ja":"イナリ「山、山、山や！ 空っ風が吹いとるで！」\nテンジン「ここは、群馬。温泉と、絹の国やな。」","en":"Inari: \"Mountains everywhere! The dry wind is blowing!\"\nTenjin: \"Gunma — a land of hot springs and silk.\""},"topics":{"cap":{"title":{"ja":"県庁所在地：前橋市","en":"Prefectural capital: Maebashi City"},"text":{"ja":"群馬県の県庁所在地は、前橋市。高崎市と並ぶ、県の中心の街。","en":"The capital of Gunma is Maebashi City, a central city alongside Takasaki."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"群馬県の県庁所在地は？","en":"What is the capital of Gunma?"},"c":[{"ja":"前橋市","en":"Maebashi"},{"ja":"高崎市","en":"Takasaki"},{"ja":"太田市","en":"Ota"}],"a":0},"shrine":{"title":{"ja":"榛名神社と高崎の達磨寺","en":"Haruna Shrine and Takasaki's Daruma temple"},"text":{"ja":"榛名山の麓の榛名神社は、山の神を祀る古い神社。高崎の少林山達磨寺は、縁起物の「高崎だるま」で知られる。（寺社の由緒は、公式資料の確認ができていない：未確認）","en":"Haruna Shrine at the foot of Mt. Haruna is an old mountain shrine. Shorinzan Daruma-ji in Takasaki is known for the lucky 'Takasaki daruma' dolls. (Their histories were not checked against official sources: unconfirmed.)"},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"高崎の達磨寺で知られる縁起物は？","en":"Which lucky charm is Takasaki's Daruma temple known for?"},"c":[{"ja":"高崎だるま","en":"Takasaki daruma"},{"ja":"こけし","en":"Kokeshi"},{"ja":"招き猫","en":"Maneki-neko"}],"a":0,"more":[{"title":{"ja":"一之宮貫前神社","en":"Nukisaki Shrine"},"text":{"ja":"貫前神社は、上野国一之宮。祭神は、経津主神と姫大神。参道は石段を上がったあと、石段を下って楼門と本殿へ至る、全国的にも珍しい「下り宮」の形。現在の社殿は、1635年に徳川家光が造営させたと記される。","en":"Nukisaki Shrine is the Ichinomiya of Kozuke Province, enshrining Futsunushi and Hime no Okami. Its approach climbs stone steps and then descends to the tower gate and main hall, a 'downhill shrine' rare in Japan. The present buildings are recorded as built in 1635 under Tokugawa Iemitsu."},"tag":"x","s":"参拝記サイト「神社と古事記」一之宮貫前神社（公式は未確認）"},{"title":{"ja":"妙義神社","en":"Myogi Shrine"},"text":{"ja":"妙義神社は、妙義山の主峰・白雲山の東のふもとにあり、日本武尊を祀る。本殿・幣殿・拝殿は、1756年の建築で、国の重要文化財（1981年指定）。彫刻や漆塗りの華麗な建物で、日光の建築を考えるうえでも重要とされる。","en":"Myogi Shrine stands at the eastern foot of Mt. Hakuun, the main peak of Myogi, and enshrines Yamato Takeru. Its main, linking and worship halls (built 1756) are national Important Cultural Properties (designated 1981), richly carved and lacquered, and considered important for understanding Nikko's architecture."},"tag":"f","s":"文化庁「国指定文化財等データベース」妙義神社"}]},"food":{"title":{"ja":"名物：焼きまんじゅう","en":"Specialty: Yaki-manju"},"text":{"ja":"焼きまんじゅうは、串に刺したまんじゅうを、味噌だれで焼いた、群馬の味。","en":"Yaki-manju is a Gunma treat: skewered steamed buns grilled with a sweet miso glaze."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"焼きまんじゅうに塗る、たれは？","en":"What sauce is brushed on yaki-manju?"},"c":[{"ja":"味噌だれ","en":"Miso glaze"},{"ja":"ソース","en":"Worcestershire sauce"},{"ja":"カレー","en":"Curry"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：うどん","en":"Local eats: udon"},"text":{"ja":"群馬は、うどんの盛んな土地として知られる。桐生のひもかわや、渋川の水沢うどんなどが知られる。","en":"Gunma is a land of udon, known for Kiryu's ribbon-wide 'himokawa' and Shibukawa's Mizusawa udon."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"ひもかわうどんで知られる、群馬の街は？","en":"Which Gunma town is known for himokawa udon?"},"c":[{"ja":"桐生","en":"Kiryu"},{"ja":"草津","en":"Kusatsu"},{"ja":"館林","en":"Tatebayashi"}],"a":0},"sake":{"title":{"ja":"お酒：群馬泉と桂川","en":"Sake: Gunma Izumi and Katsuragawa"},"text":{"ja":"群馬県の品評会では、太田市の島岡酒造「群馬泉」、前橋市の栁澤酒造「桂川」、町田酒造店「清嘹」、高崎市の牧野酒造「榛名山」などが優等賞を受けた（第50回）。特徴の記述は、確認できなかった（未確認）。※お酒は20歳になってから。","en":"At the prefectural sake competition (50th), 'Gunma Izumi' (Shimaoka Shuzo, Ota), 'Katsuragawa' (Yanagisawa Shuzo, Maebashi), 'Seiryo' (Machida Shuzo) and 'Harunasan' (Makino Shuzo, Takasaki) won top prizes. Tasting notes were not confirmed. *Drinking is for adults only."},"tag":"f","s":"群馬県「群馬の日本酒」品評会結果ページ（県公式）","q":{"ja":"太田市の島岡酒造の銘柄は？","en":"Which brand does Shimaoka Shuzo in Ota make?"},"c":[{"ja":"群馬泉","en":"Gunma Izumi"},{"ja":"桂川","en":"Katsuragawa"},{"ja":"榛名山","en":"Harunasan"}],"a":0},"history":{"title":{"ja":"歴史：富岡製糸場","en":"History: Tomioka Silk Mill"},"text":{"ja":"1872年に開かれた富岡製糸場は、日本の近代化を支えた製糸工場。2014年に世界遺産に登録された（登録年は出典未確認）。","en":"The Tomioka Silk Mill, opened in 1872, helped drive Japan's modernization. It became a World Heritage Site in 2014 (date unconfirmed)."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"富岡製糸場が開かれた年は？","en":"In what year did the Tomioka Silk Mill open?"},"c":[{"ja":"1872年","en":"1872"},{"ja":"1603年","en":"1603"},{"ja":"1945年","en":"1945"}],"a":0},"kenmin":{"title":{"ja":"かかあ天下と空っ風","en":"Kakaa-denka and the dry wind"},"text":{"ja":"「かかあ天下」は、「一家で妻が夫より強い」という意味。群馬では、明治から養蚕・製糸・織物など絹産業の中心を女性が担い、女性が働き者で、男性も家事に加わるのが当たり前だったため、そう呼ばれて名物になったと考えられている（諸説あり）。平成27年、文化庁の日本遺産に「かかあ天下―ぐんまの絹物語―」が選ばれた。いまは、働き者の妻をたたえる言葉として受けとめることもできる。","en":"'Kakaa-denka' means a household where the wife is the stronger one. In Gunma, women were central to the silk trades from the Meiji era, working hard while men also shared housework — which is thought to be why Gunma became known for it (several views exist). In 2015 'Kakaa-denka: Gunma's Silk Story' was designated a Japan Heritage story. Today it can be read as praise for hard-working wives."},"tag":"f","s":"群馬県公式ページ「かかあ天下」","q":null},"matsuri":{"title":{"ja":"高崎だるま市","en":"Takasaki Daruma Market"},"text":{"ja":"高崎市の資料では、高崎だるま市は、1月1日・2日に、高崎駅西口駅前通りで開かれる（資料が紹介した回の日程で、年により変わる可能性がある）。江戸後期には、田町で正月10日に「初市」が開かれ、だるまも売られていたことが、文献に残る。","en":"According to Takasaki City, the Daruma Market is held on 1–2 January along the street in front of Takasaki Station's west exit (the dates given for one edition; they may change by year). Records show that in the late Edo period a 'hatsu-ichi' market on 10 January in Tamachi also sold daruma."},"tag":"f","s":"高崎市公式「高崎だるま（R）の歴史について」","q":{"ja":"高崎だるま市が開かれるのは、何月？","en":"In which month is the Takasaki Daruma Market held?"},"c":[{"ja":"1月","en":"January"},{"ja":"5月","en":"May"},{"ja":"9月","en":"September"}],"a":0,"more":[{"title":{"ja":"渋川へそ祭り","en":"Shibukawa Heso (Navel) Festival"},"text":{"ja":"渋川のへそ祭りは、9月上旬に開かれる。おなかに顔を描いて踊る「腹おどり」が名物で、「おなかをだして、絵を描いて、おどろう」と紹介されている。","en":"The Shibukawa Navel Festival is held in early September. Its famous 'belly dance' has people painting faces on their stomachs and dancing — 'bare your belly, draw a picture, and dance'."},"tag":"f","s":"ググっとぐんま「渋川へそ祭り」（群馬県観光）"},{"title":{"ja":"高崎まつり","en":"Takasaki Festival"},"text":{"ja":"高崎まつりは、8月に開かれる。2024年は8月24日・25日の第50回で、38台の山車が駅前通りを巡行し、神輿渡御もある。大花火大会は、北関東最大級とされ、約1万5,000発が上がる。","en":"The Takasaki Festival is held in August. In 2024 (the 50th, 24–25 August), 38 floats paraded from the station avenue, with a mikoshi procession. The fireworks show, described as among northern Kanto's largest, launched about 15,000 shells."},"tag":"f","s":"高崎市公式資料「高崎まつり」"}]},"person":{"title":{"ja":"ベルツ博士と草津温泉","en":"Dr. Bälz and Kusatsu Onsen"},"text":{"ja":"明治時代に、ドイツ人のベルツ博士は、草津温泉の効能と、温泉保養地としての優れた点を紹介した。その結果、草津は世界的に知られるようになったと伝えられる。","en":"In the Meiji era, the German doctor Erwin Bälz introduced Kusatsu's hot-spring benefits and its merits as a spa resort, and as a result Kusatsu is said to have become known worldwide."},"tag":"x","s":"nippon.com「群馬県 草津温泉」（旅行ガイド記事1件。公式は未確認）","q":{"ja":"草津温泉を世界に紹介したベルツ博士は、どこの国の人？","en":"Which country was Dr. Bälz, who promoted Kusatsu, from?"},"c":[{"ja":"ドイツ","en":"Germany"},{"ja":"フランス","en":"France"},{"ja":"ブラジル","en":"Brazil"}],"a":0},"omiyage":{"title":{"ja":"駅弁：だるま弁当","en":"Ekiben: Daruma Bento"},"text":{"ja":"高崎駅の「だるま弁当」は、昭和35年に販売が始まった。発売当初の容器は瀬戸物で、いまは赤いプラスチック製。中身は、茶飯、山菜きのこ煮、竹の子煮、鶏八幡巻、栗など。価格は、ページでは1,500円（税込）。","en":"Takasaki's 'Daruma Bento' went on sale in 1960 (Showa 35). The container was originally ceramic; now it is red plastic. It holds seasoned rice, simmered mountain vegetables and mushrooms, bamboo shoots, chicken-and-burdock rolls, chestnuts and more. The page lists 1,500 yen including tax."},"tag":"f","s":"たかべん（高崎弁当）公式「だるま弁当」","q":{"ja":"だるま弁当の、発売当初の容器は？","en":"What was the Daruma Bento's original container?"},"c":[{"ja":"瀬戸物","en":"Ceramic"},{"ja":"紙","en":"Paper"},{"ja":"竹","en":"Bamboo"}],"a":0},"famous":{"title":{"ja":"群馬県と言えば","en":"Known for"},"text":{"ja":"・草津温泉の湯畑\n・伊香保温泉の石段\n・富岡製糸場\n・高崎だるま\n・こんにゃく","en":"• Kusatsu's Yubatake\n• Ikaho's stone steps\n• Tomioka Silk Mill\n• Takasaki daruma\n• Konnyaku"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"群馬県の町","en":"Towns of Gunma"},"text":{"ja":"前橋　県庁所在地\n高崎　新幹線の駅とだるま\n草津　湯畑の温泉街\n伊香保　石段の温泉街\n富岡　富岡製糸場\n桐生　織物の古い町並み\n沼田　山あいの城下町","en":"Maebashi – Prefectural capital\nTakasaki – Shinkansen hub and daruma\nKusatsu – Hot-spring town around Yubatake\nIkaho – Stone-step hot-spring town\nTomioka – Tomioka Silk Mill\nKiryu – Old textile-town streets\nNumata – A mountain castle town"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"前橋","en":"Maebashi"},"ll":[36.391,139.061],"w":{"ja":"県庁所在地","en":"Prefectural capital"}},{"n":{"ja":"高崎","en":"Takasaki"},"ll":[36.322,139.003],"w":{"ja":"新幹線の駅とだるま","en":"Shinkansen hub and daruma"}},{"n":{"ja":"草津","en":"Kusatsu"},"ll":[36.622,138.596],"w":{"ja":"湯畑の温泉街","en":"Hot-spring town around Yubatake"}},{"n":{"ja":"伊香保","en":"Ikaho"},"ll":[36.497,138.923],"w":{"ja":"石段の温泉街","en":"Stone-step hot-spring town"}},{"n":{"ja":"富岡","en":"Tomioka"},"ll":[36.259,138.89],"w":{"ja":"富岡製糸場","en":"Tomioka Silk Mill"}},{"n":{"ja":"桐生","en":"Kiryu"},"ll":[36.405,139.332],"w":{"ja":"織物の古い町並み","en":"Old textile-town streets"}},{"n":{"ja":"沼田","en":"Numata"},"ll":[36.645,139.044],"w":{"ja":"山あいの城下町","en":"A mountain castle town"}}]},{"id":"saitama","ja":"埼玉県","en":"Saitama","ll":[35.861,139.646],"cap":{"ja":"さいたま市","en":"Saitama City"},"intro":{"ja":"アマテ「関東の旅も、ここで一区切りですね。」\nイナリ「大宮から、新幹線で北へ向かえるんやな。」","en":"Amate: \"Our Kanto tour comes to a close here.\"\nInari: \"And from Omiya, the Shinkansen heads north!\""},"topics":{"cap":{"title":{"ja":"県庁所在地：さいたま市","en":"Prefectural capital: Saitama City"},"text":{"ja":"埼玉県の県庁所在地は、さいたま市。浦和・大宮などの街からなる。","en":"The capital of Saitama is Saitama City, made up of areas such as Urawa and Omiya."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"埼玉県の県庁所在地は？","en":"What is the capital of Saitama?"},"c":[{"ja":"さいたま市","en":"Saitama City"},{"ja":"川越市","en":"Kawagoe"},{"ja":"熊谷市","en":"Kumagaya"}],"a":0},"shrine":{"title":{"ja":"大宮氷川神社","en":"Omiya Hikawa Shrine"},"text":{"ja":"大宮氷川神社の参道は、南北約2kmにわたる、ケヤキを中心とした並木道。神社は、約1200年前の聖武天皇の御代に武蔵国一宮と定められたとされる。","en":"The approach to Omiya Hikawa Shrine is a tree-lined road about 2 km long, mainly zelkova. The shrine is said to have been designated the Ichinomiya of Musashi Province in the reign of Emperor Shomu, about 1,200 years ago."},"tag":"f","s":"さいたま市「氷川参道のまちづくり」資料","q":{"ja":"氷川参道の長さは、約どれくらい？","en":"About how long is the Hikawa approach?"},"c":[{"ja":"約2km","en":"About 2 km"},{"ja":"約200m","en":"About 200 m"},{"ja":"約20km","en":"About 20 km"}],"a":0,"more":[{"title":{"ja":"秩父神社","en":"Chichibu Shrine"},"text":{"ja":"秩父神社は、崇神天皇の時代の創建とされ、2014年に創建2100年を迎えた。祭神は、八意思兼命・知知夫彦命・天之御中主神・秩父宮雍仁親王の四柱。彫刻に、「子育ての虎」「お元気三猿」「北辰の梟」や、鎖でつながれた龍がある。","en":"Chichibu Shrine is said to date from the reign of Emperor Sujin and marked 2,100 years in 2014. It enshrines four deities. Its carvings include the 'Child-raising Tiger', the 'Three Wise Monkeys', the 'Owl of the Pole Star' and a chained dragon."},"tag":"l","s":"国土交通省「多言語解説文データベース」秩父神社"},{"title":{"ja":"川越氷川神社","en":"Kawagoe Hikawa Shrine"},"text":{"ja":"川越氷川神社は、約1500年前の創建と伝わり、縁結びの神社として知られる。夏には、2,000個以上の風鈴を飾る「縁むすび風鈴」があり、約3万枚の絵馬が掛かる「絵馬トンネル」や、鯛を釣り上げる「鯛みくじ」もある。","en":"Kawagoe Hikawa Shrine is said to have been founded about 1,500 years ago and is known for matchmaking. In summer it hangs over 2,000 wind chimes ('En-musubi Furin'), and has a tunnel of about 30,000 ema plaques and fishing-style 'tai omikuji'."},"tag":"x","s":"Go Local Travel Japan「川越氷川神社」（旅行情報サイト。公式は未確認）"}]},"food":{"title":{"ja":"名物：草加せんべい","en":"Specialty: Soka senbei"},"text":{"ja":"草加せんべいは、埼玉の草加の名物として知られる、堅焼きの米菓。","en":"Soka senbei is a firm-baked rice cracker known as a specialty of Soka, Saitama."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"草加せんべいは、何から作る？","en":"What is Soka senbei made from?"},"c":[{"ja":"お米","en":"Rice"},{"ja":"小麦","en":"Wheat only"},{"ja":"じゃがいも","en":"Potatoes"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：川越のさつまいも","en":"Local eats: Kawagoe sweet potatoes"},"text":{"ja":"小江戸・川越は、サツマイモが名産。クラフトビール「COEDO」の「紅赤」にも、川越のサツマイモが使われる。","en":"Kawagoe, 'Little Edo', is famed for sweet potatoes. The craft beer 'COEDO' even makes a 'Beniaka' brew with Kawagoe's sweet potatoes."},"tag":"f","s":"るるぶ&more「GOOD LIFEフェア2025」の記事（COEDO「紅赤」）","q":{"ja":"COEDOビールの「紅赤」に使われるのは？","en":"What goes into COEDO's 'Beniaka'?"},"c":[{"ja":"サツマイモ","en":"Sweet potatoes"},{"ja":"かぼちゃ","en":"Pumpkin"},{"ja":"とうもろこし","en":"Corn"}],"a":0},"sake":{"title":{"ja":"お酒：帝松と長瀞の蔵","en":"Sake: Teimatsu and the Nagatoro brewery"},"text":{"ja":"埼玉は、日本酒の出荷量が全国4位の酒処とされる。小川町の松岡醸造「帝松」は、1851年創業。全国新酒鑑評会で8年連続金賞。秩父の山々の雨水から生まれた硬水を仕込みに使う。長瀞の藤﨑摠兵衛商店は、1728年創業。酒米は埼玉県産のみ。※お酒は20歳になってから。","en":"Saitama is described as ranking 4th in Japan for sake shipments. Matsuoka Jozo's 'Teimatsu' (Ogawa, founded 1851) won gold at the national new-sake appraisal 8 years running, brewed with hard water from rain on the Chichibu mountains. Fujisaki Sobei Shoten in Nagatoro (1728) uses only Saitama rice. *Drinking is for adults only."},"tag":"f","s":"るるぶ&more「埼玉県はお酒県だった⁉」記事（GOOD LIFEフェア2025）","q":{"ja":"松岡醸造（小川町）の銘柄は？","en":"Which brand does Matsuoka Jozo (Ogawa) make?"},"c":[{"ja":"帝松","en":"Teimatsu"},{"ja":"一品","en":"Ippin"},{"ja":"甲子","en":"Kinoene"}],"a":0},"history":{"title":{"ja":"歴史：武蔵国","en":"History: Musashi Province"},"text":{"ja":"いまの埼玉県の大部分は、昔の「武蔵国」にあたる。氷川神社が武蔵国一宮とされることが、土地の歴史の古さを物語る。","en":"Most of today's Saitama was once 'Musashi Province'. Hikawa Shrine being its Ichinomiya hints at the area's long history."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"昔の埼玉の大部分は、何という国だった？","en":"What province covered most of today's Saitama?"},"c":[{"ja":"武蔵国","en":"Musashi"},{"ja":"常陸国","en":"Hitachi"},{"ja":"下野国","en":"Shimotsuke"}],"a":0},"kenmin":{"title":{"ja":"地域ごとに、ちがう顔","en":"Many faces, many areas"},"text":{"ja":"埼玉は、東京に近い南部と、山あいの秩父など、地域ごとに雰囲気が違うと、よく言われる（俗説）。","en":"Saitama is often said to feel different from area to area, from the Tokyo-side south to mountain Chichibu (folk image)."},"tag":"k","s":"俗説・出典未確認","q":null},"matsuri":{"title":{"ja":"秩父夜祭","en":"Chichibu Night Festival"},"text":{"ja":"秩父神社の秩父夜祭は、12月3日の夜祭。神幸行列を、6台の笠鉾と屋台が先導する。冬の夜空に、打ち上げ花火と仕掛け花火が上がり、屋台歌舞伎や曳き踊りも行われる。2日の夜には「お諏訪渡り」がある。","en":"Chichibu Shrine's Night Festival climaxes on the night of 3 December. Six canopy floats and stage floats lead the divine procession. Fireworks light the winter sky, with stage kabuki and 'hiki-odori' dances; on the night of the 2nd comes the 'Osuwa-watari'."},"tag":"f","s":"秩父神社公式「秩父夜祭」","q":{"ja":"秩父夜祭の夜祭は、何月何日？","en":"On what date is the Chichibu night festival?"},"c":[{"ja":"12月3日","en":"3 December"},{"ja":"7月7日","en":"7 July"},{"ja":"1月1日","en":"1 January"}],"a":0,"more":[{"title":{"ja":"川越まつり（川越氷川祭の山車行事）","en":"Kawagoe Festival (Kawagoe Hikawa Festival floats)"},"text":{"ja":"川越氷川祭の山車行事は、氷川神社の例大祭で、氏子の旧町内から多数の山車が曳き出される。山車は二層の櫓に大型の人形を載せた江戸型で、山車の上でお囃子・舞・神楽が行われる。江戸の山王祭・神田祭の影響を受けて発展した。2005年に国の重要無形民俗文化財に指定。","en":"The Kawagoe Hikawa Festival floats are part of Hikawa Shrine's grand festival, when many floats are pulled out from the old districts. They are Edo-style: a two-tier tower carrying a large figure, with music, dance and kagura performed on top. The festival developed under the influence of Edo's Sanno and Kanda festivals and was designated a national Important Intangible Folk Cultural Property in 2005."},"tag":"f","s":"文化庁「国指定文化財等データベース」川越氷川祭の山車行事"},{"title":{"ja":"熊谷うちわ祭","en":"Kumagaya Uchiwa Festival"},"text":{"ja":"熊谷うちわ祭は、18世紀半ばに、愛宕八坂神社で疫病よけの神事として始まったとされる。のちに、商人が赤飯のかわりに、うちわを配るようになった。7月に3日間行われ、山車が国道17号を巡行する。","en":"The Kumagaya Uchiwa Festival began in the mid-18th century as a ritual at Atago Yasaka Shrine to ward off disease. Later, merchants began handing out fans in place of red-bean rice. Held over three days in July, its floats parade along National Route 17."},"tag":"f","s":"国土交通省「多言語解説文データベース」熊谷うちわ祭"}]},"person":{"title":{"ja":"渋沢栄一","en":"Shibusawa Eiichi"},"text":{"ja":"渋沢栄一は、1840年（天保11年）、武蔵国榛沢郡血洗島村（現在の深谷市血洗島）の農家に生まれた。富岡製糸場の設立に関わり、1873年に第一国立銀行を開業して、のちに頭取となった。生涯で約500の企業に関わったと、深谷市は紹介している。","en":"Shibusawa Eiichi was born in 1840 to a farming family in Chiaraijima village, Musashi Province (now Fukaya City). He was involved in establishing the Tomioka Silk Mill and opened the First National Bank in 1873, later becoming its president. Fukaya City says he was involved with about 500 companies in his lifetime."},"tag":"f","s":"深谷市公式「渋沢栄一の紹介」","q":{"ja":"渋沢栄一が生まれた、現在の市は？","en":"Which city is Shibusawa Eiichi's birthplace in today's terms?"},"c":[{"ja":"深谷市","en":"Fukaya"},{"ja":"川越市","en":"Kawagoe"},{"ja":"秩父市","en":"Chichibu"}],"a":0},"omiyage":{"title":{"ja":"ご当地おやつ：ゼリーフライ（行田）","en":"Local snack: Jelly Fry (Gyoda)"},"text":{"ja":"行田の「ゼリーフライ」は、小判形で、ジャガイモ・ねぎ・にんじん・おからが材料。日露戦争のときに中国から伝わった「野菜まんじゅう」がルーツとされ、小判形から「銭フライ」と呼ばれ、それがなまって「ゼリーフライ」になったという。","en":"Gyoda's 'Jelly Fry' is a small oval patty made with potato, spring onion, carrot and okara (soy pulp). It is said to descend from 'vegetable buns' that came from China during the Russo-Japanese War; its coin shape earned it the name 'zeni fry', which slurred into 'jelly fry'."},"tag":"f","s":"行田市公式「ゼリーフライ」","q":{"ja":"ゼリーフライの形は？","en":"What shape is a Jelly Fry?"},"c":[{"ja":"小判形","en":"Oval, like an old coin"},{"ja":"丸い球","en":"A ball"},{"ja":"三角形","en":"A triangle"}],"a":0},"famous":{"title":{"ja":"埼玉県と言えば","en":"Known for"},"text":{"ja":"・川越の蔵造りの町並み\n・秩父の芝桜\n・大宮の鉄道博物館\n・草加せんべい\n・秩父夜祭","en":"• Kawagoe's warehouse-style streets\n• Chichibu shibazakura\n• Railway Museum, Omiya\n• Soka senbei\n• Chichibu Night Festival"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"埼玉県の町","en":"Towns of Saitama"},"text":{"ja":"さいたま（大宮）　鉄道博物館と新幹線の駅\n川越　蔵造りの町並み\n秩父　山あいの町と夜祭\n行田　足袋とゼリーフライ\n熊谷　ラグビーの町\n所沢　空と本の町\n草加　せんべいで有名\n深谷　ねぎと赤レンガの駅","en":"Saitama (Omiya) – Railway Museum and Shinkansen hub\nKawagoe – Warehouse-style streets\nChichibu – Mountain town and night festival\nGyoda – Tabi socks and jelly fry\nKumagaya – A rugby town\nTokorozawa – Aviation and books\nSoka – Famous for senbei\nFukaya – Negi and a red-brick station"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"さいたま（大宮）","en":"Saitama (Omiya)"},"ll":[35.906,139.624],"w":{"ja":"鉄道博物館と新幹線の駅","en":"Railway Museum and Shinkansen hub"}},{"n":{"ja":"川越","en":"Kawagoe"},"ll":[35.925,139.486],"w":{"ja":"蔵造りの町並み","en":"Warehouse-style streets"}},{"n":{"ja":"秩父","en":"Chichibu"},"ll":[35.992,139.085],"w":{"ja":"山あいの町と夜祭","en":"Mountain town and night festival"}},{"n":{"ja":"行田","en":"Gyoda"},"ll":[36.139,139.455],"w":{"ja":"足袋とゼリーフライ","en":"Tabi socks and jelly fry"}},{"n":{"ja":"熊谷","en":"Kumagaya"},"ll":[36.147,139.389],"w":{"ja":"ラグビーの町","en":"A rugby town"}},{"n":{"ja":"所沢","en":"Tokorozawa"},"ll":[35.799,139.469],"w":{"ja":"空と本の町","en":"Aviation and books"}},{"n":{"ja":"草加","en":"Soka"},"ll":[35.825,139.805],"w":{"ja":"せんべいで有名","en":"Famous for senbei"}},{"n":{"ja":"深谷","en":"Fukaya"},"ll":[36.198,139.281],"w":{"ja":"ねぎと赤レンガの駅","en":"Negi and a red-brick station"}}]},{"id":"fukushima","ja":"福島県","en":"Fukushima","ll":[37.75,140.468],"cap":{"ja":"福島市","en":"Fukushima City"},"intro":{"ja":"イナリ「大宮から新幹線で、福島に着いたで！ ここから東北の旅や！」\nテンジン「会津の城、酒、野口英世…。見るところが多いで。」","en":"Inari: \"We took the Shinkansen from Omiya and reached Fukushima! Our Tohoku journey starts here!\"\nTenjin: \"Aizu's castle, sake, Noguchi Hideyo… so much to see.\""},"topics":{"cap":{"title":{"ja":"県庁所在地：福島市","en":"Prefectural capital: Fukushima City"},"text":{"ja":"福島県の県庁所在地は、福島市。県は、会津・中通り・浜通りの3つの地方に分かれる。","en":"The capital of Fukushima Prefecture is Fukushima City. The prefecture is divided into three regions: Aizu, Nakadori and Hamadori."},"tag":"x","s":"出典未確認（一般に知られる事柄）","q":{"ja":"福島県の県庁所在地は？","en":"What is the capital of Fukushima?"},"c":[{"ja":"福島市","en":"Fukushima City"},{"ja":"郡山市","en":"Koriyama"},{"ja":"会津若松市","en":"Aizuwakamatsu"}],"a":0},"shrine":{"title":{"ja":"会津さざえ堂","en":"Aizu Sazaedo"},"text":{"ja":"会津さざえ堂（円通三匝堂）は、寛政8年（1796年）の建立で、国の重要文化財。階段のない、らせん状の坂を登っていくと、いつの間にか下りになっている、不思議な回廊の建物。江戸時代には、西国三十三観音像が安置され、参拝すると三十三観音参りができた。","en":"Aizu Sazaedo (Entsu Sanso-do), built in 1796, is a national Important Cultural Property. Climbing its spiral slope without stairs, you find yourself descending before you know it. In the Edo period it housed the 33 Saikoku Kannon statues, so visiting it counted as the 33-temple pilgrimage."},"tag":"f","s":"福島県「会津さざえ堂」（県公式）","q":{"ja":"会津さざえ堂の、建物の特徴は？","en":"What is special about Aizu Sazaedo's structure?"},"c":[{"ja":"らせん状の坂の回廊","en":"A spiral sloping corridor"},{"ja":"地下の洞窟","en":"An underground cave"},{"ja":"空中の吊り橋","en":"A hanging bridge"}],"a":0},"food":{"title":{"ja":"名物：こづゆ","en":"Specialty: Kozuyu"},"text":{"ja":"こづゆは、福島県の会津地方に伝わる郷土料理。貝柱などの海の幸と、わらびや里いもなどの山の幸を、干ししいたけと貝柱のだしで煮る。具は、7種か9種類が縁起がよいとされ、会津塗の小さなおわんで、祝いの席の来客に出された。","en":"Kozuyu is a traditional dish of Aizu in Fukushima. Seafood such as scallop adductors and mountain vegetables such as bracken and taro are simmered in a broth of dried shiitake and scallop. Seven or nine ingredients are considered lucky, and it is served in small Aizu lacquer bowls to guests at celebrations."},"tag":"f","s":"農林水産省「うちの郷土料理」こづゆ","q":{"ja":"こづゆは、福島県のどの地方の料理？","en":"Which region of Fukushima is Kozuyu from?"},"c":[{"ja":"会津","en":"Aizu"},{"ja":"浜通り","en":"Hamadori"},{"ja":"中通り","en":"Nakadori"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：喜多方ラーメン","en":"Local eats: Kitakata Ramen"},"text":{"ja":"喜多方ラーメンは、「平打ち熟成多加水麺」が特徴。基本はしょうゆ味。大正末期に、中国から来た藩欽星さんが屋台で中華そばを売り始めたのが、はじまりとされる。1980年代の最盛期には、人口3万人台の町に、約120軒のラーメン店があった。","en":"Kitakata Ramen is known for flat, aged, high-hydration noodles, mostly in soy-sauce broth. It is said to have begun in the late Taisho era when Pan Qinxing, who came from China, sold Chinese noodles from a stall. In its 1980s peak, a town of about 30,000 people had around 120 ramen shops."},"tag":"f","s":"nippon.com「喜多方ラーメン」","q":{"ja":"喜多方ラーメンの麺の特徴は？","en":"What is Kitakata Ramen's noodle like?"},"c":[{"ja":"平打ちの多加水麺","en":"Flat, high-hydration noodles"},{"ja":"極細のストレート麺","en":"Ultra-thin straight noodles"},{"ja":"太い丸麺","en":"Thick round noodles"}],"a":0},"sake":{"title":{"ja":"お酒：日本一の酒処ふくしま","en":"Sake: Fukushima, Japan's top sake region"},"text":{"ja":"福島県は、令和3酒造年度、全国新酒鑑評会の金賞受賞数で、史上初の9回連続日本一（通算11度目）となった。金賞は17銘柄。県は「日本一の酒処ふくしま」を国内外にPRしている。※味わいの特徴は、資料に書かれていなかったので載せていない。","en":"In the 2021 sake-brewing year, Fukushima ranked first in gold me
