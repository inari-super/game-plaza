dals at the National New Sake Appraisal for a record ninth consecutive time (eleventh overall), with 17 gold-winning brands. The prefecture promotes itself at home and abroad as Japan's top sake region. *Tasting notes were not in the source, so none are given."},"tag":"f","s":"福島県「全国新酒鑑評会 金賞受賞」（県公式）","q":{"ja":"福島県が、全国新酒鑑評会で続けた記録は？","en":"What record did Fukushima keep at the National New Sake Appraisal?"},"c":[{"ja":"金賞数の連続日本一","en":"Consecutive No. 1 in gold medals"},{"ja":"全国最下位","en":"Last place"},{"ja":"出品なし","en":"No entries"}],"a":0},"history":{"title":{"ja":"歴史：会津戦争と鶴ヶ城","en":"History: the Aizu War and Tsuruga Castle"},"text":{"ja":"1868年（慶応4年）の戊辰戦争で、会津は官軍と戦った。鶴ヶ城には、老幼婦女子約1,000名を含む約5,000名が立てこもり、1か月に及ぶ籠城戦のすえ、9月22日（新暦11月6日）に開城した。飯盛山で自刃した少年兵「白虎隊」も語り継がれている。","en":"In the Boshin War of 1868, Aizu fought the imperial forces. About 5,000 people, including about 1,000 elderly, women and children, held Tsuruga Castle for a month before it surrendered on 22 September (6 November in the new calendar). The boy soldiers of the Byakkotai, who took their own lives on Mt. Iimori, are also remembered."},"tag":"f","s":"国立国会図書館「ランドマーク 会津戦争」","q":{"ja":"会津戦争があったのは、何年？","en":"In what year was the Aizu War?"},"c":[{"ja":"1868年","en":"1868"},{"ja":"1600年","en":"1600"},{"ja":"1945年","en":"1945"}],"a":0,"more":[{"title":{"ja":"大内宿","en":"Ouchi-juku"},"text":{"ja":"大内宿は、1640年ごろに設立されたと考えられている宿場で、会津若松と日光をむすぶ主要なルート上で栄えた。茅葺き屋根の家並みは約400年同じ様式を保ち、1981年に国の重要伝統的建造物群保存地区に選ばれた。","en":"Ouchi-juku is a post town thought to have been established around 1640, prospering on the main route linking Aizuwakamatsu and Nikko. Its thatched-roof houses have kept the same style for about 400 years, and it was designated an Important Preservation District for Groups of Traditional Buildings in 1981."},"tag":"f","s":"国土交通省「多言語解説文データベース」大内宿"}]},"matsuri":{"title":{"ja":"相馬野馬追","en":"Soma Nomaoi"},"text":{"ja":"相馬野馬追は、毎年7月の最終土曜日から月曜日に行われる。甲冑姿の騎馬武者が行列し、「甲冑競馬」では1周1000mを10頭で競う。数百の騎馬が、空に舞う2本の御神旗を奪い合う「神旗争奪戦」もある。千年余り前に、平将門が軍事訓練として行ったのがはじまりと言われる。","en":"The Soma Nomaoi is held from the last Saturday to Monday of July. Mounted warriors in armor parade; in the 'Kacchu Keiba' ten horses race 1,000 m, and in the 'Shinki Soso-sen' hundreds of riders scramble for two sacred banners flung into the air. It is said to have begun over a thousand years ago as military training by Taira no Masakado."},"tag":"l","s":"東北観光推進機構「相馬野馬追」","q":{"ja":"相馬野馬追で行われる、馬を使った行事は？","en":"Which horse event is held at the Soma Nomaoi?"},"c":[{"ja":"甲冑競馬","en":"Armored horse race"},{"ja":"馬の綱引き","en":"Horse tug-of-war"},{"ja":"馬の水泳","en":"Horse swimming"}],"a":0},"person":{"title":{"ja":"野口英世","en":"Noguchi Hideyo"},"text":{"ja":"野口英世は、1876年（明治9年）、福島県猪苗代町に生まれた。1900年にアメリカへ渡り、ロックフェラー医学研究所で細菌を研究。西アフリカで黄熱病を研究中に感染し、1928年（昭和3年）、アクラ（現ガーナ）で亡くなった。生家は、野口英世記念館として公開されている。","en":"Noguchi Hideyo was born in 1876 in Inawashiro, Fukushima. He went to the United States in 1900 and studied bacteria at the Rockefeller Institute. While researching yellow fever in West Africa he was infected and died in 1928 in Accra (now Ghana). His birthplace is open as the Noguchi Hideyo Memorial Museum."},"tag":"f","s":"野口英世記念館パンフレット（公式）","q":{"ja":"野口英世が亡くなった場所は？","en":"Where did Noguchi Hideyo die?"},"c":[{"ja":"アクラ（ガーナ）","en":"Accra (Ghana)"},{"ja":"ニューヨーク","en":"New York"},{"ja":"東京","en":"Tokyo"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：赤べこ","en":"Souvenir: Akabeko"},"text":{"ja":"赤べこは、会津の郷土玩具。約807年、お寺の建立で、牛が重い材料を運んだ。そこに赤い牛が現れて、ほかの牛を導き、仕事を終えるまで働いたという伝えがある。首が上下に動く張り子で、健康や幸運の縁起物とされる。","en":"The akabeko is a folk toy of Aizu. By one legend, around 807 cattle hauled heavy materials to build a temple, and a mysterious red cow led the others and worked until the job was done. Its head bobs up and down, and it is a lucky charm for health and fortune."},"tag":"l","s":"国土交通省「多言語解説文データベース」赤べこ","q":{"ja":"赤べこの特徴は？","en":"What is the akabeko's feature?"},"c":[{"ja":"首が上下に動く","en":"Its head bobs"},{"ja":"尾が光る","en":"Its tail glows"},{"ja":"鳴き声を出す","en":"It moos"}],"a":0},"kenmin":{"title":{"ja":"会津の「ならぬことはならぬ」","en":"Aizu's 'what is wrong is wrong'"},"text":{"ja":"会津では、「ならぬことはならぬものです」という教えが、よく語られる。まじめで、がまん強い県民性だと、よく言われる。","en":"In Aizu, the teaching 'what is wrong is wrong' is often told, and people are often said to be earnest and patient."},"tag":"k","s":"俗説・出典未確認","q":null},"famous":{"title":{"ja":"福島県と言えば","en":"Known for"},"text":{"ja":"・鶴ヶ城\n・大内宿\n・磐梯山\n・野口英世\n・喜多方ラーメン","en":"• Tsuruga Castle\n• Ouchi-juku\n• Mt. Bandai\n• Noguchi Hideyo\n• Kitakata Ramen"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"福島県の町","en":"Towns of Fukushima"},"text":{"ja":"福島　県庁所在地・フルーツの街\n会津若松　鶴ヶ城と城下町\n郡山　県内最大級の都市\nいわき　太平洋の海辺の街\n白河　小峰城と古い関所の跡\n喜多方　蔵の町とラーメン\n二本松　城跡と菊人形で知られる\n相馬　相馬野馬追の町","en":"Fukushima – Prefectural capital, a fruit-growing city\nAizuwakamatsu – Tsuruga Castle and its castle town\nKoriyama – One of the prefecture's largest cities\nIwaki – A Pacific seaside city\nShirakawa – Komine Castle and an old barrier site\nKitakata – Warehouse town and ramen\nNihonmatsu – Castle ruins and chrysanthemum dolls\nSoma – The Soma Nomaoi town"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"福島","en":"Fukushima"},"ll":[37.76,140.474],"w":{"ja":"県庁所在地・フルーツの街","en":"Prefectural capital, a fruit-growing city"}},{"n":{"ja":"会津若松","en":"Aizuwakamatsu"},"ll":[37.495,139.93],"w":{"ja":"鶴ヶ城と城下町","en":"Tsuruga Castle and its castle town"}},{"n":{"ja":"郡山","en":"Koriyama"},"ll":[37.4,140.36],"w":{"ja":"県内最大級の都市","en":"One of the prefecture's largest cities"}},{"n":{"ja":"いわき","en":"Iwaki"},"ll":[37.05,140.888],"w":{"ja":"太平洋の海辺の街","en":"A Pacific seaside city"}},{"n":{"ja":"白河","en":"Shirakawa"},"ll":[37.127,140.212],"w":{"ja":"小峰城と古い関所の跡","en":"Komine Castle and an old barrier site"}},{"n":{"ja":"喜多方","en":"Kitakata"},"ll":[37.65,139.87],"w":{"ja":"蔵の町とラーメン","en":"Warehouse town and ramen"}},{"n":{"ja":"二本松","en":"Nihonmatsu"},"ll":[37.59,140.43],"w":{"ja":"城跡と菊人形で知られる","en":"Castle ruins and chrysanthemum dolls"}},{"n":{"ja":"相馬","en":"Soma"},"ll":[37.795,140.92],"w":{"ja":"相馬野馬追の町","en":"The Soma Nomaoi town"}}]},{"id":"miyagi","ja":"宮城県","en":"Miyagi","ll":[38.268,140.872],"cap":{"ja":"仙台市","en":"Sendai City"},"intro":{"ja":"イナリ「福島から新幹線で、宮城に着いたで！ 伊達政宗公のお膝元や！」\nハチマン「松島の島々も、牛たんも楽しみやな。」","en":"Inari: \"The Shinkansen brought us from Fukushima to Miyagi — Lord Date Masamune's home ground!\"\nHachiman: \"I'm looking forward to the Matsushima islands and the beef tongue.\""},"topics":{"cap":{"title":{"ja":"県庁所在地：仙台市","en":"Prefectural capital: Sendai City"},"text":{"ja":"宮城県の県庁所在地は、仙台市。伊達政宗は、関ヶ原の戦いの翌年から青葉山で城の建設を始め、仙台藩を治めた。仙台藩の石高は62万石で、加賀、薩摩に次ぐ3番目の規模だったとされる。","en":"The capital of Miyagi Prefecture is Sendai City. Date Masamune began building a castle on Mt. Aoba the year after the Battle of Sekigahara and ruled the Sendai domain, whose 620,000-koku rating is said to have been third largest after Kaga and Satsuma."},"tag":"f","s":"nippon.com「伊達政宗」","q":{"ja":"宮城県の県庁所在地は？","en":"What is the capital of Miyagi?"},"c":[{"ja":"仙台市","en":"Sendai City"},{"ja":"石巻市","en":"Ishinomaki"},{"ja":"白石市","en":"Shiroishi"}],"a":0},"shrine":{"title":{"ja":"瑞巌寺（松島）","en":"Zuiganji (Matsushima)"},"text":{"ja":"瑞巌寺は、828年に建立された天台密教の寺で、1609年に再建された。本堂、御成門、庫裡は、国宝に指定されている。庫裡は、大きな木造屋根の煙出しが特徴の、巨大な台所の建物。","en":"Zuiganji is a Tendai esoteric temple founded in 828 and rebuilt in 1609. Its main hall, Onari-mon gate and kuri (kitchen) are National Treasures; the kuri is a huge kitchen building with a large wooden-roofed smoke vent."},"tag":"f","s":"国土交通省「多言語解説文データベース」瑞巌寺","q":{"ja":"瑞巌寺が再建された年は？","en":"In what year was Zuiganji rebuilt?"},"c":[{"ja":"1609年","en":"1609"},{"ja":"1868年","en":"1868"},{"ja":"1945年","en":"1945"}],"a":0,"more":[{"title":{"ja":"鹽竈神社","en":"Shiogama Shrine"},"text":{"ja":"鹽竈神社は、塩竈湾を東に望む高台にあり、古代から陸奥国の一之宮として崇敬された古社。現在の社殿は、1704年に完成した。左宮・右宮・別宮、門、廻廊などからなり、類例がほとんどない社殿構成と評価され、別宮廻廊などが国の重要文化財に指定されている。","en":"Shiogama Shrine stands on a hill overlooking Shiogama Bay and was revered since ancient times as the Ichinomiya of Mutsu Province. Its present buildings were completed in 1704 — left, right and separate shrines, gates and cloisters — in a layout with almost no parallel, and are designated Important Cultural Properties."},"tag":"f","s":"文化庁「国指定文化財等データベース」鹽竈神社"}]},"food":{"title":{"ja":"名物：笹かまぼこ","en":"Specialty: Sasa-kamaboko"},"text":{"ja":"白身魚のすり身を蒸し、木の葉型にして焼いた「笹かまぼこ」は、仙台の定番みやげ。名付け親は、「阿部蒲鉾店」といわれる。","en":"Sasa-kamaboko — white-fish paste steamed, shaped like a leaf and grilled — is a classic Sendai souvenir; Abe Kamaboko is said to have named it."},"tag":"f","s":"nippon.com「仙台の食」","q":{"ja":"笹かまぼこの形は？","en":"What shape is sasa-kamaboko?"},"c":[{"ja":"木の葉型","en":"Leaf-shaped"},{"ja":"星型","en":"Star-shaped"},{"ja":"丸型","en":"Round"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：牛たん","en":"Local eats: Gyutan (beef tongue)"},"text":{"ja":"仙台の牛たんは、1948年に料理人の佐野啓四郎が、それまで捨てられていた牛の舌をおいしく味わう調理法を考案したと伝わる。厚切りにして細かな切り込みを入れ、塩を振って数日間熟成させる。麦飯とテールスープが付くのが定番。","en":"Sendai's gyutan is said to have been devised in 1948 by the cook Sano Keishiro, who found a way to enjoy beef tongue that had been thrown away. It is cut thick, scored, salted and aged for days, and typically comes with barley rice and oxtail soup."},"tag":"l","s":"nippon.com「仙台の食」","q":{"ja":"牛たんの定食に付くのは？","en":"What typically comes with a gyutan set?"},"c":[{"ja":"麦飯とテールスープ","en":"Barley rice and oxtail soup"},{"ja":"カレーライス","en":"Curry rice"},{"ja":"そば","en":"Soba"}],"a":0},"sake":{"title":{"ja":"お酒：宮城県清酒鑑評会","en":"Sake: the Miyagi Sake Appraisal"},"text":{"ja":"宮城では、県内の清酒づくりの技術と品質を高め、業界を活性化するため、毎年「宮城県清酒鑑評会」が開かれている。第28回（令和8年度）は、審査が令和8年9月2日、表彰式が11月16日。主催は宮城県酒造組合など。※酒質や味わいの特徴は、資料に書かれていなかったので載せていない。","en":"Each year Miyagi holds a prefectural sake appraisal to raise brewing technique and quality and energise the industry. The 28th (FY2026) was judged on 2 September 2026, with the awards on 16 November, organised by the Miyagi Sake Brewers' Association and others. *Tasting notes were not in the source, so none are given."},"tag":"f","s":"宮城県「宮城県清酒鑑評会」（県公式）","q":{"ja":"宮城県清酒鑑評会が開かれる目的は？","en":"What is the Miyagi sake appraisal held for?"},"c":[{"ja":"技術と品質の向上","en":"Improving technique and quality"},{"ja":"酒の値下げ","en":"Lowering prices"},{"ja":"酒の輸入","en":"Importing sake"}],"a":0},"history":{"title":{"ja":"歴史：慶長遣欧使節","en":"History: the Keicho Embassy to Europe"},"text":{"ja":"1613年（慶長18年）、仙台藩の支倉常長らが、メキシコとの通商と宣教師の派遣を、スペイン国王とローマ教皇に求めるため、仙台領の月の浦を出発した。メキシコ、スペイン、ローマへ渡り、1620年に帰国した。支倉常長像など関連資料は、ユネスコ「世界の記憶」と表示されている。","en":"In 1613 Hasekura Tsunenaga and others of the Sendai domain left Tsukinoura to ask the king of Spain and the Pope for trade with Mexico and the dispatch of missionaries. They crossed to Mexico, Spain and Rome and returned in 1620. Related items such as the portrait of Hasekura are labelled UNESCO 'Memory of the World'."},"tag":"f","s":"仙台市博物館「支倉常長と慶長遣欧使節」","q":{"ja":"支倉常長らが出発した年は？","en":"In what year did Hasekura's mission depart?"},"c":[{"ja":"1613年","en":"1613"},{"ja":"1853年","en":"1853"},{"ja":"1185年","en":"1185"}],"a":0,"more":[{"title":{"ja":"松島","en":"Matsushima"},"text":{"ja":"松島は、京都北部の天橋立、広島の宮島と並ぶ、日本三景の一つ。大小260余りの島々が浮かぶ。遊覧船では、松島湾を約50分で一周する「仁王丸コース」などがあり、伊達政宗が造営した五大堂も、観光桟橋の近くにある。","en":"Matsushima is one of Japan's Three Views, alongside Amanohashidate and Miyajima, with some 260 islands large and small. Cruises include the 'Niomaru Course' circling the bay in about 50 minutes, and the Godaido built by Date Masamune stands near the tourist pier."},"tag":"f","s":"nippon.com「日本三景 松島」"}]},"matsuri":{"title":{"ja":"仙台・青葉まつり","en":"Sendai Aoba Festival"},"text":{"ja":"仙台・青葉まつりは、仙台を築いた大名・伊達政宗を讃える祭り。毎年5月、政宗が亡くなった5月24日の前の週末の2日間に行われる。初日は「すずめ踊り」、2日目は高さ約7mの山鉾11台の巡行や、政宗の出陣を再現する行列がある。すずめ踊りは、1603年の青葉城建造を祝う宴の即興の踊りが進化したものと考えられている。","en":"The Sendai Aoba Festival honours Date Masamune, who built Sendai, and is held on the weekend before 24 May, the day he died. Day 1 features the 'Suzume Odori'; day 2 has a parade of 11 floats about 7 m tall and a re-enactment of Masamune's march. The Suzume Odori is thought to have evolved from an improvised dance at a banquet celebrating the 1603 construction of Aoba Castle."},"tag":"f","s":"国土交通省「多言語解説文データベース」仙台青葉まつり","q":{"ja":"すずめ踊りが披露された宴は、何を祝った？","en":"What did the banquet where Suzume Odori was danced celebrate?"},"c":[{"ja":"青葉城の建造","en":"Building Aoba Castle"},{"ja":"田植え","en":"Rice planting"},{"ja":"新年","en":"New Year"}],"a":0,"more":[{"title":{"ja":"仙台七夕まつり","en":"Sendai Tanabata Festival"},"text":{"ja":"仙台七夕まつりは、毎年8月6日～8日の3日間、月遅れの七夕の8月7日を中日として開かれる。飾りが和紙で作られているのが特徴で、アーケード街や仙台駅周辺には、巨大な吹き流しが飾られる。藩祖・伊達政宗の時代から続く伝統行事とされ、東北三大祭りの一つ。","en":"The Sendai Tanabata Festival runs 6–8 August each year, centred on 7 August, the old-calendar Tanabata. Its decorations are made of washi paper, and giant streamers hang over arcades and around Sendai Station. It is said to continue a tradition from the time of the domain founder Date Masamune and is one of Tohoku's Three Great Festivals."},"tag":"f","s":"東北観光推進機構「仙台七夕まつり」"}]},"person":{"title":{"ja":"伊達政宗","en":"Date Masamune"},"text":{"ja":"伊達政宗（1567～1636）は、仙台藩の初代。若くして家督を継ぎ、「独眼竜」の異名で全国に名を知られた。海外にも関心を持ち、慶長遣欧使節として支倉常長らをヨーロッパへ派遣した。仙台市博物館には、国宝の「ローマ教皇パウロ五世像」などが収蔵されている。","en":"Date Masamune (1567–1636) was the first lord of the Sendai domain, known nationwide as the 'One-Eyed Dragon' after succeeding to the headship at 17. Interested in the outside world, he sent Hasekura Tsunenaga and others to Europe as the Keicho Embassy. The Sendai City Museum holds items such as the National Treasure portrait of Pope Paul V."},"tag":"f","s":"nippon.com「伊達政宗」","q":{"ja":"伊達政宗の異名は？","en":"What was Date Masamune's nickname?"},"c":[{"ja":"独眼竜","en":"The One-Eyed Dragon"},{"ja":"甲斐の虎","en":"The Tiger of Kai"},{"ja":"越後の龍","en":"The Dragon of Echigo"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：ずんだ餅","en":"Souvenir: Zunda-mochi"},"text":{"ja":"ずんだ餅は、仙台の郷土料理。熟す前の緑色の枝豆をゆでてすりつぶし、砂糖を混ぜてあんを作り、つきたての餅にかける。","en":"Zunda-mochi is a traditional Sendai sweet: unripe green soybeans are boiled, mashed and mixed with sugar into a paste, which is spread over freshly pounded rice cake."},"tag":"f","s":"農林水産省「うちの郷土料理」ずんだ餅","q":{"ja":"ずんだ餅のあんの材料は？","en":"What is zunda-mochi's paste made of?"},"c":[{"ja":"枝豆","en":"Edamame"},{"ja":"小豆","en":"Azuki beans"},{"ja":"栗","en":"Chestnuts"}],"a":0},"kenmin":{"title":{"ja":"政宗公の誇りと温厚さ","en":"Pride in Lord Masamune, and mildness"},"text":{"ja":"仙台の人は、伊達政宗公への誇りが強く、おだやかで、粘り強いと、よく言われる。","en":"People of Sendai are often said to take great pride in Lord Date Masamune and to be mild yet persistent."},"tag":"k","s":"俗説・出典未確認","q":null},"famous":{"title":{"ja":"宮城県と言えば","en":"Known for"},"text":{"ja":"・日本三景の松島\n・仙台七夕まつり\n・牛たん\n・伊達政宗\n・笹かまぼこ","en":"• Matsushima, one of Japan's Three Views\n• Sendai Tanabata Festival\n• Beef tongue\n• Date Masamune\n• Sasa-kamaboko"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"宮城県の町","en":"Towns of Miyagi"},"text":{"ja":"仙台　伊達政宗が築いた城下町\n松島　日本三景の島々\n塩竈　鹽竈神社の町\n石巻　港町\n気仙沼　漁港の町\n白石　城下町\n大崎　県北の中心都市\n登米　県北東の落ち着いた町","en":"Sendai – The castle town Date Masamune built\nMatsushima – The islands of Japan's Three Views\nShiogama – Shiogama Shrine's town\nIshinomaki – A port town\nKesennuma – A fishing-port town\nShiroishi – A castle town\nOsaki – A hub city of the north\nTome – A calm town in the northeast"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null}},"towns":[{"n":{"ja":"仙台","en":"Sendai"},"ll":[38.268,140.869],"w":{"ja":"伊達政宗が築いた城下町","en":"The castle town Date Masamune built"}},{"n":{"ja":"松島","en":"Matsushima"},"ll":[38.368,141.06],"w":{"ja":"日本三景の島々","en":"The islands of Japan's Three Views"}},{"n":{"ja":"塩竈","en":"Shiogama"},"ll":[38.314,141.022],"w":{"ja":"鹽竈神社の町","en":"Shiogama Shrine's town"}},{"n":{"ja":"石巻","en":"Ishinomaki"},"ll":[38.434,141.303],"w":{"ja":"港町","en":"A port town"}},{"n":{"ja":"気仙沼","en":"Kesennuma"},"ll":[38.908,141.57],"w":{"ja":"漁港の町","en":"A fishing-port town"}},{"n":{"ja":"白石","en":"Shiroishi"},"ll":[38.002,140.62],"w":{"ja":"城下町","en":"A castle town"}},{"n":{"ja":"大崎","en":"Osaki"},"ll":[38.577,140.955],"w":{"ja":"県北の中心都市","en":"A hub city of the north"}},{"n":{"ja":"登米","en":"Tome"},"ll":[38.649,141.189],"w":{"ja":"県北東の落ち着いた町","en":"A calm town in the northeast"}}]},{"id":"yamagata","ja":"山形県","en":"Yamagata","ll":[38.24,140.364],"cap":{"ja":"山形市","en":"Yamagata City"},"intro":{"ja":"イナリ「仙台から仙山線で、山形に着いたで！ 山の緑がきれいやな。」\nハチマン「山寺の石段、楽しみやな。」","en":"Inari: \"The Senzan Line brought us from Sendai to Yamagata — look at those green mountains!\"\nHachiman: \"I'm looking forward to the Yamadera stairs.\""},"towns":[{"n":{"ja":"山形","en":"Yamagata"},"ll":[38.255,140.34],"w":{"ja":"山形城のある県庁所在地","en":"The capital, with Yamagata Castle's ruins"}},{"n":{"ja":"天童","en":"Tendo"},"ll":[38.362,140.378],"w":{"ja":"将棋駒の町","en":"A town of shogi pieces"}},{"n":{"ja":"米沢","en":"Yonezawa"},"ll":[37.922,140.117],"w":{"ja":"上杉氏の城下町","en":"Uesugi clan's castle town"}},{"n":{"ja":"鶴岡","en":"Tsuruoka"},"ll":[38.728,139.827],"w":{"ja":"出羽三山の入口にあたる町","en":"Gateway toward the Three Mountains of Dewa"}},{"n":{"ja":"酒田","en":"Sakata"},"ll":[38.914,139.836],"w":{"ja":"日本海に面した港町","en":"A port town on the Sea of Japan"}},{"n":{"ja":"新庄","en":"Shinjo"},"ll":[38.765,140.304],"w":{"ja":"県北の中心都市","en":"A hub city of the north"}},{"n":{"ja":"上山","en":"Kaminoyama"},"ll":[38.152,140.272],"w":{"ja":"県南東部の町","en":"A town in the southeast"}}],"topics":{"famous":{"title":{"ja":"山形県と言えば","en":"Known for"},"text":{"ja":"・さくらんぼ\n・山寺の石段\n・蔵王の樹氷\n・芋煮\n・花笠まつり","en":"• Cherries\n• The Yamadera stairs\n• Zao's snow monsters\n• Imoni (taro stew)\n• Hanagasa Festival"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"山形県の町","en":"Towns of Yamagata"},"text":{"ja":"山形　山形城のある県庁所在地\n天童　将棋駒の町\n米沢　上杉氏の城下町\n鶴岡　出羽三山の入口にあたる町\n酒田　日本海に面した港町\n新庄　県北の中心都市\n上山　県南東部の町","en":"Yamagata – The capital, with Yamagata Castle's ruins\nTendo – A town of shogi pieces\nYonezawa – Uesugi clan's castle town\nTsuruoka – Gateway toward the Three Mountains of Dewa\nSakata – A port town on the Sea of Japan\nShinjo – A hub city of the north\nKaminoyama – A town in the southeast"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null},"cap":{"title":{"ja":"県庁所在地：山形市","en":"Prefectural capital: Yamagata City"},"text":{"ja":"山形県の県庁所在地は、山形市。市内の霞城公園は、最上義光公が築き上げた名城・山形城の跡で、巨大な城門「二の丸東大手門」などの復元が進められている（2018年の時点）。※築城の年は、資料に書かれていなかった。","en":"The capital of Yamagata is Yamagata City. Kajo Park marks the site of Yamagata Castle, built up by Lord Mogami Yoshiaki, and restoration of gates such as the Ninomaru East Main Gate was under way (as of 2018). *The year it was built was not in the source."},"tag":"f","s":"東北観光推進機構「霞城公園（山形城跡）」","q":{"ja":"山形城を築き上げた人物は？","en":"Who built up Yamagata Castle?"},"c":[{"ja":"最上義光","en":"Mogami Yoshiaki"},{"ja":"伊達政宗","en":"Date Masamune"},{"ja":"上杉鷹山","en":"Uesugi Yozan"}],"a":0},"shrine":{"title":{"ja":"山寺（立石寺）","en":"Yamadera (Risshakuji)"},"text":{"ja":"山寺（立石寺）は、1015段の石段で知られる山の寺。松尾芭蕉の句「閑さや岩にしみ入る蝉の声」の舞台として有名。慈覚大師円仁が開山したと伝えられる。","en":"Yamadera (Risshakuji) is a mountain temple known for its 1,015 stone steps, famous as the setting of Basho's haiku 'Shizukasaya iwa ni shimiiru semi no koe'. It is said to have been founded by the monk Jikaku Daishi Ennin."},"tag":"f","s":"東北観光推進機構「山寺」／同「恐山」（円仁の開山は伝承として記載）","q":{"ja":"山寺の石段は、何段？","en":"How many steps are there at Yamadera?"},"c":[{"ja":"1015段","en":"1,015"},{"ja":"108段","en":"108"},{"ja":"3333段","en":"3,333"}],"a":0,"more":[{"title":{"ja":"出羽三山（羽黒山）","en":"Dewa Sanzan (Mt. Haguro)"},"text":{"ja":"出羽三山は、月山（1984m）・湯殿山（1504m）・羽黒山（414m）の総称。羽黒山には、江戸時代に13年がかりで敷かれた2446段の石段があり、山頂まで約1時間かかる。国宝の五重塔は高さ29m、約600年前の建立で、東北で最古の五重塔とされ、1966年に国宝に指定された。","en":"Dewa Sanzan is the name for Mt. Gassan (1,984 m), Mt. Yudono (1,504 m) and Mt. Haguro (414 m). Haguro has 2,446 stone steps laid over 13 years in the Edo period, about an hour to the top. Its National Treasure five-storied pagoda, 29 m tall and built about 600 years ago, is called the oldest in Tohoku and was designated in 1966."},"tag":"f","s":"nippon.com「出羽三山」"}]},"food":{"title":{"ja":"名物：さくらんぼ","en":"Specialty: Cherries"},"text":{"ja":"山形は、さくらんぼ（おうとう）の産地。県の資料では、平年収量は12,700tで、品種は「佐藤錦」に偏っていることが課題とされ、新しい品種「やまがた紅王」も登場している。","en":"Yamagata is a cherry country. A prefectural document puts the normal yield at 12,700 tonnes, notes that varieties lean heavily on 'Sato Nishiki', and mentions the newer 'Yamagata Benio'."},"tag":"f","s":"山形県「さくらんぼ振興の資料」（県公式PDF）","q":{"ja":"山形のさくらんぼの代表的な品種は？","en":"Which is Yamagata's leading cherry variety?"},"c":[{"ja":"佐藤錦","en":"Sato Nishiki"},{"ja":"ふじ","en":"Fuji"},{"ja":"巨峰","en":"Kyoho"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：芋煮","en":"Local eats: Imoni"},"text":{"ja":"芋煮は、山形を代表する郷土料理。地域によって食材や味付けが異なり、一様ではない。村山地域では「日本一の芋煮会フェスティバル」が開かれている。※由来は、資料に書かれていなかった。","en":"Imoni is a signature home dish of Yamagata, and ingredients and seasoning differ from area to area. In the Murayama area the 'Japan's Biggest Imoni Party Festival' is held. *Its origin was not in the source."},"tag":"f","s":"農林水産省「うちの郷土料理」山形県","q":{"ja":"村山地域で開かれるのは？","en":"What is held in the Murayama area?"},"c":[{"ja":"日本一の芋煮会フェスティバル","en":"Japan's Biggest Imoni Party Festival"},{"ja":"日本一の花火大会","en":"Japan's Biggest Fireworks"},{"ja":"日本一のそば祭り","en":"Japan's Biggest Soba Fair"}],"a":0},"sake":{"title":{"ja":"お酒：清酒「山形」","en":"Sake: 'Yamagata' GI"},"text":{"ja":"清酒「山形」は、平成28年（2016年）12月16日に、国の地理的表示（GI）に指定された。※酒質や味わいの特徴は、資料に書かれていなかったので載せていない。お酒は、20歳になってから。","en":"Yamagata sake was designated a national Geographical Indication on 16 December 2016. *Tasting notes were not in the source, so none are given. Sake is for adults only."},"tag":"f","s":"国税庁「地理的表示（GI）一覧」","q":{"ja":"清酒「山形」がGIに指定された年は？","en":"In what year was Yamagata sake given GI status?"},"c":[{"ja":"2016年","en":"2016"},{"ja":"1996年","en":"1996"},{"ja":"2023年","en":"2023"}],"a":0},"history":{"title":{"ja":"歴史：米沢藩の改革","en":"History: the Yonezawa reforms"},"text":{"ja":"窮地に追い込まれていた米沢藩を救うため、上杉鷹山は、財政の再建・産業の開発・精神の改革の3つの大きな改革を進めた。食事は一汁一菜、衣服は絹ではなく綿だけ、奥女中は50人から9人に減らし、収入・支出・借金を詳しく記した帳簿も作った。","en":"To rescue the struggling Yonezawa domain, Uesugi Yozan pushed three great reforms — of finances, of industry and of spirit. Meals were one soup and one dish, clothes cotton instead of silk, the ladies-in-waiting cut from 50 to 9, and a detailed ledger of income, spending and debts was made."},"tag":"f","s":"山形県「郷土やまがた」上杉鷹山の特集（県公式PDF）","q":{"ja":"鷹山が進めた改革は、いくつ？","en":"How many great reforms did Yozan push?"},"c":[{"ja":"3つ","en":"Three"},{"ja":"1つ","en":"One"},{"ja":"10","en":"Ten"}],"a":0},"matsuri":{"title":{"ja":"山形花笠まつり","en":"Yamagata Hanagasa Festival"},"text":{"ja":"山形花笠まつりは、毎年8月5日～7日。鮮やかな花笠を手にした約1万人の踊り手が、優雅な「正調女踊り」、勇壮な「正調男踊り」、ダイナミックな笠回しなどを見せる。","en":"The Yamagata Hanagasa Festival runs 5–7 August every year. About 10,000 dancers with bright flower-hats perform the graceful women's dance, the bold men's dance and dynamic hat-twirling."},"tag":"f","s":"gltjp「山形花笠まつり」（旅行情報サイト）","q":{"ja":"山形花笠まつりの開催は？","en":"When is the Hanagasa Festival?"},"c":[{"ja":"8月5日～7日","en":"5–7 August"},{"ja":"1月1日～3日","en":"1–3 January"},{"ja":"11月3日","en":"3 November"}],"a":0,"more":[{"title":{"ja":"冬の景色：蔵王の樹氷","en":"Winter sight: Zao's snow monsters"},"text":{"ja":"蔵王の樹氷は、アオモリトドマツの葉や枝に着氷と着雪を繰り返してできる。気温・風向き・積雪量などの条件がそろったときだけ、奥羽山脈の一部で見られる。見頃は例年12月下旬から3月上旬で、最盛期は1月下旬から2月中旬。蔵王ロープウェイから樹氷原を眺められる。","en":"Zao's 'snow monsters' form as ice and snow build up repeatedly on Aomori fir leaves and branches. They appear only when temperature, wind and snow conditions line up, in parts of the Ou Mountains. The best time is late December to early March, peaking late January to mid-February, and you can view them from the Zao Ropeway."},"tag":"f","s":"gltjp「蔵王の樹氷」（旅行情報サイト）"}]},"person":{"title":{"ja":"上杉鷹山","en":"Uesugi Yozan"},"text":{"ja":"上杉鷹山は、米沢藩を立て直した藩主。ケネディ大統領が就任時に、日本の記者団に尊敬する日本人を聞かれて「上杉鷹山」と答えたと言われている。「成せばなる　成さねばならぬ何事も　成らぬは人の成さぬ成けり」の歌でも知られる。※生没年・生まれは、資料に書かれていなかった。","en":"Uesugi Yozan was the lord who rebuilt the Yonezawa domain. It is said that when asked by Japanese reporters at his inauguration which Japanese he admired, President Kennedy answered 'Uesugi Yozan'. He is also known for the verse 'If you do it, it can be done'. *His dates and birthplace were not in the source."},"tag":"l","s":"山形県「郷土やまがた」上杉鷹山の特集（県公式PDF）","q":{"ja":"ケネディ大統領が尊敬する日本人として答えたと言われる人物は？","en":"Whom is Kennedy said to have named as an admired Japanese?"},"c":[{"ja":"上杉鷹山","en":"Uesugi Yozan"},{"ja":"織田信長","en":"Oda Nobunaga"},{"ja":"坂本龍馬","en":"Sakamoto Ryoma"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：天童将棋駒","en":"Souvenir: Tendo shogi pieces"},"text":{"ja":"天童将棋駒は、山形県天童の将棋の駒。経済産業省東北局の資料に、「天童将棋駒伝統工芸士」の受賞記録がある。※国の指定や特徴は、資料に書かれていなかった。","en":"Tendo shogi pieces are the shogi pieces of Tendo, Yamagata. A Tohoku METI document records a 'Tendo shogi piece traditional craftsman' award. *Designation and features were not in the source."},"tag":"x","s":"経済産業省東北経済産業局「伝統的工芸品月間」資料","q":{"ja":"天童の駒は、何のゲームの駒？","en":"Which game are Tendo's pieces for?"},"c":[{"ja":"将棋","en":"Shogi"},{"ja":"囲碁","en":"Go"},{"ja":"チェス","en":"Chess"}],"a":0},"kenmin":{"title":{"ja":"おだやかで人情にあつい","en":"Gentle and warm-hearted"},"text":{"ja":"山形の人は、おだやかで人情にあつく、まじめだと、よく言われる。","en":"People of Yamagata are often said to be gentle, warm-hearted and earnest."},"tag":"k","s":"俗説・出典未確認","q":null}}},{"id":"akita","ja":"秋田県","en":"Akita","ll":[39.719,140.102],"cap":{"ja":"秋田市","en":"Akita City"},"intro":{"ja":"イナリ「山形から秋田に着いたで！ なまはげに会えるやろか。」\nハチマン「きりたんぽの匂いがしてきたな。」","en":"Inari: \"We've come from Yamagata to Akita! Will we meet the Namahage?\"\nHachiman: \"I can already smell the kiritanpo.\""},"towns":[{"n":{"ja":"秋田","en":"Akita"},"ll":[39.72,140.103],"w":{"ja":"久保田城跡がある県庁所在地","en":"The capital, with Kubota Castle's ruins"}},{"n":{"ja":"男鹿","en":"Oga"},"ll":[39.886,139.847],"w":{"ja":"なまはげの半島","en":"The Namahage peninsula"}},{"n":{"ja":"仙北（角館）","en":"Semboku (Kakunodate)"},"ll":[39.597,140.564],"w":{"ja":"みちのくの小京都","en":"The 'Little Kyoto of Michinoku'"}},{"n":{"ja":"大館","en":"Odate"},"ll":[40.272,140.565],"w":{"ja":"秋田犬とハチ公の故郷","en":"Home of the Akita dog and Hachiko"}},{"n":{"ja":"横手","en":"Yokote"},"ll":[39.311,140.567],"w":{"ja":"県南の中心都市","en":"A hub city of the south"}},{"n":{"ja":"能代","en":"Noshiro"},"ll":[40.212,140.028],"w":{"ja":"日本海に面した港町","en":"A port town on the Sea of Japan"}},{"n":{"ja":"大仙","en":"Daisen"},"ll":[39.453,140.476],"w":{"ja":"県南の都市","en":"A city of the south"}},{"n":{"ja":"湯沢","en":"Yuzawa"},"ll":[39.164,140.495],"w":{"ja":"稲庭うどんの町","en":"The town of Inaniwa udon"}}],"topics":{"famous":{"title":{"ja":"秋田県と言えば","en":"Known for"},"text":{"ja":"・なまはげ\n・きりたんぽ\n・秋田犬\n・竿燈まつり\n・角館の武家屋敷","en":"• Namahage\n• Kiritanpo\n• The Akita dog\n• Kanto Festival\n• Kakunodate's samurai houses"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"秋田県の町","en":"Towns of Akita"},"text":{"ja":"秋田　久保田城跡がある県庁所在地\n男鹿　なまはげの半島\n仙北（角館）　みちのくの小京都\n大館　秋田犬とハチ公の故郷\n横手　県南の中心都市\n能代　日本海に面した港町\n大仙　県南の都市\n湯沢　稲庭うどんの町","en":"Akita – The capital, with Kubota Castle's ruins\nOga – The Namahage peninsula\nSemboku (Kakunodate) – The 'Little Kyoto of Michinoku'\nOdate – Home of the Akita dog and Hachiko\nYokote – A hub city of the south\nNoshiro – A port town on the Sea of Japan\nDaisen – A city of the south\nYuzawa – The town of Inaniwa udon"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null},"cap":{"title":{"ja":"県庁所在地：秋田市","en":"Prefectural capital: Akita City"},"text":{"ja":"秋田県の県庁所在地は、秋田市。久保田城は、1603年に佐竹義宣が築いた佐竹氏の居城。石垣がほとんどなく、防御は堀と土塁が中心で、天守も造られなかった。今は千秋公園として、市民の憩いの場になっている。","en":"The capital of Akita is Akita City. Kubota Castle was built in 1603 by Satake Yoshinobu as the Satake clan's seat; it had almost no stone walls, relied on moats and earthworks and never had a keep. Today it is Senshu Park."},"tag":"f","s":"nippon.com「久保田城」","q":{"ja":"久保田城に造られなかったものは？","en":"What was never built at Kubota Castle?"},"c":[{"ja":"天守","en":"A keep"},{"ja":"堀","en":"A moat"},{"ja":"土塁","en":"Earthworks"}],"a":0},"shrine":{"title":{"ja":"真山神社（男鹿）","en":"Shinzan Shrine (Oga)"},"text":{"ja":"男鹿の真山神社では、民俗行事「なまはげ」と神事「柴灯祭」を組み合わせた冬の観光行事「なまはげ柴灯まつり」が行われる。境内に焚き上げられた柴灯火のもとで、なまはげが乱舞する。※神社の創建や祭神は、資料に書かれていなかった。","en":"At Shinzan Shrine in Oga, the winter 'Namahage Sedo Festival' combines the folk ritual Namahage with the Shinto rite Sedo-sai: Namahage dance wildly around the sedo fire lit in the precincts. *The shrine's founding and deity were not in the source."},"tag":"f","s":"JR東日本秋田支社「なまはげ柴灯まつり」案内","q":{"ja":"真山神社で行われる冬の行事は？","en":"Which winter event is held at Shinzan Shrine?"},"c":[{"ja":"なまはげ柴灯まつり","en":"Namahage Sedo Festival"},{"ja":"ねぶた祭","en":"Nebuta Festival"},{"ja":"花笠まつり","en":"Hanagasa Festival"}],"a":0},"food":{"title":{"ja":"名物：稲庭うどん","en":"Specialty: Inaniwa udon"},"text":{"ja":"稲庭うどんは、秋田県湯沢市稲庭町の手延べうどん。江戸時代初期に製法を確立したとされ、1752年には秋田藩主・佐竹侯の御用達になった。油を使わずに作る平らな細麺で、しっかりしたコシがある。","en":"Inaniwa udon is hand-stretched udon from Inaniwa, Yuzawa. Its method is said to have been established in the early Edo period, and in 1752 it became a supplier to the Satake lord. It is made without oil as flat, thin noodles with a firm bite."},"tag":"l","s":"農林水産省「aff」ニッポン麺探訪","q":{"ja":"稲庭うどんの産地は？","en":"Where does Inaniwa udon come from?"},"c":[{"ja":"湯沢市稲庭町","en":"Inaniwa, Yuzawa"},{"ja":"大館市","en":"Odate"},{"ja":"男鹿市","en":"Oga"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：きりたんぽ鍋","en":"Local eats: Kiritanpo hot pot"},"text":{"ja":"きりたんぽ鍋は、つぶしたご飯をすぎの木の棒に巻いて焼いた「きりたんぽ」を、とりガラと調味料で作った鍋に入れて食べる。大館や鹿角地方が発祥の地といわれている。","en":"In kiritanpo hot pot, mashed rice is wrapped around a cedar stick and grilled into 'kiritanpo', then simmered in a chicken-bone broth. The Odate and Kazuno area is said to be its birthplace."},"tag":"f","s":"農林水産省 こども向け「きりたんぽ」","q":{"ja":"きりたんぽ鍋の発祥の地といわれるのは？","en":"Where is kiritanpo hot pot said to have started?"},"c":[{"ja":"大館・鹿角","en":"Odate / Kazuno"},{"ja":"男鹿","en":"Oga"},{"ja":"湯沢","en":"Yuzawa"}],"a":0},"sake":{"title":{"ja":"お酒：酒米「秋田酒こまち」","en":"Sake: the brewing rice Akita Sake Komachi"},"text":{"ja":"「秋田酒こまち」は、秋田県の気象に合わせて育てられた酒造好適米。「美山錦」並の栽培のしやすさと、「山田錦」並の醸造のしやすさを兼ね備え、吟醸酒用の原料米として有望とされる。※味わいは、資料に書かれていなかった。お酒は、20歳になってから。","en":"Akita Sake Komachi is a brewing rice bred for Akita's climate, with the growing ease of Miyama Nishiki and the brewing quality of Yamada Nishiki, and is considered promising for ginjo sake. *Tasting notes were not in the source. Sake is for adults only."},"tag":"f","s":"秋田県「秋田酒こまち」（県公式PDF）","q":{"ja":"秋田酒こまちは、何のための米？","en":"What is Akita Sake Komachi rice for?"},"c":[{"ja":"酒づくり","en":"Brewing sake"},{"ja":"せんべい","en":"Rice crackers"},{"ja":"おにぎり","en":"Rice balls"}],"a":0},"history":{"title":{"ja":"歴史：角館","en":"History: Kakunodate"},"text":{"ja":"角館は、江戸時代に栄えた城下町で、「みちのくの小京都」と呼ばれる。武家屋敷群の表通りは、国の重要伝統的建造物群保存地区。町内には約400本のシダレザクラがあり、162本が国の天然記念物。見頃は4月下旬から5月上旬。","en":"Kakunodate, a castle town that flourished in the Edo period, is called the 'Little Kyoto of Michinoku'. The main street of its samurai houses is a nationally designated Preservation District, and of about 400 weeping cherry trees in town, 162 are Natural Monuments. They bloom from late April to early May."},"tag":"f","s":"東北観光推進機構「角館」","q":{"ja":"角館の天然記念物のシダレザクラは、いくつ？","en":"How many of Kakunodate's weeping cherries are Natural Monuments?"},"c":[{"ja":"162本","en":"162"},{"ja":"5本","en":"5"},{"ja":"1000本","en":"1,000"}],"a":0,"more":[{"title":{"ja":"小田野直武と解体新書","en":"Odano Naotake and Kaitai Shinsho"},"text":{"ja":"小田野直武は、秋田藩の絵師。藩主・佐竹曙山の命で江戸に出て、平賀源内のもとで約5年、洋書を読み西洋画法を学んだ。日本初の西洋医学書の翻訳『解体新書』の挿絵を手がけ、曙山とともに「秋田蘭画」の主要な画家になった。源内が投獄された翌年の春、郷里の角館で急逝した。※生没年は、資料に書かれていなかった。","en":"Odano Naotake was a painter of the Akita domain. Sent to Edo by lord Satake Shozan, he spent about five years under Hiraga Gennai learning Western painting from foreign books, illustrated 'Kaitai Shinsho', Japan's first translation of a Western medical book, and became a leading painter of 'Akita Ranga'. He died suddenly in his hometown Kakunodate the spring after Gennai was jailed. *His dates were not in the source."},"tag":"f","s":"国際教養大学「秋田蘭画」資料"}]},"matsuri":{"title":{"ja":"秋田竿燈まつり","en":"Akita Kanto Festival"},"text":{"ja":"秋田竿燈まつりは、毎年8月3日から6日。長さ12mの竹の竿に、最大の「大若」では46個の提灯を吊るし、重さは50kgにもなる。その竿燈を、手のひら・額・肩・腰へと移しかえる妙技で、差し手が見せる。","en":"The Akita Kanto Festival runs 3–6 August. The biggest 'Owaka' pole, a 12 m bamboo, carries 46 lanterns and weighs 50 kg, and performers pass it from palm to forehead, shoulder and hip."},"tag":"f","s":"gltjp「秋田竿燈まつり」（旅行情報サイト）","q":{"ja":"最大の竿燈「大若」の提灯は、いくつ？","en":"How many lanterns does the biggest pole, Owaka, carry?"},"c":[{"ja":"46個","en":"46"},{"ja":"10個","en":"10"},{"ja":"100個","en":"100"}],"a":0,"more":[{"title":{"ja":"なまはげ","en":"Namahage"},"text":{"ja":"ナマハゲは、大晦日に村の家々を回り、厄や穢れを祓い、豊作・豊漁を招く行事。怠けている人を叱り、新年によい人間になると約束させる。山の神々の化身と信じられ、2018年に「来訪神：仮面・仮装の神々」の一つとしてユネスコ無形文化遺産に登録された。","en":"On New Year's Eve the Namahage go from house to house to drive out misfortune and invite good harvests and catches, scold the idle and make people promise to be better in the new year. Believed to be incarnations of mountain gods, they were listed in 2018 as part of the UNESCO 'Raihoshin: ritual visits of deities in masks and costumes'."},"tag":"f","s":"国土交通省「多言語解説文データベース」なまはげ館"}]},"person":{"title":{"ja":"小野小町","en":"Ono no Komachi"},"text":{"ja":"小野小町は、平安時代の歌人。秋田県湯沢市の小野地域は、小野小町誕生の地と伝わり、父親の館があったと言い伝えられ、小町伝説が色濃く残る史跡の里。6月中旬には「小町まつり」が開かれる。※生まれた場所や生涯には諸説あるとされるが、その点は資料に書かれていなかった。","en":"Ono no Komachi was a poet of the Heian period. The Ono district of Yuzawa, Akita, is said to be her birthplace, her father's mansion is said to have stood there, and Komachi legends remain strong in this land of historic sites. A 'Komachi Festival' is held in mid-June. *Her birthplace and life are said to be disputed, but that was not stated in the source."},"tag":"l","s":"秋田県「元気ムラ」湯沢市小野（県公式PDF）","q":{"ja":"小野小町の誕生の地と伝わるのは？","en":"Where is Ono no Komachi said to have been born?"},"c":[{"ja":"湯沢市小野","en":"Ono, Yuzawa"},{"ja":"男鹿市","en":"Oga"},{"ja":"大館市","en":"Odate"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：大館曲げわっぱ","en":"Souvenir: Odate Magewappa"},"text":{"ja":"大館曲げわっぱは、秋田県大館の曲げ物の工芸品。経済産業省東北局の資料に、「大館曲げわっぱ伝統工芸士」の受賞記録がある。※国の指定や材料・特徴は、資料に書かれていなかった。","en":"Odate Magewappa is a bentwood craft of Odate, Akita. A Tohoku METI document records an 'Odate Magewappa traditional craftsman' award. *Designation, materials and features were not in the source."},"tag":"x","s":"経済産業省東北経済産業局「伝統的工芸品月間」資料","q":{"ja":"大館曲げわっぱの産地は？","en":"Where is Odate Magewappa made?"},"c":[{"ja":"大館","en":"Odate"},{"ja":"男鹿","en":"Oga"},{"ja":"能代","en":"Noshiro"}],"a":0},"kenmin":{"title":{"ja":"おっとりと、がまん強い","en":"Easygoing and patient"},"text":{"ja":"秋田の人は、おっとりしていて、がまん強く、お酒が好きだと、よく言われる。","en":"People of Akita are often said to be easygoing, patient and fond of a drink."},"tag":"k","s":"俗説・出典未確認","q":null}}},{"id":"iwate","ja":"岩手県","en":"Iwate","ll":[39.704,141.153],"cap":{"ja":"盛岡市","en":"Morioka City"},"intro":{"ja":"イナリ「秋田から秋田新幹線で、岩手に着いたで！ 東北でいちばん広い県やで。」\nハチマン「中尊寺の金色堂、この目で見たいな。」","en":"Inari: \"The Akita Shinkansen has brought us to Iwate — the biggest prefecture in Tohoku!\"\nHachiman: \"I want to see Chusonji's Golden Hall with my own eyes.\""},"towns":[{"n":{"ja":"盛岡","en":"Morioka"},"ll":[39.703,141.153],"w":{"ja":"盛岡城跡がある県庁所在地","en":"The capital, with Morioka Castle's ruins"}},{"n":{"ja":"平泉","en":"Hiraizumi"},"ll":[38.989,141.115],"w":{"ja":"世界遺産・中尊寺の町","en":"The World Heritage town of Chusonji"}},{"n":{"ja":"花巻","en":"Hanamaki"},"ll":[39.388,141.114],"w":{"ja":"宮沢賢治の故郷","en":"Miyazawa Kenji's hometown"}},{"n":{"ja":"遠野","en":"Tono"},"ll":[39.329,141.533],"w":{"ja":"民話の里","en":"A land of folk tales"}},{"n":{"ja":"宮古","en":"Miyako"},"ll":[39.64,141.957],"w":{"ja":"三陸の港町","en":"A Sanriku port town"}},{"n":{"ja":"釜石","en":"Kamaishi"},"ll":[39.276,141.886],"w":{"ja":"三陸の港町","en":"A Sanriku port town"}},{"n":{"ja":"一関","en":"Ichinoseki"},"ll":[38.934,141.127],"w":{"ja":"県南の中心都市","en":"A hub city of the south"}},{"n":{"ja":"久慈","en":"Kuji"},"ll":[40.19,141.776],"w":{"ja":"県北の港町","en":"A port town of the north"}}],"topics":{"famous":{"title":{"ja":"岩手県と言えば","en":"Known for"},"text":{"ja":"・中尊寺金色堂\n・わんこそば\n・盛岡冷麺\n・宮沢賢治\n・南部鉄器","en":"• Chusonji's Golden Hall\n• Wanko soba\n• Morioka reimen\n• Miyazawa Kenji\n• Nambu ironware"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"岩手県の町","en":"Towns of Iwate"},"text":{"ja":"盛岡　盛岡城跡がある県庁所在地\n平泉　世界遺産・中尊寺の町\n花巻　宮沢賢治の故郷\n遠野　民話の里\n宮古　三陸の港町\n釜石　三陸の港町\n一関　県南の中心都市\n久慈　県北の港町","en":"Morioka – The capital, with Morioka Castle's ruins\nHiraizumi – The World Heritage town of Chusonji\nHanamaki – Miyazawa Kenji's hometown\nTono – A land of folk tales\nMiyako – A Sanriku port town\nKamaishi – A Sanriku port town\nIchinoseki – A hub city of the south\nKuji – A port town of the north"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null},"cap":{"title":{"ja":"県庁所在地：盛岡市","en":"Prefectural capital: Morioka City"},"text":{"ja":"岩手県の県庁所在地は、盛岡市。盛岡城は、初代盛岡藩主の南部信直と、その子の2代藩主・利直が、1597年頃から1633年まで、約40年をかけて築いた。雄大な石垣が良好に残り、昭和12年に国の史跡に指定されている。","en":"The capital of Iwate is Morioka City. Morioka Castle was built over some 40 years, from about 1597 to 1633, by the first lord Nanbu Nobunao and his son Toshinao. Its grand stone walls survive well and it has been a national historic site since 1937."},"tag":"f","s":"盛岡市「盛岡城跡」資料","q":{"ja":"盛岡城を築いた期間は、およそ何年？","en":"About how long did building Morioka Castle take?"},"c":[{"ja":"約40年","en":"About 40 years"},{"ja":"約4年","en":"About 4 years"},{"ja":"約400年","en":"About 400 years"}],"a":0},"shrine":{"title":{"ja":"中尊寺（平泉）","en":"Chusonji (Hiraizumi)"},"text":{"ja":"中尊寺は、850年に慈覚大師円仁によって開かれたとされる。金色堂は、創建当時（1124年）の姿を唯一残す建造物で、国宝建造物の第1号。清衡の祈りが結晶となったお堂だ。","en":"Chusonji is said to have been opened in 850 by the monk Jikaku Daishi Ennin. The Golden Hall, the only building that keeps its original 1124 form, was the first building designated a National Treasure — the crystallization of Kiyohira's prayers."},"tag":"f","s":"gltjp「中尊寺」（旅行情報サイト）","q":{"ja":"中尊寺の金色堂が持つのは？","en":"What is special about Chusonji's Golden Hall?"},"c":[{"ja":"国宝建造物の第1号","en":"The first National Treasure building"},{"ja":"日本一高い塔","en":"Japan's tallest tower"},{"ja":"日本最古の鳥居","en":"Japan's oldest torii"}],"a":0},"food":{"title":{"ja":"名物：わんこそば","en":"Specialty: Wanko soba"},"text":{"ja":"わんこそばは、南部家27世の利直公が江戸へ向かう途中、花巻に立ち寄った際、何度もおかわりされたと伝えられる。椀に一口ずつ給仕されるそばを次々に食べ、何杯食べられたかを競う。もとは、お客にたくさん食べてもらう「おもてなしの食文化」だった。","en":"Wanko soba is said to come from Lord Nanbu Toshinao, who stopped in Hanamaki on his way to Edo and asked for seconds again and again. Bite-sized servings of soba arrive bowl after bowl and people compete on how many they eat; it began as 'omotenashi' hospitality."},"tag":"l","s":"文化庁「100年フード」岩手県","q":{"ja":"わんこそばの、もとの心は？","en":"What spirit did wanko soba start from?"},"c":[{"ja":"おもてなし","en":"Hospitality"},{"ja":"競争","en":"Competition"},{"ja":"節約","en":"Saving money"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：盛岡の麺","en":"Local eats: Morioka's noodles"},"text":{"ja":"盛岡冷麺とじゃじゃ麺は、「盛岡三大麺」の一つに数えられている。※由来や食べ方は、資料に名前だけで、書かれていなかった。","en":"Morioka reimen and jajamen are counted among the 'Three Great Noodles of Morioka'. *Their origins and how to eat them were only named in the source, not described."},"tag":"f","s":"文化庁「100年フード」岩手県","q":{"ja":"「盛岡三大麺」に名前が挙がるのは？","en":"Which is named among Morioka's Three Great Noodles?"},"c":[{"ja":"じゃじゃ麺","en":"Jajamen"},{"ja":"ラーメン二郎","en":"Ramen Jiro"},{"ja":"そうめん","en":"Somen"}],"a":0},"sake":{"title":{"ja":"お酒：清酒「岩手」","en":"Sake: 'Iwate' GI"},"text":{"ja":"清酒「岩手」は、2023年9月25日に国の地理的表示（GI）に指定された。国内産米を使い、水は岩手県内で採水したものだけ。口当たりが柔らかく、米の旨味が穏やかに広がり、香りは青竹や新緑のよう。純米吟醸酒や吟醸酒では、青りんごや洋梨のような果実香もあるとされる。「ひっつみ」など温かい料理と相性が良い。お酒は、20歳になってから。","en":"Iwate sake was designated a national GI on 25 September 2023. It uses domestic rice and only water drawn within Iwate. It is described as soft on the palate, with gentle rice umami, a fresh bamboo-and-greenery aroma, and green-apple or pear notes in ginjo types, good with warm dishes such as hittsumi. Sake is for adults only."},"tag":"f","s":"国税庁「地理的表示『岩手』」","q":{"ja":"清酒「岩手」の水は？","en":"What about the water for Iwate sake?"},"c":[{"ja":"県内で採水したもののみ","en":"Only water drawn in Iwate"},{"ja":"輸入の水","en":"Imported water"},{"ja":"決まりなし","en":"No rule"}],"a":0},"history":{"title":{"ja":"歴史：平泉と藤原清衡","en":"History: Hiraizumi and Fujiwara no Kiyohira"},"text":{"ja":"藤原清衡は、12世紀初頭に中尊寺を本格的に造営した。2011年に、「平泉―仏国土（浄土）を表す建築・庭園及び考古学的遺跡群―」の構成資産のひとつとして、中尊寺は世界文化遺産に登録された。","en":"Fujiwara no Kiyohira began full construction of Chusonji in the early 12th century. In 2011 Chusonji was inscribed as part of 'Hiraizumi — Temples, Gardens and Archaeological Sites Representing the Buddhist Pure Land' on the World Heritage list."},"tag":"f","s":"gltjp「中尊寺」（旅行情報サイト）","q":{"ja":"平泉が世界文化遺産に登録された年は？","en":"In what year was Hiraizumi inscribed as World Heritage?"},"c":[{"ja":"2011年","en":"2011"},{"ja":"1993年","en":"1993"},{"ja":"2021年","en":"2021"}],"a":0},"matsuri":{"title":{"ja":"盛岡さんさ踊り","en":"Morioka Sansa Odori"},"text":{"ja":"盛岡さんさ踊りは、夏の盛岡の祭り。2024年の案内では、8月1日～4日、18時から。※由来や太鼓の数は、資料に書かれていなかった。","en":"The Morioka Sansa Odori is Morioka's summer festival; the 2024 guide listed 1–4 August from 6 pm. *Its origin and drum numbers were not in the source."},"tag":"f","s":"盛岡市「盛岡観光」案内（令和6年）","q":{"ja":"盛岡さんさ踊りは、何月？","en":"In which month is the Sansa Odori?"},"c":[{"ja":"8月","en":"August"},{"ja":"1月","en":"January"},{"ja":"4月","en":"April"}],"a":0},"person":{"title":{"ja":"宮沢賢治","en":"Miyazawa Kenji"},"text":{"ja":"宮沢賢治（1896～1933）は、花巻の生まれ。『銀河鉄道の夜』や『雨ニモマケズ』などの童話や詩は、今も親しまれている。1933年9月、37歳で亡くなった。","en":"Miyazawa Kenji (1896–1933) was born in Hanamaki. His tales and poems such as 'Night on the Galactic Railroad' and 'Ame ni mo Makezu' are still loved. He died in September 1933 at 37."},"tag":"f","s":"nippon.com「宮沢賢治」","q":{"ja":"宮沢賢治の作品は？","en":"Which is a Miyazawa Kenji work?"},"c":[{"ja":"銀河鉄道の夜","en":"Night on the Galactic Railroad"},{"ja":"吾輩は猫である","en":"I Am a Cat"},{"ja":"羅生門","en":"Rashomon"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：南部鉄器","en":"Souvenir: Nambu ironware"},"text":{"ja":"南部鉄器は、江戸時代初頭に、盛岡藩主の南部氏が京都や甲州の鋳物職人を召し抱えたことで始まったとされる。高温の炭火で焼き上げる「釜焼き」で内側に酸化皮膜を作り、サビを防ぐ。表面の粒状の模様「あられ文様」は、鉄の厚みを出し、保温効果を高める先人の知恵とされる。","en":"Nambu ironware is said to have begun in the early Edo period when the Nanbu lords of Morioka took on casters from Kyoto and Kai. 'Kamayaki' firing over hot charcoal forms an oxide film inside that prevents rust, and the beaded 'arare' pattern is said to thicken the iron and keep heat in."},"tag":"f","s":"nippon.com「南部鉄器」","q":{"ja":"あられ文様の意味は？","en":"What is the arare pattern for?"},"c":[{"ja":"保温効果を高める","en":"Better heat retention"},{"ja":"毒を見分ける","en":"Spotting poison"},{"ja":"すべり止め","en":"Anti-slip"}],"a":0},"kenmin":{"title":{"ja":"がまん強く、ひかえめ","en":"Patient and reserved"},"text":{"ja":"岩手の人は、がまん強く、ひかえめだと、よく言われる。","en":"People of Iwate are often said to be patient and reserved."},"tag":"k","s":"俗説・出典未確認","q":null}}},{"id":"aomori","ja":"青森県","en":"Aomori","ll":[40.824,140.74],"cap":{"ja":"青森市","en":"Aomori City"},"intro":{"ja":"イナリ「盛岡から東北新幹線で、青森に着いたで！ 本州のてっぺんや！」\nハチマン「ねぶたの熱気を感じたいな。」","en":"Inari: \"The Tohoku Shinkansen brought us from Morioka to Aomori — the top of Honshu!\"\nHachiman: \"I want to feel the Nebuta heat.\""},"towns":[{"n":{"ja":"青森","en":"Aomori"},"ll":[40.822,140.747],"w":{"ja":"八甲田丸のある県庁所在地","en":"The capital, with the Hakkoda-maru ship"}},{"n":{"ja":"弘前","en":"Hirosaki"},"ll":[40.603,140.464],"w":{"ja":"津軽の城下町","en":"A Tsugaru castle town"}},{"n":{"ja":"八戸","en":"Hachinohe"},"ll":[40.512,141.488],"w":{"ja":"せんべい汁の町","en":"The town of senbei-jiru"}},{"n":{"ja":"十和田","en":"Towada"},"ll":[40.612,141.206],"w":{"ja":"県東部の都市","en":"A city of the east"}},{"n":{"ja":"むつ","en":"Mutsu"},"ll":[41.292,141.183],"w":{"ja":"下北半島の中心。恐山がある","en":"Hub of the Shimokita Peninsula, home of Osorezan"}},{"n":{"ja":"五所川原","en":"Goshogawara"},"ll":[40.808,140.44],"w":{"ja":"津軽の都市","en":"A city of Tsugaru"}},{"n":{"ja":"三沢","en":"Misawa"},"ll":[40.683,141.368],"w":{"ja":"県東部の都市","en":"A city of the east"}}],"topics":{"famous":{"title":{"ja":"青森県と言えば","en":"Known for"},"text":{"ja":"・ねぶた祭\n・りんご\n・三内丸山遺跡\n・恐山\n・津軽塗","en":"• Nebuta Festival\n• Apples\n• Sannai-Maruyama site\n• Mt. Osore\n• Tsugaru lacquerware"},"tag":"k","s":"一般に知られた県のイメージ（公式ページでの確認はしていない）","q":null},"towns":{"title":{"ja":"青森県の町","en":"Towns of Aomori"},"text":{"ja":"青森　八甲田丸のある県庁所在地\n弘前　津軽の城下町\n八戸　せんべい汁の町\n十和田　県東部の都市\nむつ　下北半島の中心。恐山がある\n五所川原　津軽の都市\n三沢　県東部の都市","en":"Aomori – The capital, with the Hakkoda-maru ship\nHirosaki – A Tsugaru castle town\nHachinohe – The town of senbei-jiru\nTowada – A city of the east\nMutsu – Hub of the Shimokita Peninsula, home of Osorezan\nGoshogawara – A city of Tsugaru\nMisawa – A city of the east"},"tag":"x","s":"一般的な観光情報（公式ページでの確認はしていない）。地図の点の位置は目安","q":null},"cap":{"title":{"ja":"県庁所在地：青森市","en":"Prefectural capital: Aomori City"},"text":{"ja":"青森県の県庁所在地は、青森市。青森港には、青函連絡船「八甲田丸」が、記念館として保存されている。連絡船は、1908年から1988年までの80年間、青森と函館を結んだ。世界的にも珍しい、鉄道車両を運ぶスペースがある。","en":"The capital of Aomori is Aomori City. In Aomori Port, the ferry Hakkoda-maru is preserved as a museum; the Seikan ferries linked Aomori and Hakodate for 80 years, 1908–1988, and had a rare space for carrying railway cars."},"tag":"f","s":"東北観光推進機構「青函連絡船メモリアルシップ八甲田丸」","q":{"ja":"青函連絡船が結んだ期間は？","en":"How long did the Seikan ferries run?"},"c":[{"ja":"80年間","en":"80 years"},{"ja":"8年間","en":"8 years"},{"ja":"30年間","en":"30 years"}],"a":0},"shrine":{"title":{"ja":"恐山","en":"Mt. Osore (Osorezan)"},"text":{"ja":"下北半島の霊場・恐山は、比叡山・高野山とともに日本三大霊山といわれる。恐山菩提寺の創建は862年で、慈覚大師円仁が開山したと伝えられる。カルデラ湖の宇曽利山湖のほとりに、極楽浜や、硫黄の匂いが立ち込める地獄谷などがある。","en":"Osorezan on the Shimokita Peninsula is counted with Mt. Hiei and Mt. Koya as one of Japan's Three Great Sacred Mountains. Osorezan Bodaiji was founded in 862 and is said to have been opened by Jikaku Daishi Ennin. Beside the caldera lake Usori, it has the serene Gokuraku-hama and the sulphur-scented Jigoku-dani."},"tag":"l","s":"東北観光推進機構「恐山」","q":{"ja":"恐山菩提寺の創建は？","en":"When was Osorezan Bodaiji founded?"},"c":[{"ja":"862年","en":"862"},{"ja":"1868年","en":"1868"},{"ja":"1603年","en":"1603"}],"a":0,"more":[{"title":{"ja":"岩木山神社","en":"Iwakiyama Shrine"},"text":{"ja":"岩木山神社は、今から1200年あまり前に、岩木山頂に社殿を創建したことを起源とする。「北門鎮護の名社」で、歴代の津軽藩主が大造営した社殿群が現存する。","en":"Iwakiyama Shrine traces its origin to a hall built on Mt. Iwaki's summit over 1,200 years ago. A 'famous shrine guarding the northern gate', its buildings, greatly rebuilt by successive Tsugaru lords, survive today."},"tag":"f","s":"東北観光推進機構「岩木山神社」"}]},"food":{"title":{"ja":"名物：りんご","en":"Specialty: Apples"},"text":{"ja":"青森県は、りんごの栽培面積・収穫量ともに全国一の産地。どちらも、全国の半分以上を占める。","en":"Aomori is Japan's top apple producer in both planted area and harvest, each more than half the national total."},"tag":"f","s":"青森県「農業（子ども向けページ）」","q":{"ja":"青森のりんごは、全国のどのくらい？","en":"How much of Japan's apple output is Aomori's?"},"c":[{"ja":"半分以上","en":"More than half"},{"ja":"1割","en":"One tenth"},{"ja":"3割","en":"30 percent"}],"a":0},"gourmet":{"title":{"ja":"ご当地グルメ：せんべい汁","en":"Local eats: Senbei-jiru"},"text":{"ja":"せんべい汁は、約200年前から家庭で食べられてきた。冷害が多く米が取れにくかった地域の貴重な保存食だった。小麦粉を練って焼いたせんべいを、とりのだしの汁に、野菜や糸こんにゃくなどと入れて煮る。八戸市では、約200軒の飲食店で食べられる。","en":"Senbei-jiru has been eaten at home for about 200 years, a precious preserved food in a region of cold damage and poor rice harvests. Baked flour crackers are simmered in chicken broth with vegetables and shirataki. In Hachinohe about 200 restaurants serve it."},"tag":"f","s":"農林水産省 こども向け「せんべい汁」","q":{"ja":"せんべい汁の、せんべいの原料は？","en":"What are the crackers in senbei-jiru made of?"},"c":[{"ja":"小麦粉","en":"Wheat flour"},{"ja":"お米だけ","en":"Rice only"},{"ja":"そば粉","en":"Buckwheat flour"}],"a":0},"sake":{"title":{"ja":"お酒：清酒「青森」","en":"Sake: 'Aomori' GI"},"text":{"ja":"青森県の清酒は、国の地理的表示（GI）に指定され、令和7年（2025年）6月20日が指定日として国税庁の一覧に載る。※酒質や味わいの特徴は、資料に書かれていなかったので載せていない。お酒は、20歳になってから。","en":"Aomori sake has been designated a national GI, listed by the National Tax Agency as of 20 June 2025. *Tasting notes were not in the source, so none are given. Sake is for adults only."},"tag":"f","s":"国税庁「地理的表示（GI）一覧」／青森県発表","q":{"ja":"清酒「青森」がGIに指定された年は？","en":"In what year was Aomori sake given GI status?"},"c":[{"ja":"2025年","en":"2025"},{"ja":"1995年","en":"1995"},{"ja":"2010年","en":"2010"}],"a":0},"history":{"title":{"ja":"歴史：三内丸山遺跡","en":"History: Sannai-Maruyama"},"text":{"ja":"三内丸山遺跡は、約5900年前から4200年前まで定住生活が営まれていたと推測される、42ヘクタールの大規模集落跡。直径2m・深さ2mの6つの柱穴をもつ大型掘立柱建物は、高さ20m級の祭祀場など、諸説ある。2021年7月に、「北海道・北東北の縄文遺跡群」の一つとして世界文化遺産に登録された。","en":"Sannai-Maruyama is a 42-hectare settlement where people are thought to have lived from about 5,900 to 4,200 years ago. Its large post-built structure, with six pits 2 m wide and 2 m deep, is explained by various theories, such as a ritual tower about 20 m tall. In July 2021 it was inscribed with the 'Jomon Prehistoric Sites in Northern Japan'."},"tag":"f","s":"nippon.com「三内丸山遺跡」","q":{"ja":"三内丸山遺跡が世界遺産になった年は？","en":"In what year did Sannai-Maruyama become World Heritage?"},"c":[{"ja":"2021年","en":"2021"},{"ja":"1993年","en":"1993"},{"ja":"2011年","en":"2011"}],"a":0},"matsuri":{"title":{"ja":"青森ねぶた祭","en":"Aomori Nebuta Festival"},"text":{"ja":"青森のねぶたは、昭和55年（1980年）1月28日に国の重要無形民俗文化財に指定された。歴史上の人物などをかたどった人形型の灯籠「組ねぶた」を、笛と太鼓に合わせ、多数のハネトが踊りながら練り歩く。7月7日の「眠り流し」という、眠気を送り出す風習が、灯籠の行事に発展したとされる。","en":"Aomori's Nebuta was designated an Important Intangible Folk Cultural Property on 28 January 1980. Lantern floats shaped like historic figures parade to flutes and drums with crowds of dancers called Haneto. It is said to have grown out of 'Nemuri-nagashi', a custom of sending off drowsiness on 7 July."},"tag":"f","s":"青森県教育委員会「青森のねぶた」","q":{"ja":"ねぶたで踊る人は？","en":"What are the dancers at Nebuta called?"},"c":[{"ja":"ハネト","en":"Haneto"},{"ja":"差し手","en":"Sashite"},{"ja":"山伏","en":"Yamabushi"}],"a":0,"more":[{"title":{"ja":"お山参詣（岩木山神社）","en":"Oyama Sankei (Iwakiyama Shrine)"},"text":{"ja":"お山参詣は、毎年旧暦8月1日に行われる津軽地方最大の秋祭りで、国の文化財に指定されている。","en":"Oyama Sankei, held every year on 1 August in the old calendar, is Tsugaru's biggest autumn festival and is nationally designated as a cultural property."},"tag":"f","s":"東北観光推進機構「岩木山神社」"},{"title":{"ja":"恐山大祭","en":"Osorezan Grand Festival"},"text":{"ja":"恐山大祭は、例年7月20日から24日に行われる。大祭や秋詣りの時期には、イタコと呼ばれる巫女が死者の霊を呼ぶとされ、多くの人が訪れる。10月上旬の連休には「恐山秋詣り」もある。","en":"The Osorezan Grand Festival is held each year from 20 to 24 July. At the festival and the autumn pilgrimage, priestesses called itako are said to call the spirits of the dead, drawing many visitors; an autumn pilgrimage also takes place on the early-October holiday weekend."},"tag":"l","s":"東北観光推進機構「恐山」"}]},"person":{"title":{"ja":"棟方志功","en":"Munakata Shiko"},"text":{"ja":"棟方志功（1903～1975）は、青森の生まれの木版画家。1956年のヴェネツィア・ビエンナーレでグランプリを受賞し、1970年に文化勲章を授与された。絵画・陶芸・書の作品もあり、民芸運動と近い関係にあった。","en":"Munakata Shiko (1903–1975), born in Aomori, was a woodblock-print artist who won the Grand Prix at the 1956 Venice Biennale and received the Order of Culture in 1970. He also made paintings, ceramics and calligraphy and was close to the Mingei folk-craft movement."},"tag":"f","s":"国土交通省「多言語解説文データベース」棟方志功","q":{"ja":"棟方志功が1956年に受賞したのは？","en":"What did Munakata win in 1956?"},"c":[{"ja":"ヴェネツィア・ビエンナーレのグランプリ","en":"The Venice Biennale Grand Prix"},{"ja":"ノーベル文学賞","en":"The Nobel Prize in Literature"},{"ja":"アカデミー賞","en":"An Academy Award"}],"a":0},"omiyage":{"title":{"ja":"おみやげ：津軽塗","en":"Souvenir: Tsugaru-nuri"},"text":{"ja":"津軽塗は、昭和50年に国の伝統的工芸品に指定された漆器。約300年前、津軽藩4代藩主・信政の時代に、塗師の池田源兵衛が始めたと伝えられる。「唐塗」は、ヒバの素地から塗り・研ぎ・磨きを繰り返し、48もの工程を経て完成する。","en":"Tsugaru-nuri is lacquerware designated a national traditional craft in 1975. It is said to have been started about 300 years ago, under the fourth Tsugaru lord Nobumasa, by the lacquerer Ikeda Genbei. 'Kara-nuri' repeats coating, grinding and polishing on a hiba-wood base through as many as 48 steps."},"tag":"l","s":"青森県「津軽塗」","q":{"ja":"唐塗の工程は、いくつ？","en":"How many steps go into Kara-nuri?"},"c":[{"ja":"48","en":"48"},{"ja":"4","en":"4"},{"ja":"480","en":"480"}],"a":0},"kenmin":{"title":{"ja":"じょっぱりと、おだやか","en":"Stubborn in Tsugaru, mild in Nanbu"},"text":{"ja":"青森では、津軽の人は「じょっぱり」（意地っ張り）、南部の人はおだやかと、よく言われる。","en":"In Aomori, people of Tsugaru are often said to be 'joppari' (stubborn) and those of Nanbu mild-mannered."},"tag":"k","s":"俗説・出典未確認","q":null}}}],"L":{"tokyo>kanagawa":[{"mode":"rail","name":{"ja":"JR東海道線で、東京駅から横浜駅へ","en":"JR Tokaido Line: Tokyo → Yokohama"},"text":{"ja":"東京駅から横浜駅へ。海ぞいの街へ、鉄道でするりと着く。ダイヤは、時期や列車で変わる。","en":"From Tokyo Station to Yokohama Station by rail. Timetables vary by season and train."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"},{"mode":"shinkansen","name":{"ja":"東海道新幹線で、新横浜へ","en":"Tokaido Shinkansen: Tokyo → Shin-Yokohama"},"text":{"ja":"東京駅から新横浜駅へ。新幹線の駅は、横浜駅とは別の場所にある。","en":"From Tokyo to Shin-Yokohama. The Shinkansen station is separate from Yokohama Station."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}],"kanagawa>chiba":[{"mode":"ship","name":{"ja":"東京湾フェリーで、久里浜から金谷へ","en":"Tokyo Bay Ferry: Kurihama → Kanaya"},"text":{"ja":"神奈川の久里浜港から、千葉の金谷港へ。片道約40分で、東京湾を渡る。運航は、東京湾フェリー株式会社。","en":"From Kurihama in Kanagawa to Kanaya in Chiba — about 40 minutes across Tokyo Bay, operated by Tokyo Bay Ferry Co., Ltd."},"tag":"f","s":"千葉県観光物産協会「まるちば」東京湾フェリー（片道約40分）"},{"mode":"rail","name":{"ja":"JRを乗りついで、横浜から千葉へ","en":"By JR trains, Yokohama → Chiba"},"text":{"ja":"横浜から、JRを乗りついで、東京湾の北まわりで千葉へ。海を渡らず、ぐるっとまわる道。","en":"From Yokohama by JR around the north of Tokyo Bay — the long way round without crossing the water."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}],"chiba>ibaraki":[{"mode":"rail","name":{"ja":"JR成田線・鹿島線と、鹿島臨海鉄道で、水戸へ","en":"JR Narita & Kashima lines + Kashima Rinkai Railway to Mito"},"text":{"ja":"千葉から、成田線と鹿島線で鹿島へ。そこから、鹿島臨海鉄道の大洗鹿島線で水戸へ。海ぞいを行く、旅らしい道。","en":"From Chiba via the Narita and Kashima lines to Kashima, then the Kashima Rinkai Railway's Oarai-Kashima Line to Mito — a scenic coastal route."},"tag":"x","s":"路線名は一般知識。接続・ダイヤは鉄道会社の公式サイトで確認"},{"mode":"rail","name":{"ja":"東京をまわって、JR常磐線で水戸へ","en":"Via Tokyo, then the JR Joban Line to Mito"},"text":{"ja":"千葉から東京へ出て、JR常磐線の特急で水戸へ。わかりやすい、本線の道。","en":"From Chiba to Tokyo, then a Joban Line limited express to Mito — the straightforward main-line way."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}],"ibaraki>tochigi":[{"mode":"rail","name":{"ja":"JR水戸線で、小山へ。そして宇都宮へ","en":"JR Mito Line to Oyama, then on to Utsunomiya"},"text":{"ja":"水戸から、水戸線で小山へ。小山からは、東北線か新幹線で宇都宮へ。","en":"From Mito on the Mito Line to Oyama, then the Tohoku Line or Shinkansen to Utsunomiya."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}],"tochigi>gunma":[{"mode":"rail","name":{"ja":"JR東北線で小山へ、両毛線で前橋へ","en":"JR Tohoku Line to Oyama, Ryomo Line to Maebashi"},"text":{"ja":"宇都宮から、小山へ戻り、両毛線で群馬へ。県をまたぐ、ローカル線の旅。","en":"From Utsunomiya back to Oyama, then the Ryomo Line into Gunma — a local-line trip across the prefectural border."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}],"gunma>saitama":[{"mode":"shinkansen","name":{"ja":"高崎から、新幹線で大宮へ","en":"Takasaki → Omiya by Shinkansen"},"text":{"ja":"前橋から高崎へ出て、上越・北陸新幹線で大宮へ。","en":"From Maebashi to Takasaki, then the Joetsu/Hokuriku Shinkansen to Omiya."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"},{"mode":"rail","name":{"ja":"高崎から、JR高崎線で大宮へ","en":"Takasaki → Omiya by JR Takasaki Line"},"text":{"ja":"高崎から、高崎線で大宮へ。北関東から埼玉の中心へ、在来線でのんびり。","en":"From Takasaki to Omiya on the Takasaki Line — a relaxed conventional-line ride into the heart of Saitama."},"tag":"x","s":"路線名は一般知識。ダイヤは鉄道会社の公式サイトで確認"}],"saitama>fukushima":[{"mode":"shinkansen","name":{"ja":"大宮から、東北新幹線で福島へ","en":"Omiya → Fukushima by Tohoku Shinkansen"},"text":{"ja":"大宮から東北新幹線に乗って、北へ。JR東日本によると、やまびこ号は、東京〜福島を約1時間33分で結ぶ。（大宮〜福島の時間は、資料に書かれていなかった）","en":"Take the Tohoku Shinkansen north from Omiya. JR says the Yamabiko connects Tokyo and Fukushima in about 1 hour 33 minutes. (The Omiya–Fukushima time was not stated in the source.)"},"tag":"f","s":"JRグループ「やまびこ号のご案内」"}],"fukushima>miyagi":[{"mode":"shinkansen","name":{"ja":"福島から、東北新幹線で仙台へ","en":"Fukushima → Sendai by Tohoku Shinkansen"},"text":{"ja":"福島から東北新幹線で北へ。JR東日本によると、やまびこ号の運転区間は東京〜仙台・盛岡間で、東京〜仙台は約1時間54分。（福島〜仙台の時間は、資料に書かれていなかった）","en":"North from Fukushima on the Tohoku Shinkansen. JR says the Yamabiko runs between Tokyo and Sendai/Morioka, Tokyo–Sendai taking about 1 hour 54 minutes. (The Fukushima–Sendai time was not stated.)"},"tag":"f","s":"JRグループ「やまびこ号のご案内」"}],"miyagi>yamagata":[{"mode":"rail","name":{"ja":"仙台から、仙山線で山形へ","en":"Sendai → Yamagata on the Senzan Line"},"text":{"ja":"仙台から仙山線で、山の向こうの山形へ。山形県の資料の路線図には、「快速　山形～仙台」の表示がある。（所要時間は、資料に書かれていなかった）","en":"Over the mountains from Sendai to Yamagata on the Senzan Line. A route map in a Yamagata document shows a 'rapid service Yamagata–Sendai'. (The travel time was not stated.)"},"tag":"f","s":"山形県「県内の鉄道の現況」（県公式PDF）"}],"yamagata>akita":[{"mode":"rail","name":{"ja":"山形から、奥羽本線などで秋田へ","en":"Yamagata → Akita on the Ou Main Line, etc."},"text":{"ja":"山形から北へ、奥羽本線などで秋田へ。山形県の資料によると、奥羽本線は県内を南北に縦貫している。（山形から秋田までの乗り継ぎと所要時間は、資料に書かれていなかった）","en":"North from Yamagata towards Akita on the Ou Main Line and connections. A Yamagata document says the Ou Main Line runs through the prefecture north to south. (Transfers and travel time to Akita were not stated.)"},"tag":"x","s":"山形県「県内の鉄道の現況」（県公式PDF）。この区間の乗り継ぎは未確認"}],"akita>iwate":[{"mode":"shinkansen","name":{"ja":"秋田から、秋田新幹線こまちで盛岡へ","en":"Akita → Morioka by Akita Shinkansen Komachi"},"text":{"ja":"秋田から秋田新幹線こまちで、岩手の盛岡へ。こまちは東京～秋田を走り、東京からの所要時間は、盛岡2時間13分、秋田3時間49分。引き算すると、秋田～盛岡は約1時間36分（目安）。最高速度は、秋田新幹線で130km/h。","en":"From Akita to Morioka on the Akita Shinkansen Komachi, which runs Tokyo–Akita; from Tokyo it takes 2h13 to Morioka and 3h49 to Akita, so Akita–Morioka is about 1h36 (rough, by subtraction). Top speed on the Akita Shinkansen is 130 km/h."},"tag":"f","s":"JRグループ「こまち号のご案内」"}],"iwate>aomori":[{"mode":"shinkansen","name":{"ja":"盛岡から、東北新幹線はやぶさで新青森へ","en": irasu' is a registered Kanagawa brand. Fishing is closed from 1 January to 10 March, to protect young ayu."},"tag":"f","s":"神奈川県「かながわの水産物図鑑 しらす」"},"chiba":{"name":{"ja":"成田のうなぎ","en":"Narita's Unagi (Eel)"},"text":{"ja":"成田山新勝寺の表参道には、うなぎの店が並ぶ。江戸時代から参拝客のおもてなし料理だったとされ、駿河屋は寛政10年（1798年）、川豊本店は明治43年（1910年）の創業という。※出典は旅行情報サイト1件。公式ページでは未確認。","en":"Unagi restaurants line the approach to Naritasan Shinshoji. It is said to have been a treat for pilgrims since the Edo period; Surugaya is described as founded in 1798 and Kawatoyo Honten in 1910. *Single travel-site source; not yet confirmed on an official page."},"tag":"x","s":"るるぶ&more「成田山新勝寺参り ランチ ウナギ」"},"ibaraki":{"name":{"ja":"ネモフィラ（ひたち海浜公園）","en":"Nemophila (Hitachi Seaside Park)"},"text":{"ja":"国営ひたち海浜公園の「みはらしの丘」は、春になると青いネモフィラで埋まる。2024年の案内では、約530万本、植栽面積は約4.2ha。見頃は4月中旬から5月初めごろとされた。","en":"In spring, 'Miharashi Hill' at Hitachi Seaside Park is covered with blue nemophila. The park's 2024 notice cites about 5.3 million plants over roughly 4.2 ha, with the best viewing from mid-April to early May."},"tag":"f","s":"国営ひたち海浜公園「ネモフィラ見頃のご案内」（2024年4月22日）"},"tochigi":{"name":{"ja":"いちご（とちおとめほか）","en":"Strawberries (Tochiotome and more)"},"text":{"ja":"栃木県のいちごの収穫量は、昭和43年（1968年）産以降、57年連続で全国1位（令和6年産まで）。品種には、とちおとめ、スカイベリー、とちあいかなどがある。","en":"Tochigi has ranked No. 1 in strawberry harvest nationwide for 57 consecutive years, from 1968 through the 2024 crop. Varieties include Tochiotome, Skyberry and Tochiaika."},"tag":"f","s":"栃木県「いちご 全国の生産状況」"},"gunma":{"name":{"ja":"高崎だるま","en":"Takasaki Daruma"},"text":{"ja":"高崎だるまは、全国の生産の8割を占めるといわれる。高崎市の少林山達磨寺は、「縁起だるま発祥の寺」として知られ、境内にはたくさんの縁起だるまが奉納されている。※シェアの数字は旅行情報誌1件。公式ページでは未確認。","en":"Takasaki daruma are said to make up 80% of Japan's production. Shorinzan Daruma-ji in Takasaki is known as the temple where the lucky daruma began, and many are offered there. *Share figure from one travel magazine; not confirmed on an official page."},"tag":"x","s":"旅行情報誌「知られざるニッポン vol.67」／防衛省 群馬地方協力本部（達磨寺の紹介）"},"saitama":{"name":{"ja":"川越のさつまいも","en":"Kawagoe Sweet Potatoes"},"text":{"ja":"江戸時代、川越藩領は、江戸の焼きいもを支える二大産地の一つだったとされる。「栗（九里）より（四里）うまい十三里」という語呂合わせが、焼きいもの別名「十三里」の由来といわれる。今も、川越はさつまいものスイーツで知られる。※出典は雑誌サイト1件。公式ページでは未確認。","en":"In the Edo period, the Kawagoe domain was one of two major sweet-potato sources for Edo's roasted-potato stalls. The pun 'sweeter than chestnuts (9 ri + 4 ri = 13 ri)' is said to explain the nickname 'Thirteen Ri'. Kawagoe is still known for sweet-potato sweets. *Single magazine source; not confirmed on an official page."},"tag":"x","s":"和樂web「川越いもの歴史」"},"fukushima":{"name":{"ja":"相馬野馬追の馬","en":"The Horses of Soma Nomaoi"},"text":{"ja":"相馬野馬追では、甲冑姿の騎馬武者が馬で行列し、「甲冑競馬」で、1周1000mを10頭で競う。数百の騎馬が、空に舞う2本の御神旗を奪い合う「神旗争奪戦」も行われる。千年余り前の、軍事訓練がはじまりと言われる。","en":"At the Soma Nomaoi, warriors in armor ride in parade, ten horses race 1,000 m in the 'Kacchu Keiba', and hundreds of riders scramble for two sacred banners in the 'Shinki Soso-sen'. It is said to trace back over a thousand years to military training."},"tag":"l","s":"東北観光推進機構「相馬野馬追」"},"miyagi":{"name":{"ja":"仙台七夕の吹き流し","en":"Sendai Tanabata Streamers"},"text":{"ja":"仙台七夕まつりは、毎年8月6日～8日。飾りは和紙で作られ、アーケード街や仙台駅周辺には、巨大な吹き流しが飾られる。藩祖・伊達政宗の時代から続く伝統とされる。","en":"The Sendai Tanabata Festival runs 6–8 August. Its decorations are made of washi paper, and giant streamers hang over the arcades and around Sendai Station. It is said to continue a tradition from the domain founder Date Masamune's time."},"tag":"f","s":"東北観光推進機構「仙台七夕まつり」"},"yamagata":{"name":{"ja":"山形のさくらんぼ","en":"Yamagata Cherries"},"text":{"ja":"山形は、さくらんぼ（おうとう）の産地。県の資料では、平年収量は12,700t。品種は「佐藤錦」が中心で、新しい「やまがた紅王」も登場している。","en":"Yamagata is cherry country. A prefectural document gives a normal yield of 12,700 tonnes, with 'Sato Nishiki' dominant and the new 'Yamagata Benio' emerging."},"tag":"f","s":"山形県「さくらんぼ振興の資料」（県公式PDF）"},"akita":{"name":{"ja":"秋田犬とハチ公","en":"The Akita Dog and Hachiko"},"text":{"ja":"大館市には、ここで生まれたハチ公の銅像「望郷のハチ公像」がある。晩年（12歳）のハチ公をイメージして作られ、左耳が垂れている。秋田犬保存会の本部・秋田犬会館では、天然記念物である秋田犬に関する資料も見られる。","en":"Odate has 'Bokyo no Hachiko', a statue of Hachiko, who was born here, shaped after him at age 12 with his left ear drooping. The Akita Dog Hall, headquarters of the Akita Dog Preservation Society, shows materials on the Akita dog, a Natural Monument."},"tag":"f","s":"東北観光推進機構「秋田犬会館」"},"iwate":{"name":{"ja":"わんこそば","en":"Wanko Soba"},"text":{"ja":"花巻に立ち寄った南部利直公が、何度もおかわりしたという伝承から生まれたといわれる。椀に一口ずつ給仕されるそばを、何杯食べられたか競う。もとは「おもてなし」の食文化。","en":"Said to come from the story of Lord Nanbu Toshinao asking for seconds again and again in Hanamaki. Bite-sized servings arrive bowl after bowl and people compete on the count; it began as hospitality."},"tag":"l","s":"文化庁「100年フード」岩手県"},"aomori":{"name":{"ja":"青森のりんご","en":"Aomori Apples"},"text":{"ja":"青森は、りんごの栽培面積・収穫量ともに全国一。どちらも全国の半分以上を占める。","en":"Aomori leads Japan in both apple area and harvest, each more than half the national total."},"tag":"f","s":"青森県「農業（子ども向けページ）」"}},"MAP":{"aomori":"M265.0 -523.1L268.0 -512.3L273.5 -507.3L280.8 -507.9L288.4 -514.8L288.0 -517.0L290.9 -516.9L292.2 -516.1L291.8 -515.3L294.8 -511.9L296.8 -510.7L296.9 -509.1L299.9 -507.2L299.8 -505.5L302.7 -503.9L302.3 -502.3L300.2 -500.4L299.7 -498.6L297.9 -497.7L295.6 -497.9L294.0 -496.7L293.4 -494.9L294.3 -493.5L299.5 -492.1L302.5 -489.2L301.7 -488.7L299.7 -482.4L297.8 -481.9L290.6 -483.8L291.3 -480.9L290.5 -477.9L286.7 -476.9L282.4 -481.9L280.0 -482.6L277.4 -485.0L276.8 -484.3L273.0 -485.0L269.8 -483.8L265.9 -483.7L262.4 -486.9L261.9 -488.2L257.6 -488.5L253.3 -488.0L252.0 -485.5L250.8 -487.8L251.6 -489.5L248.5 -492.5L248.4 -493.6L249.2 -493.7L248.8 -494.5L251.3 -495.9L251.4 -495.4L252.8 -497.3L255.2 -498.6L254.7 -504.3L256.9 -512.9L256.0 -515.8L254.8 -516.9L256.4 -521.2L252.6 -524.1L252.4 -525.9L258.2 -524.8L259.6 -523.1L259.7 -523.6L265.0 -523.1ZM227.1 -497.6L229.1 -497.1L229.1 -496.2L232.3 -495.9L232.6 -495.3L234.0 -495.9L234.9 -494.2L236.5 -494.5L236.4 -493.0L242.3 -487.1L241.4 -484.4L243.5 -482.2L244.2 -483.1L245.3 -48   let pick=cand[0];for(const c of cand){const bx=[c[0],c[1],c[0]+tw_,c[1]+fs];if(!boxes.some(b=>hit(bx,b))&&!pts.some(q=>q!==o&&hit(bx,[q.x-r,q.y-r,q.x+r,q.y+r]))){pick=c;break}}
  boxes.push([pick[0],pick[1],pick[0]+tw_,pick[1]+fs]);o.lx=pick[0]+tw_/2;o.ly=pick[1]+fs*.85});
 pts.forEach(o=>{s+='<circle cx="'+o.x+'" cy="'+o.y+'" r="'+r+'" fill="#f83800" stroke="#fff" stroke-width="'+(r*.35)+'"/><text x="'+o.lx+'" y="'+o.ly+'" font-size="'+fs+'" fill="#fff" text-anchor="middle" stroke="#000" stroke-width="'+(fs*.22)+'" paint-order="stroke" font-family="DotGothic16,sans-serif">'+esc(t(o.c.n))+'</text>'});
 return s+'</svg><div class="hint">'+u("tmap")+' / '+u("mapc")+'</div>'}
function topbar(){const p=D.P[S.i];const n=Object.values(S.stars).reduce((a,b)=>a+b,0);return '<div id="top" class="win"><span><b>'+esc(t(p))+'</b> ('+(S.i+1)+'/'+D.P.length+')</span><span class="stars">★'+n+'/'+D.P.length*3+'</span></div>'}
function bgmFor(){const n=(S.step==="title"||S.step==="help"||S.step==="end"||S.step==="rec")?"title":D.P[S.i].id;bgmPlay(n)}
function render(){document.documentElement.lang=S.lang;({title:rTitle,hub:rHub,topic:rTopic,quiz:rQuiz,qres:rQres,route:rRoute,link:rLink,end:rEnd,rec:rRec,help:rHelp})[S.step]();bgmFor()}
function heroRow(){return '<div class="heroes">'+["inari","hachiman","tenjin","amate","minakata"].map(k=>'<figure>'+himg(k)+t(D.HN[k])+'</figure>').join("")+'</div>'}
function rTitle(){S.who="inari";mk('<div class="win"><h1>'+esc(u("title"))+'</h1><div class="sub">'+u("sub")+'</div>'+sScene("tokyo")+heroRow()+'</div>'+
 '<button class="btn gold" id="n">'+u("new")+'</button>'+(S.has?'<button class="btn" id="c">'+u("cont")+'</button>':'')+'<button class="btn" id="r">'+u("rec")+'</button><button class="btn" id="h">'+u("help")+'</button><div class="row">'+langBtn()+'</div>'+sndBar()+'<div class="small">'+u("note")+'</div>');
 bindLang();bindSnd();$("#n").onclick=()=>{auResume();seTap();S.i=0;S.read={};S.stars={};S.stamps={};SEEN={};save();S.step="hub";render()};
 if($("#c"))$("#c").onclick=()=>{auResume();seTap();S.step="hub";render()};$("#r").onclick=()=>{auResume();S.back="title";S.step="rec";render()};$("#h").onclick=()=>{auResume();S.step="help";render()}}
function rHelp(){mk('<div class="win msg">'+esc(u("helptxt"))+'</div><button class="btn" id="b">'+u("back")+'</button>');$("#b").onclick=()=>{S.step="title";render()}}
function rHub(){const p=D.P[S.i];const r=S.read[p.id]||{};const nread=D.ORDER.filter(k=>r[k]).length;const all=nread>=7;S.who="inari";const first=!SEEN['i'+p.id];SEEN['i'+p.id]=1;
 mk(topbar()+'<div class="win">'+sScene(p.id)+'<div style="margin-top:8px"></div>'+tw(t(p.intro),'',!first)+(first?'<div class="hint">'+u("skip")+'</div>':'')+'</div>'+mapSvg()+'<div class="small" style="padding:0 4px">'+u("hub")+'</div>'+
 D.ORDER.map(k=>'<button class="btn" data-k="'+k+'">'+sIcon(KICON[k],32)+'<span>'+u(k)+'<small>'+esc(t(p.topics[k].title))+'</small></span><span class="st">'+(r[k]?'✓':'')+'</span></button>').join("")+
 '<button class="btn gold" id="q"'+(all?'':' disabled')+'>'+(all?u("quiz"):u("quizlock"))+' ('+nread+'/'+D.ORDER.length+')'+'</button><div class="row"><button class="btn" id="t">'+u("back")+'</button>'+langBtn()+'</div>'+sndBar());
 bindLang();bindSnd();{const mp=$("#map");if(mp)mp.onclick=()=>{seTap();S.mz=S.mz===p.id?null:p.id;render()}}app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{seTap();S.k=b.dataset.k;S.step="topic";render()});
 $("#q").onclick=()=>{if(!all)return;seGo();const ks=QZ.filter(k=>r[k]).sort(()=>Math.random()-.5).slice(0,3);S.q=ks;S.qi=0;S.right=0;S.step="quiz";render()};
 $("#t").onclick=()=>{S.step="title";render()}}
function rTopic(){const p=D.P[S.i],k=S.k,c=p.topics[k];const again=!!(S.read[p.id]&&S.read[p.id][k]);(S.read[p.id]=S.read[p.id]||{})[k]=1;save();const sp=D.SPEAK[k];S.who=sp;
 mk(topbar()+'<div class="win"><div class="who">'+himg(sp)+'<div><div class="nm">'+t(D.HN[sp])+'</div><div class="small">'+u(k)+'</div></div><div style="margin-left:auto">'+sIcon(KICON[k],56)+'</div></div><div style="color:var(--gold);margin:8px 0">'+esc(t(c.title))+'</div>'+(k==="omiyage"?'<div class="small" style="color:var(--green)">★ '+u("got")+'</div>':'')+(k==="towns"?prefMap(p)+'<div style="margin-top:8px"></div>':'')+tw(t(c.text),'',again)+(again?'':'<div class="hint">'+u("skip")+'</div>')+'<div class="src">'+tagH(c.tag)+u("src")+': '+esc(c.s)+'</div>'+(c.more||[]).map(m=>'<div style="border-top:1px dashed var(--l2);margin-top:12px;padding-top:8px"><div style="color:var(--gold);margin:4px 0">'+esc(t(m.title))+'</div>'+tw(t(m.text),'',again)+'<div class="src">'+tagH(m.tag)+u("src")+': '+esc(m.s)+'</div></div>').join("")+'</div><button class="btn gold" id="b">'+u("back")+'</button>');
 $("#b").onclick=()=>{seTap();S.step="hub";render()}}
function rQuiz(){const p=D.P[S.i],k=S.q[S.qi],c=p.topics[k];S.who="tenjin";
 mk(topbar()+'<div class="win"><div class="who">'+himg("tenjin")+'<div class="small">Q'+(S.qi+1)+'/3 ・ '+u(k)+'</div><div style="margin-left:auto">'+sIcon(KICON[k],40)+'</div></div>'+tw(t(c.q))+'</div>'+c.c.map((o,j)=>'<button class="btn" data-j="'+j+'">'+esc(t(o))+'</button>').join(""));
 app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===c.a;if(ok){S.right++;seOk()}else seNg();S.last=ok;S.step="qres";render()})}
function rQres(){const p=D.P[S.i],k=S.q[S.qi],c=p.topics[k];S.who=S.last?"amate":"minakata";
 mk(topbar()+'<div class="win"><div class="who">'+himg(S.who)+'</div>'+tw(S.last?u("ok"):u("ng").replace("{a}",t(c.c[c.a])))+'<div class="src">'+esc(t(c.text))+'</div></div><button class="btn gold" id="n">'+u("next")+'</button>');
 $("#n").onclick=()=>{seTap();S.qi++;if(S.qi<3){S.step="quiz"}else{const n=Math.max(1,S.right);S.stars[p.id]=Math.max(S.stars[p.id]||0,n);save();S.step="route"}render()}}
function rRoute(){const p=D.P[S.i];const n=S.stars[p.id];const last=S.i>=D.P.length-1;S.who="inari";
 mk(topbar()+'<div class="win">'+sScene(p.id)+'<div style="margin-top:8px"></div>'+tw(u("result").replace("{p}",t(p)).replace("{n}",n))+'</div><div class="win"><div class="nm">'+u("cardget")+'</div>'+cardH(p)+'</div>'+(last?'<button class="btn gold" id="e">'+u("end")+'</button>':
 '<div class="small" style="padding:0 4px">'+u("route")+'</div>'+(D.L[p.id+">"+D.P[S.i+1].id]||[]).map((o,j)=>'<button class="btn" data-j="'+j+'">'+sIcon(o.mode,32)+'<span class="opt"><span class="t">'+esc(t(o.name))+'</span></span></button>').join(""))+'<button class="btn" id="b">'+u("back")+'</button>');
 if(last)$("#e").onclick=()=>{seGo();S.step="end";render()};else app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{seTap();S.j=+b.dataset.j;S.step="link";render()});
 $("#b").onclick=()=>{S.step="hub";render()}}
function rLink(){const p=D.P[S.i],nx=D.P[S.i+1];const o=D.L[p.id+">"+nx.id][S.j];S.stamps[o.mode]=1;save();S.who="minakata";
 mk(topbar()+'<div class="win"><div class="who">'+sIcon(o.mode,56)+'<div class="nm">'+esc(t(o.name))+'</div></div>'+tw(t(o.text))+'<div class="src">'+tagH(o.tag)+u("src")+': '+esc(o.s)+'</div></div><button class="btn gold" id="g">'+u("go")+' → '+esc(t(nx))+'</button><button class="btn" id="b">'+u("back")+'</button>');
 $("#g").onclick=()=>{seGo();S.i++;save();S.step="hub";render()};$("#b").onclick=()=>{S.step="route";render()}}
function rEnd(){const n=Object.values(S.stars).reduce((a,b)=>a+b,0);S.who="amate";mk('<div class="win"><h1 style="font-size:22px">'+u("end")+'</h1><div class="msg" style="text-align:center"><span class="stars">★'+n+'/'+D.P.length*3+'</span></div>'+sScene(D.P[D.P.length-1].id)+heroRow()+cardsH()+bagH()+tw(u("endtxt"))+'</div><button class="btn" id="r">'+u("rec")+'</button><button class="btn gold" id="b">'+u("back")+'</button>');
 $("#r").onclick=()=>{S.back="end";S.step="rec";render()};$("#b").onclick=()=>{S.step="title";render()}}
const RC=["#c88040","#c8d0e0","#f8d820"];
function cardH(p,small){const c=D.CARDS[p.id],n=Math.max(1,S.stars[p.id]||1),col=RC[n-1];if(!c)return"";return '<div class="card" style="--cc:'+col+'"><img alt="" src="'+cardArt(p.id)+'"><div class="cn">'+esc(t(c.name))+'</div><div class="cr">'+u("rar")[n-1]+' ★'.repeat(0)+' '+'★'.repeat(n)+'</div>'+(small?'':'<div class="msg" style="font-size:13px;margin-top:6px">'+esc(t(c.text))+'</div><div class="src">'+tagH(c.tag)+u("src")+': '+esc(c.s)+'</div>')+'</div>'}
function cardsH(){return '<div class="small" style="margin-top:8px">'+u("cards")+'</div><div class="cgrid">'+D.P.map(p=>S.stars[p.id]?cardH(p,true):'<div class="emp">?</div>').join("")+'</div>'}
function bagH(){const items=D.P.filter(p=>S.read[p.id]&&S.read[p.id].omiyage);return '<div class="small" style="margin-top:8px">'+u("bag")+': '+(items.map(p=>'<div style="display:flex;align-items:center;gap:6px;margin:4px 0">'+sIcon("omiyage",24)+'<span>'+esc(t(p.topics.omiyage.title))+'</span></div>').join("")||'–')+'</div>'}
function rRec(){let h='<div class="win"><div class="nm">'+u("rec")+'</div>'+D.P.map(p=>'<div style="margin:6px 0">'+esc(t(p))+' <span class="stars">'+('★'.repeat(S.stars[p.id]||0)||'–')+'</span></div>').join("")+'<div class="small" style="margin-top:8px">'+u("modes")+': '+(Object.keys(S.stamps).map(m=>sIcon(m,28)).join(" ")||'–')+'</div>'+bagH()+cardsH()+'</div>';
 h+='<div class="win"><div class="nm">'+u("src")+'</div><div class="small">'+D.P.map(p=>'<div style="margin-top:6px"><b style="color:#fff;font-weight:normal">'+esc(t(p))+'</b>'+D.ORDER.map(k=>'<div>'+tagH(p.topics[k].tag)+esc(p.topics[k].s)+'</div>'+(p.topics[k].more||[]).map(m=>'<div>'+tagH(m.tag)+esc(m.s)+'</div>').join("")).join("")+'</div>').join("")+'</div></div>';
 h+='<button class="btn" id="x">'+(S.sure?u("sure"):u("reset"))+'</button><button class="btn gold" id="b">'+u("back")+'</button>';mk(h);
 $("#x").onclick=()=>{if(!S.sure){S.sure=true;render();return}try{localStorage.removeItem(KEY)}catch(e){}S.sure=false;S.has=false;S.i=0;S.read={};S.stars={};S.stamps={};S.step="title";render()};
 $("#b").onclick=()=>{S.step=S.back||"title";render()}}
/* 最初のタップで音を有効にする（ブラウザの決まり） */
document.addEventListener("pointerdown",()=>{if(!AU.ctx){auResume();bgmFor()}else if(AU.ctx.state==="suspended")AU.ctx.resume()},{passive:true});
render();
</script>
