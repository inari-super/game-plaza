<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05051c; --win1:#1a1a7a; --win2:#0a0a3c; --line:#e8e8ff; --line2:#7a86ff;
  --gold:#f8d820; --red:#f83800; --txt:#ffffff; --dim:#a8b0e8; --warn:#f8a8c0; --crow:#c8c8d8;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05051c;--win1:#1a1a7a;--win2:#0a0a3c;--txt:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05051c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:var(--font)}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:6px;padding:6px}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:2px solid var(--line);border-radius:4px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--line2)}
#top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;gap:8px;line-height:1.3}
#top b{color:var(--gold);font-weight:normal}
#top small{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.sep{font-size:12px;color:var(--gold);padding:6px 6px 2px;border-left:4px solid var(--gold);margin-top:4px}
.band{margin:18px 0 6px;padding:6px 8px;border-left:6px solid var(--gold);background:#0c0c34}
.band b{font-weight:normal;font-size:16px}
.band .none{font-size:12px;color:var(--dim);margin-top:2px}
#msg .who{font-weight:normal}
body[data-fs="s"] #msg,body[data-fs="s"] .twdemo{font-size:13px}
body[data-fs="l"] #msg,body[data-fs="l"] .twdemo{font-size:19px;line-height:1.75}
body[data-fs="l"] #msg .chip.talk{font-size:14px}
#msg,.twdemo{overflow-wrap:anywhere;word-break:normal;line-break:strict}
.fsz{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.fsz .btn{flex:1;min-width:64px;justify-content:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}.tab{font-family:var(--font);font-size:12px;padding:6px 8px;border:1px solid var(--line2);background:#10104a;color:var(--dim);border-radius:3px;cursor:pointer}.tab.on{border-color:var(--gold);color:var(--gold);background:#2a2a88}
.chip.talk{margin-top:8px;font-size:13px;padding:6px 12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip{font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--line2);background:#14145a;color:#dfe3ff;border-radius:10px;cursor:pointer}.chip[disabled]{opacity:.45;cursor:not-allowed}
.ev.zk{font-size:13px;line-height:1.55}.ev img.it{height:32px;width:32px;image-rendering:pixelated}.btn img.it{height:28px;width:28px;image-rendering:pixelated;flex:none}
dl.ju{margin:4px 0;font-size:12px}dl.ju dt{color:var(--gold);margin-top:3px}dl.ju dd{margin:0 0 0 .5em}
.kuji{margin:8px 0;padding:10px;border:2px solid var(--line);background:#fffaf0;color:#201818;text-align:center;white-space:normal}.kuji .kr{font-size:26px;color:#c83028}.kuji .uta{margin:6px 0;font-size:14px;letter-spacing:.05em}
.kset{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.kset span{font-size:12px;padding:2px 6px;border:1px dashed #5a5a80;color:#8c8ca4;border-radius:3px}.kset span.on{border-style:solid;border-color:var(--gold);color:var(--gold)}.kset span{min-width:64px;text-align:center}.kset b{font-weight:normal}
.bt{margin:6px 0;padding:6px 8px;border:1px solid var(--line2);background:rgba(0,0,0,.35);white-space:normal;font-size:13px}.bt .row{display:flex;align-items:center;gap:6px;margin:3px 0}.bscene{position:relative;margin:0 0 8px}.bscene .scene{margin:0}.scene.btl{height:96px;object-fit:cover;object-position:50% 80%}.bscene .bhero{position:absolute;right:7%;bottom:5px;height:46%;image-rendering:pixelated;filter:drop-shadow(1px 1px 0 #000)}.bt .row>span:first-child{width:9.5em;flex:none;display:flex;align-items:center;gap:3px}.bt .row img{height:20px}.bar2{flex:1;height:10px;background:#000;border:1px solid var(--line2)}.bar2 i{display:block;height:100%}.bt .row>span:last-child{width:4.6em;text-align:right;flex:none}
.blog{font-size:13px;line-height:1.6;color:#dfe3ff;white-space:normal;border-left:3px solid var(--line2);padding-left:6px}
.hint{color:var(--gold);font-size:12px;margin-right:4px;flex:none}
.tsnd{display:flex;justify-content:flex-end;gap:6px}
.tsnd .btn{width:auto;min-height:36px;padding:6px 12px;font-size:13px}
.snd{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.snd button{font-family:var(--font);font-size:11px;min-width:30px;height:26px;padding:0 5px;border-radius:3px;border:1px solid #5a5a80;background:#10104a;color:#8c8ca4;opacity:.6;cursor:pointer}
.snd button.on{border-color:var(--gold);color:var(--gold);opacity:1;background:#2a2a88}
#top .r{text-align:right;white-space:nowrap}
#mapwrap{position:relative;border:2px solid var(--line);box-shadow:0 0 0 2px #000;background:#183484;line-height:0;flex:none}
#map{width:100%;height:auto;image-rendering:pixelated;display:block}
.mk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px #000}
.mk.dim{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:#ffb060;border-width:1px}
.mk.on{animation:pulse 1s infinite steps(2,end)}
@keyframes pulse{50%{transform:scale(1.5)}}
.mklabel{position:absolute;transform:translate(-50%,10px);font-size:11px;line-height:1.2;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;white-space:nowrap}
.token{position:absolute;width:20px;transform:translate(-50%,-100%);image-rendering:pixelated;filter:drop-shadow(1px 1px 0 #000)}
#party{display:flex;gap:2px;padding:5px 4px;justify-content:space-between;flex:none}
.pc{flex:1;text-align:center;font-size:clamp(9px,2.7vw,12px);padding:3px 0;border:1px solid transparent;border-radius:3px;line-height:1.1;min-width:0;white-space:nowrap;word-break:keep-all;letter-spacing:-.02em}
.pc img{height:32px;image-rendering:pixelated;display:block;margin:0 auto 2px}.pc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.pc img.big{height:41px}
.pc.sel{border-color:var(--gold);background:rgba(248,216,32,.15)}
.pc.hid img{filter:brightness(0) opacity(.55)}
.pc.km{color:var(--crow)}
#msgwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#msg{padding:10px 12px;font-size:15px;line-height:1.55;overflow-y:auto;flex:1;min-height:90px;white-space:pre-wrap}
#msg .sp{color:var(--gold)}
#msg .stars{color:var(--gold);letter-spacing:2px;font-size:18px}
.ev{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border:1px solid var(--crow);border-radius:3px;background:rgba(0,0,0,.35);white-space:normal}
.ev img{height:44px;image-rendering:pixelated;flex:none}
.memo{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);font-size:13px;color:#dfe3ff;white-space:normal}
.memo ul{padding-left:16px;margin:4px 0}
.memo li{margin:6px 0}
.tag{display:inline-block;font-size:10px;padding:0 4px;border:1px solid var(--line2);color:var(--dim);margin-right:4px;border-radius:2px}
.tag.t{color:var(--warn);border-color:var(--warn)}.tag.m{color:#c8b0ff;border-color:#c8b0ff}.tag.f{color:#98e0a8;border-color:#98e0a8}.tag.x{color:var(--gold);border-color:var(--gold);border-style:dashed}
.src{display:block;font-size:10px;color:var(--dim)}
#cmd{display:flex;flex-direction:column;gap:6px;max-height:50%;overflow-y:auto;padding:2px;flex:none}
#app.lst #cmd{max-height:72%}
#app.lst #msg{min-height:64px}
.btn{font-family:var(--font);font-size:15px;color:var(--txt);text-align:left;padding:10px 12px;min-height:46px;border-radius:4px;border:2px solid var(--line);background:linear-gradient(180deg,#2a2aa8,#12125a);box-shadow:0 0 0 2px #000;cursor:pointer;display:flex;gap:8px;align-items:center;width:100%}
.btn:active,.btn:focus-visible{background:linear-gradient(180deg,#4a4ad8,#2a2a88);outline:2px solid var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn[disabled]{background:#24243a;border-color:#5a5a70;color:#8c8ca4;box-shadow:0 0 0 2px #000;cursor:not-allowed}
.btn[disabled] .no,.btn[disabled] .st{color:#8c8ca4}
.btn.locked span small{color:#7a7a92}
.why{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.nm{white-space:nowrap;word-break:keep-all}
.btn .hp{width:28px;image-rendering:pixelated;flex:none}.btn .hp.big{width:36px}.ev img.big{height:56px}.bar .bn img.big{height:23px}.bt .row img.big{height:26px}.token.big{width:28px}.bscene .bhero.big{height:59%}.ev img.em{height:40px;width:40px}
.btn small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.btn .no{color:var(--gold);flex:none;width:2.2em;text-align:right}
.btn .st{margin-left:auto;color:var(--gold);flex:none;letter-spacing:1px}
.row2{display:flex;gap:6px}
.row2 .btn{justify-content:center}
#overlay{position:fixed;inset:0;background:var(--bg);display:none;z-index:5;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
#overlay .in{max-width:440px;margin:0 auto}
.title{text-align:center;margin-top:6vh}
.title h1{font-weight:normal;color:var(--gold);font-size:30px;line-height:1.25;margin:10px 0;text-shadow:3px 3px 0 #800}
.title .sub{color:#9ad0ff;font-size:14px;margin-bottom:16px}
.title .small{font-size:11px;color:var(--dim);margin-top:16px;line-height:1.7;text-align:left}
.heroes{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;margin:12px 0}
.heroes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.heroes figcaption{font-size:11px;line-height:1.1;white-space:nowrap;word-break:keep-all;color:#dfe3ff}
.heroes img{height:64px;image-rendering:pixelated}.heroes{align-items:flex-end}.heroes img.big{height:82px}
.heroes img.hid{filter:brightness(0) opacity(.6)}
.ch-h{color:var(--gold);margin:14px 0 4px;font-size:15px}
.fact{font-size:13px;margin:6px 0;line-height:1.5}
.prog{height:8px;border:1px solid var(--line);background:#000;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--gold)}
#sound-unused{position:absolute;right:6px;top:6px;z-index:2;font-family:var(--font);font-size:12px;padding:4px 8px;border-radius:3px;border:1px solid var(--line);background:rgba(10,10,60,.85);color:var(--txt);cursor:pointer;line-height:1.2}
body[data-fs="l"] #msg .scene{width:70%;margin-left:auto;margin-right:auto}
.scene{display:block;width:100%;height:auto;image-rendering:pixelated;border:2px solid var(--line);box-shadow:0 0 0 2px #000;margin:0 0 8px}
#app.evm #mapwrap{display:none}
svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bars{margin:6px 0}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;margin:4px 0}
.bar .bn{width:4.6em;display:flex;align-items:center;gap:3px;flex:none}
.bar .bn img{height:18px;image-rendering:pixelated}
.bar .bt{flex:1;height:10px;background:#000;border:1px solid var(--line2)}
.bar .bt i{display:block;height:100%}
.bar .bv{width:6.8em;text-align:right;flex:none;font-size:12px}
.bar .bv em{font-style:normal;color:var(--gold);font-size:10px;margin-left:3px}
.note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:4px}
.tag{margin-left:4px}
.row2 .btn{font-size:13px;padding:9px 4px;min-height:42px}
.ev img.hidg{filter:brightness(0) opacity(.5)}
.ev img{height:44px}

/* PC・横長画面：地図（左）と文章（右）の2段組み */
@media (min-width:760px) and (min-height:520px){
  #app{max-width:900px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "map msg" "party msg";gap:8px;padding:10px}
  #top{grid-area:top;font-size:14px}
  #mapwrap{grid-area:map;align-self:start}
  #app.evm #mapwrap{display:block}
  #party{grid-area:party;align-self:start}
  #msgwrap{grid-area:msg;min-height:0}
  #msg{font-size:16px}
  body[data-fs="s"] #msg{font-size:14px}
  body[data-fs="l"] #msg{font-size:21px}
  .pc{font-size:12px}
  .pc img{height:40px}
  .pc img.big{height:51px}
  #overlay .in{max-width:880px}
  .title{max-width:560px;margin-left:auto;margin-right:auto}
  .scene{max-width:560px}
}
@media (max-width:359px){
  .pc img{height:26px}
  .pc img.big{height:33px}

}

/* 第3弾：タイプ表示 */

.bar .bt{padding:0;margin:0}
button{touch-action:manipulation}
.twing{cursor:pointer}
.twdemo{min-height:4.8em;margin:8px 0;padding:8px 10px;border:2px solid var(--line);background:linear-gradient(180deg,var(--win1),var(--win2));white-space:pre-wrap;font-size:15px;line-height:1.55;cursor:pointer}
.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd .btn{justify-content:center;font-size:14px;min-height:42px}
.snd button.cfg{opacity:1;color:#dfe3ff;border-color:var(--line2)}
/* 御朱印帳（ゲームの創作の意匠） */
.book{touch-action:pan-y;user-select:none;-webkit-user-select:none;max-width:300px;margin:8px auto 0;overflow:hidden}
.pgw.inR{animation:pgR .22s ease-out}.pgw.inL{animation:pgL .22s ease-out}
@keyframes pgR{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}@keyframes pgL{from{transform:translateX(-30%);opacity:0}to{transform:none;opacity:1}}
.spg{position:relative;background:#f4ecd8;background-image:repeating-linear-gradient(0deg,rgba(120,90,40,.04) 0 1px,transparent 1px 5px);color:#1d1a16;border:2px solid #b5a173;box-shadow:0 0 0 2px #000;padding:14px 12px 8px;display:flex;flex-direction:column;margin:2px}

.spg.chi .hou{color:#3b5a7a}
.spg .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #9c8c66;margin-top:8px;padding-top:5px;font-size:12px;gap:6px}
.spg .pst{color:#b8860b;letter-spacing:1px;font-size:14px}
.spg .foot2{font-size:12px;color:#4a4436;margin-top:3px;line-height:1.4}
.spg.none{background:#2a2a48;background-image:none;border:2px dashed #6a6a90;color:#8c8ca8;opacity:.6}

.trank{margin:4px 0 14px;font-size:14px;color:#dfe3ff}.trank b{color:var(--gold);font-weight:normal;font-size:16px}

#mapwrap{background:#2a58a8}

{key:"sozo",nw:"天地創造",theme:"はじめに：天地創造",ref:"創世記1:1〜2:3",per:"原初史",era:"年代は特定できない",place:"はじまりの時",mk:"sozo",sc:"creation",lead:"cross",
 arr:["ここは、地図にない場所。五人の旅人は、聖書の最初のページへ降り立った。",
  "イワオ「ここがはじまりか。足もとの地面すら、まだないぞ。」",
  "ナゴム「聖書の最初は、神が天と地を造った、という宣言から始まる。そこから七つの区切りで物語が進むんだ。」",
  "イクミ「七つ？　数えてみよう。ひとつめは…光！」",
  "ワラオ「ふたつめは空、みっつめは海と陸と草や木。よっつめは太陽と月と星だったよね。」",
  "ツチオ「五つめは水の生き物と鳥。六つめは地の生き物と人。そして七つめは…。」",
  "（この旅では、神のお姿は描かない。光と、造られた世界だけが見える。）"],
 q:"イクミ「ねえ、七つめの日に、神さまは何をしたの？」",
 ch:[
  {l:"仕事を終えて休み、その日を祝福して、特別な日にした、と書かれているよ。",sc:3,t:["ナゴム「その通り。神は第七日に、なさった仕事を終えて休み、その日を祝福して聖なる日とした、と書かれている。（創世記2:2〜3）」","ツチオ「あとで出てくる『安息日』の戒めにも、つながっていくんだね。」"]},
  {l:"休んだ、とだけ書かれているよ。",sc:2,t:["ナゴム「『休んだ』は合っている。でも続きがあるんだ。その日を祝福して、聖なる日にした、とも書かれている。（創世記2:2〜3）」"]},
  {l:"最後の仕上げに、人間を造った日だよ。",sc:1,t:["ナゴム「人が造られたのは、六つめの日だよ。（創世記1:26〜31）　七つめの日は、休みと祝福の日として語られている。」"]}],
 res:"出エジプト記20章11節は、この創造の七日を、安息日の理由として挙げている。七日の区切りが、のちの信仰のくらしにつながっていく。",
 memo:[
  {k:"聖書の記述",t:"創世記1章1節〜2章3節は、神が六日のあいだに世界を造り、第七日に休んだと語る。各日の区切りで「良しとされた」が繰り返され（1:4,10,12,18,21,25）、人の創造のあとには「極めて良かった」とある（1:31）。",s:"聖書本文 創世記1:1〜2:3（引用は要約。逐語の訳文は、各自が使う聖書で確認）"},
  {k:"聖書の記述",t:"人は「神のかたち」に造られた、と記される（1:26〜27）。",s:"聖書本文 創世記1:26〜27（要約）"},
  {k:"聖書の記述",t:"出エジプト記20章8〜11節は、六日で造り七日目に休んだことを、安息日の理由として挙げる。",s:"聖書本文 出エジプト記20:8〜11（要約）"},
  {k:"聖書の記述",x:"諸説",t:"創世記2章4節以降にも、人が先に造られるなど、順序の異なる創造の語りがある。1章と2章の関係や成立については、研究者の見方が分かれる。",s:"聖書本文 創世記2:4〜25。成立についての学術的な出典は未確認"},
  {k:"伝承",x:"未確認",t:"創造の物語の読み方（歴史の記録として読むか、神学的・文学的な語りとして読むか）には、教派や共同体ごとに幅がある。この旅は、特定の読み方を唯一の答えとしない。各教派の公式文書は、今後取得して並べて載せる。",s:"（未確認：教派ごとの公式文書は、この弾では取得できていない）"},
  {k:"想像",t:"場面の絵は想像の絵。神の姿は描かない。光の筋は、「光」の象徴的な表現。",s:"制作メモ"}]},
{key:"eden",nw:"エデンの園",theme:"エデンの園と、はじめの人",ref:"創世記2:4〜3:24",per:"原初史",era:"年代は特定できない",place:"エデン？（諸説）",mk:"eden",sc:"eden",lead:"miguel",
 arr:["次に降り立ったのは、緑あふれる園。創世記2〜3章の、エデンの園だ。",
  "ツチオ「川が流れてる…。聖書には、この園から川が出て、四つに分かれたと書いてあるんだよ。」",
  "ナゴム「名前が挙がるのは、ピション、ギホン、チグリス、ユーフラテス。（創世記2:10〜14）」",
  "ワラオ「あっ、真ん中に二本の木がある。いのちの木と、善悪を知る木。」",
  "ナゴム「園の中央に、その二つが生えていたと書かれている。（2:9）　そして、善悪を知る木の実は食べてはいけない、と告げられた。（2:16〜17）」",
  "イワオ「それで、あの蛇か…。」",
  "ツチオ「アダムって、ぼくの名前の『土』と近い言葉だって、聞いたことがある…。」",
  "ナゴム「ヘブライ語で、人（アダム）と土（アダマ）は響きが近い、と説明されることがあるよ。ただ、その出典は確認できていないから、『未確認』にしておこう。」",
  "イクミ「わたしの名前、『生きる』の『生』なんだ。アダムの妻のエバとも、何か関係あるのかな？」",
  "ナゴム「エバは、名前の意味が本文に書かれている人でもあるんだ。アダムが妻をエバと名づけたのは、『すべて生きる者の母』だから、と書かれている。（3:20）」",
  "（この物語の結末は、悲しい。人は園を出ることになる。丁寧に聞こう。）"],
 q:"ワラオ「ねえ、食べちゃった『禁じられた実』って、りんごなの？」",
 ch:[
  {l:"本文に、木の実の種類は書かれていないよ。",sc:3,t:["ナゴム「その通り。3章6節は『その木の実』と言うだけで、果物の名前は出てこない。りんごの絵は、のちの時代のイメージだよ。」","ワラオ「へえ。じゃあ、どうしてりんごになったの？」","ナゴム「理由は、いくつか説が語られている。でも出典を確認できていないから、『未確認』にしておこう。」"]},
  {l:"食べたら必ず死ぬ、と警告されていた実だよ。",sc:2,t:["ナゴム「それは書いてあるよ。（2:17）　でもワラオの質問は『何の実か』だよね。そこは、本文は種類を書いていないんだ。」"]},
  {l:"『りんご』と書いてあるよ。",sc:1,t:["ナゴム「聖書の本文には、りんごとは書かれていないよ。（3:6）　りんごの絵は、のちの時代のイメージなんだ。」"]}],
 res:"物語は、人が神の言葉に背き、園から出ることになる場面へ進む。（3:23〜24）　この箇所をどう受けとめるかは、教派でも幅がある。カトリックの要理は、創世記3章の落下の記事を「比喩的な言葉を使いながら、太古の出来事を確言する」ものと述べる。",
 memo:[
  {k:"聖書の記述",t:"神は園を設け、中央に「いのちの木」と「善悪を知る木」を生えさせた（2:8〜9）。善悪を知る木の実は食べてはならず、食べると必ず死ぬと告げられる（2:16〜17）。",s:"聖書本文 創世記2:8〜9, 2:16〜17（要約）"},
  {k:"聖書の記述",t:"3章6節は禁じられた木の実を「その実」と呼び、種類を記さない。恥を覚えた二人が身にまとったのは、いちじくの葉（3:7）。",s:"聖書本文 創世記3:6〜7（要約）"},
  {k:"聖書の記述",t:"アダムは妻を「エバ」と名づけた。理由は、彼女が「すべて生きる者の母」だから、と書かれている（3:20）。",s:"聖書本文 創世記3:20（要約）"},
  {k:"聖書の記述",t:"人は園から出され、園の東にケルビムと「きらめく剣の炎」が置かれた（3:23〜24）。",s:"聖書本文 創世記3:23〜24（要約）"},
  {k:"聖書の記述",t:"創世記は、蛇を「野の生き物の一つ」として登場させ、その正体を説明しない（3:1）。のちの新約聖書は「あの古い蛇」を悪魔・サタンと呼ぶ（黙示録12:9）。",s:"聖書本文 創世記3:1／黙示録12:9（要約）"},
  {k:"伝承",x:"諸説",t:"エデンの場所：本文はチグリスとユーフラテスを挙げる（2:14）が、ピションとギホンの特定は定まらない。場所を探す試みは多く、象徴的な語りとして読む立場もある。地図の印は、「所在不明」を示す目安にすぎない。",s:"聖書本文 創世記2:10〜14。場所の比定についての学術的な出典は未確認"},
  {k:"伝承",t:"カトリック教会のカテキズム（要理）390項：創世記3章の落下の記事は、比喩的な言葉を使いながら、太古に起きた出来事を確言する。",s:"Catechism of the Catholic Church §390（バチカン公式サイト）"},
  {k:"伝承",x:"未確認",t:"正教会、プロテスタント諸教会の読み方は、この弾では出典を取得できていない。確認でき次第、並べて載せる。",s:"（未確認）"},
  {k:"想像",t:"「りんご」の絵や、蛇の姿は、のちの時代の描き方に倣った想像の絵。園の木々も想像。",s:"制作メモ"}]},
{key:"cain",nw:"カインとアベル",theme:"カインとアベル",ref:"創世記4:1〜16",per:"原初史",era:"年代は特定できない",place:"ノドの地？（所在不明）",mk:"cain",sc:"cain",lead:"pierre",
 arr:["エデンの東。ふたりの兄弟の物語が始まる。（創世記4章）",
  "ナゴム「兄のカインは土を耕す人、弟のアベルは羊を飼う人になった。（4:2）」",
  "ワラオ「ふたりとも、神さまに供えものをしたんだよね。カインは土の実りを、アベルは羊の初子と、その肥えた部分を。（4:3〜4）」",
  "ツチオ「神はアベルとその供えものに目を留め、カインとその供えものには目を留めなかった。カインは怒り、顔を伏せた。（4:4〜5）」",
  "（このあと、とても悲しいことが起こる。この旅では、その場面は描かない。）",
  "イクミ「……どうして、カインの供えものは見てもらえなかったの？」"],
 q:"イクミ「ねえ、聖書に、その理由は書いてあるの？」",
 ch:[
  {l:"4章には、理由は書かれていないよ。",sc:3,t:["ナゴム「その通り。創世記4章は、理由を説明していない。新約聖書の手紙には、アベルの信仰に結びつけるもの（ヘブライ人への手紙11:4）と、カインの行いを悪いものとするもの（ヨハネの手紙一3:12）があるよ。」"]},
  {l:"アベルが、羊の初子と肥えた部分を供えたからだよ。",sc:2,t:["ナゴム「供えものの違いは、確かに本文に書いてある。（4:3〜4）　でも、それが理由だとは、本文は言っていないんだ。」"]},
  {l:"神が、畑の作物を気に入らないと決めていたからだよ。",sc:1,t:["ナゴム「それは、本文には書かれていないよ。4章は、理由を説明していないんだ。」"]}],
 res:"このあと、カインは弟を殺してしまう（4:8）。神に弟のことを問われたカインは、知らないと答える（4:9）。カインは土地を追われるが、神は彼に「印」をつけ、誰も彼を殺さないように守る（4:15）。",
 memo:[
  {k:"聖書の記述",t:"カインは土を耕す者、アベルは羊を飼う者。ふたりは供えものをし、神はアベルとその供えものに目を留めたが、カインのものには目を留めなかった（4:2〜5）。",s:"聖書本文 創世記4:2〜5（要約）"},
  {k:"聖書の記述",t:"神はカインに、罪が戸口で待ち伏せていると告げ、それを治めるよう促した（4:7）。",s:"聖書本文 創世記4:7（要約）"},
  {k:"聖書の記述",t:"カインは弟を殺し（4:8）、地をさまよう者となる。神は誰も彼を殺さないよう「印」をつけた（4:15）。印がどんなものかは書かれていない。カインは「エデンの東、ノドの地」に住んだ（4:16）。",s:"聖書本文 創世記4:8〜16（要約）"},
  {k:"聖書の記述",t:"新約聖書の手紙は、アベルの供えものを信仰に結びつけ（ヘブライ人への手紙11:4）、カインを「悪い者に属し」弟を殺した者と呼ぶ（ヨハネの手紙一3:12）。",s:"聖書本文 ヘブライ人への手紙11:4／ヨハネの手紙一3:12（要約）"},
  {k:"伝承",x:"未確認",t:"ノドの地の場所は、聖書の本文から特定できない。地図の印は目安にすぎない。",s:"聖書本文 創世記4:16。場所についての学術的な出典は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。殺害の場面は描かない。祭壇の形や煙も想像。",s:"制作メモ"}]},
{key:"noah",nw:"ノアの洪水",theme:"ノアと箱舟、虹の契約",ref:"創世記6:9〜9:17",per:"原初史",era:"年代は特定できない",place:"アララトの山々",mk:"noah",sc:"noah",lead:"john",
 arr:["水の世界。創世記6〜9章、ノアと箱舟の物語だ。",
  "ナゴム「地に暴虐が満ちたとき、神は、正しい人ノアに、箱舟を造るよう告げた。（6:9〜22）」",
  "ワラオ「大きさも書いてあるんだよね。長さ300アンマ、幅50アンマ、高さ30アンマ。（6:15）」",
  "イクミ「アンマって、なあに？」",
  "ナゴム「前腕の長さに由来する、古い長さの単位だよ。メートルへの換算は、資料によって幅があるんだ。」",
  "ナゴム「ちなみに、ぼくの名前の『慰め』は、ノアの名前と結びつけられた言葉なんだ。父のレメクが、この子は慰めをもたらすだろう、と言って名づけた、と書かれている。（5:29・要約）」",
  "ワラオ「ナゴムの名前も、聖書だったんだ！」",
  "ツチオ「四十日四十夜の雨のあと、水は百五十日のあいだ地にあふれた。（7:12, 7:24）」",
  "（水が引くのを待つノアは、鳩を放した。鳩は、オリーブの葉をくわえて戻ってきた。（8:11））",
  "ツチオ「あっ、葉っぱをくわえてる！ 若いオリーブの葉だ。水が引いたしるしなんだね。」"],
 q:"イワオ「ところで、箱舟は、どの山にたどり着いたんだ？」",
 ch:[
  {l:"『アララトの山々』とある。ひとつの山の名とは書かれていないよ。",sc:3,t:["ナゴム「その通り。8章4節は、箱舟が『アララトの山々のうえ』に止まった、と語る。ひとつの山の名ではなく、山々の名なんだ。」","イワオ「のちに、特定の山に結びつけられたりもしたのかな？」","ナゴム「そういう伝承は語られるけれど、この章では出典を確認できていない。『未確認』にしておこう。」"]},
  {l:"『山の上に止まった』と書かれるだけで、地名はないよ。",sc:2,t:["ナゴム「『山に止まった』は合っている。でも地名も出てくるんだ。『アララトの山々』。（8:4）」"]},
  {l:"シナイ山だよ。",sc:1,t:["ナゴム「シナイ山は、あとの出エジプトの物語に出てくる山だよ。箱舟の山は『アララトの山々』。（8:4）」"]}],
 res:"水が引いたあと、神はノアたちと、すべての生き物に、もう洪水で地を滅ぼさないと約束し、そのしるしとして虹を置いた。（9:8〜17）",
 memo:[
  {k:"聖書の記述",t:"神はノアに箱舟を造るよう告げ、その大きさが示される（長さ300・幅50・高さ30アンマ、6:15）。洪水は四十日四十夜の雨で始まり（7:12）、水は百五十日のあいだ地にあふれた（7:24）。",s:"聖書本文 創世記6:9〜7:24（要約）"},
  {k:"聖書の記述",x:"諸説",t:"動物の数は、「二つずつ」（6:19〜20）と、清い動物は「七つずつ」（7:2）の両方が書かれている。この違いの説明については、研究者の見方が分かれる。",s:"聖書本文 創世記6:19〜20, 7:2。成立についての学術的な出典は未確認"},
  {k:"聖書の記述",t:"ノアの父レメクは、「この子は、呪われた地の労苦から慰め（安らぎ）をもたらすだろう」と言ってノアと名づけた、と書かれている（5:29）。",s:"聖書本文 創世記5:29（要約）"},
  {k:"聖書の記述",t:"箱舟は「アララトの山々」に止まった（8:4）。ノアは烏と鳩を放し、鳩はオリーブの葉をくわえて戻った（8:7〜11）。",s:"聖書本文 創世記8:4〜12（要約）"},
  {k:"聖書の記述",t:"神は、すべての生き物との契約として、もう洪水で地を滅ぼさないと約束し、虹をそのしるしとした（9:8〜17）。",s:"聖書本文 創世記9:8〜17（要約）"},
  {k:"史実",t:"メソポタミアにも洪水の物語がある。ギルガメシュ叙事詩の第11の書板は、ウトナピシュティムが神々の送った洪水を舟で生き延びる話を語り、鳩・燕・烏を放す場面を含む。この粘土板（大英博物館所蔵）は、ニネベのクユンジク出土、新アッシリア期（紀元前7世紀ごろ）とされ、1872年にジョージ・スミスが洪水の物語と見抜いた。",s:"Google Arts & Culture「The Flood Tablet」（大英博物館）"},
  {k:"史実",x:"諸説",t:"聖書の洪水物語とメソポタミアの洪水物語との関係（影響の有無や向き）は、研究者の見方が分かれる。この弾では、その出典を取得できていない。",s:"（未確認）"},
  {k:"伝承",x:"未確認",t:"箱舟の漂着地を特定の山に結びつける伝承や、洪水が実際にどの範囲で起きたかの理解は、教派や研究者で分かれる。この弾では、出典を取得できていない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。箱舟の形は本文に書かれていない（寸法のみ）。アララトの山の形も想像。",s:"制作メモ"}]},
{key:"babel",nw:"バベルの塔",theme:"バベルの塔",ref:"創世記11:1〜9",per:"原初史",era:"年代は特定できない",place:"シンアルの地（バビロン？）",mk:"babel",sc:"babel",lead:"esther",
 arr:["広い平野。レンガを焼く煙が上がっている。創世記11章、バベルの塔の物語だ。",
  "ナゴム「そのころ、人々はみな同じ言葉を話していた。東から移ってきて、シンアルの地の平野に住みついた。（11:1〜2）」",
  "ワラオ「石の代わりにレンガ、しっくいの代わりにアスファルトを使った、って。（11:3）」",
  "イワオ「そして言ったんだな。町と、頂が天に届く塔を建てよう。名をあげよう、と。（11:4・要約）」",
  "（ここで神は「降りて」来て、人々の言葉を混乱させる。人々は、全地に散らされた。町の名はバベル。（11:5〜9））",
  "イクミ「うわあ、おっきい塔…。でも、聖書に書いてある形って、これであってるの？」"],
 q:"イクミ「ねえ、聖書には、塔の形がどう書いてあるの？」",
 ch:[
  {l:"形の説明はないよ。レンガとアスファルトで造り、頂を天に届かせようとした、と書かれている。",sc:3,t:["ナゴム「その通り。11章3〜4節が書くのは、材料と、頂が天に届く、という計画だけ。段の数や形は書かれていない。」","イクミ「じゃあ、この絵は…？」","ナゴム「想像の絵だよ。バビロンの大きな神殿塔をもとに、描かれることが多いんだ。」"]},
  {l:"七つの段がある、階段のような塔と書かれているよ。",sc:2,t:["ナゴム「七層の階段状の塔、というのは、バビロンにあった大きな神殿塔（エテメナンキ）の姿だよ。聖書の本文には、段の数も形も書かれていないんだ。」"]},
  {l:"石を積んだ、細長い灯台のような塔と書かれているよ。",sc:1,t:["ナゴム「石ではなく、レンガとアスファルトと書かれているよ。（11:3）　形の説明は、本文にはないんだ。」"]}],
 res:"バベルという名は、ヘブライ語で「混乱させる」を思わせる言葉と結びつけて語られる。（11:9）　人々が全地に散らされるところで、原初史の語りは終わり、物語は、アブラハムへと進んでいく。",
 memo:[
  {k:"聖書の記述",t:"人々は同じ言葉を話し、シンアルの地の平野に住み、レンガとアスファルトで町と、頂が天に届く塔を造り、名をあげようとした（11:1〜4）。神は言葉を混乱させ、人々を全地に散らした。その町の名はバベルと呼ばれた（11:5〜9）。",s:"聖書本文 創世記11:1〜9（要約）"},
  {k:"聖書の記述",t:"塔の形や段数は、本文に書かれていない。",s:"聖書本文 創世記11:3〜4"},
  {k:"史実",t:"バビロンのジッグラトは「エテメナンキ」（天と地の基礎）と呼ばれた。基部は一辺約90メートルの正方形、高さも約90メートル、七階建てで、最上階に神殿があったとされる。紀元前2千年紀に基礎が遡る可能性があり、前689年のセンナケリブの攻撃で損傷、のちエサルハドンが修復し、ナボポラッサルとネブカドネザル2世が完成させた。",s:"フランス文化省「Orient cuneiforme」（Ziggurats and Etemenanki）。出典ページは、バベルの塔の物語との関係には触れていない"},
  {k:"史実",x:"諸説",t:"バベルの塔とエテメナンキを結びつける説明は広く行われる。この弾では、その関係を確認できる出典を取得できていない。また、バベル（Babel）をバビロンのヘブライ語名と説明する点も、出典は未確認。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。塔の形は、バビロンの神殿塔を参考にした想像。",s:"制作メモ"}]}
];

const HELP=["【あそびかた】","五人の旅人と、聖書の物語を旅します。章を選び、地図の目的地へ出発します。","物語を聞いたら、旅人からの「問い」に答えます。聖書に書かれていることに沿って答えられるほど、★が増えます（最大★3つ）。","★が1つ以上で、次の章が開きます。★3をめざして、何度でも挑戦できます。","物語の最後に、「しおり」と「メモ」が出ます。メモには、聖書の記述／伝承／史実／想像の別と、出典、わからなかった点（未確認・諸説）が書かれています。","教派によって見方が分かれる点は、できるだけ並べて載せます。出典を取得できていない点は、決めずに「未確認」と書きます。","文字は、タップで全部表示。速さは設定で変えられます。","タイトルと章の一覧から、「聖書年表」と「人物辞典」を開けます。どちらも、クリアした章の分だけ名前や説明が現れます。年表に、年代の数字は載せていません。","章をクリアすると、その章の「章カード」が手に入ります。絵は、聖書の場面に出てくる品のシンボルです。★の数で、枠が銅・銀・金になります。「カード図鑑」で、集めたカードを見られます。","BGMは、時代の帯ごとに11曲あります。設定で、オン・オフを切りかえられます。"];

  "イワオ「聖書では、ここから『ひとつの民』の物語が始まる。アブラムは、父テラの一族とともに『カルデアのウル』を出て、ハランに住んでいた。（11:31）」",
  "ナゴム「そこで、神はアブラムに告げた。故郷と父の家を離れて、わたしが示す地へ行きなさい、と。（12:1・要約）」",
  "ツチオ「家も土地も置いて行くの？　しかも、75歳で…。（12:4）」",
  "ワラオ「それでも、出発したんだね。」",
  "イクミ「夜空を見て！　のちに神は、星を数えてごらん、あなたの子孫はこのようになる、と言うんだ。（15:5）」",
  "（子どもがいなかったアブラムは、その言葉を信じた。聖書は、神がそれを『義』と認められた、と書く。（15:6））"],
 q:"ワラオ「ねえ、神さまはアブラムに、どんなことを約束したの？」",
 ch:[
  {l:"行く先の地を示し、大きな国民にし、祝福する。さらに、地上のすべての氏族が、彼によって祝福を受ける、と約束した。",sc:3,t:["ナゴム「その通り。（12:1〜3）　約束は、地、子孫、祝福。そして、祝福は『地上のすべての氏族』にまで広がっている。」"]},
  {l:"大きな国民にする、と約束した。",sc:2,t:["ナゴム「それは約束の一部だよ。（12:2）　続きがある。行く先の地を示すこと、そして、地上のすべての氏族が、彼によって祝福を受けること。（12:1〜3）」"]},
  {l:"ウルに戻って、家を継ぐように言った。",sc:1,t:["ナゴム「逆だよ。神は、故郷を離れて、示す地へ行くように告げたんだ。（12:1）」"]}],
 res:"アブラムは、のちに「アブラハム」（多くの国民の父）と名を改められ、妻サライも「サラ」と改められる。（17:5, 17:15）　新約聖書のローマ人への手紙4章は、15章6節を引いて、アブラハムの信仰を語る。",
 memo:[
  {k:"聖書の記述",t:"アブラムは、75歳でハランを出発し（12:4）、妻サライと甥のロトらを連れてカナンの地へ入った。シェケム、ベテルの近くで祭壇を築いた（12:6〜8）。",s:"聖書本文 創世記12:1〜9（要約）"},
  {k:"聖書の記述",t:"テラの一族は「カルデアのウル」を出てカナンを目指し、ハランに住んだ（11:31）。",s:"聖書本文 創世記11:31"},
  {k:"聖書の記述",t:"神は星を数えるように示し、子孫がそのようになると告げた。アブラムは主を信じ、神はそれを義と認めた（15:5〜6）。",s:"聖書本文 創世記15:5〜6（要約）"},
  {k:"聖書の記述",t:"アブラムは「アブラハム」（多くの国民の父）に、サライは「サラ」に、名を改められた（17:5, 17:15）。契約のしるしも示される（17:10〜14）。",s:"聖書本文 創世記17章（要約）"},
  {k:"聖書の記述",t:"新約聖書は、創世記15章6節を引いて、アブラハムの信仰を語る（ローマ人への手紙4:3）。",s:"聖書本文 ローマ人への手紙4:3（要約）"},
  {k:"伝承",x:"諸説",t:"「カルデアのウル」の場所は、南メソポタミアの遺跡と結びつけて語られることが多いが、別の場所を推す説もある。この弾では、考古学的な出典を取得できていない。",s:"（未確認：Penn Museum のページは開けたが、ウルの記事は取得できなかった）"},
  {k:"伝承",x:"未確認",t:"アブラハムの年代は、聖書の記述から導く立場と、考古学的に推す立場があり、特定できない。アブラハムは、ユダヤ教、キリスト教、イスラームで重んじられる人物と説明されることが多いが、各宗教の公式資料は、この弾では取得できていない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。ロバや羊は描いたが、ラクダは描いていない（創世記にはラクダの記述もあるが、時代との関係は議論がある。未確認）。",s:"制作メモ"}]},
{key:"isaac",nw:"イサクの献げ物",theme:"イサクの誕生とモリヤの山",ref:"創世記21:1〜7／22:1〜19",per:"族長",era:"年代は諸説（出典未確認）",place:"モリヤの地（エルサレム？）",mk:"isaac",sc:"moriah",lead:"john",
 arr:["約束の子が生まれた。創世記21章。アブラハムは100歳、サラも年老いていた。（21:2〜5）",
  "ナゴム「その子は、イサクと名づけられた。この名前は、『笑う』という言葉と結びつけられている。」",
  "ワラオ「えっ、笑う…！　ぼくの名前と同じ意味だ！」",
  "ナゴム「アブラハムは笑い（17:17）、サラも笑った（18:12）。そしてサラは言った。神はわたしに笑いをお与えになった、と。（21:6・要約）」",
  "イクミ「ワラオの名前は、イサクと同じ意味だったんだね！」",
  "（その子が少年になったころ、神はアブラハムを試した。22章。とても重い物語。丁寧に聞こう。）",
  "イワオ「神はアブラハムに、愛する子イサクを、モリヤの地で献げものとしてささげるように言った。（22:1〜2）」",
  "ナゴム「三日目に、山が見えた。イサクは、薪はあるけれど、献げものの羊はどこ？　と尋ねる。アブラハムは、神が備えてくださる、と答えた。（22:4〜8・要約）」",
  "（祭壇の用意ができたとき、天から声が呼んで、止めた。アブラハムが目を上げると、角を藪にとられた雄羊がいた。（22:11〜13））"],
 q:"ワラオ「それで…イサクの代わりに献げられたのは、何だったの？」",
 ch:[
  {l:"藪に角をとられていた、雄羊だよ。",sc:3,t:["ナゴム「その通り。（22:13）　アブラハムは、その場所を『主は備えてくださる』と名づけた。（22:14）」"]},
  {l:"イサクがたずねた、羊だよ。",sc:2,t:["ナゴム「イサクが尋ねたのは『羊』で、アブラハムは『神が備えてくださる』と答えた。（22:7〜8）　実際に備えられたのは、藪に角をとられた雄羊だったんだ。（22:13）」"]},
  {l:"牛だよ。",sc:1,t:["ナゴム「牛ではないよ。藪に角をとられた雄羊だよ。（22:13）」"]}],
 res:"この物語は、ユダヤ教では「アケダー（縛り）」と呼ばれ、新年の角笛（ショファール）は、この雄羊を思い起こさせるものとされる。キリスト教には、イエスの犠牲の先ぶれと読む伝統があり、イスラームでは、献げられる子をイサクではなくイシュマエル（イスマーイール）とする説明がある。宗教によって、受けとめ方は異なる。",
 memo:[
  {k:"聖書の記述",t:"イサクは、アブラハムが100歳のときに生まれた（21:5）。サラは「神はわたしに笑いをお与えになった」と言った（21:6）。アブラハムも（17:17）、サラも（18:12）、神の告げを聞いて笑った。",s:"聖書本文 創世記17:17, 18:12, 21:1〜7（要約）"},
  {k:"聖書の記述",t:"神はアブラハムを試し、イサクを「モリヤの地」の山で献げるよう命じた（22:1〜2）。三日目に山が見え（22:4）、天から呼ぶ声がアブラハムを止め（22:11〜12）、藪に角をとられた雄羊が、イサクの代わりに献げられた（22:13）。アブラハムは、その場所を「主は備えてくださる」と名づけた（22:14）。",s:"聖書本文 創世記22:1〜19（要約）"},
  {k:"聖書の記述",t:"歴代誌下3章1節は、ソロモンが神殿を建てた山を、モリヤ山と呼ぶ。",s:"聖書本文 歴代誌下3:1。Encyclopaedia Britannica「Akedah」もこの結びつきを説明する"},
  {k:"伝承",t:"ユダヤ教：この物語は「アケダー（縛り）」と呼ばれる。アブラハムは従順の、イサクは殉教者の象徴とされる。新年（ローシュ・ハシャナ）の角笛は、この雄羊を思い起こさせるとされ、祈りにもこの出来事への言及がある。",s:"Encyclopaedia Britannica「Akedah」"},
  {k:"伝承",t:"キリスト教：この物語を、イエスの犠牲の「原型」と読む伝統がある（テルトゥリアヌスの著作が挙げられる）。",s:"Encyclopaedia Britannica「Akedah」"},
  {k:"伝承",x:"未確認",t:"イスラーム：クルアーン37章97〜111節を挙げて、この物語を服従の模範とし、献げられる子をイサクではなくイシュマエル（イスマーイール）と説明すると、ブリタニカは書く。クルアーンの本文が子の名を挙げるかどうか、各派の公式な見解は、この弾では確認できていない。",s:"Encyclopaedia Britannica「Akedah」。クルアーン本文・公式資料は未取得"},
  {k:"伝承",x:"未確認",t:"モリヤの地を、エルサレムの神殿の丘と同じ場所とみなす理解は、歴代誌下3章1節にもとづく。創世記22章の「モリヤの地」が同じ場所かどうかの学術的な出典は、この弾では取得できていない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。天から呼んだ使いは、翼のない、光の中の人の姿で描いた。神の姿は描いていない。アブラハムが刃を振り上げ、使いが止める瞬間を描いた。血や傷つく場面は描かない。聖書は、イサクの年齢や姿を書いていない。",s:"制作メモ"}]},
{key:"jacob",nw:"ヤコブの梯子",theme:"ヤコブの夢",ref:"創世記28:10〜22",per:"族長",era:"年代は諸説（出典未確認）",place:"ベテル（ルズ）",mk:"jacob",sc:"bethel",lead:"pierre",
 arr:["イサクの子ヤコブは、旅の途中で日が暮れた。創世記28章。ここは、荒れた丘。",
  "ナゴム「ヤコブは、兄エサウの怒りを避けて、母の兄ラバンのいるハランへ向かっていた。（27:41〜45, 28:1〜5）」",
  "ツチオ「ヤコブって、名前の意味は『かかと』って聞いたけど…。」",
  "ナゴム「生まれるとき、兄エサウのかかとをつかんでいたから、と書かれている。（25:26）」",
  "イワオ「ヤコブは、石を枕にして眠った。（28:11）　すると、夢を見たんだ。」",
  "（地に立てられた階段（はしご）が、天に届き、神の使いたちが上ったり、下りたりしていた。（28:12））",
  "イクミ「神は、ヤコブに、祖父アブラハムと同じ約束をくり返した。地と、子孫と、祝福。そして、わたしはあなたとともにいる、と。（28:13〜15・要約）」",
  "（目を覚ましたヤコブは、『まことに主がこの場所におられる』と言って、恐れた。そして、枕にした石を柱として立てた。（28:16〜18））"],
 q:"ツチオ「ヤコブは、その場所を何と名づけたの？」",
 ch:[
  {l:"ベテル（神の家）と名づけた。もとの町の名は、ルズだった。",sc:3,t:["ナゴム「その通り。（28:19）　ベテルは、『神の家』という意味だよ。」"]},
  {l:"ルズと名づけた。",sc:2,t:["ナゴム「ルズは、もとの町の名前だよ。ヤコブがつけた名前は、ベテル、『神の家』。（28:19）」"]},
  {l:"モリヤと名づけた。",sc:1,t:["ナゴム「モリヤは、イサクの物語の山の名前だよ。（22:2）　ヤコブがつけた名前は、ベテル。（28:19）」"]}],
 res:"のちにヤコブは、ヤボクの渡しで、神と格闘したのち、「イスラエル」という名を与えられる。（32:23〜29）　その子孫が、「イスラエルの民」と呼ばれるようになる。",
 memo:[
  {k:"聖書の記述",t:"ヤコブは、石を枕に眠り、地に立つ階段が天に届き、神の使いたちが上り下りする夢を見た（28:10〜12）。神は、アブラハムとイサクに与えた約束をくり返し、「わたしはあなたとともにいる」と告げた（28:13〜15）。ヤコブはその地を「ベテル」（神の家）と名づけた。町のもとの名は、ルズ（28:19）。",s:"聖書本文 創世記28:10〜22（要約）"},
  {k:"聖書の記述",t:"ヤコブの名は、生まれるときに兄エサウのかかとをつかんでいたことと結びつけられている（25:26）。",s:"聖書本文 創世記25:26（要約）"},
  {k:"聖書の記述",t:"のちにヤコブは、神と格闘して「イスラエル」の名を与えられる（32:28）。",s:"聖書本文 創世記32:23〜29（要約）"},
  {k:"伝承",x:"未確認",t:"「はしご」と訳される語は、訳によって「階段」などとも訳される。語の意味や、ジッグラトのような階段を指すかどうかは、議論がある。この弾では、出典を取得できていない。",s:"（未確認）"},
  {k:"伝承",x:"未確認",t:"ベテルの場所は、エルサレムの北の遺跡と同一視されることが多いが、この弾では、考古学的な出典を取得できていない。地図の印は目安。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。使いは翼のない人の姿と光で描き、神の姿は描いていない。階段の形も想像。",s:"制作メモ"}]},
{key:"joseph",nw:"ヨセフとエジプト",theme:"ヨセフ、エジプトへ",ref:"創世記37〜50章（37章／41章／45章／50章）",per:"族長",era:"年代は諸説（出典未確認）",place:"エジプト（ナイルのほとり）",mk:"joseph",sc:"joseph",lead:"miguel",
 arr:["ヤコブの12人の息子のなかで、ヨセフは、父に特別に愛された。創世記37章。",
  "ナゴム「父は、ヨセフに特別な上着を作ってやった。（37:3）　兄たちは、それをねたんだ。」",
  "（兄たちは、ヨセフを穴に投げ込み、通りかかった隊商に、銀20枚で売った。ヨセフは、エジプトへ連れて行かれた。（37:23〜28））",
  "イワオ「エジプトでヨセフは、ポティファルの家に仕え、無実の罪で牢に入れられた。それでも、夢を解き明かす力が認められていく。（39〜41章）」",
  "ツチオ「王様の夢の話だね。やせた牛が、太った牛を食べちゃう夢。（41:1〜4）」",
  "イクミ「ヨセフは言った。七年の豊作のあと、七年の飢饉が来る、と。（41:25〜31・要約）」"],
 q:"ツチオ「それで、王様は、ヨセフに何を任せたの？」",
 ch:[
  {l:"エジプトの国を治める地位。ヨセフは、穀物をたくわえて、飢饉に備えた。",sc:3,t:["ナゴム「その通り。ファラオ（口語訳ではパロ）は、ヨセフを国の上に立てた。（41:40〜41）　ヨセフは、豊作の七年のあいだに、穀物をたくわえた。（41:47〜49）」"]},
  {l:"穀物をたくわえる役目だけを、与えた。",sc:2,t:["ナゴム「穀物をたくわえる役目は、確かに任された。でも、それだけじゃない。ヨセフは、国を治める地位に立てられたんだ。（41:40〜41）」"]},
  {l:"神殿の祭司にした。",sc:1,t:["ナゴム「ヨセフが祭司になったのではないよ。祭司の娘アセナトと結婚したと書かれている。（41:45）」"]}],
 res:"飢饉はカナンにも及び、ヨセフの兄たちが、穀物を求めてエジプトに来る。ヨセフは、のちに身を明かして、兄たちを赦す。（42〜45章）　ヨセフは、あなたがたは悪を謀ったが、神はそれを善に変えた、と語る。（50:20・要約）　ヤコブの一族は、エジプトに移り住んだ。（46〜47章）",
 memo:[
  {k:"聖書の記述",t:"ヨセフは父に特別な上着を作ってもらい、兄たちにねたまれて、銀20枚で隊商に売られた（37:3, 37:28）。エジプトで仕え、牢に入れられ、王の夢を解き明かして、国の上に立てられた（39〜41章）。",s:"聖書本文 創世記37〜41章（要約）"},
  {k:"聖書の記述",t:"王の夢は、やせた牛が太った牛を食べる夢（41:1〜4）。ヨセフは、七年の豊作と七年の飢饉を告げ、穀物をたくわえるよう勧めた（41:25〜36）。",s:"聖書本文 創世記41:1〜36（要約）"},
  {k:"聖書の記述",t:"ヨセフは兄たちに身を明かし（45章）、父ヤコブの一族はエジプトのゴシェンの地に住んだ（46〜47章）。ヨセフは、兄たちの悪を、神は善に変えた、と語る（50:20）。",s:"聖書本文 創世記45〜47章, 50:20（要約）"},
  {k:"聖書の記述",x:"諸説",t:"37章3節の「特別な上着」は、「色とりどり」か「袖つき・長い」かなど、語の解釈で分かれる。この弾では、出典を取得できていない。",s:"（未確認）"},
  {k:"伝承",x:"未確認",t:"王は本文では「ファラオ」とだけ呼ばれ、名前は書かれていない。ヨセフの時代（ヒクソス期とする説など）は諸説で、この弾では出典を取得できていない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。背景のピラミッドと穀物倉の形は想像。",s:"制作メモ"}]},
{key:"exodus",nw:"出エジプトと紅海",theme:"出エジプトと、海の道",ref:"出エジプト記1〜15章",per:"出エジプトと荒野",era:"年代は諸説（出典未確認）",place:"葦の海？（所在不明）",mk:"exodus",sc:"exodus",lead:"esther",
 arr:["ヨセフの死後、エジプトでイスラエルの子らは増え、強制労働を課せられた。出エジプト記1章。（1:8〜14）",
  "ナゴム「そこに生まれたのが、モーセだ。名前は、水から『引き出した』という意味と結びつけられ、エジプトの王女がつけたと書かれている。（2:10）」",
  "イワオ「神はモーセに、民を導き出すよう命じた。王は拒み、十の災いが続いた。最後の災いのとき、民は、戸口に羊の血を塗って、過越を守った。（3〜12章）」",
  "（エジプトを出た民は、昼は雲の柱、夜は火の柱に導かれた。（13:21））　けれど、行く手には海。うしろには、王の軍勢。（14章）",
  "イクミ「前は海で、後ろは軍勢…。どうなるの…？」",
  "（モーセが手を海に差し伸べると、主は強い東風で海を退かせた。海は乾いた地となり、水は左右に壁となった。（14:21〜22））"],
 q:"イクミ「ねえ、渡った海の名前は、聖書で、なんて書かれているの？」",
 ch:[
  {l:"ヘブライ語は『ヤム・スフ』。『葦の海』『紅海』などと訳が分かれ、渡った場所は、はっきり特定できていない。",sc:3,t:["ナゴム「その通り。ヘブライ語は『ヤム・スフ』。『葦の海』と訳す聖書もあれば、『紅海』と訳す聖書もある。渡った場所は、研究者のあいだでも、見方が分かれているんだ。」"]},
  {l:"ヘブライ語は『ヤム・スフ』で、いまの紅海のことだと決まっている。",sc:2,t:["ナゴム「『ヤム・スフ』は合っている。でも、いまの紅海だと決まっているわけではないんだ。『葦の海』と訳す聖書もあって、渡った場所は、見方が分かれている。」"]},
  {l:"地中海を渡った、と書かれている。",sc:1,t:["ナゴム「聖書は、地中海とは書いていないよ。ヘブライ語は『ヤム・スフ』。訳は、『葦の海』『紅海』などに分かれるんだ。」"]}],
 res:"民は海を渡り、追ってきた軍勢には、水が戻った。（14:27〜28）　モーセの姉ミリアムは、タンバリンを手に、歌い、踊った。（15:20〜21）　聖書は、この日を記念して、代々祝うよう命じている。（12:14）",
 memo:[
  {k:"聖書の記述",t:"モーセは、エジプトの王女に水から引き出され、モーセと名づけられた（2:1〜10）。神はモーセを遣わし、十の災いのあと、民は過越を守ってエジプトを出た（3〜12章）。",s:"聖書本文 出エジプト記2〜12章（要約）"},
  {k:"聖書の記述",t:"民は、昼は雲の柱、夜は火の柱に導かれた（13:21）。モーセが手を差し伸べると、強い東風で海が退き、水は左右に壁となった（14:21〜22）。民が渡ったあと、追っ手の軍勢に水が戻った（14:27〜28）。ミリアムは歌い、踊った（15:20〜21）。",s:"聖書本文 出エジプト記13〜15章（要約）"},
  {k:"聖書の記述",x:"諸説",t:"エジプトを出た男子は、女と子どもを除いて、約60万人と書かれる（12:37）。この数字の読み方（文字どおりか、別の意味か）は、研究者の見方が分かれる。",s:"聖書本文 出エジプト記12:37。数字の解釈についての出典は未確認"},
  {k:"聖書の記述",t:"出エジプト記1章11節は、強制労働で、ピトムとラメセスという倉庫の町が築かれた、と書く。",s:"聖書本文 出エジプト記1:11"},
  {k:"史実",t:"メルエンプタハ王（在位は前1213〜前1203年）の碑（前1208年ごろ、カイロ博物館）に、「イスラエルは荒れ果て、その種は絶えた」という趣旨の文があり、「イスラエル」の名の、最古級の出典とされる。碑とエジプトからの脱出との関係は、この出典では扱われていない。",s:"World History Encyclopedia「Merneptah Stele」"},
  {k:"史実",x:"諸説",t:"「ヤム・スフ」を「紅海」と読むか「葦の海」と読むかは、論争がある。ある論文は、「葦の海」という読みを誤りだと論じ、聖書でヤム・スフが紅海（スエズ湾やエイラト湾）を指す箇所が多いと述べる。一方で、「葦の海」と訳す聖書も多い。渡った場所は特定されていない。",s:"Bernard F. Batto「Red Sea or Reed Sea?」Biblical Archaeology Review, 1984年7・8月号（本文は有料のため、冒頭と注の一部のみ確認）"},
  {k:"史実",x:"諸説",t:"出エジプトの年代は、前15世紀とする立場と、前13世紀とする立場などがあり、一致していない。この弾では、それぞれの根拠の出典を取得できていない。",s:"（未確認）"},
  {k:"伝承",t:"ユダヤ教の過越祭（ペサハ）は、この出来事を記念して祝う。聖書は、この日を記念の日として、代々祝うよう命じている（12:14）。",s:"聖書本文 出エジプト記12:14（要約）。ユダヤ教の公式資料は、この弾では未取得"},
  {k:"想像",t:"場面の絵は想像の絵。海の壁と道の形は想像。雲と火の柱は光で表し、神の姿は描いていない。",s:"制作メモ"}]}
);

CH.push(
{key:"sinai",nw:"シナイ山と十戒",theme:"シナイ山と、十の言葉",ref:"出エジプト記19〜20章／申命記5章",per:"出エジプトと荒野",era:"年代は諸説（出典未確認）",place:"シナイ山？（所在は諸説）",mk:"sinai",sc:"sinai",lead:"cross",
 arr:["海を渡った民は、荒野を進み、三か月目に、シナイの荒野に着いた。民は山の前に宿営した。（19:1〜2）",
  "イワオ「山には、雷と、稲妻と、厚い雲があった、と書かれている。（19:16）　民は、山のふもとから、神の声を聞いた。」",
  "ナゴム「聖書には、神がモーセに、二枚の石の板を授けた、とある。（31:18）　その中身が、『十の言葉』と呼ばれるものだよ。」",
  "ツチオ「……ところで、板には、何が書いてあったかな。数え方は、人によって違うって聞いたけど。」"],
 q:"ツチオ「聖書は、この板の言葉を、なんと呼んでいるのかな？」",
 ch:[
  {l:"『十の言葉』と書かれている。契約の言葉ともよばれる。",sc:3,t:["イワオ「そのとおり。出エジプト記34章28節は『十の言葉』と書く。（申命記4:13も同様）　『十戒』は、あとの時代の呼び名なんだ。」"]},
  {l:"『十の掟』として、番号つきで書かれている。",sc:2,t:["イワオ「聖書は『十の言葉』と呼ぶ。番号は、聖書本文には振られていないんだ。教会によって、数え方が分かれている。」"]},
  {l:"『七つの戒め』と書かれている。",sc:1,t:["イワオ「七つではなくて、『十』。出エジプト記34章28節は『十の言葉』と書いているよ。」"]}],
 res:"十の言葉は、出エジプト記20章と、申命記5章に、よく似た形で書かれている。数え方は、カトリック教会とルーテル教会、正教会と改革派教会などで、分かれている。",
 memo:[
  {k:"聖書の記述",t:"民はシナイの荒野に着き、山の前に宿営した（出エジプト記19:1〜2）。山には、雷、稲妻、厚い雲があった（19:16）。神は、二枚の石の板をモーセに授けた（31:18）。",s:"聖書本文 出エジプト記19・31章（要約）"},
  {k:"聖書の記述",t:"出エジプト記34章28節は、「十の言葉」と書く（申命記4:13にも同様の表現）。同じ内容が、出エジプト記20章1〜17節と、申命記5章6〜21節に、少し違う形で記される。",s:"聖書本文 出エジプト記20・34章、申命記4・5章（要約）"},
  {k:"史実",x:"諸説",t:"十の言葉の数え方は、教会によって違う。『カトリック教会のカテキズム』は、数え方がアウグスティヌスの伝統（カトリックとルーテル教会）と、ギリシア教父の伝統（正教会と改革派）で分かれる、と述べる。ユダヤ教も、別の数え方をする。このゲームは、どれか一つを正解とはしない。",s:"『カトリック教会のカテキズム』2065〜2066項（教皇庁）"},
  {k:"史実",x:"諸説",t:"シナイ山の場所は、特定されていない。ジェベル・ムーサ（モーセの山）がシナイ山だという伝承は、あるが、聖書考古学の解説は、同定には、考古学的にも歴史的にも根拠がないと書く。ほかの候補もある。",s:"Biblical Archaeology Review「Jebel Musa」の解説（読んだ範囲）。ほかの候補の出典は未確認"},
  {k:"伝承",t:"ユダヤ教では、この日を記念する祭が、のちに生まれたとされる。（七週の祭／シャブオット）　ここでは、一般に言われることだけを書いた。",s:"（未確認）ユダヤ教の公式資料は、この弾では未取得"},
  {k:"想像",t:"場面の絵は想像の絵。雲と稲妻は光で表し、神の姿は描いていない。石の板の字は、描いていない。",s:"制作メモ"}]},
{key:"david",nw:"ダビデとゴリアト",theme:"ダビデと、ゴリアト",ref:"サムエル記上16〜17章",per:"王国と預言者",era:"年代は諸説（出典未確認）",place:"エラの谷？（所在は未確認）",mk:"david",sc:"david",lead:"john",
 arr:["サムエルは、ベツレヘムのエッサイの家で、末の子ダビデに油を注いだ。ダビデは羊飼いだった。（16:11〜13）",
  "ナゴム「そのころ、ペリシテ人とイスラエルは、谷をはさんで向かい合っていた。ペリシテの陣から、ゴリアトという男が、毎日、挑んできたんだ。（17:1〜10）」",
  "ワラオ「こわー。大きいんでしょ。どれくらい？」",
  "ナゴム「写本によって、書き方が違う。ヘブライ語の本文では、『六アンマと一ひとはたび』。ほかの写本では、もう少し低い、と言われる。」",
  "（ダビデは、兄たちに食べ物を届けに行き、それを聞いた。王サウルは、自分の鎧を着せようとした。けれど、ダビデは、慣れていない、と脱いだ。（17:38〜39））"],
 q:"ワラオ「で、ダビデは、なにを持っていったの？」",
 ch:[
  {l:"杖と、石投げの紐と、谷川から拾った五つのなめらかな石。",sc:3,t:["ナゴム「そう。杖と、石投げの紐と、なめらかな石五つ。（17:40）　ダビデは、『主の名によって』行く、と言った。（17:45）　石は、ゴリアトの額に当たった。」"]},
  {l:"サウル王の鎧と剣を着けて、戦った。",sc:2,t:["ナゴム「サウルは、鎧を着せようとしたけれど、ダビデは、慣れていないと言って、脱いだんだ。（17:39）」"]},
  {l:"大きな槍と、盾を持っていった。",sc:1,t:["ナゴム「槍と盾を持っていたのは、ゴリアトのほう。ダビデは、杖と、紐と、石を持っていった。（17:40）」"]}],
 res:"ダビデは、石投げの石で、ゴリアトを倒した。（17:49）　ペリシテ人は逃げ、イスラエルは追った。（17:51〜52）　ダビデは、のちに、イスラエルの王になる。（サムエル記下5章）",
 memo:[
  {k:"聖書の記述",t:"ダビデは、ベツレヘムのエッサイの末の子で、羊飼いだった。サムエルは、彼に油を注いだ（サムエル記上16:11〜13）。ダビデは、サウルの鎧を脱ぎ、杖、石投げの紐、五つの石で、ゴリアトに向かった（17:38〜40）。石は額に当たり、ゴリアトは倒れた（17:49）。",s:"聖書本文 サムエル記上16〜17章（要約）"},
  {k:"聖書の記述",x:"諸説",t:"ゴリアトの身の丈は、ヘブライ語の本文で、「六アンマと一ひとはたび」と書かれる（17:4）。ほかの写本には、もっと低い数字を伝えるものがあると言われるが、この弾では、その出典を確認していない。",s:"聖書本文 サムエル記上17:4。写本の異同は未確認"},
  {k:"史実",x:"諸説",t:"テル・ダンで見つかった、前9世紀ごろのアラム語の碑文の断片に、「ダビデの家」と読める文字がある、とされる。ダビデ王朝の、聖書の外の、早い出典と見られている。ただし、読み方や意味には、異論もある。ダビデ個人の事跡を、この碑文が示すわけではない。",s:"The Jewish Museum「Tel Dan Stele」の解説（読んだ範囲）"},
  {k:"史実",x:"未確認",t:"戦いの場所は、「エラの谷」と書かれる（17:2）。いまの、どの場所にあたるかは、この弾では確認していない。",s:"聖書本文 サムエル記上17:2。場所の同定は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。ゴリアトの鎧と槍は、想像による。ヘブライ語本文の大きさを、そのまま描いたわけではない。",s:"制作メモ"}]},
{key:"temple",nw:"ソロモンの神殿",theme:"ソロモンの、神殿",ref:"列王記上5〜8章",per:"王国と預言者",era:"年代は諸説（出典未確認）",place:"エルサレム",mk:"temple",sc:"temple",lead:"esther",
 arr:["ダビデの子ソロモンは、王となり、主の神殿を建てることにした。（列王記上5:5）",
  "ナゴム「建築の材料の杉は、レバノンの、ティルスの王ヒラムから、取り寄せた。（5:6〜10）」",
  "イクミ「遠くから、運んだんだね。どれくらいかかったの？」",
  "イワオ「神殿は、七年かけて完成した、と書かれている。（6:38）　内部には、至聖所があって、契約の箱が納められた。（8:6）」",
  "（青銅の二本の柱が、入口に立てられた。名前は、ヤキンとボアズ。（7:21））　奉献のとき、ソロモンは、祈った。（8:22以下）"],
 q:"イクミ「ソロモンは、祈りのなかで、神殿のことを、どう言ったの？」",
 ch:[
  {l:"天も、神をお入れできない。この神殿は、なおさらだ、と言った。",sc:3,t:["イワオ「そう。『天も、天の天も、あなたをお入れできません。まして、わたしが建てたこの神殿は』という趣旨だ。（8:27）　神殿は、神を閉じ込める場所ではない、という言葉だね。」"]},
  {l:"この神殿が、神の唯一の住まいだ、と言った。",sc:2,t:["イワオ「ソロモンは、天も神をお入れできない、と言っているよ。（8:27）　神殿は、人が祈る場所だ、という考えなんだ。」"]},
  {l:"神殿が完成したので、もう祈る必要はない、と言った。",sc:1,t:["イワオ「逆だよ。奉献の祈りは、人々が、この場所に向かって祈るとき、聞いてください、という祈りだ。（8:30）」"]}],
 res:"神殿は、七年で完成し、契約の箱が納められた。（6:38、8:6）　ソロモンの祈りは、列王記上8章に記されている。のちに、この神殿は、バビロンによって壊された、と書かれている。（列王記下25章）",
 memo:[
  {k:"聖書の記述",t:"ソロモンは、ティルスの王ヒラムと取り決め、レバノンの杉を取り寄せた（列王記上5:6〜10）。神殿は七年で完成した（6:38）。至聖所に契約の箱が納められ（8:6）、入口には、青銅の二本の柱、ヤキンとボアズが立った（7:21）。",s:"聖書本文 列王記上5〜8章（要約）"},
  {k:"聖書の記述",t:"奉献の祈りで、ソロモンは、天も、神をお入れできない、まして、この神殿は、と述べた（8:27）。また、人々が、この場所に向かって祈るとき、聞いてほしい、と祈った（8:30）。",s:"聖書本文 列王記上8:27・30（要約）"},
  {k:"聖書の記述",x:"諸説",t:"列王記上6章1節は、神殿の着工を、「エジプトを出てから、四百八十年目」と書く。この数字を、そのまま年代の計算に使えるかどうか、研究者の見方が分かれる、と言われるが、この弾では、その出典を確認していない。",s:"聖書本文 列王記上6:1。年代の解釈の出典は未確認"},
  {k:"史実",x:"未確認",t:"第一神殿は、バビロンによって壊された、と聖書は書く（列王記下25章）。年は、前586年とされることが多い（前587年とする説もある、と言われる）が、この弾では、確認していない。ソロモンの神殿そのものの、考古学的な証拠については、確認できていない。",s:"聖書本文 列王記下25章。年代と考古学の出典は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。神殿の姿は、聖書の寸法の記述（6章）を、そのまま再現したものではない。",s:"制作メモ"}]},
{key:"jonah",nw:"ヨナと大魚",theme:"ヨナと、大きな魚",ref:"ヨナ書1〜4章",per:"王国と預言者",era:"年代は諸説（出典未確認）",place:"ヤッファの港（ヨッパ）",mk:"jonah",sc:"jonah",lead:"pierre",
 arr:["アミタイの子ヨナに、主の言葉が臨んだ。『大きな町ニネベに行き、呼びかけよ』。（1:1〜2）",
  "ナゴム「でも、ヨナは、反対の方向、タルシシュ行きの船に乗った。ヤッファの港から。（1:3）」",
  "ワラオ「うわあ、逃げたんだ…！」",
  "（海に大風が起こり、船は砕けそうになった。船員たちは、くじを引き、ヨナが当たった。ヨナは、自分を海に投げ込むよう言った。（1:4〜12））",
  "イワオ「そこに、主は、大きな魚を備えて、ヨナを呑み込ませた。ヨナは、魚の腹の中に、三日三晩いた。（1:17）」"],
 q:"ナゴム「ヨナ書は、最後に、どう終わると思う？」",
 ch:[
  {l:"ニネベを惜しむ神の問いかけで終わる。ヨナの答えは、書かれていない。",sc:3,t:["イワオ「そう。ヨナは、ニネベが滅ぼされないことに、怒った。神は、とうごまの木のことを、持ち出して、問いかける。（4:6〜11）　そこで、書は終わるんだ。ヨナの返事は、書いていない。」"]},
  {l:"ヨナがニネベに謝って、終わる。",sc:2,t:["イワオ「ヨナは、ニネベの人々が悔い改めたことで、むしろ、怒った。（4:1）　最後は、神の問いかけで終わるよ。（4:11）」"]},
  {l:"ニネベが滅ぼされて、終わる。",sc:1,t:["イワオ「ニネベの人々は、悔い改め、神は思い直した、と書かれている。（3:10）」"]}],
 res:"ヨナは、魚の腹の中から祈り、陸に吐き出された。（2章）　ニネベの人々は、悔い改め、神は、思い直した。（3:5〜10）　書は、神の問いかけで終わる。（4:11）",
 memo:[
  {k:"聖書の記述",t:"ヨナは、主の言葉に背き、ヤッファからタルシシュへの船に乗った（ヨナ書1:3）。嵐のなか、自分を海に投げるよう言い、大きな魚に呑み込まれ、三日三晩その腹の中にいた（1:12、1:17）。魚の腹から祈り、陸に吐き出された（2章）。",s:"聖書本文 ヨナ書1〜2章（要約）"},
  {k:"聖書の記述",t:"ヨナがニネベで告げると、人々は悔い改め、神は思い直した（3章）。ヨナは怒り、神は、とうごまの木のことで、ヨナに問いかけた。書は、その問いで終わる（4:6〜11）。",s:"聖書本文 ヨナ書3〜4章（要約）"},
  {k:"聖書の記述",x:"未確認",t:"ヘブライ語は、「大きな魚」と書く（1:17）。「鯨」と書かれるのは、翻訳や、のちの引用による場合があるが、この弾では、その出典を確認していない。",s:"聖書本文 ヨナ書1:17。翻訳の異同は未確認"},
  {k:"史実",x:"諸説",t:"ヨナ書が、歴史的な出来事の記録か、教訓的な物語かについては、見方が分かれる、と言われるが、この弾では、その出典を確認していない。ニネベは、実在した古代の都市で、現在のイラクにある、とされる。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。魚の大きさと種類は、想像による。ヨナと、船は、小さく描いた。",s:"制作メモ"}]},
{key:"daniel",nw:"ダニエルとバビロン捕囚",theme:"バビロン捕囚と、ダニエル",ref:"列王記下24〜25章／ダニエル書1・6章",per:"捕囚",era:"年代は諸説（出典未確認）",place:"バビロン",mk:"daniel",sc:"daniel",lead:"miguel",
 arr:["エルサレムは、バビロンに攻められた。神殿は焼かれ、多くの人々が、バビロンに連れていかれた。（列王記下24〜25章）",

  "（ダニエルは、王の食べ物で身を汚すまいと決め、野菜と水を願った。（ダニエル書1:8〜12））",

 q:"ツチオ「ダニエルが、獅子の穴に入れられたのは、なぜ？」",
 ch:[
  {l:"王のほかに祈る者は穴に、という禁令が出たが、ダニエルは祈りをやめなかったから。",sc:3,t:["ナゴム「そう。三十日のあいだ、王以外に願う者は獅子の穴に、という禁令だった。（6:8〜10）　ダニエルは、これまでどおり、日に三度、祈った。」"]},
  {l:"王の夢を、解き明かせなかったから。",sc:2,t:["ナゴム「王の夢を解いたのは、むしろ、ダニエルだよ。（2章）　穴に入れられたのは、禁令のあとも祈りをやめなかったからだ。（6:11〜17）」"]},
  {l:"バビロンの神々の像を壊したから。",sc:1,t:["ナゴム「像を壊した、とは書かれていない。禁令のあとも、日に三度、祈り続けたことが、告発された理由だよ。（6:11〜13）」"]}],
 res:"ダニエルは、獅子の穴に入れられたが、神が御使いを送って、獅子の口を閉ざした、と書かれている。（6:23）　のち、ペルシアのキュロスは、バビロンを倒したあと、捕囚の民の帰還を許した、と聖書は書く。（エズラ記1:1〜4）",
 memo:[
  {k:"聖書の記述",t:"エルサレムはバビロンに攻められ、神殿は焼かれ、多くの人が連れ去られた（列王記下24〜25章）。ダニエルは、王の食べ物で身を汚すまいと決め、野菜と水を願った（ダニエル書1:8〜12）。禁令のあとも日に三度祈り（6:11）、獅子の穴に入れられたが、無事だった（6:17〜23）。",s:"聖書本文 列王記下24〜25章、ダニエル書1・6章（要約）"},
  {k:"史実",x:"諸説",t:"バビロンは、前539年に、ペルシアのキュロスに倒された。「キュロスの円筒」は、キュロスが、バビロンの人々と、各地から連れてこられた神々の像や人々を、元の地に戻した、と伝える。ただし、この文書に、ユダヤ人の名は出てこない。エズラ記1章1〜4節の、キュロスの勅令との関係は、見方が分かれる。",s:"Metropolitan Museum of Art「Cyrus Cylinder」の解説（読んだ範囲）。聖書との関係の出典は未確認"},
  {k:"史実",x:"未確認",t:"バビロン捕囚の年（前597年、前586年など）は、この弾では確認していない。",s:"（未確認）"},
  {k:"史実",x:"諸説",t:"ダニエル書の成立の時期は、前6世紀とする見方と、前2世紀とする見方がある、と言われる。ダニエル書6章の「メディア人ダレイオス」が、誰にあたるかも、議論がある、と言われる。この弾では、いずれも出典を確認していない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。バビロンの城門は、のちの時代の発掘で知られる門を参考にした想像で、細部は異なる。獅子の穴の形も、想像による。",s:"制作メモ"}]}

{key:"birth",nw:"受胎告知と降誕",theme:"受胎告知と、降誕",ref:"ルカ1〜2章／マタイ1〜2章",per:"イエスの生涯",era:"紀元前後（年代は諸説）",place:"ベツレヘム",mk:"birth",sc:"birth",lead:"esther",
 arr:["ガリラヤのナザレに、マリアという娘がいた。御使いガブリエルが、その子の誕生を告げた。マリアは、仕える者です、と答えた。（ルカ1:26〜38）",
  "ナゴム「そのころ、皇帝の命令で、住民登録が行われた。ヨセフは、身重のマリアとベツレヘムへ行った。（ルカ2:1〜5）」",
  "ナゴム「子が生まれ、布にくるまれて、飼い葉おけに寝かされた。宿には、場所がなかったから、と書かれている。（2:6〜7）」",

  {l:"聖書に、12月25日と書かれている。",sc:2,t:["ナゴム「聖書に、日付は出てこないんだ。12月25日は、のちの教会の伝統で、東方教会では1月6日に祝う伝統もあるよ。」"]},

 memo:[
  {k:"聖書の記述",t:"ルカは、ナザレのマリアへの告知（1:26〜38）、皇帝の命令による住民登録、ベツレヘムでの誕生、飼い葉おけ、羊飼いへの知らせを書く（2章）。マタイは、ヨセフへの告知（1:18〜25）、東から来た博士たちと星、贈り物、エジプトへの避難を書く（2章）。",s:"聖書本文 ルカ1〜2章、マタイ1〜2章（要約）"},
  {k:"史実",x:"諸説",t:"ルカ2章2節の住民登録は、キリニウスがシリア総督のときと書かれる。ヨセフスは、キリニウスの登録を紀元6／7年と書き、総督は6〜12年とする。一方、ヘロデ大王は前4年に死去したとされる。この食い違いの解き方には、複数の案があり、一致していない。",s:"Ian Paul「Was Luke in error about the date of Jesus’ birth?」Psephizo（読んだ範囲。著者は、聖書の記述を擁護する立場）"},
  {k:"伝承",x:"諸説",t:"12月25日の祝いは、ローマのヒッポリュトスが、ダニエル書注解（200年ごろ）で、誕生の日として書いたとされる。354年の記録（『Chronography of 354』）にも、この日の祝いが見える。ローマの祭との関係など、起源の説は複数あり、東方では1月6日に祝われた。",s:"Catholic Answers「Why December 25?」（カトリックの立場の記事。読んだ範囲）。大学・研究機関の資料は未取得"},
  {k:"想像",t:"場面の絵は想像の絵。幼子、マリア、ヨセフの姿も想像で、実際の姿は伝えられていない。御使いは、翼のない光で表した。小屋の形は想像による。",s:"制作メモ"}]},
{key:"jordan",nw:"ヨルダンの洗礼",theme:"ヨルダンの洗礼",ref:"マタイ3章／マルコ1章／ルカ3章",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"ヨルダン川（洗礼の場所は諸説？）",mk:"jordan",sc:"jordan",lead:"pierre",
 arr:["ユダヤの荒野に、洗礼者ヨハネが現れた。悔い改めの洗礼を告げ、らくだの毛の衣を着て、いなごと野蜜を食べていた。（マタイ3:1〜4）",
  "イワオ「ガリラヤから、イエスがやって来て、ヨルダン川で、洗礼を受けた。（3:13〜16）」",

  {l:"天が開け、神の霊が鳩のように降り、声が聞こえた。",sc:3,t:["イワオ「そのとおり。天が開け、神の霊が鳩のように降り、天から声が聞こえた、と書かれている。（マタイ3:16〜17）　声が何と言ったかは、福音書ごとに、書き方が少しずつ違う。」"]},
  {l:"川の水が、二つに分かれた。",sc:2,t:["イワオ「川が分かれる話は、ヨシュア記3章や、列王記下2章にあるけれど、イエスの洗礼の場面では、書かれていない。洗礼のとき、天が開け、霊が鳩のように降りた、と書かれている。（マタイ3:16）」"]},
  {l:"天から、大きな火が降った。",sc:1,t:["イワオ「火が降った、とは書かれていないよ。霊が、鳩のように降った、と書かれている。（マタイ3:16）」"]}],
 res:"このあと、イエスは、霊に導かれて荒野へ行く。（マタイ4:1。次の章へ）",
 memo:[
  {k:"聖書の記述",t:"ヨハネは、ユダヤの荒野で、悔い改めの洗礼を告げた（マタイ3:1〜2、マルコ1:4）。イエスはヨルダン川で洗礼を受け、天が開け、霊が鳩のように降り、声が聞こえた（マタイ3:16〜17）。",s:"聖書本文 マタイ3章、マルコ1章（要約）"},
  {k:"史実",t:"ヨセフスは、『ユダヤ古代誌』18巻116〜119節で、ヨハネを、徳と正義と敬虔を勧めた善い人物と書く。ヘロデ・アンティパスが、人々が彼に従う勢いを恐れ、マケルスで殺した、とする。洗礼は、罪の赦しでなく、からだの清めと書く点は、福音書（マルコ1:4）の書き方と異なる。福音書（マルコ6章）は、処刑の理由を、ヘロデの結婚への批判とする。",s:"Livius.org「Josephus on John the Baptist」（ヨセフスの該当箇所の翻訳。読んだ範囲）"},
  {k:"史実",x:"未確認",t:"洗礼の場所は、ヨハネ福音書1章28節に「ヨルダンの向こうのベタニア」とあるが、いまのどの場所にあたるかは、この弾では確認していない。",s:"聖書本文 ヨハネ1:28。場所の同定は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。イエスとヨハネの姿は想像で、実際の姿は伝えられていない。鳩は、「鳩のように」という記述による。",s:"制作メモ"}]},
{key:"mount",nw:"山上の説教",theme:"山の上の、教え",ref:"マタイ5〜7章／ルカ6章",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"ガリラヤ湖のほとり？（山の場所は未確認）",mk:"mount",sc:"mount",lead:"john",

  {l:"ルカも、同じ山の上、と書く。",sc:2,t:["ナゴム「ルカは、イエスが山から下りて、平らな所に立った、と書いている。（6:17）　マタイとは、場面の書き方が違うんだ。」"]},

 memo:[
  {k:"聖書の記述",t:"マタイ5〜7章は、八福（5:3〜12）、地の塩・世の光（5:13〜16）、敵を愛すること（5:44）、主の祈り（6:9〜13）、思い悩むな（6:25〜34）、黄金律（7:12）、岩と砂の上の家（7:24〜27）などを、一つながりの教えとして書く。",s:"聖書本文 マタイ5〜7章（要約）"},
  {k:"聖書の記述",t:"ルカ6章は、似た内容の教えを、イエスが山から下りて「平らな所」に立って語った、と書く（6:17〜49）。主の祈りは、ルカ11章2〜4節にも、短い形で出てくる。",s:"聖書本文 ルカ6:17〜49、11:2〜4（要約）"},
  {k:"史実",x:"諸説",t:"山上の説教と平地の説教が、同じ一つの説教なのか、別々の機会なのかは、見方が分かれると言われるが、この弾では、その出典を確認していない。山の場所も、特定されていない。",s:"（未確認）聖書本文 マタイ5:1、ルカ6:17"},
  {k:"伝承",x:"諸説",t:"主の祈りの結びの「国と力と栄光は、永遠にあなたのものです」は、マタイの古い写本にはなく、教会によって、唱え方が分かれると言われる。この弾では、その出典を確認していない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。イエスの姿は想像で、実際の姿は伝えられていない。聞く人びとは、小さく描いた。",s:"制作メモ"}]},

  {l:"祭司。",sc:2,t:["ナゴム「祭司は、道の向こう側を通っていったんだ。（10:31）　助けたのは、旅をしていた、サマリア人だよ。」"]},

 memo:[

  {k:"聖書の記述",t:"ルカ15章には、「放蕩息子」のたとえ（15:11〜32）がある。マルコ2章には、カファルナウムで、屋根をはがして、寝床に寝たままの中風の人をつり降ろした話が書かれている（2:1〜12）。",s:"聖書本文 ルカ15章、マルコ2:1〜12（要約）"},
  {k:"聖書の記述",x:"諸説",t:"福音書の癒しの記述を、歴史上の出来事として、どう受けとめるかは、信仰の立場や、歴史研究の立場で、分かれる。このゲームは、どれか一つの見方を、正解とはしない。",s:"（未確認）"},

  {k:"聖書の記述",t:"イエスは、弟子たちと食事の席につき、パンを裂き、杯を取って、弟子たちに与えた（マルコ14:22〜24、マタイ26:26〜28、ルカ22:19〜20）。使徒パウロも、自分が受け継いだこととして、同じ内容を書いている（コリント一11:23〜26）。",s:"聖書本文 マルコ14章、マタイ26章、ルカ22章、コリント一11章（要約）"},
  {k:"聖書の記述",t:"ヨハネ13章は、食事の席で、イエスが上着を脱ぎ、弟子たちの足を洗ったと書く（13:4〜5）。ヨハネ福音書は、この箇所で、パンと杯の場面を書いていない。",s:"聖書本文 ヨハネ13章（要約）"},
  {k:"史実",x:"諸説",t:"この食事が、過越の食事だったかどうかは、福音書の書き方に違いがあり、見方が分かれる。マルコは、過越の食事として書く（14:12〜16）。ヨハネは、過越の祭の前の食事のように書く（13:1、18:28）。",s:"聖書本文 マルコ14:12〜16、ヨハネ13:1、18:28。両論の研究者の出典は未確認"},

{key:"passion",nw:"受難",theme:"受難",ref:"マルコ14〜15章／ヨハネ18〜19章",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"ゴルゴタ（エルサレム）？",mk:"golgotha",sc:"golgotha",lead:"cross",
 arr:["食事のあと、イエスは、ゲツセマネで祈り、そこで捕らえられた。弟子たちは、みな逃げた。（マルコ14:32〜50）",

  "イワオ「居合わせた人に、『あなたも仲間だ』と言われて、ペトロは、否定した。（14:66〜71）　そのとき、鶏が鳴いた。」",
  "（イエスは、ローマ総督ピラトのもとで裁かれ、十字架につけられた。（マルコ15章）　この絵は、遠くから、十字架の影だけを描いている。）"],

  {l:"三度。",sc:3,t:["ナゴム「そう、三度。イエスが、前もって、『鶏が二度鳴く前に、三度、わたしを知らないと言う』と告げていた。（マルコ14:30）　ペトロは、気づいて、泣いた。（14:72）」"]},
  {l:"一度だけ。",sc:2,t:["ナゴム「マルコは、三度、と書いている。（14:68、70、71〜72）　ペトロは、そのあと、泣いた。」"]},
  {l:"一度も、否定しなかった。",sc:1,t:["ナゴム「ペトロは、三度、否定した、と書かれている。（14:66〜72）　そのあと、泣いた。」"]}],
 res:"イエスは、十字架で死に、墓に納められた。（マルコ15:37、46）　ペトロの話は、復活のあとの、ヨハネ21章で、もう一度出てくる。",
 memo:[
  {k:"聖書の記述",t:"イエスは、ゲツセマネで捕らえられ（マルコ14:43〜50）、ローマ総督ピラトのもとで裁かれ、十字架につけられ（15章）、墓に納められた（15:42〜47）。ペトロは、大祭司の庭で、三度、イエスを知らないと言い、鶏が鳴いて泣いた（14:66〜72）。",s:"聖書本文 マルコ14〜15章（要約）"},
  {k:"史実",t:"ローマの歴史家タキトゥスは、『年代記』15巻44節で、キリストが、ティベリウス帝の治世に、総督ポンティウス・ピラトゥスによって、極刑を受けた、と書く。ピラトの名は、カイサリアの劇場で見つかった碑文（1961年発見）にもあり、ここでの肩書は「ユダヤの長官（プラエフェクトゥス）」。タキトゥスは、「総督（プロクラトル）」と書く。",s:"Tacitus, Annals 15.44（Alfred John Church訳、earlychurchtexts.com）／BAS Library「Pontius Pilate: Recalled and Recycled」。イスラエル博物館の所蔵ページは、題名のみ確認"},
  {k:"史実",x:"未確認",t:"十字架の年は、紀元30年とする説と、33年とする説などがあると言われるが、この弾では、その出典を確認していない。ゴルゴタの場所は、伝承と、聖墳墓教会の位置が、よく知られるが、これも、出典は未確認。",s:"（未確認）"},
  {k:"史実",x:"諸説",t:"福音書の受難の物語は、のちの時代に、ユダヤ人への迫害に使われた歴史がある。カトリック教会は、第二バチカン公会議の『ノストラ・アエターテ』（1965年）で、「受難のときに起こったことは、当時のすべてのユダヤ人にも、今日のユダヤ人にも、帰すことはできない」と述べ、ユダヤ人は、神に捨てられた者として示されるべきではない、と述べた。他の教派の公式見解は、この弾では未取得。",s:"Nostra Aetate 第4項（教皇庁・christianunity.vaの掲載文。読んだ範囲）"},
  {k:"想像",t:"場面の絵は想像の絵。十字架は、遠景の影だけで描き、イエスの姿は描かない。鶏は、ペトロの否認の場面を示す想像。",s:"制作メモ"}]},
{key:"easter",nw:"復活",theme:"復活",ref:"マルコ16章／ルカ24章／コリント一15章",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"空の墓（エルサレム）？",mk:"tomb",sc:"tomb",lead:"miguel",

  "ナゴム「墓の中で、女たちは、白い衣を着た若者を見た。『あの方は、復活なさった。ここにはおられない』と告げられた、と書かれている。（16:5〜6）」",
  "ナゴム「福音書によって、書き方が違う。誰が墓に行ったか。御使いは何人か。弟子たちに、どこで現れたか（ガリラヤか、エルサレムか）。」",
  "（絵では、墓のそばに、復活したイエスが立っている。聖書は、墓の外で、イエスがマリアに現れた、と書いている。（ヨハネ20:14〜16））",
  "ツチオ「福音書のほかにも、復活のことを書いた文書は、あるの？」",

  {l:"福音書記者マルコ。",sc:2,t:["ナゴム「コリント一の手紙を書いたのは、パウロだよ。（15:3）　マルコは、福音書の著者だね。」"]},
  {l:"皇帝ティベリウス。",sc:1,t:["ナゴム「皇帝は、書いていないよ。コリント一15章は、パウロの手紙だ。（15:3）」"]}],

 memo:[
  {k:"聖書の記述",t:"安息日のあと、女たちが墓に行くと、石は転がされており、御使いが、復活を告げた（マルコ16:1〜8、マタイ28:1〜8、ルカ24:1〜12、ヨハネ20:1〜10）。復活のイエスは、弟子たちに現れた（ルカ24章、ヨハネ20〜21章、マタイ28:16〜20）。",s:"聖書本文 マルコ16章、マタイ28章、ルカ24章、ヨハネ20〜21章（要約）"},
  {k:"聖書の記述",t:"パウロは、コリント一15章3〜8節で、自分が受け継いだこととして、キリストの死、葬り、三日目の復活、そしてペトロ、十二人、五百人以上、ヤコブ、すべての使徒、最後に自分、への現れを書く。この箇所に、女たちの名は出てこない。",s:"聖書本文 コリント一15:3〜8（要約）"},
  {k:"聖書の記述",x:"諸説",t:"福音書は、墓に行った人の数、御使いの数や姿、弟子たちへの現れの場所（ガリラヤかエルサレムか）を、それぞれ違う形で書く。マルコ福音書は、古い写本では16章8節で終わる、とされ、そのあとの部分は、のちに足された、と言われる。この弾では、その出典を確認していない。",s:"聖書本文 マルコ16章ほか。写本の事情は未確認"},
  {k:"史実",x:"諸説",t:"復活は、キリスト教の信仰の中心とされる。歴史研究が、その出来事を、検証できるかどうかについては、立場によって見方が分かれる。このゲームは、どれか一つの見方を、正解とはしない。",s:"（未確認）"},
  {k:"伝承",x:"諸説",t:"復活祭の日は、教会によって異なる年がある。西方の教会と、正教会では、日の決め方（暦）が違う、と言われるが、この弾では、その出典を確認していない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。墓の形は想像による。イエスの姿は想像で、実際の姿は伝えられていない。御使いは、翼のない光で表した。",s:"制作メモ"}]}
);

{key:"magi",nw:"東方の博士たち",theme:"東方の博士たちと、星",ref:"マタイ2章1〜12節",per:"イエスの生涯",era:"紀元前後（年代は諸説）",place:"エルサレム〜ベツレヘム",mk:"magi",sc:"magi",lead:"miguel",
 arr:["イエスがユダヤのベツレヘムで、ヘロデ王の時代に生まれたとき、東の方から博士たちがエルサレムに来た。ユダヤ人の王として生まれた方の星を見たので、拝みに来た、と彼らは尋ねた。（マタイ2:1〜2）",
  "ナゴム「ヘロデ王は不安になり、祭司長や律法学者たちに、メシアの生まれる場所を尋ねた。ベツレヘムだ、と預言者の言葉が引かれた。（2:3〜6）」",
  "ナゴム「星は、博士たちの先に立って進み、幼子のいる所の上に止まった。博士たちは、家に入り、母マリアと幼子を見て、ひれ伏して拝んだ。そして、黄金、乳香、没薬を贈った。（2:9〜11）」",
  "ナゴム「そのあと、夢で、ヘロデのところへ戻るなと告げられ、別の道で自分たちの国に帰った。（2:12）」",
  "ツチオ「『三人の賢者』とか『三人の王』って、よく聞くよね。」"],
 q:"ツチオ「マタイ福音書は、博士たちを、何人と書いているのかな？」",

  {l:"人数は書かれていない。書かれているのは、三つの贈り物。",sc:3,t:["ナゴム「そう。マタイが書くのは、黄金・乳香・没薬の、三つの贈り物。人数は書かれていないし、『王』とも書かれていない。三人の王という姿は、のちの伝承で広まったんだ。」"]},
  {l:"三人の王、と書かれている。",sc:2,t:["ナゴム「マタイは、人数も、『王』とも、書いていないんだ。三つの贈り物から、のちに、三人と考えられるようになった。」"]},
  {l:"十二人、と書かれている。",sc:1,t:["ナゴム「十二人とは、書かれていない。人数は、書かれていないんだ。書かれているのは、三つの贈り物だよ。（2:11）」"]}],
 res:"博士たちは、別の道で国へ帰った。（2:12）　博士たちが幼子を拝んだことを祝う日は、教会で、「公現（エピファニー）」の祝日として、1月6日などに祝われてきた。",
 memo:[
  {k:"聖書の記述",t:"東から来た博士たちは、星を見て、ユダヤ人の王を拝みに来た。ヘロデ王は、ベツレヘムの名を聞いた。星は、幼子のいる所の上に止まり、博士たちは、黄金、乳香、没薬を贈り、夢のお告げで、別の道で帰った（マタイ2:1〜12）。この話は、マタイ福音書にだけ書かれている。",s:"聖書本文 マタイ2:1〜12（要約）。他の福音書にないことは、この弾では、研究者の出典を未確認"},
  {k:"伝承",x:"諸説",t:"マタイは、博士たちの数を書かず、「王」とも書かない。三人とされるのは、三つの贈り物にならったもので、4世紀から、三人で描かれた、と言われる。王とされたのは、詩編72編10節の解釈にもとづき、6世紀から広まった、と言われる。名前（カスパル、メルキオール、バルタザール）の由来は、資料で書き方が違う。ある博物館は、3世紀のオリゲネスの名を挙げ、別の資料は、名前は、一貫して割り当てられなかったと書く。",s:"Fitzwilliam Museum「The Magi」／National Gallery of Art「Biblical Magi」（ともに読んだ範囲。両資料の食い違いは、そのまま記載）"},
  {k:"伝承",t:"博士たちは、ペルシアの、ゾロアスター教の祭司の集団に属していたのではないか、と考えられている。遺物とされるものは、ミラノ近くで見つかったとされ、いまは、12世紀の聖遺物箱に納められて、ケルン大聖堂にある、とされる。公現祭は、1月6日に、早い時代から祝われてきた。",s:"Fitzwilliam Museum「The Magi」（読んだ範囲）。ケルンの聖遺物の真偽は、この弾では未検証"},
  {k:"史実",x:"未確認",t:"「ベツレヘムの星」の正体（惑星の接近、新星、彗星など）については、いくつかの説があると言われるが、この弾では、その出典を確認していない。博士たちの訪問の年も、特定されていない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。博士たちの数は、伝承にしたがって三人とし、衣の色や姿は想像。ラクダは、聖書に書かれていないので描かなかった。マリアと幼子、小屋の形は想像による。",s:"制作メモ"}]},
{key:"peter",nw:"ペトロの召命と大漁",theme:"漁師たちの召命と、大漁",ref:"マルコ1章16〜20節／ルカ5章1〜11節",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"ガリラヤ湖のほとり（ゲネサレトの湖）",mk:"peter",sc:"peter",lead:"cross",
 arr:["イエスは、ガリラヤ湖のほとりを歩き、シモンと、その兄弟アンデレが、湖で網を打っているのを見た。二人は漁師だった。（マルコ1:16）",
  "ナゴム「イエスは、『わたしについて来なさい。人間をとる漁師にしよう』と声をかけた。二人は、すぐに網を捨てて従った、と書かれている。（1:17〜18）」",
  "ナゴム「ルカ福音書は、別の形で書く。夜通し漁をして、何も取れなかったシモンに、イエスが、沖で網を降ろすよう言った。そのとおりにすると、網が破れそうなほどの魚が入った。（ルカ5:4〜7）」",
  "イワオ「…ここで、ぼくの名前の話をさせて。『イワオ』は『岩』。シモンは、のちに、『ケファ』と呼ばれた。『岩』という意味で、ギリシア語では『ペトロ』。（ヨハネ1:42）」",
  "イクミ「えっ、イワオの名前、ペトロからなんだ！」"],
 q:"イワオ「ところで、イエスは、シモンたちを、何にすると言ったかな？」",
 ch:[
  {l:"人間をとる漁師にする、と言った。",sc:3,t:["ナゴム「そう。『人間をとる漁師にしよう』。（マルコ1:17）　ルカ福音書では、シモンは、ひれ伏して、自分は罪深い者です、と言い、イエスは、恐れることはない、人間をとる漁師になる、と告げる。（5:8〜10）」"]},
  {l:"湖の王にする、と言った。",sc:2,t:["ナゴム「『王』とは言っていないよ。『人間をとる漁師にしよう』と言った、と書かれている。（マルコ1:17）」"]},
  {l:"魚の守り人にする、と言った。",sc:1,t:["ナゴム「そうは書かれていない。『人間をとる漁師にしよう』が、書かれている言葉だよ。（マルコ1:17）」"]}],
 res:"シモンと、アンデレ、そしてゼベダイの子ヤコブとヨハネは、舟も網も残して、イエスに従った。（ルカ5:10〜11）　シモンは、のちに、十二人の弟子たちの筆頭として、名が挙げられる。（マタイ10:2）",
 memo:[
  {k:"聖書の記述",t:"イエスは、ガリラヤ湖のほとりで、漁師のシモンとアンデレに、「人間をとる漁師にしよう」と呼びかけ、二人は従った（マルコ1:16〜18）。次に、ゼベダイの子ヤコブとヨハネも呼ばれた（1:19〜20）。ルカ5章は、夜通し何も取れなかったシモンが、イエスの言葉で網を降ろすと、網が破れそうなほどの魚が入った、と書く（5:4〜7）。",s:"聖書本文 マルコ1:16〜20、ルカ5:1〜11（要約）"},
  {k:"聖書の記述",t:"シモンは、イエスから「ケファ」と呼ばれた、とヨハネ1章42節が書く。「ケファ」は、岩という意味で、ギリシア語の「ペトロ」にあたる。マタイ16章18節も、この名にふれる。",s:"聖書本文 ヨハネ1:42、マルコ3:16、マタイ16:18（要約）"},
  {k:"聖書の記述",t:"ガリラヤ湖は、福音書で、複数の名で呼ばれる。ルカは「ゲネサレトの湖」（5:1）、ヨハネは「ガリラヤ湖（ティベリアの海）」（6:1）と書く。",s:"聖書本文 ルカ5:1、ヨハネ6:1（要約）"},
  {k:"史実",x:"諸説",t:"1986年、ガリラヤ湖の水位が下がったとき、ギノサルとマグダラのあいだの岸の泥の中から、古い舟が見つかった。長さ約9メートル、幅約2.5メートル、高さ約1.25メートル。炭素14年代測定と、舟の中の遺物から、1世紀のものとされる。イエスの時代のものか、ユダヤ戦争（66〜70年）のころかは、はっきりしておらず、イエスと弟子たちが使った舟だと確かめられたわけではない。",s:"BibleWalks「Jesus Boat」（読んだ範囲。サイト内に、木材の種類数の記述の食い違いがある）"},
  {k:"想像",t:"場面の絵は想像の絵。イエスとシモンの姿も想像で、実際の姿は伝えられていない。舟と網の形は想像で、上の舟の遺物の形を、そのまま描いたものではない。",s:"制作メモ"}]},
{key:"walk",nw:"湖の上を歩く",theme:"湖の上を歩くイエス",ref:"マタイ14章22〜33節／マルコ6章／ヨハネ6章",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"ガリラヤ湖（ティベリアの海）",mk:"walk",sc:"walk",lead:"john",
 arr:["パンと魚で、大勢の人に食べ物を分けたあと、イエスは、弟子たちを舟で先に向こう岸へ行かせ、ひとり山に登って祈った。（マタイ14:13〜23）",
  "ナゴム「夜明けに近いころ、舟は、逆風で、岸から遠くなっていた。そこへ、イエスが、湖の上を歩いて、近づいた。（14:24〜25）」",
  "ナゴム「弟子たちは、幽霊だと思って、叫んだ。イエスは、『安心しなさい。わたしだ。恐れることはない』と声をかけた。（14:26〜27）」",
  "イワオ「ペトロは、『わたしも、水の上を歩いて、そちらに行かせてください』と願った。イエスが『来なさい』と答えると、ペトロは、舟から降りて、水の上を歩き出した。（14:28〜29）」",
  "ワラオ「ええっ…！　それで…？」"],
 q:"ワラオ「ペトロは、途中で、どうなったの？」",
 ch:[
  {l:"風を見て怖くなり、沈みかけて叫ぶと、イエスが手を伸ばして支えた。",sc:3,t:["イワオ「そう。『主よ、助けてください』と叫ぶと、イエスは、すぐに手を伸ばして、つかまえた。（14:30〜31）　二人が舟に乗ると、風がやんだ。」"]},
  {l:"向こう岸まで、そのまま歩ききった。",sc:2,t:["イワオ「途中で、風を見て怖くなって、沈みかけたんだ。（14:30）　イエスの手に支えられた、と書かれている。」"]},
  {l:"大きな魚に、背中に乗せてもらった。",sc:1,t:["イワオ「魚の話ではないよ。風を見て怖くなり、沈みかけたペトロを、イエスが手を伸ばして支えた、と書かれている。（14:30〜31）」"]}],
 res:"舟にいた人たちは、イエスを拝み、「まことに神の子です」と言った、と書かれている。（14:33）",
 memo:[
  {k:"聖書の記述",t:"イエスが湖の上を歩く話は、マタイ14章22〜33節、マルコ6章45〜52節、ヨハネ6章16〜21節にある。ペトロが水の上を歩く部分は、マタイにだけ書かれている（14:28〜31）。",s:"聖書本文 マタイ14章、マルコ6章、ヨハネ6章（要約）"},
  {k:"聖書の記述",t:"ペトロは、風を見て怖くなり、沈みかけて「主よ、助けてください」と叫び、イエスは手を伸ばして、彼をつかんだ（マタイ14:30〜31）。舟の人たちは、イエスを「神の子」と告白した（14:33）。",s:"聖書本文 マタイ14:30〜33（要約）"},
  {k:"聖書の記述",x:"諸説",t:"福音書の奇跡の記述を、歴史上の出来事として、どう受けとめるかは、信仰の立場や、歴史研究の立場で、分かれる。このゲームは、どれか一つの見方を、正解とはしない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。イエスとペトロの姿も想像で、実際の姿は伝えられていない。舟、波、月の形は想像による。",s:"制作メモ"}]},
{key:"lazarus",nw:"ラザロの復活",theme:"ラザロの復活",ref:"ヨハネ11章",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"ベタニア（エルサレム近郊）",mk:"lazarus",sc:"lazarus",lead:"esther",
 arr:["ベタニアに、マルタとマリアの姉妹と、その兄弟ラザロが住んでいた。ラザロが病気になり、姉妹は、イエスに使いを送った。（ヨハネ11:1〜3）",
  "ナゴム「イエスは、なお二日、同じ所にとどまってから、ベタニアへ向かった。着いたとき、ラザロは、墓に葬られて、すでに四日たっていた。（11:6、17）」",
  "イクミ「マルタは、迎えに出て、『あなたがここにいてくださったら、兄弟は死ななかったでしょう』と言った。（11:21）　マリアも、同じ言葉を言った。（11:32）」",
  "ナゴム「マリアが泣き、一緒に来た人たちも泣いていた。その人びとを見て、イエスは、心を動かされた。（11:33）」",
  "イクミ「そのとき、イエスは、どうしたのかな…。」"],
 q:"イクミ「イエスは、泣いている人びとを前に、どうしたと書かれている？」",
 ch:[
  {l:"涙を流した、と書かれている。",sc:3,t:["ナゴム「そう。ヨハネ11章35節は、『イエスは涙を流された』と伝える。そのあと、墓の前で、『ラザロ、出て来なさい』と大声で呼ぶと、死んでいた人が、布で巻かれたまま出てきた、と書かれている。（11:43〜44）」"]},
  {l:"人びとを叱って、泣くのをやめさせた。",sc:2,t:["ナゴム「叱ったとは書かれていない。イエスは、涙を流した、と書かれているんだ。（11:35）」"]},
  {l:"何も言わず、ひとりで立ち去った。",sc:1,t:["ナゴム「立ち去ったのではないよ。涙を流し、墓に向かった、と書かれている。（11:35、38）」"]}],
 res:"イエスは、「その人をほどいてやり、行かせなさい」と言った。（11:44）　多くの人びとが、イエスを信じた。一方で、この出来事のあと、イエスを殺す計画が進んだ、とヨハネは書く。（11:45〜53）",
 memo:[
  {k:"聖書の記述",t:"ラザロは、ベタニアに住み、病気で死んで、洞穴の墓に葬られた。四日目に、イエスが来て、墓の石を取りのけさせ、「ラザロ、出て来なさい」と呼ぶと、ラザロは、布で巻かれたまま出てきた（ヨハネ11:17、38〜44）。",s:"聖書本文 ヨハネ11章（要約）"},
  {k:"聖書の記述",t:"イエスは、マリアや人びとが泣くのを見て、心を動かされ、涙を流した（ヨハネ11:33〜35）。ベタニアは、エルサレムから「十五スタディオン」ほどの所と書かれている（11:18）。",s:"聖書本文 ヨハネ11:18、33〜35（要約）"},
  {k:"聖書の記述",x:"未確認",t:"ラザロの復活の話は、ヨハネ福音書にだけ書かれている。マタイ、マルコ、ルカに出てこない理由についての、研究者の説明は、この弾では、出典を確認していない。ラザロの墓とされる場所（現在のアル・エイザリヤ付近）の伝承も、出典は未確認。",s:"聖書本文 ヨハネ11章。伝承地の出典は未確認"},
  {k:"聖書の記述",x:"諸説",t:"福音書の奇跡の記述を、歴史上の出来事として、どう受けとめるかは、信仰の立場や、歴史研究の立場で、分かれる。このゲームは、どれか一つの見方を、正解とはしない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。イエス、ラザロ、姉妹たちの姿も想像で、実際の姿は伝えられていない。墓の形は想像による。",s:"制作メモ"}]}
);

{key:"bush",nw:"燃える柴",theme:"燃える柴と、モーセの召命",ref:"出エジプト記3章",per:"出エジプトと荒野",era:"年代は諸説（出典未確認）",place:"ミディアンの荒野（ホレブ山？）",mk:"bush",sc:"bush",lead:"pierre",
 arr:["モーセは、ミディアンの祭司エトロの羊を飼っていた。羊を荒野の奥に導いて、神の山ホレブに来た。（出エジプト記3:1）",
  "ナゴム「そこで、柴が燃えているのに、燃え尽きないのを見た。近づこうとすると、柴の中から、神がモーセを呼んだ。（3:2〜4）」",
  "ナゴム「神は、『ここに近づくな。足から履物を脱げ。あなたが立っている所は聖なる地だ』という趣旨のことを告げた。（3:5）」",
  "イワオ「神は、エジプトで苦しむ民の叫びを聞いた、と告げ、モーセを、ファラオのもとへ遣わすと言った。（3:7〜10）」",
  "ナゴム「モーセは、尋ねた。『あなたの名前は、何と言いますか』と。（3:13）」"],
 q:"ナゴム「神は、この問いに、どう答えたと書かれているかな？」",
 ch:[
  {l:"『わたしはある』という趣旨の言葉で答えた（訳は諸説）。",sc:3,t:["イワオ「そう。ヘブライ語は『エヒイェ・アシェル・エヒイェ』。『わたしはある、わたしはあるという者だ』と訳す聖書が多いけれど、『わたしはなるであろうものに、なる』という読みもある。（3:14）　続けて、『主』という名も告げられる。（3:15）」"]},
  {l:"名前は、教えられなかった。",sc:2,t:["イワオ「名前を教えない、とは書かれていないんだ。『わたしはある』という趣旨の言葉と、『主』という名が、告げられている。（3:14〜15）」"]},
  {l:"『バアル』と答えた。",sc:1,t:["イワオ「バアルは、のちに出てくる、別の神の名だ。神は、『わたしはある』という趣旨の言葉で答えた、と書かれている。（3:14）」"]}],
 res:"神は、「わたしは、あなたと共にいる」と告げた、と書かれている。（3:12）　モーセは、のちに、民を導いて、エジプトを出る。（出エジプト記12章以下）",
 memo:[
  {k:"聖書の記述",t:"モーセは、羊を飼っていたとき、燃えても燃え尽きない柴を見て、神に呼ばれた。履物を脱ぐよう言われ、ファラオのもとへ遣わされた。名を尋ねると、「わたしはある」という趣旨の言葉と、「主」という名が告げられた（出エジプト記3:1〜15）。",s:"聖書本文 出エジプト記3章（要約）"},
  {k:"聖書の記述",x:"諸説",t:"3章14節のヘブライ語「エヒイェ・アシェル・エヒイェ」の訳は、「わたしはある、わたしはあるという者」「わたしはなるであろうものに、なる」など、分かれる、と言われる。この弾では、その解説の出典を確認していない。",s:"聖書本文 出エジプト記3:14。訳の分かれ方の出典は未確認"},
  {k:"史実",x:"未確認",t:"「ホレブ」と「シナイ」が、同じ山を指すのか、ホレブ山の場所はどこか、ミディアンがどこにあたるかは、この弾では、出典を確認していない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。柴の種類や形は想像による。神の姿は描かず、炎と光で表した。",s:"制作メモ"}]},
{key:"jericho",nw:"ヨシュアとエリコの城壁",theme:"ヨシュアと、エリコの城壁",ref:"ヨシュア記6章",per:"定住と士師",era:"年代は諸説",place:"エリコ",mk:"jericho",sc:"jericho",lead:"esther",
 arr:["モーセのあと、ヨシュアが、民を導いて、ヨルダン川を渡り、約束の地に入った。（ヨシュア記3〜4章）",
  "ナゴム「エリコの城門は、イスラエルに対して、固く閉ざされていた。（6:1）」",
  "ナゴム「主はヨシュアに、告げた。契約の箱を先頭に、七人の祭司に七つの角笛を持たせて、町を、六日間、毎日一周する。七日目には、七周する。（6:3〜4）」",
  "イクミ「六日間は、ただ歩くだけなんだね。民は、声を出さないように言われた、とも書かれてる。（6:10）」",
  "ナゴム「七日目、七周目に、祭司たちが角笛を吹いたとき、ヨシュアは、民に、鬨の声をあげるよう命じた。（6:15〜16）」"],
 q:"イクミ「そのとき、城壁は、どうなったと書かれているかな？」",
 ch:[
  {l:"民が鬨の声をあげ、角笛が鳴ると、城壁が崩れ落ちた。",sc:3,t:["ナゴム「そう。民が角笛の音を聞いて、大声で叫ぶと、城壁が崩れ落ちた、と書かれている。（6:20）」"]},
  {l:"破城槌で、城壁を打ち破った。",sc:2,t:["ナゴム「破城槌は出てこないんだ。角笛と、鬨の声で、城壁が崩れ落ちた、と書かれている。（6:20）」"]},
  {l:"ヨシュアが一人で、城壁をよじ登った。",sc:1,t:["ナゴム「そうは書かれていない。民が鬨の声をあげたとき、城壁が崩れ落ちた、と書かれている。（6:20）」"]}],
 res:"エリコの町は、「滅ぼし尽くす」ものとされ、町の人びとが滅ぼされた、と書かれている。ただし、ヨシュアが遣わした斥候をかくまった遊女ラハブと、その家族だけは助けられた。（6:17〜25）　この旅では、その場面は描かない。",
 memo:[
  {k:"聖書の記述",t:"七日目に、七人の祭司が七つの角笛を吹き、民が鬨の声をあげると、城壁が崩れ落ちた（ヨシュア記6:15〜20）。遊女ラハブと家族は、ヨシュアが遣わした斥候をかくまったため、助けられた（2章、6:22〜25）。",s:"聖書本文 ヨシュア記2章、6章（要約）"},
  {k:"聖書の記述",x:"諸説",t:"6章17〜21節は、エリコの町を「滅ぼし尽くすもの（ヘレム）」とし、人びとが滅ぼされたと書く。この記述をどう受けとめるかは、現代の読者や教会のあいだで、見方が分かれる。このゲームは、どれか一つの見方を、正解とはしない。",s:"聖書本文 ヨシュア記6:17〜21。見解の出典は未確認"},
  {k:"史実",x:"諸説",t:"エリコの遺跡（テル・エス・スルタン）の発掘では、ガースタングが、破壊を前1400年ごろとして、聖書の記述と結びつけた。ケニヨンは、破壊を前1550年ごろ（中期青銅器時代の終わり）とし、後期青銅器時代には、城壁のある町は無かったとした。ブライアント・ウッドは、ケニヨンの報告を再検討して、前1400年ごろと主張した。ただし、ウッド自身が、多くの研究者は、イスラエルの出現を、それより150〜200年あとと見る、と認めている。",s:"Bryant G. Wood「Did the Israelites Conquer Jericho?」Biblical Archaeology Review, 1990（Associates for Biblical Researchの公開版。著者は聖書の記述を支持する立場。読んだ範囲）"},
  {k:"想像",t:"場面の絵は想像の絵。城壁と城門の形は想像による。城壁が崩れる場面と、戦いは描かない。祭司は七人だが、小さく描いた。",s:"制作メモ"}]},
{key:"elijah",nw:"エリヤとカルメル山",theme:"エリヤと、カルメル山の火",ref:"列王記上18章",per:"王国と預言者",era:"年代は未確認",place:"カルメル山",mk:"elijah",sc:"elijah",lead:"cross",
 arr:["イスラエルの王アハブの時代、国は干ばつに苦しんでいた。預言者エリヤは、アハブに、民をカルメル山に集めるよう言った。（列王記上18:1〜19）",
  "ナゴム「バアルの預言者四百五十人と、エリヤが、民の前に立った。（18:19〜22）　エリヤは、民に、『いつまで二つのものの間でよろめいているのか』という趣旨のことを迫った。（18:21）」",
  "イワオ「勝負は、こうだ。雄牛を一頭ずつ薪の上に置き、火をつけずに、それぞれの神の名を呼ぶ。火をもって答える神が、神だ。（18:23〜24）」",
  "ナゴム「バアルの預言者たちは、朝から昼すぎまで呼び続けたが、答えはなかった、と書かれている。（18:26〜29）」",
  "イワオ「エリヤは、十二の石で祭壇を築き、溝を掘り、薪と雄牛の上に、水を三度注がせた。（18:30〜35）」"],
 q:"イワオ「エリヤが祈ると、どうなったと書かれているかな？」",
 ch:[
  {l:"天から火が降り、いけにえも、薪も、石も、水も焼き尽くした。",sc:3,t:["イワオ「そう。主の火が降って、焼き尽くす献げ物も、薪も、石も、塵も、溝の水までも、なめ尽くした、と書かれている。（18:38）」"]},
  {l:"何も起こらなかった。",sc:2,t:["イワオ「何も起こらなかったのは、バアルの預言者たちの方だよ。エリヤの祈りには、火が降った、と書かれている。（18:29、38）」"]},
  {l:"エリヤが、自分で火をつけた。",sc:1,t:["イワオ「エリヤは、火をつけなかった。水まで注がせて、祈ったんだ。（18:33〜35）」"]}],
 res:"民は、ひれ伏して、「主こそ神だ」と言った。（18:39）　そのあと、激しい雨が降り、干ばつは終わった、と書かれている。（18:41〜45）　バアルの預言者たちは、エリヤの命令で捕らえられ、殺された、と書かれている。（18:40）　この旅では、その場面は描かない。",
 memo:[
  {k:"聖書の記述",t:"エリヤは、カルメル山で、バアルの預言者四百五十人と、どちらの神が火で答えるかを争った。バアルの預言者たちには、答えがなく、エリヤの祈りには、火が降った。民は「主こそ神だ」と告白し、のちに雨が降った（列王記上18章）。",s:"聖書本文 列王記上18章（要約）"},
  {k:"聖書の記述",t:"エリヤは、ヤコブの子らの部族の数にあわせて、十二の石で祭壇を築いた（18:31〜32）。バアルの預言者たちが、そのあと殺されたことは、18章40節に書かれている。この記述の受けとめ方は、見方が分かれる。",s:"聖書本文 列王記上18:31〜32、40（要約）"},
  {k:"史実",x:"未確認",t:"アハブ王の年代、カルメル山での出来事の場所（山のどのあたりか）、エリヤの名前の意味（「わが神はヤハウェ」と説明されることが多い）は、この弾では、出典を確認していない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。祭壇の形と火の形は想像による。神の姿は描かず、火と光で表した。",s:"制作メモ"}]},
{key:"samson",nw:"サムソンの力",theme:"サムソンと、ナジル人の誓い",ref:"士師記13〜16章",per:"定住と士師",era:"年代は未確認",place:"ガザ〜ヘブロン方面",mk:"samson",sc:"samson",lead:"john",
 arr:["ペリシテ人の支配のもと、ダン族のマノアの妻に、主の使いが現れ、男の子が生まれると告げた。その子は、胎内から、神にささげられたナジル人で、髪にかみそりを当ててはならない、と言われた。（士師記13:2〜5）",
  "ナゴム「その子が、サムソン。のちに、士師（イスラエルを導く指導者）となった。」",
  "ナゴム「あるとき、サムソンは、ガザの町で、真夜中に、町の門の扉と柱を引き抜き、肩にかついで、ヘブロンの前の山の頂まで運んだ、と書かれている。（16:1〜3）」",
  "ワラオ「ひえー。力、すごすぎ…。」",
  "ナゴム「サムソンは、デリラという女性を愛した。ペリシテの領主たちは、彼女に、サムソンの力の秘密を探るよう頼んだ。（16:4〜5）」"],
 q:"ワラオ「サムソンの力の秘密は、何だと書かれているかな？」",
 ch:[
  {l:"生まれたときからのナジル人として、髪にかみそりを当てなかったこと。",sc:3,t:["ナゴム「そう。サムソンは、デリラに、母の胎内からナジル人であり、髪にかみそりを当てたことがない、と打ち明けた。髪を剃られれば、力が抜ける、と。（16:17）」"]},
  {l:"神殿から授かった、特別な剣。",sc:2,t:["ナゴム「剣ではないんだ。ナジル人として、髪にかみそりを当てなかったことが、力の秘密だ、と書かれている。（16:17）」"]},
  {l:"魔法の指輪。",sc:1,t:["ナゴム「指輪は出てこないよ。髪にかみそりを当てなかったこと、と書かれている。（16:17）」"]}],
 res:"サムソンは、デリラに髪を剃られ、力を失い、ペリシテ人に捕らえられた。（16:19〜21）　のちに、彼は、最後の祈りをささげ、神殿の柱を押して、自分も、多くのペリシテ人も死んだ、と書かれている。（16:28〜30）　この旅では、その場面は描かない。",
 memo:[
  {k:"聖書の記述",t:"サムソンは、母の胎内から、ナジル人（髪にかみそりを当てない）として生まれると告げられた（士師記13:2〜5）。ガザの門の扉をかついで運んだ（16:1〜3）。力の秘密を、デリラに打ち明け、髪を剃られて、力を失った（16:17〜20）。",s:"聖書本文 士師記13〜16章（要約）"},
  {k:"聖書の記述",t:"ナジル人の誓いの決まりは、民数記6章に書かれている。その一つに、誓いの期間、頭にかみそりを当てないことがある（民数記6:5）。",s:"聖書本文 民数記6:5（要約）"},
  {k:"史実",x:"未確認",t:"士師の時代の年代、ペリシテ人の起源や、考古学的な裏づけは、この弾では、出典を確認していない。サムソンの物語を、歴史の記録として読むか、伝承として読むかは、見方が分かれると言われるが、これも未確認。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。サムソンの姿と、扉の形は想像による。最期の場面は、描かない。",s:"制作メモ"}]},
{key:"woman",nw:"姦淫の女",theme:"罪のない者が、石を投げなさい",ref:"ヨハネ7章53節〜8章11節",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレムの神殿",mk:"woman",sc:"woman",lead:"miguel",
 arr:["朝早く、イエスが神殿の境内で、人びとに教えていると、律法学者たちとファリサイ派の人びとが、姦淫の現場で捕らえられた、という女性を連れてきた。（ヨハネ8:2〜4）",
  "ナゴム「彼らは、イエスに、尋ねた。律法では、こういう女は石で打ち殺せと命じているが、あなたは、どう言うか、と。イエスを試して、訴える口実を得るためだった、と書かれている。（8:5〜6）」",
  "ナゴム「イエスは、身をかがめて、指で地面に何かを書いていた。何を書いたかは、書かれていない。（8:6）」",
  "ナゴム「問い続けられて、イエスは、身を起こして、『あなたたちの中で、罪のない者が、まず、この女に石を投げなさい』という趣旨のことを言い、また身をかがめて書き続けた。（8:7〜8）」",
  "ツチオ「…それで、人びとは、どうしたの？」"],
 q:"ツチオ「イエスの言葉のあと、どうなったと書かれているかな？」",
 ch:[
  {l:"年長の者から始めて、一人、また一人と立ち去り、イエスと女性だけが残った。",sc:3,t:["ナゴム「そう。年長の者から始めて、みな、立ち去った、と書かれている。（8:9）　イエスは、女性に、『わたしもあなたを罪に定めない。行きなさい。これからは、もう罪を犯してはならない』という趣旨のことを言った。（8:10〜11）」"]},
  {l:"人びとは、いっせいに石を投げ始めた。",sc:2,t:["ナゴム「石は、誰も投げていないんだ。年長の者から始めて、みな立ち去った、と書かれている。（8:9）」"]},
  {l:"イエスは、地面に、人びとの名前を書き並べた。",sc:1,t:["ナゴム「イエスが地面に何を書いたかは、書かれていないんだ。（8:6、8）　人びとは、年長の者から始めて、立ち去った。（8:9）」"]}],
 res:"イエスと女性だけが残り、イエスは、「わたしもあなたを罪に定めない」という趣旨のことを言った。（8:10〜11）　ただし、この箇所は、古い写本には、無い。（下のメモを読もう）",
 memo:[
  {k:"聖書の記述",t:"律法学者たちとファリサイ派の人びとは、姦淫の現場で捕らえられたという女性を、イエスの前に連れてきて、石打ちについて尋ねた。イエスは、地面に何かを書き、「あなたたちの中で、罪のない者が、まず石を投げなさい」という趣旨のことを言った。人びとは、年長の者から始めて立ち去り、イエスは、女性を「罪に定めない」と言った（ヨハネ8:2〜11）。",s:"聖書本文 ヨハネ8:2〜11（要約）"},
  {k:"聖書の記述",t:"レビ記20章10節と、申命記22章22節は、姦淫について、男女ともに死刑にすると書く。この場面で、連れてこられたのは、女性だけである。その理由は、書かれていない（ヨハネ8:3〜4）。",s:"聖書本文 レビ記20:10、申命記22:22、ヨハネ8:3〜4（要約）。律法解釈の出典は未確認"},
  {k:"史実",x:"諸説",t:"この話（ヨハネ7:53〜8:11）は、古い有力な写本には含まれていない。パピルス66（200年ごろ）、パピルス75（3世紀）、シナイ写本とバチカン写本（ともに4世紀）には、この話がない。古いシリア語・コプト語・アルメニア語の訳や、古いラテン語写本の多くにも、ない。のちの写本では、ヨハネ7:52のあとのほか、ヨハネ福音書の末尾や、ルカ21:38のあとに置かれるものもある。",s:"Westar Institute「Do You Know the Story of the Woman Caught in Adultery?」（読んだ範囲。著者は、元の本文ではないと考える立場）"},
  {k:"史実",x:"諸説",t:"同じ資料は、この話が、3〜4世紀の『ディダスカリア』に知られ、アンブロシウスやアウグスティヌスは、ヨハネ福音書の一部として扱った、と書く。16世紀のエラスムスのギリシア語本文を通じて、広まったとも書く。現代の多くの翻訳は、この箇所を、括弧に入れるか、除く、と述べる。各教会が、この箇所を、聖書の一部として、どう扱うかは、この弾では、出典を確認していない。",s:"同上。教会ごとの扱いは未確認"},
  {k:"想像",t:"場面の絵は想像の絵。イエスと人びとの姿も想像で、実際の姿は伝えられていない。石は、地面に落ちているだけで、投げられる場面は描かない。",s:"制作メモ"}]}
);

{key:"temptation",nw:"荒野の誘惑",theme:"荒野の誘惑",ref:"マタイ4:1〜11／ルカ4:1〜13",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"ユダヤの荒野（場所は未確認）",mk:"temptation",sc:"temptation",lead:"miguel",
 arr:["洗礼のあと、イエスは、霊に導かれて、荒野へ行った。悪魔から誘惑を受けるためだった、と書かれている。（マタイ4:1）",
  "ツチオ「四十日四十夜、断食をして、そのあと、空腹になった。（4:2）」",
  "ツチオ「そこへ、誘惑する者が来て、言った。『神の子なら、この石が、パンになるように命じたらどうだ』と。（4:3）」",
  "ツチオ「この荒野の石を見ると、ぼくは、土の生き物だから、ちょっと、おなかが鳴りそうだよ…。」"],
 q:"ツチオ「イエスは、この誘惑に、どう答えたと書かれているかな？」",
 ch:[
  {l:"『人はパンだけで生きるのではない。神の口から出る言葉で生きる』という趣旨の聖書の言葉で答えた。",sc:3,t:["ツチオ「そう。申命記8章3節の言葉を引いて、答えた、と書かれている。（マタイ4:4）　イエスは、石をパンに変えなかった。」"]},
  {l:"石をパンに変えて、食べた。",sc:2,t:["ツチオ「そうは書かれていないんだ。イエスは、聖書の言葉を引いて、答えている。（マタイ4:4）」"]},
  {l:"何も答えず、黙って立ち去った。",sc:1,t:["ツチオ「答えた、と書かれているよ。『人はパンだけで生きるのではない』という趣旨の、申命記8章3節の言葉だ。（マタイ4:4）」"]}],
 res:"悪魔は、このあと、イエスを神殿の端に立たせて、飛び降りるように言い、そのあと、世界の国々を見せて、ひれ伏せば、これを与える、と言った。イエスは、どちらも、申命記の言葉で、退けた。（マタイ4:5〜10）　悪魔が去ると、天の使いたちが来て、イエスに仕えた、と書かれている。（マタイ4:11）",
 memo:[
  {k:"聖書の記述",t:"イエスは、霊に導かれて荒野に入り、四十日四十夜、断食した。誘惑は三つ。①石をパンに変える ②神殿の端から飛び降りる（天使が支える、と聖書にある、という理由で） ③悪魔を拝めば、世界の国々を与える。イエスは、それぞれ、申命記8:3、6:16、6:13の言葉で答えた。悪魔が去ると、天の使いたちが来て、仕えた（マタイ4:1〜11）。",s:"聖書本文 マタイ4:1〜11（要約。esv.org の本文を読んだ範囲）"},
  {k:"聖書の記述",x:"諸説",t:"ルカ福音書にも、同じ話があるが、二つ目と三つ目の順序が逆になる。マタイは、神殿、国々の順。ルカは、国々、神殿の順で、最後は、神殿の場面になる。また、ルカは、天の使いが仕えたことは書かず、悪魔は「時が来るまで」イエスを離れた、と結ぶ（ルカ4:1〜13）。順序の違いの理由は、見方が分かれる。マルコ福音書の短い記述は、この弾では、確かめていない。",s:"聖書本文 ルカ4:1〜13（要約。esv.org）。マルコ1章の記述は未確認"},
  {k:"史実",x:"未確認",t:"誘惑の場所は、聖書に書かれていない。「荒野」としか書かれていない。伝統的に、特定の山があてられることがあるが、この弾では、出典で確かめていない。「四十日」の数字が、聖書の別の箇所（モーセなど）と、どう関係するかの解釈も、出典を確かめていない。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。イエスの姿は、想像で、実際の姿は伝えられていない。誘惑する者の姿は、聖書に書かれていない。この絵では、暗い影のような人物として、描いた。角やしっぽは、つけていない。誘惑の三つ目までを、一枚の絵に収めることはせず、最初の石の場面だけを描いた。",s:"制作メモ"}]},

{key:"pentecost",nw:"ペンテコステ",theme:"ペンテコステ — 風と炎のような舌",ref:"使徒言行録2章",per:"使徒たち",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレム（集まった家の場所は未確認）",mk:"pentecost",sc:"pentecost",lead:"cross",
 arr:["復活したイエスが、弟子たちと別れたあと、弟子たちは、エルサレムに集まっていた。ペンテコステの日、というユダヤの収穫の祭りの日のことだ。（使徒言行録2:1）",
  "イワオ「すると、激しい風が吹くような音が、家いっぱいに響いた。炎のような舌が、ひとりひとりの上に、とどまった。（2:2〜3）」",
  "イワオ「みなは、聖霊に満たされて、ほかの国のことばで、話し出した、と書かれている。（2:4）」",
  "イワオ「エルサレムには、いろいろな国から来たユダヤ人たちがいた。彼らは、音を聞いて集まってきた。（2:5〜6）」",
  "イワオ「人びとは、驚いた。」"],
 q:"イワオ「人びとは、何に、いちばん驚いたと書かれているかな？」",
 ch:[
  {l:"ガリラヤの人たちが、自分の故郷のことばで、話しているのを聞いたから。",sc:3,t:["イワオ「そう。『どうして、自分の生まれた国のことばで、聞こえるのか』と驚いた、と書かれている。（2:6〜8）　パルティア、メディア、エジプト、ローマ、クレタ、アラビアなど、いろいろな土地の名前が、挙げられている。（2:9〜11）」"]},
  {l:"天使が現れて、ことばを通訳したから。",sc:2,t:["イワオ「天使の通訳は、この箇所には出てこない。人びとは、弟子たちが、自分の故郷のことばで話しているのを聞いて、驚いた、と書かれている。（2:6〜8）」"]},
  {l:"みんなが、ヘブライ語だけで話したから。",sc:1,t:["イワオ「そうではないんだ。『ほかの国のことば』で話した、と書かれている。（2:4）　聞いた人びとは、自分の故郷のことばで聞いた、と驚いた。（2:6〜8）」"]}],
 res:"そのあと、ペトロが立ち上がって、人びとに語りかけた。『まだ朝の九時ごろだ。酒に酔っているのではない』と。（2:14〜15）　ペトロは、イエスの死と復活を語り、その日、およそ三千人が、仲間に加わった、と書かれている。（2:22〜41）",
 memo:[
  {k:"聖書の記述",t:"弟子たちが集まっているとき、風のような音が家に響き、炎のような舌が、ひとりひとりの上にとどまった。聖霊に満たされ、ほかの国のことばで話し出した。エルサレムにいた、各地から来たユダヤ人たちは、自分の故郷のことばで聞いた、と驚いた（使徒言行録2:1〜13）。",s:"聖書本文 使徒言行録2:1〜13（要約。ebible.org の英訳本文を読んだ範囲）"},
  {k:"聖書の記述",t:"ペトロは、預言者ヨエルの言葉を引き、イエスは神に定められた計画のとおりに殺され、神がよみがえらせた、と語った。人びとが、どうすればよいかと尋ねると、「悔い改めて、イエスの名によって洗礼を受けなさい」と告げた、と書かれている。その日、およそ三千人が仲間に加わった（2:14〜41）。",s:"聖書本文 使徒言行録2:14〜41（要約）"},
  {k:"聖書の記述",x:"未確認",t:"2章1節の「ペンテコステ」は、ユダヤの収穫の祭りの日である、と、読んだ資料にある。この祭りの旧約聖書での呼び名（七週の祭り）や日付の数え方、教会が祝う聖霊降臨の祭日との関係は、この弾では、出典を確かめていない。",s:"出典未確認（祭りの名前の詳細）"},
  {k:"伝承",x:"未確認",t:"ペンテコステを、教会の「誕生日」と呼ぶ言い方がある。教会が、この日を、どう位置づけているかは、教派によって異なる可能性がある。カトリック教会のカテキズムなど、公式資料の文言は、この弾では確かめていない。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"「炎のような舌」「風のような音」は、聖書に「のような」とある表現である。何が実際に起きたのかを、歴史の記録として確かめる方法はない。また、「ほかの国のことば」で話した、という出来事が、どのような言語現象だったのかは、聖書の読み方によって、見方が分かれる。",s:"聖書本文の表現に基づく制作メモ。解釈の出典は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。人数は、絵として十人ほどだけ描いた（聖書は、集まった人数を、この箇所では書いていない）。炎のような舌は、頭の上の小さな炎として表した。実際の姿は、伝えられていない。",s:"制作メモ"}]},

{key:"damascus",nw:"サウロの回心",theme:"サウロの回心 — ダマスコへの道",ref:"使徒言行録9章／ガラテヤ1章",per:"使徒たち",era:"紀元後1世紀前半（年代は未確認）",place:"ダマスコ",mk:"damascus",sc:"damascus",lead:"pierre",
 arr:["サウロは、イエスの弟子たちを、強く敵視していた。大祭司に頼んで、ダマスコの会堂あての手紙をもらい、弟子たちを捕らえて、エルサレムに連れてこようとした。（使徒言行録9:1〜2）",
  "ナゴム「ダマスコの近くまで来たとき、天から光が、彼のまわりを照らした。サウロは地に倒れて、声を聞いた。『サウロ、サウロ、なぜわたしを迫害するのか』と。（9:3〜4）」",
  "ナゴム「いっしょにいた人たちは、声は聞こえたが、だれの姿も見えなかった、と書かれている。（9:7）」",
  "ナゴム「サウロは、目が見えなくなった。三日のあいだ、見えず、食べも飲みもしなかった。（9:8〜9）」",
  "ナゴム「主は、ダマスコにいる弟子に、幻の中で、告げた。『まっすぐ、と呼ばれる通りの、ユダの家へ行け』と。（9:10〜11）」"],
 q:"ナゴム「その弟子は、ためらいながらも、サウロのところへ行って、手を置いた。その弟子の名前は、だれだったかな？」",
 ch:[
  {l:"アナニア",sc:3,t:["ナゴム「そう。アナニアだ。サウロの悪い評判を知って、ためらったけれど、主は、『この人は、わたしの選んだ器だ』と告げた、と書かれている。（9:10〜16）　手を置くと、サウロの目から、うろこのようなものが落ちて、見えるようになり、サウロは洗礼を受けた。（9:17〜19）」"]},
  {l:"バルナバ",sc:2,t:["ナゴム「バルナバは、のちに、エルサレムで、サウロを使徒たちに引き合わせた人だ。（9:26〜27）　ダマスコで、目を癒した弟子は、アナニアと書かれている。（9:10〜17）」"]},
  {l:"ペトロ",sc:1,t:["ナゴム「ペトロは、このとき、ダマスコにはいなかったと思われる。ダマスコで、サウロのところへ遣わされたのは、アナニアという弟子だ。（9:10〜17）」"]}],
 res:"サウロは、すぐに、会堂で、『イエスは神の子だ』と宣べ伝え始めた。（9:20）　のちに、ダマスコで命をねらわれ、弟子たちが、夜、籠に乗せて、城壁づたいに、つり降ろして、逃がした。（9:23〜25）",
 memo:[
  {k:"聖書の記述",t:"サウロは、弟子たちを捕らえるため、ダマスコへ向かう途中、天からの光と声に出会って、倒れ、目が見えなくなった。ダマスコで、アナニアという弟子が、手を置くと、見えるようになり、洗礼を受けた。そして、会堂で、イエスは神の子だ、と宣べ伝えた（使徒言行録9:1〜22）。",s:"聖書本文 使徒言行録9:1〜22（要約。biblia.com の本文を読んだ範囲）"},
  {k:"聖書の記述",t:"ダマスコで、サウロの命をねらう動きがあり、弟子たちは、彼を、籠に乗せて、夜、城壁から、つり降ろした。エルサレムでは、弟子たちが、彼を恐れたが、バルナバが、使徒たちのもとへ連れていった。その後、サウロは、カイサリアを経て、タルソスへ送られた（9:23〜30）。",s:"聖書本文 使徒言行録9:23〜30（要約）"},
  {k:"史実",x:"諸説",t:"パウロ自身の手紙、ガラテヤの信徒への手紙1章では、回心のあと、アラビアに行って、またダマスコに戻り、三年たってから、エルサレムで、ケファ（ペトロ）に会い、十五日間滞在した、と書く。会ったのは、ほかには、主の兄弟ヤコブだけだった、とも書く（ガラテヤ1:17〜19）。使徒言行録の記述と、細部の順序や日数が同じではない、と指摘する研究もある。どう調和させるかは、見方が分かれる。",s:"聖書本文 ガラテヤ1:15〜24（christianity.com の本文を読んだ範囲）。使徒言行録との比較の学説は未確認"},
  {k:"伝承",t:"回心の絵は、馬から落ちたサウロを描くものが多い。使徒言行録9章1〜30節には、「馬」ということばは、出てこない。馬の姿は、のちの絵画で広まったイメージ、とみられる。",s:"聖書本文 使徒言行録9:1〜30（本文に「馬」の語がないことを確認）。絵画の歴史は未確認"},
  {k:"史実",x:"諸説",t:"サウロとパウロの名前について、回心のときに改名した、という理解が広いが、「パウロ」はローマ人としての名前で、生まれたときからあった、と主張する研究者もいる。使徒言行録13章9節に、「サウロ、またの名をパウロ」とある。どちらの理解が正しいかは、見方が分かれる。",s:"Biblical Archaeology Society（Ben Witherington III の意見記事。一つの解釈）"},
  {k:"史実",x:"未確認",t:"回心の年代は、紀元後30年代、とされることが多いが、この弾では、出典で確かめていない。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。この絵では、アナニアが手を置く場面を描いた。光と声の場面は、光だけで表し、イエスの姿は、描かなかった（聖書も、姿ではなく、光と声を書いている）。",s:"制作メモ"}]},

{key:"mission",nw:"宣教の旅",theme:"パウロの旅 — 地中海をこえて",ref:"使徒言行録13〜14章、18章",per:"使徒たち",era:"紀元後1世紀中ごろ（年代は諸説）",place:"コリント（ギリシア）",mk:"mission",sc:"mission",lead:"john",
 arr:["パウロは、バルナバといっしょに、アンティオキアから、船でキプロス島へ渡った。キプロスでは、総督セルギウス・パウルスに会った、と書かれている。（使徒言行録13章）",
  "ワラオ「そのあと、小アジアの内陸のアンティオキアなどへ、山を越えて行った。使徒言行録には、パウロの旅が、全部で、三度、書かれている。そして最後は、ローマへ向かう旅だ。」",
  "ワラオ「ある研究では、旅の期間を、第一回が46〜48年ごろ、第二回が49〜52年ごろ、第三回が53〜57年ごろ、と書く。ただし、これは大づかみな数字で、見方は分かれる。」",
  "ワラオ「コリントでは、パウロは、一年半、とどまった、と書かれている。そして、総督ガリオの前に、立たされた。（18:11〜12）」",
  "ワラオ「ギリシアのデルフォイで見つかった石の碑文に、ガリオの名前がある。」"],
 q:"ワラオ「その碑文は、パウロの旅の年代を考えるときの、手がかりになっているんだ。碑文に名前が書かれていたのは、だれかな？」",
 ch:[
  {l:"ガリオ（アカイア州の総督）",sc:3,t:["ワラオ「そう。ローマ皇帝クラウディウスが、デルフォイの人びとに宛てた碑文で、『わたしの友人で、アカイア州の総督ルキウス・ユニウス・ガリオ』と書かれている。年代は52年ごろ、とされる。（出典：バイブル・オデッセイ）　ここから、パウロのコリント滞在を、50〜51年ごろと考える学者もいるけれど、確定しているわけではない。」"]},
  {l:"セルギウス・パウルス",sc:2,t:["ワラオ「セルギウス・パウルスは、キプロスの総督で、彼にかかわる碑文は、アンティオキアで、見つかっている、という。（出典：BAS）　けれど、パウロの年代の手がかりになる碑文は、デルフォイの、ガリオのものだ。」"]},
  {l:"ポンティオ・ピラト",sc:1,t:["ワラオ「ピラトの名前が刻まれた石は、カイサリアで見つかった、別の石だ。パウロの旅の年代の手がかりになる、デルフォイの碑文には、ガリオの名前がある。」"]}],
 res:"パウロは、その後、エフェソなどにも滞在した、と書かれている。最後は、囚人としてローマへ送られた。パウロの最期については、ローマで殉教した、とする見方のほか、釈放されて、スペインへ行った、と語る古い著作家もいる、と書く資料がある。",
 memo:[
  {k:"聖書の記述",t:"パウロとバルナバは、アンティオキアから、キプロス島へ渡り、パフォスで総督セルギウス・パウルスに会った。魔術師エリマが目をつぶされ、総督は信じた（使徒言行録13:4〜12）。その後、小アジアの内陸のアンティオキアなどを巡った（13:14以下）。",s:"聖書本文 使徒言行録13章（要約）／BAS「Why Did Paul Go to Pisidian Antioch?」"},
  {k:"史実",x:"諸説",t:"小アジア内陸のアンティオキアで見つかった碑文に、「L. セルギウス」の名がある、という（BASの記事）。ただし、記事は、パウロの旅程が、総督の故郷の町と結びつく、というのは、筆者の推測だと述べる。記事の「息子」の読みも、確実ではないと書く。",s:"Biblical Archaeology Society（Ben Witherington III の意見記事。一つの解釈）"},
  {k:"史実",t:"デルフォイの碑文は、皇帝クラウディウスが、デルフォイの人びとに宛てたギリシア語の碑文で、52年ごろのものとされる。「わたしの友人で、アカイア州の総督ルキウス・ユニウス・ガリオ」と、書かれている。碑文は、ガリオの在任の年を、はっきりとは、書かない。",s:"Bible Odyssey「Erastus, Gallio, and Paul: Insights from Inscriptions」（読んだ範囲）"},
  {k:"史実",x:"諸説",t:"使徒言行録18章11節には、パウロが、コリントに一年半いた、18章12〜17節には、ガリオの前で訴えられた、とある。これと碑文を合わせて、パウロのコリント滞在を、50〜51年ごろ、と考える学者がいる。ただし、この年代は、使徒言行録の記述と、「ガリオの在任期間は短かった」という仮定に、頼っており、碑文だけで、確定するものではない。",s:"同上"},
  {k:"史実",x:"諸説",t:"パウロの旅は、使徒言行録の記述では、三度の宣教旅行と、囚人としてのローマ行きとされる。旅の年代は、ある資料では、第一回が46〜48年ごろ、第二回が49〜52年ごろ、第三回が53〜57年ごろ、ローマ行きが60〜63年ごろ、とされる。ただし、この資料は、使徒言行録に基づいて旅程を組み、パウロの手紙との比較は、していない、と、記事の説明から判断される。年代の数字は、大づかみなものである。",s:"World History Encyclopedia「The Journeys of Paul the Apostle」（読んだ範囲）"},
  {k:"伝承",x:"諸説",t:"パウロの最期について、同じ資料は、ローマで殺された、とする学者がいる一方、釈放されてスペインへ行った、と書く古い著作家もいる、と述べ、全体としては、まもなく殉教した、というのが、一般に認められている、と書く。パウロの手紙の数については、この弾では、出典を確かめていない。",s:"同上（手紙の数は未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。船の形や、碑文の形、人物の姿は、想像である。碑文の文字は、読める文字では、描いていない。",s:"制作メモ"}]},

{key:"patmos",nw:"ヨハネの黙示録",theme:"ヨハネの黙示録 — パトモス島の幻",ref:"ヨハネの黙示録1章・21章",per:"黙示録",era:"紀元後1世紀末ごろとする見方が一般的（諸説）",place:"パトモス島",mk:"patmos",sc:"patmos",lead:"esther",
 arr:["聖書の最後の書物は、ヨハネの黙示録、という。書き手は、『ヨハネ』と名乗り、パトモスという島に、いた、と書く。（黙示録1:9）",
  "イクミ「ヨハネは、主の日に、霊に満たされて、ラッパのような大きな声を、後ろから聞いた。（1:10）」",
  "イクミ「その声は、『見たことを、巻物に書いて、七つの教会に送れ』と言った。エフェソ、スミルナ、ペルガモン、テアティラ、サルディス、フィラデルフィア、ラオディキアだ。（1:11）」",
  "イクミ「ヨハネは、七つの金の燭台を、見た、と書かれている。そのあと、七つの星と七つの燭台の意味が、明かされる。（1:12〜20）」",
  "イクミ「七つの星は、七つの教会の使い。七つの燭台は、七つの教会だ。（1:20）」"],
 q:"イクミ「七つの燭台は、何を、表していると書かれているかな？」",
 ch:[
  {l:"七つの教会",sc:3,t:["イクミ「そう。『七つの燭台は、七つの教会である』と、書かれている。（1:20）　七つの教会は、いまのトルコ西部にあたる、当時のローマの『アジア州』にあった町だ。」"]},
  {l:"七つの山",sc:2,t:["イクミ「七つの山、とは、書かれていない。1章20節は、七つの燭台は、七つの教会だ、と説明している。」"]},
  {l:"七人の王",sc:1,t:["イクミ「七人の王、とは、この箇所には、書かれていない。（17章に、王についての記述があるが、解釈は分かれる）　1章20節で、七つの燭台は、七つの教会だ、と説明されている。」"]}],
 res:"黙示録の最後のほうには、新しい天と新しい地の幻が、書かれている。神が、人びとの中に住み、悲しむ人を慰め、もう死も、悲しみも、嘆きも、苦しみもない、と書かれている。（21:1〜4）　玉座の方は、『見よ、わたしは、すべてを新しくする』と告げた、と書かれている。（21:5）",
 memo:[
  {k:"聖書の記述",t:"ヨハネは、神のことばとイエスの証しのために、パトモス島にいた。主の日に、霊に満たされ、後ろから、ラッパのような声を聞いた。その声は、見たことを書き、七つの教会に送れ、と告げた。七つの燭台と、七つの星が見え、七つの星は教会の使い、七つの燭台は七つの教会である、と説明される（黙示録1:9〜20）。",s:"聖書本文 黙示録1:9〜20（要約。esv.org の本文を読んだ範囲）"},
  {k:"聖書の記述",t:"21章では、新しい天と新しい地、新しいエルサレムが、神のもとから降りてくる幻が書かれる。神が人びとの中に住み、悲しみ、嘆き、死はもうない、と告げられる。玉座の方は、「わたしは、すべてを新しくする」と言い、ヨハネに、これを書き記せ、と命じた（21:1〜5）。",s:"聖書本文 黙示録21:1〜5（要約。biblia.com の本文を読んだ範囲）"},
  {k:"史実",x:"諸説",t:"成立の時期について、伝統的には、ドミティアヌス帝の時代（81〜96年ごろ）とされ、エイレナイオスなどの古代の著作家が支持する、と、読んだ資料にある。一方で、ネロ帝の時代とする見方もある。ネロ説は、11章の神殿への言及や、666という数字が「ネロ・カエサル」と読めること、17章の「王たち」の読み方などを、根拠にする。資料は、ネロ説の根拠は、確実とはいえない、という立場で、ドミティアヌス説が、おそらくもっとも妥当、と書く。",s:"Biblical Training「Book of the Revelation」（保守的な立場の事典項目。読んだ範囲）"},
  {k:"史実",x:"諸説",t:"書き手の「ヨハネ」が、だれなのかについて、ユスティノス、エイレナイオス、テルトゥリアヌスは、使徒ヨハネと結びつけた。一方、アレクサンドリアのディオニュシオスは、自分の名を名乗ること、語彙、文法などを理由に、反対した。同じ資料は、反対の根拠は決定的ではない、という立場をとる。結論は、研究者によって、分かれる。",s:"同上"},
  {k:"史実",x:"諸説",t:"パトモス島は、ローマ時代に、政治犯などが送られた流刑地だった、と資料にある。宛先の七つの教会は、ローマの「アジア州」の町で、使者が、順に巡れる道筋に、あった、とも書かれる。ドミティアヌス帝が神的な栄誉を求めた、という理解が、ドミティアヌス説の背景にあるが、これも、見方が分かれる。",s:"同上"},
  {k:"史実",x:"諸説",t:"黙示録の読み方には、大きく四つの立場がある、と紹介される。①過去的解釈：書かれた1世紀末の状況を語る。②歴史的解釈：1世紀から終わりまでの教会の歴史を語る。③未来的解釈：4章以降の多くは、キリストの再臨の前に起きる出来事。④理想的解釈：どの時代にもある、善と悪の戦いを描く。資料は、それぞれに、一理がある、としつつ、いくつかの組み合わせを望ましいと述べる。教派や研究者によって、見方が分かれる。この弾では、特定の読み方を、正解としない。",s:"同上"},
  {k:"想像",t:"場面の絵は想像の絵。ヨハネの姿は、伝えられていない。島の様子も、想像である。1章に出てくる「人の子のような方」は、描かなかった。黙示録の、後半に出てくる、戦いや災いの場面も、この弾では、描いていない。",s:"制作メモ"}]}
);

 memo:[
  {k:"聖書の記述",t:"エズラ記は、ペルシア王キュロスの命令から書き始める。人びとは、エルサレムに帰り、神殿の基礎を据えたが、妨害で工事は止まった。預言者ハガイとゼカリヤの励ましで、工事が再開され、ダレイオスが古い記録を調べさせると、キュロスの命令の文書が見つかった。神殿は、ダレイオス王の六年、アダルの月の三日に完成し、献堂された（エズラ記1〜6章）。",s:"聖書本文 エズラ記1〜6章（要約。Center for Online Judaic Studies の Ezra 6 を読んだ範囲）"},
  {k:"史実",x:"諸説",t:"聖書の本文は、王の治世の年数だけを書く。読んだ資料の注記は、ダレイオス1世の治世を紀元前521〜486年、神殿の完成を紀元前516年とする。同じ資料は、「命令は、ペルシアの官房に由来するとされる」と述べ、聖書の記述にあるとおりに、独立した裏づけがあるとは書いていない。",s:"Center for Online Judaic Studies「Ezra 6: The Order to Rebuild」（読んだ範囲）"},
  {k:"史実",x:"未確認",t:"キュロスの円筒碑文（第23章で出典を確認）が、エズラ記の命令と、どの程度、対応するかは、この弾では、出典を確かめていない。帰還した人数、帰還の時期、エズラ記とネヘミヤ記の年代関係も、論点が多く、未確認である。",s:"出典未確認"},
  {k:"史実",t:"第二神殿という呼び名は、第一神殿（ソロモンの神殿。第20章）に対して、エズラ記の神殿を指して使われる。のちの章（ローマとヘロデ）では、ヘロデによる大規模な拡張も、この名で呼ばれることがある。",s:"制作メモ。呼称の用法は、次章で出典を確認する"},
  {k:"想像",t:"場面の絵は想像の絵。人びとの姿や、工事の様子は想像である。器の形も、実際のものとは違う。",s:"制作メモ"}]},

{key:"hellenism",nw:"ヘレニズムとマカバイ",theme:"ヘレニズムと、マカバイの時代",ref:"マカバイ記一・二（旧約聖書続編）／ダニエル書",per:"第二神殿の時代",era:"紀元前2世紀（前167〜164年ごろ）",place:"エルサレムの神殿",mk:"hellenism",sc:"hellenism",lead:"john",
 arr:["ペルシアのあと、ギリシアの王アレクサンドロスの征服（本文では、くわしくは書かない）を経て、ユダヤの地は、シリアのセレウコス朝の領土の一つになった。",
  "ワラオ「紀元前2世紀、セレウコス朝の王アンティオコス4世は、ユダヤ人に、割礼や安息日を禁じ、神殿の庭に、異教の祭壇を置いた、と、読んだ資料にある。（紀元前167年）」",
  "ワラオ「これに反対して、マタティアという老祭司と、五人の息子が、立ち上がった。その三男、ユダ・マカバイが、のちに戦いを率いた。」",
  "ワラオ「紀元前164年の12月、ユダは、エルサレムを取り戻し、祭壇を清め直して、神殿をもう一度、神に献げた。」",
  "ワラオ「この出来事を記念するのが、ユダヤ教のお祭り、ハヌカだよ。」"],
 q:"ワラオ「ハヌカは、何を記念するお祭りだと、書かれているかな？」",
 ch:[
  {l:"神殿を清め直して、神にもう一度献げたこと。",sc:3,t:["ワラオ「そう。ハヌカは、紀元前164年の神殿の再献堂を記念する、八日間のお祭りだ。（出典：Hitchhiker's Guide to Religion）　灯火の油の奇跡の話は、タルムードという、ずっとあとの文書に出てくる、と同じ資料は注記している。」"]},
  {l:"エジプトから出たこと。",sc:2,t:["ワラオ「エジプトを出たことを記念するのは、過越祭だ。（出エジプト記12章）　ハヌカは、神殿の再献堂を記念する。」"]},
  {l:"バビロンから帰ったこと。",sc:1,t:["ワラオ「バビロンからの帰還と神殿の再建は、前の章の出来事だよ。（エズラ記）　ハヌカは、のちの時代の、神殿の再献堂を記念する。」"]}],
 res:"のちに、マタティアの家系のハスモン家が、約80年のあいだ、ユダヤを治めた、と書く資料がある。やがて、内部の争いに、ローマが介入する。（紀元前63年。次の章へ）",
 memo:[
  {k:"史実",x:"諸説",t:"ユダヤは、セレウコス朝の属州だった。アンティオコス4世は、紀元前169年に神殿から財宝を奪い、前167年には、割礼、安息日、トーラーの公の朗読を禁じ、神殿の庭に異教の祭壇を置いた、と、読んだ資料は書く。ダニエル書は、これを「荒らす忌むべきもの」と呼ぶ、とも書く。これらの記述の主な根拠は、マカバイ記一・二であり、どちらも、ハスモン家を支持する立場で書かれている点に注意が要る。",s:"Hitchhiker's Guide to Religion「The Maccabean Revolt (167–142 BC)」（読んだ範囲）"},
  {k:"史実",x:"諸説",t:"マタティアは、モデインの村で、異教の祭壇での犠牲を拒み、王の役人を殺して、山に逃れた、と書かれる。息子のユダは、「マカバイ（槌）」というあだ名で、ゲリラ戦を率い、前160年に戦死した。ユダは、前164年の12月に、エルサレムを取り戻し、祭壇を清め、神殿を再献堂した。その後、弟のシモンが、前142年に完全な独立を得て、ハスモン朝を建てた。戦いの被害の記述は、この章では、詳しく描かない。",s:"同上"},
  {k:"伝承",t:"ハヌカの、灯火の油の奇跡の話は、タルムードに出てくるが、最も古い資料にはない、と、同じ資料は注記する。",s:"同上"},
  {k:"史実",x:"諸説",t:"マカバイ記は、ユダヤ教の正典には入っていない。カトリックと正教会の聖書には含まれ、多くのプロテスタントでは、外典（旧約聖書続編）として扱われる。この章では、「歴史の資料」として使い、どの立場からも、正典かどうかの判断は、押しつけない。ハスモン家が、生まれによらず、王と大祭司の役を兼ねたことを、クムランの共同体が批判した、とも、資料は書く。",s:"同上。各教会の公式の扱いは、この弾では確認していない"},
  {k:"史実",x:"未確認",t:"アレクサンドロスの征服の年代、ペルシアからヘレニズム時代への移り変わり、ユダヤの地でのギリシア文化の広がりは、読んだ資料では、くわしく扱われていない。この章では、概略だけを書いた。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。灯火の数や形は想像で、のちのハヌカの燭台の形を、この時代のものとして描いてはいない。人物の姿も想像である。",s:"制作メモ"}]},

{key:"rome",nw:"ローマとヘロデ",theme:"ローマの支配と、ヘロデ王",ref:"ルカ1:5／2:1／マタイ2章",per:"第二神殿の時代",era:"紀元前1世紀〜紀元後1世紀",place:"エルサレムの神殿（ヘロデの拡張）",mk:"rome",sc:"rome",lead:"esther",

  "イクミ「ポンペイウスは、神殿の一番奥まで入り、そこには、祭具はなく、からの部屋と、律法の巻物だけがあった、と書かれている。」",

  {l:"ヘロデ王（ヘロデ大王）。",sc:3,t:["イクミ「そう。ヘロデ王だ。神殿の建て直しは、紀元前20年か19年に始まった、と資料にある。　それを、誇らしく見た人もいれば、ローマ皇帝の神殿のような造りを、けがれたもの、と見た人もいた、と書かれている。」"]},
  {l:"ソロモン王。",sc:2,t:["イクミ「ソロモン王は、最初の神殿を建てた王だよ。（第20章）　イエスの時代の神殿は、ヘロデ王が建て直した、と資料にある。」"]},
  {l:"キュロス王。",sc:1,t:["イクミ「キュロス王は、バビロンからの帰還と、第二神殿の再建の命令を出した、とされる王だ。（第24章）　その神殿を、大がかりに建て直し始めたのが、ヘロデ王だ。」"]}],
 res:"このローマの時代に、ユダヤの人びとの間では、さまざまな動きがあった、と、資料は書く。やがて、ある夜、ベツレヘムで、ひとりの子が生まれる。（ルカ2章。次の章へ）",
 memo:[
  {k:"史実",t:"ローマの将軍ポンペイウスは、紀元前63年に、ハスモン家の二人の王族の争いに乗じて、エルサレムを占領し、神殿の一番奥まで入った。そこは、からの部屋と、律法の巻物だけだった、と、読んだ資料は書く。ローマの支配は、700年以上続き、紀元後70年のウェスパシアヌスによるエルサレム破壊を挟む、とも書く。",s:"Center for Online Judaic Studies「Judea Under Roman Rule (63 BCE–66 CE)」（読んだ範囲）"},
  {k:"史実",x:"諸説",t:"同じ資料は、ヘロデを「ローマの傀儡の王」と呼び、神殿の再建を、紀元前20年か19年に始めた、とする。建築は、皇帝アウグストゥスをたたえる皇帝の神殿に似た様式で、ユダヤ人の中には、賞賛する者もいれば、けがれたものと見る者もいた、と書く。ヘロデの全生涯の年代や、ほかの建築事業は、この資料では扱われていない。",s:"同上（ヘロデの年代は未確認）"},
  {k:"史実",x:"諸説",t:"ハスモンの反乱と、ローマの直接支配は、終末を待ち望む動きを刺激した。ヘレニズム化したユダヤ人は、ローマを受け入れる立場と、拒む立場に分かれた。神殿の支配を争う集団もあれば、神の国の到来を待つ集団もあった、と、同じ資料は書く。ファリサイ派、サドカイ派の説明や、「メシア」への期待の具体的な内容は、この資料では扱われていないため、この章では、書かない（未確認）。",s:"同上"},
  {k:"史実",t:"ヘロデ大王と、のちに出てくるヘロデ・アンティパスは、別の人物。ルカ福音書が書く、イエスの尋問の場面（ルカ23:6〜12）に出るのは、アンティパス。この章のヘロデは、大王である。年代や親族関係の出典は、のちのアンティパスの章で確認する。",s:"制作メモ。出典は後の章で確認"},
  {k:"史実",t:"ルカ2章1節は、皇帝アウグストゥスの勅令による住民登録のとき、イエスが生まれたと書く。この点は、第27章（降誕）のメモで、総督キリニウスの年代の論点（Psephizo）を、すでに取り上げている。",s:"第27章のメモを参照"},
  {k:"想像",t:"場面の絵は想像の絵。神殿の形、ヘロデや兵士の姿は想像である。ヘロデの王冠は、象徴として描いた。",s:"制作メモ"}]},

{key:"boy12",nw:"十二歳のイエス",theme:"十二歳のイエスと、神殿",ref:"ルカ2:41〜52",per:"イエスの生涯",era:"紀元後1世紀（年代は諸説）",place:"エルサレムの神殿",mk:"boy12",sc:"boy12",lead:"john",

  {k:"聖書の記述",t:"母が、探していたことを告げると、イエスは、「父の家にいるのは、当たり前」という趣旨のことを答えた。両親は、その意味が分からなかった。イエスは、ナザレに帰り、両親に従い、母は、これらのことを心に留めた（2:48〜51）。",s:"聖書本文 ルカ2:48〜51（要約）"},
  {k:"史実",x:"未確認",t:"福音書のうち、イエスの幼少期を語る場面は、ルカ福音書にしかなく、この場面は、ほかの福音書に並行記事がない、と、一般に説明される。この点の出典は、この弾では、確かめていない。また、49節の「父の家」という表現の訳は、「父のことの中に」とも訳される、と言われるが、これも、出典を確かめていない。",s:"出典未確認"},
