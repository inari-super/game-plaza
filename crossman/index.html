 memo:[
  {k:"聖書の記述",t:"婚礼で、ぶどう酒が足りなくなった。イエスは、六つの石の水がめに水を満たさせ、世話役のところへ持っていかせた。世話役は、水がぶどう酒に変わったものを味わい、花婿に、良いぶどう酒を最後まで取っておいた、と告げた。ヨハネは、これを、最初のしるし、と書く（ヨハネ2:1〜11）。",s:"聖書本文 ヨハネ2:1〜11（要約。esv.org の本文を読んだ範囲）"},
  {k:"聖書の記述",t:"水がめは、ユダヤ人の清めの儀式のためのもので、一つに、おおよそ二、三メトレテス（20〜30ガロンほど）入った、と、読んだ英訳の注にある（2:6）。どのくらいの量にあたるかは、換算の仕方によって幅がある。",s:"聖書本文 ヨハネ2:6（esv.org。換算の詳細は未確認）"},
  {k:"史実",x:"未確認",t:"カナの場所は、聖書に「ガリラヤのカナ」としか書かれていない。いまのどの場所にあたるかについては、複数の説があるが、この弾では出典で確かめていない。また、この話が、四つの福音書のうち、ヨハネ福音書にだけある、という点も、この弾では確かめていない。",s:"出典未確認"},

  {k:"想像",t:"場面の絵は想像の絵。イエスや母マリア、人びとの姿は想像で、実際の姿は伝えられていない。水がめは、六つ並べて描いたが、形や色は想像である。",s:"制作メモ"}]},

{key:"wellsam",nw:"井戸端の対話",theme:"サマリアの井戸のそばで",ref:"ヨハネ4:1〜42",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"スカル（シケム近く？）",mk:"wellsam",sc:"wellsam",lead:"esther",
 arr:["イエスは、ユダヤからガリラヤへ戻る途中、サマリアを通った。（ヨハネ4:3〜4）",
  "イクミ「スカルという町の近くの、ヤコブの井戸のそばで、イエスは、旅の疲れで、座っていた。昼ごろのことだった。（4:5〜6）」",
  "イクミ「そこへ、サマリアの女性が、水をくみに来た。（4:7）」",
  "イクミ「弟子たちは、食べ物を買いに、町へ行っていた。（4:8）」"],
 q:"イクミ「イエスは、その女性に、まず、何を頼んだと書かれているかな？」",
 ch:[
  {l:"水を飲ませてほしい、と頼んだ。",sc:3,t:["イクミ「そう。『水を飲ませてください』と頼んだ。女性は、ユダヤ人の男性が、サマリアの女性に頼むのに、驚いた。ヨハネは、ユダヤ人とサマリア人は、交際しなかった、と書き添えている。（4:7〜9）」"]},
  {l:"食べ物を分けてほしい、と頼んだ。",sc:2,t:["イクミ「食べ物は、弟子たちが、町へ買いに行っていたんだ。（4:8）　イエスが女性に頼んだのは、水だ。（4:7）」"]},
  {l:"町への道を教えてほしい、と頼んだ。",sc:1,t:["イクミ「道を聞いた、とは書かれていないよ。水を飲ませてほしい、と頼んだ。（4:7）」"]}],
 res:"話は、「生きた水」や、礼拝の場所（ゲリジム山とエルサレム）へと進む。（4:10〜24）　女性は、水がめを置いて町へ行き、人びとに、イエスのことを告げた。多くのサマリア人が信じ、イエスは、そこに二日、とどまった、と書かれている。（4:28〜42）",
 memo:[
  {k:"聖書の記述",t:"イエスは、サマリアのスカルの、ヤコブの井戸のそばで、水をくみに来たサマリアの女性と話した。イエスは、「生きた水」を語り、女性が「五人の夫がいた」ことにふれた。女性は、ゲリジム山とエルサレムの、礼拝の場所の違いを尋ね、イエスは、場所によらず、「霊と真理」で礼拝する時が来る、と答えた。メシアのことを問うと、イエスは、自分がそれだと告げた。多くのサマリア人が、信じた（ヨハネ4:1〜42）。",s:"聖書本文 ヨハネ4:1〜42（要約。esv.org の本文を読んだ範囲）"},
  {k:"聖書の記述",t:"ヨハネは、「ユダヤ人はサマリア人とつきあわない」と書き添えている（4:9）。サマリア人が、どのような人びとで、ユダヤ人と、なぜ、そのような関係だったかは、聖書の他の箇所や、歴史の資料で確かめる必要があり、この弾では出典を確かめていない。",s:"聖書本文 ヨハネ4:9。サマリア人の歴史は未確認"},
  {k:"史実",x:"諸説",t:"女性に「五人の夫」がいたことの意味は、福音書は、ことさらに、非難しているわけではない。どう読むかは、研究者や教派によって、見方が分かれる。この章では、女性を、非難する形で描かない。",s:"聖書本文の表現に基づく制作メモ。解釈の出典は未確認"},
  {k:"史実",x:"未確認",t:"スカルの場所は、聖書に「ヤコブがヨセフに与えた土地の近く」と書かれているだけで、いまのどの場所にあたるかは、この弾では確かめていない（シケムの近く、とする説明があるが、出典未確認）。ゲリジム山の位置づけも、同じく未確認。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。イエスと女性の姿は想像で、実際の姿は伝えられていない。井戸の形や、背景の山も想像である。",s:"制作メモ"}]},

{key:"loaves",nw:"五つのパンと二匹の魚",theme:"五つのパンと、二匹の魚",ref:"マルコ6:30〜44（ほか）",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"ガリラヤ湖の近くの人里離れた所",mk:"loaves",sc:"loaves",lead:"john",

  "ワラオ「ところが、人びとが、先回りして、そこに来ていた。イエスは、羊飼いのいない羊のような群衆を見て、深く憐れみ、たくさんのことを教えた。（6:33〜34）」",

  "ワラオ「調べると、パンが五つと、魚が二匹あった。（6:38）」"],

  {l:"三つのかご。",sc:2,t:["ワラオ「三つ、とは書かれていないよ。十二のかごにいっぱいになった、と書かれている。（6:43）」"]},
  {l:"七つのかご。",sc:1,t:["ワラオ「マルコ福音書には、別に、四千人の記事もあって、数が違うとされている（8章。この弾では出典未確認）。五千人の記事では、十二のかごだ。（6:43）」"]}],

 memo:[
  {k:"聖書の記述",t:"イエスは、人里離れた所で、群衆を憐れみ、教えた。夕方、弟子たちに、食べ物を与えるように言った。五つのパンと二匹の魚を、人びとを組ごとに座らせて、感謝をささげ、パンを裂き、配らせた。みなが食べ、残りは十二のかごにいっぱいになった。食べたのは、男の人が五千人、と書かれている（マルコ6:30〜44）。",s:"聖書本文 マルコ6:30〜44（要約。esv.org の本文を読んだ範囲）"},
  {k:"聖書の記述",t:"弟子たちは、食べ物を買うには、八か月分ほどの賃金がかかる、と答えた、と、読んだ資料の要約にある（6:37）。この記事は、ほかの福音書にもある。読んだ並行箇所の一覧には、ルカ9章、ヨハネ6章、マタイ15章、マルコ8章（四千人の記事）が挙げられている。",s:"ESV 並行箇所の一覧（esv.org。読んだ範囲）"},
  {k:"史実",x:"諸説",t:"この出来事を、歴史の中で確かめる方法はない。どのように読むか（奇跡の出来事とするか、人びとが持ち寄って分け合った、という出来事とするか、象徴的な物語とするか）は、教派や研究者によって見方が分かれる。この章は、聖書の記述として語り、どれが正しいかは、書かない。",s:"制作メモ。解釈の出典は未確認"},
  {k:"史実",x:"未確認",t:"「パンを取り、感謝をささげ、裂いて渡す」という言い方が、最後の晩餐の記述と似ていて、教会の聖餐の理解と結びつけて読まれることがある。この弾では、各教会の公式な見解を、確かめていない。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。人びとの人数は、絵として、数十人だけ描いた（聖書は、五千人と書く）。イエスの姿や、パンと魚の形も想像である。",s:"制作メモ"}]},

{key:"transfig",nw:"山上の変容",theme:"山の上で、変わった姿",ref:"マルコ9:2〜13（ほか）",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"高い山（所在は未確認）",mk:"transfig",sc:"transfig",lead:"cross",
 arr:["六日後、イエスは、ペトロ、ヤコブ、ヨハネだけを連れて、高い山に登った。（マルコ9:2）",
  "イワオ「そこで、イエスの姿が、三人の前で、変わった。服は、この世のどんな布ざらしにも、できないほど、白く輝いた、と書かれている。（9:2〜3）」",
  "イワオ「エリヤが、モーセと共に現れて、イエスと語り合っていた。（9:4）」",

  {l:"アブラハムと、ダビデ。",sc:2,t:["イワオ「アブラハムとダビデ、とは書かれていないんだ。エリヤが、モーセと共に現れた、と書かれている。（9:4）」"]},

 memo:[
  {k:"聖書の記述",t:"六日後、イエスは、ペトロ、ヤコブ、ヨハネだけを連れて、高い山に登った。イエスの姿が変わり、衣は白く輝いた。エリヤがモーセと共に現れ、イエスと語り合った。ペトロは、仮小屋を三つ建てる、と言った。雲が現れ、雲の中から、イエスを愛する子とし、これに聞け、と告げる声がした。弟子たちが見回すと、イエスだけがいた。山を下りるとき、イエスは、復活するまで、だれにも話すな、と命じた（マルコ9:2〜9）。",s:"聖書本文 マルコ9:2〜9（要約。esv.org の本文を読んだ範囲）"},
  {k:"聖書の記述",t:"弟子たちは、「エリヤが先に来るはず、と、律法学者が言うのは、なぜか」と尋ねた。イエスは、エリヤはすでに来た、と答えた（マルコ9:11〜13）。",s:"聖書本文 マルコ9:11〜13（要約）"},
  {k:"史実",x:"未確認",t:"山の場所は、聖書に「高い山」としか書かれていない。特定の山があてられることがあるが、この弾では、出典で確かめていない。三つの福音書に並行箇所があるとされるが、その点も、この弾では、確認していない。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"この出来事を、歴史の中で確かめる方法はない。どう読むかは、教派によって異なる。正教会やカトリック教会では、この出来事を祝う祭日があるとされるが、この弾では、公式資料を確認していない。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。天からの声は、雲として表し、声の主は描いていない（神の姿は描かない方針）。イエス、モーセ、エリヤの姿は想像で、実際の姿は伝えられていない。",s:"制作メモ"}]},

{key:"entry",nw:"エルサレム入城",theme:"エルサレム入城",ref:"マルコ11:1〜11（ほか）",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"オリーブ山〜エルサレム",mk:"entry",sc:"entry",lead:"pierre",
 arr:["イエスの一行が、エルサレムに近づき、オリーブ山のふもとのベトファゲとベタニアに近づいたとき、イエスは、二人の弟子を、近くの村へ遣わした。（マルコ11:1〜2）",
  "ナゴム「『まだだれも乗ったことのない、子ろばがつないである。それをほどいて、連れてきなさい』と言った。（11:2）」",
  "ナゴム「だれかがとがめたら、『主がお入り用なのです』と言いなさい、と言われた。そのとおり、持ち主たちは、ろばを渡した。（11:3〜6）」",
  "ナゴム「弟子たちは、子ろばに上着を掛け、イエスが乗った。人びとは、自分の上着や、野原から切ってきた葉のついた枝を、道に敷いた。（11:7〜8）」"],
 q:"ナゴム「エルサレムに入るとき、イエスが乗ったのは、何だったかな？」",
 ch:[
  {l:"まだだれも乗ったことのない、子ろば。",sc:3,t:["ナゴム「そう。『まだだれも乗ったことのない子ろば』だ。（11:2）　絵では、馬に乗る姿も見かけるけれど、マルコ福音書は、ろば（原語は子ろばとされる）と書いている。」"]},
  {l:"白い馬。",sc:2,t:["ナゴム「白い馬、とは書かれていないんだ。まだだれも乗ったことのない子ろばに、乗った、と書かれている。（11:2、7）」"]},
  {l:"大きならくだ。",sc:1,t:["ナゴム「らくだ、とも書かれていないよ。子ろばだ。（11:2、7）」"]}],
 res:"先に行く人も、あとに続く人も、叫んだ。「ホサナ。主の名によって来られる方に、祝福があるように。われらの父ダビデの、来たるべき国に、祝福があるように」と。（11:9〜10）　イエスは、エルサレムに入り、神殿に入って、すべてを見て回ったが、もう夕方だったので、十二人とベタニアへ出ていった。（11:11）",
 memo:[
  {k:"聖書の記述",t:"イエスは、エルサレムに近づいて、二人の弟子を遣わし、まだだれも乗ったことのない子ろばを連れてこさせた。弟子たちが上着をかけ、イエスが乗ると、人びとは、上着や、野原から切った葉のついた枝を、道に敷いた。人びとは、主の名によって来る方に祝福を、来たるべき、ダビデの国に祝福を、と叫んだ。イエスは、エルサレムの神殿に入り、見て回って、ベタニアに戻った（マルコ11:1〜11）。",s:"聖書本文 マルコ11:1〜11（要約。christianity.com の本文を読んだ範囲）"},
  {k:"伝承",t:"枝を「ナツメヤシ（しゅろ）の枝」とするのは、のちの伝統的な理解が強い。マルコ福音書の本文は、「野原から切った葉のついた枝」と書く。ヤシの枝を明記するのは、ヨハネ福音書12章13節とされるが、この弾では、出典を確かめていない。",s:"聖書本文 マルコ11:8。ヨハネ12:13は未確認"},
  {k:"史実",x:"未確認",t:"ゼカリヤ書9章9節の、「ろばに乗る王」の預言との関係は、マタイ福音書とヨハネ福音書が引くとされるが、マルコ福音書には、その引用がない。この弾では、出典を確かめていない。群衆の叫び（ホサナ）が、どのような意味や響きを持っていたかも、未確認。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"この日が、どの日にあたるか、またこの出来事が、当時の政治状況（ローマの支配。第26章）の中で、どう受け止められたかは、見方が分かれる。教会は、この日を、「枝の主日」などとして祝うとされるが、公式資料は、この弾では確認していない。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。イエス、ろば、人びと、城壁の姿は想像で、実際の姿は伝えられていない。枝は、野原の枝として、ヤシの形にはしていない。",s:"制作メモ"}]},

{key:"cleansing",nw:"神殿の商人たち",theme:"神殿の商人たちと、イエス",ref:"マルコ11:15〜19／ヨハネ2:13〜22",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレムの神殿",mk:"cleansing",sc:"cleansing",lead:"miguel",
 arr:["エルサレムに着いて、イエスは、神殿の境内に入った。（マルコ11:15）",
  "ツチオ「そこでは、売り買いする人たちや、両替の人たち、鳩を売る人たちがいた。（11:15）」",
  "ツチオ「イエスは、売り買いする人びとを追い出し、両替人の台や、鳩を売る者の腰掛けを、倒した。（11:15）」",
  "ツチオ「また、境内を通って、物を運ぶことを、許さなかった。（11:16）」"],
 q:"ツチオ「イエスは、神殿を、本来は、どういう所であるべきだと言ったと書かれているかな？」",
 ch:[
  {l:"すべての国の人の、祈りの家。",sc:3,t:["ツチオ「そう。『わたしの家は、すべての国の人の祈りの家と呼ばれるべきだ』という趣旨のことを、教えた。それなのに、あなたがたは、それを強盗の巣にしている、と言った、と書かれている。（マルコ11:17）」"]},
  {l:"王の宮殿。",sc:2,t:["ツチオ「宮殿、とは言っていないんだ。『祈りの家』と呼ばれるべきだ、と書かれている。（11:17）」"]},
  {l:"大きな市場。",sc:1,t:["ツチオ「市場にするな、と言った、と書かれているよ。『祈りの家』であるべきだ、と。（11:17、ヨハネ2:16）」"]}],
 res:"祭司長たちや律法学者たちは、これを聞いて、どうやってイエスを殺そうかと謀った。群衆が皆、その教えに驚いていたので、恐れたからだ、と書かれている。（マルコ11:18）　夕方になると、イエスは、都の外へ出た。（11:19）",
 memo:[
  {k:"聖書の記述",t:"マルコ福音書では、イエスは、エルサレムの神殿の境内で、売り買いする人びとを追い出し、両替人の台と、鳩を売る人の腰掛けを倒した。境内を通って物を運ぶことを許さなかった。「わたしの家は、すべての国の人の祈りの家と呼ばれるべきだ。それなのに、あなたがたは、強盗の巣にした」と教えた。祭司長たちと律法学者たちは、イエスを殺す方法を探したが、群衆を恐れた（マルコ11:15〜19）。",s:"聖書本文 マルコ11:15〜19（要約。christianity.com の本文を読んだ範囲）"},
  {k:"聖書の記述",x:"諸説",t:"ヨハネ福音書にも、同じような場面がある。そこでは、イエスは、縄でむちを作り、牛や羊を境内から追い出し、両替人の金を撒き、台を倒し、鳩を売る人に、父の家を商売の家にするな、と言った。ユダヤ人の指導者が、しるしを求めると、イエスは、「この神殿を壊してみよ。三日で建て直す」と答え、人びとは、この神殿は四十六年かかって建てられた、と言った。イエスは、自分のからだの神殿のことを語っていた、と福音書は書く（ヨハネ2:13〜22）。ヨハネは、この出来事を、物語の初めのほうに置き、マルコは、最後の週に置く。同じ出来事を、福音書がそれぞれ別の場所に置いたのか、二度の出来事なのかは、見方が分かれる。",s:"聖書本文 ヨハネ2:13〜22（要約。esv.org の本文を読んだ範囲）"},
  {k:"史実",x:"諸説",t:"四十六年は、ヘロデ王が神殿の再建を、紀元前20年か19年に始めた、という資料（第26章で確認）と合わせて、算術すると、紀元後27〜28年ごろになる。ただし、年の数え方（始まりの年、完成の基準）に幅があり、この数字が、イエスの働きの年代の手がかりになるかどうかは、見方が分かれる。この弾では、他の出典で、確かめていない。",s:"Center for Online Judaic Studies（ヘロデの開始年）と聖書本文ヨハネ2:20を組み合わせた算術。年代の扱いは未確認"},
  {k:"史実",x:"諸説",t:"「両替人」「鳩を売る人」が、当時の神殿で、どのような役割を持っていたか（献金の硬貨への両替、犠牲の動物の販売など）は、一般に説明されるが、この弾では、出典を確かめていない。この出来事が、神殿の運営への批判だったのか、神殿の未来についての預言的な行為だったのかは、研究者や教派によって見方が分かれる。",s:"出典未確認"},
  {k:"史実",t:"福音書は、イエスを殺す方法を探したのは、「祭司長たちと律法学者たち」だ、と書く。「ユダヤ人全体」ではない。この点は、受難の章のメモ（カトリック教会の『ノストラ・アエターテ』）にも関わる。",s:"聖書本文 マルコ11:18。教会文書の出典は受難の章のメモを参照"},
  {k:"想像",t:"場面の絵は想像の絵。台を倒す場面は、台が倒れ、硬貨が散らばり、鳩が飛び立つ様子で表し、人に向けた暴力は描かない。イエスや人びとの姿は想像で、実際の姿は伝えられていない。",s:"制作メモ"}]}
);

{key:"judas",nw:"ユダの取引",theme:"ユダの取引",ref:"マルコ14:10〜11／ルカ22:3〜6",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレム（場所は未確認）",mk:"judas",sc:"judas",lead:"cross",
 arr:["過越の祭りが近づき、祭司長たちと律法学者たちは、イエスをひそかに捕らえて殺す方法を探していた。（マルコ14:1）",
  "イワオ「ここは、聖書に書かれたことだけを、静かに聞いてほしい場面なんだ。」",
  "イワオ「十二人の一人、イスカリオテのユダが、祭司長たちのところへ行った。イエスを引き渡すためだった。（マルコ14:10）」",
  "イワオ「祭司長たちは、それを聞いて喜び、金をやろうと約束した。ユダは、イエスを引き渡す、よい機会をうかがった。（14:11）」"],
 q:"イワオ「マルコ福音書では、この取引は、どちらから持ちかけたと書かれているかな？」",
 ch:[
  {l:"ユダのほうから、祭司長たちのところへ行った。",sc:3,t:["イワオ「そう。『ユダは、祭司長たちのところへ行った』と書かれている。（マルコ14:10）　ルカ福音書は、これに、『サタンがユダの中に入った』と書き添える。（ルカ22:3）　なぜユダがそうしたのかは、マルコは、書いていないんだ。」"]},
  {l:"祭司長たちが、ユダを呼び出して、持ちかけた。",sc:2,t:["イワオ「マルコもルカも、ユダが、祭司長たちのところへ行った、と書いている。（マルコ14:10、ルカ22:4）」"]},
  {l:"ローマの兵士が、ユダにお金を渡した。",sc:1,t:["イワオ「お金の約束をしたのは、祭司長たちだ。（マルコ14:11）　ローマの兵士は、ここには出てこない。」"]}],
 res:"このあと、最後の晩餐の席で、イエスは、「あなたがたの一人が、わたしを裏切る」と告げる。（マルコ14:18）　弟子たちは、悲しんで、「まさか、わたしでは」と、一人ずつ言い始めた。（14:19）",
 memo:[
  {k:"聖書の記述",t:"十二人の一人ユダは、自分から祭司長たちのところへ行き、イエスを引き渡すことを申し出た。祭司長たちは喜び、金を与える約束をした。ユダは、機会をうかがった（マルコ14:10〜11）。ルカは、ユダの中に「サタンが入った」と書き、群衆のいないときに引き渡す機会を探した、と書く（ルカ22:3〜6）。",s:"聖書本文 マルコ14:10〜11、ルカ22:3〜6（esv.org。読んだ範囲）"},
  {k:"史実",x:"諸説",t:"ユダが、なぜ裏切ったのかは、マルコ福音書は書いていない。お金のためとする読み方、失望や思い違いとする読み方、ルカのように、悪の力の働きとして語る読み方などがあり、見方が分かれる。この章は、動機を、断定しない。",s:"聖書本文の表現に基づく制作メモ。解釈の出典は未確認"},
  {k:"史実",x:"未確認",t:"金額（マタイ福音書にある銀貨の数）と、その後のユダの最期についての記述は、この弾では、本文を確認していない。ユダの名の「イスカリオテ」の意味も、未確認。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。部屋の様子や、祭司たちの姿は想像で、実際の姿は伝えられていない。ユダは、絵に描いていない。お金は、机の上の硬貨だけで表した。",s:"制作メモ"}]},

{key:"gethsemane",nw:"ゲツセマネの祈り",theme:"ゲツセマネの祈り",ref:"マルコ14:32〜42",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"ゲツセマネ（オリーブ山のふもと）",mk:"gethsemane",sc:"gethsemane",lead:"miguel",
 arr:["食事のあと、イエスと弟子たちは、ゲツセマネという場所へ行った。（マルコ14:32）",
  "ツチオ「イエスは、ペトロ、ヤコブ、ヨハネだけを、さらに奥へ連れていった。そして、『わたしは、悲しみのあまり、死ぬほどだ。ここにいて、目を覚ましていなさい』と言った。（14:33〜34）」",
  "ツチオ「イエスは、少し進んで、地面にひれ伏し、できることなら、この時が過ぎ去るように、と祈った。（14:35）」",
  "ツチオ「イエスは、神に『アッバ、父よ』と呼びかけた。（14:36）」"],
 q:"ツチオ「イエスは、そのあと、どう祈ったと書かれているかな？」",
 ch:[
  {l:"この杯をわたしから取りのけてください。しかし、わたしの願いではなく、あなたの御心のままに。",sc:3,t:["ツチオ「そう。『この杯を、わたしから取りのけてください。しかし、わたしが願うことではなく、あなたが願うことが、行われますように』という趣旨の祈りだ。（マルコ14:36）　イエスは、戻ってきて、弟子たちが眠っているのを見た。祈りは、三度、繰り返された、と書かれている。（14:37〜41）」"]},
  {l:"敵を打ち負かす力を、お与えください。",sc:2,t:["ツチオ「そうは書かれていないんだ。『わたしの願いではなく、あなたの願いのままに』と祈った。（14:36）」"]},
  {l:"弟子たちを、この場から逃がしてください。",sc:1,t:["ツチオ「弟子たちのことを祈った、とは、マルコは書いていないよ。祈りの内容は、14:36に書かれている。」"]}],
 res:"三度目に戻って、イエスは、「時が来た。人の子は、罪人たちの手に渡される。立て、行こう。見よ、わたしを裏切る者が近づいた」と言った。（マルコ14:41〜42）",
 memo:[
  {k:"聖書の記述",t:"イエスは、ペトロ、ヤコブ、ヨハネを連れて奥へ進み、深く悲しんで、ひれ伏して祈った。「アッバ、父よ、この杯をわたしから取りのけてください。しかし、わたしが願うことではなく、あなたが願うことが行われますように」。戻ると、弟子たちは眠っていた。これを三度繰り返した（マルコ14:32〜42）。",s:"聖書本文 マルコ14:32〜42（esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"ヨハネ福音書にも、同じ夜、イエスが園で逮捕される話があるが、「ゲツセマネ」の名前も、祈りの場面も書かれていない。ヨハネは、場所を「キデロンの谷の向こうの園」と書く（ヨハネ18:1〜12）。",s:"esv.org の対照表の要約（ヨハネ18:1〜12）。本文全体は未確認"},
  {k:"史実",x:"未確認",t:"ゲツセマネの場所は、聖書に「ゲツセマネという所」としか書かれていない。オリーブ山のふもとにある園とされるが、現在の特定の場所について、この弾では、出典で確かめていない。「杯」の意味は、「受けるべき苦しみ」と読まれることが多いが、出典は未確認。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。夜のオリーブの木と月は想像で、イエスと弟子たちの姿も想像である。祈りの姿は、静かな立ち姿で表した。",s:"制作メモ"}]},

{key:"arrest",nw:"逮捕と大祭司の庭",theme:"逮捕、そして大祭司の庭で",ref:"マルコ14:43〜72",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"大祭司の家（所在は未確認）",mk:"arrest",sc:"arrest",lead:"pierre",
 arr:["そこへ、十二人の一人、ユダが来た。剣や棒を持った群衆が一緒で、祭司長たち、律法学者たち、長老たちから遣わされた者だった。（マルコ14:43）",
  "ナゴム「ユダは、前もって、合図を決めていた。『わたしが接吻する者が、その人だ。捕らえなさい』と。ユダは、『先生』と言って、イエスに接吻した。人びとは、イエスを捕らえた。（14:44〜46）」",
  "ナゴム「弟子たちは、みな、イエスを見捨てて逃げた。（14:50）」",
  "ナゴム「ペトロだけは、遠くからついていき、大祭司の屋敷の中庭に入って、役人たちと一緒に、火にあたっていた。（14:54）」",
  "ナゴム「そこで、大祭司の女中などに、『あなたも、あのナザレのイエスと一緒だった』と言われたんだ。（14:66〜67）」"],
 q:"ナゴム「ペトロは、鶏が二度鳴く前に、イエスを知らないと、何回言ったと書かれているかな？」",
 ch:[
  {l:"三度。",sc:3,t:["ナゴム「そう、三度。イエスが、前もって、『鶏が二度鳴く前に、三度、わたしを知らないと言う』と告げていた。（マルコ14:30）　ペトロは、それを思い出して、泣き崩れた。（14:72）」"]},
  {l:"一度だけ。",sc:2,t:["ナゴム「マルコは、三度、と書いている。（14:68、70、71）　そのあと、鶏が二度目に鳴いて、ペトロは、泣いた。（14:72）」"]},
  {l:"一度も、否定しなかった。",sc:1,t:["ナゴム「ペトロは、三度、否定した、と書かれている。（14:66〜72）」"]}],
 res:"その間、中では、祭司長たちと、最高法院の議員たちが、イエスを死刑にする証言を探したが、証言は食い違った。（14:55〜59）　大祭司が、「あなたは、ほむべき方の子、メシアか」と尋ねると、イエスは、「そうです」と答えた。大祭司は、衣を引き裂いて、「神への冒涜だ」と言い、一同は、死刑にあたると決めた。（14:61〜64）",
 memo:[
  {k:"聖書の記述",t:"ユダが、祭司長たち、律法学者たち、長老たちの遣わした、剣や棒を持った群衆を連れて来て、接吻の合図で、イエスを捕らえさせた。そばにいた一人が剣を抜き、大祭司のしもべの耳を切り落とした。弟子たちは、みな逃げた。イエスは、大祭司のもとへ連れていかれ、最高法院の議員たちが、死刑にする証言を探した。大祭司の問いに、イエスは、メシアかと問われ、「そうです」と答えた。ペトロは、中庭で、三度、イエスを知らないと言い、鶏が二度鳴いたとき、イエスの言葉を思い出して泣いた（マルコ14:43〜72）。",s:"聖書本文 マルコ14:32〜52、14:53〜72（esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",x:"諸説",t:"ヨハネ福音書では、剣を抜いたのはペトロ、耳を切られたしもべの名はマルコスとされ、接吻の場面はなく、イエスが自分から名乗り出る。逮捕に当たったのは、兵士と、祭司長たちとファリサイ派の役人たち、と書く（ヨハネ18:1〜12）。福音書ごとの違いを、どう理解するかは、見方が分かれる。",s:"esv.org の対照表の要約（読んだ範囲）"},
  {k:"史実",t:"福音書は、イエスの逮捕と尋問の中心にいたのは、「祭司長たち、律法学者たち、長老たち」と、大祭司のもとの人びとだ、と書く。「ユダヤ人全体」ではない。イエスも、弟子たちも、ユダヤ人だった。カトリック教会は、『ノストラ・アエターテ』で、この点にふれている（受難の章のメモを参照）。",s:"聖書本文 マルコ14:43、14:53。教会文書の出典は受難の章のメモを参照"},
  {k:"史実",x:"未確認",t:"最高法院の議会が、夜に、このような形で開かれたことが、当時の法の手続きに合っていたかどうかは、見方が分かれると言われるが、この弾では、出典を確かめていない。大祭司の屋敷の場所と、大祭司の名前（福音書の本文にあたる範囲では確認していない）も、未確認。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。中庭のたき火と、鶏（ペトロの否認を示す）は想像で、人びとの姿も想像である。ペトロの涙は、絵にしていない。",s:"制作メモ"}]},

{key:"pilate",nw:"ピラトの裁き",theme:"ピラトのもとで",ref:"マルコ15:1〜20／ルカ23:1〜5",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"総督の官邸（所在は未確認）",mk:"pilate",sc:"pilate",lead:"john",
 arr:["夜が明けると、祭司長たちは、長老たち、律法学者たち、最高法院の全員と協議し、イエスを縛って、ローマの総督ピラトに引き渡した。（マルコ15:1）",
  "ワラオ「ピラトは、イエスに尋ねた。『あなたは、ユダヤ人の王か』。（15:2）」",
  "ワラオ「ルカ福音書では、祭司長たちは、イエスが、民を惑わし、皇帝への納税を禁じ、自分を王だと言っている、と訴えた。（ルカ23:2）」"],
 q:"ワラオ「ピラトに、『あなたはユダヤ人の王か』と聞かれて、イエスは、何と答えたと書かれているかな？」",
 ch:[
  {l:"「それは、あなたが言っていることだ」という趣旨の答え。",sc:3,t:["ワラオ「そう。『あなたが、そう言っている』という趣旨の答えだ。（マルコ15:2）　祭司長たちが、いろいろと訴えても、イエスは、もう何も答えず、ピラトは、驚いた。（15:3〜5）」"]},
  {l:"「そうだ。わたしは、ローマに対する王だ」と答えた。",sc:2,t:["ワラオ「そうは、書かれていないんだ。『あなたが、そう言っている』という答えだ。（15:2）」"]},
  {l:"「いいえ、そんなことは、決してない」と強く否定した。",sc:1,t:["ワラオ「強く否定した、とも、書かれていないよ。（15:2）　そして、そのあとは、何も答えなかった。（15:5）」"]}],
 res:"ピラトは、祭りのたびに、囚人を一人、赦免する慣わしに従い、イエスを赦そうとした。しかし、祭司長たちにあおられた群衆は、暴動で人を殺した、バラバを求めた。ピラトは、群衆を満足させようとして、バラバを赦免し、イエスをむち打たせたうえで、十字架につけるために引き渡した。（マルコ15:6〜15）",
 memo:[
  {k:"聖書の記述",t:"祭司長たちは、イエスをピラトに引き渡した。ピラトは「ユダヤ人の王か」と尋ね、イエスは「あなたが言っている」と答え、そのあとは答えなかった。祭りの慣わしで、ピラトは、イエスを赦そうとしたが、祭司長たちにあおられた群衆は、バラバを求めた。ピラトは、群衆を満足させようとして、バラバを赦免し、イエスをむち打たせ、十字架につけるために引き渡した。兵士たちは、イエスを紫の衣と茨の冠で嘲り、そのあと、十字架につけるために連れ出した（マルコ15:1〜20）。ルカ福音書では、ピラトは「この人に罪は見いだせない」と言った（ルカ23:4）。",s:"聖書本文 マルコ15:1〜20、ルカ23:1〜12（esv.org の要約を読んだ範囲）"},
  TACITUS,
  {k:"史実",x:"未確認",t:"ピラトが総督（長官）としてユダヤを治めた年と、その後の解任の経緯は、この弾では、出典を確かめていない。総督の官邸（プラエトリウム）が、エルサレムのどこにあったかは、見方が分かれるとされるが、これも、出典は未確認。バラバの赦免の「慣わし」が、聖書以外の資料で確かめられるかも、未確認。",s:"出典未確認。BAS Library の該当記事は、本文の一部のみ確認"},
  {k:"史実",x:"諸説",t:"福音書は、ピラトを、イエスの無罪を認めながら、群衆の圧力に折れた人として書く。一方、ほかの資料に描かれるピラトは、厳しい支配者として語られることもあり、福音書の描き方が、どのような意図によるのかは、見方が分かれる。この章は、その答えを、決めない。",s:"BAS Library「Pontius Pilate: Recalled and Recycled」の脚注の一部（読んだ範囲）。解釈は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。官邸の柱や、総督の椅子は想像で、実際の姿は伝えられていない。むち打ちと、茨の冠は、絵にしていない。",s:"制作メモ"}]},

{key:"antipas",nw:"ヘロデ・アンティパス",theme:"ヘロデ・アンティパスのもとで",ref:"ルカ23:6〜12",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレム（ヘロデの滞在先は未確認）",mk:"antipas",sc:"antipas",lead:"esther",
 arr:["ルカ福音書によると、ピラトは、イエスがガリラヤ出身だと知ると、ガリラヤを治めるヘロデのもとへ、イエスを送った。ヘロデも、そのころ、エルサレムにいた。（ルカ23:6〜7）",
  "イクミ「このヘロデは、ヘロデ・アンティパスと呼ばれる人。ガリラヤとペレアの領主（テトラルケス）だった。（ユダヤ百科事典の記述）」",
  "イクミ「ヘロデは、イエスに会えて、とても喜んだ。ずっと前から会いたいと思っていて、何か、しるしを見たいと願っていたからだ、と書かれている。（23:8）」"],
 q:"イクミ「ヘロデは、イエスにいろいろと尋ねた。イエスは、どう答えたと書かれているかな？」",
 ch:[
  {l:"何も、答えなかった。",sc:3,t:["イクミ「そう。ヘロデは、いろいろと尋ねたけれど、イエスは、何も答えなかった、と書かれている。（ルカ23:9）　祭司長たちと律法学者たちは、そばで激しく訴えた。（23:10）」"]},
  {l:"ヘロデの前で、しるしを見せた。",sc:2,t:["イクミ「そうは書かれていないんだ。何も答えなかった。（23:9）」"]},
  {l:"神の国について、長く語った。",sc:1,t:["イクミ「長く語った、とも書かれていないよ。ヘロデが多く尋ねても、何も答えなかった。（23:9）」"]}],
 res:"ヘロデは、兵士たちと一緒に、イエスをあざけり、はなやかな衣を着せて、ピラトに送り返した。この日、ヘロデとピラトは、それまで仲が悪かったのに、友だちになった、と書かれている。（ルカ23:11〜12）",
 memo:[
  {k:"聖書の記述",t:"ピラトが、イエスをヘロデに送ると、ヘロデは喜び、何かしるしを見たいと願って、いろいろと尋ねたが、イエスは、何も答えなかった。祭司長たちと律法学者たちは、激しく訴えた。ヘロデは、兵士たちとイエスをあざけり、はなやかな衣を着せて、ピラトに送り返した。ヘロデとピラトは、この日、友だちになった（ルカ23:6〜12）。",s:"聖書本文 ルカ23:1〜12（esv.org の要約を読んだ範囲）"},
  {k:"史実",t:"ヘロデ・アンティパスは、父ヘロデ大王の遺言（紀元前4年ごろ）で、ガリラヤとペレアの領主となった。ティベリアスの町を、紀元24〜26年のあいだに建て、皇帝ティベリウスにちなんで名づけた。紀元39年ごろ、皇帝カリグラによって、ガリア（ルグドゥヌム）へ追放された。同じ記事は、洗礼者ヨハネが、ヘロデの結婚を公然と批判したと述べ、ヨハネの首の話は、誇張だろうとみている。",s:"Jewish Encyclopedia「Antipas (Herod Antipas)」（jewishencyclopedia.com。読んだ範囲）"},
  {k:"史実",x:"未確認",t:"ヘロデが、エルサレムのどこに滞在していたかは、聖書に書かれていない。ほかの福音書に、この出来事があるかどうかも、この弾では、確かめていない。「はなやかな衣」の詳しい様子（色や材質）は、未確認。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。広間の様子や、ヘロデの姿は想像で、実際の姿は伝えられていない。衣は、白い布として、わきに置いた。人に向けたあざけりの場面は、絵にしていない。",s:"制作メモ"}]},

{key:"roadcross",nw:"十字架への道",theme:"十字架への道",ref:"マルコ15:20〜21",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレムの町から刑場へ",mk:"roadcross",sc:"roadcross",lead:"miguel",
 arr:["兵士たちは、イエスを、十字架につけるために連れ出した。（マルコ15:20）",
  "ツチオ「そのとき、アレクサンドロとルフォスの父で、シモンという、キレネ出身の人が、田舎から来て、そこを通りかかった。（15:21）」",
  "ツチオ「兵士たちは、この人に、無理に、イエスの十字架を担がせた、と書かれている。（15:21）」",
  "ツチオ「そのあと、一行は、ゴルゴタ、『されこうべの場所』と呼ばれる所へ、イエスを連れていった。（15:22）」"],
 q:"ツチオ「兵士たちに、無理やり十字架を担がされたのは、だれだったかな？」",
 ch:[
  {l:"キレネ出身のシモン。",sc:3,t:["ツチオ「そう。キレネ人シモン。（マルコ15:21）　『アレクサンドロとルフォスの父』とわざわざ書かれているのは、読者が、その息子たちを知っていたからでは、と読まれることもあるけれど、これは推測だよ。」"]},
  {l:"弟子のペトロ。",sc:2,t:["ツチオ「ペトロではないんだ。通りかかった、キレネ出身のシモンだ。（15:21）」"]},
  {l:"アリマタヤのヨセフ。",sc:1,t:["ツチオ「ヨセフは、あとで、遺体を引き取った人だよ。（15:43）　十字架を担いだのは、キレネ出身のシモンだ。（15:21）」"]}],
 res:"兵士たちは、没薬を混ぜたぶどう酒を、イエスに差し出したが、イエスは、受け取らなかった。（マルコ15:23）　それから、イエスを十字架につけた。（15:24）",
 memo:[
  {k:"聖書の記述",t:"兵士たちは、紫の衣を脱がせ、イエスの服を着せて、十字架につけるために連れ出した。通りかかった、キレネ出身のシモン（アレクサンドロとルフォスの父）を、無理に、十字架を担がせた。一行は、ゴルゴタ（「されこうべの場所」）に着いた（マルコ15:20〜22）。",s:"聖書本文 マルコ15:20〜22（esv.org の要約を読んだ範囲）"},
  {k:"伝承",t:"のちに、エルサレムの町の中の、イエスが歩いたとされる道を、「ヴィア・ドロローサ（悲しみの道）」と呼び、巡礼者がたどるようになった。これは、福音書の記述ではなく、時代を経て、形づくられた信仰の道である。「十字架の道行き（ステーション）」は、起源がはっきりせず、15世紀ごろまでに、今に近い形になり、1731年に、教皇クレメンス12世が、14か所と定めた、と、読んだ資料にある。",s:"Origins of the Stations of the Cross（secularfranciscansusa.org の PDF。読んだ範囲）"},
  {k:"史実",x:"未確認",t:"道行きの個々の場面（たとえば、イエスが三度倒れた、ヴェロニカが顔をぬぐった、など）は、福音書の本文には書かれていない、と、読んだ資料は述べるが、各場面の出典の詳細は、この弾では確かめていない。ヨハネ福音書が、イエス自身が十字架を担いだように書く、とされる点も、本文は確認していない。担がされたのが、十字架の横木か、全体かも、未確認。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。石畳の町の道は想像で、時代考証は、出典で確かめていない。イエスの姿は描かず、シモンが、横木を担ぐ様子だけを、遠景で表した。",s:"制作メモ"}]}
);

 arr:["兵士たちは、イエスを十字架につけ、その服を、くじで分けた。午前九時（第三の時）だった。（マルコ15:24〜25）",
  "イワオ「この絵では、遠くに、三本の十字架の影が、見えるだけにしてあるんだ。」",

  "イワオ「正午から午後三時まで、全地が暗くなった、と書かれている。（15:33）　午後三時に、イエスは、大声で叫び、息を引き取った。（15:34、37）」"],

 ch:[
  {l:"「ユダヤ人の王」。",sc:3,t:["イワオ「そう。『ユダヤ人の王』と書いてあった。（マルコ15:26）　イエスが亡くなったとき、そばに立っていた百人隊長は、『まことに、この人は神の子だった』と言った、と書かれている。（15:39）」"]},
  {l:"「神の子」。",sc:2,t:["イワオ「『神の子』という言葉は、百人隊長の言葉として出てくる。（15:39）　罪状書きは、『ユダヤ人の王』だ。（15:26）」"]},
  {l:"「ナザレの大工」。",sc:1,t:["イワオ「そうは書かれていないよ。『ユダヤ人の王』だ。（15:26）」"]}],
 res:"遠くから見ていた女たちの中には、マグダラのマリアたちがいた。（マルコ15:40〜41）　夕方、議員のアリマタヤのヨセフが、ピラトに願い出て、遺体を引き取り、亜麻布に包んで、岩に掘った墓に納め、入口に石を転がした。（15:42〜46）",
 memo:[
  {k:"聖書の記述",t:"イエスは、ゴルゴタで十字架につけられ、服はくじで分けられた。罪状書きは「ユダヤ人の王」。両側に二人の強盗がいた。通りかかる人びとや、祭司長たち、律法学者たち、一緒に十字架につけられた人びとが、イエスをののしった。正午から三時まで、全地が暗くなり、三時に、イエスは、詩編22編の言葉（「わが神、わが神、なぜわたしをお見捨てになったのですか」）を叫び、息を引き取った。神殿の垂れ幕が上から下まで裂け、百人隊長は「まことに、この人は神の子だった」と言った。女たちが遠くから見ていた。アリマタヤのヨセフが、遺体を引き取って葬った（マルコ15:22〜47）。",s:"聖書本文 マルコ15:20〜47（esv.org の要約を読んだ範囲）"},
  TACITUS,
  {k:"史実",x:"未確認",t:"十字架の年は、紀元30年とする説と、33年とする説などがあると言われるが、この弾では、その出典を確認していない。ゴルゴタの場所は、伝承と、聖墳墓教会の位置が、よく知られるが、これも、出典は未確認。「詩編22編の引用」の読み方、神殿の垂れ幕の意味、「第三の時」「第六の時」が現在の何時にあたるか（午前9時、正午、午後3時と、読んだ要約は示す）の扱いも、見方が分かれる。",s:"（未確認）"},
  NOSTRA,
  {k:"想像",t:"場面の絵は想像の絵。十字架は、遠景の影だけで描き、イエスの姿は描かない。血や傷は、描かない。女たちは、遠くから見守る小さな姿で表した。",s:"制作メモ"}]});

 arr:["同じ日、イエスの弟子二人が、エルサレムから、エマオという村へ向かっていた。道のりは、六十スタディオン（約11キロとされる）ほどだった。（ルカ24:13）",
  "イクミ「二人は、これまでのできごとを、語り合っていた。そこへ、イエスが近づいて、一緒に歩き出したけれど、二人の目は、さえぎられて、イエスだと分からなかった、と書かれている。（24:14〜16）」",

  "イクミ「夕方、村に着くと、二人は、『一緒にお泊まりください』と引き止めた。イエスは、中に入った。（24:28〜29）」"],
 q:"イクミ「二人が、その人がイエスだと気づいたのは、いつだったと書かれているかな？」",
 ch:[
  {l:"食卓で、パンを取って祝福し、裂いて渡したとき。",sc:3,t:["イクミ「そう。パンを取り、祝福して裂き、渡したとき、二人の目が開かれて、イエスだと分かった。そのとたん、イエスの姿は見えなくなった。（ルカ24:30〜31）　二人は、『道で話しているとき、わたしたちの心は、燃えていたではないか』と言い合って、すぐにエルサレムへ戻った。（24:32〜33）」"]},
  {l:"道で、聖書の説明を聞いている間に、気づいた。",sc:2,t:["イクミ「道では、まだ、気づいていないんだ。そのあとで、『心は燃えていたではないか』と、振り返っている。（24:32）」"]},
  {l:"空の墓を、自分の目で見たとき。",sc:1,t:["イクミ「二人は、墓に行っていないんだ。仲間の何人かが、墓を見に行って、空だったと言った、と話している。（24:22〜24）」"]}],
 res:"エルサレムでは、十一人と、仲間たちが集まっていて、「主は、本当に復活して、シモンに姿を現された」と言っていた。二人も、道での出来事と、パンを裂くときにイエスだと分かったことを、話した。（ルカ24:33〜35）",
 memo:[
  {k:"聖書の記述",t:"復活の日、二人の弟子が、エマオへ向かう道で、イエスに出会ったが、目をさえぎられて、気づかなかった。イエスは、聖書全体から、自分について書かれたことを説き明かした。夕方、村で食卓を囲み、イエスがパンを取って祝福し、裂いて渡すと、二人の目が開かれ、イエスだと分かった。イエスの姿は消えた。二人は、すぐにエルサレムに戻り、十一人と仲間たちに、そのことを伝えた（ルカ24:13〜35）。",s:"聖書本文 ルカ24:13〜35（esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"エマオは、エルサレムから「六十スタディオン」、読んだ英訳の注では、約7マイルの距離にある村とされる（ルカ24:13）。もう一人の弟子の名前は、書かれていない。",s:"聖書本文 ルカ24:13、24:18（esv.org の要約を読んだ範囲）"},
  {k:"史実",x:"未確認",t:"エマオが、現在のどこにあたるかは、この弾では、確かめていない（複数の説があるとされるが、出典は未確認）。クレオパが、どのような人物だったかも、未確認。「パンを裂く」という記述が、教会の聖餐の理解とどのように結びついているかも、各教会の公式な見解を、この弾では、確かめていない。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"この出来事を、歴史の中で確かめる方法はない。聖書の記述として語る。復活のイエスが、二人の目に、なぜすぐに分からなかったのかは、福音書は「目がさえぎられていた」と書くだけで、その意味の読み方は、見方が分かれる。",s:"聖書本文の表現に基づく制作メモ。解釈の出典は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。道と夕日、村の家の形は想像で、時代考証は、出典で確かめていない。イエスの姿は想像で、実際の姿は伝えられていない。",s:"制作メモ"}]},

{key:"thomas",nw:"トマスの疑い",theme:"トマスの疑い",ref:"ヨハネ20:19〜31",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレム（弟子たちの集まった家）",mk:"thomas",sc:"thomas",lead:"miguel",
 arr:["復活の日の夕方、弟子たちは、ユダヤ人を恐れて、戸に鍵をかけて、家の中にいた。（ヨハネ20:19）",
  "ツチオ「そこへ、イエスが来て、真ん中に立ち、『あなたがたに平和があるように』と言った。そして、手とわき腹を見せた。弟子たちは、主を見て、喜んだ。（20:19〜20）」",
  "ツチオ「ところが、十二人の一人、『双子』と呼ばれるトマスは、イエスが来たとき、一緒にいなかった。（20:24）」",
  "ツチオ「ほかの弟子たちは、トマスに、『わたしたちは、主を見た』と言った。（20:25）」"],
 q:"ツチオ「それを聞いたトマスは、何と言ったと書かれているかな？」",
 ch:[
  {l:"手の釘の跡を見て、指を入れ、わき腹に手を入れてみなければ、決して信じない、と言った。",sc:3,t:["ツチオ「そう。『あの方の手に釘の跡を見、そこに指を入れ、わき腹に手を入れてみなければ、わたしは決して信じない』と言った。（ヨハネ20:25）　八日後、イエスが、また来て、トマスに、手とわき腹を見るように言った。トマスは、『わたしの主、わたしの神よ』と答えた。（20:26〜28）」"]},
  {l:"すぐに、信じた。",sc:2,t:["ツチオ「すぐには、信じなかったと書かれている。見て、確かめなければ信じない、と言ったんだ。（20:25）」"]},
  {l:"何も言わずに、家を出ていった。",sc:1,t:["ツチオ「出ていった、とは、書かれていないよ。『見なければ、決して信じない』と言った。（20:25）」"]}],
 res:"イエスは、トマスに、「わたしを見たから信じたのか。見ないのに信じる人は、幸いである」と言った。（ヨハネ20:29）　ヨハネは、この書物は、イエスが神の子メシアであると信じ、その名によって命を得るために書かれた、と記す。（20:30〜31）",
 memo:[
  {k:"聖書の記述",t:"復活の日の夕方、イエスは、鍵をかけた部屋の弟子たちの真ん中に立ち、「平和があるように」と言い、手とわき腹を見せた。トマスは、その場にいなかった。仲間の話を聞いたトマスは、釘の跡を見て、指とわき腹に手を入れなければ信じない、と言った。八日後、イエスが再び現れ、トマスに「疑わないで、信じる者になりなさい」と言った。トマスは、「わたしの主、わたしの神よ」と答えた（ヨハネ20:19〜28）。",s:"聖書本文 ヨハネ20:19〜31（esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",x:"諸説",t:"読んだ要約では、トマスが、実際に傷に触れた、とは書かれていない。トマスは、イエスの言葉に応えて「わたしの主、わたしの神よ」と言った、とある。触れたかどうかを、本文からどう読むかは、見方が分かれると言われるが、この弾では、本文の原文を、確かめていない。",s:"聖書本文 ヨハネ20:27〜28（esv.org の要約。本文全体は未確認）"},
  {k:"聖書の記述",t:"ヨハネ福音書は、このあと、本書は、イエスのなさったほかの多くのしるしの一部で、人びとが、イエスが神の子メシアだと信じ、その名によって命を得るために書かれた、と記す（20:30〜31）。",s:"聖書本文 ヨハネ20:30〜31（要約）"},
  {k:"史実",x:"未確認",t:"「疑うトマス」という呼び名は、のちの時代のものとされるが、この弾では、由来を確かめていない。トマスが、その後、どこへ行ったか（インドへ伝わった、という伝承が知られるが）についても、出典は未確認。ここでは、聖書の記述だけを語る。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。部屋と、鍵のかかった戸は想像で、弟子たちの姿も想像である。傷の跡は、絵にしていない。",s:"制作メモ"}]},

{key:"ascension",nw:"昇天",theme:"昇天",ref:"使徒言行録1:1〜11",per:"受難と復活",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレム近く（所在は未確認）",mk:"ascension",sc:"ascension",lead:"john",

  {l:"四十日にわたって。",sc:3,t:["ワラオ「そう。『四十日にわたって』と書かれている。（使徒言行録1:3）　弟子たちは、『イスラエルのために、国を建て直すのは、この時ですか』と尋ねた。イエスは、時と時期は、父が決めることだ、と答えた。（1:6〜7）」"]},
  {l:"三日間だけ。",sc:2,t:["ワラオ「三日間、とは書かれていないんだ。『四十日にわたって』と書かれている。（1:3）」"]},
  {l:"七日間。",sc:1,t:["ワラオ「七日間、とも書かれていないよ。『四十日にわたって』だ。（1:3）」"]}],
 res:"イエスは、「聖霊があなたがたに降るとき、あなたがたは力を受け、エルサレム、ユダヤとサマリア、地の果てまで、わたしの証人となる」と言った。（1:8）　そう言ったあと、弟子たちが見ているうちに、イエスは上げられ、雲に覆われて、見えなくなった。白い衣の二人の人が、「なぜ天を見上げて立っているのか。あなたがたから天に上げられたイエスは、同じ有様で、またおいでになる」と言った。（1:9〜11）",
 memo:[
  {k:"聖書の記述",t:"イエスは、復活のあと、四十日にわたって、弟子たちに現れ、神の国について語った。「エルサレムを離れず、父の約束を待ちなさい」と命じ、「聖霊が降るとき、あなたがたは、エルサレム、ユダヤとサマリア、地の果てまで、わたしの証人となる」と告げた。そのあと、弟子たちの見ているうちに、イエスは上げられ、雲に覆われて見えなくなった。白い衣を着た二人の人が、「同じ有様で、またおいでになる」と告げた（使徒言行録1:1〜11）。",s:"聖書本文 使徒言行録1:1〜11（esv.org の要約を読んだ範囲）"},
  {k:"史実",x:"未確認",t:"昇天の場所（オリーブ山とされることが多い）は、読んだ範囲の本文（1:1〜11）には、書かれていない。ルカ福音書の最後（24:50〜53）にも、昇天の記述があるが、この弾では、本文を確認していない。「四十日」と、ルカ福音書の書き方の関係の読み方も、見方が分かれるとされるが、出典は未確認。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"この出来事を、歴史の中で確かめる方法はない。聖書の記述として語る。「天に上げられた」という表現が、何を意味するかは、教派や研究者によって、見方が分かれる。教会は、この出来事を祝う祭日（昇天日）を持つとされるが、公式資料は、この弾では確認していない。",s:"制作メモ。解釈の出典は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。イエスの姿は描かず、光と雲だけで表した。白い衣の二人は、翼のない人の姿で描いた。弟子たちの姿は想像で、実際の姿は伝えられていない。",s:"制作メモ"}]}

{key:"stephen",nw:"ステファノ",theme:"ステファノの証言",ref:"使徒言行録6:8〜8:1",per:"使徒たち",era:"紀元後1世紀前半（年代は諸説）",place:"エルサレム（最高法院）",mk:"stephen",sc:"stephen",lead:"john",
 arr:["初めの教会で、ギリシア語を話すユダヤ人の寡婦たちが、毎日の分配で見落とされている、という不満が出た。使徒たちは、七人を選んで、その世話を任せた。その一人が、ステファノだった。（使徒言行録6:1〜6）",
  "ワラオ「ステファノは、恵みと力に満ちて、人びとの間で、大きな不思議としるしを行った、と書かれている。（6:8）」",
  "ワラオ「それに反対する人びとは、ステファノを、モーセと神を冒涜した、と訴えて、最高法院に引き出した。（6:11〜12）」",
  "ワラオ「ステファノは、大祭司の問いに、アブラハム、ヨセフ、モーセ、神殿の歴史を、長く語った。（7:1〜50）」",
  "ワラオ「この章は、暴力の場面を、絵にしない。語られた言葉だけを、聞いてほしい。」"],
 q:"ワラオ「ステファノは、最期のとき、どう祈ったと書かれているかな？」",

  {l:"主よ、この罪を彼らに負わせないでください。",sc:3,t:["ワラオ「そう。『主イエスよ、わたしの霊をお受けください』と祈り、そのあと、ひざまずいて、『主よ、この罪を彼らに負わせないでください』と、大声で叫んだ、と書かれている。（使徒言行録7:59〜60）　その場にいた人びとの上着は、サウロという若者の足もとに置かれた。サウロは、ステファノの殺害に賛成していた、と書かれている。（7:58、8:1）」"]},
  {l:"主よ、彼らに、ふさわしい裁きを下してください。",sc:2,t:["ワラオ「そうは書かれていないんだ。『この罪を、彼らに負わせないでください』と祈った。（7:60）」"]},
  {l:"主よ、わたしを、この場から、お救いください。",sc:1,t:["ワラオ「助けを求めた、とは書かれていないよ。『わたしの霊をお受けください』『この罪を、彼らに負わせないでください』と祈った。（7:59〜60）」"]}],
 res:"この日、エルサレムの教会に対する、大きな迫害が起こり、使徒たちのほかは、みな、ユダヤとサマリアの地方に散らされた。（8:1）　この出来事のあと、サウロが、教会を荒らし、家々に押し入って、男女を引き出し、牢に入れた、と書かれている。（8:3）",
 memo:[
  {k:"聖書の記述",t:"ギリシア語を話すユダヤ人の寡婦への分配の不満から、使徒たちは七人を選んだ（ステファノ、フィリポ、ニコラオスほか）。ステファノは、恵みと力に満ちて、人びとの間で不思議としるしを行い、冒涜の罪で、最高法院に訴えられた。ステファノは、アブラハム、ヨセフ、モーセ、神殿の歴史を語り、聞く者たちが、聖霊に逆らってきた、と責めた。聞いた人びとは、怒り、ステファノを町の外に連れ出した。ステファノは、「主イエスよ、わたしの霊をお受けください」「主よ、この罪を彼らに負わせないでください」と祈り、眠りについた。サウロが、それに賛成していた。この日、エルサレムの教会への大きな迫害が始まった（使徒言行録6:1〜8:1）。",s:"聖書本文 使徒言行録6〜8:1（esv.org の要約を読んだ範囲）"},
  {k:"史実",x:"諸説",t:"この出来事の年代は、福音書の記述（イエスの十字架の年）と、パウロの回心の年の、どちらにも関わるが、数字を確定する材料は、この弾では、確かめていない。ステファノの演説の、歴史の語り方（創世記や出エジプト記との違いなど）の評価も、研究者によって見方が分かれるとされるが、出典は未確認。",s:"出典未確認"},
  {k:"史実",x:"未確認",t:"ステファノを訴えた「いくつかの会堂」の人びとが、どのような人びとだったかは、この弾では、確かめていない。最高法院が、このとき、死刑を執行する権限を持っていたかどうかも、見方が分かれるとされるが、出典は未確認。「殉教者」という呼び方（ステファノは、教会史で、最初の殉教者とされる）の、各教会での位置づけも、未確認。",s:"出典未確認"},
  {k:"史実",t:"ステファノの死に賛成していたサウロは、のちに、ダマスコ途上で、イエスに出会い、パウロとなった、と使徒言行録は書く（使徒言行録9章）。この旅では、その出来事を、次の章で扱う。",s:"聖書本文 使徒言行録8:1（要約）。回心の章は、ダマスコの章を参照"},
  {k:"想像",t:"場面の絵は想像の絵。最高法院の広間と光は想像で、ステファノの姿も想像である。石打ちや傷つく場面は、描いていない。サウロは、絵に描いていない。",s:"制作メモ"}]},

{key:"cornelius",nw:"コルネリウスと、ペトロの幻",theme:"ペトロと百人隊長コルネリウス",ref:"使徒言行録10章",per:"使徒たち",era:"紀元後1世紀（年代は諸説）",place:"ヨッパとカイサリア",mk:"cornelius",sc:"cornelius",lead:"pierre",
 arr:["カイサリアに、コルネリウスという百人隊長がいた。イタリア隊に属し、神を畏れ、民に多くの施しをし、絶えず神に祈っていた。（使徒言行録10:1〜2）",
  "ナゴム「ある日の午後三時ごろ、コルネリウスは、神の使いを見た。使いは、ヨッパにいるシモン・ペトロを招くように、と言った。（10:3〜6）」",

  "ナゴム「声が、『ペトロよ、屠って食べなさい』と言った。ペトロは、『とんでもないことです。清くない物は、口にしたことがありません』と答えた。（10:13〜14）」"],

 res:"ペトロは、コルネリウスの家へ行き、「どんな人をも、清くないとか、汚れているとか言ってはならない、と、神は、わたしに示された」と話した。（10:28）　ペトロが話している間に、聖霊が、聞いていたすべての人の上に降った。ペトロは、彼らに、イエス・キリストの名によって、洗礼を授けるよう命じた。（10:44、48）",
 memo:[
  {k:"聖書の記述",t:"カイサリアの百人隊長コルネリウスは、神の使いの幻を見て、ヨッパのペトロを招いた。ペトロは、同じ頃、屋上で、獣や鳥の入った大きな布が降りてくる幻を三度見て、「神が清めた物を清くないと言ってはならない」と告げられた。霊に促されたペトロは、ヨッパの兄弟たちと共に、カイサリアのコルネリウスの家へ行き、「神は人を分け隔てなさらない」と語った。聖霊が、聞いていた人びとに降り、ペトロは、洗礼を授けるよう命じた（使徒言行録10章）。",s:"聖書本文 使徒言行録10章（esv.org の要約を読んだ範囲）"},
  {k:"史実",x:"諸説",t:"この出来事は、ユダヤ人でない人びと（異邦人）が、教会に加わる最初の大きな出来事として語られることが多い。ただし、この章が、食べ物の決まりについての教えなのか、人びとについての教えなのかなど、読み方は、教派や研究者によって分かれる。この弾は、本文が語る範囲に留め、その後の議論は、次の「エルサレム会議」の章で扱う。",s:"制作メモ。解釈の出典は未確認"},
  {k:"史実",x:"未確認",t:"「イタリア隊」が、どのような部隊で、カイサリアに、いつ駐屯していたかは、この弾では、確かめていない。コルネリウスが、実在した人物かどうかを確かめる資料も、確認していない。ペトロがいた皮なめし職人シモンの家の場所も、未確認。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。屋上の様子と、天から降りる布は想像である。布の中の動物は、小さな丸で表し、種類は描き分けていない。ペトロやコルネリウスの姿は想像で、実際の姿は伝えられていない。",s:"制作メモ"}]},

{key:"council",nw:"エルサレム会議",theme:"エルサレム会議",ref:"使徒言行録15:1〜35",per:"使徒たち",era:"紀元後1世紀中ごろ（年代は諸説）",place:"エルサレム",mk:"council",sc:"council",lead:"cross",
 arr:["アンティオキアに、ユダヤから来た人びとがいて、「モーセの慣習に従って割礼を受けなければ、救われない」と教えていた。（使徒言行録15:1）",
  "イワオ「パウロとバルナバは、それに強く反対した。教会は、この問題を相談するため、パウロとバルナバたちを、エルサレムの使徒や長老たちのところへ送った。（15:2）」",
  "イワオ「エルサレムでは、多くの議論のあと、ペトロが、立って話した。神は、わたしたちと同じように、聖霊を、ユダヤ人でない人びとにも与えた。わたしたちは、主イエスの恵みによって、救われると信じている、と。（15:7〜11）」",
  "イワオ「パウロとバルナバが、神が異邦人の間で行ったしるしを話すと、会衆は静まった。そのあと、ヤコブが、結論を述べた。（15:12〜13）」"],
 q:"イワオ「会議のあと、教会が、異邦人の信者に宛てた手紙は、何を避けるよう求めたと書かれているかな？」",
 ch:[
  {l:"偶像に供えた物、血、絞め殺した動物の肉、みだらな行い。",sc:3,t:["イワオ「そう。『偶像に供えた物と、血と、絞め殺した物と、みだらな行いとを避けなさい』と書かれている。割礼は、求めなかった。（使徒言行録15:19〜20、28〜29）　この手紙は、ユダとシラスが、アンティオキアへ運び、人びとは、その励ましを喜んだ、と書かれている。（15:22、30〜31）」"]},
  {l:"すべての人が、割礼を受けること。",sc:2,t:["イワオ「そうは書かれていないんだ。ヤコブは、異邦人の信者を悩ませてはならない、と判断した。割礼は、求められていない。（15:19）」"]},
  {l:"何も、避けなくてよいこと。",sc:1,t:["イワオ「何も求めなかった、のではないんだ。偶像に供えた物、血、絞め殺した物、みだらな行いを避けるように、という手紙だった。（15:20、29）」"]}],
 res:"アンティオキアの人びとは、手紙を読んで、励ましに喜んだ。ユダとシラスは、預言者でもあり、多くの言葉で、兄弟たちを励ました。パウロとバルナバは、アンティオキアにとどまり、教えた。（15:30〜35）",
 memo:[
  {k:"聖書の記述",t:"アンティオキアで、ユダヤから来た人びとが、異邦人の信者にも割礼を求めたため、パウロとバルナバは、エルサレムの使徒と長老たちのもとへ行った。ペトロは、神が異邦人にも聖霊を与えたこと、人は主イエスの恵みによって救われることを語った。パウロとバルナバは、異邦人の間で神が行った、しるしと不思議を語った。ヤコブは、異邦人の信者に、偶像に供えた物、みだらな行い、絞め殺した物、血を避けるよう手紙を書く、と判断した。手紙は、ユダ（バルサバ）とシラスが運んだ（使徒言行録15:1〜35）。",s:"聖書本文 使徒言行録15:1〜35（esv.org の要約を読んだ範囲）"},
  {k:"史実",x:"未確認",t:"この会議が開かれた年は、この弾では、確かめていない。パウロ自身の手紙（ガラテヤ2章）に、似た内容の、エルサレムでの会談が書かれており、使徒言行録の会議と、同じ出来事かどうかについては、見方が分かれると言われるが、この弾では、ガラテヤ書の本文を、確認していない。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"手紙の四つの禁止（偶像に供えた物など）が、どのような意味を持ち、のちの教会で、どう守られた（あるいは守られなかった）かは、教派によって、見方が分かれる。この弾では、各教会の公式な見解を、確認していない。",s:"出典未確認"},
  {k:"史実",t:"この会議は、ユダヤ人として生まれたイエスの弟子たちの集まりが、ユダヤ人でない人びとを、どのように迎えるかを、話し合った出来事として語られる。ヤコブは、イエスの弟のヤコブ、とする見方があるが、この弾では、使徒言行録の本文だけでは、確かめていない。",s:"聖書本文 使徒言行録15:13。ヤコブの人物像は未確認"},
  {k:"想像",t:"場面の絵は想像の絵。会議の広間と、手紙の巻物は想像で、人びとの姿も想像である。実際の会議の様子は、伝えられていない。",s:"制作メモ"}]},

{key:"mission2",nw:"コリントからローマへ",theme:"パウロの旅 — コリント、そしてローマへ",ref:"使徒言行録18章、28章",per:"使徒たち",era:"紀元後1世紀中ごろ（年代は諸説）",place:"コリント〜ローマ",mk:"mission2",sc:"mission",lead:"esther",
 arr:["パウロは、アテネを出て、コリントに行った。そこで、アキラとプリスキラという夫婦に出会った。二人は、クラウディウス帝が、ユダヤ人をローマから退去させる命令を出したので、イタリアから来た人たちだった。（使徒言行録18:1〜2）",
  "イクミ「パウロは、この夫婦と同じ天幕作りの仕事をしながら、毎週の安息日に、会堂で語った。（18:3〜4）」",
  "イクミ「パウロは、そこに、一年六か月、とどまった、と書かれている。（18:11）　そのあと、アカイア州の総督ガリオの前に、訴えられた。（18:12〜13）」",
  "イクミ「ギリシアのデルフォイで見つかった石の碑文に、ガリオの名前がある。」",
  "イクミ「この碑文は、パウロの旅の年代を考えるときの、手がかりになっているんだ。」"],
 q:"イクミ「その碑文に、名前が書かれていたのは、だれかな？」",
 ch:MO_OLD.ch.map(o=>Object.assign({},o,{t:o.t.map(x=>x.split('ワラオ').join('イクミ'))})),
 res:"パウロは、その後、エフェソなどにも滞在した、と書かれている。使徒言行録は、最後に、パウロが、囚人としてローマに着き、自分の借りた家に二年間とどまって、「少しもはばかることなく、また妨げられることもなく」神の国を宣べ伝えた、と書いて終わる。（使徒言行録28:30〜31）　パウロの最期は、使徒言行録には、書かれていない。",
 memo:[
  {k:"聖書の記述",t:"パウロは、コリントで、アキラとプリスキラと共に、天幕を作りながら語り、一年六か月とどまった。ユダヤ人たちが、総督ガリオの前にパウロを訴えたが、ガリオは、言葉や名前や、ユダヤ人の律法の問題だとして、裁きを拒んだ（使徒言行録18:1〜17）。のちに、パウロは、囚人としてローマに着き、自分の借りた家に二年間とどまった。使徒言行録は、「少しもはばかることなく、また妨げられることもなく」、神の国を宣べ伝えた、と書いて終わる（28:11〜31）。",s:"聖書本文 使徒言行録18:1〜28、28:11〜31（esv.org／biblia.com の要約を読んだ範囲）"},
  MO_OLD.memo[2],MO_OLD.memo[3],
  {k:"史実",x:"諸説",t:"使徒言行録18:2の「クラウディウス帝のユダヤ人退去令」の年や範囲は、この弾では、確かめていない。ローマ行きの途中の出来事（嵐、難破など）は、使徒言行録27章に書かれるが、この弾では、本文を確認していない。",s:"出典未確認"},
  MO_OLD.memo[5],
  {k:"想像",t:"場面の絵は想像の絵。船の形や、碑文の形、人物の姿は、想像である。碑文の文字は、読める文字では、描いていない。",s:"制作メモ"}]}
);
Object.assign(MO,{nw:"パウロの旅（第一回）",theme:"パウロの旅 — キプロスからリストラへ",ref:"使徒言行録13〜14章",place:"キプロス、小アジアの町々",mk:"mission",sc:"lystra",lead:"john",
 arr:["アンティオキアの教会で、聖霊が「バルナバとサウロを、わたしのために選び出しなさい」と告げた。教会は、断食して祈り、二人に手を置いて、送り出した。（使徒言行録13:1〜3）",
  "ワラオ「二人は、船でキプロス島へ渡った。パフォスで、総督セルギウス・パウルスに会った。『サウロ、またの名をパウロ』と書かれるのは、この場面からだ。（13:4〜12）」",
  "ワラオ「そのあと、小アジアの内陸のアンティオキア、イコニオン、リストラ、デルベなどを巡った。（13:14〜14:21）」",
  "ワラオ「リストラで、パウロは、生まれつき足の不自由な人を、癒した、と書かれている。（14:8〜10）　それを見た群衆は、大声で叫んだ。」"],
 q:"ワラオ「群衆は、バルナバとパウロを、だれだと思ったと書かれているかな？」",
 ch:[
  {l:"バルナバをゼウス、パウロをヘルメスだと思った。",sc:3,t:["ワラオ「そう。『バルナバをゼウス、パウロを、話の中心だったので、ヘルメスと呼んだ』と書かれている。（使徒言行録14:12）　ゼウスの神殿の祭司が、雄牛と花輪を持ってきて、いけにえをささげようとした。パウロとバルナバは、衣を裂いて、『わたしたちも、あなたがたと同じ人間です』と叫んで、止めた。（14:13〜15）」"]},
  {l:"預言者エリヤと、モーセだと思った。",sc:2,t:["ワラオ「そうは書かれていないんだ。ここは、ギリシア語を話す人びとの町で、『ゼウスとヘルメス』と呼んだ。（14:11〜12）」"]},
  {l:"ローマ皇帝の使者だと思った。",sc:1,t:["ワラオ「皇帝の使者、とも書かれていないよ。群衆は、ゼウスとヘルメスの名で呼んだ。（14:12）」"]}],
 res:"そのあと、アンティオキアとイコニオンのユダヤ人たちが、群衆を説き伏せ、パウロを石で打った、と書かれている。弟子たちが取り囲むと、パウロは、起き上がり、町に入った。（14:19〜20）　二人は、各地の教会に長老たちを選び、最後は、アンティオキアに戻って、神が異邦人に信仰の門を開かれたことを報告した。（14:23、27）",
 memo:[
  {k:"聖書の記述",t:"アンティオキアの教会は、聖霊の導きで、バルナバとサウロを送り出した。二人は、キプロスで、総督セルギウス・パウルスに会った。魔術師エリマが目をつぶされ、総督は信じた（13:4〜12）。その後、小アジアの内陸のアンティオキアで、パウロは、会堂で語り、異邦人に向かうと告げた（13:14〜49）。リストラでは、足の不自由な人を癒し、群衆に、ゼウスとヘルメスと呼ばれた（14:8〜18）。パウロは、石で打たれたが、起き上がった。二人は、アンティオキアに戻って、報告した（14:19〜28）。",s:"聖書本文 使徒言行録13〜14章（esv.org の要約を読んだ範囲）"},
  MO_OLD.memo[1],
  MO_OLD.memo[4],
  {k:"史実",x:"未確認",t:"リストラの場所と、ゼウスの神殿が、当時、そこにあったかどうかは、この弾では、確かめていない。バルナバやヨハネ・マルコ（途中で、エルサレムへ帰った、と書かれる）の、その後は、この章では、扱わない。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。神殿の柱や、牛、花輪の形は想像で、実際の町の様子は、伝えられていない。パウロとバルナバの姿も想像である。石打ちは、絵にしていない。",s:"制作メモ"}]});

{key:"fire64",nw:"ローマの大火",theme:"ローマの大火と、キリスト者たち",ref:"タキトゥス『年代記』15巻44節",per:"使徒たち",era:"紀元1世紀（64年とされる）",place:"ローマ",mk:"fire64",sc:"fire64",lead:"miguel",
 arr:["聖書の物語が終わりに近づくころ、ローマの町で、大きな火事が起こった。ローマの歴史家タキトゥスが、のちに、その話を書いている。",
  "ツチオ「ここは、聖書ではなく、聖書の外の歴史資料の話だよ。」",
  "ツチオ「タキトゥスは、『年代記』の15巻44節で、こう書いている。人びとの間に、火事は皇帝の命令で起こった、という、よくない噂が、消えなかった。」",
  "ツチオ「そこで、皇帝ネロは、噂を打ち消すために、民衆が『キリスト者』と呼んでいた人びとに、罪を負わせた、と書かれている。」"],
 q:"ツチオ「タキトゥスは、キリスト者という名前の由来について、何と書いているかな？」",
 ch:[
  {l:"名は、ティベリウス帝の時代に、総督ポンティウス・ピラトゥスに処刑されたキリストスから来た、と書いている。",sc:3,t:["ツチオ「そう。『その名は、ティベリウスの治世に、総督ポンティウス・ピラトゥスによって処刑されたキリストスから来ている』と書かれている。（『年代記』15.44）　ローマの歴史家が、イエスと、その信者について、触れている、数少ない古い記述の一つとして、知られる。」"]},
  {l:"名は、ネロ帝が、自分で考えて、つけた、と書いている。",sc:2,t:["ツチオ「そうは書かれていないんだ。名は、ティベリウスの時代に処刑されたキリストスから来た、と書かれている。（15.44）」"]},
  {l:"名は、ローマの元老院が、決めた、と書いている。",sc:1,t:["ツチオ「元老院、とは、書かれていないよ。『キリストス』という人の名から来ている、と書かれている。（15.44）」"]}],
 res:"タキトゥスは、この信仰を、「有害な迷信」と呼び、キリスト者は、放火というより、「人類への憎しみ」のために、罪に問われた、と書く。多くの人びとが、見せ物のように、むごい仕方で殺された。それでも、見ていた人びとの間には、これは公の利益のためではなく、一人の残酷さのために行われたのでは、という、憐れみが生まれた、と書かれている。（15.44）",
 memo:[
  {k:"史実",t:"ローマの歴史家タキトゥスは、『年代記』15巻44節で、ローマの大火のあと、皇帝ネロが、噂を打ち消すために、民衆に「キリスト者」と呼ばれていた人びとに罪を負わせ、多くの人が、処刑された、と書く。タキトゥスは、この宗教を「有害な迷信」と呼び、キリスト者は、放火より「人類への憎しみ」のために罪に問われた、と書く。同じ節の最後では、処刑を見た人びとの間に、憐れみが生まれた、と書く。",s:"Tacitus, Annals 15.44（earlychurchtexts.com の掲載文。読んだ範囲は15.44のみ）"},
  {k:"史実",x:"未確認",t:"火事が始まった月日と、被害の範囲、ネロの当時の居場所（15巻38〜43節）は、この弾では、読んでいない。年（紀元64年）も、読んだ資料には、書かれていなかったので、未確認とする。また、ネロが火事に関わったかどうかについて、タキトゥス自身は、噂として書くだけで、断定していない（15.44）。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"タキトゥスの記述の、どこまでが、ローマで起こった事実で、どこまでが、のちの時代の、タキトゥスの見方なのか（キリスト者が、実際に、どう呼ばれていたかなど）は、研究者によって、見方が分かれる。この弾では、研究書を、確認していない。",s:"出典未確認（Cambridge Companion to the Age of Nero の該当章が検索で出たが、本文は未読）"},
  {k:"伝承",x:"未確認",t:"ペトロとパウロが、ローマで、この時期に殉教した、という伝承がある。聖書の本文には、書かれていない。この弾では、伝承の出典を確かめていないため、人物の最期としては、書かない。",s:"出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。炎に包まれる建物は想像で、当時のローマの町の様子は、伝えられていない。処刑や、傷つく人びとは、絵にしていない。",s:"制作メモ"}]},

{key:"temple70",nw:"神殿の崩壊",theme:"エルサレム神殿の崩壊",ref:"ヨセフス『ユダヤ戦記』",per:"使徒たち",era:"紀元後70年",place:"エルサレムの神殿",mk:"temple70",sc:"temple70",lead:"cross",
 arr:["ここも、聖書の本文ではなく、聖書の外の、歴史資料の話だよ。",
  "イワオ「ユダヤ人が、ローマの支配に反乱を起こし、ローマは、ウェスパシアヌスと、その息子ティトゥスに、戦いを任せた。（ユダヤ戦争）」",

 memo:[
  {k:"史実",t:"ユダヤ人の歴史家ヨセフスは、『ユダヤ戦記』で、ローマ軍による神殿の焼失を書く。紹介によれば、ヨセフスは、ティトゥスが、「あれほど壮麗な建物を、決して焼き払うことはしない」と述べ、神殿は、ティトゥスの意に反して焼かれた、と書く。また、ローマ兵が、命令なしに火のついた木を投げ入れた、という記述も、同じ紹介の中にある。",s:"Center for Online Judaic Studies「Destruction of the Second Temple in 70 C.E. – Tisha B'Av」（cojs.org。読んだ範囲）"},
  {k:"史実",x:"未確認",t:"神殿が焼けた月日（ユダヤの暦のアブ月の九日とされることが多い）と、包囲戦の期間、死者の数、エルサレムの町の全体の運命は、読んだ資料に、書かれていなかったので、この弾では、確かめていない。「紀元70年」は、資料の題名による。",s:"出典未確認"},
  {k:"史実",x:"諸説",t:"ヨセフスの記述が、どこまで、ローマ側の立場に影響されているかは、研究者によって、見方が分かれると言われるが、この弾では、研究書を、確認していない。神殿の焼失が、のちのユダヤ教（神殿なしの宗教生活）や、教会の歴史に、与えた影響も、同じく、この弾では、確かめていない。",s:"出典未確認"},
  {k:"聖書の記述",x:"未確認",t:"福音書には、イエスが、神殿の崩壊を告げた、という記述がある（マルコ13章など）。この弾では、その本文を、確認していない。第一部の「神殿の商人たち」の章で扱った、ヨハネ2章の「この神殿を壊してみよ」とも、関わりが読まれることがあるが、本文の読み方は、見方が分かれる。",s:"聖書本文 マルコ13章は未確認。ヨハネ2:19〜21は本旅の別の章で確認済み"},

  {l:"羊飼い。",sc:3,t:["ツチオ「そう。『主は、わたしの羊飼い。わたしには、欠けることがない』という意味の言葉で、始まる。（詩篇23:1）　緑の野で休ませ、静かな水のほとりに導く。（23:2）　暗い谷を行くときも、『わたしは、災いを恐れない。あなたが、共におられるから』と歌う。（23:4）」"]},

 memo:[
  {k:"聖書の記述",t:"詩篇23篇は、神を羊飼いにたとえる歌。羊飼いのもとでは、欠けることがない。緑の野で休み、静かな水のほとりに導かれ、魂は生き返る。暗い谷を行くときも、恐れない。羊飼いの杖が、慰めになる。敵の前で、食卓を整えられ、油を注がれ、杯は溢れる。恵みと慈しみが、命のあるかぎり、ついてきて、主の家に、いつまでも住む（詩篇23篇）。",s:"聖書本文 詩篇23篇（esv.org の要約を読んだ範囲。逐語の引用は避け、意味を要約）"},
  {k:"史実",x:"諸説",t:"詩篇23篇の題には、「ダビデの詩」とあるが、実際にダビデが作ったのかどうかは、研究者によって、見方が分かれる。詩篇は、長い年月のあいだに、集められた書物とされるが、その成立の過程は、この弾では、出典で確かめていない。",s:"聖書本文 詩篇23篇の題。成立の議論は出典未確認"},
  {k:"史実",x:"未確認",t:"ユダヤ教や、各教会の礼拝で、詩篇23篇が、どう用いられてきたかは、この弾では、確かめていない。葬儀などで、よく読まれる、と言われることがあるが、出典は未確認。イエスが、自分を「良い羊飼い」と呼んだとされる、ヨハネ福音書10章との関わりも、この弾では、本文を確認していない。",s:"出典未確認"},

{key:"prodigal",nw:"放蕩息子のたとえ",theme:"二人の息子のたとえ",ref:"ルカ15:11〜32",per:"イエスの生涯",era:"紀元後1世紀前半（年代は諸説）",place:"父の家と、遠い国（場所の特定なし）",mk:"prodigal",sc:"prodigal",lead:"esther",
 arr:["徴税人や罪人が、イエスの話を聞こうと近づいた。ファリサイ派の人々や律法学者は、「この人は、罪人たちを迎えて、食事までしている」と、不平を言った。（ルカ15:1〜2）",
  "イクミ「そこで、イエスは、たとえ話をした。『ある人に、息子が二人いた。』（15:11）」",
  "イクミ「弟は、父に、財産の分け前を、求めた。そして、遠い国へ行って、放蕩のうちに、財産を使い果たした。（15:12〜13）」",

  "イクミ「そのとき、弟は、我に返り、父のもとに帰って、『お父さん、わたしは、天に対して、またあなたに対して、罪を犯しました』と言おう、と決めた。（15:17〜19）」"],
 q:"イクミ「帰ってくる弟を、まだ遠くにいるうちに見つけた父は、どうしたと書かれているかな？」",
 ch:[
  {l:"憐れに思い、走り寄って、抱きしめ、口づけした。",sc:3,t:["イクミ「そう。『まだ遠く離れていたのに、父親は、見つけて、憐れに思い、走り寄って、首を抱き、接吻した』と書かれている。（ルカ15:20）　父は、一番良い服と、指輪と、履物を与え、肥えた子牛を屠って、宴を開いた。『この息子は、死んでいたのに、生き返った。いなくなっていたのに、見つかった』と言った。（15:22〜24）」"]},
  {l:"門を閉ざして、中に入れなかった。",sc:2,t:["イクミ「そうは書かれていないんだ。父は、走り寄って、抱きしめた。（15:20）」"]},
  {l:"使いを送って、弟を、呼びつけた。",sc:1,t:["イクミ「使いは、出てこないよ。父が、自分から、走り寄った。（15:20）」"]}],
 res:"畑から帰ってきた兄は、宴の音を聞いて、怒り、家に入ろうとしなかった。父が出てきて、なだめると、兄は、長年、仕えてきたのに、友人たちと宴をする子山羊一匹も、くれなかった、と訴えた。父は、「子よ、お前は、いつもわたしと一緒にいる。わたしのものは、全部お前のものだ。だが、お前の弟は、死んでいたのに、生き返った。祝うのは、当たり前ではないか」という趣旨のことを言った。（15:25〜32）　聖書は、兄が、そのあと、家に入ったかどうかを、書いていない。",
 memo:[
  {k:"聖書の記述",t:"ある人の二人の息子のうち、弟は、財産の分け前をもらって遠い国へ行き、使い果たし、飢饉の中で、豚の世話をするまでになった。弟は、我に返り、父のもとに帰ろうと決めた。父は、遠くから見つけ、憐れに思い、走り寄って抱きしめた。最も良い服、指輪、履物を与え、肥えた子牛を屠って宴を開いた。畑から帰った兄は、怒り、家に入らず、父が出てきて話した。父は、弟が死んでいたのに生き返り、いなくなっていたのに見つかったので、祝うのは当たり前だ、と答えた。話は、兄の答えを書かないまま、終わる（ルカ15:11〜32）。",s:"聖書本文 ルカ15:1〜3、15:11〜32（esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"この話は、ルカ15章の、三つのたとえ話（ほかは、いなくなった羊と銀貨）のうちの一つとして、語られる、と、一般に紹介されるが、この弾では、15章全体の本文は、確認していない。このたとえが語られた直接のきっかけは、ファリサイ派の人々と律法学者の不平だった、と、ルカ15:1〜3は書く。",s:"聖書本文 ルカ15:1〜3（要約）。15章全体は未確認"},
  {k:"史実",x:"諸説",t:"このたとえ話は、聖書の記述として、語る。「放蕩息子のたとえ」という呼び名は、のちの時代のもので、「二人の息子のたとえ」「待ち続ける父のたとえ」とも呼ばれる、と言われる。兄が、どうなったか、書かれないことをどう読むかは、教派や読み手によって分かれる。この弾は、その答えを、決めない。",s:"制作メモ。呼び名の由来は出典未確認"},
  {k:"想像",t:"場面の絵は想像の絵。父と弟の姿、家の形は想像である。当時の家の様子は、出典で確かめていない。",s:"制作メモ"}]},

 memo:[
  {k:"聖書の記述",t:"コリント一13章は、言葉や預言や、あらゆる知識や、山を動かす信仰があっても、愛がなければ、何の値打ちもない、と書く。愛は、忍耐強く、親切で、ねたまず、自慢せず、高ぶらず、自分の利益を求めず、怒らず、人の悪を数えない。不正を喜ばず、真理を喜び、すべてに耐える。愛は、決して滅びない。預言や、異言や、知識は、廃れるが、信仰と希望と愛は、いつまでも残る。その中で、最も大いなるものは、愛である（Iコリント13章）。",s:"聖書本文 Iコリント13章（esv.org の要約を読んだ範囲）"},

 nw:"エデンの園",theme:"エデンの園と、はじめの人",ref:"創世記2:4〜25",
 arr:["次に降り立ったのは、緑あふれる園。創世記2章の、エデンの園だ。",
  "ツチオ「川が流れてる…。聖書には、この園から川が出て、四つに分かれたと書いてあるんだよ。」",
  "ナゴム「名前が挙がるのは、ピション、ギホン、チグリス、ユーフラテス。（創世記2:10〜14）」",
  "ワラオ「あっ、真ん中に二本の木がある。いのちの木と、善悪を知る木。」",
  "ナゴム「園の中央に、その二つが生えていたと書かれている。（2:9）　人の務めは、園を耕し、守ること。そして、善悪を知る木の実は食べてはいけない、と告げられた。（2:15〜17）」",
  "イワオ「でも、人は、ひとりだった。神は『人が独りでいるのは良くない。ふさわしい助け手を造ろう』と言った。（2:18・要約）」",
  "ナゴム「そこで、野の獣や空の鳥が、人のところに連れて来られた。人は、それぞれに名を付けた。でも、ふさわしい助け手は、見つからなかった。（2:19〜20・要約）」",
  "イクミ「そのあと、神は、人を深く眠らせて、あばら骨の一部から、女を造った。（2:21〜22・要約）」",
  "ナゴム「人は言った。『これこそ、わたしの骨の骨、わたしの肉の肉』。（2:23・要約）」",
  "ナゴム「二人は裸だったが、恥ずかしいとは思わなかった、と書かれている。（2:25）」",
  "ツチオ「ぼくの名前の『土』と、アダムは近い言葉だって、聞いたことがある。」",
  "ナゴム「ヘブライ語で、人（アダム）と土（アダマ）は響きが近い、と説明されることがあるよ。ただ、その出典は確認できていないから、『未確認』にしておこう。」",
  "（この静かな園に、やがて、ひとつの問いが入りこむ。次の章で、聞こう。）"],
 q:"ワラオ「ねえ、人は、ひとりだった。そのとき、神さまは、どうしたの？」",
 ch:[
  {l:"動物たちを、人のところに連れて来た。人は名を付けたが、ふさわしい助け手は見つからず、神は女を造った。",sc:3,t:["ナゴム「その通り。（2:19〜22）　野の獣や空の鳥に、人が名を付けたあと、神は、人を深く眠らせて、あばら骨の一部から女を造った。」"]},
  {l:"すぐに、女を造った。",sc:2,t:["ナゴム「順番が少し違うよ。先に、動物たちが連れて来られて、人が名を付けた。そのあとで、ふさわしい助け手は見つからなかった、と書かれている。（2:19〜20）　そのあと、神は女を造った。（2:21〜22）」"]},
  {l:"人を、園から出した。",sc:1,t:["ナゴム「それは、この次の次の章だよ。ここでは、人は園にいる。（2:15）」"]}],
 res:"人と女は、園で、神と向き合って暮らした。聖書は、二人が裸でも、恥ずかしいとは思わなかったと書く。（2:25）　けれど、物語は、ここで終わらない。次の章で、蛇が、近づいてくる。（3:1）",
 memo:[
  {k:"聖書の記述",t:"神は園を設け、中央に「いのちの木」と「善悪を知る木」を生えさせた（2:8〜9）。人は、園を耕し、守る務めを与えられた。善悪を知る木の実は食べてはならず、食べると必ず死ぬと告げられる（2:15〜17）。",s:"聖書本文 創世記2:8〜9, 2:15〜17（要約。esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"神は「人が独りでいるのは良くない」と見て、助け手を造ろうとした。野の獣と空の鳥が人のところに連れて来られ、人は名を付けたが、ふさわしい助け手は見つからなかった。神は、人を深く眠らせ、あばら骨の一部から女を造って、人のところへ連れて来た（2:18〜22）。",s:"聖書本文 創世記2:18〜22（要約。esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"人は女を迎えて「わたしの骨の骨、わたしの肉の肉」と言い、「女」と呼ぶ。2章24節は、男が父母を離れて妻と結ばれ、二人が一体となる、という原則を語り、25節は、二人が裸でも恥ずかしがらなかった、と書く。",s:"聖書本文 創世記2:23〜25（要約。esv.org の要約を読んだ範囲）"},
  {k:"伝承",x:"諸説",t:"エデンの場所：本文はチグリスとユーフラテスを挙げる（2:14）が、ピションとギホンの特定は定まらない。場所を探す試みは多く、象徴的な語りとして読む立場もある。地図の印は、「所在不明」を示す目安にすぎない。",s:"聖書本文 創世記2:10〜14。場所の比定についての学術的な出典は未確認"},
  {k:"伝承",x:"未確認",t:"ヘブライ語で、人（アダム）と土（アダマ）の響きが近い、という説明は広く語られるが、この弾では、言語学的な出典を確認していない。",s:"（未確認）"},
  {k:"想像",t:"園の木々や川、二人の姿は、想像の絵。2章のあばら骨の場面は、絵にしていない。",s:"制作メモ"}]
});

{key:"fall",nw:"蛇と木の実",theme:"蛇と、禁じられた木の実",ref:"創世記3:1〜13",per:"原初史",era:"年代は特定できない",place:"エデン？（諸説）",mk:"fall",sc:"fall",lead:"esther",
 arr:["園に、一匹の蛇が現れる。創世記3章だ。",
  "ナゴム「蛇は、『野の生き物のうちで、最も賢い』と書かれている。（3:1）　その蛇が、女に話しかけた。」",
  "イクミ「『園のどの木からも、食べてはいけない、と神は言ったのですか』って、聞くの…。（3:1・要約）」",
  "ナゴム「女は、園の木の実は食べてよい、ただ、園の中央の木の実は、食べても、触れてもいけない、死ぬといけないから、と答えた。（3:2〜3・要約）」",
  "ナゴム「蛇は、『決して死ぬことはない。それを食べると、目が開け、神のように善悪を知る者になる』と言った。（3:4〜5・要約）」",
  "ツチオ「女は、その木を見た。食べるのによさそうで、目に美しく、賢くなりそうに見えた。実を取って食べ、一緒にいた夫にも渡して、夫も食べた。（3:6・要約）」",
  "ナゴム「二人の目は開け、自分たちが裸であることを知った。いちじくの葉を綴り合わせて、腰を覆うものを作った。（3:7）」",
  "ナゴム「夕方、神が園を歩く音が聞こえた。二人は、木々の間に身を隠した。（3:8）　神は、人に呼びかけた。『あなたは、どこにいるのか』。（3:9）」",
  "ナゴム「人は『裸だったので、恐れて隠れました』と答えた。そして、『あなたがわたしと共にいるようにされた女が、実をくれたのです』と言った。女は『蛇が、だましたのです』と答えた。（3:10〜13・要約）」",
  "イワオ「人は女に、女は蛇に、責任を向けたんだな…。」"],
 q:"ワラオ「ねえ、食べちゃった『禁じられた実』って、りんごなの？」",
 ch:[
  {l:"本文に、木の実の種類は書かれていないよ。",sc:3,t:["ナゴム「その通り。3章6節は『その木の実』と言うだけで、果物の名前は出てこない。りんごの絵は、のちの時代のイメージだよ。」","ワラオ「へえ。じゃあ、どうしてりんごになったの？」","ナゴム「理由は、いくつか説が語られている。でも出典を確認できていないから、『未確認』にしておこう。」"]},
  {l:"食べたら必ず死ぬ、と警告されていた実だよ。",sc:2,t:["ナゴム「それは書いてあるよ。（2:17）　でもワラオの質問は『何の実か』だよね。そこは、本文は種類を書いていないんだ。」"]},
  {l:"『りんご』と書いてあるよ。",sc:1,t:["ナゴム「聖書の本文には、りんごとは書かれていないよ。（3:6）　りんごの絵は、のちの時代のイメージなんだ。」"]}],
 res:"神は、このあと、蛇に、女に、そして人に、それぞれ語りかける。（3:14〜19）　次の章で、聞こう。カトリックの要理は、創世記3章の落下の記事を「比喩的な言葉を使いながら、太古の出来事を確言する」ものと述べる。",
 memo:[
  {k:"聖書の記述",t:"蛇は「野の生き物の一つ」として登場し、正体は説明されない（3:1）。のちの新約聖書は「あの古い蛇」を悪魔・サタンと呼ぶ（黙示録12:9）。",s:"聖書本文 創世記3:1／黙示録12:9（要約）"},
  {k:"聖書の記述",t:"蛇は、女に、園の木の実を食べてはいけないと神は言ったのか、と尋ねる。女は答え、蛇は「決して死なない」「神のようになる」と言う。女は木の実を見て、取って食べ、一緒にいた夫にも渡した（3:1〜6）。3章6節は、禁じられた木の実を「その実」と呼び、種類を記さない。",s:"聖書本文 創世記3:1〜6（要約。esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"二人は、自分たちが裸であることを知り、いちじくの葉で腰を覆った。夕方、神が園を歩く音を聞き、身を隠した。神の「あなたは、どこにいるのか」という呼びかけに、人は、女に責任を向け、女は、蛇に責任を向けた（3:7〜13）。",s:"聖書本文 創世記3:7〜13（要約。esv.org の要約を読んだ範囲）"},
  {k:"伝承",t:"カトリック教会のカテキズム（要理）390項：創世記3章の落下の記事は、比喩的な言葉を使いながら、太古に起きた出来事を確言する。",s:"Catechism of the Catholic Church §390（バチカン公式サイト）"},
  {k:"伝承",x:"未確認",t:"正教会、プロテスタント諸教会の読み方は、この弾では出典を取得できていない。確認でき次第、並べて載せる。",s:"（未確認）"},
  {k:"想像",t:"「りんご」の絵に見える実は描いていない。蛇の姿や、木の形は、想像の絵。蛇の長さや模様は、聖書に書かれていない。",s:"制作メモ"}]},
{key:"expulsion",nw:"楽園追放",theme:"楽園追放と、皮の衣",ref:"創世記3:14〜24",per:"原初史",era:"年代は特定できない",place:"エデンの東（場所の特定なし）",mk:"expulsion",sc:"expulsion",lead:"miguel",
 arr:["神は、二人の言い分を聞いたあと、語りかけた。創世記3章14節から。",
  "ナゴム「まず、蛇に。『お前は、あらゆる家畜と、野の生き物の中で、呪われる。腹で這い、一生、塵を食べる』。（3:14・要約）　そして、蛇と女、その子孫の間に、敵意を置く、と告げられた。（3:15・要約）」",
  "ナゴム「女には、身ごもる苦しみが増す、と告げられた。夫との関係についても言葉が語られるが、この箇所の読み方は、立場によって幅がある。（3:16）」",
  "ナゴム「人には、『お前のゆえに、土は呪われる。お前は、一生、苦しんで食を得る。額に汗して糧を得、土に帰るまで。お前は塵だから、塵に帰る』。（3:17〜19・要約）」",
  "ツチオ「土…。塵…。」",
  "イクミ「そのあと、人は、妻をエバと名づけた。『すべて生きる者の母』だから、と書かれている。（3:20）」",
  "ナゴム「神は、人と妻のために、皮の衣を作って、着せた。（3:21）」",
  "ナゴム「そして神は、人が、いのちの木の実も取って食べ、永遠に生きるといけない、と言って、人を園から出した。（3:22〜23・要約）」",
  "ナゴム「園の東には、ケルビムと、きらめく剣の炎が置かれた。いのちの木へ至る道を、守るためだ。（3:24）」",
  "（追放の場面だけれど、聖書は、追放の前に、神が衣を作ったことも書いている。）"],
 q:"ツチオ「人が園から出される前に、神は二人に、何をしたって書いてあるの？」",
 ch:[
  {l:"皮の衣を作って、着せた。",sc:3,t:["ツチオ「そう。（3:21）　神は、人と妻のために、皮の衣を作って、着せた、と書かれているよ。」"]},
  {l:"いちじくの葉で、衣を作った。",sc:2,t:["ツチオ「それは、二人が、自分たちで作ったものだよ。（3:7）　神が作って着せたのは、皮の衣。（3:21）」"]},
  {l:"食べ物の入った袋を、渡した。",sc:1,t:["ツチオ「食べ物の袋を渡した、という記述は、本文にはないんだ。神が作ったのは、皮の衣だよ。（3:21）」"]}],
 res:"人は、園の外へ出た。（3:23）　そこで、二人の子、カインとアベルの物語が始まる。（創世記4章）　新約聖書は、この出来事を、のちに、キリストと結びつけて語る。（ローマ5:12、一コリント15:22）",
 memo:[
  {k:"聖書の記述",t:"神は、蛇、女、人のそれぞれに語りかける。蛇には呪いと、敵意の言葉（3:14〜15）。女には、身ごもる苦しみが増すこと（3:16）。人には、土が呪われ、一生、苦しんで糧を得て、塵に帰ること（3:17〜19）。",s:"聖書本文 創世記3:14〜19（要約。esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"人は、妻を「エバ」と名づけた。理由は、彼女が「すべて生きる者の母」だから（3:20）。神は、二人のために皮の衣を作って着せた（3:21）。",s:"聖書本文 創世記3:20〜21（要約）"},
  {k:"聖書の記述",t:"人は園から出され、園の東にケルビムと「きらめく剣の炎」が置かれた（3:22〜24）。",s:"聖書本文 創世記3:22〜24（要約。esv.org の要約を読んだ範囲）"},
  {k:"聖書の記述",x:"未確認",t:"新約聖書は、ローマ人への手紙5章12節で、一人の人によって罪が世に入ったと語り、コリントの信徒への手紙一15章22節で、アダムにあってすべての人が死ぬように、キリストにあってすべての人が生かされる、と語る、とされる。この弾では、本文を照合していない。",s:"（未確認：本文は未照合）"},
  {k:"伝承",x:"未確認",t:"3章15節を、のちのキリストの勝利の予告として読む伝統がある（「原福音」と呼ばれることがある）が、すべての立場がそう読むわけではない。出典は、この弾では取得できていない。",s:"（未確認）"},
  {k:"伝承",x:"諸説",t:"3章16節の「夫との関係」の言葉は、立場によって、さまざまに読まれる。この章では、一つの読み方を答えとして示さない。",s:"（未確認：解釈の出典は未取得）"},
  {k:"想像",t:"場面の絵は想像の絵。ケルビムの姿は、聖書の他の箇所の記述に倣わず、光る翼として、小さく描いた。きらめく剣の炎は、本文の言葉を絵にしたもの。",s:"制作メモ"}]},
{key:"sodom",nw:"ソドムとゴモラ",theme:"ソドムとゴモラ — アブラハムの願い",ref:"創世記18:16〜19:29",per:"族長",era:"年代は諸説（出典未確認）",place:"ソドムの平地？（所在は諸説）",mk:"sodom",sc:"sodom",lead:"pierre",
 arr:["アブラハムの旅は、続く。創世記18章。旅人の姿をした三人が、アブラハムの天幕を訪ね、サラには一年後に子が生まれる、と告げた。（18:1〜15・要約）",
  "ナゴム「客が立ち上がり、ソドムの方を見下ろした。アブラハムは、見送りに、一緒に歩いた。（18:16）」",
  "ナゴム「神は、ソドムとゴモラについての叫びが大きく、罪が非常に重い、と言った。そして、下って行って、確かめよう、と。（18:20〜21・要約）」",
  "ナゴム「アブラハムは、神の前に立って、尋ねた。『正しい者を、悪い者と共に滅ぼされるのですか。町に、五十人の正しい者がいても』。（18:23〜24・要約）」",
  "ワラオ「アブラハム、神さまに、問いかけてる…！」",
  "ナゴム「神は、五十人いれば、町全体を赦す、と答えた。アブラハムは、四十五、四十、三十、二十と、人数を下げて頼み、とうとう『十人』まで進んだ。神は、十人のためにも、滅ぼさない、と答えた。（18:26〜32・要約）」",
  "ナゴム「そのあと、二人の御使いが、夕方、ソドムに着いた。アブラハムの甥のロトは、町の門のところにいて、二人を、自分の家に招いた。（19:1〜3・要約）」",
  "ナゴム「寝る前に、町の男たちが、家を取り囲んだ。客を出せ、と要求した。ロトは、客を守ろうとした。御使いたちは、取り囲んだ男たちの目を見えなくした。（19:4〜11・要約）　この箇所には、扱いの難しい記述が含まれる。この章では、場面の詳細は、描かないことにする。」",
  "ナゴム「御使いたちは、ロトに、家族を連れて逃げなさい、と告げた。ロトが、ためらっていると、御使いたちは、ロトと妻と二人の娘の手をつかんで、町の外へ連れ出した。（19:12〜16・要約）」",
  "ナゴム「『命がけで逃げなさい。後ろを振り返ってはいけない』と言われた。（19:17・要約）　ロトは、近くの小さな町、ツォアルへ逃げたい、と願い、聞き入れられた。（19:18〜22）」",
  "ナゴム「朝日が、地にのぼったころ、主は、ソドムとゴモラの上に、硫黄と火を降らせた。（19:23〜25・要約）　ロトの妻は、後ろを振り返って、塩の柱になった。（19:26）」",
  "ナゴム「翌朝、アブラハムは、神の前に立った場所へ行き、見下ろした。かまどの煙のような煙が、地から立ち上っていた。（19:27〜28・要約）」"],
 q:"ナゴム「アブラハムが、神に、『この人数が、町にいたら、滅ぼさないでください』と、最後に頼んだ人数は？」",
 ch:[
  {l:"十人。",sc:3,t:["ナゴム「そう。（18:32）　五十人から始めて、四十五、四十、三十、二十、そして十人まで下げた。神は、十人のためにも、滅ぼさない、と答えた。（18:26〜32）」"]},
  {l:"五十人。",sc:2,t:["ナゴム「五十人は、最初の人数だよ。（18:24）　アブラハムは、そこから、少しずつ、人数を下げて頼んだ。最後は、十人だった。（18:32）」"]},
  {l:"百人。",sc:1,t:["ナゴム「百人、という数字は、この場面には出てこないんだ。最初は五十人、最後は十人だよ。（18:24、18:32）」"]}],
 res:"町は、滅びた。（19:24〜25）　聖書の別の箇所は、ソドムの罪を、いくつかの言葉で語る。（エゼキエル書16:49〜50、ユダの手紙7節）　その読み方は、立場によって、幅がある。",
 memo:[
  {k:"聖書の記述",t:"神は、ソドムとゴモラの罪が非常に重いと見て、確かめに行こうとする。アブラハムは、町に正しい者が五十人いたら、と尋ね、四十五、四十、三十、二十、十と人数を下げて頼む。神は、そのたびに、その人数のために町を赦す、と答える（18:16〜33）。",s:"聖書本文 創世記18:16〜33（要約。biblia.com の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"二人の御使いが、ソドムに着き、ロトが家に迎える。町の男たちが家を取り囲む。御使いたちは、ロトに、家族を連れて逃げるよう告げ、ロトのためらいの中で、手をつかんで町の外へ導く。ロトは、小さな町ツォアルへの避難を願い、聞き入れられる（19:1〜22）。",s:"聖書本文 創世記19:1〜22（要約。biblia.com の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"主は、ソドムとゴモラに、硫黄と火を降らせた。ロトの妻は、振り返って、塩の柱になった。翌朝、アブラハムが見下ろすと、かまどの煙のような煙が立ち上っていた。聖書は、神がアブラハムを心に留めて、ロトを滅びの中から送り出した、と書く（19:23〜29）。",s:"聖書本文 創世記19:23〜29（要約。biblia.com の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"19章には、このあと、ロトと二人の娘の記述が続く（19:30〜38）。この章では、扱わない。また、19章4〜8節には、暴力に関わる、扱いの難しい記述が含まれる。この旅では、その場面を絵にせず、詳しく語らない。",s:"聖書本文 創世記19:4〜8, 19:30〜38（本文は、この章では要約のみ）"},
  {k:"聖書の記述",t:"エゼキエル書は、ソドムの罪を、高慢、食べ物のぜいたく、安楽な暮らし、貧しい者を助けなかったこと、忌まわしいことをしたこと、と語る（16:49〜50）。",s:"聖書本文 エゼキエル書16:49〜50（要約。biblia.com の要約を読んだ範囲）"},
  {k:"聖書の記述",t:"ユダの手紙7節は、ソドムとゴモラと周りの町々が、みだらな行いにふけり、「不自然な欲」を追った（訳によって言い回しは違う）、永遠の火の罰を受けて、見せしめとされた、という趣旨のことを書く。",s:"聖書本文 ユダの手紙7節（要約。biblestudytools.com の要約を読んだ範囲）"},
  {k:"伝承",x:"諸説",t:"ソドムの罪が、何を指すかについては、立場や時代によって読みが分かれる。聖書の中でさえ、高慢と、貧しい者への無関心（エゼキエル）、みだらな行い（ユダ）と、書き方が違う。ユダヤ教や、各教会の伝統の読み方は、この弾では確認していない。現代にも続く議論があり、この旅では、一つの読み方を答えとして示さない。",s:"（未確認：解釈の出典は未取得）"},
  {k:"史実",x:"未確認",t:"ソドムとゴモラが、実在の町だったか、どこにあったかは、この弾では、考古学的な出典を取得していない。地図の印は、所在不明を示す目安にすぎない。",s:"（未確認）"},
  {k:"想像",t:"場面の絵は想像の絵。朝のうちに、遠くの谷から立ちのぼる煙と、見下ろすアブラハムだけを描いた。町や、人びとの姿、火と硫黄が降る場面は、描いていない。",s:"制作メモ"}]}
);
(function(){
 const ORDERK=["sozo","eden","fall","expulsion","cain","noah","babel","abram","sodom","isaac","jacob","joseph","bush","exodus","sinai","jericho","samson","david","psalm23","temple","elijah","jonah","daniel","return","hellenism","rome","birth","boy12","magi","jordan","temptation","cana","peter","mount","samaritan","prodigal","wellsam","loaves","walk","transfig","woman","lazarus","entry","cleansing","judas","supper","gethsemane","arrest","pilate","antipas","roadcross","passion","easter","emmaus","thomas","ascension","pentecost","stephen","damascus","cornelius","mission","council","mission2","love13","fire64","temple70","patmos"];
 const by={};CH.forEach(c=>by[c.key]=c);
 const out=ORDERK.map(k=>{if(!by[k])throw new Error("missing "+k);return by[k]});
 CH.splice(0,CH.length,...out);
})();
/* 人物辞典（年代の数字は載せない。出典のある内容だけ） */
const PPL=[
{n:"アダム",sp:"adam",ch:["eden","fall","expulsion"],k:"聖書の記述",t:"創世記で、神が土から形づくり、命の息を吹き入れた最初の人。エデンの園を耕し、守る務めを与えられた。",s:"創世記2〜3章"},
{n:"エバ",sp:"eve",ch:["eden","fall","expulsion"],k:"聖書の記述",t:"アダムの助け手として造られた女性。アダムは、彼女を「命あるものの母」と呼んだ。",s:"創世記2〜3章"},
{n:"カイン",sp:"cain",ch:["cain"],k:"聖書の記述",t:"アダムとエバの子。畑を耕す人だった。弟アベルを殺し、東の地へ追われた。",s:"創世記4章"},
{n:"アベル",sp:"abel",ch:["cain"],k:"聖書の記述",t:"アダムとエバの子。羊を飼う人だった。兄カインに殺された。",s:"創世記4章"},
{n:"ノア",sp:"noah",ch:["noah"],k:"聖書の記述",t:"洪水のとき、神の言葉に従って箱舟を造り、家族と動物たちと共に守られた人。洪水のあと、虹が契約のしるしとされた。",s:"創世記6〜9章"},
{n:"アブラハム",sp:"abraham",ch:["abram","sodom","isaac"],k:"聖書の記述",t:"元の名はアブラム。神に呼ばれ、故郷を出て旅立った。ユダヤ教、キリスト教、イスラームで、信仰の父として語られる。",s:"創世記12〜25章"},
{n:"サラ",sp:"sarah",ch:["abram","isaac"],k:"聖書の記述",t:"アブラハムの妻。元の名はサライ。高齢になってから、イサクを産んだと書かれる。",s:"創世記17章、21章"},
{n:"イサク",sp:"isaac",ch:["isaac"],k:"聖書の記述",t:"アブラハムとサラの子。創世記22章で、神がアブラハムを試みた場面に登場する。",s:"創世記21〜22章"},
{n:"ヤコブ",sp:"jacob",ch:["jacob","joseph"],k:"聖書の記述",t:"イサクの子。旅の途中、天にとどく階段の夢を見た。のちに「イスラエル」の名を受け、十二人の息子を持った。",s:"創世記28章、32章、35章"},
{n:"ヨセフ（ヤコブの子）",sp:"joseph",ch:["joseph"],k:"聖書の記述",t:"ヤコブの子。兄たちにエジプトへ売られたが、のちにエジプトで高い地位につき、家族を迎えた。",s:"創世記37〜50章"},
{n:"モーセ",sp:"moses",ch:["bush","exodus","sinai"],k:"聖書の記述",t:"ヘブライ人の子として生まれ、燃える柴で神に呼ばれた。民をエジプトから導き出し、シナイ山で十戒を受けたと書かれる。",s:"出エジプト記2〜34章"},
{n:"ミリアム",sp:null,ch:["exodus"],k:"聖書の記述",t:"モーセの姉。海を渡ったあと、手に小太鼓を持って、女たちと歌い、踊った。",s:"出エジプト記15章20〜21節"},
{n:"ファラオ",sp:"pharaoh",ch:["joseph","bush"],k:"聖書の記述",t:"エジプトの王の称号。創世記のヨセフの話にも、出エジプト記にも出てくる。聖書には、個人名が書かれていないことが多く、どの王にあたるかは、見方が分かれ、未確認。",s:"創世記41章、出エジプト記1〜14章",x:"諸説"},
{n:"ヨシュア",sp:null,ch:["jericho"],k:"聖書の記述",t:"モーセの後を継いだ指導者。ヨシュア記で、民を率いてヨルダン川を渡り、エリコの町に向かった。",s:"ヨシュア記1〜6章"},
{n:"ラハブ",sp:null,ch:["jericho"],k:"聖書の記述",t:"エリコの町に住む女性。ヨシュアが送った二人の斥候を、かくまった。",s:"ヨシュア記2章、6章"},
{n:"サムソン",sp:"samson",ch:["samson"],k:"聖書の記述",t:"士師記に出る士師。生まれる前から神に献げられた人（ナジル人）で、強い力をもつ人として語られる。",s:"士師記13〜16章"},
{n:"デリラ",sp:null,ch:["samson"],k:"聖書の記述",t:"サムソンが愛した女性。ペリシテ人の領主たちに頼まれ、サムソンの力の秘密を探った。",s:"士師記16章"},
{n:"サムエル",sp:null,ch:["david"],k:"聖書の記述",t:"預言者。神に命じられ、ベツレヘムでエッサイの子ダビデに油を注いだ。",s:"サムエル記上16章"},
{n:"サウル",sp:null,ch:["david"],k:"聖書の記述",t:"イスラエルの最初の王。ゴリアトとの戦いの場面に、王として登場する。",s:"サムエル記上17章"},
{n:"ダビデ",sp:"david",ch:["david","psalm23"],k:"聖書の記述",t:"ベツレヘムの羊飼いで、のちにイスラエルの王となる。ゴリアトに立ち向かった。詩篇には「ダビデの詩」という表題のものが多いが、表題の意味は諸説ある。",s:"サムエル記上16〜17章、詩篇の表題",x:"諸説"},
{n:"ゴリアト",sp:"goliath",ch:["david"],k:"聖書の記述",t:"ガトの出身のペリシテ人の戦士。イスラエルの陣に向かって、一騎打ちを挑んだ。",s:"サムエル記上17章"},
{n:"ソロモン",sp:"solomon",ch:["temple"],k:"聖書の記述",t:"ダビデの子で、王位を継いだ。知恵を願い、エルサレムに神殿を建てた王として語られる。",s:"列王記上3章、6〜8章"},
{n:"エリヤ",sp:"elijah",ch:["elijah"],k:"聖書の記述",t:"アハブ王の時代の預言者。カルメル山で、バアルの預言者たちと対決した。",s:"列王記上17〜18章"},
{n:"アハブ",sp:null,ch:["elijah"],k:"聖書の記述",t:"北のイスラエルの王。エリヤの時代に、バアルの礼拝が広まった。",s:"列王記上16〜18章"},
{n:"ヨナ",sp:"jonah",ch:["jonah"],k:"聖書の記述",t:"神に、ニネベへ行けと命じられたが、逆の方向へ逃げた預言者。海で大魚に飲まれ、三日三晩、その腹の中にいた。",s:"ヨナ書1〜2章"},
{n:"ネブカドネツァル",sp:null,ch:["return"],k:"史実",t:"バビロンの王。列王記は、彼の軍がエルサレムを攻めたと書く。ダニエル書では、彼に仕えるダニエルが登場する。",s:"列王記下24〜25章",x:"未確認"},
{n:"ダニエル",sp:"daniel",ch:["daniel"],k:"聖書の記述",t:"バビロンに連れて行かれ、王に仕えた人。ダニエル書には、獅子の穴の話や、幻の記述がある。",s:"ダニエル書1章、6章"},
{n:"キュロス",sp:null,ch:["daniel","return"],k:"史実",t:"ペルシアの王。バビロンを倒した。『キュロスの円筒』は、各地から連れてこられた人々や神々の像を元の地に戻したと伝えるが、ユダヤ人の名は出ない。エズラ記は、彼の命令から書き始められる。",s:"エズラ記1章／Metropolitan Museum of Art「Cyrus Cylinder」",x:"諸説"},
{n:"エズラ",sp:null,ch:["return"],k:"聖書の記述",t:"エズラ記に出る祭司で、律法の書記官。神殿の再建と、帰還した民の暮らしに関わる記述に、名が出る。",s:"エズラ記7〜10章",x:"未確認"},
{n:"ネヘミヤ",sp:null,ch:["return"],k:"聖書の記述",t:"ネヘミヤ記に出る人物。エルサレムの城壁の再建に関わった。エズラ記との年代関係は、未確認。",s:"ネヘミヤ記1〜6章",x:"未確認"},
{n:"アンティオコス4世",sp:null,ch:["hellenism"],k:"史実",t:"セレウコス朝の王。読んだ資料は、神殿から財宝を奪い、割礼や安息日を禁じ、神殿の庭に異教の祭壇を置いたと書く。根拠は、主にマカバイ記一・二である。",s:"Hitchhiker's Guide to Religion「The Maccabean Revolt」",x:"諸説"},
{n:"ユダ・マカバイ",sp:null,ch:["hellenism"],k:"史実",t:"「マカバイ（槌）」というあだ名の指導者。ゲリラ戦を率い、エルサレムを取り戻し、祭壇を清め、神殿を再び献げた、と書かれる。",s:"同上",x:"諸説"},
{n:"アウグストゥス",sp:null,ch:["rome"],k:"史実",t:"ローマの皇帝。ルカ福音書は、彼の勅令による住民登録のとき、イエスが生まれたと書く。ヘロデの神殿は、皇帝をたたえる神殿に似た様式だった、と資料は書く。",s:"ルカ福音書2章1節",x:"諸説"},
{n:"ヘロデ大王",sp:"herod",ch:["rome","birth","magi"],k:"史実",t:"ローマが認めたユダヤの王。エルサレム神殿の大規模な再建を始めたとされる。マタイ福音書は、東方の博士たちに、ベツレヘムの名を告げた王として書く。",s:"Center for Online Judaic Studies／マタイ2章",x:"諸説"},
{n:"マリア（イエスの母）",sp:"mother",ch:["birth","magi","cana","passion"],k:"聖書の記述",t:"ナザレの人。ルカ福音書は、天使ガブリエルが、彼女にイエスの誕生を告げたと書く。ヨハネ福音書は、十字架のそばに立っていたと書く。",s:"ルカ1〜2章、ヨハネ19章",x:"未確認"},
{n:"ヨセフ（ナザレの人）",sp:"josefn",ch:["birth"],k:"聖書の記述",t:"マリアの夫。マタイ福音書は、夢のお告げを受けて、マリアを妻に迎えたと書く。",s:"マタイ1〜2章"},
{n:"東方の博士たち",sp:"magi1",ch:["magi"],k:"聖書の記述",t:"星を見て、ユダヤ人の王を拝みに来た人々。贈り物は黄金、乳香、没薬の三つ。人数と名前は、聖書に書かれていない。",s:"マタイ福音書2章1〜12節"},
{n:"イエス",sp:"jesus",ch:["birth","jordan","temptation","cana","peter","mount","passion","easter"],k:"聖書の記述",t:"福音書が伝える、キリスト教の中心の人物。キリスト教では、神の子、救い主と告白される。歴史家タキトゥスは、ティベリウス帝の治世に、ピラトゥスによって極刑を受けたキリストに触れる。絵は、想像の絵。",s:"福音書／Tacitus, Annals 15.44"},
{n:"洗礼者ヨハネ",sp:"john_b",ch:["jordan"],k:"聖書の記述",t:"ヨルダン川で、人々に悔い改めの洗礼を授けた人。イエスも、彼から洗礼を受けた。ヨセフスも、彼の名を記す。",s:"マルコ福音書1章／ヨセフス『ユダヤ古代誌』18巻"},
{n:"ペトロ（シモン）",sp:"simon",ch:["peter","walk","transfig","arrest","pentecost","cornelius","council"],k:"聖書の記述",t:"ガリラヤの漁師で、元の名はシモン。イエスに従う十二人の一人。使徒言行録では、コルネリウスの家を訪ねた。",s:"ルカ5章、使徒言行録10章"},
{n:"サマリアの女",sp:null,ch:["wellsam"],k:"聖書の記述",t:"ヨハネ福音書4章で、井戸のそばでイエスと対話した女性。聖書には、名前が書かれていない。",s:"ヨハネ福音書4章"},
{n:"姦淫の女",sp:"woman",ch:["woman"],k:"聖書の記述",t:"律法学者たちが、イエスの前に連れてきた女性。ただし、この箇所は、古い有力な写本には見られない、という指摘がある。",s:"ヨハネ福音書7章53節〜8章11節",x:"諸説"},
{n:"マルタ",sp:"martha",ch:["lazarus"],k:"聖書の記述",t:"ベタニアの女性。兄弟のラザロが亡くなったとき、イエスと言葉を交わした。",s:"ヨハネ福音書11章"},
{n:"マリア（ベタニア）",sp:"maryb",ch:["lazarus"],k:"聖書の記述",t:"ベタニアの女性で、マルタとラザロの姉妹。ラザロが亡くなったとき、イエスの足もとで泣いた。",s:"ヨハネ福音書11章"},
{n:"ラザロ",sp:null,ch:["lazarus"],k:"聖書の記述",t:"ベタニアの人。ヨハネ福音書は、イエスが、墓の中にいた彼を、呼び出したと書く。",s:"ヨハネ福音書11章"},
{n:"ユダ（イスカリオテ）",sp:null,ch:["judas"],k:"聖書の記述",t:"十二人の弟子の一人。福音書は、彼が、イエスを祭司長たちに引き渡す約束をしたと書く。",s:"マタイ福音書26章14〜16節"},
{n:"ポンティウス・ピラト",sp:"soldier",ch:["pilate","passion"],k:"史実",t:"ユダヤを治めたローマの長官。タキトゥスは、キリストが、彼によって極刑を受けたと書く。カイサリアの碑文にも名があり、肩書は「ユダヤの長官」。",s:"Tacitus, Annals 15.44／BAS Library"},
{n:"ヘロデ・アンティパス",sp:null,ch:["antipas","jordan"],k:"史実",t:"ヘロデ大王の子で、ガリラヤとペレアの領主。ティベリアスの町を建てた。ルカ福音書は、ピラトに送られたイエスを、彼が尋問したと書く。",s:"Jewish Encyclopedia「Antipas」／ルカ23章6〜12節"},
{n:"ティベリウス",sp:null,ch:["pilate","antipas","passion"],k:"史実",t:"ローマの皇帝。タキトゥスは、キリストが、彼の治世に処刑されたと書く。アンティパスは、彼にちなんで、ティベリアスの町を名づけた。",s:"Tacitus, Annals 15.44／Jewish Encyclopedia"},
{n:"バラバ",sp:null,ch:["pilate"],k:"聖書の記述",t:"祭りのとき、ピラトが群衆の求めに応じて赦免した囚人。",s:"マルコ福音書15章6〜15節"},
{n:"アリマタヤのヨセフ",sp:null,ch:["passion"],k:"聖書の記述",t:"ピラトに願い出て、イエスの遺体を引き取り、自分の新しい墓に納めた人。",s:"マタイ福音書27章57〜60節"},
{n:"マグダラのマリア",sp:"mary",ch:["passion"],k:"聖書の記述",t:"イエスに従った女性の一人。ヨハネ福音書は、復活の朝、彼女が墓を訪れたと書く。",s:"ヨハネ福音書20章"},
{n:"クレオパ",sp:null,ch:["emmaus"],k:"聖書の記述",t:"エマオへ向かう二人の弟子のうち、名前が書かれている一人。",s:"ルカ福音書24章18節"},
{n:"トマス",sp:null,ch:["thomas"],k:"聖書の記述",t:"十二人の弟子の一人。復活したイエスを自分で確かめたいと言い、その後、イエスに会った。",s:"ヨハネ福音書20章24〜29節"},
{n:"ステファノ",sp:null,ch:["stephen"],k:"聖書の記述",t:"エルサレムの教会で選ばれた人の一人。石で打たれて亡くなった。その場には、サウロもいた。",s:"使徒言行録6〜7章"},
{n:"パウロ（サウロ）",sp:"paul",ch:["stephen","damascus","mission","council","mission2","love13"],k:"聖書の記述",t:"元の名はサウロ。ダマスコへ向かう途中で、イエスに呼ばれた。ローマ市民で、各地を旅して教会を訪ね、手紙を書いた。",s:"使徒言行録9章、22章"},
{n:"アナニア",sp:"ananias",ch:["damascus"],k:"聖書の記述",t:"ダマスコの弟子。サウロを訪ね、手を置いて祈った。",s:"使徒言行録9章10〜19節"},

function bgmGraph(c,tr){
  const master=c.createGain();master.gain.value=0;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
  const dry=c.createGain();dry.gain.value=.9;
  const dl=c.createDelay(1);dl.delayTime.value=.27;const fb=c.createGain();fb.gain.value=.38;const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;
  const send=c.createGain();send.gain.value=tr.rev;
  const bus=c.createGain();bus.connect(dry);bus.connect(send);send.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);dry.connect(master);
  master.connect(comp);comp.connect(c.destination);return{master:master,bus:bus}}
function bgmStop(fade){
  if(BG.tm){clearInterval(BG.tm);BG.tm=null}
  const o=BG.out;if(o&&AC){try{const t=AC.currentTime;o.master.gain.cancelScheduledValues(t);o.master.gain.setValueAtTime(o.master.gain.value,t);o.master.gain.linearRampToValueAtTime(0,t+(fade||.8));setTimeout(()=>{try{o.master.disconnect()}catch(e){}},((fade||.8)+3)*1000)}catch(e){}}
  BG.out=null;BG.cur=-1}
function bgmStart(i){
  const c=ac();if(!c)return;const tr=TRACKS[i];if(!tr)return;
  bgmStop(.8);const spb=60/tr.bpm;const g=bgmGraph(c,tr);BG.out=g;BG.cur=i;BG.tr=tr;BG.idx=0;BG.t0=c.currentTime+.4;
  g.master.gain.setValueAtTime(0,c.currentTime);g.master.gain.linearRampToValueAtTime(.75*tr.g,c.currentTime+1.8);
  const L=tr.L*spb;
  function pump(){if(BG.out!==g)return;const now=c.currentTime;let guard=0;
    while(guard++<400){const e=tr.ev[BG.idx];let b=e.b;if(tr.sw&&((b%1)>=.49&&(b%1)<=.51))b+=tr.sw;const t=BG.t0+b*spb;if(t>now+.5)break;if(t>=now-.05)playEv(c,g.bus,e,Math.max(t,now),spb);BG.idx++;if(BG.idx>=tr.ev.length){BG.idx=0;BG.t0+=L}}}
  pump();BG.tm=setInterval(pump,120)}
function bgmWant(){if(!S.bgm)return -1;const c=CH[S.ch]||CH[0];const k=BANDS.findIndex(b=>b.n===c.per);return k<0?0:Math.min(k,TRACKS.length-1)}
function bgmSync(){try{const w=bgmWant();if(w===BG.cur)return;if(w<0){bgmStop(.6);return}bgmStart(w)}catch(e){}}
/* オフラインで描く（テスト用） */
async function bgmRenderTest(i,sec){const tr=TRACKS[i],spb=60/tr.bpm;const c=new OfflineAudioContext(2,44100*sec,44100);const g=bgmGraph(c,tr);g.master.gain.value=.75*tr.g;
  let k=0,t0=0;while(true){const e=tr.ev[k];let b=e.b;if(tr.sw&&((b%1)>=.49&&(b%1)<=.51))b+=tr.sw;const t=t0+b*spb;if(t>sec)break;playEv(c,g.bus,e,t,spb);k++;if(k>=tr.ev.length){k=0;t0+=tr.L*spb}}
  const buf=await c.startRendering();const d=buf.getChannelData(0);let pk=0,sq=0;for(let j=0;j<d.length;j++){const a=Math.abs(d[j]);if(a>pk)pk=a;sq+=d[j]*d[j]}return{peak:pk,rms:Math.sqrt(sq/d.length),data:Array.from(d.filter((_,j)=>j%4===0))}}

/* ===== iPhone対策：最初のタップ（指を離したとき）で、音を有効にする。消音スイッチ時も鳴るよう、再生用の音声セッションにする ===== */
const AU={el:null,ok:false};
function silentWav(){const n=800,b=new Uint8Array(44+n*2),v=new DataView(b.buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return "data:audio/wav;base64,"+btoa(s)}
function audioUnlock(){
  try{
    if(!(S.bgm||S.snd))return;
    try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
    const c=ac();if(!c)return;
    if(c.state!=="running"){try{c.resume()}catch(e){}}
    if(!AU.ok){
      const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);
      if(!AU.el){const a=document.createElement("audio");a.src=silentWav();a.loop=true;a.setAttribute("playsinline","");a.preload="auto";AU.el=a}
      const p=AU.el.play();if(p&&p.then)p.then(()=>{AU.ok=true}).catch(()=>{});
    }
    bgmSync();
  }catch(e){}}
